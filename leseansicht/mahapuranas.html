<script id="data-book" type="application/json">{"title": "Mahāpurāṇas", "subtitle": "Zweisprachige Leseausgabe: Sanskrit (IAST) und deutsche Übersetzung, Vers für Vers mit Wort-für-Wort-Analyse, im Aufbau befindlich (Werk für Werk, Adhyāya für Adhyāya).", "frontmatter": {"vorwort": ["Diese Ausgabe beginnt die Übersetzung der 18 Mahāpurāṇas – jener Sammlung „großer alter Erzählungen“ (purāṇa = „das Alte“), die zusammengenommen traditionell mit rund 400.000 Ślokas beziffert wird. Das ist noch einmal etwa viermal so umfangreich wie das bereits laufende, selbst noch junge Mahābhārata-Projekt dieser Bibliothek (ca. 100.000 Ślokas), und um ein Vielfaches umfangreicher als alle bisher abgeschlossenen Werke der Bibliothek zusammen. Ein Vorhaben dieser Größenordnung lässt sich nicht in einigen Sitzungen bewältigen; es ist, wie Mahābhārata und Āraṇyakas, als über sehr viele Sitzungen und einen eigenen täglichen automatisierten Übersetzungslauf hinweg fortzuführendes Projekt angelegt: Werk für Werk, Adhyāya für Adhyāya, mit fortlaufender Veröffentlichung, damit der Fortschritt mitverfolgt werden kann. Vollständigkeit ist das erklärte Ziel, aber ein Ziel sehr vieler weiterer Sitzungen, nicht dieser einen.", "Die Reihenfolge der 18 Werke in dieser Ausgabe folgt der klassischen, in der Sekundärliteratur meist zitierten Aufzählung (nach der Selbstauflistung im Viṣṇu-Purāṇa, 3. Aṃśa, Kap. 6). Handschriften und Traditionen weichen davon jedoch ab – am auffälligsten darin, ob als viertes Werk das Vāyu- oder das Śiva-Purāṇa gezählt wird; manche Listen enthalten sogar beide und lassen dafür ein anderes Werk aus. Diese Ausgabe folgt der in der indologischen Forschung gebräuchlicheren Vāyu-Variante, vermerkt die Abweichung aber ausdrücklich, statt sie zu verschweigen. Auch die überlieferten Verszahlen der einzelnen Werke schwanken zwischen den Editionen erheblich; die in der Übersicht unten genannten Zahlen sind daher als grobe, traditionell überlieferte Größenordnungen zu verstehen, nicht als feststehende Fakten.", "Veröffentlicht ist bislang der Beginn: die ersten 20 Verse des ersten Adhyāya des Brahma-Purāṇa, des in den meisten Listen an erster Stelle genannten Mahāpurāṇa – der einleitende Lobpreis auf den „höchsten Puruṣa“ (Puruṣottama/Hari) und die anschließende Schilderung des Naimiṣa-Waldes, in dem die Weisen zu einer zwölfjährigen Opfersitzung versammelt sind (dieselbe Rahmen-Szenerie, mit der auch das Mahābhārata eröffnet, s. dort). Textgrundlage ist die bei GRETIL (Göttingen Register of Electronic Texts in Indian Languages) digitalisierte Sanskrit-Ausgabe des Brahma-Purāṇa; ein Abgleich mit weiteren Editionen (etwa der Ānandāśrama- oder der Veṅkaṭeśvara-Press-Ausgabe) steht noch aus und ist für einen späteren Durchgang vorgesehen.", "Wie bei den übrigen Werken dieser Bibliothek folgt die Übersetzung Vers für Vers, mit ausklappbarer Wort-für-Wort-Analyse, und wird ohne vorhandene Übersetzungen oder Kommentare als Ausgangspunkt erstellt – stattdessen wird jedes Wort morphologisch und syntaktisch selbst analysiert. Unsichere oder ergänzte Stellen sind mit [?] bzw. [Anm.: …] gekennzeichnet, statt eine unsichere Lesart stillschweigend zu glätten.", "Agni-Purāṇa (achtes Werk der Liste): Auf ausdrücklichen Wunsch wird das Agni-Purāṇa außerhalb der festen Reihenfolge übersetzt, da für Padma-, Viṣṇu- und Vāyu-Purāṇa derzeit keine praktikable gemeinfreie Quelle vorliegt und das Digitalisat des Agni-Purāṇa vollständig verfügbar ist. Stand: 389 Kapitel mit 11325 Versen, übersetzt bis Adhyāya A6."], "einfuehrung": ["Purāṇas sind eine alte Sanskrit-Erzähl- und Lehrgattung, die dem eigenen Anspruch nach so alt ist wie der Veda selbst und – anders als dieser – traditionell auch Nicht-Zweifachgeborenen (also auch Frauen und Śūdras) zugänglich sein sollte. Ihnen wird traditionell ein Bündel von fünf Themenbereichen zugeschrieben, die „fünf Merkmale“ (pañcalakṣaṇa): sarga (die Erstschöpfung des Kosmos), pratisarga (dessen periodische Wiederauflösung und Neuschöpfung), vaṃśa (die Genealogien der Götter und Seher), manvantara (die großen Weltzeitalter, benannt nach ihrem jeweiligen Stammvater Manu) und vaṃśānucarita (die Geschichte der Königsdynastien, vor allem der Sonnen- und der Monddynastie). In der Praxis der erhaltenen Werke treten daneben umfangreiche weitere Stoffe: Pilgerstätten-Preisungen (māhātmya), Ritual- und Tempelvorschriften, Rechts- und Verhaltenslehren, Kosmographie, teils sogar Abschnitte zu Medizin, Grammatik oder Dichtkunst.", "Eine alte, selbst schon innerhalb der Purāṇas (etwa im Padma-Purāṇa) überlieferte Einteilung ordnet die 18 Mahāpurāṇas nach der jeweils im Vordergrund stehenden Gottheit und dem vorherrschenden der drei Guṇas: „sattvische“, Viṣṇu-zentrierte Werke (Viṣṇu-, Bhāgavata-, Nāradīya-, Garuḍa-, Padma-, Varāha-Purāṇa), „rajasische“, Brahmā-zentrierte Werke (Brahma-, Brahmāṇḍa-, Brahmavaivarta-, Mārkaṇḍeya-, Bhaviṣya-, Vāmana-Purāṇa) und „tamasische“, Śiva-zentrierte Werke (Śiva/Vāyu-, Liṅga-, Skanda-, Agni-, Matsya-, Kūrma-Purāṇa). Diese Dreiteilung ist eine innervaiṣṇavische, wertende Systematisierung und wird hier als überlieferte Klassifikation referiert, nicht als neutrale Tatsachenbeschreibung.", "Die 18 Werke sind untereinander sehr unterschiedlich: manche sind überwiegend erzählend (etwa das Bhāgavata- oder das Mārkaṇḍeya-Purāṇa mit der berühmten, darin enthaltenen Devī-Māhātmya), andere weitgehend enzyklopädisch (Agni-Purāṇa) oder von Pilgerstätten-Preisungen dominiert (Skanda-Purāṇa, mit Abstand das umfangreichste der 18 Werke). Diese Ausgabe übersetzt sie, wie schon Mahābhārata und Āraṇyakas, jeweils vollständig und der Reihe nach – ein Werk wird erst begonnen, wenn das vorangehende ganz übersetzt ist (Ausnahme bildet allenfalls ein bewusster Wechsel, falls die Quellenlage bei einem Werk vorübergehend unpraktikabel wird)."]}, "glossary": [{"term": "Mahāpurāṇa", "category": "Gattung", "definition": "Eines der 18 „großen Purāṇas“ des Hinduismus; traditionell zusammen mit rund 400.000 Versen beziffert."}, {"term": "Purāṇa", "category": "Gattung", "definition": "„Das Alte“ – alte Erzähl- und Lehrgattung, dem eigenen Anspruch nach so alt wie der Veda; behandelt traditionell fünf Themenbereiche (pañcalakṣaṇa)."}, {"term": "pañcalakṣaṇa", "category": "Begriff", "definition": "Die „fünf Merkmale“ eines Purāṇa: sarga (Erstschöpfung), pratisarga (Wiederauflösung und Neuschöpfung), vaṃśa (Götter-/Sehergenealogien), manvantara (Weltzeitalter der Manus), vaṃśānucarita (Dynastiegeschichten)."}, {"term": "Adhyāya", "category": "Gliederung", "definition": "Kapitel; die Unterteilungseinheit innerhalb eines Purāṇa."}, {"term": "māhātmya", "category": "Gattung", "definition": "„Preisung der Größe“ – Abschnitt oder eigenständiges Werk zum Lob einer Pilgerstätte, Gottheit oder eines Rituals; prägt v.a. das Skanda-Purāṇa."}, {"term": "Brahma-Purāṇa", "category": "Werktitel", "definition": "Nach der in dieser Ausgabe verwendeten Zählung das erste der 18 Mahāpurāṇas; enthält u.a. ausführliche Abschnitte zur Sonne und zum Jagannātha-Kult von Puri (Orissa)."}, {"term": "Naimiṣāraṇya", "category": "Ort", "definition": "Der „Naimiṣa-Wald“, traditioneller Schauplatz vieler Rahmenerzählungen der Sanskrit-Literatur (auch im Mahābhārata); hier Ort der zwölfjährigen Opfersitzung, bei der das Brahma-Purāṇa vorgetragen wird."}, {"term": "muni", "category": "Person", "definition": "Weiser, Asket, Schweigender."}, {"term": "dvija", "category": "Amt/Stand", "definition": "„Zweifachgeborener“, Angehöriger der drei oberen Stände nach seiner zweiten, rituellen Geburt bei der Initiation; oft speziell für Brahmanen gebraucht."}, {"term": "sattra", "category": "Ritual", "definition": "Eine mehrtägige bis mehrjährige vedische Opfersitzung; hier die zwölfjährige Opfersitzung im Naimiṣa-Wald."}, {"term": "varṇa", "category": "Begriff", "definition": "Die vier traditionellen Stände: Brāhmaṇa (Priester/Gelehrter), Kṣatriya (Krieger/Herrscher), Vaiśya (Bauer/Händler), Śūdra (Diener)."}, {"term": "āśrama", "category": "Begriff", "definition": "Die vier Lebensstadien: Brahmacārin (Schüler), Gṛhastha (Hausvater), Vānaprastha (Waldeinsiedler), Yati/Saṃnyāsin (Entsager)."}, {"term": "Puruṣottama", "category": "Gottheit", "definition": "„Der höchste Puruṣa (Urwesen/Person)“ – Beiname Viṣṇus."}, {"term": "Hari", "category": "Gottheit", "definition": "Beiname Viṣṇus."}, {"term": "māyā", "category": "Begriff", "definition": "Schöpferische Erscheinungskraft, durch die die manifeste Welt hervorgebracht wird; oft auch als „Trugkraft“ gedeutet."}, {"term": "prapañca", "category": "Begriff", "definition": "Die entfaltete Vielfalt der Erscheinungswelt, das phänomenale Universum."}, {"term": "kalpa", "category": "Begriff", "definition": "Ein Weltzeitalter („ein Tag Brahmās“); kalpānukalpe = „Kalpa für Kalpa“, bei jedem Weltzeitalter erneut."}, {"term": "mokṣa", "category": "Begriff", "definition": "Erlösung aus dem Daseinskreislauf (saṃsāra)."}, {"term": "saṃsāra", "category": "Begriff", "definition": "Der Kreislauf von Geburt und Tod."}, {"term": "budha", "category": "Person", "definition": "Der Erwachte, Weise, Kluge."}, {"term": "Viṣṇu-Purāṇa", "category": "Werktitel", "definition": "Drittes der 18 Mahāpurāṇas; gilt als besonders klassisch strukturiertes Purāṇa, mit ausführlichen Sonnen-/Monddynastie-Genealogien und Kṛṣṇa-Erzählung."}, {"term": "Bhāgavata-Purāṇa", "category": "Werktitel", "definition": "Fünftes der 18 Mahāpurāṇas; literarisch bedeutendstes und einflussreichstes Purāṇa, zwölf Skandhas, mit ausführlichem Kṛṣṇa-Leben in Skandha 10."}, {"term": "Skanda-Purāṇa", "category": "Werktitel", "definition": "Umfangreichstes der 18 Mahāpurāṇas; riesige, lose verbundene Sammlung von Pilgerstätten-Preisungen (māhātmyas)."}, {"term": "Devī-Māhātmya", "category": "Werkteil", "definition": "Berühmter, oft eigenständig verehrter Abschnitt des Mārkaṇḍeya-Purāṇa zum Lob der Göttin (Durgā)."}, {"term": "Hiraṇyagarbha", "category": "Gottheit", "definition": "„Der Goldkeim“ – Beiname des kosmischen Ursprungswesens bzw. Brahmās, das aus dem goldenen Weltei entsteht."}, {"term": "Vāsudeva", "category": "Gottheit", "definition": "Beiname Kṛṣṇas/Viṣṇus (nach seinem Vater Vasudeva)."}, {"term": "Śaṅkara", "category": "Gottheit", "definition": "Beiname Śivas."}, {"term": "Parāśara", "category": "Person", "definition": "Vater des Vyāsa; „Parāśarasuta“ (Sohn des Parāśara) ist ein Beiname Vyāsas."}, {"term": "Vyāsa", "category": "Person", "definition": "Traditioneller Verfasser bzw. Ordner der Purāṇas und des Mahābhārata; hier als „Guru“ verehrt, bevor der Erzähler zu berichten beginnt."}, {"term": "Dakṣa", "category": "Person", "definition": "Ein Prajāpati (Schöpfungsherr); fragte der Überlieferung nach einst Brahmā nach dem Inhalt dieses Purāṇa."}, {"term": "Svayaṃbhū", "category": "Gottheit", "definition": "„Der Selbstentstandene“ – Beiname Brahmās."}, {"term": "Pradhāna", "category": "Begriff", "definition": "Die unmanifeste Urmaterie/Urnatur in sāṃkhya-nahem Denken, aus der die Welt hervorgeht."}, {"term": "Mahat", "category": "Begriff", "definition": "Das „Große“, das Prinzip der kosmischen Erkenntnis/Intelligenz in der Sāṃkhya-Kosmogonie, aus dem das Ahaṃkāra (Ich-Prinzip) hervorgeht."}, {"term": "Ahaṃkāra", "category": "Begriff", "definition": "Das „Ich-mache“-Prinzip, aus dem Mahat entstehend; Ursprung der [groben] Elemente in der Sāṃkhya-Kosmogonie."}, {"term": "Prajāpati", "category": "Begriff/Person", "definition": "„Herr der Geschöpfe“ – hier die sieben von Brahmā geistgeborenen Ur-Weisen (Marīci, Atri, Aṅgiras, Pulastya, Pulaha, Kratu, Vasiṣṭha), die als die „sieben Brahmās“ gelten."}, {"term": "Marīci", "category": "Person", "definition": "Einer der sieben geistgeborenen Prajāpatis/Ṛṣis."}, {"term": "Atri", "category": "Person", "definition": "Einer der sieben geistgeborenen Prajāpatis/Ṛṣis."}, {"term": "Aṅgiras", "category": "Person", "definition": "Einer der sieben geistgeborenen Prajāpatis/Ṛṣis."}, {"term": "Pulastya", "category": "Person", "definition": "Einer der sieben geistgeborenen Prajāpatis/Ṛṣis."}, {"term": "Pulaha", "category": "Person", "definition": "Einer der sieben geistgeborenen Prajāpatis/Ṛṣis."}, {"term": "Kratu", "category": "Person", "definition": "Einer der sieben geistgeborenen Prajāpatis/Ṛṣis."}, {"term": "Vasiṣṭha", "category": "Person", "definition": "Einer der sieben geistgeborenen Prajāpatis/Ṛṣis."}, {"term": "Rudra", "category": "Gottheit", "definition": "Frühe/vedische Erscheinungsform Śivas; hier von Brahmā aus dessen zorniger Natur erschaffen."}, {"term": "abjayoni", "category": "Gottheit", "definition": "„Der aus der Lotosblüte Entstandene“ – Beiname Brahmās."}, {"term": "Manu Svāyambhuva", "category": "Person", "definition": "Der \"aus dem Selbstentstandenen (Svayambhū/Brahmā) hervorgegangene\" erste Manu, Stammvater der Menschheit im gegenwärtigen Manvantara-System; Gemahl der Śatarūpā, Vater von Priyavrata und Uttānapāda."}, {"term": "Śatarūpā", "category": "Person", "definition": "\"Die Hundertgestaltige\", aus Svayambhū (Brahmā) hervorgebrachte erste Frau, Gemahlin des Manu Svāyambhuva."}, {"term": "Priyavrata", "category": "Person", "definition": "Älterer Sohn des Manu Svāyambhuva und der Śatarūpā; Stammvater einer weitreichenden Herrscherlinie in der purāṇischen Genealogie."}, {"term": "Uttānapāda", "category": "Person", "definition": "Jüngerer Sohn des Manu Svāyambhuva und der Śatarūpā; Vater des Dhruva."}, {"term": "Dhruva", "category": "Person", "definition": "Sohn des Uttānapāda, der durch Askese den unvergänglichen Rang des Polarsterns (Dhruva-Stern) erlangte; Held der bekannten Dhruva-Episode."}, {"term": "Kardama", "category": "Person", "definition": "Ein Prajāpati (Schöpfer-Weiser) der frühen Genealogie, verbunden mit der Linie, aus der u.a. Kapila hervorgeht (in anderen Purāṇas ausgeführt)."}, {"term": "Sūnṛtā", "category": "Person", "definition": "Gemahlin des Weisen Uśanas/Ṛṣi in der frühen Genealogie; Mutter mehrerer Nachkommen dieser Linie."}, {"term": "Uśanas", "category": "Person", "definition": "Weiser (Ṛṣi) der frühen Genealogie; nicht zu verwechseln mit Śukra Uśanas, dem späteren Daitya-Lehrer, sofern im Text nicht explizit gleichgesetzt."}, {"term": "Cakṣuṣa", "category": "Person", "definition": "Nachkomme in der frühen Genealogielinie; Name eines späteren Manu (Cākṣuṣa Manvantara) in der purāṇischen Zeitrechnung."}, {"term": "Veṇa", "category": "Person", "definition": "Unheilvoller König, dessen Missregierung und Tod die Weisen dazu veranlasste, aus seinem Körper zunächst die dunklen, unheilvollen Wesen (Vorfahren der Niṣādas) und danach, durch Quirlen seines rechten Arms, seinen Sohn Pṛthu hervorzubringen."}, {"term": "Pṛthu", "category": "Person", "definition": "Aus dem Arm des toten Veṇa hervorgegangener idealer König, der die Erde (in Kuhgestalt) molk und dadurch Ackerbau, Ernten und geordnete Wirtschaft für die Menschheit begründete; Ahnherr des Königtums (\"Pṛthivī\", die Erde, ist nach ihm benannt)."}, {"term": "Pṛthivī", "category": "Konzept", "definition": "\"Die Erde\", benannt nach König Pṛthu, der sie in Gestalt einer Kuh molk und fruchtbar machte."}, {"term": "Sūta", "category": "Konzept", "definition": "Die aus der Milchung der Erde durch Pṛthu entstandene Kaste der Hof-Wagenlenker und Barden (Herolde), die königliche Genealogien und Preislieder bewahren; namensgebend auch für den Erzähler Lomaharṣaṇa/Ugraśravas als \"Sūta\"."}, {"term": "Māgadha", "category": "Konzept", "definition": "Die aus der Milchung der Erde durch Pṛthu entstandene Kaste der Preissänger und Herolde, die Herrscher und deren Taten besingen."}, {"term": "Prācīnabarhis", "category": "Person", "definition": "König und Weiser der frühen Genealogie, Vater der zehn Pracetas-Brüder; asketisch tätig am Meeresufer mit nach Osten (\"prācīna\") gerichtetem Opfergras (\"barhis\"), daher sein Name."}, {"term": "Pracetas (die zehn)", "category": "Konzept", "definition": "Zehn Söhne des Prācīnabarhis, die zehntausend Jahre lang im Meer Askese übten; ihre Rückkehr fällt mit einer Waldbrand-Krise auf der Erde zusammen, die durch Soma befriedet wird; Väter der Māriṣā."}, {"term": "Māriṣā", "category": "Person", "definition": "Aus Bäumen (bzw. deren Essenz, vermittelt durch Soma) hervorgegangene Tochter, Gemahlin der zehn Pracetas und Mutter des Dakṣa in dieser Erzähltradition."}, {"term": "Soma", "category": "Person", "definition": "Mondgott, der in der Pracetas-Episode als Vermittler auftritt, den Waldbrand befriedet und die Jungfrau Māriṣā den zehn Pracetas zur gemeinsamen Gemahlin gibt."}, {"term": "Nārada", "category": "Person", "definition": "Götterweiser (Devarṣi), bekannt für seine oft folgenreichen, herausfordernden Ratschläge; verantwortlich für das Verschwinden von Dakṣas ersten beiden Söhnegruppen (Haryaśvas, Śabalāśvas) auf der Suche nach dem \"Maß der Erde\"."}, {"term": "Haryaśvas", "category": "Konzept", "definition": "Die ersten 5000 Söhne Dakṣas und der Asiknī/Vairaṇī, die auf Nāradas Anregung hin auszogen, das Maß der Erde zu erkunden, und nie zurückkehrten."}, {"term": "Śabalāśvas", "category": "Konzept", "definition": "Die zweiten 1000 Söhne Dakṣas und der Vairaṇī, die beim Versuch, ihre verschollenen Brüder (Haryaśvas) zu finden, ebenfalls für immer verschwanden."}, {"term": "Aditi", "category": "Person", "definition": "Eine der dreizehn Gattinnen Kaśyapas, Mutter der zwölf Ādityas (darunter Viṣṇu und Indra); die Ādityas gehen auf die Wiedergeburt der Tuṣita-Götter des vorigen Manvantara zurück."}, {"term": "Ādityas", "category": "Konzept", "definition": "Die zwölf Sonnengötter, Söhne Kaśyapas und Aditis: Viṣṇu, Śakra (Indra), Aryaman, Dhātṛ, Tvaṣṭṛ, Pūṣan, Vivasvant, Savitṛ, Mitra, Varuṇa, Aṃśa und Bhaga."}, {"term": "Diti", "category": "Person", "definition": "Eine der dreizehn Gattinnen Kaśyapas, Mutter der Daityas Hiraṇyakaśipu und Hiraṇyākṣa; nach deren Tod im Götter-Dānava-Krieg erbat sie sich von Kaśyapa einen indra-tötenden Sohn, dessen Fötus von Indra zu den 49 Marut-Göttern zerteilt wurde."}, {"term": "Hiraṇyakaśipu", "category": "Person", "definition": "Sohn Ditis und Kaśyapas; Vater von Hrāda, Anuhrāda, Prahrāda und Saṃhrāda; über Prahrāda und Virocana Vorfahr Balis."}, {"term": "Hiraṇyākṣa", "category": "Person", "definition": "Sohn Ditis und Kaśyapas; Vater u.a. von Bharbhara, Śakuni, Bhūtasaṃtāpana, Mahānābha und Kālanābha."}, {"term": "Bali", "category": "Person", "definition": "Nachkomme Hiraṇyakaśipus über Prahrāda und Virocana; Vater von Bāṇa und weiteren Söhnen; später von Viṣṇus Vāmana-Avatāra bezwungener Dämonenkönig."}, {"term": "Bāṇa", "category": "Person", "definition": "Ältester unter Balis hundert Söhnen, dem Śiva (Paśupati) besonders zugetan; erbat sich einst die Gunst, stets in Śivas Nähe verweilen zu dürfen."}, {"term": "Danu", "category": "Person", "definition": "Eine der dreizehn Gattinnen Kaśyapas, Stammmutter der Dānavas (hundert Söhne, darunter Svarbhānu und Vipracitti)."}, {"term": "Vipracitti", "category": "Person", "definition": "Bedeutendster der Dānava-Söhne der Danu; Gemahl der Siṃhikā, mit ihr Vater der dreizehn Saiṃhikeyas."}, {"term": "Svarbhānu", "category": "Person", "definition": "Sohn der Danu und Kaśyapas; später bekannt als Rāhu, der Verursacher von Sonnen- und Mondfinsternissen; Vater der Prabhā."}, {"term": "Siṃhikā", "category": "Person", "definition": "Tochter Ditis, Gattin des Vipracitti; Mutter der dreizehn Saiṃhikeyas, darunter Vātāpi, Namuci, Ilvala und Naraka."}, {"term": "Nivātakavacas", "category": "Konzept", "definition": "Mächtige, für die Götter unbezwingbare Dämonen aus dem Geschlecht des Daitya Saṃhrāda, wohnhaft in Maṇivatī; von Arjuna erschlagen."}, {"term": "Hiraṇyapura", "category": "Konzept", "definition": "Sagenhafte \"Goldstadt\" der Dānavas, Wohnort der Paulomas und Kālakeyas."}, {"term": "Tāmrā", "category": "Person", "definition": "Eine der dreizehn Gattinnen Kaśyapas; Mutter von sechs Töchtern (Krauñcī, Śyenī, Bhāsī, Sugrīvī, Śuci, Gṛdhrikā), die als Stammmütter der Vogelarten sowie von Pferden, Kamelen und Eseln gelten."}, {"term": "Vinatā", "category": "Person", "definition": "Eine der dreizehn Gattinnen Kaśyapas; Mutter von Garuḍa und Aruṇa."}, {"term": "Garuḍa", "category": "Person", "definition": "Sohn der Vinatā und Kaśyapas, \"Vorzüglichster der Fliegenden\", später Viṣṇus Reittier (Vāhana)."}, {"term": "Aruṇa", "category": "Person", "definition": "Sohn der Vinatā und Kaśyapas; Lenker des Sonnenwagens."}, {"term": "Kadrū", "category": "Person", "definition": "Eine der dreizehn Gattinnen Kaśyapas, Stammmutter der Nāgas (Schlangenwesen), darunter Śeṣa, Vāsuki und Takṣaka."}, {"term": "Nāgas", "category": "Konzept", "definition": "Schlangenwesen, Nachkommen der Kadrū und Kaśyapas; ihre bedeutendsten Vertreter sind Śeṣa, Vāsuki und Takṣaka."}, {"term": "Surabhī", "category": "Person", "definition": "Eine der dreizehn Gattinnen Kaśyapas; einerseits Stammmutter der elf Rudras (mit Kaśyapa, durch Śivas Gnade), andererseits Stammmutter der Kühe und Büffelkühe – eine \"Wunschkuh\"-Gestalt."}, {"term": "Rudras (die elf)", "category": "Konzept", "definition": "Elf Söhne der Surabhī und Kaśyapas: Ajaikapād, Ahirbudhnya, Tvaṣṭṛ, Rudra, Hara, Bahurūpa, Tryambaka, Aparājita, Vṛṣākapi, Śambhu, Kapardin, Raivata, Mṛgavyādha, Śarva und Kapālin werden genannt (der Text zählt mehr als elf Namen, vgl. Anm. zu v.47-49); insgesamt sollen es der Überlieferung nach hundert Rudras sein."}, {"term": "Viśvakarman", "category": "Person", "definition": "Göttlicher Baumeister und Kunsthandwerker, Sohn des Vasu Prabhāsa und einer Schwester Bṛhaspatis; erschafft die Himmelswagen (Vimānas) der Götter und ist Urheber aller menschlichen Handwerkskünste."}, {"term": "Kārttikeya", "category": "Person", "definition": "Auch Kumāra oder Skanda genannt; Kriegsgott, hier als Sohn Agnis/Analas (eines der acht Vasus), geboren im Schilfdickicht und benannt nach den ihn nährenden Kṛttikās (Plejaden)."}, {"term": "Kāla", "category": "Konzept", "definition": "Personifizierte Zeit, Sohn des Vasu Dhruva; \"der die Welten treibt\"."}, {"term": "Maruts", "category": "Konzept", "definition": "Neunundvierzig Sturmgötter und Gefährten Indras, entstanden aus dem von Indra siebenfach, dann je siebenfach zerteilten Fötus der Diti; der Name wird volksetymologisch von Indras Zuruf \"mā rodīḥ\" (\"weine nicht\") hergeleitet."}, {"term": "Vasus (die acht)", "category": "Konzept", "definition": "Acht Götter, Söhne der zehn Gattinnen des Dharma: Āpa, Dhruva, Soma, Dhava, Anila, Anala, Pratyūṣa und Prabhāsa."}, {"term": "Aṅga", "category": "Person", "definition": "Prajāpati aus dem Geschlecht des Atri, Vater Veṇas; galt selbst als vorbildlicher Hüter des Dharma."}, {"term": "Sunīthā", "category": "Person", "definition": "Tochter des Todes (Mṛtyu), Mutter Veṇas; ihre Abstammung gilt als Ursache für Veṇas späteren moralischen Verfall."}, {"term": "Niṣāda", "category": "Konzept", "definition": "Erster dunkler, kleinwüchsiger Mensch, entstanden aus dem von den Weisen gequirlten linken Schenkel Veṇas; Stammvater der Niṣāda-Stämme und der Fischer (Dhīvaras); der Name leitet sich von Atris Zuruf \"niṣīda\" (\"setz dich!\") her."}, {"term": "Sūta (Person)", "category": "Person", "definition": "Aus dem Sūtya-Ritual bei Brahmās Opfer geborener Barde; wurde zusammen mit Māgadha beauftragt, König Pṛthu im Vorgriff auf dessen künftige Taten zu preisen, und erhielt dafür das Anūpa-Land."}, {"term": "Māgadha (Person)", "category": "Person", "definition": "Im selben Opfer wie Sūta geborener Preissänger; erhielt von Pṛthu das Magadha-Land."}, {"term": "Ajagava", "category": "Konzept", "definition": "Name von Pṛthus lautstarkem Bogen, mit dem er bei seiner Geburt erschien."}, {"term": "Medinī", "category": "Konzept", "definition": "Ein weiterer Name der Erde, hergeleitet vom Fett (medas) der Dämonen Madhu und Kaiṭabha, mit dem die Erde einst überflutet wurde."}, {"term": "Pṛthivī / Pṛthvī", "category": "Konzept", "definition": "Name der Erde, hergeleitet von König Pṛthu, dem sie sich als \"Tochter\" unterstellte, nachdem er sie zur Herausgabe ihrer Nahrungsschätze bewegt hatte."}, {"term": "Erdmelkung (Motiv)", "category": "Konzept", "definition": "Zentrales purāṇisches Bildmotiv: die Erde in Kuhgestalt wird von verschiedenen Wesensklassen (Menschen, Göttern, Weisen, Dämonen, Tieren, Bäumen usw.) jeweils mit eigenem \"Kalb\", \"Gefäß\" und \"Melker\" gemolken, um eine ihrer Natur entsprechende \"Milch\" (Feldfrüchte, Askese-Kraft, Gift, Wohlgeruch usw.) zu gewinnen; von König Pṛthu erstmals für die Menschen vollzogen (mit Manu Svāyambhuva als Kalb)."}, {"term": "Madhu und Kaiṭabha", "category": "Konzept", "definition": "Zwei Dämonen, deren Tötung und dabei vergossenes Fett (medas) der Erde den Namen \"Medinī\" gab; ihre vollständige Geschichte wird an dieser Stelle nicht erzählt."}, {"term": "Manvantara (die Vierzehn)", "category": "Konzept", "definition": "Die vierzehn Zeitalter eines Kalpa, jeweils benannt nach ihrem Manu: Svāyambhuva, Svārociṣa, Uttama, Tāmasa, Raivata, Cākṣuṣa, Vaivasvata (das gegenwärtige), Sāvarṇa, vier Merusāvarṇyas, Raucya und Bhautya; jedes umfasst eigene Sieben Weise, zehn Manu-Söhne und eine Göttergruppe."}, {"term": "Saptarṣis (die Sieben Weisen)", "category": "Konzept", "definition": "Die Gruppe der sieben großen Weisen, die jedem Manvantara zugeordnet ist; im gegenwärtigen Vaivasvata-Manvantara: Atri, Vasiṣṭha, Kaśyapa, Gautama, Bharadvāja, Viśvāmitra und Jamadagni."}, {"term": "Ikṣvāku", "category": "Person", "definition": "Ältester und bekanntester der zehn Söhne des Manu Vaivasvata; Stammvater der solaren Königsdynastie (Sūryavaṃśa), aus der später Rāma hervorgeht."}, {"term": "Kalpa", "category": "Konzept", "definition": "Ein \"Tag Brahmās\", bestehend aus tausend Yugas bzw. vierzehn Manvantaras; endet mit der vollständigen kosmischen Auflösung (Mahāpralaya), bei der alle Wesen in Hari-Nārāyaṇa eingehen."}, {"term": "Paraśurāma", "category": "Person", "definition": "Sohn des Jamadagni; wird hier als einer der zukünftigen Sieben Weisen des achten (Sāvarṇa-)Manvantara genannt, da er der Tradition nach als Cirañjīvin (langlebig Unsterblicher) gilt."}, {"term": "Aśvatthāman", "category": "Person", "definition": "Sohn des Droṇa aus dem Mahābhārata; gilt als Cirañjīvin (langlebig Unsterblicher) und wird hier als einer der zukünftigen Sieben Weisen des achten Manvantara genannt."}, {"term": "Saṃjñā", "category": "Person", "definition": "Tochter des Tvaṣṭṛ, Gattin Vivasvants; kann dessen übermäßigen Glanz nicht ertragen, erschafft ihren Schatten-Doppelgänger Savarṇā und flieht selbst in Stutengestalt zu den Nord-Kurus. Mutter von Manu Vaivasvata, Yama, Yamī und (in Pferdegestalt) den Aśvins."}, {"term": "Vivasvant / Mārtaṇḍa", "category": "Person", "definition": "Einer der zwölf Ādityas, Sohn Kaśyapas und Aditis, Gatte der Saṃjñā; sein übermäßiger Glanz wird von Tvaṣṭṛ gemildert. Der Name „Mārtaṇḍa“ (\"aus dem toten Ei\") stammt von einer knapp angedeuteten Geburtslegende."}, {"term": "Savarṇā", "category": "Person", "definition": "Von Saṃjñā erschaffener magischer Schatten-Doppelgänger, der an ihrer Stelle Vivasvants Gattin wird; Mutter von Manu Sāvarṇa und Śanaiścara (Saturn); ihr harter Fluch gegen Yama führt zur Aufdeckung der Täuschung."}, {"term": "Tvaṣṭṛ", "category": "Person", "definition": "Göttlicher Handwerker, Vater der Saṃjñā; mildert Vivasvants übermäßigen Glanz auf einer Drehscheibe und formt aus dem abgeschliffenen Glanz später Viṣṇus Diskuswaffe (Cakra)."}, {"term": "Yama", "category": "Person", "definition": "Sohn Vivasvants und Saṃjñās, Zwillingsbruder der Yamunā; wird von Savarṇā (in der irrigen Annahme, seine Mutter zu sein) wegen einer kindlichen Fußdrohung verflucht, seinen Fuß zu verlieren (gemildert zum Verlust von etwas Fleisch durch Würmer); wird später zum gerechten Dharmarāja und Herrn der Ahnen (Pitṛs)."}, {"term": "Aśvins", "category": "Konzept", "definition": "Die göttlichen Zwillings-Ärzte Nāsatya und Dasra, Söhne Vivasvants und der in Stutengestalt verwandelten Saṃjñā, ungewöhnlich über deren Nüstern gezeugt und geboren."}, {"term": "Manu Sāvarṇa / Sāvarṇi", "category": "Person", "definition": "Sohn Vivasvants und der Schatten-Saṃjñā (Savarṇā); künftiger Manu des achten Manvantara, übt derzeit noch Askese auf dem Berg Meru."}, {"term": "Śanaiścara", "category": "Konzept", "definition": "Zweiter Sohn Vivasvants und Savarṇās; wird zum Planeten Saturn."}, {"term": "Yamunā (Person/Fluss)", "category": "Konzept", "definition": "Tochter Vivasvants und Saṃjñās, Zwillingsschwester Yamas; wird zum heiligen, weltreinigenden Fluss Yamunā."}, {"term": "Ilā / Sudyumna", "category": "Person", "definition": "Aus einem Mitra-Varuṇa-Opfer des Manu Vaivasvata hervorgegangene Gestalt, zugleich Tochter (Ilā, für Mitra und Varuṇa) und Sohn (Sudyumna, für Manus Geschlecht); von Budha verführt, Mutter des Purūravas; erhält später von Vasiṣṭha das Reich Pratiṣṭhāna, das sie an Purūravas weitergibt."}, {"term": "Budha", "category": "Person", "definition": "Sohn des Mondgottes Soma; verführt die als Frau erscheinende Ilā und zeugt mit ihr Purūravas."}, {"term": "Purūravas", "category": "Person", "definition": "Sohn Budhas und der Ilā; Stammvater der Mondlinie (Candravaṃśa) mit Sitz Pratiṣṭhāna, empfangen von Sudyumna."}, {"term": "Kakudmī / Raivata", "category": "Person", "definition": "Sohn des Raiva, Herrscher von Kuśasthalī; besucht mit seiner Tochter Revatī Brahmaloka, wo scheinbar nur ein Augenblick, in Wirklichkeit aber viele Yugas vergehen; gibt bei der Rückkehr Revatī dem Baladeva zur Frau und zieht sich zur Askese auf den Meru zurück, während Kuśasthalī von Rākṣasas erobert wird."}, {"term": "Revatī", "category": "Person", "definition": "Tochter des Kakudmī; wird nach dessen Rückkehr aus Brahmaloka, unversehrt vom Alter, dem Baladeva (Rāma/Balarāma) zur Frau gegeben."}, {"term": "Śaryāti", "category": "Person", "definition": "Sohn des Manu Vaivasvata; Vater der Sukanyā (Gattin des Weisen Cyavana) und des Ānarta; Stammvater der weitverzweigten, nach Flucht vor Rākṣasas über die Erde verstreuten Śaryāta-Kṣatriyas."}, {"term": "Vikukṣi / Śaśāda", "category": "Person", "definition": "Ältester der hundert Söhne Ikṣvākus; von seinem Vater verstoßen, nachdem er während eines vorbereiteten Totenopfers aus Hunger einen erlegten Hasen verzehrte (daher der Beiname \"Śaśāda\", Hasenfresser); wird nach Ikṣvākus Tod dennoch König."}, {"term": "Kakutstha", "category": "Person", "definition": "Sohn des Śaśāda, Vorfahr in der Ikṣvāku-Linie, von dem sich das Epitheton \"Kākutstha\" für spätere Sūryavaṃśa-Könige (u.a. Rāma) herleitet."}, {"term": "Bṛhadaśva und Kuvalāśva", "category": "Person", "definition": "Bṛhadaśva, König der Ikṣvāku-Linie, übergibt vor seinem Rückzug in den Wald die Herrschaft an seinen Sohn Kuvalāśva, der mit Viṣṇus eingegangener Kraft den Dämon Dhundhu tötet und dadurch den Beinamen \"Dhundhumāra\" erhält."}, {"term": "Uttaṅka", "category": "Person", "definition": "Brahmanen-Weiser, dessen Einsiedelei durch den im Sandmeer Uddālaka verborgenen Dämon Dhundhu bedroht wird; bittet Bṛhadaśva bzw. dessen Sohn Kuvalāśva um dessen Tötung und gewährt dem Sieger Viṣṇus einwohnende Kraft sowie weitere Segensgaben."}, {"term": "Dhundhu / Dhundhumāra", "category": "Konzept", "definition": "Sohn des Rākṣasa Madhu, ein im Sandmeer Uddālaka verborgener Groß-Asura, dessen jährlicher Atemstoß Erdbeben, Feuer und siebentägige Verdunkelung verursacht; wird von Kuvalāśva (mit Viṣṇus Kraft) getötet, der daraufhin den Beinamen \"Dhundhumāra\" (Dhundhu-Töter) erhält."}, {"term": "Māndhātā", "category": "Person", "definition": "Sohn des Yuvanāśva, \"Dreiwelten-Bezwinger\"; Vater von Purukutsa und Mucukunda mit seiner Gattin Bindumatī."}, {"term": "Satyavrata (später Triśaṅku)", "category": "Person", "definition": "Sohn des Königs Trayyāruṇa aus der Ikṣvāku-Linie; wegen des Raubs einer bereits verheirateten Braut von seinem Vater verstoßen und zum Leben unter den Caṇḍālas (Śvapākas) verurteilt; rettet während einer durch sein Vergehen verursachten zwölfjährigen Dürre Viśvāmitras zurückgelassene Familie und befreit dessen zum Verkauf gebundenen Sohn (den späteren Gālava) aus der Schuldknechtschaft."}, {"term": "Gālava", "category": "Person", "definition": "Mittlerer Sohn Viśvāmitras, von seiner Mutter während einer Hungersnot für hundert Kühe zum Verkauf angeboten (mit einem Strick um den Hals gebunden) und von Satyavrata befreit und versorgt; sein Name wird volksetymologisch von \"gale\" (\"am Hals\") hergeleitet."}, {"term": "Śvapāka (Caṇḍāla)", "category": "Konzept", "definition": "\"Hundekocher\" – Bezeichnung für die Caṇḍālas, eine der niedrigsten sozialen Gruppen der altindischen Gesellschaft, unter denen der verstoßene Satyavrata Zuflucht findet."}, {"term": "Triśaṅku (Satyavrata)", "category": "Person", "definition": "Beiname (\"Dreipfahl\") des Satyavrata, den ihm Vasiṣṭha wegen dreier Verfehlungen (Unzufriedenheit des Vaters, Tötung von Vasiṣṭhas Wunschkuh, Verzehr ungeweihten Fleisches) gibt; erhält von Viśvāmitra aus Dankbarkeit den Segen, mit seinem eigenen Körper in den Himmel aufzusteigen. Vater des Hariścandra."}, {"term": "Hariścandra", "category": "Person", "definition": "Sohn des Triśaṅku, daher \"Traiśaṅkava\" genannt; Vollbringer des Rājasūya-Opfers, unter dem Beinamen \"Samrāṭ\" (Allherrscher) berühmt."}, {"term": "Bāhu und Sagara", "category": "Person", "definition": "Bāhu, ein Nachkomme Hariścandras, wird von den Haihayas und Tālajaṅghas samt fünf verbündeten Fremdvölkern (Śakas, Yavanas, Kāmbojas, Pāradas, Pahnavas) vertrieben und stirbt im Exil; sein nach seinem Tod, zusammen mit von einer Nebenfrau verabreichtem Gift geborener Sohn Sagara (\"mit Gift\") erobert mit der von Aurva erlangten Feuerwaffe das Reich zurück und aberkennt jenen fünf Völkern durch äußere Kennzeichen ihren Kṣatriya-Status, ohne sie zu töten."}, {"term": "Aurva", "category": "Person", "definition": "Bhārgava-Weiser, der die schwangere, dem Selbstmord nahe Witwe Bāhus rettet, in dessen Einsiedelei Sagara geboren wird und dem er später die Feuerwaffe (Āgneyāstra) sowie Segen für Sagaras Gattinnen verleiht."}, {"term": "Śakas, Yavanas, Kāmbojas, Pāradas, Pahnavas", "category": "Konzept", "definition": "Fünf mit den Haihayas/Tālajaṅghas verbündete Fremdvölker, die Bāhu vertreiben; von Sagara besiegt und (auf Vasiṣṭhas Vermittlung, ohne Tötung) durch äußere Kennzeichen wie Haartracht und Bart aus dem Kṣatriya-Stand ausgeschlossen."}, {"term": "Sagaras 60.000 Söhne", "category": "Konzept", "definition": "Auf wundersame Weise geborene Söhne Sagaras (nach einer Überlieferung aus einem mit Samen gefüllten Flaschenkürbis); graben beim Suchen des gestohlenen Opferpferdes das Weltmeer aus, wecken dabei den in Kapila-Gestalt schlafenden Viṣṇu und werden von dessen Blick verbrannt – Vorgeschichte zu Bhagīrathas späterer Herabführung der Gaṅgā."}, {"term": "Sāgara (Ozean)", "category": "Konzept", "definition": "Namensätiologie: der Weltozean heißt \"Sāgara\", weil er von Sagaras Söhnen ausgegraben wurde; wird in der Erzählung zugleich mit Sagara verbunden und verehrt ihn."}, {"term": "Aṃśumān und Dilīpa/Khaṭvāṅga", "category": "Person", "definition": "Aṃśumān, Enkel Sagaras, überlebt als einer der wenigen Nachkommen; sein Nachkomme Dilīpa (auch Khaṭvāṅga genannt) erlangt durch eine Heldentat für die Götter nur noch einen Augenblick Lebenszeit, gewinnt darin aber durch Weisheit und Wahrhaftigkeit die drei Welten."}, {"term": "Bhagīratha", "category": "Person", "definition": "Nachkomme Dilīpas/Khaṭvāṅgas; führt durch seine Askese die Himmelsflüssin Gaṅgā auf die Erde und zum Ozean herab (daher \"Bhāgīrathī\" als Name der Gaṅgā), womit die verbrannten Söhne Sagaras erlöst werden."}, {"term": "Raghu, Aja, Daśaratha, Rāma", "category": "Person", "definition": "Die letzten Glieder der Sūryavaṃśa-Genealogie vor und mit Rāma: Raghu (nach dem das Geschlecht auch \"Rāghava\" heißt), sein Sohn Aja, dessen Sohn Daśaratha und dessen Sohn Rāma; die Genealogie wird bis zu Rāmas Nachkommen Kuśa, Atithi u.a. bis zu einem weiteren, von dem berühmten Nala (Sohn des Vīrasena) ausdrücklich unterschiedenen Nala fortgeführt."}, {"term": "Soma (Mondgott)", "category": "Person", "definition": "Aus der Askese des Weisen Atri entstandener Mondgott; erhält von Brahmā die Herrschaft über Samen, Heilkräuter, Brahmanen und Gewässer, vollzieht ein Rājasūya-Opfer, wird jedoch durch Herrschermacht-Rausch verblendet und raubt Bṛhaspatis Gattin Tārā, was den kosmischen Tārakāmaya-Krieg auslöst. Vater des Budha."}, {"term": "Tārā und der Tārakāmaya-Krieg", "category": "Konzept", "definition": "Tārā, Gattin des Bṛhaspati, wird von Soma geraubt; die Weigerung, sie zurückzugeben, löst den \"um Tārās willen\" genannten großen Krieg zwischen Göttern und Dānavas aus (Uśanas/Śukra auf Somas, Rudra auf Bṛhaspatis Seite, Einsatz der Brahmaśiras-Waffe), beendet durch Brahmās Vermittlung."}, {"term": "Bṛhaspati", "category": "Person", "definition": "Sohn des Aṅgiras, Priester der Götter; seine Gattin Tārā wird von Soma geraubt; verstößt die von Soma schwangere Tārā bei ihrer Rückkehr, woraus deren Sohn Budha hervorgeht, dessen Vaterschaft zunächst ungeklärt bleibt."}, {"term": "Budha (Sohn Somas)", "category": "Person", "definition": "Sohn Tārās, dessen Vaterschaft zwischen Soma und Bṛhaspati strittig ist, bis Tārā auf Brahmās Befragen hin Soma als Vater nennt; namensgebend auch für den Planeten Merkur (dessen scheinbar rückläufige Bahn hier angesprochen wird). Vater des Purūravas mit Ilā."}, {"term": "Purūravas und Urvaśī", "category": "Person", "definition": "Purūravas, Sohn Budhas und der Ilā, gewinnt die Liebe der himmlischen Apsaras Urvaśī, die deswegen ihren himmlischen Stolz aufgibt; ihre sieben gemeinsamen Söhne (u.a. Amāvasu) begründen die Mondlinie (Candravaṃśa)."}, {"term": "Jahnu", "category": "Person", "definition": "Nachkomme Purūravas', vollzieht ein großes Schlangenopfer, das die Gaṅgā aus Verlangen nach einem Gatten überflutet; trinkt sie im Zorn aus, gibt sie aber auf Bitten der Weisen als \"Tochter\" (daher \"Jāhnavī\" als Beiname der Gaṅgā) wieder frei. Gattin: Kāverī."}, {"term": "Kuśika und Gādhi", "category": "Person", "definition": "Kuśika übt Askese für einen Indra-gleichen Sohn; aus Furcht vor einem ihn übertreffenden Rivalen wird Indra selbst als sein Sohn Gādhi geboren. Gādhis Tochter Satyavatī wird die Gattin des Ṛcīka und, mittelbar über die vertauschten Opferspeisen, Mutter Jamadagnis und Großmutter Paraśurāmas."}, {"term": "Ṛcīka und die vertauschten Opferspeisen", "category": "Konzept", "definition": "Der Bhārgava-Weise Ṛcīka bereitet zwei geweihte Opferspeisen (Caru) – eine für seine Gattin Satyavatī (sollte einen friedvollen Brahmanensohn hervorbringen) und eine für Gādhis Gattin (sollte einen kriegerischen Kṣatriya-Sohn hervorbringen). Durch eine Vertauschung isst Satyavatī versehentlich die für ihre Mutter bestimmte; auf ihre Bitte hin verlagert Ṛcīka das kriegerische Wesen von ihrem Sohn (Jamadagni) auf ihren künftigen Enkel (Paraśurāma)."}, {"term": "Jamadagni und Paraśurāma (Rāma Jāmadagnya)", "category": "Person", "definition": "Jamadagni, friedvoller Sohn Ṛcīkas und Satyavatīs, zeugt mit Reṇukā (Tochter des Reṇu) den gewaltmächtigen Paraśurāma (\"Rāma\", Kenner des Bogenschieß-Veda), den späteren großen Kṣatriya-Vernichter."}, {"term": "Viśvāmitra", "category": "Person", "definition": "Sohn Gādhis, ursprünglich Kṣatriya (auch Viśvaratha genannt), erlangt durch Askese und Bhṛgus Gnade den Rang eines Brahmanenweisen (brahmarṣi) – berühmtester Fall eines solchen Standeswechsels; hat zahlreiche Söhne (u.a. Devarāta/Śunaḥśepha) und namengebende Gotra-Linien (Kauśikas)."}, {"term": "Śunaḥśepha / Devarāta", "category": "Person", "definition": "Leiblicher Sohn Ṛcīkas (Bruder Jamadagnis), wird bei einem Königsopfer als Menschenopfer-Ersatz verwendet, von den Göttern gerettet und Viśvāmitra als Sohn \"zurückgegeben\" (daher der Beiname Devarāta, \"von den Göttern gegeben\")."}, {"term": "Āyus", "category": "Person", "definition": "Sohn Purūravas' und Urvaśīs; seine fünf Söhne mit Prabhā (Tochter des Svarbhānu) – Nahuṣa, Vṛddhaśarman, Rambha, Rajī und Anenas – setzen die Mondlinie (Candravaṃśa) fort."}, {"term": "Rajī und der Indra-Betrug", "category": "Konzept", "definition": "Rajī, Sohn des Āyus, erkämpft im Krieg zwischen Göttern und Dānavas auf Brahmās Geheiß den Sieg für die Götter und erhält dafür die Anwartschaft auf die Indra-Würde; durch eine List gibt sich Indra (Śatakratu) selbst als Rajīs Sohn aus und gewinnt so nach Rajīs Tod die Herrschaft von dessen eigenen 500 Söhnen zurück."}, {"term": "Anenas-Linie und Kṣatravṛddha", "category": "Konzept", "definition": "Über Anenas (Sohn des Āyus) führt die Genealogie zu Pratikṣatra, Saṃjaya, Jaya, Vijaya, Kṛti, Haryatvata, Sahadeva, Nadīna, Jayatsena, Saṃkṛti und schließlich Kṣatravṛddha, dessen Sohn Sunahotra die Stammväter Kāśa, Śala und Gṛtsamada zeugt."}, {"term": "Gṛtsamada und Śaunaka", "category": "Person", "definition": "Gṛtsamada, Sohn Sunahotras, Vater des Śunaka, dessen Sohn wiederum der berühmte Weise Śaunaka ist, von dem die vier Stände (Brahmanen, Kṣatriyas, Vaiśyas, Śūdras) abstammen sollen."}, {"term": "Dhanvantari", "category": "Person", "definition": "Gott der Heilkunde; erscheint erneut in menschlicher Geburt als König von Kāśi (Sohn des Dhanus, Enkel des Dīrghatapas), empfängt den Āyurveda von Bharadvāja, gliedert ihn in acht Teile und lehrt ihn seinen Schülern. Vorfahr des Divodāsa."}, {"term": "Divodāsa und die Kāśī-Linie", "category": "Konzept", "definition": "Divodāsa, Nachkomme Dhanvantaris, wird Herrscher von Vārāṇasī; nach der Verwüstung der Stadt durch den Rākṣasa Kṣemaka (infolge eines Fluchs Nikumbhas) gründet er eine neue Residenz an der Gomatī, erobert Vārāṇasī von Bhadraśreṇyas Söhnen zurück, verschont dessen Sohn Durdama als Kind, wird später von diesem wieder vertrieben und schließlich durch seinen eigenen Sohn Pratardana gerächt."}, {"term": "Alarka", "category": "Person", "definition": "Nachkomme Pratardanas (über Vatsa bzw. Saṃnati); ein langlebiger, den Brahmanen zugetaner König, der durch die Gunst der Lopāmudrā außergewöhnliche Lebensdauer erlangt, den Rākṣasa Kṣemaka erschlägt und Vārāṇasī nach Ablauf des Fluches neu begründet."}, {"term": "Yayāti", "category": "Person", "definition": "Sohn des Nahuṣa; Gemahl der Devayānī (Tochter Uśanas') und der Śarmiṣṭhā (Tochter Vṛṣaparvans), Vater von Yadu, Turvasu, Druhyu, Anu und Puru. Bittet im Alter seine Söhne, ihre Jugend gegen sein Alter zu tauschen; nur Puru willigt ein, die übrigen vier werden verflucht, keine Königsherrschaft zu erlangen. Nach Jahren erneuerter Jugend erkennt Yayāti die Unstillbarkeit der Begierde, gibt Purus Jugend zurück und erlangt durch Askese den Himmel."}, {"term": "Devayānī und Śarmiṣṭhā", "category": "Person", "definition": "Devayānī, Tochter des Uśanas (Śukra), und Śarmiṣṭhā, Tochter des Asura-Königs Vṛṣaparvan, die beiden Gattinnen Yayātis; Devayānī gebiert Yadu und Turvasu, Śarmiṣṭhā gebiert Druhyu, Anu und Puru."}, {"term": "Yadu, Turvasu, Druhyu, Anu, Puru", "category": "Konzept", "definition": "Die fünf Söhne Yayātis, unter die er sein Königreich aufteilt (Yadu Osten, Puru die Mitte, Turvasu Südosten); Stammväter der fünf großen vedischen Völkergruppen. Yadu, Turvasu, Druhyu und Anu werden von Yayāti verflucht, keine Königsherrschaft zu erlangen, weil sie sich weigern, sein Alter zu übernehmen; nur Puru, der einwilligt, wird als König eingesetzt und erhält Yayātis Jugend zurückgegeben. Aus Yadus Linie geht später Kṛṣṇa (Nārāyaṇa/Hari) als Vṛṣṇi hervor."}, {"term": "Yayātis Wunderwagen", "category": "Konzept", "definition": "Ein von Indra (Śakra) geschenkter, goldener, gedankenschneller Wagen; seine Weitergabe wird über die Kuru-Linie bis zu König Janamejaya (Brahmanenmord an Gargas Sohn, Sühne-Aśvamedha auf Rat Śaunakas), dann über den Herrscher von Cedi und Bṛhadratha zu dessen Nachkommen Jarāsandha (\"Bārhadratha\") verfolgt, der von Bhīma erschlagen wird; danach schenkt Bhīma den Wagen aus Zuneigung Vāsudeva (Kṛṣṇa)."}, {"term": "Yayātis Verse über die Begierde", "category": "Konzept", "definition": "Berühmte, auch aus dem Mahābhārata bekannte Lehrverse (BrP 12,40-46), die Yayāti nach der Rückgabe seiner erborgten Jugend spricht: Begierde wächst durch Genuss nur weiter (wie Feuer durch Opferschmalz); kein Reichtum genügt für einen Einzigen; erst das Aufgeben allen Verlangens (tṛṣṇā) führt zu Brahman und übertrifft alles irdische wie himmlische Glück."}, {"term": "König Bali und seine Söhne (Aṅga, Vaṅga, Suhma, Puṇḍra, Kaliṅga)", "category": "Person/Genealogie", "definition": "Ein menschlicher König aus der Puru-Linie (nicht zu verwechseln mit dem Daitya Bali aus Kap. 3), der durch den Weisen Dīrghatamas fünf Söhne erhielt: Aṅga, Vaṅga, Suhma, Puṇḍra und Kaliṅga – die Stammväter der gleichnamigen ostindischen Völker/Länder."}, {"term": "Bharata und Śakuntalā", "category": "Person/Genealogie", "definition": "Duṣyanta (Nachkomme des Puru über Ṛceyu/Matinara) zeugt mit Śakuntalā den Sohn Bharata, nach dem Bhāratavarṣa (Indien) und die Bhāratas benannt sind."}, {"term": "Vitatha", "category": "Person/Genealogie", "definition": "Da Bharatas leibliche Söhne früh starben, wird Vitatha, ein Sohn des Bharadvāja, von Bharata als Erbe adoptiert und führt dessen Linie fort."}, {"term": "Die zweite Kāśī-Genealogie (Kapitel 13)", "category": "Textkritik", "definition": "Kapitel 13 (v.64-79) wiederholt, über eine andere Abstammungslinie (Puru-Bharata-Bharadvāja-Vitatha-Suhotra) hergeleitet, fast wortgleich die bereits in Kapitel 11 gegebene Kāśī-Dynastie – ein textlicher Doppelbeleg, an einer Stelle mit abweichendem Namen (Aṣṭāratha statt Pratardana)."}, {"term": "Die Pañcālas und die zweite Ajamīḍha-Linie", "category": "Volk/Genealogie", "definition": "Über Ajamīḍhas Frau Nīlī und deren Nachkommen (u.a. Bāhyāśvas fünf Söhne) erhält das Volk der Pañcālas seinen Namen; die Linie führt über Mudgala, Somaka und Pṛṣata bis zu Drupada."}, {"term": "Kuru und Kurukṣetra", "category": "Person/Ort", "definition": "Nachkomme Ajamīḍhas über Ṛkṣa und Saṃvaraṇa; König Kuru gilt als Gründer/Namensgeber von Kurukṣetra und Stammvater der Kauravas und Pāṇḍavas."}, {"term": "Śāṃtanu, Bhīṣma und die Pāṇḍava-Linie", "category": "Person/Genealogie", "definition": "Über Pratīpa und Śāṃtanu (Vater von Devāpi, Bāhlika und, mit Gaṅgā, Bhīṣma) führt die Kuru-Linie zu Vicitravīrya, Dhṛtarāṣṭra, Pāṇḍu und Vidura und schließlich zu Duryodhana und den Pāṇḍavas bis Parīkṣit und Janamejaya."}, {"term": "Die zukünftige Genealogie nach Janamejaya", "category": "Mythos", "definition": "Kapitel 13 setzt die Kuru-Linie ungewöhnlicherweise über den aus dem Mahābhārata bekannten Janamejaya hinaus fort (Candrāpīḍa, Sūryāpīḍa, Satyakarṇa, Śvetakarṇa) und erzählt die Rettungslegende des ausgesetzten Säuglings Ajapārśva durch zwei Wolkengottheiten-Söhne der Śraviṣṭhā."}, {"term": "Der Turvasu-Puru-Zusammenschluss", "category": "Mythos", "definition": "Infolge von Yayātis Fluch (Kap. 12) stirbt Turvasus eigene Linie aus; sein Erbe fällt an Duṣyanta/Bharata aus der Puru-Linie, wodurch die Bharata-Nachkommenschaft zugleich als Fortsetzung der Turvasu-Linie gilt."}, {"term": "Pāṇḍya, Kerala, Cola und Gāndhāra", "category": "Volk/Land", "definition": "Über Turvasus Nachkommen Ahrīda (Pāṇḍya, Kerala, Cola) und Druhyus Nachkommen Aṅgārasetu/Gāndhāra werden in Kapitel 13 die späteren südindischen Königreiche sowie das Land Gāndhāra (bekannt für seine Pferde) genealogisch hergeleitet."}, {"term": "Kārtavīrya Arjuna (Sahasrārjuna)", "category": "Person/Mythos", "definition": "Sohn des Kṛtavīrya aus der Yadu-Haihaya-Linie; erhält von Dattātreya die Gnade tausend Arme, Unbesiegbarkeit und weitere Gaben, unterwirft die Erde, vollzieht 700 goldene Opfer und wird als Weltenherrscher gepriesen."}, {"term": "Kārtavīryas Gefangennahme Rāvaṇas", "category": "Mythos", "definition": "Kārtavīrya Arjuna besiegt und gefangennimmt Rāvaṇa bei Māhiṣmatī, als dieser dort Zerstörung anrichtet; auf Fürsprache des Weisen Pulastya wird Rāvaṇa wieder freigelassen. Auch aus dem Rāmāyaṇa (Uttarakāṇḍa) bekannt."}, {"term": "Vasiṣṭhas Fluch und Kārtavīryas Tod durch Paraśurāma", "category": "Mythos", "definition": "Nachdem Agni (dem Kārtavīrya sein ganzes Land als Almosen geschenkt hatte) Vasiṣṭhas Einsiedelei niederbrennt, verflucht Vasiṣṭha Kārtavīrya zum Tod durch Rāma Jāmadagnya (Paraśurāma) – der Fluch geht später in Erfüllung."}, {"term": "Die Haihaya-, Tālajaṅgha- und Yādava-Linien", "category": "Volk/Genealogie", "definition": "Aus Kārtavīryas fünf überlebenden Söhnen (Śūrasena, Śūra, Vṛṣaṇa, Madhu, Jayadhvaja) gehen zahlreiche Haihaya-Unterzweige hervor (Vītihotras, Sujātas, Bhojas, Avantyas, Tauṇḍikeras, Bharatas) sowie über Vṛṣa und Madhu die Yādava-/Mādhava-Linien."}, {"term": "Kroṣṭu und die dreifache Vṛṣṇi-Andhaka-Linie", "category": "Person/Genealogie", "definition": "Sohn des Yadu-Nachkommen (über die Sātvata-Linie); seine Söhne Anamitra, Vṛṣṇi und Andhaka begründen die drei Zweige des später als Vṛṣṇis und Andhakas bekannten Yādava-Geschlechts, aus dem Kṛṣṇa hervorgeht."}, {"term": "Śvaphalka und Akrūra", "category": "Person", "definition": "Śvaphalka, Sohn des Vṛṣṇi, dessen bloße Anwesenheit Dürren beendet; sein Sohn Akrūra ist ein tugendhafter Yādava-Fürst, der später auch Kṛṣṇa und Balarāma nach Mathurā holt (an dieser Stelle nur genealogisch erwähnt)."}, {"term": "Śūra, Vasudeva und Pṛthā/Kuntī", "category": "Person/Genealogie", "definition": "Śūra (Nachkomme Devamīḍhuṣas) ist der Vater Vasudevas (Kṛṣṇas Vater), der Pṛthā (Kuntī, Mutter der Pāṇḍavas Yudhiṣṭhira, Bhīma und Arjuna) und der Śrutaśravā (Mutter des Śiśupāla)."}, {"term": "Vasudevas vierzehn Gattinnen und seine Söhne", "category": "Person/Genealogie", "definition": "Unter Vasudevas vierzehn Frauen sind Rohiṇī (Mutter Balarāmas und der Subhadrā) und Devakī (Mutter Kṛṣṇas) die bekanntesten; das Kapitel listet auch Akrūras Sohn Satyaketu, Abhimanyu (Sohn Arjunas und der Subhadrā) und weitere Söhne."}, {"term": "Die Gārgya-Kālayavana-Geburtslegende", "category": "Mythos", "definition": "Obskure, knapp erzählte Episode: der fälschlich beschuldigte Weise Gārgya zeugt (mit göttlicher Hilfe Śivas) den überaus starken Kālayavana, der später als König der Yavanas Mathurā angreift und damit den Auszug der Vṛṣṇis und Andhakas nach Dvārakā auslöst."}, {"term": "Der Auszug von Mathurā nach Dvārakā (Kuśasthalī)", "category": "Mythos", "definition": "Aus Furcht vor Kālayavanas Heer verlassen die Vṛṣṇis und Andhakas unter Kṛṣṇas Führung Mathurā und siedeln sich in Kuśasthalī-Dvāravatī (Dvārakā) an – schließt Kapitel 14 mit einer Phalaśruti-Verheißung ab."}, {"term": "Jyāmaghas Prophezeiung und Vidarbha", "category": "Mythos", "definition": "König Jyāmagha, kinderlos verheiratet mit Śaibyā, nennt eine im Krieg gewonnene junge Frau vorab \"Schwiegertochter\" seines künftigen Sohnes, um den Zorn seiner Gattin abzuwenden; die Prophezeiung erfüllt sich, als Śaibyā selbst den Sohn Vidarbha gebiert, der später jene Frau heiratet."}, {"term": "Madhu und Satvata", "category": "Person/Genealogie", "definition": "Madhu, Nachkomme der Daśārha-Linie, ist Stammvater der Madhus (Mathurā); sein Sohn Satvata ist Stammvater der Sātvatas, aus denen über dessen fünf Söhne (Bhāgin, Bhajamāna, Devāvṛdha, Andhaka, Vṛṣṇi) die Vṛṣṇi- und Andhaka-Linien hervorgehen."}, {"term": "Devāvṛdha und die Flussgöttin Parṇāśā", "category": "Mythos", "definition": "Während seiner Askese am Fluss Parṇāśā verliebt sich die Flussgöttin in König Devāvṛdha, nimmt Jungfrauengestalt an und wird seine Gattin; ihr gemeinsamer Sohn ist Babhru."}, {"term": "Āhuka, Devaka und Ugrasena", "category": "Person/Genealogie", "definition": "Zwillingssöhne des Abhijit aus der Andhaka-Kukura-Linie; Devakas Tochter Devakī wird Vasudevas Gattin und Kṛṣṇas Mutter, Ugrasenas Sohn ist der später von Kṛṣṇa gestürzte Tyrann Kaṃsa."}, {"term": "Das Syamantaka-Juwel", "category": "Mythos", "definition": "Ein von Sūrya an Prasena verliehenes strahlendes Juwel, das Gold hervorbringt und Krankheit sowie Dürre fernhält; nach Prasenas Tod durch einen Löwen und dessen Erschlagung durch den Bärenkönig Jāmbavant löst der Streit um das Juwel Kṛṣṇas berühmten Kampf mit Jāmbavant aus."}, {"term": "Kṛṣṇas Kampf mit Jāmbavant", "category": "Mythos", "definition": "Zu Unrecht des Mordes an Prasena verdächtigt, sucht Kṛṣṇa das Syamantaka-Juwel, kämpft 21 Tage lang unbewaffnet mit dem Bärenkönig Jāmbavant in dessen Höhle, besiegt ihn, gewinnt dessen Tochter Jāmbavatī zur Frau und bringt das Juwel zurück, wodurch er von jedem Verdacht reingewaschen wird."}, {"term": "Satrājit und Satyabhāmā", "category": "Person", "definition": "Satrājit, Bruder des Prasena und Hüter des Syamantaka-Juwels nach dessen Rückgabe durch Kṛṣṇa, gibt aus Dankbarkeit seine Tochter Satyabhāmā (eine der acht Hauptgattinnen Kṛṣṇas) diesem zur Frau."}, {"term": "Akrūra/Babhru und der Juwelendiebstahl", "category": "Mythos", "definition": "Akrūra (Sohn der Gāndinī), aus Neid und Sorge, überredet zusammen mit seinem Bruder Śatadhanvan Satrājit zu ermorden und das Syamantaka-Juwel zu rauben. Der Text verwendet für Akrūra in dieser Episode wiederholt den Beinamen 'Babhru' (v.1, 24, 38-40), erkennbar als dieselbe Person an den Patronymika 'gāndīputra'/'gāndinīputra' (Sohn der Gāndinī)."}, {"term": "Kṛṣṇas Verfolgung Śatadhanvans", "category": "Mythos", "definition": "Nachdem Satyabhāmā Kṛṣṇa vom Mord an ihrem Vater Satrājit berichtet, verfolgt Kṛṣṇa mit Balarāma den fliehenden Śatadhanvan bis in die Nähe von Mithilā und erschlägt ihn; das Juwel findet sich jedoch nicht bei der Leiche, da Śatadhanvan es zuvor Akrūra/Babhru anvertraut hatte."}, {"term": "Der Bruch mit Balarāma", "category": "Mythos", "definition": "Balarāma, überzeugt, Kṛṣṇa habe das Juwel gefunden und für sich behalten, zürnt ihm und zieht sich für längere Zeit nach Mithilā zurück, wo er unter anderem Duryodhana im Keulenkampf unterrichtet (ein Vorverweis auf das Mahābhārata); die Entfremdung löst sich erst mit der späteren Aufklärung des wahren Diebs."}, {"term": "Die Akrūra-Opfer und die Rückgabe des Juwels", "category": "Mythos", "definition": "Akrūra/Babhru vollzieht mit dem Ertrag des Juwels 60 Jahre lang große Opfer in Dvārakā; als er die Stadt aus Furcht verlässt, bricht dort eine Dürre aus, die erst mit seiner Rückholung endet. Kṛṣṇa erkennt durch yogische Wahrnehmung, dass Akrūra das Juwel besitzt, lässt es sich zeigen und gibt es ihm sogleich zurück, sodass es endgültig bei Akrūra verbleibt, nicht bei Satrājits Familie."}, {"term": "Jambūdvīpa und die sieben Kontinente", "category": "Kosmographie", "definition": "Die klassische Purāṇa-Weltbeschreibung kennt sieben ringförmig von je einem eigenen Ozean (Salz, Zuckerrohrsaft, Wein, Ghee, Dickmilch, Milch, Süßwasser) umgebene Kontinente (Jambū, Plakṣa, Śālmala, Kuśa, Krauñca, Śāka, Puṣkara); Jambūdvīpa liegt im Zentrum und trägt in seiner Mitte den goldenen Weltenberg Meru."}, {"term": "Der Berg Meru und die neun Länder (varṣas)", "category": "Kosmographie", "definition": "Der goldene Weltenberg Meru (84.000 Yojanas hoch) bildet den Mittelpunkt Jambūdvīpas; um ihn gruppieren sich, getrennt durch Grenzberge, neun Länder: Ilāvṛta in der Mitte, umgeben von Bhārata (Indien), Kiṃpuruṣa, Harivarṣa, Ramyaka, Hiraṇmaya, Uttarakuru, Bhadrāśva und Ketumāla."}, {"term": "Der Jambū-Baum und die himmlische Gaṅgā", "category": "Mythos", "definition": "Der riesige, namensgebende Jambū-Baum auf dem Meru trägt elefantengroße Früchte, deren Saft den Fluss Jambūnadī speist und den Uferschlamm in das kostbare Gold Jāmbūnada verwandelt. Auf dem Meru-Gipfel liegt Brahmans Himmelsstadt, von der die Gaṅgā herabfällt und sich in vier Ströme (Sītā, Alakanandā, Cakṣu, Bhadrā) teilt, die in die vier Himmelsrichtungen zu den umliegenden Ozeanen fließen."}, {"term": "Viṣṇus achtfache Gegenwart in den äußeren Ländern", "category": "Mythos", "definition": "In jedem der acht äußeren Länder (außer Bhārata, wo er als Schildkröte weilt) weilt Viṣṇu in einer eigenen Gestalt – u.a. mit Pferdekopf in Bhadrāśva, als Eber in Ketumāla, als Fisch bei den Kurus –, während ihre Bewohner ein paradiesisches, von Leid, Krankheit und Zeitalter-Wandel freies Leben von zehn- bis zwölftausend Jahren führen."}, {"term": "Bhārata-varṣa als karmabhūmi", "category": "Kosmographie", "definition": "Von den neun Ländern Jambūdvīpas gilt Bhārata (Indien) als die einzige 'Wirkstätte' (karmabhūmi), auf der die vier Weltzeitalter wirken und rituelle Verdienste/Erlösung erworben werden können, während die übrigen Länder bloße 'Genussstätten' (bhogabhūmi) sind; laut einem eingeschobenen Götterlied (v.25-27) beneiden selbst die Götter die dort geborenen Menschen um ihre zuverlässige Wiedergeburtschance."}, {"term": "Die sieben Stammberge Bhāratas und ihre Flüsse", "category": "Kosmographie", "definition": "Mahendra, Malaya, Sahya, Śuktimant, Ṛkṣaparvata, Vindhya und Pāriyātra gelten als die sieben Stammberge (kulaparvatas) Bhāratas, denen die großen Flüsse entspringen (u.a. Śatadru/Candrabhāgā vom Himavant, Narmadā vom Vindhya, Godāvarī/Kṛṣṇaveṇī vom Sahya, Kāverī/Tāpī vom Ṛkṣa)."}, {"term": "Die sechs äußeren Kontinente (Plakṣa bis Puṣkara)", "category": "Kosmographie", "definition": "Ringförmig um Jambūdvīpa gelegen, jeweils doppelt so breit wie der vorhergehende Kontinent samt umgebendem Ozean: Plakṣadvīpa (umgeben vom Zuckerrohrsaft-Ozean), Śālmaladvīpa (Wein-Ozean), Kuśadvīpa (Ghee-Ozean), Krauñcadvīpa (Dickmilch-Molke-Ozean), Śākadvīpa (Milch-Ozean) und Puṣkaradvīpa (Süßwasser-Ozean) — jeder mit sieben von den Söhnen seines Herrschers benannten Ländern, sieben Grenzbergen, sieben Flüssen und den vier Kasten."}, {"term": "Puṣkaradvīpa, Mānasottara und die paradiesischen Zwillingsländer", "category": "Kosmographie", "definition": "Der ringförmige Berg Mānasottara teilt Puṣkaradvīpa in die zwei zeitlosen Länder Mahāvīta und Dhātakīkhaṇḍa, in denen Menschen und Götter gleichgestaltig sind, es weder Kasten, Wahrheit/Lüge, Tod noch Leid gibt und ein Banyan-Baum als höchster Wohnort Brahmans dient."}, {"term": "Der Weltenrand: Lokāloka und die kosmische Eischale", "category": "Kosmographie", "definition": "Jenseits Puṣkaradvīpas und des Süßwasser-Ozeans folgt eine lebewesenfreie goldene Zone, dann der Ringberg Lokāloka, umgeben von Finsternis, die wiederum von der kosmischen 'Eischale' (aṇḍakaṭāha) umschlossen wird; das gesamte Universum (Erde, Kontinente, Berge, Eischale) misst 50 Koṭi Yojanas und gilt als 'Dhātrī/Vidhātrī', Trägerin und Grundlage aller Welten."}, {"term": "Die sieben Unterwelten (Pātālas)", "category": "Kosmographie", "definition": "Atala, Vitala, Nitala, Sutala, Talātala, Rasātala und Pātāla, je 10.000 Yojanas tief gelegen; entgegen dem späteren düsteren Höllenbild werden sie hier als lichtvolle, paradiesische, mit Juwelen und Palästen geschmückte Reiche der Daityas, Dānavas und Nāgas geschildert, angeblich reizvoller als der Himmel."}, {"term": "Śeṣa/Ananta, der Weltenträger", "category": "Mythos", "definition": "Die tausendköpfige kosmische Schlange, Viṣṇus 'dunkler' (tāmasischer) Leib, die unterhalb der Unterwelten weilt, mit Saṃkarṣaṇa/Rudra identifiziert wird, am Weltzeitalter-Ende die drei Welten verschlingt, mit ihrem Haupt die gesamte Erde trägt und deren Gähnen Erdbeben verursacht; ihre Verehrung verschaffte dem Seher Garga die wahre Kenntnis der Astronomie/Astrologie."}, {"term": "Der Höllenkatalog (Raurava u.a.)", "category": "Kosmographie", "definition": "Aufzählung zahlreicher Narakas (Raurava, Śaukara, Rodha, Tāna, Viśasana, Mahājvāla, Taptakuḍya, Mahālobha, Vimohana, Rudhirāndha, Vasātapta, Kṛmīśa, Kṛmibhojana, Asipattravana, Kṛṣṇa, Lālābhakṣa, Pūyavaha, Vahnijvāla, Adhaḥśiras, Sadaṃśa, Kṛṣṇasūtra, Tamas, Avīci, Śvabhojana, Apratiṣṭha u.a.), denen jeweils bestimmte Sünden zugeordnet sind (Meineid, Embryotötung, Kuhtötung, Brahmanenmord, Inzest, Diebstahl, Veda-Verfälschung/-Handel, Waffenschmieden, Tierzucht zur Schlachtung, Wahrsagerei u.a.)."}, {"term": "Buße durch Erinnerung an Viṣṇu/Kṛṣṇa/Hari", "category": "Lehre", "definition": "Die Erinnerung (smaraṇa) an Viṣṇu/Kṛṣṇa/Hari wird als höchste, alle Sünden tilgende Buße (prāyaścitta) gelehrt, überlegen selbst der Indra-Herrschaft; sie wirkt unabhängig von rituellen Sühnehandlungen und öffnet den Weg aus den Höllen."}, {"term": "Philosophischer Abschluss: Glück/Leid als Geisteswandlung und jñāna als höchstes Brahman", "category": "Lehre", "definition": "Abschließende Reflexion (v.44-49): Himmel und Hölle sind letztlich nur Bezeichnungen für Verdienst (puṇya) und Sünde (pāpa); nichts ist an sich schmerzhaft oder angenehm, vielmehr handelt es sich um eine Wandlung (pariṇāma) des Geistes; wahre Erkenntnis (jñāna) allein gilt als das höchste Brahman, über Wissen (vidyā) und Nichtwissen (avidyā) hinaus."}, {"term": "Die Planetenordnung (Graha-Reihe)", "category": "Kosmographie", "definition": "Von der Erde aus aufsteigend: Sonne (100.000 Yojanas), Mond, Sternenscheibe, Budha (Merkur), Uśanas/Śukra (Venus), Aṅgāraka (Mars), Bṛhaspati ('Priester der Götter', Jupiter), Sauri/Śani (Saturn), die Sphäre der Sieben Weisen (Saptarṣi/Ursa Major) und zuoberst Dhruva, der Polarstern, als Achse (meḍhībhūta) des gesamten Sternenrades."}, {"term": "Die sieben oberen Welten (Bhūr bis Satya)", "category": "Kosmographie", "definition": "Bhūrloka (die Erde), Bhuvarloka (Zwischenraum Erde-Sonne), Svarloka (Zwischenraum Sonne-Dhruva) gelten als 'geschaffen' (kṛtaka); Janaloka (Wohnsitz der Brahmā-Söhne wie Sanandana), Tapoloka (körperlose Vairāja-Götter) und Satyaloka (frei von Wiedergeburt) gelten als 'ungeschaffen' (akṛtaka); Maharloka bildet die Zwischenstufe, die am Ende eines Weltzeitalters leer wird, aber nicht vergeht."}, {"term": "Die kosmische Eischale (aṇḍakaṭāha) und Viṣṇu als höchstes Brahman", "category": "Lehre", "definition": "Das Weltall (brahmāṇḍa) samt den sieben großen Welten und sieben Pātālas ist wie der Kern einer Kapittha-Frucht von konzentrischen, jeweils zehnfach größeren Hüllen umschlossen (Wasser, Feuer, Wind, Äther, Mahat), die im Pradhāna ruhen; unzählige solcher Welteneier existieren. Über Gleichnisse (Baum/Same, Reiskorn, Feuer im Holz) wird gelehrt, dass Pradhāna und Puruṣa durch die Kraft Viṣṇus (viṣṇuśakti) untrennbar verbunden sind und sich stufenweise entfalten; Viṣṇu/Hari selbst wird als das höchste Brahman identifiziert, aus dem alles entsteht, worin alles besteht und worein alles vergeht."}, {"term": "Die Śiśumāra-Sternfigur", "category": "Kosmographie", "definition": "Eine aus Sternen gebildete, delphin-/krokodilförmige Himmelsfigur (śiśumāracakra): in ihrem Schwanz befindet sich Dhruva (der Polarstern), in ihrem Herzen weilt Nārāyaṇa selbst als letzte Stütze. Durch Dhruvas Drehung werden Sonne, Mond, Planeten und Sternbilder wie durch Windfesseln gebunden im Kreis mitgeführt; Trägerkette: Nārāyaṇa trägt Śiśumāra, Śiśumāra trägt Dhruva, Dhruva trägt die Sonne, die Sonne den Regen, der Regen die ganze Welt."}, {"term": "Der Sonnen-Regen-Kreislauf und die Himmels-Gaṅgā", "category": "Kosmographie", "definition": "Die Sonne (Vivasvān/Savitṛ) entzieht acht Monate lang vierfaches Wasser (aus Flüssen/Ozeanen, Erde und Lebewesen), speist damit Mond und Wolken, aus denen geläuterter Regen fällt, der Pflanzen, Opfer und Götter nährt. Besonders heilig gilt das Wasser der 'Himmels-Gaṅgā' (Milchstraße), das ohne Wolken direkt im Sonnenlicht zur Erde fällt – ein 'himmlisches Bad', das Sünde tilgt und vor der Hölle bewahrt."}, {"term": "Die innere, geistige Pilgerfahrt", "category": "Lehre", "definition": "Vorangestellte Lehre des Tīrtha-Katalogs (Kap.25): wahre Reinigung geschieht nicht durch äußeres Baden, sondern durch geläuterten Geist, gezügelte Rede und beherrschte Sinne ('die im eigenen Körper gelegenen Pilgerstätten'); ein bösartiger, heuchlerischer Sinn bleibt trotz hundertfachem Bad unrein, während der Sinnenbeherrschte überall, wo er weilt, gleichsam an Kurukṣetra, Prayāga und Puṣkara ist."}, {"term": "Der große Tīrtha-Katalog des Brahma-Purāṇa", "category": "Kosmographie", "definition": "Umfangreiche Aufzählung von rund 350 Pilgerstätten, Wäldern, Bergen, Teichen und Brunnen auf der Erde (Kap.25, V.9-82), darunter die bekannten Orte Prayāga, Puṣkara, Naimiṣāraṇya, Gaṅgādvāra (Haridwar), Badarī/Badarikāśrama (Badrīnāth), Gayā, Prabhāsa, Kurukṣetra, Amarakaṇṭaka, Kāverī und Gokarṇa; die meisten übrigen Namen sind heute nicht mehr sicher lokalisierbar. Rechtes Baden, Verehrung und dreinächtiges Verweilen an jedem Tīrtha gewährt eine eigene Frucht bis hin zur Frucht des Pferdeopfers; schon das Hören oder Vortragen des Katalogs tilgt alle Sünde."}, {"term": "Karmabhūmi und Mokṣakṣetra", "category": "Lehre", "definition": "Die 'Erde der [wirksamen] Taten' (karmabhūmi), auf der rechtes Handeln zu höchster Vollendung, Missetat aber zur Hölle führt, und das schwer erreichbare 'Erlösungsgebiet' (mokṣakṣetra), an dem der kluge Mensch die Erlösung erlangt – Gegenstand der doppelt verschachtelten Rahmenerzählung in Kap.26: die Weisen fragen Lomaharṣaṇa, der von Vyāsas einstiger Befragung durch Weise bei Kurukṣetra erzählt, der wiederum von einer noch früheren Befragung Brahmās durch die Weisen auf dem Berg Meru berichtet."}, {"term": "Die Weisenversammlung bei Vyāsa (Kap.26)", "category": "Erzählung", "definition": "Rahmenerzählung: eine große Zahl namentlich genannter Weiser (u.a. Kaśyapa, Jamadagni, Bharadvāja, Gautama, Vasiṣṭha, Jaimini, Vālmīki, Viśvāmitra, Nārada, Kapila, Sanatkumāra) versammelt sich in Vyāsas Āśrama bei Kurukṣetra und befragt ihn, angesichts des als Ozean voller Krokodile, Strudel und Schlamm geschilderten Saṃsāra, nach dem Weg zur Erlösung; Vyāsa antwortet mit der Erzählung vom Gespräch der Weisen mit Brahmā auf dem Meru."}, {"term": "Bhārata-varṣa als Karmabhūmi, Svarga und Naraka zugleich", "category": "Lehre", "definition": "Brahmās Antwort auf die Frage der Weisen (Kap.27, V.1-9): Bhārata-varṣa ist die eine karmabhūmi, auf der durch rechtes Handeln der Himmel, durch Missetat die Hölle, und durch Wissen die Erlösung erlangt wird; selbst die Götter wünschen sich, als Mensch in Bhārata wiedergeboren zu werden, um dort Verdienst zu erwerben, den sie im Himmel nur genießen, aber nicht mehren können."}, {"term": "Die neun Unterteilungen (dvīpas) Bhāratas", "category": "Kosmographie", "definition": "Die durch das Meer getrennten neun Teile Bhārata-varṣas (Kap.27, V.14-18): Indradvīpa, Kaśeru, Tāmravarṇa, Gabhastimat, Nāgadvīpa, Saumya, Gāndharva und Vāruṇa als acht Inseln, sowie das von Meer umgebene Festland selbst als neunter Teil."}, {"term": "Die sieben Stammberge (kulaparvatas) und der Flusskatalog", "category": "Kosmographie", "definition": "Die sieben großen Gebirgsketten Bhāratas – Mahendra, Malaya, Sahya, Śuktimat, Ṛkṣaparvata, Vindhya und Pāriyātra – nebst zahlreichen kleineren Bergen (Kap.27, V.19-24), von denen die großen Flüsse Bhāratas entspringen: u.a. Gaṅgā, Sarasvatī, Sindhu (Indus), Yamunā, Narmadā und Godāvarī (V.25-40)."}, {"term": "Der Völkerkatalog Bhāratas", "category": "Kosmographie", "definition": "Ausführliche, nach Himmelsrichtungen geordnete Aufzählung der Völkerschaften (janapadas) Bhāratas – des Mittellandes, sowie der nördlichen, östlichen, südlichen und westlichen Gebiete, dazu der Vindhya- und Gebirgsbewohner (Kap.27, V.41-64); die meisten Namen sind heute nicht mehr sicher zuzuordnen."}, {"term": "Bhāratas Bogenform und Einzigartigkeit als sarvabīja-Karmabhūmi", "category": "Lehre", "definition": "Abschließendes Lob Bhārata-varṣas (Kap.27, V.65-80): seine Gestalt gleicht einem Bogen, dessen Sehne der Himalaya bildet; es ist die einzige 'Allsamen'-Erde (sarvabīja), auf der jede Geburtsklasse – von der Brahmanenwürde bis zum Pflanzendasein – durch Karma verdient wird; kein anderes Land kommt ihm gleich, und wer diese Beschreibung hört oder vorträgt, wird von aller Sünde befreit und gelangt zu Viṣṇus Welt."}, {"term": "Koṇāditya / Koṇārka", "category": "Kosmographie", "definition": "Die im Oṇḍra-Land (Utkala, heutiges Odisha) am südlichen Meeresufer verehrte Sonnengottheit 'Koṇāditya' ('Sonne der Ecke') und ihre Kultstätte Koṇārka (Kap.28) – der historische Sonnentempel von Koṇārka; der Text belegt die uralte Heiligkeit dieses Ortes durch eine ausführliche Beschreibung der dortigen Brahmanensiedlung, der Landschaft und einer detaillierten täglichen Arghya-Verehrungszeremonie für die Sonne."}, {"term": "Die Arghya-Verehrung der Sonne (Kap.28)", "category": "Ritual", "definition": "Ausführlich beschriebenes tägliches bzw. am siebten Tag der Monatshälfte vollzogenes Sonnenritual: Bad im Meer vor Sonnenaufgang, Reinigung, Zeichnung eines achtblättrigen Lotus mit rotem Sandelwasser, Maṇḍala-Verehrung an fünf Punkten (Mitte und vier Himmelsrichtungs-Blütenblätter) mit Hand- und Glied-Zuordnungsriten (kara-nyāsa, aṅga-vinyāsa), Darbringung der Ehrengabe (arghya) mit dreisilbigem Mantra, verheißt Heilung, Reichtum, Wissen, Nachkommenschaft und letztlich die Erlösung durch Vereinigung (yoga) mit der Sonne (Vivasvat/Ravi)."}, {"term": "Die Stufenlehre der Sonnen-Bhakti", "category": "Lehre", "definition": "Brahmās Definition von Hingabe (Kap.29): bhakti = die im Geist vollzogene Vorstellung/Versenkung, śraddhā = Glaube, dhyāna/samādhi = Meditation/Sammlung; aufsteigende Stufen des 'Anhängers' (bhakta) vom bloßen Anhören der Sonnen-Erzählung über das Gutheißen fremder Verehrung und das Nicht-Schmähen anderer Gottheiten bis zum ständigen, unwillkürlichen Gedenken der Sonne bei jeder Tätigkeit als höchste Form."}, {"term": "Arghya-, Lampen- und Fastenvorschriften für die Sonne", "category": "Ritual", "definition": "Ausführliche praktische Regelsammlung (Kap.29): Fasten- und Saptamī-Tage (insbesondere die 'Vijayā-Siebte' an einem auf Sonntag fallenden siebten Tag), Lampenspende mit strengen Reinheitsregeln (nur Ghee/Pflanzenöl, niemals tierisches Fett; eine brennende Lampe darf nicht geraubt werden), Salbung mit Safran/Aloeholz/Sandel, die tägliche Arghya-Darbringung mit genauer Richtungs- und Materialvorschrift (Gold, Kuh, Zugstier, Land, Gewand für die höchste Frucht) sowie Speiseopfer und Wasserspenden (mit Ghee, Milch, Dickmilch); die Frucht eines einzigen Tages der Sonnenverehrung übertrifft die von hundert vedischen Opfern."}, {"term": "Die zwölf Ādityas (Dvādaśāditya)", "category": "Kosmographie", "definition": "Die zwölf kosmischen Funktionsgestalten der einen Sonne (Kap.30): Indra (Königtum der Götter), Dhātā (Erschaffung der Geschöpfe), Parjanya (Regenwolken), Tvaṣṭṛ (Pflanzenwelt), Pūṣan (Nahrung), Aryaman (Windbewegung in den Göttern), Bhaga (Zeugungskraft), Vivasvat (Feuer/Kochen), Viṣṇu/Citrabhānu (Feindvernichtung), Aṃśumān (erfrischender Wind), Varuṇa (Gewässer) und Mitra (höchste unter ihnen, am Ufer des 'Mondflusses' waltend); zusammen durchdringen sie die ganze Welt."}, {"term": "Die Mitra-Nārada-Erzählung und die Puruṣa-Lehre", "category": "Lehre", "definition": "Eingebettete Erzählung (Kap.30, V.45-92): Nārada begegnet dem asketisch büßenden Gott Mitra und fragt, wen dieser als Höchsten verehre; Mitra enthüllt das 'höchste Geheimnis' – eine dichte, an Sāṅkhya und Upaniṣaden erinnernde Lehre vom Puruṣa/Kṣetrajña ('Feldkenner') als dem einen, alles durchdringenden, unbefleckten Selbst hinter aller Vielfalt (Hiraṇyagarbha, Buddhi, Mahat, Pradhāna, Viśvarūpa), mit wörtlichem Zitat des berühmten 'sarvataḥ pāṇipādam'-Verses (vgl. Bhagavadgītā 13,13)."}, {"term": "Die vierundzwanzig Namen und Monats-Ādityas der Sonne", "category": "Kosmographie", "definition": "Kap.31: zwölf allgemeine Namen der Sonne (Āditya, Savitṛ, Sūrya, Mihira, Arka, Prabhākara, Mārtaṇḍa, Bhāskara, Bhānu, Citrabhānu, Divākara, Ravi) sowie die zwölf Āditya-Gestalten, geordnet nach den zwölf Monaten (Viṣṇu-Caitra, Aryaman-Vaiśākha, Vivasvat-Jyeṣṭha, Aṃśumān-Āṣāḍha, Parjanya-Śrāvaṇa, Varuṇa-Bhādrapada, Indra-Āśvayuja, Dhātā-Kārttika, Mitra-Mārgaśīrṣa, Pūṣan-Pauṣa, Bhaga-Māgha, Tvaṣṭṛ-Phālguna), mit je eigener, zahlenmystisch angegebener Strahlenzahl."}, {"term": "Stavarāja – der 'König der Lobpreisungen'", "category": "Ritual", "definition": "Ein von Brahmā verkündeter, einundzwanzig Namen umfassender Sonnen-Lobpreis (Kap.31, V.31-33: Vikartana, Vivasvat, Mārtaṇḍa, Bhāskara, Ravi, Lokaprakāśaka u.a.), der ebenso wirksam sei wie die 'tausend Namen' der Sonne; bei täglicher Rezitation an den beiden Dämmerungen (Aufgang und Untergang) tilgt er alle geistig, sprachlich und körperlich entstandene Sünde und verleiht Körpergesundheit, Reichtum und Ruhm."}, {"term": "Der Mārtaṇḍa-Mythos: Aditis Askese und die Geburt aus dem 'toten Ei'", "category": "Mythologie", "definition": "Kap.32, V.1-47: Nach dem Verlust der drei Welten und der Opferanteile an die Daityas/Dānavas übt Aditi strenge Askese und besingt Savitṛ in seinen subtilen und groben Formen; die Sonne erscheint als schreckliche Feuermasse ('mahākūṭa') und verheißt Aditi, sich als tausendster Teil ihrer selbst als ihr Sohn zu inkarnieren, um die Dämonen zu vernichten. Während der Schwangerschaft übt Aditi fortgesetzt Kṛcchra-/Cāndrāyaṇa-Fasten; Kaśyapa wirft ihr vor, das Embryo-Ei zu 'töten' ('māritam'), worauf eine körperlose Stimme das geborene Kind 'Mārtaṇḍa' (vom 'toten Ei') nennt. Mārtaṇḍas bloße Strahlkraft vernichtet im folgenden Krieg die Asuras; er herrscht zunächst in einer undeutlichen, kadamba-blütenartigen Kugelgestalt."}, {"term": "Die Saṃjñā-Chāyā-Erzählung und der Fluch über Yamas Fuß", "category": "Mythologie", "definition": "Kap.32, V.48-107: Saṃjñā, Tochter des Viśvakarman/Tvaṣṭṛ, erträgt Vivasvats übermäßige Hitze nicht und erschafft ihren Schattendoppel Chāyā als heimliche Stellvertreterin, während sie selbst als Stute verkleidet nach Norden flieht. Chāyā, von der Sonne für Saṃjñā gehalten, gebiert weitere Kinder und bevorzugt sie; als ihr Sohn Yama die Mutter (Chāyā) mit dem Fuß bedroht, verflucht sie ihn, sein Fuß werde abfallen — ein Fluch, den die Sonne nicht aufheben, aber abmildern kann (Würmer fressen statt völligem Verlust des Fußes). Die Enttarnung Chāyās führt die Sonne zu Viśvakarman, der den wahren Grund (Saṃjñās Hitzeunverträglichkeit) offenbart."}, {"term": "Viśvakarmans Formung der Sonnengestalt auf der Drehscheibe (Śākadvīpa)", "category": "Mythologie", "definition": "Kap.32, V.90-107: Mit Vivasvats Einwilligung montiert Viśvakarman dessen übermäßige Strahlkraft in Śākadvīpa auf eine Dreh-/Schleifscheibe ('bhrami') und beginnt, sie abzutragen; das Weltall gerät in Aufruhr (die Erde steigt zum Himmel auf, Ozeane und Berge werden durcheinandergebracht, die Gestirne lösen sich von Dhruva). Brahmā, die Götter, die sieben Ṛṣis, die Vālakhilyas, Vidyādharas, Gandharven und Apsaras (Urvaśī, Tilottamā, Menakā, Rambhā u.a.) erflehen mit Lobpreis, die Strahlkraft möge 'erträglich' (sahya) werden; Viśvakarman trägt die Gestalt bis zum Knie ab und erschafft so eine noch schönere, aber nicht minder majestätische Form der Sonne."}, {"term": "Die kosmogonische Lobpreisung der Sonne (Kap.33)", "category": "Lehre", "definition": "Kap.33, V.1-26: Kurze Kosmogonie (aus den finsteren, formlosen Welten entstehen der Reihe nach Buddhi, Ahaṃkāra, die Elemente und das Weltei) und ein umfangreicher Lobpreis, der die Sonne mit allen Göttern (Brahmā, Viṣṇu, Rudra u.a.), Elementen, Zeitprinzipien und dem allseitigen Puruṣa ('überall Hände und Füße') identifiziert - dasselbe Motiv wie in Kap.30 und Bhagavadgītā 13,13. Die Götter erbitten und erhalten eine erträgliche Form der übermäßig feurigen Sonne."}, {"term": "Aṣṭottaraśatanāman – die 108 Namen der Sonne", "category": "Ritual", "definition": "Kap.33, V.32-49: Von Brahmā auf Bitten der Weisen verkündete Liste von 108 Namen der Sonne (u.a. Sūrya, Aryaman, Bhaga, Tvaṣṭṛ, Mārtaṇḍa-Verwandtes, die Planetennamen, die Weltzeitalter und Zeiteinheiten, Viśvakarman, Dhanvantari), abgeschlossen durch einen Lobpreis und eine Phalaśruti: tägliche Rezitation bei Sonnenaufgang verleiht Nachkommen, Reichtum, Erinnerung früherer Geburten, Gedächtnis, Befreiung von Kummer und Erfüllung der Wünsche."}, {"term": "Die Zerstörung von Dakṣas Opfer und Satīs Selbstverbrennung", "category": "Mythologie", "definition": "Kap.34, V.1-50: Dakṣa missachtet seine Tochter Satī, Śivas Gattin, zugunsten seiner mit den großen Ṛṣis vermählten Töchter, da er Rudra hasst. Von ihrem Vater vor versammelten Gästen erniedrigt, gibt Satī im Zorn ihren Körper durch innere Feuer-Askese (Agneyī-Dhāraṇā) auf. Śiva zerstört daraufhin Dakṣas Opfer; ein wechselseitiger Fluch zwischen Dakṣa und den sieben Ṛṣis (über Rudra vermittelt) führt zur menschlichen Wiedergeburt beider Parteien im Cākṣuṣa- und Vaivasvata-Manvantara."}, {"term": "Die drei asketischen Schwestern und die Namensgebung Umās", "category": "Mythologie", "definition": "Kap.34, V.51-101: Auf eine Vision Kaśyapas (verfluchte Ahnen, die durch einen Nachkommen des Himavat erlöst werden können) hin erwirkt Himavat durch Askese von Brahmā den Segen einer außergewöhnlichen Tochter - der Wiedergeburt Satīs. Die drei Schwestern Aparṇā, Ekaparṇā und Ekapāṭalā, benannt nach ihrer extremen Blatt-Diät, üben strengste Askese; als Aparṇā durch völligen Nahrungsverzicht die Welt in Brand zu setzen droht, ruft ihre Mutter Menā 'u mā' ('nicht so!') - die Volksetymologie des Namens Umā. Brahmā selbst hält sie von weiterer Askese ab und verkündet, dass Śiva sie zur Gattin wählen werde."}, {"term": "Śivas Werbung um Umā in entstellter Gestalt", "category": "Mythologie", "definition": "Kap.35, V.1-29: Śiva nähert sich Umā verkleidet als hässlicher, entstellter Brahmane, um ihre Beständigkeit zu prüfen. Sie wählt ihn trotz seiner Gestalt durch Überreichung eines Blütenstraußes; er segnet daraufhin den Aśoka-Baum ihres Āśramas, der fortan als 'Citrakūṭa' Aśvamedha-Frucht bzw. Erlösung verleiht, und verschwindet, um formell um Umā zu werben."}, {"term": "Das Kinderspiel Śivas am See und der Ursprung des Ṣaṣṭhī-Kultes", "category": "Mythologie", "definition": "Kap.35, V.30-64: Śiva lässt sich als scheinbar hilfloses Kind von einem Krokodil verschlingen; Umā eilt herbei, und das Krokodil verlangt als Lösegeld ihr gesamtes Askese-Verdienst (angeblich seit jeher als Bestimmung des sechsten Mondtags/Ṣaṣṭhī). Sie gibt es bedingungslos, das Krokodil wird davon verklärt und gibt den Knaben frei; Śiva verspricht ihr, das geschenkte Verdienst werde tausendfach zurückkehren. Erkennbar als Ursprungserzählung des Ṣaṣṭhī-Kultes; die Rezitation verheißt Rang eines Gaṇa-Herrn, Kumāra (Skanda) gleich."}, {"term": "Die Svayaṃvara und Ankunft der Götter in Kāvya-Pracht", "category": "Mythologie", "definition": "Kap.36, V.1-26: Himavat kündigt die Selbstwahl (Svayaṃvara) für Umā an; in kunstvoller Kāvya-Sprache (V.7-26, in vierpādigen Strophen aus Brahmās Ich-Perspektive) wird die prächtige Ankunft aller Götter geschildert - Indra auf Airāvata, Sūrya, Yama, Vāyu, Agni, Kubera, Candra, Viṣṇu auf Garuḍa, die Aśvins, Nāgas, Daityas und der Gandharva-König mit Apsaras-Gefolge."}, {"term": "Śivas Kindsgestalt-Prüfung und die Lähmung der Götter", "category": "Mythologie", "definition": "Kap.36, V.27-40: Śiva verwandelt sich in ein schlafendes, fünfgezopftes Kind in Umās Schoß, um die versammelten Götter zu prüfen. Indra und Bhaga versuchen vergeblich, es anzugreifen bzw. zu heben - ihre Waffen und Glieder werden gelähmt, bis Brahmā Śiva erkennt."}, {"term": "Brahmās Lobpreis und die Enthüllung der dreiäugigen Gestalt", "category": "Mythologie", "definition": "Kap.36, V.41-54: Brahmā besingt Śiva als Brahman/Puruṣa und alle Götter zugleich, Umā als Prakṛti; die gelähmten Götter nehmen Zuflucht, woraufhin Śiva sie heilt, seine strahlende dreiäugige Gestalt offenbart und ihnen ein besonderes 'Auge' verleiht, seinen Glanz zu ertragen. Umā legt ihm den Blütenkranz zu Füßen; Himavat und Śiva vereinbaren die Hochzeit."}, {"term": "Die Personifikation der sechs Jahreszeiten zur Hochzeit", "
