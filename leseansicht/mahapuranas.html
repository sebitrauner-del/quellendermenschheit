r Sūrya die Aufhebung des Mutterfluchs durch gemeinsame Verehrung Brahmās, Sūryas, Śivas und Viṣṇus an der Gautamī; Ursprung des Yama-Tīrtha mit Verheißungen für Wunscherfüllung und Ahnenerlösung."}, {"term": "Yakṣiṇī-Saṃgama-Tīrtha, Pippalās Spott und Fluch (Kap.132)", "category": "Erzählung/Tīrtha", "definition": "Kap.132: Pippalā, Schwester des Yakṣa-Fürsten Viśvāvasu, verspottet hochmütig die abgemagerten Weisen bei ihrem Opfer an der Gautamī und äfft deren Opferrufe nach; die Weisen verfluchen sie zu einem Fluss (Yakṣiṇī). Viśvāvasu verehrt die Weisen und Śiva und lässt den Fluss mit der Gautamī zusammenfließen, wodurch der Fluch aufgehoben wird. Ursprung des Yakṣiṇī-Saṃgama-Tīrtha, zugleich höchstes Śiva-/Durgā-Tīrtha und als Essenz aller wichtigen Tīrthas gepriesen."}, {"term": "Śukla-Tīrtha, Bharadvāja und der Rākṣasa Havyaghna (Kap.133)", "category": "Erzählung/Tīrtha", "definition": "Kap.133: Aus dem Rauch eines Opferkuchens entsteht der schwarze, opferverzehrende Rākṣasa Havyaghna/Yajñaghna, von Brahmā verflucht, aber auch mit dem Segen ausgestattet, Opfer verzehren zu dürfen. Der Weise Bharadvāja erfährt, dass nur eine Besprengung mit Amṛta den Rākṣasa entfluchen kann; da der Fluch verlangt, offenbart Havyaghna selbst, dass das Wasser der Gautamī das wahre, alle anderen Amṛta-Gleichnisse übertreffende Amṛta ist. Die Besprengung macht Havyaghna (und das gesamte Opfer) weiß; der ins Wasser geworfene Opferpfahl ist noch sichtbar. Ursprung des Śukla-Tīrtha im Daṇḍaka-Wald, ein Tor zum Himmel, mit 7000 weiteren Tīrthas an beiden Ufern."}, {"term": "Cakra-Tīrtha, die Māyā-Frau Muktakeśī und Viṣṇus Diskus (Kap.134)", "category": "Erzählung/Tīrtha", "definition": "Kap.134: Rākṣasas stören ein Sattra-Opfer der sieben Weisen an der Gautamī. Brahmā erschafft die Māyā-Frau Muktakeśī, deren Anblick die Rākṣasas zunächst bezwingt; als der Daitya-Fürst Śambara sie dennoch verschlingt und das Opfer erneut angreift, fliehen die Weisen zu Viṣṇu, der ihnen seinen Diskus Sudarśana gibt. Dieser vernichtet die Rākṣasas, Daityas und Danujas; das Opfer wird vollendet, der im Gaṅgā-Wasser gereinigte Diskus gibt dem Cakra-Tīrtha seinen Namen, mit 500 weiteren sündentilgenden Tīrthas."}, {"term": "Vāṇī-Saṃgama-Tīrtha, Brahmās Lüge und das fünfte Haupt (Kap.135)", "category": "Erzählung/Tīrtha", "definition": "Kap.135: Beim Streit Brahmās und Viṣṇus um die gegenseitige Überlegenheit erscheint Śiva als endlose Lichtsäule; wer ihr Ende erblickt, soll der Größere sein. Da keiner von beiden das Ende erreicht, erschafft sich Brahmā ein fünftes (Esels-)Gesicht, um damit fälschlich zu behaupten, er habe es gesehen - Ursprung von Brahmās fünftem Haupt (vgl. Kap.113, Kap.129 V.70). Hari und Hara vereinigen sich daraufhin zu einer Gestalt und verfluchen die mitschuldige göttliche Stimme (Vāc), zu einem Fluss zu werden; sie wird entflucht, sobald sie mit der Gaṅgā zusammenfließt - an der Bhāgīrathī als Sarasvatī, an der Gautamī als Vāṇī. Ursprung des Vāṇī-/Sarasvatī-Saṃgama-Tīrtha mit 1900 weiteren Tīrthas."}, {"term": "Viṣṇu-/Maudgalya-Tīrtha, der Weise Maudgalya und die Lehre von Karma und Spende (Kap.136)", "category": "Erzählung/Tīrtha", "definition": "Kap.136: Der Weise Maudgalya ruft täglich Viṣṇu an die Gautamī, der leibhaftig erscheint und mit ihm verweilt. Seine Frau Jābālā fragt, warum trotz dieser Gegenwart ihre Armut fortbesteht; Viṣṇu erklärt die unausweichliche Wirkung des eigenen Karmas und weist darauf hin, dass Maudgalya nie gespendet habe - nur mit Gedenken an Viṣṇu gegebene Spenden seien unvergänglich. Da Maudgalya nichts mehr zu geben hat, lässt Viṣṇu durch Garuḍa eine einzige Getreideähre holen und gewährt daraufhin sieben Generationen von Maudgalyas Nachkommen alle Wünsche; die Familie erlangt Genuss und Erlösung. Ursprung des Viṣṇu-/Maudgalya-(Vaiṣṇava-)Tīrtha mit 11000 weiteren Tīrthas."}, {"term": "Lakṣmī-Tīrtha, der Streit zwischen Lakṣmī und Daridrā (Kap.137)", "category": "Erzählung/Tīrtha", "definition": "Kap.137: Lakṣmī (Glück/Reichtum) und Daridrā (Armut) streiten um den Vorrang - Lakṣmī betont, dass Ansehen nur beim Nichtbittenden bestehe, Daridrā, dass sie bei den Rechtschaffenen wohne, während Lakṣmī meist bei Sündern zu finden sei. Brahmā verweist den Streit an die personifizierte Gautamī (Gaṅgā), die vor Erde, Gewässern und Weltenhütern Lakṣmī als alldurchdringende Grundlage allen Schönen und Erstrebenswerten preist und Daridrā fortweist; seither ist die Gaṅgā der Armut feindlich. Ursprung des Lakṣmī-Tīrtha ('Vernichtung der Alakṣmī') mit 6000 weiteren Tīrthas."}, {"term": "Bhānu-Tīrtha, König Śaryāti und der Hauspriester Madhucchandā (Kap.138)", "category": "Erzählung/Tīrtha", "definition": "Kap.138: König Śaryāti prüft die Liebe seiner Gattin, indem er eine falsche Unglücksnachricht senden lässt; sowohl seine Frau als auch die des Hauspriesters Madhucchandā sterben vor Schreck. An der Gautamī opfert Śaryāti sich selbst im Feuer, wodurch die Frau des Priesters wiederbelebt wird. Der zurückkehrende Madhucchandā besingt daraufhin die Sonne (Sūrya/Bhānu), die den König und beide Frauen ins Leben zurückbringt. Ursprung des Bhānu-Tīrtha (auch 'Wiederbelebung der Toten', Śāryāta- oder Mādhucchanda-Tīrtha) mit 3000 weiteren Tīrthas."}, {"term": "Khaḍga-Tīrtha, Pailūṣa und das Schwert des Wissens (Kap.139)", "category": "Erzählung/Tīrtha", "definition": "Kap.139: Pailūṣa, von Familienlast und vergeblichem Erwerbsstreben erschöpft, wendet sich der Entsagung zu. Auf Rat seines Vaters Kavaṣa verehrt er Śiva und erlangt Wissen, woraufhin er Lehrverse über die Überwindung von Zorn, Gier, Anhaftung, Zweifel und Begierde mit dem 'Schwert des Wissens' verkündet, die zur Einheit mit Śiva und zur Erlösung zu Lebzeiten führen. Ursprung des Khaḍga-Tīrtha (auch Jñāna-, Kavaṣa- oder Pailūṣa-Tīrtha) mit 6000 weiteren Tīrthas."}, {"term": "Ātreya-/Anvindra-Tīrtha, der Weise Ātreya und seine Indra-Verwechslung (Kap.140)", "category": "Erzählung/Tīrtha", "definition": "Kap.140: Der Weise Ātreya erlangt durch ein Sattra-Opfer und eine Śiva-Verehrung an der Gautamī übernatürliche Reisefähigkeit, besucht Indras Himmel und wird von dessen Pracht verblendet. Er zwingt Tvaṣṭṛ (Viśvakarman), ihm ein identisches Indra-Paradies zu erschaffen. Daityas und Rākṣasas greifen die vermeintliche Indra-Stadt an; Ātreya rezitiert einen Hymnus an den wahren Indra (zitiert Ṛgveda 2.12.1) und gesteht seinen Irrtum. Tvaṣṭṛ macht alles rückgängig; die Götter trösten den beschämten Ātreya mit der Verheißung, dass alle, die am Ātreya-Tīrtha baden, künftige Indras werden ('Anvindra' = 'künftiger Indra')."}, {"term": "Kapilā-Saṃgama-Tīrtha, König Vena, der Weise Kapila und König Pṛthu (Kap.141)", "category": "Erzählung/Tīrtha", "definition": "Kap.141: Nach dem Tod des unrechtmäßigen Königs Vena durch Brahmanenflüche herrscht Anarchie. Auf Rat des Weisen Kapila quirlen die Weisen Venas Schenkel (Ursprung des Niṣāda-Volkes) und seinen Arm (Ursprung König Pṛthus). Pṛthu zwingt die Erde, die Nahrung der Geschöpfe verschlungen hat, ihm diese in Gestalt von Milch zu geben; sie nimmt Kuhgestalt an und wird an mehreren heiligen Flüssen, besonders der Godāvarī, gemolken. Ursprung des Kapilā-Saṃgama-Tīrtha mit 88.000 weiteren Tīrthas."}, {"term": "Devasthāna-Tīrtha, Rāhu und sein Enkel Meghahāsa (Kap.142)", "category": "Erzählung/Tīrtha", "definition": "Kap.142: Aus der Daitya-Frau Siṃhikā entsteht Rāhu, der bei der Entstehung des Amṛta gespalten wird. Sein Sohn Meghahāsa übt aus Trauer Askese an der Gautamī, bis Götter und Weise ihn zum Aufgeben bewegen, indem sie ihn zum Herrn der Rākṣasas erheben und ihm die Tīrtha zueignen, die fortan Devasthāna (Deva-Tīrtha) heißt, mit 18 weiteren, von den Daityas verehrten Tīrthas."}, {"term": "Siddha-Tīrtha, Rāvaṇa und das Erschüttern des Kailāsa (Kap.143)", "category": "Erzählung/Tīrtha", "definition": "Kap.143: Rāvaṇa wird von Brahmā mit einem 108-Namen-Mantra Śivas vom Krieg gegen den Mond abgehalten. Auf dem Rückweg will er stolz den Kailāsa nach Laṅkā versetzen und bringt ihn ins Schwanken; Śiva zerquetscht ihn mit dem Zeh, gewährt ihm aber, erweicht durch dessen Klage, gnädig ein Schwert sowie Vollkommenheit und Wohlstand. Ursprung des mächtigen, sündenvernichtenden Siddha-Tīrtha."}, {"term": "Paruṣṇī-Saṃgama-Tīrtha, Aṅgiras, Ātreyī und Agnis Rat (Kap.144)", "category": "Erzählung/Tīrtha", "definition": "Kap.144: Atris Tochter Ātreyī, mit dem aus Agnis Glutkohlen entstandenen, stets barschen Weisen Aṅgiras vermählt, klagt ihrem Schwiegervater Jvalana (Agni). Dieser rät ihr, ihn bei erneutem Zorn mit Wasser zu überfluten. Nach einem Disput über Mutter- und Gattinrolle folgt sie dem Rat; beide werden besänftigt, und Ātreyī wird zum mit der Gaṅgā vereinten Fluss Paruṣṇī. Ursprung des Paruṣṇī-Saṃgama-Tīrtha mit 3000 weiteren Tīrthas."}, {"term": "Mārkaṇḍeya-Tīrtha, der Streit der Weisen über Wissen und Handeln (Kap.145)", "category": "Erzählung/Tīrtha", "definition": "Kap.145: Weise wie Mārkaṇḍeya, Bharadvāja, Vasiṣṭha, Atri und Yājñavalkya streiten, ob Erlösung durch Wissen (jñāna) oder Handeln (karma) erlangt wird. Nach Befragung Brahmās und Viṣṇus entscheidet Śiva an der Gaṅgā zugunsten des Handelns: Wissen selbst sei nur eine Form des Handelns. Ursprung des nach Mārkaṇḍeya benannten Tīrtha mit 98 weiteren Tīrthas am Nordufer der Gaṅgā, heilig für die Ahnen."}, {"term": "Kālañjara-(Yāyāta-)Tīrtha, König Yayāti, Devayānī und Śarmiṣṭhā (Kap.146)", "category": "Erzählung/Tīrtha", "definition": "Kap.146: König Yayāti wird von seinem Schwiegervater Śukra zu vorzeitigem Greisenalter verflucht, nachdem sich dessen Tochter Devayānī über die Nebenfrau Śarmiṣṭhā beklagt hat. Śukra gewährt, das Alter auf einen willigen Sohn zu übertragen; nur der jüngste Sohn Pūru nimmt es an, die älteren Brüder Yadu, Turvasu, Druhyu und Anu lehnen ab und werden verflucht. Nach 1000 Jahren gibt Yayāti Pūru die Jugend zurück und erlangt durch Askese an der Gautamī von Śiva die Vernichtung des Alters und die Befreiung der Brüder vom Fluch. Ursprung des Kālañjara-Tīrtha (auch Yāyāta, Nāhuṣa, Paura, Śaukra, Śārmiṣṭha) mit 108 weiteren Tīrthas."}, {"term": "Apsaro-Yuga-Tīrtha, Viśvāmitra und die Apsaras Gambhīrā/Atigambhīrā (Kap.147)", "category": "Erzählung/Tīrtha", "definition": "Kap.147: Nach Menakās früherer Verführung übt Viśvāmitra erneut Askese an der Gautamī. Indra sendet die Apsaras Gambhīrā und Atigambhīrā, ihn durch Tanz zu stören; der erzürnte Weise verflucht sie zu fließender Gestalt, gewährt ihnen aber, bei Vereinigung mit der Gaṅgā göttliche Gestalt zurückzuerlangen. Ursprung des Apsaro-Yuga- (Apsarā-Saṃgama-) Tīrtha, wo Śiva sichtbar weilt und Genuss und Erlösung gewährt."}, {"term": "Koṭi-Tīrtha, der Weise Kāṇva und das erloschene Opferfeuer (Kap.148)", "category": "Erzählung/Tīrtha", "definition": "Kap.148: Der Weise Kāṇva (Bāhlīka) opfert an der Gautamī, als sein Feuer zwischen zwei Opferspenden erlischt. Eine göttliche Stimme weist ihn an, in den halbverbrannten Scheiten weiterzuopfern, mit der Begründung, dass eine Gabe an den 'Sohn' (die Glut) ebenso den 'Vater' (das ursprüngliche Feuer) erfreut - daher wird jede dort vollzogene Handlung zehnmillionenfach (koṭi) belohnt. Ursprung des Koṭi-Tīrtha (auch Vāṇī-Tīrtha) mit 49 weiteren Tīrthas."}, {"term": "Nārasiṃha-Tīrtha, Hiraṇyakaśipu und der Dämon Ambarya (Kap.149)", "category": "Erzählung/Tīrtha", "definition": "Kap.149: Nach der Tötung Hiraṇyakaśipus zieht Narasiṃha durch alle Welten und vernichtet die Daityas in jeglicher Gestalt. An der Gautamī besiegt er den Dämonenfürsten Ambarya von Daṇḍaka. Ursprung des Nārasiṃha-Tīrtha am Nordufer der Gaṅgā, berühmt in den drei Welten, mit acht weiteren großen Tīrthas, als der höchsten unter allen Tīrthas gepriesen."}, {"term": "Paiśāca-Tīrtha, Jīgarti und sein verkaufter Sohn Śunaḥśepa (Kap.150)", "category": "Erzählung/Tīrtha", "definition": "Kap.150: Der hungernde Brahmane Jīgarti verkauft seinen Sohn Śunaḥśepa zur Opfertötung und wird dafür nach dem Tod zu einem leidenden Piśāca. Śunaḥśepa, später Adoptivsohn Viśvāmitras, hört den klagenden Vater, badet an der Gautamī und erlöst ihn durch eine Wasserspende zu himmlischer Gestalt im Wohnort Viṣṇus. Ursprung des Paiśāca-Tīrtha, das Piśāca-Existenz und Krankheit vernichtet, mit 300 weiteren Tīrthas."}, {"term": "Nimnabheda-Tīrtha, König Purūravas (Aila) und Urvaśī (Kap.151)", "category": "Erzählung/Tīrtha", "definition": "Kap.151: König Aila (Purūravas) verliert die Apsaras Urvaśī, als sie ihn wider eine vereinbarte Bedingung unbekleidet erblickt. Sein Hauspriester Vasiṣṭha tröstet ihn mit einer Rede über die Wankelmütigkeit der Frauen und die Zuflucht bei Śiva, Viṣṇu und der Gautamī. An der Gautamī vollzieht der König Opfer, wodurch die Veda-Insel entsteht, wo Urvaśī fortan an jedem Vollmond erscheint. Ursprung des Nimnabheda-Tīrtha (auch Aila-, Purūravas- oder Vāsiṣṭha-Tīrtha) mit 700 weiteren Tīrthas."}, {"term": "Nandītaṭa-(Ānanda-)Tīrtha, Candra, Tārā und Bṛhaspatis Zorn (Kap.152)", "category": "Erzählung/Tīrtha", "definition": "Kap.152: Candra raubt Tārā, die Gattin seines Lehrers Bṛhaspati. Śukra verflucht Candra zur Aussätzigkeit (Ursprung des Mondflecks) und erzwingt die Rückgabe. Tārā badet mit Bṛhaspati an der Gautamī und wird gereinigt; Bṛhaspati preist die Gautamī als besonders machtvoll, wenn Jupiter im Zeichen des Löwen steht (Kumbh-Mela-Bezug). Ursprung des Nandītaṭa- (Ānanda-) Tīrtha, benannt nach Śivas Stier Nandī, mit 5000 weiteren Tīrthas."}, {"term": "Bhāva-Tīrtha, König Prācīnabarhis und die Geburt Mahimās (Kap.153)", "category": "Erzählung/Tīrtha", "definition": "Kap.153: König Prācīnabarhis vollzieht ein Opfer um einen Sohn; Śiva lässt ihn an der Gautamī in sein drittes Auge blicken, dessen Glanz zum Sohn Mahimā wird - dem Verfasser des berühmten Lobpreises 'Mahimnaḥ Stotra'. Ursprung des Bhāva-Tīrtha, das für sündenbeladene, kranke und leidgeprüfte Menschen den Vorrang unter allen Tīrthas erhält, mit 70 weiteren heiligen Tīrthas."}, {"term": "Sahasrakuṇḍa-Tīrtha, Rāmas zweite Verstoßung Sītās und die Buße an der Gautamī (Kap.154)", "category": "Erzählung/Tīrtha", "definition": "Kap.154: Trotz bestandener Feuerprobe wird Sītā aufgrund neuer Verleumdungen ein zweites Mal - schwanger - verstoßen und lebt bei Vālmīki. Beim Aśvamedha erkennt Rāma seine Söhne Lava und Kuśa erst am Vortrag des vollständigen Rāmāyaṇa. Das heimkehrende Vānara-Heer (Sugrīva, Hanumān, Aṅgada, Jāmbavān, Vibhīṣaṇa) findet Sītā nicht mehr vor; Rāma zieht in Trauer mit Bruder und Volk an die Gautamī, badet, verehrt Śiva und vollzieht ein Feueropfer in tausend Kuṇḍas (Sahasrakuṇḍa), wodurch er von aller Reue befreit wird. Anm.: Diese Fassung weicht von bzw. verdichtet die geläufige Rāmāyaṇa-Erzählung eigenständig ab."}, {"term": "Kapila-Tīrtha, die Landgabe an die Aṅgirasen und der Rückkauf (Kap.155)", "category": "Erzählung/Tīrtha", "definition": "Kap.155: Die Ādityas geben den Aṅgirasen als Opferlohn Land, das zur menschenverschlingenden „Saiṃhikī“ wird (Anklang an die Dämonenmutter Siṃhikā). Da ein gegebener Opferlohn nicht zurückgenommen werden darf, kaufen die Ādityas das Land mit einer Kapilā-Kuh zurück. Ursprung des Flusses Kapilā, des Kapilā-Saṃgama und des Go-Tīrtha (100 Tīrthas gleichwertig); auch Āṅgirasa-, Āditya- und Saiṃhikeya-Tīrtha genannt."}, {"term": "Śaṅkha-Tīrtha, Viṣṇus Rettung Brahmās vor den Rākṣasas (Kap.156)", "category": "Erzählung/Tīrtha", "definition": "Kap.156: Brahmā erzählt in Ich-Form, wie ihn zu Beginn des Kṛtayuga aus dem Weltei-Haus entstandene, vielgestaltige Rākṣasas verschlingen wollten; Viṣṇu rettete ihn, zerschnitt die Dämonen mit dem Diskus und blies sein Muschelhorn (śaṅkha), wodurch die übrigen Rākṣasas restlos vernichtet wurden. Ursprung des Śaṅkhahrada/Śaṅkha-Tīrtha, dem 10.000 weitere Tīrthas gleichgesetzt werden."}, {"term": "Kiṣkindhā-Tīrtha, Rāmas Rückkehr und die Liṅga-Episode (Kap.157)", "category": "Erzählung/Tīrtha", "definition": "Kap.157: Nach Rāvaṇas Tod kehrt Rāma mit Sītā, Lakṣmaṇa, Vibhīṣaṇa und dem Affenheer im Puṣpaka-Wagen zurück, erblickt die Gautamī/Godāvarī und hält eine Lobrede auf sie. Auf Vibhīṣaṇas Bitte verweilt man länger und besucht das Siddheśvara-Tīrtha, wo selbst Hanumān einen von Śiva-Verehrern aufgestellten Liṅga nicht bewegen kann; erst Rāma selbst verneigt sich ehrfürchtig vor allen Liṅgas. Ursprung des Kiṣkindhā-Tīrtha."}, {"term": "Vyāsa-Tīrtha, die Aṅgirasen und der ,Wissensspender' (Kap.158)", "category": "Erzählung/Tīrtha", "definition": "Kap.158: Brahmās erste zehn geistgeborene Söhne verschwinden bei der Erkundung der Erde. Die daraufhin geborenen Aṅgirasen üben Askese ohne Erlaubnis ihrer Mutter und werden von ihr verflucht, sodass ihre Askese misslingt. Agastya weist sie an die Gaṅgā, wo sie durch die Verehrung des ,Wissensspenders' (jñānada) - eine monistische Identitätslehre von Wasser/Agni/Sonne/Viṣṇu bzw. Brahmā/Rudra - Erfolg erlangen und zu künftigen ,Vyāsas' werden, die bei jedem Niedergang von Dharma und Veda helfend eingreifen. Ursprung des Vyāsa-Tīrtha."}, {"term": "Vañjarā-Saṃgama-Tīrtha, Garuḍas Knechtschaft und das alters­heilende Rasātala-Wasser (Kap.159)", "category": "Erzählung/Tīrtha", "definition": "Kap.159: Vinatā und ihr Sohn Garuḍa geraten durch eine verlorene Wette in die Knechtschaft der Schlangenmutter Kadrū. Bei einer von Kadrū erzwungenen Fahrt zur Sonne auf Garuḍas Rücken werden die Schlangen von der Sonnenglut versengt und stürzen ab. Vinatā heilt sie daraufhin mit dem von Garuḍa aus Rasātala geholten, von Indras Regen vermehrten Wasser vom Alter (jarā). Ursprung des Nāgālaya, des Flusses Vañjarā und seines Zusammenflusses mit der Gaṅgā."}, {"term": "Devāgama-Tīrtha, der Götter-Asura-Krieg um die Erde (Kap.160)", "category": "Erzählung/Tīrtha", "definition": "Kap.160: Die Asuras (Ahi, Vṛtra, Bali, Namuci, Śambara, Maya u.a.) vertreiben die Götter von der Erde und rauben ihnen die Opferanteile. Nach einer verlorenen Schlacht am Malaya-Berg im Süden weist eine körperlose Himmelsstimme die verzweifelten Götter an, an der Gautamī Hari und Hara (Viṣṇu und Śiva) zu verehren; durch deren Gnade erringen sie den Sieg. Ursprung des Devāgama- (auch Devapriya-)Tīrtha mit 80.000 Śiva-Liṅgas."}, {"term": "Kuśatarpaṇa- und Praṇītā-Saṃgama-Tīrtha, Brahmās Puruṣa-Opfer (Kap.161)", "category": "Erzählung/Tīrtha", "definition": "Kap.161: Brahmās eigene Erzählung seiner Kosmogonie: Nach seiner Geburt aus dem Lotus kann er nichts sehen und nicht mit der Schöpfung beginnen, bis eine körperlose göttliche Stimme (Viṣṇus, als daivī vāk/Prakṛti gedeutet) ihn zu einem Opfer (yajña) anweist, mit der Lehre ,yajño vai viṣṇuḥ' (das Opfer ist Viṣṇu). Auf der Suche nach einer geeigneten Opferstätte (karmabhūmi), da es noch keine Flüsse gab, wählt Brahmā den Sahya-/Brahmagiri-Berg im Daṇḍakāraṇya. Er teilt seinen eigenen Körper in sich selbst und seine Gattin; Jahreszeiten, Metren und Zeiteinheiten werden zu Opfergeräten (Brennholz, Opfergaben, Kuśagras, der Opferpfahl/yūpa als die Zeit selbst, die Guṇa-Stricke). Da kein Opfertier (paśu) vorhanden ist, bietet sich Prakṛti selbst als paśu an und wird am ,Zeit-Yūpa' gebunden. Aus dem so geopferten Puruṣa (der als Viṣṇu in weißer, dunkler und gelber Gestalt in den drei Opferfeuern erscheint) entstehen die Kasten, die Götter, Sonne und Mond und der Kosmos (nach dem Muster des Puruṣa-Sūkta). Aus dem Opferpfahl entsteht der unvergängliche Banyanbaum, aus dem Opfergefäß der Fluss Praṇītā, und aus den beim Reinigen des Kuśagrases abgeschüttelten Wassertropfen das Kuśatarpaṇa-Tīrtha; beide vereinigen sich später mit der Gautamī."}, {"term": "Manyu-Tīrtha, Śivas Erschaffung des Zorn-Gottes Manyu (Kap.162)", "category": "Erzählung/Tīrtha", "definition": "Kap.162: Im Kampf gegen die Dānavas unterliegen die Götter und verehren auf Brahmās Anweisung an der Gautamī den Gott Maheśvara. Dieser erschafft aus seinem eigenen Glanz (durch sein drittes Auge) den schrecklichen Manyu (,Zorn') als Heerführer der Götter. Manyu offenbart sich als alldurchdringende, mit Rudra/Śiva wesensgleiche Kraft (der Zorn bzw. die Tatkraft in allen Wesen) und verhilft den Göttern zum Sieg. Ursprung des Manyu-Tīrtha an der Gautamī, wo Śiva in Manyu-Gestalt fortwährend gegenwärtig sei."}, {"term": "Sārasvata-Tīrtha, der Muni Śākalya und der Rākṣasa Paraśu (Kap.163)", "category": "Erzählung/Tīrtha", "definition": "Kap.163: Der büßende Brahmane Śākalya am Berg Śubhra wird vom gestaltwandelnden, brahmanenfeindlichen Rākṣasa Paraśu heimgesucht. Als Bettel-Brahmane bewirtet, gibt sich Paraśu als Rākṣasa zu erkennen und will Śākalya verspeisen; dieser bietet sich gelassen dar und spricht eine Schutzformel, in der seine Glieder den Formen Viṣṇus zugeordnet werden. Paraśu erblickt daraufhin in Śākalya eine kosmische Viṣṇu-Gestalt, bereut und wird auf dessen Rat durch die Verehrung der Göttin Sarasvatī und, durch deren Gnade, des Gottes Janārdana (Viṣṇu) erlöst. Ursprung des Sārasvata-Tīrtha an der Gautamī."}, {"term": "Ciccikā- und Gadādhara-Tīrtha, König Pavamāna und der zweiköpfige Vogel-Brahmane (Kap.164)", "category": "Erzählung/Tīrtha", "definition": "Kap.164: Der Herrscher Pavamāna trifft auf dem Berg Śubhra am Gaṅgā-Ufer den fleischfressenden, zweiköpfigen Vogel Ciccika, der ihm offenbart, einst ein heuchlerischer, verräterischer Brahmane gewesen zu sein und nun als niemals gesättigter, ruheloser Vogel gestraft zu sein. Er trägt eine Aufzählung brahmahatyā-gleicher Sünden vor (Verrat, Lehrerverachtung, Verleumdung von Veda und Dharma). Vom König zum Gadādhara-Tīrtha geführt, badet er in der Gaṅgā, fleht sie um Erlösung an und erlangt durch ihre und Gadādharas (Viṣṇus) Gnade den Himmel. Ursprung des nach Pavamāna und Ciccika benannten Tīrtha, auch Gadādhara-Koṭitīrtha genannt."}, {"term": "Bhadra-Tīrtha, Viṣṭi, Viśvarūpa und der Sohn Harṣaṇa (Kap.165)", "category": "Erzählung/Tīrtha", "definition": "Kap.165: Sūryas furchterregende Tochter (bzw. Śanaiścaras Schwester) Viṣṭi belehrt ihren Vater über die Pflicht rechtzeitiger, ehrenhafter Töchterverheiratung und wird mit dem ebenso furchterregenden Viśvarūpa vermählt. Aus dieser Ehe gehen mehrere zornige Söhne und, als jüngster, der tugendhafte Harṣaṇa hervor, der bei seinem Verwandten Yama eine Lehre über Lohn und Strafe im Jenseits empfängt und um die Läuterung seiner furchterregenden Familie bittet. Auf Yamas Rat preist er an der Gautamī Viṣṇu (Hari), durch dessen Gnade Viṣṭi, Viśvarūpa und die Söhne ,bhadra' (heilvoll) werden. Ursprung des Bhadra-Tīrtha, an dem Hari als ,Bhadrapati' alle Wünsche gewährt."}, {"term": "Patatri-Tīrtha, Sampāti und Jaṭāyu fliegen zur Sonne (Kap.166)", "category": "Erzählung/Tīrtha", "definition": "Kap.166: Aruṇas Söhne, die Vogelbrüder Sampāti und Jaṭāyu (später aus dem Rāmāyaṇa bekannt), fliegen im Wetteifer und Kraftrausch der Sonne zu nahe und stürzen mit versengten Flügeln ab. Ihr Vater Aruṇa bittet Sūrya um ihre Wiederbelebung; Garuḍa kommt mit Viṣṇu hinzu und tröstet sie, worauf alle gemeinsam zur Gaṅgā ziehen. Ursprung des Patatri-Tīrtha (,Vogel-Tīrtha'), an dem Sūrya, Viṣṇu, Garuḍa, Aruṇa und Śiva gemeinsam gegenwärtig sind und von seelischem wie körperlichem Leiden befreien."}, {"term": "Vipra-Tīrtha, die Rākṣasī Kaṅkālinī und Narasiṃhas Rettung (Kap.167)", "category": "Erzählung/Tīrtha", "definition": "Kap.167: Der Brahmanensohn Āsandiva wird im Schlaf von der gestaltwandelnden Menschenfresserin Kaṅkālinī entführt, die ihn als alte Frau verkleidet zwingt, sie als Mutter auszugeben, und unter diesem Vorwand seine Heirat mit einer tugendhaften Brahmanentochter arrangiert, um beide später zu verspeisen. Von seiner Gattin gedrängt, offenbart er ihr die Wahrheit; sie rät ihm, an der Gautamī zu baden und Nārāyaṇa/Narasiṃha anzurufen. Nārāyaṇa tötet daraufhin die Rākṣasī mit dem Sudarśana-Diskus. Ursprung des Vipra-Tīrtha, auch Nārāyaṇa-Tīrtha genannt."}, {"term": "Bhānu-, Tvāṣṭra-, Yāmya-, Agni- und Māheśvara-Tīrtha, König Abhiṣṭutas Pferdeopfer (Kap.168)", "category": "Erzählung/Tīrtha", "definition": "Kap.168: Bei König Abhiṣṭutas Pferdeopfer bittet Vasiṣṭha, da ein Kṣatriya-Opferherr keinen Boden verschenken kann, den Sonnengott Sūrya selbst um das Opferland (Ursprung des Bhānu-Tīrtha). Als Brahmanen verkleidete Daityas stören das Opfer, werden aber von Viśvarūpa erkannt und von seinem Vater Tvaṣṭṛ mit besprengtem Wasser zu Asche verbrannt (Tvāṣṭra-Tīrtha); die überlebenden Daityas erschlägt Yama (Yāmya-Tīrtha); das vollendete Opfer sättigt Agni (Agni-Tīrtha). Śiva und Viṣṇu werden dort mit umfangreichem Ritual verehrt und gewähren dem König Genuss und Erlösung (Māheśvara- bzw. Śaiva-Vaiṣṇava-Tīrtha). Das Bad am Bhānu-Tīrtha gilt als gleichwertig mit hundert Tīrthas."}, {"term": "Bhilla-Tīrtha, der hingebungsvolle Jäger und der Brahmane Veda (Kap.169)", "category": "Erzählung/Tīrtha", "definition": "Kap.169: Ein einfacher Jäger (Bhilla) verehrt das Śiva-Liṅga Ādikeśa täglich aus reiner Hingabe mit Fleisch, Mundwasser und wahllos gepflückten Blättern, während der Brahmane Veda dieselbe Gottheit vorschriftsmäßig verehrt. Śiva ist mit dem Jäger zufriedener, was Veda mit Eifersucht erfüllt; als dieser den Jäger bestrafen will, lässt Śiva sich selbst verwunden, um zu zeigen, dass ihm Hingabe mehr gilt als rituelle Korrektheit — der Jäger durchbohrt sich beim Anblick der Liṅga-Wunde vor Verzweiflung selbst. Ursprung des Bhilla-Tīrtha, das allein durch Erinnerung die Frucht aller Opfer gewährt."}, {"term": "Cakṣus- und Mṛtasañjīvana-Tīrtha, Gautama und Maṇikuṇḍala (Kap.170)", "category": "Erzählung/Tīrtha", "definition": "Kap.170: Der habgierige Brahmane Gautama und der wohlhabende Vaiśya-Kaufmann Maṇikuṇḍala schließen Freundschaft; Gautama sinnt auf dessen Reichtum und entfacht einen Streit über die Frage, ob Dharma oder Adharma die Welt beherrscht. Bei jeder Eskalation der Wette beraubt Gautama den standhaften Maṇikuṇḍala — erst seines Vermögens, dann seiner Hände, schließlich seiner Augen — und setzt ihn am Gautamī-Ufer (Yogeśvara-Tīrtha) aus. Der vorbeikommende Vibhīṣaṇa (Rāvaṇas rechtschaffener Bruder) und sein Sohn Vaibhīṣaṇi erkennen dort ein Holzstück vom wundersamen Viśalyakaraṇī-/Mṛtasañjīvanī-Kräuterberg, den einst Hanumān für Rāma trug; seine Berührung heilt Hände und Augen (Ursprung des Mṛtasañjīvana-Tīrtha). Mit dem verbliebenen Holz heilt Maṇikuṇḍala später eine blinde Königstochter, heiratet sie und wird König, vergisst aber Gautama nicht: Jahre danach, als dieser durch Glücksspiel verarmt ist, nimmt er ihn großmütig auf und läutert ihn durch ein Gaṅgā-Bad (Cakṣus-Tīrtha). Die Erzählung endet mit dem gemeinsamen Aufstieg zum Himmel."}, {"term": "Urvaśī-/Kaitava-Tīrtha, König Pramati und das Würfelspiel mit Indra (Kap.171)", "category": "Erzählung/Tīrtha", "definition": "Kap.171: König Pramati verspottet Indra nach einem Sieg; dieser fordert ihn zum Würfelspiel heraus. Die Einsätze steigern sich von Urvaśī über Indras Waffen bis hin zu Königreich und Leben, als der Gandharvenfürst Citrasena eintritt und im letzten Spiel gewinnt, wodurch Pramati gefesselt wird. Sein Sohn Sumati erhält vom Priester Madhucchandas eine ausführliche Lehre über die Sündhaftigkeit des Falschspiels (Kaitava) und dessen Folgen, vollzieht daraufhin tausendjährige Askese am Gautamī-Ufer zu Śiva, Aditi, Varuṇa und Viṣṇu und befreit so seinen Vater. Ursprung des Śāmbhava-, Vaiṣṇava- und Urvaśī-Tīrtha, seither auch Kaitava-Tīrtha genannt."}, {"term": "Sāmudra-Tīrtha, der Ozean und die sieben Gaṅgās (Kap.172)", "category": "Erzählung/Tīrtha", "definition": "Kap.172: Die von Gautama entsandte Gaṅgā fließt dem östlichen Ozean entgegen. Der Ozean (Sindhu), der ihr als ranghöherer Person mit Ehrerbietung begegnen will, kann sie nur in vielgestaltiger Form empfangen und bittet sie, sich anzupassen. Gaṅgā lässt die Gattinnen der sieben Ṛṣis (mit Arundhatī an der Spitze) samt Gatten herbeibringen und teilt sich ihnen entsprechend siebenfach, wodurch sie als Gautamī-Gaṅgā in sieben, nach den Ṛṣis benannten Strömen ins Meer mündet. Das Sāmudra-Tīrtha gilt als das höchste Tīrtha der drei Welten für Sündentilgung, Genuss, Erlösung und Freude des Gemüts."}, {"term": "Bhīmeśvara-Tīrtha, das Ṛṣisattra und Viśvarūpas furchtbare Askese (Kap.173)", "category": "Erzählung/Tīrtha", "definition": "Kap.173: Am Ṛṣisattra teilen die sieben Ṛṣis die Gaṅgā siebenfach und benennen die Ströme nach sich (u.a. Vāsiṣṭhī, Vaiśvāmitrī, die mittlere Gautamī). Der Götterfeind Viśvarūpa bittet die Weisen um Mittel für einen unbezwingbaren Sohn; Viśvāmitra lehrt, dass nicht die Handlung selbst, sondern die zugrundeliegende Gesinnung (bhāva: sattvisch, rajasisch, tamasisch) die Frucht des Karma bestimmt. Daraufhin übt Viśvarūpa aus tamasischer Gesinnung eine furchtbare Selbstopfer-Askese in einer Feuergrube, wobei er sich als schreckliche Rudra-Gestalt visualisiert; eine körperlose Stimme spricht dabei in dunklen, an den Vṛtra-Mythos anklingenden Worten. Ursprung des Bhīmeśvara ('der furchtbare Herr'), verehrt von den Weisen; ein abschließender Hymnus preist die Stätte am Zusammenfluss von Godāvarī und Ozean als höchste Quelle der Erlösung."}, {"term": "Sieben Tīrthas am Gautamī-Ozean-Zusammenfluss (Kap.174)", "category": "Erzählung/Tīrtha", "definition": "Kap.174: Katalog der sieben Tīrthas am Zusammenfluss von Gautamī-Gaṅgā und Ozean: Gautameśvara (Śiva/Mādhava-Ramā), das von Brahmā selbst gestiftete Brahmeśvara, Cakrapāṇi-/Aindra-/Hayamūrdhaka-Tīrtha, das Soma-Tīrtha (mit eingebettetem, an vedische Soma-Pavamāna-Hymnen anklingendem Lobgesang samt Refrain ,indrāyendo pari srava' und wörtlichem Zitat des ,Berufe'-Verses aus Ṛgveda 9,112), das Āgneya-Tīrtha, das Āditya-Tīrtha und das Bārhaspatya-Tīrtha, sowie das Adri-Tīrtha mit einem von Himālaya selbst aufgestellten Liṅga. Das Kapitel betont, dass selbst Viṣṇu und Śiva die Größe der Gautamī nicht vollständig auszusprechen vermögen, da sie, anders als zeitlich begrenzte Tīrthas, stets und überall wirksam ist."}, {"term": "Yuga-abhängige Dharma-Lehre und Gaṇeśa-Gautama-Erzählung (Kap.175)", "category": "Philosophie/Erzählung", "definition": "Kap.175: Nārada fragt nach der ,dreifach-göttlichen' (tridaivatya) Gaṅgā; Brahmā lehrt, dass Dharma von Yuga zu Yuga (Kṛta-Tretā-Dvāpara-Kali) um je ein Viertel abnimmt, an heiligen Stätten aber bewahrt bleibt, und dass auch die Zahl der an einem Tīrtha gegenwärtigen Gottheiten sowie dessen göttlicher, dämonischer, ṛṣi-hafter oder menschlicher Charakter je nach Yuga wechselt. Es folgt die Erzählung, wie Umā ihren Sohn Gaṇeśa (Gajavaktra) beauftragt, Śiva von der Gaṅgā zurückzuholen, nachdem diese sich auf seinem Haupt niedergelassen hat; Gaṇeśa erklärt dies für unmöglich, da der Weise Gautama durch Askese Śivas Zusage erwirkt hatte, dass die Gaṅgā (mit ihrem Haarschmuck) für immer an jener Stelle zum Wohl aller Welten verbleibe, nachdem Gautama zweifach jeden persönlichen Lohn abgelehnt hatte. Gaṇeśa verspricht, nur denjenigen Hindernisse zu bereiten, die die Pilgerfahrt aus Trägheit vernachlässigen, nicht aber denen, die trotz Widerständen ausharren. Das Kapitel schließt mit einer ausführlichen Phalaśruti über den unvergleichlichen Verdienst des Besuchs, Gedenkens, Rezitierens und Hörens der Gautamī-Godāvarī-Geschichte, mit Einschränkungen zur Weitergabe des Purāṇas nur an würdige, gläubige Hörer."}, {"term": "Ananta-Vāsudeva-Standbild und Ursprung des Puruṣottama-Kṣetra (Kap.176)", "category": "Erzählung/Tīrtha", "definition": "Kap.176: Geschichte des von Brahmā gestifteten und von Viśvakarman gefertigten Ananta-Vāsudeva-Standbildes: von Indra auf dem Sumeru verehrt, im Tretā-Yuga von Rāvaṇa nach Laṅkā geraubt, von dessen Bruder Vibhīṣaṇa erbeten und durch 108-jährige Verehrung zur Unsterblichkeit genutzt; nach einer gerafften Zusammenfassung der Rāma-Erzählung (Sītā-Raub, Affenbündnis, Brückenbau, Rāvaṇas Tod, Vibhīṣaṇas Krönung) übergibt Rāma das Standbild dem Ozean, der es im Dvāpara-Yuga am heiligen Kṣetra des Puruṣottama birgt, wo Vāsudeva seither dauerhaft weilt und dessen Verehrung als äußerst verdienstvoll gilt."}, {"term": "Phalaśruti des Puruṣottama-Kṣetra (Kap.177)", "category": "Phalaśruti/Tīrtha", "definition": "Kap.177: Ausführliche Phalaśruti über die Verdienste der Verehrung am Puruṣottama-Kṣetra, wo Kṛṣṇa mit Balarāma und Subhadrā weilt. Ein Monat Askese dort entspricht zehntausend Jahren an anderen Tīrthas; der Tod am Kṣetra — besonders zwischen dem heiligen Banyan-Baum (Kalpavṛkṣa) und dem Ozean, selbst unwillentlich oder als Tier — führt stets zur Erlösung. Etymologische Erklärung des Namens ,Puruṣottama' als der über Prakṛti und Puruṣa erhabene, im Vedānta als Paramātman geltende Höchste."}, {"term": "Kaṇḍu-Pramlocā-Erzählung und Viṣṇu-Stotra (Kap.178)", "category": "Erzählung/Stotra", "definition": "Kap.178: Die Geschichte des Ṛṣi Kaṇḍu, dessen gewaltige Askese die drei Welten erhitzt; Indra sendet die Apsaras Pramlocā (mit Kāma, Vasanta und Vāyu), die ihn verführt — fast tausend Jahre vergehen, ohne dass er es bemerkt. Nach ernüchterter Erkenntnis der verstrichenen Zeit verstößt er sie; ihr abgewischter Schweiß wird zum Keim der Māriṣā, der späteren Mutter Dakṣas. Kaṇḍu zieht zum Puruṣottama-Kṣetra, übt das ,Brahma-Pāra'-Murmelgebet (ein Wortspiel-Hymnus auf ,para/pāra'), woraufhin ihm Viṣṇu erscheint. Es folgt ein sehr umfangreicher Lobpreis (V.128-177) mit hunderten Epitheta, die Viṣṇu mit nahezu allen kosmischen Prinzipien, Zeiteinheiten, Veden, Elementen und Avatāras identifizieren; Viṣṇu verheißt allen Verehrern unabhängig von Stand die höchste Vollkommenheit. Kaṇḍu erlangt die Erlösung; das Kapitel schließt mit einer Phalaśruti."}, {"term": "Frage der Munis nach Viṣṇus Menschwerdung (Kap.179)", "category": "Philosophie/Erzählung", "definition": "Kap.179: Die Munis fragen Vyāsa nach dem Ursprung von Baladeva, Kṛṣṇa und Subhadrā im Haus Nandas und zählen in einer umfangreichen hymnenartigen Frage Viṣṇus kosmische Taten auf (Avatāras: Varāha, Narasiṃha, Vāmana/Trivikrama, Kūrma; Kālanemi-Bezwingung; Ursprung des Opferwesens, der Zeiteinheiten, der Stände) sowie eine embryologische Kosmogonie (Entstehung von Blut, Fleisch, Knochen, Mark, Samen; die fünf Prāṇas; die fünf Elemente). Die Frage gipfelt in der Verwunderung, wie der ewige, eigenschaftslose Viṣṇu — dessen ,Hari-', ,Vaikuṇṭha-' und ,Kṛṣṇa-Sein' in verschiedenen Zeitaltern gerühmt wird — in der Familie der Yadus Menschengestalt annahm."}, {"term": "Caturvyūha-Lehre (Kap.180)", "category": "Philosophie", "definition": "Kap.180: Nach einer ausgedehnten Lobpreisung Viṣṇus (zahlreiche Epitheta wie Puruṣa, Purāṇa, Śāśvata, Hiraṇyagarbha, Vāsudeva) legt Vyāsa die Lehre von den vier Erscheinungsformen (caturvyūha) dar: eine unbeschreibliche, reine, ewig-weiße Form als höchstes Ziel der Yogis; eine zweite Form namens Śeṣa, die (tamas-geprägt) die Erde auf dem Haupt trägt; eine dritte, sattva-geprägte Form, die dem Schutz der Geschöpfe und der Wahrung des Dharma dient und dabei fast wörtlich die Bhagavadgītā (,wenn immer der Dharma schwindet...') anklingen lässt — sie tötet Dämonen und beschützt die Götter; eine vierte, rajas-geprägte Form, die inmitten der Wasser auf der Schlange ruht und die Schöpfung bewirkt. Es folgt ein geraffter Katalog der Avatāras (Varāha, Narasiṃha, Vāmana/Trivikrama, Paraśurāma, Dattātreya, Rāma Dāśarathi), die kosmische Yoga-Schlaf-Episode auf dem Schlangenbett, die Geburt Brahmās aus dem Lotus, die Tötung von Madhu und Kaiṭabha, und schließlich der Übergang zur gegenwärtigen Inkarnation in Mathurā (,Pradyumna' genannte sattvische Form)."}, {"term": "Erdklage und Anweisung an Yoganidrā (Kap.181)", "category": "Erzählung", "definition": "Kap.181: Die von dämonischer Last (Kālanemi, wiedergeboren als Kaṃsa, u.a.) bedrängte Erde klagt vor Brahmā und den Göttern (mit einer Formel, die Bhagavadgītā 4.7f. nahezu wörtlich vorwegnimmt); Brahmā und die Götter ziehen zum Milchozean und preisen Viṣṇu in einem Hymnus. Viṣṇu zupft sich zwei Haare aus — ein weißes (wird Balarāma/Saṃkarṣaṇa) und ein schwarzes (wird Kṛṣṇa) — und weist Yoganidrā (die kosmische Māyā/Schlafgöttin, identifiziert mit Durgā, Ambikā, Bhadrakālī u.a.) an, wie die ,sechs Embryonen' (Söhne Hiraṇyakaśipus), die Vertauschung der Kinder zwischen Devakī und Yaśodā, sowie ihre eigene künftige Geburt und Verehrung als Göttin ablaufen sollen."}, {"term": "Geburt Kṛṣṇas und Entrückung der Yogamāyā (Kap.182)", "category": "Erzählung", "definition": "Kap.182: Kṛṣṇa geht in Devakīs Leib ein, Yoganidrā gleichzeitig in Yaśodās; die Götter preisen die strahlende, unnahbare Devakī als Erscheinungsform der Großen Göttin. Um Mitternacht wird der vierarmige Kṛṣṇa geboren; Vasudeva und Devakī bitten ihn, die göttliche Gestalt zurückzuziehen. Vasudeva trägt das Kind, von der Schlange Śeṣa vor dem Regen geschützt, über die sich teilende Yamunā nach Gokula und tauscht es gegen Yaśodās neugeborene Tochter. Kaṃsa ergreift das vermeintliche achte Kind der Devakī, das sich als die Göttin Yogamāyā entpuppt: Sie entkommt in den Luftraum, verkündet ihm, dass sein Töter bereits geboren sei, und entschwindet."}, {"term": "Kaṃsas Anweisung an die Dämonen (Kap.183)", "category": "Erzählung", "definition": "Kap.183: Kaṃsa versammelt die Dämonen (Pralamba, Keśin, Dhenuka, Pūtanā, Ariṣṭa u.a.) und berichtet von der Warnung des entkommenen Mädchens (Yogamāyā), sein Tod sei bereits geboren; er befiehlt, künftig gezielt gegen ungewöhnlich kraftvolle Kinder vorzugehen. Danach besänftigt er, scheinbar fatalistisch resigniert, Vasudeva und Devakī und lässt sie frei."}, {"term": "Pūtanā, Śakaṭa- und Yamalārjuna-Episode (Kap.184)", "category": "Erzählung", "definition": "Kap.184: Der Säugling Kṛṣṇa tötet die Dämonin Pūtanā, die ihn vergiftet stillen wollte; Nandagopa spricht einen ausführlichen Schutzsegen über ihn. Es folgen das Umstürzen eines Wagens durch einen Fußtritt des Kindes und die Dāmodara-Episode: Yaśodā bindet Kṛṣṇa mit einem Strick an einen Mörser, den er zwischen den Zwillings-Arjunabäumen (Yamalārjuna) hindurchzieht und dabei fällt — daher der Name ,Dāmodara'. Aus Furcht vor den Unglückszeichen zieht die Vraja-Gemeinschaft nach Vṛndāvana um; Rāma und Kṛṣṇa wachsen dort als Kälberhüter heran und erreichen mit sieben Jahren das Alter, in dem der Monsun einsetzt und sie mit den Hirtenkindern spielen."}, {"term": "Kālīyadamana - Bezwingung der Schlange Kālīya (Kap.185)", "category": "Erzählung", "definition": "Kap.185: Kṛṣṇa entdeckt in der Yamunā den giftverseuchten Weiher der Schlange Kālīya und stürzt sich hinein, um sie zu bezwingen. Nach einem Kampf, in dem er von den Schlangen umschlungen und gebissen wird, erinnert ihn Balarāma an seine wahre, göttliche Natur; Kṛṣṇa befreit sich und tanzt Kālīya auf dessen Häuptern nieder. Die Schlangenfrauen und schließlich Kālīya selbst erkennen Kṛṣṇas Göttlichkeit an und bitten um sein Leben; Kṛṣṇa verbannt ihn samt Gefolge in den Ozean und verspricht ihm Schutz vor seinem Erzfeind Garuḍa."}, {"term": "Dhenukāsuravadha - Tötung des Dhenuka (Kap.186)", "category": "Erzählung", "definition": "Kap.186: Rāma und Kṛṣṇa gelangen mit den Kuhhirten zum Palmenwald des eselsgestaltigen Dämons Dhenuka. Der herbeieilende Dhenuka wird von Balarāma an den Beinen gepackt, herumgeschwungen und tödlich gegen eine Palme geschleudert; seine Artgenossen werden ebenso von Kṛṣṇa und Balarāma auf die Palmenspitzen geschleudert, worauf die Kühe fortan ungestört im Wald weiden können."}, {"term": "Pralambavadha und Govardhana-Verehrung (Kap.187)", "category": "Erzählung", "definition": "Kap.187: Der als Kuhhirte verkleidete Dämon Pralamba versucht, Balarāma bei einem Kinderspiel zu entführen und wächst zu Riesengestalt heran; von Kṛṣṇa an seine wahre Natur erinnert, erschlägt Balarāma ihn. Als die Bewohner von Vraja das herbstliche Indra-Fest vorbereiten, überzeugt Kṛṣṇa sie in einer Rede über die vier Wissenschaften (ānvīkṣikī, trayī, vārttā, daṇḍanīti), statt Indra den Berg Govardhana und die Kühe zu verehren. Beim vollzogenen Bergfest manifestiert sich Kṛṣṇa selbst leibhaftig als der Berg und nimmt die Verehrung entgegen."}, {"term": "Govardhanoddharaṇa - Erhebung des Govardhana (Kap.188)", "category": "Erzählung", "definition": "Kap.188: Aus Zorn über das vereitelte Indra-Fest lässt Indra sintflutartige Wolken über Gokula regnen. Kṛṣṇa reißt den Berg Govardhana mit einer Hand aus und hält ihn sieben Tage lang wie einen Schirm über die Bewohner Vrajas, bis Indra seinen Sturm zurückzieht. Indra erscheint darauf reumütig, weiht Kṛṣṇa im Auftrag der Kühe zum ,Govinda' (Herrn der Kühe) und prophezeit ihm die Geburt seines Sohnes Arjuna, den Kṛṣṇa beschützen soll — mit einem Vorverweis auf den künftigen Mahābhārata-Krieg."}, {"term": "Rāsakrīḍā und Ariṣṭavadha (Kap.189)", "category": "Erzählung", "definition": "Kap.189: Die Kuhhirten stellen Kṛṣṇa nach der Govardhana-Erhebung zur Rede, ob er ein Gott, Dämon, Yakṣa oder Gandharva sei; Kṛṣṇa besteht darauf, nur ihr Verwandter zu sein. In einer Herbstnacht feiert er mit den Gopīs den berühmten RĀSA-TANZ, bei dem jede Gopī ihn an ihrer eigenen Seite wähnt. Der brünstige, stiergestaltige Dämon Ariṣṭa greift daraufhin Gokula an und wird von Kṛṣṇa mit bloßen Händen (durch Verdrehen der Hörner) getötet."}, {"term": "Keśivadha (Kap.190)", "category": "Erzählung", "definition": "Kap.190: Kaṃsa, durch Nārada über Kṛṣṇas und Balarāmas wahre Herkunft und alle bisherigen Ereignisse unterrichtet, plant unter dem Vorwand eines Bogenopferfestes ihre Ermordung durch die Ringer Cāṇūra und Muṣṭika sowie den Elefanten Kuvalayāpīḍa und entsendet Akrūra als Boten nach Vraja. Zugleich schickt er den Pferdedämon Keśin nach Vṛndāvana; Kṛṣṇa tötet ihn, indem er seinen Arm in dessen Rachen hineinwachsen lässt, bis das Tier zerbirst. Nārada erscheint, prophezeit Kṛṣṇa den Beinamen 'Keśava' (,Töter Keśins') und kündigt den bevorstehenden Kampf mit Kaṃsa sowie vorausdeutend die künftigen Erdenkriege an."}, {"term": "Akrūrastuti (Kap.191)", "category": "Erzählung", "definition": "Kap.191: Auf der Wagenfahrt nach Gokula preist Akrūra in einem ausführlichen Hymnus Viṣṇu-Kṛṣṇa als das höchste, anfang- und endlose, alldurchdringende Wesen, dessen wahres Wesen selbst Brahmā und die Götter nicht kennen, und bekennt seine Freude, ihn endlich sehen zu dürfen. Bei der Ankunft erblickt er Kṛṣṇa beim Melken der Kühe und Balarāma an seiner Seite, in ausführlicher Schönheitsschilderung, und wird von Ehrfurcht und Gänsehaut ergriffen."}, {"term": "Akrūras Yamunā-Vision und Einzug in Mathurā (Kap.192)", "category": "Erzählung", "definition": "Kap.192: Beim Abschied aus Vraja klagen die Gopīs ausführlich über die Trennung von Kṛṣṇa. Unterwegs schaut Akrūra bei seiner rituellen Waschung in der Yamunā Kṛṣṇa und Balarāma in ihrer kosmischen Gestalt (Viṣṇu auf der Schlange Śeṣa ruhend) und preist sie in einem ausführlichen philosophischen Hymnus (u.a. die Vyūha-Formel Vāsudeva-Saṃkarṣaṇa-Pradyumna-Aniruddha). In Mathurā angekommen, tötet Kṛṣṇa den unverschämten Wäscher des Kaṃsa und nimmt dessen Gewänder; der Girlandenmacher, der die beiden ehrfürchtig bewirtet, wird von Kṛṣṇa reich gesegnet."}, {"term": "Kaṃsavadha (Kap.193)", "category": "Erzählung", "definition": "Kap.193: Kṛṣṇa richtet unterwegs die bucklige Trivakrā/'Naikavakrā' durch seine Berührung auf, zerbricht in der Bogenhalle den Königsbogen und tötet die Wächter. Im Kampfplatz tötet er den Elefanten Kuvalayāpīḍa sowie die Ringer Cāṇūra, Muṣṭika und Tośalaka, während die Menge in einer Erinnerungslitanei ('so 'yaṃ ... so 'yaṃ') seine Kindheitstaten (Pūtanā, Wagen, Zwillingsbäume, Kāliya, Govardhana, Ariṣṭa/Dhenuka/Keśin) aufzählt. Schließlich tötet Kṛṣṇa Kaṃsa selbst und dessen Bruder Sunāman. Vasudeva und Devakī erkennen Kṛṣṇas wahre Natur (vgl. die Geburtsprophezeiung in Kap.182), und Vasudeva preist ihn in einem ausführlichen abschließenden Hymnus als Viṣṇu in menschlicher Gestalt."}, {"term": "Pāñcajanya (Muschel)", "category": "Gegenstand/Attribut", "definition": "Die Muschel Kṛṣṇas, gewonnen in Kap.194 aus den Knochen des im Meer lebenden, muschelgestaltigen Daitya Pañcajana, den Kṛṣṇa tötet, um den im Ozean verschollenen Sohn seines Lehrers Sāṃdīpani zurückzuholen. Ihr Klang schwächt die Kraft der Daityas, mehrt die Macht der Götter und lässt das Unrecht schwinden; sie wird zu einem der ständigen Attribute Viṣṇu-Kṛṣṇas."}, {"term": "Jarāsaṃdhas Feldzüge gegen Mathurā (Kap.195)", "category": "Erzählung", "definition": "Kap.195: Jarāsaṃdha, König von Magadha und Vater von Kaṃsas Witwen Asti und Prāpti, belagert Mathurā achtzehnmal aus Rache für Kaṃsas Tod. Rāma und Kṛṣṇa erhalten ihre himmlischen Waffen (Diskus, Bogen Śārṅga, Keule Kaumodakī, Pflug, Keule Sunanda) und besiegen ihn jedesmal, ohne ihn endgültig zu vernichten. Der Abschnitt endet mit einer Reflexion über Kṛṣṇas Spiel (līlā): Er folgt freiwillig dem menschlichen Dharma und den vier politischen Mitteln (Versöhnung, Geschenk, Spaltung, Bestrafung), obwohl er als reiner Geist mühelos Schöpfung und Auflösung der Welt bewirken könnte."}, {"term": "Kālayavana", "category": "Person/Antagonist", "definition": "Ein mächtiger Barbarenkönig (Yavana), durch die Askese des beleidigten Weisen Gārgya mit Śivas Gnade gezeugt und als Sohn eines Yavana-Königs aufgezogen. Er zieht mit unzähligen Mleccha-Kriegern gegen Mathurā, wird von Kṛṣṇa in die Höhle des schlafenden Königs Mucukunda gelockt und dort, da er Mucukunda für Kṛṣṇa hält und ihn weckt, durch dessen Blick zu Asche verbrannt (Kap.196)."}, {"term": "Mucukunda", "category": "Person", "definition": "Ein uralter, überaus kraftvoller König, der einst den Göttern im Krieg gegen die Asuras half und sich zum Lohn sehr langen Schlaf erbat, verbunden mit dem Segen, jeden, der ihn weckt, durch die eigene Körperglut zu Asche zu verbrennen. Von Kṛṣṇa listig als Werkzeug gegen den anstürmenden Kālayavana benutzt, erwacht er, verbrennt den Angreifer, erkennt in Kṛṣṇa den prophezeiten Viṣṇu-Avatāra und trägt ihm einen ausführlichen philosophischen Lobpreis vor (Kap.196)."}, {"term": "Dvārakā (Gründung)", "category": "Ort/Erzählung", "definition": "Die von Kṛṣṇa (Govinda) dem Meer abgerungene, zwölf Yojanas große Inselstadt, reich an Gärten, Wällen, hundert Teichen und hundert Befestigungsmauern, gegründet in Kap.196, um die Bevölkerung Mathurās vor dem anrückenden Kālayavana in Sicherheit zu bringen; wird zur neuen Hauptstadt der Yadus."}, {"term": "Balarāmas Rückkehr nach Vraja und die Klage der Gopīs (Kap.197)", "category": "Erzählung", "definition": "Kap.197: Nach Kṛṣṇas Sieg über Kālayavana und Mucukundas Erlösungssegen kehrt Balarāma sehnsuchtsvoll nach Nandas Gokula zurück. Die Gopīs empfangen ihn liebevoll, klagen aber ausführlich, dass Kṛṣṇa nun bei den Stadtfrauen von Mathurā weile und sie undankbar vergessen habe, und fragen bang, ob er sich noch an das gemeinsame Rāsa-Spiel erinnere und je zurückkehren werde. Rāma tröstet sie mit liebevollen Botschaften Kṛṣṇas."}, {"term": "Balarāmas Yamunā-Herbeiziehung (Kap.198)", "category": "Erzählung", "definition": "Kap.198: Berauscht von der Weingöttin Vāruṇī ruft Balarāma die Yamunā zum Baden herbei; als der Fluss nicht gehorcht, zieht er ihn zornig mit seinem Pflug aus dem Flussbett, bis die erschrockene Flussgöttin ihn besänftigt. Danach wird er von Varuṇa und Lakṣmī reich beschenkt und heiratet später Revatī, die Tochter des Königs Raivata."}, {"term": "Rukmiṇī", "category": "Person", "definition": "Tochter des Königs Bhīṣmaka von Vidarbha (Hauptstadt Kuṇḍina) und Kṛṣṇas erste und Hauptgemahlin. Obwohl sie und Kṛṣṇa einander begehren, verweigert ihr Bruder Rukmī aus Hass die Ehe und verlobt sie mit Śiśupāla; Kṛṣṇa raubt sie am Vorabend der Hochzeit und heiratet sie nach der Rākṣasa-Art. Mutter des Pradyumna (Kap.199)."}, {"term": "Rukmī", "category": "Person", "definition": "Sohn des Königs Bhīṣmaka und Bruder der Rukmiṇī, der aus Hass gegen Kṛṣṇa die Heirat seiner Schwester mit ihm verhindert und sie stattdessen an Śiśupāla verspricht. Nach dem Brautraub schwört er, nie nach Kuṇḍina zurückzukehren, ohne Kṛṣṇa im Kampf getötet zu haben, wird aber samt seinem Heer mühelos von Kṛṣṇa besiegt (Kap.199)."}, {"term": "Pradyumna", "category": "Person", "definition": "Sohn Kṛṣṇas und Rukmiṇīs, als Teil (aṃśa) des Liebesgottes Kāma geboren. Wird als Kind vom Dämon Śambara geraubt, tötet diesen später jedoch selbst (Geschichte in Kap.199 angekündigt, in Kap.200 erzählt)."}, {"term": "Śambara (Kālaśambara)", "category": "Person/Antagonist", "definition": "Ein mächtiger, zauberkundiger Dämon (Daitya), der den sechs Tage alten Pradyumna aus Furcht vor einer Prophezeiung raubt und ins Meer wirft. Der Knabe überlebt, verschlungen von einem Fisch, der in Śambaras eigener Küche landet. Als Pradyumna herangewachsen ist, tötet er Śambara im Kampf, nachdem er dessen sieben Zauberkräfte mit einer achten überwunden hat (Kap.200)."}, {"term": "Māyāvatī / Rati", "category": "Person/Göttin", "definition": "Śambaras vermeintliche Gattin, die den aus einem Fischbauch geborgenen Pradyumna aufzieht und ihn nach seinem Erwachsenwerden begehrt — eine scheinbare Verwirrung, die sich auflöst, als sich herausstellt, dass sie in Wahrheit Rati ist, die Gattin des von Śiva verbrannten Liebesgottes Kāma/Manmatha, dessen Wiedergeburt Pradyumna ist. Sie hatte Śambara nur mit einer Zaubergestalt getäuscht, um in Erwartung von Kāmas Wiedergeburt in seiner Nähe zu bleiben (Kap.200)."}, {"term": "Aniruddha", "category": "Person", "definition": "Sohn Pradyumnas und Enkel Kṛṣṇas, von großer Kraft und Tapferkeit. Heiratet, trotz fortbestehender Feindschaft zwischen den Familien, Rukmīs Enkelin in Bhojakaṭa — eine Hochzeit, bei der Balarāma in einem betrügerischen Würfelspiel Rukmī tötet (Kap.201)."}, {"term": "Balarāmas Tötung des Rukmī (Kap.201)", "category": "Erzählung", "definition": "Kap.201: Bei Aniruddhas Hochzeit mit Rukmīs Enkelin verleiten die Könige von Kaliṅga u.a. den würfelunkundigen Balarāma zu einem Spiel gegen den würfelkundigen Rukmī. Nachdem Rukmī einen von Balarāma klar gewonnenen hohen Einsatz betrügerisch abstreitet und der Kaliṅga-König ihn verspottet, bestätigt eine Himmelsstimme Balarāmas Sieg; der zornentbrannte Balarāma erschlägt Rukmī mit dem Würfelbrett, zerschmettert dem Kaliṅga-König die Zähne und tötet mit einer herausgerissenen goldenen Säule dessen Anhänger, worauf die gesamte Königsversammlung flieht."}, {"term": "Naraka / Bhauma(sura)", "category": "Person/Antagonist", "definition": "Dämonischer Herrscher von Prāgjyotiṣa, Sohn der Erdgöttin Bhūmi aus ihrer Berührung mit Viṣṇu während dessen Eber-Avatāra (Varāha). Raubt Göttern, Siddhas und Königen ihre Töchter (16.100 Mädchen), Varuṇas Sonnenschirm, den Bergesgipfel Maṇiparvata und Aditis Nektar-Ohrringe; wird von Kṛṣṇa mit dem Diskus Sudarśana getötet (Kap.202)."}, {"term": "Narakāsura-Episode (Kap.202)", "category": "Erzählung", "definition": "Kap.202: Auf Indras Bitte zieht Kṛṣṇa mit Satyabhāmā auf Garuḍa nach Prāgjyotiṣa, tötet den Dämon Mura samt seinen siebentausend Söhnen sowie Hayagrīva und Pañcajana, und schließlich Naraka (Bhauma) selbst. Die Erdgöttin Bhūmi erscheint, offenbart Narakas Herkunft und bittet um Gnade für seine Nachkommen; Kṛṣṇa befreit 16.100 gefangene Prinzessinnen sowie Elefanten und Pferde und zieht weiter zur Götterwelt, um Aditis Ohrringe zurückzugeben."}, {"term": "Pārijāta", "category": "Mythologisches Objekt", "definition": "Der wunscherfüllende Baum, einer der fünf Bäume des Himmels (Nandana-Garten Indras), bei der Quirlung des Milchozeans entstanden; Satyabhāmā verlangt von Kṛṣṇa, ihn nach Dvārakā zu bringen, was zum Kampf mit Indra führt (Kap.203). Sein Duft und seine Blüten gelten als unvergänglich."}, {"term": "Pārijāta-haraṇa und Götterkampf (Kap.203)", "category": "Erzählung", "definition": "Kṛṣṇa gibt Aditi ihre geraubten Ohrringe zurück und empfängt ihren Lobpreis sowie einen Segen (Unbesiegbarkeit unter Sterblichen für ihn, ewige Schönheit für Satyabhāmā). Bei einem Rundgang durch die Himmelsgärten entdeckt Satyabhāmā den Pārijāta-Baum und verlangt ihn für sich; entgegen der Warnung der Wächter, der Baum gehöre Śacī, lässt sie ihn ausgraben. Es kommt zum offenen Kampf zwischen Kṛṣṇa (mit Garuḍa) und dem gesamten Götterheer unter Indra; Kṛṣṇa besiegt Varuṇa, Yama, Kuvera, Agni, die Vasus, Rudras, Sādhyas, Viśvedevas, Maruts und Gandharvas und fängt schließlich Indras Blitzkeil mit bloßer Hand. Indra erkennt seine Niederlage philosophisch an und preist Kṛṣṇa als den ungewordenen, alldurchdringenden Urgrund des Universums."}, {"term": "Aditis Lobpreis (Kap.203)", "category": "Hymne", "definition": "Ausführliche Hymne der Göttermutter Aditi an Kṛṣṇa (Kap.203, V.6-19), die dessen Māyā-Natur, die Trugnatur weltlichen Verlangens (selbst gegenüber einem Wunschbaum) und die Bitte um Gnade behandelt; verwendet sāṃkhya-/vedāntanahe Terminologie (u.a. Bhūtādi, guṇātmaka)."}, {"term": "Kṛṣṇas Massenhochzeit (Kap.204)", "category": "Erzählung", "definition": "Nach der Rückgabe von Blitzkeil und Pārijāta-Baum an Indra bringt Kṛṣṇa den Baum nach Dvārakā und heiratet in einer einzigen Zeremonie alle 16.100 aus Narakāsuras Gefangenschaft befreiten Jungfrauen, indem er sich mittels seiner Allgestalt (viśvarūpa) in ebenso viele Gestalten vervielfacht und jeder Frau in eigener Form Nacht für Nacht beiwohnt."}, {"term": "Uṣā", "category": "Person", "definition": "Tochter des Dämonenfürsten Bāṇa (Enkelin Balis); verliebt sich nach einer Vision von Śiva und Pārvatī und einem prophetischen Traum in einen Unbekannten, der sich als Aniruddha, Kṛṣṇas Enkel, herausstellt (Kap.205). Ihre heimliche Vereinigung mit Aniruddha führt zur Bāṇāsura-Episode und zum Kampf zwischen Kṛṣṇa und Śiva."}, {"term": "Citralekhā", "category": "Person", "definition": "Tochter von Bāṇas Minister Kumbhāṇḍa und Freundin Uṣās; identifiziert mittels einer gezeichneten Bildertafel (paṭa) mit Abbildern von Göttern, Dämonen und Menschen den Aniruddha als den Mann aus Uṣās Traum und entführt ihn mittels Yoga-Kraft aus Dvārakā (Kap.205-206)."}, {"term": "Bāṇa(sura)", "category": "Person/Antagonist", "definition": "Tausendarmiger Dämonenfürst, Sohn Balis, Verehrer Śivas, Vater Uṣās; nach der heimlichen Vereinigung seiner Tochter mit Aniruddha kommt es zum großen Kampf zwischen Kṛṣṇa und dem von Śiva/Kārttikeya unterstützten Bāṇa; Kṛṣṇas Diskus Sudarśana schlägt ihm alle Arme bis auf vier ab, doch auf Śivas Fürbitte hin verschont Kṛṣṇa sein Leben (Kap.205-206)."}, {"term": "Bāṇāsura-Episode / Kampf mit Bāṇa (Kap.205-206)", "category": "Erzählung", "definition": "Uṣā, Bāṇas Tochter, verliebt sich durch eine Traumvision in Aniruddha, den ihre Freundin Citralekhā mittels Yoga-Zauberkraft aus Dvārakā entführt. Nach seiner Entdeckung und Fesselung mit einer Schlangenwaffe ziehen Kṛṣṇa, Balarāma und Pradyumna nach Śoṇitapura, besiegen Śivas Fieber-Dämon Jvara, Kārttikeya und schließlich (mittels der Gähn-Waffe außer Gefecht gesetzt) Śiva selbst, ehe Kṛṣṇas Diskus Bāṇas tausend Arme abschlägt. Śivas Hymnus erkennt Kṛṣṇa als den Höchsten an; auf seine Fürbitte hin verschont Kṛṣṇa Bāṇa, und Aniruddha kehrt mit Uṣā nach Dvārakā zurück."}, {"term": "Jvara (Śivas Fieber-Dämon)", "category": "Wesen", "definition": "Dreiköpfiger, dreifüßiger, aus Śiva/Maheśvara entsprungener Fieber-Dämon, der zu Bāṇas Schutz gegen Kṛṣṇa kämpft, aber von Kṛṣṇas eigenem 'Viṣṇu-Fieber' vertrieben wird; Kṛṣṇa erklärt, wer sich an diesen Kampf erinnert, werde fieberfrei sein (Kap.206)."}, {"term": "Pauṇḍraka(-Vāsudeva)", "category": "Person/Antagonist", "definition": "Ein König, der sich fälschlich für die wahre Inkarnation Vāsudevas hält, sich dessen Kennzeichen (Diskus, Muschel, Śrīvatsa etc.) nachahmend anlegt und Kṛṣṇa auffordert, seine eigenen Kennzeichen und seinen Namen abzulegen. Wird von Kṛṣṇa zusammen mit dem verbündeten König von Kāśī getötet (Kap.207)."}, {"term": "Kṛtyā (Zauberwesen)", "category": "Wesen", "definition": "Ein aus dem Opferfeuer durch magisches Ritual (hier auf Śivas Gewährung hin) hervorgerufenes, feuriges Rache-Wesen; der Sohn des Königs von Kāśī lässt eine solche Kṛtyā gegen Kṛṣṇa entstehen, die jedoch von dessen Diskus Sudarśana bis nach Vārāṇasī verfolgt und vernichtet wird (Kap.207)."}, {"term": "Pauṇḍraka-Episode und Verbrennung von Kāśī (Kap.207)", "category": "Erzählung", "definition": "Kṛṣṇa tötet den falschen Vāsudeva Pauṇḍraka und den verbündeten König von Kāśī. Dessen Sohn erwirkt von Śiva eine feurige Kṛtyā zur Vergeltung; diese wird von Kṛṣṇas Diskus Sudarśana bis nach Vārāṇasī verfolgt, vernichtet, und der Diskus verbrennt daraufhin die gesamte Stadt Kāśī, ehe er zu Kṛṣṇa zurückkehrt."}, {"term": "Sāmba", "category": "Person", "definition": "Sohn Kṛṣṇas und der Jāmbavatī; entführt gewaltsam Duryodhanas Tochter von ihrem svayaṃvara, wird von den Kauravas gefangen genommen und von Balarāma befreit (Kap.208)."}, {"term": "Sāmba-Episode / Hastināpura-Zerrung (Kap.208)", "category": "Erzählung", "definition": "Nach Sāmbas gewaltsamer Brautentführung von Duryodhanas Tochter wird er von den Kauravas gefangen genommen. Balarāma zieht allein nach Hastināpura, wird von den hochmütigen Kauravas verhöhnt, und zieht daraufhin zornig mit seinem Pflug die gesamte Stadt in Richtung Gaṅgā, bis die erschrockenen Kauravas um Verzeihung bitten und Sāmba samt Gattin freigeben."}, {"term": "Dvivida", "category": "Wesen/Antagonist", "definition": "Mächtiger Affe, Freund des von Kṛṣṇa getöteten Naraka; verübt aus Rache gegen die Götter weitreichende Verwüstungen (Opferstörung, Zerstörung von Städten, Flutwellen), bis er Balarāma bei einem Trinkgelage verspottet und im Faustkampf von ihm erschlagen wird (Kap.209)."}, {"term": "Yādava-Untergang / Mausala-Episode (Kap.210)", "category": "Erzählung", "definition": "Ein Fluch von Weisen, die von den jungen Yadu-Prinzen genarrt wurden, führt zur Geburt einer todbringenden eisernen Keule aus Sāmbas Leib. Ihre Zerstoßung erzeugt das Schilfgras von Prabhāsa und den Pfeilsplitter, mit dem später der Jäger Jara Kṛṣṇa tötet. Bei einem Trinkgelage in Prabhāsa schlägt ein Streit in gegenseitiges Gemetzel mit dem in Waffen verwandelten Schilfgras um, dem fast das gesamte Yadu-Geschlecht zum Opfer fällt; Kṛṣṇa selbst tötet zuletzt viele mit einer daraus geformten Keule."}, {"term": "Uddhava", "category": "Person", "definition": "Enger Freund und großer Verehrer (Bhāgavata) Kṛṣṇas; wird von Kṛṣṇa vor dem Untergang des Yadu-Geschlechts zur Einsiedelei Badarī am Berg Gandhamādana (Nara-Nārāyaṇa-Stätte) entsandt, wo er durch Kṛṣṇas Gnade Vollendung (siddhi) erlangen soll (Kap.210)."}, {"term": "Jara (Jäger)", "category": "Person", "definition": "Jäger, der aus dem Bauch eines Fisches einen Metallsplitter (Rest der verhängnisvollen Keule aus Sāmbas Leib) an sich nimmt; nach der Gesamtüberlieferung (hier nur angedeutet) verursacht er später mit einem daraus gefertigten Pfeil Kṛṣṇas Tod (Kap.210)."}, {"term": "Dāruka", "category": "Person", "definition": "Kṛṣṇas Wagenlenker; überlebt neben Kṛṣṇa selbst das gegenseitige Gemetzel der Yādavas in Prabhāsa und wird von Kṛṣṇa mit der Nachricht von Balarāmas Hinscheiden und dem Untergang der Yādavas zu Vasudeva, Ugrasena und Arjuna gesandt (Kap.210)."}, {"term": "Vajra", "category": "Person", "definition": "Enkel Aniruddhas; wird von Kṛṣṇa nach dem Untergang des Yadu-Geschlechts als neuer König der Yadus bestimmt (Kap.210)."}, {"term": "Kṛṣṇas Dahingehen (Kap.211)", "category": "Erzählung", "definition": "Nach dem Untergang des Yadu-Geschlechts versinkt Kṛṣṇa im Wald in Yoga-Vertiefung; der Jäger Jara verwundet, ihn für ein Reh haltend, mit einem aus dem Rest der verhängnisvollen Sāmba-Keule gefertigten Pfeil seine einzige verwundbare Stelle, die Fußsohle (Folge eines früheren, hier nur angedeuteten Durvāsas-Fluchs). Kṛṣṇa vergibt dem erschrockenen Jäger, sendet ihn zum Himmel, und legt darauf selbst den menschlichen Leib ab, um sich mit seiner transzendenten Natur zu vereinigen."}, {"term": "Pāṇḍavas' Großer Auszug (Kap.212)", "category": "Erzählung", "definition": "Nach dem Untergang des Yadu-Geschlechts vollzieht Arjuna die Totenriten für Kṛṣṇa, Balarāma und die ins Feuer eingehenden Königinnen und Eltern. Er führt das überlebende Volk und Vajra aus dem nun überfluteten Dvārakā fort, doch bei Pañcanada überfallen räuberische Ābhīras den ungeschützten Zug: Arjunas Gāṇḍīva-Bogen lässt sich nicht mehr spannen, seine göttlichen Waffenmantras sind vergessen, seine unerschöpflichen Pfeile gehen zur Neige, und die Vṛṣṇi-Andhaka-Frauen werden vor seinen Augen verschleppt. Erschüttert erkennt Arjuna, dass all seine Kraft stets von Kṛṣṇas verborgener Macht getragen war. Vyāsa tröstet ihn mit der Lehre von der Zeit (kāla) als letzter Ursache allen Aufstiegs und Falls und erklärt mittels der Aṣṭāvakra-Fluch-Vorgeschichte, warum die einst von Kṛṣṇa erwählten Himmelsfrauen ins Räuberhand fallen mussten. Auf Vyāsas Rat setzen die Pāṇḍavas Parīkṣit als König ein und ziehen selbst in den Wald – der unmittelbare erzählerische Übergang zum Mahāprasthānika-parva des Mahābhārata."}, {"term": "Aṣṭāvakra", "category": "Person", "definition": "Ein an acht Stellen des Körpers verkrümmter Weiser, dessen Fluch (in Kap.212 rückblickend erzählt) einst bewirkte, dass Himmelsfrauen, die ihn wegen seiner Gestalt verspottet oder zurückgewiesen hatten, trotz später erfüllten Wunsches nach Kṛṣṇa als Gemahl dazu bestimmt waren, in die Hände von Räubern zu fallen."}, {"term": "Zeit-Lehre (kāla)", "category": "Philosophie", "definition": "Vyāsas Trostlehre an Arjuna in Kap.212: Aufstieg und Fall, Macht und Ohnmacht aller Wesen – auch der eigenen früheren Siege Arjunas über Bhīṣma, Droṇa, Karṇa und Duryodhana – gehen letztlich auf die alles bestimmende, unpersönliche Kraft der Zeit zurück und nicht allein auf eigenes Vermögen."}, {"term": "Prādurbhāva-Kapitel (Kap.213)", "category": "Erzählung", "definition": "Zusammenfassender Katalog der Manifestationen (prādurbhāva) Viṣṇus, von Vyāsa auf Bitten der Weisen vorgetragen: Puṣkara, Yajña-Varāha, Narasiṃha (mit vollständiger Hiraṇyakaśipu-Vorgeschichte), Vāmana (mit Bali-Opfer und den drei Weltschritten), Dattātreya, Jāmadagnya/Paraśurāma, Rāma (kompakter Abriss des gesamten Rāmāyaṇa samt Lobpreis des idealen Rāma-Rājya), die Mathurā-zeitliche Kṛṣṇa-Manifestation und die zukünftige Kalki-Manifestation."}, {"term": "Vāmana-Episode", "category": "Erzählung", "definition": "Viṣṇus Zwergmanifestation: beim Opfer des Dämonenkönigs Bali erbittet der Zwerg drei Schritte Land, nimmt darauf eine kosmische Riesengestalt an und durchmisst mit drei Schritten Erde, Himmel und die höchste Sphäre, wodurch die Welt den Göttern zurückgegeben wird."}, {"term": "Yamamārga (Kap.214)", "category": "Erzählung/Lehre", "definition": "Der 86.000 Yojanas lange, rastlose Weg der Seele nach dem Tod zur Stadt Yamas: Verlassen des groben Leibes, Annahme eines feinstofflichen Qual-Leibes, Ergreifung und grausame Führung durch furchterregende, vielarmige, tiergestaltige Yamadūtas über einen von Dornen, Glut und wilden Tieren erfüllten Weg (Raurava) bis zur viereckigen Stadt Yamas mit vier Toren (Ost: Götter/Weise; Nord: Wohltäter; West: im Kampf/in Askese Gefallene; Süd: alle Übeltäter, mit langem Sündenkatalog)."}, {"term": "22 Höllen (dvāviṃśati narakāḥ)", "category": "Kosmologie", "definition": "Die im Herrschaftsbereich Yamas gelegenen 22 Höllen, in Kap.214 mit Namen aufgezählt (u.a. Raurava, Kumbhīpāka, Śālmala, Vaitaraṇī, Asipattravana), in denen Übeltäter je nach ihrer Tat gesondert gequält werden."}, {"term": "Citragupta", "category": "Gottheit/Figur", "definition": "Der göttliche Schreiber und Rechenschaftsführer im Gefolge Yamas, der die Taten der Verstorbenen verzeichnet; in Kap.215 ermahnt er die vor Yama gebrachten Sünder mit einer Lehrrede über die unausweichliche Frucht des eigenen Tuns, bevor Yama selbst über gefallene Könige und andere Übeltäter richtet."}, {"term": "Höllenkatalog des Südtors (Kap.215)", "category": "Kosmologie", "definition": "Der in Kap.215 aufgezählte Katalog von rund 30 namentlich genannten Höllen (u.a. Mahāvācī, Kumbhīpāka, Raurava, Mahāraurava, Tāmisra, Mahātāmisra, Asipattravana, Kākola, Vajramahāpīḍā), von denen jede einer bestimmten Sündenkategorie (Kuhmord, Brahmanenmord, Diebstahl, Ehebruch, Falschzeugnis, Kastenvermischung u.v.a.) zugeordnet ist und deren jeweilige Strafe detailliert beschrieben wird."}, {"term": "Dharmarājapura (Kap.216)", "category": "Kosmologie", "definition": "Die 'Stadt des Dharma-Königs' (Yamas), zu der die Frommen – je nach Art ihrer guten Taten (Gaben, Wahrhaftigkeit, Fasten, frommer Tod u.a.) – auf prunkvollen, von Apsaras und Gandharvas begleiteten Flugwagen mühelos gelangen und dort von Yama selbst ehrenvoll empfangen werden, bevor sie zu Himmel und schließlich Erlösung weiterziehen."}, {"term": "Śiśupāla (cedipatiḥ)", "category": "Figur", "definition": "Der 'Herrscher der Cedis', ein Feind Kṛṣṇas, der der Überlieferung nach durch seinen unablässigen, hasserfüllten Fokus auf Kṛṣṇa dennoch die Erlösung erlangte; in Kap.216 als Beispiel dafür angeführt, dass selbst unaufrichtiges oder feindseliges Gedenken an Viṣṇu/Hari von Yamas Macht befreit."}, {"term": "Dharma als Gefährte (Kap.217)", "category": "Lehre", "definition": "Die zentrale Lehre, dass von allem, was den Menschen im Leben begleitet – Familie, Freunde, Besitz, Körper –, einzig der Dharma (die Summe der frommen Taten) die Seele über den Tod hinaus begleitet und ihr beisteht, während alles andere am Scheiterhaufen oder Grab zurückbleibt."}, {"term": "Tiergeburten als Sündenfolge (Kap.217)", "category": "Kosmologie", "definition": "Ein detailliertes Vergeltungssystem, nach dem bestimmte Sünden (Diebstahl bestimmter Güter, Verrat an Lehrer/Eltern/Geschwistern, Ehebruch je nach Kaste der Frau u.a.) exakt bemessene Wiedergeburten in bestimmten Tier-, Vogel- oder Insektenformen nach sich ziehen, bevor die Seele wieder als Mensch geboren wird."}, {"term": "Annadāna (Speisegabe)", "category": "Konzept", "definition": "Die Gabe von Speise an Brahmanen bzw. Bedürftige, in Kap.218 als die höchste und wirksamste aller Gaben gelehrt, die – rechtmäßig erworben und mit freudigem Herzen gegeben – Sünden tilgt, Tierwiedergeburt verhindert und den Geber zu Wohlstand, Ruhm und Schönheit führt; als 'Wurzel aller Rechtschaffenheit und aller Gaben' bezeichnet."}, {"term": "Kokāmukha", "category": "Tīrtha", "definition": "Ein am Himālaya gelegenes heiliges Tīrtha am Fluss Kokā, an dem der Legende nach Viṣṇu in Gestalt des Ebers (Varāha) die verfluchten und im Wasser versinkenden Ahnen (Pitṛs) rettete und das vedische Ahnenopfer (śrāddha) vollzog; Bade-, Trink- und Fastenpraxis dort gilt als sündentilgend und himmelverleihend."}, {"term": "Kokā (Fluss)", "category": "Figur/Fluss", "definition": "Ursprünglich Ūrjā, eine Tochter des Mondes (Soma), die von den Ahnen begehrt und deshalb von ihrem Vater verflucht wurde, zu einem Fluss zu werden; als Fluss Kokā rettete und ernährte sie später paradoxerweise dieselben Ahnen, bevor sie am Ende des Kapitels in Varāhas Schutz gestellt wird."}, {"term": "Narakāsura", "category": "Figur", "definition": "Der 'Erd-Dämon', Sohn Varāhas (in Eberform) und der Erdgöttin Chāyā, dem laut Kap.219 die Stadt Prāgjyotiṣa von Viṣṇu verliehen wurde; eine der bekanntesten Dämonengestalten der Kṛṣṇa-Mythologie."}, {"term": "Śrāddha/Tarpaṇa (Ahnenopfer)", "category": "Ritual", "definition": "Das vedische Ritual der Speise- und Wasserspende an die Ahnen (Pitṛs), in Kap.219 von Varāha selbst mit allen technischen Einzelheiten vorgeführt: Kuśagras, Sesam, Opferbällchen (piṇḍa), Anrufung nach Name und Gotra, Ehrengaben (arghya) und Mantra-Rezitationen."}, {"term": "Sapiṇḍīkaraṇa", "category": "Ritual", "definition": "Das Ritual der 'Vereinigung der Opferbällchen', durch das ein Verstorbener (Preta) etwa ein Jahr nach dem Tod formell in die Reihe der Ahnen (Pitṛs) aufgenommen wird; in Kap.220 mit vier Krügen, einer besonderen Wasserübertragung und dem Spruch 'ye samānāḥ' beschrieben."}, {"term": "Lepabhuj/Sāptapauruṣa", "category": "Verwandtschaftssystem", "definition": "Ein in Kap.220 gelehrtes System der Ahnenverwandtschaft: Vater, Großvater und Urgroßvater sind die eigentlichen 'Opferbällchen-Anteilhaber', der vierte in der Linie wird 'lepabhuj' (Pasten-Genießer); zusammen mit dem Opferherrn als siebtem ergibt sich die 'siebenmännische' (sāptapauruṣa) Verwandtschaft, darüber hinaus folgen die 'Anulepabhuj'."}, {"term": "Paṅktidūṣaka (Reihen-Verderber)", "category": "Konzept", "definition": "Bezeichnung für Brahmanen, die aufgrund körperlicher, moralischer oder sozialer Mängel (u.a. Betrüger, Wucherer, gegen Lohn Unterrichtende, körperlich Entstellte) von der Teilnahme am Śrāddha-Mahl ausgeschlossen sind, da sie die 'Speisereihe' verunreinigen würden; ein ausführlicher Katalog findet sich in Kap.220."}, {"term": "Erlaubte und verbotene Speisen beim Śrāddha", "category": "Konzept", "definition": "Ein in Kap.220 von Varāha verkündetes, sehr umfangreiches Regelwerk, das genau festlegt, welche Getreide, Früchte, Gemüse, Gewürze, Fleischarten, Blumen und Räucherwerke beim Ahnenopfer dargebracht werden dürfen ('göttliche Speise') und welche strikt verboten sind ('dämonische Speise'), da deren Verwendung als schwere Sünde gilt."}, {"term": "Sadācāra (gute Sitte)", "category": "Konzept", "definition": "Die 'gute Sitte' bzw. rechter Lebenswandel des Hausvaters, in Kap.221 als Voraussetzung für den Erfolg von Opfer, Gabe und Askese gelehrt; umfasst einen detaillierten Tagesablauf sowie zahlreiche Etikette- und Verhaltensregeln."}, {"term": "Trivarga (Dreifach-Ziel)", "category": "Konzept", "definition": "Die drei Lebensziele Dharma (Pflicht/Tugend), Artha (materieller Erfolg) und Kāma (Begehren/Genuss), deren ausgewogene, einander nicht widersprechende Verfolgung in Kap.221 als Aufgabe des Hausvaters gelehrt wird."}, {"term": "Ācamana-Tīrthas (Handflächen-Wasserstellen)", "category": "Ritual", "definition": "Die verschiedenen Stellen der Hand (Daumenwurzel = Brahma-Tīrtha, zwischen Zeigefinger und Daumen = Ahnen-Tīrtha, Fingerspitzen = Götter-Tīrtha, kleiner Finger = Prajāpati-Tīrtha), über die bei der rituellen Wassersippung (ācamana) je nach Zweck (Götter-, Ahnen- oder Prajāpati-Ritual) das Wasser fließen soll; in Kap.220-221 ausführlich erläutert."}, {"term": "Āśauca (Totenunreinheit)", "category": "Konzept", "definition": "Die rituelle Unreinheitsperiode nach einem Todes- oder Geburtsfall in der eigenen Verwandtschaft, in Kap.221 mit gestaffelten Fristen für die vier Stände geregelt (Brahmane 10 Tage, Kṣatriya 12 Tage, Vaiśya ein halber Monat, Śūdra ein Monat), während der die täglichen Pflichten und Gaben/Homa-Opfer ruhen."}, {"term": "Varṇadharma (Kastenpflicht)", "category": "Konzept", "definition": "Die spezifischen Pflichten und Lebensunterhalts-Tätigkeiten der vier Kasten (Brahmane, Kṣatriya, Vaiśya, Śūdra), in Kap.222 dargelegt: Studium/Opfer/Lehre für Brahmanen, Waffendienst/Erdenschutz für Kṣatriyas, Viehzucht/Handel/Ackerbau für Vaiśyas, Dienstleistung für Śūdras; in der Not (āpad) dürfen Kasten auch niedrigere Tätigkeiten ausüben."}, {"term": "Vānaprastha (Waldeinsiedler)", "category": "Lebensstadium", "definition": "Das dritte der vier Lebensstadien (āśrama): nach Erfüllung der Hausvater-Pflichten zieht sich der Mann (mit oder ohne Ehefrau) in den Wald zurück, ernährt sich von Blättern, Wurzeln und Früchten, trägt Fell- und Grasgewänder und übt Askese; in Kap.222 ausführlich beschrieben."}, {"term": "Bhikṣu/Parivrājaka (Wanderasket)", "category": "Lebensstadium", "definition": "Das vierte und letzte Lebensstadium (āśrama), auch Mokṣāśrama genannt: völlige Entsagung von Familie, Besitz und Anhaftung, Gleichmut gegenüber allen Wesen, Betteln nur zur Lebenserhaltung, Aufgabe von Begierde/Zorn/Hochmut/Gier; endet laut Kap.222 in der yogischen Selbstauflösung ('inneres Agnihotra') und dem Eingang in die Brahma-Welt."}, {"term": "Vṛtta (Wandel) als Kriterium der Brahmanenschaft", "category": "Konzept", "definition": "Die in Kap.223 im Dialog von Umā und Śiva verkündete Lehre, dass weder Geburt (yoni), noch rituelle Weihe (saṃskāra), noch Kenntnis heiliger Überlieferung (śruti), noch Abstammung (saṃtati), sondern allein der sittliche Wandel (vṛtta) über den Status als Brahmane entscheidet – ein Śūdra rechten Wandels kann zur Brahmanennatur aufsteigen, ein Brahmane schlechten Wandels zur Śūdraschaft herabsinken."}, {"term": "Kāyavāṅmanaskarman (Körper-, Rede- und Geistestat)", "category": "Konzept", "definition": "Die in Kap.224 im Dialog von Umā und Śiva entfaltete dreifache Einteilung des Handelns in Taten des Körpers (kāya), der Rede (vāc) und des Geistes (manas), deren jeweilige gute oder schlechte Ausprägung getrennt untersucht wird, um Bindung an bzw. Befreiung von Wiedergeburt sowie Himmelfahrt (svargagamana) zu erklären; im selben Kapitel wird zudem gelehrt, dass Gewaltlosigkeit (ahiṃsā) zu langem Leben und Höllenfahrt der Gewalttätigen zu kurzem Leben führt."}, {"term": "Brahmarākṣasa (Brahmanen-Dämon)", "category": "Konzept/Wesen", "definition": "In Kap.225 genannte Bestimmung derer, die, der Verblendung verfallen, Unrecht als Dharma bezeichnen, gelübdelos sind und die festgesetzten Grenzen der Überlieferung überschreiten: sie werden nach ihrem Tod zu Brahmarākṣasas, einer Art dämonischen Wesens, das aus dem Fehlverhalten eines (ehemaligen) Brahmanen entsteht."}, {"term": "Klībatva (Unmännlichkeit) als Karma-Folge", "category": "Konzept", "definition": "In Kap.225 gelehrte Vorstellung, dass bestimmte sexuelle Verfehlungen (widernatürlicher Verkehr, Bestialität, Verkehr mit der Frau des Lehrers, wahlloser Geschlechtsverkehr) in einer künftigen Geburt zu Klībatva, der Unmännlichkeit bzw. dem Verlust der Manneskraft, führen."}, {"term": "Vāsudeva-Māhātmya (Kap.226)", "category": "Konzept", "definition": "Die von Śiva (Maheśvara) selbst gegenüber den Weisen verkündete Lehre von der Größe (Māhātmya) Vāsudevas/Kṛṣṇas: Vāsudeva ist höher als Brahmā, aus dessen Leib Brahmā (aus dem Bauch) und Śiva selbst (aus dem Haupt) entstanden sind; wer Vāsudeva schaut, hat damit auch Śiva geschaut. Das Kapitel verbindet diese Lehre mit einer Genealogie von Manu bis zu Vasudeva und dessen Sohn, dem vierarmigen Vāsudeva/Kṛṣṇa, der als Govinda in Dvārakā erscheinen wird."}, {"term": "Lokakrama der Vāsudeva-Verehrer (Kap.227)", "category": "Konzept", "definition": "Die in Kap.227 dargelegte kosmologische Stufenfolge von Himmelswelten (Antarikṣa-, Gandharva-, Āditya-, Candra-, Nakṣatra-, Deva-, Śakra-, Prājāpatya-, Brahmā-Welt), die ein Verehrer Vāsudevas nach dem Tod mit wachsender Verweildauer (in Manvantaras) durchläuft, gefolgt von wiederholten Erdenleben in stets vorzüglicheren Brahmanenfamilien und schließlich dem Aufstieg durch die Welten Haris, Varāhas, Narasiṃhas, Vaikuṇṭhas, Nārāyaṇas sowie der Vyūha-Städte Aniruddhas, Pradyumnas und Saṃkarṣaṇas, bis zur endgültigen Einswerdung mit dem gestaltlosen Vāsudeva (Mokṣa)."}, {"term": "Pañcānṛta (die fünf erlaubten Lügen)", "category": "Konzept", "definition": "Die in Kap.228 (V.50) zitierte dharmaśāstrische Lehre, wonach eine Lüge in fünf Fällen nicht als Sünde gilt: zum Schutz von Kuh, Frau oder Brahmane, bei der Heirat, im Zusammenhang mit Liebesvereinigung, in Todesgefahr und beim Raub allen Vermögens."}, {"term": "Mātaṅga (Bezeichnung für Cāṇḍāla) und die Erzählung vom Wahrheitsschwur (Kap.228)", "category": "Erzählung/Konzept", "definition": "'Mātaṅga' ('Sohn des Mataṅga') ist eine gebräuchliche Bezeichnung für einen Cāṇḍāla. Kap.228 erzählt die Geschichte eines Viṣṇu-verehrenden Mātaṅga aus Avantī, der einem hungrigen Rākṣasa durch einen ausführlichen Wahrheitsschwur (unter Anrufung zahlreicher Sünden als Selbstverwünschung) einen nächtlichen Aufschub abringt, um zuvor sein Ekādaśī-Nachtwachgelübde zu vollenden, und am nächsten Morgen tatsächlich zurückkehrt — wodurch sich der Rākṣasa als gefallener Brahmane (Somaśarman) erweist und durch die Verdienstfrucht von dessen Nachtwachgesang erlöst wird. Die Erzählung mündet, über mehrere Wiedergeburten, in die Geschichte des Brahmanen Satyatapas, der schließlich als Purūravas wiedergeboren wird (vgl. [[Purūravas und Urvaśī]])."}, {"term": "Nāradas Erfahrung der Viṣṇu-Māyā (Kap.229)", "category": "Erzählung/Konzept", "definition": "Nārada bittet Viṣṇu, dessen Māyā zu erkennen, und wird angewiesen, ins Wasser einzutauchen. Er wird darin zu Suśīlā, der Tochter des Königs von Kāśī, durchlebt eine vollständige Frauenexistenz mit Heirat, Kindern und Verwitwung im Krieg, und will sich schließlich auf dem Scheiterhaufen ihres Mannes und Vaters opfern — erst da löst sich die Illusion und Nārada erwacht wieder als er selbst. Das Ereignis begründet das Tīrtha 'Kapālamocana' im Sitoda. Das Motiv wiederholt sich in Kap.229 in der Rahmengeschichte um Kāmadamana, der als Cāṇḍāla-Frau dieselbe Illusion erlebt."}, {"term": "Kapālamocana (Tīrtha der Schädel-Befreiung)", "category": "Ort/Mythos", "definition": "Das aus Nāradas Verbrennungsstätte entstandene Tīrtha im Sitoda-Ozean, an dem Viṣṇu und Maheśvara (Śiva) ewig weilen. Der Name verweist prophetisch auf den Mythos von Rudras Brahmahatyā: Nachdem Rudra Brahmās Haupt abgeschlagen hat, wird ihm der Schädel dort vom Finger fallen, wodurch das Tīrtha berühmt wird (Kap.229, V.60-63)."}, {"term": "Kalisvarūpa (das Wesen des Kali-Zeitalters, Kap.230)", "category": "Konzept", "definition": "Vyāsas ausführliche Schilderung des sittlichen und kosmischen Verfalls im Kali-Zeitalter (Zusammenbruch von Kaste und Lebensstufe, Verkürzung der Lebensspanne, Vorherrschaft von Häresie und Habgier) sowie der paradoxen Kehrseite: im Kali genügt geringste Anstrengung, um die Frucht zu erlangen, für die frühere Zeitalter große Askese erforderten — besonders durch das bloße Lobpreisen (Saṃkīrtana) des Namens Keśavas (V.64)."}, {"term": "Nāma-Saṃkīrtana als Yuga-Dharma des Kali", "category": "Konzept", "definition": "Die in Kap.230 (V.64) dargelegte Lehre, wonach das laute gemeinsame Lobpreisen des Gottesnamens (Saṃkīrtana) im Kali-Zeitalter dieselbe Frucht erbringt wie Meditation im Kṛtayuga, Opfer in der Tretā und Bildverehrung im Dvāpara — die klassische vaiṣṇavische Formel vom 'Yuga-Dharma'."}, {"term": "Kaṣāya (Übergangszeit am Zeitalterende, Kap.231)", "category": "Konzept", "definition": "Technischer Begriff (wörtlich 'Bodensatz/Trübung') für die turbulente Übergangsphase am Ende des Kali-Zeitalters, gekennzeichnet durch Kriege, Naturkatastrophen und den Zusammenbruch der Kastenordnung, aus der jedoch durch Leid und Ernüchterung (nirveda) allmählich die Rückkehr zum Kṛtayuga hervorgeht (Kap.231, V.44-53, 87-88)."}, {"term": "Mond-Gleichnis von Kali und Kṛta (Kap.231)", "category": "Konzept", "definition": "Das Bild, wonach Kali- und Kṛtayuga wie die Phasen ein und desselben Mondes sind — verhüllt bzw. befreit von Dunkel (V.87-88) —, das heißt keine grundverschiedenen Zeitalter, sondern zyklische Zustände derselben Zeit."}, {"term": "Trividha-Pratisaṃcara (die dreifache Weltauflösung)", "category": "Konzept", "definition": "Die in Kap.232 dargelegte Dreiteilung der kosmischen Auflösung: die Naimittika (durch einen Anlass bedingte, am Ende eines Kalpa eintretende 'Brahmā-Auflösung'), die Prākṛtika (elementare Auflösung nach zwei Parārdhas, wenn alles Manifeste ins Unmanifeste zurückkehrt) und die Ātyantika (die endgültige, mit der individuellen Erlösung/Mokṣa gleichgesetzte Auflösung)."}, {"term": "Kālāgnirudra und die Naimittika-Pralaya (Kap.232)", "category": "Erzählung/Konzept", "definition": "Die ausführliche Schilderung der periodischen Weltauflösung am Ende eines Kalpa: hundertjährige Dürre, sieben Sonnen, die alle Gewässer und schließlich die drei Welten samt den Unterwelten (Pātālas) verbrennen — Letzteres durch Rudra in der Gestalt des Kālāgnirudra, angefacht durch den Atem der Schlange Śeṣa —, gefolgt von den vielfarbigen Auflösungswolken (Saṃvartaka), die das Feuer löschen und die Welt über hundert Jahre hinweg zu einem einzigen Ozean (Ekārṇava) überfluten."}, {"term": "Prākṛtika-Pralaya: die Rückauflösung der Tattvas (Kap.233)", "category": "Konzept", "definition
