": "Die sāṃkhya-artige, schrittweise Rückauflösung der Daseinsprinzipien (Tattvas) am Ende zweier Parārdhas: die grobstofflichen Elemente lösen sich der Reihe nach in ihre Subtilessenzen (Tanmātras: Geruch, Geschmack, Form, Berührung, Klang) und damit ineinander auf (Erde→Wasser→Feuer→Wind→Raum), dann in den Bhūtādi (tamasigen Ahaṃkāra), diesen in den Mahat, den Mahat in die Prakṛti, und schließlich Prakṛti und Puruṣa gemeinsam in das Höchste Selbst (Paramātman), das mit Viṣṇu gleichgesetzt wird (Kap.233)."}, {"term": "Tāpatraya (die dreifache Pein, Kap.234)", "category": "Konzept", "definition": "Die klassische dreifache Einteilung des Leidens: Ādhyātmika (das durch den eigenen Leib und Geist verursachte Leid, weiter unterteilt in körperliches und seelisches Leid), Ādhibhautika (das durch andere Lebewesen verursachte Leid) und Ādhidaivika (das durch überirdische bzw. naturhafte Mächte verursachte Leid). Diese dreifache Pein bildet im Brahma-Purāṇa den Ausgangspunkt der Lehre von der Ātyantika-Pralaya, der endgültigen Erlösung durch Erkenntnis (Kap.234)."}, {"term": "Zwei Wissensarten: śabda-brahma und para-brahma (Kap.234)", "category": "Konzept", "definition": "Die im Brahma-Purāṇa unter Berufung auf die 'cātharvaṇī śrutiḥ' (die Lehrüberlieferung des Atharvaveda, vgl. Muṇḍaka-Upaniṣad) dargelegte Zweiteilung des Wissens: die niedere Wissensart (apara vidyā), das 'Wort-Brahman' (śabda-brahma), das die heiligen Schriften und ihr Studium umfasst, und die höhere Wissensart (para vidyā), das 'Höchste Brahman' (para-brahma), das durch Unterscheidungsvermögen (viveka) unmittelbar erkannt wird und zur endgültigen Befreiung von aller Pein führt (Kap.234)."}, {"term": "Vāsudeva-Nirvacana (die Wortdeutung des Namens Vāsudeva, Kap.234)", "category": "Konzept", "definition": "Die etymologische Deutung des Namens 'Vāsudeva' von der Wurzel √vas ('wohnen, einwohnen'): Vāsudeva ist derjenige, in dem alle Wesen wohnen und der zugleich in allen Wesen wohnt, weshalb die Kenner des Wortsinns ihn 'Vāsudeva' nennen (Kap.234)."}, {"term": "Yoga-Praxis-Anweisungen: Orte, Haltung, Praṇava (Kap.235)", "category": "Konzept", "definition": "Das im Brahma-Purāṇa dargelegte klassische Yoga-Lehrstück: Voraussetzungen (Schriftstudium, Lehrerverehrung), mäßige Nahrung, eine Liste zu meidender Orte und Zustände samt der daraus entstehenden Gebrechen bei Missachtung, die geeigneten Orte und Körperhaltung (Padmāsana, Blick auf die Nasenspitze, Atemzurückhaltung), das Rezitieren der Silbe Praṇava (OM) und die stufenweise Überdeckung der Guṇas (Tamas durch Rajas, Rajas durch Sattva), bis der Yogin sich mit dem im Herzenslotos weilenden Puruṣottama vereinigt (Kap.235)."}, {"term": "Turīya (der vierte, die drei Bewusstseinszustände übersteigende Zustand, Kap.235)", "category": "Konzept", "definition": "Der reine, Wachen, Traum und Tiefschlaf übersteigende vierte Bewusstseinszustand, in dem sich der durch die Kraft des Yoga vollendete Yogin mit Puruṣottama vereinigt und befreit wird (Kap.235)."}, {"term": "Sāṃkhya-Kapitel: Elemente, Sinne und das alldurchdringende Selbst (Kap.236)", "category": "Konzept", "definition": "Vyāsas Darlegung des Sāṃkhya auf die Frage der Weisen: die Verankerung der groben Elemente und Sinnesorgane im Körper, die Rangordnung von Sinnen, Geist (Manas) und Elementar-Selbst (Bhūtātman), die Unsichtbarkeit des alldurchdringenden Selbst für Auge und Sinne, die Lehre vom Gleichblick auf Brahmanen, Kuh, Elefant, Hund und Caṇḍāla (Kap.236, V.20, vgl. Bhagavadgītā 5.18), sowie die Zweiheit von Kṣara (vergänglich) und Akṣara (unvergänglich) im Selbst (vgl. Bhagavadgītā 15.16)."}, {"term": "Haṃsa-Lehre: die Seele in der Neun-Tore-Stadt (Kap.236)", "category": "Konzept", "definition": "Das Bild vom Körper als 'Stadt mit neun Toren', in der der Haṃsa (die individuelle Seele) gezügelt weilt; unterschieden wird der 'Haṃsa' als das Vergängliche (Kṣara) vom unveränderlich feststehenden Unvergänglichen (Akṣara, Kūṭastha), dessen Erlangung den Wissenden von Lebensatem und Wiedergeburt befreit (Kap.236)."}, {"term": "Die fünf Yoga-Fehler: Kāma, Krodha, Lobha, Bhaya, Nidrā (Kap.236)", "category": "Konzept", "definition": "Die fünf im Brahma-Purāṇa genannten Hindernisse der Yoga-Praxis — Begierde, Zorn, Gier, Furcht und Schlaf — samt den jeweiligen Gegenmitteln (Gelassenheit gegen Zorn, Aufgeben des Vorsatzes gegen Begierde, Pflege des Sattva gegen Schlaf usw.), deren Überwindung die Voraussetzung für die Erkenntnis des alldurchdringenden Selbst bildet (Kap.236)."}, {"term": "Pravṛtti- und Nivṛtti-Dharma: die zwei vedischen Pfade (Kap.237)", "category": "Konzept", "definition": "Die im Brahma-Purāṇa dargelegte Zweiteilung des in den Veden gegründeten Dharma: der durch Aktivität gekennzeichnete Pravṛtti-Pfad (Handlung, die nach dem Tod zu erneuter verkörperter Geburt führt) und der als Enthaltung bezeichnete Nivṛtti-Pfad (Wissen, das zur Auflösung ins unmanifeste, unvergängliche Brahman führt) (Kap.237)."}, {"term": "Buddhi-Hierarchie: Sinne, Objekte, Geist, Erkenntniskraft, Selbst (Kap.237)", "category": "Konzept", "definition": "Die im Brahma-Purāṇa zweifach wiederholte (V.23-24, V.66) klassische Rangfolge, wonach die Sinnesobjekte höher stehen als die Sinne, der Geist (Manas) höher als die Objekte, die Erkenntniskraft (Buddhi) höher als der Geist, das große Selbst höher als die Buddhi, das Unmanifeste höher als das Große und das Unsterbliche als höchste Stufe — eine Lehre, die der Kaṭha-Upaniṣad (3.10-11) entspricht."}, {"term": "Guṇa-Kennzeichen: Sattva, Rajas, Tamas (Kap.237)", "category": "Konzept", "definition": "Die im Brahma-Purāṇa gegebenen Erkennungsmerkmale der drei Grundqualitäten (Guṇas): Sattva zeigt sich in Freude, Zuneigung, Wonne und innerer Ruhe; Rajas in Selbstüberhebung, Lüge, Gier, Verblendung und Ungeduld; Tamas in Verblendung, Nachlässigkeit, Mattigkeit und Schlaf-Benommenheit (Kap.237)."}, {"term": "Der Saṃsāra-Fluss: Gleichnis vom schrecklichen Strom (Kap.238)", "category": "Konzept", "definition": "Die ausgedehnte Fluss-Metapher des Brahma-Purāṇa für den Kreislauf der Wiedergeburt: die fünf Sinne als Krokodile, der begehrende Geist als Ufer, Gier und Verblendung als Gras, Begierde und Zorn als Kriechtiere, Wahrheit als Furt, Lüge als Aufruhr, Zorn als Schlamm, die Zunge als Wirbel — ein für die Ungeläuterten unüberquerbarer, nur von den an Erkenntnis Vollendeten durchquerbarer Strom (Kap.238, V.26-30)."}, {"term": "Der einzige Weg zur Befreiung: Mittel und Tugendkatalog (Kap.238)", "category": "Konzept", "definition": "Vyāsas Lehre, dass es zur Mokṣa nur einen einzigen Weg gibt (wie der Weg zum Ostmeer nicht zum Westmeer führt), verwirklicht durch eine Reihe von Gegenmitteln gegen Laster (Geduld gegen Zorn, Zufriedenheit gegen Gier usw.) und durch den Tugendkatalog aus Meditation, Studium, Freigebigkeit, Wahrheit, Scham, Aufrichtigkeit, Geduld, Reinheit und Sinnesbezähmung, der zur Auflösung von Begierde und Zorn im Zustand des Brahman führt (Kap.238, V.43-57)."}, {"term": "Sāṃkhya vs. Yoga: gleiche Tugend, verschiedene Anschauung (Kap.239)", "category": "Konzept", "definition": "Vyāsas Erklärung, warum Sāṃkhya und Yoga trotz gleicher geforderter Reinheit, gleichen Mitgefühls und gleicher Gelübde in ihrer philosophischen Anschauung (darśana) verschieden sind: die Yoga-Anhänger berufen sich auf einen persönlichen Herrscher (Īśvara) als Voraussetzung der Befreiung, die Sāṃkhya-Anhänger auf reine Unterscheidungserkenntnis (Kap.239, V.2-9)."}, {"term": "Yoga-Kraft-Gleichnisse: Fisch, Feuer, Strömung (Kap.239)", "category": "Konzept", "definition": "Eine Reihe von Gleichnissen im Brahma-Purāṇa zur Illustration, dass nur der 'kraftvolle' (balavat), nicht der kraftlose Yoga von den Fesseln des Karma befreit: wie ein starker Fisch das Netz durchtrennt, ein starkes Feuer die ganze Erde verbrennt, oder ein Damm die Strömung des Saṃsāra aufhält, während die Schwachen darin zugrunde gehen oder fortgerissen werden (Kap.239, V.12-25)."}, {"term": "Der Ozean des Saṃsāra: die große Ozean-Allegorie (Kap.240)", "category": "Konzept", "definition": "Eine ausgedehnte, kunstvolle Allegorie im Brahma-Purāṇa (V.55-68), die das Dasein (Saṃsāra) als gewaltigen Ozean darstellt: Kummer und Krankheit als große Seen und Meeresungeheuer, Anhaftung als Schlamm, Wahrheit als Ufer, Tränen als Salz - durchquert von den befreiten Weisen mittels Wissens-Yoga. Sie erweitert das kleinere Fluss-Gleichnis aus Kap.238, V.26-30."}, {"term": "Die Aufstiegs-Kosmologie der Befreiung: Sonne, Wind, Äther, Rajas, Sattva (Kap.240)", "category": "Konzept", "definition": "Eine im Brahma-Purāṇa geschilderte Stufenfolge (V.69-76), nach der die befreite Seele nacheinander von der Sonne, dann vom Wind (Pravaha), vom Äther (Nabhas), von Rajas und schließlich von Sattva 'getragen' wird, bis sie den höchsten Herrn Nārāyaṇa und das höchste Selbst erreicht und zur Unsterblichkeit gelangt, ohne zurückzukehren."}, {"term": "Amūrti und Mūrti: die Gestaltlosigkeit des Brahman und das Sāṃkhya als seine Gestalt (Kap.240)", "category": "Konzept", "definition": "Eine Lehraussage des Brahma-Purāṇa (V.103), wonach das Brahman selbst gestaltlos (amūrti) ist, das Sāṃkhya-Wissen aber gemäß der Śruti als seine 'Gestalt' (mūrti) gilt - also seine erkennbare, in Begriffen fassbare Erscheinungsform."}, {"term": "Karālajanaka und Vasiṣṭha: das Gespräch über Akṣara und Kṣara (Kap.241)", "category": "Konzept", "definition": "Ein im Brahma-Purāṇa erzähltes 'itihāsa' (uralte Geschichte): König Karālajanaka befragt den Weisen Vasiṣṭha nach dem Unterschied zwischen Akṣara (dem Unvergänglichen, von dem aus keine Wiederkehr erfolgt) und Kṣara (dem Vergänglichen, dem Kreislauf der vergehenden Welt), woraufhin Vasiṣṭha die vierundzwanzig Prinzipien der Prakṛti und den Puruṣa als 25. Prinzip darlegt."}, {"term": "Die 24 Prinzipien und der 25. Puruṣa (Pañcaviṃśaka), Vidyā- und Avidyā-Sarga (Kap.241)", "category": "Konzept", "definition": "Die im Brahma-Purāṇa dargelegte Sāṃkhya-Kosmogonie: aus dem Unmanifesten entsteht Mahat/Hiraṇyagarbha (die 'Wissens-Schöpfung', Vidyā-Sarga), daraus der Ahaṃkāra (die 'Unwissens-Schöpfung', Avidyā-Sarga), daraus die fünf Elemente, die zehn Sinnesorgane und das Manas - zusammen 24 Prinzipien (tattvacaturviṃśā). Der Puruṣa als 'Fünfundzwanzigster' (Pañcaviṃśaka), gestaltlos und ewig, steht jenseits dieser Reihe und wird durch Erkenntnis allein erlangt (Kap.241, V.20-28, 37-38, 48)."}, {"term": "Die Verneinungspaare des falsch identifizierten Selbst (Kap.242)", "category": "Konzept", "definition": "Eine markante Versreihe im Brahma-Purāṇa (V.49-52), die dem wahren, unveränderlichen Selbst dessen fälschliche Selbstidentifikation gegenüberstellt: obwohl ohne Sinnesorgane, hält es sich für verwundbar; obwohl zeitlos, für der Zeit unterworfen; obwohl unsterblich, für sterblich; obwohl unbeweglich, für beweglich; obwohl kein Prinzip, für ein Prinzip - all dies aus 'Abuddhatva' (Unverständnis)."}, {"term": "Das Gleichnis von den sechzehn Mondphasen (Kalās) und der Wiedergeburt (Kap.242)", "category": "Konzept", "definition": "Ein Gleichnis im Brahma-Purāṇa (V.54-58), das die wiederholten Wiedergeburten des unerlösten Selbst mit dem zyklischen An- und Abschwellen der sechzehn Mondphasen vergleicht: die ersten fünfzehn Phasen entsprechen dem Kreislauf der Wiedergeburt, während die subtile, sechzehnte Phase den wahren, unvergänglichen Soma (das Selbst) darstellt, der selbst von den Göttern nicht verzehrt wird und nur durch die Überwindung der Ich-Bezogenheit (Mamatva) erreicht wird."}, {"term": "Wortlaut und Sinn: die Warnung vor bloßem Textbewahren (Kap.243)", "category": "Konzept", "definition": "Vasiṣṭhas Belehrung im Brahma-Purāṇa (V.11-19), dass das bloße Auswendigbewahren des Wortlauts von Veda und Lehrschrift ohne Kenntnis von dessen wahrem Sinn vergeblich sei, und dass Streitreden ohne echtes Verständnis, aus Gier oder Heuchelei geführt, zur Hölle führen."}, {"term": "Kṣetra und Kṣetrajña als 'Feld' und 'Feldkenner' im Sāṃkhya (Kap.243)", "category": "Konzept", "definition": "Die im Brahma-Purāṇa dargelegte Lehre, dass das Unmanifeste (Avyakta) das 'Feld' (Kṣetra) sei und der Fünfundzwanzigste (Puruṣa) dessen 'Kenner' (Kṣetrajña) - mit der volksetymologischen Deutung, dass Puruṣa 'im [Körper als] Stadt (pur) ruht (śete)'. Zugleich wird paradox festgehalten, dass derselbe Puruṣa auch als 'das Erkennbare' (jñeya) bezeichnet wird, da er letztlich jenseits der Unterscheidung von Erkennendem und Erkanntem steht (V.76-81)."}, {"term": "Die Vidyā-Stufenleiter: das Erkenntnismittel jeder Ebene (Kap.244)", "category": "Konzept", "definition": "Eine im Brahma-Purāṇa dargelegte epistemologische Hierarchie (V.4-9), die parallel zur ontologischen Sāṃkhya-Stufenfolge verläuft: das 'Wissen' (Vidyā) der Handlungsorgane sind die Erkenntnisorgane, deren Wissen die Elementar-Besonderheiten, deren Wissen der Geist (Manas), dessen Wissen die fünf Elemente, deren Wissen der Ahaṃkāra, dessen Wissen die Buddhi, deren Wissen die Prakṛti (das Unmanifeste), und deren Wissen der Fünfundzwanzigste (Puruṣa) ist."}, {"term": "Das Gleichnis vom Fisch: die Selbstrede des erwachenden Feldkenners (Kap.244)", "category": "Konzept", "definition": "Ein eindrückliches inneres Selbstgespräch des erwachenden Feldkenners im Brahma-Purāṇa (V.23-39), der sein früheres Verhaftetsein mit dem Körper mit einem Fisch vergleicht, der aus mangelndem Erkennen meint, nicht vom Wasser verschieden zu sein - bis er erwacht und beschließt, sich von der 'Ich-Bezogenheit' (Mamatva) zu lösen und beim leidlosen, unwandelbaren Selbst Zuflucht zu suchen."}, {"term": "Der Sechsundzwanzigste (Ṣaḍviṃśa): das Prinzip jenseits des Puruṣa (Kap.245)", "category": "Konzept", "definition": "Eine im Brahma-Purāṇa gelehrte Erweiterung über die klassische Sāṃkhya-Zählung von 25 Prinzipien (mit dem Puruṣa als Fünfundzwanzigstem) hinaus: ein 'Sechsundzwanzigstes' Prinzip, das selbst den individuellen Puruṣa übersteigt und als höchster Paramātman/Īśvara verstanden wird. Diese Lehre ist eine purāṇische Zutat, die sich so nicht in der klassischen Sāṃkhya-Kārikā findet."}, {"term": "Die Regel der geheimen Unterweisung (Guhyopadeśavidhi, Kap.245)", "category": "Konzept", "definition": "Eine Liste von Bedingungen im Brahma-Purāṇa (V.32-37, wiederholt V.52-53), die festlegt, wem die geheime Sāṃkhya-Yoga-Lehre über den Fünfundzwanzigsten und Sechsundzwanzigsten mitgeteilt werden darf und wem nicht - ein wiederkehrendes Motiv, das bereits in Kap.237 V.36-39 in ähnlicher Form erscheint."}, {"term": "Die Lehrüberlieferung: Hiraṇyagarbha, Vasiṣṭha, Nārada, Vyāsa (Kap.245)", "category": "Konzept", "definition": "Die im Brahma-Purāṇa (V.44-46) genannte Überlieferungskette der Sāṃkhya-Yoga-Lehre vom Fünfundzwanzigsten und Sechsundzwanzigsten: von Hiraṇyagarbha (dem 'Goldenen Keim') über Vasiṣṭha und Nārada bis zu Vyāsa, der sie in diesem Purāṇa an die Weisen weitergibt."}, {"term": "Phalaśruti: die Darlegung der Hörfrüchte (Kap.246)", "category": "Konzept", "definition": "Der traditionelle Schlussabschnitt eines Purāṇa, der die Früchte (Phala) aufzählt, die das Hören (Śravaṇa), Lesen oder Rezitieren des Textes gewährt - im Brahma-Purāṇa (V.16-33) eine Liste von Wirkungen wie Reichtum, Sieg, Wissen, Sündentilgung und schließlich das Erreichen der Welt Viṣṇus (Viṣṇuloka)."}, {"term": "Die Lampe des Wissens: das Lob des Vyāsa (Kap.246)", "category": "Konzept", "definition": "Ein hymnischer Lobpreis der Weisen an Vyāsa (V.6-12) nach dem Vortrag des Brahma-Purāṇa, der die bekannte Bildformel vom 'Stäbchen der Wissens-Augensalbe' (jñānāñjanaśalākā) verwendet, mit dem die von der Finsternis des Nichtwissens geblendeten Augen geöffnet werden."}, {"term": "Das Ende des Brahma-Purāṇa (Kap.246)", "category": "Struktur", "definition": "Kapitel 246 ist das letzte Kapitel des Brahma-Purāṇa in der vorliegenden GRETIL-Quelle. Es schließt mit einer dreiversigen Dharma-Lobpreisung (V.36-38) und der klassischen Abschlussformel, in der Lomaharṣaṇa (Sūta) die versammelten Weisen um die Erlaubnis bittet, sich zu entfernen (V.40)."}, {"term": "Bādarāyaṇa", "category": "Person", "definition": "Beiname des Weisen Vyāsa (nach seinem vermuteten Geburts- oder Wohnort Bādarī); im Bhāgavata-Purāṇa als 'der Beste der Vedakenner' bezeichnet, dem die Zusammenstellung der Veden und die Verfassung der Purāṇas/Itihāsas zugeschrieben wird."}, {"term": "Sātvatas", "category": "Konzept", "definition": "Ein Zweig der Yadu-/Vṛṣṇi-Dynastie, dem Vasudeva und damit Kṛṣṇa angehören; im Bhāgavata-Purāṇa wird Kṛṣṇa als 'Herr der Sātvatas' (sātvatāṃ patiḥ) bezeichnet."}, {"term": "Bhakti als höchster Dharma (Kap. Bhāgavata 1.2)", "category": "Konzept", "definition": "Die im Bhāgavata-Purāṇa (1.2.6) gegebene, überaus einflussreiche Definition des höchsten Dharma als grundlose (ahaitukī) und ungehinderte (apratihatā) Hingabe (Bhakti) zum Transzendenten (Adhokṣaja) - einer der meistzitierten Verse der Vaiṣṇava-Theologie."}, {"term": "Śuka", "category": "Person", "definition": "Sohn des Weisen Vyāsa, der der Legende nach ohne Initiation und ohne Erfüllung ritueller Pflichten unmittelbar in die Weltentsagung zog; gilt als der eigentliche Erzähler des Bhāgavata-Purāṇa (an König Parīkṣit)."}, {"term": "Adhokṣaja", "category": "Gottheit", "definition": "Beiname Viṣṇus/Kṛṣṇas, 'der jenseits der [gewöhnlichen] Sinneswahrnehmung ist', der Transzendente."}, {"term": "Die 22 Avatāras (Bhāgavata 1.3)", "category": "Konzept", "definition": "Die berühmte Liste der Herabkünfte (Avatāras) Viṣṇus im Bhāgavata-Purāṇa (1.3.6-25): Kaumāra-Weise, Varāha, Devarṣi Nārada, Nara-Nārāyaṇa, Kapila, Dattātreya, Yajña, Ṛṣabha, Pṛthu, Matsya, Kūrma, Dhanvantari, Mohinī, Narasiṃha, Vāmana, Paraśurāma, Vyāsa, Rāma, Balarāma/Kṛṣṇa, Buddha, Kalki - mit der abschließenden Feststellung, die Avatāras seien in Wahrheit unzählbar, während Kṛṣṇa allein 'der Erhabene selbst' (svayam bhagavān) sei."}, {"term": "kṛṣṇas tu bhagavān svayam", "category": "Konzept", "definition": "\"Kṛṣṇa aber ist der Erhabene selbst\" (Bhāgavata 1.3.28) - einer der theologisch folgenreichsten Verse des Bhāgavata-Purāṇa, Grundlage der (v.a. im Gauḍīya-Vaiṣṇavismus zentralen) Unterscheidung zwischen Kṛṣṇa als der ungeteilten Quelle und allen übrigen Avatāras als bloßen Teilen/Teil-von-Teilen (aṃśa/kalā) von ihm."}, {"term": "Dattātreya", "category": "Person", "definition": "Sohn des Weisen Atri und der Anasūyā, sechster Avatāra Viṣṇus im Bhāgavata-Purāṇa; lehrte die Anvīkṣikī (rationale Unterscheidungswissenschaft) an Schüler wie Alarka und Prahlāda."}, {"term": "Die Vierteilung des Veda und das Itihāsa-Purāṇa als fünfter Veda", "category": "Konzept", "definition": "Im Bhāgavata-Purāṇa (1.4.19-25) berichtete Tat Vyāsas: angesichts des Niedergangs von Glauben, Kraft und Lebensspanne der Menschen im beginnenden Kaliyuga gliederte er den einen Veda in Ṛg-, Yajur-, Sāma- und Atharvaveda (an die Schüler Paila, Vaiśampāyana, Jaimini, Sumantu übergeben) und verfasste zusätzlich das Itihāsa-Purāṇa (u.a. das Mahābhārata) als 'fünften Veda', zugänglich auch für Frauen, Śūdras und einfache Menschen."}, {"term": "Vyāsas Unzufriedenheit (Bhāgavata 1.4)", "category": "Konzept", "definition": "Trotz der Vollendung aller Veda-Redaktionen und des Mahābhārata bleibt Vyāsas Herz unbefriedigt (1.4.26-31); er erkennt schließlich, dass er die Bhagavata-Dharmas (Hingabe-Lehren), die den Paramahaṃsas und Acyuta selbst lieb sind, noch nicht dargelegt hat - der Ausgangspunkt für Nāradas Ermahnung (Adhyāya 5) und die Komposition des Bhāgavata-Purāṇa selbst."}, {"term": "Śukas Nacktheit vor den Himmelsfrauen", "category": "Episode", "definition": "Anekdote (Bhāgavata 1.4.5): die badenden Apsaras bedecken sich aus Scham, als der nackte Vyāsa vorbeikommt, nicht aber vor seinem ebenfalls nackten Sohn Śuka - als Erklärung nennen sie, dass Vyāsa noch die Dualität von Mann und Frau wahrnehme, Śuka hingegen nicht (sein Blick sei 'von aller Dualität geschieden')."}, {"term": "Die Krähen-Tränke und die Schwäne (Bhāgavata 1.5.10-11)", "category": "Konzept", "definition": "Eines der berühmtesten Bildpaare des Bhāgavata-Purāṇa: Rede, die nicht den Ruhm Haris besingt, gilt den geistig Reinen (\"Schwänen\", haṃsa/mānasa) als bloße \"Krähen-Tränke\" (vāyasaṃ tīrtham); umgekehrt wird selbst grammatisch unvollkommene Dichtung, die die Namen des Unendlichen trägt, von den Rechtschaffenen gehört, gesungen und rezitiert - Grundlage der Selbstlegitimation von Bhakti-Dichtung gegenüber bloß kunstvoller, gottesloser Rede."}, {"term": "Nāradas Vorleben als Dienerknabe (Bhāgavata 1.5.23-31)", "category": "Episode", "definition": "Nāradas Erzählung seines früheren Lebens als Sohn einer Dienerin, der als Knabe frommen, während der Regenzeit rastenden Weisen diente, durch deren Gnade Kṛṣṇa-Erzählungen hörte, dadurch Bhakti entwickelte und von den scheidenden Weisen das geheimste, direkt vom Erhabenen stammende Wissen empfing."}, {"term": "Catur-vyūha-Mantra", "category": "Konzept", "definition": "\"oṃ namo bhagavate tubhyaṃ vāsudevāya dhīmahi / pradyumnāyāniruddhāya namaḥ saṅkarṣaṇāya ca\" (Bhāgavata 1.5.37) - das Grundmantra der vierfachen Erscheinungsweise (Vāsudeva, Saṅkarṣaṇa, Pradyumna, Aniruddha) der Sātvata-/Pāñcarātra-Theologie (vgl. Projekt 4, Sātvata-Saṃhitā)."}, {"term": "Nāradas erste Hari-Vision und Verheißung (Bhāgavata 1.6.14-25)", "category": "Episode", "definition": "Der als Dienerknabe verstorbene und als Waise umherziehende junge Nārada erhält im Wald eine flüchtige, ekstatische Vision Haris im Herzen, die sogleich wieder entschwindet; die Stimme des Herrn erklärt ihm, eine erneute Schau sei ihm in diesem Leben nicht mehr vergönnt, verheißt ihm aber unverlierbare Hingabe und ungebrochene Erinnerung über Weltzeitalter hinweg - der Ursprung von Nāradas gegenwärtiger Existenz als göttlicher Weiser."}, {"term": "Nāradas kosmische Existenz zwischen den Weltzeitaltern", "category": "Konzept", "definition": "Bhāgavata 1.6.30-32: Am Ende eines Kalpa geht Nārada als Lebenshauch (prāṇa) in den auf dem Urozean ruhenden Viṣṇu ein und wird bei dessen Erwachen, zusammen mit Marīci und den anderen Ṛṣis, aus dessen Atem neu geboren - seither durchwandert er ungehindert, durch Viṣṇus Gnade, die drei Welten."}, {"term": "ātmārāmāḥ und die grundlose Hingabe (Bhāgavata 1.7.10)", "category": "Konzept", "definition": "\"ātmārāmāś ca munayo nirgranthā apy urukrame / kurvanty ahaitukīṃ bhaktim ittham-bhūtaguṇo hariḥ\" - selbst die in sich selbst ruhenden, von allen Fesseln gelösten Weisen üben grundlose (nicht durch einen weiteren Zweck motivierte) Hingabe an den Weitschreitenden; so beschaffen sind Haris Eigenschaften. Einer der theologisch einflussreichsten Verse des Bhāgavata-Purāṇa, oft als Beleg dafür zitiert, dass Bhakti auch jenseits reiner Erlösungssuche (mokṣa) einen eigenen, höheren Wert besitzt."}, {"term": "Aśvatthāmans nächtliches Gemetzel und die Brahmāstra-Episode (Bhāgavata 1.7.13-58)", "category": "Episode", "definition": "Nach der Rahmenrückkehr zur Kuru-Kṣetra-Handlung: Aśvatthāman tötet nachts aus Rache Draupadīs schlafende Söhne; Arjuna verfolgt und stellt ihn; beide setzen Brahma-Waffen ein, die auf Kṛṣṇas Geheiß zurückgenommen werden; Aśvatthāman wird gefangen, von Kṛṣṇa als kindermörderisch des Todes für schuldig befunden, doch auf Draupadīs mitleidsvolles Eintreten hin (unter Hinweis auf Droṇas Erbe und die Trauer seiner Mutter Aśvatthāmā) statt getötet nur seines Stirnjuwels beraubt, geschoren und aus dem Lager verbannt - ein von Kṛṣṇa vermittelter Kompromiss zwischen Strafe und Gnade."}, {"term": "Kuntī-Stuti (Bhāgavata 1.8.18-43)", "category": "Hymnus", "definition": "Einer der berühmtesten und theologisch dichtesten Hymnen des gesamten Bhāgavata-Purāṇa: Kuntīs (Pṛthās) Lobpreis Kṛṣṇas unmittelbar vor dessen Aufbruch nach Dvārakā, in dem sie ihn als den durch Māyā verhüllten, allgegenwärtigen und zugleich für gewöhnliche Sicht unzugänglichen Puruṣa preist, ihm für wiederholte Rettungen der Pāṇḍavas dankt und um beständige, ausschließliche Hingabe (bhakti) sowie um die Lösung ihrer Anhänglichkeit an die eigene Familie bittet."}, {"term": "Uttarās Errettung und die Māyā-Umhüllung des Parīkṣit (Bhāgavata 1.8.9-17)", "category": "Episode", "definition": "Die schwangere Uttarā (Abhimanyus Witwe) fleht Kṛṣṇa um Schutz vor dem heranrasenden Brahmāstra Aśvatthāmans; Kṛṣṇa schützt die Pāṇḍavas mit seinem Sudarśana-Diskus und verhüllt zugleich mit seiner eigenen Māyā die Leibesfrucht im Mutterleib - die Geburt des späteren Königs Parīkṣit, dessen Errettung hier ihren Ursprung hat."}, {"term": "kālam īśānam - Kṛṣṇa als personifizierte Zeit (Bhāgavata 1.8.28)", "category": "Konzept", "definition": "\"manye tvāṃ kālam īśānam anādinidhanaṃ vibhum\" - Kuntī erkennt in Kṛṣṇa die Zeit (Kāla) selbst, den anfangs- und endlosen, überall gleichmäßig waltenden Herrscher, aus dessen unparteiischem Wirken paradoxerweise der wechselseitige Streit (Kali) unter den Geschöpfen entsteht."}, {"term": "Bhīṣma-Stuti (Bhāgavata 1.9.32-42)", "category": "Hymnus", "definition": "Bhīṣmas berühmte Sterbehymne auf dem Pfeilbett, unmittelbar vor seinem selbstgewählten Tod zu Beginn des Uttarāyaṇa: eine Reihe ergreifender Erinnerungsbilder an Kṛṣṇas Rolle im Kurukṣetra-Krieg (u.a. die Episode, in der Kṛṣṇa sein Gelübde, keine Waffe zu ergreifen, fast bricht, um Bhīṣma zu bestrafen), gefolgt von der Erkenntnis von dessen universaler, in jedem Herzen gegenwärtiger Göttlichkeit."}, {"term": "Icchā-mṛtyu (freiwilliger Tod) und Uttarāyaṇa", "category": "Konzept", "definition": "Bhīṣma besaß der Überlieferung nach als Segen seines Vaters Śantanu die Gabe, den Zeitpunkt seines eigenen Todes frei zu wählen; er verharrte auf dem Pfeilbett, bis der als besonders günstig geltende Beginn des nördlichen Sonnenlaufs (Uttarāyaṇa) anbrach, um dann bewusst zu sterben (Bhāgavata 1.9.29)."}, {"term": "Kṛṣṇas fast gebrochenes Gelübde (Bhāgavata 1.9.37)", "category": "Episode", "definition": "Von Bhīṣma in seiner Sterbehymne erinnerte Episode aus dem Krieg: Kṛṣṇa hatte geschworen, im Kurukṣetra-Krieg selbst keine Waffe zu ergreifen; als Bhīṣma ihn wiederholt provozierte, sprang Kṛṣṇa dennoch vom Wagen, ergriff ein Wagenrad als Waffe und stürmte auf Bhīṣma zu, wurde jedoch von Arjuna aufgehalten."}, {"term": "Das Gespräch der Kuru-Frauen über Kṛṣṇas kosmische Identität (Bhāgavata 1.10.21-24)", "category": "Hymnus", "definition": "Beim Anblick des abreisenden Kṛṣṇa führen die Frauen der Kuru-Hauptstadt ein philosophisch dichtes Gespräch über seine wahre Natur: er sei der uralte, undifferenzierte Puruṣa vor der Schöpfung, der Schöpfer der heiligen Lehrschriften, das Ziel der Weisen, und derjenige, der ohne je daran zu haften die Welt erschafft, erhält und wieder auflöst - eine kompakte Kosmogonie in Versform."}, {"term": "Yudhiṣṭhiras idealer Herrschaftsbeginn (Bhāgavata 1.10.4-6)", "category": "Konzept", "definition": "Klassische Beschreibung eines gerechten Königreichs unter Yudhiṣṭhira: reicher Regen, von Milch strotzende Kühe, fruchttragende Pflanzen zur rechten Jahreszeit, und - solange er herrscht - völlige Freiheit der Untertanen von seelischen Nöten, Krankheiten und Leiden."}, {"term": "Die Huldigungshymne der Untertanen Ānartas (Bhāgavata 1.11.6-10)", "category": "Hymnus", "definition": "Beim Anblick des heimkehrenden Kṛṣṇa preisen die Untertanen seine Lotosfüße als jenseits der Macht der Zeit stehend, ihn selbst als Mutter, Vater, Lehrer und höchste Gottheit zugleich, und beklagen in kunstvollerem Versmaß (V.10) die Unerträglichkeit seiner Abwesenheit."}, {"term": "Dvārakās Empfang Kṛṣṇas (Bhāgavata 1.11.11-30)", "category": "Episode", "definition": "Ausführliche, kunstvolle Beschreibung der festlich geschmückten Hauptstadt Dvārakā (Torbögen, besprengte Straßen, Opfergaben an jeder Haustür) und des mehrstufigen Empfangs Kṛṣṇas durch Verwandte (Vasudeva, Akrūra, Ugrasena, Balarāma u.a.), Brahmanen, Kurtisanen und Sänger, bis zum Wiedersehen mit seinen Müttern, angeführt von Devakī, und dem Betreten seines eigenen, von 16.000 Gattinnen bewohnten Palastes."}, {"term": "Kṛṣṇa als Stifter gegenseitiger Königsvernichtung (Bhāgavata 1.11.34)", "category": "Konzept", "definition": "Kurzer, einordnender Kommentarvers: Kṛṣṇa, selbst waffenlos, habe unter den als 'Last der Erde' geborenen Königen Feindschaft entfacht (wie der Wind das Feuer entfacht) und sie durch gegenseitige Tötung zur Ruhe gebracht - eine knappe theologische Deutung des gesamten Kurukṣetra-Geschehens."}, {"term": "Die Vision des Fötus Parīkṣit (Bhāgavata 1.12.7-11)", "category": "Episode", "definition": "Berühmte Szene: der ungeborene Parīkṣit erblickt im Mutterleib, während er von der Glut des Brahmaśiras-Geschosses versengt wird, eine daumengroße, dunkle, vierarmige göttliche Gestalt mit Keule, die das Geschoss abwehrt und dann verschwindet - Ursprung sowohl seines Namens Viṣṇurāta (\"von Viṣṇu gegeben\") als auch, über sein späteres lebenslanges Suchen nach dieser Gestalt in jedem Menschen, seines Namens Parīkṣit (\"der Prüfende\")."}, {"term": "Die Prophezeiung der Brahmanen über Parīkṣit (Bhāgavata 1.12.18-28)", "category": "Hymnus", "definition": "Lange Reihe von Vergleichen (mit Ikṣvāku, Rāma, Śibi, Bharata, den beiden Arjunas, Löwe, Himalaya, Brahmā, Śiva, Rantideva, Yayāti, Bali, Prahlāda u.a.), die Parīkṣits künftige Herrschertugenden preisen, gefolgt von einer bemerkenswerten Vorausschau auf sein gesamtes Leben: seinen Tod durch die Schlange Takṣaka infolge eines Brahmanenfluchs und seine Befreiung durch Śukas Belehrung an der Gaṅgā - womit implizit der gesamte Rahmen des Bhāgavata-Purāṇa selbst vorweggenommen wird."}, {"term": "Yudhiṣṭhiras drei Aśvamedha-Opfer (Bhāgavata 1.12.32-35)", "category": "Episode", "definition": "Um die Sünde der Verwandtentötung im Krieg zu sühnen, will Yudhiṣṭhira drei Pferdeopfer darbringen, verzichtet dabei aber auf Steuererhebung; auf Kṛṣṇas Anregung holen seine Brüder stattdessen herrenlosen Reichtum aus dem Norden herbei, mit dem die Opfer finanziert werden."}, {"term": "Viduras Mahnrede an Dhṛtarāṣṭra (Bhāgavata 1.13.18-28)", "category": "Hymnus", "definition": "Schonungslose, aber mitfühlend gemeinte Rede Viduras an den greisen, erblindeten Dhṛtarāṣṭra: Er erinnert ihn an sein hohes Alter, den Verlust aller Söhne, den Verrat seiner Söhne an den Pāṇḍavas und die Vergänglichkeit des Körpers, und rät ihm, in Loslösung von zu Hause fortzuziehen - Auslöser für Dhṛtarāṣṭras Auszug in den Wald."}, {"term": "Nāradas Lehre von der Zeit als Gott und Dhṛtarāṣṭras Ende (Bhāgavata 1.13.41-58)", "category": "Konzept", "definition": "Nārada tröstet den um seine Eltern trauernden Yudhiṣṭhira mit der Lehre, dass alle Wesen dem Willen des Herrn als personifizierter Zeit unterworfen sind (Vergleich mit Kühen am Nasenstrick und Spielzeugen in Kinderhand), nennt den Zufluchtsort Dhṛtarāṣṭras (Saptasrota am Himālaya) und prophezeit dessen bevorstehenden Tod durch einen Waldbrand am fünften Tag sowie Gāndhārīs freiwilligen Opfertod im selben Feuer."}, {"term": "Saptasrota (Bhāgavata 1.13.52)", "category": "Ort", "definition": "Ort südlich des Himālaya, an dem sich die Himmelsgaṅgā der Überlieferung nach einst in sieben Ströme teilte, um sieben Weisen zu erfreuen; dorthin zieht sich Dhṛtarāṣṭra mit Gāndhārī und Vidura zur letzten Askese zurück."}, {"term": "Die Vorzeichen von Kṛṣṇas bevorstehendem Abschied (Bhāgavata 1.14.1-21)", "category": "Episode", "definition": "Während Arjuna, nach Dvārakā entsandt, sieben Monate ausbleibt, beobachtet Yudhiṣṭhira eine lange Reihe widernatürlicher Vorzeichen an Himmel, Erde, Tieren und Menschen (u.a. verkehrte Windrichtungen, blutende Wolken, fallende Sterne, Tiere, die menschlich sprechen) - Anzeichen des nahenden Verschwindens Kṛṣṇas und des Beginns des Kali-Zeitalters."}, {"term": "Arjunas schweigsame Rückkehr und Yudhiṣṭhiras Fragenkatalog (Bhāgavata 1.14.22-44)", "category": "Episode", "definition": "Arjuna kehrt sichtlich niedergeschlagen und wortkarg aus Dvārakā zurück; Yudhiṣṭhira überhäuft ihn mit besorgten \"kaccit\" (\"ich hoffe doch...\")-Fragen nach dem Wohlergehen aller Yadu-Verwandten und Kṛṣṇas sowie nach möglichen eigenen Verfehlungen, ohne dass Arjuna die eigentliche Nachricht (Untergang der Yadus) bereits preisgibt - ein bewusstes erzählerisches Hinauszögern, das erst in Kapitel 15 aufgelöst wird."}, {"term": "Arjunas Bekenntnis der eigenen Ohnmacht (Bhāgavata 1.15.5-21)", "category": "Episode", "definition": "Arjuna gesteht Yudhiṣṭhira unter Tränen, dass all seine einstigen Heldentaten (Khāṇḍava-Brand, Sieg über Indra, Kampf mit Śiva um die Pāśupata-Waffe, Unverwundbarkeit im Kurukṣetra-Krieg) allein Kṛṣṇas Macht zu verdanken waren; nach dessen Weggang wurde er selbst von einfachen Hirten besiegt, als er die Yadu-Frauen eskortierte - ein Beweis für das Erlöschen seiner geliehenen Kraft."}, {"term": "Der gegenseitige Vernichtungskampf der Yadus in Prabhāsa (Bhāgavata 1.15.22-26)", "category": "Episode", "definition": "Durch einen Brahmanenfluch verwirrt und berauscht von Vāruṇī-Wein, erschlagen sich die Yadu-Krieger in Prabhāsa gegenseitig mit Fäusten, bis nur wenige übrig bleiben - von Sūta als Kṛṣṇas bewusstes Mittel gedeutet, die überschüssige Last der Erde (den übermächtigen Yadu-Klan selbst) zu beseitigen."}, {"term": "Kṛṣṇas Verscheiden und der Beginn Kalis (Bhāgavata 1.15.34-36)", "category": "Konzept", "definition": "Kṛṣṇas Ablegen seines irdischen Körpers wird als bewusste, souveräne Handlung gedeutet - vergleichbar mit einem Schauspieler, der seine Rollen wechselt; an ebendiesem Tag beginnt für die geistig nicht Erwachten das Kali-Zeitalter, das Zeitalter des Unheils."}, {"term": "Kali als Śūdra-König, die Kuh mit dem Fuß schlagend (Bhāgavata 1.16.1-17)", "category": "Episode", "definition": "Bei seinem Welteroberungszug erblickt Parīkṣit einen Śūdra in Königstracht, der ein Rinderpaar mit dem Fuß schlägt - die Personifikation Kalis, des Zeitalters des Unheils, die er daraufhin ergreift (Fortsetzung/Auflösung in Kapitel 17)."}, {"term": "Dharma und die Erde als Stier und Kuh (Bhāgavata 1.16.18-36)", "category": "Episode", "definition": "Klassische allegorische Szene: Dharma, personifiziert als Stier, findet sich zu Beginn des Kali-Zeitalters nur noch auf einem seiner vier Beine stehend vor und begegnet der ebenfalls personifizierten Erde in Kuhgestalt, glanzlos und weinend. Auf seine Frage antwortet sie mit einer langen Klage über den Verlust aller Tugenden im entstehenden Kali-Zeitalter und über die Trennung von Kṛṣṇa, dessen Fußspuren sie einst tragen durfte."}, {"term": "Die vier Füße des Dharma im Zeitalterwandel (Bhāgavata 1.17.24-25)", "category": "Konzept", "definition": "Klassische Bhāgavata-Lehre: Dharma (personifiziert als Stier) ruht im Kṛta-Zeitalter auf vier vollständigen Füßen - Askese, Reinheit, Mitgefühl, Wahrhaftigkeit. Mit dem Fortschreiten der Zeitalter werden durch Hochmut, Bindung und Rausch drei dieser Füße gebrochen, bis im Kali-Zeitalter nur die Wahrhaftigkeit als letzter Fuß verbleibt, die auch diese von Kali bedroht wird."}, {"term": "Parīkṣits Bestrafung und Begnadigung Kalis - die fünf Sitze des Unrechts (Bhāgavata 1.17.28-41)", "category": "Episode", "definition": "Kali unterwirft sich dem schwerterhobenen Parīkṣit und bittet um einen festen Aufenthaltsort; der König weist ihm fünf Sitze zu, an denen sich das vierfache Unrecht (Würfelspiel, Trunk, verbotene Frauen, Schlachtung) sowie - auf weitere Bitte - Gold konzentrieren darf, aus dem wiederum Falschheit, Rausch, Begierde, Leidenschaft und Feindschaft entspringen."}, {"term": "Sūtas Selbstreflexion über seine Geburt und die Kraft des Kṛṣṇa-Namens (Bhāgavata 1.18.18-20)", "category": "Episode", "definition": "Sūta Gosvāmī, von gemischter (nicht-brahmanischer) Geburt, reflektiert, dass allein das Aussprechen und Besingen von Kṛṣṇas Namen und Taten jede Herkunftsbeschränkung überwindet und ihn zur Weitergabe der heiligen Überlieferung befähigt - eine zentrale Bhakti-Lehre über die Wirkung des Namens unabhängig von Kaste oder Geburt."}, {"term": "Parīkṣit beleidigt den meditierenden Weisen Śamīka mit einer toten Schlange (Bhāgavata 1.18.24-30)", "category": "Episode", "definition": "Erschöpft und durstig von der Jagd betritt König Parīkṣit die Einsiedelei des in tiefer Versenkung (Trance) verharrenden Weisen Śamīka; da dieser weder grüßt noch Wasser reicht, entbrennt der König in Zorn und legt ihm mit der Bogenspitze eine tote Schlange um den Hals, bevor er in die Stadt zurückkehrt - der auslösende Frevel für den folgenden Fluch."}, {"term": "Śṛṅgis Fluch und Śamīkas Rüge (Bhāgavata 1.18.32-50)", "category": "Episode", "definition": "Der jugendliche Sohn des Weisen, Śṛṅgi, erfährt von Spielgefährten von der Beleidigung seines Vaters und verflucht Parīkṣit in zornigem Übereifer, binnen sieben Tagen durch den Schlangendämon Takṣaka zu sterben. Sein Vater Śamīka, aus der Trance erwacht, rügt ihn eingehend dafür, einen gerechten, das Reich schützenden König wegen einer geringfügigen Kränkung dem Tod geweiht zu haben, warnt vor der Gesetzlosigkeit, die ohne königlichen Schutz droht, nimmt das Geschehene aber mit weiser Gelassenheit hin."}, {"term": "Parīkṣits Entschluss zum Fasten bis zum Tod (prāyopaveśa) (Bhāgavata 1.19.1-8)", "category": "Konzept", "definition": "Nach dem Vernehmen des Fluches nimmt Parīkṣit die Sünde als gerechte Folge seiner eigenen früheren Verfehlung an, entsagt Reich und Körper und setzt sich am Ufer der Gaṅgā zum rituellen Fasten bis zum Tod nieder, den Dienst an Kṛṣṇas Füßen allem anderen vorziehend - eine klassische Form des freiwilligen, geweihten Sterbens in der indischen Tradition."}, {"term": "Die Versammlung der großen Weisen am Ufer der Gaṅgā (Bhāgavata 1.19.9-19)", "category": "Episode", "definition": "Zahlreiche namentlich aufgezählte große Weise - darunter Atri, Vasiṣṭha, Parāśara, Bhāradvāja, Dvaipāyana (Vyāsa) und Nārada - versammeln sich, um den sterbenden König zu begleiten, während Götter vom Himmel Blüten streuen und Kesselpauken ertönen."}, {"term": "Die Ankunft Śukadeva Gosvāmīs (Bhāgavata 1.19.20-31)", "category": "Person", "definition": "Der jugendliche, sechzehnjährige Sohn Vyāsas erscheint unvermittelt, äußerlich als von allen Bindungen gelöster Wanderasket erkennbar, doch von einem Glanz, den auch die kundigsten Weisen an seinen Zeichen erkennen; er wird von Parīkṣit ehrenvoll empfangen und nimmt den Ehrenplatz ein."}, {"term": "Parīkṣits Frage nach der Pflicht des Sterbenden (Bhāgavata 1.19.32-39)", "category": "Konzept", "definition": "Der König befragt Śuka nach dem, was ein im Sterben liegender Mensch hören, rezitieren, tun, erinnern oder verehren solle (und was zu meiden sei) - die Rahmenfrage, mit der die eigentliche Lehrerzählung des Bhāgavata-Purāṇa eingeleitet wird."}, {"term": "Śukas Eröffnungslehre: die Dringlichkeit des Hörens/Preisens/Erinnerns Haris (Bhāgavata 2.1.1-14)", "category": "Konzept", "definition": "Śuka eröffnet seine Antwort mit der Warnung vor unachtsam verstreichender Lebenszeit in häuslichen Beschäftigungen und stellt dem den höchsten Lebensgewinn gegenüber - die Erinnerung an Nārāyaṇa im Sterben -, illustriert am Beispiel des Königsweisen Khaṭvāṅga, der binnen eines einzigen erkannten Augenblicks der Sterblichkeit alles Weltliche aufgab."}, {"term": "Die kosmische Gestalt des Virāṭ-Puruṣa (Bhāgavata 2.1.15-39)", "category": "Konzept", "definition": "Klassische meditative Anleitung (dhāraṇā) auf die grobstoffliche, universale Form des Höchsten: die sieben unterirdischen Welten, Himmelsregionen, Gottheiten, Naturphänomene, Tiere, Völker und die vier Stände (varṇas) werden systematisch den Gliedern dieses kosmischen Körpers zugeordnet - eine der bekanntesten kosmographischen Passagen des Bhāgavata-Purāṇa, die Weltordnung und Gottesgestalt in eins setzt."}, {"term": "Meditation auf die vierarmige Gestalt Viṣṇus im Herzlotos (Bhāgavata 2.2.8-14)", "category": "Konzept", "definition": "Ausführliche klassische dhyāna-Anleitung: der Yogī vergegenwärtigt schrittweise, Glied für Glied, die handspannengroße, vierarmige Gestalt des im Herzen wohnenden Puruṣa - mit Lotos, Diskus, Muschelhorn und Keule, Krone, Girlande und Schmuck -, bis der Verstand vollständig darauf gerichtet und geläutert ist."}, {"term": "Der yogische Sterbeprozess und die Wege nach dem Tod (Bhāgavata 2.2.15-31)", "category": "Konzept", "definition": "Detaillierte Beschreibung der kontrollierten Auflösung des Lebenswinds durch die feinstofflichen Körperzentren (Nabel, Herz, Brust, Gaumen, Punkt zwischen den Brauen) bis zum Durchbruch am Scheitel, gefolgt von unterschiedlichen kosmischen Wegen je nach angestrebtem Ziel (Brahmaloka, Siddha-Welten, Auflösung durch die fünf Elemente bis zur völligen Einswerdung mit dem Selbst)."}, {"term": "Die Wunsch-Gottheit-Zuordnungen des vedischen Opferkults (Bhāgavata 2.3.2-9)", "category": "Konzept", "definition": "Systematische traditionelle Liste, welche Gottheit für welches weltliche Begehren (Wissen, Nachkommen, Reichtum, Langlebigkeit, Königreich, eheliches Glück u.v.a.) zu verehren sei - kontrastiert im Anschluss mit der hingebungsvollen Verbindung (bhakti-yoga) zum höchsten Puruṣa als dem alle Einzelwünsche übersteigenden Ziel."}, {"term": "Die rhetorischen bhakti-Verse: lebende Leichname und versteinerte Herzen (Bhāgavata 2.3.18-24)", "category": "Konzept", "definition": "Berühmte Versfolge, die mit drastischen Bildern - der Mensch ohne Hingabe als Tier, als lebender oder atmender Leichnam, das ungerührte Herz als Stein - die Wertlosigkeit eines Lebens ohne Erinnerung an Hari brandmarkt und zu den meistzitierten Passagen des Bhāgavata-Purāṇa zählt."}, {"term": "Parīkṣits Frage nach dem Schöpfungsvorgang durch Māyā (Bhāgavata 2.4.1-11)", "category": "Konzept", "definition": "Parīkṣit, nun in fester Gesinnung auf Vāsudeva gerichtet, bittet Śukadeva zu erklären, wie der an sich unveränderliche Höchste durch seine eigene, schwer erfassbare Māyā das vielgestaltige Universum hervorbringt, erhält und wieder auflöst - der Auftakt zur eigentlichen kosmogonischen Lehrerzählung des Skandha 2."}, {"term": "Śukas namaskāra-Anrufung des Höchsten (Bhāgavata 2.4.12-25)", "category": "Konzept", "definition": "Ausgedehnte ehrfurchtsvolle Verse Śukadevas zur Anrufung des Höchsten in seinen kosmischen und heilsgeschichtlichen Aspekten, darunter die berühmte Verheißung, dass selbst traditionell außerhalb der vedischen Ordnung stehende Völker (Kirātas, Hūṇas, Āndhras, Pulindas u.a.) durch Zuflucht bei ihm geläutert werden (V.18); schließt mit dem Rahmen der Lehrübertragung von Hari über Brahmā zu Nārada."}, {"term": "Brahmās Bekenntnis zu Vāsudeva als letzter Wahrheit (Bhāgavata 2.5.9-20)", "category": "Konzept", "definition": "Brahmās Antwort auf Nāradas Frage: nicht er selbst, sondern der durch eigene Buße geschaute erhabene Vāsudeva/Nārāyaṇa ist die letzte Wahrheit hinter Stoff, Handlung, Zeit, Eigennatur und Einzelseele; nur durch dessen unüberwindliche Māyā gilt Brahmā selbst fälschlich als \"jagad-guru\", Schöpfer der Welt (enthält den berühmten dhyāna-Vers 2.5.12, tasmai namo bhagavate vāsudevāya)."}, {"term": "Die sāṅkhya-Kosmogonie: von Mahat zu den fünf Elementen (Bhāgavata 2.5.21-29)", "category": "Konzept", "definition": "Klassische Ableitungskette der materiellen Schöpfung: aus Zeit, Handlung und Eigennatur entsteht Mahat (der kosmische Verstand), daraus der dreifache Ahaṅkāra (vaikārika/taijasa/tāmasa), daraus Geist und Götter, die zehn Sinnesorgane sowie die fünf Tanmātras, die sich zu den groben Elementen Äther, Luft, Feuer, Wasser und Erde verdichten - jede Stufe erbt kumulativ die Eigenschaften der vorhergehenden."}, {"term": "Entstehung des virāṭ-puruṣa aus dem kosmischen Ei und die Zuordnung der Welten (Bhāgavata 2.5.30-42)", "category": "Konzept", "definition": "Aus der Vereinigung der noch ungeordneten Schöpfungsprinzipien entsteht, angetrieben durch die Kraft des Herrn, das kosmische Ei, aus dem nach tausend Jahren der tausendgliedrige virāṭ-puruṣa hervorbricht; aus seinen Körperteilen entstehen die vier Varṇas (Mund/Arme/Schenkel/Füße) und alle vierzehn Welten (sieben oben, sieben unten), mit einer abschließend genannten einfacheren, dreigliedrigen Alternativordnung (Bhūr-Bhuvaḥ-Svar aus Füßen-Nabel-Haupt)."}, {"term": "Die Zuordnung der Körperteile des Puruṣa (Bhāgavata 2.6.1-22, puruṣa-sūkta)", "category": "Konzept", "definition": "Brahmās Fortführung der Belehrung Nāradas: Ausführliche, dem vedischen Puruṣa-Sūkta folgende Zuordnung sämtlicher Körperteile des kosmischen Puruṣa (Mund, Augen, Ohren, Haut, Arme, Zeugungsglied, Bauch, Herz, Füße usw.) zu Elementen, Sinnesbereichen, Göttern, Welten und Wesensklassen; endet mit dem berühmten Vers 2.6.16, wonach das manifeste Universum nur einen Teil des Puruṣa ausmacht, während er selbst darüber hinausragt."}, {"term": "Brahmās Ursprung und das erste Opfer aus den Gliedern des Puruṣa (Bhāgavata 2.6.23-33)", "category": "Konzept", "definition": "Brahmā berichtet, wie er selbst aus dem Nabellotos des Puruṣa entstand und sämtliche Bestandteile des vedischen Opferrituals (Tiere, Priester, Mantras, Metren, Gelübde usw.) aus dessen Gliedern zusammentrug, um mit dem Puruṣa selbst als Opfer den Herrn zu verehren - ein Vorbild, dem später Prajāpatis, Manus und andere Wesen folgten."}, {"term": "Brahmās Bekenntnis der eigenen Erkenntnisgrenze (Bhāgavata 2.6.34-39)", "category": "Konzept", "definition": "Eindringliches Selbstzeugnis Brahmās: trotz vollendeter Yoga-Praxis und seiner Stellung als Herr der Prajāpatis vermochte er den Herrn, aus dem sein eigenes Selbst entstand, nicht vollständig zu erfassen - ein Topos radikaler Demut, der die Unergründlichkeit der Māyā des Höchsten selbst für die höchsten Götter unterstreicht."}, {"term": "Die Liste der frühen Avatāras: Varāha bis Hayagrīva (Bhāgavata 2.7.1-11)", "category": "Konzept", "definition": "Brahmās Aufzählung der Inkarnationen des Höchsten für Nārada: Varāha (Eber), Yajña, Kapila, Dattātreya, die vier Kumāras, Nara-Nārāyaṇa, Dhruva, Pṛthu, Ṛṣabha und Hayagrīva - jeweils mit knappem Hinweis auf ihre charakteristische Tat oder Lehre."}, {"term": "Matsya, Kūrma, Nṛsiṁha, Gajendra-mokṣa und Vāmana (Bhāgavata 2.7.12-18)", "category": "Konzept", "definition": "Fortsetzung der Avatāra-Liste: der Fisch, der die Veden und Manu rettet; die Schildkröte, die den Berg beim Quirlen des Milchozeans trägt; der Mannlöwe, der Hiraṇyakaśipu tötet; die Rettung des Elefantenkönigs aus dem Krokodilsrachen; und der Zwerg, der durch die List der drei Schritte die Welten von Bali zurückfordert."}, {"term": "Paraśurāma, Rāma und die ausführliche Kṛṣṇa-Inkarnation (Bhāgavata 2.7.22-35)", "category": "Konzept", "definition": "Paraśurāma, der die frevelhafte Kṣatriya-Kaste einundzwanzigmal vernichtet; Rāma mit Ozeanüberquerung und Rāvaṇas Tod; und ausführlich Kṛṣṇas Kindheits- und Jugendtaten (Pūtanā, Śakaṭāsura, die Arjuna-Bäume, Kāliya, der Waldbrand, die Universum-Vision in seinem Mund, Govardhana, Rāsa-līlā), bis hin zu den Gegnern, die im Mahābhārata-Krieg unter dem Deckmantel Balarāmas, Arjunas und Bhīmas fallen."}, {"term": "Vyāsa, Buddha, Kalki und die drei guṇa-avatāras (Bhāgavata 2.7.36-39)", "category": "Konzept", "definition": "Vyāsa, der die Veden in vier Teile gliedert; Buddha, dessen verwirrende Lehre die Gottesfeinde täuscht; Kalki, der am Ende des Kali-Zeitalters erscheint; gefolgt von einer Zusammenfassung der drei Erscheinungsweisen-Inkarnationen Brahmā (Schöpfung), Viṣṇu (Erhaltung) und Śiva (Zerstörung)."}, {"term": "Brahmās Auftrag an Nārada: das Bhāgavatam verbreiten (Bhāgavata 2.7.50-53)", "category": "Konzept", "definition": "Abschluss von Brahmās Belehrung: die hier nur zusammengefasste Lehre - genannt 'Bhāgavatam' - soll Nārada ausführlich darlegen, damit in den Menschen Hingabe zu Hari entstehe; wer die Māyā des Herrn beschreibt, gutheißt oder mit Glauben hört, wird von ihr nicht mehr verwirrt."}, {"term": "Parīkṣits Bitte und die Themenübersicht des Bhāgavatam (Bhāgavata 2.8.1-24)", "category": "Konzept", "definition": "Parīkṣit bittet Śukadeva um die Wahrheit über Hari, damit er in Frieden sterben könne, und stellt eine umfangreiche listenartige Reihe von Fragen - zu Kosmologie, Zeitmaßen, Karma, Kastenordnung, Weltzeitaltern und Inkarnationen, Pflichtenlehre, Yoga und der Natur von Brahmās Spiel mit der eigenen Māyā -, die als Inhaltsübersicht für die verbleibenden Teile des Bhāgavata-Purāṇa dient."}, {"term": "Śukadevas Beginn der Erzählung des Bhāgavatam (Bhāgavata 2.8.25-29)", "category": "Konzept", "definition": "Abschluss des Rahmenberichts: Parīkṣit bekräftigt seine Bereitschaft, bis zum Hören der ganzen Lehre am Leben zu bleiben; Śukadeva, hocherfreut über die Einladung, beginnt, das ihm von Vyāsa überlieferte Purāṇa namens 'Bhāgavatam' - dem Brahman gleichwertig, einst vom Erhabenen selbst dem Brahmā verkündet - der Reihe nach zu erzählen."}, {"term": "Das Silben-Rätsel \"tapa tapa\" und Brahmās Buße (Bhāgavata 2.9.1-19)", "category": "Konzept", "definition": "Nach vergeblichem Erschaffungsversuch hört Brahmā über den Urgewässern eine zweimal gesprochene, zweisilbige Stimme - den 16. und 21. Konsonanten der sparśa-Reihe (\"ta\" und \"pa\"), zusammen \"tapa\" (Buße) -; nach tausendjähriger Askese erblickt er die transzendente Welt Vaikuṇṭha mit ihren vierarmigen Bewohnern und dem Herrn selbst."}, {"term": "Die catuḥ-ślokī: die vier Kernverse des Bhāgavata-Purāṇa (Bhāgavata 2.9.33-36)", "category": "Konzept", "definition": "Die berühmtesten vier Verse des gesamten Werks, vom Erhabenen selbst an Brahmā gerichtet: \"Ich allein war am Anfang\" (Alleinursächlichkeit); die Definition der Māyā als das ohne eigene Realität dennoch Erscheinende; das Paradox der gleichzeitigen Immanenz und Transzendenz des Höchsten in allen Wesen; und die Methode, das ewig Bleibende durch positive und negative Konkomitanz (anvaya-vyatireka) zu erkennen."}, {"term": "Die Überlieferungskette des Bhāgavatam (Bhāgavata 2.9.38-46)", "category": "Konzept", "definition": "Abschluss des mehrfach verschachtelten Erzählrahmens: der Erhabene lehrt Brahmā, Brahmā erschafft danach das Universum und unterweist später seinen Sohn Nārada, Nārada gibt die Lehre an Vyāsa weiter, und Vyāsa (über seinen Sohn Śukadeva) schließlich an König Parīkṣit - eine Kette, die Śukadeva am Ende des Kapitels selbst ausdrücklich bestätigt."}, {"term": "Die zehn Merkmale (daśa-lakṣaṇa) eines Purāṇa (Bhāgavata 2.10.1-9)", "category": "Konzept", "definition": "Śukadevas Definition der zehn klassischen Kennzeichen, nach denen ein Purāṇa aufgebaut ist: Schöpfung (sarga), Ausströmung (visarga), Erhaltung (sthāna), Pflege (poṣaṇa), Handlungsantriebe (ūti), Manu-Zeitalter mit Herrn-Erzählungen (manvantara-īśānukathā), Auflösung (nirodha), Befreiung (mukti) und die letzte Zuflucht (āśraya) - das höchste Brahman/Paramātman selbst."}, {"term": "Die zweite Schöpfungsschilderung: Entstehung der Sinnesorgane des virāṭ-puruṣa (Bhāgavata 2.10.10-33)", "category": "Konzept", "definition": "Detaillierte, von der Erzählung in Kapitel 6 unabhängige zweite Darstellung, wie der aus dem Weltenei hervorgegangene Puruṣa Wohnstätte in den Wassern nahm (daher der Name Nārāyaṇa) und nacheinander, jeweils aus einem bestimmten Wunsch/Bedürfnis heraus, Mund, Zunge, Nase, Augen, Ohren, Haut, Hände, Füße, Geschlechtsorgan, After, Nabel und die Verdauungsorgane samt den sieben Körpergrundstoffen (dhātus) entwickelte."}, {"term": "Grobe und subtile Gestalt des Erhabenen (Bhāgavata 2.10.33-36)", "category": "Konzept", "definition": "Unterscheidung zwischen der grobstofflichen (sthūla), von acht Hüllen umgebenen kosmischen Gestalt des Erhabenen und dem darüber hinausliegenden, jenseits von Wort und Denken befindlichen, merkmalslosen Feinsten (sūkṣmatama) - wobei beide Formen, da von der Māyā erschaffen, von den wahrhaft Weisen nicht als das letzte Wesen ergriffen werden."}, {"term": "Der umfassende Wesenskatalog und die dreifache Bestimmung des Karmas (Bhāgavata 2.10.37-41)", "category": "Konzept", "definition": "Aufzählung der vom Erhabenen geschaffenen Wesensklassen - Halbgötter, Dämonenarten, Tiere, Mischwesen und Elementargeister -, gefolgt von der Einteilung aller Daseinsgänge (gatayaḥ) in Götter-, Menschen- und Höllenwesen entsprechend den drei Erscheinungsweisen (Güte, Leidenschaft, Trägheit), die sich jeweils nochmals dreifach untergliedern."}, {"term": "Abschluss und Übergang zum dritten Skandha: Vidura und Maitreya (Bhāgavata 2.10.48-51)", "category": "Konzept", "definition": "Śaunakas abschließende Frage an Sūta nach dem Gespräch zwischen Vidura (Kṣattā) und dem Weisen Maitreya (Kauśārava) über den Grund für Viduras Verlassen seiner Verwandten und seine Pilgerfahrt - Sūtas Antwort-Ankündigung beschließt das zweite Skandha (laut Kolophon der Quelle) und leitet zur im dritten Skandha erzählten Rahmenhandlung über."}, {"term": "Rahmenübergang zu Skandha 3: Śaunakas Frage, Parīkṣits Nachfrage (Bhāgavata 3.1.1-10)", "category": "Konzept", "definition": "Verschachtelter Erzählrahmen zu Beginn des dritten Skandha: Sūta erinnert an Viduras einstige Begegnung mit Maitreya; König Parīkṣit fragt Śukadeva nach Ort und Zeit dieses Gesprächs; Śukadeva antwortet mit der Vorgeschichte - Dhṛtarāṣṭras Untätigkeit beim Lackhaus-Anschlag, Draupadīs Demütigung, der verweigerten Erbschaft und der Missachtung von Kṛṣṇas Botschaft -, die darin gipfelt, dass Vidura zu Rate gezogen wird und seine berühmte Ratsrede (das 'vaidurika') hält."}, {"term": "Viduras Ratsrede und Verbannung aus Hastināpura (Bhāgavata 3.1.11-20)", "category": "Konzept", "definition": "Vidura fordert Dhṛtarāṣṭra auf, den Pāṇḍavas ihr Erbe zurückzugeben und Duryodhana, den 'Feind des Puruṣa', aufzugeben; daraufhin wird er von Duryodhana (zusammen mit Karṇa, Duḥśāsana und Śakuni) beschimpft und als 'Sohn einer Dienerin' aus der Stadt verwiesen; Vidura verlässt daraufhin klaglos Hastināpura und beginnt eine Pilgerfahrt zu den heiligen Stätten der Erde, in avadhūta-Tracht, unerkannt von den Seinen."}, {"term": "Viduras Wiedersehen mit Uddhava an der Yamunā (Bhāgavata 3.1.21-25)", "category": "Konzept", "definition": "Nach Jahren der Pilgerfahrt erfährt Vidura an der Sarasvatī vom Untergang seiner Verwandten (Gleichnis vom durch Bambusreibung entzündeten Wald - Anspielung auf den Bruderkrieg der Yadus in Prabhāsa); er besucht weitere Tīrthas und trifft schließlich an der Yamunā auf Uddhava, den Vertrauten Kṛṣṇas, den er innig umarmt."}, {"term": "Viduras Fragenkatalog an Uddhava nach den Yadu-Fürsten (Bhāgavata 3.1.26-40)", "category": "Konzept", "definition": "Ausführliche, listenartige Reihe von Fragen Viduras nach dem Wohlergehen der Yadu-Dynastie und der Pāṇḍavas - Kṛṣṇa und Balarāma, Vasudeva, Pradyumna, Sāmba, Ugrasena, Yuyudhāna, Akrūra, Devakī, Aniruddha (als vyūha-Emanation erklärt), sowie Yudhiṣṭhira, Bhīma, Arjuna (mit Anspielung auf die Kirātārjunīya-Episode), die Zwillinge und Kuntī."}, {"term": "Viduras Selbstoffenbarung und Bitte um Kṛṣṇas Geschichte (Bhāgavata 3.1.41-45)", "category": "Konzept", "definition": "Vidura offenbart Uddhava, dass er trotz seiner Vertreibung durch Dhṛtarāṣṭra keinen Groll hegt, sondern durch Kṛṣṇas 'menschenähnliche Erscheinung' (martya-viḍambana) von aller Verwunderung befreit umherwandert; er reflektiert, dass der Herr das Unrecht der Kurus zunächst duldete, um durch deren spätere Vernichtung das Leid der Ergebenen zu beenden, und bittet Uddhava abschließend, ihm die Geschichte des im Yadu-Geschlecht geborenen Ungeborenen zu erzählen."}, {"term": "Uddhavas versunkene Erinnerung an Kṛṣṇa (Bhāgavata 3.2.1-10)", "category": "Konzept", "definition": "Von Viduras Frage nach den Yadus überwältigt, versinkt Uddhava zunächst schweigend in tiefer Bhakti-Versenkung, bevor er beklagt, dass die Welt - und selbst die mit Kṛṣṇa zusammenlebenden Yadus - seine wahre Göttlichkeit nicht erkannten, während wer sein Selbst in Hari verankert habe, durch nichts beirrt werden könne."}, {"term": "Das verborgene Abbild und das Rājasūya-Wunder (Bhāgavata 3.2.11-20)", "category": "Konzept", "definition": "Uddhava beschreibt, wie der Herr sein irdisches, für Menschenspiel geeignetes Abbild zeigte und wieder verbarg; wie die drei Welten beim Rājasūya-Opfer Yudhiṣṭhiras darin die vollkommene Schöpferkunst erblickten; wie die Frauen von Vraja durch sein Rāsa-Lächeln alle Pflichten vergaßen; und wie selbst Feinde wie Śiśupāla durch den Tod von seiner Hand die höchste Vollendung (siddhi) erlangten."}, {"term": "Kṛṣṇas Dienst an Ugrasena und die Kindheits-Erinnerungen (Bhāgavata 3.2.21-26)", "category": "Konzept", "definition": "Trotz seiner absoluten Herrschaft über die drei Welten steht der Erhabene dem wiedereingesetzten König Ugrasena dienend zur Seite; Uddhava erinnert sich schmerzlich an Kṛṣṇas Bitte um Verzeihung bei seinen leiblichen Eltern Vasudeva und Devakī für die in Vraja verbrachten, aus Furcht vor Kaṁsa versteckten Kindheitsjahre, sowie an Pūtanās Erlösung trotz ihres Mordversuchs."}, {"term": "Kṛṣṇas Kindheits- und Jugendtaten in Vraja, zweite Zusammenfassung (Bhāgavata 3.2.27-34)", "category": "Konzept", "definition": "Kurzer, von Uddhava erinnerter Bogen von Kṛṣṇas Kindheit in Vraja: Kälberhüten, Kāliya-Bezwingung und Reinigung der Yamunā, das Go-sava-Opfer für Nanda (anstelle des Indra-Opfers), das Aufheben des Govardhana-Bergs als Schutzschirm gegen Indras Zornesregen, und der abschließende Herbst-Rāsa-Tanz."}, {"term": "Kṛṣṇas Taten in Mathurā: Kaṁsas Tod, Bildung, Heiraten (Bhāgavata 3.3.1-9)", "category": "Konzept", "definition": "Kurzer Rückblick Uddhavas: Kṛṣṇas Tötung Kaṁsas, sein rasches Studium bei Sāndīpani samt der Rückholung von dessen totem Sohn, die Entführung und Heirat Rukmiṇīs nach Gāndharva-Brauch, die Bändigung der sieben Stiere und Heirat Nāgnajitīs, der Raub des Pārijāta-Baumes für Satyabhāmā, die Besiegung Narakāsuras und die Befreiung sowie Heirat der 16.000 gefangenen Prinzessinnen."}, {"term": "Kṛṣṇas Feindvernichtung und die vorausschauende Sorge um die Yadus (Bhāgavata 3.3.10-15)", "category": "Konzept", "definition": "Aufzählung besiegter Feinde (Kālayavana, Jarāsandha, Śālva, Śambara, Dvivida, Bāṇa, Mura, Balvala, Dantavakra u.a.) und der Vernichtung der Kaurava-Armee bei Kurukṣetra; Kṛṣṇas innere Überlegung, dass die verbliebene, von ihm selbst durchdrungene Streitmacht der Yadus eine noch schwerere Erdenlast bildet, die nur durch seinen eigenen Rückzug und einen inneren Streit der Yadus beseitigt werden kann - eine Vorausdeutung auf deren kommenden Untergang."}, {"term": "Restauration der Pāṇḍava-Linie und Yudhiṣṭhiras Aśvamedhas (Bhāgavata 3.3.16-19)", "category": "Konzept", "definition": "Kṛṣṇa setzt Yudhiṣṭhira als König ein und erweckt den durch Aśvatthāmans Waffe verbrannten Uttarā-Fötus (Parīkṣit) erneut zum Leben, um die Pūru-Linie zu erhalten; Yudhiṣṭhira bringt drei Aśvamedha-Opfer dar, während der Erhabene selbst, unangehaftet und in Sāṅkhya-Erkenntnis verankert, in Dvārakā den Sinnesfreuden nachgeht."}, {"term": "Der Fluch der Weisen und der Untergang der Yadus in Prabhāsa (Bhāgavata 3.3.20-28)", "category": "Konzept", "definition": "Nach vielen Jahren des Genusses entsteht in Kṛṣṇa Loslösung vom Hausherrenleben; junge Prinzen der Yadus und Bhojas erzürnen durch ein respektloses Spiel die Weisen, die sie verfluchen; einige Monate später ziehen die Vṛṣṇis, Bhojas und Andhakas, von der Gottheit in ihrem Urteil verwirrt, zur Pilgerstätte Prabhāsa, wo sie rituelle Bäder nehmen und den Brahmanen reiche Gaben (Gold, Silber, Elefanten, Land, Speisen) darbringen - der letzte fromme Akt vor ihrem gegenseitigen Untergang."}, {"term": "Der Yadu-Untergang durch Weintrunkenheit (Bhāgavata 3.4.1-3)", "category": "Konzept", "definition": "Uddhavas Bericht vom Beginn des Endes: von Kṛṣṇa selbst zum Trinken von Vāruṇī- und Maireya-Wein ermächtigt, verlieren die Yadu-Fürsten am Prabhāsa-Strand ihre Urteilskraft, verletzen sich mit bösen Worten und töten sich schließlich bei Sonnenuntergang gegenseitig; Kṛṣṇa selbst zieht sich, den Verlauf seiner eigenen Māyā erblickend, zurück und setzt sich unter einen Baum an der Sarasvatī."}, {"term": "Kṛṣṇas letzte Unterweisung an Uddhava (Bhāgavata 3.4.11-22)", "category": "Konzept", "definition": "Am Ufer der Sarasvatī, in Gegenwart des zufällig vorbeikommenden Weisen Maitreya, offenbart Kṛṣṇa Uddhava, dass dieser durch seine Gnade das Privileg erhielt, seinen Rückzug aus der Welt mit klarer Ergebenheit mitzuerleben; Uddhava bittet nur um Dienst an Kṛṣṇas Füßen statt um die vier klassischen Lebensziele und äußert Verwunderung über die scheinbaren Widersprüche in Kṛṣṇas Wesen (Wunschlosigkeit und Handeln, Ungeborenheit und Geburt); Kṛṣṇa weist ihn schließlich zum höchsten Zustand des Selbst und sendet ihn zum Badarī-Āśrama, wo Nārāyaṇa und Nara ewige Askese üben."}, {"term": "Uddhava und Vidura an der Yamunā, Übergabe der Erzählung (Bhāgavata 3.4.23-28)", "category": "Konzept", "definition": "Vidura, von Uddhavas Bericht über den Yadu-Untergang erschüttert, bittet ihn um das von Kṛṣṇa verkündete höchste Wissen; Uddhava verweist stattdessen auf den nahen Weisen Maitreya, der von Kṛṣṇa selbst dazu beauftragt wurde; beide verbringen die Nacht am Yamunā-Ufer mit Erzählungen über Kṛṣṇas Herrlichkeit, bevor Uddhava zum Badarī-Āśrama weiterzieht - worauf Parīkṣit fragt, wie Uddhava den Yadu-Untergang und sogar Kṛṣṇas eigenes Körperablegen überlebt haben konnte."}, {"term": "Kṛṣṇas Wahl Uddhavas als Wissensträger (Bhāgavata 3.4.29-36)", "category": "Konzept", "definition": "Śukadevas Antwort: Kṛṣṇa, im Begriff seinen Körper abzulegen, erklärt Uddhava für ebenbürtig und beauftragt ihn, in der Welt zu bleiben, um sein Wissen zu vermitteln; Uddhava zieht daraufhin zum Badarī-Āśrama, um Hari in Versenkung zu verehren; Vidura, von diesen Ereignissen erschüttert, weint vor Liebe und macht sich auf den Weg zur Kālindī, um schließlich den Weisen Maitreya am Himmelsfluss zu erreichen - womit der Rahmen für das folgende Gespräch (Kapitel 3.5) gesetzt ist."}, {"term": "Viduras philosophische Fragen an Maitreya (Bhāgavata 3.5.1-16)", "category": "Konzept", "definition": "An der Ganges-Pforte trifft Vidura auf den Weisen Maitreya und fragt ihn nach dem Sinn menschlichen Strebens (Taten bringen kein wahres Glück, nur Leid), nach dem Wirken göttlicher Gnade für Leidende, nach den Taten des Herrn in Schöpfung, Erhaltung und Rückzug, sowie - unter Verweis auf Vyāsas Mahābhārata, das den Sinn der Menschen von weltlichen zu göttlichen Erzählungen lenkt - nach der reinigenden, leidauflösenden Kraft der Kṛṣṇa-Erzählung; er bittet Maitreya, ihm die übermenschlichen Taten des Herrn der Reihe nach zu verkünden."}, {"term": "Enthüllung von Viduras Identität als Yama (Bhāgavata 3.5.17-21)", "category": "Konzept", "definition": "Maitreya lobt Viduras Frage und seine ungeteilte Hingabe zu Hari und offenbart, dass Vidura eine Inkarnation des Gottes Yama ist, der durch den Fluch des Weisen Māṇḍavya im Leib einer Dienerin (durch Vyāsas Niyoga im Namen des verstorbenen Bruders Vicitravīrya) geboren wurde; Kṛṣṇa selbst wies Maitreya beim Verlassen der Welt an, Vidura im Wissen zu unterweisen."}, {"term": "Puruṣa, Māyā und das Mahat-Tattva (Bhāgavata 3.5.22-28)", "category": "Konzept", "definition": "Maitreya beginnt die kosmogonische Erzählung: vor der Schöpfung war der Erhabene allein das Selbst aller Selbste; als \"der Sehende\" ohne Sichtbares betrachtete er sich selbst als nicht-seiend, seine Schöpferkraft (Māyā, aus Sein und Nichtsein bestehend) ruhend; durch das Wirken der Zeit legte er mittels seiner Puruṣa-Gestalt den Samen in die aus den drei Guṇas bestehende Māyā, woraus das Mahat-Tattva (das kosmische Erkenntnisprinzip) und, in den Blick des Herrn gelangt, dessen Selbstentfaltung zur Schöpfung hervorgingen."}, {"term": "Ahaṅkāra-Dreiteilung und die Schöpfung der subtilen Elemente (Bhāgavata 3.5.29-37)", "category": "Konzept", "definition": "Aus dem Mahat-Tattva entsteht das Ahaṅkāra (Ich-Bewusstsein) in dreifacher Form - vaikārika (aus Sattva, woraus Geist und die vaikārika-Götter), taijasa (aus Rajas, woraus die Erkenntnis- und Handlungssinne) und tāmasa (aus Tamas, woraus die subtilen Elemente); aus Letzterem entfaltet sich sequentiell, jeweils durch Verbindung mit Zeit und Māyā-Anteil, die Kette Äther-Luft-Feuer-Wasser-Erde, wobei jedes spätere Element kumulativ die Eigenschaften der vorangehenden in sich trägt."}, {"term": "Das Gebet der Elementgottheiten (Bhāgavata 3.5.38-51)", "category": "Konzept", "definition": "Die aus Zeit und Māyā entstandenen Elementgottheiten, als Teilaspekte Viṣṇus wegen ihrer Vielheit unfähig zu eigenständigem Handeln, preisen mit gefalteten Händen den Lotosfuß des Herrn als Zuflucht vor dreifacher Qual; sie stellen den mühevollen Jñāna/Yoga-Weg dem leichteren Weg hingebungsvollen Erinnerns gegenüber, bekennen ihre Unfähigkeit, dem Schöpfer sein Spiel zu vergelten, beschreiben die wechselseitige Opfer-Nahrungs-Beziehung zwischen Welten und Schöpfer und bitten ihn schließlich um die Gewährung seines eigenen \"Auges\", um recht handeln zu können."}, {"term": "Entstehung des goldenen Puruṣa (Virāṭ) (Bhāgavata 3.6.1-10)", "category": "Konzept", "definition": "Der Herr tritt mit der Kraft der Zeit in die noch ungeeinte Gruppe der 23 kosmischen Grundprinzipien (tattvas) ein und erweckt deren schlafendes Karma, wodurch diese den goldenen kosmischen Puruṣa (virāṭ-puruṣa) erzeugen, der tausend göttliche Jahre im Weltenei ruht; der Puruṣa gliedert sich dreifach (adhyātma, adhidaiva, adhibhūta), und der Herr durchglüht ihn schließlich mit eigener Glut zur vollen Entfaltung."}, {"term": "Die Sitze der Elementgottheiten im Virāṭ-Körper (Bhāgavata 3.6.11-26)", "category": "Konzept", "definition": "Aus dem durchglühten, aufbrechenden Körper des kosmischen Puruṣa entstehen der Reihe nach die Wohnstätten der Elementgottheiten samt den zugehörigen Sinnesfunktionen: Agni (Mund/Sprache), Varuṇa (Gaumen/Geschmack), die Aśvins (Nase/Geruch), Tvaṣṭā (Augen/Sehen), Anila (Haut/Berührung), die Himmelsrichtungen (Ohren/Gehör), die Pflanzen (Körperhaare/Hautreiz), der Gott Ka (Zeugungsglied/Wonne), Mitra (Ausscheidung), Indra (Hände/Greifen), Viṣṇu (Füße/Bewegung), Vāgīśa-Brahmā (Intellekt/Erkennen), der Mond (Herz/Gemütswandel), Abhimāna-Rudra (Ich-Bewusstsein/Handeln) und Mahat (Sattva/unterscheidendes Wissen)."}, {"term": "Entstehung der Welten und der vier Stände aus dem Puruṣa (Bhāgavata 3.6.27-34)", "category": "Konzept", "definition": "Aus Kopf, Füßen und Nabel des kosmischen Puruṣa entstehen Himmel, Erde und Luftraum, bewohnt je nach Guṇa-Vorherrschaft von Göttern (Sattva), Menschen des Erwerbs (Rajas) und Rudras Gefolgschaft (Tamas); aus Mund, Armen, Schenkeln und Füßen des Puruṣa gehen die vier Stände hervor - Brahmane (Wissen/Lehre), Kṣatriya (Schutz), Vaiśya (Erwerb) und Śūdra (Dienst) -, die jeweils durch ihre ständespezifische Pflicht Hari verehren."}, {"term": "Unbeschreiblichkeit der Yoga-Māyā und Maitreyas Bescheidenheit (Bhāgavata 3.6.35-40)", "category": "Konzept", "definition": "Maitreya erklärt, dass niemand die volle Entfaltung der Kraft der Yoga-Māyā des Erhabenen beschreiben könne, verkündet dennoch nach bestem Wissen und Hören zur Ehre Haris; er nennt die Lobpreisung des Herrn den einzig wahren Nutzen menschlicher Sprache und schließt mit dem Hinweis, dass selbst der urzeitliche Weise Brahmā die Größe des Puruṣa-Selbst erst nach tausend Jahren Yoga-Versenkung erkannte, da selbst er als Selbstentstandener seinen eigenen Ursprung nicht kennt."}, {"term": "Viduras Frage nach Māyā und Guṇa-losem Spiel (Bhāgavata 3.7.1-7)", "category": "Konzept", "definition": "Vidura fragt Maitreya, wie mit dem unveränderlichen, jenseits der Guṇas stehenden Erhabenen dennoch Eigenschaften, Taten und ein spielerisches Schöpfungswirken verbunden sein können, ohne dass ihm dabei Unglück oder durch Taten bedingtes Leid zukäme, da er doch als das Eine Selbst in allen Körpern gegenwärtig ist."}, {"term": "Das Gleichnis vom zitternden Mondbild (Bhāgavata 3.7.8-14)", "category": "Konzept", "definition": "Maitreya erklärt die scheinbare Verkehrung des Selbst durch Māyā mit dem Bild des im bewegten Wasser zitternden Mondbildes - eine dem Wasser, nicht dem Mond zugehörige Eigenschaft; durch die Praxis der Entsagung, Vāsudevas Gnade und den Yoga der Hingabe wird diese Täuschung allmählich aufgelöst, wobei schon das bloße Hören von Kṛṣṇas Herrlichkeiten alle Leiden zum Erlöschen bringt."}, {"term": "Viduras verbleibender Zweifel und Bitte um Dienst (Bhāgavata 3.7.15-20)", "category": "Konzept", "definition": "Obwohl Viduras Zweifel durch Maitreyas Worte weitgehend zerschnitten ist, bekennt er, dass sein Geist noch zwischen den beiden Extremen (völliger Verblendung und höchster Weisheit, die beide im Glück ruhen, während nur der dazwischen Stehende leidet) schwankt, und bittet um den seltenen, schwer erlangbaren Dienst hingebungsvoller Zuneigung zu den Lotosfüßen des Erhabenen."}, {"term": "Viduras umfassender Fragenkatalog zur weiteren Schöpfung (Bhāgavata 3.7.21-42)", "category": "Konzept", "definition": "Nach Maitreyas kurzem Verweis auf den tausendgliedrigen Puruṣa/Virāṭ stellt Vidura einen umfangreichen Katalog weiterer Fragen: nach Manvantaras und Prajāpatis, den Welten ober- und unterhalb der Erde, den Entstehungsweisen der Lebewesen (aus Mutterleib, Schweiß, Ei, Pflanzen), den Guṇa-Inkarnationen des Herrn, den vier Ständen und Lebensstufen, Opfer, Yoga und Sāṅkhya, häretischen Pfaden, den vier Lebenszielen (Dharma, Artha, Kāma, Mokṣa), Totenriten und Zeitrechnung, sowie den Ursachen von Wissen, Hingabe und Entsagung - mit dem abschließenden Diktum, dass das Gewähren von Furchtlosigkeit für Lebewesen alle Veden, Opfer und Askese an Verdienst übertrifft."}, {"term": "Überlieferungskette des Bhāgavata-Purāṇa (Bhāgavata 3.8.1-9)", "category": "Konzept", "definition": "Maitreya beginnt seine eigentliche Erzählung des Bhāgavata-Purāṇa und nennt dessen Überlieferungskette: vom Gott Saṅkarṣaṇa (befragt von den Kumāras) an Sanat-kumāra, von diesem an Sāṅkhyāyana, von diesem an Parāśara (Maitreyas Lehrer, auf dessen Bitte hin von Pulastya belehrt) und schließlich von Parāśara an Maitreya selbst, der es nun an Vidura weitergibt."}, {"term": "Viṣṇu auf Śeṣa und das Erscheinen des Nabel-Lotos (Bhāgavata 3.8.10-16)", "category": "Konzept", "definition": "Zu Beginn der Schöpfung ruht Viṣṇu, wunschlos und in Selbstfreude, auf dem Schlangenlager Śeṣas im das Universum überflutenden Weltenendewasser; nach tausend Vierfach-Zeitaltern erwacht sein Schöpfungswille, und aus seiner Nabelregion bricht ein leuchtender Lotos hervor, in den Viṣṇu selbst eintritt, wodurch darin von selbst Brahmā, der aus den Veden bestehende Selbstentstandene, entsteht."}, {"term": "Brahmās Suche nach dem Ursprung und die kosmische Zeit-Vision (Bhāgavata 3.8.17-22)", "category": "Konzept", "definition": "Der neu entstandene Brahmā, zunächst richtungslos und über den eigenen Ursprung ratlos, erlangt durch das Umherblicken vier Gesichter und taucht, den Grund des Lotosstiels suchend, erfolglos ins Wasser hinab, wobei ihm in der Finsternis ein furchteinflößendes dreikränziges Rad - Symbol der alles verzehrenden Zeit - erscheint; erst durch anschließende Yoga-Versenkung gelangt er zu voller Erkenntnis."}, {"term": "Die kosmische Gestalt des Puruṣa als Berg und Weltenbaum (Bhāgavata 3.8.23-33)", "category": "Konzept", "definition": "In Versenkung erblickt Brahmā die ausführlich beschriebene Gestalt des auf Śeṣa ruhenden Puruṣa - verglichen mit einem gewaltigen, juwelengeschmückten smaragdgrünen Berg und einem kosmischen Baum mit tausend Armen als Ästen und Śeṣas Schlangenringen als Zweigen, geschmückt mit Krone, Girlande, Śrīvatsa-Zeichen und leidvertreibendem Lächeln; im Nabel-Lotos erkennt Brahmā schließlich sich selbst sowie Wasser, Luft und Äther und beginnt, von Schöpfungsverlangen erfüllt, den Puruṣa zu preisen."}, {"term": "Brahmās Erkenntnis-Lobpreis des Puruṣa (Bhāgavata 3.9.1-15)", "category": "Konzept", "definition": "Brahmā preist den Puruṣa als sein wahres, jenseits der Māyā-Guṇas liegendes Wesen, beklagt das Leid der von der Hingabe zum Herrn abgewandten Geschöpfe (Furcht durch Besitz, Kummer, Gier, Hunger, Durst, der nutzlose aber leidvolle Daseinskreislauf) und preist die Bereitschaft des Herrn, sich seinen Anhängern jeweils in der Gestalt zu zeigen, die ihrer Vorstellung entspricht, sowie die erlösende Kraft, selbst unwillkürlich beim Tod seinen Namen auszusprechen."}, {"term": "Brahmās namo-Anrufungen an den Herrn als Weltenbaum und Zeit (Bhāgavata 3.9.16-25)", "category": "Konzept", "definition": "In einer Reihe von Verehrungsversen preist Brahmā den Herrn als den dreifüßig wachsenden kosmischen Weltenbaum (Quelle von Brahmā, Śiva und Viṣṇu), als die nie blinzelnde, alle Hoffnung abschneidende Zeit, als Opferherrn, als Puruṣottama, der in allen Lebensformen spielt, und schließlich als den im Yoga-Schlaf auf Śeṣa ruhenden Puruṣa, aus dessen Nabel-Lotos Brahmā selbst entstand."}, {"term": "Kṛṣṇas Zuspruch und Anweisung an Brahmā (Bhāgavata 3.9.26-44)", "category": "Konzept", "definition": "Erschöpft von seinem Lobpreis wird der zweifelnde Brahmā von Kṛṣṇa (Madhusūdana) mit tiefer Stimme angesprochen, der ihm bestätigt, dass seine Bitte um Schöpfungskraft bereits gewährt sei, ihn zu erneuter Askese und auf den Herrn gegründetem Wissen anweist, wodurch er die Welten im eigenen Herzen unverhüllt schauen werde, ihm erklärt, dass Rajas den Weisen nicht bindet, dessen Geist an ihn gebunden ist, und ihn schließlich anweist, mit dem aus den Veden bestehenden Selbst die Schöpfung wie zuvor fortzusetzen, bevor er sich in seiner eigenen Gestalt zurückzieht."}, {"term": "Brahmās hundertjährige Askese und Teilung des Lotos (Bhāgavata 3.10.1-9)", "category": "Konzept", "definition": "Auf Viduras Frage, wie viele Arten von Geschöpfen Brahmā erschuf, berichtet Maitreya, wie Brahmā hundert göttliche Jahre Askese übte, den Wind samt Wasser verschlang, den nun raumfüllenden Lotos betrat und ihn - angetrieben durch das Wirken des Erhabenen - zunächst dreifach und dann vierzehnfach teilte, wodurch die grundlegende Anordnung der Lebewelt entstand."}, {"term": "Die neunfache Schöpfung (nava-vidhaḥ sargaḥ, Bhāgavata 3.10.10-30)", "category": "Konzept", "definition": "Auf Viduras Bitte, das Merkmal der 'Zeit' zu erklären, legt Maitreya die klassische Sāṅkhya-Systematik der neunfachen Schöpfung dar: die sechs ursprünglichen (prākṛta) Schöpfungen - Mahat, Ahaṅkāra, Elemente, Sinnesorgane, Götter/Geist, Tamas/Unverstand - sowie die drei abgewandelten (vaikṛta) Schöpfungen der unbeweglichen Wesen (Pflanzen), der Tiere (mit ausführlicher Aufzählung der Tier- und Vogelarten) und der Menschen, ergänzt um die Schöpfung der Götter und die des Kaumāra-Sarga (beiderlei Art)."}, {"term": "Die achtfache Götterschöpfung und ihre zehn Kategorien (Bhāgavata 3.10.28-30)", "category": "Konzept", "definition": "Maitreya nennt die Schöpfung der Götter, Ahnen, Asuras, Gandharvas/Apsaras, Siddhas, Yakṣas/Rākṣasas, Cāraṇas sowie Bhūtas/Pretas/Piśācas und Vidyādharas/Kinnaras - im Text als 'achtfacher Art' bezeichnet, obgleich zehn Kategorien aufgezählt werden - und schließt mit der Ankündigung, als Nächstes die Königsgeschlechter und Manvantaras zu verkünden, während der Selbstentstandene Schöpfer stets sich selbst durch sich selbst erschafft."}, {"term": "Das Atom (Paramāṇu) als kleinste Zeiteinheit (Bhāgavata 3.11.1-9)", "category": "Konzept", "definition": "Maitreya erklärt das Paramāṇu (Atom) als letzte, unteilbare Besonderung des Seienden, aus der die Menschen fälschlich eine Einheit der Materie ableiten, und leitet daraus die kleinsten Zeiteinheiten her: zwei Paramāṇus bilden ein Aṇu, drei ein Trasareṇu (das im Sonnenstrahl sichtbare Staubkorn), und darauf aufbauend Truṭi, Vedha und Lava - bis hin zur Beschreibung einer antiken Wasseruhr (ghaṭī) zur praktischen Zeitmessung."}, {"term": "Die Zeitmaße von Nimeṣa bis Manvantara (Bhāgavata 3.11.7-27)", "category": "Konzept", "definition": "Ausgehend vom Lava entfaltet Maitreya die vollständige traditionelle Zeitrechnung: Nimeṣa, Kṣaṇa, Kāṣṭhā, Laghu, Nāḍikā, Muhūrta, Yāma/Prahara, Tag und Nacht, Pakṣa (Monatshälfte), Monat, Ṛtu (Jahreszeit), Ayana (Halbjahr), Jahr (mit den fünf Jahresarten Saṁvatsara, Parivatsara, Iḍāvatsara, Anuvatsara, Vatsara) bis zu den vier Yugas (Kṛta, Tretā, Dvāpara, Kali) mit ihrer abnehmenden Dharma-Herrschaft, einem Manvantara (vierzehn Manus) und schließlich einem Tag und einer Nacht Brahmās (je tausend Catur-yugas)."}, {"term": "Brahmās Lebensspanne, die zwei Parārdhas und die Welteihülle (Bhāgavata 3.11.22-42)", "category": "Konzept", "definition": "Brahmās hundertjährige Lebensspanne gliedert sich in zwei Parārdha-Hälften - die erste (Brāhma-Kalpa) bereits vergangen, die zweite (beginnend mit dem Vārāha-Kalpa) gerade im Gange -, an deren Ende die drei Welten durch das Saṅkarṣaṇa-Feuer verbrannt und von den Ozeanen überflutet werden, während Hari auf Ananta im Wasser ruht; diese gesamte, aus Sicht des unendlichen Weltengeistes nur augenblickhafte Zeitspanne bemisst zugleich die Ausdehnung der von zehnfach wachsenden Elementhüllen umschlossenen Weltei-Kugel (Brahmāṇḍa), die letztlich mit dem unvergänglichen Brahman, dem höchsten Sitz Viṣṇus, identifiziert wird."}, {"term": "Die Kumāras verweigern die Schöpfung und der Zorn-geborene Rudra (Bhāgavata 3.12.1-20)", "category": "Konzept", "definition": "Brahmā erschafft zunächst finstere Zustände (Unwissen, Verblendung), dann die vier Kumāras (Sanaka, Sananda, Sanātana, Sanat-kumāra), die als Vāsudeva-Hingegebene die Aufforderung zur Fortpflanzung ablehnen; aus Brahmās daraufhin unterdrücktem, doch ausbrechendem Zorn entsteht der weinende Knabe Rudra, dem Brahmā elf Namen, Wohnstätten und Frauen (die Rudrāṇīs) zuweist, woraufhin Rudra selbstähnliche, die Welt verschlingende Rudra-Scharen erschafft, bis Brahmā ihn stattdessen zur Askese anweist."}, {"term": "Die zehn Manasa-Putras und ihre Körperherkunft (Bhāgavata 3.12.21-33)", "category": "Konzept", "definition": "Aus Brahmās Geist entstehen die zehn großen Weisen (Marīci, Atri, Aṅgiras, Pulastya, Pulaha, Kratu, Bhṛgu, Vasiṣṭha, Dakṣa, Nārada) sowie Dharma, Adharma, Kāma, Krodha, Kardama und weitere Prinzipien aus einzelnen Körperteilen Brahmās; als Brahmā jedoch seine eigene Tochter Vāc voller Begierde begehrt und von seinen Söhnen dafür ermahnt wird, legt er beschämt seinen Körper ab, der zum Abend-Nebel wird."}, {"term": "Die Entstehung der Veden, Wissenschaften und Versmaße; Manu und Śatarūpā (Bhāgavata 3.12.34-57)", "category": "Konzept", "definition": "Aus Brahmās vier Gesichtern entstehen der Reihe nach die vier Veden samt Ritualwissenschaft, die Upavedas (Medizin, Bogenkunst, Musik, Baukunst), Itihāsas/Purāṇas als fünfter Veda, die vedischen Versmaße aus seinen Körperteilen sowie Silben und Töne aus seiner Sprache; schließlich teilt sich sein Körper in eine männliche und weibliche Gestalt - Manu Svāyambhuva und Śatarūpā -, deren Nachkommen Priyavrata, Uttānapāda sowie die Töchter Ākūti, Devahūti (an Kardama) und Prasūti (an Dakṣa) die Welt erfüllen."}, {"term": "Manus Bitte an Brahmā und die versunkene Erde (Bhāgavata 3.13.1-17)", "category": "Konzept", "definition": "Auf König Parīkṣits (durch Vidura vermittelte) Frage erzählt Maitreya, wie Manu Svāyambhuva mit seiner Gemahlin Brahmā um Weisung bittet; Brahmā trägt ihm auf, gemäß dem Dharma über die Erde zu herrschen und den Puruṣa durch Opfer zu verehren, worauf Manu um einen sicheren Wohnort für seine Untertanen bittet, da die Erde im kosmischen Wasser versunken ist - woraufhin Brahmā selbst über ihre Errettung nachsinnt."}, {"term": "Das Erscheinen des winzigen Ebers und sein Wachstum (Bhāgavata 3.13.18-33)", "category": "Konzept", "definition": "Während Brahmā nachsinnt, entspringt seiner Nase ein daumengroßes Eberjunges, das binnen eines Augenblicks zur Größe eines Elefanten und darüber hinaus heranwächst; als die als Veden-Verkörperung erkannte Gestalt brüllend ins Urwasser eintaucht, durchpflügt sie e
