category": "Motiv", "definition": "Kap.36, V.65-124: Kunstvolle, gleichzeitige kāvya-Beschreibung aller sechs indischen Jahreszeiten (Varṣā/Regenzeit, Śarat/Herbst, Hemanta-Śiśira/Winter, Vasanta/Frühling, Grīṣma/Sommer) als Ausschmückung der Hochzeitsstadt, jede in eigenen, bildreichen Naturmetaphern personifiziert."}, {"term": "Das vedische Hochzeitsritual von Śiva und Pārvatī", "category": "Ritual", "definition": "Kap.36, V.125-135: Brahmā vollzieht als Upādhyāya (Hochzeitspriester) das vedische Eheritual - Handbindung mit Kuśa-Gras, Feueropfer, Umschreitung des Feuers. Die wahre yogische Vereinigung von Umā und Parameśvara, so der Text, wurde selbst von den Göttern nicht in ihrer eigentlichen Natur wahrgenommen."}, {"term": "Der Lobpreis Haras durch die Götter (Kap.37)", "category": "Hymnus", "definition": "Kap.37, V.2-23: Nach der Hochzeit preisen die Götter Śiva in einer langen Namaḥ-Litanei mit zahlreichen Epitheta - darunter Anspielungen auf die Zerstörung von Dakṣas Opfer (Enthauptung des Opfers, Bhagas Augen, Pūṣans Zähne) und die Anwendung von Sāṃkhya-Begriffen (Puruṣa, Prakṛti, Pradhāna, Guṇa) auf Śiva als höchstes Prinzip."}, {"term": "Die aufgeschobene Gnadengabe an die Götter", "category": "Mythologie", "definition": "Kap.37, V.24-30: Śiva bietet den Göttern nach der Hochzeit eine frei wählbare Gabe an; sie bitten, diese unausgesprochen in seiner Hand zu belassen, bis künftiger Bedarf entsteht. Ein Phalaśruti-Vers verheißt dem Sänger des Hochzeitsfestes Rang eines Gaṇeśa-gleichen Wesens, ein weiterer dem Hörer/Rezitierenden des Lobpreises Verehrung wie dem König der Unsterblichen."}, {"term": "Die Verbrennung Kāmas (Kāmadahana)", "category": "Mythologie", "definition": "Kap.38, V.1-12: Kāma (Manmatha), der Liebesgott, nähert sich Śiva zusammen mit seiner Gattin Rati, um ihn mit seinem Blumenpfeil zu treffen, wird jedoch vom Feuer aus Śivas drittem Auge zu Asche verbrannt. Auf Ratis Flehen verheißen Umā und Śiva, Kāma werde körperlos weiterwirken und dereinst als Sohn Viṣṇus (in dessen Geburt als Vasudevas Sohn) wiedergeboren ihr Gatte sein - Anspielung auf die spätere Pradyumna-Erzählung."}, {"term": "Der häusliche Zwist um Śivas Armut und der Umzug zum Meru", "category": "Mythologie", "definition": "Kap.38, V.21-40: Umās Mutter Menā tadelt ihre Tochter, mit einem besitzlosen, in kindlichen Spielen mit nackten Gaṇas lebenden Gatten (Śiva) verheiratet zu sein. Śiva nimmt dies gelassen und humorvoll auf, bestätigt seine Wohnungslosigkeit, mahnt Umā aber, der Mutter nicht zu zürnen, da sie die Wahrheit gesprochen habe. Da Umā erklärt, ihr gehe es allein um gemeinsames Glück, verlässt Śiva ihretwegen den Himavat und begibt sich mit ihr und seinen Gaṇas zum Berg Meru."}, {"term": "Die zweite Fassung des Dakṣa-Yajña-Untergangs (Vīrabhadra-Erzählung)", "category": "Mythologie", "definition": "Kap.39: Eine von Kap.34 unabhängige zweite Fassung des Dakṣa-Opfer-Motivs, zeitlich nach Śivas Vermählung mit Umā angesiedelt. Dakṣa vollzieht ein Aśvamedha, zu dem alle Götter außer Śiva eingeladen werden; auf Umās Drängen erschafft Śiva aus seinem Mund den zornentsprungenen Vīrabhadra (und, aus Umās Zorn, Bhadrakālī), der mit Rudra-Gaṇas Dakṣas Opfer vollständig verwüstet. Solche parallelen, nicht harmonisierten Fassungen desselben Mythos sind charakteristisch für die Purāṇa-Literatur."}, {"term": "Vīrabhadra und der Jvara-Dämon", "category": "Mythologie", "definition": "Kap.39, V.49-89: Der aus Śivas Zorn-Feuer entstandene Vīrabhadra, begleitet von aus Śivas Poren geborenen Rudra-Gaṇas, zerstört Dakṣas fliehendes, personifiziertes Opfer. Aus Vīrabhadras Zorn entsteht ein Schweißtropfen-Wesen, das als Fieber-Dämon (Jvara) bekannt wird; da seine geballte Glut nicht an einem Ort zu bewahren ist, verteilt Brahmā sie auf Bitten über die ganze Erde. Dakṣa nimmt schließlich Zuflucht zu Śiva und preist ihn mit tausendundacht Namen."}, {"term": "Dakṣas Lobpreis der 1008 Namen Śivas", "category": "Hymnus", "definition": "Kap.40, V.2-100: Nach seiner Zuflucht zu Śiva preist Dakṣa ihn mit einer umfangreichen, dicht komponierten Namens- und Epithetalitanei (Sahasranāma-artig), die Śiva mit kosmischen Prinzipien, Elementen, Zeiteinheiten, vedischen und sāṃkhya-Begriffen sowie zahlreichen ikonographischen und mythologischen Anspielungen identifiziert. Viele Einzelverbindungen sind sprachlich obskur oder mehrdeutig und daher mit [?] gekennzeichnet."}, {"term": "Śivas Versöhnung mit Dakṣa", "category": "Mythologie", "definition": "Kap.40, V.101-110: Nach dem Lobpreis erklärt sich Śiva versöhnt, heilt Dakṣas Opfer symbolisch und gewährt ihm eine Gnade. Die Episode schließt den in Kap.39 begonnenen zweiten Dakṣa-Yajña-Zyklus (Vīrabhadra-Fassung) friedlich ab, komplementär zur Satī-Fassung in Kap.34."}, {"term": "Die Aufteilung des Jvara-Fieber-Dämons unter den Lebewesen", "category": "Mythologie", "definition": "Kap.40, V.111-119: Das in Kap.39 aus Vīrabhadras Zorn entstandene Fieber-Wesen (Jvara) wird, da seine gesammelte Glut unerträglich ist, unter verschiedenen Geschöpfen aufgeteilt - u.a. Elefanten, Wasser, Schlangen (oder Elefanten, je nach Lesung von 'nāgānām'), Rindern, Erde, Hunden, Pferden, Pfauen, Kuckucken, Menschen, Tigern und Papageien - als Erklärung für das Fieber als universales, alle Lebewesen betreffendes Phänomen."}, {"term": "Ekāmraka (Ekāmra-Kṣetra)", "category": "Heiliger Ort", "definition": "Kap.41: Ein berühmter, Vārāṇasī gleichgesetzter Śiva-Pilgerort, benannt nach einem einzelnen (\"eka\") Mango-Baum (\"āmra\"), der dort einst stand; traditionell mit dem heutigen Bhubaneswar (Lingarāja-Tempel, Orissa) identifiziert. Das Kapitel schildert in ausführlicher Kāvya-Manier die Pracht der Stadt, ihrer Bewohner, der Natur sowie die dortigen Verdienste von Wallfahrt und Bad."}, {"term": "Bindusaras", "category": "Heiliger Ort", "definition": "Kap.41, V.50-60: Ein von Rudra zusammen mit den Weisen geschaffenes Tīrtha (heiliger Teich) im Feld Ekāmraka, gebildet aus einzeln gesammelten Wassertropfen aller heiligen Gewässer der Erde. Bad und Ahnenopfer (piṇḍa) dort gelten als besonders verdienstvoll, insbesondere am achten Tag der dunklen Monatshälfte im Mārgaśīrṣa sowie zu Tag-und-Nacht-Gleichen und Sonnenwenden."}, {"term": "Viraja und die Göttin Virajā", "category": "Heiliger Ort", "definition": "Kap.42, V.1-12: Ein Pilgerort mit der Göttin Virajā (Brahmāṇī), dem sündentilgenden Fluss Vaitaraṇī, einer Varāha-Form Viṣṇus (Kroḍarūpī Hari) und acht Tīrthas. Anblick der Göttin, Bad in den Tīrthas, Ahnenopfer (piṇḍa) und Tod an diesem Ort gelten als besonders erlösungsfördernd."}, {"term": "Puruṣottama-Kṣetra (Utkala)", "category": "Heiliger Ort", "definition": "Kap.42, V.13-49: Das berühmte, zehn Yojanas ausgedehnte heilige Feld am Nordufer des Ozeans im Land Utkala, wo Puruṣottama (Kṛṣṇa/Viṣṇu als Jagannātha) mit allen Göttern, Weisen und Ahnen ständig weilt - traditionell mit dem Jagannātha-Tempel in Purī (Orissa) identifiziert. Das Kapitel schließt mit einer Beschreibung des wonnespendenden Lotosgesichts Kṛṣṇas."}, {"term": "König Indradyumna", "category": "Mythologie/Legendäre Gestalt", "definition": "Kap.43-: Ein tugendhafter, Viṣṇu ergebener König des Kṛtayugas aus Avantī (Ujjayinī), der zum Puruṣottama-Kṣetra zog, dort ein Aśvamedha darbrachte, einen berühmten Tempel errichtete und Bilder von Kṛṣṇa (Puruṣottama), Balarāma (Saṃkarṣaṇa) und Subhadrā aufstellte - eine Ätiologie des Jagannātha-Tempelkults in Purī. Durch seine Hingabe erlangte er die Erlösung; die folgenden Kapitel erzählen seine Geschichte ausführlich."}, {"term": "Avantī (Ujjayinī) und der Mahākāla-Tempel", "category": "Heiliger Ort", "definition": "Kap.43, V.24-89: Die Hauptstadt von König Indradyumnas Reich im Land Mālava, ausführlich in Kāvya-Manier als prächtige Stadt beschrieben. Dort befindet sich der berühmte Śiva-Tempel Mahākāla sowie der heilige Fluss Śiprā und die Viṣṇu-Heiligtümer Govindasvāmin und Vikramasvāmin. Die Stadt trägt im Text auch den (an dieser Stelle textlich unsicher überlieferten) Namen Ujjayinī, das heutige Ujjain."}, {"term": "Der Auszug Indradyumnas und die Berufsständeliste", "category": "Kulturgeschichte", "definition": "Kap.44, V.16-41: Beim Auszug König Indradyumnas aus Ujjayinī zum Ozeanufer folgt ihm neben Heer und Hofstaat eine außergewöhnlich detaillierte Aufzählung von Berufsgruppen und Handwerkern der Stadt - u.a. Händler verschiedenster Waren, Musiker, Tänzer, Dichter, Ärzte verschiedener Fachrichtungen (auch Tier-, Baum- und Kuhärzte) und zahlreiche Handwerksberufe. Diese Liste ist kulturhistorisch bemerkenswert, enthält jedoch mehrere lexikalisch unsichere Berufsbezeichnungen."}, {"term": "Der Ozean als Tīrtharāja", "category": "Hymnus/Motiv", "definition": "Kap.44, V.44-53: Ausführliche, in Epitheta gehaltene Beschreibung des südlichen Ozeans als \"König der Tīrthas\" (tīrtharāja), Ruhestätte Viṣṇus (Hari), Herr der Flüsse und Ursprungsort des Amṛta (Nektars) - eine der Naturhymnen, die die Puruṣottama-Kṣetra-Erzählung rahmen."}, {"term": "Śrīs Frage und die kosmogonische Antwort Viṣṇus", "category": "Mythologie/Kosmogonie", "definition": "Kap.45, V.4-45: Eine ältere, in Brahmās Erzählung eingebettete Geschichte: Auf dem Sumeru fragt die Göttin Śrī (Lakṣmī) Viṣṇu nach dem Weg zur Erlösung aus dem Saṃsāra. Viṣṇu antwortet mit der Schöpfungsgeschichte - der Entstehung Brahmās aus seinem Nabellotos, Brahmās Erschaffung aller Wesen, Kasten und Geschlechter, und schließlich der Selbstmanifestation der tausendäugigen, tausendfüßigen Puruṣa-Urgestalt durch Brahmās Meditation über Vāsudeva."}, {"term": "Das verborgene Indranīla-Bildnis und Yamas Klage", "category": "Mythologie", "definition": "Kap.45, V.59-76: Ein aus dem Edelstein Indranīla (Saphir) gefertigtes Bildnis Viṣṇus im Puruṣottama-Kṣetra gewährte jedem Betrachter unmittelbare Erlösung, wodurch niemand mehr in Yamas Totenreich gelangte. Auf Yamas klagende Bitte hin verbarg Viṣṇu das Bildnis unter Sand und Ranken - eine Ätiologie dafür, warum zur Zeit Indradyumnas kein sichtbares Bildnis mehr im Tīrtha vorhanden war."}, {"term": "Indradyumnas Gelübde-Entschluss", "category": "Mythologie", "definition": "Kap.46: Nachdem König Indradyumna das prächtige Puruṣottama-Feld mit dem heiligen Fluss, den frommen Bewohnern und dem Banyanbaum als das gesuchte Tīrtha erkannt hat, aber feststellt, dass kein Viṣṇu-Bildnis mehr sichtbar ist (vgl. das verborgene Indranīla-Bildnis, Kap.45), fasst er den Entschluss, durch Opfer, Askese und Gelübde die Selbstoffenbarung des Gottes zu erwirken, und beginnt mit der Errichtung eines Heiligtums."}, {"term": "Der Tempelbau und das Pferdeopfer (Vājimedha) Indradyumnas", "category": "Ritual/Erzählung", "definition": "Kap.47: König Indradyumna beginnt mit Hilfe von Astrologen, Baumeistern und Brahmanen den Bau des Viṣṇu-Tempels und lädt alle Könige der Erde zu einem gewaltigen Pferdeopfer ein. Der gewaltige Opferplatz, die Freigebigkeit des Königs (Gold, Vieh, Kleidung, Frauen als Gaben) und das allgemeine Wohlergehen aller Anwesenden werden in epischer Breite geschildert; das Opfer soll andauern, bis Viṣṇu dem König persönlich erscheint."}, {"term": "Indradyumnas Sorge um das Bildnis-Material", "category": "Mythologie/Ikonographie", "definition": "Kap.48: Nach Vollendung von Opfer und Tempel wird König Indradyumna von Sorge ergriffen, da er nicht weiß, aus welchem Material (Stein, Ton oder Holz) ein für Puruṣottama geeignetes und diesem selbst wohlgefälliges Bildnis geschaffen werden kann. Weder Reichtum noch Sinnesfreuden können ihn trösten; schließlich verehrt er Puruṣottama nach der Pañcarātra-Lehre und beginnt einen Lobpreis (fortgesetzt in Kap.49)."}, {"term": "Indradyumnas Lobpreis-Hymne (Stotra) an Puruṣottama", "category": "Hymnus/Theologie", "definition": "Kap.49: König Indradyumna preist Viṣṇu/Vāsudeva in einer langen Hymne unter zahlreichen Namen und Formen (Saṃkarṣaṇa, Aniruddha, Nārāyaṇa, Narasiṃha, Varāha u.a.), erklärt deren letztendliche Nicht-Zweiheit (Advaita) trotz vielfältiger manifester Gestalt, klagt ausführlich über die endlosen Leiden der Wiedergeburten im Saṃsāra und bekennt die Notwendigkeit der Bhakti (Hingabe) für die Erlösung. Endet mit einem Phala-śruti-Abschnitt über die Verdienste des Rezitierens."}, {"term": "Der Ursprungsmythos der Jagannātha-Bildnistrias (Kṛṣṇa/Ananta/Subhadrā)", "category": "Mythologie/Ikonographie", "definition": "Kap.50: Viṣṇu weist Indradyumna im Traum an, am Meeresufer einen wunderbaren, keiner bekannten Art zuzuordnenden Baum zu fällen. Beim Fällen erscheinen Viśvakarman und Viṣṇu in Brahmanengestalt; Viśvakarman fertigt binnen eines Augenblicks drei Bildnisse: eine dunkle Kṛṣṇa-Gestalt, eine weiße Gestalt namens Ananta (\"der Endlose\", identifiziert mit Balabhadra/Balarāma) und Subhadrā, die Schwester Vāsudevas. Dies ist der purāṇische Ursprungsmythos der bis heute im Jagannātha-Tempel von Puri verehrten Kultbild-Trias."}, {"term": "Der Indradyumna-Saras und das Āṣāḍha-Fest", "category": "Ritual/Geographie", "definition": "Kap.51: Nach der Selbstoffenbarung des Puruṣottama und der Gewährung des Segens (10.900 Jahre Herrschaft, danach Eingang in die höchste Welt) beschreibt der Text den heiligen Teich Indradyumna-Saras mit seinem Banyanbaum und Pavillon sowie die umliegenden Bäume. Es folgt die Schilderung des jährlich im Monat Āṣāḍha gefeierten Festes (Wagenfest-Vorläufer) sowie die feierliche Errichtung und Weihe (pratiṣṭhā) der drei Bildnisse Kṛṣṇa, Rāma/Ananta und Subhadrā. Die Erzählung endet mit Indradyumnas Entsagung und Eingang in Viṣṇus höchste Welt sowie dem Abschluss der Rahmenerzählung durch Brahmā."}, {"term": "Mahāpralaya und Mārkaṇḍeya am kosmischen Banyanbaum", "category": "Kosmologie/Mythologie", "definition": "Kap.52: Brahmā erzählt vom Ende eines Kalpa: Sonne, Mond und Wind vergehen, das Saṃvartaka- bzw. Kalpa-Feuer verbrennt zusammen mit gewaltigen Stürmen alle drei Welten samt Göttern, Dämonen und Menschen. Allein der Weise Mārkaṇḍeya überlebt; von Hunger, Durst und Furcht getrieben irrt er ziellos umher, bis er meditierend den ewigen Ort 'Puruṣeśa' erreicht – den kosmischen Banyanbaum (Vaṭarāja) –, wo er unversehrt vor Feuer, Blitz und Sturm Zuflucht findet."}, {"term": "Der göttliche Knabe auf dem Banyanblatt (Vaṭapatraśāyī-Motiv)", "category": "Mythologie/Ikonographie", "definition": "Kap.53: Inmitten des Ur-Ozeans (Ekārṇava), in den nach zwölfjährigem Sintflutregen die gesamte Schöpfung versunken ist, findet Mārkaṇḍeya auf einem juwelenbesetzten Ruhelager im Geäst eines kosmischen Banyanbaums einen strahlenden, vierarmigen göttlichen Knaben (Puruṣottama/Viṣṇu in Kindergestalt). Dies ist die klassische purāṇische Fassung des später als 'Vaṭapatraśāyī' (auf dem Banyanblatt Ruhender) bekannten Bildmotivs. Der Knabe fordert den erschöpften Weisen auf, in seinen Körper einzutreten."}, {"term": "Mārkaṇḍeyas Vision des Universums im Bauch des Gottes", "category": "Kosmologie/Mythologie", "definition": "Kap.54: Im Inneren des göttlichen Knaben erblickt Mārkaṇḍeya die gesamte Schöpfung: Kontinente, Ozeane, den Weltberg Meru, alle Gebirge und Völker der Erde, Tiere, Götter, Dämonen und Weise, sowie die sieben oberen Welten (Bhūr- bis Satyaloka) und die Unterwelten (Atala bis Pātāla) – kurz das gesamte Brahmāṇḍa (Weltenei). Da er kein Ende von dessen Körper findet, nimmt er Zuflucht zum Gott und wird darauf aus dessen Mund herausgeschleudert. Berühmtes purāṇisches Motiv der Universum-im-Gott-Vision, vergleichbar der Viśvarūpa-Schau in der Bhagavadgītā."}, {"term": "Mārkaṇḍeyas zweite Lobpreis-Hymne (Kap.55)", "category": "Theologie/Stotra", "definition": "Kap.55: Nach seiner Rückkehr aus dem Leib des göttlichen Knaben besingt Mārkaṇḍeya Puruṣottama in einer zweiten Hymne: zunächst schildert er die erlittenen Schrecken des Pralaya (Feuer, Sturm, Durst, Hunger), dann folgt eine lange Reihe von 'prasīda' ('sei gnädig')-Anrufungen mit zahlreichen Viṣṇu-Beinamen (Madhusūdana, Kaṃsakeśighna, Yadunandana u.a.), und schließlich eine Identifikationsreihe, in der der Gott mit den Elementen, den inneren Organen (Manas, Ahaṃkāra, Buddhi), allen Göttern, Dämonen und Wesensklassen sowie mit Vergangenheit, Gegenwart und Zukunft gleichgesetzt wird."}, {"term": "Puruṣottamas Selbstoffenbarungsrede und der Gītā-Parallelvers (Kap.56)", "category": "Theologie", "definition": "Kap.56: In seiner großen Lehrrede an Mārkaṇḍeya erklärt der göttliche Knabe die Etymologie des Namens Nārāyaṇa ('āpo nārāḥ' – die Gewässer sind sein Wohnsitz), identifiziert sich mit allen Göttern, Elementen, Ständen und Veden, lehrt die Farbenlehre der vier Weltzeitalter (weiß/dunkelblau/rot/schwarz) und spricht den berühmten, fast wortgleich mit Bhagavadgītā 4.7-8 übereinstimmenden Avatāra-Vers ('yadā yadā hi dharmasya glānir bhavati... tadātmānaṃ sṛjāmy aham'). Am Ende lehrt er die Wesensidentität von Viṣṇu und Śiva (Hari-Hara-Abheda) und verheißt die Gründung des Śiva-Tempels und des Tīrtha 'Mārkaṇḍeya-Hrada' im Puruṣottama-Gebiet."}, {"term": "Pañcatīrtha-Ritual des Puruṣottama-Kṣetra", "category": "Ritual", "definition": "Kap.57: Ausführliche Ritualvorschrift für die Wallfahrt der fünf Pilgerstätten (Pañcatīrtha) im Puruṣottama-Gebiet: Bad im Mārkaṇḍeya-Teich mit Mantra an Śiva, Verehrung im Śiva-Tempel, Umschreitung des wunscherfüllenden Banyanbaums (Kalpavṛkṣa) als Erscheinungsform Viṣṇus, Verneigung vor Garuḍa, Verehrung Balarāmas (mit eigenem Mantra) und Kṛṣṇas (mit dem Zwölfsilben-Mantra und 'Jaya'-Lobpreisungen), sowie abschließend Verehrung Subhadrās, die hier mit der Göttin Kātyāyanī identifiziert wird. Eine lange Formelreihe setzt den bloßen Anblick Kṛṣṇas mit den Verdiensten aller vedischen Opfer und Askesen gleich."}, {"term": "Narasiṃha-Sādhanā und Kavaca (Kap.58)", "category": "Ritual", "definition": "Kap.58: Nach der Verehrung Kṛṣṇa-Balarāma-Subhadrās wendet sich der Text der im selben Tempelbezirk verehrten Narasiṃha-(Menschenlöwen-)Gestalt Viṣṇus zu und schildert eine ausgesprochen tantrisch geprägte Sādhanā-Ordnung: strenge Diät- und Askeseregeln, ein zwanzig-Lakh-facher Mantra-Japa, ein dreistufiger Schutz-Kavaca, ein Ritual am Höhleneingang (Bila) zur Unterwelt (Pātāla) mit Feueropfer, himmlischen Vīṇā-spielenden Frauen und einem göttlichen Rasāyana-Elixier, das einen göttlichen Körper verleiht, sowie die Mitnahme verschiedener Siddhi-Gegenstände. Eine Dreizack-Visualisierung (Triśikha) dient der Heilung von Gift, Krankheit und Graha-Besessenheit. Ein gesonderter, durch [Anm.] als ungewöhnlich magisch-tantrisch gekennzeichneter Abschnitt beschreibt ein Löwenbildnis-Ritual mit sieben Erdarten, Milch und Sandelholz zur Regenabwehr, Windbeschwörung und einem schädigenden bzw. besänftigenden Vergrabungsritus. Der Abschnitt schließt mit einer ausführlichen Phala-śruti über den Verdienst, Narasiṃha zu erblicken."}, {"term": "Śvetamādhava und die Śvetagaṅgā (Kap.59)", "category": "Erzählung/Tīrtha", "definition": "Kap.59: Ätiologische Erzählung zum Bildnis „Śvetamādhava“ im Puruṣottama-Kṣetra. König Śveta rettet mit Śivas Hilfe das verstorbene Kind des Weisen Kapālagautama, errichtet danach am Meer einen Tempel für Mādhava, vollzieht einen einmonatigen Japa des zwölfsilbigen Viṣṇu-Mantras und trägt eine ausgedehnte Namensreihe (Stotra) mit der Pāñcarātra-Caturvyūha (Vāsudeva-Saṃkarṣaṇa-Pradyumna-Aniruddha) sowie Veda-Identifikationen vor. Kṛṣṇa erscheint und gewährt ihm den unvergänglichen Viṣṇu-Ort oberhalb Brahmās Wohnstatt; der zugehörige Teich wird als „Śvetagaṅgā“ benannt. Eine abschließende Phala-śruti preist den Verdienst der Berührung des Wassers und des Anblicks des Bildnisses."}, {"term": "Nārāyaṇa-Allverbundenheit und Tarpaṇa-Ritualordnung (Kap.60)", "category": "Lehre/Ritual", "definition": "Kap.60: Nach der Matsyamādhava-Erzählung entfaltet Brahmā eine Lehre, wonach die gesamte Wirklichkeit – Veden, Elemente, Sinnesorgane, Prakṛti und Puruṣa, die ganze bewegliche und unbewegliche Welt – Nārāyaṇas Wesen ist ('nārāyaṇātmaka'), gestützt auf die Etymologie 'āpo narāḥ' (Wasser als Nara-Söhne, daher Nārāyaṇas Name). Es folgt die silbenweise Aṅga-Nyāsa-Anlegung des Mantras 'oṃ namo nārāyaṇāya' auf den Körper, ein Kavaca (Schutzpanzer) der acht Viṣṇu-Namen als Richtungswächter, sowie eine ausführliche Ritualordnung für Sonnenverehrung (Gāyatrī) und das Ahnen-Wasseropfer (Tarpaṇa) mit detaillierten Regeln zu Handhaltung, Ort und der Vermeidung unreinen Sesams."}, {"term": "Puruṣottama-Pūjāvidhi: Maṇḍala, Nyāsa und die sechzehn Verehrungs-Mantras (Kap.61)", "category": "Ritual", "definition": "Kap.61: Vollständige tantrische Pāñcarātra-Pūjā-Ordnung für das Puruṣottama-Bildnis. Errichtung eines achtblättrigen Lotos-Maṇḍalas, eine Körperreinigungs-Meditation, die silbenweise Aṅga-Nyāsa-Anlegung des Achtsilben-Mantras 'oṃ namo nārāyaṇāya' auf den Körper, ein Ṣaḍaṅga-Kavaca (Haupt-Schopf-Panzer-Aufblitzen-Waffe) verbunden mit der Caturvyūha-Farbenlehre (weiß-Vāsudeva, rot-Saṃkarṣaṇa, gelb-Pradyumna, dunkel-Aniruddha) und die Selbstidentifikation mit dem von den Avatāras (u.a. Narasiṃha) allseits umgebenen Viṣṇu. Kernstück ist die Sequenz von sechzehn benannten Einzel-Verehrungsmantras (Āvāhana, Sthāpana, Argha, Pādya, Madhuparka, Ācamanīya, Snāna, Vastra, Vilepana, Upavīta, Alaṃkāra, Dhūpa, Dīpa, Naivedya u.a.), gefolgt von der räumlichen Anordnung der Vyūha-Gottheiten, Waffen und Weltenhüter im Maṇḍala, den acht Mudrās und dem abschließenden Entlassungs-Mantra (Visarjana)."}, {"term": "Das Meer als Tīrtharāja (Kap.62)", "category": "Tīrtha/Lehre", "definition": "Kap.62: Nach der Puruṣottama-Pūjā wird das Meer selbst als 'Tīrtharāja' (König der Pilgerstätten) verehrt und gepriesen: sein Bade-Verdienst entspricht hundert Pferdeopfern, es gewährt Wiedergeburt einundzwanzig Generationen später im Viṣṇuloka, und an astronomisch-kalendarisch besonderen Tagen (Verfinsterung, Sonnenwende, Tagundnachtgleiche u.a.) vervielfacht sich der Verdienst von Gaben und Ahnenopfern. Begründung seiner Überlegenheit über alle anderen Tīrthas: da alle Flüsse und Seen der Erde ins Meer münden, vereint es deren gesamte Frucht in sich."}, {"term": "Jyeṣṭha-Monat und Daśaharā-Fest im Puruṣottama-Kṣetra (Kap.63)", "category": "Kalender/Fest", "definition": "Kap.63: Brahmā begründet, warum der Monat Jyeṣṭha allen anderen Monaten vorgezogen wird: alle heiligen Gewässer der Erde (Flüsse, Seen, Meere) versammeln sich der Überlieferung nach sieben Tage lang, beginnend mit Jyeṣṭha-śukla-daśamī, sichtbar am Puruṣottama-Kṣetra. Dieser zehnte Tag der hellen Monatshälfte, der zehn Sünden tilgt, wird 'Daśaharā' genannt (vgl. die andernorts überlieferte Gaṅgā-Daśaharā). Es folgt ein Kalender weiterer besonders verdienstvoller Anblicks-Tage der Bildnisse: die Sonnenwenden, das Dolāyātrā-Schaukelfest im Phālguna, der Tag der Tagundnachtgleiche und eine Tṛtīyā-Feier im Vaiśākha."}, {"term": "Mahājyaiṣṭhī und der Tīrtha-Katalog der Erde (Kap.64)", "category": "Kalender/Tīrtha", "definition": "Kap.64: Bei der 'Mahājyaiṣṭhī', einer besonderen Konjunktion von Mondzeichen und dem Mondhaus Jyeṣṭhā, übertrifft der bloße Anblick von Kṛṣṇa, Balarāma und Subhadrā in Puruṣottama die Verdienste des Badens an sämtlichen Pilgerstätten der Erde – ein umfangreicher Namenskatalog (Prayāga, Kurukṣetra, Kāśī, Dvārakā, Badarikāśrama, die sieben Kula-Berge, die großen Flüsse wie Gaṅgā, Yamunā, Narmadā, Kāverī u.v.a.) – und übertrifft sogar die Verdienste des Badens während einer Sonnenfinsternis."}, {"term": "Snānayātrā: das jährliche Bade-Fest von Kṛṣṇa, Balabhadra und Subhadrā (Kap.65)", "category": "Fest/Ritual", "definition": "Kap.65: Am Jyeṣṭha-Vollmond findet auf einer eigens errichteten, geschmückten Plattform (Mañca) das große jährliche Bade-Fest der drei Bildnisse statt, begleitet von einem gewaltigen kosmischen Versammlungs- und Verehrungskatalog (Götter, Weise, personifizierte Flüsse und Berge, Göttinnen) und einer achtteiligen Prosa-Litanei von Viṣṇu-Kṛṣṇa-Beinamen ('Jaya Jaya', V49). Zwei lange formelhafte Verdienst-Gleichsetzungs-Reihen erklären den bloßen Anblick Kṛṣṇas auf der Plattform bzw. beim anschließenden, nach Süden gewandten Umzug für gleichwertig mit zahlreichen traditionellen Gaben, Gelübden und dem Besuch sämtlicher großer Pilgerstätten der Erde. Das Bade-Restwasser (Snānaśeṣa) gilt zudem als Heilmittel und als allen anderen heiligen Gewässern überlegen."}, {"term": "Guḍivā-Yātrā: die siebentägige Festfahrt am Seeufer (Kap.66)", "category": "Fest/Ritual", "definition": "Kap.66: König Indradyumna erbat einst von Hari eine siebentägige Festfahrt an einem Seeufer im Süden des Puruṣottama-Kṣetra, bei der Kṛṣṇa, Balarāma und Subhadrā ihren gewohnten Ort verlassen und in einem eigens errichteten Pavillon (Maṇḍapa) weilen; Hari gewährte sie unter dem Namen 'Guḍivā' (bhukti- und mukti-verleihend). Der bloße Anblick der Bildnisse während dieser im hellen Āṣāḍha stattfindenden Festfahrt gilt als Quelle für Kinder, Reichtum, Heilung, gute Ehe und eine Aszendenz zur Welt Viṣṇus mit anschließender Erlösung."}, {"term": "Pratiṣṭhā-Weihe nach den zwölf Jahres-Festfahrten (Kap.67)", "category": "Ritual", "definition": "Kap.67: Nach Vollzug aller zwölf jährlichen Festfahrten (Yātrās) zu Puruṣottama soll an der Jyeṣṭha-Ekādaśī/Dvādaśī eine abschließende, sündentilgende Weihe namens 'Pratiṣṭhā' vollzogen werden: rituelles Bad, Sonnenverehrung, häusliche Abhiṣeka- und Pañcopacāra-Verehrung Puruṣottamas, nächtliche Wache mit Vāsudeva-Erzählung, und am Folgetag Speisung und reiche Beschenkung von zwölf Brahmanen und dem Guru. Es folgt eine große eschatologische Schilderung, nach der der Vollzieher nacheinander durch zahlreiche Götterwelten wandert (Viṣṇuloka, Brahmaloka, Rudraloka, Goloka, Prajāpatyaloka, Indras Śakrabhavana, Suraloka, Nakṣatraloka, Candraloka, Sūryaloka, Gandharvaloka), mit jeweils abnehmender Verweildauer in Kalpas, danach als Weltherrscher (Cakravartin) auf die Erde zurückkehrt und schließlich über die Welt der Yogis und eine Wiedergeburt in einer vaiṣṇavischen Brahmanenfamilie die endgültige Erlösung erlangt."}, {"term": "Viṣṇuloka (Vaikuṇṭha): die ewige Welt Viṣṇus (Kap.68)", "category": "Kosmologie", "definition": "Kap.68: Ausführliche Beschreibung der ewigen, alle Himmelswelten übertreffenden Welt Viṣṇus: paradiesische Wälder mit unzähligen benannten Bäumen und Lotosteichen, eine von Apsaras belebte Stadt mit einem siebenfach aus verschiedenen Edelsteinen ummauerten Palast, darin der Gott selbst mit tausend Häuptern, Armen und Namen, auf dem Löwenthron sitzend, mit Sudarśana-Rad, dem Muschelhorn Pāñcajanya, der Keule Kaumodakī und dem Bogen Śārṅga, umgeben von personifizierten Tugenden (Kīrti, Sarasvatī, Gāyatrī u.a.) und Apsaras. Frei von Krankheit, Alter und Tod, ist sie unerreichbar für Ungläubige und moralisch Verfehlte, aber offen für treue Vaiṣṇavas und für jeden, der im Puruṣottama-Kṣetra verstirbt oder dort seiner gedenkt."}, {"term": "Puruṣottama-Kṣetra als Bestes aller Pilgerstätten (Kap.69)", "category": "Lehre/Tīrtha", "definition": "Kap.69: Brahmā bestätigt den Munis, dass kein irdisches Tīrtha dem Puruṣottama-Kṣetra gleichkommt – alle anderen erreichen nicht einmal ein Sechzehntel seines Wertes. Es folgt eine lange Kette klassischer Vortrefflichkeits-Analogien: so wie Viṣṇu unter den Göttern, der Mond unter den Sternen, der Himālaya unter den Bergen, die Gaṅgā unter den Flüssen, Nārada unter den Weisen oder die Silbe Oṃ unter den Mantras jeweils das Beste ihrer Art sind, so ist Puruṣottama das Trefflichste unter allen Pilgerstätten der Erde."}, {"term": "Vierfache Einteilung der Pilgerstätten: Daiva/Āsura/Ārṣa/Mānuṣa (Kap.70)", "category": "Lehre/Tīrtha", "definition": "Kap.70: In einem erinnerten Gespräch mit Nārada erklärt Brahmā die vierfache Klassifikation aller Pilgerstätten (Tīrtha) der drei Welten, jeweils die niedrigere von der höheren übertroffen: göttliche (Daiva, von Brahmā/Viṣṇu/Śiva errichtet, dazu die zwölf heiligsten Flüsse wie Gaṅgā und Narmadā), dämonische (Āsura, an Orten einst besiegter Dämonen wie Vṛtra oder Namuci), weisen-bezogene (Ārṣa, durch die Askese großer Ṛṣis wie Vasiṣṭha oder Kaśyapa geheiligt) und menschliche (Mānuṣa, von Königen wie Ambarīṣa oder Hariścandra zum eigenen Verdienst errichtet)."}, {"term": "Tridaivatya-Gaṅgā, Tāraka und Kāma-dahana (Kap.71)", "category": "Erzählung/Mythos", "definition": "Kap.71: Auf Nāradas Frage nach dem 'Tridaivatya'-Tīrtha erklärt Brahmā, dass damit die Gaṅgā selbst gemeint ist, und erzählt die Vorgeschichte: Der Dämon Tāraka unterjocht die drei Welten; die Götter erbitten bei Viṣṇu Hilfe und erfahren, dass nur ein binnen zehn Tagen von Śiva gezeugter Sohn Tāraka töten kann. Da Śiva in tiefer Askese verharrt, arrangieren die Götter seine Vermählung mit Pārvatī (einer Inkarnation der Berggöttin-Kraft, Tochter Himavats und Menās) und entsenden Kāma (Liebesgott) mit Vasanta (Frühling), um Śivas Askese zu durchbrechen; Kāma wird jedoch von Śivas drittem Auge verbrannt. Auf erneute Bitte der Götter hin willigt Śiva schließlich ein, um Pārvatī zu werben, und entsendet Arundhatī, Vasiṣṭha, Brahmā und Viṣṇu als Brautwerber."}, {"term": "Śivas und Pārvatīs Hochzeit, Vālakhilyas und der Gaṅgā-Kamaṇḍalu (Kap.72)", "category": "Erzählung/Mythos", "definition": "Kap.72: Beschreibung der Hochzeit Śivas und Pārvatīs auf dem Himavat unter Teilnahme aller Götter, Weisen und personifizierter Berge. Beim rituellen Berühren der Zehe der Göttin durch Śiva erblickt Brahmā diese mit getrübtem Sinn und vergießt unwillkürlich Samen; aus dessen zu Staub zerriebenen Resten entstehen die winzigen Vālakhilya-Weisen. Von Scham überwältigt entfernt sich Brahmā, doch Śiva ruft ihn zurück, gewinnt aus Erde und Wasser deren reinigende Essenz und übergibt Brahmā einen geweihten Wasserkrug (Kamaṇḍalu) zur Sühne. Der letzte Vers identifiziert das darin ruhende Wasser mit der Gaṅgā selbst, wodurch sich die 'Tridaivatya'-Gaṅgā aus Kap.71 erklärt."}, {"term": "Vāmana, Trivikrama und König Bali (Kap.73)", "category": "Erzählung/Mythos", "definition": "Kap.73: Der Dāitya-König Bali beherrscht durch Tugend und Macht die drei Welten und bedrängt die Götter. Viṣṇu verspricht, ihn ohne Kampf zu bezwingen, und wird als Zwerg Vāmana in Aditis Schoß geboren. Bei Balis Pferdeopfer erbittet Vāmana drei Schritte Land; Bali gewährt sie trotz der Warnung seines Priesters Śukra. Vāmana wächst zur kosmischen Trivikrama-Gestalt, durchschreitet mit den ersten beiden Schritten Erde und Brahmaloka, und Bali bietet demütig seinen eigenen Rücken für den dritten Schritt an. Viṣṇu gewährt dem wahrhaftigen Bali die Herrschaft über Rasātala. Als Viṣṇus zweiter Schritt Brahmās Wohnstatt erreicht, opfert Brahmā ihm Wasser aus seinem von Śiva erhaltenen Kamaṇḍalu, das am Berg Meru vierfach über die Erde fällt – der nach Süden fallende Teil wird von Śiva in seinen Locken aufgefangen, womit erklärt ist, wie die Gaṅgā in Śivas Jaṭā gelangte."}, {"term": "Gautama und die List mit der verzauberten Kuh (Kap.74)", "category": "Erzählung/Mythos", "definition": "Kap.74: Die Gaṅgā gelangt in zwei Anteilen zur Erde – durch den Brahmanen Gautama und durch König Bhagīratha. Als Śiva die Gaṅgā aus Zuneigung in seinen Locken verbirgt, erträgt Pārvatī dies nicht und ersinnt mit Gaṇeśa, Skanda und ihrer Gefährtin Jayā einen Plan. Der hochberühmte Asket Gautama, dessen Einsiedelei am Brahmagiri während einer 24-jährigen Dürre als einzige verschont blieb, versorgt zahllose Gastweisen wie ein Vater. Gaṇeśa lässt Jayā in Kuhgestalt Gautamas Reisfelder verwüsten und scheinbar sterben, worauf die aufgehetzten Gastweisen von Gautama Sühne fordern. Auf den (verkleideten) Rat Gaṇeśas verspricht Gautama, Gaṅgā-Wasser aus Śivas Kamaṇḍalu-Locken herbeizuschaffen; er erkennt den göttlichen Sinn der List und bricht zum Kailāsa auf, um dort Askese zu üben."}, {"term": "Gautamas Śiva-Hymnus und der Herabstieg der Gaṅgā auf den Brahmagiri (Kap.75)", "category": "Lehre/Hymnus", "definition": "Kap.75: Auf dem Kailāsa besingt Gautama Śiva mit einem philosophischen Hymnus über dessen achtfache kosmische Gestalt (u.a. Erde, Wasser, Feuer/Sonne/Mond, Wind, Äther, Wort, Opfer) und über seine Śakti, die – erschüttert von Brahmās Fehltritt in Kap.72 – den Herabstieg der Gaṅgā zur Reinigung der Welt veranlasst. Śiva erscheint mit Umā und gewährt dem hocherfreuten Gautama jede Gunst; dieser erbittet zunächst Wohlergehen für künftige Rezitatoren des Hymnus, dann die Freilassung der Gaṅgā auf den Brahmagiri, mit ausführlicher Aufzählung ihrer alle anderen Pilgerstätten übertreffenden Reinigungskraft. Śiva erklärt die nach Gautama benannte 'Gautamī' zur heiligsten aller Pilgerstätten und verschwindet; Gautama trägt die Gaṅgā aus den Locken herbei und betritt, von Göttern und Weisen umjubelt, den Brahmagiri."}, {"term": "Freilassung der Gaṅgā und Regeln des Pilgerbades (Kap.76)", "category": "Lehre/Tīrtha", "definition": "Kap.76: Gautama legt die aus Śivas Locken mitgebrachte Gaṅgā auf dem Brahmagiri nieder; sie teilt sich fünfzehnfach in Himmel, Sterblichenwelt und Unterwelt, wobei Sterbliche jeweils nur den ihnen zugänglichen Teil wahrnehmen. Auf Gautamas Bitte erscheint Śiva und verkündet die Vorschrift für das rechte Bad an der nach Gautama benannten Godāvarī: rituelle Vorbereitung, Speisung der Brahmanen, Keuschheit, Zügelung der Sinne, Mildtätigkeit gegenüber Bedürftigen und das Hören der Erzählung von Hari und vom Ursprung der Gaṅgā."}, {"term": "Die Gautamī-Gaṅgā als höchste Pilgerstätte (Kap.77)", "category": "Lehre/Tīrtha", "definition": "Kap.77: Śiva verheißt Gautama, dass rings um die Gautamī überall Pilgerstätten entstehen werden. Brahmā erklärt, dass die Gautamī – anders als andere berühmte Flüsse und Zusammenflüsse, die nur zu bestimmten Zeiten oder an bestimmten Stellen höchstes Verdienst gewähren – zu jeder Zeit und überall Erlösung durch Baden schenkt. In der Hierarchie der Elemente und Gewässer (Wasser als vortrefflichstes Element, Pilgerstätten als vortrefflichste Gewässer, die Bhāgīrathī als beste Pilgerstätte) steht die Gautamī, mit zahlreichen Beinamen (Māheśvarī, Vaiṣṇavī, Brāhmī, Godāvarī u.a.), noch über der Bhāgīrathī als die alle Ziele in allen drei Welten gewährende höchste Pilgerstätte."}, {"term": "Sagaras Söhne, Kapila und Bhagīrathas Gaṅgā-Herabführung (Kap.78)", "category": "Erzählung/Mythos", "definition": "Kap.78: König Sagara erhält durch Vasiṣṭhas Segen 60.000 Söhne von einer Gattin und einen Stammhalter von der anderen. Als Indra das Opferpferd raubt und in der Unterwelt verbirgt, graben sich Sagaras 60.000 Söhne dorthin durch und erschlagen fälschlich den schlafenden Weisen Kapila, der sie im Zorn zu Asche verbrennt. Erst Sagaras Urenkel Bhagīratha, von Kapila auf den Kailāsa verwiesen, erwirkt durch Askese und Lobpreis Śivas und der Gaṅgā deren Herabkunft aus Śivas Locken, führt sie zur Unterwelt zur Erlösung der verbrannten Vorfahren und geleitet sie vom Himālaya durch Bhārata zum Ozean. Diese Bhagīratha-Gaṅgā und die zuvor erzählte Gautamī entstammen demselben Wasser in Śivas Locken: südlich des Vindhya-Gebirges heißt sie Gautamī, nördlich Bhāgīrathī."}, {"term": "Tryambaka und Vārāha-Tīrtha (Kap.79)", "category": "Erzählung/Tīrtha", "definition": "Kap.79: Nārada bittet Brahmā, die Verdienste einzelner Pilgerstätten der Gaṅgā-Region einzeln darzulegen. Brahmā beschreibt zunächst das Tryambaka-Tīrtha, dann ausführlich das Vārāha-Tīrtha: Der Rākṣasa Sindhusena raubt einst das Weltopfer und verbirgt es in der Unterwelt; Viṣṇu nimmt Ebergestalt (Varāha) an, folgt dem alten unterirdischen Lauf der Gaṅgā, erschlägt die Dämonen, trägt das Opfer im Maul zurück zur Erde, wäscht sein Blut an der Gaṅgā-Quelle ab – so entsteht der Vārāha-Kuṇḍa – und gibt den Göttern das 'aus seinem Maul geborene' Opfer zurück. Eine ätiologische Bemerkung verbindet dies mit der eberschnauzenförmigen Gestalt des rituellen Sruva-Löffels."}, {"term": "Kuśāvarta und Kapota-Tīrtha, die Taubenerzählung (Kap.80)", "category": "Erzählung/Tīrtha", "definition": "Kap.80: Kurze Beschreibung des Kuśāvarta-Tīrtha (von Gautama mit Kuśa-Gras gelenktes Gaṅgā-Wasser), dann ausführlich die berühmte Kapota-Erzählung (vgl. die Kapota-Upākhyāna-Tradition im Mahābhārata): Ein grausamer Jäger sucht bei einem Unwetter Zuflucht unter dem Baum eines Taubenpaares; seine Gattin gerät versehentlich in dessen Käfig. Trotz allem hält die Täubin ihren Gatten davon ab, den (hilflosen) Jäger zu verurteilen, und beide erfüllen die Pflicht der Gastfreundschaft (atithi-dharma) bis zur Selbstaufopferung im Feuer, wofür sie zum Himmel erhoben werden. Der reuige Jäger wird angewiesen, sich in der Gautamī zu baden, und gelangt ebenfalls, durch die Macht der Gaṅgā, in den Himmel. Seitdem heißt die Pilgerstätte 'Kāpota'."}, {"term": "Kārttikeya-Tīrtha, Skandas Entsagung (Kap.81)", "category": "Erzählung/Tīrtha", "definition": "Kap.81: Nach dem Sieg über Tāraka gestattet Pārvatī ihrem Sohn Kārttikeya (Skanda) uneingeschränkten Genuss, den er mit den Gattinnen der Götter auslebt. Aus Sorge nimmt Pārvatī selbst die Gestalt jeder Frau an, der sich Skanda nähert, sodass er überall das Antlitz seiner Mutter erblickt, zur Erkenntnis gelangt, dass 'die Welt aus lauter Müttern besteht', und beschämt zur Gautamī geht, um Entsagung zu geloben. Auf Indras Angebot einer Gabe hin erbittet Skanda für das Tīrtha, dass selbst schwerste Sünder (auch Ehebrecher mit der Frau des Lehrers) durch bloßes Baden gereinigt werden und Hässliche Schönheit erlangen. Śiva gewährt dies; seitdem heißt die Stätte 'Kārttikeya'."}, {"term": "Kṛttikā-Tīrtha, Geburt Skandas aus den sieben Weisenfrauen (Kap.82)", "category": "Erzählung/Tīrtha", "definition": "Kap.82: Um Tāraka zu vernichten, trinkt Agni Śivas Samen; die Gattinnen der sieben Weisen (außer Arundhatī) begehren den samentragenden Agni und werden schwanger. In der Gaṅgā stoßen sie die Embryonen als Schaum aus, die sich durch Wasser und Wind zur einzigen Gestalt des sechsgesichtigen Skanda vereinen. Die Weisen verstoßen ihre (äußerlich veränderten) Frauen fälschlich als untreu. Nārada weist die sechs Verstoßenen (später als Kṛttikās/Plejaden verehrt) an Skanda-Kārttikeya, der sie zur Gautamī schickt; durch Baden dort und Śivas Gnade gelangen sie zum Göttersitz. Seitdem heißt die Stätte 'Kṛttikā-Tīrtha'."}, {"term": "Daśāśvamedhika-Tīrtha, König Bhauvanas Opfer (Kap.83)", "category": "Erzählung/Tīrtha", "definition": "Kap.83: König Bhauvana will zehn Aśvamedha-Opfer gleichzeitig vollziehen, doch alle Versuche misslingen, bis Brahmā ihm und seinem Priester Kaśyapa die Gautamī als rechten Opferort weist – dort genügt ein einziges Pferdeopfer oder gar nur das Baden für die Frucht aller zehn. Nach Opfervollendung will der König aus Dankbarkeit die ganze Erde verschenken; eine Himmelsstimme und die personifizierte Erde selbst raten stattdessen zur Speisengabe, da schon ein am Gaṅgā-Ufer gereichter Bissen einer vollständigen Erdgabe gleichkommt. Seitdem heißt die Stätte 'Daśāśvamedhika'."}, {"term": "Paiśāca-Tīrtha, Hanumāns Geburt (Kap.84)", "category": "Erzählung/Tīrtha", "definition": "Kap.84: Am Berg Añjana leben zwei durch Fluch aus dem Himmel gefallene, tierköpfige Apsaras, Añjanā (Affenkopf) und Adrikā (Katzenkopf), beide Gattinnen Kesarīs. Auf Agastyas Segen hin zeugen Vāyu und Nirṛti mit ihnen Hanumān bzw. Adri (den Piśāca-Fürsten). Die entstellte Gestalt der Mütter, Folge eines Indra-Fluches, wird erst durch Baden und Geben an der Gautamī aufgehoben; die beiden Söhne bringen wechselseitig die Mutter des anderen dorthin. Seitdem heißt die Stätte sowohl 'Paiśāca' als auch 'Āñjana'."}, {"term": "Kṣudhā-Tīrtha, Kaṇvas Lobpreis von Gaṅgā und Hunger (Kap.85)", "category": "Erzählung/Tīrtha", "definition": "Kap.85: Der hungernde Weise Kaṇva verzichtet aus Standesstolz darauf, in Gautamas wohlversorgter Einsiedelei um Speise zu bitten, und preist stattdessen an der Gautamī-Gaṅgā sowohl die Flussgöttin als auch die personifizierte Hungersnot (Kṣudhā) in einem ausführlichen Hymnus. Beide erscheinen und gewähren Wünsche: Wohlstand, Lebensdauer, Genuss und Erlösung für Kaṇva, sowie einen Fluch gegen die Kṣudhā, ihn und seine Nachkommen zu verschonen, und ein Versprechen, dass jeder von Hunger Geplagte, der diesen Lobpreis rezitiert, von Armutsleiden befreit wird. Seitdem heißt die Stätte 'Kāṇva', 'Gāṅga' oder 'Kṣudhā-Tīrtha'."}, {"term": "Cakra-Tīrtha, Yamas Askese und Indras Argwohn (Kap.86)", "category": "Erzählung/Tīrtha", "definition": "Kap.86: Aus Mitleid mit trauernden Eltern übt Yama (der Tod) Askese an der Godāvarī, wodurch niemand mehr stirbt und die überlastete Erde sich bei Indra beschwert. Indra argwöhnt, Yama wolle durch die Askese seinen Thron usurpieren, und entsendet auf Rat der Menakā eine Kurtisane (Gaṇikā), um ihn zu verführen. Nach der Verführung löst sie sich in einen mit der Gautamī vereinten Fluss auf und steigt geläutert zum Himmel auf; Sūrya beruhigt den erstaunten Yama und schickt ihn zurück in sein Amt, begleitet von Viṣṇus zum Schutz entsandtem Diskus (Cakra). Seitdem heißt die Stätte 'Cakra-Tīrtha'."}, {"term": "Ahalyā-Saṃgama-/Indra-Tīrtha, die Geschichte von Ahalyā und Indra (Kap.87)", "category": "Erzählung/Tīrtha", "definition": "Kap.87: Brahmā erzieht Ahalyā, seine schönste Schöpfung, gibt sie zur Aufzucht dem Weisen Gautama und vermählt sie schließlich mit ihm, nachdem Gautama einen Wettstreit unter zahllosen Freiern gewitzt gewinnt (Umkreisung der gebärenden Kuh Surabhi und eines Śiva-Liṅga als Ersatz für die Erdumkreisung). Aus Eifersucht nimmt Indra später Gautamas Gestalt an, um Ahalyā zu verführen; entdeckt, flieht er als Katze, wird aber erkannt und verflucht ('Tausend-Scham-Träger'), während die getäuschte Ahalyā zum ausgetrockneten Fluss verflucht wird. Durch Vereinigung mit der Gautamī erlangt Ahalyā ihre wahre Gestalt zurück; Indra wird durch ein Bad in der Gautamī zum tausendäugigen 'Sahasrākṣa'. Seitdem heißt die Stätte 'Ahalyā-Saṃgama' oder 'Indra-Tīrtha'."}, {"term": "Janasthāna-Tīrtha, Janakas Frage nach Genuss und Erlösung (Kap.88)", "category": "Erzählung/Tīrtha", "definition": "Kap.88: König Janaka fragt seinen Hauspriester Yājñavalkya, wie Genuss (bhukti) und Erlösung (mukti) leichter zu erlangen seien als durch völlige Entsagung. Yājñavalkya verweist ihn an seinen Schwiegervater Varuṇa, der lehrt, dass vedisches Handeln (karma), besonders das Leben des Hausvaters (Gārhasthya), dem bloßen Nichthandeln überlegen sei und sowohl Genuss als auch Erlösung gewähre. Auf weiteres Fragen nennt Varuṇa den Daṇḍaka-Wald in Bhārata-varṣa als bestes Gebiet (kṣetra) und die Gautamī-Gaṅgā als beste Wallfahrtsstätte (tīrtha). Janaka vollzieht dort mit Yājñavalkya als Priester ein Aśvamedha-Opfer und erlangt Erlösung, ebenso viele weitere Könige aus der Janaka-Dynastie – daher heißt die Stätte 'Janasthāna' (Opfersitz der Janakas)."}, {"term": "Aśva-/Bhānu-Tīrtha, Pañcavaṭa-Āśrama, die Uṣā-Sūrya-Erzählung (Kap.89)", "category": "Erzählung/Tīrtha", "definition": "Kap.89: An der Gautamī lokalisierte Variante des Saṃjñā-Vivasvant-Mythos: Uṣā (Tochter des Tvaṣṭṛ, Gattin des Sonnengottes Bhānu/Sūrya) erträgt dessen Glut nicht, erschafft einen Schatten-Doppelgänger (chāyā) und flieht in Stutengestalt zur Askese ins Land der Nord-Kurus. Der Schatten gebiert eigene, parteiisch bevorzugte Kinder (Sāvarṇi, Śani, Viṣṭi); Yamas Verfluchung durch den Schatten deckt die Täuschung auf. Sūrya verfolgt die geflohene Uṣā in Pferdegestalt bis zum Janasthāna an der Gautamī, wird dort zunächst von Weisen zurückgehalten (die er zu Banyanbäumen verflucht, bevor sie ihn als Gott erkennen), und zeugt mit ihr in Pferdegestalt die Aśvin-Zwillinge. Tvaṣṭṛ beschneidet danach Sūryas überschüssige Glut (Ätiologie von Prabhāsa). Ursprung der Stätten Aśva-Tīrtha, Bhānu-Tīrtha, Pañcavaṭa-Āśrama und des heiligen Zusammenflusses von Aruṇā und Varuṇā mit der Gaṅgā."}, {"term": "Gāruḍa-Tīrtha, Garuḍas Demütigung durch Viṣṇu (Kap.90)", "category": "Erzählung/Tīrtha", "definition": "Kap.90: Der Nāga Maṇināga erlangt durch Askese bei Śiva Furchtlosigkeit vor Garuḍa, wird aber dennoch von ihm gefangen. Auf Śivas Geheiß fordert Viṣṇu die Freilassung, doch der stolze Garuḍa weigert sich und rühmt sich, Viṣṇu selbst zu tragen. Viṣṇu demütigt ihn spielerisch mit einem einzigen Finger auf seinem Scheitel; reumütig, auch mit Fürsprache der Göttin Lakṣmī (Kamalā), bittet Garuḍa um Vergebung. Śiva rät ihm, in der Gautamī-Gaṅgā zu baden, um seine ursprüngliche Kraft und goldene, blitzharte Gestalt wiederzuerlangen. Seitdem heißt die Stätte 'Gāruḍa-Tīrtha'."}, {"term": "Govardhana-Tīrtha, die verschwundenen Rinder (Kap.91)", "category": "Erzählung/Tīrtha", "definition": "Kap.91: Der Bauer Jābāli treibt seine Zugochsen ohne Rast; die Wunschkuh Surabhi berichtet dies mitleidig Nandin, der mit Śivas Erlaubnis alle Rinder der Welt verschwinden lässt. Die verzweifelten Götter erwirken über Brahmā und Śiva von Nandin die Rückgabe der Rinder erst nach Vollzug eines Gosava-Opfers. Die Rinder vermehren sich daraufhin an der Gautamī – Ursprung des Tīrtha 'Govardhana' ('Rindermehrer'), dessen Bad die Frucht von tausend verschenkten Rindern gewährt."}, {"term": "Pāpapraṇāśana-/Dhautapāpa-/Gālava-Tīrtha, Sanājjāta und Mahī (Kap.92)", "category": "Erzählung/Tīrtha", "definition": "Kap.92: Nach dem frühen Tod des Brahmanen Dhṛtavrata übergibt seine Witwe Mahī den kleinen Sohn Sanājjāta dem Weisen Gālava und verfällt selbst einem Leben als wandernde Kurtisane. Der herangewachsene, vedengelehrte Sohn erbt einen auf Dirnen gerichteten Sinn und lässt sich unwissentlich im Janasthāna nieder, wo auch seine unerkannte Mutter als Kurtisane lebt; durch Schicksal kommt es zur unwissentlichen Vereinigung von Mutter und Sohn. Gālava bemerkt Sanājjātas rätselhafte Doppelgestalt (aussätzig vor dem morgendlichen Bad in der Gautamī, strahlend danach); die nächtliche gegenseitige Befragung von Mutter und Sohn enthüllt ihre wahre Identität. Nach tiefer Erschütterung und Reue erklärt Gālava, dass die Gautamī sie täglich reinigt und echte Reue die Sünde tilgt; nach gemeinsamem Bad werden beide von aller Sünde befreit – Ursprung der Tīrtha-Namen Pāpapraṇāśana ('Sündenvernichter'), Dhautapāpa ('Sündenabgewaschen') und Gālava-Tīrtha."}, {"term": "Pitṛ-Tīrtha / Viśvāmitra-/Madhu-Tīrtha, Viśvāmitras Hundefleisch-Prüfung (Kap.93)", "category": "Erzählung/Tīrtha", "definition": "Kap.93: Pitṛ-Tīrtha, wo Rāma und Sītā die Ahnen erquickten. Danach: Während einer Dürre lässt der hungernde Viśvāmitra an der Gautamī einen toten Hund zubereiten, um zuerst Götter, Ahnen und Gäste zu erquicken. Indra, als Falke, entwendet den Topf und ersetzt das Fleisch heimlich durch Honig-Ambrosia; Viśvāmitra durchschaut dies und verlangt zornig sein Hundefleisch zurück, da die Ambrosia nur ihm allein nütze, während alle Geschöpfe hungern. Erst als Indra Ambrosia-Regen auf die ganze Welt fallen lässt, ist Viśvāmitra zufrieden. Ursprung der Tīrtha-Namen Viśvāmitra, Madhu (Honig), Aindra (Indra), Śyena (Falke) und Parjanya (Regenwolke)."}, {"term": "Śveta-/Mṛtyu-Tīrtha, der Sieg über den Tod (Kap.94)", "category": "Erzählung/Tīrtha", "definition": "Kap.94: Der Śiva-Verehrer Śveta lebt an der Gautamī so hingebungsvoll, dass selbst Yamas Boten sein Haus nicht betreten können. Der Tod selbst wird vom Śiva-Gaṇa Daṇḍin erschlagen; Yama zieht mit einem Heer aus Krankheiten und Höllenmächten in die Schlacht, wird aber von Skanda vernichtend geschlagen. Die Götter bitten Śiva, Yama wiederzubeleben, da ohne ihn die kosmische Ordnung zusammenbräche; Śiva stimmt zu, entzieht aber seine und Viṣṇus Verehrer, die die Gautamī pflegen, künftig ganz der Macht Yamas und aller Krankheiten. Nandin belebt Yama und sein Heer mit Gautamī-Wasser wieder. Ursprung der Namen Śveta-Tīrtha und Mṛtyu-Tīrtha."}, {"term": "Śukra-/Mṛtasañjīvinī-Tīrtha, wie Śukra die Totenerweckungskunst erlangte (Kap.95)", "category": "Erzählung/Tīrtha", "definition": "Kap.95: Aṅgiras unterrichtet gemeinsam seinen Sohn Jīva (Bṛhaspati) und Bhṛgus Sohn Kavi (Śukra), behandelt Śukra aber parteiisch. Der gekränkte Śukra sucht einen neuen Lehrer und wird von Gautama an Śiva selbst verwiesen. An der Gautamī erweicht er durch demütige Lobpreisung Śivas Herz und erhält das selbst den Göttern unbekannte Wissen der Totenerweckung (Mṛtasañjīvinī-Vidyā), wodurch er Lehrer der Daityas wird. Das Wissen gelangt später über Kaca, Bṛhaspatis Sohn, an die Götter. Ursprung der Namen Śukra-Tīrtha und Mṛtasañjīvinī-Tīrtha am Nordufer der Gautamī."}, {"term": "Indra-Tīrtha / Puṇyā-Saṅgama, Indras Reinigung von der Brahmanenmord-Sünde (Kap.96)", "category": "Erzählung/Tīrtha", "definition": "Kap.96: Nach der Tötung Vṛtras wird Indra von der personifizierten Brahmanenmord-Sünde verfolgt und versteckt sich in einem Lotos-Stängel; die Götter bleiben tausend Jahre ohne Indra. Zur Reinigung soll er an der Gautamī geweiht werden, doch Gautama verflucht die Zeremonie zornig – eine Anspielung auf Indras frühere Verführung von Gautamas Gattin Ahalyā (Kap.87). An der Narmadā erhebt der Weise Māṇḍavya ebenfalls Einspruch, lässt sich aber durch Segensversprechen besänftigen – Ursprung des Landesnamens 'Mālava'. Schließlich wird Indra mit Gautamī-Wasser endgültig geweiht; der entstandene Fluss Siktā mündet in die Gaṅgā – Ursprung der Namen Puṇyā-Saṅgama und Aindra-Tīrtha."}, {"term": "Paulastya-/Dhanada-/Vaiśravasa-Tīrtha, Kuberas Vertreibung und Wiedereinsetzung (Kap.97)", "category": "Erzählung/Tīrtha", "definition": "Kap.97: Kubera (Dhanada/Vaiśravaṇa), ältester Sohn des Viśravas und Herr von Laṅkā, wird von seinem Halbbruder Rāvaṇa (angestachelt durch die statusbewusste gemeinsame Mutter) besiegt und seines Reiches beraubt. Vertrieben, wird er von seinem Großvater Pulastya an die Gautamī verwiesen, wohin Rāvaṇas Macht nicht reicht. Durch ausführliche Śiva-Hymnen (mit Anspielungen auf die Geburtsmythen Gaṇeśas und die Kāma-dahana-Erzählung) erwirkt Kubera göttliche Gunst; eine körperlose Stimme kündigt seine Wiedereinsetzung als 'Dhanapāla' (Hüter des Reichtums) noch vor Śivas Segensgewährung an. Nach Verehrung des Someśvara-Liṅga erhält Kubera Herrschaft über eine Weltrichtung, Reichtum, Freigebigkeit, Gattin und Söhne. Ursprung der Namen Paulastya-, Dhanada- und Vaiśravasa-Tīrtha."}, {"term": "Agni-/Vahni-Tīrtha, Agnis Trauer um Jātavedas und seine Wiederbesänftigung (Kap.98)", "category": "Erzählung/Tīrtha", "definition": "Kap.98: Der Daitya Madhu erschlägt in einer Opferversammlung Agnis Bruder Jātavedas (hier als eigener Havyavāṭ, 'Opferträger', dargestellt). Aus Zorn und Trauer geht Agni selbst in das Wasser der Gaṅgā ein, worauf Götter und Menschen, die als 'durch Agni lebend' (agnijīva) gelten, ihr Leben zu verlieren drohen. Götter, Weisen und Ahnen flehen ihn an; Agni zweifelt, ob er die Aufgabe seines toten Bruders erfüllen kann, doch die Götter gewähren ihm dauerhafte Privilegien (Anteil an Prayāja-/Anuyāja-Opfern, Allgegenwart, Rang als 'Mund der Götter'), woraufhin er sich besänftigen lässt und aus dem Wasser gezogen und neu geweiht wird. Ursprung des Vahni-Tīrtha mit seinen 700 Neben-Tīrthas sowie des Deva-/Āgneya-Tīrtha mit dem von Agni selbst errichteten Liṅga."}, {"term": "Ṛṇamocana-Tīrtha, Pṛthuśravas' Schuldenbefreiung (Kap.99)", "category": "Erzählung/Tīrtha", "definition": "Kap.99: Pṛthuśravas, der ältere Sohn des Weisen Kakṣīvant, bleibt aus Weltentsagung unverheiratet; sein jüngerer Bruder wagt aus Furcht vor der Verfehlung 'Parivitti' (dem Überholen des unverheirateten älteren Bruders bei Heirat oder Feueropfer) ebenfalls nicht zu heiraten. Die Ahnen mahnen zur Tilgung der drei traditionellen Schulden (gegenüber Göttern, Weisen, Ahnen) und verweisen die Brüder an die Gautamī, deren Bad ohne Einschränkung nach Ort, Zeit oder Kaste wirkt. Nach dem Bad wird Pṛthuśravas von aller Schuld gegenüber den drei Welten frei. Ursprung des Namens Ṛṇamocana-('Schuldenbefreiungs-')Tīrtha."}, {"term": "Suparṇā-/Kādravā-Saṃgama, Madhyameśvara-Tīrtha, Kaśyapas Flussgattinnen (Kap.100)", "category": "Erzählung/Tīrtha", "definition": "Kap.100: Die Vālakhilya-Weisen, von Indra geschädigt, erwirken von Kaśyapa gegen die Hälfte ihrer Askese das Versprechen eines indra-bezwingenden Sohnes. Kaśyapa zeugt Keime in seinen Gattinnen Suparṇā und Kadrū; berauscht und stolz stören diese eine Opfersitzung und werden von den Weisen zu Flüssen verflucht. Kaśyapa preist daraufhin Śiva/Maheśvara, der als Madhyameśvara ('Herr der Mitte') inmitten der Gaṅgā residiert; durch Śivas Gnade erlangen die beiden Flussgattinnen bei ihrem Zusammenfluss mit der Gaṅgā menschliche Gestalt zurück. Kadrū verspottet danach die Brahmanen und wird zur Strafe einäugig ('Sarpamātā', Mutter der Schlangen); die Weisen versprechen, dass die Gautamī vor weiteren Vergehen schützen werde. Ursprung des Suparṇā-/Kādravā-Saṃgama- bzw. Madhyameśvara-Tīrtha."}, {"term": "Purūravas-/Brahma-Tīrtha, Sarasvatīs Fluch und Milderung (Kap.101)", "category": "Erzählung/Tīrtha", "definition": "Kap.101: König Purūravas erblickt am Hofe Brahmās die Götterflüssin Sarasvatī und lässt sie durch Urvaśī zu sich holen; nach einem Verdacht auf Untreue verflucht Brahmā sie, ein großer Fluss zu werden. Aus Furcht flieht Sarasvatī zur Gautamī; die Gaṅgā mahnt Brahmā, den Fluch zu mildern, mit dem Argument von der unbeständigen, kāma-bestimmten Natur aller Frauen. Brahmā mildert den Fluch: Sarasvatī bleibt fortan zugleich sichtbar und unsichtbar. Am Ort ihres Zusammenflusses mit der Gaṅgā übt Purūravas Askese, verehrt Śiva als Siddheśvara und erlangt alle Wünsche. Ursprung des Purūravas-Tīrtha und des Sarasvatī-Saṃgama-/Brahma-Tīrtha."}, {"term": "Fünf-Tīrtha (Sāvitrī/Gāyatrī/Śraddhā/Medhā/Sarasvatī), Mṛgavyādha-Tīrtha, Brahmās Hirschjagd-Mythos (Kap.102)", "category": "Erzählung/Tīrtha", "definition": "Kap.102: Brahmā beschreibt die fünf heilvollen Tīrthas seiner ältesten Töchter (Sāvitrī, Gāyatrī, Śraddhā, Medhā, Sarasvatī) und erzählt in eigener Person den Mṛgavyādha-Mythos: von Begierde nach einer weiteren, weltschönen Tochter ergriffen, verfolgt er sie in Hirschgestalt, bis Śiva als 'Hirschjäger' (Mṛgavyādha) zum Schutz des Dharma einschreitet und ihm mit dem Tod droht. Brahmā lässt ab, übergibt die Tochter dem Sonnengott Vivasvant, und seine fünf Töchter vereinigen sich in Flussgestalt mit der Gaṅgā. Ursprung des Fünf-Tīrtha-Komplexes samt Mṛgavyādha-Tīrtha, das wie das benachbarte Brahma-Tīrtha alle Wünsche und Erlösung gewährt."}, {"term": "Śamī-Tīrtha und die Baum-/Wasser-Zufluchten der Götter, Priyavratas Pferdeopfer (Kap.103)", "category": "Erzählung/Tīrtha", "definition": "Kap.103: König Priyavrata vollzieht am Südufer der Gautamī unter Vasiṣṭhas Priesteramt ein Pferdeopfer. Als der Dānava Hiraṇyaka den Opferplatz bedroht, fliehen die Götter und nehmen in verschiedenen Bäumen und Gewässern Zuflucht (Agni/Havyavāṭ im Śamī-Baum, Viṣṇu im Aśvattha, die Sonne im Arka-Baum, Śiva im Banyan, Soma im Palāśa, Havyavāhana im Gaṅgā-Wasser, die Aśvins mit dem Opferpferd, Yama als Krähe), bis Vasiṣṭha den Dānava zurückhält und das Opfer fortgesetzt werden kann. Ursprung von sieben Tīrthas (Śamī-, Vaiṣṇava-, Ārka-, Śaiva-, Saumya-, Vāsiṣṭha- u.a.), die zusammen die Frucht von zehn Aśvamedha-Opfern gewähren."}, {"term": "Hariścandra-/Śunaḥśepa-/Rohita-/Viśvāmitra-Tīrtha (Kap.104)", "category": "Erzählung/Tīrtha", "definition": "Kap.104: König Hariścandra erfleht von Varuṇa an der Gautamī einen Sohn gegen das Versprechen, ihn zu opfern; als sein Sohn Rohita heranwächst, verzögert der König das Opfer mit immer neuen Ausflüchten, bis Varuṇa ihn mit Wassersucht straft. Rohita flieht in den Wald und kauft vom verarmten Weisen Ajīgarta dessen mittleren Sohn Śunaḥśepa als Ersatzopfer. Beim vorbereiteten Menschenopfer an der Gautamī weigert sich Hariścandra im letzten Moment, einen Brahmanen zu töten; eine körperlose Stimme weist an, das Opfer ohne Śunaḥśepas Tötung zu vollenden. Śunaḥśepa besänftigt durch eigene Hymnen die Götter, die das Opfer für vollständig erklären; Viśvāmitra nimmt ihn als ältesten Sohn an und verflucht die eigenen Söhne, die dies nicht anerkennen. Ursprung eines großen Tīrtha-Komplexes (Hariścandra-, Śunaḥśepa-, Viśvāmitra-, Rohita-Tīrtha u.v.a.), der die Frucht eines Menschenopfers gewährt; bekannte, auch im Aitareya-Brāhmaṇa und Rāmāyaṇa überlieferte Legende."}, {"term": "Soma-Tīrtha, der Soma-Kauf und die 25 Fluss-Zusammenflüsse (Kap.105)", "category": "Erzählung/Tīrtha", "definition": "Kap.105: Soma (der Mond, aus Ambrosia bestehend) gehörte einst den Gandharvas statt den Göttern. Auf Anraten der Göttin Vāc (Rede) wird am Devagiri-Berg und am Südufer der Gautamī eine Wette veranstaltet: die frauenliebenden Gandharvas geben Soma an die Götter ab und erhalten dafür Vāc/Sarasvatī, die jedoch weiterhin heimlich bei den Göttern verweilt – Ursprung des rituellen 'Soma-Kaufs' (somakrayaṇa), der seither im Stillen (upāṃśu) vollzogen wird. Bei diesem großen Opfer versammeln sich alle Wesensklassen, und 25 Flüsse vereinigen sich mit der Gaṅgā; Ursprung eines großen Komplexes von Zusammenfluss-Tīrthas (Soma-, Gāndharva-, Deva-, Pūrṇa-Tīrtha u.v.a.)."}, {"term": "Pravarā-Saṃgama/Siddheśvara-Tīrtha und der Ursprung des Rāhu (Kap.106)", "category": "Erzählung/Tīrtha", "definition": "Kap.106: Beim gemeinsamen Quirlen des Milchozeans durch Götter und Dānavas wird die Amṛta (Unsterblichkeitstrank) gewonnen; die Götter beschließen, sie den Dānavas vorzuenthalten, und verteilen sie auf Rat Bṛhaspatis und Brahmās heimlich am Berg Meru unter sich, wobei Viṣṇu und Śiva mitwirken. Der Daitya Rāhu schleicht sich, als Marut verkleidet, unter die Götter und trinkt mit; von Sonne und Mond entlarvt, wird er von Viṣṇus Diskus enthauptet – doch da er die Amṛta bereits getrunken hat, werden sowohl sein Haupt (Ursprung des Planeten Rāhu) als auch sein herabgefallener Rumpf unsterblich. Die von Śiva entsandte Göttin (Śakti/Ambikā/Kālarātri/Bhadrakālī) vernichtet den unsterblichen Rumpf und entzieht ihm die verborgene Amṛta-Essenz; der dabei austretende Rest wird zum Fluss Pravarā. Die Göttin nimmt an dessen Ufer neben Śiva (als Siddheśvara) dauerhaft Wohnsitz, am Ort 'Nivāsapura'. Ursprung des Pravarā-Saṃgama- und Siddheśvara-Tīrtha."}, {"term": "Vṛddhā-Saṃgama/Vṛddheśvara-Tīrtha (Kap.107)", "category": "Erzählung/Tīrtha", "definition": "Kap.107: Der entstellt (nasenlos) geborene Gautama, Sohn eines gleichnamigen Vaters, wird von Lehrer und Mitschülern gemieden und zieht ruhelos umher, bis er in einer Höhle am Śītagiri eine geheimnisvolle alte Asketin trifft, die sich (per einer Prophezeiung ihrer Gandharva-Mutter Suśyāmā) als seine schicksalhaft bestimmte Gattin ausgibt. Durch ihre Askese-Verdienste bei Sarasvatī, den Wassern und Agni erhält er Wissen und schöne Gestalt und heiratet sie. Vorbeiziehende Weise verspotten das ungleiche Paar; auf Agastyas Rat ziehen beide zur Gautamī, wo ein von der Flussgöttin verordnetes Ritualbad beiden vollkommene Schönheit verleiht. Das Bad-Wasser wird selbst zum Fluss 'Vṛddhā' ('die Alte'); dessen Zusammenfluss mit der Gaṅgā heißt fortan Vṛddhāsaṃgama, das dort errichtete Liṅga Vṛddheśvara ('Herr der Alten')."}, {"term": "Ilā-Tīrtha und die Verwandlung des Königs Ila (Kap.108)", "category": "Erzählung/Tīrtha", "definition": "Kap.108: König Ila vertreibt auf der Jagd unwissentlich den Yakṣa Samanyu aus dessen Höhle im Himavant; dessen Gattin, die Yakṣiṇī Samā, lockt ihn in Hirschkuhgestalt in den 'Umā-Hain', den sich Pārvatī von Śiva als vor Männern (außer Śiva, Gaṇeśa, Kārttikeya, Nandin) geschützten Ort erbeten hatte – jeder eintretende Mann wird zur Frau. Ila wird zu Ilā, heiratet den vorbeikommenden Budha (Sohn des Mondes), gebiert Purūravas, den Stammvater der Mondlinie. Ihr Sohn erwirkt später an der Gautamī durch eine Hymne an Śiva und Pārvatī/Gaurī die Rückverwandlung Ilas durch ein bloßes Ritualbad; das dabei abfließende, die Gaben der Yakṣiṇī (Tanz, Gesang, Anmut) tragende Bad-Wasser wird zu den drei mit der Gaṅgā zusammenfließenden Flüssen Nṛtyā, Gītā und Saubhāgyā. Ila gründet darauf die Stadt Ila in Daṇḍaka und krönt Purūravas gesondert als Begründer der Mondlinie. Ursprung des 16.000-Tīrtha-Komplexes um Ileśvara (Śiva). Bietet eine von der in der Einleitung dieser Ausgabe resümierten Mitra-Varuṇa-Opfer-Version abweichende Herkunftsgeschichte der Ilā/Sudyumna-Gestalt (vgl. Glossareintrag 'Ilā / Sudyumna')."}, {"term": "Cakra-Tīrtha, Dakṣas Opfer und der Verlust von Viṣṇus Diskus (Kap.109)", "category": "Erzählung/Tīrtha", "definition": "Kap.109: Als Dakṣa bei seinem großen Opfer Śiva nicht einlädt und schmäht, verbrennt sich seine Tochter Dākṣāyaṇī (Satī) selbst durch Yoga-Kraft; Śiva sendet Vīrabhadra und Bhadrakālī, die das Opfer verwüsten, mehreren Göttern Gewalt antun und sogar Viṣṇus zur Rettung geschleuderten Diskus verschlingen, bis Dakṣa Śiva mit einer Hymne besänftigt und dieser das Opfer vollendet. In einer zweiten, damit lose verbundenen Episode erlangt Viṣṇu bei einem späteren Götter-Daitya-Krieg seinen (erneut verlorenen) Diskus zurück, indem er Śiva an der Gautamī mit täglich tausend goldenen Lotosblüten verehrt und, als einmal eine Blüte fehlt, sein eigenes Auge als Ersatz opfert – woraufhin Śiva und Pārvatī ihm Diskus und Auge zugleich zurückgeben. Ursprung des Cakra-Tīrtha."}, {"term": "Pippala-Tīrtha, Dadhīci und Pippalāda (Kap.110)", "category": "Erzählung/Tīrtha", "definition": "Kap.110 (mit 229 Versen das umfangreichste Kapitel): Der Weise Dadhīci und seine Gattin (im Kapitel uneinheitlich als Lopāmudrā, Gabhastinī, Vaḍavā, Prātitheyī bzw. Ambikā bezeichnet) verwahren nach einem Göttersieg deren Waffen; auf Rat seiner Frau nimmt Dadhīci deren Kraft über 1000 Jahre in Form geweihten Wassers in sich auf. Als die Götter die Waffen zurückfordern, opfert Dadhīci sein Leben, damit aus seinen von Kühen freigelegten Knochen neue Waffen geschmiedet werden (Ursprung von Indras Vajra). Seine schwangere Gattin rettet das ungeborene Kind bei den Pippala-Bäumen und geht ins Feuer; der von Soma mit Amṛta genährte Sohn heißt 'Pippalāda'. Er schwört Rache, erlangt durch Askese an der Gautamī/Cakreśvara die Schau von Śivas drittem Auge und erschafft eine alles verschlingende Kṛtyā; Śiva vermittelt, die Kṛtyā (in Vaḍavā-Gestalt) und das aus ihr entstandene Feuer werden in den Ozean geleitet (Ätiologie des Vaḍavānala/Vaḍavā-Flusses, des Gotīrtha und Pitṛtīrtha), die Sonne wird an der Stätte Pratiṣṭhāna angesiedelt, und Pippalāda begegnet kurz den Geistern seiner verstorbenen Eltern. Ursprung der Pilgerstätte Cakreśvara/Pippaleśvara."}, {"term": "Nāga-Tīrtha, Nāgeśvara und Bhogavatī (Kap.111)", "category": "Erzählung/Tīrtha", "definition": "Kap.111: König Śūrasena von Pratiṣṭhānapura erhält nach großer Mühe einen Sohn in Schlangengestalt (Nāgeśvara), den er verborgen hält. Der Schlangensohn verlangt Initiation, Vedastudium und Heirat und droht andernfalls mit Selbstmord in der Gaṅgā; ein alter Minister arrangiert durch halb wahre, halb unwahre Worte eine Stellvertreter-Ehe (Waffen an Stelle des Bräutigams) mit Prinzessin Bhogavatī, Tochter König Vijayas. Die Amme enthüllt Bhogavatī das Geheimnis, die es in Ergebenheit annimmt; durch ihre Gnade erinnert sich die Schlange an ein früheres Leben als Sohn Śeṣas, der von Śiva verflucht wurde, weil er über einen Scherz der Umā unangemessen gelacht hatte – ein Fluch, der durch Verehrung an der Gautamī aufhebbar war. Das Paar badet und verehrt Śiva dort, die Schlange erlangt Göttergestalt zurück; auf Rat seines Vaters regiert er zunächst weiter als König, bis nach dessen Tod er mit seiner Gattin in Śivas Welt eingeht. Ursprung des Nāga-Tīrtha."}, {"term": "Mātṛ-Tīrtha und die Entstehung der Mütter-Göttinnen (Kap.112)", "category": "Erzählung/Tīrtha", "definition": "Kap.112: In einem schweren Kampf zwischen Göttern und Asuras erbitten die Götter Śivas Hilfe und preisen ihn mit Anspielungen auf das Quirlen des Milchozeans (Kālakūṭa-Gift) und die Verbrennung Kāmas. Śiva kämpft in finsterer (tāmasa) Gestalt; Schweißtropfen von seiner Stirn lassen überall auf der Erde Mütter-Göttinnen (Mātṛs) in seiner Gestalt entstehen, die die fliehenden Dämonen bis in die Unterwelt (Rasātala) verfolgen und vernichten, ehe sie zu den Göttern an der Gautamī zurückkehren. Der Ort ihres Wirkens wird als Pratiṣṭhāna und je einzeln als Mātṛtīrtha bekannt, ein selbst von Göttern verehrter Ort mit unvergänglichem Verdienst durch Bad, Spende und Ahnenopfer."}, {"term": "Brahma-Tīrtha und Brahmās fünftes Haupt (Kap.113)", "category": "Erzählung/Tīrtha", "definition": "Kap.113: Brahmās eigenes fünftes, eselsgestaltiges Gesicht droht während eines Götter-Daitya-Kampfes, die Götter zu verschlingen. Nur Śiva vermag es abzuschneiden und (da weder Erde noch Ozean es aufnehmen wollen) selbst zu tragen, aus Mitleid, um den mit dem Abwerfen verbundenen Fehler zu vermeiden. An der Gautamī priesen die Götter Śiva dafür; der Ort wurde als Brahma-Tīrtha bekannt, mit Brahmās viergesichtiger Gestalt sowie dem benachbarten Rudra-Tīrtha (Ort der Enthauptung) und Saurya-Tīrtha (Sonnen-Tīrtha). Das abgetrennte Haupt selbst wurde in Avimukta-Kṣetra (Kāśī/Vārāṇasī) niedergelegt; sein Anblick reinigt selbst einen Brahmanenmörder."}, {"term": "Avighna-Tīrtha und die Gaṇeśa-Hymne (Kap.114)", "category": "Erzählung/Tīrtha/Hymne", "definition": "Kap.114: Ein Götteropfer an der Gautamī kommt wegen Hindernissen nicht zum Abschluss; Brahmā erkennt Vināyaka (Gaṇeśa) als Verursacher und rät zu dessen Verehrung. Es folgt eine ausführliche Gaṇeśa-Hymne (V.6-18) mit Anspielungen auf bekannte Kindheits- und Ätiologie-Erzählungen (Verstecken des Mondes in Śivas Haar, Ursprung des Namens Lambodara aus Bruder-Eifersucht, Einsetzung als Gaṇeśvara, sowie die Erzählung von Śivas eigenem Hindernis vor der Tripura-Vernichtung). Gaṇeśa gewährt daraufhin Hindernisfreiheit und verspricht Freiheit von Armut und das Gelingen aller Unternehmungen für Verehrer. Ursprung des Avighna-Tīrtha."}, {"term": "Śeṣa-/Nāga-Tīrtha, Śeṣas Dreizack (Kap.115)", "category": "Erzählung/Tīrtha", "definition": "Kap.115: Als Rākṣasas, Daityas und Dānavas in die Unterwelt eindringen, wird deren Herr, die Weltenschlange Śeṣa, vertrieben und sucht bei Brahmā Zuflucht, der ihn zur Gautamī schickt. Durch eine Hymne an Śiva erlangt Śeṣa einen Dreizack, vernichtet die Feinde in der Unterwelt und gewinnt seine Herrschaft zurück. An der Stelle von Śivas Erscheinen entsteht eine Höhlenöffnung mit heiligem, durch Śeṣas Feueropfer erwärmtem Gaṅgā-Wasser. Die Stätte trägt den Kapiteltitel 'Śeṣatīrtha', wird am Ende jedoch (wie bereits in Kap.111 für eine andere Erzählung) als 'Nāgatīrtha' bezeichnet."}, {"term": "Mahānala-/Vaḍavā-Tīrtha und der Tod als Opferpriester (Kap.116)", "category": "Erzählung/Tīrtha", "definition": "Kap.116: Weise im Naimiṣa-Wald machen den personifizierten Tod zu ihrem Opferpriester (Śamitṛ), wodurch niemand mehr stirbt, bis die Götter zur Wiederherstellung des Gleichgewichts Rākṣasas gegen das Opfer entsenden. Die Weisen fliehen mit dem Tod zur Gautamī, vollenden dort mit Śivas Schutz das Opfer und erklären die Rākṣasas zu Feinden der Götter. Die geweihte Kṛtyā wird in Stutengestalt (Vaḍavā) zur Gattin des Todes; das Weihwasser wird zum Fluss Vaḍavā, das vom Tod aufgestellte Liṅga zum Mahānala – eine zweite, von Kap.110 (Dadhīci/Pippalāda) unabhängige Ätiologie dieser Namen."}, {"term": "Ātma-Tīrtha und Dattātreyas Bußgebet (Kap.117)", "category": "Erzählung/Tīrtha/Hymne", "definition": "Kap.117: Dattātreya (Sohn des Atri, Bruder des Durvāsas) bittet um den Weg zum Brahman-Wissen; Atri weist ihn an die Gautamī, wo er in einer ausführlichen, persönlich gehaltenen Bußhymne (V.7-17) seine Verstrickung in Saṃsāra, Leid, Krankheit, Alter und Leidenschaften beklagt und um Śivas Gnade sowie beständige Nähe zu ihm bittet, ohne weltliche Macht zu begehren. Śiva gewährt Selbst-Erkenntnis, Erlösung, Genuss und die Größe der Pilgerstätte, fortan Ātma-Tīrtha genannt."}, {"term": "Aśvattha-/Pippala-/Manda-Tīrtha, Agastya und Śanis Sieg über zwei Rākṣasas (Kap.118)", "category": "Erzählung/Tīrtha", "definition": "Kap.118: Enthält die bekannte Agastya-Vindhya-Sage (der Vindhya-Berg verharrt seither in seiner Höhe) sowie Agastyas Opfersitzung an der Gautamī. Zwei Rākṣasa-Söhne des Kaiṭabha, Aśvattha (Baumgestalt) und Pippala (Brahmanen-/Sāmaveda-Sänger-Gestalt), verschlingen dort Brahmanen. Śanaiścara (Saturn), mit zusätzlicher Askese-Kraft der Weisen ausgestattet, lässt sich von beiden verschlingen, erblickt sie von innen mit seinem zerstörerischen Blick (Śani-dṛṣṭi) und verbrennt sie zu Asche. Ursprung der Aśvattha-, Pippala-, Śanaiścara- und Agastya-Tīrthas."}, {"term": "Soma-Tīrtha und die Pflanzen-Mütter (Kap.119)", "category": "Erzählung/Tīrtha", "definition": "Kap.119: Die Pflanzen (Oṣadhīs), als uralte Mütter der Welt, erbitten von Brahmā einen König/Gatten. Auf seinen Rat gehen sie zur Gautamī und preisen die Flussgöttin Gaṅgā in einer Hymne (Sündenvernichterin, aus Viṣṇus Fuß entsprungen, aus Śivas Haar herabgeflossen). Gaṅgā gewährt ihnen Soma (Mondgott, personifiziertes Amṛta) zum Gatten, da beide unsterblicher Natur seien. Ursprung des Soma-Tīrtha, das die Frucht des Soma-Trankes gewährt und den Ahnen den Himmel."}, {"term": "Dhānya-Tīrtha und die Pflanzen-Hymne (Kap.120)", "category": "Erzählung/Tīrtha", "definition": "Kap.120: Nachdem die Pflanzen Soma zum Gatten erlangt haben, verkünden sie einen heiligen Vers über die Verdienstwirkung der Spende von Land, Kühen und Pflanzen an der Gaṅgā an gottgleiche Brahmanen, gefolgt von einer Litanei, in der sie versprechen, jeden Spender oder Hörer dieses Verses zu erlösen. Ursprung des Dhānya-Tīrtha, auch Auṣadhya-, Saumya-, Amṛta-, Vedagāthā- und Mātṛ-Tīrtha genannt."}, {"term": "Vidarbhā-/Revatī-Zusammenfluss, Kaṭha und die hässliche Revatī (Kap.121)", "category": "Erzählung/Tīrtha", "definition": "Kap.121: Der Weise Bharadvāja sorgt sich um seine hässliche Schwester Revatī, für die sich kein Ehemann findet. Sein Schüler Kaṭha, der bei ihm sein Studium abschließt, bittet um eine Gurudakṣiṇā; Bharadvāja verlangt, dass Kaṭha Revatī heiratet, was dieser trotz Bedenken tut. Durch gemeinsame Śiva-Verehrung wird Revatī schön; aus ihrem Weihwasser entsteht der Fluss Revatī, aus einer zweiten Weihung mit Darbha-Gras der Fluss Vidarbhā. Beide Zusammenflüsse mit der Gaṅgā bzw. Gautamī gewähren Genuss und Erlösung."}, {"term": "Pūrṇa-Tīrtha, Dhanvantari und Indras dreifacher Sturz (Kap.122)", "category": "Erzählung/Tīrtha", "definition": "Kap.122: König Dhanvantari (Sohn des Āyus) übt Askese, wird vom Dämon Tamas in Gestalt einer schönen Frau (die sich als Indras Lakṣmī ausgibt) verführt und verliert seine Tapas-Kraft. Brahmā tröstet ihn und weist ihn an, Viṣṇu mit einer ausgedehnten Jaya-Hymne zu preisen (V.29-43); Viṣṇu gewährt ihm die Herrschaft über die Götter. Parallel dazu verliert der 'eigentliche' Indra dreimal sein Reich (durch Nahuṣa, das Vṛtra-Töten, die Ahalyā-Episode); Brahmā erklärt Indra und Bṛhaspati die Ursache als Dharma-Bruch bei Ritualen (anhand der Dhanvantari-Geschichte) und weist beide an, an der Gautamī Hari und Śaṅkara zu preisen: Indras Avatāra-Litanei (V.68-73: Matsya, Kūrma, Varāha, Narasiṃha, Vāmana, Hayagrīva, Trivikrama, Buddha, Rāma, Kalkin u.a.) und Bṛhaspatis philosophische Someśvara-Hymne (V.74-82, über das subtile Licht, Oṃkāra, nicht-duale Hingabe jenseits von Kastenpflicht, Vedastudium und Yoga). Hari und Hara gewähren Indra dauerhafte Herrschaftsstabilität; Bṛhaspatis Weiheritual erschafft den Fluss Maṅgalā. In Indras abschließender Hymne an Viṣṇu-Govinda bleibt die Verwendung des Epithetons 'Hari' für sowohl Indra als auch Viṣṇu in der Kuh-Geschenk-/Namensätiologie (V.95-97) textlich unklar [?]. Auch Govinda-, Maṅgalā-Saṃgama-, Bārhaspatya-Tīrtha genannt; 37.000 Nebentīrthas."}, {"term": "Rāma-Tīrtha, Daśaratha und die Śravaṇa-Episode (Kap.123)", "category": "Erzählung/Tīrtha", "definition": "Kap.123: König Daśaratha erschießt versehentlich bei nächtlicher Jagd den Sohn eines blinden Waldeinsiedlerpaares (hier 'Śravaṇa'/'Vaiśravaṇa' genannt), das daraufhin ebenfalls stirbt und ihn mit einem Fluch zu drei Brahmanenmorden belegt. Durch Aśvamedha-Opfer gereinigt, erhält er die Söhne Rāma, Lakṣmaṇa, Bharata und Śatrughna; nach Sītās Gewinnung in Mithilā und Kaikeyīs Intrige wird Rāma verbannt, und Daśaratha stirbt an Kummer, belastet mit den drei Brahmanenmorden, und gelangt in die Höllen. Während Rāma zur Gautamī (Godāvarī) zieht, wird der Vater durch die bloße Nähe des Sohnes aus der Hölle gezogen und erscheint Rāma, Sītā und Lakṣmaṇa leibhaftig; gemeinsam sühnen sie durch Bad, Reisopfergaben und eine zwölfstrophige Śiva-Hymne Rāmas die drei Brahmanenmorde, worauf Daśaratha sichtbar zum Himmel geleitet wird. Ursprung des Rāma-, Bāṇa- (Pfeil-), Lakṣmaṇa- und Sītā-Tīrtha an der Gautamī; die mit Abstand umfangreichste bisher übersetzte Einzelerzählung (217 Verseinheiten)."}, {"term": "Putra-Tīrtha, Diti/Danu und die Entstehung der Maruts (Kap.124)", "category": "Erzählung/Tīrtha", "definition": "Kap.124: Diti, verzweifelt über den Machtverfall ihrer Söhne gegenüber Aditis Söhnen, erhält von Kaśyapa ein zwölfjähriges Gelübde für einen mächtigen Sohn. Der Daitya Maya verrät aus Freundschaft mit Indra dessen Feind Ditis Plan; Indra dringt während ihres unachtsamen Schlafs in ihren Leib ein und zerschneidet den heranwachsenden Fötus trotz dessen Bitten mit dem Donnerkeil in immer kleinere Teile - daraus entstehen die 49 Maruts (Windgötter). Agastya und Diti verfluchen Indra, doch Śiva vermittelt: die Maruts werden Indras opferberechtigte Verbündete, und Diti erbittet zum Wohl aller Menschen einen Segen für Kinderlose. Ursprung des Putra-, Mitra-, Śakra- und Kamalā-Tīrtha am Zusammenfluss von Diti und Gaṅgā."}, {"term": "Yama-Tīrtha, die Taube Anuhrāda und die Eule Ulūka (Kap.125)", "category": "Erzählung/Tīrtha", "definition": "Kap.125: Zwischen der Taube Anuhrāda (Enkel des Todes) und dem Vogelkönig Ulūka herrscht über Generationen erblicher Krieg; die Taube erlangt durch Verehrung des Yama das todbringende Yama-Geschoss, die Eule durch Verehrung Agnis unwiderstehliche Feuerkraft, und im entscheidenden Kampf setzen beide ihre tödlichen Waffen gegeneinander ein. Die Taubenfrau Heti besänftigt mit einer Hymne den Agni und erbittet, dass sein Feuergeschoss nur sie selbst treffen möge, worauf ihr Gnade gewährt wird; ebenso besänftigt die Eulenfrau Ulūkī mit einer Hymne den Yama und bittet, an Stelle ihres Gatten Fesseln und Stab zu tragen, worauf auch ihr Gnade gewährt wird. Beide Götter stiften daraufhin Frieden zwischen Taube und Eule; die selbstlosen Vögel erbitten, ohne eigenen Nutzen im Sinn, Segnungen für alle Menschen, die künftig an ihren beiderseitigen Uferstätten der Gaṅgā baden, spenden und die Hymnen rezitieren. Ursprung des Yāmya-, Āgneya-, Kapota-, Ulūka- und Heti-Ulūka-Tīrtha mit insgesamt 3390 Nebentīrthas."}, {"term": "Tapas-Tīrtha und der Streit der Elemente um den Vorrang (Kap.126)", "category": "Erzählung/Tīrtha", "definition": "Kap.126: Weise streiten, ob Feuer oder Wasser das höhere Element sei, und tragen die Frage nacheinander Brahma, Vāyu, der Erde und dem auf dem Milchozean liegenden Viṣṇu vor, ohne eindeutige Antwort. Eine körperlose göttliche Stimme (Jagaddhātrī) erklärt, dass demjenigen Element der Vorrang gebühre, dessen Verehrung zuerst Frucht trage. Die zur Askese an die Gautamī (Godāvarī) zurückgezogenen Weisen teilen sich in Feuer- und Wasserverehrer, bis dieselbe Stimme, nun als Sarasvatī, das Wasser für vorrangig erklärt, da Feuer selbst dem Wasser entspringt und rituelle Reinheit ohne Wasser unmöglich ist. Ursprung des Tapas- (auch Sattra-, Agni- und Sārasvata-) Tīrtha mit 1400 Nebentīrthas am Zusammenfluss von Sarasvatī und Gaṅgā."}, {"term": "Deva-Tīrtha, Devāpi und die Errettung Ārṣṭiṣeṇas aus Rasātala (Kap.127)", "category": "Erzählung/Tīrtha", "definition": "Kap.127: Beim Rossopfer König Ārṣṭiṣeṇas zerstört der Dānava Mithu das Opfer und entführt König, Königin und Hauspriester nach Rasātala. Devāpi, der kindliche Sohn des Hauspriesters, schwört, sie durch Askese zurückzuholen, und wendet sich der Reihe nach an die Opferpriester, an Agni, an die Götter, an die Veden und schließlich an Maheśvara (Śiva), wobei jede Instanz auf die nächsthöhere verweist. An der Gautamī (Godāvarī) preist er Śiva, der ihm die Rückkehr aller Verschleppten sowie den Tod des Feindes gewährt und Nandin entsendet, der Mithu tötet. Ursprung des Deva-Tīrtha, wo Śiva leibhaftig erschien, mit 15800 Nebentīrthas."}, {"term": "Tapovana-/Śārdūla-Tīrtha, Agni, Svāhā und die Geschwister Suvarṇa/Suvarṇā (Kap.128)", "category": "Erzählung/Tīrtha", "definition": "Kap.128: Agni wird von den Göttern in Papageiengestalt zu Śiva und Pārvatī gesandt; Śiva lässt einen Teil seines Samens in Agnis Maul fallen. Daraus entsteht teils Kārttikeya (bei den Kṛttikās ausgegossen), teils - mit dem Rest, den Agni in seine Gattin Svāhā wirft - das Zwillingspaar Suvarṇa und Suvarṇā, die beide jede Gestalt annehmen können und dies zu zahllosen Liebesabenteuern mit Göttern und Gattinnen der Götter nutzen, wofür sie von Göttern und Asuras zu ewiger Untreue verflucht werden. Śiva deutet den Fluch um: Suvarṇa sei (wörtlich) das Gold, das höchste Gut der Welt, Suvarṇā die (notorisch wankelmütige) Glücksgöttin Lakṣmī. Der Dānava Śārdūla entführt Suvarṇā, wird von Viṣṇus Diskus enthauptet; Ursprung des Cakra-/Śārdūla-Tīrtha, des Śāṃkara-Vaiṣṇava-Tīrtha und der Flüsse Ānandā/Nandinī (aus Agnis Freudentränen) sowie des Tapovana-Tīrtha, mit 30000 Nebentīrthas."}, {"term": "Indra-, Vṛṣākapa- und Abjaka-Tīrtha, Mahāśani und Indras Erniedrigung (Kap.129)", "category": "Erzählung/Tīrtha", "definition": "Kap.129: Nach der Enthauptung Namucis (dessen Schaum den Fluss Phenā bildet) erzeugt der Daitya Hiraṇya den mächtigen Mahāśani, der Indra besiegt und erniedrigt. Auf Bitten Varuṇas freigelassen, wird der beschämte Indra von Śacī/Indrāṇī zur Buße an die Gautamī (Godāvarī) geleitet. Dort besingt er Śiva und Umā (Hymnus V.68-80, mit Kosmogonie-Anspielung auf Kap.113); Śiva verlangt zusätzlich die Verehrung Viṣṇus durch den Weisen Āpastamba. Aus dem Zusammenfluss von Gautamī und Phenā entsteht das vereinte Śiva-Viṣṇu-Wesen Abjaka/Vṛṣākapi, das Mahāśani tötet. Indras Freundschaft mit Vṛṣākapi und die Versöhnung mit der eifersüchtigen Śacī (samt Hymnenvers V.108 über die ideale Ehefrau) münden in die Weihung der Tīrthas Indreśvara und Abjaka, mit 7000 Nebentīrthas am Nordufer und 11 am Südufer; Abjaka gilt als das Herz der Godāvarī."}, {"term": "Āpastamba-Tīrtha, die Wesenseinheit von Brahmā, Viṣṇu und Śiva (Kap.130)", "category": "Erzählung/Tīrtha", "definition": "Kap.130: Der Weise Āpastamba fragt Agastya, wer unter Brahmā, Viṣṇu und Śiva der Verehrungswürdigste, Ewige und Unendliche sei. Agastya lehrt die Wesenseinheit der drei Götter - eine Gestalt in dreifacher Erscheinung je nach Funktion von Schöpfung, Erhaltung und Zerstörung -, über der das eine Gestaltlose steht; wer einen echten Unterschied zwischen den Göttern behauptet (liṅgabhedin), begeht eine unsühnbare Verfehlung. Dennoch weist Agastya Āpastamba an, sich mit Hingabe Śiva zuzuwenden, der Ursache der Weltentfaltung, an der Gautamī im Daṇḍaka-Wald. Dort besingt Āpastamba Śiva mit einem neunversigen Hymnus (V.23-31); Śiva erscheint und verheißt allen Badenden, die ihn dort erblicken, die Erfüllung aller Wünsche. Ursprung des Āpastamba-Tīrtha."}, {"term": "Yama-Tīrtha, Saramā und der Kuhraub durch die Rākṣasas (Kap.131)", "category": "Erzählung/Tīrtha", "definition": "Kap.131: Die Götterhündin Saramā bewacht Opferkühe, wird von Rākṣasas verführt und die Kühe geraubt. Von Bṛhaspati der Mitschuld verdächtigt und von Indra getreten (Milchfluss als vermeintlicher Bestechungsbeweis), wird sie trotz Unschuldsbeteuerung verflucht, unter Menschen als Hündin geboren zu werden. Viṣṇu verfolgt mit dem Bogen Śārṅga die Räuber in den Daṇḍaka-Wald und vernichtet sie am Nordufer der Gautamī (Godāvarī) - Ursprung des Bāṇa-/Vaiṣṇava-/Go-Tīrtha, der Kuh-Insel (Yajña-Tīrtha) und des Gorakṣa-Tīrtha. Saramās vieräugige Hundesöhne erwirken über ihren Vater Yama und dessen Vate
