s, tötet einen sie hindernden Dämon (Vorausdeutung auf Hiraṇyākṣa) und hebt die schlafende Erde aus der Tiefe Rasātala empor."}, {"term": "Der Lobpreis des Varāha durch die Weisen (Bhāgavata 3.13.34-50)", "category": "Konzept", "definition": "Die von Brahmā angeführten Weisen preisen den emporsteigenden Eber Varāha in kunstvollen Versen als Verkörperung des gesamten Opferrituals - dessen Körperteile mit den Bestandteilen und Priesterfunktionen des vedischen Opfers gleichgesetzt werden -, bitten ihn, die Erde für alle Geschöpfe wiederherzustellen, und preisen abschließend den Nektar dieser Erzählung als reinigend für jeden, der sie mit Hingabe hört."}, {"term": "Diti begehrt Kaśyapa in der Abenddämmerung (Bhāgavata 3.14.1-22)", "category": "Konzept", "definition": "Auf Viduras Bitte um die Vorgeschichte von Hiraṇyākṣas Geburt erzählt Maitreya, wie Diti, von Liebesverlangen überwältigt, ihren Gemahl Kaśyapa mitten im Abendopfer bedrängt; Kaśyapa versucht sie zunächst mit dem Lob der ehelichen Lebensstufe zu besänftigen und um Aufschub zu bitten, warnt sie jedoch eindringlich vor der Gefährlichkeit der Dämmerungsstunde, in der Rudra mit seinen Geisterscharen umherwandelt."}, {"term": "Der Lobpreis Rudras und die verbotene Vereinigung (Bhāgavata 3.14.23-33)", "category": "Konzept", "definition": "Kaśyapa beschreibt Diti die furchterregende, doch letztlich gnädige Gestalt Rudras in ausführlichen Preisversen, wird aber von der beharrlichen Diti dennoch zur Vereinigung während der verbotenen Dämmerungsstunde gedrängt; anschließend reinigt sich Kaśyapa durch Meditation über das ewige Brahman, während Diti, ihre Übertretung erkennend, ihn beschämt um Fürsprache bei Rudra bittet."}, {"term": "Kaśyapas Prophezeiung: Hiraṇyākṣa, Hiraṇyakaśipu und Prahlāda (Bhāgavata 3.14.34-51)", "category": "Konzept", "definition": "Kaśyapa verkündet Diti, dass ihr aus der fehlerhaften Vereinigung zwei unheilvolle Söhne (die späteren Dämonen Hiraṇyākṣa und Hiraṇyakaśipu) entstehen werden, die vom Erhabenen selbst getötet werden müssen; auf Ditis Bitte hin verspricht er ihr zugleich, dass unter ihren Enkeln ein makelloser, großer Gottgeweihter (Prahlāda) geboren wird, dessen reiner Ruhm dem des Erhabenen gleichkommen wird - worauf Diti sich tröstet und Hochmut ablegt."}, {"term": "Ditis unheilvolle Schwangerschaft (Bhāgavata 3.15.1-13)", "category": "Konzept", "definition": "Śuka berichtet, wie Ditis Leib durch die im vorigen Kapitel angekündigte Empfängnis der beiden künftigen Dämonen zu erschreckender Größe anschwillt und Sonne, Mond, Sterne, Winde und Feuer ihren Glanz verlieren; auf die Klage der verängstigten Götter tröstet Brahmā sie und erzählt zur Beruhigung, wie einst die vier Kumāras nach Vaikuṇṭha gelangten."}, {"term": "Beschreibung des Reiches Vaikuṇṭha (Bhāgavata 3.15.14-26)", "category": "Ort", "definition": "In kunstvollen Versen wird Vaikuṇṭha geschildert: ein makelloses Reich jenseits der drei Erscheinungsweisen der Materie, bewohnt von Wesen mit dem Herrn gleicher Gestalt, mit wunscherfüllenden Wäldern, immerwährend blühenden Bäumen, paradiesischem Vogelgesang und der Gegenwart Śrīs; ein Ort, der allein durch reine, tadellose Hingabe erreichbar ist, nicht durch bloße fromme Rede."}, {"term": "Die Kumāras, die Torhüter und der Fluch (Bhāgavata 3.15.27-50)", "category": "Konzept", "definition": "Als die kindgestaltigen Kumāras auf ihrer Wanderung durch sechs Vorhöfe Vaikuṇṭhas schließlich das siebte, mit Śrī-Zeichen geschmückte Tor erreichen, werden sie von zwei prächtig geschmückten Torwächtern am Eintritt gehindert; über diese Zurückweisung erzürnt, sprechen die Weisen einen Fluch, der die Wächter aus Vaikuṇṭha fallen lässt, woraufhin der Herr selbst in strahlender Gestalt erscheint und von den anwesenden Weisen in einem ausgedehnten Lobgesang gepriesen wird."}, {"term": "Der Erhabene versöhnt die Weisen (Bhāgavata 3.16.1-16)", "category": "Konzept", "definition": "Der im Vaikuṇṭha wohnende Erhabene erwidert den zürnenden Weisen, dass er die von ihnen über seine Torhüter Jaya und Vijaya verhängte Strafe billigt, da diese die Brahmanen missachtet hatten, und erklärt in ausführlichen Versen, dass ihm die Brahmanen die höchste Gottheit seien, deren Wohlwollen er über alles stellt; die Weisen, seine wahre Absicht zunächst nicht verstehend, preisen ihn schließlich in überschwänglichen Lobesworten."}, {"term": "Der Fluch, die Verbannung und Viṣṇus Erklärung (Bhāgavata 3.16.17-31)", "category": "Konzept", "definition": "Die Weisen erkennen den Erhabenen als höchste Gottheit der Brahmanen und Erhalter des Dharma an und stellen ihm anheim, jede Strafe für ihren eigenen Fluch zu bestimmen; der Erhabene offenbart, dass der Fluch - die zeitweilige Verbannung von Jaya und Vijaya als Asuras - von ihm selbst veranlasst wurde, wie einst von der zornigen Lakṣmī vorausgesagt, und dass die beiden durch angestrengte Hingabe rasch zu ihm zurückkehren werden."}, {"term": "Der Fall der Torhüter und ihre Wiedergeburt als Ditis Söhne (Bhāgavata 3.16.32-37)", "category": "Konzept", "definition": "Nachdem der Erhabene seine Wohnstatt wieder betreten hat, stürzen Jaya und Vijaya, ihrer Herrlichkeit beraubt, unter großem Wehklagen aus Vaikuṇṭha herab und nehmen als die gewaltige, in Ditis Schoß eingedrungene Kraft des Kaśyapa Gestalt an; Brahmā versichert den Weisen, dass der Erhabene selbst für das Wohl der Welt gegenüber dieser aufkommenden dämonischen Kraft sorgen werde."}, {"term": "Die Geburt der Zwillinge und die kosmischen Vorzeichen (Bhāgavata 3.17.1-15)", "category": "Konzept", "definition": "Nach Brahmās beruhigender Erzählung kehren die Götter erleichtert zurück; Diti gebiert nach hundert Jahren Zwillingssöhne, deren Geburt von zahllosen furchterregenden Vorzeichen begleitet wird - Erdbeben, Stürmen, blutenden Kühen, weinenden Götterbildern und wild kämpfenden Gestirnen -, die alle außer den weisen Söhnen Brahmās für den Anbruch der Weltauflösung halten."}, {"term": "Hiraṇyakaśipu und Hiraṇyākṣa (Bhāgavata 3.17.16-24)", "category": "Person", "definition": "Die beiden neugeborenen Dämonen wachsen binnen kurzem zu riesenhafter, diamantharter Gestalt heran und erhalten von ihrem Vater Kaśyapa die Namen Hiraṇyakaśipu und Hiraṇyākṣa; während Hiraṇyakaśipu durch Brahmās Segen die drei Welten unterwirft, zieht der jüngere Hiraṇyākṣa kampflüstern zum Himmel, wo die Götter sich aus Furcht vor ihm verbergen, und stürzt sich sodann in den Ozean."}, {"term": "Hiraṇyākṣa fordert Varuṇa und wird zum Herrn verwiesen (Bhāgavata 3.17.25-31)", "category": "Konzept", "definition": "Nachdem Hiraṇyākṣa Varuṇas Streitkräfte in die Flucht geschlagen hat, fordert er den Meeresgott selbst spöttisch zum Zweikampf heraus; Varuṇa lehnt in weiser Zurückhaltung ab und verweist ihn stattdessen auf den uralten Puruṣa (den Herrn in seiner Eberform), der allein ihm ebenbürtig sei und ihm - trotz seiner Boshaftigkeit letztlich aus Gnade den Guten gegenüber - im Kampf den Tod bringen werde."}, {"term": "Hiraṇyākṣa findet und verhöhnt Varāha (Bhāgavata 3.18.1-13)", "category": "Konzept", "definition": "Von Nārada über Haris Aufenthaltsort unterrichtet, dringt Hiraṇyākṣa in Rasātala ein und findet dort den Eber Varāha, wie er die Erde emporhebt; er verhöhnt und bedroht ihn als bloßes Waldtier und fordert die Herausgabe der Erde, doch Varāha begegnet dem Spott gelassen mit eigenem, überlegenem Hohn, woraufhin der Dämon in maßlosen Zorn gerät."}, {"term": "Der Keulenkampf zwischen Varāha und Hiraṇyākṣa (Bhāgavata 3.18.14-21)", "category": "Konzept", "definition": "Nachdem Varāha die Erde sicher oberhalb der Wasser plaziert hat, entbrennt ein gewaltiger, wechselseitiger Keulenkampf zwischen ihm und Hiraṇyākṣa, in dessen Verlauf beide von Wunden und wachsendem Zorn gezeichnet werden; Brahmā kommt mit den Weisen herbei, um dem Ringen der beiden verfeindeten, kosmisch bedeutsamen Gestalten zuzusehen."}, {"term": "Brahmās Bitte um Hiraṇyākṣas Vernichtung (Bhāgavata 3.18.22-28)", "category": "Konzept", "definition": "Brahmā beschreibt dem Herrn Hiraṇyākṣa als von ihm selbst gesegneten, unbezwingbaren Übeltäter, der Brahmanen, Kühe und schutzlose Wesen bedroht, und drängt ihn eindringlich, den Dämon nicht wie im Kinderspiel zu behandeln, sondern ihn - solange die günstige Abhijit-Stunde noch währt - sogleich mit seiner eigenen Māyā zu vernichten und den Welten Frieden zu bringen."}, {"term": "Der Keulen- und Speerkampf zwischen Varāha und Hiraṇyākṣa (Bhāgavata 3.19.1-16)", "category": "Konzept", "definition": "Im Fortgang des Kampfes verliert Hiraṇyākṣa zunächst seine Keule an Varāha, der sie ihm jedoch sportlich zurückgibt; der Dämon greift daraufhin zum dreizackigen Speer, den Hari mit seiner Sudarśana-Scheibe zerschneidet, woraufhin Hiraṇyākṣa dem Herrn einen harten Faustschlag versetzt, der diesen jedoch nicht im Geringsten erschüttert."}, {"term": "Hiraṇyākṣas dämonische Illusionen und sein Tod (Bhāgavata 3.19.17-30)", "category": "Konzept", "definition": "Hiraṇyākṣa entfesselt eine gewaltige, apokalyptische Māyā voller Stürme, Blutregen und dämonischer Erscheinungen, die Hari mit der Sudarśana-Waffe zerstört; während in Diti fern ein böses Vorzeichen aufsteigt, tötet der Erhabene den Dämon schließlich mit einem einzigen, beiläufigen Schlag hinter dem Ohr, worauf Brahmā und die Weisen ihn preisen und die zeitweilige Erlösung der beiden verfluchten Torhüter (Jaya und Vijaya) bestätigt wird."}, {"term": "Sūtas Schlusslob der Varāha-Erzählung (Bhāgavata 3.19.31-38)", "category": "Konzept", "definition": "Nach Abschluss der Varāha-Hiraṇyākṣa-Erzählung durch Maitreya berichtet Sūta von Viduras höchster Freude über das Gehörte; es folgt ein Lobpreis auf die reinigende, verdienstbringende Kraft des Hörens von Hiraṇyākṣas Tötung - mit einer vorausdeutenden Erwähnung der späteren Rettung des Elefantenfürsten Gajendra - als Quelle von Segen, Tapferkeit und letzter Zuflucht bei Nārāyaṇa."}, {"term": "Vom Mahat zum goldenen Weltenei (Bhāgavata 3.20.1-17)", "category": "Konzept", "definition": "Nach einem kurzen Rücksprung in den äußeren Rahmen (Śaunaka fragt Sūta nach Viduras Bericht) schildert Maitreya, wie aus der Erregung der drei Erscheinungsweisen des Erhabenen das Mahat-Prinzip, daraus der Ahaṅkāra und die fünf Elemente entstehen, die sich zum goldenen Weltenei vereinigen, in dem der Herr über tausend Jahre ruht, bevor aus seinem Nabel der Lotos mit Brahmā hervorgeht."}, {"term": "Brahmās Schatten-Schöpfungen: Nacht, Yakṣas, Asuras (Bhāgavata 3.20.18-28)", "category": "Konzept", "definition": "Brahmā erschafft zunächst aus seinem Schatten die fünffache Unwissenheit und einen finsteren Leib, den die hungrigen Yakṣas und Rākṣasas als Nacht ergreifen und ihn selbst zu verschlingen drohen; aus seinem Antlitz entstehen die Götter mitsamt dem Tag, aus seinem Hinterteil die begehrlichen Asuras, vor deren schamlosem Ansinnen er fliehen und bei Hari um einen rettenden Rat nachsuchen muss."}, {"term": "Die Abenddämmerung als Frauengestalt und weitere Wesensschöpfungen (Bhāgavata 3.20.29-53)", "category": "Konzept", "definition": "Auf Haris Rat legt Brahmā seinen Schattenleib als verführerische Frauengestalt (die personifizierte Sandhyā) ab, welche die Asuras in betörte Verwirrung stürzt; danach erschafft Brahmā aus verschiedenen weiteren, jeweils abgelegten Körpern Gandharvas/Apsaras, Bhūta-Piśācas samt Schlaf und Wahnsinn, Sādhyas/Pitṛs, Siddhas/Vidyādharas, Kinnaras/Kimpuruṣas sowie die Schlangen aus seinem ausgefallenen Haar, bevor er schließlich durch reine geistige Schöpfung die Manus und, in tiefer Versenkung, die großen Weisen hervorbringt, denen er je einen Anteil seines eigenen Wesens verleiht."}, {"term": "Kardamas Askese und Vision des Herrn (Bhāgavata 3.21.1-21)", "category": "Konzept", "definition": "Auf Viduras Bitte hin schildert Maitreya, wie der Weise Kardama zehntausend Jahre strengste Askese im Fluss Bindusaras übte, bis ihm Viṣṇu in seiner überirdisch schönen, vierarmigen Gestalt erschien; Kardama besingt den Herrn in einer ausführlichen Hymne, die unter anderem das Bild vom Rad der Zeit (kāla-cakra) mit seinen Speichen, Naben und Felgen entfaltet, und bittet um eine tugendhafte Gattin, um dem Wunsch der Ahnen nach Nachkommenschaft zu entsprechen."}, {"term": "Die Verheißung Devahūtis und der Ankündigung Kapilas (Bhāgavata 3.21.22-39)", "category": "Konzept", "definition": "Der Herr verheißt Kardama, dass König Manu mit seiner Gattin Śatarūpā bald eintreffen und ihm seine Tochter Devahūti zur Frau geben werde; aus dieser Verbindung werde der Herr selbst als sein eigener Sohn - der spätere Kapila - geboren, um der Menschheit die Lehre der Sāṅkhya-Philosophie (tattva-saṃhitā) zu verkünden. Nach diesen Worten verschwindet die Erscheinung, und der See, an dem sie erfolgte, wird fortan Bindusaras (\"See der [Tränen-]Tropfen\") genannt."}, {"term": "Die Einsiedelei am Bindusaras und Manus Ankunft (Bhāgavata 3.21.40-56)", "category": "Konzept", "definition": "Es folgt eine ausführliche Schilderung der paradiesisch-schönen Einsiedelei Kardamas am Bindusaras mit ihren Bäumen, Vögeln und Wasserläufen; König Manu trifft dort mit Śatarūpā und Devahūti ein, wird von Kardama ehrenvoll empfangen und preist ihn in einer Hymne als Verkörperung von Hari selbst und Beschützer der Ordnung, bevor er nach dem Grund seines Kommens fragt."}, {"term": "Manus Bitte und Kardamas Zusage (Bhāgavata 3.22.1-25)", "category": "Konzept", "definition": "Nachdem Kardama Manu in einer Hymne gepriesen hat, bittet ihn Manu, seine Tochter Devahūti, die Schwester Priyavratas und Uttānapādas, zur Frau zu nehmen, da sie sich aufgrund von Nāradas Bericht bereits fest für ihn entschieden habe; Kardama willigt in die erste, brāhma genannte Eheform ein, und Manu übergibt unter Tränen der Trennung seine geliebte Tochter."}, {"term": "Die Hochzeit und die Heimkehr Manus (Bhāgavata 3.22.26-32)", "category": "Konzept", "definition": "Nach der Hochzeit kehrt Manu mit seiner Gattin entlang der Ufer der Sarasvatī in seine Hauptstadt Barhiṣmatī zurück, deren Name auf die beim Schütteln des Eberavatars abgeworfenen Haare zurückgeht, aus denen Kuśa- und Kāśa-Gras entstanden; dort verehrt er mithilfe dieser Gräser die Opferverkörperung des Herrn."}, {"term": "Manus vorbildliche Herrschaft (Bhāgavata 3.22.33-39)", "category": "Konzept", "definition": "Maitreya schildert, wie Manu einundsiebzig Zeitalter (Yugas) lang, stets den Erzählungen von Hari lauschend und durch seine Verbindung mit Vāsudeva unerschüttert von Sinnesgenüssen, gerecht über die Menschen nach Kasten und Lebensstufen herrschte, bevor Maitreya zur Erzählung von Manus Nachkommenschaft überleitet."}, {"term": "Kardamas Yoga-Flugwagen und die Verwandlung Devahūtis (Bhāgavata 3.23.1-37)", "category": "Konzept", "definition": "Nach hundert Jahren hingebungsvollen Dienstes gewährt Kardama seiner erschöpften Gattin Devahūti Erfüllung und erschafft durch Yoga einen prachtvollen, wunscherfüllenden Flugwagen; in einem heiligen See badend, verwandelt sie sich, bedient von tausend Vidyādharī-Frauen, in eine strahlende Schönheit und besteigt mit Kardama den Wagen."}, {"term": "Die kosmische Reise und einhundert Jahre der Vereinigung (Bhāgavata 3.23.38-48)", "category": "Konzept", "definition": "Auf dem Flugwagen durchstreift das Paar paradiesische Gärten und Berge, wobei Kardama Devahūti auch die Kugel der Erde zeigt; nach der Rückkehr in die Einsiedelei teilt sich Kardama neunfach und zeugt mit Devahūti neun Töchter von schönster Gestalt, während hundert Jahre wie ein Augenblick vergehen."}, {"term": "Devahūtis Klage vor Kardamas Weggang (Bhāgavata 3.23.49-57)", "category": "Konzept", "definition": "Als Devahūti erkennt, dass Kardama zur Entsagung aufbrechen will, bittet sie ihn trotz äußerer Fassung unter innerem Schmerz um Furchtlosigkeit und um Gatten für ihre Töchter; sie reflektiert, wie sinnliche Anhaftung an einen Heiligen paradoxerweise zur Befreiung führen kann, und beklagt, durch Māyā getäuscht die Gelegenheit zur sofortigen Erlösung nicht ergriffen zu haben."}, {"term": "Die Geburt Kapilas und Brahmās Besuch (Bhāgavata 3.24.1-19)", "category": "Konzept", "definition": "Kardama tröstet die verzweifelte Devahūti mit der Ankündigung der Geburt des Herrn als ihr Sohn; der Erhabene wird als Kapila geboren, woraufhin Brahmā mit den Weisen zur Einsiedelei kommt, Kardama für seinen Gehorsam lobt und ihn anweist, seine neun Töchter an die großen Weisen zu verheiraten und sich dann Kapila, dem Begründer der Sāṅkhya-Lehre, zu widmen."}, {"term": "Die Verheiratung der neun Töchter Kardamas (Bhāgavata 3.24.20-25)", "category": "Konzept", "definition": "Nach Brahmās Rückkehr in seine Sphäre übergibt Kardama seine neun Töchter den großen Weisen Marīci, Atri, Aṅgiras, Pulastya, Pulaha, Kratu, Bhṛgu, Vasiṣṭha und Atharvan zur Ehe, wodurch die Linien der Ṛṣis begründet werden."}, {"term": "Kardamas Lobpreis, Kapilas Belehrung und der Aufbruch in den Wald (Bhāgavata 3.24.26-47)", "category": "Konzept", "definition": "Kardama preist Kapila in einer Hymne und bittet um Erlaubnis zur Entsagung; Kapila erklärt den Zweck seiner Geburt als Wiederbelebung des verlorenen Pfades zur Selbsterkenntnis, verspricht Devahūti dieselbe Belehrung und entlässt Kardama, der daraufhin schweigend, besitzlos und in völliger Gleichmut wandernd die höchste Gottverwirklichung erlangt."}, {"term": "Devahūtis Bitte um Belehrung (Bhāgavata 3.25.1-30)", "category": "Konzept", "definition": "Nach Kardamas Weggang bittet Devahūti ihren Sohn Kapila, der am Bindusaras verweilt, um Befreiung von Verwirrung und Ich-Bezogenheit; Kapila erklärt den auf das Selbst bezogenen Yoga als Weg zum höchsten Heil, woraufhin Devahūti um eine genaue Beschreibung des Hingabe-Yoga bittet."}, {"term": "Kapilas Lehre vom Hingabe-Yoga als höchstem Pfad (Bhāgavata 3.25.31-33)", "category": "Konzept", "definition": "Kapila beginnt seine Sāṅkhya-Lehre mit der zentralen Aussage, dass die ursachenlose Hingabe (bhakti) an den Erhabenen, als naturgemäße Tätigkeit des allein auf Sattva gerichteten Geistes, jeder anderen Vollkommenheit überlegen ist und die subtile Hülle der Unwissenheit rasch verzehrt wie Feuer das Verschlungene."}, {"term": "Die Gemeinschaft der Heiligen und Kapilas Segensverheißung (Bhāgavata 3.25.20-44)", "category": "Konzept", "definition": "Kapila preist die Gemeinschaft mit den Tugendhaften als Tür zur Befreiung und beschreibt Stufen wachsender Hingabe von Vertrauen bis zur Verschmelzung mit dem Erhabenen; abschließend erklärt er, dass alle Furcht nur bei ihm selbst weicht und dass ein fest auf ihn gerichteter, durch intensiven Bhakti-Yoga geläuterter Geist das höchste Heil der Menschen ist."}, {"term": "Die Rahmenerzählung: Nāradas Begegnung mit den Kumāras an der Gaṅgā (Nārada-Purāṇa 1.1-20)", "category": "Konzept", "definition": "Die Weisen fragen Sūta, wie Sanatkumāra dem Nārada alle Dharmas lehrte; vorgestellt werden die vier geistgeborenen Söhne Brahmās, Sanaka, Sanandana, Sanatkumāra und Sanātana. Auf dem Weg zur Versammlung Brahmās treffen sie an der aus Viṣṇus Fuß entsprungenen Gaṅgā auf Nārada, der sie nach dem Baden nach den Wesenszügen des Erhabenen befragt."}, {"term": "Nāradas Viṣṇu-Stotra mit den Avatāra-Preisungen (Nārada-Purāṇa 1.21-55)", "category": "Konzept", "definition": "Ein umfangreicher Lobpreis, in dem Nārada Viṣṇu zunächst in seinen abstrakten, alle Gegensätze (mit/ohne Eigenschaften, groß/klein) übersteigenden Aspekten anruft und ihn sodann in der Reihe seiner Herabkünfte preist: Kūrma, Varāha, Narasiṃha, Vāmana, Paraśurāma, Rāma, Kṛṣṇa und die endzeitliche Gestalt, die den Dharma zu Beginn eines neuen Kṛtayuga wieder aufrichtet."}, {"term": "Quellenlage des Nārada-Purāṇa-Digitalisats (GRETIL/Sansknet)", "category": "Hinweis", "definition": "Das für dieses Projekt verwendete gemeinfreie Digitalisat (GRETIL, eingegeben vom Sansknet-Projekt) beginnt seine Kapitelzählung erst bei Adhyāya 2; ein eigenständiges Adhyāya 1 ist darin nicht enthalten. Der Text ist laut Quellenvermerk unvollständig wortgrenzenmarkiert und noch korrekturbedürftig, weshalb in diesem ersten Kapitel überdurchschnittlich viele [?]-Markierungen bei unsicheren Lesungen gesetzt wurden."}], "divisions": [{"key": "brahma", "name": "Brahma-Purāṇa", "desc": "Nach der hier verwendeten Zählung das erste der 18 Werke; enthält u.a. Schöpfungserzählungen, ausführliche Abschnitte zur Sonne und zum Jagannātha-Kult von Puri.", "chapters": [], "chaptersFile": "data/brahma.json"}, {"key": "padma", "name": "Padma-Purāṇa", "desc": "Umfangreiches, Viṣṇu-zentriertes Werk in mehreren Khaṇḍas (Büchern): Schöpfung, Erdbeschreibung, Paradies, Patāla (Unterwelt) und ein später hinzugekommenes Uttara-Khaṇḍa.", "chapters": []}, {"key": "vishnu", "name": "Viṣṇu-Purāṇa", "desc": "Gilt als besonders klassisch strukturiertes Purāṇa; ausführliche Genealogien der Sonnen- und Monddynastien, Kṛṣṇa-Erzählung.", "chapters": []}, {"key": "vayu", "name": "Vāyu-Purāṇa", "desc": "Eines der ältesten der 18 Werke, Śiva-zentriert, mit sehr detaillierter Kosmographie und Genealogie; in manchen Listen durch das Śiva-Purāṇa ersetzt oder ergänzt.", "chapters": []}, {"key": "bhagavata", "name": "Bhāgavata-Purāṇa", "desc": "Literarisch bedeutendstes und einflussreichstes der 18 Werke, zwölf Skandhas, mit dem berühmten Kṛṣṇa-Leben in Skandha 10.", "chapters": [], "chaptersFile": "data/bhagavata.json"}, {"key": "narada", "name": "Nārada-Purāṇa (Nāradīya)", "desc": "Ritual- und Mantra-Kompendium mit deutlichem Pañcarātra-Einfluss.", "chapters": [], "chaptersFile": "data/narada.json"}, {"key": "markandeya", "name": "Mārkaṇḍeya-Purāṇa", "desc": "Enthält die berühmte, oft eigenständig verehrte Devī-Māhātmya zum Lob der Göttin (Durgā).", "chapters": []}, {"key": "agni", "name": "Agni-Purāṇa", "desc": "Enzyklopädisch angelegt: Ritual, Staatskunst, Medizin (Āyurveda), Dichtkunst, Grammatik und vieles mehr.", "chapters": [], "chaptersFile": "data/agni.json", "intro": "Das Agni-Purāṇa gibt sich als Belehrung des Feuergottes Agni an den Weisen Vasiṣṭha und ist das enzyklopädischste der 18 Werke: Avatāra-Erzählungen (darunter Kurzfassungen von Rāmāyaṇa, Harivaṃśa und Mahābhārata), Schöpfung, Tempelbau und Bildnislehre, Weihe- und Maṇḍala-Rituale, Pilgerstätten, Kosmographie, Astrologie, Gelübde (vrata), Staatskunst und Kriegswesen, Rechtslehre, Medizin, Metrik, Poetik, Grammatik und Lexikographie. Textgrundlage ist das GRETIL-Digitalisat (Eingabe Jun Takashima) der Ausgabe von Rajendralal Mitra (Bibliotheca Indica, Kalkutta 1870–79): 382 Adhyāyas (Adhyāya 221 ist in dieser Ausgabe doppelt gezählt, hier 221a/221b) sowie ein sechs Kapitel umfassender Anhang (A1–A6). Die Digitalisierung enthält zahlreiche Druck- und Erfassungsfehler; solche Stellen sind in den Anmerkungen vermerkt, die plausibelste Lesart ist übersetzt und mit [?] gekennzeichnet. Stand: übersetzt bis Adhyāya A6 (389 Kapitel, 11325 Verse)."}, {"key": "bhavishya", "name": "Bhaviṣya-Purāṇa", "desc": "„Das Zukünftige“ – Prophezeiungen und spätere Ergänzungen, u.a. ausführliche Sonnenverehrung.", "chapters": []}, {"key": "brahmavaivarta", "name": "Brahmavaivarta-Purāṇa", "desc": "Kṛṣṇa-Rādhā-zentriertes Werk in vier Teilen.", "chapters": []}, {"key": "linga", "name": "Liṅga-Purāṇa", "desc": "Śiva-zentriert, um die Verehrung des Liṅga (Symbol Śivas) und Kosmogonie.", "chapters": []}, {"key": "varaha", "name": "Varāha-Purāṇa", "desc": "Um Viṣṇus Eber-Avatāra (Varāha) zentriert, mit zahlreichen Tīrtha- (Pilgerstätten-)Beschreibungen.", "chapters": []}, {"key": "skanda", "name": "Skanda-Purāṇa", "desc": "Umfangreichstes der 18 Mahāpurāṇas; eine riesige, lose verbundene Sammlung von Pilgerstätten-Preisungen (māhātmyas).", "chapters": []}, {"key": "vamana", "name": "Vāmana-Purāṇa", "desc": "Um Viṣṇus Zwerg-Avatāra (Vāmana) zentriert, mit zahlreichen Śiva-Pārvatī-Mythen.", "chapters": []}, {"key": "kurma", "name": "Kūrma-Purāṇa", "desc": "Um Viṣṇus Schildkröten-Avatāra (Kūrma) zentriert, enthält u.a. eine eigene „Īśvara-Gītā“.", "chapters": []}, {"key": "matsya", "name": "Matsya-Purāṇa", "desc": "Eines der ältesten und enzyklopädischsten der 18 Werke; um Viṣṇus Fisch-Avatāra (Matsya) und die Sintflut-Erzählung zentriert.", "chapters": []}, {"key": "garuda", "name": "Garuḍa-Purāṇa", "desc": "Berühmt vor allem für seinen ausführlichen Abschnitt über Jenseits und Totenriten (Preta-Kalpa).", "chapters": []}, {"key": "brahmanda", "name": "Brahmāṇḍa-Purāṇa", "desc": "Letztes der 18 Werke; kosmologisch, enthält u.a. das bekannte Adhyātma-Rāmāyaṇa.", "chapters": []}]}</script>
<script>
function loadTheme(){ try{ return localStorage.getItem("mpu-theme")||"system"; }catch(e){ return "system"; } }
function saveTheme(v){ try{ localStorage.setItem("mpu-theme", v); }catch(e){} }
function applyTheme(v){
  var root = document.documentElement;
  if(v === "dark"){ root.setAttribute("data-theme","dark"); }
  else if(v === "light"){ root.setAttribute("data-theme","light"); }
  else { root.removeAttribute("data-theme"); }
}
var currentTheme = loadTheme();
applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", function(){
  var order = ["system","light","dark"];
  var idx = order.indexOf(currentTheme);
  currentTheme = order[(idx+1) % order.length];
  saveTheme(currentTheme);
  applyTheme(currentTheme);
});
document.getElementById("brand-home").addEventListener("click", function(){ go("#/"); });

var BOOK = JSON.parse(document.getElementById("data-book").textContent);

function loadDivisions(){
  var fetches = BOOK.divisions.map(function(d){
    if(!d.chaptersFile) return Promise.resolve();
    return fetch(d.chaptersFile).then(function(r){ return r.json(); }).then(function(chapters){ d.chapters = chapters; });
  });
  return Promise.all(fetches);
}

function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatText(s){
  var e = esc(s);
  e = e.replace(/\[\?\]/g, '<span class="unc-q">[?]</span>');
  e = e.replace(/\[Anm\.:[^\]]*\]/g, function(m){ return '<span class="unc-note">' + m + '</span>'; });
  return e;
}
function go(hash){ location.hash = hash; }
function cssEscape(s){ return s.replace(/["\\]/g, "\\$&"); }

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  if(parts.length === 0) return {view:"front"};
  if(parts[0] === "c" && parts[1] && parts[2] !== undefined){ return {view:"chapter", divKey:parts[1], chNum:(/^\d+$/.test(parts[2])?parseInt(parts[2],10):parts[2])}; }
  if(parts[0] === "glossary") return {view:"glossary"};
  return {view:"front"};
}

function findChapter(divKey, chNum){
  for(var i=0;i<BOOK.divisions.length;i++){
    var d = BOOK.divisions[i];
    if(d.key === divKey){
      for(var j=0;j<d.chapters.length;j++){ if(d.chapters[j].num === chNum) return {division:d, chapter:d.chapters[j]}; }
    }
  }
  return null;
}
function flatChapterList(){
  var out = [];
  BOOK.divisions.forEach(function(d){ d.chapters.forEach(function(c){ out.push({division:d, chapter:c}); }); });
  return out;
}
function adjacentChapter(divKey, chNum, dir){
  var flat = flatChapterList();
  var idx = -1;
  for(var i=0;i<flat.length;i++){ if(flat[i].division.key === divKey && flat[i].chapter.num === chNum){ idx = i; break; } }
  if(idx === -1) return null;
  var nidx = idx + dir;
  if(nidx < 0 || nidx >= flat.length) return null;
  return flat[nidx];
}

function wfwCell(pair){
  var cls = "wfw-cell" + (pair[1] && pair[1].length > 70 ? " wfw-cell-long" : "");
  return '<div class="' + cls + '"><span class="wfw-sa">' + esc(pair[0]) + '</span><span class="wfw-de">' + esc(pair[1]) + '</span></div>';
}
function wfwHtml(u, uid){
  var html = '<button class="wfw-toggle" data-wfw-target="' + uid + '">Wort f\u00fcr Wort &#9656;</button>';
  html += '<div class="wfw-panel" id="' + uid + '" hidden><div class="wfw-grid">';
  u.wfw.forEach(function(pair){ html += wfwCell(pair); });
  html += '</div></div>';
  return html;
}

var viewEl = document.getElementById("view");

function render(){
  var r = parseHash();
  closeMobileSidebar();
  if(r.view === "chapter"){ renderReader(r); }
  else if(r.view === "glossary"){ renderReader(r); }
  else { renderReader({view:"front"}); }
  window.scrollTo(0,0);
}

function tocChapterHtml(divKey, c, opts){
  var active = opts.view === "chapter" && opts.divKey === divKey && opts.chNum === c.num;
  var label = c.title_de || c.title_sa || ("Nr. " + c.num);
  return '<a class="toc-chapter' + (active?' active':'') + '" href="#/c/' + encodeURIComponent(divKey) + '/' + c.num + '"><span class="tn">' + c.num + '</span>' + esc(label) + '</a>';
}

function frontHtml(){
  var html = '';
  html += '<h1 class="front-title">' + esc(BOOK.title) + '</h1>';
  html += '<p class="front-subtitle">' + esc(BOOK.subtitle) + '</p>';
  var firstDiv = BOOK.divisions[0], firstCh = firstDiv.chapters[0];
  if(firstCh){
    html += '<a class="front-cta" href="#/c/' + encodeURIComponent(firstDiv.key) + '/' + firstCh.num + '">Lesen beginnen &rarr;</a>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.vorwort){
    html += '<div class="front-section"><h2>Vorwort</h2>';
    BOOK.frontmatter.vorwort.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.einfuehrung){
    html += '<div class="front-section"><h2>Einf\u00fchrung</h2>';
    BOOK.frontmatter.einfuehrung.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  html += '<div class="front-section"><h2>Die 18 Mah\u0101pur\u0101\u1e47as</h2><div class="front-parva-list">';
  BOOK.divisions.forEach(function(d, i){
    html += '<div class="fpl-item"><div class="fpl-num">' + (i+1) + '</div><div><div class="fpl-name">' + esc(d.name) + '</div><div class="fpl-desc">' + esc(d.desc) + (d.chapters.length ? ' <em>&mdash; \u00fcbersetzt bis Adhy\u0101ya ' + d.chapters[d.chapters.length-1].num + '</em>' : ' <em>&mdash; noch nicht begonnen</em>') + '</div></div></div>';
  });
  html += '</div></div>';
  return html;
}

function glossaryHtml(){
  var html = '<h1 class="front-title" style="font-size:28px">Glossar</h1>';
  html += '<p class="front-subtitle">' + BOOK.glossary.length + ' Begriffe, alphabetisch geordnet.</p>';
  var entries = BOOK.glossary.slice().sort(function(a,b){ return a.term.localeCompare(b.term); });
  var lastLetter = null;
  html += '<div class="glossary-grid">';
  entries.forEach(function(e){
    var letter = e.term.charAt(0).toUpperCase();
    if(letter !== lastLetter){ html += '<div class="gl-letter">' + esc(letter) + '</div>'; lastLetter = letter; }
    html += '<div class="gl-entry"><span class="gl-term">' + esc(e.term) + '</span><span class="gl-cat">' + esc(e.category||'') + '</span>';
    html += '<div class="gl-def">' + esc(e.definition) + '</div></div>';
  });
  html += '</div>';
  return html;
}

function chapterHtml(divKey, chNum){
  var found = findChapter(divKey, chNum);
  if(!found) return '<p class="empty-note">Kapitel nicht gefunden.</p>';
  var d = found.division, c = found.chapter;
  var html = '';
  var isFirstOfDivision = d.chapters[0].num === c.num;
  if(isFirstOfDivision){
    html += '<div class="division-banner"><div class="db-label">Pur\u0101\u1e47a</div>';
    html += '<h2>' + esc(d.name) + '</h2>';
    if(d.intro) html += '<p>' + formatText(d.intro) + '</p>';
    html += '</div>';
  }
  html += '<div class="chapter-head">';
  html += '<span class="chapter-eyebrow">Adhy\u0101ya ' + c.num + ' &middot; ' + esc(d.name) + '</span>';
  if(c.title_sa) html += '<div class="chapter-title-sa">' + esc(c.title_sa) + '</div>';
  html += '<div class="chapter-title-de">' + esc(c.title_de || ('Adhy\u0101ya ' + c.num)) + '</div>';
  html += '</div>';
  if(c.note){ html += '<div class="chapter-note"><span class="cn-label">Einordnung</span>' + formatText(c.note) + '</div>'; }
  c.units.forEach(function(u, uidx){
    html += '<div class="unit">';
    html += '<span class="unit-n">Vers ' + esc(u.n) + '</span>';
    html += '<div class="unit-sa">' + formatText(u.sa) + '</div>';
    html += '<div class="unit-de">' + formatText(u.de) + '</div>';
    if(u.notes) html += '<div class="unit-notes">' + formatText(u.notes) + '</div>';
    if(u.wfw) html += wfwHtml(u, d.key + "-" + c.num + "-" + uidx);
    html += '</div>';
  });
  var prev = adjacentChapter(divKey, chNum, -1);
  var next = adjacentChapter(divKey, chNum, 1);
  html += '<div class="chapter-pager">';
  if(prev){ html += '<a class="pager-btn prev" href="#/c/' + encodeURIComponent(prev.division.key) + '/' + prev.chapter.num + '"><span class="pg-label">&larr; Zur\u00fcck</span><span class="pg-title">' + esc(prev.chapter.title_de || ('Adhy\u0101ya ' + prev.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  if(next){ html += '<a class="pager-btn next" href="#/c/' + encodeURIComponent(next.division.key) + '/' + next.chapter.num + '"><span class="pg-label">Weiter &rarr;</span><span class="pg-title">' + esc(next.chapter.title_de || ('Adhy\u0101ya ' + next.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  html += '</div>';
  return html;
}

function renderReader(opts){
  var openDivKey = opts.view === "chapter" ? opts.divKey : (BOOK.divisions[0] && BOOK.divisions[0].key);
  var html = '<div class="reader">';
  html += '<button class="sidebar-toggle" id="sidebar-toggle-btn">&#9776; Inhaltsverzeichnis</button>';
  html += '<aside class="reader-sidebar" id="reader-sidebar">';
  html += '<a class="reader-back" href="#/">&larr; Vorwort &amp; \u00dcbersicht</a>';
  html += '<div class="sidebar-title">' + esc(BOOK.title) + '</div>';
  html += '<div class="sidebar-sub">18 Mah\u0101pur\u0101\u1e47as &middot; im Aufbau</div>';
  html += '<div class="sidebar-tabs">';
  html += '<button class="sidebar-tab' + (opts.view==="front"?' active':'') + '" data-tab="front">Vorwort</button>';
  html += '<button class="sidebar-tab' + (opts.view==="chapter"?' active':'') + '" data-tab="text">Text</button>';
  html += '<button class="sidebar-tab' + (opts.view==="glossary"?' active':'') + '" data-tab="glossary">Glossar</button>';
  html += '</div>';
  BOOK.divisions.forEach(function(d){
    var isOpen = d.key === openDivKey;
    html += '<div class="toc-division">';
    html += '<div class="toc-division-head' + (isOpen?' open':'') + '" data-div="' + esc(d.key) + '"><span class="car">&#9656;</span>' + esc(d.name) + '</div>';
    html += '<div class="toc-chapters' + (isOpen?' open':'') + '" data-div-body="' + esc(d.key) + '">';
    if(d.chapters.length === 0){ html += '<div class="toc-empty">noch nicht \u00fcbersetzt</div>'; }
    d.chapters.forEach(function(c){ html += tocChapterHtml(d.key, c, opts); });
    html += '</div></div>';
  });
  html += '</aside>';
  html += '<div class="reader-main"><div class="reader-content" id="reader-content">';
  if(opts.view === "front") html += frontHtml();
  else if(opts.view === "glossary") html += glossaryHtml();
  else if(opts.view === "chapter") html += chapterHtml(opts.divKey, opts.chNum);
  html += '</div></div></div>';
  viewEl.innerHTML = html;

  Array.prototype.forEach.call(viewEl.querySelectorAll(".toc-division-head"), function(h){
    h.addEventListener("click", function(){
      h.classList.toggle("open");
      var body = viewEl.querySelector('.toc-chapters[data-div-body="' + cssEscape(h.getAttribute("data-div")) + '"]');
      if(body) body.classList.toggle("open");
    });
  });
  Array.prototype.forEach.call(viewEl.querySelectorAll(".sidebar-tab"), function(t){
    t.addEventListener("click", function(){
      var tab = t.getAttribute("data-tab");
      if(tab === "front") go("#/");
      else if(tab === "glossary") go("#/glossary");
      else {
        var flat = flatChapterList();
        if(flat.length){ go("#/c/" + encodeURIComponent(flat[0].division.key) + "/" + flat[0].chapter.num); }
      }
    });
  });
  var toggleBtn = document.getElementById("sidebar-toggle-btn");
  if(toggleBtn) toggleBtn.addEventListener("click", openMobileSidebar);
  Array.prototype.forEach.call(viewEl.querySelectorAll(".wfw-toggle[data-wfw-target]"), function(btn){
    btn.addEventListener("click", function(){
      var panel = document.getElementById(btn.getAttribute("data-wfw-target"));
      if(!panel) return;
      var open = !panel.hidden;
      panel.hidden = open;
      btn.innerHTML = "Wort f\u00fcr Wort " + (open ? "&#9656;" : "&#9662;");
    });
  });
}

function openMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.add("open"); if(scrim) scrim.classList.add("open");
}
function closeMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.remove("open"); if(scrim) scrim.classList.remove("open");
}
document.getElementById("sidebar-scrim").addEventListener("click", closeMobileSidebar);

viewEl.innerHTML = '<div style="padding:60px 24px;text-align:center;color:var(--ink-faint);font-size:13px;">Lädt…</div>';
loadDivisions().then(function(){
  window.addEventListener("hashchange", render);
  render();
}).catch(function(err){
  viewEl.innerHTML = '<div style="padding:60px 24px;text-align:center;color:var(--ink-faint);font-size:13px;">Fehler beim Laden der Kapiteldaten: ' + esc(String(err)) + '</div>';
});
</script>
