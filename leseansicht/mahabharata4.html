[Anm.: Ābhīras = Hirtenstamm, historisch mit dem Pandschāb-Gebiet verbunden.]",[["tataḥ te pāpakarmāṇaḥ lobhopahatacetasaḥ","da jene übeltätigen, deren Sinn von Gier überwältigt war"],["ābhīrāḥ mantrayām āsuḥ sametya aśubhadarśanāḥ","berieten sich die Ābhīras, versammelt, von unheilvollem Aussehen (3.Pl.Kaus.Perf.+Abs.)"]]],["046","ayam eko 'rjuno yoddhā vṛddhabālaṃ hateśvaram nayaty asmān atikramya yodhāś ceme hataujasaḥ","„Dieser Arjuna allein ist der Kämpfer, der die Alten und Jungen, ihres Herrn beraubt, führt und uns dabei geringschätzig übergeht; und diese Krieger [bei ihm] sind von geschwundener Kraft.“","",[["ayam ekaḥ arjunaḥ yoddhā","dieser Arjuna allein ist der Kämpfer (Nom.)"],["vṛddhabālaṃ hateśvaram nayati asmān atikramya","der die Alten und Jungen, ihres Herrn beraubt, führt und uns übergeht (3.Sg.Präs.+Abs.)"],["yodhāḥ ca ime hataujasaḥ","und diese Krieger sind von geschwundener Kraft"]]],["047","tato yaṣṭipraharaṇā dasyavas te sahasraśaḥ abhyadhāvanta vṛṣṇīnāṃ taṃ janaṃ loptrahāriṇaḥ","Dann stürmten jene mit Knütteln bewaffneten Räuber zu Tausenden, die Plünderer, auf jenes Volk der Vṛṣṇis los.","",[["tataḥ yaṣṭipraharaṇāḥ dasyavaḥ te sahasraśaḥ","dann jene mit Knütteln bewaffneten Räuber, zu Tausenden"],["abhyadhāvanta vṛṣṇīnāṃ taṃ janaṃ loptrahāriṇaḥ","stürmten auf jenes Volk der Vṛṣṇis los, die Plünderer (3.Pl.Impf.)"]]],["048","mahatā siṃhanādena drāvayantaḥ pṛthagjanam abhipetur dhanārthaṃ te kālaparyāyacoditāḥ","Mit gewaltigem Löwengebrüll das gemeine Volk in die Flucht schlagend, fielen sie um des Reichtums willen an, von der Wendung des Schicksals getrieben.","",[["mahatā siṃhanādena drāvayantaḥ pṛthagjanam","mit gewaltigem Löwengebrüll das gemeine Volk in die Flucht schlagend (Instr.+Part.)"],["abhipetuḥ dhanārthaṃ te","fielen sie an, um des Reichtums willen (3.Pl.Perf.)"],["kālaparyāyacoditāḥ","von der Wendung des Schicksals getrieben"]]],["049","tato nivṛttaḥ kaunteyaḥ sahasā sapadānugaḥ uvāca tān mahābāhur arjunaḥ prahasann iva","Da wandte sich der Sohn der Kuntī plötzlich um, mit seinen Gefolgsleuten dicht hinter sich, und der starkarmige Arjuna sprach zu ihnen, wie lächelnd:","",[["tataḥ nivṛttaḥ kaunteyaḥ sahasā sapadānugaḥ","da wandte sich der Sohn der Kuntī plötzlich um, mit seinen Gefolgsleuten dicht hinter sich (Nom.Part.)"],["uvāca tān mahābāhuḥ arjunaḥ prahasan iva","sprach zu ihnen der starkarmige Arjuna, wie lächelnd (3.Sg.Perf.+Part.)"]]],["050","nivartadhvam adharmajñā yadi stha na mumūrṣavaḥ nedānīṃ śaranirbhinnāḥ śocadhvaṃ nihatā mayā","„Kehrt um, ihr Unwissenden des Rechts, wenn ihr nicht sterben wollt; klagt jetzt nicht, von Pfeilen durchbohrt, von mir erschlagen!“","",[["nivartadhvam adharmajñāḥ","kehrt um, ihr Unwissenden des Rechts (Imp.Pl.)"],["yadi stha na mumūrṣavaḥ","wenn ihr nicht sterben wollt"],["na idānīṃ śaranirbhinnāḥ śocadhvaṃ nihatāḥ mayā","klagt jetzt nicht, von Pfeilen durchbohrt, von mir erschlagen (Imp.Pl.)"]]],["051","tathoktās tena vīreṇa kadarthīkṛtya tad vacaḥ abhipetur janaṃ mūḍhā vāryamāṇāḥ punaḥ punaḥ","So von dem Helden angesprochen, sein Wort aber verachtend, fielen die Törichten über das Volk her, obwohl sie immer wieder zurückgehalten wurden.","",[["tathā uktāḥ tena vīreṇa","so von dem Helden angesprochen"],["kadarthīkṛtya tad vacaḥ","sein Wort verachtend (Abs.)"],["abhipetuḥ janaṃ mūḍhāḥ vāryamāṇāḥ punaḥ punaḥ","fielen die Törichten über das Volk her, obwohl immer wieder zurückgehalten (3.Pl.Perf.+Nom.Part.)"]]],["052","tato 'rjuno dhanur divyaṃ gāṇḍīvam ajaraṃ mahat āropayitum ārebhe yatnād iva kathaṃ cana","Da begann Arjuna, den göttlichen, alterslosen, großen Bogen Gāṇḍīva aufzuspannen - mit Mühe, wie nur irgendwie.","",[["tataḥ arjunaḥ dhanuḥ divyaṃ gāṇḍīvam ajaraṃ mahat","da Arjuna den göttlichen, alterslosen, großen Bogen Gāṇḍīva"],["āropayitum ārebhe yatnāt iva kathaṃ cana","begann aufzuspannen, mit Mühe, wie nur irgendwie (Inf.+3.Sg.Perf.)"]]],["053","cakāra sajyaṃ kṛcchreṇa saṃbhrame tumule sati cintayām āsa cāstrāṇi na ca sasmāra tāny api","Mit Mühe spannte er ihn, inmitten des tumultartigen Durcheinanders, und er versuchte, sich an seine Waffensprüche zu erinnern - doch er konnte sich nicht an sie erinnern.","",[["cakāra sajyaṃ kṛcchreṇa","spannte er ihn mit Mühe (3.Sg.Perf.)"],["saṃbhrame tumule sati","inmitten des tumultartigen Durcheinanders (Lok.Abs.)"],["cintayām āsa ca astrāṇi","und er versuchte, an die [Waffensprüche] zu denken (3.Sg.Kaus.Perf.)"],["na ca sasmāra tāni api","doch er erinnerte sich nicht an sie (3.Sg.Perf.)"]]],["054","vaikṛtyaṃ tan mahad dṛṣṭvā bhujavīrye tathā yudhi divyānāṃ ca mahāstrāṇāṃ vināśād vrīḍito 'bhavat","Als er diese große Beeinträchtigung sah, sowohl in der Kraft seiner Arme als auch im Kampf, und durch den Verlust der göttlichen großen Waffen, wurde er beschämt.","",[["vaikṛtyaṃ tat mahat dṛṣṭvā","diese große Beeinträchtigung gesehen habend (Abs.)"],["bhujavīrye tathā yudhi","in der Kraft der Arme, ebenso im Kampf (Lok.)"],["divyānāṃ ca mahāstrāṇāṃ vināśāt vrīḍitaḥ abhavat","und durch den Verlust der göttlichen großen Waffen wurde er beschämt (Abl.+3.Sg.Impf.)"]]],["055","vṛṣṇiyodhāś ca te sarve gajāśvarathayāyinaḥ na śekur āvartayituṃ hriyamāṇaṃ ca taṃ janam","Und jene Vṛṣṇi-Krieger alle, auf Elefanten, Pferden und Wagen fahrend, vermochten nicht, jenes fortgeschleppte Volk zurückzuwenden.","",[["vṛṣṇiyodhāḥ ca te sarve gajāśvarathayāyinaḥ","und jene Vṛṣṇi-Krieger alle, auf Elefanten, Pferden und Wagen fahrend"],["na śekuḥ āvartayituṃ","vermochten nicht zurückzuwenden (3.Pl.Impf.+Inf.)"],["hriyamāṇaṃ ca taṃ janam","jenes fortgeschleppte Volk"]]],["056","kalatrasya bahutvāt tu saṃpatatsu tatas tataḥ prayatnam akarot pārtho janasya parirakṣaṇe","Wegen der großen Zahl der Frauen aber, während sie hier und dort angegriffen wurden, unternahm der Pārtha [alle] Anstrengung, das Volk zu schützen.","",[["kalatrasya bahutvāt tu","wegen der großen Zahl der Frauen aber"],["saṃpatatsu tataḥ tataḥ","während sie hier und dort angegriffen wurden (Lok.Abs.)"],["prayatnam akarot pārthaḥ janasya parirakṣaṇe","unternahm der Pārtha Anstrengung, das Volk zu schützen (3.Sg.Impf.)"]]],["057","miṣatāṃ sarvayodhānāṃ tatas tāḥ pramadottamāḥ samantato 'vakṛṣyanta kāmāc cānyāḥ pravavrajuḥ","Vor den Augen aller Krieger wurden jene vortrefflichen Frauen da von allen Seiten fortgeschleppt, während andere aus eigenem Willen fortgingen.","",[["miṣatāṃ sarvayodhānāṃ","vor den Augen aller Krieger (Gen.Abs.)"],["tataḥ tāḥ pramadottamāḥ samantataḥ avakṛṣyanta","da wurden jene vortrefflichen Frauen von allen Seiten fortgeschleppt (3.Pl.Impf.Pass.)"],["kāmāt ca anyāḥ pravavrajuḥ","aus eigenem Willen gingen andere fort (3.Pl.Perf.)"]]],["058","tato gāṇḍīvanirmuktaiḥ śaraiḥ pārtho dhanaṃjayaḥ jaghāna dasyūn sodvego vṛṣṇibhṛtyaiḥ saha prabhuḥ","Da erschlug der Pārtha Dhanaṃjaya, der Herr, beunruhigt, zusammen mit den Diener der Vṛṣṇis, die Räuber mit von Gāṇḍīva entsandten Pfeilen.","",[["tataḥ gāṇḍīvanirmuktaiḥ śaraiḥ","da mit von Gāṇḍīva entsandten Pfeilen"],["pārthaḥ dhanaṃjayaḥ jaghāna dasyūn","erschlug der Pārtha Dhanaṃjaya die Räuber (3.Sg.Perf.)"],["sodvegaḥ vṛṣṇibhṛtyaiḥ saha prabhuḥ","beunruhigt, zusammen mit den Dienern der Vṛṣṇis, der Herr"]]],["059","kṣaṇena tasya te rājan kṣayaṃ jagmur ajihmagāḥ akṣayā hi purā bhūtvā kṣīṇāḥ kṣatajabhojanāḥ","In einem Augenblick, o König, gingen seine geradefliegenden Pfeile zur Neige - sie, die einst unerschöpflich gewesen waren, deren Nahrung Blut war, waren nun aufgebraucht.","",[["kṣaṇena tasya te rājan kṣayaṃ jagmuḥ ajihmagāḥ","in einem Augenblick gingen seine geradefliegenden [Pfeile] zur Neige, o König (3.Pl.Perf.)"],["akṣayāḥ hi purā bhūtvā","die einst unerschöpflich gewesen waren (Abs.)"],["kṣīṇāḥ kṣatajabhojanāḥ","waren nun aufgebraucht, deren Nahrung Blut war"]]],["060","sa śarakṣayam āsādya duḥkhaśokasamāhataḥ dhanuṣkoṭyā tadā dasyūn avadhīt pākaśāsaniḥ","Als er die Erschöpfung seiner Pfeile erreicht hatte, von Schmerz und Kummer getroffen, erschlug der Sohn des Pākaśāsana [Indra, Arjuna] die Räuber damals mit der Spitze seines Bogens.","[Anm.: Pākaśāsani = Sohn des Pākaśāsana (Beiname Indras), d.h. Arjuna.]",[["saḥ śarakṣayam āsādya duḥkhaśokasamāhataḥ","er, die Erschöpfung der Pfeile erreicht habend, von Schmerz und Kummer getroffen (Abs.+Nom.Part.)"],["dhanuṣkoṭyā tadā dasyūn avadhīt pākaśāsaniḥ","erschlug der Sohn des Pākaśāsana die Räuber damals mit der Spitze des Bogens (Instr.+3.Sg.Impf.)"]]],["061","prekṣatas tv eva pārthasya vṛṣṇyandhakavarastriyaḥ jagmur ādāya te mlecchāḥ samantāj janamejaya","Doch während der Pārtha selbst zusah, nahmen jene Mlecchas die besten Frauen der Vṛṣṇis und Andhakas und zogen von allen Seiten fort, o Janamejaya.","",[["prekṣataḥ tu eva pārthasya","doch während der Pārtha selbst zusah (Gen.Abs.)"],["vṛṣṇyandhakavarastriyaḥ jagmuḥ ādāya te mlecchāḥ","nahmen jene Mlecchas die besten Frauen der Vṛṣṇis und Andhakas und zogen fort (3.Pl.Impf.+Abs.)"],["samantāt janamejaya","von allen Seiten, o Janamejaya"]]],["062","dhanaṃjayas tu daivaṃ tan manasācintayat prabhuḥ duḥkhaśokasamāviṣṭo niḥśvāsaparamo 'bhavat","Dhanaṃjaya aber, der Herr, erwog jenes Schicksal in seinem Sinn; von Schmerz und Kummer erfüllt, wurde er ganz dem Seufzen hingegeben.","",[["dhanaṃjayaḥ tu daivaṃ tat manasā acintayat prabhuḥ","Dhanaṃjaya aber, der Herr, erwog jenes Schicksal in seinem Sinn (3.Sg.Impf.)"],["duḥkhaśokasamāviṣṭaḥ niḥśvāsaparamaḥ abhavat","von Schmerz und Kummer erfüllt, wurde er ganz dem Seufzen hingegeben (3.Sg.Impf.)"]]],["063","astrāṇāṃ ca praṇāśena bāhuvīryasya saṃkṣayāt dhanuṣaś cāvidheyatvāc charāṇāṃ saṃkṣayeṇa ca","Durch den Verlust der Waffensprüche, durch den Schwund der Armeskraft, durch die Unlenkbarkeit des Bogens und durch die Erschöpfung der Pfeile,","",[["astrāṇāṃ ca praṇāśena","und durch den Verlust der [Waffensprüche] (Instr.)"],["bāhuvīryasya saṃkṣayāt","durch den Schwund der Armeskraft (Abl.)"],["dhanuṣaḥ ca avidheyatvāt śarāṇāṃ saṃkṣayeṇa ca","und durch die Unlenkbarkeit des Bogens und durch die Erschöpfung der Pfeile (Abl.+Instr.)"]]],["064","babhūva vimanāḥ pārtho daivam ity anucintayan nyavartata tato rājan nedam astīti cābravīt","wurde der Pārtha bestürzt, dachte, dies sei Schicksal, und kehrte um, o König, und sprach: „Dies ist es nicht mehr!“","[Anm.: Echo der Wendung aus Kap.6 V003, dort Ausdruck des Unglaubens an die Nachricht - hier Ausdruck darüber, dass seine frühere Kraft geschwunden ist.]",[["babhūva vimanāḥ pārthaḥ","wurde bestürzt der Pārtha (3.Sg.Perf.)"],["daivam iti anucintayan","dies sei Schicksal denkend (Part.)"],["nyavartata tataḥ rājan","kehrte da um, o König (3.Sg.Impf.Med.)"],["na idam asti iti ca abravīt","und sprach: dies ist nicht [mehr das, was es war] (direkte Rede)"]]],["065","tataḥ sa śeṣam ādāya kalatrasya mahāmatiḥ hṛtabhūyiṣṭharatnasya kurukṣetram avātarat","Dann nahm der Großgesinnte den Rest der Frauen, größtenteils ihrer Juwelen beraubt, und stieg nach Kurukṣetra hinab.","",[["tataḥ saḥ śeṣam ādāya kalatrasya mahāmatiḥ","dann nahm der Großgesinnte den Rest der Frauen (Abs.+Nom.)"],["hṛtabhūyiṣṭharatnasya","größtenteils ihrer Juwelen beraubt"],["kurukṣetram avātarat","stieg nach Kurukṣetra hinab (3.Sg.Impf.)"]]],["066","evaṃ kalatram ānīya vṛṣṇīnāṃ hṛtaśeṣitam nyaveśayata kauravyas tatra tatra dhanaṃjayaḥ","So brachte der Kauravya Dhanaṃjaya die verbliebenen, beraubten Frauen der Vṛṣṇis dorthin und siedelte sie hier und dort an.","",[["evaṃ kalatram ānīya vṛṣṇīnāṃ hṛtaśeṣitam","so die verbliebenen, beraubten Frauen der Vṛṣṇis gebracht habend (Abs.)"],["nyaveśayata kauravyaḥ tatra tatra dhanaṃjayaḥ","siedelte der Kauravya Dhanaṃjaya sie hier und dort an (3.Sg.Kaus.Impf.)"]]],["067","hārdikyatanayaṃ pārtho nagaraṃ mārtikāvatam bhojarājakalatraṃ ca hṛtaśeṣaṃ narottamaḥ","Der Pārtha, der Beste der Männer, [siedelte] den Sohn des Hārdikya in der Stadt Mārtikāvata an, und die verbliebenen, beraubten Frauen des Bhoja-Königs.","[Anm.: Fortsetzung des Satzes in V068.]",[["hārdikyatanayaṃ pārthaḥ nagaraṃ mārtikāvatam","den Sohn des Hārdikya, der Pārtha, in der Stadt Mārtikāvata (Akk.)"],["bhojarājakalatraṃ ca hṛtaśeṣaṃ narottamaḥ","und die verbliebenen, beraubten Frauen des Bhoja-Königs, der Beste der Männer"]]],["068","tato vṛddhāṃś ca bālāṃś ca striyaś cādāya pāṇḍavaḥ vīrair vihīnān sarvāṃs tāñ śakraprasthe nyaveśayat","Dann nahm der Pāṇḍava die Alten, die Jungen und die Frauen, alle, ihrer Helden beraubt, und siedelte sie in Śakraprastha an.","",[["tataḥ vṛddhān ca bālān ca striyaḥ ca ādāya pāṇḍavaḥ","dann die Alten, die Jungen und die Frauen genommen habend, der Pāṇḍava (Abs.)"],["vīraiḥ vihīnān sarvān tān śakraprasthe nyaveśayat","siedelte sie, alle, ihrer Helden beraubt, in Śakraprastha an (3.Sg.Kaus.Impf.)"]]],["069","yauyudhāniṃ sarasvatyāṃ putraṃ sātyakinaḥ priyam nyaveśayata dharmātmā vṛddhabālapuraskṛtam","Den Sohn des Sātyaki, Yauyudhāni, ihm lieb, siedelte der Rechtschaffene an der Sarasvatī an, wobei er die Alten und Jungen voranstellte.","",[["yauyudhāniṃ sarasvatyāṃ putraṃ sātyakinaḥ priyam","den Sohn des Sātyaki, Yauyudhāni, ihm lieb, an der Sarasvatī (Akk.+Lok.)"],["nyaveśayata dharmātmā vṛddhabālapuraskṛtam","siedelte der Rechtschaffene an, die Alten und Jungen voranstellend (3.Sg.Kaus.Impf.)"]]],["070","indraprasthe dadau rājyaṃ vajrāya paravīrahā vajreṇākrūradārās tu vāryamāṇāḥ pravavrajuḥ","In Indraprastha gab der Bezwinger feindlicher Helden dem Vajra das Königreich; Akrūras Frauen aber, von Vajra zurückgehalten, gingen dennoch in die Weltentsagung.","",[["indraprasthe dadau rājyaṃ vajrāya paravīrahā","in Indraprastha gab der Bezwinger feindlicher Helden dem Vajra das Königreich (3.Sg.Perf.)"],["vajreṇa akrūradārāḥ tu vāryamāṇāḥ","Akrūras Frauen aber, von Vajra zurückgehalten"],["pravavrajuḥ","gingen sie [dennoch] in die Weltentsagung (3.Pl.Perf.)"]]],["071","rukmiṇī tv atha gāndhārī śaibyā haimavatīty api devī jāmbavatī caiva viviśur jātavedasam","Rukmiṇī aber, und Gāndhārī, Śaibyā, und auch Haimavatī, und die Königin Jāmbavatī gingen in das Feuer ein.","",[["rukmiṇī tv atha gāndhārī śaibyā haimavatī iti api","Rukmiṇī, und Gāndhārī, Śaibyā, und auch Haimavatī"],["devī jāmbavatī ca eva viviśuḥ jātavedasam","und die Königin Jāmbavatī gingen in das Feuer ein (3.Pl.Perf.)"]]],["072","satyabhāmā tathaivānyā devyaḥ kṛṣṇasya saṃmatāḥ vanaṃ praviviśū rājaṃs tāpasye kṛtaniścayāḥ","Satyabhāmā und ebenso die anderen von Kṛṣṇa geschätzten Königinnen gingen in den Wald, o König, entschlossen zum Asketenleben.","",[["satyabhāmā tathā eva anyāḥ devyaḥ kṛṣṇasya saṃmatāḥ","Satyabhāmā und ebenso die anderen von Kṛṣṇa geschätzten Königinnen"],["vanaṃ praviviśuḥ rājan tāpasye kṛtaniścayāḥ","gingen in den Wald, o König, entschlossen zum Asketenleben (3.Pl.Perf.)"]]],["073","dvārakāvāsino ye tu puruṣāḥ pārtham anvayuḥ yathārhaṃ saṃvibhajyainān vajre paryadadaj jayaḥ","Die Männer aber, die in Dvārakā gewohnt hatten und dem Pārtha gefolgt waren, teilte der Siegreiche gebührend auf und übergab sie Vajra.","",[["dvārakāvāsinaḥ ye tu puruṣāḥ pārtham anvayuḥ","die Männer aber, die in Dvārakā gewohnt hatten und dem Pārtha gefolgt waren (3.Pl.Impf.)"],["yathārhaṃ saṃvibhajya enān vajre paryadadāt jayaḥ","teilte sie gebührend auf und übergab sie Vajra, der Siegreiche (Abs.+3.Sg.Impf.)"]]],["074","sa tat kṛtvā prāptakālaṃ bāṣpeṇāpihito 'rjunaḥ kṛṣṇadvaipāyanaṃ rājan dadarśāsīnam āśrame","Nachdem er dies, was dem Anlass entsprach, getan hatte, sah Arjuna, die Augen von Tränen verschleiert, o König, Kṛṣṇadvaipāyana in seiner Einsiedelei sitzen.","[Anm.: Kṛṣṇadvaipāyana = Vyāsa.]",[["saḥ tat kṛtvā prāptakālaṃ","nachdem er dies, was dem Anlass entsprach, getan hatte (Abs.)"],["bāṣpeṇa apihitaḥ arjunaḥ","Arjuna, die Augen von Tränen verschleiert (Nom.Part.)"],["kṛṣṇadvaipāyanaṃ rājan dadarśa āsīnam āśrame","sah Kṛṣṇadvaipāyana, o König, in seiner Einsiedelei sitzen (3.Sg.Perf.)"]]]]},{"num":9,"title_sa":"","title_de":"Arjuna bei Vyāsa: Bericht und die Lehre von der Zeit","note":"Letztes Kapitel des Mausalaparva (9 Kapitel gesamt) - Quellgrenze bei Offset 14224478 (Beginn Mahāprasthānikaparva, Marker \"17,001.001\") gegen den bekannten 40000-Zeichen-Fallback abgesichert.","units":[["001","vaiśaṃpāyana uvāca praviśann arjuno rājann āśramaṃ satyavādinaḥ dadarśāsīnam ekānte muniṃ satyavatīsutam","Vaiśaṃpāyana sprach: Als Arjuna, o König, den Einsiedlerhain des Wahrheitsredenden betrat, sah er den Weisen, den Sohn Satyavatīs, abseits sitzen.","[Anm.: Satyavatīsuta = Vyāsa.]",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana (Subj.) sprach (3.Sg.Perf.)"],["praviśan arjunaḥ rājan āśramaṃ satyavādinaḥ","als Arjuna, o König, den Einsiedlerhain des Wahrheitsredenden betrat (Part.+Akk.)"],["dadarśa āsīnam ekānte muniṃ satyavatīsutam","sah er den Weisen, den Sohn Satyavatīs, abseits sitzen (3.Sg.Perf.)"]]],["002","sa tam āsādya dharmajñam upatasthe mahāvratam arjuno 'smīti nāmāsmai nivedyābhyavadat tataḥ","Er trat zu ihm, dem Pflichtkundigen, dem großen Gelübde Treuen, heran, wartete ihm auf und sprach, nachdem er ihm seinen Namen mitgeteilt hatte: „Ich bin Arjuna.“","",[["saḥ tam āsādya dharmajñam upatasthe mahāvratam","er trat zu ihm, dem Pflichtkundigen, dem großen Gelübde Treuen, heran und wartete auf (Abs.+3.Sg.Perf.Med.)"],["arjunaḥ asmi iti nāma asmai nivedya","seinen Namen, „Ich bin Arjuna“, mitgeteilt habend (Abs.)"],["abhyavadat tataḥ","sprach er dann zu ihm (3.Sg.Impf.)"]]],["003","svāgataṃ te 'stv iti prāha muniḥ satyavatīsutaḥ āsyatām iti covāca prasannātmā mahāmuniḥ","„Willkommen sei dir!“ sprach der Weise, der Sohn Satyavatīs, und „Setze dich!“ sprach ferner der hochgesinnte große Weise.","",[["svāgataṃ te astu iti prāha muniḥ satyavatīsutaḥ","„Willkommen sei dir!“ sprach der Weise, der Sohn Satyavatīs (direkte Rede+3.Sg.Perf.)"],["āsyatām iti ca uvāca prasannātmā mahāmuniḥ","„Setze dich!“ sprach ferner der hochgesinnte große Weise (direkte Rede+3.Sg.Perf.)"]]],["004","tam apratītamanasaṃ niḥśvasantaṃ punaḥ punaḥ nirviṇṇamanasaṃ dṛṣṭvā pārthaṃ vyāso 'bravīd idam","Als er den Pārtha sah, dessen Sinn unzufrieden war, der immer wieder seufzte, dessen Herz erschöpft war, sprach Vyāsa dies zu ihm:","",[["tam apratītamanasaṃ niḥśvasantaṃ punaḥ punaḥ","ihn, dessen Sinn unzufrieden war, der immer wieder seufzte (Akk.Part.)"],["nirviṇṇamanasaṃ dṛṣṭvā pārthaṃ","den Pārtha, dessen Herz erschöpft war, gesehen habend (Abs.+Akk.Part.)"],["vyāsaḥ abravīt idam","sprach Vyāsa dies (3.Sg.Impf.)"]]],["005","avīrajo 'bhighātas te brāhmaṇo vā hatas tvayā yuddhe parājito vāsi gataśrīr iva lakṣyase","„Ist dir ein unheldenhafter Schlag widerfahren, oder hast du einen Brahmanen erschlagen, oder bist du im Kampf besiegt worden? Du siehst aus, als hättest du all deinen Glanz verloren.","",[["avīrajaḥ abhighātaḥ te","ist dir ein unheldenhafter Schlag [widerfahren] (Nom.)"],["brāhmaṇaḥ vā hataḥ tvayā","oder hast du einen Brahmanen erschlagen (Nom.Part.+Instr.)"],["yuddhe parājitaḥ vā asi","oder bist du im Kampf besiegt worden (Lok.+2.Sg.Präs.)"],["gataśrīḥ iva lakṣyase","du siehst aus, als hättest du deinen Glanz verloren (2.Sg.Präs.Pass.)"]]],["006","na tvā pratyabhijānāmi kim idaṃ bharatarṣabha śrotavyaṃ cen mayā pārtha kṣipram ākhyātum arhasi","Ich erkenne dich kaum wieder - was ist das, Stier der Bharatas? Wenn es von mir gehört werden darf, Pārtha, solltest du es rasch berichten.“","",[["na tvā pratyabhijānāmi kim idaṃ bharatarṣabha","ich erkenne dich kaum wieder - was ist das, Stier der Bharatas (1.Sg.Präs.)"],["śrotavyaṃ cet mayā pārtha","wenn es von mir gehört werden darf, Pārtha (Ger.)"],["kṣipram ākhyātum arhasi","solltest du es rasch berichten (2.Sg.Präs.+Inf.)"]]],["007","arjuna uvāca yaḥ sa medhavapuḥ śrīmān bṛhatpaṅkajalocanaḥ sa kṛṣṇaḥ saha rāmeṇa tyaktvā dehaṃ divaṃ gataḥ","Arjuna sprach: „Er, dessen Gestalt wolkendunkel war [?], der Glanzvolle, mit großen lotusgleichen Augen - jener Kṛṣṇa ist, zusammen mit Rāma, nachdem er den Leib verlassen hatte, zum Himmel gegangen.","[?: 'medhavapuḥ' ist unsicher überliefert; vermutlich Variante zu 'meghavapuḥ' (wolkengestaltig), ein geläufiges Kṛṣṇa-Epitheton.]",[["arjunaḥ uvāca","Arjuna sprach (3.Sg.Perf.)"],["yaḥ saḥ medhavapuḥ śrīmān","er, dessen Gestalt wolkendunkel [?] war, der Glanzvolle (Nom.)"],["bṛhatpaṅkajalocanaḥ","mit großen lotusgleichen Augen"],["saḥ kṛṣṇaḥ saha rāmeṇa tyaktvā dehaṃ divaṃ gataḥ","jener Kṛṣṇa ist, zusammen mit Rāma, den Leib verlassen habend, zum Himmel gegangen (Nom.+Abs.+3.Sg.Perf.Part.)"]]],["008","mausale vṛṣṇivīrāṇāṃ vināśo brahmaśāpajaḥ babhūva vīrāntakaraḥ prabhāse romaharṣaṇaḥ","Im Keulenkampf geschah der durch den Brahmanenfluch verursachte Untergang der Vṛṣṇi-Helden, heldenvernichtend, bei Prabhāsa, haarsträubend zu berichten.","",[["mausale vṛṣṇivīrāṇāṃ vināśaḥ brahmaśāpajaḥ","im Keulenkampf der durch den Brahmanenfluch verursachte Untergang der Vṛṣṇi-Helden (Lok.+Nom.)"],["babhūva vīrāntakaraḥ prabhāse romaharṣaṇaḥ","geschah, heldenvernichtend, bei Prabhāsa, haarsträubend (3.Sg.Perf.)"]]],["009","ye te śūrā mahātmānaḥ siṃhadarpā mahābalāḥ bhojavṛṣṇyandhakā brahmann anyonyaṃ tair hataṃ yudhi","Jene Helden, hochgesinnt, löwenstolz, gewaltig an Kraft, die Bhojas, Vṛṣṇis und Andhakas, o Brahmane - durch sie selbst geschah gegenseitige Vernichtung im Kampf.","",[["ye te śūrāḥ mahātmānaḥ siṃhadarpāḥ mahābalāḥ","jene Helden, hochgesinnt, löwenstolz, gewaltig an Kraft (Nom.)"],["bhojavṛṣṇyandhakāḥ brahman","die Bhojas, Vṛṣṇis und Andhakas, o Brahmane"],["anyonyaṃ taiḥ hataṃ yudhi","durch sie [selbst] geschah gegenseitige Vernichtung im Kampf (Instr.+Nom.Part.)"]]],["010","gadāparighaśaktīnāṃ sahāḥ parighabāhavaḥ ta erakābhir nihatāḥ paśya kālasya paryayam","Sie, die Keulen, Eisenstangen und Speere ertragen konnten, mit armdicken Eisenstangen - sie wurden durch Eraka-Schilfhalme erschlagen; sieh die Wendung der Zeit!","",[["gadāparighaśaktīnāṃ sahāḥ parighabāhavaḥ","die Keulen, Eisenstangen und Speere ertragen konnten, mit armdicken Eisenstangen (Gen.+Nom.)"],["te erakābhiḥ nihatāḥ","sie wurden durch Eraka-Schilfhalme erschlagen (Instr.+Nom.Part.)"],["paśya kālasya paryayam","sieh die Wendung der Zeit (Imp.)"]]],["011","hataṃ pañcaśataṃ teṣāṃ sahasraṃ bāhuśālinām nidhanaṃ samanuprāptaṃ samāsādyetaretaram","Fünfhundert von ihnen wurden erschlagen, tausend Kraftvollarmige erlangten den Untergang, indem sie aufeinandertrafen.","",[["hataṃ pañcaśataṃ teṣāṃ","erschlagen fünfhundert von ihnen (Nom.Part.)"],["sahasraṃ bāhuśālinām nidhanaṃ samanuprāptaṃ","tausend Kraftvollarmige erlangten den Untergang (Nom.+Akk.Part.)"],["samāsādya itaretaram","aufeinandertreffend, einander begegnend (Abs.)"]]],["012","punaḥ punar na mṛśyāmi vināśam amitaujasām cintayāno yadūnāṃ ca kṛṣṇasya ca yaśasvinaḥ","Immer wieder kann ich es nicht fassen, den Untergang der von unermesslicher Kraft [Seienden], wenn ich an die Yadus und an den ruhmreichen Kṛṣṇa denke.","",[["punaḥ punaḥ na mṛśyāmi vināśam amitaujasām","immer wieder kann ich den Untergang der von unermesslicher Kraft [Seienden] nicht fassen (1.Sg.Präs.+Akk.)"],["cintayānaḥ yadūnāṃ ca kṛṣṇasya ca yaśasvinaḥ","denkend an die Yadus und an den ruhmreichen Kṛṣṇa (Part.)"]]],["013","śoṣaṇaṃ sāgarasyeva parvatasyeva cālanam nabhasaḥ patanaṃ caiva śaityam agnes tathaiva ca","Es ist wie das Austrocknen des Ozeans, wie das Erzittern eines Berges, wie der Sturz des Himmels, und ebenso wie die Kälte des Feuers.","",[["śoṣaṇaṃ sāgarasya iva","wie das Austrocknen des Ozeans"],["parvatasya iva cālanam","wie das Erzittern eines Berges"],["nabhasaḥ patanaṃ ca eva","und wie der Sturz des Himmels"],["śaityam agneḥ tathā eva ca","und ebenso wie die Kälte des Feuers"]]],["014","aśraddheyam ahaṃ manye vināśaṃ śārṅgadhanvanaḥ na ceha sthātum icchāmi loke kṛṣṇavinākṛtaḥ","Unglaublich, meine ich, ist der Untergang des Bogenträgers Śārṅga; und ich will nicht länger hier auf der Welt verweilen, Kṛṣṇas beraubt.","[Anm.: Śārṅgadhanvan = Kṛṣṇa, Träger des Bogens Śārṅga.]",[["aśraddheyam aham manye vināśaṃ śārṅgadhanvanaḥ","unglaublich, meine ich, ist der Untergang des Bogenträgers Śārṅga [Kṛṣṇa] (1.Sg.Präs.+Akk.)"],["na ca iha sthātum icchāmi loke","und ich will nicht länger hier auf der Welt verweilen (Inf.+1.Sg.Präs.)"],["kṛṣṇavinākṛtaḥ","Kṛṣṇas beraubt"]]],["015","itaḥ kaṣṭataraṃ cānyac chṛṇu tad vai tapodhana mano me dīryate yena cintayānasya vai muhuḥ","Höre noch etwas Schwereres als dies, o Schatz der Askese, wodurch mein Herz, während ich immer wieder daran denke, zerreißt.","",[["itaḥ kaṣṭataraṃ ca anyat śṛṇu tat vai tapodhana","höre noch etwas Schwereres als dies, o Schatz der Askese (Imp.)"],["manaḥ me dīryate yena","wodurch mein Herz zerreißt (3.Sg.Präs.Pass.)"],["cintayānasya vai muhuḥ","während ich immer wieder daran denke (Gen.Part.)"]]],["016","paśyato vṛṣṇidārāś ca mama brahman sahasraśaḥ ābhīrair anusṛtyājau hṛtāḥ pañcanadālayaiḥ","Vor meinen Augen, o Brahmane, wurden die Frauen der Vṛṣṇis zu Tausenden von den im Fünfstromland ansässigen Ābhīras im Kampf verfolgt und geraubt.","",[["paśyataḥ vṛṣṇidārāḥ ca mama brahman sahasraśaḥ","vor meinen [Augen], die Frauen der Vṛṣṇis, o Brahmane, zu Tausenden (Gen.Part.)"],["ābhīraiḥ anusṛtya ājau hṛtāḥ pañcanadālayaiḥ","von den im Fünfstromland ansässigen Ābhīras im Kampf verfolgt und geraubt (Instr.+Abs.+Nom.Part.)"]]],["017","dhanur ādāya tatrāhaṃ nāśakaṃ tasya pūraṇe yathā purā ca me vīryaṃ bhujayor na tathābhavat","Den Bogen ergreifend, vermochte ich dort nicht, ihn zu spannen; und meine Armeskraft war nicht mehr wie einst.","",[["dhanuḥ ādāya tatra aham","den Bogen ergriffen habend, ich dort (Abs.)"],["na aśakaṃ tasya pūraṇe","vermochte ich nicht, ihn zu spannen (1.Sg.Impf.+Lok.)"],["yathā purā ca me vīryaṃ bhujayoḥ na tathā abhavat","und meine Armeskraft war nicht mehr wie einst (3.Sg.Impf.)"]]],["018","astrāṇi me pranaṣṭāni vividhāni mahāmune śarāś ca kṣayam āpannāḥ kṣaṇenaiva samantataḥ","Meine mannigfaltigen Waffensprüche waren verloren, o großer Weiser, und meine Pfeile gingen in einem einzigen Augenblick vollständig zur Neige.","",[["astrāṇi me pranaṣṭāni vividhāni mahāmune","meine mannigfaltigen Waffensprüche waren verloren, o großer Weiser (Nom.Part.)"],["śarāḥ ca kṣayam āpannāḥ kṣaṇena eva samantataḥ","und meine Pfeile gingen in einem einzigen Augenblick vollständig zur Neige (Nom.Part.)"]]],["019","puruṣaś cāprameyātmā śaṅkhacakragadādharaḥ caturbhujaḥ pītavāsā śyāmaḥ padmāyatekṣaṇaḥ","Und der Mann von unermesslichem Wesen, der Muschelhorn, Diskus und Keule trägt, vierarmig, gelbgewandet, dunkel, mit lotusgleichen, langgezogenen Augen -","",[["puruṣaḥ ca aprameyātmā","und der Mann von unermesslichem Wesen"],["śaṅkhacakragadādharaḥ caturbhujaḥ","der Muschelhorn, Diskus und Keule trägt, vierarmig"],["pītavāsāḥ śyāmaḥ padmāyatekṣaṇaḥ","gelbgewandet, dunkel, mit lotusgleichen, langgezogenen Augen"]]],["020","yaḥ sa yāti purastān me rathasya sumahādyutiḥ pradahan ripusainyāni na paśyāmy aham adya tam","- er, der von überaus großem Glanz, der vor meinem Wagen herging und die Feindesheere verbrannte, ihn sehe ich heute nicht mehr.","",[["yaḥ saḥ yāti purastāt me rathasya sumahādyutiḥ","er, der von überaus großem Glanz, der vor meinem Wagen herging (3.Sg.Präs.)"],["pradahan ripusainyāni","die Feindesheere verbrennend (Part.)"],["na paśyāmi aham adya tam","ihn sehe ich heute nicht mehr (1.Sg.Präs.)"]]],["021","yena pūrvaṃ pradagdhāni śatrusainyāni tejasā śarair gāṇḍīvanirmuktair ahaṃ paścād vyanāśayam","Durch dessen Glanz einst die Feindesheere verbrannt wurden, und die ich danach mit von Gāṇḍīva entsandten Pfeilen vernichtete -","",[["yena pūrvaṃ pradagdhāni śatrusainyāni tejasā","durch dessen Glanz einst die Feindesheere verbrannt wurden (Instr.+Nom.Part.)"],["śaraiḥ gāṇḍīvanirmuktaiḥ aham paścāt vyanāśayam","und die ich danach mit von Gāṇḍīva entsandten Pfeilen vernichtete (Instr.+1.Sg.Impf.)"]]],["022","tam apaśyan viṣīdāmi ghūrṇāmīva ca sattama parinirviṇṇacetāś ca śāntiṃ nopalabhe 'pi ca","- ihn nicht sehend, verzage ich und schwanke wie im Taumel, o Bester, mein Sinn ist ganz erschöpft, und ich finde keinen Frieden.","",[["tam apaśyan viṣīdāmi","ihn nicht sehend, verzage ich (Part.+1.Sg.Präs.)"],["ghūrṇāmi iva ca sattama","und schwanke wie im Taumel, o Bester (1.Sg.Präs.)"],["parinirviṇṇacetāḥ ca śāntiṃ na upalabhe api ca","mein Sinn ist ganz erschöpft, und ich finde keinen Frieden (Nom.Part.+1.Sg.Präs.Med.)"]]],["023","vinā janārdanaṃ vīraṃ nāhaṃ jīvitum utsahe śrutvaiva hi gataṃ viṣṇuṃ mamāpi mumuhur diśaḥ","Ohne den Helden Janārdana wage ich nicht zu leben; denn schon als ich hörte, dass Viṣṇu gegangen sei, verwirrten sich mir auch die Himmelsrichtungen.","",[["vinā janārdanaṃ vīraṃ na aham jīvitum utsahe","ohne den Helden Janārdana wage ich nicht zu leben (Inf.+1.Sg.Präs.)"],["śrutvā eva hi gataṃ viṣṇuṃ","denn schon als ich hörte, dass Viṣṇu gegangen sei (Abs.+Akk.Part.)"],["mama api mumuhuḥ diśaḥ","verwirrten sich mir auch die Himmelsrichtungen (3.Pl.Perf.)"]]],["024","pranaṣṭajñātivīryasya śūnyasya paridhāvataḥ upadeṣṭuṃ mama śreyo bhavān arhati sattama","Mir, dessen Verwandte und Kraft dahin sind, der leer umherirrt, solltest du, Bester, geneigt sein, mir [meinen] Nutzen zu weisen.“","",[["pranaṣṭajñātivīryasya śūnyasya paridhāvataḥ","dessen Verwandte und Kraft dahin sind, der leer umherirrt (Gen.Part.)"],["upadeṣṭuṃ mama śreyaḥ bhavān arhati sattama","mir meinen Nutzen zu weisen solltest du geneigt sein, o Bester (Inf.+2.Sg.Präs.)"]]],["025","vyāsa uvāca brahmaśāpavinirdagdhā vṛṣṇyandhakamahārathāḥ vinaṣṭāḥ kuruśārdūla na tāñ śocitum arhasi","Vyāsa sprach: „Durch den Brahmanenfluch gänzlich verbrannt, sind die großen Wagenkämpfer der Vṛṣṇis und Andhakas umgekommen, Tiger der Kurus; du solltest sie nicht betrauern.","",[["vyāsaḥ uvāca","Vyāsa sprach (3.Sg.Perf.)"],["brahmaśāpavinirdagdhāḥ vṛṣṇyandhakamahārathāḥ vinaṣṭāḥ kuruśārdūla","durch den Brahmanenfluch gänzlich verbrannt, sind die großen Wagenkämpfer der Vṛṣṇis und Andhakas umgekommen, Tiger der Kurus (Nom.Part.)"],["na tān śocitum arhasi","du solltest sie nicht betrauern (Inf.+2.Sg.Präs.)"]]],["026","bhavitavyaṃ tathā tad dhi diṣṭam etan mahātmanām upekṣitaṃ ca kṛṣṇena śaktenāpi vyapohitum","So musste es geschehen, denn dies war den Hochgesinnten bestimmt; und Kṛṣṇa hat es geschehen lassen, obwohl er es hätte abwenden können.","",[["bhavitavyaṃ tathā tat hi diṣṭam etat mahātmanām","so musste es geschehen, denn dies war den Hochgesinnten bestimmt (Ger.+Nom.Part.)"],["upekṣitaṃ ca kṛṣṇena śaktena api vyapohitum","und Kṛṣṇa hat es geschehen lassen, obwohl fähig, es abzuwenden (Nom.Part.+Instr.+Inf.)"]]],["027","trailokyam api kṛṣṇo hi kṛtsnaṃ sthāvarajaṅgamam prasahed anyathā kartuṃ kim u śāpaṃ manīṣiṇām","Denn Kṛṣṇa vermöchte selbst die ganze Dreiwelt, das Bewegliche und Unbewegliche, anders zu machen - wie viel mehr den Fluch der Weisen!","",[["trailokyam api kṛṣṇaḥ hi kṛtsnaṃ sthāvarajaṅgamam","denn Kṛṣṇa selbst die ganze Dreiwelt, das Bewegliche und Unbewegliche"],["prasahet anyathā kartuṃ","vermöchte anders zu machen (Opt.+Inf.)"],["kim u śāpaṃ manīṣiṇām","wie viel mehr den Fluch der Weisen"]]],["028","rathasya purato yāti yaḥ sa cakragadādharaḥ tava snehāt purāṇarṣir vāsudevaś caturbhujaḥ","Er, der Diskus- und Keulenträger, der vor deinem Wagen herging - aus Zuneigung zu dir tat er dies, der uralte Seher, Vāsudeva, der Vierarmige.","",[["rathasya purataḥ yāti yaḥ saḥ cakragadādharaḥ","er, der Diskus- und Keulenträger, der vor deinem Wagen herging (3.Sg.Präs.)"],["tava snehāt purāṇarṣiḥ vāsudevaḥ caturbhujaḥ","aus Zuneigung zu dir, der uralte Seher, Vāsudeva, der Vierarmige (Abl.)"]]],["029","kṛtvā bhārāvataraṇaṃ pṛthivyāḥ pṛthulocanaḥ mokṣayitvā jagat sarvaṃ gataḥ svasthānam uttamam","Nachdem er die Last der Erde abgenommen hatte, der Großäugige, und die ganze Welt befreit hatte, ist er zu seinem höchsten eigenen Ort gegangen.","",[["kṛtvā bhārāvataraṇaṃ pṛthivyāḥ pṛthulocanaḥ","die Last der Erde abgenommen habend, der Großäugige (Abs.)"],["mokṣayitvā jagat sarvaṃ","die ganze Welt befreit habend (Abs.)"],["gataḥ svasthānam uttamam","ist er zu seinem höchsten eigenen Ort gegangen (Nom.Part.)"]]],["030","tvayā tv iha mahat karma devānāṃ puruṣarṣabha kṛtaṃ bhīmasahāyena yamābhyāṃ ca mahābhuja","Von dir aber wurde hier ein großes Werk für die Götter vollbracht, Stier unter den Männern, mit Bhīma als Helfer und mit den beiden Zwillingen, o Starkarmiger.","",[["tvayā tu iha mahat karma devānāṃ puruṣarṣabha kṛtaṃ","von dir aber wurde hier ein großes Werk für die Götter vollbracht, Stier unter den Männern (Instr.+Nom.Part.)"],["bhīmasahāyena yamābhyāṃ ca mahābhuja","mit Bhīma als Helfer und mit den beiden Zwillingen, o Starkarmiger (Instr.)"]]],["031","kṛtakṛtyāṃś ca vo manye saṃsiddhān kurupuṃgava gamanaṃ prāptakālaṃ ca tad dhi śreyo mataṃ mama","Ich halte euch für die Aufgabe erfüllt und vollendet, Stier der Kurus; und dass nun die Zeit zum Aufbruch gekommen ist, das halte ich für das Beste.","",[["kṛtakṛtyān ca vaḥ manye saṃsiddhān kurupuṃgava","ich halte euch für die Aufgabe erfüllt und vollendet, Stier der Kurus (Akk.Part.+1.Sg.Präs.)"],["gamanaṃ prāptakālaṃ ca tat hi śreyaḥ mataṃ mama","und dass die Zeit zum Aufbruch gekommen ist, das halte ich für das Beste (Nom.)"]]],["032","balaṃ buddhiś ca tejaś ca pratipattiś ca bhārata bhavanti bhavakāleṣu vipadyante viparyaye","Kraft, Verstand, Glanz und Tatkraft, o Bhārata, entstehen zur ihnen bestimmten Zeit und schwinden, wenn die Wendung kommt.","",[["balaṃ buddhiḥ ca tejaḥ ca pratipattiḥ ca bhārata","Kraft, Verstand, Glanz und Tatkraft, o Bhārata"],["bhavanti bhavakāleṣu vipadyante viparyaye","entstehen zur ihnen bestimmten Zeit und schwinden, wenn die Wendung kommt (3.Pl.Präs.)"]]],["033","kālamūlam idaṃ sarvaṃ jagadbījaṃ dhanaṃjaya kāla eva samādatte punar eva yadṛcchayā","Die Zeit ist die Wurzel von all diesem, der Same der Welt, Dhanaṃjaya; die Zeit allein nimmt alles wieder und gibt es wieder, nach eigenem Willen.","",[["kālamūlam idaṃ sarvaṃ jagadbījaṃ dhanaṃjaya","die Zeit ist die Wurzel von all diesem, der Same der Welt, Dhanaṃjaya (Nom.)"],["kālaḥ eva samādatte punaḥ eva yadṛcchayā","die Zeit allein nimmt [alles] und [gibt es] wieder, nach eigenem Willen (3.Sg.Präs.)"]]],["034","sa eva balavān bhūtvā punar bhavati durbalaḥ sa eveśaś ca bhūtveha parair ājñāpyate punaḥ","Derselbe, der stark gewesen ist, wird wieder schwach; derselbe, der Herrscher gewesen ist, wird hier wieder von anderen befehligt.","",[["saḥ eva balavān bhūtvā punaḥ bhavati durbalaḥ","derselbe, stark gewesen, wird wieder schwach (Abs.+3.Sg.Präs.)"],["saḥ eva īśaḥ ca bhūtvā iha","derselbe, Herrscher gewesen, hier (Abs.)"],["paraiḥ ājñāpyate punaḥ","wird wieder von anderen befehligt (3.Sg.Präs.Pass.)"]]],["035","kṛtakṛtyāni cāstrāṇi gatāny adya yathāgatam punar eṣyanti te hastaṃ yadā kālo bhaviṣyati","Und deine Waffen, die ihre Aufgabe erfüllt haben, sind heute so gegangen, wie sie gekommen waren; sie werden wieder in deine Hand kommen, wenn die Zeit dafür da sein wird.","",[["kṛtakṛtyāni ca astrāṇi gatāni adya yathāgatam","und deine Waffen, die ihre Aufgabe erfüllt haben, sind heute so gegangen, wie sie gekommen waren (Nom.Part.)"],["punaḥ eṣyanti te hastaṃ yadā kālaḥ bhaviṣyati","sie werden wieder in deine Hand kommen, wenn die Zeit dafür da sein wird (3.Pl.Fut.+3.Sg.Fut.)"]]],["036","kālo gantuṃ gatiṃ mukhyāṃ bhavatām api bhārata etac chreyo hi vo manye paramaṃ bharatarṣabha","Es ist Zeit, o Bhārata, dass auch ihr den höchsten Gang antretet; dies halte ich für das beste und höchste Ziel für euch, Stier der Bharatas.“","",[["kālaḥ gantuṃ gatiṃ mukhyāṃ bhavatām api bhārata","es ist Zeit, dass auch ihr den höchsten Gang antretet, o Bhārata (Nom.+Inf.)"],["etat śreyaḥ hi vaḥ manye paramaṃ bharatarṣabha","dies halte ich für das beste und höchste [Ziel] für euch, Stier der Bharatas (1.Sg.Präs.)"]]],["037","etad vacanam ājñāya vyāsasyāmitatejasaḥ anujñāto yayau pārtho nagaraṃ nāgasāhvayam","Nachdem er dieses Wort des Vyāsa von unermesslichem Glanz vernommen hatte, ging der von ihm verabschiedete Pārtha in die Stadt Nāgasāhvaya.","[Anm.: Nāgasāhvaya = Hāstinapura.]",[["etat vacanam ājñāya vyāsasya amitatejasaḥ","dieses Wort des Vyāsa von unermesslichem Glanz vernommen habend (Abs.)"],["anujñātaḥ yayau pārthaḥ nagaraṃ nāgasāhvayam","ging der verabschiedete Pārtha in die Stadt Nāgasāhvaya (Nom.Part.+3.Sg.Perf.)"]]],["038","praviśya ca purīṃ vīraḥ samāsādya yudhiṣṭhiram ācaṣṭa tad yathāvṛttaṃ vṛṣṇyandhakajanaṃ prati","Und nachdem der Held die Stadt betreten hatte, trat er vor Yudhiṣṭhira und berichtete, was sich in Bezug auf das Volk der Vṛṣṇis und Andhakas zugetragen hatte.","",[["praviśya ca purīṃ vīraḥ","die Stadt betreten habend, der Held (Abs.)"],["samāsādya yudhiṣṭhiram","zu Yudhiṣṭhira getreten (Abs.)"],["ācaṣṭa tat yathāvṛttaṃ vṛṣṇyandhakajanaṃ prati","berichtete, was sich in Bezug auf das Volk der Vṛṣṇis und Andhakas zugetragen hatte (3.Sg.Impf.)"]]]]}]},{"key":"mahaprasthanika","name":"Mahāprasthānikaparva","desc":"Das Buch des großen Auszugs: die letzte Wanderung der Pāṇḍavas in den Himalaya.","chapters":[{"num":1,"title_sa":"","title_de":"Yudhiṣṭhiras Aufbruch, die Übergabe der Herrschaft und die Rückgabe des Gāṇḍīva","note":"Erstes Kapitel des Mahāprasthānikaparva (Buch 17, Parva-Nr.17), direkt im Anschluss an das Mausalaparva - Quellgrenze bei Offset 14224478 (Marker \"17,001.001\"), Ende bei 14231158.","units":[["001","janamejaya uvāca evaṃ vṛṣṇyandhakakule śrutvā mausalam āhavam pāṇḍavāḥ kim akurvanta tathā kṛṣṇe divaṃ gate","Janamejaya sprach: Als sie so vom Keulenkampf im Geschlecht der Vṛṣṇis und Andhakas gehört hatten, was taten da die Pāṇḍavas, nachdem auch Kṛṣṇa zum Himmel gegangen war?","",[["janamejayaḥ uvāca","Janamejaya sprach (3.Sg.Perf.)"],["evaṃ vṛṣṇyandhakakule śrutvā mausalam āhavam","als sie so vom Keulenkampf im Geschlecht der Vṛṣṇis und Andhakas gehört hatten (Abs.+Akk.)"],["pāṇḍavāḥ kim akurvanta","was taten da die Pāṇḍavas (3.Pl.Impf.)"],["tathā kṛṣṇe divaṃ gate","nachdem auch Kṛṣṇa zum Himmel gegangen war (Lok.Abs.)"]]],["002","vaiśaṃpāyana uvāca śrutvaiva kauravo rājā vṛṣṇīnāṃ kadanaṃ mahat prasthāne matim ādhāya vākyam arjunam abravīt","Vaiśaṃpāyana sprach: Sobald der kauravische König von dem großen Blutbad der Vṛṣṇis gehört hatte, richtete er seinen Sinn auf den Aufbruch und sprach zu Arjuna dieses Wort:","",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana sprach (3.Sg.Perf.)"],["śrutvā eva kauravaḥ rājā vṛṣṇīnāṃ kadanaṃ mahat","sobald der kauravische König von dem großen Blutbad der Vṛṣṇis gehört hatte (Abs.+Nom.+Akk.)"],["prasthāne matim ādhāya vākyam arjunam abravīt","richtete er seinen Sinn auf den Aufbruch und sprach zu Arjuna dieses Wort (Lok.+Abs.+3.Sg.Impf.)"]]],["003","kālaḥ pacati bhūtāni sarvāṇy eva mahāmate karmanyāsam ahaṃ manye tvam api draṣṭum arhasi","„Die Zeit verzehrt alle Wesen, o Großgesinnter; ich halte den Verzicht auf Handeln für richtig - auch du solltest das einsehen.“","",[["kālaḥ pacati bhūtāni sarvāṇi eva mahāmate","die Zeit verzehrt alle Wesen, o Großgesinnter (3.Sg.Präs.)"],["karmanyāsam aham manye","ich halte den Verzicht auf Handeln [für richtig] (1.Sg.Präs.)"],["tvam api draṣṭum arhasi","auch du solltest das einsehen (2.Sg.Präs.+Inf.)"]]],["004","ity uktaḥ sa tu kaunteyaḥ kālaḥ kāla iti bruvan anvapadyata tad vākyaṃ bhrātur jyeṣṭhasya vīryavān","So angesprochen, stimmte der kraftvolle Sohn der Kuntī, „Zeit, ja Zeit“, sagend, dem Wort seines ältesten Bruders zu.","",[["iti uktaḥ saḥ tu kaunteyaḥ","so angesprochen, der Sohn der Kuntī aber (Nom.Part.)"],["kālaḥ kāla iti bruvan","„Zeit, Zeit“ sagend (Part.+direkte Rede)"],["anvapadyata tad vākyaṃ bhrātuḥ jyeṣṭhasya vīryavān","stimmte der kraftvolle [Arjuna] dem Wort seines ältesten Bruders zu (3.Sg.Impf.Med.)"]]],["005","arjunasya mataṃ jñātvā bhīmaseno yamau tathā anvapadyanta tad vākyaṃ yad uktaṃ savyasācinā","Als sie Arjunas Zustimmung erkannten, stimmten auch Bhīmasena und die Zwillinge dem Wort zu, das der Linkshändige Bogenschütze gesprochen hatte.","[Anm.: Savyasācin = Beiname Arjunas, 'der mit der linken Hand [den Bogen] Ziehende'.]",[["arjunasya mataṃ jñātvā","Arjunas Zustimmung erkannt habend (Abs.)"],["bhīmasenaḥ yamau tathā anvapadyanta tad vākyaṃ","stimmten auch Bhīmasena und die Zwillinge dem Wort zu (3.Pl.Impf.Med.)"],["yat uktaṃ savyasācinā","das der Linkshändige Bogenschütze gesprochen hatte (Instr.)"]]],["006","tato yuyutsum ānāyya pravrajan dharmakāmyayā rājyaṃ paridadau sarvaṃ vaiśyāputre yudhiṣṭhiraḥ","Dann ließ Yudhiṣṭhira, aus Verlangen nach Pflichterfüllung im Begriff, fortzuziehen, Yuyutsu holen und übertrug die Verwaltung des ganzen Königreichs dem Sohn der Vaiśya-Frau.","[Anm.: Vaiśyāputra = Yuyutsu, Dhṛtarāṣṭras Sohn von einer Vaiśya-Magd; ihm wird hier offenbar die Reichsverwaltung als Regent für den noch jungen Parikṣit anvertraut, während Parikṣit selbst gemäß V007 zum König geweiht wird.]",[["tataḥ yuyutsum ānāyya","dann Yuyutsu holen lassend (Abs.)"],["pravrajan dharmakāmyayā","im Begriff fortzuziehen, aus Verlangen nach Pflichterfüllung (Part.+Instr.)"],["rājyaṃ paridadau sarvaṃ vaiśyāputre yudhiṣṭhiraḥ","übertrug Yudhiṣṭhira das ganze Königreich dem Sohn der Vaiśya-Frau (3.Sg.Perf.)"]]],["007","abhiṣicya svarājye tu taṃ rājānaṃ parikṣitam duḥkhārtaś cābravīd rājā subhadrāṃ pāṇḍavāgrajaḥ","Nachdem er jenen Parikṣit in seinem eigenen Königreich zum König geweiht hatte, sprach der von Schmerz geplagte König, der älteste der Pāṇḍavas, zu Subhadrā:","",[["abhiṣicya svarājye tu taṃ rājānaṃ parikṣitam","nachdem er jenen Parikṣit in seinem eigenen Königreich zum König geweiht hatte (Abs.+Akk.)"],["duḥkhārtaḥ ca abravīt rājā subhadrāṃ pāṇḍavāgrajaḥ","sprach der von Schmerz geplagte König, der älteste der Pāṇḍavas, zu Subhadrā (Nom.Part.+3.Sg.Impf.)"]]],["008","eṣa putrasya te putraḥ kururājo bhaviṣyati yadūnāṃ pariśeṣaś ca vajro rājā kṛtaś ca ha","„Dieser, der Sohn deines Sohnes, wird König der Kurus sein; und der Rest der Yadus - Vajra ist zum König gemacht worden.","",[["eṣa putrasya te putraḥ kururājaḥ bhaviṣyati","dieser, der Sohn deines Sohnes, wird König der Kurus sein (Nom.+3.Sg.Fut.)"],["yadūnāṃ pariśeṣaḥ ca vajraḥ rājā kṛtaḥ ca ha","und der Rest der Yadus - Vajra ist zum König gemacht worden (Gen.+Nom.Part.)"]]],["009","parikṣid dhāstinapure śakraprasthe tu yādavaḥ vajro rājā tvayā rakṣyo mā cādharme manaḥ kṛthāḥ","Parikṣit [regiert] in Hāstinapura, in Śakraprastha aber der Yādava Vajra als König - von dir muss er beschützt werden; richte deinen Sinn nicht auf Unrecht.“","",[["parikṣit hāstinapure","Parikṣit in Hāstinapura (Nom.+Lok.)"],["śakraprasthe tu yādavaḥ vajraḥ rājā","in Śakraprastha aber der Yādava Vajra als König (Lok.+Nom.)"],["tvayā rakṣyaḥ mā ca adharme manaḥ kṛthāḥ","von dir muss er beschützt werden; richte den Sinn nicht auf Unrecht (Instr.+Nom.Part.+Imp.Prohib.)"]]],["010","ity uktvā dharmarājaḥ sa vāsudevasya dhīmataḥ mātulasya ca vṛddhasya rāmādīnāṃ tathaiva ca","Nachdem er dies gesagt hatte, vollzog der Rechtskönig für den weisen Vāsudeva, für den greisen Onkel und ebenso für Rāma und die anderen -","[Anm.: Fortsetzung des Satzes in V011.]",[["iti uktvā dharmarājaḥ saḥ","dies gesagt habend, der Rechtskönig (Abs.+Nom.)"],["vāsudevasya dhīmataḥ mātulasya ca vṛddhasya","für den weisen Vāsudeva, für den greisen Onkel (Gen.)"],["rāmādīnāṃ tathā eva ca","und ebenso für Rāma und die anderen (Gen.)"]]],["011","mātṛbhiḥ saha dharmātmā kṛtvodakam atandritaḥ śrāddhāny uddiśya sarveṣāṃ cakāra vidhivat tadā","- der Rechtschaffene, zusammen mit den Müttern, unermüdlich die Wasserspende vollzogen habend, führte er da für alle die Totenopfer vorschriftsmäßig aus.","",[["mātṛbhiḥ saha dharmātmā kṛtvā udakam atandritaḥ","der Rechtschaffene, zusammen mit den Müttern, unermüdlich die Wasserspende vollzogen habend (Instr.+Abs.)"],["śrāddhāni uddiśya sarveṣāṃ cakāra vidhivat tadā","führte er für alle die Totenopfer vorschriftsmäßig aus (Abs.+3.Sg.Perf.)"]]],["012","dadau ratnāni vāsāṃsi grāmān aśvān rathān api striyaś ca dvijamukhyebhyo gavāṃ śatasahasraśaḥ","Er gab Juwelen, Gewänder, Dörfer, Pferde und auch Wagen, und Dienerinnen an die vornehmsten Brahmanen, und Rinder zu Hunderttausenden.","",[["dadau ratnāni vāsāṃsi grāmān aśvān rathān api","er gab Juwelen, Gewänder, Dörfer, Pferde und auch Wagen (3.Sg.Perf.)"],["striyaḥ ca dvijamukhyebhyaḥ gavāṃ śatasahasraśaḥ","und Dienerinnen an die vornehmsten Brahmanen, und Rinder zu Hunderttausenden (Dat.)"]]],["013","kṛpam abhyarcya ca gurum arthamānapuraskṛtam śiṣyaṃ parikṣitaṃ tasmai dadau bharatasattamaḥ","Und nachdem er den Lehrer Kṛpa, mit Reichtum und Ehre geehrt, verehrt hatte, übergab der Beste der Bharatas ihm seinen Schüler Parikṣit.","",[["kṛpam abhyarcya ca gurum arthamānapuraskṛtam","den Lehrer Kṛpa, mit Reichtum und Ehre geehrt, verehrt habend (Abs.+Akk.Part.)"],["śiṣyaṃ parikṣitaṃ tasmai dadau bharatasattamaḥ","übergab der Beste der Bharatas ihm seinen Schüler Parikṣit (Akk.+3.Sg.Perf.)"]]],["014","tatas tu prakṛtīḥ sarvāḥ samānāyya yudhiṣṭhiraḥ sarvam ācaṣṭa rājarṣiś cikīrṣitam athātmanaḥ","Dann ließ Yudhiṣṭhira alle Untertanen zusammenkommen und teilte, der königliche Weise, sein eigenes Vorhaben vollständig mit.","",[["tataḥ tu prakṛtīḥ sarvāḥ samānāyya yudhiṣṭhiraḥ","dann alle Untertanen zusammenkommen lassend, Yudhiṣṭhira (Abs.)"],["sarvam ācaṣṭa rājarṣiḥ cikīrṣitam atha ātmanaḥ","teilte der königliche Weise sein eigenes Vorhaben vollständig mit (3.Sg.Impf.)"]]],["015","te śrutvaiva vacas tasya paurajānapadā janāḥ bhṛśam udvignamanaso nābhyanandanta tad vacaḥ","Sobald sie sein Wort gehört hatten, waren die Bürger und Landbewohner heftig bestürzten Sinnes und begrüßten dieses Wort nicht mit Freude.","",[["te śrutvā eva vacaḥ tasya paurajānapadāḥ janāḥ","sobald sie sein Wort gehört hatten, die Bürger und Landbewohner (Abs.)"],["bhṛśam udvignamanasaḥ na abhyanandanta tad vacaḥ","heftig bestürzten Sinnes begrüßten sie dieses Wort nicht (Nom.Part.+3.Pl.Impf.)"]]],["016","naivaṃ kartavyam iti te tadocus te narādhipam na ca rājā tathākārṣīt kālaparyāyadharmavit","„So sollst du nicht handeln!“ - das sagten sie da zu dem Herrscher der Menschen; doch der König, der die Pflicht der Zeitenwende kannte, tat es nicht so.","",[["na eva kartavyam iti te tadā ūcuḥ te narādhipam","„So sollst du nicht handeln!“, das sagten sie da zu dem Herrscher der Menschen (direkte Rede+3.Pl.Perf.)"],["na ca rājā tathā akārṣīt kālaparyāyadharmavit","doch der König, der die Pflicht der Zeitenwende kannte, tat es nicht so (3.Sg.Impf.+Nom.)"]]],["017","tato 'numānya dharmātmā paurajānapadaṃ janam gamanāya matiṃ cakre bhrātaraś cāsya te tadā","Da, nachdem der Rechtschaffene die Bürger und Landbewohner überzeugt hatte, richtete er seinen Sinn auf den Aufbruch, und ebenso seine Brüder damals.","",[["tataḥ anumānya dharmātmā paurajānapadaṃ janam","da, die Bürger und Landbewohner überzeugt habend, der Rechtschaffene (Abs.)"],["gamanāya matiṃ cakre bhrātaraḥ ca asya te tadā","richtete er seinen Sinn auf den Aufbruch, und ebenso seine Brüder damals (Dat.+3.Sg.Perf.Med.)"]]],["018","tataḥ sa rājā kauravyo dharmaputro yudhiṣṭhiraḥ utsṛjyābharaṇāny aṅgāj jagṛhe valkalāny uta","Dann legte jener König, der Kauravya, der Sohn des Dharma, Yudhiṣṭhira, seinen Schmuck vom Körper ab und nahm Rindenkleidung an.","",[["tataḥ saḥ rājā kauravyaḥ dharmaputraḥ yudhiṣṭhiraḥ","dann jener König, der Kauravya, der Sohn des Dharma, Yudhiṣṭhira"],["utsṛjya ābharaṇāni aṅgāt jagṛhe valkalāni uta","legte er seinen Schmuck vom Körper ab und nahm Rindenkleidung an (Abs.+3.Sg.Perf.Med.)"]]],["019","bhīmārjunau yamau caiva draupadī ca yaśasvinī tathaiva sarve jagṛhur valkalāni janādhipa","Bhīma und Arjuna, und die Zwillinge, und die ruhmreiche Draupadī - ebenso nahmen alle Rindenkleider an, o Herrscher der Menschen.","",[["bhīmārjunau yamau ca eva draupadī ca yaśasvinī","Bhīma und Arjuna, und die Zwillinge, und die ruhmreiche Draupadī"],["tathā eva sarve jagṛhuḥ valkalāni janādhipa","ebenso nahmen alle Rindenkleider an, o Herrscher der Menschen (3.Pl.Perf.)"]]],["020","vidhivat kārayitveṣṭiṃ naiṣṭhikīṃ bharatarṣabha samutsṛjyāpsu sarve 'gnīn pratasthur narapuṃgavāḥ","Nachdem sie vorschriftsmäßig das abschließende Feueropfer hatten vollziehen lassen, o Stier der Bharatas, ließen die Stiere unter den Männern alle ihre Ritualfeuer ins Wasser fallen und brachen auf.","",[["vidhivat kārayitvā iṣṭiṃ naiṣṭhikīṃ bharatarṣabha","vorschriftsmäßig das abschließende Feueropfer vollziehen lassend, o Stier der Bharatas (Abs.)"],["samutsṛjya apsu sarve agnīn pratasthuḥ narapuṃgavāḥ","ließen alle die Stiere unter den Männern ihre Feuer ins Wasser fallen und brachen auf (Abs.+3.Pl.Perf.)"]]],["021","tataḥ praruruduḥ sarvāḥ striyo dṛṣṭvā nararṣabhān prasthitān draupadīṣaṣṭhān purā dyūtajitān yathā","Da weinten alle Frauen laut, als sie die aufgebrochenen Stiere unter den Männern sahen, mit Draupadī als sechster, wie einst, als sie im Würfelspiel verloren worden waren.","",[["tataḥ praruruduḥ sarvāḥ striyaḥ","da weinten alle Frauen laut (3.Pl.Perf.)"],["dṛṣṭvā nararṣabhān prasthitān draupadīṣaṣṭhān","als sie die aufgebrochenen Stiere unter den Männern sahen, mit Draupadī als sechster (Abs.+Akk.Part.)"],["purā dyūtajitān yathā","wie einst, als sie im Würfelspiel verloren worden waren"]]],["022","harṣo 'bhavac ca sarveṣāṃ bhrātṝṇāṃ gamanaṃ prati yudhiṣṭhiramataṃ jñātvā vṛṣṇikṣayam avekṣya ca","Und Freude erfüllte alle Brüder angesichts des Aufbruchs, als sie Yudhiṣṭhiras Ansicht erkannten und den Untergang der Vṛṣṇis bedachten.","",[["harṣaḥ abhavat ca sarveṣāṃ bhrātṝṇāṃ gamanaṃ prati","und Freude erfüllte alle Brüder angesichts des Aufbruchs (3.Sg.Impf.)"],["yudhiṣṭhiramataṃ jñātvā vṛṣṇikṣayam avekṣya ca","als sie Yudhiṣṭhiras Ansicht erkannten und den Untergang der Vṛṣṇis bedachten (Abs.)"]]],["023","bhrātaraḥ pañca kṛṣṇā ca ṣaṣṭhī śvā caiva saptamaḥ ātmanā saptamo rājā niryayau gajasāhvayāt paurair anugato dūraṃ sarvair antaḥpurais tathā","Die fünf Brüder, und Kṛṣṇā als sechste, und ein Hund als siebter - selbst als siebter zog der König aus Gajasāhvaya fort, weit begleitet von den Bürgern und ebenso vom ganzen Frauengemach.","[Anm.: Gajasāhvaya = Hāstinapura; Kṛṣṇā = Draupadī.]",[["bhrātaraḥ pañca kṛṣṇā ca ṣaṣṭhī śvā ca eva saptamaḥ","die fünf Brüder, und Kṛṣṇā als sechste, und ein Hund als siebter"],["ātmanā saptamaḥ rājā niryayau gajasāhvayāt","selbst als siebter zog der König aus Gajasāhvaya fort (Instr.+3.Sg.Perf.)"],["pauraiḥ anugataḥ dūraṃ sarvaiḥ antaḥpuraiḥ tathā","weit begleitet von den Bürgern und ebenso vom ganzen Frauengemach (Instr.Nom.Part.)"]]],["024","na cainam aśakat kaś cin nivartasveti bhāṣitum nyavartanta tataḥ sarve narā nagaravāsinaḥ","Und niemand vermochte zu ihm zu sagen: „Kehr um!“ - da kehrten alle Bewohner der Stadt um.","[Anm.: Ein verneintes Zitat - niemand brachte es über sich, dies zu sagen; dennoch wörtlich mit 'iti' eingeführt.]",[["na ca enam aśakat kaḥ cit nivartasva iti bhāṣitum","und niemand vermochte zu ihm zu sagen: „Kehr um!“ (3.Sg.Impf.+direkte Rede+Inf.)"],["nyavartanta tataḥ sarve narāḥ nagaravāsinaḥ","da kehrten alle Bewohner der Stadt um (3.Pl.Impf.)"]]],["025","kṛpaprabhṛtayaś caiva yuyutsuṃ paryavārayan viveśa gaṅgāṃ kauravya ulūpī bhujagātmajā","Und Kṛpa und die anderen umringten Yuyutsu; Ulūpī, die Schlangentochter, o Kauravya, ging in die Gaṅgā ein.","",[["kṛpaprabhṛtayaḥ ca eva yuyutsuṃ paryavārayan","und Kṛpa und die anderen umringten Yuyutsu (3.Pl.Impf.)"],["viveśa gaṅgāṃ kauravya ulūpī bhujagātmajā","ging in die Gaṅgā ein, o Kauravya, Ulūpī, die Schlangentochter (3.Sg.Perf.)"]]],["026","citrāṅgadā yayau cāpi maṇipūrapuraṃ prati śiṣṭāḥ parikṣitaṃ tv anyā mātaraḥ paryavārayan","Und Citrāṅgadā zog fort in Richtung der Stadt Maṇipūra; die übrigen Mütter aber umringten Parikṣit.","",[["citrāṅgadā yayau ca api maṇipūrapuraṃ prati","und Citrāṅgadā zog fort in Richtung der Stadt Maṇipūra (3.Sg.Perf.)"],["śiṣṭāḥ parikṣitaṃ tu anyāḥ mātaraḥ paryavārayan","die übrigen Mütter aber umringten Parikṣit (3.Pl.Impf.)"]]],["027","pāṇḍavāś ca mahātmāno draupadī ca yaśasvinī kṛtopavāsāḥ kauravya prayayuḥ prāṅmukhās tataḥ","Die hochgesinnten Pāṇḍavas und die ruhmreiche Draupadī, nachdem sie gefastet hatten, o Kauravya, zogen dann nach Osten gewandt fort.","",[["pāṇḍavāḥ ca mahātmānaḥ draupadī ca yaśasvinī","die hochgesinnten Pāṇḍavas und die ruhmreiche Draupadī"],["kṛtopavāsāḥ kauravya prayayuḥ prāṅmukhāḥ tataḥ","nachdem sie gefastet hatten, o Kauravya, zogen sie dann nach Osten gewandt fort (Nom.Part.+3.Pl.Perf.)"]]],["028","yogayuktā mahātmānas tyāgadharmam upeyuṣaḥ abhijagmur bahūn deśān saritaḥ parvatāṃs tathā","Im Yoga geeint, die Hochgesinnten, zur Pflicht der Entsagung gelangt, durchzogen sie viele Länder, Flüsse und ebenso Berge.","",[["yogayuktāḥ mahātmānaḥ tyāgadharmam upeyuṣaḥ","im Yoga geeint, die Hochgesinnten, zur Pflicht der Entsagung gelangt (Nom.Part.)"],["abhijagmuḥ bahūn deśān saritaḥ parvatān tathā","durchzogen sie viele Länder, Flüsse und ebenso Berge (3.Pl.Perf.)"]]],["029","yudhiṣṭhiro yayāv agre bhīmas tu tadanantaram arjunas tasya cānv eva yamau caiva yathākramam","Yudhiṣṭhira ging voran, Bhīma unmittelbar danach, Arjuna ihm nach, und die Zwillinge der Reihe nach.","",[["yudhiṣṭhiraḥ yayau agre","Yudhiṣṭhira ging voran (3.Sg.Perf.)"],["bhīmaḥ tu tadanantaram arjunaḥ tasya ca anu eva","Bhīma unmittelbar danach, Arjuna ihm nach"],["yamau ca eva yathākramam","und die Zwillinge der Reihe nach"]]],["030","pṛṣṭhatas tu varārohā śyāmā padmadalekṣaṇā draupadī yoṣitāṃ śreṣṭhā yayau bharatasattama","Dahinter aber ging die schöngeformte, dunkle, mit lotusblattgleichen Augen, Draupadī, die Beste der Frauen, o Bester der Bharatas.","",[["pṛṣṭhataḥ tu varārohā śyāmā padmadalekṣaṇā","dahinter aber die schöngeformte, dunkle, mit lotusblattgleichen Augen"],["draupadī yoṣitāṃ śreṣṭhā yayau bharatasattama","ging Draupadī, die Beste der Frauen, o Bester der Bharatas (3.Sg.Perf.)"]]],["031","śvā caivānuyayāv ekaḥ pāṇḍavān prasthitān vane krameṇa te yayur vīrā lauhityaṃ salilārṇavam","Und ein Hund allein folgte den in den Wald aufgebrochenen Pāṇḍavas; nach und nach zogen die Helden zum Lauhitya, dem Wasserozean.","[Anm.: Lauhitya vermutlich der Fluss Brahmaputra bzw. das östliche Meer - passt zur zuvor genannten Marschrichtung nach Osten.]",[["śvā ca eva anuyayau ekaḥ pāṇḍavān prasthitān vane","und ein Hund allein folgte den in den Wald aufgebrochenen Pāṇḍavas (3.Sg.Impf.)"],["krameṇa te yayuḥ vīrāḥ lauhityaṃ salilārṇavam","nach und nach zogen die Helden zum Lauhitya, dem Wasserozean (3.Pl.Perf.)"]]],["032","gāṇḍīvaṃ ca dhanur divyaṃ na mumoca dhanaṃjayaḥ ratnalobhān mahārāja tau cākṣayyau maheṣudhī","Und den göttlichen Bogen Gāṇḍīva ließ Dhanaṃjaya nicht los, aus Verlangen nach dem Juwel, o Großkönig, und auch nicht die beiden unerschöpflichen großen Köcher.","",[["gāṇḍīvaṃ ca dhanuḥ divyaṃ na mumoca dhanaṃjayaḥ","und den göttlichen Bogen Gāṇḍīva ließ Dhanaṃjaya nicht los (Akk.+3.Sg.Perf.)"],["ratnalobhān mahārāja","aus Verlangen nach dem Juwel, o Großkönig (Abl.)"],["tau ca akṣayyau maheṣudhī","und auch nicht die beiden unerschöpflichen großen Köcher"]]],["033","agniṃ te dadṛśus tatra sthitaṃ śailam ivāgrataḥ mārgam āvṛtya tiṣṭhantaṃ sākṣāt puruṣavigraham","Dort sahen sie Agni, wie einen Berg dastehend, vor ihnen den Weg versperrend, in leibhaftiger Menschengestalt stehend.","",[["agniṃ te dadṛśuḥ tatra","sie sahen dort Agni (Akk.+3.Pl.Perf.)"],["sthitaṃ śailam iva agrataḥ","wie einen Berg dastehend, vor ihnen (Akk.Part.)"],["mārgam āvṛtya tiṣṭhantaṃ sākṣāt puruṣavigraham","den Weg versperrend, in leibhaftiger Menschengestalt stehend (Abs.+Akk.Part.)"]]],["034","tato devaḥ sa saptārciḥ pāṇḍavān idam abravīt bho bho pāṇḍusutā vīrāḥ pāvakaṃ māṃ vibodhata","Da sprach jener Gott mit den sieben Flammen zu den Pāṇḍavas dies: „Ho, ho, ihr Helden, Söhne des Pāṇḍu, erkennt mich, das Feuer!","",[["tataḥ devaḥ saḥ saptārciḥ pāṇḍavān idam abravīt","da sprach jener Gott mit den sieben Flammen zu den Pāṇḍavas dies (Nom.+3.Sg.Impf.)"],["bho bho pāṇḍusutāḥ vīrāḥ","ho, ho, ihr Helden, Söhne des Pāṇḍu (Vok.)"],["pāvakaṃ māṃ vibodhata","erkennt mich, das Feuer (Imp.Pl.)"]]],["035","yudhiṣṭhira mahābāho bhīmasena paraṃtapa arjunāśvisutau vīrau nibodhata vaco mama","Yudhiṣṭhira, Starkarmiger, Bhīmasena, Bezwinger der Feinde, Arjuna, und ihr beiden Helden, Söhne der Aśvins - vernehmt mein Wort.","",[["yudhiṣṭhira mahābāho","Yudhiṣṭhira, Starkarmiger (Vok.)"],["bhīmasena paraṃtapa arjuna","Bhīmasena, Bezwinger der Feinde, Arjuna (Vok.)"],["aśvisutau vīrau nibodhata vaco mama","und ihr beiden Helden, Söhne der Aśvins, vernehmt mein Wort (Vok.+Imp.Pl.)"]]],["036","aham agniḥ kuruśreṣṭhā mayā dagdhaṃ ca khāṇḍavam arjunasya prabhāveṇa tathā nārāyaṇasya ca","Ich bin Agni, o Beste der Kurus; von mir wurde der Khāṇḍava-Wald verbrannt, durch die Macht Arjunas und ebenso Nārāyaṇas.","",[["aham agniḥ kuruśreṣṭhāḥ","ich bin Agni, o Beste der Kurus (1.Sg.Präs.+Vok.)"],["mayā dagdhaṃ ca khāṇḍavam","von mir wurde der Khāṇḍava-Wald verbrannt (Instr.+Nom.Part.)"],["arjunasya prabhāveṇa tathā nārāyaṇasya ca","durch die Macht Arjunas und ebenso Nārāyaṇas [Kṛṣṇas] (Gen.+Instr.)"]]],["037","ayaṃ vaḥ phalguno bhrātā gāṇḍīvaṃ paramāyudham parityajya vanaṃ yātu nānenārtho 'sti kaś cana","Dieser euer Bruder Phalguna soll Gāṇḍīva, die höchste Waffe, aufgeben und dann in den Wald ziehen; es besteht kein weiterer Nutzen mehr damit.","",[["ayaṃ vaḥ phalgunaḥ bhrātā","dieser euer Bruder Phalguna [Arjuna] (Nom.)"],["gāṇḍīvaṃ paramāyudham parityajya vanaṃ yātu","soll Gāṇḍīva, die höchste Waffe, aufgeben und in den Wald ziehen (Abs.+Imp.)"],["na anena arthaḥ asti kaḥ cana","es besteht kein weiterer Nutzen mehr damit (Instr.+3.Sg.Präs.)"]]],["038","cakraratnaṃ tu yat kṛṣṇe sthitam āsīn mahātmani gataṃ tac ca punar haste kālenaiṣyati tasya ha","Das Diskus-Juwel aber, das im hochgesinnten Kṛṣṇa geruht hatte, ist nun fort; und es wird mit der Zeit wieder in seine Hand kommen.","[Anm.: Angedeutet ist eine künftige Wiedergeburt/Wiederkehr Kṛṣṇas, in dessen Hand der Diskus dereinst zurückkehren werde.]",[["cakraratnaṃ tu yat kṛṣṇe sthitam āsīt mahātmani","das Diskus-Juwel aber, das im hochgesinnten Kṛṣṇa geruht hatte (Nom.+3.Sg.Impf.)"],["gataṃ tat ca punaḥ haste kālena eṣyati tasya ha","ist nun fort; und es wird mit der Zeit wieder in seine Hand kommen (Nom.Part.+3.Sg.Fut.)"]]],["039","varuṇād āhṛtaṃ pūrvaṃ mayaitat pārthakāraṇāt gāṇḍīvaṃ kārmukaśreṣṭhaṃ varuṇāyaiva dīyatām","Von Varuṇa wurde dies einst von mir geholt, um Pārthas willen - Gāṇḍīva, der beste der Bögen; es soll nun eben Varuṇa zurückgegeben werden.“","",[["varuṇāt āhṛtaṃ pūrvaṃ mayā etat pārthakāraṇāt","von Varuṇa wurde dies einst von mir geholt, um Pārthas willen (Abl.+Instr.+Abl.)"],["gāṇḍīvaṃ kārmukaśreṣṭhaṃ varuṇāya eva dīyatām","Gāṇḍīva, der beste der Bögen, soll eben Varuṇa zurückgegeben werden (Nom.+Imp.Pass.)"]]],["040","tatas te bhrātaraḥ sarve dhanaṃjayam acodayan sa jale prākṣipat tat tu tathākṣayyau maheṣudhī","Da drängten ihn alle seine Brüder, Dhanaṃjaya; er warf es ins Wasser, und ebenso die beiden unerschöpflichen großen Köcher.","",[["tataḥ te bhrātaraḥ sarve dhanaṃjayam acodayan","da drängten ihn alle seine Brüder, Dhanaṃjaya (3.Pl.Impf.)"],["saḥ jale prākṣipat tat tu tathā akṣayyau maheṣudhī","er warf es ins Wasser, und ebenso die beiden unerschöpflichen großen Köcher (3.Sg.Impf.)"]]],["041","tato 'gnir bharataśreṣṭha tatraivāntaradhīyata yayuś ca pāṇḍavā vīrās tatas te dakṣiṇāmukhāḥ","Da verschwand Agni, o Bester der Bharatas, eben dort; und die Helden, die Pāṇḍavas, zogen dann nach Süden gewandt weiter.","",[["tataḥ agniḥ bharataśreṣṭha tatra eva antaradhīyata","da verschwand Agni, o Bester der Bharatas, eben dort (3.Sg.Impf.Pass.)"],["yayuḥ ca pāṇḍavāḥ vīrāḥ tataḥ te dakṣiṇāmukhāḥ","und die Helden, die Pāṇḍavas, zogen dann nach Süden gewandt weiter (3.Pl.Perf.)"]]],["042","tatas te tūttareṇaiva tīreṇa lavaṇāmbhasaḥ jagmur bharataśārdūla diśaṃ dakṣiṇapaścimam","Dann zogen sie, am nördlichen Ufer des salzigen Meeres entlang, o Tiger der Bharatas, in südwestliche Richtung.","",[["tataḥ te tu uttareṇa eva tīreṇa lavaṇāmbhasaḥ","dann sie, am nördlichen Ufer des salzigen Meeres entlang (Instr.)"],["jagmuḥ bharataśārdūla diśaṃ dakṣiṇapaścimam","zogen sie, o Tiger der Bharatas, in südwestliche Richtung (3.Pl.Perf.)"]]],["043","tataḥ punaḥ samāvṛttāḥ paścimāṃ diśam eva te dadṛśur dvārakāṃ cāpi sāgareṇa pariplutām","Dann wandten sie sich wieder um, geradewegs in westliche Richtung, und sahen auch Dvārakā, vom Ozean überflutet.","",[["tataḥ punaḥ samāvṛttāḥ paścimāṃ diśam eva te","dann wandten sie sich wieder um, geradewegs in westliche Richtung (Nom.Part.)"],["dadṛśuḥ dvārakāṃ ca api sāgareṇa pariplutām","und sahen auch Dvārakā, vom Ozean überflutet (3.Pl.Perf.+Akk.Part.)"]]],["044","udīcīṃ punar āvṛttya yayur bharatasattamāḥ prādakṣiṇyaṃ cikīrṣantaḥ pṛthivyā yogadharmiṇaḥ","Wieder nach Norden gewandt, zogen die Besten der Bharatas weiter, die Umwandlung der Erde im Uhrzeigersinn vollziehend, im Yoga der Pflicht gefestigt.","",[["udīcīṃ punaḥ āvṛttya yayuḥ bharatasattamāḥ","wieder nach Norden gewandt, zogen die Besten der Bharatas weiter (Abs.+3.Pl.Perf.)"],["prādakṣiṇyaṃ cikīrṣantaḥ pṛthivyā yogadharmiṇaḥ","die Umwandlung der Erde im Uhrzeigersinn zu vollziehen suchend, im Yoga der Pflicht gefestigt (Part.+Nom.)"]]]]},{"num":2,"title_sa":"","title_de":"Der Fall der Geschwister","note":"","units":[["001","vaiśaṃpāyana uvāca tatas te niyatātmāna udīcīṃ diśam āsthitāḥ dadṛśur yogayuktāś ca himavantaṃ mahāgirim","Vaiśaṃpāyana sprach: Dann, selbstbeherrscht, in nördlicher Richtung weiterziehend, sahen sie, im Yoga geeint, den großen Berg Himavant.","",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana sprach (3.Sg.Perf.)"],["tataḥ te niyatātmānaḥ udīcīṃ diśam āsthitāḥ","dann, selbstbeherrscht, in nördlicher Richtung weiterziehend (Nom.Part.)"],["dadṛśuḥ yogayuktāḥ ca himavantaṃ mahāgirim","sahen sie, im Yoga geeint, den großen Berg Himavant (3.Pl.Perf.)"]]],["002","taṃ cāpy atikramantas te dadṛśur vālukārṇavam avaikṣanta mahāśailaṃ meruṃ śikhariṇāṃ varam","Und ihn überschreitend, sahen sie das Sandmeer; sie erblickten den großen Fels Meru, den besten der Gipfel.","",[["taṃ ca api atikramantaḥ te dadṛśuḥ vālukārṇavam","und ihn überschreitend, sahen sie das Sandmeer (Part.+3.Pl.Perf.)"],["avaikṣanta mahāśailaṃ meruṃ śikhariṇāṃ varam","sie erblickten den großen Fels Meru, den besten der Gipfel (3.Pl.Impf.)"]]],["003","teṣāṃ tu gacchatāṃ śīghraṃ sarveṣāṃ yogadharmiṇām yājñasenī bhraṣṭayogā nipapāta mahītale","Während sie aber alle rasch dahinzogen, im Yoga der Pflicht gefestigt, fiel Yājñasenī, vom Yoga abgefallen, zu Boden.","[Anm.: Yājñasenī = Draupadī.]",[["teṣāṃ tu gacchatāṃ śīghraṃ sarveṣāṃ yogadharmiṇām","während sie aber alle rasch dahinzogen, im Yoga der Pflicht gefestigt (Gen.Abs.)"],["yājñasenī bhraṣṭayogā nipapāta mahītale","fiel Yājñasenī, vom Yoga abgefallen, zu Boden (Nom.Part.+3.Sg.Perf.)"]]],["004","tāṃ tu prapatitāṃ dṛṣṭvā bhīmaseno mahābalaḥ uvāca dharmarājānaṃ yājñasenīm avekṣya ha","Als er sie aber fallen sah, sprach Bhīmasena, der Gewaltige, zum Rechtskönig, Yājñasenī betrachtend:","",[["tāṃ tu prapatitāṃ dṛṣṭvā bhīmasenaḥ mahābalaḥ","als er sie aber fallen sah, Bhīmasena, der Gewaltige (Abs.+Nom.)"],["uvāca dharmarājānaṃ yājñasenīm avekṣya ha","sprach zum Rechtskönig, Yājñasenī betrachtend (3.Sg.Perf.+Abs.)"]]],["005","nādharmaś caritaḥ kaś cid rājaputryā paraṃtapa kāraṇaṃ kiṃ nu tad rājan yat kṛṣṇā patitā bhuvi","„Kein Unrecht wurde von der Königstochter begangen, Bezwinger der Feinde; was ist denn der Grund, o König, dass Kṛṣṇā zu Boden gefallen ist?“","",[["na adharmaḥ caritaḥ kaḥ cid rājaputryā paraṃtapa","kein Unrecht wurde von der Königstochter begangen, Bezwinger der Feinde (Nom.Part.+Instr.)"],["kāraṇaṃ kim nu tad rājan","was ist denn der Grund, o König"],["yat kṛṣṇā patitā bhuvi","dass Kṛṣṇā zu Boden gefallen ist (Nom.Part.)"]]],["006","yudhiṣṭhira uvāca pakṣapāto mahān asyā viśeṣeṇa dhanaṃjaye tasyaitat phalam adyaiṣā bhuṅkte puruṣasattama","Yudhiṣṭhira sprach: „Sie hatte eine große Vorliebe, besonders für Dhanaṃjaya; dafür erntet sie heute diese Frucht, Bester der Männer.“","",[["yudhiṣṭhiraḥ uvāca","Yudhiṣṭhira sprach (3.Sg.Perf.)"],["pakṣapātaḥ mahān asyāḥ viśeṣeṇa dhanaṃjaye","sie hatte eine große Vorliebe, besonders für Dhanaṃjaya (Nom.+Lok.)"],["tasya etat phalam adya eṣā bhuṅkte puruṣasattama","dafür erntet sie heute diese Frucht, Bester der Männer (Akk.+3.Sg.Präs.)"]]],["007","vaiśaṃpāyana uvāca evam uktvānavekṣyaināṃ yayau dharmasuto nṛpaḥ samādhāya mano dhīmān dharmātmā puruṣarṣabhaḥ","Vaiśaṃpāyana sprach: So gesprochen habend, zog der König, der Sohn des Dharma, ohne sie weiter anzusehen, weiter, den Sinn gesammelt, der Weise, der Rechtschaffene, der Stier unter den Männern.","",[["evam uktvā anavekṣya enāṃ yayau dharmasutaḥ nṛpaḥ","so gesprochen habend, ohne sie anzusehen, zog der König, der Sohn des Dharma, weiter (Abs.+3.Sg.Perf.)"],["samādhāya manaḥ dhīmān dharmātmā puruṣarṣabhaḥ","den Sinn gesammelt, der Weise, der Rechtschaffene, der Stier unter den Männern (Abs.+Nom.)"]]],["008","sahadevas tato dhīmān nipapāta mahītale taṃ cāpi patitaṃ dṛṣṭvā bhīmo rājānam abravīt","Dann fiel der weise Sahadeva zu Boden; als er auch ihn fallen sah, sprach Bhīma zum König:","",[["sahadevaḥ tataḥ dhīmān nipapāta mahītale","dann fiel der weise Sahadeva zu Boden (3.Sg.Perf.)"],["taṃ ca api patitaṃ dṛṣṭvā bhīmaḥ rājānam abravīt","als er auch ihn fallen sah, sprach Bhīma zum König (Abs.+3.Sg.Impf.)"]]],["009","yo 'yam asmāsu sarveṣu śuśrūṣur anahaṃkṛtaḥ so 'yaṃ mādravatīputraḥ kasmān nipatito bhuvi","„Er, der uns allen stets dienstbereit war, ohne Hochmut - dieser Sohn der Mādravatī, warum ist er zu Boden gefallen?“","",[["yaḥ ayam asmāsu sarveṣu śuśrūḥ anahaṃkṛtaḥ","er, der uns allen dienstbereit war, ohne Hochmut (Nom.Part.)"],["saḥ ayaṃ mādravatīputraḥ kasmāt nipatitaḥ bhuvi","dieser Sohn der Mādravatī, warum ist er zu Boden gefallen (Nom.+3.Sg.Perf.Part.)"]]],["010","yudhiṣṭhira uvāca ātmanaḥ sadṛśaṃ prājñaṃ naiṣo 'manyata kaṃ cana tena doṣeṇa patitas tasmād eṣa nṛpātmajaḥ","Yudhiṣṭhira sprach: „Er hielt niemanden für sich selbst an Weisheit ebenbürtig; durch diesen Fehler ist dieser Königssohn gefallen.“","",[["ātmanaḥ sadṛśaṃ prājñaṃ na eṣaḥ amanyata kaṃ cana","er hielt niemanden für sich selbst an Weisheit ebenbürtig (Akk.+3.Sg.Impf.Med.)"],["tena doṣeṇa patitaḥ tasmāt eṣa nṛpātmajaḥ","durch diesen Fehler ist dieser Königssohn gefallen (Instr.+Nom.Part.)"]]],["011","vaiśaṃpāyana uvāca ity uktvā tu samutsṛjya sahadevaṃ yayau tadā bhrātṛbhiḥ saha kaunteyaḥ śunā caiva yudhiṣṭhiraḥ","Vaiśaṃpāyana sprach: Dies gesagt habend, verließ Yudhiṣṭhira, der Sohn der Kuntī, den Sahadeva und zog da weiter, zusammen mit den Brüdern und dem Hund.","",[["iti uktvā tu samutsṛjya sahadevaṃ yayau tadā","dies gesagt habend, den Sahadeva verlassend, zog er da weiter (Abs.+3.Sg.Perf.)"],["bhrātṛbhiḥ saha kaunteyaḥ śunā ca eva yudhiṣṭhiraḥ","zusammen mit den Brüdern und dem Hund, der Sohn der Kuntī, Yudhiṣṭhira (Instr.)"]]],["012","kṛṣṇāṃ nipatitāṃ dṛṣṭvā sahadevaṃ ca pāṇḍavam ārto bandhupriyaḥ śūro nakulo nipapāta ha","Als er Kṛṣṇā fallen sah und den Pāṇḍava Sahadeva, fiel der schmerzerfüllte, seinen Verwandten zugetane Held Nakula ebenfalls hin.","",[["kṛṣṇāṃ nipatitāṃ dṛṣṭvā sahadevaṃ ca pāṇḍavam","als er Kṛṣṇā fallen sah und den Pāṇḍava Sahadeva (Abs.+Akk.Part.)"],["ārtaḥ bandhupriyaḥ śūraḥ nakulaḥ nipapāta ha","fiel der schmerzerfüllte, seinen Verwandten zugetane Held Nakula ebenfalls hin (Nom.+3.Sg.Perf.)"]]],["013","tasmin nipatite vīre nakule cārudarśane punar eva tadā bhīmo rājānam idam abravīt","Als jener Held Nakula, von schönem Aussehen, gefallen war, sprach Bhīma da wiederum dies zum König:","",[["tasmin nipatite vīre nakule cārudarśane","als jener Held Nakula, von schönem Aussehen, gefallen war (Lok.Abs.)"],["punaḥ eva tadā bhīmaḥ rājānam idam abravīt","sprach Bhīma da wiederum dies zum König (3.Sg.Impf.)"]]],["014","yo 'yam akṣatadharmātmā bhrātā vacanakārakaḥ rūpeṇāpratimo loke nakulaḥ patito bhuvi","„Dieser Bruder, dessen Pflichtgefühl unverletzt war, der stets gehorsam war, an Schönheit in der Welt unvergleichlich - Nakula ist zu Boden gefallen.“","",[["yaḥ ayam akṣatadharmātmā bhrātā vacanakārakaḥ","dieser Bruder, dessen Pflichtgefühl unverletzt war, der gehorsam war (Nom.Part.)"],["rūpeṇa apratimaḥ loke nakulaḥ patitaḥ bhuvi","an Schönheit in der Welt unvergleichlich - Nakula ist zu Boden gefallen (Instr.+Nom.Part.)"]]],["015","ity ukto bhīmasenena pratyuvāca yudhiṣṭhiraḥ nakulaṃ prati dharmātmā sarvabuddhimatāṃ varaḥ","So von Bhīmasena angesprochen, erwiderte Yudhiṣṭhira, der Rechtschaffene, der Beste aller Verständigen, in Bezug auf Nakula:","",[["iti uktaḥ bhīmasenena pratyuvāca yudhiṣṭhiraḥ","so von Bhīmasena angesprochen, erwiderte Yudhiṣṭhira (Nom.Part.+3.Sg.Perf.)"],["nakulaṃ prati dharmātmā sarvabuddhimatāṃ varaḥ","in Bezug auf Nakula, der Rechtschaffene, der Beste aller Verständigen"]]],["016","rūpeṇa matsamo nāsti kaś cid ity asya darśanam adhikaś cāham evaika ity asya manasi sthitam","„Es gebe niemanden, der an Schönheit mir gleichkommt - das war seine Ansicht; und dass ich allein überlegen sei, das stand in seinem Sinn fest.","",[["rūpeṇa matsamaḥ na asti kaḥ cit iti asya darśanam","es gebe niemanden, der an Schönheit mir gleichkommt - das war seine Ansicht (direkte Rede+Nom.)"],["adhikaḥ ca aham eva eka iti asya manasi sthitam","und dass ich allein überlegen sei, das stand in seinem Sinn fest (direkte Rede+Lok.+Nom.Part.)"]]],["017","nakulaḥ patitas tasmād āgaccha tvaṃ vṛkodara yasya yad vihitaṃ vīra so 'vaśyaṃ tad upāśnute","Deshalb ist Nakula gefallen; komm du, Vṛkodara; wem was bestimmt ist, Held, der genießt es unweigerlich.“","",[["nakulaḥ patitaḥ tasmāt āgaccha tvaṃ vṛkodara","deshalb ist Nakula gefallen; komm du, Vṛkodara [Bhīma] (Nom.Part.+Imp.)"],["yasya yad vihitaṃ vīra saḥ avaśyaṃ tad upāśnute","wem was bestimmt ist, Held, der genießt es unweigerlich (Gen.+3.Sg.Präs.)"]]],["018","tāṃs tu prapatitān dṛṣṭvā pāṇḍavaḥ śvetavāhanaḥ papāta śokasaṃtaptas tato 'nu paravīrahā","Als er sie aber gefallen sah, fiel der Pāṇḍava mit den weißen Rossen, von Kummer versengt, der Bezwinger feindlicher Helden, danach ebenfalls hin.","[Anm.: Śvetavāhana = Beiname Arjunas.]",[["tān tu prapatitān dṛṣṭvā pāṇḍavaḥ śvetavāhanaḥ","als er sie aber gefallen sah, der Pāṇḍava mit den weißen Rossen [Arjuna] (Abs.+Nom.)"],["papāta śokasaṃtaptaḥ tataḥ anu paravīrahā","fiel, von Kummer versengt, danach ebenfalls hin, der Bezwinger feindlicher Helden (3.Sg.Perf.)"]]],["019","tasmiṃs tu puruṣavyāghre patite śakratejasi mriyamāṇe durādharṣe bhīmo rājānam abravīt","Als jener Tiger unter den Männern, von Śakras Glanz, unbezwingbar, gefallen war und im Sterben lag, sprach Bhīma zum König:","",[["tasmin tu puruṣavyāghre patite śakratejasi","als jener Tiger unter den Männern, von Śakras Glanz, gefallen war (Lok.Abs.)"],["mriyamāṇe durādharṣe bhīmaḥ rājānam abravīt","im Sterben liegend, unbezwingbar, sprach Bhīma zum König (Lok.Part.+3.Sg.Impf.)"]]],["020","anṛtaṃ na smarāmy asya svaireṣv api mahātmanaḥ atha kasya vikāro 'yaṃ yenāyaṃ patito bhuvi","„Ich erinnere mich an keine Unwahrheit von ihm, dem Hochgesinnten, selbst nicht in seinen zwanglosen Reden; was ist denn diese Verfehlung, durch die er zu Boden gefallen ist?“","",[["anṛtaṃ na smarāmi asya svaireṣu api mahātmanaḥ","ich erinnere mich an keine Unwahrheit von ihm, dem Hochgesinnten, selbst nicht in zwanglosen [Reden] (1.Sg.Präs.+Gen.)"],["atha kasya vikāraḥ ayaṃ yena ayaṃ patitaḥ bhuvi","was ist denn diese Verfehlung, durch die er zu Boden gefallen ist"]]],["021","yudhiṣṭhira uvāca ekāhnā nirdaheyaṃ vai śatrūn ity arjuno 'bravīt na ca tat kṛtavān eṣa śūramānī tato 'patat","Yudhiṣṭhira sprach: „‚Ich werde die Feinde an einem einzigen Tag verbrennen‘ - so sprach einst Arjuna; und doch tat er dies nicht, er, der sich für einen Helden hielt - deshalb fiel er herab.","",[["yudhiṣṭhiraḥ uvāca","Yudhiṣṭhira sprach (3.Sg.Perf.)"],["ekāhnā nirdaheyam vai śatrūn iti arjunaḥ abravīt","„ich werde die Feinde an einem einzigen Tag verbrennen“ - so sprach Arjuna (Instr.+1.Sg.Opt.+direkte Rede+3.Sg.Impf.)"],["na ca tat kṛtavān eṣa śūramānī tataḥ apatat","und doch tat er dies nicht, er, der sich für einen Helden hielt - deshalb fiel er (Nom.Part.+3.Sg.Impf.)"]]],["022","avamene dhanur grāhān eṣa sarvāṃś ca phalgunaḥ yathā coktaṃ tathā caiva kartavyaṃ bhūtim icchatā","Er, Phalguna, verachtete auch alle anderen Bogenträger; wie einmal gesagt wurde, so muss es auch getan werden von dem, der Wohlergehen wünscht.“","",[["avamene dhanurgrāhān eṣaḥ sarvān ca phalgunaḥ","er, Phalguna, verachtete auch alle Bogenträger (3.Sg.Impf.Med.)"],["yathā ca uktaṃ tathā eva kartavyaṃ bhūtim icchatā","wie gesagt wurde, so muss es auch getan werden von dem, der Wohlergehen wünscht (Nom.Part.+Ger.+Instr.Part.)"]]],["023","vaiśaṃpāyana uvāca ity uktvā prasthito rājā bhīmo 'tha nipapāta ha patitaś cābravīd bhīmo dharmarājaṃ yudhiṣṭhiram","Vaiśaṃpāyana sprach: Dies gesagt habend, zog der König weiter; da fiel auch Bhīma hin, und der gefallene Bhīma sprach zum Rechtskönig Yudhiṣṭhira:","",[["iti uktvā prasthitaḥ rājā","dies gesagt habend, zog der König weiter (Abs.+Nom.Part.)"],["bhīmaḥ atha nipapāta ha","da fiel auch Bhīma hin (3.Sg.Perf.)"],["patitaḥ ca abravīt bhīmaḥ dharmarājaṃ yudhiṣṭhiram","und der gefallene Bhīma sprach zum Rechtskönig Yudhiṣṭhira (Nom.Part.+3.Sg.Impf.)"]]],["024","bho bho rājann avekṣasva patito 'haṃ priyas tava kiṃnimittaṃ ca patanaṃ brūhi me yadi vettha ha","„Ho, ho, König, sieh her! Ich bin gefallen, dir lieb; und sage mir, aus welchem Grund ich falle, wenn du es weißt.“","",[["bho bho rājan avekṣasva","ho, ho, König, sieh her (Vok.+Imp.)"],["patitaḥ aham priyaḥ tava","ich bin gefallen, dir lieb (Nom.Part.)"],["kiṃnimittaṃ ca patanaṃ brūhi me yadi vettha ha","und sage mir, aus welchem Grund [ich] falle, wenn du es weißt (Imp.+2.Sg.Perf.)"]]],["025","yudhiṣṭhira uvāca atibhuktaṃ ca bhavatā prāṇena ca vikatthase anavekṣya paraṃ pārtha tenāsi patitaḥ kṣitau","Yudhiṣṭhira sprach: „Zu viel hast du gegessen, und du prahlst mit deiner Kraft, ohne auf andere Rücksicht zu nehmen, Pārtha; deswegen bist du zu Boden gefallen.“","",[["atibhuktaṃ ca bhavatā","zu viel hast du gegessen (Nom.Part.+Instr.)"],["prāṇena ca vikatthase anavekṣya paraṃ pārtha","und du prahlst mit deiner Kraft, ohne auf andere Rücksicht zu nehmen, Pārtha (Instr.+2.Sg.Präs.+Abs.)"],["tena asi patitaḥ kṣitau","deswegen bist du zu Boden gefallen (2.Sg.Präs.+Nom.Part.)"]]],["026","vaiśaṃpāyana uvāca ity uktvā taṃ mahābāhur jagāmānavalokayan śvā tv eko 'nuyayau yas te bahuśaḥ kīrtito mayā","Vaiśaṃpāyana sprach: Dies zu ihm gesagt habend, zog der Starkarmige weiter, ohne sich umzusehen; nur der Hund allein folgte ihm, der dir schon oft von mir genannt wurde.","",[["iti uktvā taṃ mahābāhuḥ jagāma anavalokayan","dies zu ihm gesagt habend, zog der Starkarmige weiter, ohne sich umzusehen (Abs.+3.Sg.Perf.+Part.)"],["śvā tu ekaḥ anuyayau yaḥ te bahuśaḥ kīrtitaḥ mayā","nur der Hund allein folgte ihm, der dir schon oft von mir genannt wurde (Nom.+3.Sg.Impf.+Nom.Part.)"]]]]},{"num":3,"title_sa":"","title_de":"Der Hundetest und der Aufstieg in den Himmel","note":"","units":[["001","vaiśaṃpāyana uvāca tataḥ saṃnādayañ śakro divaṃ bhūmiṃ ca sarvaśaḥ rathenopayayau pārtham ārohety abravīc ca tam","Vaiśaṃpāyana sprach: Dann kam Śakra, Himmel und Erde ringsum erschallen lassend, mit dem Wagen zu dem Pārtha heran und sprach zu ihm: „Steig ein!“","",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana sprach (3.Sg.Perf.)"],["tataḥ saṃnādayan śakraḥ divaṃ bhūmiṃ ca sarvaśaḥ","dann, Himmel und Erde ringsum erschallen lassend, Śakra (Part.+Nom.)"],["rathena upayayau pārtham āroha iti abravīt ca tam","kam mit dem Wagen zum Pārtha und sprach zu ihm: „steig ein!“ (Instr.+3.Sg.Perf.+Imp.+direkte Rede)"]]],["002","sa bhrātṝn patitān dṛṣṭvā dharmarājo yudhiṣṭhiraḥ abravīc chokasaṃtaptaḥ sahasrākṣam idaṃ vacaḥ","Er, seine gefallenen Brüder sehend, der Rechtskönig Yudhiṣṭhira, sprach, von Kummer versengt, dieses Wort zum Tausendäugigen:","",[["sa bhrātṝn patitān dṛṣṭvā dharmarājaḥ yudhiṣṭhiraḥ","er, seine gefallenen Brüder sehend, der Rechtskönig Yudhiṣṭhira (Abs.+Nom.)"],["abravīt śokasaṃtaptaḥ sahasrākṣam idaṃ vacaḥ","sprach, von Kummer versengt, zum Tausendäugigen dieses Wort (3.Sg.Impf.+Nom.Part.+Akk.)"]]],["003","bhrātaraḥ patitā me 'tra āgaccheyur mayā saha na vinā bhrātṛbhiḥ svargam icche gantuṃ sureśvara","„Meine hier gefallenen Brüder - sie sollen mit mir kommen; nicht ohne meine Brüder wünsche ich, in den Himmel zu gehen, Herr der Götter.","",[["bhrātaraḥ patitāḥ me atra āgaccheyuḥ mayā saha","meine hier gefallenen Brüder sollen mit mir kommen (Nom.Part.+3.Pl.Opt.)"],["na vinā bhrātṛbhiḥ svargam icche gantuṃ sureśvara","nicht ohne meine Brüder wünsche ich, in den Himmel zu gehen, Herr der Götter (Instr.+1.Sg.Präs.+Inf.+Vok.)"]]],["004","sukumārī sukhārhā ca rājaputrī puraṃdara sāsmābhiḥ saha gaccheta tad bhavān anumanyatām","Und die zarte, des Glücks würdige Königstochter, Bezwinger der Festungen - sie soll mit uns gehen; das mögest du gewähren.“","[Anm.: Puraṃdara = Beiname Indras.]",[["sukumārī sukhārhā ca rājaputrī puraṃdara","die zarte, des Glücks würdige Königstochter, Bezwinger der Festungen (Nom.+Vok.)"],["sā asmābhiḥ saha gaccheta tad bhavān anumanyatām","sie soll mit uns gehen; das mögest du gewähren (Instr.+3.Sg.Opt.+2.Sg.Opt.)"]]],["005","indra uvāca bhrātṝn drakṣyasi putrāṃs tvam agratas tridivaṃ gatān kṛṣṇayā sahitān sarvān mā śuco bharatarṣabha","Indra sprach: „Du wirst deine Brüder und Söhne sehen, die schon vor dir in den dritten Himmel gegangen sind, alle zusammen mit Kṛṣṇā vereint; gräme dich nicht, Stier der Bharatas.","",[["indraḥ uvāca","Indra sprach (3.Sg.Perf.)"],["bhrātṝn drakṣyasi putrān tvam agrataḥ tridivaṃ gatān","du wirst deine Brüder und Söhne sehen, die schon vor dir in den dritten Himmel gegangen sind (2.Sg.Fut.+Akk.Part.)"],["kṛṣṇayā sahitān sarvān mā śucaḥ bharatarṣabha","alle mit Kṛṣṇā vereint; gräme dich nicht, Stier der Bharatas (Instr.+Akk.Part.+Inj.)"]]],["006","nikṣipya mānuṣaṃ dehaṃ gatās te bharatarṣabha anena tvaṃ śarīreṇa svargaṃ gantā na saṃśayaḥ","Den menschlichen Körper abgelegt habend, sind sie gegangen, Stier der Bharatas; du aber wirst mit eben diesem Körper in den Himmel gehen, ohne Zweifel.“","",[["nikṣipya mānuṣaṃ dehaṃ gatāḥ te bharatarṣabha","den menschlichen Körper abgelegt habend, sind sie gegangen, Stier der Bharatas (Abs.+Nom.Part.)"],["anena tvaṃ śarīreṇa svargaṃ gantā na saṃśayaḥ","du aber wirst mit eben diesem Körper in den Himmel gehen, ohne Zweifel (Instr.+Nom.Part.Fut.)"]]],["007","yudhiṣṭhira uvāca ayaṃ śvā bhūtabhavyeśa bhakto māṃ nityam eva ha sa gaccheta mayā sārdham ānṛśaṃsyā hi me matiḥ","Yudhiṣṭhira sprach: „Dieser Hund, Herr des Gewesenen und Künftigen, ist mir stets ergeben; er soll mit mir zusammen gehen, denn auf Mitleid ist mein Sinn gerichtet.“","",[["yudhiṣṭhiraḥ uvāca","Yudhiṣṭhira sprach (3.Sg.Perf.)"],["ayaṃ śvā bhūtabhavyeśa bhaktaḥ māṃ nityam eva ha","dieser Hund, Herr des Gewesenen und Künftigen, ist mir stets ergeben (Nom.Part.+Vok.)"],["sa gaccheta mayā sārdham ānṛśaṃsyāt hi me matiḥ","er soll mit mir zusammen gehen, denn auf Mitleid ist mein Sinn gerichtet (3.Sg.Opt.+Nom.)"]]],["008","indra uvāca amartyatvaṃ matsamatvaṃ ca rājañ śriyaṃ kṛtsnāṃ mahatīṃ caiva kīrtim saṃprāpto 'dya svargasukhāni ca tvaṃ tyaja śvānaṃ nātra nṛśaṃsam asti","Indra sprach: „Unsterblichkeit, Gleichheit mit mir, o König, vollkommenes, großes Glück und Ruhm, sowie die Freuden des Himmels hast du heute erlangt; verlasse den Hund - darin liegt kein Mitleidsverstoß.“","",[["amartyatvaṃ matsamatvaṃ ca rājan","Unsterblichkeit und Gleichheit mit mir, o König (Akk.+Vok.)"],["śriyaṃ kṛtsnāṃ mahatīṃ ca eva kīrtim saṃprāptaḥ adya svargasukhāni ca tvam","vollkommenes, großes Glück und Ruhm, sowie die Freuden des Himmels hast du heute erlangt (Akk.+Nom.Part.+Nom.)"],["tyaja śvānaṃ na atra nṛśaṃsam asti","verlasse den Hund - darin liegt kein Mitleidsverstoß (Imp.+3.Sg.Präs.)"]]],["009","yudhiṣṭhira uvāca anāryam āryeṇa sahasranetra śakyaṃ kartuṃ duṣkaram etad ārya mā me śriyā saṃgamanaṃ tayāstu yasyāḥ kṛte bhaktajanaṃ tyajeyam","Yudhiṣṭhira sprach: „Unedles durch einen Edlen zu tun, Tausendäugiger - das ist schwer zu vollbringen, Edler. Nicht soll mir die Vereinigung mit jenem Glück zu
