<script id="data-book" type="application/json">{"title":"Mahābhārata (Teil 4)","subtitle":"Zweisprachige Leseausgabe: Sanskrit (IAST) und deutsche Übersetzung, Vers für Vers mit Wort-für-Wort-Analyse – Fortsetzung des Āśramavāsikaparva ab Kapitel 31 (Kapitel 1-30 sowie alle vorherigen Parvas in den Artifacts Teil 1 und Teil 2; ein separates Teil 3 eines anderen Sitzungsstrangs führt parallel das Droṇaparva ab Kapitel 163 fort).","frontmatter":{"vorwort":["Dies ist der vierte Teil dieser Mahābhārata-Ausgabe. Der erste Teil (Ādiparva, Sabhāparva, Vanaparva, Virāṭaparva sowie Udyogaparva Kapitel 1-48) und der zweite Teil (Udyogaparva ab Kapitel 49, Bhīṣmaparva, Droṇaparva Kapitel 1-162, Aśvamedhikaparva sowie der Beginn des Āśramavāsikaparva, Kapitel 1-30) sind wegen der 16-MB-Größengrenze für Artifacts in eigenen, separaten Artifacts veröffentlicht. Ein weiterer, unabhängig entstandener Artifact mit dem Titel „Mahābhārata (Teil 3)“ führt parallel dazu das Droṇaparva ab Kapitel 163 fort; er gehört zu einem anderen Arbeitsstrang dieses Projekts und behandelt ein anderes Parva als der vorliegende Band.","Dieser Band (Teil 4) setzt die Übersetzung des Āśramavāsikaparva ab Kapitel 31 nahtlos fort (die Wiedersehens-Szene der Pāṇḍavas mit Dhṛtarāṣṭra, Gāndhārī und Kuntī in der Einsiedelei am Kurukṣetra) und verwendet dasselbe Glossar (unverändert aus Teil 2 übernommen) sowie dieselben Übersetzungs- und Darstellungskonventionen: Vers für Vers mit ausklappbarer Wort-für-Wort-Analyse, unsichere oder ergänzte Stellen mit [?] bzw. [Anm.: …] gekennzeichnet.","Bei weiterem Wachstum werden bei Bedarf weitere Teile als zusätzliche Artifacts angelegt, und künftige Parvas (Mausalaparva, Mahāprasthānikaparva, Svargārohaṇaparva) werden ebenfalls hier bzw. in weiteren Teilen fortgeführt."],"einfuehrung":["Das Mahābhārata erzählt den Konflikt zwischen zwei verfeindeten Zweigen der Kuru-Dynastie – den fünf Pāṇḍava-Brüdern und ihren hundert Vettern, den Kauravas – der in der großen Schlacht von Kurukṣetra gipfelt. Um diese Haupthandlung legt sich eine vielschichtige Rahmenerzählung: Der Weise Kṛṣṇa Dvaipāyana Vyāsa gilt als Verfasser des Werks; er soll es zunächst seinem Schüler Vaiśampāyana gelehrt haben, der es beim Schlangenopfer (sarpasattra) des Königs Janamejaya, eines Nachfahren der Pāṇḍavas, vortrug. Der Sūta (Wagenlenker und Berufserzähler) Ugraśravas, Sohn des Lomaharṣaṇa, hörte diesen Vortrag mit an und erzählt die gesamte Geschichte seinerseits – dies ist die Ebene, auf der der überlieferte Text tatsächlich einsetzt – den im Naimiṣa-Wald versammelten Weisen um Śaunaka, während eines eigenen, zwölf Jahre währenden Opferrituals. Neben der Kriegs- und Dynastiehandlung enthält das Werk zahllose eingelagerte Lehrreden, Legenden und philosophische Abschnitte, darunter die Bhagavadgītā im Bhīṣmaparva.","Das Werk gliedert sich traditionell in 18 Parvas (Bücher), die ihrerseits in Upaparvas (Unterbücher) und Adhyāyas (Kapitel) unterteilt sind; hinzu tritt das Harivaṃśa als späterer, nicht mitgezählter Anhang (khila). Die Kapitel- und Verszahlen unten folgen der traditionellen (vulgaten) Zählung; die kritische Ausgabe des BORI zählt an vielen Stellen abweichend und insgesamt deutlich knapper."]},"glossary":[{"term":"Abhibhū","category":"Person","definition":"Sohn des Kāśya (Königs von Kāśī), bildet in Kap.47 zusammen mit Ketumān und Vasudāna die Rückendeckung von Droṇas/Bhīṣmas Heer."},{"term":"Abhimanyu","category":"Person","definition":"Sohn Arjunas und Subhadrās (patronymisch auch Ārjuni oder Sātvatīputra genannt), Ehemann Uttarās; fällt jung im Krieg, von mehreren Kriegern gemeinsam umzingelt und getötet. Nach Adhyāya 61 die Wiedergeburt des Suvarcas, Sohn des Mondgottes Soma (Aṃśāvataraṇa)."},{"term":"Abhīṣāha","category":"Volk","definition":"Volk, das in Kap.112 zusammen mit den Śūrasenas, Śibis und Vasātis gegen Arjuna anstürmt."},{"term":"Acala","category":"Person","definition":"Ein Schwager Dhṛtarāṣṭras (Sohn Subalas, Bruder Gāndhārīs und Śakunis, Bruder Vṛṣakas); wird zusammen mit seinem Bruder Vṛṣaka in Droṇaparva Kap.29 von Arjuna mit einem einzigen Pfeil erschlagen, da beide Brüder eng nebeneinander im selben Wagen standen."},{"term":"Acht Bogenschützen in Kap.75","category":"Gruppe","definition":"Sammeleintrag für acht große Bogenschützen, die Abhimanyus Wagen umringen (Kap.75): Citrasena, Sucitra, Citrāśva, Citradarśana, Cārucitra, Sucāru sowie Nanda und Upananda."},{"term":"Adhiratha","category":"Person","definition":"Wagenlenker (Sūta), Gatte Rādhās, Adoptivvater Karṇas/Vasuṣeṇas (Adh.104). Betritt in Adh.127 den Turnierplatz und wird von Karṇa ehrfürchtig als Vater begrüßt, wodurch dessen Sūta-Herkunft öffentlich sichtbar wird."},{"term":"Adhyāya","category":"Gliederung","definition":"Kapitel; die Unterteilungseinheit innerhalb eines Parva."},{"term":"Aditi","category":"Gottheit","definition":"Tochter Dakṣas, Gattin Kaśyapas, Mutter der zwölf Ādityas (darunter Indra/Śakra und Viṣṇu)."},{"term":"Adrikā","category":"Wesen","definition":"Eine Apsaras, durch einen Brahmanenfluch in Fischgestalt verwandelt; verschluckte Vasus im Falkenkampf verlorenen Samen und gebar daraus Matsya und Satyavatī, bevor sie vom Fluch erlöst wurde."},{"term":"Adṛśyantī","category":"Person","definition":"Gattin Śaktis (Vasiṣṭhas ältestem Sohn), Mutter des ungeborenen Parāśara; begleitet Vasiṣṭha nach dem Tod ihres Mannes."},{"term":"Agastya","category":"Person","definition":"Großer vedischer Ṛṣi, verzehrt in einer Erzählung den Dämon Vātāpi und gewinnt Lopāmudrā zur Frau."},{"term":"Agni","category":"Gottheit","definition":"Feuergott; wird von Arjuna und Kṛṣṇa im Khāṇḍava-Wald gesättigt."},{"term":"Agnihotra","category":"Begriff","definition":"Das tägliche (morgens/abends) dargebrachte Feueropfer, eine der grundlegenden vedisch-brahmanischen Ritualpflichten."},{"term":"Agniveśya","category":"Person","definition":"Schüler Bharadvājas, der ihn in der Feuerwaffe (Āgneya) unterweist; lehrt seinerseits Droṇa diese Waffe (Adh.121)."},{"term":"Aguru","category":"Begriff","definition":"Kostbares, stark duftendes Adlerholz (Agarwood), zum Räuchern und Parfümieren verwendet."},{"term":"Ahalyā","desc":"Gattin des Weisen Gautama; ihr Name ist mit einem heiligen See verbunden."},{"term":"Ahicchatra","category":"Ort","definition":"Land bzw. Stadt, die Droṇa als seinen Anteil des eroberten Pāñcāla-Reiches erhält (Adh.128)."},{"term":"Airāvata","category":"Wesen","definition":"Schlangenkönig, Ältester der Nāgas, nach dem ein Elefant Indras später benannt ist; von Uttaṅka gepriesen."},{"term":"Aja","category":"Sache","definition":"Eine Klasse ungeborener bzw. urzeitlicher Seher im Gefolge Brahmās."},{"term":"Ajamīḍha","category":"Person","definition":"Legendärer Ahnherr, nach dem ein Zweig des Kuru-Geschlechts benannt ist; Epitheton auch für Yudhiṣṭhira („Ājamīḍha“)."},{"term":"Ajātaśatru","category":"Epitheton","definition":"‚Der keinen Feind hat' – Beiname Yudhiṣṭhiras, verwendet u.a. in Adh.133."},{"term":"Akrūra","category":"Person","definition":"Ein angesehener Ältester der Vṛṣṇis."},{"term":"Akūpāra","category":"Wesen","definition":"Der Schildkröten-König, der beim Samudra-Manthana als Grundlage/Unterlage für den Berg Mandara dient."},{"term":"Akṛtavraṇa","desc":"Gefährte Paraśurāmas (Rāma Jāmadagnya); erzählt Yudhiṣṭhira am Mahendra-Berg die Vorgeschichte von dessen Geschlecht."},{"term":"Akṣauhiṇī","category":"Begriff","definition":"Die größte Heereseinheit im Mahābhārata: 21.870 Wagen, 21.870 Elefanten, 65.610 Pferde und 109.350 Fußsoldaten, aufgebaut aus den Einheiten Patti, Senāmukha, Gulma, Gaṇa, Vāhinī, Pṛtanā, Camū und Anīkinī."},{"term":"Alakanandā","category":"Ort/Beiname","definition":"Name der Gaṅgā, wenn sie unter den Göttern (im Himmel) fließt; in Adh.158 genannt."},{"term":"Alakā","category":"Ort","definition":"Kuberas himmlische Hauptstadt bzw. der Lotusteich in seiner Halle, am Berg Kailāsa gelegen."},{"term":"Alambatīrtha","category":"Ort","definition":"Eine Furt/heiliger Badeplatz, den Garuḍa auf seinem Flug erreicht."},{"term":"Alambusa","category":"Wesen","definition":"Ein Gandharva, der mit anderen himmlischen Wesen in seinem Himmelswagen zur Schlacht zwischen Bhīṣma und Arjuna herbeikommt. Ein gleichnamiger Rākṣasa (Bruder des von Bhīma getöteten Baka, mit dem Patronymikon Ārṣyaśṛṅgi \"Sohn des Ṛṣyaśṛṅga\" bezeichnet) kämpft in Kap.83 gegen Bhīmasena und wird durch dessen Tvāṣṭra-Waffe entmachtet. Wird in diesem Kampf auch 'Kairmīri'/'Kirmīranandana' (\"Sohn Kirmīras\") und 'Sālakaṭaṅkaṭa' genannt; stirbt in Kap.84 im Duell gegen Ghaṭotkaca, der ihn vom Wagen reißt und am Boden zerschmettert. In Kapitel 142 des Droṇaparva tritt ein Rakshasa dieses Namens - auf einem furchterregenden, mit acht Rädern und piśāca-bespannten Wagen - Kṛṣṇa und Arjuna entgegen, die dem fliehenden Heer zu Hilfe eilen wollen; im folgenden langen Pfeilduell wird er von Arjuna entwaffnet (Banner, Wagenlenker, Bogen, Pferde und Schwert werden zerschlagen) und flieht schließlich verwundet aus Furcht. [Anm.: Dies scheint der bereits an anderer Stelle als durch Ghaṭotkaca gefallen vermerkten Figur gleichen Namens zu widersprechen; die Diskrepanz wird hier unkommentiert festgehalten.]"},{"term":"Alambuṣa","category":"Krieger","definition":"Rākṣasa-Krieger auf Kaurava-Seite (Sohn eines Rakṣas-Fürsten, in Kap.59 als 'rājavarārśyaśṛṅgiḥ' bezeichnet, Identität des Vaters unsicher [?]); durchbohrt Sātyaki in Kap.59, wird von diesem mit vier Pfeilen zurückgeschlagen."},{"term":"Alarka","category":"Person","definition":"Legendärer, wahrhaft gelobter König von Kāśi und Karūṣa, der Reich und Schätze aufgab, als Beispiel dharmagemäßer Selbstbeherrschung angeführt."},{"term":"Alātacakra","category":"Begriff","definition":"Das kreisförmig geschwungene brennende Holzscheit ('Feuerbrand-Rad'), gängiges Bildwort für die blitzschnelle Rundum-Beweglichkeit eines Meisterkämpfers im Kampf."},{"term":"Amarāvatī","category":"Ort","note":"Die Himmelsstadt Indras (Śakras), Ziel von Arjunas Himmelfahrt."},{"term":"Ambarīṣa","desc":"Sohn des Nābhāga; opferte an der Yamunā und erlangte durch Opfer und Buße höchste Vollendung."},{"term":"Ambaṣṭha","category":"Volk/Reich","definition":"Volk/Reich im Nordwesten des alten Indien; sein König Śrutāyus kämpft in Kap.55 auf Kaurava-Seite und stürmt auf Bhīṣmas Befehl gegen Arjuna. In Kap.68 stellt sich dieser Ambaṣṭha-König (gemeinsam mit einem gleichnamigen Śrutāyus) erneut Arjuna entgegen und wird von ihm im Keulenkampf enthauptet, woraufhin das Kaurava-Heer in Flucht gerät."},{"term":"Ambikā","category":"Person","definition":"Ältere Tochter des Königs von Kāśī, Gattin Vicitravīryas, durch Vyāsa Mutter Dhṛtarāṣṭras (Adh.90)."},{"term":"Amburāṭ","category":"Epitheton","definition":"'Herrscher der Gewässer', Beiname Varuṇas; in Droṇaparva Kap.5 als Vergleichsbild in Duryodhanas Rede an Droṇa verwendet ('wie Amburāṭ unter den Ādityas')."},{"term":"Ambuvīca","category":"Person","definition":"Ein sagenhafter König der Māgadha in Rājagṛha, dessen Minister Mahākarṇi ihm die Macht zu entreißen suchte, in Karṇas Erzählung in Adh.196."},{"term":"Ambā","category":"Person","definition":"Älteste Tochter des Königs von Kāśī, von Bhīṣma bei der Brautwahl für Vicitravīrya geraubt; offenbart ihre insgeheime Wahl König Śālvas und wird von Bhīṣma freigegeben (Adh.96). Ihre Zurückweisung erhält im weiteren Verlauf des Epos große Bedeutung."},{"term":"Ambālikā","category":"Person","definition":"Jüngere Tochter des Königs von Kāśī, Gattin Vicitravīryas, durch Vyāsa Mutter Pāṇḍus (Adh.90)."},{"term":"Amṛta","category":"Begriff","definition":"Der Unsterblichkeitstrank, den die Götter (und Asuras) durch das Quirlen des Milchozeans (Samudra-Manthana) zu gewinnen suchen."},{"term":"Ananta","category":"Wesen","definition":"Die kosmische Weltschlange (auch Śeṣa genannt), reißt den Berg Mandara aus; im Epos von Vāsuki als eigenständige Gestalt unterschieden."},{"term":"Anantavijaya","category":"Sache","definition":"Muschelhorn Yudhiṣṭhiras, in Kap.47 zusammen mit Pāñcajanya (Kṛṣṇa), Devadatta (Arjuna), Pauṇḍra (Bhīma) und Sughoṣa/Maṇipuṣpaka (Nakula/Sahadeva) geblasen."},{"term":"Anaṅga","category":"Person","definition":"Beiname des Liebesgottes Kāma, wörtlich der Körperlose."},{"term":"Andhaka","category":"Sache","definition":"Ein mit den Vṛṣṇis verwandter Zweig des Yadu-Stammes."},{"term":"Anila","category":"Person","definition":"Beiname bzw. ein weiterer Name des Windgottes Vāyu."},{"term":"Aniruddha","category":"Person","definition":"Enkel Kṛṣṇas, Sohn des Pradyumna, Vṛṣṇi-Held."},{"term":"Antaka","category":"Epitheton","definition":"‚Der Beender' – Beiname des Todesgottes Yama."},{"term":"Anu","category":"Person","definition":"Sohn Yayātis und der Śarmiṣṭhā; lehnt es ab, dem Vater seine Jugend zu leihen."},{"term":"Anuvinda","category":"Krieger","definition":"Einer der beiden Avantī-Prinzen (mit seinem Bruder Vinda), Verbündeter der Kauravas; in Kap.104 unter den Kriegern genannt, vor denen Arjuna Śikhaṇḍin zu schützen verspricht."},{"term":"Anādhṛṣṭi","category":"Person","definition":"Ein Vṛṣṇi-Held, der zur Hochzeit nach Indraprastha kommt. Daneben (Kap.92) ein gleichnamiger Sohn Dhṛtarāṣṭras, von Bhīmasena in der Schlacht des vierten Tages erschlagen."},{"term":"Aparanandā","category":"Ort","definition":"Ein heiliger Fluss neben der Nandā, den Arjuna besucht."},{"term":"Apsaras","category":"Begriff","definition":"Klasse himmlischer Nymphen/Tänzerinnen."},{"term":"Apsaras bei Arjunas Geburt","category":"Gruppe","definition":"Die bei Arjunas Geburt tanzenden Apsaras (Adh.114 V50-54): Anūnā, Anavadyā, Priyamukhī, Guṇāvarā, Adrikā, Sācī (nicht Indras Gattin), Miśrakeśī, Alambusā, Marīci, Śicukā, Vidyutparṇā, Tilottamā, Agnikā, Lakṣaṇā, Kṣemā, Rambhā, Manoramā, Asitā, Subāhu, Supriyā, Suvapus, Puṇḍarīkā, Sugandhā, Surathā, Pramāthinī, Kāmyā, Śāradvatī, Menakā, Sahajanyā, Parṇikā, Puñjikasthalā, Kratusthalā, Ghṛtācī, Viśvācī, Pūrvacitti, Umlocā, Pramlocā und Urvaśī."},{"term":"Araṭṭa","category":"Volk","definition":"Ein Volk aus dem Nordwesten, zusammen mit Kāmbojas und Bāhlikas unter Kṛtavarman an der Spitze der Krauñca-Heeresformation in Kap.71 genannt."},{"term":"Arjuna","category":"Person","definition":"Dritter der fünf Pāṇḍu-Söhne, Sohn Indras, Meisterbogenschütze (Beiname u.a. Dhanañjaya, Pārtha, Kirīṭin, Savyasācin, Vāsavi [‚Sohn des Vāsava/Indra‘], Śvetāśva/Śvetavāhana [‚der Weißpferdige‘]), enger Gefährte Kṛṣṇas. Nach Adhyāya 61 ein Anteil des Götterkönigs Indra (Aṃśāvataraṇa). Verspricht Droṇa in Adh.122 als einziger der Prinzen vorbehaltlos die spätere Erfüllung eines noch ungenannten Anliegens (Gurudakṣiṇā) und wird dafür von Droṇa unter Tränen der Freude bevorzugt. Übt in Adh.123 heimlich nachts und übertrifft alle Mitschüler; besteht als Einziger die Geier-Zielscheiben-Prüfung Droṇas, rettet diesen vor einem Krokodil und erhält dafür die Brahmaśiras-Waffe samt Rückholformel. Zeigt in Adh.125 bei der öffentlichen Waffenschau eine spektakuläre Astra-Demonstration (Feuer, Wasser, Wind, Regen, Erde, Berg, Unsichtbarkeit) und meisterhafte Zielschüsse. Besiegt in Adh.158 den Gandharva Aṅgāraparṇa mit der Agni-Waffe, schließt Freundschaft mit ihm und erlangt die Cakṣuṣī-Sehkraft-Wissenschaft sowie Gandharva-Rosse. In Kap.27 auch als ‚Śvetahaya‘ (‚der mit den weißen Rossen‘) und ‚Pākaśāsani‘ (‚Sohn des Pākaśāsana/Indra‘) bezeichnet. Erträgt in Kap.123 Bhīmasenas Klage über Karṇas höhnische Schmähungen, hält daraufhin Karṇa eine scharfe Zornesrede (wirft ihm Feigheit und unrechtes Verhalten gegen Bhīma vor) und schwört öffentlich, Vṛṣasena und Karṇa selbst zu töten. Wird von Kṛṣṇa für seine Taten (Tod Jayadrathas und Vṛddhakṣatras) gepriesen und erhält von diesem das verheerte Schlachtfeld gezeigt. In Kap.132 kehrt er gemeinsam mit Bhīma zurück, um das von Droṇa versprengte Heer der Pāñcālas zu decken, und bedrängt Droṇa von der rechten Flanke aus mit einer gewaltigen Pfeilflut. In Kap.134 besiegt er Karṇa in einem direkten Duell: Er zerschlägt dessen Bogen, tötet seine vier Pferde und enthauptet seinen Wagenlenker, sodass Karṇa auf Kṛpas Wagen fliehen muss. In Kapitel 142 besiegt er im Alleingang den Rakshasa Alambusa in einem langen, den Himmel erfüllenden Pfeilduell, zerschlägt dessen Banner, Wagenlenker, Bogen, Gespann und Schwert und treibt ihn verwundet in die Flucht, ehe er, Pfeilmassen unter die feindlichen Truppen streuend, weiter auf Droṇa zurückt. In Kap.147 (als Phalguna angesprochen) wird er von Kṛṣṇa dazu aufgefordert, gemeinsam mit dem heranrückenden Bhīmasena Droṇa und Karṇa im nächtlichen Kampf entgegenzutreten; er tut dies gemeinsam mit Kṛṣṇa und nimmt an der Spitze der Schlacht Stellung. In Adh.148 will er selbst gegen Karṇa ziehen, wird von Kṛṣṇa jedoch zurückgehalten, da dessen Stunde noch nicht gekommen sei; stattdessen beauftragt er Ghaṭotkaca, unterstützt von Sātyaki als Rückendecker, Karṇa in der Nacht zu bekämpfen."},{"term":"Arjuna (Bībhatsu)","category":"Person","definition":"Dritter der fünf Pāṇḍavas, Sohn Kuntīs und des Götterkönigs Indra, nach einem Jahr strenger Askese Pāṇḍus gezeugt; seine Geburt wird von einer Prophezeiung großer künftiger Taten begleitet, u. a. der Bezwingung zahlreicher Königreiche und der Beteiligung am Khāṇḍava-Waldbrand (Adh.114)."},{"term":"Arundhatī","category":"Person","definition":"Die Gattin des Weisen Vasiṣṭha, als Vorbild ehelicher Treue verehrt."},{"term":"Aruṇa","category":"Wesen","definition":"Vinatās erster, unvollständig geborener Sohn; verflucht seine Mutter zur Dienstbarkeit und wird zum Wagenlenker der Sonne / Verkörperung der Morgenröte."},{"term":"Arvāvasu","desc":"Älterer Sohn des Raibhya."},{"term":"Aryaman","category":"Person","definition":"Einer der zwölf Āditya-Götter, Hüter der Gastfreundschaft und der Verträge."},{"term":"Asamañjas","desc":"Sohn König Sagaras und der Śaibyā; wegen grausamer Misshandlung der Stadtkinder von seinem Vater verstoßen; Vater des Aṃśumant."},{"term":"Asita","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Astra-Pradarśana","category":"Konzept","definition":"Die öffentliche Waffenschau der von Droṇa ausgebildeten Kuru- und Pāṇḍu-Prinzen vor dem versammelten Hof und Volk Hāstinapuras (ab Adh.124), bei der auch Karṇa auftritt."},{"term":"Astras der Waffenvorführung Arjunas","category":"Konzept","definition":"Astra-Katalog aus Adh.125: Āgneya (Feuer), Vāruṇa (Wasser), Vāyavya (Wind), Pārjanya (Regen/Wolken), Bhauma (Erde/Versinken), Pārvata (Berg), Antardhāna (Unsichtbarkeit) – von Arjuna bei der öffentlichen Waffenschau demonstriert."},{"term":"Atharvan","desc":"Uralter vedischer Seher-Priester, dem Kult des Atharvaveda zugeordnet; in dieser Erzählung wird er von Agni beauftragt, dessen Opferpflichten zu übernehmen, und ruft Agni am Ende erfolgreich aus dem Meer zurück."},{"term":"Atiratha","category":"Begriff","definition":"Kampfklassifikation für einen Wagenkämpfer höchsten Ranges, der es zugleich mit zahllosen Gegnern aufnehmen kann; in Kap.48 auf Arjuna angewandt."},{"term":"Atri","category":"Person","definition":"Brahmarṣi, übte hundert Jahre Askese, ohne den Grund des Ozeans (Pātāla) zu erreichen."},{"term":"Aurasaka","category":"Volk","definition":"Ein von Kṛṣṇa im Kampf besiegtes Volk; in Droṇaparva Kap.10 im Katalog der von Kṛṣṇa bezwungenen Völker genannt."},{"term":"Aurva","category":"Person","definition":"Legendärer Weiser, aus dessen Zorn der Unterwasser-Feuer-Mythos (vāḍavāgni) entspringt; hier als Vergleichsbild für Glanz angeführt. Ausführliche Erzählung in Adh.169-171: schenkelgeborener Sohn einer überlebenden Bhṛgu-Frau, raubt den mordenden Kṣatriyas durch seinen Zorn das Augenlicht, gibt es auf Bitten zurück, will dann aber aus Rache alle Welten vernichten, bis ihn die erschienenen Ahnen (Pitṛs) besänftigen."},{"term":"Avabhṛtha","category":"Sache","definition":"Das abschließende rituelle Reinigungsbad am Ende eines großen Opfers, hier des Schlangenopfers Janamejayas."},{"term":"Avantī","category":"Ort/Volk","definition":"Ein Reich, dessen zwei Fürsten (die „beiden von Avantī“, zusammen mit Aśvatthāman und Somadatta) den linken Flügel des Kaurava-Heeres am fünften Kampftag bewachen (Kap.95)."},{"term":"Avindhya","desc":"Alter, weiser Rākṣasa in Rāvaṇas Umgebung, der Rāmas Wohl sucht und Trijaṭā beauftragt, Sītā zu trösten."},{"term":"Ayodhyā","category":"Ort","definition":"Hauptstadt der Ikṣvāku-Könige, u.a. Saudāsa-Kalmāṣapādas."},{"term":"Añjana, Vāmana, Mahāpadma","category":"Gruppe","definition":"Drei große (illusionäre) Elefanten in Kap.60, von Rākṣasas bestiegen, die zusammen mit Ghaṭotkacas eigenem Zauber-Elefanten (Airāvata-gleich) Bhagadattas Kampfelefanten bedrängen."},{"term":"Aśmaka","category":"Person","definition":"Sohn der Madayantī und des Ṛṣi Vasiṣṭha, geboren im Auftrag ihres Gatten Saudāsa (Adh.113). In Adh.168 ausführlich erzählt: geboren erst im zwölften Schwangerschaftsjahr, nachdem die Mutter ihren eigenen Leib mit einem Stein durchbrach – daher der Name (,Stein-Sohn')."},{"term":"Aśoka (Wagenlenker)","category":"Person","definition":"Bhīmas Wagenlenker, bringt ihn in Kap.50 mit dem goldverzierten Wagen zu Kaliṅga heran."},{"term":"Aśvaketu","category":"Person","definition":"Junger kauravischer Krieger, in Kap.47 von Abhimanyu zusammen mit seinem Wagenlenker und seinen Pferden getötet."},{"term":"Aśvakrandana","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Aśvamedha","desc":"Das königliche Pferdeopfer, ein bedeutendes vedisches Ritual zur Bekräftigung von Herrschaft und Ruhm; Rāma vollzieht am Ende des Rāmopākhyāna zehn davon am Fluss Gomatī."},{"term":"Aśvamedhadatta","category":"Person","definition":"Sohn des Śatānīka, Enkel Janamejayas – letztes genanntes Glied der Genealogie (Adh.90)."},{"term":"Aśvapati","desc":"König der Madras, kinderlos und dharmatreu; erlangt durch achtzehnjährige Buße von der Gottheit Sāvitrī die Gabe einer Tochter, die nach ihr benannt wird - der Vater der Sāvitrī der berühmten Nebenerzählung."},{"term":"Aśvasena","category":"Wesen","definition":"Schlange, Gefährte Takṣakas, wohnhaft bei Kurukṣetra am Fluss Ikṣumatī."},{"term":"Aśvatthāman","category":"Person","definition":"Sohn Droṇas (patronymisch auch Drauṇi genannt), Krieger auf Kaurava-Seite; verübt nach Kriegsende das nächtliche Massaker an den schlafenden Pāñcālas und Draupadīs Söhnen. Nach Adhyāya 61 aus der zu Einheit gelangten Kraft von Mahādeva, Antaka (Yama), Kāma und Krodha entstanden (Aṃśāvataraṇa). Geburt in Adh.121: Sohn Droṇas und Kṛpīs; erhält seinen Namen, weil sein Geburtsschrei wie das Wiehern des Pferdes Uccaiḥśravas klang und dessen Kraft sich über die Himmelsrichtungen verbreitete. Erhält in Kap.126 durch Duryodhana von seinem Vater Droṇa die Botschaft, den Somakas im Kampf keine Gnade zu zeigen. In Kap.131 (als 'Drauṇi' bezeichnet) tötet er, erzürnt über den Tod Bhūriśravas', im Duell Ghaṭotkacas Sohn Añjanaparvan, vernichtet im Alleingang eine ganze Rākṣasa-Akṣauhiṇī und kämpft in einem gewaltigen illusionsgestützten Duell gegen Ghaṭotkaca und Dhṛṣṭadyumna, das im berühmten Blutstrom-Gleichnis gipfelt; er trifft Ghaṭotkaca schließlich mit einem todesgleichen Pfeil. In Kap.134 gerät er in Zorn über Karṇas Verspottung seines Onkels Kṛpa und will ihn angreifen, lässt sich aber von Duryodhana und Kṛpa besänftigen; am Ende erklärt er sich bereit, anstelle Duryodhanas gegen die Pāñcālas und Somakas vorzugehen. In Kap.135 erwidert er Duryodhana, dass er die Pāṇḍavas zwar liebe, ihnen im Kampf aber dennoch mit voller Kraft entgegentrete, und wirft ihm Habgier und Misstrauen vor; anschließend richtet er unter den Pāñcālas und Kekayas ein Blutbad an und liefert sich mit Dhṛṣṭadyumna ein gewaltiges Pfeilduell, in dem er dessen Banner, Bogen und Gespann niederschlägt. In Kapitel 141 greift er, nachdem Bhūri gefallen ist, Sātyaki an und liefert sich anschließend ein langes Pfeilduell mit Ghaṭotkaca, in dem er kurzzeitig ohnmächtig wird, sich aber erholt und den Rakshasa mit einem schweren Pfeiltreffer in die Brust so verwundet, dass dessen Wagenlenker ihn vom Schlachtfeld fortbringt."},{"term":"Aśvin","category":"Sache","definition":"Die beiden göttlichen Zwillingsärzte, Söhne des Sonnengottes Sūrya, oft als Sinnbild inniger Vertrautheit genannt."},{"term":"Aśvins","category":"Personen/Götter","definition":"Die göttlichen Zwillingsärzte, Väter von Nakula und Sahadeva; in Adh.159 unter den sechs göttlichen Ahnvätern der Pāṇḍavas genannt."},{"term":"Aśvins / Nāsatyau","category":"Gottheit","definition":"Göttliches Zwillingspaar, Ärzte der Götter; erneuern in der Cyavana-Erzählung dessen Jugend."},{"term":"Aṃśa","category":"Person","definition":"Einer der zwölf Āditya-Götter."},{"term":"Aṃśumant","desc":"Enkel König Sagaras (Sohn des Asamañjas); erlangt von Kapila das Opferpferd zurück und die Verheißung von Bhagīrathas künftiger Gaṅgā-Herabführung."},{"term":"Aṅga","category":"Person","definition":"Königlicher Seher (rājarṣi), von Dīrghatamas mit Königin Sudeṣṇā gezeugt; Stammvater eines gleichnamigen Königreichs (Adh.98). Karṇa wird in Adh.126 von Duryodhana zum König von Aṅga geweiht."},{"term":"Aṅgada","desc":"Sohn Vālins, Neffe Sugrīvas; einer der Affenführer, die bei der Suche nach Sītā nach Süden entsandt werden."},{"term":"Aṅgiras","category":"Person","definition":"Einer der sechs geistgeborenen Söhne Brahmās."},{"term":"Aṅgāraka","category":"Person","definition":"Der Gott des Planeten Mars; in Kap.45 zusammen mit Budha (Merkur) als Vergleichsbild für den erbitterten Zweikampf zwischen Lakṣmaṇa und Abhimanyu herangezogen."},{"term":"Aṅgāraparṇa (Citraratha)","category":"Person/Gandharva","definition":"König der Gandharvas, auch Citraratha genannt; wird in Adh.158 von Arjuna im Kampf besiegt, erhält danach den Spottnamen Dagdharatha (,Verbrannter Wagen') und schließt Freundschaft mit ihm."},{"term":"Aṇīmāṇḍavya","category":"Person","definition":"Ein uralter Ṛṣi, fälschlich als Dieb auf einen Pfahl gespießt; belegt aus Empörung über diese unverhältnismäßige Strafe den Gott Dharma mit dem Fluch, in einem Śūdra-Schoß geboren zu werden – Ursprung von Viduras Geburt."},{"term":"Aṣṭaka","category":"Person (König)","definition":"König, Sohn des Viśvāmitra laut späterer Tradition; begegnet Yayāti in der Zwischenluft und spielt eine zentrale Rolle in der folgenden Erzählung von Yayātis Rückkehr in den Himmel."},{"term":"Aṣṭāvakra","category":"Person","definition":"Brahmanen-Ṛṣi mit acht Körperkrümmungen, besiegt den Logiker Bandin im Streitgespräch bei König Janakas Opfer und rettet dadurch seinen Vater."},{"term":"Babhruvāhana","category":"Person","definition":"Sohn Arjunas und der Königin Citrāṅgadā von Maṇipūra; liefert sich im Aśvamedhaparva einen lebensgefährlichen Kampf mit seinem eigenen Vater."},{"term":"Badarī","category":"Ort","definition":"Ein bekannter Wallfahrtsort im Himālaya."},{"term":"Baka","category":"Wesen","definition":"Ein überaus starker Rākṣasa bei Ekacakrā, der ein Dorf mit Menschenopfern terrorisierte, bis Bhīmasena ihn tötete. Ab Adh.148 namentlich als der menschenfressende Rākṣasa identifiziert, der Ekacakrā und sein Umland beherrscht und im Austausch für Schutz einen reihum von den Haushalten zu liefernden Speise- und Menschentribut fordert. Wird in Adh.151 von Bhīma in einem Baum- und Ringkampf bezwungen und schwer verwundet. Stirbt in Adh.152 durch Bhīma; sein Gefolge wird von Bhīma zu einem Abkommen bewogen, nie mehr Menschen zu schädigen."},{"term":"Baka Dālbhya","category":"Person","definition":"Ein Seher (zu unterscheiden vom gleichnamigen Rākṣasa „Baka“ bei Ekacakrā), der Yudhiṣṭhira in Dvaitavana über die notwendige Verbindung von Brahman und Kṣatra belehrt."},{"term":"Bala","category":"Person/Dämon","definition":"Ein von Indra bezwungener Dämon, meist zusammen mit Vṛtra genannt; in Droṇaparva Kap.29 als Vergleichsbild für die Gāndhāra-Brüder Vṛṣaka und Acala verwendet, die Arjuna wie einst Vṛtra und Bala den Indra bestürmen."},{"term":"Balabhid","category":"Gottheit","definition":"Epitheton Indras („Bala-Bezwinger“)."},{"term":"Baladeva","category":"Person","definition":"Auch Balarāma genannt; Bruder Kṛṣṇas, Wiedergeburt (Anteil) der Weltschlange Śeṣa."},{"term":"Balarāma","desc":"Älterer Bruder Kṛṣṇas, Sohn Vasudevas; führender Held der Vṛṣṇis, hier als \"Rāma\" bezeichnet (nicht zu verwechseln mit Rāma Jāmadagnya/Paraśurāma)."},{"term":"Balarāma / Halāyudha","category":"Person","definition":"Älterer Bruder Kṛṣṇas, Sohn Vasudevas und Rohiṇīs, Avatāra Śeṣas/Anantas; nicht zu verwechseln mit Rāma (Daśarathi), dem Helden des Rāmāyaṇa."},{"term":"Bali","category":"Wesen","definition":"Sohn Virocanas, Vater Bāṇas; berühmter Dānava-König."},{"term":"Ballava","desc":"Bhīmas Deckname am Hof Virāṭas, als Küchenmeister und Ringkämpfer."},{"term":"Balāhaka","category":"Begriff","definition":"Gewitterwolke, hier als Epitheton Indras gebraucht."},{"term":"Balākṣa","category":"Person (König)","definition":"Legendärer König, hier unter den himmlischen Zuschauern der Schlacht zwischen Bhīṣma und Arjuna genannt."},{"term":"Bandin","desc":"Meisterhafter Debattierer am Hof König Janakas, besiegt Kahoḍa im Wortstreit; wird später von Aṣṭāvakra herausgefordert."},{"term":"Bhadrā","category":"Person","definition":"Die Gattin des Gottes Kubera (Vaiśravaṇa)."},{"term":"Bhadrā (Kākṣīvatī)","category":"Person","definition":"Tochter des Kākṣīvat, Gattin des Königs Vyuṣitāśva; nach dessen Tod erzeugt eine körperlose Stimme aus seinem Leichnam mit ihr sieben Söhne (drei Śālva-, vier Madra-Stammväter) (Adh.112)."},{"term":"Bhaga","category":"Person","definition":"Einer der zwölf Āditya-Götter, Gott des Anteils und Glücks."},{"term":"Bhagadatta","category":"Person","definition":"König der Prāgjyotiṣa, Verbündeter der Kauravas, kämpft im Bhīṣmaparva auf seinem Elefanten Supratīka gegen Arjuna. Nach Adhyāya 61 die irdische Wiedergeburt des Daitya Bāṣkala (Aṃśāvataraṇa)."},{"term":"Bhagīratha","category":"Person","definition":"Legendärer König, der durch Askese die Gaṅgā auf die Erde herabführte; hier als Vergleichsbild angeführt."},{"term":"Bhairavāstra","category":"Waffe","definition":"Die 'furchtbare Waffe' (von Śiva-Bhairava benannt), die Arjuna nach Droṇas Worten in Kap.108 im Besitz hat."},{"term":"Bharadvāja","category":"Person","definition":"Großer Ṛṣi von strenger Askese, Vater Droṇas (dessen Same in einem Gefäß, einer Droṇī, heranwuchs – Namensquelle Droṇas). Ausführlich in Adh.121: erblickt die badende Apsaras Ghṛtācī, sein Same fällt in ein Gefäß (Droṇa), woraus sein Sohn Droṇa entsteht; unterweist Agniveśya in der Feuerwaffe; Freund des Königs Pṛṣata."},{"term":"Bharata","category":"Person/Dynastie","definition":"Urahn der Kuru-Dynastie; „Bharata“ dient im Epos zugleich als Ehrentitel für Angehörige dieses Geschlechts (etwa „Bharatasattama“, Bester der Bharatas). Trug als Kind zunächst den Namen Sarvadamana (Adhyāya 68)."},{"term":"Bhauvana","category":"Person","definition":"Ein Soma-Wächter von unermesslicher Kraft, von Garuḍa im Kampf getötet; Identität sonst unklar."},{"term":"Bhikṣu","category":"Konzept","definition":"Der besitzlose, wandernde Bettelmönch, die vierte Lebensstufe (āśrama): völlige Entsagung von Heim und Besitz."},{"term":"Bhogavatī","category":"Ort","definition":"Die sagenhafte Hauptstadt der Schlangenwesen (Nāgas) in der Unterwelt."},{"term":"Bhoja","category":"Sache","definition":"Ein mit den Vṛṣṇis verwandter Zweig des Yadu-Stammes."},{"term":"Bhojas","category":"Volk/Dynastie","definition":"Nachkommen des Druhyu, Sohnes von Yayāti und Śarmiṣṭhā, laut Adh.79-80 ohne eigenes Königtum, an Gewässern mit Floß-/Bootsübersetzung ansässig."},{"term":"Bhumanyu","category":"Person (König)","definition":"Von Bharata durch Bharadvāja erhaltener Sohn und Nachfolger, nachdem Bharata mit seinen neun leiblichen Söhnen unzufrieden war; auch Vitatha genannt (Adh.89)."},{"term":"Bhuśuṇḍi","category":"Waffe","definition":"Eine Wurf- oder Schleuderwaffe, im Kriegsgerät-Katalog von Adh.186 genannt."},{"term":"Bhāgīrathī","category":"Ort/Beiname","definition":"Beiname des Flusses Gaṅgā; in Adh.154 als Grenze der zwischen Droṇa und Drupada geteilten Herrschaft genannt."},{"term":"Bhānu","category":"Person (König)","definition":"Legendärer König, hier unter den himmlischen Zuschauern der Schlacht zwischen Bhīṣma und Arjuna genannt."},{"term":"Bhānumant","category":"Person","definition":"Krieger auf Kaliṅga-Seite, kämpft in Kap.50 gegen Bhīma; wird von diesem, der auf einen Elefanten geklettert ist, mit dem Schwert enthauptet."},{"term":"Bhāradvāja","category":"Person","definition":"Beiname Droṇas als Sohn des Weisen Bharadvāja."},{"term":"Bhārata","category":"Werktitel","definition":"Alter Titel des Werks („die Geschichte der Nachkommen des Bharata“); Kurzform für Mahābhārata."},{"term":"Bhāratavaṃśa / Bharata","category":"Person/Dynastie","definition":"Urahn der Bharata-Dynastie, nach dem das Mahābhārata („die große Erzählung der Bharatas“) benannt ist."},{"term":"Bhārgava","category":"Sippe","definition":"Angehöriger des Bhṛgu-Geschlechts; Synonym zu Bhṛgu in Adh.169."},{"term":"Bhāskara","category":"Epitheton","definition":"'Der Lichtschaffende', gängiger Beiname des Sonnengottes Sūrya bzw. der Sonne, häufig als Vergleichsbild für Glanz und Vorrang verwendet."},{"term":"Bhīma (Bhīmasena, Vṛkodara)","category":"Person","definition":"Zweiter der fünf Pāṇḍavas, Sohn Kuntīs und des Windgottes Vāyu; zermalmt bereits als Säugling einen Felsen mit seinen Gliedern (Adh.114). Beiname ‚Vṛkodara' (‚Wolfsbauch') wegen seines gewaltigen Appetits. Tritt in Adh.124 zum Abschluss der Waffenschau mit Duryodhana zum Keulenzweikampf an. Sein Keulenwurf gegen Somadatta aus Kap.132 wird in Kap.137, in einer weitgehend eigenständigen zweiten Fassung von dessen Tod, wiederholt geschildert. In Kapitel 141 liefert er sich, während er gegen Droṇas Wagen vordringt, ein langes Bogenduell mit Duryodhana; als dieser wiederholt seine Bögen zerschneidet, schleudert er schließlich eine schwere Keule, die Duryodhanas Pferde und Wagenlenker zermalmt, und erhebt, im Glauben, Duryodhana sei gefallen, einen gewaltigen Löwenschrei."},{"term":"Bhīma / Bhīmasena","category":"Person","definition":"Zweiter der fünf Pāṇḍu-Söhne, Sohn des Windgottes Vāyu, von gewaltiger Körperkraft; tötet im Krieg u.a. Duḥśāsana und Duryodhana."},{"term":"Bhīmaratha","category":"Person","definition":"Name eines Kriegers in Droṇaparva Kap.24, der einen 'Śālva' samt Wagenlenker tötet; die genaue Identität und das Verhältnis zu dem im Apparat genannten Sālva-König gleichen Namens bleiben unsicher."},{"term":"Bhīmasena","category":"Person","definition":"Zweiter der fünf Pāṇḍavas, Sohn der Kuntī und des Windgottes Vāyu, von gewaltiger Kraft; auch Vṛkodara (‚Wolfsbauch‘) genannt. Nach Adhyāya 61 ein Anteil des Windgottes Vāta/Vāyu (Aṃśāvataraṇa). Trägt in Adh.136 beim Fluchttunnel-Ausbruch aus dem brennenden Lākṣāgṛha die erschöpfte Mutter Kuntī auf der Schulter, die Zwillinge auf der Hüfte und führt Yudhiṣṭhira und Arjuna an den Händen. Hält in Adh.138 nach dem Tragen der erschöpften Familie durch den Wald eine bewegende Klage über ihre Notlage und wacht allein über den Schlaf der anderen. Weist in Adh.139 die Werbung von Hiḍimbas Schwester zurück, solange seine schlafende Familie in Gefahr ist, und fordert Hiḍimba zum Kampf heraus. Tötet in Adh.142 den Rākṣasa Hiḍimba im Zweikampf, indem er ihn zermalmt und entzweibricht. Wird in Adh.143 mit Hiḍimbā verheiratet (mit der Auflage, nachts zu den Brüdern zurückzukehren) und zeugt mit ihr den Sohn Ghaṭotkaca. Erklärt sich in Adh.149, von Kuntī vorgeschlagen, bereit, anstelle der Brahmanenfamilie den Tribut zum Rākṣasa Baka zu bringen und diesen zu bekämpfen. Bezwingt in Adh.151 den Rākṣasa Baka in einem Baum- und anschließendem Ringkampf. Wird in Kap.123, wagenlos, von Karṇas höhnischen, verletzenden Worten (u.a. als Vielfraß und Waffenloser verspottet) gequält und beklagt sich bei Arjuna darüber. In Kapitel 130 vollbringt er während der Nachtschlacht eine Reihe von Gewalttaten mit bloßen Händen: Er zermalmt den rachedurstigen Sohn des Kaliṅga-Königs sowie Karṇas Bruder Druma mit der Faust, tötet Jayarātha und dessen Wagenlenker, fängt einen von Karṇa geschleuderten goldenen Speer auf und erschlägt schließlich Dhṛtarāṣṭras Söhne Durmada und Duṣkarṇa mit Faust und Fuß, sodass ihn die entsetzten kauravischen Könige mit dem Gott Rudra vergleichen. In Kap.132 tötet er (mit tatkräftiger Unterstützung für Sātyaki) Somadatta mit, enthauptet dessen Vater Bāhlīka mit einem Keulenschlag - nachdem dieser ihn zuvor mit einem Speerwurf schwer verwundet hatte -, erschlägt sodann alle zehn Söhne Bāhlīkas einzeln sowie Karṇas Bruder Vṛṣaratha, sieben Schwäger Dhṛtarāṣṭras, den Krieger Śatacandra und fünf Brüder Śakunis (Gajākṣa, Śarabha, Subhaga, Bhānudatta und einen weiteren). In Kap.151-152 des Droṇaparva wird er zum Ziel des rachsüchtigen Rākṣasa Alāyudha, eines Verwandten der von ihm einst erschlagenen Baka, Kirmīra und Hiḍimba; im nächtlichen Zweikampf verliert er Bogen, Pferde und Wagenlenker an Alāyudha, liefert sich mit ihm ein erbittertes Keulen- und Ringduell und wird schließlich von Kṛṣṇa zu seinem eigenen Schutz durch die Entsendung seines Sohnes Ghaṭotkaca unterstützt. Sein Sohn Ghaṭotkaca vollstreckt in Kap.153 an seiner Stelle die Tötung Alāyudhas, was Duryodhana als Erfüllung von Bhīmasenas eigenem, längst geschworenen Racheeid erkennt."},{"term":"Bhīṣma","category":"Person","definition":"Geburtsname Devavrata, Sohn Śaṃtanus und der Gaṅgā (der überlebende achte Vasu). Verzichtet auf den Thron und gelobt lebenslange Ehelosigkeit, damit sein Vater Satyavatī, die Fischertochter, heiraten kann – daher sein Name ‚Bhīṣma' (‚der Furchtbare', Adh.94) und der Segen des selbstbestimmten Todeszeitpunkts (svacchandamaraṇa). Großvateronkel der Pāṇḍavas und Kauravas, für sein strenges Gelübde berühmt."},{"term":"Bhīṣma / Gāṅgeya","category":"Person","definition":"Sohn der Gaṅgā und des Śāntanu, Großonkel der Pāṇḍavas und Kauravas; „Gāṅgeya“ („Sohn der Gaṅgā“) ist einer seiner Beinamen."},{"term":"Bhīṣmaka","category":"Person","definition":"König der Bhojas, mit Jarāsandha verbündet; Vater der Rukmiṇī, die später Kṛṣṇas Gattin wird."},{"term":"Bhūmiṃjaya","de":"Sohn Virāṭas und der Sudeṣṇā, andernorts auch Uttara genannt; wird von Virāṭa zum Hüter der Stadt bestimmt, während dieser gegen die Trigartas zieht."},{"term":"Bhūri","category":"Person","definition":"Ein Kaurava-Krieger (Bruder Bhūriśravas'), greift in Kap.36 gemeinsam mit anderen Abhimanyu an. In Kapitel 141 fällt er im Zweikampf mit Sātyaki: Nachdem beide einander wiederholt verwundet und ihre Bögen zerschnitten haben, durchbohrt Sātyaki ihn mit einem Speer in der Brust, und er stürzt tödlich getroffen von seinem Wagen."},{"term":"Bhūriśravas","category":"Person","definition":"Sohn Somadattas aus dem Kuru-Geschlecht von Bāhlika (patronymisch auch Saumadatti genannt), bedeutender Wagenkämpfer, auch Yūpaketu genannt; kämpft in Kap.70 gegen Sātyakis zehn Söhne und gegen Sātyaki selbst. In Kap.117 liefert er sich einen gewaltigen Zweikampf mit Sātyaki und wirft ihn im Ringkampf nieder, doch Arjuna trennt ihm mit einem Pfeilschuss den schwertführenden Arm ab, um Sātyaki zu retten. In Kap.118 klagt er Arjuna deswegen an, wird von diesem und von Kṛṣṇa aber verteidigt und setzt sich, von Kṛṣṇa in dessen reine Welten entlassen, zum rituellen Todesfasten (prāyopaveśa) nieder; wird dort trotz Zurückhaltung durch mehrere Krieger von dem grollenden Sātyaki enthauptet - eine von den Heeren scharf verurteilte Tat."},{"term":"Bhūtakarman","category":"Person","definition":"'Versammlungsherr' (sabhāpati), Krieger auf Kaurava-Seite; hält in Droṇaparva Kap.24 Śatānīka, Nakulas Sohn, auf, wird aber von diesem arm- und kopflos gemacht."},{"term":"Bhūtavarman","category":"Person","definition":"Krieger auf Kaurava-Seite; in Droṇaparva Kap.19 unter den 'Augen' der von Droṇa gebildeten Garuḍa-Heeresformation genannt."},{"term":"Bhṛgu","category":"Person","definition":"Einer der großen Ṛṣis (Brahmarṣis), Stammvater des Bhārgava-Geschlechts; Gemahl Pulomās, Vater Cyavanas."},{"term":"Bhṛgutuṅga","category":"Ort","definition":"Eine heilige Bergstätte, die Arjuna auf seiner Pilgerreise besucht."},{"term":"Bindusaras","category":"Ort","definition":"Ein heiliger See nördlich des Kailāsa beim Berg Maināka, wo laut Erzählung Bhagīratha lange weilte und zahlreiche Götter-Opfer stattfanden."},{"term":"Bodhapiṅgala","category":"Person","definition":"Adhvaryu-Priester (Ausführungspriester) beim Sarpasatra Janamejayas."},{"term":"Brahmacārin","category":"Konzept","definition":"Schüler in der ersten Lebensstufe (āśrama), der beim Lehrer lebt, studiert und Enthaltsamkeit übt."},{"term":"Brahmadaṇḍa","category":"Begriff","definition":"„Brahma-Stab“; bildlicher Ausdruck für die unwiderstehliche Fluchmacht eines Brahmanen."},{"term":"Brahmamaha","category":"Ritual/Fest","definition":"Ein in Adh.152 erwähntes Fest zu Ehren der Brahmanen bzw. des Brahman, veranstaltet nach der Rettung Ekacakrās vor dem Rākṣasa Baka; genaue Form unsicher [?]."},{"term":"Brahmaśiras","category":"Konzept","definition":"Überaus mächtige, von Droṇa an Arjuna übergebene Waffe samt Anwendungs- und Rückholformel; niemals gegen Menschen einzusetzen, da sie die ganze Welt verbrennen könnte (Adh.123)."},{"term":"Brahmā","category":"Gottheit","definition":"Der Schöpfergott, „Großvater“ (pitāmaha) der Wesen; hier in der kosmogonischen Genealogie als Erstgeborener aus dem Welt-Ei genannt."},{"term":"Budbudā","category":"Person","definition":"Eine der fünf Apsaras, die mit Vargā zusammen in Krokodile verwandelt wurden."},{"term":"Budha","category":"Person","definition":"Der Gott des Planeten Merkur, Sohn des Mondgottes Soma."},{"term":"Bāhlika","category":"Person","definition":"Kuru-Ältester (verwandt mit dem Bāhlīka-Herrscherhaus), bei der Ankunft der Pāṇḍava-Familie in Hāstinapura zugegen (Adh.117)."},{"term":"Bāhlīka","category":"Person (König)","definition":"Sohn Pratīpas, großer Wagenkämpfer, Bruder Devāpis und Śaṃtanus (Adh.89). In Kap.132 rächt er den Fall seines Sohnes Somadatta, verwundet Bhīma schwer mit einem Speerwurf, wird von diesem aber mit einem Keulenschlag enthauptet."},{"term":"Bāhuka","desc":"Name, den Nala auf Karkoṭakas Anraten annimmt, um verborgen als Wagenlenker in den Dienst König Ṛtuparṇas zu treten."},{"term":"Bāṇa","category":"Wesen","definition":"Sohn Balis, großer Asura."},{"term":"Bībhatsu","category":"Person/Beiname","definition":"Ein Beiname Arjunas; wird ab Adh.158 verwendet."},{"term":"Bṛhadaśva","category":"Weiser","note":"Ein Seher, der Yudhiṣṭhira im Wald aufsucht und ihm die Erzählung von Nala und Damayantī vorträgt."},{"term":"Bṛhadbala","category":"Person","definition":"König von Kosala, Verbündeter der Kauravas, auch als \"Paurava\" bezeichnet; kämpft in Kap.13 gegen Abhimanyu (entwaffnet und am Haarschopf gepackt) und in Kap.43 gegen Abhimanyu. Auch 'Kausalya' (aus Kosala stammend) genannt; fällt in Kap.32 zusammen mit anderen Kriegern durch Abhimanyu. In Kap.46 wird sein Tod durch Abhimanyu erneut und ausführlich geschildert (Herzdurchbohrung im Zweikampf, gefolgt von der Flucht seiner zehntausend Soldaten) — ein offensichtlicher Widerspruch zur bereits in Kap.32 berichteten Tötung, wie er in der kritischen Ausgabe des Mahābhārata bei Nebenfiguren gelegentlich vorkommt [?]. In Kap.48 erinnert Yudhiṣṭhira in seiner Lobrede auf den gefallenen Abhimanyu noch einmal an dessen Sieg über 'den großen Wagenkämpfer, den König von Kosala' samt zehntausend Soldaten."},{"term":"Bṛhaddyumna","desc":"König, der eine große Opfersitzung abhielt, bei der Raibhyas Söhne Arvāvasu und Parāvasu als Priester dienten."},{"term":"Bṛhadratha","category":"Person","definition":"Ältester Sohn Uparicara Vasus, berühmter König von Magadha."},{"term":"Bṛhannaḍā","desc":"Arjunas weibliche Deckidentität am Hof Virāṭas: ein Eunuch/Tanz- und Musiklehrer im Frauengemach, gestützt auf den befristeten Urvaśī-Fluch aus dem Ādiparva."},{"term":"Bṛhanta","category":"Person","definition":"Krieger auf Kaurava-Seite, Bruder Kṣemadhūrtis (Droṇaparva Kap.24)."},{"term":"Bṛhaspati","category":"Gottheit","definition":"Guru und Hauspriester der Götter."},{"term":"Bṛhatkṣatra","category":"Person","definition":"Ein Kaikeya-Prinz auf Pāṇḍava-Seite, kämpft in Kap.43 gegen Kṛpa."},{"term":"Bṛhatsenā","category":"Person","note":"Amme bzw. Vertraute Damayantīs."},{"term":"Caitraratha","category":"Ort","definition":"Der paradiesische Lustgarten des Gottes Kubera; dient hier als Vergleichsbild für Kaṇvas Wald."},{"term":"Caitraseni","category":"Person","definition":"Sohn/Nachkomme Citrasenas, Enkel Dhṛtarāṣṭras; hält in Droṇaparva Kap.24 Śrutakarman auf."},{"term":"Caitya-Baum","category":"Konzept","definition":"Ein einzeln stehender, als heilig verehrter Kultbaum, in Adh.138 als Gleichnis für den Wert von Verwandtschaft/Gemeinschaft herangezogen."},{"term":"Cakravartin","category":"Begriff","definition":"Der ideale Weltenherrscher, »dessen (Streitwagen-)Rad rollt«; sein Rad soll bis an die Grenzen der Erde ungehindert vordringen. Bharata, Śakuntalās und Duḥṣantas Sohn, wird als solcher geweissagt."},{"term":"Cakṣuṣī-Vidyā","category":"Konzept/Wissen","definition":"Eine geheime, von Manu über Soma und Viśvāvasu überlieferte Sehkraft-Wissenschaft, die es erlaubt, alles Gewünschte in den drei Welten zu sehen; wird Arjuna in Adh.158 vom Gandharva Aṅgāraparṇa gelehrt."},{"term":"Campā","desc":"Hauptstadt des Sūta-/Aṅga-Gebiets, in das der ausgesetzte Korb mit dem Kind Karṇa auf dem Gaṅgā-Strom treibt; später Karṇas eigenes Fürstentum als König von Aṅga."},{"term":"Candradeva","category":"Person","definition":"Sohn des Samudrasena, von Rudras Energie, kämpft mit 'ozeanischen', mondfarbenen Pferden gegen Droṇa (Droṇaparva Kap.22)."},{"term":"Candraketu","category":"Person","definition":"Kauravischer Krieger, in Kap.47 von Abhimanyu zusammen mit vier weiteren Kriegern (Śatruṃjaya, Meghavega, Suvarcas, Sūryabhāsa) erschlagen, bevor Abhimanyu sich Śakuni zuwendet."},{"term":"Candravarman","category":"Person","definition":"Krieger auf Kaurava-Seite, in Kap.31 von Dhṛṣṭadyumna zusammen mit Bṛhatkṣatra Paurava erschlagen."},{"term":"Carmaṇvatī","category":"Ort/Fluss","definition":"Fluss, der die Südgrenze von Drupadas verbleibendem Pāñcāla-Reich markiert (Adh.128; der heutige Chambal)."},{"term":"Caṇḍabhārgava","category":"Person","definition":"Brahmane aus der Nachkommenschaft Cyavanas, Hotṛ-Priester (Rezitationspriester) beim Sarpasatra Janamejayas."},{"term":"Caṇḍakauśika","category":"Person","definition":"Weiser Asket, der dem kinderlosen König Bṛhadratha von Magadha eine wundertätige Mangofrucht schenkte, aus deren Genuss durch seine beiden Gattinnen Jarāsandha entstand."},{"term":"Cedi","category":"Sache","definition":"Königreich Uparicara Vasus, später u.a. mit Śiśupāla verbunden."},{"term":"Cekitāna","category":"Person","definition":"Ein Vṛṣṇi-Krieger, der später auf Seiten der Pāṇḍavas im großen Krieg kämpft."},{"term":"Citra","category":"Person","definition":"'Der Bunte'; ein Krieger auf Pāṇḍava-Seite mit vielgestaltiger, juwelenbunter Rüstung und Ausstattung (Droṇaparva Kap.22). Nicht zu verwechseln mit dem Krieger Citrāyudha oder anderen 'citra'-Komposita desselben Kapitels."},{"term":"Citraketu","category":"Person","definition":"Pāṇḍava-verbündeter Krieger, der in Kap.91 unter den auf Bhagadatta zustürmenden Helden genannt wird."},{"term":"Citrakūṭa","desc":"Berg im Wald, an dem Rāma und Lakṣmaṇa sich zu Beginn ihres Exils niederlassen und wo Bharata sie aufsucht, um Rāma zur Rückkehr zu bewegen."},{"term":"Citrasena","category":"Person","definition":"Ein Sohn Dhṛtarāṣṭras, der die zurückkehrenden Pāṇḍavas mit empfangen hilft. Stirbt in Kap.112 im Angriff auf Bhīma zusammen mit sechs Brüdern, darunter Vikarṇa. In Kapitel 143 liefert er sich ein wechselvolles Duell mit Śatānīka (dem Sohn Nakulas): Zunächst verliert er seine Rüstung und sein Banner, schlägt aber mit einem neuen, unzerreißbaren Bogen zurück und tötet Śatānīkas Pferde und Wagenlenker; als schließlich auch sein eigener Bogen zerschnitten wird und Pferde sowie Wagenlenker fallen, besteigt er den Wagen Kṛtavarmans (Hārdikyas)."},{"term":"Citravāhana","category":"Person","definition":"König von Maṇalūra, Vater Citrāṅgadās."},{"term":"Citrāyudha","category":"Person","definition":"Ein Krieger auf Pāṇḍava-Seite mit kiṃśuka-blütenfarbenen Pferden, bunter Rüstung, Waffe und Banner (Droṇaparva Kap.22)."},{"term":"Citrāṅgada","category":"Person","definition":"Älterer Sohn Śaṃtanus und Satyavatīs, von einem Gandharva vor Erreichen der Jugendreife getötet (Adh.90)."},{"term":"Citrāṅgadā","category":"Person","definition":"Königin von Maṇipūra, eine der Gattinnen Arjunas, Mutter Babhruvāhanas."},{"term":"Cola","category":"Volk/Reich","note":"Ein bedeutendes Volk bzw. Reich im südlichen Indien."},{"term":"Cyavana","category":"Person","definition":"Weiser aus dem Bhṛgu-Geschlecht, der Sukanyā heiratete und durch die Aśvins zur Jugend zurückgeführt wurde."},{"term":"Cāraṇa","category":"Wesen","definition":"Klasse himmlischer Wandersänger/Barden, oft zusammen mit Siddhas und Gandharvas genannt."},{"term":"Cīna","category":"Volk","note":"Bezeichnung für China bzw. die Chinesen in der altindischen Literatur."},{"term":"Cūcupa","category":"Volk","definition":"Ein Volk, zusammen mit Tuṣāras, Yavanas und Śakas auf dem rechten Flügel der Krauñca-Heeresformation in Kap.71 genannt."},{"term":"Dadhīca","desc":"Ein großer Weiser, der später (per bekannter Legende) den Göttern seine Knochen für Indras Vajra opfert; hier mit einem heiligen Badeplatz verbunden."},{"term":"Dadhīci","category":"Person","definition":"Ein Weiser, aus dessen Gebeinen der Sage nach Indras Donnerkeil gefertigt wurde. In Adh.127 als Beispiel für die verborgene, überirdische Herkunft von Helden genannt (Ursprung des Vajra)."},{"term":"Daitya","category":"Sache","definition":"Bezeichnung der Dämonen (Asuras) als Nachkommen der Diti."},{"term":"Dakṣa","category":"Person","definition":"Ein Prajāpati (Schöpfungsherr), Sohn des Pracetas, Vater vieler Wesen in der vedischen Genealogie."},{"term":"Damana","category":"Weiser","note":"Brahmanenweiser, der König Bhīma von Vidarbha den Segen der Kinder Damayantī, Dama, Dānta und Damana gewährt."},{"term":"Damayantī","category":"Person","definition":"Prinzessin von Vidarbha, Gattin Nalas, Inbegriff der treuen, standhaften Ehefrau."},{"term":"Dambhodbhava","category":"Person","definition":"Ein hochmütiger König in einer Nebenerzählung des Āraṇyakaparva, der von zwei asketischen Brüdern in seinem Stolz zurechtgewiesen wird."},{"term":"Danu","category":"Gottheit","definition":"Mutter der Dānavas, einer Klasse von Asuras/Dämonen."},{"term":"Darada","category":"Volk","definition":"Volk im Nordwesten des alten Indien, das in Kap.112 zusammen mit den Bāhlikas gegen Arjuna anstürmt."},{"term":"Darbha","category":"Sache","definition":"Heiliges Gras (Synonym zu Kuśa), das als Sitz-/Lagerunterlage bei Ritualen und im Wald verwendet wird."},{"term":"Dauḥśāsani","category":"Person","definition":"Patronymischer Beiname ('Sohn des Duḥśāsana') für den namentlich nicht genannten Sohn Duḥśāsanas; in dessen Gewalt Abhimanyu laut Kap.32 nach seinem Durchbruch durch die Cakra-Vyūha-Formation gerät und fällt."},{"term":"Daśagrīva","desc":"\"Der Zehnhalsige\", geläufiger Beiname Rāvaṇas nach seinen zehn Köpfen."},{"term":"Daśaratha","category":"Person","definition":"Legendärer König von Ayodhyā, Vater Rāmas; dessen Sohnes Opfer wird als Vergleichsbild angeführt."},{"term":"Daśeraka","category":"Volk","definition":"Ein von Kṛṣṇa im Kampf besiegtes Volk/Bergvolk; in Droṇaparva Kap.10 im Katalog der von Kṛṣṇa bezwungenen Völker genannt."},{"term":"Daśārṇa","category":"Ort","definition":"Königreich, dessen frühere Verfehlung gegen die Kurus Pāṇḍu als ersten Feldzug rächt (Adh.105)."},{"term":"Daṇḍadhāra","category":"Person","definition":"Ein Krieger auf Pāṇḍava-Seite mit pfeilschaftfarbenen, lotosstaubfäden-farbigen Pferden (Droṇaparva Kap.22)."},{"term":"Daṇḍaka","desc":"Wald, in dem Rāma während seines Exils mit Sītā und Lakṣmaṇa weilte."},{"term":"Daṇḍaketu","category":"Person","definition":"Ein Krieger auf Pāṇḍava-Seite; im Apparat zu Droṇaparva Kap.22 wird ihm die ausführliche Vorgeschichte eines Pāṇḍya-Königs zugeordnet, dessen Vater von Kṛṣṇa erschlagen wurde und der später Waffenkunde von Bhīṣma, Droṇa, Paraśurāma und Kṛpa erwarb."},{"term":"Daṇḍakāraṇya","desc":"Der große Wald, in dem Rāma, Sītā und Lakṣmaṇa den Großteil ihres Exils verbringen und in dem sich die Ereignisse um Śūrpaṇakhā, Khara und Dūṣaṇa zutragen."},{"term":"Devadatta","category":"Waffe","definition":"Die dröhnende Muschel Arjunas, ursprünglich Varuṇa gehörig, von Maya überreicht."},{"term":"Devaka","category":"Person","definition":"Name mehrerer Figuren: (1) ein Gandharva-Herrscher, der als Menschenkönig wiedergeboren wird (vgl. Aṃśāvataraṇa); (2) ein König, dessen Pāraśavī-Tochter Bhīṣma in Adh.106 für Vidura zur Frau erwirbt. Ob es sich um dieselbe Figur handelt, bleibt im Text offen."},{"term":"Devakī","category":"Person","definition":"Gemahlin Vasudevas, Mutter Kṛṣṇas (Viṣṇus Inkarnation)."},{"term":"Devala","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Devasenā","desc":"Tochter Prajāpatis, von Indra vor dem Dämon Keśin gerettet; sie fordert einen unbesiegbaren Gatten und wird später mit Skanda (Kārttikeya) vermählt."},{"term":"Devavrata","category":"Person","definition":"Geburtsname Bhīṣmas, Sohn Śaṃtanus und der Gaṅgā (Adh.90); siehe [[Bhīṣma]]."},{"term":"Devayānī","category":"Person","definition":"Tochter des Asura-Priesters Śukra (Uśanas), eine der beiden Gattinnen Yayātis; Mutter von Yadu und Turvasu."},{"term":"Devaśarman","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Devāpi","category":"Person","definition":"Ältester Sohn Pratīpas; zog aus Verlangen nach Dharma in die Verbannung, anstatt die Herrschaft zu übernehmen (Adh.89)."},{"term":"Dhanaṃjaya","category":"Person","definition":"Beiname Arjunas, wörtlich Reichtumsgewinner."},{"term":"Dhanvantari","category":"Gottheit","definition":"Arztgott; erhebt sich beim Samudra-Manthana mit dem Gefäß des Amṛta in der Hand."},{"term":"Dharma","category":"Gottheit","definition":"Gott der Weltordnung und Rechtschaffenheit (oft mit Yama gleichgesetzt); von Māṇḍavya wegen unverhältnismäßiger Bestrafung verflucht, als Mensch geboren zu werden – daraus entsteht Vidura (Adh.100-101)."},{"term":"Dharma (Gottheit)","category":"Gottheit","definition":"Aus Brahmās rechter Brust geborener personifizierter Dharma; Vater Yudhiṣṭhiras; Vater von Śama, Kāma und Harṣa mit den zehn Dakṣa-Töchtern als Gattinnen."},{"term":"Dharmarāja","category":"Gottheit","definition":"Epitheton Yamas, des Totengottes und Herrn des Rechts (dharma); entscheidet hier über die Wiederbelebung Pramadvarās."},{"term":"Dharā","category":"Gottheit","definition":"Die Erdgöttin ('die Tragende'), auch als 'Kṣamā' ('die Geduldige') angesprochen; nach der in Kap.28 erzählten Vorgeschichte näherte sie sich einst Nārāyaṇa und erbat sich von ihm einen Viṣṇu gleichenden Sohn samt der unfehlbaren Vaiṣṇava-Waffe, woraus ihr Sohn Naraka hervorging."},{"term":"Dhaumya","category":"Person","definition":"Weiser (Āyoda), Lehrer der drei Schüler Upamanyu, Āruṇi und Veda; prüft sie durch harte Aufgaben."},{"term":"Dhundhu","desc":"Ein mächtiger Asura, der zur Vernichtung der Welten furchtbare Askese übt und später von Kuvalāśva, ausgestattet mit Viṣṇus Kraft, getötet wird, wodurch dieser den Beinamen Dhundhumāra erhält (Vanaparva)."},{"term":"Dhārtarāṣṭra","category":"Person","definition":"Patronymikon für die Söhne des Dhṛtarāṣṭra, allen voran Duryodhana; Sammelbezeichnung für die Kaurava-Partei."},{"term":"Dhātā","category":"Person","definition":"Einer der zwölf Āditya-Götter, Ordner des kosmischen Rechts."},{"term":"Dhātṛ","category":"Begriff","definition":"„Der Schöpfer/Verfüger“, einer der Namen des kosmischen Ordners/Schöpfergottes, oft zusammen mit dem gleichbedeutenden „Vidhātṛ“ genannt; in Draupadīs Klage (Vana 31) die zentrale Instanz absoluter göttlicher Macht über das Schicksal aller Wesen."},{"term":"Dhātṛ / Vidhātṛ","category":"Gottheit","definition":"Die beiden webenden Frauen aus Uttaṅkas Vision in der Schlangenwelt, gedeutet als Schöpfer-/Ordner-Gottheiten, deren schwarze und weiße Fäden Nacht und Tag sind."},{"term":"Dhūmrākṣa","desc":"Rākṣasa-Feldherr Rāvaṇas, von Hanumant im Kampf um Laṅkā erschlagen."},{"term":"Dhṛtarāṣṭra","category":"Person","definition":"Blinder König der Kurus, Vater der hundert Kauravas, Sohn des Vyāsa mit der Witwe des Vicitravīrya. Daneben auch Name eines der vornehmsten Nāgas in Sūtas Namenskatalog (Adhyāya 31) – nicht identisch mit dem Kuru-König. Nach Adhyāya 61 (Aṃśāvataraṇa) die Wiedergeburt des Gandharva-Herrn Haṃsa, Sohn der Ariṣṭā. In Adh.89 trägt zudem ein ferner Vorfahre in der Paurava-Genealogie (Sohn eines früheren Janamejaya) ebenfalls den Namen Dhṛtarāṣṭra – ein Namensvetter, nicht identisch mit dem blinden Kuru-König. Fragt Saṃjaya in Kap.128 ängstlich, ob Duryodhana inmitten des allgemeinen Gemetzels dem Kampf den Rücken gekehrt habe und warum ihn seine Beschützer (Droṇa, Karṇa, Kṛpa, Kṛtavarman) nicht zurückgehalten hätten; erhält von Saṃjaya den Bericht von dessen furchtlosem, verheerendem Vordringen in das feindliche Heer. In Kapitel 129 fragt er Saṃjaya ängstlich, wie die Pāṇḍavas den zornigen Droṇa umzingelt hätten und wie der greise Lehrer letztlich in den Tod geraten sei. Beklagt sich in Kap.139 bei Sañjaya, dass dieser ihm stets nur die Stärke und Unversehrtheit der Feinde, nie aber die seiner eigenen Truppen berichte, sondern von diesen nur Niederlage, Tod und Verwirrung."},{"term":"Dhṛṣṭadyumna","category":"Person","definition":"Sohn des Drupada, Bruder Draupadīs, Heerführer der Pāṇḍavas; tötet Droṇa. Nach Adhyāya 61 ein Anteil des Feuergottes Agni (Aṃśāvataraṇa). In Adh.155 detailliert erzählt: entsteht bewaffnet aus dem von Yāja und Upayāja für Drupada vollzogenen Opferfeuer, eigens zur künftigen Tötung Droṇas bestimmt; wird dennoch von Droṇa selbst als Waffenschüler aufgenommen. In Kap.131 kämpft er an Ghaṭotkacas Seite gegen Aśvatthāman und rettet den von dessen Pfeil getroffenen, gefallenen Ghaṭotkaca, indem er ihn auf einen anderen Wagen fortbringt. In Kap.135 fordert er Aśvatthāman zum Zweikampf heraus und erklärt offen, ihn erst nach Droṇas Tod töten zu wollen, wie es sein Gelübde vorschreibt; im folgenden Pfeilduell verliert er Banner, Bogen und Gespann an Aśvatthāman. Wird in Kap.139 von Duryodhana selbst als der einzige Pāṇḍava-Krieger benannt, der Droṇa im Kampf besiegen könnte. In Kap.145 greift er Droṇa im nächtlichen Kampf direkt an, wird jedoch von diesem sowie von sieben zu Droṇas Schutz herbeieilenden Kriegern (darunter Aśvatthāman, Śalya, Duḥśāsana, Duryodhana und Śakuni) schwer bedrängt; er erschlägt dabei im Zweikampf den Krieger Drumasena, ehe Sātyaki ihm zu Hilfe eilt. In Adh.148 kämpft er im Duell gegen Karṇa; als Wagen, Pferde und Bogen zerstört sind, greift er zur Keule, zermalmt Karṇas Pferde und flieht dann, von Yudhiṣṭhira zurückgehalten, auf Sahadevas Wagen. In Kap.161 schwört er nach dem Tod seines Vaters Drupada, Virāṭas und der drei Enkel Drupadas inmitten der Krieger einen feierlichen Eid, Droṇa zu töten, und greift ihn daraufhin mit seiner Heeresabteilung an; von Bhīma wird er dabei scharf zurechtgewiesen, weil er es nicht allein wage, sich Droṇa zu stellen."},{"term":"Dhṛṣṭaketu","category":"Person","definition":"König, Wiedergeburt des Daitya Anuhrāda. König der Cedis, Sohn des Śiśupāla, daher auch Śaiśupāli (Patronymikon) bzw. Caidya genannt. Fällt in Droṇaparva Kap.101 im Zweikampf gegen Droṇa, nachdem er ihn mit Keule, Wurfspieß und Lanze angegriffen hat; sein Sohn übernimmt daraufhin von Rachezorn erfasst den Kampf."},{"term":"Die fünf Prāṇas (Lebensatem-Ströme)","desc":"Die fünf Erscheinungsformen des Lebensatems in der altindischen Physiologie: Prāṇa (Einatem, im Haupt), Apāna (Abwärtsatem, im After/Unterleib), Samāna (der gleichmäßig verteilende Atem), Udāna (Aufwärtsatem, wirkt bei Anstrengung und Kraft) und Vyāna (der alle Gelenke durchdringende Atem); zusammen tragen sie das innere Körperfeuer und die Verdauung."},{"term":"Dilīpa","category":"Person","definition":"Legendärer König der Sonnendynastie, Vorfahre Rāmas, Vergleichsbild für Janamejaya."},{"term":"Diti","category":"Gottheit","definition":"Mutter der Daityas, einer Klasse von Asuras/Dämonen."},{"term":"Ditī","category":"Wesen","definition":"Mutter der Daityas (im Gegensatz zu Aditi, Mutter der Ādityas/Götter); „ditidanuja“ = Söhne Ditis, Bezeichnung für die Daityas."},{"term":"Draupadeyas","category":"Person","definition":"Die fünf Söhne Draupadīs (je einer von Yudhiṣṭhira, Bhīma, Arjuna, Nakula und Sahadeva); eilen in Kap.89, angeführt von Abhimanyu, Ghaṭotkaca zu Hilfe."},{"term":"Draupadī","category":"Person","definition":"Tochter des Königs Drupada von Pāñcāla, gemeinsame Gemahlin der fünf Pāṇḍavas; aus dem Feuer geboren. Nach Adhyāya 61 der Anteil der Glücksgöttin Śrī, dort mit ausführlicher Schönheitsbeschreibung eingeführt (Aṃśāvataraṇa). In Adh.155 detailliert erzählt: entsteht zugleich mit Dhṛṣṭadyumna aus der Mitte von Drupadas Opferaltar, von göttlicher Schönheit; eine körperlose Stimme prophezeit ihre künftige Rolle beim Untergang der Kṣatriyas. Laut Vyāsas Erzählung in Adh.157 die Wiedergeburt einer Ṛṣi-Tochter, die durch fünffach wiederholte Bitte an Śiva die künftige Ehe mit fünf Gatten (den Pāṇḍavas) erwirkte."},{"term":"Draupadī / Kṛṣṇā","category":"Person","definition":"Tochter des Königs Drupada, gemeinsame Gattin der fünf Pāṇḍavas, gewonnen von Arjuna beim Svayaṃvara."},{"term":"Draviḍa","category":"Volk","note":"Die dravidischsprachigen Völker Südindiens."},{"term":"Droṇa","category":"Person","definition":"Waffenlehrer der Kaurava- und Pāṇḍu-Prinzen, Sohn des Bharadvāja, später Heerführer der Kauravas; fällt im Krieg. Nach Adhyāya 61 ein Anteil (aṃśa) des Götter-Ṛṣi Bṛhaspati (Aṃśāvataraṇa). Ausführliche Geburtsgeschichte in Adh.121: aus dem Samen Bharadvājas, den dieser beim Anblick der badenden Apsaras Ghṛtācī vergießt und in einem Gefäß (Droṇa) auffängt – daher der Name. Wächst mit Drupada auf, heiratet später Kṛpī, erhält von Rāma Jāmadagnya (Paraśurāma) alle Waffen samt Dhanurveda. Prüft in Adh.123 seine Schüler mit der Geier-Zielscheibe und übergibt Arjuna, der ihn nach einem Krokodilangriff in der Gaṅgā rettet, die Brahmaśiras-Waffe. Verlangt in Adh.128 als Gurudakṣiṇā die Gefangennahme Drupadas, verschont ihn, nimmt aber die Hälfte seines Reiches (Ahicchatra) und wird so selbst zum Herrscher. Seine Geburts- und Jugendgeschichte samt Gurudakṣiṇā-Episode wird in Adh.154 im Rahmen der Draupadī-Vorgeschichte erneut, knapper, erzählt. Hält in Kap.126, von Duryodhana wegen der Niederlagen scharf angegriffen, eine lange bittere Gegenrede: verweist auf Arjunas seit Bhīṣmas Fall erwiesene Unbezwingbarkeit, wirft Duryodhana vor, Viduras Warnungen missachtet und durch das Unrecht an den Pāṇḍavas (Draupadīs Erniedrigung, das betrügerische Würfelspiel) das Unheil selbst heraufbeschworen zu haben, übt scharfe Selbstkritik als bloßer „selbsternannter Brahmane“ (brāhmaṇabruvaḥ), der die geliebten Pāṇḍava-Schüler dennoch bekämpft, und kündigt schließlich an, trotz aller Bitterkeit bis zum Tod weiterzukämpfen; gibt Duryodhana zuletzt eine Botschaft an seinen Sohn Aśvatthāman mit, den Somakas keine Gnade zu zeigen, sowie väterliche Ermahnungen zur Tugend. In Kapitel 129 dringt Droṇa zornig, doch selbstbeherrscht in die Reihen der Pāṇḍavas ein; in der darauffolgenden schrecklichen Nachtschlacht wird er von sämtlichen Pāṇḍava-Helden gemeinsam angegriffen, durchbohrt aber selbst allein unzählige feindliche Elefanten, Wagen, Reiter und Fußsoldaten mit seinen Pfeilen. In Kap.131 wird in einem Apparatuseinschub (@020) sein eigener, separater nächtlicher Angriff auf die Pāṇḍavas geschildert, dem sich Arjuna, Kṛṣṇa und Bhīmasena entgegenstellen. In Kap.132 liefert er sich mit Yudhiṣṭhira ein Astra-Duell (u.a. Vāyavya-, Vāruṇa-, Yāmya-, Āgneya-, Tvāṣṭra-, Sāvitra-, Aindra-, Prājāpatya- und schließlich Brahmāstra), das dieser jeweils abwehrt; danach zerstreut Droṇa mit dem Vāyavya-Astra Drupadas Heer, bis Arjuna und Bhīma zu dessen Eindämmung zurückkehren. In Kap.137 gerät er in ein hartes Duell mit Yudhiṣṭhira, in dem er kurzzeitig von dessen Pfeilen betäubt wird und erneut das Vāyavya-Astra einsetzt, das Yudhiṣṭhira neutralisiert; zerstreut bei Einbruch der Nacht die Pāṇḍava-Pāñcāla-Truppen. Wird in Kap.139 von Duryodhana als derart mächtig eingeschätzt, dass unter den Pāṇḍava-Kriegern einzig Dhṛṣṭadyumna ihn im Kampf besiegen könne, weshalb Duryodhana seine Brüder und Verbündeten anweist, ihn von allen Seiten zu schützen. In Kap.145 wird er von Dhṛṣṭadyumna im nächtlichen Kampf direkt angegriffen und an der Brust getroffen, zerschlägt aber dessen Bogen; wird daraufhin von deinen Söhnen und zahlreichen Kriegern von allen Seiten beschützt. In Kap.147 werden er und Karṇa von Duryodhanas Vorwurfsrede zum Zorn angestachelt und richten daraufhin gemeinsam ein vernichtendes nächtliches Gemetzel unter dem fliehenden Pāṇḍava-Heer an, das sie von hinten mit Pfeilen niedermähen."},{"term":"Droṇaparva","category":"Werkteil","definition":"Das siebte Parva: die Schlacht unter Droṇas Oberbefehl."},{"term":"Druhyu","category":"Person","definition":"Sohn Yayātis und der Śarmiṣṭhā; lehnt es ab, dem Vater seine Jugend zu leihen."},{"term":"Druma","category":"Person","definition":"Herrscher, Wiedergeburt des Daitya Śibi."},{"term":"Drupada","category":"Person","definition":"König der Pāñcālas, Vater Draupadīs und Dhṛṣṭadyumnas; fällt im Droṇaparva. Nach Adhyāya 61 aus der Schar der Maruts geboren (Aṃśāvataraṇa), wie auch Sātyaki, Kṛtavarman und Virāṭa. Wächst laut Adh.121 als Sohn des Pṛṣata gemeinsam mit Droṇa an Bharadvājas Einsiedelei auf, bevor er nach dem Tod seines Vaters König der nördlichen Pāñcālas wird. Auch Yajñasena genannt. Weist in Adh.122 seinen einstigen Studienfreund Droṇa schroff zurück, als dieser sich auf ihre alte Freundschaft beruft – Ursprung von Droṇas späterer Rache. Wird in Adh.128 von Droṇas Schülern als Gurudakṣiṇā gefangen genommen, gedemütigt und muss die Hälfte seines Reiches an Droṇa abtreten; fasst daraufhin den Rachewunsch nach einem Sohn. In Kapitel 143 liefert er sich (unter seinem Beinamen Yajñasena) ein schweres Duell mit Vṛṣasena, Karṇas Sohn: Er verwundet ihn zunächst mit sechzig Pfeilen und zerschnitt später dessen Bogen, wird aber schließlich von einem neuen Bhalla-Pfeil Vṛṣasenas mitten ins Herz getroffen und sinkt ohnmächtig zusammen; sein Wagenlenker bringt ihn vom Schlachtfeld fort, woraufhin sein Heer die Flucht ergreift. In Kap.161 wird er, nachdem seine drei Enkel gefallen sind, zusammen mit Virāṭa von Droṇa in offener Feldschlacht mit zwei Pfeilen getötet."},{"term":"Durjaya","category":"Person","definition":"Ältester der drei Söhne der Śāradaṇḍāyanī aus ihrer Niyoga-Verbindung (Adh.111)."},{"term":"Durmarṣaṇa","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra, Bruder Duryodhanas; kämpft in Kap.42 im ersten allgemeinen Waffengang des Bhīṣmaparva. In Kap.110, nachdem er Karṇas Niederlage gegen Bhīma gesehen hat, greift er zusammen mit vier Brüdern (Duḥsaha, Durmada, Durdhara, Jaya) Bhīma an und wird von diesem getötet."},{"term":"Durmukha","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra, Bruder Duryodhanas; kämpft in Kap.42 im ersten allgemeinen Waffengang des Bhīṣmaparva. In Kap.109 auf Duryodhanas Geheiß entsandt, um dem wagenlosen Karṇa mit einem Wagen zu helfen; von Bhīma mit Pfeilen getötet, woraufhin Karṇa dessen Wagen übernimmt."},{"term":"Durvāsas","category":"Person","definition":"Für seinen Jähzorn berüchtigter Weiser; von der jungen Kuntī vorbildlich bedient, schenkt er ihr den Mantra zur Götteranrufung, der zu Karṇas Geburt führt (Adh.104). In Adh.113 wird enthüllt, dass Kuntī ihn schon als junges Mädchen im Haus ihres Vaters bediente; zufrieden schenkte er ihr ein Mantra, mit dem sie jeden beliebigen Gott herbeirufen kann – dasselbe Mantra, mit dem sie später Sūrya (Karṇas Vater, Adh.104) und, mit Pāṇḍus Erlaubnis, die Götter Dharma, Vāyu und Indra anruft."},{"term":"Duryodhana","category":"Person","definition":"Ältester Sohn des Dhṛtarāṣṭra (der Geburtsreihenfolge der 101 Krug-Kinder nach – Yudhiṣṭhira wurde jedoch zuerst geboren), Anführer der Kauravas, Hauptgegenspieler der Pāṇḍavas. Seiner Geburt gehen furchterregende Vorzeichen voraus; Vidura und die Brahmanen raten vergeblich zu seiner Aussetzung, um das Geschlecht zu retten (Adh.107). Nach Adhyāya 61 aus einem Anteil des Kali (Zeitalter der Zwietracht) entstanden (Aṃśāvataraṇa). Von Neid auf Bhīmas überragende Kraft und Gier nach der Herrschaft getrieben, unternimmt er in Adh.119 drei erfolglose Mordanschläge auf Bhīma (Ertränken, Schlangen, Gift). Tritt in Adh.124 zum Abschluss der Waffenschau mit Bhīma zum Keulenzweikampf an. Schließt in Adh.126 durch die spontane Königsweihe Karṇas zum Herrscher von Aṅga eine lebenslange Freundschaft mit diesem. Verteidigt Karṇa in Adh.127 mit einer Rede über die rätselhafte Herkunft wahrer Helden gegen Bhīmas Spott. Trägt in Adh.129, von der Volksstimmung für Yudhiṣṭhira aufgewühlt, Dhṛtarāṣṭra erstmals offen seine Sorge um die Kaurava-Thronfolge vor – Beginn der Intrigen, die zum Lākṣāgṛha-Anschlag führen. Schlägt in Adh.130 die Verbannung der Pāṇḍavas nach Vāraṇāvata vor und überzeugt den zögernden Dhṛtarāṣṭra mit einer Analyse der Machtverhältnisse am Hof. Weiht in Adh.132 seinen Minister Purocana in den Plan ein, die Pāṇḍavas in einem eigens errichteten brennbaren Haus (Lākṣāgṛha) in Vāraṇāvata zu ermorden. Verfällt in Kap.125 nach Jayadrathas Tod in tiefe Verzweiflung, hält Droṇa gegenüber eine lange Klagerede über die zahlreichen für ihn gefallenen Freunde und Verbündeten, wirft sich selbst Schuld vor, äußert leisen Vorwurf an Droṇas Nachsicht gegenüber Arjuna und schwört, entweder die Pāñcālas und Pāṇḍavas zu vernichten oder im Kampf zu fallen. Wird in Kap.126 von Droṇa, den er wegen der Niederlagen scharf angreift, in einer langen Gegenrede zurechtgewiesen: Droṇa nennt als eigentliche Ursache des Unheils Duryodhanas eigenes Unrecht an den Pāṇḍavas. Wirft Droṇa in Kap.127 gegenüber Karṇa vor, die Schlachtordnung absichtlich für Arjuna geöffnet und damit Jayadrathas Tod verschuldet zu haben; wird von Karṇa mit dem Hinweis auf Arjunas eigene Überlegenheit und die Macht des Schicksals (daiva) zurechtgewiesen. Stürzt sich in Kap.128, von Jayadrathas Tod erschüttert und zum Sterben entschlossen, furchtlos in das Pāṇḍava-Heer und richtet schwere Verluste an, bis Yudhiṣṭhira ihn im Zweikampf so schwer verwundet, dass er besinnungslos zusammensinkt; erholt sich jedoch und stürzt sich, von Droṇa unterstützt, erneut in den Kampf. In Kap.133 bittet er, angesichts der sich neu formierenden Pāṇḍava-Streitmacht, Karṇa dringlich um Rettung, woraufhin dieser großspurig den Sieg verspricht. In Kap.134 will er, nachdem Karṇa von Arjuna besiegt wurde, selbst gegen Arjuna in den Kampf ziehen und hält eine großspurige Rede über seine eigene Kraft; auf Kṛpas Warnung hin überlässt er den Kampf gegen die Pāñcālas und Somakas schließlich Aśvatthāman. In Kap.135 erhält er von Aśvatthāman die Zusage, trotz dessen Zuneigung zu den Pāṇḍavas mit voller Kraft für ihn zu kämpfen, muss sich zugleich aber dessen Vorwurf von Habgier und Misstrauen anhören. Als in Kap.138 beide Heere in der von Finsternis und Staub verhüllten Nacht blindlings aufeinander einschlagen, lässt er die Fußtruppen die Waffen kurz ablegen und stattdessen brennende Lampen tragen, um das Schlachtfeld zu erhellen - woraufhin auch die Pāṇḍavas nachziehen und selbst himmlische Wesen sich mit Lichtern am nächtlichen Schauspiel beteiligen. Weist in Kap.139, von Droṇas nächtlicher Kampfbereitschaft erfahrend, seine Brüder und Verbündeten eindringlich an, Droṇa von allen Seiten zu schützen, da unter den Pāṇḍava-Kriegern einzig Dhṛṣṭadyumna ihn im Kampf besiegen könne; sagt zugleich großspurig voraus, Aśvatthāman werde Dhṛṣṭadyumna vernichten, Karṇa werde Arjuna und er selbst werde Bhīmasena besiegen. In Kapitel 141 liefert er sich, nachdem Bhīmasena gegen Droṇas Wagen vorgedrungen war, ein langes Zweikampf-Pfeilduell mit Bhīmasena, in dem beide wiederholt einander die Bögen zerschneiden; als Bhīmasenas Keule seine Pferde und seinen Wagenlenker zermalmt, springt er auf den Wagen Nandakas über, wird aber von seinem eigenen Heer und von Bhīmasena zunächst für tot gehalten. In Kap.145 folgt er Karṇas Rat, entsendet Śakuni mit einer großen Streitmacht aus zehntausend Elefanten, zehntausend Wagen und Fußvolk sowie mehreren Kaurava-Kriegern gegen Arjuna, mit der ausdrücklichen Anweisung, Arjuna, Kṛṣṇa und die übrigen Pāṇḍava-Brüder zu töten. In Kap.146 greift er selbst Sātyaki im nächtlichen Kampf an, wird jedoch schwer bedrängt: Sātyaki tötet seine Pferde und seinen Wagenlenker und zerschlägt seinen Bogen, sodass er wagen- und bogenlos auf Kṛtavarmans Wagen fliehen muss. In Kap.147 hält er Droṇa und Karṇa eine scharfe Vorwurfsrede: Er erinnert beide daran, dass er den Krieg gegen die Pāṇḍavas nur auf ihre eigene Zusicherung des Sieges hin begonnen habe, und fordert sie auf, endlich mit voller Kraft zu kämpfen, statt seinem untergehenden Heer tatenlos zuzusehen. In Adh.149 beauftragt er Alaṃbala, den Sohn des Jaṭāsura, mit dem Kampf gegen Ghaṭotkaca, und erhält von diesem nach dessen Sieg Alaṃbalas abgeschlagenes Haupt auf seinen Wagen geworfen samt einer drohenden Ankündigung, bald auch Karṇas Ende mitanzusehen."},{"term":"Duḥsaha","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra, Bruder Duryodhanas; kämpft in Kap.42 im ersten allgemeinen Waffengang des Bhīṣmaparva. In Kap.110, nachdem er Karṇas Niederlage gegen Bhīma gesehen hat, greift er zusammen mit vier Brüdern (Durmarṣaṇa, Durmada, Durdhara, Jaya) Bhīma an und wird von diesem getötet."},{"term":"Duḥśalā","category":"Person","definition":"Einzige Tochter Dhṛtarāṣṭras und Gāndhārīs, aus demselben Fleischklumpen wie die hundert Kaurava-Söhne hervorgegangen (Adh.107)."},{"term":"Duḥśāsana","category":"Person","definition":"Zweiter Sohn des Dhṛtarāṣṭra, Bruder Duryodhanas. Nach Adhyāya 61 einer der Paulastyas (Rākṣasa-Nachkommen des Pulastya), die als die hundert Kaurava-Brüder wiedergeboren wurden (Aṃśāvataraṇa). In Kapitel 143 liefert er sich ein hartes Duell mit Prativindhya, Yudhiṣṭhiras Sohn: Er verwundet ihn an der Stirn und vollbringt die schwierige Leistung, dessen Pferde, Wagenlenker, Banner, Wagen und schließlich auch den Bogen zu zerstören, woraufhin Prativindhyas Brüder mit einem großen Heer zu dessen Hilfe eilen. In Adh.149 wird er von Duryodhana beauftragt, Karṇa im Kampf zu bewachen und vor Unachtsamkeit gegenüber dem Rākṣasa Alaṃbala zu schützen."},{"term":"Duḥṣanta","category":"Person","definition":"Auch Duṣyanta; Geschlechtsbegründer der Pauravas, idealer Herrscher (Adhyāya 62), später (in der Tradition, u.a. bei Kālidāsa) Gemahl der Śakuntalā und Vater Bharatas, nach dem die Bhāratas benannt sind."},{"term":"Dvaipāyana","category":"Epitheton","definition":"‚Der auf einer Insel Geborene' – Beiname des Weisen Vyāsa."},{"term":"Dvaitavana","expl":"Ein Wald am Ufer eines gleichnamigen Sees, einer der wichtigsten weiteren Aufenthaltsorte der Pāṇḍavas während ihres Waldexils."},{"term":"Dvāpara","category":"Person/Dämon","note":"Personifikation des Zeitalters Dvāparayuga; Gefährte Kalis, der sich auf dessen Bitte in die Würfel begibt, um Nalas Sturz herbeizuführen."},{"term":"Dvārakā","category":"Ort","definition":"Die von Kṛṣṇa gegründete Hauptstadt der Yādavas an der Westküste."},{"term":"Dvāravatī","category":"Sache","definition":"Auch Dvārakā; Kṛṣṇas Hauptstadt, die Arjuna während seines Waldexils besuchte und wo er Subhadrā gewann."},{"term":"Dyaus","category":"Gottheit","definition":"Der jüngste der acht Vasu-Götter; raubt auf Bitten seiner Gattin die Wunschkuh Vasiṣṭhas und wird deshalb von diesem zu einem langen, kinderlosen Menschenleben verflucht – der spätere Devavrata/Bhīṣma (Adh.93)."},{"term":"Dyumatsena","desc":"Blind gewordener König der Śālvas, dem sein Reich von einem Nachbarfeind geraubt wurde; lebt mit Frau und Sohn Satyavant als Büßer im Wald."},{"term":"Dākṣāyaṇī","category":"Gottheit","definition":"„Tochter Dakṣas“; hier Beiname Vinatās."},{"term":"Dāmodara","category":"Epitheton","definition":"Beiname Kṛṣṇa-Vāsudevas."},{"term":"Dāruka","category":"Person","definition":"Kṛṣṇas Wagenlenker (Sūta). Bereitet in Kap.122, auf Kṛṣṇas vorausschauende nächtliche Anweisung hin, für Sātyaki einen eigenen, Kṛṣṇas Gespann gleichenden Wagen vor, mit dem dieser gegen Karṇa antritt; sein jüngerer Bruder fertigt später einen weiteren Prachtwagen für Sātyaki."},{"term":"Dārva","category":"Person","definition":"Herrscher von Magadha, von Pāṇḍu in Rājagṛha erschlagen (Adh.105)."},{"term":"Dāśeraka","category":"Volk","definition":"Volk, das in Kap.112 zusammen mit den Videhas und Kaliṅgas auf Kaurava-Seite gegen Arjuna anstürmt."},{"term":"Dāśārha","category":"Sache","definition":"Beiname der Angehörigen des Vṛṣṇi-Yādava-Stammes, zu dem auch Kṛṣṇa zählt."},{"term":"Dīrghalocana","category":"Person","definition":"Ein Kaurava-Krieger, greift in Kap.36 Abhimanyu an und wird von ihm getötet."},{"term":"Dīrghatamas","category":"Person","definition":"‚Langdunkel'; Seher, im Mutterleib der Mamatā von Bṛhaspati wegen einer Zurechtweisung zur Geburt in Blindheit verflucht; wird großer Weiser, von eigenen Söhnen ausgesetzt, von König Bali gerettet, zeugt per Niyoga u.a. Kākṣīvat und Aṅga (Adh.98)."},{"term":"Dūṣaṇa","desc":"Rākṣasa-Heerführer, gemeinsam mit Khara Beherrscher von Janasthāna, von Rāma im Kampf getötet."},{"term":"Dṛḍhasena","category":"Person","definition":"Ein Krieger im Heer der Pāṇḍavas, den Droṇa in Kap.20 im zehnten Kampftag fällt."},{"term":"Dṛḍhasyu","desc":"Sohn Agastyas und Lopāmudrās, auch Idhmavāha (,Brennholzträger') genannt; nach siebenjähriger Schwangerschaft geboren, schon als Kind veda-kundig."},{"term":"Dṛṣadvatī","desc":"Fluss, der zusammen mit der Sarasvatī die Grenzen von Kurukṣetra markiert."},{"term":"Ekacakrā","category":"Sache","definition":"Stadt, in der die als Brahmanen verkleideten Pāṇḍavas mit ihrer Mutter Kuntī nach der Flucht aus dem Lackhaus wohnten, bevor sie zu den Pāñcālas weiterzogen."},{"term":"Ekalavya","category":"Person","definition":"Niṣāda-Prinz, Wiedergeburt eines Krodhavaśa-Dämons; berühmt für seine Bogenkunst und die Daumen-Opfergabe an Droṇa in späteren Erzählungen. Ausführliche Erzählung in Adh.123: als Niṣāda-Sohn von Droṇa als Schüler abgewiesen, erlernt er heimlich vor einem selbstgeformten Lehmbild Droṇas die Bogenkunst bis zur Meisterschaft (demonstriert am nach dem Bellen zielenden Hund) und opfert auf Droṇas Verlangen als Lehrgeld seinen rechten Daumen, wonach seine frühere Schnelligkeit verloren geht. Laut Kṛṣṇas Rückblick in Kap.155 wurde er, wie zuvor Jarāsaṃdha, durch einen von Kṛṣṇa selbst ersonnenen Kunstgriff getötet, zum Nutzen der Pāṇḍavas. In Kap.156 präzisiert Kṛṣṇa den Kunstgriff: Droṇa gab sich ihm gegenüber durch List (chadman) als sein Lehrer aus, um ihn zu Arjunas Nutzen seines Daumens zu berauben - denn mit intaktem Daumen wäre Ekalavya für Götter, Dānavas, Rākṣasas und Schlangenwesen im Kampf unbesiegbar gewesen."},{"term":"Elāpatra","category":"Wesen","definition":"Einer der vornehmsten Nāgas, der als Einziger den Grund für Brahmās Nicht-Verhinderung des Mutter-Fluchs kennt und Vāsuki von der künftigen Rettung durch Āstīka berichtet."},{"term":"Gada","category":"Person","definition":"Ein Bruder Kṛṣṇas, Prinz der Vṛṣṇis."},{"term":"Gaja, Gav
