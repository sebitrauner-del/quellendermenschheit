erm":"Alaṃbala","category":"Krieger","definition":"Mächtiger Sohn des Rākṣasa Jaṭāsura (der einst von Bhīma in einem Ringkampf erschlagen wurde); tritt in Droṇaparva Adh.149 zu Duryodhana und bittet um Erlaubnis, aus Rache die Pāṇḍavas zu töten und ihr Fleisch zu verzehren, wird stattdessen auf Duryodhanas Geheiß gegen Ghaṭotkaca entsandt. Liefert sich mit diesem in mehrfach wechselndem Gestaltenkampf (Illusionswaffen, Faustkampf, Ringkampf) ein langes nächtliches Duell und wird schließlich von Ghaṭotkaca zu Boden geschmettert und enthauptet. [Anm.: Der Name ist von dem andernorts auftretenden, ähnlich klingenden Rākṣasa Alambusa/Alambuṣa zu unterscheiden.]"},{"term":"Jarāsaṃdha","category":"Person","definition":"Mächtiger König von Magadha, Feind Kṛṣṇas und der Vṛṣṇis; wird in Kap.155 von Kṛṣṇa rückblickend als einer der Gegner genannt, die durch von ihm selbst ersonnene Kunstgriffe (yogas) getötet wurden, zum Nutzen der Pāṇḍavas - eine Anspielung auf seinen Tod im Ringkampf gegen Bhīmasena, den Kṛṣṇa durch einen Hinweis (das Zerreißen des Körpers entlang der Symmetrieachse) ermöglichte. In Kap.156 erzählt Kṛṣṇa den Hergang näher: Jarāsaṃdha schleuderte seine glutrote Keule gegen die Vṛṣṇis, doch Balarāma wehrte sie mit der Sthūṇākarṇa-Astra ab; erst dadurch seiner Waffe beraubt, wurde er von Bhīmasena im Ringkampf getötet - mit Waffe in der Hand wäre er selbst für die Götter samt Indra unbesiegbar gewesen."},{"term":"Sthūṇākarṇa","category":"Waffe","definition":"Name einer Astra, die Balarāma in Kap.156 zur Abwehr von Jarāsaṃdhas glutroter Keule einsetzt und sie damit zu Boden schlägt; sonst kaum belegter Waffenname."}],"divisions":[{"key":"adi","name":"Ādiparva","desc":"Das Buch des Anfangs: Herkunft der Kuru-Dynastie, Geburt und Kindheit der Pāṇḍavas und Kauravas, Draupadīs Svayaṃvara – und die hier beginnende Rahmenerzählung.","intro":"Das erste der 18 Bücher. Es enthält, bevor die eigentliche Vorgeschichte der Kuru-Dynastie einsetzt, die Rahmenerzählung: Der Sūta-Sohn Ugraśravas trifft im Naimiṣa-Wald bei Śaunakas zwölfjährigem Opfer ein und wird gebeten, die von Vyāsa verfasste und von Vaiśampāyana am Schlangenopfer des Königs Janamejaya vorgetragene Geschichte zu erzählen. [Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"sabha","name":"Sabhāparva","desc":"Das Buch der Versammlungshalle: Yudhiṣṭhiras Königsweihe (Rājasūya), das schicksalhafte Würfelspiel, Draupadīs Demütigung und die Verbannung der Pāṇḍavas.","intro":"[Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"vana","name":"Vanaparva (Āraṇyakaparva)","desc":"Das Waldbuch: die zwölf Exiljahre der Pāṇḍavas, mit zahlreichen eingelagerten Erzählungen (u. a. Nala und Damayantī, Savitrī).","intro":"[Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"virata","name":"Virāṭaparva","desc":"Das Buch des Virāṭa: das dreizehnte, im Verborgenen zu verbringende Jahr am Hof des Königs Virāṭa.","intro":"[Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"udyoga","name":"Udyogaparva (Fortsetzung ab Kap.49)","desc":"Das Buch der Kriegsvorbereitung: gescheiterte Friedensverhandlungen, Kṛṣṇas Gesandtschaft, die Mobilmachung beider Heere.","intro":"Kapitel 1-48 dieses Parvas befinden sich in Teil 1 dieser Ausgabe; hier wird die Übersetzung ab Kapitel 49 fortgesetzt.","chapters":[]},{"key":"bhishma","name":"Bhīṣmaparva","desc":"Das Buch des Bhīṣma: Beginn der Schlacht von Kurukṣetra unter Bhīṣmas Oberbefehl; enthält die Bhagavadgītā.","chapters":[]},{"key":"drona","name":"Droṇaparva","desc":"Das Buch des Droṇa: die Schlacht unter Droṇas Führung, der Tod Abhimanyus.","chapters":[]},{"key":"karna","name":"Karṇaparva","desc":"Das Buch des Karṇa: die Schlacht unter Karṇas Führung und sein Zweikampf mit Arjuna.","chapters":[]},{"key":"shalya","name":"Śalyaparva","desc":"Das Buch des Śalya: die letzte Phase der Schlacht und Duryodhanas Fall.","chapters":[]},{"key":"sauptika","name":"Sauptikaparva","desc":"Das Buch des nächtlichen Überfalls: Aśvatthāmans Rachefeldzug im Schlaf der Feinde.","chapters":[]},{"key":"stri","name":"Strīparva","desc":"Das Buch der Frauen: die Totenklage der Frauen auf dem Schlachtfeld von Kurukṣetra.","chapters":[]},{"key":"shanti","name":"Śāntiparva","desc":"Das Buch des Friedens: Yudhiṣṭhiras Krönung und Bhīṣmas ausführliche Lehren über Dharma, Herrschaft und Erlösung.","chapters":[]},{"key":"anushasana","name":"Anuśāsanaparva","desc":"Das Buch der Unterweisung: weitere Lehren Bhīṣmas, u. a. über rechte Gaben und Pflichten, sowie sein Tod.","chapters":[]},{"key":"ashvamedhika","name":"Āśvamedhikaparva","desc":"Das Buch des Pferdeopfers: Yudhiṣṭhiras Aśvamedha-Opfer.","chapters":[]},{"key":"ashramavasika","name":"Āśramavāsikaparva","desc":"Das Buch des Einsiedlerlebens: Dhṛtarāṣṭra, Gāndhārī und Kuntī ziehen in den Wald; ihr Tod.","chapters":[{"num":31,"title_sa":"pāṇḍavānāṃ dhṛtarāṣṭreṇa kuntyā gāndhāryā ca punarmilanam","title_de":"Das Wiedersehen der Pāṇḍavas mit Dhṛtarāṣṭra, Kuntī und Gāndhārī","note":"","units":[["001","vaiśaṃpāyana uvāca tatas te pāṇḍavā dūrād avatīrya padātayaḥ abhijagmur narapater āśramaṃ vinayānatāḥ","Vaiśaṃpāyana sprach: Dann stiegen jene Pāṇḍavas von ferne ab, zu Fuß, und näherten sich, in Demut gebeugt, der Einsiedelei des Herrschers der Menschen.","",[["dūrād avatīrya padātayaḥ","von ferne abgestiegen, zu Fuß (Abl. + Abs. + Nom. Pl.)"],["abhijagmur vinayānatāḥ","näherten sich, in Demut gebeugt (Perf. + Nom. Pl.)"]]],["002","sa ca paurajanaḥ sarvo ye ca rāṣṭranivāsinaḥ striyaś ca kurumukhyānāṃ padbhir evānvayus tadā","Und das ganze Bürgervolk, und die Landbewohner, und die Frauen der Kuru-Häupter, folgten da ebenfalls zu Fuß.","",[["paurajanaḥ rāṣṭranivāsinaḥ","das Bürgervolk, die Landbewohner (Nom.)"],["padbhir evānvayus tadā","folgten da ebenfalls zu Fuß (Instr. + Perf.)"]]],["003","āśramaṃ te tato jagmur dhṛtarāṣṭrasya pāṇḍavāḥ śūnyaṃ mṛgagaṇākīrṇaṃ kadalīvanaśobhitam","Dann gingen die Pāṇḍavas zur Einsiedelei Dhṛtarāṣṭras, die menschenleer war, von Hirschherden bevölkert, von Bananenhainen geschmückt.","",[["śūnyaṃ mṛgagaṇākīrṇam","menschenleer, von Hirschherden bevölkert (Akk.)"],["kadalīvanaśobhitam","von Bananenhainen geschmückt (Akk.)"]]],["004","tatas tatra samājagmus tāpasā vividhavratāḥ pāṇḍavān āgatān draṣṭuṃ kautūhalasamanvitāḥ","Dann versammelten sich dort die Asketen, von vielfältigen Gelübden, voller Neugier, um die angekommenen Pāṇḍavas zu sehen.","",[["samājagmus tāpasā vividhavratāḥ","die Asketen von vielfältigen Gelübden versammelten sich (Perf. + Nom. Pl.)"],["draṣṭuṃ kautūhalasamanvitāḥ","voller Neugier, um zu sehen (Inf. + Nom. Pl.)"]]],["005","tān apṛcchat tato rājā kvāsau kauravavaṃśabhṛt pitā jyeṣṭho gato 'smākam iti bāṣpapariplutaḥ","Sie fragte dann der König, von Tränen überströmt: „Wo ist jener Träger des Kaurava-Geschlechts, unser älterer Vater, hingegangen?“","",[["kvāsau kauravavaṃśabhṛt pitā","wo ist jener Träger des Kaurava-Geschlechts, der Vater (Adv. + Nom.)"],["bāṣpapariplutaḥ apṛcchat","von Tränen überströmt fragte er (Nom. + Impf.)"]]],["006","tam ūcus te tato vākyaṃ yamunām avagāhitum puṣpāṇām udakumbhasya cārthe gata iti prabho","Sie sprachen da zu ihm dieses Wort: „Er ist gegangen, um in die Yamunā einzutauchen, wegen der Blumen und wegen des Wasserkruges, o Gebieter.“","",[["yamunām avagāhitum gataḥ","gegangen, um in die Yamunā einzutauchen (Akk. + Inf. + Nom.)"],["udakumbhasya cārthe","und wegen des Wasserkruges (Gen. + Präp.)"]]],["007","tair ākhyātena mārgeṇa tatas te prayayus tadā dadṛśuś cāvidūre tān sarvān atha padātayaḥ","Auf dem von ihnen genannten Weg zogen sie dann weiter, und erblickten von nahem, zu Fuß gehend, sie alle.","",[["tair ākhyātena mārgeṇa","auf dem von ihnen genannten Weg (Instr.)"],["dadṛśuś cāvidūre padātayaḥ","erblickten von nahem, zu Fuß gehend (Perf. + Adv. + Nom. Pl.)"]]],["008","tatas te satvarā jagmuḥ pitur darśanakāṅkṣiṇaḥ sahadevas tu vegena prādhāvad yena sā pṛthā","Dann zogen sie eilends, nach dem Anblick des Vaters verlangend; Sahadeva aber lief mit großer Geschwindigkeit dorthin, wo jene Pṛthā war.","",[["pitur darśanakāṅkṣiṇaḥ","nach dem Anblick des Vaters verlangend (Gen. + Nom. Pl.)"],["vegena prādhāvad","lief mit großer Geschwindigkeit (Instr. + Impf.)"]]],["009","sasvanaṃ prarudan dhīmān mātuḥ pādāv upaspṛśan sā ca bāṣpāvilamukhī pradadarśa priyaṃ sutam","Laut weinend, der Weise, die Füße der Mutter berührend; und sie, das Antlitz von Tränen getrübt, erblickte den geliebten Sohn.","",[["sasvanaṃ prarudan mātuḥ pādāv upaspṛśan","laut weinend, die Füße der Mutter berührend (Adv. + Ptz. + Gen. + Akk. + Ptz.)"],["bāṣpāvilamukhī pradadarśa","mit von Tränen getrübtem Antlitz erblickte sie (Nom. + Perf.)"]]],["010","bāhubhyāṃ saṃpariṣvajya samunnāmya ca putrakam gāndhāryāḥ kathayām āsa sahadevam upasthitam","Mit beiden Armen umarmend und den Sohn emporhebend, verkündete sie Gāndhārī, dass Sahadeva angekommen sei.","",[["bāhubhyāṃ saṃpariṣvajya","mit beiden Armen umarmend (Instr. + Abs.)"],["kathayām āsa sahadevam upasthitam","verkündete, dass Sahadeva angekommen sei (Perf.periphr. + Akk. + Akk.Ptz.)"]]],["011","anantaraṃ ca rājānaṃ bhīmasenam athārjunam nakulaṃ ca pṛthā dṛṣṭvā tvaramāṇopacakrame","Und unmittelbar danach, als Pṛthā den König, dann Bhīmasena, Arjuna und Nakula erblickte, eilte sie herbei.","",[["rājānaṃ bhīmasenam athārjunam","den König, dann Bhīmasena, Arjuna (Akk.)"],["dṛṣṭvā tvaramāṇopacakrame","sie erblickend, eilte sie herbei (Abs. + Impf.)"]]],["012","sā hy agre 'gacchata tayor daṃpatyor hataputrayoḥ karṣantī tau tatas te tāṃ dṛṣṭvā saṃnyapatan bhuvi","Sie nämlich ging voran, jenes Ehepaares, das seine Söhne verloren hatte, sie beide gleichsam mit sich ziehend; da fielen jene, als sie sie erblickten, zu Boden.","",[["hataputrayoḥ daṃpatyoḥ agre 'gacchata","sie ging vor jenem Ehepaar, das seine Söhne verloren hatte (Gen. Dual + Nom. + Adv. + Impf.)"],["dṛṣṭvā saṃnyapatan bhuvi","sie erblickend fielen sie zu Boden (Abs. + Impf. + Lok.)"]]],["013","tān rājā svarayogena sparśena ca mahāmanāḥ pratyabhijñāya medhāvī samāśvāsayata prabhuḥ","Sie erkennend an der Stimme und an der Berührung, tröstete der hochsinnige, weise König, der Herr, sie.","",[["svarayogena sparśena ca","an der Stimme und an der Berührung (Instr.)"],["pratyabhijñāya samāśvāsayata","sie erkennend, tröstete er (Abs. + Impf.)"]]],["014","tatas te bāṣpam utsṛjya gāndhārīsahitaṃ nṛpam upatasthur mahātmāno mātaraṃ ca yathāvidhi","Dann, nachdem sie ihre Tränen vergossen hatten, verehrten jene Hochherzigen vorschriftsgemäß den König mit Gāndhārī, und die Mutter.","",[["bāṣpam utsṛjya upatasthuḥ","nachdem sie ihre Tränen vergossen hatten, verehrten sie (Akk. + Abs. + Perf.)"],["mahātmāno yathāvidhi","die Hochherzigen, vorschriftsgemäß (Nom. Pl. + Adv.)"]]],["015","sarveṣāṃ toyakalaśāñ jagṛhus te svayaṃ tadā pāṇḍavā labdhasaṃjñās te mātrā cāśvāsitāḥ punaḥ","Da nahmen jene Pāṇḍavas, die ihre Fassung wiedererlangt hatten und von der Mutter erneut getröstet worden waren, selbst die Wasserkrüge aller.","",[["toyakalaśāñ jagṛhuḥ svayam","nahmen selbst die Wasserkrüge (Akk. + Perf. + Adv.)"],["labdhasaṃjñās mātrāśvāsitāḥ","die die Fassung wiedererlangt hatten, von der Mutter getröstet (Nom. Pl.)"]]],["016","tato nāryo nṛsiṃhānāṃ sa ca yodhajanas tadā paurajānapadāś caiva dadṛśus taṃ narādhipam","Dann erblickten die Frauen jener Löwen unter den Männern, und die Kriegerschaft, und die Bürger und Landbewohner, jenen Herrscher der Menschen.","",[["nāryo nṛsiṃhānāṃ","die Frauen der Löwen unter den Männern (Nom. + Gen. Pl.)"],["dadṛśus taṃ narādhipam","erblickten jenen Herrscher der Menschen (Perf. + Akk.)"]]],["017","nivedayām āsa tadā janaṃ taṃ nāmagotrataḥ yudhiṣṭhiro narapatiḥ sa cainān pratyapūjayat","Da stellte der Herrscher der Menschen, Yudhiṣṭhira, jene Leute nach Namen und Geschlecht vor, und jener ehrte sie wiederum.","",[["nivedayām āsa nāmagotrataḥ","stellte vor nach Namen und Geschlecht (Perf.periphr. + Adv.)"],["sa cainān pratyapūjayat","und jener ehrte sie (Nom. + Akk. + Impf.)"]]],["018","sa taiḥ parivṛto mene harṣabāṣpāvilekṣaṇaḥ rājātmānaṃ gṛhagataṃ pureva gajasāhvaye","Von ihnen umgeben, mit von Freudentränen getrübten Augen, hielt sich der König für heimgekehrt, wie einst in der Stadt Gajasāhvaya.","",[["harṣabāṣpāvilekṣaṇaḥ","mit von Freudentränen getrübten Augen (Nom.)"],["mene ātmānaṃ gṛhagatam","hielt sich für heimgekehrt (Impf. + Akk.)"]]],["019","abhivādito vadhūbhiś ca kṛṣṇādyābhiḥ sa pārthivaḥ gāndhāryā sahito dhīmān kuntyā ca pratyanandata","Von den Schwiegertöchtern, angeführt von Kṛṣṇā, verehrt, hieß jener weise Herrscher der Erde, zusammen mit Gāndhārī und Kuntī, sie freudig willkommen.","",[["abhivādito vadhūbhiḥ kṛṣṇādyābhiḥ","von den Schwiegertöchtern, angeführt von Kṛṣṇā, verehrt (Nom. + Instr.)"],["gāndhāryā kuntyā ca pratyanandata","hieß sie zusammen mit Gāndhārī und Kuntī willkommen (Instr. + Impf.)"]]],["020","tataś cāśramam āgacchat siddhacāraṇasevitam didṛkṣubhiḥ samākīrṇaṃ nabhas tārāgaṇair iva","Dann kam er zur Einsiedelei, die von Siddhas und Cāraṇas bewohnt war, überfüllt von Schaulustigen, wie der Himmel von Sternenscharen.","",[["siddhacāraṇasevitam","von Siddhas und Cāraṇas bewohnt (Akk.)"],["didṛkṣubhiḥ samākīrṇam","überfüllt von Schaulustigen (Instr. + Akk.)"]]]]},{"num":32,"title_sa":"saṃjayena pāṇḍavānāṃ kurustrīṇāṃ ca tāpasebhyaḥ paricayaḥ","title_de":"Saṃjaya stellt den Asketen die Pāṇḍavas und die Kuru-Frauen vor","note":"","units":[["001","vaiśaṃpāyana uvāca sa taiḥ saha naravyāghrair bhrātṛbhir bharatarṣabha rājā rucirapadmākṣair āsāṃ cakre tadāśrame","Vaiśaṃpāyana sprach: Er, der König, setzte sich mit jenen Brüdern, den Tigern unter den Männern mit den schönen Lotusaugen, o Stier der Bharatas, dort in der Einsiedelei nieder,","",[["naravyāghrair bhrātṛbhiḥ","mit den Brüdern, den Tigern unter den Männern (Instr. Pl.)"],["āsāṃ cakre","setzte sich nieder (Perf. periphr.)"]]],["002","tāpasaiś ca mahābhāgair nānādeśasamāgataiḥ draṣṭuṃ kurupateḥ putrān pāṇḍavān pṛthuvakṣasaḥ","und mit den hochgesegneten Asketen, die aus verschiedenen Ländern zusammengekommen waren, um die Söhne des Kuru-Herrschers, die breitbrüstigen Pāṇḍavas, zu sehen.","",[["nānādeśasamāgataiḥ","aus verschiedenen Ländern zusammengekommen (Instr. Pl.)"],["draṣṭuṃ pāṇḍavān","um die Pāṇḍavas zu sehen (Inf. + Akk.)"]]],["003","te 'bruvañ jñātum icchāmaḥ katamo 'tra yudhiṣṭhiraḥ bhīmārjunayamāś caiva draupadī ca yaśasvinī","Sie sprachen: „Wir wollen wissen, welcher von diesen hier Yudhiṣṭhira ist, und Bhīma, Arjuna, die Zwillinge, und die ruhmreiche Draupadī.“","",[["jñātum icchāmaḥ","wir wollen wissen (Inf. + 1.Pl.Präs.)"],["katamo 'tra yudhiṣṭhiraḥ","welcher von diesen ist Yudhiṣṭhira (Interrog.)"]]],["004","tān ācakhyau tadā sūtaḥ sarvān nāmābhināmataḥ saṃjayo draupadīṃ caiva sarvāś cānyāḥ kurustriyaḥ","Da nannte ihnen der Sūta Saṃjaya sie alle mit Namen und Beinamen, ebenso Draupadī und all die anderen Kuru-Frauen.","",[["ācakhyau nāmābhināmataḥ","nannte mit Namen und Beinamen (Perf. + Adv.)"],["sarvāś cānyāḥ kurustriyaḥ","und alle anderen Kuru-Frauen (Akk. Pl.)"]]],["005","ya eṣa jāmbūnadaśuddhagauratanur mahāsiṃha iva pravṛddhaḥ pracaṇḍaghoṇaḥ pṛthudīrghanetras tāmrāyatāsyaḥ kururāja eṣaḥ","„Dieser hier, dessen Leib rein-golden ist wie Jāmbūnada-Gold, groß gewachsen wie ein mächtiger Löwe, mit kühner Nase, breiten, langen Augen und einem kupferfarbenen, länglichen Antlitz - dies ist der Kururāja.","",[["jāmbūnadaśuddhagauratanuḥ","dessen Leib rein-golden wie Jāmbūnada-Gold ist (Nom.)"],["kururāja eṣaḥ","dies ist der Kururāja [Yudhiṣṭhira] (Nom.)"]]],["006","ayaṃ punar mattagajendragāmī prataptacāmīkaraśuddhagauraḥ pṛthvāyatāṃsaḥ pṛthudīrghabāhur vṛkodaraḥ paśyata paśyatainam","Und dieser hier wiederum, mit dem Gang eines brünstigen Elefantenfürsten, rein-golden wie erhitztes Gold, mit breiten, weiten Schultern und breiten, langen Armen - das ist Vṛkodara, seht, seht ihn an!","",[["mattagajendragāmī","mit dem Gang eines brünstigen Elefantenfürsten (Nom.)"],["paśyata paśyatainam","seht, seht ihn an (Imp. Pl., wiederholt)"]]],["007","yas tv eṣa pārśve 'sya mahādhanuṣmāñ śyāmo yuvā vāraṇayūthapābhaḥ siṃhonnatāṃso gajakhelagāmī padmāyatākṣo 'rjuna eṣa vīraḥ","Und der hier an seiner Seite, mit dem großen Bogen, dunkel, jugendlich, einem Elefantenherden-Führer gleich, mit löwenhaft erhobenen Schultern, mit dem Gang eines spielenden Elefanten und langen Lotusaugen - dies ist der Held Arjuna.","",[["mahādhanuṣmāñ śyāmo yuvā","mit dem großen Bogen, dunkel, jugendlich (Nom.)"],["arjuna eṣa vīraḥ","dies ist der Held Arjuna (Nom.)"]]],["008","kuntīsamīpe puruṣottamau tu yamāv imau viṣṇumahendrakalpau manuṣyaloke sakale samo 'sti yayor na rūpe na bale na śīle","Nahe bei Kuntī aber stehen diese beiden vortrefflichsten Männer, die Zwillinge, Viṣṇu und Mahendra gleich - in der ganzen Welt der Menschen gibt es niemanden, der ihnen an Gestalt, Kraft oder Wesen gleichkäme.","",[["yamāv imau viṣṇumahendrakalpau","diese beiden Zwillinge, Viṣṇu und Mahendra gleich (Nom. Dual)"],["na rūpe na bale na śīle","weder an Gestalt noch an Kraft noch an Wesen (Lok.)"]]],["009","iyaṃ punaḥ padmadalāyatākṣī madhyaṃ vayaḥ kiṃ cid iva spṛśantī nīlotpalābhā puradevateva kṛṣṇā sthitā mūrtimatīva lakṣmīḥ","Und diese hier wiederum, mit langen Lotusblattaugen, das mittlere Alter gerade eben berührend, blau-lotus-farben wie die Schutzgottheit einer Stadt - Kṛṣṇā steht da wie die verkörperte Lakṣmī.","",[["padmadalāyatākṣī","mit langen Lotusblattaugen (Nom.)"],["sthitā mūrtimatīva lakṣmīḥ","steht da wie die verkörperte Lakṣmī (Nom.)"]]],["010","asyās tu pārśve kanakottamābhā yaiṣā prabhā mūrtimatīva gaurī madhye sthitaiṣā bhaginī dvijāgryā cakrāyudhasyāpratimasya tasya","An ihrer Seite aber steht diese, von höchstem Goldglanz, deren Strahlen wie die verkörperte Gaurī sind - in der Mitte stehend ist dies die Schwester von vornehmster Abkunft jenes unvergleichlichen Trägers der Diskuswaffe.","[Anm.: 'Träger der Diskuswaffe' bezeichnet Kṛṣṇa; gemeint ist demnach dessen Schwester Subhadrā.]",[["kanakottamābhā","von höchstem Goldglanz (Nom.)"],["bhaginī dvijāgryā","die Schwester von vornehmster [zweifachgeborener] Abkunft (Nom.)"]]],["011","iyaṃ svasā rājacamūpates tu pravṛddhanīlotpaladāmavarṇā paspardha kṛṣṇena nṛpaḥ sadā yo vṛkodarasyaiṣa parigraho 'gryaḥ","Diese hier aber ist die Schwester des Heerführer-Königs, von der Farbe einer voll erblühten blauen Lotusgirlande - jenes Königs, der stets mit Kṛṣṇa wetteiferte - dies ist Vṛkodaras vortrefflichste Gemahlin.","[Anm.: Die Identität dieses stets mit Kṛṣṇa wetteifernden Königs, des Bruders dieser Gemahlin Bhīmas, wird im Vers nicht namentlich genannt und bleibt hier offen [?].]",[["rājacamūpateḥ svasā","die Schwester des Heerführer-Königs (Gen. + Nom.)"],["vṛkodarasyaiṣa parigraho 'gryaḥ","dies ist Vṛkodaras vortrefflichste Gemahlin (Nom.)"]]],["012","iyaṃ ca rājño magadhādhipasya sutā jarāsaṃdha iti śrutasya yavīyaso mādravatīsutasya bhāryā matā campakadāmagaurī","Und diese hier ist die Tochter des Königs, des Herrschers von Magadha, der als Jarāsaṃdha bekannt war - sie gilt als die Gemahlin des jüngeren Sohnes der Mādravatī, von der Farbe einer Campaka-Blütengirlande.","[Anm.: Der hier genannte Magadha-König 'Jarāsaṃdha' kann nicht der von Bhīma erschlagene historische Jarāsaṃdha selbst sein; vermutlich ein Nachfahre gleichen Namens [?]. Der jüngere Sohn der Mādravatī ist Sahadeva.]",[["magadhādhipasya sutā","die Tochter des Herrschers von Magadha (Gen. + Nom.)"],["yavīyaso mādravatīsutasya bhāryā","die Gemahlin des jüngeren Sohnes der Mādravatī [Sahadeva] (Gen. + Nom.)"]]],["013","indīvaraśyāmatanuḥ sthitā tu yaiṣāparā sannamahītale ca bhāryā matā mādravatīsutasya jyeṣṭhasya seyaṃ kamalāyatākṣī","Und diese andere hier, mit einem Leib dunkel wie eine Indīvara-Lotosblüte, die dort auf ebenem Boden steht, gilt als die Gemahlin des älteren Sohnes der Mādravatī - sie, mit lang gestreckten Lotusaugen.","[Anm.: Der ältere Sohn der Mādravatī ist Nakula. Die genaue Bedeutung von 'sannamahītale' [?] ist unsicher, hier sinngemäß als 'auf ebenem Boden' wiedergegeben.]",[["indīvaraśyāmatanuḥ","mit einem Leib dunkel wie eine Indīvara-Lotosblüte (Nom.)"],["jyeṣṭhasya mādravatīsutasya bhāryā","die Gemahlin des älteren Sohnes der Mādravatī [Nakula] (Gen. + Nom.)"]]],["014","iyaṃ tu niṣṭaptasuvarṇagaurī rājño virāṭasya sutā saputrā bhāryābhimanyor nihato raṇe yo droṇādibhis tair virathaḥ rathasthaiḥ","Diese hier aber, golden wie geschmolzenes Feingold, ist die Tochter des Königs Virāṭa, mitsamt ihrem Sohn - die Gemahlin Abhimanyus, der in der Schlacht erschlagen wurde, wagenlos, von jenen auf ihren Wagen stehenden Kriegern, angeführt von Droṇa.","",[["niṣṭaptasuvarṇagaurī","golden wie geschmolzenes Feingold (Nom.)"],["bhāryābhimanyor","die Gemahlin Abhimanyus (Nom. + Gen.)"]]],["015","etās tu sīmantaśiroruhā yāḥ śuklottarīyā nararājapatnyaḥ rājño 'sya vṛddhasya paraṃśatākhyāḥ snuṣā vivīrā hataputranāthāḥ","Diese hier aber, mit gescheiteltem Haar, in weiße Obergewänder gekleidet, die Gemahlinnen der Menschenkönige - sind die Schwiegertöchter dieses greisen Königs, mehr als hundert an Zahl genannt, ihrer Helden beraubt, ihrer erschlagenen Söhne ohne Beschützer.","[Anm.: Der gescheitelte Haarschmuck kennzeichnet hier die verwitweten Kaurava-Frauen.]",[["sīmantaśiroruhā","mit gescheiteltem Haar (Nom. Pl., Witwenzeichen)"],["hataputranāthāḥ","ihrer erschlagenen Söhne ohne Beschützer (Nom. Pl.)"]]],["016","etā yathāmukhyam udāhṛtā vo brāhmaṇyabhāvād ṛjubuddhisattvāḥ sarvā bhavadbhiḥ paripṛcchyamānā narendrapatnyaḥ suviśuddhasattvāḥ","Diese sind euch nun der Reihe nach nach ihrem Rang genannt worden, o ihr von rechtschaffener Einsicht und brahmanenhaftem Wesen - alle diese von euch erfragten Gemahlinnen der Menschenfürsten, von vollkommen reinem Wesen.“","",[["yathāmukhyam udāhṛtā","der Reihe nach nach ihrem Rang genannt (Adv. + Ptz.)"],["suviśuddhasattvāḥ","von vollkommen reinem Wesen (Nom. Pl.)"]]],["017","evaṃ sa rājā kuruvṛddhavaryaḥ samāgatas tair naradevaputraiḥ papraccha sarvān kuśalaṃ tadānīṃ gateṣu sarveṣv atha tāpaseṣu","So erkundigte sich jener König, der Vornehmste der Kuru-Alten, nachdem er mit jenen Söhnen der Götterkönige zusammengetroffen war, damals bei allen nach dem Wohlergehen, als alle Asketen gegangen waren.","",[["kuruvṛddhavaryaḥ","der Vornehmste der Kuru-Alten (Nom.)"],["papraccha kuśalam","erkundigte sich nach dem Wohlergehen (Perf. + Akk.)"]]],["018","yodheṣu cāpy āśramamaṇḍalaṃ taṃ muktvā niviṣṭeṣu vimucya patram strīvṛddhabāle ca susaṃniviṣṭe yathārhataḥ kuśalaṃ paryapṛcchat","Und auch bei den Kriegern, die sich, nachdem sie [ihre Rüstung] abgelegt hatten, in jenem Kreis der Einsiedelei niedergelassen hatten, und bei den wohlversammelten Frauen, Alten und Kindern, erkundigte er sich, wie es sich gebührte, nach ihrem Wohlergehen.","[Anm.: Die genaue Bedeutung von 'vimucya patram' [?] (wörtl. etwa 'das Blatt/Gefäß ablegend') ist unsicher; sinngemäß als Ablegen der Rüstung/Ausrüstung gedeutet.]",[["āśramamaṇḍalaṃ niviṣṭeṣu","die sich im Kreis der Einsiedelei niedergelassen hatten (Akk. + Lok. Pl.)"],["yathārhataḥ kuśalaṃ paryapṛcchat","erkundigte sich, wie es sich gebührte, nach dem Wohlergehen (Adv. + Akk. + Impf.)"]]]]},{"num":33,"title_sa":"dhṛtarāṣṭrayudhiṣṭhirasaṃvādo vidurasya yudhiṣṭhiraśarīrapraveśaś ca","title_de":"Das Gespräch zwischen Dhṛtarāṣṭra und Yudhiṣṭhira, und Viduras Eingehen in Yudhiṣṭhiras Leib","note":"","units":[["001","dhṛtarāṣṭra uvāca yudhiṣṭhira mahābāho kaccit tāta kuśaly asi sahito bhrātṛbhiḥ sarvaiḥ paurajānapadais tathā","Dhṛtarāṣṭra sprach: „Yudhiṣṭhira, du Starkarmiger, bist du wohl, mein Kind, wohlauf, zusammen mit allen deinen Brüdern und ebenso mit den Bürgern und Landbewohnern?","",[["kaccit tāta kuśaly asi","bist du wohl, mein Kind, wohlauf (Interrog. + Nom.)"],["paurajānapadais tathā","und ebenso mit Bürgern und Landbewohnern (Instr. Pl.)"]]],["002","ye ca tvām upajīvanti kaccit te 'pi nirāmayāḥ sacivā bhṛtyavargāś ca guravaś caiva te vibho","Und sind auch jene, die von dir leben, unversehrt - deine Minister und die Schar der Diener, und auch deine Lehrer, o Gebieter?","",[["ye tvām upajīvanti","die von dir leben (Rel. + 3.Pl.Präs.)"],["sacivā bhṛtyavargāś ca guravaś","Minister, Dienerschar und Lehrer (Nom. Pl.)"]]],["003","kaccid vartasi paurāṇīṃ vṛttiṃ rājarṣisevitām kaccid dāyān anucchidya kośas te 'bhiprapūryate","Befolgst du wohl den althergebrachten, von den Königssehern geübten Lebenswandel? Füllt sich wohl deine Schatzkammer, ohne die Erbteile zu schmälern?","",[["paurāṇīṃ vṛttiṃ rājarṣisevitām","den althergebrachten, von Königssehern geübten Lebenswandel (Akk.)"],["dāyān anucchidya","ohne die Erbteile zu schmälern (Akk. + Abs.)"]]],["004","arimadhyasthamitreṣu vartase cānurūpataḥ brāhmaṇān agrahārair vā yathāvad anupaśyasi","Verhältst du dich gegenüber Feinden, Neutralen und Freunden gebührend? Achtest du die Brahmanen gehörig durch Landschenkungen?","",[["arimadhyasthamitreṣu","gegenüber Feinden, Neutralen und Freunden (Lok. Pl.)"],["agrahārair yathāvad anupaśyasi","achtest du gehörig durch Landschenkungen (Instr. + Adv.)"]]],["005","kaccit te parituṣyanti śīlena bharatarṣabha śatravo guravaḥ paurā bhṛtyā vā svajano 'pi vā","Sind sie wohl zufrieden mit deinem Wesen, o Stier der Bharatas - die Feinde, die Lehrer, die Bürger, die Diener oder auch die eigenen Verwandten?","",[["parituṣyanti śīlena","sind zufrieden mit dem Wesen (3.Pl.Präs. + Instr.)"],["śatravo guravaḥ paurā bhṛtyā","Feinde, Lehrer, Bürger, Diener (Nom. Pl.)"]]],["006","kaccid yajasi rājendra śraddhāvān pitṛdevatāḥ atithīṃś cānnapānena kaccid arcasi bhārata","Opferst du wohl gläubig den Ahnen und Göttern, o Herr der Könige, und ehrst du die Gäste mit Speise und Trank, o Bhārata?","",[["yajasi śraddhāvān","opferst du gläubig (2.Sg.Präs. + Nom.)"],["atithīṃś cānnapānena arcasi","ehrst du die Gäste mit Speise und Trank (Akk. + Instr.)"]]],["007","kaccic ca viṣaye viprāḥ svakarmaniratās tava kṣatriyā vaiśyavargā vā śūdrā vāpi kuṭumbinaḥ","Und sind in deinem Reich die Brahmanen wohl ihren eigenen Pflichten hingegeben, ebenso die Scharen der Kṣatriyas und Vaiśyas oder auch die Śūdra-Hausväter?","",[["viṣaye svakarmaniratāḥ","im Reich, ihren eigenen Pflichten hingegeben (Lok. + Nom. Pl.)"],["śūdrā vāpi kuṭumbinaḥ","oder auch die Śūdra-Hausväter (Nom. Pl.)"]]],["008","kaccit strībālavṛddhaṃ te na śocati na yācate jāmayaḥ pūjitāḥ kaccit tava gehe nararṣabha","Grämen sich wohl Frauen, Kinder und Alte bei dir nicht, betteln sie nicht, werden die Frauen des Hauses wohl geehrt in deinem Haus, o Stier unter den Männern?","",[["strībālavṛddhaṃ na śocati","Frauen, Kinder und Alte grämen sich nicht (Nom. + 3.Sg.Präs.)"],["jāmayaḥ pūjitāḥ","die Frauen des Hauses werden geehrt (Nom. Pl. + Ptz.)"]]],["009","kaccid rājarṣivaṃśo 'yaṃ tvām āsādya mahīpatim yathocitaṃ mahārāja yaśasā nāvasīdati","Verfällt wohl diese Königsseher-Dynastie, da sie dich, den Herrscher der Erde, gefunden hat, ihrem gebührenden Ruhm nicht, o Großkönig?“","",[["rājarṣivaṃśo 'yaṃ","diese Königsseher-Dynastie (Nom.)"],["yaśasā nāvasīdati","verfällt nicht ihrem Ruhm (Instr. + 3.Sg.Präs.)"]]],["010","vaiśaṃpāyana uvāca ity evaṃvādinaṃ taṃ sa nyāyavit pratyabhāṣata kuśalapraśnasaṃyuktaṃ kuśalo vākyakarmaṇi","Vaiśaṃpāyana sprach: Ihm, der so sprach, antwortete jener Kenner des rechten Verhaltens, kundig in der Redekunst, mit einer mit der Wohlergehens-Frage verknüpften Erwiderung:","",[["nyāyavit pratyabhāṣata","der Kenner des rechten Verhaltens antwortete (Nom. + Impf.)"],["kuśalapraśnasaṃyuktaṃ","mit der Wohlergehens-Frage verknüpft (Akk.)"]]],["011","kaccit te vardhate rājaṃs tapo mandaśramasya te api me jananī ceyaṃ śuśrūṣur vigataklamā apy asyāḥ saphalo rājan vanavāso bhaviṣyati","„Nimmt wohl deine Askese zu, o König, und ist deine Anstrengung dabei erträglich? Ist auch diese meine Mutter dir zu Diensten, frei von Erschöpfung? Wird auch ihr Waldaufenthalt fruchtbar sein, o König?","",[["vardhate tapo mandaśramasya","nimmt die Askese zu, deine Anstrengung erträglich (3.Sg.Präs. + Nom. + Gen.)"],["saphalo vanavāso bhaviṣyati","wird der Waldaufenthalt fruchtbar sein (Nom. + Fut.)"]]],["012","iyaṃ ca mātā jyeṣṭhā me vītavātādhvakarśitā ghoreṇa tapasā yuktā devī kaccin na śocati","Und grämt sich wohl diese meine älteste Mutter, von Wind und Weg abgezehrt, der grausamen Askese hingegeben, die Herrin, nicht?","[Anm.: mit 'ältester Mutter' ist Gāndhārī gemeint.]",[["vītavātādhvakarśitā","von Wind und Weg abgezehrt (Nom.)"],["ghoreṇa tapasā yuktā","der grausamen Askese hingegeben (Instr. + Nom.)"]]],["013","hatān putrān mahāvīryān kṣatradharmaparāyaṇān nāpadhyāyati vā kaccid asmān pāpakṛtaḥ sadā","Denkt sie wohl nicht mit Groll an ihre erschlagenen, hochtapferen, dem Kṣatriya-Recht ergebenen Söhne, oder wohl stets an uns, die Übeltäter?","",[["hatān putrān mahāvīryān","die erschlagenen, hochtapferen Söhne (Akk. Pl.)"],["nāpadhyāyati","denkt nicht mit Groll (3.Sg.Präs. verneint)"]]],["014","kva cāsau viduro rājan nainaṃ paśyāmahe vayam saṃjayaḥ kuśalī cāyaṃ kaccin nu tapasi sthitaḥ","Und wo ist jener Vidura, o König? Wir sehen ihn nicht. Und ist dieser Saṃjaya wohlauf? Weilt er wirklich in Askese?“","",[["nainaṃ paśyāmahe vayam","wir sehen ihn nicht (verneint + 1.Pl.Präs.)"],["tapasi sthitaḥ","in Askese weilend (Lok. + Ptz.)"]]],["015","ity uktaḥ pratyuvācedaṃ dhṛtarāṣṭro janādhipam kuśalī viduraḥ putra tapo ghoraṃ samāsthitaḥ","Also angesprochen, erwiderte Dhṛtarāṣṭra dem Herrn der Menschen dies: „Vidura ist wohlauf, mein Sohn, er hat sich einer grausamen Askese unterzogen.","",[["pratyuvācedaṃ janādhipam","erwiderte dies dem Herrn der Menschen (Impf. + Akk.)"],["tapo ghoraṃ samāsthitaḥ","hat sich grausamer Askese unterzogen (Akk. + Ptz.)"]]],["016","vāyubhakṣo nirāhāraḥ kṛśo dhamanisaṃtataḥ kadā cid dṛśyate vipraiḥ śūnye 'smin kānane kva cit","Von Luft lebend, ohne Nahrung, abgezehrt, mit hervortretenden Adern - er wird bisweilen von Brahmanen irgendwo in diesem einsamen Wald erblickt.“","",[["vāyubhakṣo nirāhāraḥ","von Luft lebend, ohne Nahrung (Nom.)"],["dṛśyate vipraiḥ","wird von Brahmanen erblickt (Pass. + Instr.)"]]],["017","ity evaṃ vadatas tasya jaṭī vīṭāmukhaḥ kṛśaḥ digvāsā maladigdhāṅgo vanareṇusamukṣitaḥ","Während er so sprach, erschien jener mit verfilztem Haar, hagerem Antlitz, abgezehrt, den Himmel als Gewand tragend, seine Glieder mit Schmutz beschmiert, mit Waldstaub bestreut -","[Anm.: die genaue Bedeutung von 'vīṭāmukhaḥ' [?] ist unsicher, hier sinngemäß als 'hageres Antlitz' wiedergegeben.]",[["jaṭī digvāsā","mit verfilztem Haar, den Himmel als Gewand tragend [nackt] (Nom.)"],["vanareṇusamukṣitaḥ","mit Waldstaub bestreut (Nom.)"]]],["018","dūrād ālakṣitaḥ kṣattā tatrākhyāto mahīpateḥ nivartamānaḥ sahasā janaṃ dṛṣṭvāśramaṃ prati","der Kṣattā wurde von ferne erblickt, dort dem Herrscher der Erde angezeigt, während er sich, kaum die Menschen erblickend, plötzlich der Einsiedelei zuwandte und sich zurückzog.","[Anm.: 'Kṣattā' ist ein Beiname Viduras.]",[["dūrād ālakṣitaḥ kṣattā","der Kṣattā [Vidura] wurde von ferne erblickt (Nom.)"],["nivartamānaḥ sahasā","sich plötzlich zurückziehend (Ptz. + Adv.)"]]],["019","tam anvadhāvan nṛpatir eka eva yudhiṣṭhiraḥ praviśantaṃ vanaṃ ghoraṃ lakṣyālakṣyaṃ kva cit kva cit","Ihm allein lief der König Yudhiṣṭhira nach, als er in den furchtbaren Wald eindrang, bald sichtbar, bald unsichtbar, hier und dort.","",[["anvadhāvan nṛpatir eka eva","ihm lief der König allein nach (Impf. + Nom.)"],["lakṣyālakṣyaṃ kva cit kva cit","bald sichtbar, bald unsichtbar, hier und dort (Adv.)"]]],["020","bho bho vidura rājāhaṃ dayitas te yudhiṣṭhiraḥ iti bruvan narapatis taṃ yatnād abhyadhāvata","„He, he, Vidura! Ich bin der König, dein geliebter Yudhiṣṭhira!“ - so rufend, lief der Herr der Menschen ihm eifrig nach.","",[["bho bho vidura","he, he, Vidura! (Vok., Anrufung)"],["iti bruvan yatnād abhyadhāvata","so rufend, lief er eifrig nach (Ptz. + Adv. + Impf.)"]]],["021","tato vivikta ekānte tasthau buddhimatāṃ varaḥ viduro vṛkṣam āśritya kaṃ cit tatra vanāntare","Dann blieb, an einem abgeschiedenen, einsamen Ort, der Vortrefflichste der Weisen, Vidura, dort mitten im Wald stehen, an einen Baum gelehnt.","",[["vivikta ekānte tasthau","blieb an abgeschiedenem, einsamem Ort stehen (Lok. + Perf.)"],["vṛkṣam āśritya","an einen Baum gelehnt (Akk. + Abs.)"]]],["022","taṃ rājā kṣīṇabhūyiṣṭham ākṛtīmātrasūcitam abhijajñe mahābuddhiṃ mahābuddhir yudhiṣṭhiraḥ","Den, fast völlig abgezehrt, nur noch durch seine Gestalt kenntlich, erkannte der König, der hochweise Yudhiṣṭhira, als den hochweisen Vidura.","",[["kṣīṇabhūyiṣṭham ākṛtīmātrasūcitam","fast völlig abgezehrt, nur durch die Gestalt kenntlich (Akk.)"],["abhijajñe mahābuddhiṃ","erkannte den Hochweisen (Perf. + Akk.)"]]],["023","yudhiṣṭhiro 'ham asmīti vākyam uktvāgrataḥ sthitaḥ vidurasyāśrave rājā sa ca pratyāha saṃjñayā","„Ich bin Yudhiṣṭhira“ - dieses Wort sprechend, stand der König vor ihm, in Viduras Hörweite, und jener erwiderte durch ein Zeichen.","",[["yudhiṣṭhiro 'ham asmi","ich bin Yudhiṣṭhira (Nom. + 1.Sg.Präs.)"],["pratyāha saṃjñayā","erwiderte durch ein Zeichen (Perf. + Instr.)"]]],["024","tataḥ so 'nimiṣo bhūtvā rājānaṃ samudaikṣata saṃyojya viduras tasmin dṛṣṭiṃ dṛṣṭyā samāhitaḥ","Dann, unbewegten Blickes geworden, betrachtete er unablässig den König - Vidura, seinen Blick mit dessen Blick vereinend, gesammelt.","",[["animiṣo bhūtvā samudaikṣata","unbewegten Blickes geworden, betrachtete unablässig (Nom. + Ptz. + Impf.)"],["saṃyojya dṛṣṭiṃ dṛṣṭyā","den Blick mit dem Blick vereinend (Abs. + Akk. + Instr.)"]]],["025","viveśa viduro dhīmān gātrair gātrāṇi caiva ha prāṇān prāṇeṣu ca dadhad indriyāṇīndriyeṣu ca","Der weise Vidura ging ein, Glied für Glied, indem er seine Lebenshauche in dessen Lebenshauche und seine Sinne in dessen Sinne legte,","",[["viveśa gātrair gātrāṇi","ging ein, Glied in Glieder (Perf. + Instr. + Akk.)"],["prāṇān prāṇeṣu dadhat","die Lebenshauche in die Lebenshauche legend (Akk. + Lok. + Ptz.)"]]],["026","sa yogabalam āsthāya viveśa nṛpates tanum viduro dharmarājasya tejasā prajvalann iva","er, gestützt auf die Kraft des Yoga, ging in den Leib des Königs ein - Vidura in den des Dharmarāja, gleichsam von Glut entflammt.","",[["yogabalam āsthāya","gestützt auf die Kraft des Yoga (Akk. + Abs.)"],["tejasā prajvalann iva","gleichsam von Glut entflammt (Instr. + Ptz.)"]]],["027","vidurasya śarīraṃ tat tathaiva stabdhalocanam vṛkṣāśritaṃ tadā rājā dadarśa gatacetanam","Jenen Leib Viduras aber, so mit starrem Blick, an den Baum gelehnt, erblickte da der König als seines Bewusstseins entschwunden.","",[["stabdhalocanam vṛkṣāśritam","mit starrem Blick, an den Baum gelehnt (Akk.)"],["dadarśa gatacetanam","erblickte als seines Bewusstseins entschwunden (Perf. + Akk.)"]]],["028","balavantaṃ tathātmānaṃ mene bahuguṇaṃ tadā dharmarājo mahātejās tac ca sasmāra pāṇḍavaḥ","Sich selbst nahm der hochglänzende Dharmarāja, der Pāṇḍava, da als kraftvoll und mit vielen Vorzügen versehen wahr, und er erinnerte sich daran,","",[["balavantaṃ bahuguṇaṃ mene","nahm als kraftvoll und mit vielen Vorzügen versehen wahr (Akk. + Perf.)"],["sasmāra","erinnerte sich (Perf.)"]]],["029","paurāṇam ātmanaḥ sarvaṃ vidyāvān sa viśāṃ pate yogadharmaṃ mahātejā vyāsena kathitaṃ yathā","an seine ganze frühere, der Weisheit kundige Yoga-Lehre, o Herr der Völker, wie sie ihm einst von Vyāsa verkündet worden war.","",[["paurāṇam yogadharmaṃ","die frühere Yoga-Lehre (Akk.)"],["vyāsena kathitaṃ yathā","wie von Vyāsa verkündet (Instr. + Ptz. + Adv.)"]]],["030","dharmarājas tu tatrainaṃ saṃcaskārayiṣus tadā dagdhukāmo 'bhavad vidvān atha vai vāg abhāṣata","Der Dharmarāja aber, der ihm dort die Totenriten erweisen und ihn verbrennen wollte, war schon entschlossen dazu, als eine Stimme ertönte:","",[["saṃcaskārayiṣuḥ dagdhukāmaḥ","die Totenriten erweisen wollend, verbrennen wollend (Nom.)"],["vāg abhāṣata","eine Stimme sprach (Nom. + Impf.)"]]],["031","bho bho rājan na dagdhavyam etad vidurasaṃjñakam kalevaram ihaitat te dharma eṣa sanātanaḥ","„He, he, König! Dieser Leib, genannt Vidura, soll hier nicht verbrannt werden - dies ist deine ewige Pflicht.","",[["na dagdhavyam etat kalevaram","dieser Leib soll nicht verbrannt werden (Verbaladj. + Nom.)"],["dharma eṣa sanātanaḥ","dies ist die ewige Pflicht (Nom.)"]]],["032","lokāḥ saṃtānakā nāma bhaviṣyanty asya pārthiva yatidharmam avāpto 'sau naiva śocyaḥ paraṃtapa","Welten, Saṃtānaka genannt, werden ihm zuteil werden, o Herrscher; er hat das Recht des Asketen erlangt - er ist keineswegs zu beklagen, o Bezwinger der Feinde.“","",[["lokāḥ saṃtānakā nāma bhaviṣyanti","Welten, Saṃtānaka genannt, werden zuteil werden (Nom. + Fut.)"],["yatidharmam avāptaḥ","hat das Recht des Asketen erlangt (Akk. + Ptz.)"]]],["033","ity ukto dharmarājaḥ sa vinivṛtya tataḥ punaḥ rājño vaicitravīryasya tat sarvaṃ pratyavedayat","Also angesprochen, kehrte der Dharmarāja dann wieder zurück und berichtete dies alles dem König, dem Sohn des Vicitravīrya.","",[["vinivṛtya punaḥ","wieder zurückkehrend (Abs. + Adv.)"],["pratyavedayat tat sarvaṃ","berichtete dies alles (Impf. + Akk.)"]]],["034","tataḥ sa rājā dyutimān sa ca sarvo janas tadā bhīmasenādayaś caiva paraṃ vismayam āgatāḥ","Da gerieten jener glanzvolle König und alle Leute dort, sowie Bhīmasena und die anderen, in höchstes Erstaunen.","",[["dyutimān rājā","der glanzvolle König (Nom.)"],["paraṃ vismayam āgatāḥ","gerieten in höchstes Erstaunen (Akk. + Ptz.)"]]],["035","tac chrutvā prītimān rājā bhūtvā dharmajam abravīt āpo mūlaṃ phalaṃ caiva mamedaṃ pratigṛhyatām","Als er dies vernommen hatte, sprach der König erfreut zu dem Dharma-Geborenen: „Dieses mein Wasser, meine Wurzeln und Früchte mögen angenommen werden -","",[["tac chrutvā prītimān","dies vernommen habend, erfreut (Abs. + Nom.)"],["āpo mūlaṃ phalaṃ pratigṛhyatām","Wasser, Wurzeln und Früchte mögen angenommen werden (Nom. + Optativ Pass.)"]]],["036","yadanno hi naro rājaṃs tadanno 'syātithiḥ smṛtaḥ ity uktaḥ sa tathety eva prāha dharmātmajo nṛpam phalaṃ mūlaṃ ca bubhuje rājñā dattaṃ sahānujaḥ","denn von welcher Speise ein Mann lebt, o König, von dessen Speise gilt auch sein Gast als lebend.“ So angesprochen, sagte der Dharma-Geborene zustimmend, es solle so sein, und verzehrte, zusammen mit seinen jüngeren Brüdern, die vom König gegebenen Früchte und Wurzeln.","",[["yadanno naro tadanno 'tithiḥ","von welcher Speise ein Mann lebt, von dessen Speise sein Gast (Nom.)"],["tathety eva prāha","sagte zustimmend, es solle so sein (Adv. + Perf.)"]]],["037","tatas te vṛkṣamūleṣu kṛtavāsaparigrahāḥ tāṃ rātriṃ nyavasan sarve phalamūlajalāśanāḥ","Dann nahmen sie an den Wurzeln der Bäume ihr Nachtlager und verbrachten dort alle jene Nacht, sich von Früchten, Wurzeln und Wasser nährend.","",[["vṛkṣamūleṣu kṛtavāsaparigrahāḥ","an den Wurzeln der Bäume ihr Nachtlager nehmend (Lok. + Nom.)"],["phalamūlajalāśanāḥ","sich von Früchten, Wurzeln und Wasser nährend (Nom. Pl.)"]]]]}]},{"key":"mausala","name":"Mausalaparva","desc":"Das Buch des Keulenkampfes: der Untergang der Vṛṣṇis und Yādavas, Kṛṣṇas Tod.","chapters":[]},{"key":"mahaprasthanika","name":"Mahāprasthānikaparva","desc":"Das Buch des großen Auszugs: die letzte Wanderung der Pāṇḍavas in den Himalaya.","chapters":[]},{"key":"svargarohana","name":"Svargārohaṇaparva","desc":"Das Buch des Aufstiegs zum Himmel: Yudhiṣṭhiras Prüfung und der Aufstieg zum Himmel.","chapters":[]}]}</script>

<script>
function loadTheme(){ try{ return localStorage.getItem("mbh-theme")||"system"; }catch(e){ return "system"; } }
function saveTheme(v){ try{ localStorage.setItem("mbh-theme", v); }catch(e){} }
function applyTheme(v){
  var root = document.documentElement;
  if(v === "dark"){ root.setAttribute("data-theme","dark"); }
  else if(v === "light"){ root.setAttribute("data-theme","light"); }
  else { root.removeAttribute("data-theme"); }
}
var currentTheme = loadTheme();
applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", function(){
  var order = ["system","light","dark"];
  var idx = order.indexOf(currentTheme);
  currentTheme = order[(idx+1) % order.length];
  saveTheme(currentTheme);
  applyTheme(currentTheme);
});
document.getElementById("brand-home").addEventListener("click", function(){ go("#/"); });

var BOOK = JSON.parse(document.getElementById("data-book").textContent);

function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatText(s){
  var e = esc(s);
  e = e.replace(/\[\?\]/g, '<span class="unc-q">[?]</span>');
  e = e.replace(/\[Anm\.:[^\]]*\]/g, function(m){ return '<span class="unc-note">' + m + '</span>'; });
  return e;
}
function go(hash){ location.hash = hash; }
function cssEscape(s){ return s.replace(/["\\]/g, "\\$&"); }

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  if(parts.length === 0) return {view:"front"};
  if(parts[0] === "c" && parts[1] && parts[2] !== undefined){ return {view:"chapter", divKey:parts[1], chNum:parseInt(parts[2],10)}; }
  if(parts[0] === "glossary") return {view:"glossary"};
  return {view:"front"};
}

function findChapter(divKey, chNum){
  for(var i=0;i<BOOK.divisions.length;i++){
    var d = BOOK.divisions[i];
    if(d.key === divKey){
      for(var j=0;j<d.chapters.length;j++){ if(d.chapters[j].num === chNum) return {division:d, chapter:d.chapters[j]}; }
    }
  }
  return null;
}
function flatChapterList(){
  var out = [];
  BOOK.divisions.forEach(function(d){ d.chapters.forEach(function(c){ out.push({division:d, chapter:c}); }); });
  return out;
}
function adjacentChapter(divKey, chNum, dir){
  var flat = flatChapterList();
  var idx = -1;
  for(var i=0;i<flat.length;i++){ if(flat[i].division.key === divKey && flat[i].chapter.num === chNum){ idx = i; break; } }
  if(idx === -1) return null;
  var nidx = idx + dir;
  if(nidx < 0 || nidx >= flat.length) return null;
  return flat[nidx];
}

function wfwCell(pair){
  var cls = "wfw-cell" + (pair[1] && pair[1].length > 70 ? " wfw-cell-long" : "");
  return '<div class="' + cls + '"><span class="wfw-sa">' + esc(pair[0]) + '</span><span class="wfw-de">' + esc(pair[1]) + '</span></div>';
}
function wfwHtml(u, uid){
  var html = '<button class="wfw-toggle" data-wfw-target="' + uid + '">Wort f&uuml;r Wort &#9656;</button>';
  html += '<div class="wfw-panel" id="' + uid + '" hidden><div class="wfw-grid">';
  u.wfw.forEach(function(pair){ html += wfwCell(pair); });
  html += '</div></div>';
  return html;
}

var viewEl = document.getElementById("view");

function render(){
  var r = parseHash();
  closeMobileSidebar();
  if(r.view === "chapter"){ renderReader(r); }
  else if(r.view === "glossary"){ renderReader(r); }
  else { renderReader({view:"front"}); }
  window.scrollTo(0,0);
}

function tocChapterHtml(divKey, c, opts){
  var active = opts.view === "chapter" && opts.divKey === divKey && opts.chNum === c.num;
  var label = c.title_de || c.title_sa || ("Nr. " + c.num);
  return '<a class="toc-chapter' + (active?' active':'') + '" href="#/c/' + encodeURIComponent(divKey) + '/' + c.num + '"><span class="tn">' + c.num + '</span>' + esc(label) + '</a>';
}

function frontHtml(){
  var html = '';
  html += '<h1 class="front-title">' + esc(BOOK.title) + '</h1>';
  html += '<p class="front-subtitle">' + esc(BOOK.subtitle) + '</p>';
  var firstDiv = BOOK.divisions[0], firstCh = firstDiv.chapters[0];
  if(firstCh){
    html += '<a class="front-cta" href="#/c/' + encodeURIComponent(firstDiv.key) + '/' + firstCh.num + '">Lesen beginnen &rarr;</a>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.vorwort){
    html += '<div class="front-section"><h2>Vorwort</h2>';
    BOOK.frontmatter.vorwort.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.einfuehrung){
    html += '<div class="front-section"><h2>Einf&uuml;hrung</h2>';
    BOOK.frontmatter.einfuehrung.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  html += '<div class="front-section"><h2>Die 18 Parvas</h2><div class="front-parva-list">';
  BOOK.divisions.forEach(function(d, i){
    html += '<div class="fpl-item"><div class="fpl-num">' + (i+1) + '</div><div><div class="fpl-name">' + esc(d.name) + '</div><div class="fpl-desc">' + esc(d.desc) + (d.chapters.length ? ' <em>&mdash; &uuml;bersetzt bis Adhy&#257;ya ' + d.chapters[d.chapters.length-1].num + '</em>' : ' <em>&mdash; noch nicht begonnen</em>') + '</div></div></div>';
  });
  html += '</div></div>';
  return html;
}

function glossaryHtml(){
  var html = '<h1 class="front-title" style="font-size:28px">Glossar</h1>';
  html += '<p class="front-subtitle">' + BOOK.glossary.length + ' Begriffe, alphabetisch geordnet.</p>';
  var entries = BOOK.glossary.slice().sort(function(a,b){ return a.term.localeCompare(b.term); });
  var lastLetter = null;
  html += '<div class="glossary-grid">';
  entries.forEach(function(e){
    var letter = e.term.charAt(0).toUpperCase();
    if(letter !== lastLetter){ html += '<div class="gl-letter">' + esc(letter) + '</div>'; lastLetter = letter; }
    html += '<div class="gl-entry"><span class="gl-term">' + esc(e.term) + '</span><span class="gl-cat">' + esc(e.category||'') + '</span>';
    html += '<div class="gl-def">' + esc(e.definition) + '</div></div>';
  });
  html += '</div>';
  return html;
}

function chapterHtml(divKey, chNum){
  var found = findChapter(divKey, chNum);
  if(!found) return '<p class="empty-note">Kapitel nicht gefunden.</p>';
  var d = found.division, c = found.chapter;
  var html = '';
  var isFirstOfDivision = d.chapters[0].num === c.num;
  if(isFirstOfDivision){
    html += '<div class="division-banner"><div class="db-label">Parva</div>';
    html += '<h2>' + esc(d.name) + '</h2>';
    if(d.intro) html += '<p>' + formatText(d.intro) + '</p>';
    html += '</div>';
  }
  html += '<div class="chapter-head">';
  html += '<span class="chapter-eyebrow">Adhy&#257;ya ' + c.num + ' &middot; ' + esc(d.name) + '</span>';
  if(c.title_sa) html += '<div class="chapter-title-sa">' + esc(c.title_sa) + '</div>';
  html += '<div class="chapter-title-de">' + esc(c.title_de || ('Adhy&#257;ya ' + c.num)) + '</div>';
  html += '</div>';
  if(c.note){ html += '<div class="chapter-note"><span class="cn-label">Einordnung</span>' + formatText(c.note) + '</div>'; }
  c.units.forEach(function(u, uidx){
    html += '<div class="unit">';
    html += '<span class="unit-n">Vers ' + esc(u.n) + '</span>';
    html += '<div class="unit-sa">' + formatText(u.sa) + '</div>';
    html += '<div class="unit-de">' + formatText(u.de) + '</div>';
    if(u.notes) html += '<div class="unit-notes">' + formatText(u.notes) + '</div>';
    if(u.wfw) html += wfwHtml(u, d.key + "-" + c.num + "-" + uidx);
    html += '</div>';
  });
  var prev = adjacentChapter(divKey, chNum, -1);
  var next = adjacentChapter(divKey, chNum, 1);
  html += '<div class="chapter-pager">';
  if(prev){ html += '<a class="pager-btn prev" href="#/c/' + encodeURIComponent(prev.division.key) + '/' + prev.chapter.num + '"><span class="pg-label">&larr; Zur&uuml;ck</span><span class="pg-title">' + esc(prev.chapter.title_de || ('Adhy&#257;ya ' + prev.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  if(next){ html += '<a class="pager-btn next" href="#/c/' + encodeURIComponent(next.division.key) + '/' + next.chapter.num + '"><span class="pg-label">Weiter &rarr;</span><span class="pg-title">' + esc(next.chapter.title_de || ('Adhy&#257;ya ' + next.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  html += '</div>';
  return html;
}

function renderReader(opts){
  var openDivKey = opts.view === "chapter" ? opts.divKey : (BOOK.divisions[0] && BOOK.divisions[0].key);
  var html = '<div class="reader">';
  html += '<button class="sidebar-toggle" id="sidebar-toggle-btn">&#9776; Inhaltsverzeichnis</button>';
  html += '<aside class="reader-sidebar" id="reader-sidebar">';
  html += '<a class="reader-back" href="#/">&larr; Vorwort &amp; &Uuml;bersicht</a>';
  html += '<div class="sidebar-title">' + esc(BOOK.title) + '</div>';
  html += '<div class="sidebar-sub">18 Parvas &middot; im Aufbau</div>';
  html += '<div class="sidebar-tabs">';
  html += '<button class="sidebar-tab' + (opts.view==="front"?' active':'') + '" data-tab="front">Vorwort</button>';
  html += '<button class="sidebar-tab' + (opts.view==="chapter"?' active':'') + '" data-tab="text">Text</button>';
  html += '<button class="sidebar-tab' + (opts.view==="glossary"?' active':'') + '" data-tab="glossary">Glossar</button>';
  html += '</div>';
  BOOK.divisions.forEach(function(d){
    var isOpen = d.key === openDivKey;
    html += '<div class="toc-division">';
    html += '<div class="toc-division-head' + (isOpen?' open':'') + '" data-div="' + esc(d.key) + '"><span class="car">&#9656;</span>' + esc(d.name) + '</div>';
    html += '<div class="toc-chapters' + (isOpen?' open':'') + '" data-div-body="' + esc(d.key) + '">';
    if(d.chapters.length === 0){ html += '<div class="toc-empty">noch nicht &uuml;bersetzt</div>'; }
    d.chapters.forEach(function(c){ html += tocChapterHtml(d.key, c, opts); });
    html += '</div></div>';
  });
  html += '</aside>';
  html += '<div class="reader-main"><div class="reader-content" id="reader-content">';
  if(opts.view === "front") html += frontHtml();
  else if(opts.view === "glossary") html += glossaryHtml();
  else if(opts.view === "chapter") html += chapterHtml(opts.divKey, opts.chNum);
  html += '</div></div></div>';
  viewEl.innerHTML = html;

  Array.prototype.forEach.call(viewEl.querySelectorAll(".toc-division-head"), function(h){
    h.addEventListener("click", function(){
      h.classList.toggle("open");
      var body = viewEl.querySelector('.toc-chapters[data-div-body="' + cssEscape(h.getAttribute("data-div")) + '"]');
      if(body) body.classList.toggle("open");
    });
  });
  Array.prototype.forEach.call(viewEl.querySelectorAll(".sidebar-tab"), function(t){
    t.addEventListener("click", function(){
      var tab = t.getAttribute("data-tab");
      if(tab === "front") go("#/");
      else if(tab === "glossary") go("#/glossary");
      else {
        var flat = flatChapterList();
        if(flat.length){ go("#/c/" + encodeURIComponent(flat[0].division.key) + "/" + flat[0].chapter.num); }
      }
    });
  });
  var toggleBtn = document.getElementById("sidebar-toggle-btn");
  if(toggleBtn) toggleBtn.addEventListener("click", openMobileSidebar);
  Array.prototype.forEach.call(viewEl.querySelectorAll(".wfw-toggle[data-wfw-target]"), function(btn){
    btn.addEventListener("click", function(){
      var panel = document.getElementById(btn.getAttribute("data-wfw-target"));
      if(!panel) return;
      var open = !panel.hidden;
      panel.hidden = open;
      btn.innerHTML = "Wort f&uuml;r Wort " + (open ? "&#9656;" : "&#9662;");
    });
  });
}

function openMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.add("open"); if(scrim) scrim.classList.add("open");
}
function closeMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.remove("open"); if(scrim) scrim.classList.remove("open");
}
document.getElementById("sidebar-scrim").addEventListener("click", closeMobileSidebar);

window.addEventListener("hashchange", render);
render();
</script>


</body>
</html>
