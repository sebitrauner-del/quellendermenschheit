t, mögen die Erkennenden verstehen (Gen.Pl. + Nom. + Gen.Pl.Part.)"]]],["008","yāvan na kṣīyate karma tāvad asya svarūpatā saṃkṣīṇakarmā puruṣo rūpānyatvaṃ niyacchati","Solange die Tat nicht erschöpft ist, solange besteht dessen Eigengestalt; der Mensch, dessen Tat erschöpft ist, erlangt eine andere Gestalt.","",[["yāvan na kṣīyate karma tāvad asya svarūpatā","solange die Tat nicht erschöpft ist, solange besteht dessen Eigengestalt (Präs.Pass. + Nom. + Gen. + Nom.)"],["saṃkṣīṇakarmā puruṣo rūpānyatvaṃ niyacchati","der Mensch, dessen Tat erschöpft ist, erlangt eine andere Gestalt (Nom.Bahuvrīhi + Nom. + Akk. + Präs.)"]]],["009","nānābhāvās tathaikatvaṃ śarīraṃ prāpya saṃhatāḥ bhavanti te tathā nityāḥ pṛthagbhāvaṃ vijānatām","Aus mannigfachem Sein gelangen sie ebenso, nachdem sie den Körper erlangt haben, vereint zur Einheit; sie sind ebenso ewig für die, die den gesonderten Zustand erkennen.","[?] Die genaue syntaktische Fügung dieses Verses (nānābhāvāḥ...ekatvam...saṃhatāḥ) bleibt im Detail unsicher; sinngemäß auf die Vereinigung mannigfacher Elemente im Körper bezogen.",[["nānābhāvās tathaikatvaṃ śarīraṃ prāpya saṃhatāḥ","aus mannigfachem Sein gelangen sie ebenso, nachdem sie den Körper erlangt haben, vereint zur Einheit (Nom.Pl. + Akk. + Akk. + Absol. + Nom.Pl.Part.)"],["bhavanti te tathā nityāḥ pṛthagbhāvaṃ vijānatām","sie sind ebenso ewig für die, die den gesonderten Zustand erkennen (Präs. + Nom.Pl. + Nom.Pl. + Akk. + Gen.Pl.Part.)"]]],["010","aśvamedhe śrutiś ceyam aśvasaṃjñapanaṃ prati lokāntaragatā nityaṃ prāṇā nityā hi vājinaḥ","Beim Pferdeopfer gibt es auch diese Überlieferung, in Bezug auf das Töten des Pferdes: In eine andere Welt gegangen sind die Lebenshauche stets, denn ewig ist das Ross.","",[["aśvamedhe śrutiś ceyam aśvasaṃjñapanaṃ prati","beim Pferdeopfer gibt es auch diese Überlieferung, in Bezug auf das Töten des Pferdes (Lok. + Nom. + Akk.)"],["lokāntaragatā nityaṃ prāṇā nityā hi vājinaḥ","in eine andere Welt gegangen sind die Lebenshauche stets, denn ewig ist das Ross (Nom.Pl. + Nom.Pl. + Nom. + Nom.)"]]],["011","ahaṃ hitaṃ vadāmy etat priyaṃ cet tava pārthiva devayānā hi panthānaḥ śrutās te yajñasaṃstare","Ich spreche dies zum Heil, wenn es dir lieb ist, o Herrscher; denn die Götterpfade sind, wie überliefert, im Opferbett [Ritualvollzug bekannt].","",[["ahaṃ hitaṃ vadāmy etat priyaṃ cet tava pārthiva","ich spreche dies zum Heil, wenn es dir lieb ist, o Herrscher (Nom. + Akk. + Präs. + Akk. + Vok.)"],["devayānā hi panthānaḥ śrutās te yajñasaṃstare","denn die Götterpfade sind, wie überliefert, im Opferbett bekannt (Nom.Pl. + Nom.Pl.Part.Perf.Pass. + Lok.)"]]],["012","sukṛto yatra te yajñas tatra devā hitās tava yadā samanvitā devāḥ paśūnāṃ gamaneśvarāḥ gatimantaś ca teneṣṭvā nānye nityā bhavanti te","Wo dein Opfer wohlvollzogen ist, dort sind die Götter dir zugetan; wenn die Götter, die Herren über den Gang der Opfertiere, mit Bewegung versehen sind, so werden sie, durch dieses Opfer geehrt, nicht anders als ewig.","[?] Der genaue Bezug von \"gatimantaḥ\" und \"nānye nityāḥ\" in diesem dicht komprimierten philosophischen Vers bleibt unsicher; sinngemäß wiedergegeben.",[["sukṛto yatra te yajñas tatra devā hitās tava","wo dein Opfer wohlvollzogen ist, dort sind die Götter dir zugetan (Nom. + Lok.Rel. + Nom. + Nom.Pl. + Nom.Pl.)"],["yadā samanvitā devāḥ paśūnāṃ gamaneśvarāḥ gatimantaś ca teneṣṭvā nānye nityā bhavanti te","wenn die Götter, die Herren über den Gang der Opfertiere, mit Bewegung versehen sind, werden sie, durch dieses Opfer geehrt, nicht anders als ewig (Nom.Pl. + Gen.Pl. + Nom.Pl.Bahuvrīhi + Absol. + Präs.)"]]],["013","nitye 'smin pañcake varge nitye cātmani yo naraḥ asya nānāsamāyogaṃ yaḥ paśyati vṛthāmatiḥ viyoge śocate 'tyarthaṃ sa bāla iti me matiḥ","In dieser ewigen fünffachen Gruppe [der Elemente] und im ewigen Selbst - welcher Mensch deren mannigfache Verbindung erblickt, der ist irrsinnigen Denkens; wer bei der Trennung übermäßig trauert, der ist ein Kind, so ist meine Meinung.","",[["nitye 'smin pañcake varge nitye cātmani yo naraḥ","in dieser ewigen fünffachen Gruppe und im ewigen Selbst - welcher Mensch (Lok. + Lok. + Nom.)"],["asya nānāsamāyogaṃ yaḥ paśyati vṛthāmatiḥ","deren mannigfache Verbindung erblickt, der ist irrsinnigen Denkens (Gen. + Akk. + Präs. + Nom.Bahuvrīhi)"],["viyoge śocate 'tyarthaṃ sa bāla iti me matiḥ","wer bei der Trennung übermäßig trauert, der ist ein Kind, so ist meine Meinung (Lok. + Präs.Med. + Adv. + Nom. + Gen. + Nom.)"]]],["014","viyoge doṣadarśī yaḥ saṃyogam iha varjayet asaṅge saṃgamo nāsti duḥkhaṃ bhuvi viyogajam","Wer in der Trennung den Fehler sieht, der sollte hier die Verbindung meiden; wo keine Anhaftung ist, gibt es kein Zusammensein, und kein aus Trennung geborenes Leid auf Erden.","",[["viyoge doṣadarśī yaḥ saṃyogam iha varjayet","wer in der Trennung den Fehler sieht, der sollte hier die Verbindung meiden (Lok. + Nom.Bahuvrīhi + Akk. + Opt.)"],["asaṅge saṃgamo nāsti duḥkhaṃ bhuvi viyogajam","wo keine Anhaftung ist, gibt es kein Zusammensein, und kein aus Trennung geborenes Leid auf Erden (Lok. + Nom. + Nom. + Lok.)"]]],["015","parāparajñas tu naro nābhimānād udīritaḥ aparajñaḥ parāṃ buddhiṃ spṛṣṭvā mohād vimucyate","Der Mensch aber, der das Höhere und das Niedere kennt, äußert sich nicht aus Dünkel; wer nur das Niedere kennt, wird, nachdem er die höhere Einsicht berührt hat, von Verblendung befreit.","",[["parāparajñas tu naro nābhimānād udīritaḥ","der Mensch aber, der das Höhere und das Niedere kennt, äußert sich nicht aus Dünkel (Nom.Bahuvrīhi + Nom. + Abl. + Nom.Part.Perf.Pass.)"],["aparajñaḥ parāṃ buddhiṃ spṛṣṭvā mohād vimucyate","wer nur das Niedere kennt, wird, nachdem er die höhere Einsicht berührt hat, von Verblendung befreit (Nom.Bahuvrīhi + Akk. + Absol. + Abl. + Präs.Pass.)"]]],["016","adarśanād āpatitaḥ punaś cādarśanaṃ gataḥ nāhaṃ taṃ vedmi nāsau māṃ na ca me 'sti virāgatā","Aus dem Nicht-Sichtbaren hervorgetreten, geht er wieder ins Nicht-Sichtbare ein; ich kenne ihn nicht, und jener kennt mich nicht, und doch besteht bei mir keine Abneigung.","",[["adarśanād āpatitaḥ punaś cādarśanaṃ gataḥ","aus dem Nicht-Sichtbaren hervorgetreten, geht er wieder ins Nicht-Sichtbare ein (Abl. + Nom.Part.Perf.Pass. + Akk. + Nom.Part.Perf.Pass.)"],["nāhaṃ taṃ vedmi nāsau māṃ na ca me 'sti virāgatā","ich kenne ihn nicht, und jener kennt mich nicht, und doch besteht bei mir keine Abneigung (Nom. + Akk. + Präs. + Nom. + Akk. + Gen. + Nom.)"]]],["017","yena yena śarīreṇa karoty ayam anīśvaraḥ tena tena śarīreṇa tad avaśyam upāśnute mānasaṃ manasāpnoti śārīraṃ ca śarīravān","Mit welchem Körper auch immer dieser Machtlose handelt, mit eben jenem Körper genießt er unweigerlich dessen Frucht; das Geistige erlangt er durch den Geist, und das Körperliche der Verkörperte durch den Körper.","",[["yena yena śarīreṇa karoty ayam anīśvaraḥ","mit welchem Körper auch immer dieser Machtlose handelt (Instr. + Präs. + Nom. + Nom.)"],["tena tena śarīreṇa tad avaśyam upāśnute","mit eben jenem Körper genießt er unweigerlich dessen Frucht (Instr. + Akk. + Adv. + Präs.Med.)"],["mānasaṃ manasāpnoti śārīraṃ ca śarīravān","das Geistige erlangt er durch den Geist, und das Körperliche der Verkörperte durch den Körper (Akk. + Instr. + Präs. + Akk. + Nom.Bahuvrīhi)"]]]]},{"num":43,"title_sa":"","title_de":"Janamejayas Wiedersehen mit Parikṣit; Āstīkas Lob","note":"Rahmenebene: Janamejaya erblickt durch Vyāsas Gunst seinen eigenen Vater Parikṣit; Dialog mit Āstīka über das Schlangenopfer. Direkte Figurenrede (Janamejaya V004-005, V011; Āstīka V012-016) CQ-markiert; Vaiśaṃpāyana/Sūta-Erzählerrahmen unmarkiert.","units":[["001","vaiśaṃpāyana uvāca adṛṣṭvā tu nṛpaḥ putrān darśanaṃ pratilabdhavān ṛṣiprasādāt putrāṇāṃ svarūpāṇāṃ kurūdvaha","Vaiśaṃpāyana sprach: Der König aber, der seine Söhne nicht gesehen hatte, erlangte durch die Gnade des Ṛṣi den Anblick der Söhne in ihrer wahren Gestalt, o Erster der Kurus.","",[["vaiśaṃpāyana uvāca adṛṣṭvā tu nṛpaḥ putrān","Vaiśaṃpāyana sprach: der König aber, der seine Söhne nicht gesehen hatte (Nom. + Absol.Neg. + Nom. + Akk.Pl.)"],["darśanaṃ pratilabdhavān ṛṣiprasādāt putrāṇāṃ svarūpāṇāṃ kurūdvaha","erlangte durch die Gnade des Ṛṣi den Anblick der Söhne in ihrer wahren Gestalt, o Erster der Kurus (Akk. + Perf.Part.Akt. + Abl. + Gen.Pl. + Vok.)"]]],["002","sa rājā rājadharmāṃś ca brahmopaniṣadaṃ tathā avāptavān naraśreṣṭho buddhiniścayam eva ca","Jener König, der Beste der Männer, erlangte die Königspflichten sowie die geheime Lehre des Brahman und ebenso Gewissheit der Erkenntnis.","",[["sa rājā rājadharmāṃś ca brahmopaniṣadaṃ tathā","jener König die Königspflichten sowie die geheime Lehre des Brahman (Nom. + Akk. + Akk.)"],["avāptavān naraśreṣṭho buddhiniścayam eva ca","erlangte, der Beste der Männer, ebenso Gewissheit der Erkenntnis (Perf.Part.Akt. + Nom. + Akk.)"]]],["003","viduraś ca mahāprājño yayau siddhiṃ tapobalāt dhṛtarāṣṭraḥ samāsādya vyāsaṃ cāpi tapasvinam","Und Vidura, der Hochweise, gelangte durch die Kraft der Askese zur Vollendung - nachdem Dhṛtarāṣṭra mit dem asketischen Vyāsa zusammengetroffen war.","",[["viduraś ca mahāprājño yayau siddhiṃ tapobalāt","und Vidura, der Hochweise, gelangte durch die Kraft der Askese zur Vollendung (Nom. + Nom. + Perf. + Akk. + Abl.)"],["dhṛtarāṣṭraḥ samāsādya vyāsaṃ cāpi tapasvinam","nachdem Dhṛtarāṣṭra mit dem asketischen Vyāsa zusammengetroffen war (Nom. + Absol. + Akk.)"]]],["004","janamejaya uvāca mamāpi varado vyāso darśayet pitaraṃ yadi tad rūpaveṣavayasaṃ śraddadhyāṃ sarvam eva te","Janamejaya sprach: „Wenn Vyāsa, der Gewährer von Gunst, auch mir meinen Vater zeigen würde, in jener Gestalt, jenem Äußeren und jenem Alter, so würde ich dir das alles völlig glauben.","",[["janamejaya uvāca mamāpi varado vyāso darśayet pitaraṃ yadi","Janamejaya sprach: wenn Vyāsa, der Gewährer von Gunst, auch mir meinen Vater zeigen würde (Nom. + Gen. + Nom. + Opt.Kaus. + Akk. + Kond.)"],["tad rūpaveṣavayasaṃ śraddadhyāṃ sarvam eva te","in jener Gestalt, jenem Äußeren und jenem Alter, so würde ich dir das alles völlig glauben (Akk. + Opt. + Akk. + Dat.)"]]],["005","priyaṃ me syāt kṛtārthaś ca syām ahaṃ kṛtaniścayaḥ prasādād ṛṣiputrasya mama kāmaḥ samṛdhyatām","Das wäre mir lieb, und ich wäre am Ziel, fest entschlossen; durch die Gnade des Ṛṣi-Sohnes [Vyāsa] möge sich mein Wunsch erfüllen.“","",[["priyaṃ me syāt kṛtārthaś ca syām ahaṃ kṛtaniścayaḥ","das wäre mir lieb, und ich wäre am Ziel, fest entschlossen (Nom. + Opt. + Nom. + Opt. + Nom. + Nom.)"],["prasādād ṛṣiputrasya mama kāmaḥ samṛdhyatām","durch die Gnade des Ṛṣi-Sohnes möge sich mein Wunsch erfüllen (Abl. + Gen. + Gen. + Nom. + Opt.Pass.)"]]],["006","sūta uvāca ity uktavacane tasmin nṛpe vyāsaḥ pratāpavān prasādam akarod dhīmān ānayac ca parikṣitam","Sūta sprach: Als der König so gesprochen hatte, erwies ihm der mächtige, weise Vyāsa Gunst und brachte Parikṣit herbei.","",[["sūta uvāca ity uktavacane tasmin nṛpe","Sūta sprach: als der König so gesprochen hatte (Nom. + Lok.Absol. + Lok.)"],["vyāsaḥ pratāpavān prasādam akarod dhīmān ānayac ca parikṣitam","erwies der mächtige, weise Vyāsa Gunst und brachte Parikṣit herbei (Nom. + Nom. + Akk. + Impf. + Nom. + Impf. + Akk.)"]]],["007","tatas tadrūpavayasam āgataṃ nṛpatiṃ divaḥ śrīmantaṃ pitaraṃ rājā dadarśa janamejayaḥ","Da erblickte König Janamejaya seinen glanzvollen Vater, den Herrscher, der in jener Gestalt und jenem Alter vom Himmel herabgekommen war.","",[["tatas tadrūpavayasam āgataṃ nṛpatiṃ divaḥ","da den in jener Gestalt und jenem Alter vom Himmel herabgekommenen Herrscher (Akk. + Akk.Part.Perf. + Akk. + Abl.)"],["śrīmantaṃ pitaraṃ rājā dadarśa janamejayaḥ","erblickte König Janamejaya seinen glanzvollen Vater (Akk. + Akk. + Nom. + Perf. + Nom.)"]]],["008","śamīkaṃ ca mahātmānaṃ putraṃ taṃ cāsya śṛṅgiṇam amātyā ye babhūvuś ca rājñas tāṃś ca dadarśa ha","Und er erblickte den großherzigen Śamīka und dessen Sohn Śṛṅgin, sowie diejenigen, die die Minister des Königs gewesen waren.","",[["śamīkaṃ ca mahātmānaṃ putraṃ taṃ cāsya śṛṅgiṇam","und den großherzigen Śamīka und dessen Sohn Śṛṅgin (Akk. + Akk. + Akk. + Gen. + Akk.)"],["amātyā ye babhūvuś ca rājñas tāṃś ca dadarśa ha","sowie diejenigen, die die Minister des Königs gewesen waren, erblickte er (Nom.Pl. + Perf. + Gen. + Akk.Pl. + Perf.)"]]],["009","tataḥ so 'vabhṛthe rājā mudito janamejayaḥ pitaraṃ snāpayām āsa svayaṃ sasnau ca pārthivaḥ","Da badete der erfreute König Janamejaya im Abschlussbad seinen Vater, und der Herrscher badete auch selbst.","",[["tataḥ so 'vabhṛthe rājā mudito janamejayaḥ","da badete der erfreute König Janamejaya im Abschlussbad (Adv. + Lok. + Nom. + Nom. + Nom.)"],["pitaraṃ snāpayām āsa svayaṃ sasnau ca pārthivaḥ","seinen Vater, und der Herrscher badete auch selbst (Akk. + Perf.Periphr.Kaus. + Adv. + Perf. + Nom.)"]]],["010","snātvā ca bharataśreṣṭhaḥ so 'stīkam idam abravīt yāyāvarakulotpannaṃ jaratkārusutaṃ tadā","Und nachdem er gebadet hatte, sprach der Beste der Bharatas darauf zu Āstīka, dem aus dem Yāyāvara-Geschlecht Entstammten, dem Sohn des Jaratkāru, dieses:","",[["snātvā ca bharataśreṣṭhaḥ so 'stīkam idam abravīt","und nachdem er gebadet hatte, sprach der Beste der Bharatas zu Āstīka dieses (Absol. + Nom. + Akk. + Akk. + Impf.)"],["yāyāvarakulotpannaṃ jaratkārusutaṃ tadā","dem aus dem Yāyāvara-Geschlecht Entstammten, dem Sohn des Jaratkāru, darauf (Akk.Bahuvrīhi + Akk.)"]]],["011","āstīka vividhāścaryo yajño 'yam iti me matiḥ yad adyāyaṃ pitā prāpto mama śokapraṇāśanaḥ","„Āstīka, dieses Opfer ist von mannigfaltigem Wunder - so ist meine Meinung, da ich heute meinen Vater erlangt habe, den Vernichter meines Kummers.“","",[["āstīka vividhāścaryo yajño 'yam iti me matiḥ","Āstīka, dieses Opfer ist von mannigfaltigem Wunder - so ist meine Meinung (Vok. + Nom. + Nom. + Nom.)"],["yad adyāyaṃ pitā prāpto mama śokapraṇāśanaḥ","da ich heute meinen Vater erlangt habe, den Vernichter meines Kummers (Akk. + Nom.Part.Perf.Pass. + Gen. + Akk.)"]]],["012","āstīka uvāca ṛṣir dvaipāyano yatra purāṇas tapaso nidhiḥ yajñe kurukulaśreṣṭha tasya lokāv ubhau jitau","Āstīka sprach: „Wo bei dem Opfer der uralte Ṛṣi Dvaipāyana ist, o Bester des Kurugeschlechts, ein Schatz der Askese, von jenem sind beide Welten erobert.","",[["āstīka uvāca ṛṣir dvaipāyano yatra purāṇas","Āstīka sprach: wo der uralte Ṛṣi Dvaipāyana ist (Nom. + Nom. + Nom. + Rel.Adv. + Nom.)"],["tapaso nidhiḥ yajñe kurukulaśreṣṭha tasya lokāv ubhau jitau","ein Schatz der Askese, beim Opfer, o Bester des Kurugeschlechts, von jenem sind beide Welten erobert (Gen. + Nom. + Lok. + Vok. + Gen. + Nom.Du. + Nom.Du.Part.Perf.Pass.)"]]],["013","śrutaṃ vicitram ākhyānaṃ tvayā pāṇḍavanandana sarpāś ca bhasmasān nītā gatāś ca padavīṃ pituḥ","Vernommen hast du, o Freude der Pāṇḍavas, die wundersame Erzählung: Die Schlangen wurden zu Asche gemacht und gingen [im Tod] denselben Weg wie dereinst dein Vater [?].","[?] \"gatāś ca padavīṃ pituḥ\" (wörtl. \"gingen den Weg des Vaters\") - Sinn vermutlich: die Schlangen erlitten durch das Opfer denselben Untergang, wie zuvor dein Vater durch die Schlange starb; genaue Bildlogik unsicher.",[["śrutaṃ vicitram ākhyānaṃ tvayā pāṇḍavanandana","vernommen hast du, o Freude der Pāṇḍavas, die wundersame Erzählung (Nom.Part.Perf.Pass. + Akk. + Akk. + Instr. + Vok.)"],["sarpāś ca bhasmasān nītā gatāś ca padavīṃ pituḥ","die Schlangen wurden zu Asche gemacht und gingen den Weg des Vaters (Nom.Pl. + Akk. + Nom.Pl.Part.Perf.Pass. + Nom.Pl.Part.Perf. + Akk. + Gen.)"]]],["014","kathaṃ cit takṣako muktaḥ satyatvāt tava pārthiva ṛṣayaḥ pūjitāḥ sarve gatiṃ dṛṣṭvā mahātmanaḥ","Irgendwie wurde Takṣaka gerettet, durch deine Wahrhaftigkeit, o Herrscher; alle Ṛṣis wurden verehrt, als sie den Erfolg des Großherzigen [Vyāsa] sahen.","",[["kathaṃ cit takṣako muktaḥ satyatvāt tava pārthiva","irgendwie wurde Takṣaka gerettet, durch deine Wahrhaftigkeit, o Herrscher (Adv. + Nom. + Nom.Part.Perf.Pass. + Abl. + Gen. + Vok.)"],["ṛṣayaḥ pūjitāḥ sarve gatiṃ dṛṣṭvā mahātmanaḥ","alle Ṛṣis wurden verehrt, als sie den Erfolg des Großherzigen sahen (Nom.Pl. + Nom.Pl.Part.Perf.Pass. + Nom.Pl. + Akk. + Absol. + Gen.)"]]],["015","prāptaḥ suvipulo dharmaḥ śrutvā pāpavināśanam vimukto hṛdayagranthir udārajanadarśanāt","Erlangt wurde sehr umfassender Dharma, als man die Vernichtung der Sünde vernahm; gelöst wurde der Herzensknoten durch den Anblick der Edlen.","",[["prāptaḥ suvipulo dharmaḥ śrutvā pāpavināśanam","erlangt wurde sehr umfassender Dharma, als man die Vernichtung der Sünde vernahm (Nom.Part.Perf.Pass. + Nom. + Nom. + Absol. + Akk.)"],["vimukto hṛdayagranthir udārajanadarśanāt","gelöst wurde der Herzensknoten durch den Anblick der Edlen (Nom.Part.Perf.Pass. + Nom. + Abl.)"]]],["016","ye ca pakṣadharā dharme sadvṛttarucayaś ca ye yān dṛṣṭvā hīyate pāpaṃ tebhyaḥ kāryā namaskriyāḥ","Und jene, die Anhänger des Dharma sind, und jene, die Freude an rechtem Wandel haben - bei deren Anblick die Sünde schwindet -, ihnen gebührt Verehrung.“","",[["ye ca pakṣadharā dharme sadvṛttarucayaś ca ye","und jene, die Anhänger des Dharma sind, und jene, die Freude an rechtem Wandel haben (Nom.Pl. + Nom.Pl.Bahuvrīhi + Lok. + Nom.Pl.Bahuvrīhi)"],["yān dṛṣṭvā hīyate pāpaṃ tebhyaḥ kāryā namaskriyāḥ","bei deren Anblick die Sünde schwindet, ihnen gebührt Verehrung (Akk.Pl. + Absol. + Präs.Pass. + Nom. + Dat.Pl. + Nom.Part.Fut.Pass. + Nom.)"]]],["017","sūta uvāca etac chrutvā dvijaśreṣṭhāt sa rājā janamejayaḥ pūjayām āsa tam ṛṣim anumānya punaḥ punaḥ","Sūta sprach: Als er dies vom Besten der Zweifachgeborenen vernommen hatte, verehrte König Janamejaya jenen Ṛṣi und ehrte ihn wieder und wieder.","",[["sūta uvāca etac chrutvā dvijaśreṣṭhāt sa rājā janamejayaḥ","Sūta sprach: als er dies vom Besten der Zweifachgeborenen vernommen hatte, [tat] König Janamejaya (Nom. + Akk. + Absol. + Abl. + Nom. + Nom.)"],["pūjayām āsa tam ṛṣim anumānya punaḥ punaḥ","verehrte jenen Ṛṣi und ehrte ihn wieder und wieder (Perf.Periphr. + Akk. + Absol. + Adv.)"]]],["018","papraccha tam ṛṣiṃ cāpi vaiśaṃpāyanam acyutam kathāvaśeṣaṃ dharmajño vanavāsasya sattama","Und er fragte auch jenen unfehlbaren Ṛṣi Vaiśaṃpāyana, der Dharmakundige, o Bester, nach dem restlichen Teil der Erzählung vom Waldaufenthalt.","",[["papraccha tam ṛṣiṃ cāpi vaiśaṃpāyanam acyutam","und er fragte auch jenen unfehlbaren Ṛṣi Vaiśaṃpāyana (Perf. + Akk. + Akk. + Akk. + Akk.)"],["kathāvaśeṣaṃ dharmajño vanavāsasya sattama","nach dem restlichen Teil der Erzählung vom Waldaufenthalt, der Dharmakundige, o Bester (Akk. + Nom. + Gen. + Vok.)"]]]]},{"num":44,"title_sa":"","title_de":"Vyāsas Rat, die Abschiedsreden und die Rückkehr nach Hāstinapura","note":"Vyāsa rät Dhṛtarāṣṭra, Yudhiṣṭhira heimzuschicken; Dhṛtarāṣṭra kündigt seine Askese an; Yudhiṣṭhira, Gāndhārī, Kuntī und Sahadeva tauschen bewegte Abschiedsworte; die Pāṇḍavas kehren nach Hāstinapura zurück.","units":[["001","janamejaya uvāca dṛṣṭvā putrāṃs tathā pautrān sānubandhāñ janādhipaḥ dhṛtarāṣṭraḥ kim akarod rājā caiva yudhiṣṭhiraḥ","Janamejaya sprach: Nachdem der Herrscher der Menschen, König Dhṛtarāṣṭra, seine Söhne und ebenso die Enkel samt ihrem Gefolge gesehen hatte, was tat er, und was tat auch König Yudhiṣṭhira?","",[["janamejaya uvāca dṛṣṭvā putrāṃs tathā pautrān sānubandhāñ janādhipaḥ","Janamejaya sprach: nachdem der Herrscher der Menschen seine Söhne und ebenso die Enkel samt ihrem Gefolge gesehen hatte (Nom. + Absol. + Akk.Pl. + Akk.Pl. + Nom.)"],["dhṛtarāṣṭraḥ kim akarod rājā caiva yudhiṣṭhiraḥ","was tat Dhṛtarāṣṭra, und was tat auch König Yudhiṣṭhira (Nom. + Interrog. + Impf. + Nom.)"]]],["002","vaiśaṃpāyana uvāca tad dṛṣṭvā mahad āścaryaṃ putrāṇāṃ darśanaṃ punaḥ vītaśokaḥ sa rājarṣiḥ punar āśramam āgamat","Vaiśaṃpāyana sprach: Nachdem er jenes große Wunder gesehen hatte, den abermaligen Anblick der Söhne, kehrte jener königliche Weise, von Kummer befreit, wieder zum Āśrama zurück.","",[["vaiśaṃpāyana uvāca tad dṛṣṭvā mahad āścaryaṃ putrāṇāṃ darśanaṃ punaḥ","Vaiśaṃpāyana sprach: nachdem er jenes große Wunder gesehen hatte, den abermaligen Anblick der Söhne (Nom. + Absol. + Akk. + Akk. + Gen.Pl. + Akk.)"],["vītaśokaḥ sa rājarṣiḥ punar āśramam āgamat","kehrte jener königliche Weise, von Kummer befreit, wieder zum Āśrama zurück (Nom.Bahuvrīhi + Nom. + Akk. + Impf.)"]]],["003","itaras tu janaḥ sarvas te caiva paramarṣayaḥ pratijagmur yathākāmaṃ dhṛtarāṣṭrābhyanujñayā","Die übrigen Menschen aber alle, und ebenso jene höchsten Ṛṣis, kehrten, wie es ihnen beliebte, mit Dhṛtarāṣṭras Erlaubnis zurück.","",[["itaras tu janaḥ sarvas te caiva paramarṣayaḥ","die übrigen Menschen aber alle, und ebenso jene höchsten Ṛṣis (Nom. + Nom. + Nom.Pl.)"],["pratijagmur yathākāmaṃ dhṛtarāṣṭrābhyanujñayā","kehrten, wie es ihnen beliebte, mit Dhṛtarāṣṭras Erlaubnis zurück (Perf. + Adv. + Instr.)"]]],["004","pāṇḍavās tu mahātmāno laghubhūyiṣṭhasainikāḥ anujagmur mahātmānaṃ sadāraṃ taṃ mahīpatim","Die großherzigen Pāṇḍavas aber, mit größtenteils leichtbewaffneten Kriegern, folgten dem großherzigen Herrn der Erde samt seiner Gattin.","",[["pāṇḍavās tu mahātmāno laghubhūyiṣṭhasainikāḥ","die großherzigen Pāṇḍavas aber, mit größtenteils leichtbewaffneten Kriegern (Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["anujagmur mahātmānaṃ sadāraṃ taṃ mahīpatim","folgten dem großherzigen Herrn der Erde samt seiner Gattin (Perf. + Akk. + Akk.Bahuvrīhi + Akk.)"]]],["005","tam āśramagataṃ dhīmān brahmarṣir lokapūjitaḥ muniḥ satyavatīputro dhṛtarāṣṭram abhāṣata","Zu jenem, der in den Āśrama gegangen war, sprach der weise Brahmarṣi, von der Welt verehrt, der Weise, der Sohn der Satyavatī, zu Dhṛtarāṣṭra.","",[["tam āśramagataṃ dhīmān brahmarṣir lokapūjitaḥ","zu jenem, der in den Āśrama gegangen war, der weise Brahmarṣi, von der Welt verehrt (Akk. + Nom. + Nom. + Nom.Bahuvrīhi)"],["muniḥ satyavatīputro dhṛtarāṣṭram abhāṣata","der Weise, der Sohn der Satyavatī, sprach zu Dhṛtarāṣṭra (Nom. + Nom. + Akk. + Impf.)"]]],["006","dhṛtarāṣṭra mahābāho śṛṇu kauravanandana śrutaṃ te jñānavṛddhānām ṛṣīṇāṃ puṇyakarmaṇām","„Dhṛtarāṣṭra, Starkarmiger, höre, Freude der Kauravas: Du hast die mannigfachen Erzählungen der an Wissen alten, in heiligen Werken erfahrenen Ṛṣis vernommen,","",[["dhṛtarāṣṭra mahābāho śṛṇu kauravanandana","Dhṛtarāṣṭra, Starkarmiger, höre, Freude der Kauravas (Vok. + Vok. + Imp. + Vok.)"],["śrutaṃ te jñānavṛddhānām ṛṣīṇāṃ puṇyakarmaṇām","vernommen hast du von den an Wissen alten, in heiligen Werken erfahrenen Ṛṣis (Nom.Part.Perf.Pass. + Gen. + Gen.Pl.Bahuvrīhi + Gen.Pl. + Gen.Pl.Bahuvrīhi)"]]],["007","ṛddhābhijanavṛddhānāṃ vedavedāṅgavedinām dharmajñānāṃ purāṇānāṃ vadatāṃ vividhāḥ kathāḥ","der an Wohlstand und Abstammung Bedeutenden, der Veda- und Vedāṅga-Kenner, der Dharmakundigen, die von den alten Überlieferungen sprachen - die mannigfachen Erzählungen.","",[["ṛddhābhijanavṛddhānāṃ vedavedāṅgavedinām","der an Wohlstand und Abstammung Bedeutenden, der Veda- und Vedāṅga-Kenner (Gen.Pl.Bahuvrīhi + Gen.Pl.Bahuvrīhi)"],["dharmajñānāṃ purāṇānāṃ vadatāṃ vividhāḥ kathāḥ","der Dharmakundigen, die von den alten Überlieferungen sprachen - die mannigfachen Erzählungen (Gen.Pl.Bahuvrīhi + Gen.Pl. + Gen.Pl.Part. + Akk.Pl. + Akk.Pl.)"]]],["008","mā sma śoke manaḥ kārṣīr diṣṭena vyathate budhaḥ śrutaṃ devarahasyaṃ te nāradād devadarśanāt","Richte dein Herz nicht auf Kummer - der Weise wird nicht durch das Schicksal erschüttert; du hast das Geheimnis der Götter von Nārada vernommen, durch den Anblick der Götter.","",[["mā sma śoke manaḥ kārṣīr diṣṭena vyathate budhaḥ","richte dein Herz nicht auf Kummer - der Weise wird nicht durch das Schicksal erschüttert (Neg. + Lok. + Akk. + Aor. + Instr. + Präs.Pass. + Nom.)"],["śrutaṃ devarahasyaṃ te nāradād devadarśanāt","du hast das Geheimnis der Götter von Nārada vernommen, durch den Anblick der Götter (Nom.Part.Perf.Pass. + Akk. + Gen. + Abl. + Abl.)"]]],["009","gatās te kṣatradharmeṇa śastrapūtāṃ gatiṃ śubhām yathā dṛṣṭās tvayā putrā yathākāmavihāriṇaḥ","Deine Söhne sind, nach dem Kṣatriya-Dharma, zu einem heilvollen, durch die Waffe geläuterten Ziel gegangen, so wie du sie gesehen hast, nach Belieben wandelnd.","",[["gatās te kṣatradharmeṇa śastrapūtāṃ gatiṃ śubhām","deine Söhne sind, nach dem Kṣatriya-Dharma, zu einem heilvollen, durch die Waffe geläuterten Ziel gegangen (Nom.Pl.Part.Perf. + Gen. + Instr. + Akk. + Akk. + Akk.)"],["yathā dṛṣṭās tvayā putrā yathākāmavihāriṇaḥ","so wie du sie gesehen hast, deine Söhne, nach Belieben wandelnd (Adv. + Nom.Pl.Part.Perf.Pass. + Instr. + Nom.Pl. + Nom.Pl.Bahuvrīhi)"]]],["010","yudhiṣṭhiras tv ayaṃ dhīmān bhavantam anurudhyate sahito bhrātṛbhiḥ sarvaiḥ sadāraḥ sasuhṛjjanaḥ","Dieser weise Yudhiṣṭhira aber ist dir zugetan, begleitet von all seinen Brüdern, mit Gattin und Angehörigen.","",[["yudhiṣṭhiras tv ayaṃ dhīmān bhavantam anurudhyate","dieser weise Yudhiṣṭhira aber ist dir zugetan (Nom. + Nom. + Nom. + Akk. + Präs.Med.)"],["sahito bhrātṛbhiḥ sarvaiḥ sadāraḥ sasuhṛjjanaḥ","begleitet von all seinen Brüdern, mit Gattin und Angehörigen (Nom.Part. + Instr.Pl. + Instr.Pl. + Nom.Bahuvrīhi + Nom.Bahuvrīhi)"]]],["011","visarjayainaṃ yātv eṣa svarājyam anuśāsatām māsaḥ samadhiko hy eṣām atīto vasatāṃ vane","Entlasse ihn - er soll gehen, um sein eigenes Reich zu regieren; ein Monat und mehr ist bereits vergangen, seit sie im Wald weilen.","",[["visarjayainaṃ yātv eṣa svarājyam anuśāsatām","entlasse ihn - er soll gehen, um sein eigenes Reich zu regieren (Imp.Kaus. + Akk. + Imp. + Nom. + Akk. + Gen.Pl.Part.)"],["māsaḥ samadhiko hy eṣām atīto vasatāṃ vane","ein Monat und mehr ist bereits vergangen, seit sie im Wald weilen (Nom. + Nom. + Gen.Pl. + Nom.Part.Perf. + Gen.Pl.Part. + Lok.)"]]],["012","etad dhi nityaṃ yatnena padaṃ rakṣyaṃ paraṃtapa bahupratyarthikaṃ hy etad rājyaṃ nāma narādhipa","Denn dieser Rang muss stets mit Sorgfalt bewahrt werden, Bezwinger der Feinde; vielumworben ist ja, Herr der Menschen, das, was man Königreich nennt.“","",[["etad dhi nityaṃ yatnena padaṃ rakṣyaṃ paraṃtapa","denn dieser Rang muss stets mit Sorgfalt bewahrt werden, Bezwinger der Feinde (Nom. + Adv. + Instr. + Nom. + Nom.Part.Fut.Pass. + Vok.)"],["bahupratyarthikaṃ hy etad rājyaṃ nāma narādhipa","vielumworben ist ja das, was man Königreich nennt, Herr der Menschen (Nom.Bahuvrīhi + Nom. + Nom. + Indekl. + Vok.)"]]],["013","ity uktaḥ kauravo rājā vyāsenāmitabuddhinā yudhiṣṭhiram athāhūya vāgmī vacanam abravīt","So angesprochen von Vyāsa, dem an Einsicht Unermesslichen, rief der Kaurava-König darauf Yudhiṣṭhira herbei, und der Redegewandte sprach diese Worte:","",[["ity uktaḥ kauravo rājā vyāsenāmitabuddhinā","so angesprochen von Vyāsa, dem an Einsicht Unermesslichen, der Kaurava-König (Nom.Part.Perf.Pass. + Nom. + Nom. + Instr.Bahuvrīhi)"],["yudhiṣṭhiram athāhūya vāgmī vacanam abravīt","rief darauf Yudhiṣṭhira herbei, und der Redegewandte sprach diese Worte (Akk. + Absol. + Nom. + Akk. + Impf.)"]]],["014","ajātaśatro bhadraṃ te śṛṇu me bhrātṛbhiḥ saha tvatprasādān mahīpāla śoko nāsmān prabādhate","„Ajātaśatru, Heil dir; höre mich, zusammen mit deinen Brüdern: Durch deine Gunst, Herrscher der Erde, quält uns kein Kummer mehr.","",[["ajātaśatro bhadraṃ te śṛṇu me bhrātṛbhiḥ saha","Ajātaśatru, Heil dir; höre mich, zusammen mit deinen Brüdern (Vok. + Nom. + Dat. + Imp. + Gen. + Instr.Pl.)"],["tvatprasādān mahīpāla śoko nāsmān prabādhate","durch deine Gunst, Herrscher der Erde, quält uns kein Kummer mehr (Abl. + Vok. + Nom. + Akk. + Präs.Med.)"]]],["015","rame cāhaṃ tvayā putra pureva gajasāhvaye nāthenānugato vidvan priyeṣu parivartinā","Und ich erfreue mich an dir, mein Sohn, wie einst in Gajasāhvaya, begleitet von dir, dem Kundigen, meinem Beschützer, der sich in liebevollen Dingen bewegt.","",[["rame cāhaṃ tvayā putra pureva gajasāhvaye","und ich erfreue mich an dir, mein Sohn, wie einst in Gajasāhvaya (Präs.Med. + Nom. + Instr. + Vok. + Adv. + Lok.)"],["nāthenānugato vidvan priyeṣu parivartinā","begleitet von dir, dem Kundigen, meinem Beschützer, der sich in liebevollen Dingen bewegt (Instr. + Nom.Part.Perf. + Vok. + Lok.Pl. + Instr.)"]]],["016","prāptaṃ putraphalaṃ tvattaḥ prītir me vipulā tvayi na me manyur mahābāho gamyatāṃ putra mā ciram","Erlangt habe ich durch dich die Frucht eines Sohnes; groß ist meine Liebe zu dir; kein Zorn ist in mir, Starkarmiger - gehe, mein Sohn, nicht länger.","",[["prāptaṃ putraphalaṃ tvattaḥ prītir me vipulā tvayi","erlangt habe ich durch dich die Frucht eines Sohnes; groß ist meine Liebe zu dir (Nom.Part.Perf.Pass. + Nom. + Abl. + Nom. + Gen. + Nom. + Lok.)"],["na me manyur mahābāho gamyatāṃ putra mā ciram","kein Zorn ist in mir, Starkarmiger - gehe, mein Sohn, nicht länger (Neg. + Gen. + Nom. + Vok. + Imp.Pass. + Vok. + Neg. + Adv.)"]]],["017","bhavantaṃ ceha saṃprekṣya tapo me parihīyate tapoyuktaṃ śarīraṃ ca tvāṃ dṛṣṭvā dhāritaṃ punaḥ","Und da ich dich hier erblicke, schwindet meine Askese; und mein der Askese ergebener Körper wird, nachdem ich dich gesehen habe, wieder am Leben erhalten.","",[["bhavantaṃ ceha saṃprekṣya tapo me parihīyate","und da ich dich hier erblicke, schwindet meine Askese (Akk. + Absol. + Nom. + Gen. + Präs.Pass.)"],["tapoyuktaṃ śarīraṃ ca tvāṃ dṛṣṭvā dhāritaṃ punaḥ","und mein der Askese ergebener Körper wird, nachdem ich dich gesehen habe, wieder am Leben erhalten (Nom.Bahuvrīhi + Nom. + Akk. + Absol. + Nom.Part.Perf.Pass.)"]]],["018","mātarau te tathaiveme śīrṇaparṇakṛtāśane mama tulyavrate putra naciraṃ vartayiṣyataḥ","Ebenso werden auch deine beiden Mütter hier, deren Nahrung aus welken Blättern besteht, mein Sohn, die dasselbe Gelübde wie ich halten, nicht mehr lange verweilen.","",[["mātarau te tathaiveme śīrṇaparṇakṛtāśane","deine beiden Mütter hier, ebenso, deren Nahrung aus welken Blättern besteht (Nom.Du. + Gen. + Nom.Du.Bahuvrīhi)"],["mama tulyavrate putra naciraṃ vartayiṣyataḥ","die dasselbe Gelübde wie ich halten, mein Sohn, werden nicht mehr lange verweilen (Gen. + Nom.Du.Bahuvrīhi + Vok. + Adv. + Fut.Med.)"]]],["019","duryodhanaprabhṛtayo dṛṣṭā lokāntaraṃ gatāḥ vyāsasya tapaso vīryād bhavataś ca samāgamāt","Duryodhana und die anderen wurden gesehen, wie sie in eine andere Welt gegangen sind, durch die Kraft von Vyāsas Askese und durch deine Zusammenkunft mit ihnen.","",[["duryodhanaprabhṛtayo dṛṣṭā lokāntaraṃ gatāḥ","Duryodhana und die anderen wurden gesehen, wie sie in eine andere Welt gegangen sind (Nom.Pl.Bahuvrīhi + Nom.Pl.Part.Perf.Pass. + Akk. + Nom.Pl.Part.Perf.)"],["vyāsasya tapaso vīryād bhavataś ca samāgamāt","durch die Kraft von Vyāsas Askese und durch deine Zusammenkunft (Gen. + Gen. + Abl. + Gen. + Abl.)"]]],["020","prayojanaṃ ciraṃ vṛttaṃ jīvitasya ca me 'nagha ugraṃ tapaḥ samāsthāsye tvam anujñātum arhasi","Der Zweck meines Lebens ist lange schon erfüllt, o Schuldloser; strenge Askese werde ich auf mich nehmen - du sollst mir die Erlaubnis geben.","",[["prayojanaṃ ciraṃ vṛttaṃ jīvitasya ca me 'nagha","der Zweck meines Lebens ist lange schon erfüllt, o Schuldloser (Nom. + Adv. + Nom.Part.Perf. + Gen. + Gen. + Vok.)"],["ugraṃ tapaḥ samāsthāsye tvam anujñātum arhasi","strenge Askese werde ich auf mich nehmen - du sollst mir die Erlaubnis geben (Akk. + Akk. + Fut.Med. + Nom. + Inf. + Präs.)"]]],["021","tvayy adya piṇḍaḥ kīrtiś ca kulaṃ cedaṃ pratiṣṭhitam śvo vādya vā mahābāho gamyatāṃ putra mā ciram","In dir sind heute die Totenopfergabe, der Ruhm und dieses Geschlecht begründet; morgen oder heute, Starkarmiger, gehe, mein Sohn, nicht länger.","",[["tvayy adya piṇḍaḥ kīrtiś ca kulaṃ cedaṃ pratiṣṭhitam","in dir sind heute die Totenopfergabe, der Ruhm und dieses Geschlecht begründet (Lok. + Adv. + Nom. + Nom. + Nom. + Nom.Part.Perf.Pass.)"],["śvo vādya vā mahābāho gamyatāṃ putra mā ciram","morgen oder heute, Starkarmiger, gehe, mein Sohn, nicht länger (Adv. + Adv. + Vok. + Imp.Pass. + Vok. + Neg. + Adv.)"]]],["022","rājanītiḥ subahuśaḥ śrutā te bharatarṣabha saṃdeṣṭavyaṃ na paśyāmi kṛtam etāvatā vibho","Die Staatskunst hast du vielfach vernommen, Stier der Bharatas; ich sehe nichts mehr zu befehlen - getan ist es damit, Herr.“","",[["rājanītiḥ subahuśaḥ śrutā te bharatarṣabha","die Staatskunst hast du vielfach vernommen, Stier der Bharatas (Nom. + Adv. + Nom.Part.Perf.Pass. + Gen. + Vok.)"],["saṃdeṣṭavyaṃ na paśyāmi kṛtam etāvatā vibho","ich sehe nichts mehr zu befehlen - getan ist es damit, Herr (Akk.Part.Fut.Pass. + Neg. + Präs. + Nom.Part.Perf.Pass. + Instr. + Vok.)"]]],["023","ity uktavacanaṃ tāta nṛpo rājānam abravīt na mām arhasi dharmajña parityaktum anāgasam","So angesprochen, mein Kind [Anm.: Vaiśaṃpāyana redet Janamejaya an], sprach der König zum König: „Du sollst mich nicht, o Kenner des Dharma, verlassen, mich, den Schuldlosen,","",[["ity uktavacanaṃ tāta nṛpo rājānam abravīt","so angesprochen, mein Kind, sprach der König zum König (Akk. + Vok. + Nom. + Akk. + Impf.)"],["na mām arhasi dharmajña parityaktum anāgasam","du sollst mich nicht, o Kenner des Dharma, verlassen, mich, den Schuldlosen (Neg. + Akk. + Präs. + Vok. + Inf. + Akk.)"]]],["024","kāmaṃ gacchantu me sarve bhrātaro 'nucarās tathā bhavantam aham anviṣye mātarau ca yatavrate","mögen meine Brüder und die Gefolgsleute alle nach Belieben gehen - dir aber werde ich folgen, und meinen beiden Müttern, die ihr Gelübde halten.“","",[["kāmaṃ gacchantu me sarve bhrātaro 'nucarās tathā","mögen meine Brüder und die Gefolgsleute alle nach Belieben gehen (Adv. + Imp. + Gen. + Nom.Pl. + Nom.Pl. + Nom.Pl.)"],["bhavantam aham anviṣye mātarau ca yatavrate","dir aber werde ich folgen, und meinen beiden Müttern, die ihr Gelübde halten (Akk. + Nom. + Fut.Med. + Akk.Du. + Akk.Du.Bahuvrīhi)"]]],["025","tam uvācātha gāndhārī maivaṃ putra śṛṇuṣva me tvayy adhīnaṃ kurukulaṃ piṇḍaś ca śvaśurasya me","Da sprach Gāndhārī zu ihm: „Nicht so, mein Sohn; höre mich: An dir hängt das Kuru-Geschlecht, und die Totenopfergabe meines Schwiegervaters.","",[["tam uvācātha gāndhārī maivaṃ putra śṛṇuṣva me","da sprach Gāndhārī zu ihm: nicht so, mein Sohn; höre mich (Akk. + Impf. + Nom. + Neg. + Vok. + Imp. + Akk.)"],["tvayy adhīnaṃ kurukulaṃ piṇḍaś ca śvaśurasya me","an dir hängt das Kuru-Geschlecht, und die Totenopfergabe meines Schwiegervaters (Lok. + Nom.Bahuvrīhi + Nom. + Nom. + Gen. + Gen.)"]]],["026","gamyatāṃ putra paryāptam etāvat pūjitā vayam rājā yad āha tat kāryaṃ tvayā putra pitur vacaḥ","Gehe, mein Sohn; genug ist dieses Maß - geehrt sind wir; was der König gesagt hat, das musst du tun, mein Sohn - das Wort deines Vaters.“","",[["gamyatāṃ putra paryāptam etāvat pūjitā vayam","gehe, mein Sohn; genug ist dieses Maß - geehrt sind wir (Imp.Pass. + Vok. + Nom. + Nom. + Nom.Part.Perf.Pass. + Nom.)"],["rājā yad āha tat kāryaṃ tvayā putra pitur vacaḥ","was der König gesagt hat, das musst du tun, mein Sohn - das Wort deines Vaters (Nom. + Akk. + Perf. + Nom. + Nom.Part.Fut.Pass. + Instr. + Vok. + Gen. + Akk.)"]]],["027","ity uktaḥ sa tu gāndhāryā kuntīm idam uvāca ha snehabāṣpākule netre pramṛjya rudatīṃ vacaḥ","So von Gāndhārī angesprochen, sprach er darauf, nachdem er die von Tränen der Zuneigung umflorten Augen gewischt hatte, dieses weinende Wort zu Kuntī:","",[["ity uktaḥ sa tu gāndhāryā kuntīm idam uvāca ha","so von Gāndhārī angesprochen, sprach er darauf dieses zu Kuntī (Nom.Part.Perf.Pass. + Nom. + Instr. + Akk. + Akk. + Impf.)"],["snehabāṣpākule netre pramṛjya rudatīṃ vacaḥ","nachdem er die von Tränen der Zuneigung umflorten Augen gewischt hatte, ein weinendes Wort (Akk.Du.Bahuvrīhi + Absol. + Akk.Part. + Akk.)"]]],["028","visarjayati māṃ rājā gāndhārī ca yaśasvinī bhavatyāṃ baddhacittas tu kathaṃ yāsyāmi duḥkhitaḥ","„Der König entlässt mich, und die ruhmreiche Gāndhārī ebenso; doch mit an dich gebundenem Herzen, wie soll ich gehen, bekümmert?","",[["visarjayati māṃ rājā gāndhārī ca yaśasvinī","der König entlässt mich, und die ruhmreiche Gāndhārī ebenso (Präs.Kaus. + Akk. + Nom. + Nom. + Nom.)"],["bhavatyāṃ baddhacittas tu kathaṃ yāsyāmi duḥkhitaḥ","doch mit an dich gebundenem Herzen, wie soll ich gehen, bekümmert (Lok. + Nom.Bahuvrīhi + Interrog. + Fut. + Nom.Part.Perf.Pass.)"]]],["029","na cotsahe tapovighnaṃ kartuṃ te dharmacāriṇi tapaso hi paraṃ nāsti tapasā vindate mahat","Und ich vermag es nicht, ein Hindernis für deine Askese zu schaffen, o Dharmawandelnde; denn es gibt nichts Höheres als Askese - durch Askese erlangt man Großes.","",[["na cotsahe tapovighnaṃ kartuṃ te dharmacāriṇi","und ich vermag es nicht, ein Hindernis für deine Askese zu schaffen, o Dharmawandelnde (Neg. + Präs.Med. + Akk. + Inf. + Gen. + Vok.)"],["tapaso hi paraṃ nāsti tapasā vindate mahat","denn es gibt nichts Höheres als Askese - durch Askese erlangt man Großes (Abl. + Nom. + Neg.Präs. + Instr. + Präs.Med. + Akk.)"]]],["030","mamāpi na tathā rājñi rājye buddhir yathā purā tapasy evānuraktaṃ me manaḥ sarvātmanā tathā","Auch mir, o Königin, ist der Sinn nicht mehr so auf das Königtum gerichtet wie einst; einzig der Askese ist mein Geist mit ganzem Wesen zugetan.","",[["mamāpi na tathā rājñi rājye buddhir yathā purā","auch mir, o Königin, ist der Sinn nicht mehr so auf das Königtum gerichtet wie einst (Gen. + Neg. + Adv. + Vok. + Lok. + Nom. + Adv. + Adv.)"],["tapasy evānuraktaṃ me manaḥ sarvātmanā tathā","einzig der Askese ist mein Geist mit ganzem Wesen zugetan (Lok. + Nom.Part.Perf.Pass. + Gen. + Nom. + Instr. + Adv.)"]]],["031","śūnyeyaṃ ca mahī sarvā na me prītikarī śubhe bāndhavā naḥ parikṣīṇā balaṃ no na yathā purā","Und diese ganze Erde ist leer, sie bereitet mir keine Freude mehr, o Heilvolle; unsere Verwandten sind dahingeschwunden, unsere Kraft ist nicht mehr wie einst.","",[["śūnyeyaṃ ca mahī sarvā na me prītikarī śubhe","und diese ganze Erde ist leer, sie bereitet mir keine Freude mehr, o Heilvolle (Nom. + Nom. + Nom. + Neg. + Gen. + Nom.Bahuvrīhi + Vok.)"],["bāndhavā naḥ parikṣīṇā balaṃ no na yathā purā","unsere Verwandten sind dahingeschwunden, unsere Kraft ist nicht mehr wie einst (Nom.Pl. + Gen. + Nom.Pl.Part.Perf. + Nom. + Gen. + Neg. + Adv. + Adv.)"]]],["032","pāñcālāḥ subhṛśaṃ kṣīṇāḥ kanyāmātrāvaśeṣitāḥ na teṣāṃ kulakartāraṃ kaṃ cit paśyāmy ahaṃ śubhe","Die Pāñcālas sind gar sehr geschwunden, nur Töchter sind übriggeblieben; keinen Fortsetzer ihres Geschlechts sehe ich unter ihnen, o Heilvolle.","",[["pāñcālāḥ subhṛśaṃ kṣīṇāḥ kanyāmātrāvaśeṣitāḥ","die Pāñcālas sind gar sehr geschwunden, nur Töchter sind übriggeblieben (Nom.Pl. + Adv. + Nom.Pl.Part.Perf. + Nom.Pl.Bahuvrīhi)"],["na teṣāṃ kulakartāraṃ kaṃ cit paśyāmy ahaṃ śubhe","keinen Fortsetzer ihres Geschlechts sehe ich unter ihnen, o Heilvolle (Neg. + Gen.Pl. + Akk. + Akk. + Präs. + Nom. + Vok.)"]]],["033","sarve hi bhasmasān nītā droṇenaikena saṃyuge avaśeṣās tu nihatā droṇaputreṇa vai niśi","Denn alle wurden von Droṇa allein in der Schlacht zu Asche gemacht, und die Übriggebliebenen wurden vom Sohn Droṇas des Nachts erschlagen.","",[["sarve hi bhasmasān nītā droṇenaikena saṃyuge","denn alle wurden von Droṇa allein in der Schlacht zu Asche gemacht (Nom.Pl. + Akk. + Nom.Pl.Part.Perf.Pass. + Instr. + Instr. + Lok.)"],["avaśeṣās tu nihatā droṇaputreṇa vai niśi","und die Übriggebliebenen wurden vom Sohn Droṇas des Nachts erschlagen (Nom.Pl. + Nom.Pl.Part.Perf.Pass. + Instr. + Lok.)"]]],["034","cedayaś caiva matsyāś ca dṛṣṭapūrvās tathaiva naḥ kevalaṃ vṛṣṇicakraṃ tu vāsudevaparigrahāt yaṃ dṛṣṭvā sthātum icchāmi dharmārthaṃ nānyahetukam","Und die Cediner und die Matsyas, wie zuvor von uns gesehen, sind ebenso dahin; allein der Kreis der Vṛṣṇis besteht durch Vāsudevas Schutz - bei dessen Anblick ich um des Dharma willen bleiben möchte, aus keinem anderen Grund.","",[["cedayaś caiva matsyāś ca dṛṣṭapūrvās tathaiva naḥ","und die Cediner und die Matsyas, wie zuvor von uns gesehen (Nom.Pl. + Nom.Pl. + Nom.Pl.Bahuvrīhi + Gen.)"],["kevalaṃ vṛṣṇicakraṃ tu vāsudevaparigrahāt yaṃ dṛṣṭvā sthātum icchāmi dharmārthaṃ nānyahetukam","allein der Kreis der Vṛṣṇis besteht durch Vāsudevas Schutz - bei dessen Anblick ich um des Dharma willen bleiben möchte, aus keinem anderen Grund (Nom. + Nom. + Abl. + Akk. + Absol. + Inf. + Präs. + Akk. + Akk.Bahuvrīhi)"]]],["035","śivena paśya naḥ sarvān durlabhaṃ darśanaṃ tava bhaviṣyaty amba rājā hi tīvram ārapsyate tapaḥ","Blicke wohlwollend auf uns alle; dein Anblick wird schwer zu erlangen sein, o Mutter, denn der König wird strenge Askese beginnen.“","",[["śivena paśya naḥ sarvān durlabhaṃ darśanaṃ tava bhaviṣyaty amba","blicke wohlwollend auf uns alle; dein Anblick wird schwer zu erlangen sein, o Mutter (Instr. + Imp. + Akk. + Akk.Pl. + Nom. + Nom. + Gen. + Fut. + Vok.)"],["rājā hi tīvram ārapsyate tapaḥ","denn der König wird strenge Askese beginnen (Nom. + Akk. + Fut.Med. + Akk.)"]]],["036","etac chrutvā mahābāhuḥ sahadevo yudhāṃ patiḥ yudhiṣṭhiram uvācedaṃ bāṣpavyākulalocanaḥ","Als er dies vernommen hatte, sprach der starkarmige Sahadeva, der Herr der Krieger, dies zu Yudhiṣṭhira, mit tränenverwirrten Augen:","",[["etac chrutvā mahābāhuḥ sahadevo yudhāṃ patiḥ","als er dies vernommen hatte, der starkarmige Sahadeva, der Herr der Krieger (Akk. + Absol. + Nom. + Nom. + Gen.Pl. + Nom.)"],["yudhiṣṭhiram uvācedaṃ bāṣpavyākulalocanaḥ","sprach dies zu Yudhiṣṭhira, mit tränenverwirrten Augen (Akk. + Impf. + Akk. + Nom.Bahuvrīhi)"]]],["037","notsahe 'haṃ parityaktuṃ mātaraṃ pārthivarṣabha pratiyātu bhavān kṣipraṃ tapas tapsyāmy ahaṃ vane","„Ich vermag es nicht, meine Mutter zu verlassen, Stier unter den Königen; du magst schnell zurückkehren - ich werde im Wald Askese üben.","",[["notsahe 'haṃ parityaktuṃ mātaraṃ pārthivarṣabha","ich vermag es nicht, meine Mutter zu verlassen, Stier unter den Königen (Neg.Präs.Med. + Nom. + Inf. + Akk. + Vok.)"],["pratiyātu bhavān kṣipraṃ tapas tapsyāmy ahaṃ vane","du magst schnell zurückkehren - ich werde im Wald Askese üben (Imp. + Nom. + Adv. + Akk. + Fut. + Nom. + Lok.)"]]],["038","ihaiva śoṣayiṣyāmi tapasāhaṃ kalevaram pādaśuśrūṣaṇe yukto rājño mātros tathānayoḥ","Hier eben werde ich meinen Leib durch Askese austrocknen, dem Dienst an den Füßen des Königs und dieser beiden Mütter ergeben.“","",[["ihaiva śoṣayiṣyāmi tapasāhaṃ kalevaram","hier eben werde ich meinen Leib durch Askese austrocknen (Adv. + Fut.Kaus. + Instr. + Nom. + Akk.)"],["pādaśuśrūṣaṇe yukto rājño mātros tathānayoḥ","dem Dienst an den Füßen des Königs und dieser beiden Mütter ergeben (Lok. + Nom.Part. + Gen. + Gen.Du. + Adv. + Gen.Du.)"]]],["039","tam uvāca tataḥ kuntī pariṣvajya mahābhujam gamyatāṃ putra maiva tvaṃ vocaḥ kuru vaco mama","Da sprach Kuntī, den Starkarmigen umarmend, zu ihm: „Gehe, mein Sohn; sprich nicht so - folge meinem Wort.","",[["tam uvāca tataḥ kuntī pariṣvajya mahābhujam","da sprach Kuntī, den Starkarmigen umarmend, zu ihm (Akk. + Impf. + Nom. + Absol. + Akk.)"],["gamyatāṃ putra maiva tvaṃ vocaḥ kuru vaco mama","gehe, mein Sohn; sprich nicht so - folge meinem Wort (Imp.Pass. + Vok. + Neg. + Nom. + Aor. + Imp. + Akk. + Gen.)"]]],["040","āgamā vaḥ śivāḥ santu svasthā bhavata putrakāḥ uparodho bhaved evam asmākaṃ tapasaḥ kṛte","Heilvoll sei euer Kommen; seid wohl, meine lieben Söhne; sonst würde dies ein Hindernis für unsere Askese sein.","",[["āgamā vaḥ śivāḥ santu svasthā bhavata putrakāḥ","heilvoll sei euer Kommen; seid wohl, meine lieben Söhne (Nom.Pl. + Gen. + Nom.Pl. + Imp. + Nom.Pl. + Imp. + Vok.Pl.)"],["uparodho bhaved evam asmākaṃ tapasaḥ kṛte","sonst würde dies ein Hindernis für unsere Askese sein (Nom. + Opt. + Adv. + Gen. + Gen. + Postp.)"]]],["041","tvatsnehapāśabaddhā ca hīyeyaṃ tapasaḥ parāt tasmāt putraka gaccha tvaṃ śiṣṭam alpaṃ hi naḥ prabho","Und gebunden durch die Fessel der Liebe zu dir würde ich von der höchsten Askese abfallen; darum, mein lieber Sohn, gehe du - wenig nur bleibt uns übrig, o Herr.“","",[["tvatsnehapāśabaddhā ca hīyeyaṃ tapasaḥ parāt","und gebunden durch die Fessel der Liebe zu dir würde ich von der höchsten Askese abfallen (Nom.Bahuvrīhi + Opt.Pass. + Abl. + Abl.)"],["tasmāt putraka gaccha tvaṃ śiṣṭam alpaṃ hi naḥ prabho","darum, mein lieber Sohn, gehe du - wenig nur bleibt uns übrig, o Herr (Adv. + Vok. + Imp. + Nom. + Nom. + Nom. + Gen. + Vok.)"]]],["042","evaṃ saṃstambhitaṃ vākyaiḥ kuntyā bahuvidhair manaḥ sahadevasya rājendra rājñaś caiva viśeṣataḥ","So wurde durch Kuntīs mannigfache Worte der Sinn Sahadevas gefestigt, o Herrscher der Könige, und besonders auch der des Königs.","",[["evaṃ saṃstambhitaṃ vākyaiḥ kuntyā bahuvidhair manaḥ","so wurde durch Kuntīs mannigfache Worte der Sinn gefestigt (Adv. + Nom.Part.Perf.Pass. + Instr.Pl. + Instr. + Instr.Pl. + Nom.)"],["sahadevasya rājendra rājñaś caiva viśeṣataḥ","Sahadevas, o Herrscher der Könige, und besonders auch der des Königs (Gen. + Vok. + Gen. + Adv.)"]]],["043","te mātrā samanujñātā rājñā ca kurupuṃgavāḥ abhivādya kuruśreṣṭham āmantrayitum ārabhan","Von der Mutter und vom König verabschiedet, begannen jene Stiere der Kurus, nachdem sie den Besten der Kurus gegrüßt hatten, Abschiedsworte zu sprechen:","",[["te mātrā samanujñātā rājñā ca kurupuṃgavāḥ","von der Mutter und vom König verabschiedet, jene Stiere der Kurus (Nom.Pl.Part.Perf.Pass. + Instr. + Instr. + Nom.Pl.)"],["abhivādya kuruśreṣṭham āmantrayitum ārabhan","begannen, nachdem sie den Besten der Kurus gegrüßt hatten, Abschiedsworte zu sprechen (Absol. + Akk. + Inf. + Impf.)"]]],["044","rājan pratigamiṣyāmaḥ śivena pratinanditāḥ anujñātās tvayā rājan gamiṣyāmo vikalmaṣāḥ","„O König, wir werden wiederkommen, mit Heil verabschiedet; von dir erlaubt, o König, werden wir gehen, frei von Makel.“","",[["rājan pratigamiṣyāmaḥ śivena pratinanditāḥ","o König, wir werden wiederkommen, mit Heil verabschiedet (Vok. + Fut. + Instr. + Nom.Pl.Part.Perf.Pass.)"],["anujñātās tvayā rājan gamiṣyāmo vikalmaṣāḥ","von dir erlaubt, o König, werden wir gehen, frei von Makel (Nom.Pl.Part.Perf.Pass. + Instr. + Vok. + Fut. + Nom.Pl.Bahuvrīhi)"]]],["045","evam uktaḥ sa rājarṣir dharmarājñā mahātmanā anujajñe jayāśīrbhir abhinandya yudhiṣṭhiram","So angesprochen, gab jener königliche Weise, durch den großherzigen Dharma-König, mit Siegeswünschen, Yudhiṣṭhira seine Zustimmung, ihn beglückwünschend.","",[["evam uktaḥ sa rājarṣir dharmarājñā mahātmanā","so angesprochen, jener königliche Weise, durch den großherzigen Dharma-König (Nom.Part.Perf.Pass. + Nom. + Nom. + Instr. + Instr.)"],["anujajñe jayāśīrbhir abhinandya yudhiṣṭhiram","gab seine Zustimmung, mit Siegeswünschen, Yudhiṣṭhira beglückwünschend (Perf.Med. + Instr.Pl. + Absol. + Akk.)"]]],["046","bhīmaṃ ca balināṃ śreṣṭhaṃ sāntvayām āsa pārthivaḥ sa cāsya samyaṅ medhāvī pratyapadyata vīryavān","Und den Bhīma, den Besten der Starken, tröstete der Herrscher, und jener, der kraftvolle Weise, erwiderte ihm angemessen.","",[["bhīmaṃ ca balināṃ śreṣṭhaṃ sāntvayām āsa pārthivaḥ","und den Bhīma, den Besten der Starken, tröstete der Herrscher (Akk. + Gen.Pl. + Akk. + Perf.Periphr.Kaus. + Nom.)"],["sa cāsya samyaṅ medhāvī pratyapadyata vīryavān","und jener, der kraftvolle Weise, erwiderte ihm angemessen (Nom. + Gen. + Adv. + Nom. + Impf.Med. + Nom.)"]]],["047","arjunaṃ ca samāśliṣya yamau ca puruṣarṣabhau anujajñe sa kauravyaḥ pariṣvajyābhinandya ca","Und nachdem er Arjuna umarmt hatte, und die beiden Zwillinge, die Stiere unter den Männern, gab jener Kaurava, sie umarmend und beglückwünschend, seine Zustimmung.","",[["arjunaṃ ca samāśliṣya yamau ca puruṣarṣabhau","und nachdem er Arjuna umarmt hatte, und die beiden Zwillinge, die Stiere unter den Männern (Akk. + Absol. + Akk.Du. + Akk.Du.)"],["anujajñe sa kauravyaḥ pariṣvajyābhinandya ca","gab jener Kaurava, sie umarmend und beglückwünschend, seine Zustimmung (Perf.Med. + Nom. + Nom. + Absol. + Absol.)"]]],["048","gāndhāryā cābhyanujñātāḥ kṛtapādābhivandanāḥ jananyā samupāghrātāḥ pariṣvaktāś ca te nṛpam cakruḥ pradakṣiṇaṃ sarve vatsā iva nivāraṇe","Und von Gāndhārī verabschiedet, nachdem sie die Verehrung ihrer Füße vollzogen hatten, von der Mutter beschnuppert und umarmt, umschritten sie alle den König von rechts nach links, wie Kälber bei der Einhegung.","",[["gāndhāryā cābhyanujñātāḥ kṛtapādābhivandanāḥ","und von Gāndhārī verabschiedet, nachdem sie die Verehrung ihrer Füße vollzogen hatten (Instr. + Nom.Pl.Part.Perf.Pass. + Nom.Pl.Bahuvrīhi)"],["jananyā samupāghrātāḥ pariṣvaktāś ca te nṛpam cakruḥ pradakṣiṇaṃ sarve vatsā iva nivāraṇe","von der Mutter beschnuppert und umarmt, umschritten sie alle den König von rechts nach links, wie Kälber bei der Einhegung (Instr. + Nom.Pl.Part.Perf.Pass. + Nom.Pl.Part.Perf.Pass. + Nom.Pl. + Akk. + Perf. + Akk. + Nom.Pl. + Nom.Pl. + Lok.)"]]],["049","punaḥ punar nirīkṣantaḥ prajagmus te pradakṣiṇam tathaiva draupadī sādhvī sarvāḥ kauravayoṣitaḥ","Immer wieder zurückblickend gingen sie im Umschreiten fort, und ebenso die tugendhafte Draupadī und alle Frauen der Kauravas.","",[["punaḥ punar nirīkṣantaḥ prajagmus te pradakṣiṇam","immer wieder zurückblickend gingen sie im Umschreiten fort (Adv. + Nom.Pl.Part. + Perf. + Nom.Pl. + Akk.)"],["tathaiva draupadī sādhvī sarvāḥ kauravayoṣitaḥ","und ebenso die tugendhafte Draupadī und alle Frauen der Kauravas (Adv. + Nom. + Nom. + Nom.Pl. + Nom.Pl.)"]]],["050","nyāyataḥ śvaśure vṛttiṃ prayujya prayayus tataḥ śvaśrūbhyāṃ samanujñātāḥ pariṣvajyābhinanditāḥ saṃdiṣṭāś cetikartavyaṃ prayayur bhartṛbhiḥ saha","Nachdem sie dem Schwiegervater die gebührende Ehrerbietung erwiesen hatten, zogen sie darauf fort; von den beiden Schwiegermüttern verabschiedet, umarmt und beglückwünscht, und über das zu Tuende unterwiesen, zogen sie mit ihren Gatten fort.","",[["nyāyataḥ śvaśure vṛttiṃ prayujya prayayus tataḥ","nachdem sie dem Schwiegervater die gebührende Ehrerbietung erwiesen hatten, zogen sie darauf fort (Adv. + Lok. + Akk. + Absol. + Perf. + Adv.)"],["śvaśrūbhyāṃ samanujñātāḥ pariṣvajyābhinanditāḥ saṃdiṣṭāś cetikartavyaṃ prayayur bhartṛbhiḥ saha","von den beiden Schwiegermüttern verabschiedet, umarmt und beglückwünscht, und über das zu Tuende unterwiesen, zogen sie mit ihren Gatten fort (Instr.Du. + Nom.Pl.Part.Perf.Pass. + Nom.Pl.Part.Perf.Pass. + Nom.Pl.Part.Perf.Pass. + Akk. + Perf. + Instr.Pl.)"]]],["051","tataḥ prajajñe ninadaḥ sūtānāṃ yujyatām iti uṣṭrāṇāṃ krośatāṃ caiva hayānāṃ heṣatām api","Da erhob sich der Lärm der Wagenlenker, die riefen: „Anspannt!“, sowie das Schreien der Kamele und ebenso das Wiehern der Pferde.","",[["tataḥ prajajñe ninadaḥ sūtānāṃ yujyatām iti","da erhob sich der Lärm der Wagenlenker, die riefen: Anspannt! (Adv. + Perf.Med. + Nom. + Gen.Pl. + Imp.Pass. + Indekl.)"],["uṣṭrāṇāṃ krośatāṃ caiva hayānāṃ heṣatām api","sowie das Schreien der Kamele und ebenso das Wiehern der Pferde (Gen.Pl. + Gen.Pl.Part. + Gen.Pl. + Gen.Pl.Part.)"]]],["052","tato yudhiṣṭhiro rājā sadāraḥ sahasainikaḥ nagaraṃ hāstinapuraṃ punar āyāt sabāndhavaḥ","Da kehrte König Yudhiṣṭhira, mit seiner Gattin, mit seinen Kriegern und mit seinen Verwandten, wieder in die Stadt Hāstinapura zurück.","",[["tato yudhiṣṭhiro rājā sadāraḥ sahasainikaḥ","da kehrte König Yudhiṣṭhira, mit seiner Gattin, mit seinen Kriegern (Adv. + Nom. + Nom. + Nom.Bahuvrīhi + Nom.Bahuvrīhi)"],["nagaraṃ hāstinapuraṃ punar āyāt sabāndhavaḥ","in die Stadt Hāstinapura wieder zurück, mit seinen Verwandten (Akk. + Akk. + Adv. + Impf. + Nom.Bahuvrīhi)"]]]]},{"num":45,"title_sa":"","title_de":"Nāradas Bericht: Der Tod Dhṛtarāṣṭras, Gāndhārīs und Kuntīs im Waldbrand","note":"Nārada berichtet Yudhiṣṭhira vom Waldbrand am Gaṅgādvāra, dem Tod der drei Alten und Saṃjayas Rettung. Erster Fall echter SQ-Verschachtelung in dieser Sitzung analog Kap.38: innerhalb von Nāradas langer CQ-Rede sind die Wechselrede zwischen Dhṛtarāṣṭra und Saṃjaya (V023-027) sowie Saṃjayas kurzer Abschiedsspruch (V029) als SQ markiert.","units":[["001","vaiśaṃpāyana uvāca dvivarṣopanivṛtteṣu pāṇḍaveṣu yadṛcchayā devarṣir nārado rājann ājagāma yudhiṣṭhiram","Vaiśaṃpāyana sprach: Als zwei Jahre seit der Rückkehr der Pāṇḍavas vergangen waren, kam der Götterweise Nārada zufällig zu König Yudhiṣṭhira.","",[["vaiśaṃpāyana uvāca dvivarṣopanivṛtteṣu pāṇḍaveṣu yadṛcchayā","Vaiśaṃpāyana sprach: als zwei Jahre seit der Rückkehr der Pāṇḍavas vergangen waren, zufällig (Nom. + Lok.Abs. + Lok.Pl. + Adv.)"],["devarṣir nārado rājann ājagāma yudhiṣṭhiram","kam der Götterweise Nārada, o König, zu Yudhiṣṭhira (Nom. + Nom. + Vok. + Perf. + Akk.)"]]],["002","tam abhyarcya mahābāhuḥ kururājo yudhiṣṭhiraḥ āsīnaṃ pariviśvastaṃ provāca vadatāṃ varaḥ","Nachdem er ihn geehrt hatte, sprach der starkarmige Kuru-König Yudhiṣṭhira, der Beste der Redner, zu dem sitzenden, ganz Vertrauten:","",[["tam abhyarcya mahābāhuḥ kururājo yudhiṣṭhiraḥ","nachdem er ihn geehrt hatte, der starkarmige Kuru-König Yudhiṣṭhira (Akk. + Absol. + Nom. + Nom. + Nom.)"],["āsīnaṃ pariviśvastaṃ provāca vadatāṃ varaḥ","sprach zu dem sitzenden, ganz Vertrauten, der Beste der Redner (Akk. + Akk. + Perf. + Gen.Pl.Part. + Nom.)"]]],["003","cirasya khalu paśyāmi bhagavantam upasthitam kaccit te kuśalaṃ vipra śubhaṃ vā pratyupasthitam","„Seit langem wahrlich sehe ich den Erhabenen anwesend; geht es dir wohl, o Weiser, oder ist dir Heilvolles widerfahren?","",[["cirasya khalu paśyāmi bhagavantam upasthitam","seit langem wahrlich sehe ich den Erhabenen anwesend (Gen. + Adv. + Präs. + Akk. + Akk.Part.)"],["kaccit te kuśalaṃ vipra śubhaṃ vā pratyupasthitam","geht es dir wohl, o Weiser, oder ist dir Heilvolles widerfahren (Interrog. + Dat. + Nom. + Vok. + Nom. + Nom.Part.)"]]],["004","ke deśāḥ paridṛṣṭās te kiṃ ca kāryaṃ karomi te tad brūhi dvijamukhya tvam asmākaṃ ca priyo 'tithiḥ","Welche Länder hast du gesehen, und was für einen Dienst soll ich dir erweisen? Sprich es, Bester der Zweifachgeborenen; du bist uns ein lieber Gast.“","",[["ke deśāḥ paridṛṣṭās te kiṃ ca kāryaṃ karomi te","welche Länder hast du gesehen, und was für einen Dienst soll ich dir erweisen (Nom.Pl. + Nom.Pl.Part.Perf.Pass. + Instr. + Interrog. + Akk. + Präs. + Dat.)"],["tad brūhi dvijamukhya tvam asmākaṃ ca priyo 'tithiḥ","sprich es, Bester der Zweifachgeborenen; du bist uns ein lieber Gast (Akk. + Imp. + Vok. + Nom. + Gen. + Nom. + Nom.)"]]],["005","nārada uvāca ciradṛṣṭo 'si me rājann āgato 'smi tapovanāt paridṛṣṭāni tīrthāni gaṅgā caiva mayā nṛpa","Nārada sprach: „Seit langem habe ich dich nicht gesehen, o König; ich bin aus dem Büßerwald gekommen; besucht habe ich die Pilgerstätten und auch die Gaṅgā, o Herrscher.“","",[["nārada uvāca ciradṛṣṭo 'si me rājann āgato 'smi tapovanāt","Nārada sprach: seit langem habe ich dich nicht gesehen, o König; ich bin aus dem Büßerwald gekommen (Nom. + Nom. + Präs. + Gen. + Vok. + Nom. + Präs. + Abl.)"],["paridṛṣṭāni tīrthāni gaṅgā caiva mayā nṛpa","besucht habe ich die Pilgerstätten und auch die Gaṅgā, o Herrscher (Nom.Pl.Part.Perf.Pass. + Nom.Pl. + Nom. + Instr. + Vok.)"]]],["006","yudhiṣṭhira uvāca vadanti puruṣā me 'dya gaṅgātīranivāsinaḥ dhṛtarāṣṭraṃ mahātmānam āsthitaṃ paramaṃ tapaḥ","Yudhiṣṭhira sprach: „Es sagen mir heute die am Ufer der Gaṅgā wohnenden Leute, dass der großherzige Dhṛtarāṣṭra sich der höchsten Askese hingegeben hat.","",[["yudhiṣṭhira uvāca vadanti puruṣā me 'dya gaṅgātīranivāsinaḥ","Yudhiṣṭhira sprach: es sagen mir heute die am Ufer der Gaṅgā wohnenden Leute (Nom. + Präs. + Nom.Pl. + Dat. + Adv. + Nom.Pl.Bahuvrīhi)"],["dhṛtarāṣṭraṃ mahātmānam āsthitaṃ paramaṃ tapaḥ","dass der großherzige Dhṛtarāṣṭra sich der höchsten Askese hingegeben hat (Akk. + Akk. + Akk.Part.Perf. + Akk. + Akk.)"]]],["007","api dṛṣṭas tvayā tatra kuśalī sa kurūdvahaḥ gāndhārī ca pṛthā caiva sūtaputraś ca saṃjayaḥ","Hast du ihn dort gesehen, wohlauf, jenen Ersten der Kurus, und Gāndhārī und Pṛthā, und auch Saṃjaya, den Sohn des Wagenlenkers?","",[["api dṛṣṭas tvayā tatra kuśalī sa kurūdvahaḥ","hast du ihn dort gesehen, wohlauf, jenen Ersten der Kurus (Partikel + Nom.Part.Perf.Pass. + Instr. + Adv. + Nom. + Nom.)"],["gāndhārī ca pṛthā caiva sūtaputraś ca saṃjayaḥ","und Gāndhārī und Pṛthā, und auch Saṃjaya, den Sohn des Wagenlenkers (Nom. + Nom. + Nom. + Nom.)"]]],["008","kathaṃ ca vartate cādya pitā mama sa pārthivaḥ śrotum icchāmi bhagavan yadi dṛṣṭas tvayā nṛpaḥ","Und wie ergeht es heute meinem Vater, jenem Herrscher? Ich möchte es hören, Erhabener, wenn der König von dir gesehen wurde.“","",[["kathaṃ ca vartate cādya pitā mama sa pārthivaḥ","und wie ergeht es heute meinem Vater, jenem Herrscher (Interrog. + Präs.Med. + Adv. + Nom. + Gen. + Nom. + Nom.)"],["śrotum icchāmi bhagavan yadi dṛṣṭas tvayā nṛpaḥ","ich möchte es hören, Erhabener, wenn der König von dir gesehen wurde (Inf. + Präs. + Vok. + Kond. + Nom.Part.Perf.Pass. + Instr. + Nom.)"]]],["009","nārada uvāca sthirībhūya mahārāja śṛṇu sarvaṃ yathātatham yathā śrutaṃ ca dṛṣṭaṃ ca mayā tasmiṃs tapovane","Nārada sprach: „Fasse dich, großer König, und höre alles der Wahrheit gemäß, wie ich es in jenem Büßerwald gehört und gesehen habe.","",[["nārada uvāca sthirībhūya mahārāja śṛṇu sarvaṃ yathātatham","Nārada sprach: fasse dich, großer König, und höre alles der Wahrheit gemäß (Nom. + Absol. + Vok. + Imp. + Akk. + Adv.)"],["yathā śrutaṃ ca dṛṣṭaṃ ca mayā tasmiṃs tapovane","wie ich es gehört und gesehen habe in jenem Büßerwald (Adv. + Nom.Part.Perf.Pass. + Nom.Part.Perf.Pass. + Instr. + Lok. + Lok.)"]]],["010","vanavāsanivṛtteṣu bhavatsu kurunandana kurukṣetrāt pitā tubhyaṃ gaṅgādvāraṃ yayau nṛpa","Als ihr vom Waldaufenthalt zurückgekehrt wart, Freude der Kurus, ging dein Vater von Kurukṣetra zum Gaṅgādvāra, o König.","",[["vanavāsanivṛtteṣu bhavatsu kurunandana","als ihr vom Waldaufenthalt zurückgekehrt wart, Freude der Kurus (Lok.Pl.Abs. + Lok.Pl. + Vok.)"],["kurukṣetrāt pitā tubhyaṃ gaṅgādvāraṃ yayau nṛpa","ging dein Vater von Kurukṣetra zum Gaṅgādvāra, o König (Abl. + Nom. + Dat. + Akk. + Perf. + Vok.)"]]],["011","gāndhāryā sahito dhīmān vadhvā kuntyā samanvitaḥ saṃjayena ca sūtena sāgnihotraḥ sayājakaḥ","Der Weise, begleitet von Gāndhārī, vereint mit seiner Schwiegertochter Kuntī, und mit dem Wagenlenker Saṃjaya, mit dem Opferfeuer und mit den Opferpriestern,","",[["gāndhāryā sahito dhīmān vadhvā kuntyā samanvitaḥ","der Weise, begleitet von Gāndhārī, vereint mit seiner Schwiegertochter Kuntī (Instr. + Nom.Part. + Nom. + Instr. + Instr. + Nom.Part.)"],["saṃjayena ca sūtena sāgnihotraḥ sayājakaḥ","und mit dem Wagenlenker Saṃjaya, mit dem Opferfeuer und mit den Opferpriestern (Instr. + Instr. + Nom.Bahuvrīhi + Nom.Bahuvrīhi)"]]],["012","ātasthe sa tapas tīvraṃ pitā tava tapodhanaḥ vīṭāṃ mukhe samādhāya vāyubhakṣo 'bhavan muniḥ","unterzog sich dein Vater, reich an Askese, strenger Buße; er hielt sich etwas in den Mund [?] und wurde ein nur von Luft lebender Weiser.","[?] \"vīṭāṃ mukhe samādhāya\" (wörtl. \"einen Bissen/Pfropf im Mund haltend\") - genaue Bedeutung unsicher, evtl. ein Schweigegelübde-Utensil; sinngemäß wiedergegeben.",[["ātasthe sa tapas tīvraṃ pitā tava tapodhanaḥ","unterzog sich dein Vater, reich an Askese, strenger Buße (Perf.Med. + Nom. + Akk. + Akk. + Nom. + Gen. + Nom.Bahuvrīhi)"],["vīṭāṃ mukhe samādhāya vāyubhakṣo 'bhavan muniḥ","er hielt sich etwas in den Mund und wurde ein nur von Luft lebender Weiser (Akk. + Lok. + Absol. + Nom.Bahuvrīhi + Impf. + Nom.)"]]],["013","vane sa munibhiḥ sarvaiḥ pūjyamāno mahātapāḥ tvagasthimātraśeṣaḥ sa ṣaṇmāsān abhavan nṛpaḥ","Im Wald, von allen Weisen verehrt, der von großer Askese, wurde jener König binnen sechs Monaten zu einem, der nur noch aus Haut und Knochen bestand.","",[["vane sa munibhiḥ sarvaiḥ pūjyamāno mahātapāḥ","im Wald, von allen Weisen verehrt, der von großer Askese (Lok. + Nom. + Instr.Pl. + Instr.Pl. + Nom.Part.Pass. + Nom.Bahuvrīhi)"],["tvagasthimātraśeṣaḥ sa ṣaṇmāsān abhavan nṛpaḥ","wurde jener König binnen sechs Monaten zu einem, der nur noch aus Haut und Knochen bestand (Nom.Bahuvrīhi + Nom. + Akk.Pl. + Impf. + Nom.)"]]],["014","gāndhārī tu jalāhārā kuntī māsopavāsinī saṃjayaḥ ṣaṣṭhabhaktena vartayām āsa bhārata","Gāndhārī aber lebte nur von Wasser, Kuntī fastete einen Monat lang, und Saṃjaya lebte, indem er nur jede sechste Mahlzeit einnahm, o Bhārata.","",[["gāndhārī tu jalāhārā kuntī māsopavāsinī","Gāndhārī aber lebte nur von Wasser, Kuntī fastete einen Monat lang (Nom. + Nom.Bahuvrīhi + Nom. + Nom.Bahuvrīhi)"],["saṃjayaḥ ṣaṣṭhabhaktena vartayām āsa bhārata","und Saṃjaya lebte, indem er nur jede sechste Mahlzeit einnahm, o Bhārata (Nom. + Instr. + Perf.Periphr. + Vok.)"]]],["015","agnīṃs tu yājakās tatra juhuvur vidhivat prabho dṛśyato 'dṛśyataś caiva vane tasmin nṛpasya ha","Die Opferpriester aber brachten dort die Feueropfer vorschriftsgemäß dar, o Herr, sichtbar und unsichtbar, in jenem Wald, für den König.","",[["agnīṃs tu yājakās tatra juhuvur vidhivat prabho","die Opferpriester aber brachten dort die Feueropfer vorschriftsgemäß dar, o Herr (Akk.Pl. + Nom.Pl. + Adv. + Perf. + Adv. + Vok.)"],["dṛśyato 'dṛśyataś caiva vane tasmin nṛpasya ha","sichtbar und unsichtbar, in jenem Wald, für den König (Adv. + Adv. + Lok. + Lok. + Gen.)"]]],["016","aniketo 'tha rājā sa babhūva vanagocaraḥ te cāpi sahite devyau saṃjayaś ca tam anvayuḥ","Ohne festen Wohnsitz wurde jener König darauf, im Wald umherziehend; und die beiden Fürstinnen zusammen, und Saṃjaya, folgten ihm.","",[["aniketo 'tha rājā sa babhūva vanagocaraḥ","ohne festen Wohnsitz wurde jener König darauf, im Wald umherziehend (Nom.Bahuvrīhi + Adv. + Nom. + Nom. + Perf. + Nom.Bahuvrīhi)"],["te cāpi sahite devyau saṃjayaś ca tam anvayuḥ","und die beiden Fürstinnen zusammen, und Saṃjaya, folgten ihm (Nom.Du. + Nom.Du. + Nom. + Akk. + Perf.)"]]],["017","saṃjayo nṛpater netā sameṣu viṣameṣu ca gāndhāryās tu pṛthā rājaṃś cakṣur āsīd aninditā","Saṃjaya war der Führer des Königs auf ebenem und unebenem Gelände, doch für Gāndhārī war die untadelige Pṛthā das Auge, o König.","",[["saṃjayo nṛpater netā sameṣu viṣameṣu ca","Saṃjaya war der Führer des Königs auf ebenem und unebenem Gelände (Nom. + Gen. + Nom. + Lok.Pl. + Lok.Pl.)"],["gāndhāryās tu pṛthā rājaṃś cakṣur āsīd aninditā","doch für Gāndhārī war die untadelige Pṛthā das Auge, o König (Gen. + Nom. + Vok. + Nom. + Impf. + Nom.)"]]],["018","tataḥ kadā cid gaṅgāyāḥ kacche sa nṛpasattamaḥ gaṅgāyām āpluto dhīmān āśramābhimukho 'bhavat","Da wandte sich einst jener Beste der Könige, am Ufer der Gaṅgā, nachdem er in der Gaṅgā gebadet hatte, der Weise, dem Āśrama zu.","",[["tataḥ kadā cid gaṅgāyāḥ kacche sa nṛpasattamaḥ","da einst, am Ufer der Gaṅgā, jener Beste der Könige (Adv. + Adv. + Gen. + Lok. + Nom. + Nom.)"],["gaṅgāyām āpluto dhīmān āśramābhimukho 'bhavat","nachdem er in der Gaṅgā gebadet hatte, der Weise, wandte sich dem Āśrama zu (Lok. + Nom.Part.Perf.Pass. + Nom. + Nom.Bahuvrīhi + Impf.)"]]],["019","atha vāyuḥ samudbhūto dāvāgnir abhavan mahān dadāha tad vanaṃ sarvaṃ parigṛhya samantataḥ","Da erhob sich der Wind, und ein großes Waldfeuer entstand; es erfasste jenen ganzen Wald von allen Seiten und verbrannte ihn.","",[["atha vāyuḥ samudbhūto dāvāgnir abhavan mahān","da erhob sich der Wind, und ein großes Waldfeuer entstand (Adv. + Nom. + Nom.Part.Perf. + Nom. + Impf. + Nom.)"],["dadāha tad vanaṃ sarvaṃ parigṛhya samantataḥ","es erfasste jenen ganzen Wald von allen Seiten und verbrannte ihn (Perf. + Akk. + Akk. + Akk. + Absol. + Adv.)"]]],["020","dahyatsu mṛgayūtheṣu dvijihveṣu samantataḥ varāhāṇāṃ ca yūtheṣu saṃśrayatsu jalāśayān","Während die Herden der Wildtiere verbrannten, und die Schlangen ringsum, und die Herden der Wildschweine, die zu den Wasserstellen flohen,","",[["dahyatsu mṛgayūtheṣu dvijihveṣu samantataḥ","während die Herden der Wildtiere verbrannten, und die Schlangen ringsum (Lok.Pl.Abs.Part. + Lok.Pl. + Lok.Pl. + Adv.)"],["varāhāṇāṃ ca yūtheṣu saṃśrayatsu jalāśayān","und die Herden der Wildschweine, die zu den Wasserstellen flohen (Gen.Pl. + Lok.Pl. + Lok.Pl.Abs.Part. + Akk.Pl.)"]]],["021","samāviddhe vane tasmin prāpte vyasana uttame nirāhāratayā rājā mandaprāṇaviceṣṭitaḥ asamartho 'pasaraṇe sukṛśau mātarau ca te","während jener Wald ringsum von Flammen erfasst war und die höchste Notlage eingetreten war, war der König, durch das Fasten von schwacher Lebenskraft und schwachem Bewegen, unfähig zu entkommen, und ebenso deine beiden sehr abgemagerten Mütter.","",[["samāviddhe vane tasmin prāpte vyasana uttame nirāhāratayā","während jener Wald ringsum von Flammen erfasst war und die höchste Notlage eingetreten war, durch das Fasten (Lok.Abs. + Lok. + Lok. + Lok.Abs. + Lok. + Lok. + Instr.)"],["rājā mandaprāṇaviceṣṭitaḥ asamartho 'pasaraṇe sukṛśau mātarau ca te","war der König von schwacher Lebenskraft und schwachem Bewegen, unfähig zu entkommen, und ebenso deine beiden sehr abgemagerten Mütter (Nom. + Nom.Bahuvrīhi + Nom. + Lok. + Nom.Du.Bahuvrīhi + Nom.Du. + Gen.)"]]],["022","tataḥ sa nṛpatir dṛṣṭvā vahnim āyāntam antikāt idam āha tataḥ sūtaṃ saṃjayaṃ pṛthivīpate","Da, als jener König das Feuer von nahe herannahen sah, sprach er darauf dies zum Wagenlenker Saṃjaya, o Herr der Erde:","",[["tataḥ sa nṛpatir dṛṣṭvā vahnim āyāntam antikāt","da, als jener König das Feuer von nahe herannahen sah (Adv. + Nom. + Nom. + Absol. + Akk. + Akk.Part. + Abl.)"],["idam āha tataḥ sūtaṃ saṃjayaṃ pṛthivīpate","sprach er darauf dies zum Wagenlenker Saṃjaya, o Herr der Erde (Akk. + Perf. + Adv. + Akk. + Akk. + Vok.)"]]],["023","gaccha saṃjaya yatrāgnir na tvāṃ dahati karhi cit vayam atrāgninā yuktā gamiṣyāmaḥ parāṃ gatim","‚Gehe, Saṃjaya, dorthin, wo das Feuer dich niemals verbrennen wird; wir werden hier, mit diesem Feuer vereint, zum höchsten Ziel gehen.‘","",[["gaccha saṃjaya yatrāgnir na tvāṃ dahati karhi cit","gehe, Saṃjaya, dorthin, wo das Feuer dich niemals verbrennen wird (Imp. + Vok. + Rel.Adv. + Neg. + Akk. + Präs. + Neg.Adv.)"],["vayam atrāgninā yuktā gamiṣyāmaḥ parāṃ gatim","wir werden hier, mit diesem Feuer vereint, zum höchsten Ziel gehen (Nom. + Adv. + Instr. + Nom.Part. + Fut. + Akk. + Akk.)"]]],["024","tam uvāca kilodvignaḥ saṃjayo vadatāṃ varaḥ rājan mṛtyur aniṣṭo 'yaṃ bhavitā te vṛthāgninā","Zu ihm sprach, betrübt, wie es heißt, Saṃjaya, der Beste der Redner: ‚O König, dieser unerwünschte Tod durch ein nutzloses Feuer wird dir widerfahren,","",[["tam uvāca kilodvignaḥ saṃjayo vadatāṃ varaḥ","zu ihm sprach, betrübt, wie es heißt, Saṃjaya, der Beste der Redner (Akk. + Impf. + Nom.Bahuvrīhi + Nom. + Gen.Pl.Part. + Nom.)"],["rājan mṛtyur aniṣṭo 'yaṃ bhavitā te vṛthāgninā","o König, dieser unerwünschte Tod durch ein nutzloses Feuer wird dir widerfahren (Vok. + Nom. + Nom. + Nom. + Fut. + Dat. + Instr.)"]]],["025","na copāyaṃ prapaśyāmi mokṣaṇe jātavedasaḥ yad atrānantaraṃ kāryaṃ tad bhavān vaktum arhati","und ich sehe kein Mittel, dem Feuer zu entrinnen; was hier als Nächstes zu tun ist, das sollst du sagen.‘","",[["na copāyaṃ prapaśyāmi mokṣaṇe jātavedasaḥ","und ich sehe kein Mittel, dem Feuer zu entrinnen (Neg. + Akk. + Präs. + Lok. + Gen.)"],["yad atrānantaraṃ kāryaṃ tad bhavān vaktum arhati","was hier als Nächstes zu tun ist, das sollst du sagen (Nom. + Adv. + Nom.Part.Fut.Pass. + Nom. + Nom. + Inf. + Präs.)"]]],["026","ity uktaḥ saṃjayenedaṃ punar āha sa pārthivaḥ naiṣa mṛtyur aniṣṭo no niḥsṛtānāṃ gṛhāt svayam","So von Saṃjaya angesprochen, sprach jener Herrscher wieder dies: ‚Dieser Tod ist für uns, die wir aus eigenem Willen das Haus verlassen haben, nicht unerwünscht;","",[["ity uktaḥ saṃjayenedaṃ punar āha sa pārthivaḥ","so von Saṃjaya angesprochen, sprach jener Herrscher wieder dies (Nom.Part.Perf.Pass. + Instr. + Akk. + Adv. + Perf. + Nom. + Nom.)"],["naiṣa mṛtyur aniṣṭo no niḥsṛtānāṃ gṛhāt svayam","dieser Tod ist für uns, die wir aus eigenem Willen das Haus verlassen haben, nicht unerwünscht (Neg. + Nom. + Nom. + Nom. + Gen.Pl. + Gen.Pl.Part.Perf. + Abl. + Adv.)"]]],["027","jalam agnis tathā vāyur atha vāpi vikarśanam tāpasānāṃ praśasyante gaccha saṃjaya māciram","Wasser, Feuer, ebenso Wind, oder auch die Auszehrung - diese werden für Asketen gepriesen; gehe, Saṃjaya, ohne Zögern.‘","",[["jalam agnis tathā vāyur atha vāpi vikarśanam","Wasser, Feuer, ebenso Wind, oder auch die Auszehrung (Nom. + Nom. + Adv. + Nom. + Adv. + Nom.)"],["tāpasānāṃ praśasyante gaccha saṃjaya māciram","diese werden für Asketen gepriesen; gehe, Saṃjaya, ohne Zögern (Gen.Pl. + Präs.Pass. + Imp. + Vok. + Neg.Adv.)"]]],["028","ity uktvā saṃjayaṃ rājā samādhāya manas tadā prāṅmukhaḥ saha gāndhāryā kuntyā copāviśat tadā","Nachdem er dies zu Saṃjaya gesprochen hatte, setzte sich der König, sein Herz gesammelt, darauf, nach Osten gewandt, zusammen mit Gāndhārī und Kuntī nieder.","",[["ity uktvā saṃjayaṃ rājā samādhāya manas tadā","nachdem er dies zu Saṃjaya gesprochen hatte, der König, sein Herz gesammelt, darauf (Absol. + Akk. + Nom. + Absol. + Akk. + Adv.)"],["prāṅmukhaḥ saha gāndhāryā kuntyā copāviśat tadā","nach Osten gewandt, zusammen mit Gāndhārī und Kuntī setzte er sich nieder (Nom.Bahuvrīhi + Instr. + Instr. + Impf. + Adv.)"]]],["029","saṃjayas taṃ tathā dṛṣṭvā pradakṣiṇam athākarot uvāca cainaṃ medhāvī yuṅkṣvātmānam iti prabho","Nachdem Saṃjaya ihn so gesehen hatte, umschritt er ihn darauf von rechts nach links, und der Kluge sprach zu ihm: ‚Sammle dich!‘ - so, o Herr.","",[["saṃjayas taṃ tathā dṛṣṭvā pradakṣiṇam athākarot","nachdem Saṃjaya ihn so gesehen hatte, umschritt er ihn darauf von rechts nach links (Nom. + Akk. + Adv. + Absol. + Akk. + Impf.)"],["uvāca cainaṃ medhāvī yuṅkṣvātmānam iti prabho","und der Kluge sprach zu ihm: Sammle dich! - so, o Herr (Impf. + Akk. + Nom. + Imp. + Akk. + Indekl. + Vok.)"]]],["030","ṛṣiputro manīṣī sa rājā cakre 'sya tad vacaḥ saṃnirudhyendriyagrāmam āsīt kāṣṭhopamas tadā","Der Sohn eines Ṛṣi [Anm.: Dhṛtarāṣṭra, durch Niyoga von Vyāsa gezeugt], der bedachte König, befolgte jenes Wort; nachdem er die Schar seiner Sinne zurückgehalten hatte, saß er darauf einem Holzscheit gleich.","",[["ṛṣiputro manīṣī sa rājā cakre 'sya tad vacaḥ","der Sohn eines Ṛṣi, der bedachte König, befolgte jenes Wort (Nom. + Nom. + Nom. + Nom. + Perf.Med. + Gen. + Akk. + Akk.)"],["saṃnirudhyendriyagrāmam āsīt kāṣṭhopamas tadā","nachdem er die Schar seiner Sinne zurückgehalten hatte, saß er darauf einem Holzscheit gleich (Absol. + Akk. + Impf. + Nom. + Adv.)"]]],["031","gāndhārī ca mahābhāgā jananī ca pṛthā tava dāvāgninā samāyukte sa ca rājā pitā tava","Und die hochgesegnete Gāndhārī, und deine Mutter Pṛthā, wurden vom Waldbrand erfasst, und ebenso jener König, dein Vater.","",[["gāndhārī ca mahābhāgā jananī ca pṛthā tava","und die hochgesegnete Gāndhārī, und deine Mutter Pṛthā (Nom. + Nom. + Nom. + Nom. + Gen.)"],["dāvāgninā samāyukte sa ca rājā pitā tava","wurden vom Waldbrand erfasst, und ebenso jener König, dein Vater (Instr. + Nom.Du.Part.Perf.Pass. + Nom. + Nom. + Nom. + Gen.)"]]],["032","saṃjayas tu mahāmātras tasmād dāvād amucyata gaṅgākūle mayā dṛṣṭas tāpasaiḥ parivāritaḥ","Saṃjaya aber, der große Minister, entkam jenem Waldbrand; am Ufer der Gaṅgā wurde er von mir gesehen, von Asketen umgeben.","",[["saṃjayas tu mahāmātras tasmād dāvād amucyata","Saṃjaya aber, der große Minister, entkam jenem Waldbrand (Nom. + Nom. + Abl. + Abl. + Impf.Pass.)"],["gaṅgākūle mayā dṛṣṭas tāpasaiḥ parivāritaḥ","am Ufer der Gaṅgā wurde er von mir gesehen, von Asketen umgeben (Lok. + Instr. + Nom.Part.Perf.Pass. + Instr.Pl. + Nom.Part.Perf.Pass.)"]]],["033","sa tān āmantrya tejasvī nivedyaitac ca sarvaśaḥ prayayau saṃjayaḥ sūto himavantaṃ mahīdharam","Nachdem er von ihnen Abschied genommen und dies alles vollständig berichtet hatte, zog jener glanzvolle Saṃjaya, der Wagenlenker, zum Berg Himavat.","",[["sa tān āmantrya tejasvī nivedyaitac ca sarvaśaḥ","nachdem er von ihnen Abschied genommen und dies alles vollständig berichtet hatte, jener glanzvolle (Nom. + Akk.Pl. + Absol. + Nom. + Absol. + Akk. + Adv.)"],["prayayau saṃjayaḥ sūto himavantaṃ mahīdharam","zog Saṃjaya, der Wagenlenker, zum Berg Himavat (Perf. + Nom. + Nom. + Akk. + Akk.)"]]],["034","evaṃ sa nidhanaṃ prāptaḥ kururājo mahāmanāḥ gāndhārī ca pṛthā caiva jananyau te narādhipa","So fand jener großherzige Kuru-König sein Ende, und ebenso Gāndhārī und Pṛthā, deine beiden Mütter, o Herrscher der Menschen.","",[["evaṃ sa nidhanaṃ prāptaḥ kururājo mahāmanāḥ","so fand jener großherzige Kuru-König sein Ende (Adv. + Nom. + Akk. + Nom.Part.Perf.Pass. + Nom. + Nom.Bahuvrīhi)"],["gāndhārī ca pṛthā caiva jananyau te narādhipa","und ebenso Gāndhārī und Pṛthā, deine beiden Mütter, o Herrscher der Menschen (Nom. + Nom. + Nom.Du. + Gen. + Vok.)"]]],["035","yadṛcchayānuvrajatā mayā rājñaḥ kalevaram tayoś ca devyor ubhayor dṛṣṭāni bharatarṣabha","Von mir, der ich zufällig folgte, wurden der Leib des Königs und der beiden Fürstinnen gesehen, o Stier der Bharatas.","",[["yadṛcchayānuvrajatā mayā rājñaḥ kalevaram","von mir, der ich zufällig folgte, der Leib des Königs (Instr. + Instr.Part. + Instr. + Gen. + Nom.)"],["tayoś ca devyor ubhayor dṛṣṭāni bharatarṣabha","und der beiden Fürstinnen, beider, wurden gesehen, o Stier der Bharatas (Gen.Du. + Gen.Du. + Gen.Du. + Nom.Pl.Part.Perf.Pass. + Vok.)"]]],["036","tatas tapovane tasmin samājagmus tapodhanāḥ śrutvā rājñas tathā niṣṭhāṃ na tv aśocan gatiṃ ca te","Da kamen in jenem Büßerwald die Asketen zusammen, als sie vom Ende des Königs erfuhren, doch sie trauerten nicht über ihr Geschick.","",[["tatas tapovane tasmin samājagmus tapodhanāḥ","da kamen in jenem Büßerwald die Asketen zusammen (Adv. + Lok. + Lok. + Perf. + Nom.Pl.Bahuvrīhi)"],["śrutvā rājñas tathā niṣṭhāṃ na tv aśocan gatiṃ ca te","als sie vom Ende des Königs erfuhren, doch sie trauerten nicht über ihr Geschick (Absol. + Gen. + Adv. + Akk. + Neg. + Impf. + Akk. + Nom.Pl.)"]]],["037","tatrāśrauṣam ahaṃ sarvam etat puruṣasattama yathā ca nṛpatir dagdho devyau te ceti pāṇḍava","Dort vernahm ich dies alles, Bester der Menschen, wie der König verbrannt wurde, und deine beiden Fürstinnen ebenso, o Pāṇḍava.","",[["tatrāśrauṣam ahaṃ sarvam etat puruṣasattama","dort vernahm ich dies alles, Bester der Menschen (Adv. + Aor. + Nom. + Akk. + Akk. + Vok.)"],["yathā ca nṛpatir dagdho devyau te ceti pāṇḍava","wie der König verbrannt wurde, und deine beiden Fürstinnen ebenso, o Pāṇḍava (Adv. + Nom. + Nom.Part.Perf.Pass. + Nom.Du. + Nom.Du. + Indekl. + Vok.)"]]],["038","na śocitavyaṃ rājendra svantaḥ sa pṛthivīpatiḥ prāptavān agnisaṃyogaṃ gāndhārī jananī ca te","Nicht sollst du trauern, Indra der Könige; jener Herrscher der Erde fand sein eigenes Ende, erlangte die Vereinigung mit dem Feuer, und ebenso deine Mutter Gāndhārī.“","",[["na śocitavyaṃ rājendra svantaḥ sa pṛthivīpatiḥ","nicht sollst du trauern, Indra der Könige; jener Herrscher der Erde fand sein eigenes Ende (Neg. + Nom.Part.Fut.Pass. + Vok. + Nom.Bahuvrīhi + Nom. + Nom.)"],["prāptavān agnisaṃyogaṃ gāndhārī jananī ca te","erlangte die Vereinigung mit dem Feuer, und ebenso deine Mutter Gāndhārī (Nom.Part.Perf.Akt. + Akk. + Nom. + Nom. + Gen.)"]]],["039","vaiśaṃpāyana uvāca etac chrutvā tu sarveṣāṃ pāṇḍavānāṃ mahātmanām niryāṇaṃ dhṛtarāṣṭrasya śokaḥ samabhavan mahān","Vaiśaṃpāyana sprach: Als sie dies vernommen hatten, entstand bei allen großherzigen Pāṇḍavas großer Kummer über Dhṛtarāṣṭras Hingang.","",[["vaiśaṃpāyana uvāca etac chrutvā tu sarveṣāṃ pāṇḍavānāṃ mahātmanām","Vaiśaṃpāyana sprach: als sie dies vernommen hatten, bei allen großherzigen Pāṇḍavas (Nom. + Akk. + Absol. + Gen.Pl. + Gen.Pl. + Gen.Pl.)"],["niryāṇaṃ dhṛtarāṣṭrasya śokaḥ samabhavan mahān","entstand großer Kummer über Dhṛtarāṣṭras Hingang (Akk. + Gen. + Nom. + Impf. + Nom.)"]]],["040","antaḥpurāṇāṃ ca tadā mahān ārtasvaro 'bhavat paurāṇāṃ ca mahārāja śrutvā rājñas tadā gatim","Und da erhob sich in den Frauengemächern ein großer Klageschrei, und ebenso bei den Bürgern, o großer König, als sie vom Hingang des Königs erfuhren.","",[["antaḥpurāṇāṃ ca tadā mahān ārtasvaro 'bhavat","und da erhob sich in den Frauengemächern ein großer Klageschrei (Gen.Pl. + Adv. + Nom. + Nom.Bahuvrīhi + Impf.)"],["paurāṇāṃ ca mahārāja śrutvā rājñas tadā gatim","und ebenso bei den Bürgern, o großer König, als sie vom Hingang des Königs erfuhren (Gen.Pl. + Vok. + Absol. + Gen. + Adv. + Akk.)"]]],["041","aho dhig iti rājā tu vikruśya bhṛśaduḥkhitaḥ ūrdhvabāhuḥ smaran mātuḥ praruroda yudhiṣṭhiraḥ bhīmasenapurogāś ca bhrātaraḥ sarva eva te","„Ach, wehe!“ - so ausrufend, heftig bekümmert, mit erhobenen Armen, an seine Mutter denkend, weinte Yudhiṣṭhira laut, und ebenso alle seine Brüder mit Bhīmasena an der Spitze.","",[["aho dhig iti rājā tu vikruśya bhṛśaduḥkhitaḥ","Ach, wehe! - so ausrufend, heftig bekümmert, der König (Interj. + Interj. + Indekl. + Nom. + Absol. + Nom.Bahuvrīhi)"],["ūrdhvabāhuḥ smaran mātuḥ praruroda yudhiṣṭhiraḥ bhīmasenapurogāś ca bhrātaraḥ sarva eva te","mit erhobenen Armen, an seine Mutter denkend, weinte Yudhiṣṭhira laut, und ebenso alle seine Brüder mit Bhīmasena an der Spitze (Nom.Bahuvrīhi + Nom.Part. + Gen. + Perf. + Nom. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.)"]]],["042","antaḥpureṣu ca tadā sumahān ruditasvanaḥ prādurāsīn mahārāja pṛthāṃ śrutvā tathāgatām","Und in den Frauengemächern erhob sich da ein gewaltiger Weinlaut, o großer König, als man von Pṛthās Geschick auf solche Weise erfuhr.","",[["antaḥpureṣu ca tadā sumahān ruditasvanaḥ prādurāsīn mahārāja","und in den Frauengemächern erhob sich da ein gewaltiger Weinlaut, o großer König (Lok.Pl. + Adv. + Nom. + Nom.Bahuvrīhi + Perf. + Vok.)"],["pṛthāṃ śrutvā tathāgatām","als man von Pṛthās Geschick auf solche Weise erfuhr (Akk. + Absol. + Akk.Part.)"]]],["043","taṃ ca vṛddhaṃ tathā dagdhaṃ hataputraṃ narādhipam anvaśocanta te sarve gāndhārīṃ ca tapasvinīm","Und jenen Alten, so verbrannt, den Herrscher der Menschen, dessen Söhne erschlagen waren, betrauerten sie alle, und ebenso die asketische Gāndhārī.","",[["taṃ ca vṛddhaṃ tathā dagdhaṃ hataputraṃ narādhipam","und jenen Alten, so verbrannt, den Herrscher der Menschen, dessen Söhne erschlagen waren (Akk. + Akk. + Adv. + Akk.Part.Perf.Pass. + Akk.Bahuvrīhi + Akk.)"],["anvaśocanta te sarve gāndhārīṃ ca tapasvinīm","betrauerten sie alle, und ebenso die asketische Gāndhārī (Impf.Med. + Nom.Pl. + Nom.Pl. + Akk. + Akk.)"]]],["044","tasminn uparate śabde muhūrtād iva bhārata nigṛhya bāṣpaṃ dhairyeṇa dharmarājo 'bravīd idam","Als jener Laut nach etwa einem Augenblick verstummt war, o Bhārata, unterdrückte der Dharma-König mit Standhaftigkeit seine Tränen und sprach dies:","",[["tasminn uparate śabde muhūrtād iva bhārata","als jener Laut nach etwa einem Augenblick verstummt war, o Bhārata (Lok.Abs. + Lok. + Abl. + Adv. + Vok.)"],["nigṛhya bāṣpaṃ dhairyeṇa dharmarājo 'bravīd idam","unterdrückte der Dharma-König mit Standhaftigkeit seine Tränen und sprach dies (Absol. + Akk. + Instr. + Nom. + Impf. + Akk.)"]]]]},{"num":46,"title_sa":"","title_de":"Yudhiṣṭhiras Klage","note":"Yudhiṣṭhira klagt über den Tod Dhṛtarāṣṭras, Gāndhārīs und vor allem Kuntīs; erinnert sich an Kuntīs verzweifelte Rufe im Feuer. Zweiter SQ-Verschachtelungsfall (V016-017: Kuntīs eingebettete Rufe als SQ innerhalb von Yudhiṣṭhiras CQ-Rede).","units":[["001","yudhiṣṭhira uvāca tathā mahātmanas tasya tapasy ugre ca vartataḥ anāthasyeva nidhanaṃ tiṣṭhatsv asmāsu bandhuṣu","Yudhiṣṭhira sprach: „So war der Tod jenes Großherzigen, der sich in strenger Askese befand, wie der eines Beschützerlosen, während wir, seine Verwandten, doch am Leben waren.","",[["yudhiṣṭhira uvāca tathā mahātmanas tasya tapasy ugre ca vartataḥ","Yudhiṣṭhira sprach: so war jener Großherzige, der sich in strenger Askese befand (Nom. + Adv. + Gen. + Gen. + Lok. + Gen.Part.)"],["anāthasyeva nidhanaṃ tiṣṭhatsv asmāsu bandhuṣu","der Tod wie der eines Beschützerlosen, während wir, seine Verwandten, doch am Leben waren (Gen. + Nom. + Lok.Pl.Part. + Lok.Pl.)"]]],["002","durvijñeyā hi gatayaḥ puruṣāṇāṃ matā mama yatra vaicitravīryo 'sau dagdha evaṃ davāgninā","Denn schwer zu ergründen sind, wie ich meine, die Wege der Menschen, da jener Sohn des Vicitravīrya so vom Waldbrand verbrannt wurde.","",[["durvijñeyā hi gatayaḥ puruṣāṇāṃ matā mama","denn schwer zu ergründen sind, wie ich meine, die Wege der Menschen (Nom.Pl.Bahuvrīhi + Nom.Pl. + Gen.Pl. + Nom. + Gen.)"],["yatra vaicitravīryo 'sau dagdha evaṃ davāgninā","da jener Sohn des Vicitravīrya so vom Waldbrand verbrannt wurde (Rel.Adv. + Nom. + Nom. + Nom.Part.Perf.Pass. + Adv. + Instr.)"]]],["003","yasya putraśataṃ śrīmad abhavad bāhuśālinaḥ nāgāyutabalo rājā sa dagdho hi davāgninā","Er, dessen hundert glanzvolle Söhne, an Kraft der Arme herrlich, ihm gehörten, jener König von der Kraft zehntausend Elefanten - er wurde vom Waldbrand verbrannt.","",[["yasya putraśataṃ śrīmad abhavad bāhuśālinaḥ","dessen hundert glanzvolle Söhne, an Kraft der Arme herrlich, ihm gehörten (Gen. + Nom. + Nom. + Impf. + Gen.)"],["nāgā
