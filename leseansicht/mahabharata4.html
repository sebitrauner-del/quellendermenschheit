vataka","category":"Person","definition":"Kauravischer Krieger aus dem Volk der Bhojas, mit dem Beinamen 'Elefantenbanner' (kuñjaraketana); in Kap.47 von Abhimanyu zusammen mit dem Māgadha-König Jayatsena erschlagen."},{"term":"Mārīca","category":"Gottheit","definition":"„Sohn des Marīci“; Beiname Kaśyapas."},{"term":"Mātali","category":"Person","definition":"Wagenlenker Indras; Gegenstand einer Nebenerzählung über seine Brautwerbung für seine Tochter."},{"term":"Mātariśvan","category":"Sonstiges","definition":"Vedischer Beiname des Windgottes Vāyu; in Adh.110 als Vergleich für Pāṇḍus asketische Ungebundenheit verwendet."},{"term":"Māṇibhadra","desc":"Heerführer bzw. hoher Diener Kuberas unter den Yakṣas (auch als Māṇicara genannt); wird von zahllosen Gandharvas, Kiṃpuruṣas und Yakṣas verehrt."},{"term":"Māṇḍavya","category":"Person","definition":"Auch Aṇī-Māṇḍavya (‚Māṇḍavya mit dem Splitter') genannt; schweigender Asket, der fälschlich mit Räubern gepfählt wird, die Pfählung durch seine Askese übersteht und den Gott Dharma zur Rede stellt, weil dieser ihn für eine geringfügige Kindheitstat derart hart bestraft hatte. Verflucht Dharma daraufhin zur Geburt als Vidura und legt die Vierzehn-Jahre-Grenze für karmische Haftung fest (Adh.101)."},{"term":"Mūka","category":"Dämon","note":"Ein Sohn der Diti (Daitya), der in Ebergestalt Arjuna angreift und von Arjuna und dem als Kirāta verkleideten Śiva gleichzeitig getroffen wird - Auslöser des Kirātārjunīya-Kampfes."},{"term":"Mṛtyu","category":"Gottheit","definition":"Der personifizierte Tod, Sohn des Adharma und der Nirṛti."},{"term":"Nagnajit","category":"Person","definition":"Schüler Prahrādas, in Verbindung mit Subala genannt; Verbindung zu Śakunis Abstammung, im Text nicht ganz eindeutig."},{"term":"Nahuṣa","category":"Person","definition":"Sohn des Āyu, mächtiger König, der zeitweise selbst Indras Amt übernahm; später wegen Hochmuts (Missbrauch der Ṛṣis als Sänftenträger) verflucht. Vater Yayātis und seiner Brüder."},{"term":"Naimiṣa","category":"Ort","definition":"Heiliger Wald (Naimiṣāraṇya), traditioneller Ort vedischer Opferrituale und Rahmenschauplatz vieler Erzählungen."},{"term":"Naimiṣāraṇya","category":"Ort","definition":"Der „Naimiṣa-Wald“, traditioneller Schauplatz zahlreicher Rahmenerzählungen der Sanskrit-Literatur, u. a. hier des zwölfjährigen Opfers Śaunakas."},{"term":"Naiṣadha","category":"Beiname","note":"Beiname Nalas als Herrscher von Niṣadha."},{"term":"Nakula","category":"Person","definition":"Vierter der fünf Pāṇḍavas, Zwillingssohn (mit Sahadeva) der Mādrī und der Aśvin-Zwillinge; unterwirft im Weltunterwerfungszug die westliche Richtung. Nach Adhyāya 61 ein Anteil eines der beiden Aśvins (Aṃśāvataraṇa). In Kap.144 besiegt er im Duell Śakuni: Er wird zunächst verwundet und sinkt bewusstlos zusammen, erholt sich dann und schlägt Śakuni Bogen und Banner ab, sodass dieser ohnmächtig zusammensinkt und vom Schlachtfeld getragen wird."},{"term":"Nakula / Sahadeva","category":"Person","definition":"Die Zwillingssöhne der Mādrī, jüngste der fünf Pāṇḍavas."},{"term":"Nala","category":"Person","definition":"König der Niṣadhas, Held der berühmten Nala-Damayantī-Erzählung im Āraṇyakaparva; verliert durch ein Würfelspiel sein Reich."},{"term":"Nala (Affe)","desc":"Kunstfertiger Affe, Sohn des göttlichen Baumeisters Viśvakarman; erbaut die berühmte Brücke über den Ozean nach Laṅkā."},{"term":"Nalakūbara","category":"Person","definition":"Sohn Kuberas; wird an anderer Stelle des Mahābhārata mit Arjuna in Verbindung gebracht."},{"term":"Namuci","category":"Person","definition":"Ein von Indra erschlagener Dānava/Asura."},{"term":"Nandaka","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; durchbohrt Bhīmasena in Kap.60 mit sechs Pfeilen, wird von diesem verwundet."},{"term":"Nandana","category":"Ort","definition":"Der paradiesische Lustgarten des Gottes Indra; wird oft als Vergleichsbild für besonders schöne Wälder oder Gärten herangezogen."},{"term":"Nandigrāma","desc":"Ort, an dem Bharata, nachdem Rāma ihn zurückgeschickt hat, die Regierungsgeschäfte stellvertretend führt, indem er Rāmas Sandalen als Zeichen der wahren Herrschaft voranstellt."},{"term":"Nandinī","category":"Wesen","definition":"Wunscherfüllende Kuh (auch Śabalā genannt) im Besitz Vasiṣṭhas; Ursache des Streits mit Viśvāmitra, erschafft im Zorn ganze Völkerscharen."},{"term":"Nandā","category":"Ort","definition":"Ein heiliger Fluss, den Arjuna auf seiner Pilgerreise besucht."},{"term":"Nara","category":"Gottheit","definition":"Mit Nārāyaṇa verbundene Gottheit/Doppelfigur; greift mit göttlichem Bogen in die Götter-Asura-Schlacht ein."},{"term":"Nara-Nārāyaṇa","category":"Konzept","definition":"Paar uralter Ṛṣis/göttlicher Gestalten, mit denen Kṛṣṇa und Arjuna nach der Überlieferung Nāradas identisch sind."},{"term":"Naraka","category":"Person","definition":"Dämonischer Erdgeborener König (Narakāsura), berühmt aus späteren Erzählungen durch seine Bezwingung durch Kṛṣṇa; hier unter den Daitya-Fürsten in Varuṇas Halle genannt. Nach der in Droṇaparva Kap.28 erzählten Vorgeschichte war er der Sohn der Erdgöttin Dharā und Nārāyaṇas, ausgestattet mit der unfehlbaren Vaiṣṇava-Waffe, die nach seinem Tod durch Kṛṣṇa an Bhagadatta weiterging."},{"term":"Narmadā","desc":"Ein großer, heiliger Fluss Mittelindiens, dessen Ufer als tīrtha gilt."},{"term":"Naubandhana","desc":"„Schiffsanbindung“; Beiname der höchsten Himālaya-Spitze, an der Manu sein Schiff während der großen Flut festband (Matsyopākhyāna, Vanaparva)."},{"term":"Nikumbha","category":"Person","definition":"Ein Dämonenfürst aus dem Geschlecht Hiraṇyakaśipus, Vater von Sunda und Upasunda."},{"term":"Nimeṣa","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Niramitra","category":"Person","definition":"Sohn Nakulas und der Cedi-Prinzessin Kareṇuvatī (Adh.90)."},{"term":"Nirvāṇa","desc":"Das endgültige Erlöschen bzw. die höchste Vollendung jenseits von Geburt und Wiederkehr, wie sie der Weise Mudgala am Ende seiner Askese erlangt."},{"term":"Nirṛti","category":"Gottheit","definition":"Gattin des personifizierten Adharma, Mutter der Rākṣasas und dreier Söhne (Bhaya, Mahābhaya, Mṛtyu)."},{"term":"Nivātakavaca","category":"Volk","definition":"Dämonisches Volk in Hiraṇyapura, das Arjuna im Auftrag Indras bekämpfte."},{"term":"Nivātakavacāḥ","desc":"Eine mächtige Dānava-Sippe (dreißig Millionen an Zahl), die in einer uneinnehmbaren Festung im Meer wohnt und von Arjuna als Lehrerlohn für Indra bekämpft wird."},{"term":"Niyoga","category":"Begriff","definition":"Die Sitte, einen Sohn für einen verstorbenen, kinderlosen oder untauglichen Ehemann durch einen von der Witwe oder ihrer Familie beauftragten anderen Mann zeugen zu lassen; der so gezeugte Sohn gilt rechtlich als Sohn des Ehemannes (vgl. Adh.98-99)."},{"term":"Niṣadha","category":"Ort/Reich","note":"Das Königreich Nalas, dessen Herrscher."},{"term":"Niṣāda","category":"Begriff","definition":"Ein am Rande der brahmanischen Ordnung stehendes Volk von Fischern/Jägern; hier Nahrung Garuḍas."},{"term":"Nābhāga","category":"Person","definition":"Legendärer König der Sonnendynastie, Vergleichsbild für Janamejaya."},{"term":"Nāga","category":"Sache","definition":"Schlangenwesen, die in einer eigenen Unterweltregion wohnen."},{"term":"Nāgapura","category":"Ort","definition":"Alternativer Name Hāstinapuras/Gajasāhvayas, der Kuru-Hauptstadt (Adh.105)."},{"term":"Nāgasabha","category":"Ort","definition":"Berg, den Pāṇḍu mit seinen Gattinnen auf dem Weg in die Waldverbannung erreicht (Adh.110)."},{"term":"Nāgasāhvaya","category":"Ort/Beiname","definition":"Beiname der Stadt Hastināpura (,die nach dem Elefanten Benannte'); in Adh.154 als Ziel Droṇas genannt."},{"term":"Nārada","category":"Person","definition":"Himmlischer Weiser (Devarṣi), reist zwischen den Welten und überbringt wichtige Botschaften und Erzählungen; tritt im Mahābhārata wiederholt als Erzähler und Bote auf."},{"term":"Nārāyaṇa","category":"Gottheit","definition":"Beiname Viṣṇus; im Eröffnungsvers zusammen mit Nara, Sarasvatī und Vyāsa verehrt; daneben bezeichnet ‚nārāyaṇāḥ‘ (Pl.) in Droṇaparva Kap.17 auch die Nārāyaṇa-Krieger, Kṛṣṇas Kuhhirtentruppe, die auf Duryodhanas Seite kämpft. Wird in Kap.124 von Yudhiṣṭhira in seinem großen Lobpreis als einer der Namen Kṛṣṇas als höchstes göttliches Wesen angerufen."},{"term":"Nāsatya","category":"Gottheit","definition":"Bezeichnung der Aśvin-Zwillinge, der göttlichen Ärzte."},{"term":"Nīla","category":"Person","definition":"Pāṇḍava-verbündeter König, steht in Kap.52 mit den Nīlāyudhas unmittelbar nach Virāṭa/Drupada in der Halbmond-Gegenformation. In Kap.30 durchbricht er als flammengleicher Krieger die Kuru-Reihen, wird von Aśvatthāman zum Zweikampf herausgefordert und von diesem im Kampf enthauptet."},{"term":"Nṛga","category":"Person","definition":"Legendärer Opferkönig, dessen Opfer als Vergleichsbild angeführt wird."},{"term":"Paila","category":"Person","definition":"Schüler des Vyāsa (bzw. \"Sohn des Vasu\" genannt), einer der Priester beim Rājasūya-Opfer; überliefert als einer der ersten Rezitatoren des Ṛgveda."},{"term":"Parameṣṭhin","category":"Person","definition":"Der Höchste - Beiname Brahmās."},{"term":"Paraśurāma","category":"Person","definition":"Auch Jāmadagnya oder Bhārgava genannt; Sohn des Jamadagni, Viṣṇu-Avatāra; rottete der Überlieferung nach 21-mal die gesamte Kṣatriya-Kaste aus und büßte danach auf dem Berg Mahendra. Verschenkt in Adh.121 auf Droṇas Bitte, nachdem er bereits allen Besitz und die ganze Erde weggegeben hat, sämtliche Waffen samt den geheimen Rückholformeln und dem vollständigen Dhanurveda."},{"term":"Parigha","category":"Begriff","definition":"Eine schwere, eisenbeschlagene Streitkeule bzw. Torstange."},{"term":"Parikṣit","category":"Person","definition":"Enkel Arjunas, Vater Janamejayas. In Adh.89 trägt zudem ein viel früherer Vorfahre (Enkel Kurus über Abhiṣvat) ebenfalls den Namen Parikṣit – ein Namensvetter, nicht identisch mit dem Vater Janamejayas."},{"term":"Parjanya","category":"Gottheit","definition":"Vedischer Regen- und Gewittergott, Spender des Regens für alle Wesen; in Droṇaparva Kap.4 von Bhīṣma als Vergleichsbild für Karṇa als Stütze seiner Freunde herangezogen."},{"term":"Parva","category":"Gliederung","definition":"Buch; eines der 18 Hauptteile des Mahābhārata."},{"term":"Parvasaṃgraha","category":"Werkteil","definition":"Das „Baum-Gleichnis“ und die Inhaltsübersicht aller 18 Parvas innerhalb des Adhyāya 1."},{"term":"Parvata","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas, oft zusammen mit Nārada genannt."},{"term":"Parāvasu","desc":"Jüngerer Sohn des Raibhya."},{"term":"Parāśara","category":"Person","definition":"Vater des Vyāsa (Kṛṣṇa Dvaipāyana). In Adh.167: als noch ungeborenes Kind bereits zwölf Jahre im Mutterleib der Veden kundig, was Vasiṣṭha vom Selbstmord abhält. In Adh.169 ausführlich: hält Vasiṣṭha zunächst für seinen Vater, erfährt von Adṛśyantī die Wahrheit und fasst daraufhin den Entschluss zur Weltvernichtung, den Vasiṣṭha mit der Aurva-Erzählung besänftigt."},{"term":"Parṇāda","desc":"Brahmane, von Bhīma ausgesandt, um Nala zu suchen; überbringt Damayantī den entscheidenden Hinweis auf den Wagenlenker Bāhuka in Ayodhyā."},{"term":"Paulomas","category":"Wesen","definition":"Eine Gruppe von Dānavas (Nachkommen der Pulomā), die laut Tradition von Arjuna im Auftrag Indras im Kampf besiegt wurden."},{"term":"Paurava","category":"Person","definition":"Ein Kaurava-Krieger, greift in Kap.36 gemeinsam mit anderen Abhimanyu an — nicht zu verwechseln mit dem gleichnamigen Volk/König der Pauravas."},{"term":"Pauravas","category":"Volk/Dynastie","definition":"Das Geschlecht der Nachkommen des Pūru (Sohn Yayātis, s. Adhyāya 70), das eigentliche Stammgeschlecht der Bhāratas; König Duḥṣanta (Adhyāya 62) gilt als späterer, die Linie fortführender „vaṃśakara“ dieses Geschlechts. Vorfahren der Kuru-Dynastie."},{"term":"Pauraṃdara","category":"Waffe","definition":"Die von Indra (Puraṃdara) stammende Waffe, die Arjuna beherrscht."},{"term":"Pauṇḍraka","category":"Person","definition":"König der Vaṅgas, Puṇḍras und Kirātas, der sich fälschlich selbst als 'Vāsudeva' ausgibt."},{"term":"Pauṣya","category":"Person","definition":"Kṣatriya-König, dessen Ohrringe Uttaṅka für seine Lehrerin erbittet; wechselseitiger Fluch (Blindheit/Kinderlosigkeit) mit Uttaṅka."},{"term":"Payoṣṇī","desc":"Ein Fluss in Vidarbha, an dem sich Yudhiṣṭhira während seiner Wallfahrt eine Weile aufhält."},{"term":"Paṭṭiśa","category":"Begriff","definition":"Eine Speer-/Lanzenart."},{"term":"Phalguna","category":"Epitheton","definition":"Beiname Arjunas."},{"term":"Phālguna","category":"Konzept","definition":"Name eines Monats im indischen Kalender (Februar/März), in dem die Pāṇḍavas laut Adh.133 nach Vāraṇāvata aufbrechen."},{"term":"Phālguni","category":"Epitheton","definition":"Patronymikon „Sohn des Phalguna [Arjuna]“, Beiname Abhimanyus."},{"term":"Pinākin","category":"Gottheit","definition":"„Träger des Bogens Pināka“; Epitheton Śivas."},{"term":"Pitāmaha","category":"Person","definition":"Wörtlich Großvater - gebräuchlicher Beiname des Gottes Brahmā als Urahn aller Wesen."},{"term":"Pitṛ (Pitaraḥ)","category":"Wesen","definition":"Die „Väter“ bzw. verstorbenen Ahnen, ein eigener Kreis von Wesen im Ahnenkult, auf die Nachkommen durch Opfergaben (śrāddha) angewiesen sind; in Adh.41 erscheinen die Ahnen Jaratkārus in einer eindrucksvollen Vision, kopfunter in einer Grube hängend."},{"term":"Pitṛloka","category":"Ort","definition":"Welt der Ahnen (Pitṛs); von dort erscheinen die verstorbenen Bhṛgus in Adh.170, um Aurva zu besänftigen."},{"term":"Piśāca","category":"Konzept","definition":"Eine Klasse dämonischer Wesen, verwandt mit den Rākṣasas, in Adh.143 als Vergleichsgröße für Ghaṭotkacas Schrecklichkeit genannt."},{"term":"Piṇḍa","category":"Begriff","definition":"Reiskloß-Opfergabe für die verstorbenen Vorfahren; ihre fortlaufende Darbringung durch männliche Nachkommen sichert deren Wohl im Jenseits (Adh.97). In Adh.147 zentrales Argument im Streit der Brahmanenfamilie: das Fortbestehen der Totenspende hängt am Überleben von Vater und Sohn."},{"term":"Potana","category":"Ort","definition":"Von Aśmaka, Sohn der Madayantī und Vasiṣṭhas, gegründete Stadt."},{"term":"Prabhadraka","category":"Sache","definition":"Kriegervolk/Truppenkontingent, verbündet mit Pāñcālas, Matsyas und Kekayas; in Kap.45 von Bhīṣma niedergestreckt, später u.a. als Śikhaṇḍins Leibgarde bekannt."},{"term":"Prabhaṃkara","category":"Person","definition":"Ein Vorfahre Citravāhanas, durch dessen Askese Śiva festlegte, dass in diesem Königsgeschlecht stets nur ein Kind geboren wird."},{"term":"Prabhāsa","category":"Ort","definition":"Eine heilige Pilgerstätte am Westmeer, wo Arjuna und Kṛṣṇa sich wiedertreffen."},{"term":"Prabāhu","category":"Person","definition":"Ein Kaurava-Krieger, greift in Kap.36 gemeinsam mit anderen Abhimanyu an."},{"term":"Pradyumna","category":"Person","definition":"Sohn Kṛṣṇas, Wiedergeburt des Sanatkumāra."},{"term":"Prahasta","desc":"Feldherr Rāvaṇas, Gegner Vibhīṣaṇas in der Schlacht um Laṅkā."},{"term":"Prahlāda","category":"Person","definition":"Frommer Daitya-König, Sohn des Hiraṇyakaśipu, berühmt für seine unerschütterliche Hingabe an Viṣṇu; hier Vater des Virocana in einem Lehrgleichnis über die Pflicht zur Wahrheit."},{"term":"Prahrāda","category":"Wesen","definition":"Sohn Hiraṇyakaśipus, Vater Virocanas, Kumbhas und Nikumbhas; berühmter frommer Asura (in anderen Traditionen: Prahlāda)."},{"term":"Prajāpati","category":"Begriff/Gottheit","definition":"„Herr der Geschöpfe“ – Bezeichnung für Brahmā und für eine Gruppe von Schöpfungsgottheiten."},{"term":"Pralamba","category":"Person","definition":"Ein Asura (Dämon), der von Kṛṣṇa erschlagen wurde; in Droṇaparva Kap.10 in Dhṛtarāṣṭras Katalog von Kṛṣṇas Heldentaten genannt."},{"term":"Praliha","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Pramadvarā","category":"Person","definition":"Gattin Rurus, Mutter Śunakas."},{"term":"Pramati","category":"Person","definition":"Sohn Cyavanas, Vater Rurus (Bhārgava-Geschlecht)."},{"term":"Pramohana","category":"Waffe","definition":"Das \"Verwirrungs-Geschoss\", von Droṇa an Dhṛṣṭadyumna verliehen (Kap.73); betäubt Sinn und Kraft der Getroffenen. Wird von Droṇa mittels des Weisheits-Geschosses (Prajñāstra) wieder entkräftet."},{"term":"Pramāṇakoṭi","category":"Ort","definition":"Uferplatz an einem Gewässer nahe Hāstinapura, Schauplatz von Duryodhanas erstem Mordanschlag auf Bhīma (Adh.119)."},{"term":"Praruja","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Prasthala","category":"Ort","definition":"Herrschaftsgebiet des Trigarta-Königs Suśarman, der danach als 'Herr von Prasthala' bezeichnet wird."},{"term":"Pratardana","category":"Person (König)","definition":"König, der Yayāti in der Zwischenluft begegnet, nachdem dieser aus dem Himmel gestürzt wurde (Adh.81)."},{"term":"Pratismṛti","category":"Begriff","note":"„Wieder-Erinnerung“: eine von Vyāsa an Yudhiṣṭhira übergebene geheime Wissenschaft/Formel, die dieser an Arjuna weitergibt, damit er sich durch Askese der göttlichen Waffen erinnern und sie erlangen kann."},{"term":"Prativindhya","category":"Person","definition":"Sohn Yudhiṣṭhiras und Draupadīs, einer der fünf Upapāṇḍavas. In Kapitel 143 liefert er sich ein hartes Duell mit Duḥśāsana: Trotz einer Stirnwunde durch drei Pfeile durchbohrt er Duḥśāsana mehrfach, verliert aber schließlich Pferde, Wagenlenker, Banner und Bogen; wagenlos kämpft er zu Fuß weiter, bis seine Brüder herbeieilen und er auf Sutasomas Wagen überwechselt, um den Kampf gegen Duḥśāsana fortzusetzen."},{"term":"Pratīcya","category":"Volk","definition":"'Westliche', Volk/Sammelbezeichnung, das in Kap.114 unter den Bhīṣma treu bleibenden Völkern genannt wird."},{"term":"Pratīpa","category":"Person (König)","definition":"Nachkomme Bharatas in der Kuru-Genealogie, Vater Devāpis, Śaṃtanus und Bāhlīkas (Adh.89)."},{"term":"Pravīra","category":"Person (König)","definition":"Ältester der drei Söhne Pūrus; Begründer der weiteren Paurava-Linie (Adh.89)."},{"term":"Prayāga","category":"Ort","definition":"Heiliger Zusammenfluss (Sangam) von Gaṅgā und Yamunā (heute Allahabad); Ort legendärer Opfer, u.a. von Soma, Varuṇa und Prajāpati."},{"term":"Prācinvān","category":"Person (König)","definition":"Sohn Janamejayas (Pūrus Enkel), eroberte die östliche Himmelsrichtung, daher sein Name (Adh.90)."},{"term":"Prācya","category":"Volk","definition":"'Östliche', Volk/Sammelbezeichnung, das in Kap.114 unter den Bhīṣma treu bleibenden Völkern genannt wird."},{"term":"Prāgjyotiṣa","category":"Ort","definition":"Ostliches Königreich (Gegend des heutigen Assam), regiert von König Bhagadatta; bekannt für Kirāta- und Cīna-Krieger und Ozeanvölker."},{"term":"Prātikāmin","category":"Person","definition":"Herold/Diener Duryodhanas, der Draupadī während des Würfelspiels (Sabhāparva) gewaltsam in die Versammlungshalle führte."},{"term":"Pulaha","category":"Person","definition":"Einer der sechs geistgeborenen Söhne Brahmās."},{"term":"Pulastya","category":"Person","definition":"Einer der sechs geistgeborenen Söhne Brahmās; in anderen Traditionen Großvater Rāvaṇas."},{"term":"Puloma","category":"Wesen","definition":"Ein Rakṣas (Dämon), der Bhṛgus Gattin Pulomā für seine eigene, ihm einst versprochene Braut hält und Agni nach der Wahrheit befragt; im Deutschen von seiner gleichnamigen Namensvetterin Pulomā (Bhṛgus Gattin) durch die grammatische Form unterschieden."},{"term":"Pulomā","category":"Person","definition":"Bhṛgus geliebte Gattin, schwanger mit Cyavana; wird vom gleichnamigen Rakṣas Puloma begehrt, der sie für seine frühere Verlobte hält."},{"term":"Purandara","category":"Gottheit","definition":"Epitheton Indras („Festungsbrecher“)."},{"term":"Puraṃdara","category":"Person","definition":"Beiname Indras, wörtlich der Festungsbrecher."},{"term":"Purocana","category":"Person","definition":"Vertrauter Minister Duryodhanas, der in Vāraṇāvata das brennbare Haus (Lākṣāgṛha) errichten und die Pāṇḍavas darin verbrennen soll (ab Adh.132). Empfängt die Pāṇḍavas in Vāraṇāvata und weist ihnen in Adh.134 das Lākṣāgṛha als Unterkunft zu. Kommt in Adh.136 selbst im von den Pāṇḍavas entzündeten Feuer um, das er ihnen zugedacht hatte."},{"term":"Purohita","category":"Konzept/Amt","definition":"Der Hauspriester eines Königs; in Adh.159 ausführlich als unverzichtbar für dauerhaften Erfolg und Herrschaft gepriesen."},{"term":"Puru","desc":"Ahnherr der Paurava-Dynastie, jüngster Sohn Yayātis, der dessen Alter auf sich nahm und dafür das Erbe erhielt (s. Ādiparva)."},{"term":"Purujit","category":"Person","definition":"Beiname/Patronymikon 'Kuntibhoja'; Onkel Arjunas mütterlicherseits (Bruder Kuntīs), kämpft auf Pāṇḍava-Seite mit regenbogenfarbenen Pferden (Droṇaparva Kap.22). Vom älteren Kuntibhoja, Kuntīs Adoptivvater (Adh.104), zu unterscheiden; wohl dessen Sohn und Erbe."},{"term":"Purukutsa","desc":"Vater des Trasadasyu, König aus dem Ikṣvāku-Geschlecht."},{"term":"Purumitra","category":"Person","definition":"Ein Krieger auf Kaurava-Seite, in Kap.42 unter den beim ersten allgemeinen Waffengang aufgezählten Kämpfern genannt."},{"term":"Puruṣa","category":"Begriff","definition":"Das kosmische Urwesen/die Urseele in vedisch-upaniṣadischem Denken."},{"term":"Purūravas","category":"Person","definition":"Legendärer König, Geliebter der Apsaras Urvaśī; wird hier beiläufig als Vergleichsbild für Janamejayas Liebesglück angeführt. Laut Adhyāya 70 Sohn der Ilā (die zugleich seine Mutter und sein Vater war); geriet später wegen seines Hochmuts gegenüber Brahmanen in Konflikt und wurde von Weisen verflucht."},{"term":"Putra-Typen (Zwölf Sohnesarten)","category":"Konzept","definition":"Klassische dharmaśāstrische Typologie der Söhne (Adh.111 V28f.), von denen sechs als Erben der Verwandtschaft gelten und sechs nicht: der leibliche, der durch Niyoga hervorgebrachte, der erkaufte, der Sohn der wiederverheirateten Witwe, der vor der Ehe geborene, der von einer freizügigen Frau geborene, der geschenkte, der ein zweites Mal gekaufte, der adoptierte, der sich selbst anschließende, der von einer bereits schwangeren Braut mitgebrachte, und der trotz niedriger Herkunft aufgezogene Sohn."},{"term":"Puṃsavana","category":"Begriff","definition":"Ein Ritual zur Erzeugung eines männlichen Kindes."},{"term":"Puṇḍarīka","category":"Ritual","definition":"Ein großes vedisches Soma-Opfer (Puṇḍarīka-Yajña)."},{"term":"Puṇḍra","category":"Volk/Ort","definition":"Volk/Königreich im Osten, von Pāṇḍu unterworfen (Adh.105)."},{"term":"Puṣkara","category":"Ort","definition":"Ein bekannter Wallfahrtsort/heiliger See."},{"term":"Puṣkarākṣa","category":"Person","definition":"Beiname Kṛṣṇas, wörtlich der Lotosäugige."},{"term":"Puṣpaka","desc":"Der prächtige, von Viśvakarman gefertigte himmlische Wagen (Vimāna) Kuberas."},{"term":"Puṣya","category":"Sache","definition":"Ein Mondhaus (Nakṣatra), als besonders günstig für Hochzeiten und andere wichtige Unternehmungen geltend."},{"term":"Pākaśāsana","category":"Person","definition":"Beiname Indras, wörtlich Bezwinger des Dämons Pāka. Das Patronymikon Pākaśāsani (\"Sohn des Pākaśāsana\") wird in Kap.64 als Beiname Arjunas gebraucht, des mythischen Sohnes Indras."},{"term":"Pārijāta","category":"Sache","definition":"Ein himmlischer Baum aus Indras Garten in Amarāvatī, den Kṛṣṇa nach Bezwingung Indras aus Mahendras Palast raubte; in Droṇaparva Kap.10 in Dhṛtarāṣṭras Katalog von Kṛṣṇas Heldentaten erwähnt."},{"term":"Pārṣata","category":"Epitheton","definition":"‚Sohn des Pṛṣata' – Beiname Drupadas bzw. Dhṛṣṭadyumnas."},{"term":"Pātāla","category":"Ort","definition":"Die Unterwelt bzw. der unergründliche Grund des Ozeans; Wohnsitz der Asuras und Nāgas."},{"term":"Pāvaka","category":"Person","definition":"Beiname Agnis, des Feuergottes, wörtlich der Reinigende."},{"term":"Pāvaki","category":"Epitheton","definition":"'Sohn des Feuers[gottes Agni/Pāvaka]', Beiname des Kriegsgottes Skanda; in Droṇaparva Kap.5 als Vergleichsbild in Duryodhanas Rede an Droṇa verwendet."},{"term":"Pāñcajanya","category":"Begriff","definition":"Muschelhorn, das dem Ozean entstammt; wird im späteren Epos zu Kṛṣṇas berühmtem Kriegshorn."},{"term":"Pāñcāla","category":"Sache","definition":"Königreich, dessen Herrscher Drupada und dessen Hauptstadt Kāmpilya bzw. Kampf-/Wettbewerbsschauplatz von Draupadīs Svayaṃvara ist."},{"term":"Pāñcālas","category":"Volk/Geschlecht","definition":"Nachkommen von Duḥṣanta und Parameṣṭhin, Söhnen Ajamīḍhas (Adh.89); späteres Königreich der Pāñcāla, u.a. Herkunftsland Draupadīs."},{"term":"Pāñcālya","category":"Epitheton","definition":"‚Der aus Pāñcāla' – Beiname König Drupadas."},{"term":"Pāñcālī","category":"Epitheton","definition":"‚Die aus Pāñcāla' – Beiname Draupadīs nach ihrem Heimatland."},{"term":"Pāśupata","category":"Waffe","note":"Die furchtbarste aller Waffen, Śivas eigenes Geschoss, das die ganze Welt vernichten kann; Śiva übergibt sie Arjuna samt der geheimen Formel ihrer Zurückrufung und warnt eindringlich vor ihrem Missbrauch."},{"term":"Pāṇḍava","category":"Person","definition":"Die fünf Söhne des Pāṇḍu (Yudhiṣṭhira, Bhīma, Arjuna, Nakula, Sahadeva); Helden des Mahābhārata."},{"term":"Pāṇḍu","category":"Person","definition":"Vater der fünf Pāṇḍavas, Sohn des Vyāsa mit der Witwe des Vicitravīrya. In Adh.89 trägt zudem ein ferner Vorfahre in der Paurava-Genealogie (Bruder des dortigen Dhṛtarāṣṭra) ebenfalls den Namen Pāṇḍu – ein Namensvetter, nicht identisch mit dem Vater der Pāṇḍavas. Auf der Jagd erschießt er versehentlich den in Hirschgestalt liebenden Muni Kiṃdama, der ihn mit dem Tod im Augenblick der nächsten ehelichen Vereinigung verflucht (Adh.109). Entsagt daraufhin dem Königtum, verteilt seinen Schmuck an Brahmanen und zieht mit Kuntī und Mādrī als Asket in den Himālaya, wo er sich am Berg Śataśṛṅga niederlässt (Adh.110). Da Kiṃdamas Fluch ihn zeugungsunfähig macht, bittet er Kuntī in Adh.111, unter Berufung auf die Śāradaṇḍāyanī-Geschichte, durch Niyoga mit einem überlegenen Brahmanen Nachkommen zu erzeugen. Erlangt durch Kuntīs Niyoga mit Dharma, Vāyu und (nach eigener einjähriger Askese) Indra die drei Söhne Yudhiṣṭhira, Bhīma und Arjuna (Adh.114). Stirbt in Adh.116, als sich der Kiṃdama-Fluch erfüllt: Von Begierde überwältigt, vereinigt er sich mit Mādrī und verscheidet im selben Augenblick."},{"term":"Pāṇḍya","category":"Ort","definition":"Bedeutendes Königreich im äußersten Süden Indiens."},{"term":"Pīṭha","category":"Person","definition":"Ein großer Asura (Dämon), der von Kṛṣṇa erschlagen wurde; in Droṇaparva Kap.10 in Dhṛtarāṣṭras Katalog von Kṛṣṇas Heldentaten genannt."},{"term":"Pūru","category":"Person","definition":"Jüngster Sohn Yayātis und der Śarmiṣṭhā; einzig er willigt ein, das Alter des Vaters auf sich zu nehmen, und wird dafür zum Königserben und Namensgeber des Paurava-Geschlechts."},{"term":"Pūrvacitti","category":"Wesen","definition":"Eine der sechs vorzüglichsten Apsaras (Adhyāya 68), neben Urvaśī, Sahajanyā, Menakā, Viśvācī und Ghṛtācī."},{"term":"Pūtanā","desc":"Furchtbare Rākṣasī, die als Kinder-Graha (\"Pūtanā-Graha\") Leibesfrüchte und Neugeborene bedroht; später berühmt als die Dämonin, die in der Kṛṣṇa-Mythologie den Säugling Kṛṣṇa zu vergiften versucht."},{"term":"Pūṣan","category":"Person","definition":"Einer der zwölf Āditya-Götter, Beschützer der Reisenden und Herden."},{"term":"Pṛthu","category":"Gottheit","definition":"Einer der acht Vasu-Götter, Anführer beim Raub von Vasiṣṭhas Kuh (Adh.93)."},{"term":"Pṛthā","category":"Person","definition":"Anderer Name der Kuntī, Mutter der drei älteren Pāṇḍavas."},{"term":"Pṛṣata","category":"Person","definition":"König, Jugendfreund Bharadvājas; Vater Drupadas, den er zusammen mit Droṇa an Bharadvājas Einsiedelei aufwachsen lässt (Adh.121)."},{"term":"Raghu","category":"Person (König)","definition":"Berühmter König der Sonnendynastie, Vorfahr Rāmas; hier unter den himmlischen Zuschauern der Schlacht zwischen Bhīṣma und Arjuna genannt."},{"term":"Raibhya","desc":"Weiser, gelehrter Freund des Bharadvāja; Vater von Arvāvasu und Parāvasu; zentrale Figur der Yavakrī-Erzählung."},{"term":"Raivataka","category":"Ort","definition":"Ein Berg nahe Dvārakā, wo Arjuna und Kṛṣṇa gemeinsam verweilen."},{"term":"Rambhā","category":"Person","definition":"Berühmte Apsara am Hof Kuberas, in späteren Erzählungen (u.a. um Arjunas Fluch durch Urvaśī) bedeutsam."},{"term":"Rantideva","category":"Person","definition":"Legendärer, für Freigebigkeit berühmter König, dessen Opfer als Vergleichsbild angeführt wird."},{"term":"Rasātala","desc":"Eine der sieben unterirdischen Welten (Pātālas) der indischen Kosmologie, Wohnstätte der von den Göttern besiegten Daityas und Dānavas; hierher wird Duryodhana durch die Kṛtyā entrückt."},{"term":"Rathasena","category":"Person","definition":"Ein kampfestrunkener Krieger auf Pāṇḍava-Seite, mit erbsenblütenfarbenen Pferden (Droṇaparva Kap.22)."},{"term":"Rati","category":"Gottheit","definition":"Gattin des Liebesgottes Kāma."},{"term":"Raudrāśva","category":"Person (König)","definition":"Sohn Pūrus, Vater von zehn Söhnen (u.a. Ṛcepu, Kakṣepu), auch Anādhṛṣṭi genannt (Adh.89)."},{"term":"Rauhiṇeya","category":"Epitheton","definition":"‚Sohn der Rohiṇī' – Beiname Balarāmas."},{"term":"Revatī","category":"Person","definition":"Die Gattin Balarāmas (Haladharas)."},{"term":"Reṇuka (Vogel)","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Reṇukā","desc":"Mutter des Paraśurāma; ihr ein heiliger Badeplatz geweiht."},{"term":"Rocamāna","category":"Person","definition":"Ein König auf Pāṇḍava-Seite mit himmelblauen, sternenähnlich gesprenkelten Pferden (Droṇaparva Kap.22); sein Sohn wird ebendort mit lotosblattfarbenen Pferden und goldener Hautfarbe beschrieben."},{"term":"Rohiṇa","category":"Begriff","definition":"Name eines gewaltigen (Wunsch-)Baumes, der Garuḍa einen Ast anbietet."},{"term":"Rohiṇī","category":"Konzept","definition":"Mondhaus (Nakṣatra), unter dem die Pāṇḍavas laut Adh.133 nach Vāraṇāvata aufbrechen."},{"term":"Ruciraparvan","category":"Person","definition":"Krieger, der im Kampf des zehnten Tages von Bhagadatta erschlagen wird (Kap.25); die genaue Lesart des Namens sowie sein Verhältnis zu dem in V.44 genannten Angreifer sind unsicher [?]."},{"term":"Rudra","category":"Begriff","definition":"Eine Klasse vedischer Gottheiten, mit Śiva assoziiert."},{"term":"Rukmaratha","category":"Epitheton","definition":"'Der Goldwagen-Krieger', in Droṇaparva Kap.7 gebrauchter Beiname Droṇas (durch das Patronymikon 'Bhāradvāja' im selben Kapitel und durch Dhṛtarāṣṭras Reaktion im folgenden Kapitel eindeutig als Droṇa identifiziert; vgl. Anm. zu Kap.7). In Kap.87 (Einheit 17) daneben auch als Gruppenbezeichnung ('die Rukmaratha genannten Königssöhne') für eine Schar von Wagenkämpfern verwendet, zu unterscheiden vom Droṇa-Beinamen aus Kap.7."},{"term":"Rukmin","category":"Person","definition":"König, Wiedergeburt eines Krodhavaśa-Dämons; Bruder Rukmiṇīs (Kṛṣṇas späterer Gemahlin)."},{"term":"Rukmiṇī","category":"Person","definition":"Die Hauptgemahlin Kṛṣṇas, Mutter Pradyumnas."},{"term":"Ruru","category":"Person","definition":"Sohn Pramatis und der Ghṛtācī, Vater Śunakas, Urahn Śaunakas."},{"term":"Rādheya","category":"Epitheton","definition":"‚Sohn der Rādhā' – Beiname Karṇas nach seiner Pflegemutter."},{"term":"Rādhā","category":"Person","definition":"Gattin des Wagenlenkers (Sūta) Adhiratha; zieht den ausgesetzten Karṇa als eigenen Sohn Vasuṣeṇa groß (Adh.104)."},{"term":"Rāhu","category":"Wesen","definition":"Dānava, der sich als Gott ausgibt und vom Amṛta trinkt; von Viṣṇus Diskus enthauptet, verschlingt seither periodisch Sonne und Mond (Ursprungsmythos der Finsternisse)."},{"term":"Rājagṛha","category":"Ort","definition":"Die Hauptstadt des Königreichs Magadha."},{"term":"Rājasūya","category":"Ritual","definition":"Das große Königsweihe-Opfer, mit dem ein König seine Oberherrschaft beansprucht; von Yudhiṣṭhira vollzogen."},{"term":"Rākṣasa","category":"Konzept","definition":"Klasse menschenfressender, gestaltwandelnder Dämonen der Sanskrit-Epik; ab Adh.139 verkörpert durch Hiḍimba und seine Schwester."},{"term":"Rāma","category":"Person","definition":"Name mehrerer Gestalten: meist Rāmacandra, der Sohn des Daśaratha und Held des Rāmāyaṇa (auch Rāghava genannt, \"Nachkomme des Raghu\"), gelegentlich auch Balarāma, der Bruder Kṛṣṇas, je nach Kontext."},{"term":"Rāma (Daśarathi)","category":"Person","definition":"Held des Rāmāyaṇa, Königssohn von Ayodhyā, Avatāra Viṣṇus; erschlug den Dämonenkönig Rāvaṇa. Nicht zu verwechseln mit Balarāma (Rāma Halāyudha), dem älteren Bruder Kṛṣṇas."},{"term":"Rāma (Dāśarathi)","category":"Person","definition":"Held des Rāmāyaṇa, Sohn des Daśaratha; hier als Vergleichsbild für Waffenkunde angeführt."},{"term":"Rāvaṇa","category":"Person","definition":"Dämonenkönig von Laṅkā, Antagonist des Rāmāyaṇa, von Rāma getötet."},{"term":"Sabhāparva","category":"Werkteil","definition":"Das zweite Parva: Rājasūya-Opfer, Würfelspiel und Verbannung der Pāṇḍavas."},{"term":"Sabhāpāla","category":"Sache","definition":"Titel des Hüters bzw. Aufsehers der Versammlungshalle Sudharmā."},{"term":"Sagara","category":"Person","definition":"Berühmter König der Sonnendynastie, Vorfahr Rāmas; bekannt für seine 60.000 Söhne, die durch den Fluch des Weisen Kapila verbrannten, und den späteren Abstieg der Gaṅgā zu ihrer Erlösung."},{"term":"Sahadeva","category":"Person","definition":"Fünfter der fünf Pāṇḍavas, Zwillingssohn (mit Nakula) der Mādrī und der Aśvin-Zwillinge; unterwirft im Weltunterwerfungszug die südliche Richtung. Nach Adhyāya 61 ein Anteil eines der beiden Aśvins (Aṃśāvataraṇa). In Droṇaparva Kap.22 zudem 'Jārāsaṃdhi' Sahadeva genannt, der Sohn des von Bhīma erschlagenen Jarāsandha, später König von Magadha — ein Namensvetter, nicht identisch mit dem Pāṇḍava. In Kapitel 142 unterliegt er im Zweikampf gegen Karṇa: Nachdem dieser wiederholt seine Bögen zerschnitten, seine Pferde und seinen Wagenlenker getötet sowie Keule, Speer und sogar ein geschleudertes Wagenrad zunichtegemacht hat, gibt der waffenlose Sahadeva den Kampf auf; Karṇa verschont ihn aus Rücksicht auf sein Kuntī gegebenes Versprechen, verspottet ihn aber und schickt ihn fort, worauf der gedemütigte Sahadeva auf den Wagen Janamejayas, des Pāñcālya, wechselt."},{"term":"Sahajanyā","category":"Wesen","definition":"Eine der sechs vorzüglichsten Apsaras (Adhyāya 68), neben Urvaśī, Pūrvacitti, Menakā, Viśvācī und Ghṛtācī."},{"term":"Sahasrapād","category":"Person","definition":"Weiser, der durch den Fluch eines Brahmanen in einen Ḍuṇḍubha (harmlose Schlangenart) verwandelt wurde; belehrt Ruru über Gewaltlosigkeit."},{"term":"Sainya","category":"Person/Tier","definition":"Eines der vier Pferde Kṛṣṇas (zusammen mit Sugrīva u.a.); wird in einigen Handschriftenlesarten auch als Śaibya bezeichnet."},{"term":"Sairandhrī","desc":"Draupadīs Deckname am Hof Virāṭas, als Kammerzofe/Friseurin der Königin Sudeṣṇā."},{"term":"Samantapañcaka","category":"Ort","definition":"Das „Fünf-Seen-Gebiet“ bei Kurukṣetra, benannt nach den fünf Blutseen, die Rāma Jāmadagnya dort einst schuf; später der Schauplatz der großen Bhārata-Schlacht."},{"term":"Sampāti","category":"Wesen","definition":"Sohn Aruṇas und der Śyenī, Bruder des Jaṭāyus; aus dem Rāmāyaṇa bekannter Geier."},{"term":"Samudrasena","category":"Person","definition":"Vater des Kriegers Candradeva (Droṇaparva Kap.22)."},{"term":"Samīcī","category":"Person","definition":"Eine der fünf Apsaras, die mit Vargā zusammen in Krokodile verwandelt wurden."},{"term":"Sanatkumāra","category":"Wesen","definition":"Ewig jugendlicher Weiser, einer der geistgeborenen Söhne Brahmās; steigt in Adhyāya 70 vom Brahmaloka herab, um Purūravas zu belehren."},{"term":"Sanatsujāta","category":"Person","definition":"Ein Weiser, der Dhṛtarāṣṭra vor Kriegsbeginn eine tiefe Lehre über das Selbst (adhyātma) vorträgt (Sanatsujātīya)."},{"term":"Saptarṣi","category":"Person/Gruppe","definition":"Die 'sieben Seher' - eine Gruppe uralter, hochheiliger Weiser (die Zusammensetzung variiert je nach Textstelle), oft mit den sieben Sternen des Großen Wagens assoziiert."},{"term":"Saramā","category":"Wesen","definition":"Göttliche Hündin, deren Sohn von Janamejayas Brüdern geschlagen wurde; ihr Fluch über ein „unvorhergesehenes Unheil“ treibt Janamejaya zur Suche nach einem Hauspriester."},{"term":"Sarasvatī","category":"Gottheit","definition":"Göttin der Rede, des Wissens und der Gelehrsamkeit; im Eröffnungsvers angerufen."},{"term":"Sarvadamana","category":"Person","definition":"»Allbezwinger«; Kindheitsname des Sohnes von Duḥṣanta und Śakuntalā, der in Kaṇvas Einsiedelei schon als Knabe wilde Tiere bändigt; später unter dem Namen Bharata bekannt."},{"term":"Sarvaga","category":"Person","definition":"Sohn Bhīmasenas und der Kāśī-Prinzessin Baladharā (Adh.90)."},{"term":"Sarvatobhadra","category":"Begriff","definition":"Name der „allseits günstigen“ Heeresaufstellung (Vyūha), die Bhīṣma am fünften Kampftag für die Kauravas bildet (Kap.95)."},{"term":"Satyabhāmā","category":"Person","definition":"Gattin Kṛṣṇas, führt im Āraṇyakaparva ein Gespräch mit Draupadī über die Pflichten einer Ehefrau."},{"term":"Satyadeva und Satya","category":"Person","definition":"Zwei überaus starke Radwächter (cakrarakṣau) des Königs Kaliṅga, in Kap.50 von Bhīma mit zwei Rasierpfeilen getötet."},{"term":"Satyadharman","category":"Person","definition":"Einer der fünf Brüder Suśarmans, des Trigarta-Fürsten; legt in Droṇaparva Kap.16 den Saṃśaptaka-Eid gegen Arjuna ab."},{"term":"Satyadhṛti","category":"Person","definition":"Name zweier verschiedener Krieger auf Pāṇḍava-Seite in Droṇaparva Kap.22: (1) ein in Waffenkunde, Bogenkunst-Lehre und dem Brahma-Veda bewanderter Satyadhṛti; (2) 'Kṣaimi', Sohn des Kṣema, Gefolgsmann Dhṛṣṭadyumnas."},{"term":"Satyadhṛti (Saucitti)","category":"Person","definition":"Ein kampfberauschter Krieger, patronymisch Saucitti (\"Sohn des Sucitta/Sucitti\") genannt, der in Kap.89 mit Bhīmasena Ghaṭotkaca zu Hilfe eilt."},{"term":"Satyajit","category":"Person","definition":"Ein Pāñcāla-Prinz; von Arjuna in Droṇaparva Kap.16 als Beschützer Yudhiṣṭhiras zurückgelassen, als er selbst gegen die Saṃśaptakas auszieht, mit der Warnung, dass niemand standhalten solle, sollte Satyajit fallen."},{"term":"Satyaka","category":"Person","definition":"Ein Vṛṣṇi-Held, Vater Sātyakis."},{"term":"Satyakarman","category":"Person","definition":"Einer der fünf Brüder Suśarmans, des Trigarta-Fürsten; legt in Droṇaparva Kap.16 den Saṃśaptaka-Eid gegen Arjuna ab."},{"term":"Satyaratha","category":"Person","definition":"Einer der fünf Brüder Suśarmans, des Trigarta-Fürsten; legt in Droṇaparva Kap.16 gemeinsam mit seinen Brüdern den Saṃśaptaka-Eid ab, Arjuna zu töten oder selbst zu fallen."},{"term":"Satyavant","desc":"Sohn des blinden, entthronten Königs Dyumatsena von Śālva; von Sāvitrī trotz der Vorhersage, er werde in einem Jahr sterben, zum Gatten erwählt - Titelheld neben ihr in der berühmten Sāvitrī-Erzählung."},{"term":"Satyavarman","category":"Person","definition":"Einer der fünf Brüder Suśarmans, des Trigarta-Fürsten; legt in Droṇaparva Kap.16 den Saṃśaptaka-Eid gegen Arjuna ab."},{"term":"Satyavatī","category":"Person","definition":"Auch Kālī genannt; Mutter des Vyāsa (Kṛṣṇa Dvaipāyana) von Parāśara, später Gemahlin Śaṃtanus und Mutter/Großmutter der Kuru-Linie."},{"term":"Satyavatīsuta","category":"Person","definition":"„Der Sohn der Satyavatī“ – Beiname des Vyāsa."},{"term":"Satyavrata","category":"Person","definition":"Ein Krieger auf Pāṇḍava-Seite, Verbündeter Abhimanyus; kämpft in Kap.69 gegen Citrasena und Purumitra."},{"term":"Satyaśravas","category":"Person","definition":"Kauravischer Krieger, in Kap.44 von Abhimanyu zu Beginn seines Angriffs auf die versammelten Wagenkämpfer erschlagen."},{"term":"Satyeṣu","category":"Person","definition":"Einer der fünf Brüder Suśarmans, des Trigarta-Fürsten; legt in Droṇaparva Kap.16 den Saṃśaptaka-Eid gegen Arjuna ab."},{"term":"Saubha","category":"Ort","definition":"Reich (bzw. fliegende Stadt) des Königs Śālva."},{"term":"Saubhadra","category":"Epitheton","definition":"'Sohn der Subhadrā', Beiname Abhimanyus nach seiner Mutter Subhadrā, Kṛṣṇas Schwester."},{"term":"Saudāsa","category":"Person","definition":"Eigenname/Patronymikon König Kalmāṣapādas (,Sohn des Sudāsa')."},{"term":"Saudāsa (Kalmāṣapāda)","category":"Person","definition":"König, Gatte der Madayantī, die auf sein Geheiß von Vasiṣṭha den Sohn Aśmaka empfängt (Adh.113)."},{"term":"Saumadatti","category":"Person","definition":"„Sohn des Somadatta“ – Beiname des Bhūriśravas, eines Kriegers auf Kaurava-Seite; in Kap.42 als „der tapfere Saumadatti“ unter den ersten Kämpfern genannt."},{"term":"Saurabheyī","category":"Person","definition":"Eine der fünf Apsaras, die mit Vargā zusammen in Krokodile verwandelt wurden."},{"term":"Sauvīra","desc":"Königreich Jayadrathas und seiner Brüder, im Nordwesten gelegen; von hier stammt Jayadratha, der spätere Entführer Draupadīs und Gegner der Pāṇḍavas bei Kurukṣetra."},{"term":"Savitṛ","category":"Person","definition":"Einer der zwölf Āditya-Götter, Gott der anregenden Sonnenkraft."},{"term":"Savyasācin","category":"Epitheton","definition":"Der auch mit der linken Hand Schießende - Beiname Arjunas."},{"term":"Sañjaya","expl":"Wagenlenker und enger Berater Dhṛtarāṣṭras, Sohn des Gavalgaṇa; vermittelt hier zwischen Dhṛtarāṣṭra und dem verstoßenen Vidura und wird später der Berichterstatter des Kriegsgeschehens an den blinden König."},{"term":"Saṃbhala","desc":"Das Dorf, eine glückverheißende Brahmanensiedlung, in der laut Prophezeiung der künftige Kalki geboren werden wird (Vanaparva)."},{"term":"Saṃgrāmajit","category":"Person","definition":"Ein Sohn Dhṛtarāṣṭras; im Go-haraṇaparva einer der Kaurava-Krieger, die Karṇa zu Hilfe eilen wollen."},{"term":"Saṃjaya","category":"Person","definition":"Sūta, Sohn des Gavalgaṇa; späterer Wagenlenker und Berichterstatter Dhṛtarāṣṭras während des großen Krieges."},{"term":"Saṃjīvanī","category":"Begriff","definition":"Die von Śukra (Uśanas) beherrschte, Bṛhaspati unbekannte Wiederbelebungskunst, mit der im Kampf gefallene Asuras (und später Kaca) ins Leben zurückgerufen werden."},{"term":"Saṃkarṣaṇa","category":"Epitheton","definition":"Beiname Balarāmas (Halāyudha), Kṛṣṇas älterem Bruder."},{"term":"Saṃpāti","desc":"Bruder Jaṭāyus, ebenfalls ein Geierkönig; wird im weiteren Verlauf des Rāmāyaṇa den Affen den Aufenthaltsort Sītās verraten."},{"term":"Saṃvaraṇa","category":"Person (König)","definition":"Sohn Ṛkṣas; sein Reich wurde durch Hungersnot, Seuchen und die Angriffe des Pāñcālya-Fürsten fast vernichtet; floh mit den Bhāratas an den Sindhu, kehrte mit Hilfe des Sehers Vasiṣṭha zurück und heiratete Tapatī, die Tochter der Sonne, Mutter Kurus (Adh.89). Seine Werbung um Tapatī wird ab Adh.160 ausführlich erzählt: ein frommer, sonnenverehrender Kuru-König, der sich nach einer Begegnung auf der Jagd unsterblich in die verschwindende Tapatī verliebt."},{"term":"Saṃvarta","category":"Person","definition":"Weiser aus der Erzählung von Saṃvarta und Marutta im Aśvamedhika-Parva."},{"term":"Saṃvartaka","desc":"Das Feuer der kosmischen Auflösung am Ende eines Weltzeitalters; im Vanaparva Vergleichsbild für das verzehrende Feuer aus dem Mund des Dhundhu."},{"term":"Saṃyamana","desc":"Der Palast des Totengottes Yama im Süden, das \"Haus der Bezwingung\", wo die Verstorbenen gerichtet werden."},{"term":"Saṃyāti","category":"Person (König)","definition":"Nachkomme Prācinvāns in der Paurava-Genealogie (Adh.90)."},{"term":"Saṃśaptaka","desc":"'Die durch Eid Verbundenen' - eine Gruppe von Kriegern (hier von den Daityas als Rākṣasa-Verkörperungen eingesetzt), die schwören, im Kampf zu siegen oder zu sterben; sie spielen später in der Kurukṣetra-Schlacht eine zentrale Rolle als Arjunas hartnäckigste Gegner, die ihn wiederholt vom Hauptschlachtfeld abzulenken versuchen."},{"term":"Senābindu","category":"Person","definition":"Ein Krieger im Heer der Pāṇḍavas, der in Kap.20 neben Vārdhakṣemi, Citrasena und Suvarcas Droṇa angreift."},{"term":"Siddha","category":"Wesen","definition":"Klasse halbgöttlicher, durch Askese vollkommener Wesen, oft zusammen mit Ṛṣis und Cāraṇas genannt."},{"term":"Sindhu","desc":"Der Indus; großer Strom im Nordwesten, mehrfach als heiliger Badeplatz genannt."},{"term":"Sinīvālī","desc":"Altvedische Göttin der Mondphasen, insbesondere des unsichtbar-feinen Neumondtages; in der Mahābhārata-Genealogie als dritte Tochter des Aṅgiras genannt."},{"term":"Siṃhala","category":"Ort","definition":"Die Insel Laṅkā (Ceylon/Sri Lanka) und ihre Bewohner, bekannt für Perlen, Beryll und andere Meereskostbarkeiten."},{"term":"Siṃhasena","category":"Person","definition":"Tapferer Wagenkämpfer auf Seiten der Pāṇḍavas; durchbohrt in Droṇaparva Kap.15 Droṇa, wird aber daraufhin von ihm enthauptet. In Droṇaparva Kap.22 zudem ein Pāñcālya-Krieger gleichen Namens, Sohn des Gopati — offenbar ein Namensvetter, da der hier (Kap.15) genannte Siṃhasena bereits enthauptet wurde."},{"term":"Skanda","expl":"Der Kriegsgott, auch Kārttikeya oder Kumāra genannt, Sohn Agnis (bzw. Śivas) und Anführer der Götterheere; hier als eine der 108 Namen bzw. mitgenannten Gottheiten im Sūrya-Hymnus aufgeführt."},{"term":"Snātaka","category":"Begriff","note":"Ein Brahmane, der sein vedisches Studium abgeschlossen und das rituelle Abschlussbad genommen hat."},{"term":"Soma","category":"Gottheit","definition":"Der Mond; entsteht beim Quirlen des Milchozeans aus dem Ozean."},{"term":"Somadatta","category":"Person","definition":"Kuru-Ältester, der bei der Ankunft der Pāṇḍava-Familie in Hāstinapura zugegen ist (Adh.117); Vater des Bhūriśravas. Nach Kap.119 wurde er einst bei der Svayaṃvara der Devakī von Śini im Ringkampf besiegt und vor Tausenden Königen gedemütigt; er erwirkte daraufhin von Śiva den Wunsch, dass sein Sohn dereinst Śinis Enkel ebenso niederwerfen möge, was sich in dem Kampf des Bhūriśravas gegen Sātyaki erfüllte. In Kap.131 fordert er Sātyaki wegen der Tötung seines Sohnes Bhūriśravas heraus; beide schwören sich den Tod, im Zweikampf wird Somadatta schwer verwundet und aus dem Kampf getragen. Stirbt in Kap.132, als Bhīmasenas Eisenkeule und Sātyakis Pfeil ihn gleichzeitig treffen. In Kap.137 liefert er sich - in einer mit Kap.132 konkurrierenden, weitgehend eigenständigen zweiten Fassung seines Todes - erneut ein langes Pfeilduell mit Sātyaki, das mit seinem (zweiten) Tod endet, wobei erneut Bhīmasenas Keule und Sātyakis Pfeil ihn treffen."},{"term":"Somaka","category":"Person","definition":"König, der seinen Sohn Jantu opferte, um hundert Söhne zu erlangen."},{"term":"Somaśravāyaṇa","category":"Ort","definition":"Eine an der Gaṅgā gelegene Pilgerstätte (Tīrtha), die die Pāṇḍavas in Adh.158 auf dem Weg nach Pāñcāla erreichen."},{"term":"Stambamitra","category":"Person","definition":"Einer der vier Śārṅgaka-Söhne Mandapālas und Jaritās."},{"term":"Sthāṇu","category":"Person","definition":"Wörtlich der Feststehende - Beiname Śivas."},{"term":"Sthūlakeśa","category":"Person","definition":"Weiser, der die ausgesetzte Pramadvarā findet, aufzieht und benennt."},{"term":"Sthūṇa","category":"Wesen","definition":"Ein Yakṣa, der aus Wohlwollen Drupadas Tochter (die spätere Śikhaṇḍin) in einen Mann verwandelte."},{"term":"Strīparva","category":"Werkteil","definition":"Das elfte Parva: die Totenklage der Frauen."},{"term":"Subala","category":"Person","definition":"König von Gāndhāra, Vater Śakunis und Gāndhārīs."},{"term":"Subhadrā","category":"Person","definition":"Schwester Kṛṣṇas und Balarāmas, von Arjuna zur Frau genommen, Mutter Abhimanyus."},{"term":"Subāhu","category":"König","definition":"König der Cedis, zu dessen Land die Karawane unterwegs ist, die Damayantī im Wald trifft. Daneben (Kap.92) ein gleichnamiger Sohn Dhṛtarāṣṭras, von Bhīmasena in der Schlacht des vierten Tages erschlagen; ein weiterer, davon verschiedener Trigarta-Krieger dieses Namens kämpft in Droṇaparva Kap.17 an Suśarmans Seite gegen Arjuna, der ihm dort den Handschutz zerschneidet."},{"term":"Sucitra","category":"Person","definition":"Vater eines ungenannten Prinzen ('Saucitti'), der auf Pāṇḍava-Seite mit weißfüßigen Pferden kämpft und sich Dhṛṣṭadyumna anschließt (Droṇaparva Kap.22)."},{"term":"Sudakṣiṇa","category":"Person","definition":"König der Kambojas, Verbündeter der Kauravas; kämpft in Kap.43 gegen Śrutakarman."},{"term":"Sudarśana","category":"Begriff","definition":"(1) Viṣṇus Diskus-Waffe (cakra), erscheint auf bloßen Gedanken hin und entscheidet die Schlacht gegen die Asuras. (2) In Kap.94 ein anderer, gleichnamiger König (Sohn/Enkel eines Landesherrn) auf Kaurava-Seite, kunstvoller Kämpfer in goldener Rüstung, der Sātyaki im Zweikampf aufhält, ihn schwer verwundet, aber schließlich selbst von Sātyaki enthauptet wird."},{"term":"Sudeva","desc":"Brahmane, Freund von Damayantīs Bruder, von König Bhīma ausgesandt; erkennt Damayantī am Hof der Cedis wieder und berichtet ihre Geschichte."},{"term":"Sudeṣṇā","category":"Person","definition":"Gemahlin König Virāṭas, eine Fürstin aus dem Volk der Kekayas; nimmt die als Sairandhrī verkleidete Draupadī an ihrem Hof auf."},{"term":"Sudhanus","category":"Person","definition":"Trigarta-Krieger; greift in Droṇaparva Kap.17 Arjuna an, wird aber von ihm entwaffnet, seiner Pferde beraubt und schließlich enthauptet."},{"term":"Sudharman","category":"Person","definition":"Trigarta-Krieger; greift in Droṇaparva Kap.17 zusammen mit Suśarman, Suratha, Sudhanus und Subāhu Arjuna an."},{"term":"Sudharmā","category":"Ort","definition":"Die Versammlungshalle der Vṛṣṇis und Andhakas in Dvārakā."},{"term":"Sudāman","desc":"König von Daśārṇa, Vater der Königinmutter von Cedi und von Damayantīs Mutter."},{"term":"Sughoṣa / Maṇipuṣpaka","category":"Sache","definition":"Die Muschelhörner Nakulas und Sahadevas, in Kap.47 beim Beginn des zweiten Kampftags geblasen."},{"term":"Sugrīva","category":"Person/Tier","definition":"Eines der vier Pferde Kṛṣṇas; nicht zu verwechseln mit dem gleichnamigen Affenkönig aus dem Rāmāyaṇa."},{"term":"Suhma","category":"Volk/Ort","definition":"Volk/Königreich im Osten, von Pāṇḍu unterworfen (Adh.105)."},{"term":"Suhotra","category":"Person (König)","definition":"Sohn Bhumanyus, mächtiger Herrscher der ganzen Erde, Vater Ajamīḍhas, Sumīḍhas und Purumīḍhas (Adh.89)."},{"term":"Sujātā","desc":"Tochter Uddālakas, Gattin Kahoḍas, Mutter des Aṣṭāvakra."},{"term":"Sukanyā","category":"Person","definition":"Gattin Cyavanas, Mutter Pramatis; ihre eigene Geschichte (Cyavanas Verjüngung durch die Aśvins) wird im Vana-parva ausführlich erzählt."},{"term":"Sukṣatra","category":"Person","definition":"Sohn des Herrschers von Kosala, kämpft auf Pāṇḍava-Seite (Droṇaparva Kap.22)."},{"term":"Sumitrā","desc":"Dritte Gemahlin Daśarathas, Mutter der Zwillinge Lakṣmaṇa und Śatrughna."},{"term":"Sunandā","desc":"Tochter der Königinmutter von Cedi; wird Damayantīs Gefährtin am Hof des Königs Subāhu."},{"term":"Sunda","category":"Person","definition":"Ein Dämon (Asura), Bruder Upasundas, der mit ihm gemeinsam ein Reich beherrschte, bis beide sich wegen Tilottamā gegenseitig erschlugen."},{"term":"Sunāman","category":"Person","definition":"Bruder Kaṃsas, tapferer Herrscher über ein Akṣauhiṇī-Heer und König von Śūrasena, von Kṛṣṇa und Baladeva im Kampf vernichtet; in Droṇaparva Kap.10 genannt."},{"term":"Sunītha","category":"Person","definition":"Fromme Gestalt, zusammen mit Asita und Ārtimant genannt als Schutz gegen Schlangenfurcht, wenn man sich ihrer erinnert (Adhyāya 53); nicht weiter im Text erläutert."},{"term":"Suparṇa","category":"Gottheit","definition":"Epitheton Garuḍas („Schönbeflügelter“). In Kap.40 daneben auch als Name einer nach dem Adler benannten Heeresformation (Vyūha) verwendet."},{"term":"Suparṇavyūha","category":"Begriff","definition":"Die 'Garuḍa-Formation' (Suparṇa = Beiname Garuḍas); Heeresaufstellung in Vogelgestalt, von Droṇa in Droṇaparva Kap.19 gegen Yudhiṣṭhira gebildet, mit Droṇa als Mund, Duryodhana als Haupt, Bhagadatta auf seinem Elefanten im Zentrum u.a."},{"term":"Supratardana","category":"Person (König)","definition":"Legendärer König, hier unter den himmlischen Zuschauern der Schlacht zwischen Bhīṣma und Arjuna genannt."},{"term":"Supratīka","category":"Wesen","definition":"Kampfelefant des Bhagadatta. Daneben auch Name eines Weisen, der von seinem Bruder Vibhāvasu zum Elefanten verflucht wurde (Adhyāya 25) – möglicherweise mit dem gleichnamigen Elefanten Bhagadattas identisch bzw. dessen mythischer Ursprung."},{"term":"Surabhi","category":"Gottheit","definition":"Die Wunschkuh, Mutter der Rohiṇī (Ahnfrau der Kühe) und der Gandharvī (Ahnfrau der Pferde)."},{"term":"Suratha","category":"Person","definition":"Trigarta-Krieger; greift in Droṇaparva Kap.17 zusammen mit Suśarman, Sudharman, Sudhanus und Subāhu Arjuna an."},{"term":"Surā","category":"Gottheit","definition":"Weingöttin; entsteht beim Quirlen des Milchozeans."},{"term":"Sutasoma","category":"Person","definition":"Sohn Bhīmas und Draupadīs, einer der fünf Upapāṇḍavas. In Kapitel 143 wird sein strahlender Wagen von dem wagenlosen Prativindhya bestiegen, der von dort aus den Kampf gegen Duḥśāsana fortsetzt."},{"term":"Suvarcas","category":"Person","definition":"Kauravischer Krieger, in Kap.47 von Abhimanyu erschlagen (siehe auch [[Candraketu]])."},{"term":"Suvarṇavarman","category":"Person","definition":"Herrscher von Kāśi, Vater Vapuṣṭamās, die er nach Prüfung dem Kuru-König Janamejaya zur Frau gibt."},{"term":"Suyodhana","category":"Epitheton","definition":"‚Der gut Kämpfende' – von Gegnern ironisch gebrauchter Beiname Duryodhanas (‚der schlecht Kämpfende'), ab Adh.134 mehrfach verwendet."},{"term":"Suśarman","category":"Person","definition":"Ein König/Krieger auf Kaurava-Seite (in Kap.43 als „Menschentiger“ bezeichnet), Herrscher von Prasthala; kämpft gegen Cekitāna, später gegen die Pāṇḍavas in Kap.71 auf dem linken Flügel der Krauñca-Formation; in Droṇaparva Kap.16 legt er, von Arjuna wiederholt gedemütigt, zusammen mit seinen vier Brüdern und zahlreichen Verbündeten den Saṃśaptaka-Eid ab, Arjuna zu töten oder selbst zu fallen, und lockt ihn so vom Schutz Yudhiṣṭhiras fort."},{"term":"Suśobhanā","desc":"Die Froschprinzessin, Tochter des Froschkönigs Āyu, die vom Ikṣvāku-König Parikṣit unter der Bedingung geheiratet wird, ihr niemals Wasser zu zeigen; nach dem Bruch dieser Bedingung Mutter der Könige Śala, Dala und Bala (Vanaparva)."},{"term":"Suṣeṇa","category":"Person","definition":"Ein Kaurava-Krieger, greift in Kap.36 Abhimanyu an und wird von ihm getötet. Erscheint - trotz seines Todes durch Abhimanyu in Kap.36 - in Droṇaparva Kap.102 erneut unter den Bhīmasena umringenden Kriegern und wird dort zusammen mit Kuṇḍabhedin und Dīrghanetra von Bhīmasena getötet."},{"term":"Svadhā","category":"Begriff","definition":"Rituelle Opferformel/-ruf für Gaben an die Ahnen (Pitṛs), Gegenstück zu Svāhā für die Götter."},{"term":"Svarbhānu","category":"Wesen","definition":"Anderer Name für Rāhu, den enthaupteten Dānava, der periodisch Sonne und Mond verschlingt (Finsternis-Mythos); in Kap.97 als Vergleich für Bhīṣmas Vorstoß gegen Arjuna genannt (siehe [[Rāhu]])."},{"term":"Svastyayana","category":"Begriff","definition":"Ein großes Segens-/Wohlergehensritual; das Mahābhārata wird in Adhyāya 56 mit einem solchen Ritual verglichen."},{"term":"Svayaṃvara","category":"Konzept/Ritual","definition":"Eine Brautwahl-Zeremonie, bei der eine Königstochter unter versammelten Bewerbern selbst ihren Gatten wählt; das Svayaṃvara Draupadīs wird ab Adh.153 angekündigt."},{"term":"Svāhā","category":"Begriff","definition":"Rituelle Opferformel/-ruf, mit dem eine Gabe den Göttern übergeben wird (Feueropfer); personifiziert auch als Göttin (Gattin Agnis)."},{"term":"Söhne Dhṛtarāṣṭras in Kap.73","category":"Gruppe","definition":"Sammeleintrag für in Kap.73 erstmals namentlich genannte Söhne Dhṛtarāṣṭras, die zusammen mit Duḥśāsana, Duḥsaha, Jaya, Vikarṇa, Citrasena, Sudarśana und Karṇa Bhīmasena entgegentreten: Durviṣaha, Durmada, Jayatsena, Cārucitra, Suvarman, Duṣkarṇa."},{"term":"Söhne Dhṛtarāṣṭras in Kap.84","category":"Gruppe","definition":"Acht Söhne Dhṛtarāṣṭras, die in Kap.84 von Bhīmasena im Kampf getötet werden: zunächst Sunābha (durch Bhīṣmas Wagenlenker-Tötung entstandene Verwirrung ausnutzend), dann die sieben Brüder Ādityaketu, Bahvāśin, Kuṇḍadhāra, Mahodara, Aparājita, Paṇḍitaka und der schwer zu bezwingende Viśālākṣa, die gemeinsam Bhīma angreifen, um ihren Bruder zu rächen, und nacheinander von ihm erschlagen werden - Erfüllung von Bhīmas Schwur aus der Würfelspiel-Versammlungshalle."},{"term":"Sādhya","category":"Begriff","definition":"Eine Klasse vedischer Gottheiten."},{"term":"Sādhyas","category":"Göttergruppe","definition":"Eine Klasse himmlischer Wesen, oft zusammen mit den Vasus, Rudras, Ādityas u.a. als Verehrer im Götterhimmel genannt."},{"term":"Sāmba","category":"Person","definition":"Ein Sohn Kṛṣṇas."},{"term":"Sāraṇa","category":"Person","definition":"Ein Bruder Kṛṣṇas und Subhadrās."},{"term":"Sārisṛkva","category":"Person","definition":"Einer der vier Śārṅgaka-Söhne Mandapālas und Jaritās."},{"term":"Sārvabhauma","category":"Person (König)","definition":"Nachkomme in der Paurava-Genealogie, eroberte eine Kaikeyī-Prinzessin (Adh.90)."},{"term":"Sātvata","category":"Person","definition":"Beiname für Angehörige des Sātvata-Zweigs der Yadus/Vṛṣṇis - meist Kṛṣṇa, in Kap.86 aber auch für Kṛtavarman (V.2) und vermutlich Sātyaki (V.81) verwendet."},{"term":"Sātvatī","category":"Epitheton","definition":"'Die Sātvatī', Beiname Subhadrās als Angehörige des Sātvata-/Yadu-Geschlechts; 'sātvatīputra' ('Sohn der Sātvatī') bezeichnet in Kap.38 Abhimanyu."},{"term":"Sātyaki","category":"Person","definition":"Sohn des Satyaka, Enkel des Hṛdika; waffenkundiger Vṛṣṇi-Krieger, Kṛṣṇa (Nārāyaṇa) ergeben, auf Seiten der Pāṇḍavas. Auch Yuyudhāna genannt. Nach Adhyāya 61 aus der Schar der Maruts geboren (Aṃśāvataraṇa). Als Enkel des Śini auch „Śaineya“ genannt (Kap.72-73); liefert sich in Kap.73 ein langes Duell mit Droṇa, in dem Droṇa selbst seine übermenschliche Waffenkunst anerkennt. Liefert sich in Kap.122, nachdem er von Karṇa wagenlos gemacht wurde, auf einem eigens von Dāruka bereitgestellten, Kṛṣṇas eigenem gleichenden Wagen einen von allen Welten bestaunten Zweikampf mit Karṇa und macht diesen seinerseits wagenlos, verschont dabei aber, einem alten Schwur Bhīmasenas folgend, Dhṛtarāṣṭras Söhne. Kehrt in Kap.124, wagenlos und von Pfeilen zerschnitten, zusammen mit Bhīmasena zu Yudhiṣṭhira zurück und wird von diesem in einer Lobrede über seinen Sieg (u.a. über Kṛtavarman/Hārdikya) begrüßt und umarmt. In Kap.131 duelliert er sich mit Somadatta, der ihn wegen der Tötung von dessen Sohn Bhūriśravas der Ehrlosigkeit bezichtigt; beide schwören sich gegenseitig den Tod. In Kap.132 versetzt er, zusammen mit Bhīmasenas Keulenschlag, Somadatta den tödlichen Treffer. In Kap.137 liefert er sich - in einer zweiten, mit Kap.132 konkurrierenden Fassung - erneut ein langes Pfeilduell mit Somadatta, das mit dessen (zweitem) Tod endet. In Kapitel 141 tötet er im Zweikampf Bhūri mit einem Speerwurf in die Brust, wird danach jedoch selbst von Aśvatthāman bedrängt. In Kap.145 eilt er dem von Droṇa und dessen Beschützern bedrängten Dhṛṣṭadyumna zu Hilfe und liefert sich ein langes Pfeilduell mit Karṇa, in dem er dessen Sohn Vṛṣasena schwer verwundet; wird danach von Duryodhana auf Karṇas Rat mit einer großen Streitmacht unter Śakuni umringt. In Kap.146 wird er von einer großen Übermacht Duryodhanas umringt und liefert dort ein blutiges Gemetzel, ehe er Duryodhana selbst im Duell besiegt: Er tötet dessen Pferde und Wagenlenker und zerschlägt seinen Bogen, sodass Duryodhana chariotlos und waffenlos auf Kṛtavarmans Wagen fliehen muss. In Adh.148 wird er von Arjuna dazu bestimmt, Ghaṭotkaca im nächtlichen Zweikampf gegen Karṇa als Rückendecker zur Seite zu stehen. In Kap.157 fragt er Kṛṣṇa unumwunden, weshalb Karṇa die unfehlbare Śakti nicht auf Arjuna losgelassen habe; Kṛṣṇa offenbart ihm daraufhin, dass er selbst Karṇa durch stetiges Beschützen Arjunas und gezielte Verwirrung dazu gebracht habe, die Waffe stattdessen an Ghaṭotkaca zu verschwenden."},{"term":"Sātyaki / Yuyudhāna","category":"Person","definition":"Vṛṣṇi-Krieger, enger Verbündeter der Pāṇḍavas und Kṛṣṇas."},{"term":"Sāvitrī","category":"Person","definition":"Vorbildhafte Gattin, die durch ihre Klugheit und Hingabe ihren Gemahl Satyavat dem Tod (Yama) wieder abrang; Titelfigur einer bekannten Nebenerzählung im Āraṇyakaparva."},{"term":"Sāṃyātrika","category":"Person","definition":"Krieger auf Kaurava-Seite; in Droṇaparva Kap.19 auf dem Scheitel der von Droṇa gebildeten Garuḍa-Heeresformation genannt (genaue Namensabgrenzung zu 'sabhaḥ' unsicher [?])."},{"term":"Sītā","desc":"Gattin Rāmas; von Rāvaṇa entführt und nach dessen Tod durch Rāma befreit, wie Hanumān in seiner Erzählung berichtet."},{"term":"Sūrya","category":"Gottheit","definition":"Sonnengott (auch Arka, Bhāskara, Tapana, Divākara); von Kuntī mit Durvāsas' Mantra herbeigerufen, zeugt er mit ihr Karṇa, ohne ihre Jungfräulichkeit zu nehmen (Adh.104)."},{"term":"Sūryabhāsa","category":"Person","definition":"Kauravischer Krieger, in Kap.47 von Abhimanyu erschlagen (siehe auch [[Candraketu]])."},{"term":"Sūryadatta","category":"Person","definition":"Ein Krieger im Heer Virāṭas."},{"term":"Sūta","category":"Amt/Stand","definition":"Wagenlenker und berufsmäßiger Erzähler von Geschichte und Genealogie; Ugraśravas trägt diesen Titel."},{"term":"Sṛñjaya","category":"Volk/Verbündete","note":"Ein mit den Pāṇḍavas verbündetes Volk bzw. dessen Fürstengeschlecht, wiederholt als Bundesgenossen im Krieg genannt. Daneben auch Name eines individuellen Königs, Sohn des Śvitya: in Droṇaparva Kap.49 (Ṣoḍaśarājakīya) verliert dieser Sṛñjaya seinen Sohn Suvarṇaṣṭhīvin und wird von Nārada mit der Erzählung vom Ursprung des Todes und der sechzehn Könige getröstet; sein Sohn wird ihm am Ende zurückgegeben — nicht identisch mit dem verbündeten Volk/Fürstengeschlecht."},{"term":"Takṣaka","category":"Wesen","definition":"Schlangenkönig (Sohn der Kadrū), der Uttaṅkas Ohrringe raubt und später König Parikṣit tötet; Ziel von Janamejayas Schlangenopfer."},{"term":"Tantipāla","category":"Person","definition":"Sahadevas Deckname als Viehzähler am Hof Virāṭas (auch Ariṣṭanemi genannt)."},{"term":"Tapana (Wächter)","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Tapatī","category":"Person","definition":"Tochter des Sonnengottes (Sūrya), Gemahlin Saṃvaraṇas, Mutter Kurus (Adh.89). Ab Adh.160 ausführlich erzählt: die makellos schöne Sonnentochter, um deren Gunst König Saṃvaraṇa wirbt, nachdem er ihr auf der Jagd begegnet ist; Ahnfrau der Kuru-Linie, worauf der Beiname ‚Tāpatya' für die Pāṇḍavas zurückgeht."},{"term":"Taṃsu","category":"Person (König)","definition":"Sohn Matinaras, eroberte die Erde, Vater des Ilina (Adh.89)."},{"term":"Tilottamā","category":"Person","definition":"Eine von den Göttern kunstvoll erschaffene Apsaras, um deren willen die Dämonenbrüder Sunda und Upasunda sich gegenseitig erschlugen."},{"term":"Timi","category":"Sache","definition":"Ein sagenhafter, gewaltiger Meeresbewohner (Walfisch/Seeungeheuer); in Droṇaparva Kap.8 als Vergleichsbild in Dhṛtarāṣṭras Klage verwendet ('wie ein Timi von kleinen Fischen')."},{"term":"Traiyambaka","category":"Waffe","definition":"Die Waffe des 'Dreiäugigen' (Tryambaka/Śiva), auch Pāśupata-Waffe genannt; in Droṇaparva Kap.5 von Droṇa unter den ihm bekannten Waffen genannt."},{"term":"Trasadasyu","desc":"Sohn des Purukutsa, König aus dem Ikṣvāku-Geschlecht, von großem Reichtum; letzter der drei von Agastya erfolglos um Reichtum gebetenen Könige."},{"term":"Trigarta","category":"Ort/Volk","definition":"Ein Königreich/Volk, durch dessen Gebiet die Pāṇḍavas in Adh.144 auf ihrer Wanderung ziehen."},{"term":"Trijaṭā","desc":"Rākṣasī unter Sītās Wächterinnen in Laṅkā, dharmakundig und freundlich; tröstet Sītā mit dem Bericht eines Traumes, der Rāvaṇas Untergang verheißt."},{"term":"Trita","category":"Wesen","definition":"Vedische Gottheit/Weiser (Trita Āptya); hier zusammen mit Aurva als Vergleichsbild für Glanz angeführt."},{"term":"Triviṣṭapa","category":"Ort","definition":"Bezeichnung für den Himmel bzw. die Götterwelt."},{"term":"Tryambaka","category":"Epitheton","definition":"'Der Dreiäugige', Beiname Śivas; in Droṇaparva Kap.3 erinnert Karṇa an Arjunas übermenschlichen Kampf mit Tryambaka (Anspielung auf die Kirāta-Episode und den Erwerb des Pāśupata-Pfeils, vgl. Vanaparva)."},{"term":"Tumburu","category":"Person","definition":"Gandharva-Musiker, der bei Arjunas Geburt zusammen mit anderen Gandharvas voransingt (Adh.114)."},{"term":"Turvasu","category":"Person","definition":"Sohn Yayātis und der Devayānī, Bruder Yadus; lehnt es ab, dem Vater seine Jugend zu leihen."},{"term":"Tuṇḍikera","category":"Volk","definition":"Volk, das zusammen mit den Mālavas in Droṇaparva Kap.16 mit dreißigtausend Wagen dem Saṃśaptaka-Eid der Trigartas gegen Arjuna beitritt."},{"term":"Tuṣāra","category":"Volk","definition":"Ein nordwestliches Volk (Tocharer/Tuṣāras), kämpft in Kap.71 zusammen mit Yavanas und Śakas auf dem rechten Flügel der Krauñca-Formation."},{"term":"Tvaṣṭṛ","category":"Person","definition":"Einer der zwölf Ādityas, der göttliche Schmied und Gestalter."},{"term":"Tvāṣṭra","category":"Waffe","definition":"Nach dem Gott Tvaṣṭṛ benannte Astra-Waffe, 'Vernichterin feindlicher Scharen'; von Arjuna in Droṇaparva Kap.18 gegen die Nārāyaṇa-Krieger eingesetzt, erzeugt tausendfache Scheingestalten des Schützen, die die Feinde zu gegenseitigem Erschlagen verwirren."},{"term":"Tāpatya","category":"Epitheton","definition":"‚Nachkomme der Tapatī' – Beiname Arjunas (und der Kuru-Dynastie), hergeleitet von der Sonnentochter Tapatī, Urahnin durch ihren Sohn Kuru."},{"term":"Tāraka","category":"Ereignis/Dämon","note":"Ein Dānava/Daitya, gegen den einst ein großer Kampf der Götter (der „Tāraka-Kampf“) stattfand; hier als knapper mythologischer Verweis Varuṇas erwähnt."},{"term":"Tārkṣya","category":"Gottheit","definition":"Ein weiteres Epitheton Garuḍas."},{"term":"Tārā","desc":"Gattin Vālins, kluge Affenkönigin, die ihren Mann vor dem Kampf gegen Sugrīva vergeblich zu warnen versucht."},{"term":"Uccaiḥśravas","category":"Wesen","definition":"Wunderbares weißes Pferd, beim Quirlen des Milchozeans (Samudra-Manthana) entstanden; Gegenstand der Wette zwischen Kadrū und Vinatā um die Farbe seines Schweifs."},{"term":"Uddhava","category":"Person","definition":"Ein weiser, ruhmreicher Vṛṣṇi und unmittelbarer Schüler Bṛhaspatis."},{"term":"Uddālaka","category":"Person","definition":"Weiser, dessen Erzählung im Āraṇyaka-Parva berichtet wird."},{"term":"Udyogaparva","category":"Werkteil","definition":"Das fünfte Parva: die Kriegsvorbereitungen."},{"term":"Udīcya","category":"Volk","definition":"'Nördliche', Volk/Sammelbezeichnung, das in Kap.114 unter den Bhīṣma treu bleibenden Völkern genannt wird."},{"term":"Ugrasena","category":"Person","definition":"König der Vṛṣṇis, Vater Kaṃsas und Großvater bzw. Oberhaupt der Yādava-Sippe."},{"term":"Ugraśravas","category":"Person","definition":"Sohn des Lomaharṣaṇa, der Sūta, der im Naimiṣa-Wald die Rahmenerzählung des Mahābhārata vorträgt."},{"term":"Ulūka","category":"Person","definition":"Bote, den Duryodhana vor der Schlacht zu den Pāṇḍavas sandte. Daneben auch Name eines der neun namentlich genannten Amṛta-Wächter, die Garuḍa im Kampf besiegt (Adhyāya 28) – nicht identisch mit dem gleichnamigen Boten. Sohn Śakunis; kämpft in Kap.146 an der Seite seines Vaters gegen Arjuna und Kṛṣṇa (die er ebenfalls verwundet), nachdem dieser auf seinen Wagen übergewechselt ist, wird aber gemeinsam mit ihm von Arjuna zurückgeschlagen."},{"term":"Ulūpī","category":"Person","definition":"Tochter des Schlangenkönigs (Nāga) Kauravya, die Arjuna während seines Waldaufenthalts in ihren Unterwasserpalast entführt und um seine Liebe bittet."},{"term":"Umā","category":"Göttin","definition":"Gemahlin Śivas (Pārvatī), Tochter des Bergkönigs Himavat; in Adh.178 als Vergleichsbild für Draupadī unter den Königen angeführt."},{"term":"Upakīcaka","category":"Person","definition":"Sammelbezeichnung für die (hundertfünf) jüngeren Brüder bzw. Verwandten Kīcakas, die nach dessen Tod Rache an Draupadī nehmen wollen und von Bhīma erschlagen werden."},{"term":"Upamanyu","category":"Person","definition":"Schüler Dhaumyas, der durch Gehorsam gegenüber seinem Lehrer (auch nach Erblindung) von den Aśvins geheilt wird."},{"term":"Upaplavya","category":"Ort","definition":"Stadt im Reich Virāṭas, in der sich die Pāṇḍavas und ihre Verbündeten nach Ablauf des dreizehnten Exiljahres versammeln; wichtiger Schauplatz zu Beginn des Udyogaparva."},{"term":"Uparicara","category":"Person","definition":"Auch Vasu genannt; König von Cedi, durch Indras Gnade mit Luftwagen und Kranz beschenkt, Stifter des Indra-Festes; Vater von Bṛhadratha, Matsya (dem Fischkönig) u.a., sowie durch den verirrten Samen Urgroßvater Satyavatīs."},{"term":"Upasunda","category":"Person","definition":"Ein Dämon (Asura), Bruder Sundas, mit dem er sich wegen der Apsaras Tilottamā im Streit gegenseitig tötete."},{"term":"Upayāja","category":"Person","definition":"Der jüngere Bruder Yājas, ein Brahmanen-Ṛṣi; verweist Drupada in Adh.155 zunächst an seinen älteren Bruder, bevor er selbst am Opferritual mitwirkt."},{"term":"Upendra","category":"Gottheit","definition":"'Der jüngere Indra', Beiname Viṣṇus (bezieht sich auf seinen Zwergavatāra Vāmana, den jüngeren Bruder Indras)."},{"term":"Urvaśī","category":"Wesen","definition":"Apsaras (Himmelsnymphe), Geliebte des Königs Purūravas; wird hier beiläufig als Vergleichsbild angeführt."},{"term":"Utathya","category":"Person","definition":"Weiser Seher, Gatte Mamatās, älterer Bruder Bṛhaspatis; gilt als Vater des im Mutterleib gezeugten Dīrghatamas (Adh.98)."},{"term":"Utkocaka","category":"Ort","definition":"Tīrtha (Pilgerstätte) mit Dhaumyas Einsiedlerhain, wo die Pāṇḍavas ihn zum Hauspriester wählen (Adh.174)."},{"term":"Uttamaujas","category":"Person","definition":"Ein Pāṇḍava-Krieger, der zusammen mit Yudhāmanyu als Radwächter (Beschützer der Wagenräder) Arjunas eingesetzt wird (Kap.95)."},{"term":"Uttara","category":"Person","definition":"Sohn König Virāṭas, Bruder Uttarās; kämpft in Kap.43 gegen Vīrabāhu."},{"term":"Uttarakuru","category":"Ort","definition":"Mythisches nördliches Kuru-Land, Sinnbild eines paradiesischen Gegenstücks zum irdischen Kuru-Reich (Adh.102)."},{"term":"Uttarā","category":"Person","definition":"Tochter König Virāṭas, wird mit Abhimanyu vermählt, Mutter Parikṣits."},{"term":"Uttarāyaṇa / Dakṣiṇāyana","category":"Konzept","definition":"Die Wendung der Sonne nach Norden (uttarāyaṇa, als günstiger Zeitpunkt zum Sterben geltend) bzw. nach Süden (dakṣiṇāyana); Bhīṣma hält kraft seines Gelübdes, den Zeitpunkt seines Todes selbst zu wählen, nach seinem Fall in Kap.114 seinen Lebensatem zurück, bis die Sonnenwende nach Norden eintritt."},{"term":"Uttaṅka","category":"Person","definition":"Schüler, dessen Erhabenheit im Pauṣya-Parva geschildert wird; berühmt für seine Ohrringjagd."},{"term":"Uśanas","desc":"Auch Śukra genannt, der Lehrmeister der Daityas; neben Bṛhaspati einer der beiden traditionellen Verkünder der Staatskunst (nīti)."},{"term":"Uśīnara","category":"Person (König)","definition":"Königlicher Weise, Vater der Jinavatī (Adh.93) und, in anderer Überlieferung, auch Vater König Śibis."},{"term":"Vadhryaśva","desc":"Legendärer König, von Agastya und Śrutarvan um Reichtum gebeten; ebenfalls mit ausgeglichenem Staatshaushalt."},{"term":"Vadhusarā","category":"Ort","definition":"Fluss, der der Erzählung nach aus den Tränen Pulomās entstand, als sie um den entführten/gefährdeten Cyavana weinte; von Brahmā benannt."},{"term":"Vaicitravīrya","category":"Person","definition":"Sohn des Vicitravīrya - Beiname Dhṛtarāṣṭras (und Pāṇḍus)."},{"term":"Vaidarbhī","desc":"Eine der beiden Gattinnen König Sagaras (aus Vidarbha); Mutter der sechzigtausend Söhne (aus einem Kürbis geboren)."},{"term":"Vaijayantī","category":"Begriff","definition":"Kṛṣṇas berühmte Blumengirlande; in Kap.28 die Gestalt, in die sich Bhagadattas todbringende Vaiṣṇava-Waffe verwandelt, als sie auf Kṛṣṇas Brust trifft. [Anm.: In Kap.154 trägt auch Karṇas von Indra erhaltene, unfehlbare Śakti-Waffe (die später sogenannte Vasavī-Śakti) den Namen Vaijayantī - ein von der Blumengirlande Kṛṣṇas zu unterscheidender zweiter Verwendungszweck desselben Namens.]"},{"term":"Vaikartana","category":"Epitheton","definition":"‚Sohn des Vikartana (der Sonne)' – Beiname Karṇas. [Anm.: In Kap.155 bietet Kṛṣṇa daneben eine zweite, volksetymologische Deutung an: Karṇa habe seinen Namen erhalten, weil er (utkṛtya, abschneidend) seine Rüstung abschnitt und Śakra im Tausch für die Śakti-Waffe seine Ohrringe gab.]"},{"term":"Vaikhānasa","category":"Sache","definition":"Eine Klasse weltentsagender Waldasketen bzw. Seher."},{"term":"Vaikuṇṭha","category":"Sache","definition":"Die himmlische Wohnstatt Nārāyaṇas/Viṣṇus, wo die Götter ihn um seine Herabkunft (Avatāra) bitten."},{"term":"Vainateya","category":"Person","definition":"Beiname Garuḍas als Sohn der Vinatā."},{"term":"Vaitaraṇī","category":"Ort/Beiname","definition":"Name der Gaṅgā (oder eines mit ihr identifizierten Flusses) in ihrer Funktion als für Übeltäter unüberquerbarer Fluss der Ahnenwelt; in Adh.158 genannt."},{"term":"Vaivasvata","category":"Epitheton","definition":"Sohn des Vivasvant (der Sonne) - Beiname Yamas, des Totengottes."},{"term":"Vaiśampāyana","category":"Person","definition":"Schüler Vyāsas; trug das Mahābhārata beim Schlangenopfer des Janamejaya vor."},{"term":"Vaiśaṃpāyana","desc":"Schüler des Vyāsa und Hauptrezitator des gesamten Mahābhārata, der das Epos dem König Janamejaya bei dessen Schlangenopfer vorträgt; tritt als Rahmenerzähler hier wieder unmittelbar hervor, nach dem langen eingeschobenen Bericht des Sehers Mārkaṇḍeya (Kap.179-221)."},{"term":"Vaiśravaṇa","category":"Person","definition":"Beiname des Gottes Kubera, des Herrn der Reichtümer, als Sohn des Viśravas."},{"term":"Vaiśravaṇa (Kubera)","category":"Gottheit","definition":"Gott des Reichtums, Herr der Yakṣas; sein Opfer wird als Vergleichsbild angeführt, später auch als Wohnstatt der Glücksgüter beschworen."},{"term":"Vaiśravaṇa / Kubera","category":"Gottheit","definition":"Gott des Reichtums, Herrscher der Yakṣas, Wächter der nördlichen Himmelsrichtung."},{"term":"Vaiśvānara","desc":"Verbreiteter Beiname Agnis, ‚der zu allen Menschen/Völkern Gehörige‘, das Feuer als universale, alle Wesen durchdringende Kraft; hier auch als Name eines der Söhne aus der Bhānu-Manu-Linie der Feuergenealogie."},{"term":"Vaiḍūrya","category":"Begriff","definition":"Ein Edelstein, meist mit dem Katzenauge oder Beryll identifiziert."},{"term":"Vaiṣṇava-Yajña","desc":"Ein dem Viṣṇu geweihtes großes Opfer, das laut Text dem Rājasūya an Rang gleichkommt; vor Duryodhana soll es der Überlieferung nach nur von Viṣṇu selbst vollzogen worden sein. Wird ihm vorgeschlagen, da das Rājasūya selbst ihm wegen der noch lebenden Yudhiṣṭhira und Dhṛtarāṣṭra verwehrt ist."},{"term":"Vaiṣṇavāstra","category":"Waffe","definition":"Die unfehlbare, allesvernichtende Waffe Viṣṇu-Nārāyaṇas, die dieser laut der in Kap.28 erzählten Vorgeschichte einst der Erdgöttin Dharā für ihren Sohn Naraka gab; gelangte nach Narakas Tod (durch Kṛṣṇa) an Bhagadatta, der sie am zehnten Kampftag gegen Arjuna einsetzt. Nur Kṛṣṇa selbst vermag ihre Schutzwirkung aufzuheben, was ihm Bhagadattas Tötung ermöglicht."},{"term":"Vajrabhṛt","category":"Person","definition":"Beiname Indras, wörtlich Träger des Donnerkeils (Vajra)."},{"term":"Vajrin","category":"Gottheit","definition":"Epitheton Indras („Keulen-/Donnerkeilträger“)."},{"term":"Vapuṣṭamā","category":"Person","definition":"Tochter des Kāśi-Herrschers Suvarṇavarman; wird mit König Janamejaya vermählt."},{"term":"Vargā","category":"Person","definition":"Eine Apsaras, die von einem zornigen Büßer in ein Krokodil verwandelt wurde und von Arjuna erlöst wird."},{"term":"Varuṇa","category":"Gottheit","definition":"Herr der Gewässer/des Ozeans (apāṃpati); stimmt dem Quirlen seines Reiches zu und erhält dafür einen Anteil."},{"term":"Varāha","category":"Begriff","definition":"Der Eber-Avatar Viṣṇus, der die im Ozean versunkene Erde rettet."},{"term":"Vasiṣṭha","category":"Person","definition":"Einer der großen vedischen Seher, für gezügelten Zorn bekannt; hier als Vergleichsbild angeführt."},{"term":"Vasu","category":"Begriff","definition":"Eine Klasse vedischer Gottheiten."},{"term":"Vasudeva","category":"Person","definition":"Vater Kṛṣṇas (mit Devakī) und Subhadrās; aus dem Vṛṣṇi-/Yadu-Geschlecht."},{"term":"Vasudāna","category":"Person","definition":"Kaurava-verbündeter Herrscher, bildet in Kap.47 zusammen mit Ketumān und Abhibhū die Rückendeckung von Droṇas/Bhīṣmas Heer. In Kap.89 jedoch auf Pāṇḍava-Seite verzeichnet: eilt mit Bhīmasena Ghaṭotkaca zu Hilfe - möglicherweise Namensgleichheit zweier verschiedener Personen [?]."},{"term":"Vasumanas","desc":"Legendärer tugendhafter König, häufig in Reihen vorbildlicher, durch Buße und Pilgerfahrt ruhmreicher Herrscher genannt."},{"term":"Vasumat","category":"Person (König)","definition":"König, der Yayāti in der Zwischenluft begegnet, nachdem dieser aus dem Himmel gestürzt wurde (Adh.81). Auch 'Vasumanas' genannt (Adh.87)."},{"term":"Vasus","category":"Gottheit (Gruppe)","definition":"Gruppe von acht Gottheiten, von Vasiṣṭha wegen des Diebstahls seiner Wunschkuh Nandinī verflucht, als Sterbliche geboren zu werden; vereinbaren mit Gaṅgā, als ihre Söhne geboren und sogleich ins Wasser zurückgeworfen zu werden – bis auf den achten, der am Leben bleibt (spätere Identität: Bhīṣma) (Adh.91)."},{"term":"Vasuṣeṇa","desc":"Karṇas Kindheitsname, ihm von den Brahmanen wegen seines wie aus Reichtum (vasu) bestehenden goldenen Panzers gegeben; auch als Vṛṣa bekannt."},{"term":"Vasāti","category":"Volk","definition":"Volk, das in Kap.112 zusammen mit den Abhīṣāhas, Śūrasenas und Śibis gegen Arjuna anstürmt."},{"term":"Vaṅga","category":"Ort","definition":"Ein Land im östlichen Indien, Teil von Arjunas Pilgerreise. Auch als Bezeichnung für den (ungenannten) König der Vaṅgas verwendet, der auf Kaurava-Seite kämpft und in Kap.88 mit zehntausend Elefanten Duryodhana beisteht, sich Ghaṭotkaca entgegenstellt und von diesem samt seinem Elefanten mit einem Speer getötet wird."},{"term":"Vegavat, Mahāraudra, Vidyujjihva, Pramāthin (Sammeleintrag)","category":"Wesen","definition":"Vier Rākṣasa-Krieger aus Ghaṭotkacas Gefolge, die in Kap.87 von Duryodhana mit vier Pfeilen (je einem) getötet werden."},{"term":"Vena","category":"Person","definition":"Gottloser König, Vater des Pṛthu (Vainya); von den Weisen wegen seiner schlechten Herrschaft getötet, woraufhin sie Pṛthu aus seinem Körper erschufen."},{"term":"Vetrakīya","category":"Ort/Dynastie(?)","definition":"In Adh.148 als Sitz des als schwach kritisierten Königs genannt; die genaue Bedeutung des Namens ist unsicher [?]."},{"term":"Vibhāvasu","category":"Gottheit","definition":"Epitheton Agnis („der Glanzreiche“). Daneben auch Name eines jähzornigen Weisen, der von seinem Bruder Supratīka zur Schildkröte verflucht wurde (Adhyāya 25) – nicht zu verwechseln mit dem Agni-Epitheto
