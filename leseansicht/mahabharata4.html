ntī, dort wirst du weilen (Nom.+Adv.+Nom.+Adv.+Nom.+2.Sg.Fut.)"]]],["026","eṣā devanadī puṇyā pārtha trailokyapāvanī ākāśagaṅgā rājendra tatrāplutya gamiṣyasi","Dies ist der heilige Götterfluss, Pārtha, der die drei Welten Reinigende, die Himmels-Gaṅgā, Herrscher der Könige; dort hineingetaucht, wirst du weitergehen.","",[["eṣā devanadī puṇyā pārtha trailokyapāvanī","dies ist der heilige Götterfluss, Pārtha, der die drei Welten Reinigende (Nom.+Vok.+Nom.)"],["ākāśagaṅgā rājendra tatra āplutya gamiṣyasi","die Himmels-Gaṅgā, Herrscher der Könige; dort hineingetaucht, wirst du weitergehen (Nom.+Vok.+Adv.+Abs.+2.Sg.Fut.)"]]],["027","atra snātasya te bhāvo mānuṣo vigamiṣyati gataśoko nirāyāso muktavairo bhaviṣyasi","Dort, gebadet, wird deine menschliche Natur von dir weichen; des Kummers ledig, ohne Mühsal, von aller Feindschaft befreit wirst du sein.“","",[["atra snātasya te bhāvaḥ mānuṣaḥ vigamiṣyati","dort, gebadet, wird deine menschliche Natur von dir weichen (Adv.+Gen.Part.+Gen.+Nom.+3.Sg.Fut.)"],["gataśokaḥ nirāyāsaḥ muktavairaḥ bhaviṣyasi","des Kummers ledig, ohne Mühsal, von aller Feindschaft befreit wirst du sein (Nom.Part.+Nom.+Nom.Part.+2.Sg.Fut.)"]]],["028","evaṃ bruvati devendre kauravendraṃ yudhiṣṭhiram dharmo vigrahavān sākṣād uvāca sutam ātmanaḥ","Während so der Herr der Götter zum Kaurava-Herrscher Yudhiṣṭhira sprach, sprach der Dharma selbst, verkörpert, unmittelbar zu seinem eigenen Sohn:","",[["evaṃ bruvati devendre kauravendraṃ yudhiṣṭhiram","während so der Herr der Götter zum Kaurava-Herrscher Yudhiṣṭhira sprach (Adv.+Lok.Abs.+Akk.+Akk.)"],["dharmaḥ vigrahavān sākṣāt uvāca sutam ātmanaḥ","sprach der Dharma selbst, verkörpert, unmittelbar zu seinem eigenen Sohn (Nom.+Nom.Part.+Adv.+3.Sg.Perf.+Akk.+Gen.)"]]],["029","bho bho rājan mahāprājña prīto 'smi tava putraka madbhaktyā satyavākyena kṣamayā ca damena ca","„Ho, ho, König, überaus Weiser! Erfreut bin ich über dich, mein Söhnchen, durch deine Hingabe an mich, durch dein Wort der Wahrheit, durch deine Geduld und deine Selbstbeherrschung.","",[["bho bho rājan mahāprājña prītaḥ asmi tava putraka","ho, ho, König, überaus Weiser! Erfreut bin ich über dich, mein Söhnchen (Vok.+Nom.Part.+1.Sg.Präs.+Gen.+Vok.)"],["madbhaktyā satyavākyena kṣamayā ca damena ca","durch deine Hingabe an mich, durch dein Wort der Wahrheit, durch deine Geduld und deine Selbstbeherrschung (Instr.)"]]],["030","eṣā tṛtīyā jijñāsā tava rājan kṛtā mayā na śakyase cālayituṃ svabhāvāt pārtha hetubhiḥ","Dies ist die dritte Prüfung, o König, die von mir an dir vollzogen wurde; nicht kannst du von deinem Wesen abgebracht werden, Pārtha, durch [irgendwelche] Gründe.","",[["eṣā tṛtīyā jijñāsā tava rājan kṛtā mayā","dies ist die dritte Prüfung, o König, die von mir an dir vollzogen wurde (Nom.+Nom.+Nom.+Gen.+Vok.+Nom.Part.+Instr.)"],["na śakyase cālayituṃ svabhāvāt pārtha hetubhiḥ","nicht kannst du von deinem Wesen abgebracht werden, Pārtha, durch Gründe (2.Sg.Präs.Pass.+Inf.+Abl.+Vok.+Instr.)"]]],["031","pūrvaṃ parīkṣito hi tvam āsīr dvaitavanaṃ prati araṇīsahitasyārthe tac ca nistīrṇavān asi","Zuvor wurdest du geprüft, im Dvaitavana, um des mit dem Reibholz [verbundenen Brahmanen] willen, und das hast du bestanden.","[Anm.: Bezug auf die Yakṣa-Praśna-Episode im Vanaparva, bei der Dharma in Gestalt eines Yakṣa Yudhiṣṭhira pruefte, nachdem ein Brahmane um Hilfe bei seinen im Wasser verlorenen Feuerbohr-Hoelzern (araṇī) gebeten hatte.]",[["pūrvaṃ parīkṣitaḥ hi tvam āsīḥ dvaitavanaṃ prati","zuvor wurdest du geprüft, im Dvaitavana (Adv.+Nom.Part.+Nom.+2.Sg.Impf.+Akk.)"],["araṇīsahitasya arthe tat ca nistīrṇavān asi","um des mit dem Reibholz [verbundenen Brahmanen] willen, und das hast du bestanden (Gen.+Lok.+Nom.Part.+2.Sg.Präs.)"]]],["032","sodaryeṣu vinaṣṭeṣu draupadyāṃ tatra bhārata śvarūpadhāriṇā putra punas tvaṃ me parīkṣitaḥ","Als die leiblichen [Brüder] und Draupadī dort zugrunde zu gehen schienen, Bhārata, wurdest du, mein Sohn, von mir, der ich die Gestalt eines Hundes trug, wiederum geprüft.","",[["sodaryeṣu vinaṣṭeṣu draupadyāṃ tatra bhārata","als die leiblichen [Brüder] und Draupadī dort zugrunde zu gehen schienen, Bhārata (Lok.Abs.+Lok.+Adv.+Vok.)"],["śvarūpadhāriṇā putra punaḥ tvaṃ me parīkṣitaḥ","wurdest du, mein Sohn, von mir, der ich die Gestalt eines Hundes trug, wiederum geprüft (Instr.Part.+Vok.+Adv.+Nom.+Instr.+Nom.Part.)"]]],["033","idaṃ tṛtīyaṃ bhrātṝṇām arthe yat sthātum icchasi viśuddho 'si mahābhāga sukhī vigatakalmaṣaḥ","Dies ist die dritte [Prüfung], dass du um deiner Brüder willen hierbleiben wolltest; rein bist du, Hochbeglückter, glücklich, von aller Makel befreit.","",[["idaṃ tṛtīyaṃ bhrātṝṇām arthe yat sthātum icchasi","dies ist die dritte, dass du um deiner Brüder willen hierbleiben wolltest (Nom.+Nom.+Gen.+Lok.+Inf.+2.Sg.Präs.)"],["viśuddhaḥ asi mahābhāga sukhī vigatakalmaṣaḥ","rein bist du, Hochbeglückter, glücklich, von aller Makel befreit (Nom.Part.+2.Sg.Präs.+Vok.+Nom.+Nom.Part.)"]]],["034","na ca te bhrātaraḥ pārtha narakasthā viśāṃ pate māyaiṣā devarājena mahendreṇa prayojitā","Und nicht sind deine Brüder, Pārtha, in der Hölle, Herrscher der Untertanen; dies war eine vom Götterkönig, dem großen Indra, veranlasste Täuschung.","",[["na ca te bhrātaraḥ pārtha narakasthāḥ viśāṃ pate","und nicht sind deine Brüder, Pārtha, in der Hölle, Herrscher der Untertanen (Nom.+Vok.+Nom.Part.+Gen.+Vok.)"],["māyā eṣā devarājena mahendreṇa prayojitā","dies war eine vom Götterkönig, dem großen Indra, veranlasste Täuschung (Nom.+Nom.+Instr.+Instr.+Nom.Part.)"]]],["035","avaśyaṃ narakas tāta draṣṭavyaḥ sarvarājabhiḥ tatas tvayā prāptam idaṃ muhūrtaṃ duḥkham uttamam","Unvermeidlich, mein Sohn, muss die Hölle von allen Königen geschaut werden; deshalb wurde dir dieser höchste Schmerz nur für einen Augenblick zuteil.","",[["avaśyaṃ narakaḥ tāta draṣṭavyaḥ sarvarājabhiḥ","unvermeidlich, mein Sohn, muss die Hölle von allen Königen geschaut werden (Adv.+Nom.+Vok.+Nom.Part.+Instr.)"],["tataḥ tvayā prāptam idaṃ muhūrtaṃ duḥkham uttamam","deshalb wurde dir dieser höchste Schmerz nur für einen Augenblick zuteil (Adv.+Instr.+Nom.Part.+Akk.+Akk.+Akk.)"]]],["036","na savyasācī bhīmo vā yamau vā puruṣarṣabhau karṇo vā satyavāk śūro narakārhāś ciraṃ nṛpa","Weder Savyasācin noch Bhīma noch die beiden Zwillinge, Stiere unter den Männern, noch Karṇa, der Wahrredende, der Held, verdienen die Hölle für lange Zeit, o König.","",[["na savyasācī bhīmaḥ vā yamau vā puruṣarṣabhau","weder Savyasācin noch Bhīma noch die beiden Zwillinge, Stiere unter den Männern (Nom.+Nom.+Nom.Dual)"],["karṇaḥ vā satyavāk śūraḥ narakārhāḥ ciraṃ nṛpa","noch Karṇa, der Wahrredende, der Held, verdienen die Hölle für lange Zeit, o König (Nom.+Nom.+Nom.+Nom.Part.+Adv.+Vok.)"]]],["037","na kṛṣṇā rājaputrī ca narakārhā yudhiṣṭhira ehy ehi bharataśreṣṭha paśya gaṅgāṃ trilokagām","Auch nicht Kṛṣṇā, die Königstochter, verdient die Hölle, Yudhiṣṭhira; komm, komm, Bester der Bharatas, sieh die Gaṅgā, die durch die drei Welten Fließende.“","",[["na kṛṣṇā rājaputrī ca narakārhā yudhiṣṭhira","auch nicht Kṛṣṇā, die Königstochter, verdient die Hölle, Yudhiṣṭhira (Nom.+Nom.+Nom.Part.+Vok.)"],["ehi ehi bharataśreṣṭha paśya gaṅgāṃ trilokagām","komm, komm, Bester der Bharatas, sieh die Gaṅgā, die durch die drei Welten Fließende (Imp.+Vok.+Imp.+Akk.+Akk.Part.)"]]],["038","evam uktaḥ sa rājarṣis tava pūrvapitāmahaḥ jagāma saha dharmeṇa sarvaiś ca tridaśālayaiḥ","So angesprochen, ging jener königliche Weise, dein Vorvater, zusammen mit Dharma und mit allen Himmelsbewohnern,","",[["evam uktaḥ sa rājarṣiḥ tava pūrvapitāmahaḥ","so angesprochen, jener königliche Weise, dein Vorvater (Nom.Part.+Nom.+Gen.+Nom.)"],["jagāma saha dharmeṇa sarvaiḥ ca tridaśālayaiḥ","ging zusammen mit Dharma und mit allen Himmelsbewohnern (3.Sg.Perf.+Instr.+Instr.)"]]],["039","gaṅgāṃ devanadīṃ puṇyāṃ pāvanīm ṛṣisaṃstutām avagāhya tu tāṃ rājā tanuṃ tatyāja mānuṣīm","und, in die Gaṅgā, den heiligen Götterfluss, den Reinigenden, von den Sehern Gepriesenen, eingetaucht, legte der König seinen menschlichen Leib ab.","",[["gaṅgāṃ devanadīṃ puṇyāṃ pāvanīm ṛṣisaṃstutām","in die Gaṅgā, den heiligen Götterfluss, den Reinigenden, von den Sehern Gepriesenen (Akk.)"],["avagāhya tu tāṃ rājā tanuṃ tatyāja mānuṣīm","eingetaucht, legte der König seinen menschlichen Leib ab (Abs.+Akk.+Nom.+Akk.+3.Sg.Perf.+Akk.)"]]],["040","tato divyavapur bhūtvā dharmarājo yudhiṣṭhiraḥ nirvairo gatasaṃtāpo jale tasmin samāplutaḥ","Dann, eine göttliche Gestalt annehmend, der Rechtskönig Yudhiṣṭhira, frei von Feindschaft, des Leidens ledig, in jenem Wasser untergetaucht,","",[["tataḥ divyavapuḥ bhūtvā dharmarājaḥ yudhiṣṭhiraḥ","dann, eine göttliche Gestalt annehmend, der Rechtskönig Yudhiṣṭhira (Adv.+Akk.+Abs.+Nom.+Nom.)"],["nirvairaḥ gatasaṃtāpaḥ jale tasmin samāplutaḥ","frei von Feindschaft, des Leidens ledig, in jenem Wasser untergetaucht (Nom.Part.+Nom.Part.+Lok.+Nom.Part.)"]]],["041","tato yayau vṛto devaiḥ kururājo yudhiṣṭhiraḥ dharmeṇa sahito dhīmān stūyamāno maharṣibhiḥ","zog dann der Kuru-König Yudhiṣṭhira, von Göttern umgeben, weiter, der Weise, zusammen mit Dharma, von den großen Sehern gepriesen.","[Anm.: Ende des Kapitels; Aufloesung des zentralen Spannungsbogens - Yudhiṣṭhira hat seinen sterblichen Koerper abgelegt und zieht goettlich verklaert weiter. Fortsetzung in Kap.4.]",[["tataḥ yayau vṛtaḥ devaiḥ kururājaḥ yudhiṣṭhiraḥ","zog dann der Kuru-König Yudhiṣṭhira, von Göttern umgeben, weiter (Adv.+3.Sg.Perf.+Nom.Part.+Instr.+Nom.+Nom.)"],["dharmeṇa sahitaḥ dhīmān stūyamānaḥ maharṣibhiḥ","zusammen mit Dharma, der Weise, von den großen Sehern gepriesen (Instr.+Nom.Part.+Nom.+Nom.Part.+Instr.)"]]]]},{"num":4,"title_sa":"","title_de":"Die wahren Gestalten der Helden","note":"","units":[["001","vaiśaṃpāyana uvāca tato yudhiṣṭhiro rājā devaiḥ sarṣimarudgaṇaiḥ pūjyamāno yayau tatra yatra te kurupuṃgavāḥ","Vaiśaṃpāyana sprach: Dann zog der König Yudhiṣṭhira, von den Göttern samt den Scharen der Seher und Maruts verehrt, dorthin, wo jene Stiere der Kurus waren.","",[["vaiśaṃpāyanaḥ uvāca tataḥ yudhiṣṭhiraḥ rājā","Vaiśaṃpāyana sprach: dann der König Yudhiṣṭhira (3.Sg.Perf.+Adv.+Nom.)"],["devaiḥ sarṣimarudgaṇaiḥ pūjyamānaḥ yayau tatra yatra te kurupuṃgavāḥ","von den Göttern samt den Scharen der Seher und Maruts verehrt, zog dorthin, wo jene Stiere der Kurus waren (Instr.+Nom.Part.+3.Sg.Perf.+Adv.+Adv.+Nom.)"]]],["002","dadarśa tatra govindaṃ brāhmeṇa vapuṣānvitam tenaiva dṛṣṭapūrveṇa sādṛśyenopasūcitam","Er sah dort Govinda [Kṛṣṇa], mit einer Gestalt aus Brahman-Wesen ausgestattet, durch eben jene zuvor gesehene Ähnlichkeit kenntlich gemacht,","",[["dadarśa tatra govindaṃ brāhmeṇa vapuṣā anvitam","er sah dort Govinda, mit einer Gestalt aus Brahman-Wesen ausgestattet (3.Sg.Perf.+Akk.+Instr.+Akk.Part.)"],["tena eva dṛṣṭapūrveṇa sādṛśyena upasūcitam","durch eben jene zuvor gesehene Ähnlichkeit kenntlich gemacht (Instr.+Instr.Part.+Instr.+Akk.Part.)"]]],["003","dīpyamānaṃ svavapuṣā divyair astrair upasthitam cakraprabhṛtibhir ghorair divyaiḥ puruṣavigrahaiḥ upāsyamānaṃ vīreṇa phalgunena suvarcasā","leuchtend durch seine eigene Gestalt, von göttlichen Waffen umgeben - dem Diskus und anderen furchtbaren, göttlichen [Waffen] in Menschengestalt - verehrt von dem Helden Phalguna, dem Glanzvollen.","",[["dīpyamānaṃ svavapuṣā divyaiḥ astraiḥ upasthitam","leuchtend durch seine eigene Gestalt, von göttlichen Waffen umgeben (Akk.Part.+Instr.+Instr.+Akk.Part.)"],["cakraprabhṛtibhiḥ ghoraiḥ divyaiḥ puruṣavigrahaiḥ upāsyamānaṃ vīreṇa phalgunena suvarcasā","dem Diskus und anderen furchtbaren, göttlichen Waffen in Menschengestalt, verehrt von dem Helden Phalguna, dem Glanzvollen (Instr.+Akk.Part.+Instr.+Instr.)"]]],["004","aparasminn athoddeśe karṇaṃ śastrabhṛtāṃ varam dvādaśādityasahitaṃ dadarśa kurunandanaḥ","An einer anderen Stelle sodann sah der Freude-Bringer der Kurus [Yudhiṣṭhira] den Karṇa, den Besten der Waffenträger, mit den zwölf Ādityas vereint.","",[["aparasmin atha uddeśe karṇaṃ śastrabhṛtāṃ varam","an einer anderen Stelle sodann den Karṇa, den Besten der Waffenträger (Lok.+Akk.+Gen.+Akk.)"],["dvādaśādityasahitaṃ dadarśa kurunandanaḥ","mit den zwölf Ādityas vereint sah der Freude-Bringer der Kurus (Akk.Part.+3.Sg.Perf.+Nom.)"]]],["005","athāparasminn uddeśe marudgaṇavṛtaṃ prabhum bhīmasenam athāpaśyat tenaiva vapuṣānvitam","Und an einer anderen Stelle sah er den Herrn Bhīmasena, von der Schar der Maruts umgeben, mit eben deren Gestalt ausgestattet.","",[["atha aparasmin uddeśe marudgaṇavṛtaṃ prabhum bhīmasenam","und an einer anderen Stelle den Herrn Bhīmasena, von der Schar der Maruts umgeben (Adv.+Lok.+Akk.Part.+Akk.+Akk.)"],["atha apaśyat tena eva vapuṣā anvitam","sah er, mit eben deren Gestalt ausgestattet (Adv.+3.Sg.Impf.+Instr.+Instr.+Akk.Part.)"]]],["006","aśvinos tu tathā sthāne dīpyamānau svatejasā nakulaṃ sahadevaṃ ca dadarśa kurunandanaḥ","Und an der Stelle der beiden Aśvins sah der Freude-Bringer der Kurus Nakula und Sahadeva, leuchtend durch ihren eigenen Glanz.","",[["aśvinoḥ tu tathā sthāne dīpyamānau svatejasā","an der Stelle der beiden Aśvins, leuchtend durch ihren eigenen Glanz (Gen.Dual+Adv.+Lok.+Nom.Part.Dual+Instr.)"],["nakulaṃ sahadevaṃ ca dadarśa kurunandanaḥ","sah der Freude-Bringer der Kurus Nakula und Sahadeva (Akk.+3.Sg.Perf.+Nom.)"]]],["007","tathā dadarśa pāñcālīṃ kamalotpalamālinīm vapuṣā svargam ākramya tiṣṭhantīm arkavarcasam","Ebenso sah er die Pāñcālī, mit einer Girlande aus Lotos- und Seerosenblüten, wie sie, mit ihrer Gestalt den Himmel durchschreitend, dastand, von der Leuchtkraft der Sonne.","",[["tathā dadarśa pāñcālīṃ kamalotpalamālinīm","ebenso sah er die Pāñcālī, mit einer Girlande aus Lotos- und Seerosenblüten (Adv.+3.Sg.Perf.+Akk.+Akk.Part.)"],["vapuṣā svargam ākramya tiṣṭhantīm arkavarcasam","wie sie, mit ihrer Gestalt den Himmel durchschreitend, dastand, von der Leuchtkraft der Sonne (Instr.+Akk.+Abs.+Akk.Part.+Akk.)"]]],["008","athaināṃ sahasā rājā praṣṭum aicchad yudhiṣṭhiraḥ tato 'sya bhagavān indraḥ kathayām āsa devarāṭ","Da wünschte der König Yudhiṣṭhira plötzlich, sie zu befragen; da erzählte ihm der Erhabene, Indra, der Götterkönig:","",[["atha enāṃ sahasā rājā praṣṭum aicchat yudhiṣṭhiraḥ","da wünschte der König Yudhiṣṭhira plötzlich, sie zu befragen (Adv.+Akk.+Adv.+Nom.+Inf.+3.Sg.Impf.+Nom.)"],["tataḥ asya bhagavān indraḥ kathayām āsa devarāṭ","da erzählte ihm der Erhabene, Indra, der Götterkönig (Adv.+Gen.+Nom.+Nom.+3.Sg.Perf.+Nom.)"]]],["009","śrīr eṣā draupadīrūpā tvadarthe mānuṣaṃ gatā ayonijā lokakāntā puṇyagandhā yudhiṣṭhira","„Dies ist Śrī, in Gestalt der Draupadī, die um deinetwillen in die menschliche [Welt] gegangen ist, nicht aus einem Mutterschoß geboren, dem Erdkreis lieb, von heiligem Duft, Yudhiṣṭhira.","[Anm.: Śrī = die Göttin des Glücks und der Schönheit, auch Lakṣmī genannt.]",[["śrīḥ eṣā draupadīrūpā tvadarthe mānuṣaṃ gatā","dies ist Śrī, in Gestalt der Draupadī, die um deinetwillen in die menschliche Welt gegangen ist (Nom.+Nom.+Adv.+Akk.+Nom.Part.)"],["ayonijā lokakāntā puṇyagandhā yudhiṣṭhira","nicht aus einem Mutterschoß geboren, dem Erdkreis lieb, von heiligem Duft, Yudhiṣṭhira (Nom.Part.+Nom.+Nom.+Vok.)"]]],["010","drupadasya kule jātā bhavadbhiś copajīvitā ratyarthaṃ bhavatāṃ hy eṣā nirmitā śūlapāṇinā","Im Geschlecht des Drupada wurde sie geboren, und von euch wurde sie umsorgt; um eures Vergnügens willen wurde sie ja von dem Dreizackträger [Śiva] erschaffen.","",[["drupadasya kule jātā bhavadbhiḥ ca upajīvitā","im Geschlecht des Drupada wurde sie geboren, und von euch wurde sie umsorgt (Gen.+Lok.+Nom.Part.+Instr.+Nom.Part.)"],["ratyarthaṃ bhavatāṃ hi eṣā nirmitā śūlapāṇinā","um eures Vergnügens willen wurde sie ja von dem Dreizackträger erschaffen (Akk.+Gen.+Nom.+Nom.Part.+Instr.)"]]],["011","ete pañca mahābhāgā gandharvāḥ pāvakaprabhāḥ draupadyās tanayā rājan yuṣmākam amitaujasaḥ","Diese fünf Hochbeglückten, Gandharvas, feuergleich an Glanz, sind Draupadīs Söhne, o König, [geboren] durch euch, die von unermesslicher Kraft [seid].","",[["ete pañca mahābhāgāḥ gandharvāḥ pāvakaprabhāḥ","diese fünf Hochbeglückten, Gandharvas, feuergleich an Glanz (Nom.)"],["draupadyāḥ tanayāḥ rājan yuṣmākam amitaujasaḥ","sind Draupadīs Söhne, o König, durch euch, die von unermesslicher Kraft seid (Gen.+Nom.+Vok.+Gen.)"]]],["012","paśya gandharvarājānaṃ dhṛtarāṣṭraṃ manīṣiṇam enaṃ ca tvaṃ vijānīhi bhrātaraṃ pūrvajaṃ pituḥ","Sieh den Gandharva-König Dhṛtarāṣṭra, den Weisen, und ihn sollst du erkennen: als den älteren Bruder deines Vaters.","[Anm.: Dhṛtarāṣṭra, im Erdenleben blind, erscheint hier in seiner wahren, himmlischen Gestalt als Gandharva-König.]",[["paśya gandharvarājānaṃ dhṛtarāṣṭraṃ manīṣiṇam","sieh den Gandharva-König Dhṛtarāṣṭra, den Weisen (Imp.+Akk.+Akk.+Akk.)"],["enaṃ ca tvaṃ vijānīhi bhrātaraṃ pūrvajaṃ pituḥ","und ihn sollst du erkennen als den älteren Bruder deines Vaters (Akk.+Nom.+Imp.+Akk.+Akk.+Gen.)"]]],["013","ayaṃ te pūrvajo bhrātā kaunteyaḥ pāvakadyutiḥ sūryaputro 'grajaḥ śreṣṭho rādheya iti viśrutaḥ ādityasahito yāti paśyainaṃ puruṣarṣabha","Dieser ist dein älterer Bruder, der Sohn der Kuntī, feuerglänzend, der Sohn der Sonne, der Erstgeborene, der Beste, als Rādheya bekannt; mit den Ādityas vereint zieht er dahin - sieh ihn, Stier unter den Männern.","",[["ayaṃ te pūrvajaḥ bhrātā kaunteyaḥ pāvakadyutiḥ","dieser ist dein älterer Bruder, der Sohn der Kuntī, feuerglänzend (Nom.+Gen.+Nom.+Nom.+Nom.)"],["sūryaputraḥ agrajaḥ śreṣṭhaḥ rādheyaḥ iti viśrutaḥ","der Sohn der Sonne, der Erstgeborene, der Beste, als Rādheya bekannt (Nom.+direkte Rede+Nom.Part.)"],["ādityasahitaḥ yāti paśya enaṃ puruṣarṣabha","mit den Ādityas vereint zieht er dahin - sieh ihn, Stier unter den Männern (Nom.Part.+3.Sg.Präs.+Imp.+Akk.+Vok.)"]]],["014","sādhyānām atha devānāṃ vasūnāṃ marutām api gaṇeṣu paśya rājendra vṛṣṇyandhakamahārathān sātyakipramukhān vīrān bhojāṃś caiva mahārathān","Und in den Scharen der Sādhyas und Götter, der Vasus und auch der Maruts, sieh, Herrscher der Könige, die großen Wagenkämpfer der Vṛṣṇis und Andhakas, angeführt von Sātyaki, die Helden, und auch die Bhojas, die großen Wagenkämpfer.","",[["sādhyānām atha devānāṃ vasūnāṃ marutām api gaṇeṣu paśya rājendra","und in den Scharen der Sādhyas und Götter, der Vasus und auch der Maruts, sieh, Herrscher der Könige (Gen.+Adv.+Gen.+Gen.+Gen.+Lok.+Imp.+Vok.)"],["vṛṣṇyandhakamahārathān sātyakipramukhān vīrān bhojān ca eva mahārathān","die großen Wagenkämpfer der Vṛṣṇis und Andhakas, angeführt von Sātyaki, die Helden, und auch die Bhojas, die großen Wagenkämpfer (Akk.)"]]],["015","somena sahitaṃ paśya saubhadram aparājitam abhimanyuṃ maheṣvāsaṃ niśākarasamadyutim","Sieh den mit Soma vereinten, unbesiegten Saubhadra [Abhimanyu, Sohn der Subhadrā], den großen Bogenschützen, an Glanz dem Mond gleich.","[Anm.: Saubhadra = Beiname Abhimanyus als Sohn der Subhadrā.]",[["somena sahitaṃ paśya saubhadram aparājitam","sieh den mit Soma vereinten, unbesiegten Saubhadra (Instr.+Akk.Part.+Imp.+Akk.+Akk.)"],["abhimanyuṃ maheṣvāsaṃ niśākarasamadyutim","Abhimanyu, den großen Bogenschützen, an Glanz dem Mond gleich (Akk.)"]]],["016","eṣa pāṇḍur maheṣvāsaḥ kuntyā mādryā ca saṃgataḥ vimānena sadābhyeti pitā tava mamāntikam","Dieser Pāṇḍu, der große Bogenschütze, mit Kuntī und Mādrī vereint - dein Vater kommt stets mit dem Himmelswagen in meine Nähe.","",[["eṣa pāṇḍuḥ maheṣvāsaḥ kuntyā mādryā ca saṃgataḥ","dieser Pāṇḍu, der große Bogenschütze, mit Kuntī und Mādrī vereint (Nom.+Nom.+Instr.+Instr.+Nom.Part.)"],["vimānena sadā abhyeti pitā tava mama antikam","kommt stets mit dem Himmelswagen, dein Vater, in meine Nähe (Instr.+Adv.+3.Sg.Präs.+Nom.+Gen.+Gen.+Akk.)"]]],["017","vasubhiḥ sahitaṃ paśya bhīṣmaṃ śāṃtanavaṃ nṛpam droṇaṃ bṛhaspateḥ pārśve gurum enaṃ niśāmaya","Sieh den mit den Vasus vereinten König Bhīṣma, den Sohn Śāntanus, und betrachte diesen Droṇa an der Seite des Bṛhaspati, deinen Lehrer.","",[["vasubhiḥ sahitaṃ paśya bhīṣmaṃ śāṃtanavaṃ nṛpam","sieh den mit den Vasus vereinten König Bhīṣma, den Sohn Śāntanus (Instr.+Akk.Part.+Imp.+Akk.+Akk.+Akk.)"],["droṇaṃ bṛhaspateḥ pārśve gurum enaṃ niśāmaya","und betrachte diesen Droṇa an der Seite des Bṛhaspati, deinen Lehrer (Akk.+Gen.+Lok.+Akk.+Akk.+Imp.)"]]],["018","ete cānye mahīpālā yodhās tava ca pāṇḍava gandharvaiḥ sahitā yānti yakṣaiḥ puṇyajanais tathā","Und diese anderen Erdenherrscher und Krieger von dir, Pāṇḍava, ziehen zusammen mit den Gandharvas dahin, ebenso mit den Yakṣas und den Puṇyajanas.","[Anm.: Puṇyajanas = eine Klasse halbgöttlicher Wesen, oft mit den Yakṣas zusammen genannt.]",[["ete ca anye mahīpālāḥ yodhāḥ tava ca pāṇḍava","und diese anderen Erdenherrscher und Krieger von dir, Pāṇḍava (Nom.+Nom.+Gen.+Vok.)"],["gandharvaiḥ sahitāḥ yānti yakṣaiḥ puṇyajanaiḥ tathā","ziehen zusammen mit den Gandharvas dahin, ebenso mit den Yakṣas und den Puṇyajanas (Instr.+Nom.Part.+3.Pl.Präs.+Instr.+Instr.+Adv.)"]]],["019","guhyakānāṃ gatiṃ cāpi ke cit prāptā nṛsattamāḥ tyaktvā dehaṃ jitasvargāḥ puṇyavāgbuddhikarmabhiḥ","Manche der besten Männer haben auch den Weg der Guhyakas erlangt, nachdem sie ihren Leib abgelegt hatten, den Himmel gewonnen durch reine Rede, reinen Sinn und reine Taten.“","[Anm.: Ende des Kapitels; Fortsetzung in Kap.5.]",[["guhyakānāṃ gatiṃ ca api ke cit prāptāḥ nṛsattamāḥ","manche der besten Männer haben auch den Weg der Guhyakas erlangt (Gen.+Akk.+Nom.Part.+Nom.Part.+Nom.)"],["tyaktvā dehaṃ jitasvargāḥ puṇyavāgbuddhikarmabhiḥ","nachdem sie ihren Leib abgelegt hatten, den Himmel gewonnen durch reine Rede, reinen Sinn und reine Taten (Abs.+Akk.+Nom.Part.+Instr.)"]]]]},{"num":5,"title_sa":"","title_de":"Die letzten Ziele der Helden und das Lob des Werks (Phalashruti)","note":"Letztes Kapitel des Svargarohanaparva und des gesamten Mahabharata.","units":[["001","janamejaya uvāca bhīṣmadroṇau mahātmānau dhṛtarāṣṭraś ca pārthivaḥ virāṭadrupadau cobhau śaṅkhaś caivottaras tathā","Janamejaya sprach: Bhīṣma und Droṇa, die großherzigen Seelen, und König Dhṛtarāṣṭra, Virāṭa und Drupada, beide, und Śaṅkha sowie auch Uttara,","",[["janamejayaḥ uvāca","Janamejaya sprach (Nom.+3.Sg.Perf.)"],["bhīṣmadroṇau mahātmānau dhṛtarāṣṭraḥ ca pārthivaḥ","Bhīṣma und Droṇa, die großherzigen Seelen, und König Dhṛtarāṣṭra (Nom.Dual+Nom.Dual+Nom.+Nom.)"],["virāṭadrupadau ca ubhau śaṅkhaḥ ca eva uttaraḥ tathā","Virāṭa und Drupada, beide, und Śaṅkha sowie auch Uttara (Nom.Dual+Nom.Dual+Nom.+Nom.)"]]],["002","dhṛṣṭaketur jayatseno rājā caiva sa satyajit duryodhanasutāś caiva śakuniś caiva saubalaḥ","Dhṛṣṭaketu, Jayatsena und jener König Satyajit, und die Söhne Duryodhanas, und Śakuni, der Sohn Subalas,","",[["dhṛṣṭaketuḥ jayatsenaḥ rājā ca eva saḥ satyajit","Dhṛṣṭaketu, Jayatsena und jener König Satyajit (Nom.+Nom.+Nom.+Nom.)"],["duryodhanasutāḥ ca eva śakuniḥ ca eva saubalaḥ","und die Söhne Duryodhanas, und Śakuni, der Sohn Subalas (Nom.+Nom.)"]]],["003","karṇaputrāś ca vikrāntā rājā caiva jayadrathaḥ ghaṭotkacādayaś caiva ye cānye nānukīrtitāḥ","und die tapferen Söhne Karṇas, und König Jayadratha, und Ghaṭotkaca und die anderen, die nicht namentlich genannt wurden –","",[["karṇaputrāḥ ca vikrāntāḥ rājā ca eva jayadrathaḥ","und die tapferen Söhne Karṇas, und König Jayadratha (Nom.+Nom.+Nom.+Nom.)"],["ghaṭotkacādayaḥ ca eva ye ca anye na anukīrtitāḥ","und Ghaṭotkaca und die anderen, die nicht namentlich genannt wurden (Nom.+Nom.+Nom.Neg.Part.)"]]],["004","ye cānye kīrtitās tatra rājāno dīptamūrtayaḥ svarge kālaṃ kiyantaṃ te tasthus tad api śaṃsa me","und auch die anderen dort genannten Könige von strahlender Gestalt – wie lange Zeit sie im Himmel verweilten, das sage mir auch.","",[["ye ca anye kīrtitāḥ tatra rājānaḥ dīptamūrtayaḥ","und auch die anderen dort genannten Könige von strahlender Gestalt (Nom.Rel.+Nom.+Nom.+Nom.)"],["svarge kālaṃ kiyantaṃ te tasthuḥ tat api śaṃsa me","wie lange Zeit sie im Himmel verweilten, das sage mir auch (Lok.+Akk.+Akk.+3.Pl.Perf.+Akk.+Imp.+Dat.)"]]],["005","āho svic chāśvataṃ sthānaṃ teṣāṃ tatra dvijottama ante vā karmaṇaḥ kāṃ te gatiṃ prāptā nararṣabhāḥ etad icchāmy ahaṃ śrotuṃ procyamānaṃ tvayā dvija","Oder ist ihre Stätte dort ewig, o Bester der Zweifachgeborenen? Oder welchen Gang haben diese Stiere unter den Männern am Ende ihres Wirkens erlangt? Dies möchte ich hören, von dir dargelegt, o Zweifachgeborener.","",[["āho svit śāśvataṃ sthānaṃ teṣāṃ tatra dvijottama","oder ist ihre Stätte dort ewig, o Bester der Zweifachgeborenen (Part.+Akk.+Akk.+Gen.+Vok.)"],["ante vā karmaṇaḥ kāṃ te gatiṃ prāptāḥ nararṣabhāḥ","oder welchen Gang haben diese Stiere unter den Männern am Ende ihres Wirkens erlangt (Lok.+Gen.+Akk.+Nom.+Akk.+Nom.+Nom.)"],["etat icchāmi ahaṃ śrotuṃ procyamānaṃ tvayā dvija","dies möchte ich hören, von dir dargelegt, o Zweifachgeborener (Akk.+1.Sg.Präs.+Inf.+Akk.Part.+Instr.+Vok.)"]]],["006","sūta uvāca ity uktaḥ sa tu viprarṣir anujñāto mahātmanā vyāsena tasya nṛpater ākhyātum upacakrame","Sūta sprach: So angesprochen, begann jener Priesterweise, von dem großherzigen Vyāsa dazu ermächtigt, es jenem König zu berichten.","",[["sūtaḥ uvāca iti uktaḥ saḥ tu viprarṣiḥ","Sūta sprach: so angesprochen, jener Priesterweise aber (Nom.+3.Sg.Perf.+Part.+Nom.Part.+Nom.+Nom.)"],["anujñātaḥ mahātmanā vyāsena tasya nṛpateḥ ākhyātum upacakrame","von dem großherzigen Vyāsa dazu ermächtigt, begann, es jenem König zu berichten (Nom.Part.+Instr.+Instr.+Gen.+Gen.+Inf.+3.Sg.Perf.)"]]],["007","vaiśaṃpāyana uvāca gantavyaṃ karmaṇām ante sarveṇa manujādhipa śṛṇu guhyam idaṃ rājan devānāṃ bharatarṣabha yad uvāca mahātejā divyacakṣuḥ pratāpavān","Vaiśaṃpāyana sprach: Am Ende der Taten muss ein jeder gehen, o Herrscher der Menschen. Höre dieses Geheimnis der Götter, o König, Stier der Bharatas, das der von großer Glut, mit göttlichem Auge, der Machtvolle,","",[["vaiśaṃpāyanaḥ uvāca gantavyaṃ karmaṇām ante sarveṇa manujādhipa","Vaiśaṃpāyana sprach: am Ende der Taten muss ein jeder gehen, o Herrscher der Menschen (Nom.+3.Sg.Perf.+Ger.+Gen.+Lok.+Instr.+Vok.)"],["śṛṇu guhyam idaṃ rājan devānāṃ bharatarṣabha","höre dieses Geheimnis der Götter, o König, Stier der Bharatas (Imp.+Akk.+Akk.+Vok.+Gen.+Vok.)"],["yat uvāca mahātejāḥ divyacakṣuḥ pratāpavān","das der von großer Glut, mit göttlichem Auge, der Machtvolle verkündet hat (Akk.Rel.+3.Sg.Perf.+Nom.+Nom.+Nom.)"]]],["008","muniḥ purāṇaḥ kauravya pārāśaryo mahāvrataḥ agādhabuddhiḥ sarvajño gatijñaḥ sarvakarmaṇām","der uralte Weise, o Kaurava, der Sohn Parāśaras von großen Gelübden, von unergründlichem Verstand, der Allwissende, der Kenner der Gänge aller Taten, verkündet hat:","[Anm.: V007-008 leiten das im Folgenden (V009-025) wiedergegebene Wort des Weisen Vyāsa (,Pārāśarya', Sohn des Parāśara) ein, das Vaiśaṃpāyana hier zitierend berichtet.]",[["muniḥ purāṇaḥ kauravya pārāśaryaḥ mahāvrataḥ","der uralte Weise, o Kaurava, der Sohn Parāśaras von großen Gelübden (Nom.+Nom.+Vok.+Nom.+Nom.)"],["agādhabuddhiḥ sarvajñaḥ gatijñaḥ sarvakarmaṇām","von unergründlichem Verstand, der Allwissende, der Kenner der Gänge aller Taten (Nom.+Nom.+Nom.+Gen.)"]]],["009","vasūn eva mahātejā bhīṣmaḥ prāpa mahādyutiḥ aṣṭāv eva hi dṛśyante vasavo bharatarṣabha","„Bhīṣma von großer Glut und großem Glanz gelangte fürwahr zu den Vasus; denn es sind ja acht Vasus zu sehen, o Stier der Bharatas.","",[["vasūn eva mahātejāḥ bhīṣmaḥ prāpa mahādyutiḥ","Bhīṣma von großer Glut und großem Glanz gelangte fürwahr zu den Vasus (Akk.+Nom.+Nom.+3.Sg.Perf.+Nom.)"],["aṣṭau eva hi dṛśyante vasavaḥ bharatarṣabha","denn es sind ja acht Vasus zu sehen, o Stier der Bharatas (Num.+Adv.+Partikel+3.Pl.Präs.Pass.+Nom.+Vok.)"]]],["010","bṛhaspatiṃ viveśātha droṇo hy aṅgirasāṃ varam kṛtavarmā tu hārdikyaḥ praviveśa marudgaṇam","Droṇa ging sodann in Bṛhaspati ein, den Besten der Aṅgirasas; Kṛtavarman aber, der Sohn Hṛdikas, ging in die Schar der Maruts ein.","",[["bṛhaspatiṃ viveśa atha droṇaḥ hi aṅgirasāṃ varam","Droṇa ging sodann in Bṛhaspati ein, den Besten der Aṅgirasas (Akk.+3.Sg.Perf.+Adv.+Nom.+Partikel+Gen.+Akk.)"],["kṛtavarmā tu hārdikyaḥ praviveśa marudgaṇam","Kṛtavarman aber, der Sohn Hṛdikas, ging in die Schar der Maruts ein (Nom.+Nom.+3.Sg.Perf.+Akk.)"]]],["011","sanatkumāraṃ pradyumnaḥ praviveśa yathāgatam dhṛtarāṣṭro dhaneśasya lokān prāpa durāsadān","Pradyumna ging in Sanatkumāra ein, so wie er gekommen war; Dhṛtarāṣṭra erlangte die unnahbaren Welten des Gottes des Reichtums.","[Anm.: dhaneśa = ,Herr des Reichtums', Beiname Kuberas.]",[["sanatkumāraṃ pradyumnaḥ praviveśa yathāgatam","Pradyumna ging in Sanatkumāra ein, so wie er gekommen war (Akk.+Nom.+3.Sg.Perf.+Adv.)"],["dhṛtarāṣṭraḥ dhaneśasya lokān prāpa durāsadān","Dhṛtarāṣṭra erlangte die unnahbaren Welten des Gottes des Reichtums (Nom.+Gen.+Akk.+3.Sg.Perf.+Akk.)"]]],["012","dhṛtarāṣṭreṇa sahitā gāndhārī ca yaśasvinī patnībhyāṃ sahitaḥ pāṇḍur mahendrasadanaṃ yayau","Gāndhārī, die Ruhmvolle, zog mit Dhṛtarāṣṭra vereint dahin; Pāṇḍu, mit seinen beiden Gattinnen vereint, ging zur Wohnstatt des großen Indra.","",[["dhṛtarāṣṭreṇa sahitā gāndhārī ca yaśasvinī","Gāndhārī, die Ruhmvolle, zog mit Dhṛtarāṣṭra vereint dahin (Instr.+Nom.Part.+Nom.+Nom.)"],["patnībhyāṃ sahitaḥ pāṇḍuḥ mahendrasadanaṃ yayau","Pāṇḍu, mit seinen beiden Gattinnen vereint, ging zur Wohnstatt des großen Indra (Instr.+Nom.Part.+Nom.+Akk.+3.Sg.Perf.)"]]],["013","virāṭadrupadau cobhau dhṛṣṭaketuś ca pārthivaḥ niśaṭhākrūrasāmbāś ca bhānuḥ kampo viḍūrathaḥ","Virāṭa und Drupada, beide, und König Dhṛṣṭaketu, und Niśaṭha, Akrūra und Sāmba, Bhānu, Kampa und Viḍūratha,","",[["virāṭadrupadau ca ubhau dhṛṣṭaketuḥ ca pārthivaḥ","Virāṭa und Drupada, beide, und König Dhṛṣṭaketu (Nom.Dual+Nom.+Nom.)"],["niśaṭhākrūrasāmbāḥ ca bhānuḥ kampaḥ viḍūrathaḥ","und Niśaṭha, Akrūra und Sāmba, Bhānu, Kampa und Viḍūratha (Nom.)"]]],["014","bhūriśravāḥ śalaś caiva bhūriś ca pṛthivīpatiḥ ugrasenas tathā kaṃso vasudevaś ca vīryavān","Bhūriśravas und Śala, und Bhūri, der Herrscher der Erde, sowie Ugrasena, Kaṃsa und der kraftvolle Vasudeva,","",[["bhūriśravāḥ śalaḥ ca eva bhūriḥ ca pṛthivīpatiḥ","Bhūriśravas und Śala, und Bhūri, der Herrscher der Erde (Nom.)"],["ugrasenaḥ tathā kaṃsaḥ vasudevaḥ ca vīryavān","sowie Ugrasena, Kaṃsa und der kraftvolle Vasudeva (Nom.)"]]],["015","uttaraś ca saha bhrātrā śaṅkhena narapuṃgavaḥ viśveṣāṃ devatānāṃ te viviśur narasattamāḥ","und Uttara, der Beste unter den Männern, zusammen mit seinem Bruder Śaṅkha – sie, die Besten unter den Menschen, gingen in die Viśvedeva-Götter ein.","[Anm.: Viśvedevāḥ = eine Gruppe von Göttern, ,die Allgötter'.]",[["uttaraḥ ca saha bhrātrā śaṅkhena narapuṃgavaḥ","und Uttara, der Beste unter den Männern, zusammen mit seinem Bruder Śaṅkha (Nom.+Instr.+Instr.+Nom.)"],["viśveṣāṃ devatānāṃ te viviśuḥ narasattamāḥ","sie, die Besten unter den Menschen, gingen in die Viśvedeva-Götter ein (Gen.+Gen.+Nom.+3.Pl.Perf.+Nom.)"]]],["016","varcā nāma mahātejāḥ somaputraḥ pratāpavān so 'bhimanyur nṛsiṃhasya phalgunasya suto 'bhavat","Ein Sohn Somas, mit Namen Varcas, von großer Glut und Macht, war jener Abhimanyu, der Sohn jenes Löwen unter den Männern, des Phalguna (Arjuna),","",[["varcāḥ nāma mahātejāḥ somaputraḥ pratāpavān","ein Sohn Somas, mit Namen Varcas, von großer Glut und Macht (Nom.+Adv.+Nom.+Nom.+Nom.)"],["saḥ abhimanyuḥ nṛsiṃhasya phalgunasya sutaḥ abhavat","war jener Abhimanyu, der Sohn jenes Löwen unter den Männern, des Phalguna (Nom.+Nom.+Gen.+Gen.+Nom.+3.Sg.Impf.)"]]],["017","sa yuddhvā kṣatradharmeṇa yathā nānyaḥ pumān kva cit viveśa somaṃ dharmātmā karmaṇo 'nte mahārathaḥ","und er, der gemäß dem Kriegerdharma kämpfte wie kein anderer Mann irgendwo, ging, der Rechtschaffene, der große Wagenkämpfer, am Ende seines Wirkens in Soma ein.","",[["saḥ yuddhvā kṣatradharmeṇa yathā na anyaḥ pumān kva cit","und er, der gemäß dem Kriegerdharma kämpfte wie kein anderer Mann irgendwo (Nom.+Abs.+Instr.+Adv.+Neg.+Nom.+Nom.+Adv.)"],["viveśa somaṃ dharmātmā karmaṇaḥ ante mahārathaḥ","ging, der Rechtschaffene, der große Wagenkämpfer, am Ende seines Wirkens in Soma ein (3.Sg.Perf.+Akk.+Nom.+Gen.+Lok.+Nom.)"]]],["018","āviveśa raviṃ karṇaḥ pitaraṃ puruṣarṣabha dvāparaṃ śakuniḥ prāpa dhṛṣṭadyumnas tu pāvakam","Karṇa ging in Ravi, seinen Vater, ein, o Stier unter den Männern; Śakuni gelangte zu Dvāpara; Dhṛṣṭadyumna aber ging ein in Pāvaka, das Feuer.","",[["āviveśa raviṃ karṇaḥ pitaraṃ puruṣarṣabha","Karṇa ging in Ravi, seinen Vater, ein, o Stier unter den Männern (3.Sg.Perf.+Akk.+Nom.+Akk.+Vok.)"],["dvāparaṃ śakuniḥ prāpa dhṛṣṭadyumnaḥ tu pāvakam","Śakuni gelangte zu Dvāpara; Dhṛṣṭadyumna aber ging ein in Pāvaka (Akk.+Nom.+3.Sg.Perf.+Nom.+Akk.)"]]],["019","dhṛtarāṣṭrātmajāḥ sarve yātudhānā balotkaṭāḥ ṛddhimanto mahātmānaḥ śastrapūtā divaṃ gatāḥ dharmam evāviśat kṣattā rājā caiva yudhiṣṭhiraḥ","Alle Söhne Dhṛtarāṣṭras, gewaltige Yātudhānas von überragender Kraft, machtvoll und großherzig, durch Waffen geläutert, gingen zum Himmel ein; Kṣattṛ aber ging ein in Dharma – ebenso wie König Yudhiṣṭhira selbst.","[Anm.: yātudhāna = Bezeichnung für Rākṣasas; Kṣattṛ = Beiname Viduras. Dass hier auch König Yudhiṣṭhira - der zur Erzählzeit noch im Himmel weilt und diese Rede hört - als dereinst in Dharma eingehend genannt wird, ist eine vorausschauende Aussage: Vidura wie Yudhiṣṭhira gelten beide als mit dem Gott Dharma verbunden, Vidura als dessen Inkarnation, Yudhiṣṭhira als dessen Sohn.]",[["dhṛtarāṣṭrātmajāḥ sarve yātudhānāḥ balotkaṭāḥ ṛddhimantaḥ mahātmānaḥ","alle Söhne Dhṛtarāṣṭras, gewaltige Yātudhānas von überragender Kraft, machtvoll und großherzig (Nom.+Nom.+Nom.+Nom.+Nom.+Nom.)"],["śastrapūtāḥ divaṃ gatāḥ dharmam eva āviśat kṣattā rājā ca eva yudhiṣṭhiraḥ","durch Waffen geläutert, gingen zum Himmel ein; Kṣattṛ aber ging ein in Dharma - ebenso wie König Yudhiṣṭhira selbst (Nom.+Akk.+Nom.+Akk.+3.Sg.Impf.+Nom.+Nom.+Nom.)"]]],["020","ananto bhagavān devaḥ praviveśa rasātalam pitāmahaniyogād dhi yo yogād gām adhārayat","Der erhabene Gott Ananta ging ein in Rasātala, er, der durch Yoga, auf Geheiß des Großvaters, die Erde trug.","[Anm.: Ananta = die Weltenschlange Śeṣa; Rasātala = eine der unterirdischen Welten; ,Großvater' = Brahmā.]",[["anantaḥ bhagavān devaḥ praviveśa rasātalam","der erhabene Gott Ananta ging ein in Rasātala (Nom.+Nom.+Nom.+3.Sg.Perf.+Akk.)"],["pitāmahaniyogāt hi yaḥ yogāt gām adhārayat","er, der auf Geheiß des Großvaters durch Yoga die Erde trug (Abl.+Partikel+Nom.+Abl.+Akk.+3.Sg.Impf.)"]]],["021","ṣoḍaśastrīsahasrāṇi vāsudevaparigrahaḥ nyamajjanta sarasvatyāṃ kālena janamejaya tāś cāpy apsaraso bhūtvā vāsudevam upāgaman","Die sechzehntausend Frauen, die Gattinnen Vāsudevas, versanken mit der Zeit in der Sarasvatī, o Janamejaya; und auch sie gingen, zu Apsaras geworden, zu Vāsudeva.","",[["ṣoḍaśastrīsahasrāṇi vāsudevaparigrahaḥ nyamajjanta sarasvatyāṃ kālena janamejaya","die sechzehntausend Frauen, die Gattinnen Vāsudevas, versanken mit der Zeit in der Sarasvatī, o Janamejaya (Nom.+Nom.+3.Pl.Impf.+Lok.+Instr.+Vok.)"],["tāḥ ca api apsarasaḥ bhūtvā vāsudevam upāgaman","und auch sie gingen, zu Apsaras geworden, zu Vāsudeva (Nom.+Nom.+Abs.+Akk.+3.Pl.Perf.)"]]],["022","hatās tasmin mahāyuddhe ye vīrās tu mahārathāḥ ghaṭotkacādayaḥ sarve devān yakṣāṃś ca bhejire","Die Helden aber, die großen Wagenkämpfer, die in jener großen Schlacht erschlagen wurden, Ghaṭotkaca und alle die anderen, gelangten zu den Göttern und den Yakṣas.","",[["hatāḥ tasmin mahāyuddhe ye vīrāḥ tu mahārathāḥ","die Helden aber, die großen Wagenkämpfer, die in jener großen Schlacht erschlagen wurden (Nom.+Lok.+Lok.+Nom.+Nom.+Nom.)"],["ghaṭotkacādayaḥ sarve devān yakṣān ca bhejire","Ghaṭotkaca und alle die anderen gelangten zu den Göttern und den Yakṣas (Nom.+Nom.+Akk.+Akk.+3.Pl.Perf.)"]]],["023","duryodhanasahāyāś ca rākṣasāḥ parikīrtitāḥ prāptās te kramaśo rājan sarvalokān anuttamān","Und die Rākṣasas, die als Gefährten Duryodhanas genannt wurden, sie erlangten, o König, der Reihe nach alle die höchsten Welten.","",[["duryodhanasahāyāḥ ca rākṣasāḥ parikīrtitāḥ","und die Rākṣasas, die als Gefährten Duryodhanas genannt wurden (Nom.+Nom.+Nom.)"],["prāptāḥ te kramaśaḥ rājan sarvalokān anuttamān","sie erlangten, o König, der Reihe nach alle die höchsten Welten (Nom.+Nom.+Adv.+Vok.+Akk.+Akk.)"]]],["024","bhavanaṃ ca mahendrasya kuberasya ca dhīmataḥ varuṇasya tathā lokān viviśuḥ puruṣarṣabhāḥ","Und in die Wohnstatt des großen Indra sowie des weisen Kubera, und ebenso in die Welten Varuṇas gingen die Stiere unter den Männern ein.","",[["bhavanaṃ ca mahendrasya kuberasya ca dhīmataḥ","und in die Wohnstatt des großen Indra sowie des weisen Kubera (Akk.+Gen.+Gen.+Gen.)"],["varuṇasya tathā lokān viviśuḥ puruṣarṣabhāḥ","und ebenso in die Welten Varuṇas gingen die Stiere unter den Männern ein (Gen.+Adv.+Akk.+3.Pl.Perf.+Nom.)"]]],["025","etat te sarvam ākhyātaṃ vistareṇa mahādyute kurūṇāṃ caritaṃ kṛtsnaṃ pāṇḍavānāṃ ca bhārata","Dies alles wurde dir ausführlich berichtet, o Glanzvoller: das gesamte Wirken der Kurus und der Pāṇḍavas, o Bhārata.“","[Anm.: Abschluss von Vyāsas Bericht, wie von Vaiśaṃpāyana zitiert (CQ-Spanne V009-025).]",[["etat te sarvam ākhyātaṃ vistareṇa mahādyute","dies alles wurde dir ausführlich berichtet, o Glanzvoller (Nom.+Dat.+Nom.+Nom.Part.+Instr.+Vok.)"],["kurūṇāṃ caritaṃ kṛtsnaṃ pāṇḍavānāṃ ca bhārata","das gesamte Wirken der Kurus und der Pāṇḍavas, o Bhārata (Gen.+Nom.+Nom.+Gen.+Vok.)"]]],["026","sūta uvāca etac chrutvā dvijaśreṣṭhāt sa rājā janamejayaḥ vismito 'bhavad atyarthaṃ yajñakarmāntareṣv atha","Sūta sprach: Als er dies von dem Besten der Zweifachgeborenen gehört hatte, geriet König Janamejaya darüber in höchstes Erstaunen, während der Unterbrechungen des Opferwerks.","",[["sūtaḥ uvāca etat śrutvā dvijaśreṣṭhāt saḥ rājā janamejayaḥ","Sūta sprach: als er dies von dem Besten der Zweifachgeborenen gehört hatte, König Janamejaya (Nom.+3.Sg.Perf.+Akk.+Abs.+Abl.+Nom.+Nom.+Nom.)"],["vismitaḥ abhavat atyarthaṃ yajñakarmāntareṣu atha","geriet sodann in höchstes Erstaunen, während der Unterbrechungen des Opferwerks (Nom.+3.Sg.Impf.+Adv.+Lok.+Adv.)"]]],["027","tataḥ samāpayām āsuḥ karma tat tasya yājakāḥ āstīkaś cābhavat prītaḥ parimokṣya bhujaṃgamān","Danach vollendeten seine Opferpriester jenes Werk; und Āstīka war erfreut, nachdem er die Schlangen befreit hatte.","",[["tataḥ samāpayām āsuḥ karma tat tasya yājakāḥ","danach vollendeten seine Opferpriester jenes Werk (Adv.+3.Pl.Perf.+Akk.+Akk.+Gen.+Nom.)"],["āstīkaḥ ca abhavat prītaḥ parimokṣya bhujaṃgamān","und Āstīka war erfreut, nachdem er die Schlangen befreit hatte (Nom.+3.Sg.Impf.+Nom.+Abs.+Akk.)"]]],["028","tato dvijātīn sarvāṃs tān dakṣiṇābhir atoṣayat pūjitāś cāpi te rājñā tato jagmur yathāgatam","Darauf erfreute er alle jene Zweifachgeborenen mit Opfergaben; und von dem König geehrt, zogen sie sodann dahin, woher sie gekommen waren.","",[["tataḥ dvijātīn sarvān tān dakṣiṇābhiḥ atoṣayat","darauf erfreute er alle jene Zweifachgeborenen mit Opfergaben (Adv.+Akk.+Akk.+Akk.+Instr.+3.Sg.Impf.)"],["pūjitāḥ ca api te rājñā tataḥ jagmuḥ yathāgatam","und von dem König geehrt, zogen sie sodann dahin, woher sie gekommen waren (Nom.+Nom.+Instr.+Adv.+3.Pl.Perf.+Adv.)"]]],["029","visarjayitvā viprāṃs tān rājāpi janamejayaḥ tatas takṣaśilāyāḥ sa punar āyād gajāhvayam","Nachdem er jene Brahmanen entlassen hatte, kehrte auch König Janamejaya sodann von Takṣaśilā wieder nach Gajāhvaya zurück.","[Anm.: Gajāhvaya = anderer Name für Hastināpura, die Hauptstadt.]",[["visarjayitvā viprān tān rājā api janamejayaḥ","nachdem er jene Brahmanen entlassen hatte, auch König Janamejaya (Abs.+Akk.+Akk.+Nom.+Adv.+Nom.)"],["tataḥ takṣaśilāyāḥ saḥ punaḥ āyāt gajāhvayam","kehrte sodann von Takṣaśilā wieder zurück nach Gajāhvaya (Adv.+Abl.+Nom.+Adv.+3.Sg.Impf.+Akk.)"]]],["030","etat te sarvam ākhyātaṃ vaiśaṃpāyanakīrtitam vyāsājñayā samākhyātaṃ sarpasatre nṛpasya ha","Dies alles wurde dir berichtet, wie es von Vaiśaṃpāyana verkündet wurde – dargelegt auf Geheiß von Vyāsa, bei jenem Schlangenopfer des Königs.","[Anm.: Abschluss der von Vaiśaṃpāyana berichteten Rahmenhandlung, wie sie Sūta seinerseits weitergibt.]",[["etat te sarvam ākhyātaṃ vaiśaṃpāyanakīrtitam","dies alles wurde dir berichtet, wie es von Vaiśaṃpāyana verkündet wurde (Nom.+Dat.+Nom.+Nom.Part.+Nom.)"],["vyāsājñayā samākhyātaṃ sarpasatre nṛpasya ha","dargelegt auf Geheiß von Vyāsa, bei jenem Schlangenopfer des Königs (Instr.+Nom.Part.+Lok.+Gen.+Partikel)"]]],["031","puṇyo 'yam itihāsākhyaḥ pavitraṃ cedam uttamam kṛṣṇena muninā vipra niyataṃ satyavādinā","Heilig ist diese Erzählung, genannt Itihāsa, und rein und höchst vortrefflich ist sie, o Brahmane, verfasst von dem gesammelten, wahrredenden Weisen Kṛṣṇa,","[Anm.: Ab hier spricht der äußerste Rahmenerzähler Sūta (Ugraśravas) unmittelbar zu Śaunaka und den Weisen im Naimiṣa-Wald - vgl. den Vokativ ,śaunaka' in V044. ,Kṛṣṇa' bezeichnet hier Kṛṣṇa-Dvaipāyana, d.h. Vyāsa.]",[["puṇyaḥ ayam itihāsākhyaḥ pavitraṃ ca idam uttamam","heilig ist diese Erzählung, genannt Itihāsa, und rein und höchst vortrefflich ist sie (Nom.+Nom.+Nom.+Nom.+Nom.+Nom.)"],["kṛṣṇena muninā vipra niyataṃ satyavādinā","o Brahmane, verfasst von dem gesammelten, wahrredenden Weisen Kṛṣṇa (Instr.+Instr.+Vok.+Nom.+Instr.)"]]],["032","sarvajñena vidhijñena dharmajñānavatā satā atīndriyeṇa śucinā tapasā bhāvitātmanā","dem Allwissenden, dem Kenner der Ordnung, dem im Dharma-Wissen Bewanderten, dem Redlichen, dem Übersinnlichen, dem Reinen, dem durch Askese geläuterten Selbst,","",[["sarvajñena vidhijñena dharmajñānavatā satā","dem Allwissenden, dem Kenner der Ordnung, dem im Dharma-Wissen Bewanderten, dem Redlichen (Instr.+Instr.+Instr.+Instr.)"],["atīndriyeṇa śucinā tapasā bhāvitātmanā","dem Übersinnlichen, dem Reinen, dem durch Askese geläuterten Selbst (Instr.+Instr.+Instr.+Instr.)"]]],["033","aiśvarye vartatā caiva sāṃkhyayogavidā tathā naikatantravibuddhena dṛṣṭvā divyena cakṣuṣā","dem in Herrschermacht Weilenden und ebenso dem Kenner von Sāṃkhya und Yoga, dem in vielfachen Lehren Erweckten, der all dies mit göttlichem Auge geschaut hat,","",[["aiśvarye vartatā ca eva sāṃkhyayogavidā tathā","dem in Herrschermacht Weilenden und ebenso dem Kenner von Sāṃkhya und Yoga (Lok.+Instr.+Instr.+Adv.)"],["na ekatantravibuddhena dṛṣṭvā divyena cakṣuṣā","dem in vielfachen Lehren Erweckten, der geschaut hat mit göttlichem Auge (Neg.+Instr.+Abs.+Instr.+Instr.)"]]],["034","kīrtiṃ prathayatā loke pāṇḍavānāṃ mahātmanām anyeṣāṃ kṣatriyāṇāṃ ca bhūridraviṇatejasām","der den Ruhm der großherzigen Pāṇḍavas in der Welt verbreitete, und ebenso den der anderen Kṣatriyas von reichem Besitz und großer Glut.","",[["kīrtiṃ prathayatā loke pāṇḍavānāṃ mahātmanām","der den Ruhm der großherzigen Pāṇḍavas in der Welt verbreitete (Akk.+Instr.+Lok.+Gen.+Gen.)"],["anyeṣāṃ kṣatriyāṇāṃ ca bhūridraviṇatejasām","und den der anderen Kṣatriyas von reichem Besitz und großer Glut (Gen.+Gen.+Gen.)"]]],["035","ya idaṃ śrāvayed vidvān sadā parvaṇi parvaṇi dhūtapāpmā jitasvargo brahmabhūyāya gacchati","Wer dies, der Kundige, stets zu jedem Fest vortragen lässt, der wird, von Sünde gereinigt, den Himmel erobernd, zur Brahman-Wesenheit gelangen.","",[["yaḥ idaṃ śrāvayet vidvān sadā parvaṇi parvaṇi","wer dies, der Kundige, stets zu jedem Fest vortragen lässt (Nom.+Akk.+3.Sg.Opt.+Nom.+Adv.+Lok.+Lok.)"],["dhūtapāpmā jitasvargaḥ brahmabhūyāya gacchati","der wird, von Sünde gereinigt, den Himmel erobernd, zur Brahman-Wesenheit gelangen (Nom.+Nom.+Dat.+3.Sg.Präs.)"]]],["036","yaś cedaṃ śrāvayec chrāddhe brāhmaṇān pādam antataḥ akṣayyam annapānaṃ vai pitṝṃs tasyopatiṣṭhate","Und wer dies bei einem Totenopfer den Brahmanen vortragen lässt, und sei es auch nur ein Viertelvers am Ende, dem stehen unvergängliche Speise und Trank für seine Ahnen bereit.","[Anm.: śrāddha = das rituelle Totenopfer für die Ahnen (Pitṛs).]",[["yaḥ ca idaṃ śrāvayet śrāddhe brāhmaṇān pādam antataḥ","und wer dies bei einem Totenopfer den Brahmanen vortragen lässt, und sei es auch nur ein Viertelvers am Ende (Nom.+Akk.+3.Sg.Opt.+Lok.+Akk.+Akk.+Adv.)"],["akṣayyam annapānaṃ vai pitṝn tasya upatiṣṭhate","dem stehen unvergängliche Speise und Trank für seine Ahnen bereit (Nom.+Nom.+Partikel+Akk.+Gen.+3.Sg.Präs.Med.)"]]],["037","ahnā yad enaḥ kurute indriyair manasāpi vā mahābhāratam ākhyāya paścāt saṃdhyāṃ pramucyate","Welche Schuld ein Mensch tagsüber begeht, mit den Sinnen oder auch mit dem Geist, davon wird er, nachdem er das Mahābhārata vorgetragen hat, zur Abenddämmerung befreit.","",[["ahnā yat enaḥ kurute indriyaiḥ manasā api vā","welche Schuld ein Mensch tagsüber begeht, mit den Sinnen oder auch mit dem Geist (Instr.+Akk.+Akk.+3.Sg.Präs.+Instr.+Instr.)"],["mahābhāratam ākhyāya paścāt saṃdhyāṃ pramucyate","davon wird er, nachdem er das Mahābhārata vorgetragen hat, zur Abenddämmerung befreit (Akk.+Abs.+Adv.+Akk.+3.Sg.Präs.Pass.)"]]],["038","dharme cārthe ca kāme ca mokṣe ca bharatarṣabha yad ihāsti tad anyatra yan nehāsti na tat kva cit","In Bezug auf Dharma, Artha, Kāma und Mokṣa, o Stier der Bharatas: was hier ist, das ist auch anderswo; was hier nicht ist, das ist nirgends.","",[["dharme ca arthe ca kāme ca mokṣe ca bharatarṣabha","in Bezug auf Dharma, Artha, Kāma und Mokṣa, o Stier der Bharatas (Lok.+Lok.+Lok.+Lok.+Vok.)"],["yat iha asti tat anyatra yat na iha asti na tat kva cit","was hier ist, das ist auch anderswo; was hier nicht ist, das ist nirgends (Nom.+Adv.+3.Sg.Präs.+Nom.+Adv.+Nom.+Neg.+Adv.+3.Sg.Präs.+Neg.+Nom.+Adv.)"]]],["039","jayo nāmetihāso 'yaṃ śrotavyo bhūtim icchatā rājñā rājasutaiś cāpi garbhiṇyā caiva yoṣitā","Diese Erzählung, genannt Jaya – das heißt: Sieg –, sollte hören, wer nach Wohlergehen strebt: der König, ebenso die Königssöhne, und auch die schwangere Frau.","[Anm.: Jaya (,Sieg') ist der älteste überlieferte Titel des gesamten Werks.]",[["jayaḥ nāma itihāsaḥ ayaṃ śrotavyaḥ bhūtim icchatā rājñā","diese Erzählung, genannt Jaya, sollte hören, wer nach Wohlergehen strebt, der König (Nom.+Adv.+Nom.+Nom.+Nom.+Akk.+Instr.+Instr.)"],["rājasutaiḥ ca api garbhiṇyā ca eva yoṣitā","ebenso die Königssöhne, und auch die schwangere Frau (Instr.+Instr.+Instr.)"]]],["040","svargakāmo labhet svargaṃ jayakāmo labhej jayam garbhiṇī labhate putraṃ kanyāṃ vā bahubhāginīm","Wer den Himmel begehrt, erlangt den Himmel; wer den Sieg begehrt, erlangt den Sieg; die Schwangere erlangt einen Sohn oder eine Tochter von großem Glücksanteil.","",[["svargakāmaḥ labhet svargaṃ jayakāmaḥ labhet jayam","wer den Himmel begehrt, erlangt den Himmel; wer den Sieg begehrt, erlangt den Sieg (Nom.+3.Sg.Opt.+Akk.+Nom.+3.Sg.Opt.+Akk.)"],["garbhiṇī labhate putraṃ kanyāṃ vā bahubhāginīm","die Schwangere erlangt einen Sohn oder eine Tochter von großem Glücksanteil (Nom.+3.Sg.Präs.Med.+Akk.+Akk.+Akk.)"]]],["041","anāgataṃ tribhir varṣaiḥ kṛṣṇadvaipāyanaḥ prabhuḥ saṃdarbhaṃ bhāratasyāsya kṛtavān dharmakāmyayā","In drei Jahren, ohne Unterlass, hat der Herr Kṛṣṇa-Dvaipāyana diese Zusammenstellung des Bhārata verfasst, aus Verlangen nach dem Dharma.","",[["anāgataṃ tribhiḥ varṣaiḥ kṛṣṇadvaipāyanaḥ prabhuḥ","in drei Jahren, ohne Unterlass, der Herr Kṛṣṇa-Dvaipāyana (Akk.+Instr.+Instr.+Nom.+Nom.)"],["saṃdarbhaṃ bhāratasya asya kṛtavān dharmakāmyayā","hat diese Zusammenstellung des Bhārata verfasst, aus Verlangen nach dem Dharma (Akk.+Gen.+Gen.+Nom.Perf.Part.+Instr.)"]]],["042","nārado 'śrāvayad devān asito devalaḥ pitṝn rakṣo yakṣāñ śuko martyān vaiśaṃpāyana eva tu","Nārada ließ es die Götter hören, Asita Devala die Ahnen, Śuka die Rākṣasas und Yakṣas, die Sterblichen aber eben Vaiśaṃpāyana.","",[["nāradaḥ aśrāvayat devān asitaḥ devalaḥ pitṝn","Nārada ließ es die Götter hören, Asita Devala die Ahnen (Nom.+3.Sg.Impf.+Akk.+Nom.+Nom.+Akk.)"],["rakṣaḥ yakṣān śukaḥ martyān vaiśaṃpāyanaḥ eva tu","Śuka die Rākṣasas und Yakṣas, die Sterblichen aber eben Vaiśaṃpāyana (Akk.+Akk.+Nom.+Akk.+Nom.)"]]],["043","itihāsam imaṃ puṇyaṃ mahārthaṃ vedasaṃmitam śrāvayed yas tu varṇāṃs trīn kṛtvā brāhmaṇam agrataḥ","Wer aber diese heilige, bedeutungsvolle Erzählung, den Veden gleichwertig, den drei Ständen zu Gehör bringt, den Brahmanen voran gestellt,","",[["itihāsam imaṃ puṇyaṃ mahārthaṃ vedasaṃmitam","diese heilige, bedeutungsvolle Erzählung, den Veden gleichwertig (Akk.+Akk.+Akk.+Akk.+Akk.)"],["śrāvayet yaḥ tu varṇān trīn kṛtvā brāhmaṇam agrataḥ","wer aber den drei Ständen zu Gehör bringt, den Brahmanen voran gestellt (3.Sg.Opt.+Nom.+Akk.+Akk.+Abs.+Akk.+Adv.)"]]],["044","sa naraḥ pāpanirmuktaḥ kīrtiṃ prāpyeha śaunaka gacchet paramikāṃ siddhim atra me nāsti saṃśayaḥ","jener Mensch, von Sünde befreit, nachdem er hier Ruhm erlangt hat, o Śaunaka, gelangt zur höchsten Vollendung – daran habe ich keinen Zweifel.","",[["saḥ naraḥ pāpanirmuktaḥ kīrtiṃ prāpya iha śaunaka","jener Mensch, von Sünde befreit, nachdem er hier Ruhm erlangt hat, o Śaunaka (Nom.+Nom.+Nom.+Akk.+Abs.+Adv.+Vok.)"],["gacchet paramikāṃ siddhim atra me na asti saṃśayaḥ","gelangt zur höchsten Vollendung - daran habe ich keinen Zweifel (3.Sg.Opt.+Akk.+Akk.+Adv.+Gen.+Neg.+3.Sg.Präs.+Nom.)"]]],["045","bhāratādhyayanāt puṇyād api pādam adhīyataḥ śraddadhānasya pūyante sarvapāpāny aśeṣataḥ","Durch das heilige Studium des Bhārata – selbst wenn einer nur einen Vers davon studiert, gläubig – werden alle Sünden restlos getilgt.","",[["bhāratādhyayanāt puṇyāt api pādam adhīyataḥ","durch das heilige Studium des Bhārata, selbst wenn einer nur einen Vers davon studiert (Abl.+Abl.+Adv.+Akk.+Gen.Part.)"],["śraddadhānasya pūyante sarvapāpāni aśeṣataḥ","gläubig, werden alle Sünden restlos getilgt (Gen.Part.+3.Pl.Präs.Pass.+Nom.+Adv.)"]]],["046","maharṣir bhagavān vyāsaḥ kṛtvemāṃ saṃhitāṃ purā ślokaiś caturbhir bhagavān putram adhyāpayac chukam","Der große Weise, der erhabene Vyāsa, unterrichtete, nachdem er einst dieses Werk verfasst hatte, seinen Sohn Śuka mit vier Versen.","[Anm.: Die berühmten ,vier Verse' (śloka), mit denen Vyāsa Śuka die Essenz des Werks lehrte, werden hier nicht wörtlich wiedergegeben.]",[["maharṣiḥ bhagavān vyāsaḥ kṛtvā imāṃ saṃhitāṃ purā","der große Weise, der erhabene Vyāsa, nachdem er einst dieses Werk verfasst hatte (Nom.+Nom.+Nom.+Abs.+Akk.+Akk.+Adv.)"],["ślokaiḥ caturbhiḥ bhagavān putram adhyāpayat śukam","unterrichtete, der Erhabene, seinen Sohn Śuka mit vier Versen (Instr.+Instr.+Nom.+Akk.+3.Sg.Impf.+Akk.)"]]],["047","mātāpitṛsahasrāṇi putradāraśatāni ca saṃsāreṣv anubhūtāni yānti yāsyanti cāpare","Tausende von Müttern und Vätern, Hunderte von Söhnen und Gattinnen wurden im Weltenkreislauf erfahren, vergehen, und andere werden noch kommen.","[Anm.: saṃsāra = der Kreislauf von Geburt und Wiedergeburt.]",[["mātāpitṛsahasrāṇi putradāraśatāni ca saṃsāreṣu anubhūtāni","Tausende von Müttern und Vätern, Hunderte von Söhnen und Gattinnen wurden im Weltenkreislauf erfahren (Nom.+Nom.+Lok.+Nom.)"],["yānti yāsyanti ca apare","sie vergehen, und andere werden noch kommen (3.Pl.Präs.+3.Pl.Fut.+Nom.)"]]],["048","harṣasthānasahasrāṇi bhayasthānaśatāni ca divase divase mūḍham āviśanti na paṇḍitam","Tausende von Anlässen der Freude und Hunderte von Anlässen der Furcht befallen Tag für Tag den Verblendeten, nicht aber den Weisen.","",[["harṣasthānasahasrāṇi bhayasthānaśatāni ca divase divase","Tausende von Anlässen der Freude und Hunderte von Anlässen der Furcht, Tag für Tag (Nom.+Nom.+Lok.+Lok.)"],["mūḍham āviśanti na paṇḍitam","befallen den Verblendeten, nicht aber den Weisen (Akk.+3.Pl.Präs.+Neg.+Akk.)"]]],["049","ūrdhvabāhur viraumy eṣa na ca kaś cic chṛṇoti me dharmād arthaś ca kāmaś ca sa kimarthaṃ na sevyate","Mit erhobenen Armen rufe ich dies aus, und doch hört mich niemand: Aus dem Dharma kommen ja Reichtum und Lust – warum wird er, der Dharma, dann nicht gepflegt?","[Anm.: Dieser berühmte Klageruf gilt der Tradition nach als das eigene Wort Vyāsas, obwohl der Vers selbst kein Zitatverb (,er sprach') trägt; er wird hier daher nicht als wörtliche Rede markiert, sondern als überliefertes Sprichwort des Rahmenerzählers wiedergegeben. [?]]",[["ūrdhvabāhuḥ viraumi eṣa na ca kaḥ cit śṛṇoti me","mit erhobenen Armen rufe ich dies aus, und doch hört mich niemand (Nom.+1.Sg.Präs.+Nom.+Neg.+Nom.+3.Sg.Präs.+Gen.)"],["dharmāt arthaḥ ca kāmaḥ ca saḥ kimartham na sevyate","aus dem Dharma kommen ja Reichtum und Lust - warum wird er dann nicht gepflegt (Abl.+Nom.+Nom.+Nom.+Adv.+Neg.+3.Sg.Präs.Pass.)"]]],["050","na jātu kāmān na bhayān na lobhād dharmaṃ tyajej jīvitasyāpi hetoḥ nityo dharmaḥ sukhaduḥkhe tv anitye jīvo nityo hetur asya tv anityaḥ","Niemals sollte man, sei es aus Verlangen, aus Furcht oder aus Gier, den Dharma aufgeben – selbst nicht um des Lebens willen. Ewig ist der Dharma, Glück und Leid aber sind vergänglich; die Seele ist ewig, ihr Grund aber ist vergänglich.","[Anm.: ,jīva' = die individuelle Seele; ,hetu' hier im Sinne des vergänglichen Körpers/Grundes ihrer Erfahrung.]",[["na jātu kāmān na bhayān na lobhāt dharmaṃ tyajet jīvitasya api hetoḥ","niemals sollte man, sei es aus Verlangen, aus Furcht oder aus Gier, den Dharma aufgeben, selbst nicht um des Lebens willen (Neg.+Adv.+Akk.+Neg.+Akk.+Neg.+Abl.+Akk.+3.Sg.Opt.+Gen.+Adv.+Abl.)"],["nityaḥ dharmaḥ sukhaduḥkhe tu anitye jīvaḥ nityaḥ hetuḥ asya tu anityaḥ","ewig ist der Dharma, Glück und Leid aber sind vergänglich; die Seele ist ewig, ihr Grund aber ist vergänglich (Nom.+Nom.+Nom.+Nom.+Nom.+Nom.+Nom.+Gen.+Nom.)"]]],["051","imāṃ bhāratasāvitrīṃ prātar utthāya yaḥ paṭhet sa bhārataphalaṃ prāpya paraṃ brahmādhigacchati","Wer, am Morgen aufgestanden, diese Bhārata-Sāvitrī rezitiert, der erlangt die Frucht des Bhārata und gelangt zum höchsten Brahman.","[Anm.: ,Bhārata-Sāvitrī' bezeichnet traditionell die vorangehenden Verse (insbesondere V050) als heiligen Kernspruch des Werks, nach Analogie zum berühmten Sāvitrī-Mantra des Ṛgveda.]",[["imāṃ bhāratasāvitrīṃ prātaḥ utthāya yaḥ paṭhet","wer, am Morgen aufgestanden, diese Bhārata-Sāvitrī rezitiert (Akk.+Akk.+Adv.+Abs.+Nom.+3.Sg.Opt.)"],["saḥ bhārataphalaṃ prāpya paraṃ brahma adhigacchati","der erlangt die Frucht des Bhārata und gelangt zum höchsten Brahman (Nom.+Akk.+Abs.+Akk.+Akk.+3.Sg.Präs.)"]]],["052","yathā samudro bhagavān yathā ca himavān giriḥ khyātāv ubhau ratnanidhī tathā bhāratam ucyate","So wie der erhabene Ozean und so wie der Himālaya-Berg, beide berühmt als Schatzkammern der Juwelen, so wird auch das Bhārata genannt.","",[["yathā samudraḥ bhagavān yathā ca himavān giriḥ","so wie der erhabene Ozean und so wie der Himālaya-Berg (Adv.+Nom.+Nom.+Adv.+Nom.+Nom.)"],["khyātau ubhau ratnanidhī tathā bhāratam ucyate","beide berühmt als Schatzkammern der Juwelen, so wird auch das Bhārata genannt (Nom.Dual+Nom.Dual+Nom.Dual+Adv.+Nom.+3.Sg.Präs.Pass.)"]]],["053","mahābhāratam ākhyānaṃ yaḥ paṭhet susamāhitaḥ sa gacchet paramāṃ siddhim iti me nāsti saṃśayaḥ","Wer die Erzählung Mahābhārata wohlgesammelten Geistes rezitiert, der gelangt zur höchsten Vollendung – daran, so sage ich, habe ich keinen Zweifel.","",[["mahābhāratam ākhyānaṃ yaḥ paṭhet susamāhitaḥ","wer die Erzählung Mahābhārata wohlgesammelten Geistes rezitiert (Akk.+Akk.+Nom.+3.Sg.Opt.+Nom.)"],["saḥ gacchet paramāṃ siddhim iti me na asti saṃśayaḥ","der gelangt zur höchsten Vollendung, so sage ich, habe ich keinen Zweifel (Nom.+3.Sg.Opt.+Akk.+Akk.+Partikel+Gen.+Neg.+3.Sg.Präs.+Nom.)"]]],["054","dvaipāyanoṣṭhapuṭaniḥsṛtam aprameyaṃ puṇyaṃ pavitram atha pāpaharaṃ śivaṃ ca yo bhārataṃ samadhigacchati vācyamānaṃ kiṃ tasya puṣkarajalair abhiṣecanena","Wer das Bhārata, das den Lippen Dvaipāyanas entströmte, unermesslich, heilig, rein, sündentilgend und heilbringend, während es vorgetragen wird, in sich aufnimmt – was nützt für ihn da noch die Besprengung mit Lotuswasser?","[Anm.: Letzter Vers des gesamten Mahābhārata. Dvaipāyana = Beiname Vyāsas als Verfasser des Werks. Die rhetorische Schlussfrage stellt das Hören/Aufnehmen des Werks über jedes äußere Reinigungsritual.]",[["dvaipāyanoṣṭhapuṭaniḥsṛtam aprameyaṃ puṇyaṃ pavitram","das den Lippen Dvaipāyanas entströmte, unermesslich, heilig, rein (Akk.+Akk.+Akk.+Akk.)"],["atha pāpaharaṃ śivaṃ ca yaḥ bhārataṃ samadhigacchati vācyamānaṃ","und sündentilgend und heilbringend - wer das Bhārata, während es vorgetragen wird, in sich aufnimmt (Adv.+Akk.+Akk.+Nom.+Akk.+3.Sg.Präs.+Akk.Part.)"],["kim tasya puṣkarajalaiḥ abhiṣecanena","was nützt für ihn da noch die Besprengung mit Lotuswasser (Interr.+Gen.+Instr.+Instr.)"]]]]}]}]}</script>

<script>
function loadTheme(){ try{ return localStorage.getItem("mbh-theme")||"system"; }catch(e){ return "system"; } }
function saveTheme(v){ try{ localStorage.setItem("mbh-theme", v); }catch(e){} }
function applyTheme(v){
  var root = document.documentElement;
  if(v === "dark"){ root.setAttribute("data-theme","dark"); }
  else if(v === "light"){ root.setAttribute("data-theme","light"); }
  else { root.removeAttribute("data-theme"); }
}
var currentTheme = loadTheme();
applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", function(){
  var order = ["system","light","dark"];
  var idx = order.indexOf(currentTheme);
  currentTheme = order[(idx+1) % order.length];
  saveTheme(currentTheme);
  applyTheme(currentTheme);
});
document.getElementById("brand-home").addEventListener("click", function(){ go("#/"); });

var BOOK = JSON.parse(document.getElementById("data-book").textContent);

function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatText(s){
  var e = esc(s);
  e = e.replace(/\[\?\]/g, '<span class="unc-q">[?]</span>');
  e = e.replace(/\[Anm\.:[^\]]*\]/g, function(m){ return '<span class="unc-note">' + m + '</span>'; });
  return e;
}
function go(hash){ location.hash = hash; }
function cssEscape(s){ return s.replace(/["\\]/g, "\\$&"); }

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  if(parts.length === 0) return {view:"front"};
  if(parts[0] === "c" && parts[1] && parts[2] !== undefined){ return {view:"chapter", divKey:parts[1], chNum:parseInt(parts[2],10)}; }
  if(parts[0] === "glossary") return {view:"glossary"};
  return {view:"front"};
}

function findChapter(divKey, chNum){
  for(var i=0;i<BOOK.divisions.length;i++){
    var d = BOOK.divisions[i];
    if(d.key === divKey){
      for(var j=0;j<d.chapters.length;j++){ if(d.chapters[j].num === chNum) return {division:d, chapter:d.chapters[j]}; }
    }
  }
  return null;
}
function flatChapterList(){
  var out = [];
  BOOK.divisions.forEach(function(d){ d.chapters.forEach(function(c){ out.push({division:d, chapter:c}); }); });
  return out;
}
function adjacentChapter(divKey, chNum, dir){
  var flat = flatChapterList();
  var idx = -1;
  for(var i=0;i<flat.length;i++){ if(flat[i].division.key === divKey && flat[i].chapter.num === chNum){ idx = i; break; } }
  if(idx === -1) return null;
  var nidx = idx + dir;
  if(nidx < 0 || nidx >= flat.length) return null;
  return flat[nidx];
}

function wfwCell(pair){
  var cls = "wfw-cell" + (pair[1] && pair[1].length > 70 ? " wfw-cell-long" : "");
  return '<div class="' + cls + '"><span class="wfw-sa">' + esc(pair[0]) + '</span><span class="wfw-de">' + esc(pair[1]) + '</span></div>';
}
function wfwHtml(u, uid){
  var html = '<button class="wfw-toggle" data-wfw-target="' + uid + '">Wort f&uuml;r Wort &#9656;</button>';
  html += '<div class="wfw-panel" id="' + uid + '" hidden><div class="wfw-grid">';
  u.wfw.forEach(function(pair){ html += wfwCell(pair); });
  html += '</div></div>';
  return html;
}

var viewEl = document.getElementById("view");

function render(){
  var r = parseHash();
  closeMobileSidebar();
  if(r.view === "chapter"){ renderReader(r); }
  else if(r.view === "glossary"){ renderReader(r); }
  else { renderReader({view:"front"}); }
  window.scrollTo(0,0);
}

function tocChapterHtml(divKey, c, opts){
  var active = opts.view === "chapter" && opts.divKey === divKey && opts.chNum === c.num;
  var label = c.title_de || c.title_sa || ("Nr. " + c.num);
  return '<a class="toc-chapter' + (active?' active':'') + '" href="#/c/' + encodeURIComponent(divKey) + '/' + c.num + '"><span class="tn">' + c.num + '</span>' + esc(label) + '</a>';
}

function frontHtml(){
  var html = '';
  html += '<h1 class="front-title">' + esc(BOOK.title) + '</h1>';
  html += '<p class="front-subtitle">' + esc(BOOK.subtitle) + '</p>';
  var firstDiv = BOOK.divisions[0], firstCh = firstDiv.chapters[0];
  if(firstCh){
    html += '<a class="front-cta" href="#/c/' + encodeURIComponent(firstDiv.key) + '/' + firstCh.num + '">Lesen beginnen &rarr;</a>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.vorwort){
    html += '<div class="front-section"><h2>Vorwort</h2>';
    BOOK.frontmatter.vorwort.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.einfuehrung){
    html += '<div class="front-section"><h2>Einf&uuml;hrung</h2>';
    BOOK.frontmatter.einfuehrung.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  html += '<div class="front-section"><h2>Die 18 Parvas</h2><div class="front-parva-list">';
  BOOK.divisions.forEach(function(d, i){
    html += '<div class="fpl-item"><div class="fpl-num">' + (i+1) + '</div><div><div class="fpl-name">' + esc(d.name) + '</div><div class="fpl-desc">' + esc(d.desc) + (d.chapters.length ? ' <em>&mdash; &uuml;bersetzt bis Adhy&#257;ya ' + d.chapters[d.chapters.length-1].num + '</em>' : ' <em>&mdash; noch nicht begonnen</em>') + '</div></div></div>';
  });
  html += '</div></div>';
  return html;
}

function glossaryHtml(){
  var html = '<h1 class="front-title" style="font-size:28px">Glossar</h1>';
  html += '<p class="front-subtitle">' + BOOK.glossary.length + ' Begriffe, alphabetisch geordnet.</p>';
  var entries = BOOK.glossary.slice().sort(function(a,b){ return a.term.localeCompare(b.term); });
  var lastLetter = null;
  html += '<div class="glossary-grid">';
  entries.forEach(function(e){
    var letter = e.term.charAt(0).toUpperCase();
    if(letter !== lastLetter){ html += '<div class="gl-letter">' + esc(letter) + '</div>'; lastLetter = letter; }
    html += '<div class="gl-entry"><span class="gl-term">' + esc(e.term) + '</span><span class="gl-cat">' + esc(e.category||'') + '</span>';
    html += '<div class="gl-def">' + esc(e.definition) + '</div></div>';
  });
  html += '</div>';
  return html;
}

function chapterHtml(divKey, chNum){
  var found = findChapter(divKey, chNum);
  if(!found) return '<p class="empty-note">Kapitel nicht gefunden.</p>';
  var d = found.division, c = found.chapter;
  var html = '';
  var isFirstOfDivision = d.chapters[0].num === c.num;
  if(isFirstOfDivision){
    html += '<div class="division-banner"><div class="db-label">Parva</div>';
    html += '<h2>' + esc(d.name) + '</h2>';
    if(d.intro) html += '<p>' + formatText(d.intro) + '</p>';
    html += '</div>';
  }
  html += '<div class="chapter-head">';
  html += '<span class="chapter-eyebrow">Adhy&#257;ya ' + c.num + ' &middot; ' + esc(d.name) + '</span>';
  if(c.title_sa) html += '<div class="chapter-title-sa">' + esc(c.title_sa) + '</div>';
  html += '<div class="chapter-title-de">' + esc(c.title_de || ('Adhy&#257;ya ' + c.num)) + '</div>';
  html += '</div>';
  if(c.note){ html += '<div class="chapter-note"><span class="cn-label">Einordnung</span>' + formatText(c.note) + '</div>'; }
  c.units.forEach(function(u, uidx){
    html += '<div class="unit">';
    html += '<span class="unit-n">Vers ' + esc(u.n) + '</span>';
    html += '<div class="unit-sa">' + formatText(u.sa) + '</div>';
    html += '<div class="unit-de">' + formatText(u.de) + '</div>';
    if(u.notes) html += '<div class="unit-notes">' + formatText(u.notes) + '</div>';
    if(u.wfw) html += wfwHtml(u, d.key + "-" + c.num + "-" + uidx);
    html += '</div>';
  });
  var prev = adjacentChapter(divKey, chNum, -1);
  var next = adjacentChapter(divKey, chNum, 1);
  html += '<div class="chapter-pager">';
  if(prev){ html += '<a class="pager-btn prev" href="#/c/' + encodeURIComponent(prev.division.key) + '/' + prev.chapter.num + '"><span class="pg-label">&larr; Zur&uuml;ck</span><span class="pg-title">' + esc(prev.chapter.title_de || ('Adhy&#257;ya ' + prev.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  if(next){ html += '<a class="pager-btn next" href="#/c/' + encodeURIComponent(next.division.key) + '/' + next.chapter.num + '"><span class="pg-label">Weiter &rarr;</span><span class="pg-title">' + esc(next.chapter.title_de || ('Adhy&#257;ya ' + next.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  html += '</div>';
  return html;
}

function renderReader(opts){
  var openDivKey = opts.view === "chapter" ? opts.divKey : (BOOK.divisions[0] && BOOK.divisions[0].key);
  var html = '<div class="reader">';
  html += '<button class="sidebar-toggle" id="sidebar-toggle-btn">&#9776; Inhaltsverzeichnis</button>';
  html += '<aside class="reader-sidebar" id="reader-sidebar">';
  html += '<a class="reader-back" href="#/">&larr; Vorwort &amp; &Uuml;bersicht</a>';
  html += '<div class="sidebar-title">' + esc(BOOK.title) + '</div>';
  html += '<div class="sidebar-sub">18 Parvas &middot; im Aufbau</div>';
  html += '<div class="sidebar-tabs">';
  html += '<button class="sidebar-tab' + (opts.view==="front"?' active':'') + '" data-tab="front">Vorwort</button>';
  html += '<button class="sidebar-tab' + (opts.view==="chapter"?' active':'') + '" data-tab="text">Text</button>';
  html += '<button class="sidebar-tab' + (opts.view==="glossary"?' active':'') + '" data-tab="glossary">Glossar</button>';
  html += '</div>';
  BOOK.divisions.forEach(function(d){
    var isOpen = d.key === openDivKey;
    html += '<div class="toc-division">';
    html += '<div class="toc-division-head' + (isOpen?' open':'') + '" data-div="' + esc(d.key) + '"><span class="car">&#9656;</span>' + esc(d.name) + '</div>';
    html += '<div class="toc-chapters' + (isOpen?' open':'') + '" data-div-body="' + esc(d.key) + '">';
    if(d.chapters.length === 0){ html += '<div class="toc-empty">noch nicht &uuml;bersetzt</div>'; }
    d.chapters.forEach(function(c){ html += tocChapterHtml(d.key, c, opts); });
    html += '</div></div>';
  });
  html += '</aside>';
  html += '<div class="reader-main"><div class="reader-content" id="reader-content">';
  if(opts.view === "front") html += frontHtml();
  else if(opts.view === "glossary") html += glossaryHtml();
  else if(opts.view === "chapter") html += chapterHtml(opts.divKey, opts.chNum);
  html += '</div></div></div>';
  viewEl.innerHTML = html;

  Array.prototype.forEach.call(viewEl.querySelectorAll(".toc-division-head"), function(h){
    h.addEventListener("click", function(){
      h.classList.toggle("open");
      var body = viewEl.querySelector('.toc-chapters[data-div-body="' + cssEscape(h.getAttribute("data-div")) + '"]');
      if(body) body.classList.toggle("open");
    });
  });
  Array.prototype.forEach.call(viewEl.querySelectorAll(".sidebar-tab"), function(t){
    t.addEventListener("click", function(){
      var tab = t.getAttribute("data-tab");
      if(tab === "front") go("#/");
      else if(tab === "glossary") go("#/glossary");
      else {
        var flat = flatChapterList();
        if(flat.length){ go("#/c/" + encodeURIComponent(flat[0].division.key) + "/" + flat[0].chapter.num); }
      }
    });
  });
  var toggleBtn = document.getElementById("sidebar-toggle-btn");
  if(toggleBtn) toggleBtn.addEventListener("click", openMobileSidebar);
  Array.prototype.forEach.call(viewEl.querySelectorAll(".wfw-toggle[data-wfw-target]"), function(btn){
    btn.addEventListener("click", function(){
      var panel = document.getElementById(btn.getAttribute("data-wfw-target"));
      if(!panel) return;
      var open = !panel.hidden;
      panel.hidden = open;
      btn.innerHTML = "Wort f&uuml;r Wort " + (open ? "&#9656;" : "&#9662;");
    });
  });
}

function openMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.add("open"); if(scrim) scrim.classList.add("open");
}
function closeMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.remove("open"); if(scrim) scrim.classList.remove("open");
}
document.getElementById("sidebar-scrim").addEventListener("click", closeMobileSidebar);

window.addEventListener("hashchange", render);
render();
</script>
