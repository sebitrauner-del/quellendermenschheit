yutabalo rājā sa dagdho hi davāgninā","jener König von der Kraft zehntausend Elefanten - er wurde vom Waldbrand verbrannt (Nom.Bahuvrīhi + Nom. + Nom. + Nom.Part.Perf.Pass. + Instr.)"]]],["004","yaṃ purā paryavījanta tālavṛntair varastriyaḥ taṃ gṛdhrāḥ paryavījanta dāvāgniparikālitam","Ihn, den einst edle Frauen mit Palmblatt-Fächern kühlten, ihn umkreisten Geier, als er vom Waldbrand versengt war.","",[["yaṃ purā paryavījanta tālavṛntair varastriyaḥ","den einst edle Frauen mit Palmblatt-Fächern kühlten (Akk. + Adv. + Impf. + Instr.Pl. + Nom.Pl.)"],["taṃ gṛdhrāḥ paryavījanta dāvāgniparikālitam","ihn umkreisten Geier, als er vom Waldbrand versengt war (Akk. + Nom.Pl. + Impf. + Akk.Bahuvrīhi)"]]],["005","sūtamāgadhasaṃghaiś ca śayāno yaḥ prabodhyate dharaṇyāṃ sa nṛpaḥ śete pāpasya mama karmabhiḥ","Er, der, wenn er ruhte, von Scharen von Barden und Lobsängern geweckt wurde - dieser König liegt nun auf der Erde, durch meine sündigen Taten.","",[["sūtamāgadhasaṃghaiś ca śayāno yaḥ prabodhyate","der, wenn er ruhte, von Scharen von Barden und Lobsängern geweckt wurde (Instr.Pl. + Nom.Part. + Nom. + Präs.Pass.)"],["dharaṇyāṃ sa nṛpaḥ śete pāpasya mama karmabhiḥ","dieser König liegt nun auf der Erde, durch meine sündigen Taten (Lok. + Nom. + Nom. + Präs.Med. + Gen. + Gen. + Instr.Pl.)"]]],["006","na tu śocāmi gāndhārīṃ hataputrāṃ yaśasvinīm patilokam anuprāptāṃ tathā bhartṛvrate sthitām","Doch um Gāndhārī trauere ich nicht, die ruhmreiche, deren Söhne erschlagen waren, die zur Welt ihres Gatten gelangt ist, da sie ja dem Gelübde der Gattentreue folgte.","",[["na tu śocāmi gāndhārīṃ hataputrāṃ yaśasvinīm","doch um Gāndhārī trauere ich nicht, die ruhmreiche, deren Söhne erschlagen waren (Neg. + Präs. + Akk. + Akk.Bahuvrīhi + Akk.)"],["patilokam anuprāptāṃ tathā bhartṛvrate sthitām","die zur Welt ihres Gatten gelangt ist, da sie ja dem Gelübde der Gattentreue folgte (Akk. + Akk.Part.Perf.Pass. + Adv. + Lok. + Akk.Part.Perf.)"]]],["007","pṛthām eva tu śocāmi yā putraiśvaryam ṛddhimat utsṛjya sumahad dīptaṃ vanavāsam arocayat","Um Pṛthā aber trauere ich, die den mächtigen Wohlstand ihrer Söhne aufgab und den überaus großen, glänzenden Waldaufenthalt vorzog.","",[["pṛthām eva tu śocāmi yā putraiśvaryam ṛddhimat","um Pṛthā aber trauere ich, die den mächtigen Wohlstand ihrer Söhne (Akk. + Präs. + Nom. + Akk. + Akk.)"],["utsṛjya sumahad dīptaṃ vanavāsam arocayat","aufgab und den überaus großen, glänzenden Waldaufenthalt vorzog (Absol. + Akk. + Akk. + Akk. + Impf.)"]]],["008","dhig rājyam idam asmākaṃ dhig balaṃ dhik parākramam kṣatradharmaṃ ca dhig yasmān mṛtā jīvāmahe vayam","Wehe diesem unserem Königreich, wehe unserer Kraft, wehe unserer Tapferkeit, und wehe dem Kṣatriya-Dharma, durch den wir, obwohl tot, doch am Leben sind.","",[["dhig rājyam idam asmākaṃ dhig balaṃ dhik parākramam","wehe diesem unserem Königreich, wehe unserer Kraft, wehe unserer Tapferkeit (Interj. + Akk. + Akk. + Gen. + Interj. + Akk. + Interj. + Akk.)"],["kṣatradharmaṃ ca dhig yasmān mṛtā jīvāmahe vayam","und wehe dem Kṣatriya-Dharma, durch den wir, obwohl tot, doch am Leben sind (Akk. + Interj. + Abl. + Nom.Pl.Part.Perf. + Präs.Med. + Nom.)"]]],["009","susūkṣmā kila kālasya gatir dvijavarottama yat samutsṛjya rājyaṃ sā vanavāsam arocayat","Sehr fein wahrlich ist der Gang der Zeit, Bester der Zweifachgeborenen, dass sie, das Königreich aufgebend, den Waldaufenthalt vorzog.","",[["susūkṣmā kila kālasya gatir dvijavarottama","sehr fein wahrlich ist der Gang der Zeit, Bester der Zweifachgeborenen (Nom. + Adv. + Gen. + Nom. + Vok.)"],["yat samutsṛjya rājyaṃ sā vanavāsam arocayat","dass sie, das Königreich aufgebend, den Waldaufenthalt vorzog (Nom. + Absol. + Akk. + Nom. + Akk. + Impf.)"]]],["010","yudhiṣṭhirasya jananī bhīmasya vijayasya ca anāthavat kathaṃ dagdhā iti muhyāmi cintayan","Die Mutter Yudhiṣṭhiras, Bhīmas und Vijayas - wie wurde sie wie eine Beschützerlose verbrannt? So denkend verliere ich die Fassung.","",[["yudhiṣṭhirasya jananī bhīmasya vijayasya ca","die Mutter Yudhiṣṭhiras, Bhīmas und Vijayas (Gen. + Nom. + Gen. + Gen.)"],["anāthavat kathaṃ dagdhā iti muhyāmi cintayan","wie wurde sie wie eine Beschützerlose verbrannt? So denkend verliere ich die Fassung (Adv. + Interrog. + Nom.Part.Perf.Pass. + Indekl. + Präs. + Nom.Part.)"]]],["011","vṛthā saṃtoṣito vahniḥ khāṇḍave savyasācinā upakāram ajānan sa kṛtaghna iti me matiḥ","Umsonst wurde das Feuer im Khāṇḍava-Wald von Savyasācin gesättigt; die Wohltat nicht erkennend, ist es, wie ich meine, undankbar.","",[["vṛthā saṃtoṣito vahniḥ khāṇḍave savyasācinā","umsonst wurde das Feuer im Khāṇḍava-Wald von Savyasācin gesättigt (Adv. + Nom.Part.Perf.Pass. + Nom. + Lok. + Instr.)"],["upakāram ajānan sa kṛtaghna iti me matiḥ","die Wohltat nicht erkennend, ist es, wie ich meine, undankbar (Akk. + Nom.Part.Neg. + Nom. + Nom. + Indekl. + Gen. + Nom.)"]]],["012","yatrādahat sa bhagavān mātaraṃ savyasācinaḥ kṛtvā yo brāhmaṇacchadma bhikṣārthī samupāgataḥ dhig agniṃ dhik ca pārthasya viśrutāṃ satyasaṃdhatām","Es, das erhabene Wesen, das einst die Gestalt eines um Almosen bittenden Brahmanen angenommen und sich genähert hatte - eben dieses hat nun die Mutter des Savyasācin verbrannt: wehe dem Feuer, und wehe der berühmten Wahrhaftigkeit des Pārtha.","[Anm.: bitteres Wortspiel - Arjunas berühmtes Versprechen (satyasaṃdhatā) an den als Bettel-Brahmanen verkleideten Agni im Khāṇḍava-Mythos wird hier durch dessen scheinbaren \"Undank\" ironisch gebrochen.]",[["yatrādahat sa bhagavān mātaraṃ savyasācinaḥ","das erhabene Wesen, das die Mutter des Savyasācin verbrannt hat (Rel.Adv. + Impf. + Nom. + Nom. + Akk. + Gen.)"],["kṛtvā yo brāhmaṇacchadma bhikṣārthī samupāgataḥ dhig agniṃ dhik ca pārthasya viśrutāṃ satyasaṃdhatām","das einst die Gestalt eines um Almosen bittenden Brahmanen angenommen und sich genähert hatte - wehe dem Feuer, und wehe der berühmten Wahrhaftigkeit des Pārtha (Absol. + Nom. + Akk. + Nom.Bahuvrīhi + Nom.Part.Perf. + Interj. + Akk. + Interj. + Gen. + Akk. + Akk.)"]]],["013","idaṃ kaṣṭataraṃ cānyad bhagavan pratibhāti me vṛthāgninā samāyogo yad abhūt pṛthivīpateḥ","Und dies erscheint mir noch schmerzlicher, Erhabener: dass die Vereinigung des Herrschers der Erde mit dem nutzlosen Feuer geschah.","",[["idaṃ kaṣṭataraṃ cānyad bhagavan pratibhāti me","und dies erscheint mir noch schmerzlicher, Erhabener (Nom. + Nom. + Nom. + Vok. + Präs. + Dat.)"],["vṛthāgninā samāyogo yad abhūt pṛthivīpateḥ","dass die Vereinigung des Herrschers der Erde mit dem nutzlosen Feuer geschah (Instr. + Nom. + Nom. + Impf. + Gen.)"]]],["014","tathā tapasvinas tasya rājarṣeḥ kauravasya ha katham evaṃvidho mṛtyuḥ praśāsya pṛthivīm imām","Wie konnte ein solcher Tod jenen asketischen königlichen Weisen, den Kaurava, treffen, der doch diese Erde beherrscht hatte?","",[["tathā tapasvinas tasya rājarṣeḥ kauravasya ha","jenen asketischen königlichen Weisen, den Kaurava (Adv. + Gen. + Gen. + Gen. + Gen.)"],["katham evaṃvidho mṛtyuḥ praśāsya pṛthivīm imām","wie konnte ein solcher Tod ihn treffen, der doch diese Erde beherrscht hatte (Interrog. + Nom. + Nom. + Nom.Part. + Akk. + Akk.)"]]],["015","tiṣṭhatsu mantrapūteṣu tasyāgniṣu mahāvane vṛthāgninā samāyukto niṣṭhāṃ prāptaḥ pitā mama","Während seine durch Mantras geheiligten Opferfeuer noch im großen Wald bestanden, fand mein Vater sein Ende, vereint mit einem nutzlosen Feuer.","",[["tiṣṭhatsu mantrapūteṣu tasyāgniṣu mahāvane","während seine durch Mantras geheiligten Opferfeuer noch im großen Wald bestanden (Lok.Pl.Abs.Part. + Lok.Pl. + Gen.Lok.Pl. + Lok.)"],["vṛthāgninā samāyukto niṣṭhāṃ prāptaḥ pitā mama","fand mein Vater sein Ende, vereint mit einem nutzlosen Feuer (Instr. + Nom.Part. + Akk. + Nom.Part.Perf.Pass. + Nom. + Gen.)"]]],["016","manye pṛthā vepamānā kṛśā dhamanisaṃtatā hā tāta dharmarājeti samākrandan mahābhaye","Ich denke mir Pṛthā, zitternd, abgemagert, von Adern durchzogen, wie sie, ‚Ach, Vater, Dharmarāja!‘ rufend, in großer Furcht laut klagte,","",[["manye pṛthā vepamānā kṛśā dhamanisaṃtatā","ich denke mir Pṛthā, zitternd, abgemagert, von Adern durchzogen (Präs.Med. + Nom. + Nom.Part. + Nom. + Nom.Bahuvrīhi)"],["hā tāta dharmarājeti samākrandan mahābhaye","‚Ach, Vater, Dharmarāja!‘ rufend, in großer Furcht laut klagte sie (Interj. + Vok. + Vok. + Indekl. + Nom.Part. + Lok.)"]]],["017","bhīma paryāpnuhi bhayād iti caivābhivāśatī samantataḥ parikṣiptā mātā me 'bhūt davāgninā","und ‚Bhīma, rette mich aus der Gefahr!‘ so laut rufend - meine Mutter, allseits vom Waldbrand umschlossen.","",[["bhīma paryāpnuhi bhayād iti caivābhivāśatī","‚Bhīma, rette mich aus der Gefahr!‘ so laut rufend (Vok. + Imp. + Abl. + Indekl. + Nom.Part.)"],["samantataḥ parikṣiptā mātā me 'bhūt davāgninā","meine Mutter, allseits vom Waldbrand umschlossen (Adv. + Nom.Part.Perf.Pass. + Nom. + Gen. + Impf. + Instr.)"]]],["018","sahadevaḥ priyas tasyāḥ putrebhyo 'dhika eva tu na caināṃ mokṣayām āsa vīro mādravatīsutaḥ","Sahadeva, der ihr Liebster, mehr noch als die anderen Söhne, konnte sie doch nicht retten, der Held, der Sohn der Mādravatī.“","",[["sahadevaḥ priyas tasyāḥ putrebhyo 'dhika eva tu","Sahadeva, der ihr Liebster, mehr noch als die anderen Söhne (Nom. + Nom. + Gen. + Dat.Pl. + Nom. + Adv.)"],["na caināṃ mokṣayām āsa vīro mādravatīsutaḥ","konnte sie doch nicht retten, der Held, der Sohn der Mādravatī (Neg. + Akk. + Perf.Periphr.Kaus. + Nom. + Nom.)"]]],["019","tac chrutvā ruruduḥ sarve samāliṅgya parasparam pāṇḍavāḥ pañca duḥkhārtā bhūtānīva yugakṣaye","Als sie dies vernommen hatten, weinten alle fünf Pāṇḍavas, einander umarmend, von Leid gequält, wie die Geschöpfe beim Weltuntergang.","",[["tac chrutvā ruruduḥ sarve samāliṅgya parasparam","als sie dies vernommen hatten, weinten alle, einander umarmend (Akk. + Absol. + Perf. + Nom.Pl. + Absol. + Akk.)"],["pāṇḍavāḥ pañca duḥkhārtā bhūtānīva yugakṣaye","die fünf Pāṇḍavas, von Leid gequält, wie die Geschöpfe beim Weltuntergang (Nom.Pl. + Nom. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Lok.)"]]],["020","teṣāṃ tu puruṣendrāṇāṃ rudatāṃ ruditasvanaḥ prāsādābhogasaṃruddho anvarautsīt sa rodasī","Und der Klagelaut jener weinenden Herren der Menschen, eingeschlossen im Umkreis des Palastes, ließ Himmel und Erde widerhallen.","",[["teṣāṃ tu puruṣendrāṇāṃ rudatāṃ ruditasvanaḥ","und der Klagelaut jener weinenden Herren der Menschen (Gen.Pl. + Gen.Pl. + Gen.Pl.Part. + Nom.Bahuvrīhi)"],["prāsādābhogasaṃruddho anvarautsīt sa rodasī","eingeschlossen im Umkreis des Palastes, ließ er Himmel und Erde widerhallen (Nom.Part.Perf.Pass. + Aor. + Nom. + Akk.Du.)"]]]]},{"num":47,"title_sa":"","title_de":"Die Totenopfer und Yudhiṣṭhiras Rückkehr zur Herrschaft","note":"Letztes Kapitel des Āśramavāsikaparva: Nārada tröstet Yudhiṣṭhira, Totenopfer und Gabenverteilung am Gaṅgādvāra im Gedenken an Dhṛtarāṣṭra, Gāndhārī und Kuntī, Rückkehr nach Hāstinapura. Quellhinweis: nach diesem Kapitel endet Parva 15 im GRETIL-Korpus (bestätigt durch Suche nach Marker \"16,001.001\"); die ursprüngliche automatische Extraktion war fälschlich bis in den Anfang des Mausalaparva (Buch 16) hineingelaufen (bekannte Parva-Grenzen-Falle bei fehlendem Folgekapitel) und wurde manuell auf die korrekte Kapitelgrenze (Offset 14174777–14179220) zurückgeschnitten.","units":[["001","nārada uvāca nāsau vṛthāgninā dagdho yathā tatra śrutaṃ mayā vaicitravīryo nṛpatis tat te vakṣyāmi bhārata","Nārada sprach: „Nicht wurde jener Herrscher, der Sohn des Vicitravīrya, nutzlos vom Feuer verbrannt, wie dort von mir gehört wurde; das werde ich dir sagen, o Bhārata.","",[["nārada uvāca nāsau vṛthāgninā dagdho yathā tatra śrutaṃ mayā","Nārada sprach: nicht wurde jener nutzlos vom Feuer verbrannt, wie dort von mir gehört wurde (Nom. + Neg. + Instr. + Nom.Part.Perf.Pass. + Adv. + Adv. + Nom.Part.Perf.Pass. + Instr.)"],["vaicitravīryo nṛpatis tat te vakṣyāmi bhārata","der Herrscher, der Sohn des Vicitravīrya; das werde ich dir sagen, o Bhārata (Nom. + Nom. + Akk. + Dat. + Fut. + Vok.)"]]],["002","vanaṃ praviśatā tena vāyubhakṣeṇa dhīmatā agnayaḥ kārayitveṣṭim utsṛṣṭā iti naḥ śrutam","Von jenem Weisen, der, nur von Luft lebend, in den Wald eingegangen war, wurden, nachdem er ein Opfer hatte vollziehen lassen, die Feuer entlassen - so haben wir gehört.","",[["vanaṃ praviśatā tena vāyubhakṣeṇa dhīmatā","von jenem Weisen, der, nur von Luft lebend, in den Wald eingegangen war (Akk. + Instr.Part. + Instr. + Instr.Bahuvrīhi + Instr.)"],["agnayaḥ kārayitveṣṭim utsṛṣṭā iti naḥ śrutam","wurden, nachdem er ein Opfer hatte vollziehen lassen, die Feuer entlassen - so haben wir gehört (Nom.Pl. + Absol.Kaus. + Akk. + Nom.Pl.Part.Perf.Pass. + Indekl. + Gen. + Nom.Part.Perf.Pass.)"]]],["003","yājakās tu tatas tasya tān agnīn nirjane vane samutsṛjya yathākāmaṃ jagmur bharatasattama","Seine Opferpriester aber gingen darauf, nachdem sie jene Feuer im einsamen Wald zurückgelassen hatten, nach Belieben fort, Bester der Bharatas.","",[["yājakās tu tatas tasya tān agnīn nirjane vane","seine Opferpriester aber darauf, jene Feuer im einsamen Wald (Nom.Pl. + Gen. + Akk.Pl. + Akk.Pl. + Lok. + Lok.)"],["samutsṛjya yathākāmaṃ jagmur bharatasattama","nachdem sie zurückgelassen hatten, gingen sie nach Belieben fort, Bester der Bharatas (Absol. + Adv. + Perf. + Vok.)"]]],["004","sa vivṛddhas tadā vahnir vane tasminn abhūt kila tena tad vanam ādīptam iti me tāpasābruvan","Jenes Feuer wuchs damals in jenem Wald an, wie es heißt; durch dieses wurde jener Wald in Brand gesetzt - so sagten mir die Asketen.","",[["sa vivṛddhas tadā vahnir vane tasminn abhūt kila","jenes Feuer wuchs damals in jenem Wald an, wie es heißt (Nom. + Nom.Part.Perf. + Adv. + Nom. + Lok. + Impf. + Adv.)"],["tena tad vanam ādīptam iti me tāpasābruvan","durch dieses wurde jener Wald in Brand gesetzt - so sagten mir die Asketen (Instr. + Nom. + Nom.Part.Perf.Pass. + Indekl. + Dat. + Nom.Pl. + Impf.)"]]],["005","sa rājā jāhnavīkacche yathā te kathitaṃ mayā tenāgninā samāyuktaḥ svenaiva bharatarṣabha","Jener König wurde am Ufer der Gaṅgā, wie ich dir bereits erzählt habe, mit eben diesem, seinem eigenen Feuer vereint, Stier der Bharatas.","",[["sa rājā jāhnavīkacche yathā te kathitaṃ mayā","jener König wurde am Ufer der Gaṅgā, wie ich dir bereits erzählt habe (Nom. + Nom. + Lok. + Adv. + Dat. + Nom.Part.Perf.Pass. + Instr.)"],["tenāgninā samāyuktaḥ svenaiva bharatarṣabha","mit eben diesem, seinem eigenen Feuer vereint, Stier der Bharatas (Instr. + Nom.Part.Perf.Pass. + Instr. + Vok.)"]]],["006","evam āvedayām āsur munayas te mamānagha ye te bhāgīrathītīre mayā dṛṣṭā yudhiṣṭhira","So berichteten mir dies jene Weisen, o Schuldloser, die ich am Ufer der Bhāgīrathī gesehen habe, o Yudhiṣṭhira.","",[["evam āvedayām āsur munayas te mamānagha","so berichteten mir dies jene Weisen, o Schuldloser (Adv. + Perf.Periphr.Kaus. + Nom.Pl. + Nom.Pl. + Dat. + Vok.)"],["ye te bhāgīrathītīre mayā dṛṣṭā yudhiṣṭhira","die ich am Ufer der Bhāgīrathī gesehen habe, o Yudhiṣṭhira (Nom.Pl. + Nom.Pl. + Lok. + Instr. + Nom.Pl.Part.Perf.Pass. + Vok.)"]]],["007","evaṃ svenāgninā rājā samāyukto mahīpate mā śocithās tvaṃ nṛpatiṃ gataḥ sa paramāṃ gatim","So wurde der König mit seinem eigenen Feuer vereint, Herrscher der Erde; trauere nicht um den König - er ist zum höchsten Ziel gegangen.","",[["evaṃ svenāgninā rājā samāyukto mahīpate","so wurde der König mit seinem eigenen Feuer vereint, Herrscher der Erde (Adv. + Instr. + Nom. + Nom.Part.Perf.Pass. + Vok.)"],["mā śocithās tvaṃ nṛpatiṃ gataḥ sa paramāṃ gatim","trauere nicht um den König - er ist zum höchsten Ziel gegangen (Neg. + Aor.Inj. + Nom. + Akk. + Nom.Part.Perf. + Nom. + Akk. + Akk.)"]]],["008","guruśuśrūṣayā caiva jananī tava pāṇḍava prāptā sumahatīṃ siddhim iti me nātra saṃśayaḥ","Und durch den Dienst an den Lehrern hat auch deine Mutter, o Pāṇḍava, sehr große Vollendung erlangt - daran habe ich keinen Zweifel.","",[["guruśuśrūṣayā caiva jananī tava pāṇḍava","und durch den Dienst an den Lehrern deine Mutter, o Pāṇḍava (Instr. + Nom. + Gen. + Vok.)"],["prāptā sumahatīṃ siddhim iti me nātra saṃśayaḥ","hat sehr große Vollendung erlangt - daran habe ich keinen Zweifel (Nom.Part.Perf.Pass. + Akk. + Akk. + Indekl. + Gen. + Neg. + Adv. + Nom.)"]]],["009","kartum arhasi kauravya teṣāṃ tvam udakakriyām bhrātṛbhiḥ sahitaḥ sarvair etad atra vidhīyatām","Du sollst, Kaurava, für sie die Wasserspende vollziehen, zusammen mit all deinen Brüdern - dies möge hier vollzogen werden.“","",[["kartum arhasi kauravya teṣāṃ tvam udakakriyām","du sollst, Kaurava, für sie die Wasserspende vollziehen (Inf. + Präs. + Vok. + Gen.Pl. + Nom. + Akk.)"],["bhrātṛbhiḥ sahitaḥ sarvair etad atra vidhīyatām","zusammen mit all deinen Brüdern - dies möge hier vollzogen werden (Instr.Pl. + Nom.Part. + Instr.Pl. + Nom. + Adv. + Opt.Pass.)"]]],["010","vaiśaṃpāyana uvāca tataḥ sa pṛthivīpālaḥ pāṇḍavānāṃ dhuraṃdharaḥ niryayau saha sodaryaiḥ sadāro bharatarṣabha","Vaiśaṃpāyana sprach: Da zog jener Herrscher der Erde, der Träger der Bürde der Pāṇḍavas, zusammen mit seinen leiblichen Brüdern und seiner Gattin aus, Stier der Bharatas.","",[["vaiśaṃpāyana uvāca tataḥ sa pṛthivīpālaḥ pāṇḍavānāṃ dhuraṃdharaḥ","Vaiśaṃpāyana sprach: da jener Herrscher der Erde, der Träger der Bürde der Pāṇḍavas (Nom. + Adv. + Nom. + Nom. + Gen.Pl. + Nom.)"],["niryayau saha sodaryaiḥ sadāro bharatarṣabha","zog aus, zusammen mit seinen leiblichen Brüdern und seiner Gattin, Stier der Bharatas (Perf. + Instr.Pl. + Nom.Bahuvrīhi + Vok.)"]]],["011","paurajānapadāś caiva rājabhaktipuraskṛtāḥ gaṅgāṃ prajagmur abhito vāsasaikena saṃvṛtāḥ","Und die Bürger und Landbewohner, von Ergebenheit zum König geleitet, zogen zur Gaṅgā, jeder nur mit einem einzigen Gewand bekleidet.","",[["paurajānapadāś caiva rājabhaktipuraskṛtāḥ","und die Bürger und Landbewohner, von Ergebenheit zum König geleitet (Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["gaṅgāṃ prajagmur abhito vāsasaikena saṃvṛtāḥ","zogen zur Gaṅgā, jeder nur mit einem einzigen Gewand bekleidet (Akk. + Perf. + Adv. + Instr. + Nom.Pl.Part.Perf.Pass.)"]]],["012","tato 'vagāhya salilaṃ sarve te kurupuṃgavāḥ yuyutsum agrataḥ kṛtvā dadus toyaṃ mahātmane","Da tauchten alle jene Stiere der Kurus in das Wasser ein, und, Yuyutsu vorangestellt, spendeten sie dem Großherzigen Wasser.","",[["tato 'vagāhya salilaṃ sarve te kurupuṃgavāḥ","da tauchten alle jene Stiere der Kurus in das Wasser ein (Adv. + Absol. + Akk. + Nom.Pl. + Nom.Pl. + Nom.Pl.)"],["yuyutsum agrataḥ kṛtvā dadus toyaṃ mahātmane","und, Yuyutsu vorangestellt, spendeten sie dem Großherzigen Wasser (Akk. + Adv. + Absol. + Perf. + Akk. + Dat.)"]]],["013","gāndhāryāś ca pṛthāyāś ca vidhivan nāmagotrataḥ śaucaṃ nivartayantas te tatroṣur nagarād bahiḥ","Und, nachdem sie vorschriftsgemäß, unter Nennung von Namen und Geschlecht, auch für Gāndhārī und Pṛthā die Reinigungshandlung vollzogen hatten, verweilten sie dort außerhalb der Stadt.","",[["gāndhāryāś ca pṛthāyāś ca vidhivan nāmagotrataḥ","auch für Gāndhārī und Pṛthā, vorschriftsgemäß, unter Nennung von Namen und Geschlecht (Gen. + Gen. + Adv. + Adv.)"],["śaucaṃ nivartayantas te tatroṣur nagarād bahiḥ","nachdem sie die Reinigungshandlung vollzogen hatten, verweilten sie dort außerhalb der Stadt (Akk. + Nom.Pl.Part. + Perf. + Abl. + Adv.)"]]],["014","preṣayām āsa sa narān vidhijñān āptakāriṇaḥ gaṅgādvāraṃ kuruśreṣṭho yatra dagdho 'bhavan nṛpaḥ","Der Beste der Kurus sandte vorschriftskundige, vertrauenswürdige Männer zum Gaṅgādvāra, wo der König verbrannt worden war.","",[["preṣayām āsa sa narān vidhijñān āptakāriṇaḥ","er sandte vorschriftskundige, vertrauenswürdige Männer (Perf.Periphr.Kaus. + Nom. + Akk.Pl. + Akk.Pl. + Akk.Pl.)"],["gaṅgādvāraṃ kuruśreṣṭho yatra dagdho 'bhavan nṛpaḥ","der Beste der Kurus zum Gaṅgādvāra, wo der König verbrannt worden war (Akk. + Nom. + Rel.Adv. + Nom.Part.Perf.Pass. + Impf. + Nom.)"]]],["015","tatraiva teṣāṃ kulyāni gaṅgādvāre 'nvaśāt tadā kartavyānīti puruṣān dattadeyān mahīpatiḥ","Eben dort, am Gaṅgādvāra, befahl der Herrscher der Erde den Männern, denen er Anweisungen gegeben hatte, dass die Gebeine [?] dort zu bestatten seien.","[?] \"kulyāni\" hier vermutlich i.S.v. sterblichen Überresten/Gebeinen der Verbrannten, nicht der wörtlichen Grundbedeutung \"Kanäle\".",[["tatraiva teṣāṃ kulyāni gaṅgādvāre 'nvaśāt tadā","eben dort, am Gaṅgādvāra, befahl er da bezüglich ihrer Gebeine (Adv. + Gen.Pl. + Akk.Pl. + Lok. + Impf. + Adv.)"],["kartavyānīti puruṣān dattadeyān mahīpatiḥ","dass sie zu vollziehen seien - den Männern, denen er Anweisungen gegeben hatte, der Herrscher der Erde (Akk.Pl.Part.Fut.Pass. + Indekl. + Akk.Pl. + Akk.Pl.Bahuvrīhi + Nom.)"]]],["016","dvādaśe 'hani tebhyaḥ sa kṛtaśauco narādhipaḥ dadau śrāddhāni vidhivad dakṣiṇāvanti pāṇḍavaḥ","Am zwölften Tag, nachdem er die Reinigung vollzogen hatte, brachte der Herrscher der Menschen, der Pāṇḍava, ihnen vorschriftsgemäß die Totenopfer dar, mit Priestergaben versehen.","",[["dvādaśe 'hani tebhyaḥ sa kṛtaśauco narādhipaḥ","am zwölften Tag, nachdem er die Reinigung vollzogen hatte, der Herrscher der Menschen (Lok. + Dat.Pl. + Nom. + Nom.Bahuvrīhi + Nom.)"],["dadau śrāddhāni vidhivad dakṣiṇāvanti pāṇḍavaḥ","brachte der Pāṇḍava ihnen vorschriftsgemäß die Totenopfer dar, mit Priestergaben versehen (Perf. + Akk.Pl. + Adv. + Akk.Pl.Bahuvrīhi + Nom.)"]]],["017","dhṛtarāṣṭraṃ samuddiśya dadau sa pṛthivīpatiḥ suvarṇaṃ rajataṃ gāś ca śayyāś ca sumahādhanāḥ","Im Gedenken an Dhṛtarāṣṭra gab jener Herrscher der Erde Gold, Silber, Kühe und Betten von sehr großem Wert.","",[["dhṛtarāṣṭraṃ samuddiśya dadau sa pṛthivīpatiḥ","im Gedenken an Dhṛtarāṣṭra gab jener Herrscher der Erde (Akk. + Absol. + Perf. + Nom. + Nom.)"],["suvarṇaṃ rajataṃ gāś ca śayyāś ca sumahādhanāḥ","Gold, Silber, Kühe und Betten von sehr großem Wert (Akk. + Akk. + Akk.Pl. + Akk.Pl. + Akk.Pl.Bahuvrīhi)"]]],["018","gāndhāryāś caiva tejasvī pṛthāyāś ca pṛthak pṛthak saṃkīrtya nāmanī rājā dadau dānam anuttamam","Und der Glanzvolle, der König, nannte auch die Namen Gāndhārīs und Pṛthās, jeweils getrennt, und gab unübertreffliche Gaben.","",[["gāndhāryāś caiva tejasvī pṛthāyāś ca pṛthak pṛthak","und der Glanzvolle die Namen Gāndhārīs und Pṛthās, jeweils getrennt (Gen. + Nom. + Gen. + Adv. + Adv.)"],["saṃkīrtya nāmanī rājā dadau dānam anuttamam","nannte der König, und gab unübertreffliche Gaben (Absol. + Akk.Du. + Nom. + Perf. + Akk. + Akk.)"]]],["019","yo yad icchati yāvac ca tāvat sa labhate dvijaḥ śayanaṃ bhojanaṃ yānaṃ maṇiratnam atho dhanam","Wer was auch immer und so viel wünschte, das erhielt der Zweifachgeborene: Lager, Speise, Fahrzeug, Juwelen und auch Reichtum.","",[["yo yad icchati yāvac ca tāvat sa labhate dvijaḥ","wer was auch immer und so viel wünschte, das erhielt der Zweifachgeborene (Nom. + Akk. + Präs. + Adv. + Adv. + Nom. + Präs.Med. + Nom.)"],["śayanaṃ bhojanaṃ yānaṃ maṇiratnam atho dhanam","Lager, Speise, Fahrzeug, Juwelen und auch Reichtum (Akk. + Akk. + Akk. + Akk. + Akk.)"]]],["020","yānam ācchādanaṃ bhogān dāsīś ca paricārikāḥ dadau rājā samuddiśya tayor mātror mahīpatiḥ","Fahrzeuge, Kleidung, Genussgüter, Dienerinnen und Aufwärterinnen gab der Herrscher der Erde, im Gedenken an seine beiden Mütter.","",[["yānam ācchādanaṃ bhogān dāsīś ca paricārikāḥ","Fahrzeuge, Kleidung, Genussgüter, Dienerinnen und Aufwärterinnen (Akk. + Akk. + Akk.Pl. + Akk.Pl. + Akk.Pl.)"],["dadau rājā samuddiśya tayor mātror mahīpatiḥ","gab der Herrscher der Erde, im Gedenken an seine beiden Mütter (Perf. + Nom. + Absol. + Gen.Du. + Nom.)"]]],["021","tataḥ sa pṛthivīpālo dattvā śrāddhāny anekaśaḥ praviveśa punar dhīmān nagaraṃ vāraṇāhvayam","Da kehrte jener Herrscher der Erde, der Weise, nachdem er vielfach Totenopfer dargebracht hatte, wieder in die Stadt Vāraṇāhvaya zurück.","",[["tataḥ sa pṛthivīpālo dattvā śrāddhāny anekaśaḥ","da jener Herrscher der Erde, nachdem er vielfach Totenopfer dargebracht hatte (Adv. + Nom. + Nom. + Absol. + Akk.Pl. + Adv.)"],["praviveśa punar dhīmān nagaraṃ vāraṇāhvayam","kehrte, der Weise, wieder in die Stadt Vāraṇāhvaya zurück (Perf. + Adv. + Nom. + Akk. + Akk.)"]]],["022","te cāpi rājavacanāt puruṣā ye gatābhavan saṃkalpya teṣāṃ kulyāni punaḥ pratyāgamaṃs tataḥ","Und auch jene Männer, die auf Befehl des Königs dorthin gegangen waren, kehrten, nachdem sie deren Gebeine dem Wasser übergeben hatten, darauf wieder zurück.","",[["te cāpi rājavacanāt puruṣā ye gatābhavan","und auch jene Männer, die auf Befehl des Königs dorthin gegangen waren (Nom.Pl. + Abl. + Nom.Pl. + Nom.Pl. + Impf.)"],["saṃkalpya teṣāṃ kulyāni punaḥ pratyāgamaṃs tataḥ","nachdem sie deren Gebeine dem Wasser übergeben hatten, kehrten sie darauf wieder zurück (Absol. + Gen.Pl. + Akk.Pl. + Adv. + Impf. + Adv.)"]]],["023","mālyair gandhaiś ca vividhaiḥ pūjayitvā yathāvidhi kulyāni teṣāṃ saṃyojya tadācakhyur mahīpateḥ","Nachdem sie mit mannigfachen Kränzen und Düften vorschriftsgemäß verehrt und deren Gebeine vereinigt hatten, berichteten sie darauf dem Herrscher der Erde.","",[["mālyair gandhaiś ca vividhaiḥ pūjayitvā yathāvidhi","nachdem sie mit mannigfachen Kränzen und Düften vorschriftsgemäß verehrt hatten (Instr.Pl. + Instr.Pl. + Instr.Pl. + Absol. + Adv.)"],["kulyāni teṣāṃ saṃyojya tadācakhyur mahīpateḥ","und deren Gebeine vereinigt hatten, berichteten sie darauf dem Herrscher der Erde (Akk.Pl. + Gen.Pl. + Absol. + Adv. + Perf. + Gen.)"]]],["024","samāśvāsya ca rājānaṃ dharmātmānaṃ yudhiṣṭhiram nārado 'py agamad rājan paramarṣir yathepsitam","Und nachdem er den dharmagesinnten König Yudhiṣṭhira getröstet hatte, ging auch Nārada, der höchste Ṛṣi, o König, wie es ihm beliebte, davon.","",[["samāśvāsya ca rājānaṃ dharmātmānaṃ yudhiṣṭhiram","und nachdem er den dharmagesinnten König Yudhiṣṭhira getröstet hatte (Absol. + Akk. + Akk. + Akk.)"],["nārado 'py agamad rājan paramarṣir yathepsitam","ging auch Nārada, der höchste Ṛṣi, o König, wie es ihm beliebte, davon (Nom. + Impf. + Vok. + Nom. + Adv.)"]]],["025","evaṃ varṣāṇy atītāni dhṛtarāṣṭrasya dhīmataḥ vanavāse tadā trīṇi nagare daśa pañca ca","So waren die Jahre des weisen Dhṛtarāṣṭra vergangen: damals drei im Waldaufenthalt, und fünfzehn in der Stadt.","",[["evaṃ varṣāṇy atītāni dhṛtarāṣṭrasya dhīmataḥ","so waren die Jahre des weisen Dhṛtarāṣṭra vergangen (Adv. + Nom.Pl. + Nom.Pl.Part.Perf. + Gen. + Gen.)"],["vanavāse tadā trīṇi nagare daśa pañca ca","damals drei im Waldaufenthalt, und fünfzehn in der Stadt (Lok. + Adv. + Nom.Pl. + Lok. + Nom.Pl. + Nom.Pl.)"]]],["026","hataputrasya saṃgrāme dānāni dadataḥ sadā jñātisaṃbandhimitrāṇāṃ bhrātṝṇāṃ svajanasya ca","Jahre dessen, dessen Söhne im Kampf erschlagen waren, der stets Gaben gab an Verwandte, Angehörige, Freunde, Brüder und die eigenen Leute.","",[["hataputrasya saṃgrāme dānāni dadataḥ sadā","dessen Söhne im Kampf erschlagen waren, der stets Gaben gab (Gen.Bahuvrīhi + Lok. + Akk.Pl. + Gen.Part. + Adv.)"],["jñātisaṃbandhimitrāṇāṃ bhrātṝṇāṃ svajanasya ca","an Verwandte, Angehörige, Freunde, Brüder und die eigenen Leute (Gen.Pl. + Gen.Pl. + Gen.)"]]],["027","yudhiṣṭhiras tu nṛpatir nātiprītamanās tadā dhārayām āsa tad rājyaṃ nihatajñātibāndhavaḥ","Der König Yudhiṣṭhira aber, damals nicht sehr frohen Sinnes, hielt jenes Königreich aufrecht, obwohl seine Verwandten und Angehörigen erschlagen waren.","",[["yudhiṣṭhiras tu nṛpatir nātiprītamanās tadā","der König Yudhiṣṭhira aber, damals nicht sehr frohen Sinnes (Nom. + Nom. + Nom.Bahuvrīhi + Adv.)"],["dhārayām āsa tad rājyaṃ nihatajñātibāndhavaḥ","hielt jenes Königreich aufrecht, obwohl seine Verwandten und Angehörigen erschlagen waren (Perf.Periphr.Kaus. + Akk. + Akk. + Nom.Bahuvrīhi)"]]]]}]},{"key":"mausala","name":"Mausalaparva","desc":"Das Buch des Keulenkampfes: der Untergang der Vṛṣṇis und Yādavas, Kṛṣṇas Tod.","chapters":[{"num":1,"title_sa":"","title_de":"Die Unheilszeichen und die Kunde vom Untergang der Vṛṣṇis","note":"Erstes Kapitel des Mausalaparva (Parva-Nr.16, direkt im Anschluss an das Āśramavāsikaparva; Quellgrenze bei Offset 14179220, gegen den Kapitel-1-Marker \"16,001.001\" abgesichert): im 36. Jahr nach der Schlacht sieht Yudhiṣṭhira zahlreiche Unheilsvorzeichen (Stürme, rückwärts fließende Flüsse, verhüllte Sonne, Halos), dann erreicht ihn die Kunde vom gegenseitigen Vernichtungskampf (mausala, dem namensgebenden Ereignis des Parva) der Vṛṣṇis und vom Tod/Dahinscheiden Kṛṣṇas (Vāsudeva) und Balarāmas (Rāma); die Pāṇḍavas glauben zunächst nicht an Kṛṣṇas Tod und setzen sich erschüttert nieder.","units":[["001","vaiśaṃpāyana uvāca ṣaṭtriṃśe tv atha saṃprāpte varṣe kauravanandanaḥ dadarśa viparītāni nimittāni yudhiṣṭhiraḥ","Vaiśaṃpāyana sprach: Doch als das sechsunddreißigste Jahr gekommen war, sah der Kaurava-Sohn Yudhiṣṭhira widrige Vorzeichen.","",[["vaiśaṃpāyana uvāca ṣaṭtriṃśe tv atha saṃprāpte varṣe kauravanandanaḥ","Vaiśaṃpāyana sprach: doch als das sechsunddreißigste Jahr gekommen war, der Kaurava-Sohn (Nom. + Adv. + Adv. + Lok. + Lok.Part.Perf. + Lok. + Nom.)"],["dadarśa viparītāni nimittāni yudhiṣṭhiraḥ","sah Yudhiṣṭhira widrige Vorzeichen (Perf. + Akk.Pl. + Akk.Pl. + Nom.)"]]],["002","vavur vātāḥ sanirghātā rūkṣāḥ śarkaravarṣiṇaḥ apasavyāni śakunā maṇḍalāni pracakrire","Winde wehten, von Donnerschlägen begleitet, rau, Kies regnend; die Vögel vollführten ihre Kreisflüge linksläufig [Anm.: widersinnig/gegen den Uhrzeigersinn kreisende Vogelflüge gelten als unheilvolles Vorzeichen].","",[["vavur vātāḥ sanirghātā rūkṣāḥ śarkaravarṣiṇaḥ","Winde wehten, von Donnerschlägen begleitet, rau, Kies regnend (Perf. + Nom.Pl. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["apasavyāni śakunā maṇḍalāni pracakrire","die Vögel vollführten ihre Kreisflüge linksläufig (Akk.Pl. + Nom.Pl. + Akk.Pl. + Perf.Med.)"]]],["003","pratyagūhur mahānadyo diśo nīhārasaṃvṛtāḥ ulkāś cāṅgāravarṣiṇyaḥ prapetur gaganād bhuvi","Die großen Ströme flossen rückwärts, die Himmelsrichtungen waren von Nebel verhüllt, und Meteore, Glutfunken regnend, fielen vom Himmel zur Erde.","",[["pratyagūhur mahānadyo diśo nīhārasaṃvṛtāḥ","die großen Ströme flossen rückwärts, die Himmelsrichtungen waren von Nebel verhüllt (Perf. + Nom.Pl. + Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["ulkāś cāṅgāravarṣiṇyaḥ prapetur gaganād bhuvi","und Meteore, Glutfunken regnend, fielen vom Himmel zur Erde (Nom.Pl. + Nom.Pl.Bahuvrīhi + Perf. + Abl. + Lok.)"]]],["004","ādityo rajasā rājan samavacchannamaṇḍalaḥ viraśmir udaye nityaṃ kabandhaiḥ samadṛśyata","Die Sonne, o König, erschien mit von Staub völlig verhüllter Scheibe, strahlenlos bei Aufgang, ständig von rumpflosen Gestalten [?] begleitet.","[?] \"kabandhaiḥ\" (rumpflose Gestalten/Dämonen) hier als Vorzeichen-Erscheinung um die Sonnenscheibe - genaue bildliche Vorstellung unsicher.",[["ādityo rajasā rājan samavacchannamaṇḍalaḥ","die Sonne, o König, mit von Staub völlig verhüllter Scheibe (Nom. + Instr. + Vok. + Nom.Bahuvrīhi)"],["viraśmir udaye nityaṃ kabandhaiḥ samadṛśyata","erschien strahlenlos bei Aufgang, ständig von rumpflosen Gestalten begleitet (Nom.Bahuvrīhi + Lok. + Adv. + Instr.Pl. + Impf.Pass.)"]]],["005","pariveṣāś ca dṛśyante dāruṇāḥ candrasūryayoḥ trivarṇāḥ śyāmarūkṣāntās tathā bhasmāruṇaprabhāḥ","Und man sah furchtbare Halos um Mond und Sonne, dreifarbig, an den Rändern dunkel-rau, auch von aschgrau-rötlichem Glanz.","",[["pariveṣāś ca dṛśyante dāruṇāḥ candrasūryayoḥ","und man sah furchtbare Halos um Mond und Sonne (Nom.Pl. + Präs.Pass. + Nom.Pl. + Gen.Du.)"],["trivarṇāḥ śyāmarūkṣāntās tathā bhasmāruṇaprabhāḥ","dreifarbig, an den Rändern dunkel-rau, auch von aschgrau-rötlichem Glanz (Nom.Pl.Bahuvrīhi + Nom.Pl.Bahuvrīhi + Adv. + Nom.Pl.Bahuvrīhi)"]]],["006","ete cānye ca bahava utpātā bhayaśaṃsinaḥ dṛśyante 'har aho rājan hṛdayodvegakārakāḥ","Diese und viele andere unheilkündende Vorzeichen wurden Tag für Tag gesehen, o König, das Herz mit Beklemmung erfüllend.","",[["ete cānye ca bahava utpātā bhayaśaṃsinaḥ","diese und viele andere unheilkündende Vorzeichen (Nom.Pl. + Nom.Pl. + Nom.Pl. + Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["dṛśyante 'har aho rājan hṛdayodvegakārakāḥ","wurden Tag für Tag gesehen, o König, das Herz mit Beklemmung erfüllend (Präs.Pass. + Adv. + Vok. + Nom.Pl.Bahuvrīhi)"]]],["007","kasya cit tv atha kālasya kururājo yudhiṣṭhiraḥ śuśrāva vṛṣṇicakrasya mausale kadanaṃ kṛtam","Doch nach einiger Zeit vernahm der Kuru-König Yudhiṣṭhira, dass unter dem Vṛṣṇi-Kreis im Keulenkampf ein Gemetzel angerichtet worden war.","",[["kasya cit tv atha kālasya kururājo yudhiṣṭhiraḥ","doch nach einiger Zeit der Kuru-König Yudhiṣṭhira (Gen. + Indekl. + Adv. + Adv. + Gen. + Nom. + Nom.)"],["śuśrāva vṛṣṇicakrasya mausale kadanaṃ kṛtam","vernahm, dass unter dem Vṛṣṇi-Kreis im Keulenkampf ein Gemetzel angerichtet worden war (Perf. + Gen. + Lok. + Akk. + Akk.Part.Perf.Pass.)"]]],["008","vimuktaṃ vāsudevaṃ ca śrutvā rāmaṃ ca pāṇḍavaḥ samānīyābravīd bhrātṝn kiṃ kariṣyāma ity uta","Und als er hörte, dass Vāsudeva und Rāma dahingeschieden waren, versammelte der Pāṇḍava seine Brüder und sprach: „Was sollen wir tun?“","\"vimuktam\" (entlassen, befreit) als Euphemismus für den Tod Kṛṣṇas und Balarāmas.",[["vimuktaṃ vāsudevaṃ ca śrutvā rāmaṃ ca pāṇḍavaḥ","und als der Pāṇḍava hörte, dass Vāsudeva und Rāma dahingeschieden waren (Akk.Part.Perf.Pass. + Akk. + Absol. + Akk. + Nom.)"],["samānīyābravīd bhrātṝn kiṃ kariṣyāma ity uta","versammelte seine Brüder und sprach: 'Was sollen wir tun?' (Absol. + Impf. + Akk.Pl. + Akk. + Fut. + Indekl.)"]]],["009","parasparaṃ samāsādya brahmadaṇḍabalātkṛtān vṛṣṇīn vinaṣṭāṃs te śrutvā vyathitāḥ pāṇḍavābhavan","Als sie vernahmen, dass die Vṛṣṇis, einander anfallend, durch die Gewalt des Brahmanenstab-Fluchs zugrunde gegangen waren, wurden die Pāṇḍavas von Schmerz erschüttert.","",[["parasparaṃ samāsādya brahmadaṇḍabalātkṛtān vṛṣṇīn vinaṣṭāṃs te","als sie vernahmen, dass die Vṛṣṇis, einander anfallend, durch die Gewalt des Brahmanenstab-Fluchs zugrunde gegangen waren (Akk. + Absol. + Akk.Pl.Bahuvrīhi + Akk.Pl. + Akk.Pl.Part.Perf. + Nom.Pl.)"],["śrutvā vyathitāḥ pāṇḍavābhavan","wurden die Pāṇḍavas von Schmerz erschüttert (Absol. + Nom.Pl.Part.Perf.Pass. + Impf.)"]]],["010","nidhanaṃ vāsudevasya samudrasyeva śoṣaṇam vīrā na śraddadhus tasya vināśaṃ śārṅgadhanvanaḥ","Den Tod Vāsudevas, gleich dem Austrocknen des Ozeans, glaubten die Helden nicht - das Dahinscheiden dessen, der den Śārṅga-Bogen trägt.","",[["nidhanaṃ vāsudevasya samudrasyeva śoṣaṇam","den Tod Vāsudevas, gleich dem Austrocknen des Ozeans (Akk. + Gen. + Gen. + Akk.)"],["vīrā na śraddadhus tasya vināśaṃ śārṅgadhanvanaḥ","glaubten die Helden nicht das Dahinscheiden dessen, der den Śārṅga-Bogen trägt (Nom.Pl. + Neg. + Perf. + Gen. + Akk. + Gen.)"]]],["011","mausalaṃ te pariśrutya duḥkhaśokasamanvitāḥ viṣaṇṇā hatasaṃkalpāḥ pāṇḍavāḥ samupāviśan","Als sie so vom Keulen-Gemetzel gehört hatten, setzten sich die Pāṇḍavas nieder, von Schmerz und Kummer erfüllt, niedergeschlagen, ihrer Entschlusskraft beraubt.","",[["mausalaṃ te pariśrutya duḥkhaśokasamanvitāḥ","als sie so vom Keulen-Gemetzel gehört hatten, von Schmerz und Kummer erfüllt (Akk. + Absol. + Nom.Pl.Bahuvrīhi)"],["viṣaṇṇā hatasaṃkalpāḥ pāṇḍavāḥ samupāviśan","setzten sich die Pāṇḍavas nieder, niedergeschlagen, ihrer Entschlusskraft beraubt (Nom.Pl.Part.Perf.Pass. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Impf.)"]]]]},{"num":2,"title_sa":"","title_de":"Die Herkunft des Musala: Sāmbas Streich und der Fluch der Weisen","note":"Janamejayas Frage nach der Ursache des Untergangs (Rahmen-Einladungszeile V003, eigenes CQ); Sāraṇa und Gefährten verkleiden Sāmba als schwangere Frau und verspotten die Weisen Viśvāmitra, Kaṇva und Nārada; diese durchschauen den Streich und verkünden den Fluch: Sāmba wird eine eiserne Keule (musala) gebären, die zum gegenseitigen Untergang der Vṛṣṇis und Andhakas führen wird (mit Ausnahme Balarāmas und Kṛṣṇas, die auf andere Weise sterben); Kṛṣṇa akzeptiert das unabwendbare Schicksal; die geborene Keule wird zu Pulver zermahlen und ins Meer geworfen, ein Alkoholverbot wird verkündet.","units":[["001","janamejaya uvāca kathaṃ vinaṣṭā bhagavann andhakā vṛṣṇibhiḥ saha paśyato vāsudevasya bhojāś caiva mahārathāḥ","Janamejaya sprach: Wie kamen die Andhakas, o Erhabener, zusammen mit den Vṛṣṇis, vor den Augen Vāsudevas, und auch die großen Wagenkämpfer der Bhojas, zugrunde?","",[["janamejaya uvāca kathaṃ vinaṣṭā bhagavann andhakā","Janamejaya sprach: wie kamen die Andhakas zugrunde, o Erhabener (Nom. + Perf. + Adv. + Nom.Pl.Part.Perf. + Vok. + Nom.Pl.)"],["vṛṣṇibhiḥ saha paśyato vāsudevasya bhojāś caiva mahārathāḥ","zusammen mit den Vṛṣṇis, vor den Augen Vāsudevas, und auch die großen Wagenkämpfer der Bhojas (Instr.Pl. + Adv. + Gen.Part. + Gen. + Nom.Pl. + Nom.Pl.)"]]],["002","vaiśaṃpāyana uvāca ṣaṭtriṃśe 'tha tato varṣe vṛṣṇīnām anayo mahān anyonyaṃ musalais te tu nijaghnuḥ kālacoditāḥ","Vaiśaṃpāyana sprach: Im sechsunddreißigsten Jahr darauf entstand unter den Vṛṣṇis großes Unheil; einander schlugen sie mit Keulen, vom Schicksal getrieben.","",[["vaiśaṃpāyana uvāca ṣaṭtriṃśe 'tha tato varṣe vṛṣṇīnām anayo mahān","Vaiśaṃpāyana sprach: im sechsunddreißigsten Jahr darauf entstand unter den Vṛṣṇis großes Unheil (Nom. + Lok. + Adv. + Adv. + Lok. + Gen.Pl. + Nom. + Nom.)"],["anyonyaṃ musalais te tu nijaghnuḥ kālacoditāḥ","einander schlugen sie mit Keulen, von der Zeit getrieben (Akk. + Instr.Pl. + Nom.Pl. + Adv. + Perf. + Nom.Pl.Bahuvrīhi)"]]],["003","janamejaya uvāca kenānuśaptās te vīrāḥ kṣayaṃ vṛṣṇyandhakā yayuḥ bhojāś ca dvijavarya tvaṃ vistareṇa vadasva me","Janamejaya sprach: „Durch wessen Fluch gingen jene Helden zugrunde, die Vṛṣṇis, Andhakas und Bhojas, o Bester der Zweifachgeborenen? Erzähle es mir ausführlich!“","",[["janamejaya uvāca kenānuśaptās te vīrāḥ kṣayaṃ vṛṣṇyandhakā yayuḥ","Janamejaya sprach: durch wessen Fluch gingen jene Helden, die Vṛṣṇis und Andhakas, zugrunde (Nom. + Instr. + Nom.Pl.Part.Perf.Pass. + Nom.Pl. + Akk. + Nom.Pl. + Perf.)"],["bhojāś ca dvijavarya tvaṃ vistareṇa vadasva me","und die Bhojas, o Bester der Zweifachgeborenen; erzähle es mir ausführlich (Nom.Pl. + Vok. + Nom. + Instr. + Imp. + Dat.)"]]],["004","vaiśaṃpāyana uvāca viśvāmitraṃ ca kaṇvaṃ ca nāradaṃ ca tapodhanam sāraṇapramukhā vīrā dadṛśur dvārakāgatān","Vaiśaṃpāyana sprach: Viśvāmitra, Kaṇva und den bußreichen Nārada sahen die Helden, angeführt von Sāraṇa, die nach Dvārakā gekommen waren.","",[["vaiśaṃpāyana uvāca viśvāmitraṃ ca kaṇvaṃ ca nāradaṃ ca tapodhanam","Vaiśaṃpāyana sprach: Viśvāmitra, Kaṇva und den bußreichen Nārada (Nom. + Akk. + Akk. + Akk. + Akk.Bahuvrīhi)"],["sāraṇapramukhā vīrā dadṛśur dvārakāgatān","sahen die Helden, angeführt von Sāraṇa, die nach Dvārakā gekommen waren (Nom.Pl.Bahuvrīhi + Nom.Pl. + Perf. + Akk.Pl.)"]]],["005","te vai sāmbaṃ puraskṛtya bhūṣayitvā striyaṃ yathā abruvann upasaṃgamya daivadaṇḍanipīḍitāḥ","Sie nun, nachdem sie Sāmba vorangestellt und wie eine Frau geschmückt hatten, traten heran und sprachen - von göttlicher Fügung bedrängt:","",[["te vai sāmbaṃ puraskṛtya bhūṣayitvā striyaṃ yathā","sie nun, nachdem sie Sāmba vorangestellt und wie eine Frau geschmückt hatten (Nom.Pl. + Adv. + Akk. + Absol. + Absol. + Akk. + Adv.)"],["abruvann upasaṃgamya daivadaṇḍanipīḍitāḥ","sprachen, herangetreten, von göttlicher Fügung bedrängt (Impf. + Absol. + Nom.Pl.Bahuvrīhi)"]]],["006","iyaṃ strī putrakāmasya babhror amitatejasaḥ ṛṣayaḥ sādhu jānīta kim iyaṃ janayiṣyati","„Dies ist die Frau des Babhru, der von unermesslicher Glutkraft ist und sich einen Sohn wünscht - erkennt wohl, ihr Weisen: was wird sie gebären?“","",[["iyaṃ strī putrakāmasya babhror amitatejasaḥ","dies ist die Frau des Babhru, der sich einen Sohn wünscht, von unermesslicher Glutkraft (Nom. + Nom. + Gen.Bahuvrīhi + Gen. + Gen.Bahuvrīhi)"],["ṛṣayaḥ sādhu jānīta kim iyaṃ janayiṣyati","erkennt wohl, ihr Weisen: was wird sie gebären? (Vok.Pl. + Adv. + Imp. + Akk. + Nom. + Fut.)"]]],["007","ity uktās te tadā rājan vipralambhapradharṣitāḥ pratyabruvaṃs tān munayo yat tac chṛṇu narādhipa","So angesprochen, entgegneten jene Weisen, o König, vom Betrug gereizt, jenen jungen Männern - höre, was das war, Herrscher der Menschen.","",[["ity uktās te tadā rājan vipralambhapradharṣitāḥ","so angesprochen, jene, o König, vom Betrug gereizt (Adv. + Nom.Pl.Part.Perf.Pass. + Nom.Pl. + Adv. + Vok. + Nom.Pl.Bahuvrīhi)"],["pratyabruvaṃs tān munayo yat tac chṛṇu narādhipa","entgegneten jenen die Weisen; höre, was das war, Herrscher der Menschen (Impf. + Akk.Pl. + Nom.Pl. + Rel. + Dem. + Imp. + Vok.)"]]],["008","vṛṣṇyandhakavināśāya musalaṃ ghoram āyasam vāsudevasya dāyādaḥ sāmbo 'yaṃ janayiṣyati","„Zum Untergang der Vṛṣṇis und Andhakas wird dieser Sāmba, Vāsudevas Erbe, eine furchtbare, eiserne Keule gebären.","",[["vṛṣṇyandhakavināśāya musalaṃ ghoram āyasam","zum Untergang der Vṛṣṇis und Andhakas eine furchtbare, eiserne Keule (Dat. + Akk. + Akk. + Akk.)"],["vāsudevasya dāyādaḥ sāmbo 'yaṃ janayiṣyati","wird dieser Sāmba, Vāsudevas Erbe, gebären (Gen. + Nom. + Nom. + Nom. + Fut.)"]]],["009","yena yūyaṃ sudurvṛttā nṛśaṃsā jātamanyavaḥ ucchettāraḥ kulaṃ kṛtsnam ṛte rāmajanārdanau","Durch diese werdet ihr, von schlechtem Betragen, grausam, von Zorn erfüllt, das ganze Geschlecht vernichten - mit Ausnahme von Rāma und Janārdana.","",[["yena yūyaṃ sudurvṛttā nṛśaṃsā jātamanyavaḥ","durch diese werdet ihr, von schlechtem Betragen, grausam, von Zorn erfüllt (Instr. + Nom.Pl. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["ucchettāraḥ kulaṃ kṛtsnam ṛte rāmajanārdanau","das ganze Geschlecht vernichten, mit Ausnahme von Rāma und Janārdana (Nom.Pl. + Akk. + Akk. + Präp. + Akk.Du.)"]]],["010","samudraṃ yāsyati śrīmāṃs tyaktvā dehaṃ halāyudhaḥ jarā kṛṣṇaṃ mahātmānaṃ śayānaṃ bhuvi bhetsyati","Der glückverheißende Halāyudha wird, nachdem er seinen Leib verlassen hat, ins Meer eingehen; das Alter wird den großherzigen Kṛṣṇa, auf der Erde liegend, durchbohren.“","",[["samudraṃ yāsyati śrīmāṃs tyaktvā dehaṃ halāyudhaḥ","der glückverheißende Halāyudha wird, nachdem er den Leib verlassen hat, ins Meer eingehen (Akk. + Fut. + Nom.Bahuvrīhi + Absol. + Akk. + Nom.)"],["jarā kṛṣṇaṃ mahātmānaṃ śayānaṃ bhuvi bhetsyati","das Alter wird den großherzigen Kṛṣṇa, auf der Erde liegend, durchbohren (Nom. + Akk. + Akk. + Akk.Part. + Lok. + Fut.)"]]],["011","ity abruvanta te rājan pralabdhās tair durātmabhiḥ munayaḥ krodharaktākṣāḥ samīkṣyātha parasparam","So sprachen jene Weisen, o König, von jenen Bösgesinnten getäuscht, mit vor Zorn geröteten Augen, nachdem sie einander angeblickt hatten.","",[["ity abruvanta te rājan pralabdhās tair durātmabhiḥ","so sprachen jene, o König, von jenen Bösgesinnten getäuscht (Adv. + Impf.Med. + Nom.Pl. + Vok. + Nom.Pl.Part.Perf.Pass. + Instr.Pl. + Instr.Pl.)"],["munayaḥ krodharaktākṣāḥ samīkṣyātha parasparam","die Weisen, mit vor Zorn geröteten Augen, nachdem sie einander angeblickt hatten (Nom.Pl. + Nom.Pl.Bahuvrīhi + Absol. + Adv. + Akk.)"]]],["012","tathoktvā munayas te tu tataḥ keśavam abhyayuḥ","Nachdem sie so gesprochen hatten, begaben sich jene Weisen darauf zu Keśava.","",[["tathoktvā munayas te tu tataḥ keśavam abhyayuḥ","nachdem sie so gesprochen hatten, begaben sich jene Weisen darauf zu Keśava (Absol. + Nom.Pl. + Nom.Pl. + Adv. + Adv. + Akk. + Perf.)"]]],["013","athābravīt tadā vṛṣṇīñ śrutvaivaṃ madhusūdanaḥ antajño matimāṃs tasya bhavitavyaṃ tatheti tān","Da sprach Madhusūdana darauf, als er dies vernommen hatte, zu den Vṛṣṇis - er, der das Ende kennt, der Kluge: „So muss es geschehen.“ - so sprach er zu ihnen.","",[["athābravīt tadā vṛṣṇīñ śrutvaivaṃ madhusūdanaḥ","da sprach Madhusūdana darauf, als er dies vernommen hatte, zu den Vṛṣṇis (Adv. + Impf. + Adv. + Akk.Pl. + Absol. + Adv. + Nom.)"],["antajño matimāṃs tasya bhavitavyaṃ tatheti tān","er, der das Ende kennt, der Kluge: 'so muss es geschehen' - zu ihnen (Nom.Bahuvrīhi + Nom.Bahuvrīhi + Gen. + Nom.Ger. + Adv. + Indekl. + Akk.Pl.)"]]],["014","evam uktvā hṛṣīkeśaḥ praviveśa punar gṛhān kṛtāntam anyathā naicchat kartuṃ sa jagataḥ prabhuḥ","Nachdem er so gesprochen hatte, ging Hṛṣīkeśa wieder in sein Haus; er, der Herr der Welt, wollte das festgesetzte Schicksal nicht anders machen.","",[["evam uktvā hṛṣīkeśaḥ praviveśa punar gṛhān","nachdem er so gesprochen hatte, ging Hṛṣīkeśa wieder in sein Haus (Adv. + Absol. + Nom. + Perf. + Adv. + Akk.Pl.)"],["kṛtāntam anyathā naicchat kartuṃ sa jagataḥ prabhuḥ","er, der Herr der Welt, wollte das festgesetzte Schicksal nicht anders machen (Akk. + Adv. + Impf. + Inf. + Nom. + Gen. + Nom.)"]]],["015","śvobhūte 'tha tataḥ sāmbo musalaṃ tad asūta vai vṛṣṇyandhakavināśāya kiṃkarapratimaṃ mahat","Als der nächste Tag angebrochen war, gebar Sāmba darauf jene große, [einem Diener] gleichende Keule zum Untergang der Vṛṣṇis und Andhakas [?].","[?] \"kiṃkarapratimam\" (\"einem Diener/Sklaven gleichend\") - genaue bildliche Vorstellung der Keulenform unsicher.",[["śvobhūte 'tha tataḥ sāmbo musalaṃ tad asūta vai","als der nächste Tag angebrochen war, gebar Sāmba darauf jene Keule (Lok.Absol. + Adv. + Adv. + Nom. + Akk. + Akk. + Perf.Med. + Adv.)"],["vṛṣṇyandhakavināśāya kiṃkarapratimaṃ mahat","zum Untergang der Vṛṣṇis und Andhakas, groß, einem Diener gleichend (Dat. + Akk.Bahuvrīhi + Akk.)"]]],["016","prasūtaṃ śāpajaṃ ghoraṃ tac ca rājñe nyavedayan viṣaṇṇarūpas tad rājā sūkṣmaṃ cūrṇam akārayat","Und sie meldeten dem König, dass jenes furchtbare, aus dem Fluch geborene Ding zur Welt gekommen war; der König, von Kummer gezeichnet, ließ es zu feinem Pulver zermahlen.","",[["prasūtaṃ śāpajaṃ ghoraṃ tac ca rājñe nyavedayan","und sie meldeten dem König, dass jenes furchtbare, aus dem Fluch geborene Ding zur Welt gekommen war (Akk. + Akk. + Akk. + Akk. + Dat. + Impf.)"],["viṣaṇṇarūpas tad rājā sūkṣmaṃ cūrṇam akārayat","der König, von Kummer gezeichnet, ließ es zu feinem Pulver zermahlen (Nom.Bahuvrīhi + Akk. + Nom. + Akk. + Akk. + Impf.Kaus.)"]]],["017","prākṣipan sāgare tac ca puruṣā rājaśāsanāt aghoṣayaṃś ca nagare vacanād āhukasya ca","Und die Männer warfen es auf Befehl des Königs ins Meer, und sie verkündeten in der Stadt, auf das Wort des Āhuka [Ugrasena] hin:","",[["prākṣipan sāgare tac ca puruṣā rājaśāsanāt","und die Männer warfen es auf Befehl des Königs ins Meer (Impf. + Lok. + Akk. + Nom.Pl. + Abl.)"],["aghoṣayaṃś ca nagare vacanād āhukasya ca","und sie verkündeten in der Stadt, auf das Wort des Āhuka hin (Impf.Kaus. + Lok. + Abl. + Gen.)"]]],["018","adya prabhṛti sarveṣu vṛṣṇyandhakagṛheṣv iha surāsavo na kartavyaḥ sarvair nagaravāsibhiḥ","„Von heute an soll in allen Häusern der Vṛṣṇis und Andhakas hier von allen Stadtbewohnern kein berauschendes Getränk mehr bereitet werden.","",[["adya prabhṛti sarveṣu vṛṣṇyandhakagṛheṣv iha","von heute an in allen Häusern der Vṛṣṇis und Andhakas hier (Adv. + Adv. + Lok.Pl. + Lok.Pl. + Adv.)"],["surāsavo na kartavyaḥ sarvair nagaravāsibhiḥ","soll kein berauschendes Getränk mehr bereitet werden, von allen Stadtbewohnern (Nom. + Neg. + Nom.Ger. + Instr.Pl. + Instr.Pl.)"]]],["019","yaś ca no 'viditaṃ kuryāt peyaṃ kaś cin naraḥ kva cit jīvan sa śūlam ārohet svayaṃ kṛtvā sabāndhavaḥ","Und welcher Mensch auch immer, irgendwo, ohne unser Wissen, ein Getränk bereiten sollte - der soll, solange er lebt, den Pfahl besteigen, selbst dafür verantwortlich, samt seinen Verwandten.“","",[["yaś ca no 'viditaṃ kuryāt peyaṃ kaś cin naraḥ kva cit","und welcher Mensch auch immer, irgendwo, ohne unser Wissen, ein Getränk bereiten sollte (Nom. + Gen. + Akk. + Opt. + Akk. + Nom. + Nom. + Adv. + Indekl.)"],["jīvan sa śūlam ārohet svayaṃ kṛtvā sabāndhavaḥ","der soll, solange er lebt, den Pfahl besteigen, selbst dafür verantwortlich, samt seinen Verwandten (Nom.Part. + Nom. + Akk. + Opt. + Adv. + Absol. + Nom.Bahuvrīhi)"]]],["020","tato rājabhayāt sarve niyamaṃ cakrire tadā narāḥ śāsanam ājñāya tasya rājño mahātmanaḥ","Da befolgten darauf, aus Furcht vor dem König, alle Menschen die Regel, nachdem sie den Befehl jenes großherzigen Königs vernommen hatten.","",[["tato rājabhayāt sarve niyamaṃ cakrire tadā narāḥ","da befolgten darauf, aus Furcht vor dem König, alle Menschen die Regel (Adv. + Abl. + Nom.Pl. + Akk. + Perf.Med. + Adv. + Nom.Pl.)"],["śāsanam ājñāya tasya rājño mahātmanaḥ","nachdem sie den Befehl jenes großherzigen Königs vernommen hatten (Akk. + Absol. + Gen. + Gen. + Gen.)"]]]]},{"num":3,"title_sa":"","title_de":"Weitere Unheilszeichen und der Aufbruch zur Meeres-Pilgerfahrt","note":"Fortsetzung des Unheilsvorzeichen-Katalogs (unnatürliche Tiergeburten, verkehrte Rufe, ein verschwindender Unheilsbote, Würmer im Opferspeise, unsichtbare heranstürmende Wesen, Sittenverfall unter den Vṛṣṇis mit Ausnahme Balarāmas/Kṛṣṇas). Kṛṣṇa erkennt anhand eines anomalen Neumondtermins (V016-017, CQ) das Herannahen des prophezeiten 36. Jahres, verknüpft es mit Gāndhārīs einstigem Fluch und Yudhiṣṭhiras früheren Vorzeichen-Beobachtungen vor Kurukṣetra, und ordnet eine Pilgerfahrt zum Meer an (V022, CQ: die öffentliche Verkündung).","units":[["001","vaiśaṃpāyana uvāca evaṃ prayatamānānāṃ vṛṣṇīnām andhakaiḥ saha kālo gṛhāṇi sarveṣāṃ paricakrāma nityaśaḥ","Vaiśaṃpāyana sprach: So durchwanderte, während die Vṛṣṇis zusammen mit den Andhakas sich bemühten, das Verbot zu befolgen, die Zeit beständig die Häuser aller.","",[["vaiśaṃpāyana uvāca evaṃ prayatamānānāṃ vṛṣṇīnām andhakaiḥ saha","Vaiśaṃpāyana sprach: so, während die Vṛṣṇis sich bemühten, zusammen mit den Andhakas (Nom. + Adv. + Gen.Pl.Part.Med. + Gen.Pl. + Instr.Pl. + Adv.)"],["kālo gṛhāṇi sarveṣāṃ paricakrāma nityaśaḥ","durchwanderte die Zeit beständig die Häuser aller (Nom. + Akk.Pl. + Gen.Pl. + Perf. + Adv.)"]]],["002","karālo vikaṭo muṇḍaḥ puruṣaḥ kṛṣṇapiṅgalaḥ gṛhāṇy avekṣya vṛṣṇīnāṃ nādṛśyata punaḥ kva cit","Ein furchtbarer, entstellter, kahlköpfiger Mann von schwarzbrauner Farbe, der die Häuser der Vṛṣṇis gemustert hatte, wurde danach nirgends mehr gesehen.","",[["karālo vikaṭo muṇḍaḥ puruṣaḥ kṛṣṇapiṅgalaḥ","ein furchtbarer, entstellter, kahlköpfiger Mann von schwarzbrauner Farbe (Nom. + Nom. + Nom. + Nom. + Nom.Bahuvrīhi)"],["gṛhāṇy avekṣya vṛṣṇīnāṃ nādṛśyata punaḥ kva cit","der die Häuser der Vṛṣṇis gemustert hatte, wurde danach nirgends mehr gesehen (Akk.Pl. + Absol. + Gen.Pl. + Impf.Pass. + Adv. + Adv.)"]]],["003","utpedire mahāvātā dāruṇāś cā dine dine vṛṣṇyandhakavināśāya bahavo romaharṣaṇāḥ","Tag für Tag erhoben sich gewaltige, furchtbare Winde, viele, die Haare sträubend, zum Untergang der Vṛṣṇis und Andhakas.","",[["utpedire mahāvātā dāruṇāś cā dine dine","Tag für Tag erhoben sich gewaltige, furchtbare Winde (Perf.Med. + Nom.Pl. + Nom.Pl. + Lok. + Lok.)"],["vṛṣṇyandhakavināśāya bahavo romaharṣaṇāḥ","viele, haarsträubende, zum Untergang der Vṛṣṇis und Andhakas (Dat. + Nom.Pl. + Nom.Pl.Bahuvrīhi)"]]],["004","vivṛddhamūṣakā rathyā vibhinnamaṇikās tathā cīcīkūcīti vāśyantyaḥ sārikā vṛṣṇiveśmasu nopaśāmyati śabdaś ca sa divārātram eva hi","Die Straßen waren von zahlreich vermehrten Ratten heimgesucht, ebenso die Wasserkrüge zerbrochen; die Stare, unaufhörlich cīcī-kūcī rufend, ließen in den Häusern der Vṛṣṇis den Lärm nicht verstummen, weder bei Tag noch bei Nacht.","",[["vivṛddhamūṣakā rathyā vibhinnamaṇikās tathā","die Straßen waren von zahlreich vermehrten Ratten heimgesucht, ebenso die Wasserkrüge zerbrochen (Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.Bahuvrīhi + Adv.)"],["cīcīkūcīti vāśyantyaḥ sārikā vṛṣṇiveśmasu nopaśāmyati śabdaś ca sa divārātram eva hi","die Stare, cīcī-kūcī rufend, in den Häusern der Vṛṣṇis - jener Lärm verstummte weder bei Tag noch bei Nacht (Adv. + Nom.Pl.Part. + Nom.Pl. + Lok.Pl. + Präs. + Nom. + Adv. + Adv.)"]]],["005","anukurvann ulūkānāṃ sārasā virutaṃ tathā ajāḥ śivānāṃ ca rutam anvakurvata bhārata","Kraniche ahmten den Schrei der Eulen nach, und Ziegen, o Bhārata, ahmten das Geheul der Schakale nach.","",[["anukurvann ulūkānāṃ sārasā virutaṃ tathā","Kraniche ahmten den Schrei der Eulen nach (Nom.Part. + Gen.Pl. + Nom.Pl. + Akk. + Adv.)"],["ajāḥ śivānāṃ ca rutam anvakurvata bhārata","und Ziegen ahmten das Geheul der Schakale nach, o Bhārata (Nom.Pl. + Gen.Pl. + Akk. + Impf.Med. + Vok.)"]]],["006","pāṇḍurā raktapādāś ca vihagāḥ kālacoditāḥ vṛṣṇyandhakānāṃ geheṣu kapotā vyacaraṃs tadā","Weißgraue, rotfüßige Vögel, vom Schicksal getrieben, Tauben, flogen damals umher in den Häusern der Vṛṣṇis und Andhakas.","",[["pāṇḍurā raktapādāś ca vihagāḥ kālacoditāḥ","weißgraue, rotfüßige Vögel, vom Schicksal getrieben (Nom.Pl. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["vṛṣṇyandhakānāṃ geheṣu kapotā vyacaraṃs tadā","Tauben flogen damals umher in den Häusern der Vṛṣṇis und Andhakas (Gen.Pl. + Lok.Pl. + Nom.Pl. + Impf. + Adv.)"]]],["007","vyajāyanta kharā goṣu karabhāśvatarīṣu ca śunīṣv api biḍālāś ca mūṣakā nakulīṣu ca","Esel wurden von Kühen geboren, und Jungkamele von Maultierstuten, Katzen von Hündinnen, und Ratten von Mungo-Weibchen.","",[["vyajāyanta kharā goṣu karabhāśvatarīṣu ca","Esel wurden von Kühen geboren, und Jungkamele von Maultierstuten (Impf.Pass. + Nom.Pl. + Lok.Pl. + Lok.Pl.)"],["śunīṣv api biḍālāś ca mūṣakā nakulīṣu ca","und auch Katzen von Hündinnen, und Ratten von Mungo-Weibchen (Lok.Pl. + Nom.Pl. + Nom.Pl. + Lok.Pl.)"]]],["008","nāpatrapanta pāpāni kurvanto vṛṣṇayas tadā prādviṣan brāhmaṇāṃś cāpi pitṝn devāṃs tathaiva ca","Die Vṛṣṇis schämten sich damals nicht, während sie Sünden begingen; sie verachteten sogar Brahmanen, Ahnen und ebenso auch die Götter.","",[["nāpatrapanta pāpāni kurvanto vṛṣṇayas tadā","die Vṛṣṇis schämten sich damals nicht, während sie Sünden begingen (Impf.Med. + Akk.Pl. + Nom.Pl.Part. + Nom.Pl. + Adv.)"],["prādviṣan brāhmaṇāṃś cāpi pitṝn devāṃs tathaiva ca","sie verachteten sogar Brahmanen, Ahnen und ebenso auch die Götter (Impf. + Akk.Pl. + Akk.Pl. + Akk.Pl. + Adv.)"]]],["009","gurūṃś cāpy avamanyanta na tu rāmajanārdanau patnyaḥ patīn vyuccaranta patnīś ca patayas tathā","Und sie missachteten sogar ihre Lehrer - nicht aber Rāma und Janārdana; Ehefrauen wichen ab von ihren Gatten, und ebenso Gatten von ihren Frauen.","",[["gurūṃś cāpy avamanyanta na tu rāmajanārdanau","und sie missachteten sogar ihre Lehrer, nicht aber Rāma und Janārdana (Akk.Pl. + Impf. + Neg. + Akk.Du.)"],["patnyaḥ patīn vyuccaranta patnīś ca patayas tathā","Ehefrauen wichen ab von ihren Gatten, und ebenso Gatten von ihren Frauen (Nom.Pl. + Akk.Pl. + Impf.Med. + Akk.Pl. + Nom.Pl. + Adv.)"]]],["010","vibhāvasuḥ prajvalito vāmaṃ viparivartate nīlalohitamāñjiṣṭhā visṛjann arciṣaḥ pṛthak","Das entfachte Feuer wandte sich widersinnig, und sandte einzelne blaurote und krapprote Flammen aus.","",[["vibhāvasuḥ prajvalito vāmaṃ viparivartate","das entfachte Feuer wandte sich widersinnig (Nom. + Nom.Part.Perf.Pass. + Akk. + Präs.Med.)"],["nīlalohitamāñjiṣṭhā visṛjann arciṣaḥ pṛthak","blaurote und krapprote Flammen einzeln aussendend (Nom.Bahuvrīhi + Nom.Part. + Akk.Pl. + Adv.)"]]],["011","udayāstamane nityaṃ puryāṃ tasyāṃ divākaraḥ vyadṛśyatāsakṛt puṃbhiḥ kabandhaiḥ parivāritaḥ","Bei Auf- und Untergang wurde die Sonne in jener Stadt beständig, wiederholt, von männlichen rumpflosen Gestalten [?] umgeben gesehen.","[?] \"kabandhaiḥ\" - wie in Kap.1 V004 dasselbe unklare Vorzeichen-Motiv rumpfloser Gestalten um die Sonnenscheibe.",[["udayāstamane nityaṃ puryāṃ tasyāṃ divākaraḥ","bei Auf- und Untergang beständig, in jener Stadt, die Sonne (Lok. + Adv. + Lok. + Lok. + Nom.)"],["vyadṛśyatāsakṛt puṃbhiḥ kabandhaiḥ parivāritaḥ","wurde wiederholt von männlichen rumpflosen Gestalten umgeben gesehen (Impf.Pass. + Adv. + Instr.Pl. + Instr.Pl. + Nom.Part.Perf.Pass.)"]]],["012","mahānaseṣu siddhe 'nne saṃskṛte 'tīva bhārata āhāryamāṇe kṛmayo vyadṛśyanta narādhipa","In den Küchen, o Bhārata, wurden, während die gekochte, sehr sorgfältig zubereitete Speise aufgetragen wurde, Würmer erblickt, Herrscher der Menschen.","",[["mahānaseṣu siddhe 'nne saṃskṛte 'tīva bhārata","in den Küchen, während die gekochte, sehr sorgfältig zubereitete Speise, o Bhārata (Lok.Pl. + Lok.Part.Perf.Pass. + Lok. + Lok.Part.Perf.Pass. + Adv. + Vok.)"],["āhāryamāṇe kṛmayo vyadṛśyanta narādhipa","während sie aufgetragen wurde, wurden Würmer erblickt, Herrscher der Menschen (Lok.Part.Präs.Pass. + Nom.Pl. + Impf.Pass. + Vok.)"]]],["013","puṇyāhe vācyamāne ca japatsu ca mahātmasu abhidhāvantaḥ śrūyante na cādṛśyata kaś cana","Und während das Segenswort gesprochen wurde, und während die Großherzigen die Gebete murmelten, hörte man Wesen heranstürmen, doch niemand war zu sehen.","",[["puṇyāhe vācyamāne ca japatsu ca mahātmasu","und während das Segenswort gesprochen wurde, und während die Großherzigen die Gebete murmelten (Lok. + Lok.Part.Präs.Pass. + Lok.Pl.Part. + Lok.Pl.)"],["abhidhāvantaḥ śrūyante na cādṛśyata kaś cana","hörte man Wesen heranstürmen, doch niemand war zu sehen (Nom.Pl.Part. + Präs.Pass. + Neg. + Impf.Pass. + Nom.)"]]],["014","parasparaṃ ca nakṣatraṃ hanyamānaṃ punaḥ punaḥ grahair apaśyan sarve te nātmanas tu kathaṃ cana","Und wieder und wieder sahen sie alle, wie ein Sternbild von den Planeten gegenseitig geschlagen wurde - doch keiner erkannte sein eigenes bedroht, in keiner Weise.","",[["parasparaṃ ca nakṣatraṃ hanyamānaṃ punaḥ punaḥ grahair","und wieder und wieder, wie ein Sternbild von den Planeten gegenseitig geschlagen wurde (Akk. + Nom. + Nom.Part.Präs.Pass. + Adv. + Adv. + Instr.Pl.)"],["apaśyan sarve te nātmanas tu kathaṃ cana","sahen sie alle, doch nicht ihr eigenes, in keiner Weise (Impf. + Nom.Pl. + Nom.Pl. + Neg. + Gen. + Adv. + Adv.)"]]],["015","nadantaṃ pāñcajanyaṃ ca vṛṣṇyandhakaniveśane samantāt pratyavāśyanta rāsabhā dāruṇasvarāḥ","Und als das Muschelhorn Pāñcajanya von selbst ertönte, brüllten ringsum in der Siedlung der Vṛṣṇis und Andhakas Esel mit furchtbaren Stimmen zurück.","",[["nadantaṃ pāñcajanyaṃ ca vṛṣṇyandhakaniveśane","und als das ertönende Muschelhorn Pāñcajanya, in der Siedlung der Vṛṣṇis und Andhakas (Akk.Part. + Akk. + Lok.)"],["samantāt pratyavāśyanta rāsabhā dāruṇasvarāḥ","brüllten ringsum die Esel mit furchtbaren Stimmen zurück (Adv. + Impf. + Nom.Pl. + Nom.Pl.Bahuvrīhi)"]]],["016","evaṃ paśyan hṛṣīkeśaḥ saṃprāptaṃ kālaparyayam trayodaśyām amāvāsyāṃ tāṃ dṛṣṭvā prābravīd idam","Als Hṛṣīkeśa so den eingetretenen Wandel der Zeit sah, und jenen Neumond am dreizehnten Tag erblickte, sprach er dies:","",[["evaṃ paśyan hṛṣīkeśaḥ saṃprāptaṃ kālaparyayam","als Hṛṣīkeśa so den eingetretenen Wandel der Zeit sah (Adv. + Nom.Part. + Nom. + Akk. + Akk.)"],["trayodaśyām amāvāsyāṃ tāṃ dṛṣṭvā prābravīd idam","als er jenen Neumond am dreizehnten Tag erblickt hatte, sprach er dies (Lok. + Akk. + Akk. + Absol. + Impf. + Akk.)"]]],["017","caturdaśī pañcadaśī kṛteyaṃ rāhuṇā punaḥ tadā ca bhārate yuddhe prāptā cādya kṣayāya naḥ","„Der Vierzehnte, der Fünfzehnte - dieser ist erneut von Rāhu gemacht worden; damals, im Krieg der Bhāratas, [geschah dies], und heute ist er zu unserem Untergang gekommen.“","\"Rāhu\" gemacht - Bezug auf den durch Rāhu (den Verursacher von Sonnen-/Mondfinsternissen) gestörten Mondzyklus als Unheilsvorzeichen, wie schon vor der Schlacht von Kurukṣetra.",[["caturdaśī pañcadaśī kṛteyaṃ rāhuṇā punaḥ","der Vierzehnte, der Fünfzehnte - dieser ist erneut von Rāhu gemacht worden (Nom. + Nom. + Nom.Part.Perf.Pass. + Instr. + Adv.)"],["tadā ca bhārate yuddhe prāptā cādya kṣayāya naḥ","damals im Krieg der Bhāratas, und heute ist er zu unserem Untergang gekommen (Adv. + Lok. + Lok. + Nom.Part.Perf.Pass. + Adv. + Dat. + Gen.)"]]],["018","vimṛśann eva kālaṃ taṃ paricintya janārdanaḥ mene prāptaṃ sa ṣaṭtriṃśaṃ varṣaṃ vai keśisūdanaḥ","Während er über jene Zeit nachsann und nachdachte, erkannte Janārdana, der Bezwinger des Keśin, dass das sechsunddreißigste Jahr eingetreten war.","",[["vimṛśann eva kālaṃ taṃ paricintya janārdanaḥ","während er über jene Zeit nachsann und nachdachte, Janārdana (Nom.Part. + Adv. + Akk. + Akk. + Absol. + Nom.)"],["mene prāptaṃ sa ṣaṭtriṃśaṃ varṣaṃ vai keśisūdanaḥ","erkannte er, der Bezwinger des Keśin, dass das sechsunddreißigste Jahr eingetreten war (Perf.Med. + Akk. + Nom. + Akk. + Akk. + Adv. + Nom.)"]]],["019","putraśokābhisaṃtaptā gāndhārī hatabāndhavā yad anuvyājahārārtā tad idaṃ samupāgatam","Was Gāndhārī, von Sohnesleid versengt, ihrer Verwandten beraubt, einst schmerzerfüllt als Fluch ausgesprochen hatte - dies war nun eingetreten.","",[["putraśokābhisaṃtaptā gāndhārī hatabāndhavā","Gāndhārī, von Sohnesleid versengt, ihrer Verwandten beraubt (Nom.Bahuvrīhi + Nom. + Nom.Bahuvrīhi)"],["yad anuvyājahārārtā tad idaṃ samupāgatam","was sie, schmerzerfüllt, ausgesprochen hatte - dies war eingetreten (Akk. + Perf. + Nom.Bahuvrīhi + Nom. + Nom. + Nom.Part.Perf.)"]]],["020","idaṃ ca tad anuprāptam abravīd yad yudhiṣṭhiraḥ purā vyūḍheṣv anīkeṣu dṛṣṭvotpātān sudāruṇān","Und dies war auch eingetreten, was Yudhiṣṭhira einst gesagt hatte, als er, während die Heere aufgestellt waren, die überaus furchtbaren Vorzeichen erblickt hatte.","",[["idaṃ ca tad anuprāptam abravīd yad yudhiṣṭhiraḥ","und dies war auch eingetreten, was Yudhiṣṭhira gesagt hatte (Nom. + Nom. + Nom.Part.Perf. + Impf. + Akk. + Nom.)"],["purā vyūḍheṣv anīkeṣu dṛṣṭvotpātān sudāruṇān","einst, als die Heere aufgestellt waren, nachdem er die überaus furchtbaren Vorzeichen erblickt hatte (Adv. + Lok.Pl.Part.Perf.Pass. + Lok.Pl. + Absol. + Akk.Pl. + Akk.Pl.)"]]],["021","ity uktvā vāsudevas tu cikīrṣan satyam eva tat ājñāpayām āsa tadā tīrthayātrām ariṃdama","Nachdem er so gesprochen hatte, befahl Vāsudeva, entschlossen, eben dies zur Wahrheit werden zu lassen, damals eine Pilgerfahrt zu den heiligen Furten, Bezwinger der Feinde.","",[["ity uktvā vāsudevas tu cikīrṣan satyam eva tat","nachdem er so gesprochen hatte, Vāsudeva, entschlossen, eben dies zur Wahrheit werden zu lassen (Adv. + Absol. + Nom. + Nom.Desid.Part. + Akk. + Adv. + Akk.)"],["ājñāpayām āsa tadā tīrthayātrām ariṃdama","befahl er damals eine Pilgerfahrt zu den heiligen Furten, Bezwinger der Feinde (Perf.Periphr.Kaus. + Adv. + Akk. + Vok.)"]]],["022","aghoṣayanta puruṣās tatra keśavaśāsanāt tīrthayātrā samudre vaḥ kāryeti puruṣarṣabhāḥ","Da verkündeten die Männer dort, auf Keśavas Befehl: „Eine Pilgerfahrt zum Meer ist von euch zu unternehmen, ihr Stiere der Männer!“","",[["aghoṣayanta puruṣās tatra keśavaśāsanāt","da verkündeten die Männer dort, auf Keśavas Befehl (Impf.Kaus. + Nom.Pl. + Adv. + Abl.)"],["tīrthayātrā samudre vaḥ kāryeti puruṣarṣabhāḥ","eine Pilgerfahrt zum Meer ist von euch zu unternehmen, ihr Stiere der Männer (Nom. + Lok. + Gen.Pl. + Nom.Ger. + Indekl. + Vok.Pl.)"]]]]},{"num":4,"title_sa":"","title_de":"Das Gemetzel von Prabhāsa","note":"Weitere Vorzeichen (Kṛṣṇas Diskus steigt zum Himmel, Wagen und Feldzeichen verschwinden, eine Himmelsstimme heißt die Pilgerfahrt antreten, V005 CQ). Die Vṛṣṇis und Andhakas ziehen mit Familien nach Prabhāsa, Uddhava scheidet weissagend, ein großes Trinkgelage beginnt. Sātyakis Vorwurf an Kṛtavarman wegen dessen Beteiligung am nächtlichen Massaker des Sauptikaparva (V017, CQ) und Kṛtavarmans Gegenvorwurf wegen Bhūriśravas' Tod (V020, CQ) entzünden den Streit; Sātyaki schwört Rache (V025-026, CQ) und enthauptet Kṛtavarman, woraufhin ein allgemeines, trunkenheitsgetriebenes Gemetzel ausbricht. Kṛṣṇa ergreift schließlich Erakā-Schilfrohr, das sich (wie bei allen Kämpfenden) in eiserne Keulen (musala) verwandelt - die endgültige Erfüllung des Fluchs; Vater tötet Sohn, Sohn tötet Vater, bis fast alle gefallen sind, darunter Kṛṣṇas eigene Söhne Sāmba, Cārudeṣṇa, Pradyumna, Aniruddha und sein Bruder Gada. Babhru und Dāruka bitten den zornentbrannten Kṛṣṇa, von weiterem Blutvergießen abzulassen und Balarāma zu suchen (V046, CQ).","units":[["001","vaiśaṃpāyana uvāca kālī strī pāṇḍurair dantaiḥ praviśya hasatī niśi striyaḥ svapneṣu muṣṇantī dvārakāṃ paridhāvati","Vaiśaṃpāyana sprach: Eine schwarze Frau mit weißlichen Zähnen lief, in der Nacht eindringend, lachend, den Frauen im Traum die Habe raubend, rings um Dvārakā umher.","",[["vaiśaṃpāyana uvāca kālī strī pāṇḍurair dantaiḥ","Vaiśaṃpāyana sprach: eine schwarze Frau mit weißlichen Zähnen (Nom. + Nom. + Nom. + Instr.Pl. + Instr.Pl.)"],["praviśya hasatī niśi striyaḥ svapneṣu muṣṇantī dvārakāṃ paridhāvati","eindringend, lachend, in der Nacht, den Frauen im Traum die Habe raubend, lief um Dvārakā umher (Absol. + Nom.Part. + Lok. + Akk.Pl. + Lok.Pl. + Nom.Part. + Akk. + Präs.)"]]],["002","alaṃkārāś ca chatraṃ ca dhvajāś ca kavacāni ca hriyamāṇāny adṛśyanta rakṣobhiḥ subhayānakaiḥ","Schmuckstücke, der Schirm, Banner und Panzer wurden, von überaus furchterregenden Dämonen fortgetragen, gesehen.","",[["alaṃkārāś ca chatraṃ ca dhvajāś ca kavacāni ca","Schmuckstücke, der Schirm, Banner und Panzer (Nom.Pl. + Nom. + Nom.Pl. + Nom.Pl.)"],["hriyamāṇāny adṛśyanta rakṣobhiḥ subhayānakaiḥ","wurden fortgetragen gesehen, von überaus furchterregenden Dämonen (Nom.Pl.Part.Präs.Pass. + Impf.Pass. + Instr.Pl. + Instr.Pl.)"]]],["003","tac cāgnidattaṃ kṛṣṇasya vajranābham ayasmayam divam ācakrame cakraṃ vṛṣṇīnāṃ paśyatāṃ tadā","Und jene von Agni geschenkte Scheibe Kṛṣṇas, mit dem Blitz-Nabe, aus Eisen, stieg damals zum Himmel empor, während die Vṛṣṇis zusahen.","",[["tac cāgnidattaṃ kṛṣṇasya vajranābham ayasmayam","und jene von Agni geschenkte Scheibe Kṛṣṇas, mit dem Blitz-Nabe, aus Eisen (Nom. + Nom.Bahuvrīhi + Gen. + Nom.Bahuvrīhi + Nom.)"],["divam ācakrame cakraṃ vṛṣṇīnāṃ paśyatāṃ tadā","stieg zum Himmel empor, die Scheibe, während die Vṛṣṇis zusahen (Akk. + Perf. + Nom. + Gen.Pl.Part. + Adv.)"]]],["004","yuktaṃ rathaṃ divyam ādityavarṇaṃ hayāharan paśyato dārukasya te sāgarasyopariṣṭhād avartan manojavāś caturo vājimukhyāḥ","Den angeschirrten, himmlischen, sonnengleich glänzenden Wagen trugen die Pferde davon, während Dāruka zusah; sie kehrten über dem Meer wieder um, die vier vorzüglichsten, gedankenschnellen Rosse.","",[["yuktaṃ rathaṃ divyam ādityavarṇaṃ hayāharan paśyato dārukasya","den angeschirrten, himmlischen, sonnengleich glänzenden Wagen trugen die Pferde davon, während Dāruka zusah (Akk. + Akk. + Akk. + Akk. + Nom.Pl.+Perf. + Gen.Part. + Gen.)"],["te sāgarasyopariṣṭhād avartan manojavāś caturo vājimukhyāḥ","sie kehrten über dem Meer wieder um, die vier vorzüglichsten, gedankenschnellen Rosse (Nom.Pl. + Gen. + Adv. + Impf. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.)"]]],["005","tālaḥ suparṇaś ca mahādhvajau tau supūjitau rāmajanārdanābhyām uccair jahrur apsaraso divāniśaṃ vācaś cocur gamyatāṃ tīrthayātrā","Die Palme und der Garuḍa, jene beiden großen, von Rāma und Janārdana hoch verehrten Feldzeichen, wurden von Apsaras bei Tag und Nacht laut fortgetragen; und Stimmen sprachen: „Die Pilgerfahrt zu den heiligen Furten soll angetreten werden!“","",[["tālaḥ suparṇaś ca mahādhvajau tau supūjitau rāmajanārdanābhyām","die Palme und der Garuḍa, jene beiden großen, von Rāma und Janārdana hoch verehrten Feldzeichen (Nom. + Nom. + Nom.Du. + Nom.Du. + Instr.Du.)"],["uccair jahrur apsaraso divāniśaṃ vācaś cocur gamyatāṃ tīrthayātrā","wurden von Apsaras bei Tag und Nacht laut fortgetragen; und Stimmen sprachen: die Pilgerfahrt soll angetreten werden (Adv. + Perf. + Nom.Pl. + Adv. + Nom.Pl. + Perf. + Opt.Pass. + Nom.)"]]],["006","tato jigamiṣantas te vṛṣṇyandhakamahārathāḥ sāntaḥpurās tadā tīrthayātrām aicchan nararṣabhāḥ","Da wollten jene großen Wagenkämpfer der Vṛṣṇis und Andhakas, aufbrechen begehrend, samt ihren Frauengemächern damals die Pilgerfahrt zu den heiligen Furten antreten, die Stiere unter den Männern.","",[["tato jigamiṣantas te vṛṣṇyandhakamahārathāḥ","da wollten jene großen Wagenkämpfer der Vṛṣṇis und Andhakas aufbrechen (Adv. + Nom.Pl.Desid.Part. + Nom.Pl. + Nom.Pl.)"],["sāntaḥpurās tadā tīrthayātrām aicchan nararṣabhāḥ","samt ihren Frauengemächern wünschten sie damals die Pilgerfahrt, die Stiere der Männer (Nom.Pl.Bahuvrīhi + Adv. + Akk. + Impf. + Nom.Pl.)"]]],["007","tato bhojyaṃ ca bhakṣyaṃ ca peyaṃ cāndhakavṛṣṇayaḥ bahu nānāvidhaṃ cakrur madyaṃ māṃsam anekaśaḥ","Da bereiteten die Andhakas und Vṛṣṇis viel mannigfache Speise, Nahrung und Trank, und in vielfacher Weise Wein und Fleisch.","",[["tato bhojyaṃ ca bhakṣyaṃ ca peyaṃ cāndhakavṛṣṇayaḥ","da bereiteten die Andhakas und Vṛṣṇis Speise, Nahrung und Trank (Adv. + Akk. + Akk. + Akk. + Nom.Pl.)"],["bahu nānāvidhaṃ cakrur madyaṃ māṃsam anekaśaḥ","viel und mannigfach, und in vielfacher Weise Wein und Fleisch (Akk. + Akk. + Perf. + Akk. + Akk. + Adv.)"]]],["008","tataḥ sīdhuṣu saktāś ca niryayur nagarād bahiḥ yānair aśvair gajaiś caiva śrīmantas tigmatejasaḥ","Da zogen sie, dem süßen Branntwein zugetan, glanzvoll, von scharfer Glutkraft, mit Wagen, Pferden und Elefanten aus der Stadt hinaus.","",[["tataḥ sīdhuṣu saktāś ca niryayur nagarād bahiḥ","da zogen sie, dem süßen Branntwein zugetan, aus der Stadt hinaus (Adv. + Lok.Pl. + Nom.Pl.Part. + Perf. + Abl. + Adv.)"],["yānair aśvair gajaiś caiva śrīmantas tigmatejasaḥ","mit Wagen, Pferden und Elefanten, glanzvoll, von scharfer Glutkraft (Instr.Pl. + Instr.Pl. + Instr.Pl. + Nom.Pl.Bahuvrīhi + Nom.Pl.Bahuvrīhi)"]]],["009","tataḥ prabhāse nyavasan yathoddeśaṃ yathāgṛham prabhūtabhakṣyapeyās te sadārā yādavās tadā","Da ließen sich die Yādavas, samt ihren Frauen, mit reichlicher Speise und Trank versehen, damals in Prabhāsa nieder, jeder an dem ihm zugewiesenen Platz, wie in einem eigenen Haus.","",[["tataḥ prabhāse nyavasan yathoddeśaṃ yathāgṛham","da ließen sie sich in Prabhāsa nieder, jeder an dem zugewiesenen Platz, wie im eigenen Haus (Adv. + Lok. + Impf. + Adv. + Adv.)"],["prabhūtabhakṣyapeyās te sadārā yādavās tadā","mit reichlicher Speise und Trank versehen, jene Yādavas, samt ihren Frauen, damals (Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Adv.)"]]],["010","niviṣṭāṃs tān niśamyātha samudrānte sa yogavit jagāmāmantrya tān vīrān uddhavo 'rthaviśāradaḥ","Als er vernommen hatte, dass sie sich am Ufer des Meeres niedergelassen hatten, ging Uddhava, der Yoga-Kundige, der in der rechten Handlungsweise Erfahrene, fort, nachdem er von jenen Helden Abschied genommen hatte.","",[["niviṣṭāṃs tān niśamyātha samudrānte sa yogavit","als er vernommen hatte, dass sie sich am Ufer des Meeres niedergelassen hatten, der Yoga-Kundige (Akk.Pl.Part.Perf. + Akk.Pl. + Absol. + Adv. + Lok. + Nom. + Nom.)"],["jagāmāmantrya tān vīrān uddhavo 'rthaviśāradaḥ","ging Uddhava, der in der rechten Handlungsweise Erfahrene, fort, nachdem er von jenen Helden Abschied genommen hatte (Perf. + Absol. + Akk.Pl. + Akk.Pl. + Nom. + Nom.Bahuvrīhi)"]]],["011","taṃ prasthitaṃ mahātmānam abhivādya kṛtāñjalim jānan vināśaṃ vṛṣṇīnāṃ naicchad vārayituṃ hariḥ","Ihn, den Großherzigen, der aufgebrochen war, grüßte Hari, die Hände ehrfürchtig gefaltet; obwohl er den Untergang der Vṛṣṇis kannte, wollte er ihn nicht abwenden.","",[["taṃ prasthitaṃ mahātmānam abhivādya kṛtāñjalim","ihn, den Großherzigen, der aufgebrochen war, grüßte er, die Hände gefaltet (Akk. + Akk. + Akk. + Absol. + Akk.Bahuvrīhi)"],["jānan vināśaṃ vṛṣṇīnāṃ naicchad vārayituṃ hariḥ","obwohl Hari den Untergang der Vṛṣṇis kannte, wollte er ihn nicht abwenden (Nom.Part. + Akk. + Gen.Pl. + Impf. + Inf. + Nom.)"]]],["012","tataḥ kālaparītās te vṛṣṇyandhakamahārathāḥ apaśyann uddhavaṃ yāntaṃ tejasāvṛtya rodasī","Da sahen jene großen, von der Zeit ergriffenen Wagenkämpfer der Vṛṣṇis und Andhakas Uddhava fortgehen, der mit seinem Glanz Himmel und Erde erfüllte.","",[["tataḥ kālaparītās te vṛṣṇyandhakamahārathāḥ","da sahen jene von der Zeit ergriffenen großen Wagenkämpfer der Vṛṣṇis und Andhakas (Adv. + Nom.Pl.Bahuvrīhi + Nom.Pl. + Nom.Pl.)"],["apaśyann uddhavaṃ yāntaṃ tejasāvṛtya rodasī","sahen Uddhava fortgehen, der mit seinem Glanz Himmel und Erde erfüllte (Impf. + Akk. + Akk.Part. + Instr. + Absol. + Akk.Du.)"]]],["013","brāhmaṇārtheṣu yat siddham annaṃ teṣāṃ mahātmanām tad vānarebhyaḥ pradaduḥ surāgandhasamanvitam","Die Speise, die für die Zwecke jener großherzigen Brahmanen zubereitet worden war, gaben sie, mit dem Geruch von Wein durchdrungen, den Affen.","",[["brāhmaṇārtheṣu yat siddham annaṃ teṣāṃ mahātmanām","die Speise, die für die Zwecke jener großherzigen Brahmanen zubereitet worden war (Lok.Pl. + Akk. + Akk. + Akk. + Gen.Pl. + Gen.Pl.)"],["tad vānarebhyaḥ pradaduḥ surāgandhasamanvitam","diese gaben sie, mit dem Geruch von Wein durchdrungen, den Affen (Akk. + Dat.Pl. + Perf. + Akk.Bahuvrīhi)"]]],["014","tatas tūryaśatākīrṇaṃ naṭanartakasaṃkulam prāvartata mahāpānaṃ prabhāse tigmatejasām","Da begann in Prabhāsa das große Trinkgelage jener von scharfer Glutkraft, erfüllt vom Klang hunderter Musikinstrumente, gedrängt voll von Schauspielern und Tänzern.","",[["tatas tūryaśatākīrṇaṃ naṭanartakasaṃkulam","da, erfüllt vom Klang hunderter Musikinstrumente, gedrängt voll von Schauspielern und Tänzern (Adv. + Nom.Bahuvrīhi + Nom.Bahuvrīhi)"],["prāvartata mahāpānaṃ prabhāse tigmatejasām","begann das große Trinkgelage in Prabhāsa jener von scharfer Glutkraft (Impf.Med. + Nom. + Lok. + Gen.Pl.)"]]],["015","kṛṣṇasya saṃnidhau rāmaḥ sahitaḥ kṛtavarmaṇā apibad yuyudhānaś ca gado babhrus tathaiva ca","In Kṛṣṇas Nähe trank Rāma, zusammen mit Kṛtavarman, und Yuyudhāna, und Gada, und ebenso auch Babhru.","",[["kṛṣṇasya saṃnidhau rāmaḥ sahitaḥ kṛtavarmaṇā","in Kṛṣṇas Nähe trank Rāma, zusammen mit Kṛtavarman (Gen. + Lok. + Nom. + Nom.Part. + Instr.)"],["apibad yuyudhānaś ca gado babhrus tathaiva ca","und Yuyudhāna, und Gada, und ebenso auch Babhru tranken (Impf. + Nom. + Nom. + Nom. + Adv.)"]]],["016","tataḥ pariṣado madhye yuyudhāno madotkaṭaḥ abravīt kṛtavarmāṇam avahasyāvamanya ca","Da, in der Mitte der Versammlung, sprach der von Rausch übermütige Yuyudhāna zu Kṛtavarman, ihn verspottend und verachtend:","",[["tataḥ pariṣado madhye yuyudhāno madotkaṭaḥ","da, in der Mitte der Versammlung, der von Rausch übermütige Yuyudhāna (Adv. + Gen. + Lok. + Nom. + Nom.Bahuvrīhi)"],["abravīt kṛtavarmāṇam avahasyāvamanya ca","sprach zu Kṛtavarman, ihn verspottend und verachtend (Impf. + Akk. + Absol. + Absol.)"]]],["017","kaḥ kṣatriyo manyamānaḥ suptān hanyān mṛtān iva na tan mṛṣyanti hārdikya yādavā yat tvayā kṛtam","„Welcher Kṣatriya, der sich für einen solchen hält, würde Schlafende töten, als wären sie schon tot? Die Yādavas verzeihen nicht, Hārdikya, was von dir getan wurde.“","",[["kaḥ kṣatriyo manyamānaḥ suptān hanyān mṛtān iva","welcher Kṣatriya, der sich für einen solchen hält, würde Schlafende töten, als wären sie schon tot (Nom. + Nom. + Nom.Part. + Akk.Pl. + Opt. + Akk.Pl. + Adv.)"],["na tan mṛṣyanti hārdikya yādavā yat tvayā kṛtam","die Yādavas verzeihen nicht, Hārdikya, was von dir getan wurde (Neg. + Akk. + Präs. + Vok. + Nom.Pl. + Akk. + Instr. + Akk.Part.Perf.Pass.)"]]],["018","ity ukte yuyudhānena pūjayām āsa tad vacaḥ pradyumno rathināṃ śreṣṭho hārdikyam avamanya ca","Als dies von Yuyudhāna gesagt worden war, lobte Pradyumna, der Beste der Wagenkämpfer, jene Rede, und verachtete dabei auch Hārdikya.","",[["ity ukte yuyudhānena pūjayām āsa tad vacaḥ","als dies von Yuyudhāna gesagt worden war, lobte er jene Rede (Adv. + Lok.Absol.Part.Perf.Pass. + Instr. + Perf.Periphr. + Akk. + Akk.)"],["pradyumno rathināṃ śreṣṭho hārdikyam avamanya ca","Pradyumna, der Beste der Wagenkämpfer, und verachtete dabei Hārdikya (Nom. + Gen.Pl. + Nom. + Akk. + Absol.)"]]],["019","tataḥ paramasaṃkruddhaḥ kṛtavarmā tam abravīt nirdiśann iva sāvajñaṃ tadā savyena pāṇinā","Da sprach der überaus zornentbrannte Kṛtavarman zu ihm, dabei wie verächtlich mit der linken Hand hindeutend:","",[["tataḥ paramasaṃkruddhaḥ kṛtavarmā tam abravīt","da sprach der überaus zornentbrannte Kṛtavarman zu ihm (Adv. + Nom.Bahuvrīhi + Nom. + Akk. + Impf.)"],["nirdiśann iva sāvajñaṃ tadā savyena pāṇinā","dabei wie verächtlich mit der linken Hand hindeutend (Nom.Part. + Adv. + Adv. + Adv. + Instr. + Instr.)"]]],["020","bhūriśravāś chinnabāhur yuddhe prāyagatas tvayā vadhena sunṛśaṃsena kathaṃ vīreṇa pātitaḥ","„Bhūriśravas, dessen Arm abgeschlagen war, der sich im Kampf zum Fasten-Tod zurückgezogen hatte - wie wurde er, ein Held, durch einen so grausamen Mord von dir zu Fall gebracht?“","",[["bhūriśravāś chinnabāhur yuddhe prāyagatas tvayā","Bhūriśravas, dessen Arm abgeschlagen war, der sich im Kampf zum Fasten-Tod zurückgezogen hatte, von dir (Nom. + Nom.Bahuvrīhi + Lok. + Nom. + Instr.)"],["vadhena sunṛśaṃsena kathaṃ vīreṇa pātitaḥ","durch einen so grausamen Mord, wie wurde er, ein Held, zu Fall gebracht (Instr. + Instr. + Adv. + Nom. + Nom.Part.Perf.Pass.)"]]],["021","iti tasya vacaḥ śrutvā keśavaḥ paravīrahā tiryak saroṣayā dṛṣṭyā vīkṣāṃ cakre sa manyumān","Als er so dessen Rede vernommen hatte, warf Keśava, der Bezwinger feindlicher Helden, voller Grimm einen schrägen Blick mit zornerfülltem Auge.","",[["iti tasya vacaḥ śrutvā keśavaḥ paravīrahā","als er so dessen Rede vernommen hatte, Keśava, der Bezwinger feindlicher Helden (Adv. + Gen. + Akk. + Absol. + Nom. + Nom.)"],["tiryak saroṣayā dṛṣṭyā vīkṣāṃ cakre sa manyumān","warf er, voller Grimm, einen schrägen Blick mit zornerfülltem Auge (Adv. + Instr.Bahuvrīhi + Instr. + Akk. + Perf.Med. + Nom. + Nom.Bahuvrīhi)"]]],["022","maṇiḥ syamantakaś caiva yaḥ sa satrājito 'bhavat tāṃ kathāṃ smārayām āsa sātyakir madhusūdanam","Und an jene Geschichte vom Syamantaka-Juwel, das einst Satrājits Besitz gewesen war, erinnerte Sātyaki den Madhusūdana.","",[["maṇiḥ syamantakaś caiva yaḥ sa satrājito 'bhavat","und das Syamantaka-Juwel, das einst Satrājits Besitz gewesen war (Nom. + Nom. + Nom. + Nom. + Nom. + Impf.)"],["tāṃ kathāṃ smārayām āsa sātyakir madhusūdanam","an jene Geschichte erinnerte Sātyaki den Madhusūdana (Akk. + Perf.Periphr.Kaus. + Nom. + Akk.)"]]],["023","tac chrutvā keśavasyāṅkam agamad rudatī tadā satyabhāmā prakupitā kopayantī janārdanam","Als sie das gehört hatte, ging Satyabhāmā, erzürnt, weinend zu Keśavas Seite, und reizte damals Janārdana zum Zorn.","",[["tac chrutvā keśavasyāṅkam agamad rudatī tadā","als sie das gehört hatte, ging sie weinend zu Keśavas Seite (Akk. + Absol. + Akk. + Impf. + Nom.Part. + Adv.)"],["satyabhāmā prakupitā kopayantī janārdanam","Satyabhāmā, erzürnt, reizte Janārdana zum Zorn (Nom. + Nom.Part.Perf.Pass. + Nom.Part.Kaus. + Akk.)"]]],["024","tata utthāya sakrodhaḥ sātyakir vākyam abravīt pañcānāṃ draupadeyānāṃ dhṛṣṭadyumnaśikhaṇḍinoḥ","Da erhob sich Sātyaki zornig und sprach ein Wort - im Gedenken an die fünf Söhne Draupadīs sowie an Dhṛṣṭadyumna und Śikhaṇḍin:","",[["tata utthāya sakrodhaḥ sātyakir vākyam abravīt","da erhob sich Sātyaki zornig und sprach ein Wort (Adv. + Absol. + Nom.Bahuvrīhi + Nom. + Akk. + Impf.)"],["pañcānāṃ draupadeyānāṃ dhṛṣṭadyumnaśikhaṇḍinoḥ","der fünf Söhne Draupadīs sowie des Dhṛṣṭadyumna und Śikhaṇḍin (Gen.Pl. + Gen.Pl. + Gen.Du.)"]]],["025","eṣa gacchāmi padavīṃ satyena ca tathā śape sauptike ye ca nihatāḥ suptānena durātmanā","„Diesen Weg gehe ich nun, und bei der Wahrheit schwöre ich zugleich: was jene betrifft, die beim Nachtüberfall, während sie schliefen, von jenem Bösgesinnten erschlagen wurden,","",[["eṣa gacchāmi padavīṃ satyena ca tathā śape","diesen Weg gehe ich nun, und bei der Wahrheit schwöre ich zugleich (Nom. + Präs. + Akk. + Instr. + Adv. + Präs.Med.)"],["sauptike ye ca nihatāḥ suptānena durātmanā","was jene betrifft, die beim Nachtüberfall, während sie schliefen, von jenem Bösgesinnten erschlagen wurden (Lok. + Nom.Pl. + Nom.Pl.Part.Perf.Pass. + Instr.Part. + Instr.)"]]],["026","droṇaputrasahāyena pāpena kṛtavarmaṇā samāptam āyur asyādya yaśaś cāpi sumadhyame","mit Hilfe des sündigen Kṛtavarman, des Gefährten von Droṇas Sohn - heute ist dessen Leben und auch sein Ruhm zu Ende, du Schöngestaltete.“","\"sumadhyame\" (Vokativ, wörtl. \"du Schlankhüftige\") - wohl an Satyabhāmā gerichtet, die laut V023 weinend und zürnend an Kṛṣṇas Seite stand.",[["droṇaputrasahāyena pāpena kṛtavarmaṇā samāptam","mit Hilfe des sündigen Kṛtavarman, des Gefährten von Droṇas Sohn, ist zu Ende (Instr.Bahuvrīhi + Instr. + Instr. + Nom.Part.Perf.Pass.)"],["āyur asyādya yaśaś cāpi sumadhyame","dessen Leben heute und auch sein Ruhm, du Schöngestaltete (Nom. + Gen. + Adv. + Nom. + Vok.)"]]],["027","itīdam uktvā khaḍgena keśavasya samīpataḥ abhidrutya śiraḥ kruddhaś ciccheda kṛtavarmaṇaḥ","Nachdem er dies gesagt hatte, rannte er, zornentbrannt, mit dem Schwert nahe an Keśava vorbei und hieb Kṛtavarman den Kopf ab.","",[["itīdam uktvā khaḍgena keśavasya samīpataḥ","nachdem er dies gesagt hatte, mit dem Schwert, nahe bei Keśava (Adv. + Absol. + Instr. + Gen. + Adv.)"],["abhidrutya śiraḥ kruddhaś ciccheda kṛtavarmaṇaḥ","rannte er heran, zornentbrannt, und hieb Kṛtavarman den Kopf ab (Absol. + Akk. + Nom.Bahuvrīhi + Perf. + Gen.)"]]],["028","tathānyān api nighnantaṃ yuyudhānaṃ samantataḥ abhyadhāvad dhṛ
