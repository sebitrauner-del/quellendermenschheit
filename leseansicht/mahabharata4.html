n. In Adhyāya 43 (V.23) wird der Name zudem auch als Bezeichnung der Sonne (im Anschluss an „sūryaḥ“, V.19) verwendet."},{"term":"Vibhāṇḍaka","desc":"Brahmanischer Weiser, Sohn Kāśyapas; zeugt durch den Anblick der Apsaras Urvaśī abgelenkt mit einer Hirschkuh den Ṛśyaśṛṅga."},{"term":"Vibhīṣaṇa","category":"Person","definition":"Jüngerer Bruder Rāvaṇas aus dem Rāmāyaṇa; nach Rāvaṇas Fall König von Laṅkā, dem der Überlieferung nach außergewöhnlich langes Leben beschieden war - erscheint hier als tributpflichtiger Herrscher zur Zeit der Pāṇḍavas."},{"term":"Vicitravīrya","category":"Person","definition":"König der Kurus, Halbbruder des Vyāsa; seine kinderlos verwitweten Frauen wurden von Vyāsa Mütter des Dhṛtarāṣṭra und Pāṇḍu."},{"term":"Vidarbha","category":"Ort/Reich","note":"Königreich von Damayantīs Vater Bhīma, Schauplatz der Nala-Damayantī-Erzählung."},{"term":"Videha","category":"Ort","definition":"Königreich mit der Hauptstadt Mithilā, von Pāṇḍu im Kampf besiegt (Adh.105)."},{"term":"Vidulā","category":"Person","definition":"Eine Königin, deren eindringliche Ermahnung an ihren mutlosen Sohn als berühmte Lehrrede im Āraṇyakaparva überliefert ist."},{"term":"Vidura","category":"Person","definition":"Sohn des Vyāsa mit einer Dienerin (anstelle der ängstlichen Ambikā), Halbbruder von Dhṛtarāṣṭra und Pāṇḍu, weiser Ratgeber (Kṣattṛ) am Kuru-Hof. Laut Adh.100 Inkarnation des Gottes Dharma, verflucht durch den Weisen Māṇḍavya; nach Adhyāya 61 (Aṃśāvataraṇa) dagegen ein Sohn/Anteil des Ṛṣi Atri – zwei nicht harmonisierte Herkunftstraditionen im Text. Warnt Yudhiṣṭhira in Adh.133 beim Abschied in verschlüsselten Rätselworten vor Gift und Feuer und deutet einen unterirdischen Fluchtweg an, ohne die Pāṇḍavas offen vor dem Lākṣāgṛha-Plan zu warnen. Sendet in Adh.135 heimlich einen vertrauenswürdigen Grabarbeiter zu den Pāṇḍavas, der ihnen einen Fluchttunnel aus dem Lākṣāgṛha gräbt. Zeigt in Adh.137, im Unterschied zu allen anderen trauernden Kauravas, nur geringe Trauer über den vermeintlichen Tod der Pāṇḍavas, da er als Einziger die Wahrheit kennt. Seine einst missachteten Warnungen werden in Kap.126 von Droṇa in dessen Vorwurf an Duryodhana ausdrücklich in Erinnerung gerufen."},{"term":"Vidyādhara","category":"Wesen","definition":"Klasse halbgöttlicher, luftwandelnder Wesen; begleiten Indra bei seiner Ankunft am Opferplatz."},{"term":"Vierfache Schuld (Ṛṇa)","category":"Konzept","definition":"Dharmaśāstrisches Konzept: Jeder Mensch wird mit vier Schulden geboren – gegenüber den Ahnen (durch Söhne und Totenopfer zu tilgen), den Göttern (durch Opfer), den Ṛṣis (durch Vedastudium und Askese) und den Menschen (durch Güte). Pāṇḍu beruft sich in Adh.111 auf die noch offene Ahnenschuld, um Kuntī zum Niyoga zu bewegen."},{"term":"Vijaya","category":"Person","definition":"Ein Pāṇḍava-Krieger, in der Schlachtordnung des fünften Tages neben Śikhaṇḍin und Ghaṭotkaca genannt (Kap.95)."},{"term":"Vikartana","category":"Epitheton","definition":"Patronymikon Karṇas ('Sohn des Vikartana', d.h. Sohn der Sonne Sūrya, dessen Beiname Vikartana 'der Zerteilende/Strahlende' ist); in Kap.47 zur Bezeichnung Karṇas gebraucht."},{"term":"Vikarṇa","category":"Person","definition":"Einer der vier vornehmsten Söhne Dhṛtarāṣṭras (Adh.90). Stirbt in Kap.112 im Angriff auf Bhīma zusammen mit sechs Brüdern; Bhīma erklärt über seinem Leichnam, damit sein altes, während der Würfelspiel-Demütigung Draupadīs abgelegtes Rachegelübde erfüllt zu haben."},{"term":"Vinatā","category":"Person","definition":"Tochter Dakṣas, Gattin Kaśyapas, Mutter Aruṇas und Garuḍas; wird durch eine verlorene Wette zeitweise Kadrūs Dienerin."},{"term":"Vinda","category":"Krieger","definition":"Einer der beiden Avantī-Prinzen (mit seinem Bruder Anuvinda), Verbündeter der Kauravas; in Kap.104 unter den Kriegern genannt, vor denen Arjuna Śikhaṇḍin zu schützen verspricht."},{"term":"Vinda / Anuvinda","category":"Person","definition":"Die beiden Fürsten von Avanti, Verbündete der Kauravas; kämpfen in Kap.43 gegen Kuntibhoja und dessen Sohn."},{"term":"Vinda und Anuvinda","desc":"Brüderpaar, Könige von Avanti und Verbündete Duryodhanas; werden bei der Ghoṣayātrā von den Gandharvas gefangen genommen und erscheinen später auch in der Kurukṣetra-Schlacht."},{"term":"Vindhya","category":"Ort","definition":"Ein Gebirge in Mittelindien, Schauplatz der Askese Sundas und Upasundas."},{"term":"Vipracitti","category":"Wesen","definition":"Erstgeborener der vierzig Söhne Danus, König der Dānavas."},{"term":"Vipāśā","category":"Ort","definition":"Fluss (,die Entfesselte'); Ätiologie: benannt, weil er Vasiṣṭha aus seinen Stricken befreite, als dieser sich ertränken wollte (Adh.167). Entspricht wohl dem heutigen Beas."},{"term":"Vipāṭa","category":"Person","definition":"Einer von Karṇas leiblichen Brüdern, in Kap.31 von Arjuna mit einem Halbmondpfeil enthauptet."},{"term":"Virocana","category":"Wesen","definition":"Sohn Prahrādas, Vater Balis."},{"term":"Virāṭa","category":"Person","definition":"König der Matsyas, an dessen Hof die Pāṇḍavas ihr letztes Exiljahr verkleidet verbringen; Vater Uttarās. Nach Adhyāya 61 aus der Schar der Maruts geboren (Aṃśāvataraṇa). In Kapitel 142 liefert er sich mit Śalya, dem König der Madras, ein Pfeilduell, in dem beide sich schwer zusetzen; nachdem Śalya seine Pferde, Wagenlenker und Banner vernichtet hat, kämpft er zu Fuß weiter, besteigt nach dem Tod seines herbeigeeilten Bruders Śatānīka dessen Wagen, wird aber schließlich selbst schwer in die Brust getroffen und sinkt ohnmächtig zusammen; sein Wagenlenker bringt ihn vom Schlachtfeld fort. In Kap.161 wird er, nachdem Drupadas drei Enkel gefallen sind, zusammen mit Drupada von Droṇa in offener Feldschlacht mit zwei Pfeilen getötet."},{"term":"Virāṭaparva","category":"Werkteil","definition":"Das vierte Parva: das dreizehnte, verdeckte Exiljahr."},{"term":"Vitatha","category":"Person (König)","definition":"Beiname bzw. Sohn Bhumanyus in der Paurava-Genealogie (Adh.89); siehe [[Bhumanyu]]."},{"term":"Vivasvant","category":"Gottheit","definition":"Sonnengott, Sohn der Aditi, Vater des Manu (Adh.90)."},{"term":"Vivasvat","category":"Gottheit","definition":"Der Sonnengott, Vater des Manu."},{"term":"Viviṃśati","category":"Person","definition":"Einer der hundert Söhne Dhṛtarāṣṭras; erscheint als Mitspieler beim Würfelspiel und später als Kämpfer im Kurukṣetra-Krieg."},{"term":"Viśalyā","desc":"Wunderkraut, mit dem Sugrīva die von Pfeilen durchbohrten Rāma und Lakṣmaṇa augenblicklich heilt."},{"term":"Viśoka","category":"Person","definition":"Bhīmasenas Wagenlenker; wird in Kap.60 von Duryodhana verwundet, woraufhin Bhīma zornentbrannt zum göttlichen Bogen greift."},{"term":"Viśravas","desc":"Sohn des Pulastya (bzw. dessen Neuschöpfung), Vater Vaiśravaṇas/Kuberas und, mit Kaikasī, auch Rāvaṇas."},{"term":"Viśvakarman","category":"Gottheit","definition":"Der göttliche Baumeister und Kunsthandwerker-Herr, Schöpfer der himmlischen Luftwagen und Schmuckstücke der Götter."},{"term":"Viśvedeva","category":"Sache","definition":"Eine Gruppe von Göttern, den Allgöttern, oft zusammen mit den Sādhyas genannt."},{"term":"Viśvācī","category":"Wesen","definition":"Eine der sechs vorzüglichsten Apsaras (Adhyāya 68), neben Urvaśī, Pūrvacitti, Sahajanyā, Menakā und Ghṛtācī."},{"term":"Viśvāmitra","category":"Person","definition":"Großer Weiser und einstiger Kṣatriya-König, der durch gewaltige Askese den Brahmanenstand erlangte; seine Buße lässt Indra fürchten, von seinem Thron gestürzt zu werden, weshalb dieser die Apsaras Menakā zu seiner Verführung entsendet - daraus entsteht Śakuntalā."},{"term":"Viśvāvasu","category":"Wesen","definition":"Gandharva-König, Vater Pramadvarās (mit der Apsaras Menakā)."},{"term":"Viśākha","desc":"Aus Skandas durch Indras Vajra verwundeter Seite entstandener, feuergleicher jugendlicher Gott; wird später oft zusammen mit Skanda (Skanda-Viśākha) als Kriegsgottheit verehrt."},{"term":"Viḍūratha","category":"Person (König)","definition":"Sohn Kurus in der Paurava-Genealogie (Adh.90)."},{"term":"Viṣvaksena","category":"Epitheton","definition":"'Dessen Heerscharen sich in alle Richtungen ausbreiten', Beiname Kṛṣṇas; in Droṇaparva Kap.9 als Arjunas Wagenlenker bezeichnet."},{"term":"Viṣṇu","category":"Gottheit","definition":"Einer der Hauptgötter (identifiziert mit Nārāyaṇa); trägt beim Samudra-Manthana zusammen mit Brahmā die entscheidende Rolle, verleiht den Göttern Kraft und nimmt die Gestalt der Mohinī an."},{"term":"Vyuṣitāśva","category":"Person","definition":"Ein höchst rechtschaffener, dem Pūru-Geschlecht entstammender König, der ein großes Aśvamedha-Opfer vollbringt und jung an Schwindsucht (Yakṣma) stirbt. Auf die Bitte seiner untröstlichen Gattin Bhadrā erzeugt eine körperlose Stimme aus seinem Leichnam mit ihr sieben Söhne; von Kuntī in Adh.112 als Präzedenzfall für die Zeugungskraft der Askese gegenüber Pāṇḍu angeführt."},{"term":"Vyādha-Gītā","desc":"„Die Lehre des Jägers“ – die berühmte Lehrrede des rechtschaffenen Jägers (Dharma-Vyādha) von Mithilā an den Brahmanen Kauśika über den Stands-Dharma und das Verhalten der wahrhaft Guten (śiṣṭācāra); eine der bekannten eingelagerten Lehrreden des Mahābhārata."},{"term":"Vyāghradatta","category":"Person","definition":"Pāñcāla-Prinz, der in Droṇaparva Kap.15 gemeinsam mit Siṃhasena Droṇa angreift und von ihm enthauptet wird."},{"term":"Vyāsa","category":"Person","definition":"Siehe Kṛṣṇa Dvaipāyana. Erscheint den fliehenden Pāṇḍavas in Adh.144, tröstet sie, weist ihnen Ekacakrā als verborgenes Quartier zu und verheißt Yudhiṣṭhira prophetisch künftige Weltherrschaft. In Kap.158 tritt er dem von Trauer um Ghaṭotkaca überwältigten und zum Rachefeldzug gegen Karṇa aufbrechenden Yudhiṣṭhira in den Weg, tröstet ihn, erklärt ihm den glücklichen Ausgang von Arjunas Zusammentreffen mit Karṇa und verheißt ihm die Erde binnen fünf Tagen, ehe er sich alsbald auf der Stelle wieder entzieht."},{"term":"Völkerkatalog Kap.46 (Krauñcāruṇa-Formation)","category":"Gruppe","definition":"Sammeleintrag für die in Kap.46 V.46-51 einmalig genannten, historisch kaum identifizierbaren Kleinvölker/Truppenkontingente an Hals, rückwärtigem und linkem Flügel der Pāṇḍava-Formation: Dāśārṇakas, Dāśerakas, Anūpagas, Paṭaccaras, Huṇḍas, Pauravakas, Niṣādas (Waldvolk), Piśācas, Daradas, Puṇḍras, Kuṇḍīviṣas, Maḍakas, Laḍakas, Taṅgaṇas, Parataṅgaṇas, Tittiras, Agniveṣyas, Jagattuṇḍas, Paladāśas, Śabaras, Tumbupas, Vatsas, Nākulas - einzeln nicht weiter fassbare Randvölker/-stämme, analog zum Sammeleintrag 'Kaurava-Brüder' (Kap.42) statt separater Einzeleinträge behandelt."},{"term":"Völkerkatalog Kap.47 (Kaurava-Gegenformation)","category":"Gruppe","definition":"Sammeleintrag für die in Kap.47 V.7-8,12-13,15-16 einmalig genannten, historisch kaum identifizierbaren Kleinvölker/Truppenkontingente der Kaurava-Gegenformation: Saṃsthānas, Śūrasenas, Veṇikas, Kukuras, Ārevakas, Madrakas, Kuntalas, Mekalas, Karṇaprāvaraṇas, Sindhu-Sauvīras, Vasātis, Aśvātakas, Śarmila-Kosalas, Cūcupas, Kṣudraka-Mālavas, sowie die Krieger Śatruṃjaya, die Nandopanandakas und die Pāṇibhadrakas - analog zum Sammeleintrag 'Völkerkatalog Kap.46' statt separater Einzeleinträge behandelt."},{"term":"Völkerkatalog Kap.52 (Garuḍa-Formation)","category":"Gruppe","definition":"Sammeleintrag für die in Kap.52 einmalig genannten, historisch kaum identifizierbaren Kleinvölker/Truppenkontingente beider Formationen: Vāṭadhānas, Pañcanadas, Dāśeraka-Scharen, Kānanas, Vikuñjas, Āviṣas - analog zu den Sammeleinträgen 'Völkerkatalog Kap.46/47' statt separater Einzeleinträge behandelt."},{"term":"Völkerkatalog Kap.55 (Kaurava-Verstärkung)","category":"Gruppe","definition":"Sammeleintrag für die in Kap.55 einmalig genannten, historisch kaum identifizierbaren Truppenkontingente auf Kaurava-Seite, die auf Bhīṣmas Befehl gegen Arjuna anstürmen: die 'Östlichen' (Prācyas), die Sauvīra-Scharen, die Vasātis, die Kṣudrakas und die Mālavas - analog zu den Sammeleinträgen 'Völkerkatalog Kap.46/47/52' statt separater Einzeleinträge behandelt."},{"term":"Völkerkatalog Kap.60 (vierzehn Dhṛtarāṣṭra-Söhne)","category":"Gruppe","definition":"Sammeleintrag für vierzehn Söhne Dhṛtarāṣṭras, die in Kap.60 gemeinsam gegen Bhīmasena ziehen und von ihm im Zweikampf getötet werden: Senāpati, Suṣeṇa, Jalasaṃdha, Sulocana, Ugra, Bhīmaratha, Bhīma, Bhīmabāhu, Alolupa, Durmukha, Duṣpradharṣa, Vivitsu, Vikaṭa und Sama - analog zu den Sammeleinträgen 'Völkerkatalog Kap.46/47/52/55' statt separater Einzeleinträge behandelt."},{"term":"Vājapeya","category":"Ritual","definition":"Ein großes vedisches Soma-Opfer, das u.a. mit einem Wagenrennen verbunden ist."},{"term":"Vājimedha","category":"Sache","definition":"Anderer Name für das Aśvamedha, das Roßopfer; von Janamejaya als künftiges großes Opferfest angekündigt, zu dem Āstīka als Sadasya geladen wird."},{"term":"Vālakhilya","category":"Begriff","definition":"Daumengroße Weise, die traditionell kopfüber hängend Askese üben und von Mondstrahlen leben; von Garuḍa vor der Vernichtung durch einen brechenden Ast gerettet."},{"term":"Vālin","expl":"Affenkönig aus der Rāmāyaṇa-Sage, älterer Bruder Sugrīvas; ihr Streit um die Herrschaft über Kiṣkindhā wird hier als Vergleich für den Baumkampf zwischen Bhīma und Kirmīra herangezogen."},{"term":"Vālmīki","category":"Person","definition":"Legendärer Seher und Dichter des Rāmāyaṇa; hier als Vergleichsbild für Janamejayas verborgene Standhaftigkeit angeführt."},{"term":"Vāmadeva","desc":"Ein berühmter Weiser (Ṛṣi), der im Vanaparva dem König Śala die Wunderrosse Vāmya leiht und, als sie ihm vorenthalten werden, deren Rückgabe erzwingt – zunächst gegenüber Śala, der dabei umkommt, dann gegenüber dessen Bruder Dala."},{"term":"Vānaprastha","category":"Konzept","definition":"Der Waldeinsiedler, die dritte Lebensstufe (āśrama): Rückzug in den Wald nach Erfüllung der häuslichen Pflichten."},{"term":"Vānaradhvaja","category":"Sache","definition":"Das 'Affenbanner' auf Arjunas Wagen (mit dem Bild Hanumāns), das ihn im Heer kenntlich macht; wiederkehrendes Erkennungszeichen im Kampfgeschehen."},{"term":"Vāraṇāvata","category":"Ort","definition":"Stadt, in die Duryodhana die Pāṇḍavas unter dem Vorwand eines Festes verbannen lässt, um dort den Lākṣāgṛha-Mordanschlag gegen sie vorzubereiten (ab Adh.130)."},{"term":"Vārdhakṣemi","category":"Epitheton","definition":"'Sohn des Vṛddhakṣema', Patronymikon des Kriegers Anādhṛṣṭi; in Droṇaparva Kap.9 als früherer Bezwinger einer kaliṅgischen Prinzessin erwähnt."},{"term":"Vārāṇasī","category":"Ort","definition":"Hauptstadt des Königreichs Kāśī, Schauplatz der Brautwahl, bei der Bhīṣma die drei Kāśī-Prinzessinnen für Vicitravīrya raubte (Adh.96)."},{"term":"Vārṣṇeya","category":"Person","definition":"Beiname Kṛṣṇas als Spross des Vṛṣṇi-Stammes."},{"term":"Vāsava","category":"Gottheit","definition":"Ein weiteres Epitheton Indras."},{"term":"Vāsiṣṭha","desc":"Beiname/Patronymikon des Ṛṣi Vasiṣṭha bzw. seiner Nachkommen; einer der großen vedischen Sehergeschlechter, hier als einer der sechs Asketen genannt, die gemeinsam den Pāñcajanya hervorbringen."},{"term":"Vāsubhadra","category":"Epitheton","definition":"In Kap.47 (V.39, poetischer Schlussvers) auf Abhimanyu bezogene Wendung, die ihn mit Vāsudeva/Kṛṣṇa vergleicht ('eine Nachahmung des Vāsubhadra darstellend'); Ausdruck seiner göttergleichen Erscheinung im letzten Kampf mit dem Wagenrad."},{"term":"Vāsudeva","category":"Person","definition":"Beiname Kṛṣṇas (nach seinem Vater Vasudeva). Nach Adhyāya 61 der irdische Anteil des ewigen Gottes Nārāyaṇa (Aṃśāvataraṇa)."},{"term":"Vāsuki","category":"Wesen","definition":"König der Nāgas (Schlangen), Bruder der Jaratkārū, Onkel mütterlicherseits Āstīkas; einer der Hauptbetroffenen von Janamejayas Schlangenopfer."},{"term":"Vātsya","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Vātāpi","category":"Person","definition":"Ein von Agastya verschlungener Dämon aus der Agastya-Erzählung im Āraṇyaka-Parva."},{"term":"Vāyu","category":"Gottheit","definition":"Der Windgott, auch unter dem Namen Sadāgati (»der immer Wehende«) bekannt; überbringt in Adhyāya 66 Menakā zu Viśvāmitras Einsiedelei und entführt ihr Gewand."},{"term":"Vāṭadhāna","category":"Volk","definition":"Ein von Kṛṣṇa im Kampf besiegtes Volk; in Droṇaparva Kap.10 im Katalog der von Kṛṣṇa bezwungenen Völker genannt."},{"term":"Vīrabāhu","desc":"Gatte der Königinmutter von Cedi; Schwager von König Bhīma."},{"term":"Vīrasena","category":"Person","note":"König der Niṣadhas, Vater Nalas."},{"term":"Vṛddhakṣatra","category":"Person","definition":"König, Vater des Jayadrathas; dieser wird in Kap.111 als ‚Erbe des Vṛddhakṣatra‘ bezeichnet. In Kap.121 erzählt Kṛṣṇa Arjuna dessen Vorgeschichte: Bei Jayadrathas Geburt verkündete eine körperlose Stimme, sein Sohn werde unter den Kṣatriyas vorzüglich sein, doch im Kampf werde ihm sein Haupt abgeschlagen werden; erschrocken schwor Vṛddhakṣatra daraufhin, wer im Kampf das Haupt seines Sohnes zu Boden fallen lasse, dessen eigenes Haupt solle sich in hundert Teile spalten. Fern von der Schlacht in Askese vertieft, lässt Vṛddhakṣatra das von Arjuna herbeigetragene, abgeschlagene Haupt seines Sohnes erschrocken selbst zu Boden fallen und erfüllt damit unwissentlich sein eigenes Verhängnis: sein Haupt zerspringt in hundert Teile."},{"term":"Vṛka","category":"Person","definition":"Ein Pāñcālya-Krieger, der in Kap.20 Droṇa im Kampf zeitweise erheblich bedrängt (mit hundert scharfen Pfeilen), aber von diesem mit Bogen, Wagenlenker und Rossen getötet wird."},{"term":"Vṛkodara","category":"Person","definition":"Beiname Bhīmas ('Wolfsbauch'), wegen seines gewaltigen Appetits und seiner Kraft. Trägt in Adh.136 beim Fluchttunnel-Ausbruch aus dem brennenden Lākṣāgṛha die erschöpfte Mutter Kuntī auf der Schulter, die Zwillinge auf der Hüfte und führt Yudhiṣṭhira und Arjuna an den Händen. Hält in Adh.138 nach dem Tragen der erschöpften Familie durch den Wald eine bewegende Klage über ihre Notlage und wacht allein über den Schlaf der anderen. Weist in Adh.139 die Werbung von Hiḍimbas Schwester zurück, solange seine schlafende Familie in Gefahr ist, und fordert Hiḍimba zum Kampf heraus. Tötet in Adh.142 den Rākṣasa Hiḍimba im Zweikampf, indem er ihn zermalmt und entzweibricht. Wird in Adh.143 mit Hiḍimbā verheiratet (mit der Auflage, nachts zu den Brüdern zurückzukehren) und zeugt mit ihr den Sohn Ghaṭotkaca."},{"term":"Vṛndāraka","category":"Person","definition":"Ein Kaurava-Krieger, greift in Kap.36 gemeinsam mit anderen Abhimanyu an. Wird in Kap.46 von Abhimanyu vor den Augen von Dhṛtarāṣṭras Söhnen erschlagen."},{"term":"Vṛtra","category":"Person/Dämon","definition":"Ein von Indra mit dem Vajra-Blitz erschlagener Dämon; in Adh.158 im Zusammenhang mit dem Ursprung des Vajra erwähnt."},{"term":"Vṛṣaka","category":"Person","definition":"Ein Schwager Dhṛtarāṣṭras (Sohn Subalas, Bruder Gāndhārīs und Śakunis); zu seinem Wagen flieht Kṛtavarman in Kap.78, nachdem Bhīmasena seine Pferde getötet hat. Entkommt in Kap.86 schwer verwundet dem Gemetzel, als Irāvān fünf seiner Brüder tötet. Fällt schließlich in Droṇaparva Kap.29 zusammen mit seinem Bruder Acala durch einen einzigen Pfeil Arjunas."},{"term":"Vṛṣakratha","category":"Person","definition":"Krieger auf Kaurava-Seite; in Droṇaparva Kap.19 auf dem Scheitel der von Droṇa gebildeten Garuḍa-Heeresformation genannt."},{"term":"Vṛṣaparvan","category":"Person","definition":"König der Dānavas/Asuras, bei dem sich Śukra als Hauspriester aufhält; Vater bzw. Herr der Dienerin Śarmiṣṭhā."},{"term":"Vṛṣasena","category":"Person","definition":"Sohn Karṇas; hält in Droṇaparva Kap.15 im Alleingang mit Waffenzauber die Pāṇḍus auf, bevor er von Śatānīka, Nakulas Sohn, durchbohrt wird. Wird in Kap.123 von Arjuna öffentlich der Tod geschworen, nachdem dieser von Karṇas Verhöhnung Bhīmasenas erfahren hat. In Kap.132 wird er von Bhīmasena mit Pfeilen überschüttet (ohne dass sein Tod berichtet wird). In Kapitel 143 liefert er sich ein blutiges Duell mit Drupada (Yajñasena): Beide verwunden einander schwer und erstrahlen, mit Pfeilen übersät und blutüberströmt, wie Stachelschweine; nachdem Drupada seinen Bogen zerschnitten hat, greift Vṛṣasena zu einem neuen Bhalla-Pfeil und durchbohrt damit Drupadas Herz, sodass dieser ohnmächtig vom Schlachtfeld getragen werden muss; danach schlägt er das gesamte pāñcālische Heer in die Flucht und zieht, allein unter Tausenden von Königen strahlend, weiter zu Yudhiṣṭhira. In Kap.145 wird er im Duell von Sātyaki zwischen den Brustwarzen getroffen und sinkt bewusstlos in seinem Wagen zusammen, was Karṇa, der ihn für tot hält, zu erneuter erbitterter Bedrängung Sātyakis treibt."},{"term":"Vṛṣṇi","category":"Sache","definition":"Der Zweig des Yadu-Stammes, dem Kṛṣṇa entstammt."},{"term":"Yadu","category":"Person/Dynastie","definition":"Urahn der Yadu-Dynastie, der auch Kṛṣṇa angehört."},{"term":"Yajñasena","category":"Epitheton","definition":"Beiname König Drupadas."},{"term":"Yakṣa","category":"Sache","definition":"Klasse halbgöttlicher Naturwesen, oft im Gefolge Kuberas."},{"term":"Yakṣapraśna","desc":"'Die Fragen des Yakṣa': die berühmte Rätsel-Episode, in der ein Yakṣa Yudhiṣṭhira am Teich in Dvaitavana eine Reihe philosophischer Fragen stellt, bevor er dessen vier tote Brüder wiederbelebt."},{"term":"Yama","category":"Wesen","definition":"Gott des Todes und Herrscher der Verstorbenen (auch Vaivasvata, „Sohn des Vivasvat“, genannt); in seine Behausung soll gemäß Śṛṅgins Fluch Takṣaka den König Parikṣit führen."},{"term":"Yamunā","category":"Ort/Fluss","definition":"Der Yamunā-Fluss, neben der Gaṅgā Grenzmarke des Pūru zugewiesenen Kernlandes (Adh.82)."},{"term":"Yaudheya","category":"Person","definition":"Sohn Yudhiṣṭhiras und der Śibi-Prinzessin Devikā (Adh.90); daneben bezeichnet 'yaudheyāḥ' (Pl.) in Droṇaparva Kap.18 auch das gleichnamige Volk, das unter den Verbündeten der Trigartas gegen Arjuna kämpft."},{"term":"Yauvanāśva","category":"Person","definition":"Ein früherer König, der nach einem Sieg über seine Feinde eine gewaltige Keule beim Bindusaras hinterlegte, die später an Bhīma kommt."},{"term":"Yavakrī","desc":"Sohn des Bharadvāja; übte furchtbare Buße, um sich ohne Studium das Wissen der Veden zu erschließen; kam später in der Einsiedelei des Raibhya um."},{"term":"Yavana","category":"Volk","note":"Bezeichnung für Griechen bzw. westliche/griechisch-baktrische Völker in der altindischen Literatur."},{"term":"Yavanas","category":"Volk/Dynastie","definition":"Nachkommen des Turvasu, Sohnes von Yayāti und Devayānī; der Name wird im späteren Sanskrit auch allgemein für griechisch-/westlichstämmige Fremdvölker gebraucht."},{"term":"Yayāti","category":"Person","definition":"Ein früher König der Mondlinie (Candravaṃśa), Urahn mehrerer Dynastien, darunter der Kurus."},{"term":"Yojana","category":"Begriff","definition":"Ein traditionelles altindisches Wegmaß."},{"term":"Yudhiṣṭhira","category":"Person","definition":"Ältester der fünf Pāṇḍavas, Sohn der Kuntī und des Gottes Dharma; späterer König. Nach Adhyāya 61 ein Anteil des Gottes Dharma (Aṃśāvataraṇa). Stimmt in Adh.131, Dhṛtarāṣṭras wahre Absicht ahnend, aber mangels Verbündeter machtlos, der Verbannung nach Vāraṇāvata zu und erbittet vor der Abreise den Segen der Ältesten. Versteht in Adh.133 Viduras verschlüsselte Warnung vollständig, hält aber selbst gegenüber Kuntī den genauen Inhalt zunächst zurück. Erkennt in Adh.134 sofort am Geruch die Brandfalle und entscheidet, unauffällig zu bleiben und heimlich einen Fluchttunnel graben zu lassen, statt sofort zu fliehen. Springt in Kap.124 vom Wagen, umarmt Kṛṣṇa und Arjuna unter Freudentränen und hält einen langen, hymnenartigen Lobpreis Kṛṣṇas als höchstes göttliches Wesen; umarmt und lobt danach auch Arjuna direkt sowie die zurückkehrenden, verwundeten Bhīma und Sātyaki mit einer weiteren Lobrede über deren Siege. Greift in Kap.128, erzürnt, Duryodhana selbst im Zweikampf an, zerschmettert dessen Bogen und Standarte, verwundet seinen Wagenlenker Indrasena und tötet dessen Pferde; trifft ihn schließlich mit einem überaus mächtigen Pfeil so schwer, dass Duryodhana besinnungslos auf seinem Wagen zusammensinkt - woraufhin ein Jubelschrei durch das Pāñcāla-Heer geht, bis Droṇa herbeieilt und die andrängenden Pāñcālas abwehrt. In Kap.132 vernichtet er zornentbrannt ganze Truppenscharen mehrerer Völker (Ambaṣṭhas, Mālavas, Trigartas, Śibis, Abhīṣāhas, Śūrasenas, Vasātis, Yaudheyas, Āraṭṭas, Rājanyas, Madrakas) und liefert sich mit Droṇa ein Astra-Duell, das mit dem gegenseitigen Einsatz des Brahmāstra gipfelt; er wehrt Droṇas Brahmāstra mit seinem eigenen ab und wird dafür von den Kriegern beider Seiten gepriesen. Eilt in Kap.137 Sātyaki gegen Droṇas Heeresteil zu Hilfe und liefert sich mit Droṇa ein hartes eigenes Duell; folgt danach Kṛṣṇas Rat, den ohnehin auf seine Gefangennahme bedachten Droṇa zu meiden und sich stattdessen Duryodhana zuzuwenden, und zieht sich zu Bhīma zurück. Befiehlt in Kap.140 seinen Truppen, sich einzig auf die Tötung Droṇas zu konzentrieren, und liefert sich, selbst auf Droṇa zusteuernd, ein langes, wechselvolles Duell mit Kṛtavarman (u.a. mit dem Ausruf 'Bleib stehen! Bleib stehen!'), in dessen Verlauf beide einander Bogen und Rüstzeug zerschlagen, bis Kṛtavarman ihn schließlich wagenlos macht und schwer verwundet vom Schlachtfeld vertreibt. In Adh.148 bittet er angesichts der Verheerung durch Karṇa Arjuna eindringlich, gegen diesen vorzugehen, und hält zugleich den fliehenden Dhṛṣṭadyumna vom vorzeitigen Angriff auf Karṇa zurück."},{"term":"Yudhāmanyu","category":"Person","definition":"Ein Pāṇḍava-Krieger, der zusammen mit Uttamaujas als Radwächter (Beschützer der Wagenräder) Arjunas eingesetzt wird (Kap.95)."},{"term":"Yugaṃdhara","category":"Person","definition":"Großer Wagenkämpfer auf Seiten der Pāṇḍavas; hält in Droṇaparva Kap.15 kurzzeitig Droṇa auf, wird jedoch von diesem aus dem Wagenkorb geworfen."},{"term":"Yuvanāśva","desc":"König aus dem Ikṣvāku-Geschlecht, Vater des Māndhātā; wird durch versehentliches Trinken geweihten Wassers selbst zum Elternteil seines Sohnes."},{"term":"Yuyutsu","category":"Person","definition":"Auch Karaṇa genannt; Sohn Dhṛtarāṣṭras von einer Vaiśya-Dienerin, Halbbruder der hundert Kauravas (Adh.107). Warnt die Pāṇḍavas heimlich vor Duryodhanas Giftanschlag auf Bhīma, aus Wohlwollen (Adh.119)."},{"term":"Yādava","category":"Sache","definition":"Angehöriger des Stammes der Yadus, dem auch Kṛṣṇa entstammt."},{"term":"Yādavas","category":"Volk/Dynastie","definition":"Nachkommen des Yadu, ältesten Sohnes von Yayāti und Devayānī; später die Sippe, der auch Kṛṣṇa entstammt."},{"term":"Yāja","category":"Person","definition":"Ein Brahmanen-Ṛṣi vom Geschlecht der Kāśyapas, der in Adh.155 auf Drupadas Bitte das Opfer vollzieht, aus dem Dhṛṣṭadyumna und Draupadī entstehen."},{"term":"Yājñaseni","category":"Epitheton","definition":"'Sohn/Kind des Yajñasena' - Patronymikon nach Drupada (der auch Yajñasena genannt wird), das sowohl für Dhṛṣṭadyumna als auch für dessen Geschwister Śikhaṇḍin verwendet wird. In Kap.90 bezeichnet es Śikhaṇḍin (dort ausdrücklich als der spätere Anlass für Bhīṣmas Tod identifiziert)."},{"term":"Yājñasenī","category":"Person/Beiname","definition":"Beiname Draupadīs als Tochter Drupadas (,Yajñasena'); wird ab Adh.153 verwendet."},{"term":"Yājñavalkya","category":"Person","definition":"Ein berühmter vedischer Seher und Philosoph, zentrale Lehrgestalt der Bṛhadāraṇyaka-Upaniṣad."},{"term":"Yāyāvara","category":"Begriff","definition":"Bezeichnung einer Klasse wandernder Asketen (Jaratkārus Vorväter gehören dieser Gruppe an)."},{"term":"artha","category":"Begriff","definition":"Materieller Nutzen, Besitz, Staatskunst; eines der vier klassischen Lebensziele."},{"term":"brahmarṣi","category":"Person","definition":"Ein Brahmane von der Rangstufe eines großen Sehers (ṛṣi); ein brahmanischer Weiser."},{"term":"dharma","category":"Begriff","definition":"Rechte Ordnung, Pflicht, Sittengesetz; eines der vier klassischen Lebensziele (puruṣārtha)."},{"term":"itihāsa","category":"Gattung","definition":"„So ist es gewesen“ – traditionelle Bezeichnung für historisch-legendäre Erzählwerke wie Mahābhārata und Rāmāyaṇa."},{"term":"kāvya","category":"Begriff","definition":"„Dichtwerk“, kunstvolle Komposition; Bezeichnung, die Vyāsa selbst für das Mahābhārata verwendet."},{"term":"sarpasattra","category":"Ritual","definition":"Das „Schlangenopfer“ des Königs Janamejaya, bei dem Vaiśampāyana das Mahābhārata erstmals öffentlich vortrug."},{"term":"sattra","category":"Ritual","definition":"Eine mehrtägige bis mehrjährige vedische Opfersitzung; hier das zwölfjährige Opfer Śaunakas im Naimiṣa-Wald."},{"term":"Ādiparva","category":"Werkteil","definition":"Das erste der 18 Bücher (Parvas) des Mahābhārata; enthält Vorgeschichte, Rahmenerzählung und die Jugend der Pāṇḍavas und Kauravas."},{"term":"Āditya","category":"Gottheit","definition":"Bezeichnung für die Sonnengötter (Söhne der Aditi) bzw. adjektivisch „sonnengleich“; hier als Vergleich für den Glanz des neugeborenen Cyavana."},{"term":"Āhuka","category":"Person","definition":"Ein Prinz der Vṛṣṇis (auch Beiname von Ugrasena)."},{"term":"Āpad-Dharma","category":"Konzept","definition":"Das ‚Notrecht' – die Lehre, dass in existenzieller Notlage von den sonst geltenden Dharma-Regeln abgewichen werden darf, um Leben zu retten; zentrales Argument in Adh.145-146 und mehrfach im Mahābhārata."},{"term":"Āpaddharma","category":"Begriff","definition":"‚Notlage-Pflicht': eine vom gewöhnlichen Dharma abweichende, in Ausnahmesituationen zulässige Handlungsweise; Satyavatī beruft sich darauf, um Bhīṣma trotz seines Gelübdes zur Zeugung von Nachkommen zu bewegen (Adh.97)."},{"term":"Āpageya","category":"Epitheton","definition":"Beiname Bhīṣmas ('Sohn des Stromes/der Āpagā', d.h. der Gaṅgā); wird in Kap.116 für Bhīṣma verwendet, als er nach seiner Rede an Duryodhana verstummt."},{"term":"Āpagā","category":"Beiname/Ort","definition":"'Die Wandernde', Beiname des Flusses Gaṅgā; Bhīṣma wird danach 'Āpagāsuta' ('Sohn der Āpagā') genannt."},{"term":"Āpava","category":"Person","definition":"Beiname des Sehers Vasiṣṭha (Adh.92)."},{"term":"Āraṇyaparva","category":"Werkteil","definition":"Das dritte Parva des Mahābhārata: die zwölf Waldjahre der Pāṇḍavas."},{"term":"Ārtimant","category":"Person","definition":"Fromme Gestalt, zusammen mit Asita und Sunītha genannt als Schutz gegen Schlangenfurcht, wenn man sich ihrer erinnert (Adhyāya 53); nicht weiter im Text erläutert."},{"term":"Ārtāyani","category":"Person","definition":"„Sohn des Ṛtāyana“: kaum näher bekannter Krieger, in Kap.48 V.28 neben dem König (Duryodhana) von Arjuna mit Pfeilen getroffen."},{"term":"Āruṇi","category":"Person","definition":"Schüler Dhaumyas (Pāñcālya), der einen Deichbruch mit dem eigenen Körper verschließt und dafür den Namen Uddālaka erhält; siehe [[Uddālaka]]."},{"term":"Ārśyaśṛṅgi","category":"Wesen","definition":"Ein Rākṣasa, patronymisch \"Sohn des Ṛśyaśṛṅga\" genannt, Großbogenschütze und Meister der Illusionskunst (māyā); Feind Bhīmasenas wegen der einstigen Tötung Bakas. Wird in Kap.86 von Duryodhana gegen Irāvān entsandt, liefert diesem einen langen Illusions-Zweikampf und tötet ihn schließlich, nachdem er Irāvāns Schlangen-Gestaltwandlung durch eine Garuḍa-Gestalt überwunden hat."},{"term":"Ārṣṭiṣeṇa","desc":"Ein königlicher Weiser (rājarṣi), der durch strenge Askese abgemagert in einer Einsiedelei am Gandhamādana lebt und von den Pāṇḍavas aufgesucht wird."},{"term":"Āstīka","category":"Person","definition":"Brahmane, Sohn der Nāga-Prinzessin Jaratkāru und des gleichnamigen Weisen Jaratkāru; rettet die Schlangen vor Janamejayas Schlangenopfer (Sarpasatra) — Hauptfigur der noch folgenden Āstīka-parva-Erzählung."},{"term":"Ātreya","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Āvantya","category":"Person","definition":"Patronymisch-geographischer Beiname (\"der aus Avanti\") für einen Krieger/König des Landes Avanti auf Kaurava-Seite; wird in Kap.88 von Ghaṭotkaca mit vier Nārāca-Pfeilen seiner vier Pferde beraubt. In Kap.90 im Dual (\"āvantyau\") als zwei Großbogenschützen aus Avanti genannt - vermutlich das traditionelle Brüderpaar der Avanti-Prinzen."},{"term":"Āyu","category":"Person (König)","definition":"Sohn des Purūravas und der Urvaśī, Vater des Nahuṣa (Adh.90)."},{"term":"Āśvamedhaparva","category":"Werkteil","definition":"Das vierzehnte Parva: Yudhiṣṭhiras Pferdeopfer nach dem Krieg."},{"term":"Śabdavedhya","desc":"Die Kunst, ein unsichtbares Ziel allein nach dem Klang zu treffen; hier von Arjuna gegen den unsichtbar gewordenen Citrasena eingesetzt - dieselbe Technik, die andernorts in der Sanskrit-Epik (etwa beim Tod des Śravaṇa durch Daśaratha) tragische Folgen hat."},{"term":"Śacī","category":"Gottheit","definition":"Gemahlin Indras; auch Paulomī genannt (nach ihrem Vater Puloman, Adh.105)."},{"term":"Śaibya","category":"Person","definition":"König der Śibis, verbündet mit den Pāṇḍavas; bewacht in Kap.46 zusammen mit dem Kāśi-König das Hinterteil der Krauñcāruṇa-Formation."},{"term":"Śaibyā","desc":"Eine der beiden Gattinnen König Sagaras; Mutter des einzigen geschlechtsfortführenden Sohnes."},{"term":"Śaka","category":"Volk","note":"Die Skythen, ein zentralasiatisches Reitervolk, das in mehreren Wellen in den indischen Nordwesten einfiel."},{"term":"Śakaṭavyūha","category":"Konzept","definition":"Die 'Wagen'-Schlachtformation; in Droṇaparva Kap.6 die von Droṇa für das kaurava'sche Heer angelegte Aufstellung. In Kap.63 errichtet Droṇa zum Schutz Jayadrathas eine erweiterte Variante mit einer verborgenen Sūcī (\"Nadel\"-Formation) im Inneren, an deren Spitze Kṛtavarman steht und an deren \"Schlinge\" (hinterem Ende) Jayadratha selbst postiert ist."},{"term":"Śakra","category":"Person/Beiname","definition":"Ein Beiname Indras; in Adh.159 als einer der sechs göttlichen Ahnväter der Pāṇḍavas genannt (Bezug auf Arjunas göttlichen Vater Indra)."},{"term":"Śakradeva","category":"Person","definition":"Sohn des Kaliṅga-Königs, großer Wagenkämpfer; verwundet in Kap.50 Bhīmasenas Pferde, wird aber von diesem mit einer Eisenkeule vom Wagen gestürzt und erschlagen."},{"term":"Śakraprastha","category":"Ort","definition":"Ein weiterer Name für Indraprastha (Śakra = Indra)."},{"term":"Śakti","category":"Person","definition":"Vater des Parāśara, Großvater des Vyāsa (Kṛṣṇa Dvaipāyana) – nur als Genealogie-Angabe genannt. In Adh.166 als ältester der hundert Söhne Vasiṣṭhas: verflucht König Kalmāṣapāda zum Menschenfresser und wird von diesem, unter dem Einfluss eines von Viśvāmitra gesandten Rākṣasa, getötet und verzehrt."},{"term":"Śakti (Indras Speer-Waffe)","desc":"Indras unfehlbare, feindvernichtende Speer-/Wurfwaffe, die im Kavaca-Kuṇḍala-Haraṇa-Episode als Gegengabe für Karṇas Panzer und Ohrringe vereinbart wird; sie tötet stets einen Feind, bevor sie zum Werfenden zurückkehrt - im weiteren Verlauf des Epos von Karṇa gegen Ghaṭotkaca statt gegen Arjuna eingesetzt."},{"term":"Śakti (Waffe)","category":"Konzept","definition":"Ein Speer-artiges Wurfgeschoss; Karṇas Śakti-Waffe, eigentlich für Arjuna bestimmt, wird laut Vorausdeutung in Adh.143 dereinst stattdessen Ghaṭotkaca töten."},{"term":"Śakuni","category":"Person","definition":"König von Gāndhāra, Sohn Subalas (patronymisch auch Saubala genannt), Bruder der Gāndhārī, Anstifter des betrügerischen Würfelspiels. Nach Adhyāya 61 die Verkörperung des Zeitalters Dvāpara (Aṃśāvataraṇa). In Kap.144 unterliegt er im Duell Nakula: Nach anfänglichen Erfolgen wird er schwer verwundet, sein Bogen und Banner werden zerschlagen, und er sinkt bewusstlos auf seinen Wagenboden, ehe sein Wagenlenker ihn vom Feld trägt. In Kap.145 wird er von Duryodhana auf Karṇas Rat mit einer großen Streitmacht gegen Arjuna entsandt, um diesen von dem gegen Sātyaki gerichteten Vernichtungsversuch fernzuhalten. In Kap.146 umringt er mit einer gewaltigen Streitmacht aus Wagen, Elefanten und Pferden Arjuna, wird jedoch von diesem entwaffnet (sein Bogen wird zerschlagen, seine Pferde werden getötet) und muss auf den Wagen seines Sohnes Ulūka überwechseln; gemeinsam bedrängen Vater und Sohn Arjuna weiter, werden aber schließlich beide zurückgeschlagen."},{"term":"Śakuntalā","category":"Person","definition":"Tochter Viśvāmitras und der Apsaras Menakā, von Kaṇva aufgezogen; trifft in Adhyāya 65 auf König Duḥṣanta und erzählt ihm die Geschichte ihrer Herkunft."},{"term":"Śala","category":"Person (König)","definition":"Legendärer König, hier unter den himmlischen Zuschauern der Schlacht zwischen Bhīṣma und Arjuna genannt."},{"term":"Śalya","category":"Person","definition":"König der Madras, Bruder Mādrīs; kämpft auf Kaurava-Seite und wird von Yudhiṣṭhira getötet. Nach Adhyāya 61 die irdische Wiedergeburt des Daitya Saṃhrāda, jüngeren Bruders Prahrādas (Aṃśāvataraṇa). Wird in Kap.124 von Yudhiṣṭhira als von Bhīmasena und Sātyaki in die Flucht geschlagen genannt. In Kapitel 142 liefert er sich mit Virāṭa ein langes Pfeilduell (verglichen mit dem Kampf zwischen Jambha und Vāsava/Indra), tötet dessen Pferde, Wagenlenker und Banner sowie den zu Hilfe eilenden Bruder Virāṭas, Śatānīka, und verwundet schließlich auch Virāṭa selbst schwer in der Brust, sodass dieser ohnmächtig vom Schlachtfeld getragen werden muss; danach treibt er das gesamte gegnerische Heer bei Nacht in die Flucht."},{"term":"Śalyaparva","category":"Werkteil","definition":"Das neunte Parva: die letzte Phase der Schlacht."},{"term":"Śamasaubhara","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Śamaṭhaka","category":"Person","definition":"Brahmane, Beisitzer (sadasya) beim Sarpasatra Janamejayas."},{"term":"Śambara","category":"Person (mythologisch)","definition":"Ein Asura, der im Kampf zwischen Göttern und Asuras von Śakra (Indra) besiegt wurde; als Vergleichspunkt für einen erbitterten Zweikampf genannt (Kap.96)."},{"term":"Śamī","category":"Sache","definition":"Ein dorniger Baum (Prosopis cineraria), in dessen dichtem Geäst die Pāṇḍavas beim Betreten von Virāṭas Reich ihre Waffen verstecken; der Ort spielt später eine wichtige Rolle, wenn die Waffen am Ende des Exiljahres wieder hervorgeholt werden."},{"term":"Śamīka","category":"Person","definition":"Rechtschaffener, schweigender Seher; ihm legte König Parikṣit im Zorn eine tote Schlange auf die Schulter, was seinen Sohn Śṛṅgin zu dem Fluch veranlasste, der Parikṣit den Tod durch Takṣaka bestimmt."},{"term":"Śanaiścara","category":"Gottheit/Planet","definition":"Der Planet Saturn (wörtlich 'der langsam Wandelnde'), als unheilbringend geltend; in Kap.100 zusammen mit Budha (Merkur) als Vergleichsbild für zwei im Kampf zusammentreffende Krieger genannt."},{"term":"Śaradvat","category":"Person","definition":"Auch Gautama genannt; Vater des Zwillingspaares Kṛpa und Kṛpī, die aus einem Schilfrohrbüschel geboren wurden. Nach Adh.120: Sohn des Maharṣi Gautama, der Bogenkunde (Dhanurveda) und Askese so hingegeben, dass Indra ihn durch eine Apsaras stören lässt; sein dabei vergossener Same fällt auf ein Schilfbüschel und wird zu Kṛpa und Kṛpī. Kehrt später zurück, offenbart die Herkunft der Kinder und lehrt Kṛpa den vollständigen Dhanurveda."},{"term":"Śarastamba","category":"Konzept","definition":"Schilf- bzw. Rohrbüschel, auf das der Same des Ṛṣi Śaradvat Gautama fällt und sich zum Zwillingspaar Kṛpa und Kṛpī teilt (Adh.120)."},{"term":"Śaratalpa","category":"Konzept","definition":"Das 'Pfeilbett': das berühmte Bild von Bhīṣmas Sturz in Kap.114, bei dem die Masse der ihn durchbohrenden Pfeile seinen Körper trägt, sodass er den Boden nicht berührt."},{"term":"Śarmiṣṭhā","category":"Person","definition":"Tochter des Dānava-Königs Vṛṣaparvan, Dienerin und später zweite Gattin Yayātis; Mutter von Druhyu, Anu und Pūru."},{"term":"Śarva","category":"Gottheit","definition":"Beiname Śivas; in Kap.41 der Name, unter dem Jayadratha den Gott anruft und von ihm im Traum den Segen erhält, allen Söhnen des Pāṇḍu außer Arjuna im Kampf standzuhalten."},{"term":"Śaryāti","desc":"Ein König, Vater Sukanyās; an seinem alten Opferplatz spielt sich die Cyavana-Sukanyā-Geschichte ab."},{"term":"Śatadru","category":"Ort","definition":"Fluss (,der Hundertströmige'); Ätiologie: teilte sich aus Ehrfurcht vor Vasiṣṭha in hundert Arme, um ihn vor dem Ertrinken zu bewahren (Adh.167). Entspricht wohl dem heutigen Sutlej."},{"term":"Śataghnī","category":"Waffe","definition":"Wörtlich 'die Hundert-Tötende', eine schwere Wurf- oder Schleuderwaffe (oft mit Speeren/Dornen besetztes Geschoss oder Steinschleuder), im Mahābhārata mehrfach als Kriegsgerät genannt."},{"term":"Śatakratu","category":"Gottheit","definition":"Epitheton Indras („der Hundert-Opfer-Vollbringer“)."},{"term":"Śataśṛṅga","category":"Ort","definition":"‚Der Hundertgipfel'; Berg im Himālaya, wo sich Pāṇḍu mit Kuntī und Mādrī als Asket niederlässt (Adh.110)."},{"term":"Śatrughna","desc":"Jüngster Sohn Daśarathas und Sumitrās, Zwillingsbruder Lakṣmaṇas, im Rāmopākhyāna genannter Bruder Rāmas."},{"term":"Śatrusaha","category":"Person","definition":"Ein Sohn Dhṛtarāṣṭras; im Go-haraṇaparva einer der Kaurava-Krieger, die Karṇa zu Hilfe eilen wollen. Stirbt in Kap.112 im Angriff auf Bhīma zusammen mit sechs Brüdern, darunter Vikarṇa und Citrasena."},{"term":"Śatruṃjaya","category":"Person","definition":"Ein jüngerer Bruder Duryodhanas; kämpft mit Durmukha, Durjaya, Durmarṣaṇa und Śatrusaha gemeinsam gegen die Kekayas (Kap.75). Stirbt in Kap.112 im Angriff auf Bhīma zusammen mit sechs Brüdern, darunter Vikarṇa und Citrasena."},{"term":"Śatruṃtapa","category":"Person","definition":"Ein Kaurava-Krieger, der Arjuna im Go-haraṇaparva angreift und von ihm getötet wird."},{"term":"Śatānīka","category":"Person","definition":"Sohn Nakulas und Draupadīs, einer der fünf Upapāṇḍavas; auch patronymisch Nākuli (\"Sohn Nakulas\") genannt. Nicht zu verwechseln mit dem gleichnamigen späteren König, Sohn Parikṣits II. (Janamejayas Sohn). Ein weiterer, davon zu unterscheidender Śatānīka ist ein Bruder Virāṭas: Dieser eilt in Kapitel 142 des Droṇaparva seinem im Kampf gegen Śalya, den König der Madras, entwagten Bruder zu Hilfe und wird dabei von Śalya mit vielen Pfeilen getötet."},{"term":"Śatāyus","category":"Person","definition":"Ein Krieger auf Kaurava-Seite, zusammen mit Śrutāyus und Bhūriśravas Wächter des Hinterteils der Krauñca-Heeresformation in Kap.71."},{"term":"Śaunaka","category":"Person","definition":"Sippenoberhaupt (kulapati), in dessen zwölfjährigem Opfer im Naimiṣa-Wald Ugraśravas das Mahābhārata vorträgt."},{"term":"Śaśabindu","category":"Person","definition":"Legendärer König, dessen Opfer als Vergleichsbild angeführt wird."},{"term":"Śaṃkara","category":"Gott","definition":"Beiname Śivas."},{"term":"Śaṃtanu","category":"Person (König)","definition":"Sohn Pratīpas, erlangte die Herrschaft über die Erde, nachdem sein älterer Bruder Devāpi in die Verbannung gezogen war; späterer Vater Bhīṣmas (Adh.89)."},{"term":"Śaṅkha","category":"Person","definition":"Ältester Sohn Virāṭas, Königs der Matsyas."},{"term":"Śaṅku","category":"Person","definition":"Sohn Janamejayas, Bruder des Śatānīka (Adh.90)."},{"term":"Śeṣa","category":"Wesen","definition":"Der tausendköpfige Weltenschlangen-Nāga, auf dem Viṣṇu ruht; ältester Sohn Kadrūs."},{"term":"Śibi","category":"Person (König)","definition":"Berühmter für seine Freigebigkeit bekannter König, der Yayāti in der Zwischenluft begegnet, nachdem dieser aus dem Himmel gestürzt wurde (Adh.81)."},{"term":"Śikhaṇḍin","category":"Person","definition":"Kämpfer auf Seiten der Pāṇḍavas, vor dem Bhīṣma die Waffen nicht erhebt; ermöglicht dadurch Bhīṣmas Fall. Nach Adhyāya 61 ein Rākṣasa von weiblich-männlicher Doppelnatur (Aṃśāvataraṇa). In Kap.144 (dort auch als Yājñaseni, Sohn des Yajñasena/Drupada, bezeichnet) liefert er sich mit Kṛpa ein Duell, in dem beide einander schwer verwunden; als Kṛpa schließlich die Oberhand gewinnt, sinkt Śikhaṇḍin erschöpft auf seinen Wagenboden."},{"term":"Śini","category":"Vorfahr","definition":"Vorfahr aus der Yadu-Vṛṣṇi-Sippe; Sātyaki wird nach ihm Śaineya (Sohn/Nachkomme des Śini, genauer: Enkel über dessen Tochter) genannt. Gewann nach Kap.119 bei der Svayaṃvara der Devakī deren Hand für Vasudeva, indem er alle Fürsten besiegte, und warf dabei Somadatta im Ringkampf nieder und demütigte ihn vor den versammelten Königen - der Ursprung von Somadattas Wunsch an Śiva, der sich später in dem Kampf des Bhūriśravas gegen Sātyaki erfüllte."},{"term":"Śiva","category":"Gottheit","definition":"Großer Gott, „Herr der Götter“ (deveśa), Dreizackträger (śūlapāṇi); wird in Adh.44 als Vergleichsbild für den heranwachsenden Āstīka herangezogen. Unter dem Namen Śaṃkara erklärt er in Adh.157, warum Draupadī fünf Gatten haben wird: eine frühere, glücklose Ṛṣi-Tochter (Draupadīs Vorleben) hatte ihn fünfmal wiederholt um einen Gatten gebeten."},{"term":"Śiśupāla","category":"Person","definition":"König der Cedis, Wiedergeburt des Hiraṇyakaśipu; später von Kṛṣṇa enthauptet (Sabhāparva)."},{"term":"Śreṇimant","category":"Person","definition":"Ein Krieger auf Pāṇḍava-Seite, Gefolgsmann Dhṛṣṭadyumnas (Droṇaparva Kap.22)."},{"term":"Śreṇimān","category":"Person","definition":"Ein Krieger, der in Kap.89 mit Bhīmasena Ghaṭotkaca zu Hilfe eilt."},{"term":"Śrutakarman","category":"Person","definition":"Sohn Sahadevas und Draupadīs (Adh.90)."},{"term":"Śrutakīrti","category":"Person","definition":"Sohn Arjunas und Draupadīs, einer der fünf Upapāṇḍavas."},{"term":"Śrutarvan","desc":"Legendärer König, von Agastya um Reichtum gebeten; sein Reich hatte genau ausgeglichene Einnahmen und Ausgaben."},{"term":"Śrutasena","category":"Person","definition":"Sohn Sahadevas und Draupadīs, einer der fünf Upapāṇḍavas."},{"term":"Śrutaśravas","category":"Person","definition":"Alter Brahmane, Askese und vedischem Studium ergeben, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Śrutāyus","category":"Person","definition":"Ein Krieger auf Kaurava-Seite, kämpft in Kap.43 gegen Irāvān."},{"term":"Śrī","category":"Gottheit","definition":"Glücks- und Schönheitsgöttin (später mit Lakṣmī identifiziert); entsteht beim Samudra-Manthana aus dem Ghee."},{"term":"Śrīvatsa","desc":"Ein besonderes, meist locken- oder rautenförmiges Zeichen auf der Brust Viṣṇus/Nārāyaṇas, eines seiner charakteristischen Erkennungsmerkmale, auch als Kind auf dem Banyanblatt (Vanaparva, Mārkaṇḍeya-Episode)."},{"term":"Śuka","category":"Person","definition":"Sohn des Vyāsa, dem dieser das Mahābhārata als Erstem lehrte."},{"term":"Śuka (Sohn Subalas)","category":"Person","definition":"Einer von sechs Söhnen Subalas (Bruder Śakunis und Gāndhārīs), der in Kap.86 gegen Irāvān kämpft und getötet wird - nicht zu verwechseln mit Śuka, dem Sohn des Vyāsa."},{"term":"Śukla","category":"Person","definition":"'Der Weiße'; ein Krieger auf Pāṇḍava-Seite, dessen Banner, Panzer, Pferde und Bogen einheitlich weiß gefärbt sind (Droṇaparva Kap.22)."},{"term":"Śukra","category":"Person","definition":"Auch Uśanas genannt; Sohn eines Ṛṣis (Bhṛgu), Hauslehrer (Purohita) der Asuras; Vater von vier Söhnen, die als Asura-Opferpriester wirken."},{"term":"Śunaka","category":"Person","definition":"Sohn Rurus und der Pramadvarā, Urahn (Vorfahr) Śaunakas, des Zuhörers der Rahmenerzählung."},{"term":"Śvasana","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Śveta (Berg)","desc":"Ein Berg im Himālaya-Gebiet, den die Pāṇḍavas auf ihrem Weg zum Gandhamādana durchqueren."},{"term":"Śvetaketu","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas; in der Tradition bekannter Sohn Uddālakas."},{"term":"Śālihotra","desc":"Ein legendärer Kenner des wahren Wesens der Pferde; Vārṣṇeya erwägt, ob Bāhuka in Wahrheit Śālihotra in menschlicher Gestalt sein könnte."},{"term":"Śālva","category":"Person","definition":"König von Saubha, von Ambā insgeheim zum Gatten erwählt; kämpft gegen Bhīṣma bei der Brautwahl in Kāśī, wird besiegt, aber am Leben gelassen (Adh.96)."},{"term":"Śālvāśraya","category":"Volk","definition":"Volk, das in Kap.114 zusammen mit den Trigartas und Ambaṣṭhas Bhīṣma im Kampf nicht verlässt."},{"term":"Śāntanu","category":"Person","definition":"König der Kurus, Vater Bhīṣmas (daher „Śāṃtanava“ = Sohn des Śāntanu als Beiname Bhīṣmas)."},{"term":"Śāntiparva","category":"Werkteil","definition":"Das zwölfte Parva: Bhīṣmas Lehren über Dharma und Herrschaft."},{"term":"Śāntā","desc":"Tochter König Lomapādas von Aṅga; wird Ṛśyaśṛṅga zur Frau gegeben, nachdem seine Ankunft die Dürre beendet hat."},{"term":"Śāradaṇḍāyanī","category":"Person","definition":"Gattin eines Helden, die auf Geheiß der Familienältesten durch Niyoga mit einem Brahmanen drei Söhne (angeführt von Durjaya) zeugte; von Pāṇḍu in Adh.111 als Präzedenzfall gegenüber Kuntī angeführt."},{"term":"Śārṅga","category":"Waffe","definition":"Der Bogen Kṛṣṇas (Viṣṇus)."},{"term":"Śārṅgaka","category":"Sache","definition":"Bezeichnung für vier kleine Vögel, die den Khāṇḍava-Brand überlebten; ihre nähere Geschichte wird an dieser Stelle noch nicht erzählt."},{"term":"Śārṅgarava","category":"Person","definition":"Brahmā-Priester (Aufsichtspriester) beim Sarpasatra Janamejayas."},{"term":"Śāṃtanava","category":"Person","definition":"Beiname Bhīṣmas als Sohn des Königs Śāṃtanu."},{"term":"Śāṃtanu","category":"Person","definition":"König der Kurus, Vater Bhīṣmas (mit Gaṅgā) und Vicitravīryas (mit Satyavatī); Urahn sowohl der Kauravas als auch der Pāṇḍavas."},{"term":"Śūra","category":"Person","definition":"Haupt der Yadus, Vater Vasudevas und Pṛthās (Kuntīs); verspricht sein erstgeborenes Kind seinem kinderlosen Vetter Kuntibhoja (Adh.104)."},{"term":"Śūrasena","category":"Person/Volk","definition":"Ein Krieger bzw. Volk auf Kaurava-Seite, im Bereich des Halses der Krauñca-Heeresformation in Kap.71 genannt."},{"term":"Śūrpaṇakhā","desc":"Rākṣasī, Schwester Rāvaṇas und Kharas, deren Verstümmelung durch Lakṣmaṇa im Rāmāyaṇa den Anlass für Sītās Entführung liefert."},{"term":"Śūrpāraka","desc":"Heiliger Küstenort am Ozean, von den Pāṇḍavas auf ihrer Tīrtha-Wanderung besucht."},{"term":"Śṛṅgin","category":"Person","definition":"Junger, jähzorniger Sohn eines schweigenden Muni; wird von einem Gefährten wegen der Demütigung seines Vaters (dem eine tote Schlange auf die Schulter gelegt wurde) verspottet und verflucht daraufhin König Parikṣit – Auftakt zur Vorgeschichte von Parikṣits Tod und Janamejayas Sarpasatra."},{"term":"Śṛṅgāṭaka","category":"Begriff","definition":"Die \"Wasserkastanien-Formation\", eine von Dhṛṣṭadyumna in Kap.83 als Gegenformation zu Bhīṣmas Ozean-gleicher Schlachtordnung gebildete Heeresaufstellung, die feindliche Formationen zerstören soll (paravyūhavināśana)."},{"term":"śatasāhasrī saṃhitā","category":"Werktitel","definition":"„Die Sammlung der Hunderttausend[-Verse]“ – traditioneller Beiname des Mahābhārata."},{"term":"Ḍuṇḍubha","category":"Wesen","definition":"Eine harmlose, ungiftige Wasserschlangenart; ein alter Ḍuṇḍubha wird von Ruru fälschlich angegriffen und hält ihm eine Lehre über Gewaltlosigkeit vor (Adhyāya 9–10)."},{"term":"Ṛbhu","desc":"Klasse göttlicher Wesen, die selbst als 'Götter der Götter' gelten und noch höhere Himmelswelten bewohnen als die gewöhnlichen Götter, von denen sie verehrt werden."},{"term":"Ṛcīka","desc":"Weiser aus dem Geschlecht Bhṛgus, Sohn Bhṛgus; gewinnt Satyavatī, Gādhis Tochter, durch tausend von Varuṇa erlangte Rosse; Vater des Jamadagni."},{"term":"Ṛkṣa","category":"Person (König)","definition":"Sohn Ajamīḍhas (über Dhūminī), Vater Saṃvaraṇas (Adh.89)."},{"term":"Ṛtuparṇa","category":"König","note":"König von Ayodhyā, bei dem Nala später als Wagenlenker Dienst tut; kundig in der Kunst des Würfelspiels."},{"term":"Ṛśyamūka","desc":"Berg, auf dem Sugrīva nach seiner Vertreibung durch Vālin lange zusammen mit Hanumān weilte."},{"term":"Ṛśyaśṛṅga","category":"Person","definition":"Von Kindheit an keuscher Asket, dessen Lebensgeschichte im Āraṇyaka-Parva erzählt wird."},{"term":"ṛta","category":"Begriff","definition":"Die kosmische Wahrheit/Ordnung; vedischer Vorläuferbegriff zu dharma."},{"term":"Ṣaṣṭhī","desc":"Göttin des sechsten Tages, mit Kindersegen und Kinderschutz assoziiert; in Kap. 218 der Vanaparva mit Devasenā, Skandas Gemahlin, gleichgesetzt. Ihr Festtag (Skanda-Ṣaṣṭhī) geht auf den Tag von Skandas Zielerreichung im Kampf zurück."},{"term":"Akampana","category":"Person (König)","definition":"Ein im Kampf gefallener König; sein Sohn Hari wurde, bevor er selbst hätte waffenkundig werden können, im Kampf erschlagen. Nārada erzählt Akampana in Droṇaparva Kap.49 (Ṣoḍaśarājakīya) zum Trost über den Tod die Geschichte vom Ursprung der Mṛtyu (des Todes)."},{"term":"Śvitya","category":"Person (König)","definition":"Vater des Königs Sṛñjaya, dessen Sohnesverlust und Trost durch Nārada den Rahmen der Ṣoḍaśarājakīya-Erzählung (Droṇaparva Kap.49) bildet; Sṛñjaya trägt daher gelegentlich das Patronymikon Śvaitya."},{"term":"Suvarṇaṣṭhīvin","category":"Person (Prinz)","definition":"'Der Goldspeiende' — Beiname des Sohnes des Königs Sṛñjaya, den dieser durch die Gunst der Brahmanen erhielt; seine Körperausscheidungen waren aus Gold. Wurde von Räubern wegen des Goldes entführt und getötet, in Droṇaparva Kap.49 (Ṣoḍaśarājakīya) von Nārada auf Sṛñjayas Bitte hin wieder zum Leben erweckt."},{"term":"Pṛthu Vainya","category":"Person (König)","definition":"Legendärer Urkönig, Sohn des Vena, erster geweihter Kṣatriya-Herrscher; unter seiner Herrschaft gab die Erde, als Kuh gemolken, jeder Wesengruppe ihre eigene 'Milch'. In Droṇaparva Kap.49 (Ṣoḍaśarājakīya) als 15. der sechzehn Könige genannt. Nicht zu verwechseln mit dem gleichnamigen Vasu-Gott Pṛthu (Anführer beim Raub von Vasiṣṭhas Kuh, Adh.93)."},{"term":"Citraratha","category":"Person (Gandharva)","definition":"König der Gandharven; in der 'Melken-der-Erde'-Allegorie in Droṇaparva Kap.49 (Ṣoḍaśarājakīya) das Kalb, mit dem die Gandharven und Apsaras wohlriechende Düfte aus der als Kuh gedachten Erde melken. Daneben (nicht zu verwechseln) in Kap.98 auch Name eines Pāñcāla-Prinzen, Bruder Vīraketus, der zusammen mit Citraketu, Sudhanvā und Citravarman Droṇa angreift, um Vīraketus Tod zu rächen, und dabei von Droṇa enthauptet wird."},{"term":"Acyuta","category":"Epitheton","definition":"'Der Unvergängliche/Nicht-Gefallene' - häufiger Beiname Kṛṣṇa-Vāsudevas."},{"term":"Saṃyamanī","category":"Ort","definition":"Yamas Stadt, die Residenz des Totengottes, Ziel der Frommen nach dem Tod; in Droṇaparva Kap.50 in Arjunas Klage um Abhimanyu erwähnt."},{"term":"Saindhava","category":"Volk/Adjektiv","definition":"Bewohner oder Angehöriger des Landes Sindhu — also von Jayadrathas eigenem Reich. In Kap.51 verwendet Arjuna den Begriff ironisch als Ziel seines Fluch-Schwurs (»den Zustand der Saindhavas werde ich erreichen, wenn ich Jayadratha nicht erschlage«) — ein Wortspiel, da Jayadratha selbst der König der Saindhavas ist. In Kap.120 von einer ganzen Reihe von Kaurava-Helden (Duryodhana, Karṇa, Kṛpa, Aśvatthāman, Śalya, Vṛṣasena) gemeinsam gegen Arjunas erneuten Ansturm verteidigt. In Kap.121 schließlich, nach Kṛṣṇas Finsternis-List, von Arjuna enthauptet."},{"term":"Devalaka","category":"Person/Kategorie","definition":"Ein Priester, der gegen Bezahlung Götterdienst (Bildkult) verrichtet und dadurch als unwürdig gilt, beim Ahnenopfer (Śrāddha) an der Speisereihe teilzunehmen; wer solche Priester bei einem Śrāddha bewirtet, gilt selbst als schuldig, die Reihe zu verderben (vgl. Droṇaparva Kap.51)."},{"term":"Saha","category":"Person","definition":"Ein Kaurava-Krieger, in der Liste der Jayadratha beschützenden Helden in Droṇaparva Kap.52 unter Vikarṇa und Durmukha genannt."},{"term":"Udāyudha","category":"Person","definition":"Ein Kaurava-Krieger, zusammen mit Kaliṅga in der Liste der Jayadratha beschützenden Helden in Droṇaparva Kap.52 genannt."},{"term":"Avanti","category":"Ort","definition":"Ein Reich in Zentralindien (um das heutige Ujjain); seine Fürsten Vinda und Anuvinda kämpfen auf Kaurava-Seite."},{"term":"Māyāvin","category":"Person","definition":"Ein Krieger (laut Kap.52 kraftvoll und heldenhaft), in der Liste der Jayadratha beschützenden Helden zusammen mit dem Rākṣasa Alambusa genannt."},{"term":"Meghapuṣpa","category":"Person/Tier","definition":"\"Wolkenblüte\" – einer der vier Rosse Kṛṣṇas, die seinen Wagen ziehen."},{"term":"Dhūmaketu","category":"Epitheton","definition":"\"Rauchbanner\" – Beiname des Feuer(-gottes) Agni."},{"term":"Śvetaparvata","category":"Ort","definition":"\"Weißer Berg\" – ein mythischer Berg im Norden, den Arjuna und Kṛṣṇa auf ihrer Himmelsreise erblicken."},{"term":"Brahmatuṅga","category":"Ort","definition":"Ein Berg im Himālaya-Gebiet, den Arjuna auf seiner Reise zu Śiva passiert."},{"term":"Suśṛṅga","category":"Ort","definition":"Ein Berg im Himālaya-Gebiet, den Arjuna auf seiner Himmelsreise erblickt."},{"term":"Vṛṣadaṃśa","category":"Ort","definition":"\"Herr der Berge\" – ein Berg, den Arjuna und Kṛṣṇa auf dem Weg zu Śiva passieren."},{"term":"Kālaparvata","category":"Ort","definition":"\"Schwarzer Berg\" – ein Berg von der Gestalt einer glänzenden Kollyrium-Masse, den Arjuna auf seiner Himmelsreise erreicht."},{"term":"Śambhu","category":"Epitheton","definition":"\"Der Heilbringende\" – Beiname Śivas."},{"term":"Kapardin","category":"Epitheton","definition":"\"Träger des Haarknotens\" – Beiname Śivas."},{"term":"Pināka","category":"Sache","definition":"Name von Śivas Bogen; als Beiname (\"Pināka-Träger\") auch für Śiva selbst gebraucht."},{"term":"Śatarudriya","category":"Sache","definition":"Vedischer Hymnus an die hundert Formen bzw. Namen Rudras (Śivas)."},{"term":"Pārvatī","category":"Person","definition":"Śivas Gattin, auch Ambikā genannt; wird in Kap. 57 an Śivas Seite geschildert."},{"term":"Bhava","category":"Epitheton","definition":"\"Das Werden/Entstehen\" – Beiname Śivas."},{"term":"Vaitālika","category":"Amt/Stand","definition":"Hofbarde, der morgens den König mit Lobpreisungen weckt."},{"term":"Saura","category":"Begriff","definition":"Sonnenverehrer bzw. -priester, hier unter den Brahmanen an Yudhiṣṭhiras Hof."},{"term":"Svastika","category":"Sache","definition":"Glückverheißendes Zeichen bzw. Gerät, bei feierlichen Zeremonien verwendet."},{"term":"Nandyāvarta","category":"Sache","definition":"Glückverheißendes spiralförmiges Zeichen bzw. Gefäß, bei feierlichen Zeremonien verwendet."},{"term":"Rocana","category":"Sache","definition":"Gelbes Pigment (Gorocana, aus Kuhgalle gewonnen), das bei glückverheißenden Zeremonien als Stirnzeichen verwendet wird."},{"term":"Rucaka","category":"Sache","definition":"Ein glückverheißendes Schmuckstück bzw. Ornament, bei feierlichen Zeremonien verwendet."},{"term":"Kāśya","category":"Person","definition":"\"Der von Kāśi\" – Beiname des Königs von Kāśi (Benares) bzw. Patronymikon für dessen Sohn, einen Krieger auf Seiten der Pāṇḍavas."},{"term":"Jalasaṃdha","category":"Person","definition":"Ein Fürst/großer Wagenkämpfer aus Magadha auf Kaurava-Seite, kämpft in Kap.63 unmittelbar neben dem Kāmboja-König Sudakṣiṇa und Duryodhana an der Spitze von Droṇas Wagen-Nadel-Formation zum Schutz Jayadrathas; in Kap.91 als Māgadha-Fürst auf seinem Kampfelefanten explizit vom (früher erwähnten) Jarāsaṃdha unterschieden, im ausgedehnten Duell von Sātyaki enthauptet/getötet. Nicht zu verwechseln mit dem gleichnamigen Magadha-König, den Kṛṣṇa in früheren Erzählungen tötet."},{"term":"Śūlapāṇi","category":"Epitheton","definition":"\"Der den Dreizack [Śūla] in der Hand Hält\" – Beiname Śivas, in Kap.64 als Vergleich für Arjuna gebraucht."},{"term":"Śrutāyudha","category":"Person","definition":"König, Sohn des Wassergottes Varuṇa und des Flusses Parṇāśā; erhielt von Varuṇa eine unbezwingbare Zaubergadā mit der Warnung, sie nie gegen einen nicht Kämpfenden einzusetzen. In Kap.67 missachtet er diese Warnung, schleudert sie auf den nicht kämpfenden Kṛṣṇa, und die zurückkehrende Keule tötet ihn selbst."},{"term":"Parṇāśā","category":"Sache","definition":"Ein großer, kühlwassriger Fluss, personifiziert als Gemahlin Varuṇas und Mutter Śrutāyudhas; bittet in Kap.67 Varuṇa, ihren Sohn unbezwingbar zu machen."},{"term":"Śrutāyu","category":"Person","definition":"Bruder des Acyutāyu; greift in Kap.68 gemeinsam mit ihm Arjuna an und verwundet ihn mit einem Wurfspieß, wird darauf jedoch von Arjunas Śākra-Astra getötet. Nicht zu verwechseln mit dem gleichnamigen König der Ambaṣṭhas."},{"term":"Acyutāyu","category":"Person","definition":"Bruder des Śrutāyu; greift in Kap.68 gemeinsam mit ihm Arjuna an und verwundet ihn mit einer Lanze, wird darauf von Arjunas Śākra-Astra getötet."},{"term":"Ayutāyu","category":"Person","definition":"Sohn des Śrutāyu oder Acyutāyu; rächt in Kap.68 zusammen mit Dīrghāyu den Tod seines Vaters an Arjuna und wird von ihm erschlagen."},{"term":"Dīrghāyu","category":"Person","definition":"Sohn des Śrutāyu oder Acyutāyu; rächt in Kap.68 zusammen mit Ayutāyu den Tod seines Vaters an Arjuna und wird von ihm erschlagen."},{"term":"Dhundhumāra","category":"Person","definition":"Legendärer König (\"Dhundhu-Töter\"), der den Dämon Dhundhu erschlug; in Kap.69 in Droṇas Segensformel als einer der königlichen Seher angeführt."},{"term":"Śoṇāśva","category":"Epitheton","definition":"\"Der mit rötlichen Rossen\" - Beiname Droṇas, mit dem Duryodhana ihn in Kap.69 anredet."},{"term":"Sahasena","category":"Person","definition":"Krieger auf Kaurava-Seite; hält in Kap.70 zusammen mit dem König der Bāhlīkas die Draupadeyas zurück."},{"term":"Govāsana","category":"Person","definition":"König der Śaibyas; hält in Kap.70 mit seinen Kriegern den Sohn des Bezwingers von Kāśī zurück."},{"term":"Alāyudha","category":"Person","definition":"Rākṣasa auf Kaurava-Seite; stellt sich in Kap.70 dem erzürnten Ghaṭotkaca in der Schlacht entgegen. In Kap.151 des Droṇaparva zieht er, der Rache für seine im Vanaparva von Bhīma erschlagenen Verwandten Baka, Kirmīra und Hiḍimba sinnt, mit großem Gefolge von Rākṣasas zu Duryodhana und erklärt, sowohl Bhīma als auch dessen Sohn Ghaṭotkaca (als 'Haiḍimba' bezeichnet) töten zu wollen; Duryodhana heißt ihn willkommen, und er stürmt, ähnlich prächtig gerüstet wie einst Ghaṭotkaca, auf Bhīma los. Im nächtlichen Kampf des Droṇaparva (Kap.152) lässt er von Ghaṭotkaca ab, um Bhīmasena selbst herauszufordern; im folgenden erbitterten Duell zerschlägt er dessen Bogen und tötet seine Pferde und seinen Wagenlenker, worauf sich beide ein Keulen- und Faustduell liefern, in dem sie einander blutig schlagen, bis Kṛṣṇa Ghaṭotkaca zum Schutz Bhīmasenas herbeiruft. Fällt in Kap.153 im Zweikampf gegen Ghaṭotkaca: nach einem wechselseitigen Illusionsduell (Steinregen, Blutregen) und einem erbitterten Nahkampf mit Baumstämmen, Felsbrocken und bloßen Fäusten wird er von Ghaṭotkaca gepackt, zu Boden geworfen und enthauptet; Ghaṭotkaca wirft sein Haupt vor Duryodhana, der darüber höchst bestürzt ist, da er zuvor selbst auf Alāyudhas Sieg über Bhīmasena gehofft hatte."},{"term":"Sālvaka","category":"Person","definition":"Name eines der beiden heldenhaften Avanti-Brüder, die in Kap.71 gegen Dhṛṣṭadyumna kämpfen; der Vergleich stellt sie (zusammen mit Bilvaka) in die Tradition uralter Asuras, die einst im Kṛta-Zeitalter gegen Viṣṇu kämpften."},{"term":"Bilvaka","category":"Person","definition":"Name des zweiten der beiden heldenhaften Avanti-Brüder, die in Kap.71 gegen Dhṛṣṭadyumna kämpfen; der Vergleich stellt ihn (zusammen mit Sālvaka) in die Tradition uralter Asuras, die einst im Kṛta-Zeitalter gegen Viṣṇu kämpften."},{"term":"Śālveya","category":"Volk/Heer","definition":"Die Heerscharen des Volkes/Reiches Śālva (unterschieden vom Personennamen Śālva selbst); kämpfen in Kap.73 gemeinsam mit den Matsyas auf Seiten der Pāṇḍavas."},{"term":"Śauri","category":"Epitheton","definition":"Beiname Kṛṣṇa-Vāsudevas nach seinem Großvater Śūra (Vasudevas Vater); wörtlich \"Nachkomme des Śūra\"."},{"term":"Puṣkarekṣaṇa","category":"Epitheton","definition":"\"Der Lotusäugige\" - Beiname Kṛṣṇa-Vāsudevas."},{"term":"Karṇikāra","category":"Sache","definition":"Ein Baum mit leuchtend gelben Blüten (Pterospermum acerifolium); im Epos gängiges Vergleichsbild, hier für die blutbedeckten Körper der beiden Kṛṣṇas, die wie mit Karṇikāra-Blüten übersäte Berge erstrahlen."},{"term":"Puṇḍarīkākṣa","category":"Epitheton","definition":"\"Der Lotusäugige\" (nach der weißen Lotusblüte puṇḍarīka) - Beiname Kṛṣṇa-Vāsudevas, zu unterscheiden vom gleichbedeutenden Puṣkarekṣaṇa (nach puṣkara, einer anderen Lotusart)."},{"term":"Māṇavāstra","category":"Waffe","definition":"Eine göttliche Waffe (\"Menschen-Waffe\"), die feine Rüstungen zu durchdringen vermag; Arjuna setzt sie in Kap.78 gegen Duryodhanas unzerstörbare Rüstung ein, doch Aśvatthāman zerschneidet die damit belegten Pfeile noch vor dem Abschuss mit einer alle Waffen bezwingenden Gegenwaffe. Arjuna erklärt, sie nicht zweimal einsetzen zu können."},{"term":"Kaulūtaka","category":"Volk/Ort","definition":"Bezeichnung für Pferde aus der Region Kulūta (im Himalaya-Vorland, etwa das heutige Kullu-Tal); in Kap.79 die bunten, schnellen Pferde der acht Kaurava-Wagenkämpfer, die Jayadratha schützen."},{"term":"Tripuraghna","category":"Epitheton","definition":"\"Zerstörer von Tripura\" - Beiname Śivas, der die drei Festungen der Asuras (Tripura) vernichtete; in Kap.80 als Vergleich für Kṛpas mit dem Stieremblem geschmückten Wagen herangezogen."},{"term":"Vīradhanvan","category":"Person (Nebenfigur)","definition":"Ein großer Bogenschütze auf Kaurava-Seite, der in Kap.81 dem heranstürmenden Dhṛṣṭaketu entgegentritt."},{"term":"Ārṣyaśṛṅgi","category":"Person (Nebenfigur)","definition":"Patronymikon \"Sohn des Ṛṣyaśṛṅga\"; ein Kaurava-Krieger von furchtbarer Gestalt, der in Kap.81 den zornigen Bhīmasena aufhält - ihr Duell wird mit dem Kampf zwischen Rāma und Rāvaṇa verglichen."},{"term":"Rāvaṇi","category":"Epitheton","definition":"Patronymikon \"Sohn des Rāvaṇa\" (Indrajit); in Kap.83 als Vergleichsfigur für Alambusas Kampf gegen Bhīmasena herangezogen (verglichen mit Rāvaṇis Kampf gegen Lakṣmaṇa)."},{"term":"Añjanaka","category":"Volk/Tier","definition":"Name eines Elefantengeschlechts ('aus dem Geschlecht Añjanas'), aus dem eine Truppe von tausend Kampfelefanten in Duryodhanas Heer stammt (Kap.87)."},{"term":"Dākṣiṇātya","category":"Volk","definition":"'Südländer' - Sammelbezeichnung für Truppen aus dem Süden des Subkontinents, kämpfend auf Kaurava-Seite, u.a. in der Nähe der Bāhlikas und Karṇas postiert (Kap.88)."},{"term":"Draupadeya","category":"Person/Gruppe","definition":"Sammelbezeichnung für die fünf Söhne Draupadīs von den fünf Pāṇḍava-Brüdern, die als Krieger auf Pāṇḍava-Seite kämpfen (Kap.90 u.ö.)."},{"term":"Taṃkaṇa","category":"Volk","definition":"Volk, in Kap.95 in einer rückblickenden Aufzählung unter den von Sātyaki im Kampf besiegten Völkern genannt."},{"term":"Tittira","category":"Volk","definition":"Volk, in Kap.95 zusammen mit den Yātudhānas in einer rückblickenden Aufzählung der von Sātyaki im Kampf besiegten Völker genannt."},{"term":"Barbara","category":"Volk","definition":"Fremdvolk (\"Barbaren\"), in Kap.95 unter den von Sātyaki bekämpften Mleccha-Truppen genannt."},{"term":"Tāmraliptaka","category":"Volk","definition":"Volk aus der Region um Tāmralipta (im heutigen Bengalen), in Kap.95 unter den von Sātyaki bekämpften Mleccha-Truppen genannt."},{"term":"Śabara","category":"Volk","definition":"Fremdvolk, in Kap.95 zusammen mit Kirātas und Barbaren unter den von Sātyaki bekämpften Mleccha-Truppen genannt."},{"term":"Kratha","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra, Bruder Duryodhanas; kämpft in Kap.96 zusammen mit Duryodhana, Citrasena, Duḥśāsana, Viviṃśati, Śakuni, Duḥsaha und Durmarṣaṇa bei der Verfolgung Sātyakis."},{"term":"Pārada","category":"Volk","definition":"Nordwestliches Volk/Krieger-Kontingent, in Kap.97 zusammen mit Śakas, Kāmbojas, Bāhlīkas und Yavanas unter Duryodhanas Truppen gegen Sātyaki."},{"term":"Taṅgaṇa","category":"Volk","definition":"Nordwestliches Bergvolk, in Kap.97 zusammen mit Kuṇindas, Ambaṣṭhas, Paiśācas und Samandaras unter den gegen Sātyaki anstürmenden Truppen."},{"term":"Paiśāca","category":"Volk","definition":"Volk/Kriegerschar (wörtlich mit den dämonischen Piśācas assoziiert), in Kap.97 unter den gegen Sātyaki anstürmenden Truppen genannt."},{"term":"Samandara","category":"Volk","definition":"Volk, in Kap.97 zusammen mit Kuṇindas, Taṅgaṇas, Ambaṣṭhas und Paiśācas unter den gegen Sātyaki anstürmenden Truppen."},{"term":"Khaśa","category":"Volk","definition":"Himalaya-Bergvolk, in Kap.97 unter den mit Steinen kämpfenden Bergbewohner-Truppen gegen Sātyaki genannt."},{"term":"Vīraketu","category":"Person","definition":"Glänzender Pāñcāla-Prinz, Sohn eines Pāñcāla-Königs; fordert Droṇa in Kap.98 im Duell mit dem Ruf 'Halt, halt!' heraus, verwundet ihn, wird aber von Droṇa erschossen."},{"term":"Sudhanvā","category":"Person","definition":"Pāñcāla-Prinz, einer der Brüder Vīraketus; greift in Kap.98 zusammen mit Citraketu, Citravarman und Citraratha Droṇa an, um den Tod Vīraketus zu rächen, wird jedoch von Droṇa enthauptet."},{"term":"Citravarman","category":"Person","definition":"Pāñcāla-Prinz, einer der Brüder Vīraketus; greift in Kap.98 zusammen mit Citraketu, Sudhanvā und Citraratha Droṇa an, um den Tod Vīraketus zu rächen, wird jedoch von Droṇa enthauptet."},{"term":"Kalaśottamasaṃbhava","category":"Epitheton","definition":"'Der aus dem besten Krug Entsprossene' - Beiname Droṇas, der auf seine mythische Geburt aus einem Gefäß (droṇa) zurückgeht, in das der Same seines Vaters Bharadvāja beim Anblick der Apsaras Ghṛtācī fiel."},{"term":"Jārāsaṃdhi","category":"Person","definition":"Patronymikon ('Sohn des Jarāsaṃdha') für einen namentlich nicht genannten Sohn des im Zweikampf von Bhīma erschlagenen Magadha-Königs Jarāsaṃdha; greift in Droṇaparva Kap.101 heldenhaft Droṇa an und wird von diesem vor den Augen aller Bogenschützen getötet."},{"term":"Duḥśala","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; umringt mit seinen Brüdern Bhīmasena in Droṇaparva Kap.102, als dieser zu Arjuna durchzubrechen versucht. In Kap.104 eilt er auf Duryodhanas Geheiß mit seinem Wagen Karṇa zu Hilfe (dessen eigener Wagen von Bhīma zerstört wurde), wird aber von Bhīma enthauptet, nachdem Karṇa bereits auf seinen Wagen umgestiegen war."},{"term":"Sumukha","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; umringt mit seinen Brüdern Bhīmasena in Droṇaparva Kap.102."},{"term":"Dīrghabāhu","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; umringt mit seinen Brüdern Bhīmasena in Droṇaparva Kap.102."},{"term":"Suhasta","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; umringt mit seinen Brüdern Bhīmasena in Droṇaparva Kap.102."},{"term":"Abhaya","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; umringt Bhīmasena in Droṇaparva Kap.102 und wird von ihm zusammen mit Raudrakarman und Durvimocana mit drei Pfeilen getötet."},{"term":"Raudrakarman","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; wird in Droṇaparva Kap.102 zusammen mit Abhaya und Durvimocana von Bhīmasena getötet."},{"term":"Suvarman","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; wird in Droṇaparva Kap.102 zusammen mit Vinda und Anuvinda von Bhīmasena getötet."},{"term":"Durvimocana","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; wird in Droṇaparva Kap.102 zusammen mit Abhaya und Raudrakarman von Bhīmasena getötet."},{"term":"Dīrghanetra","category":"Person","definition":"Ein Kaurava-Krieger; wird in Droṇaparva Kap.102 zusammen mit Kuṇḍabhedin und Suṣeṇa von Bhīmasena getötet."},{"term":"Ādhirathi","category":"Epitheton","definition":"Patronymisches Epitheton Karṇas, \"Sohn des Adhiratha\" (seines Ziehvaters, des Wagenlenkers); wird in Kap.106 anstelle seines Namens verwendet, als er Bhīma zum Zweikampf ruft."},{"term":"Brahmāstra","category":"Waffe","definition":"Die höchste, brahmanische Überwaffe; Karṇa erhielt sie laut Kap.106 von Paraśurāma (dem Besten der Bhṛgus), nachdem er sich ihm zuliebe der Waffenkunst gewidmet hatte - eine Vorausdeutung auf den später (in der Rāma-Paraśurāma-Episode) erzählten Fluch, durch den Karṇa das Mantra im entscheidenden Moment vergessen wird."},{"term":"Śarabha","category":"Mythisches Wesen","definition":"Ein achtbeiniges Fabelwesen von sprichwörtlicher Wildheit und Kraft, das Löwen und Elefanten überwältigen soll; wird in Kap.107 als Vergleich für den zornentbrannten Zweikampf zwischen Karṇa und Bhīma herangezogen."},{"term":"Durjaya (Sohn Dhṛtarāṣṭras)","category":"Person","definition":"Einer der hundert Söhne Dhṛtarāṣṭras; wird in Kap.108 von Duryodhana entsandt, dem bedrängten Karṇa gegen Bhīma beizustehen, greift Bhīmasena an, wird aber von diesem, an den Verwundbarkeitsstellen durchbohrt, getötet - Karṇa umkreist daraufhin weinend seinen gefallenen Leichnam. Nicht zu verwechseln mit dem gleichnamigen ältesten Sohn der Śāradaṇḍāyanī (siehe Eintrag 'Durjaya')."},{"term":"Durmada","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; stirbt in Kap.110 zusammen mit vier Brüdern (Durmarṣaṇa, Duḥsaha, Durdhara, Jaya) im Angriff auf den siegreichen Bhīma. In Kapitel 130 erscheint ein offenbar erneuter Bericht seines Todes: Zusammen mit seinem Bruder Duṣkarṇa auf einem Wagen kämpfend, wird er von Bhīmasena mit Faust und Fuß erschlagen. [Anm.: Dieser zweite Tod steht im Widerspruch zu dem bereits in Kap.110 berichteten Tod; die Ursache ist vermutlich die formelhafte Wiederverwendung von Namen unter den hundert Söhnen Dhṛtarāṣṭras in verschiedenen Kampfepisoden und wird hier unverändert aus der Quelle übernommen.]"},{"term":"Durdhara","category":"Person","definition":"Einer der hundert Söhne des Dhṛtarāṣṭra; stirbt in Kap.110 zusammen mit vier Brüdern (Durmarṣaṇa, Duḥsaha, Durmada, Jaya) im Angriff auf den siegreichen Bhīma."},{"term":"Vaḍavāmukha","category":"Konzept","definition":"Das 'Stutenmaul' - mythisches Unterwasserfeuer am Grund des Ozeans; in Kap.110 von Dhṛtarāṣṭra als Bild für einen noch entrinnbaren Gefahrenort verwendet, im Gegensatz zur unentrinnbaren Begegnung mit Bhīma."},{"term":"Citropacitra","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras; stirbt in Kap.111 zusammen mit fünf weiteren, bunt gerüsteten Brüdern (Citrākṣa, Cārucitra, Śarāsana, Citrāyudha, Citravarman) im Angriff auf den siegreichen Bhīma."},{"term":"Citrākṣa","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras; stirbt in Kap.111 zusammen mit fünf weiteren, bunt gerüsteten Brüdern (Citropacitra, Cārucitra, Śarāsana, Citrāyudha, Citravarman) im Angriff auf den siegreichen Bhīma."},{"term":"Cārucitra","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras; stirbt in Kap.111 zusammen mit fünf weiteren, bunt gerüsteten Brüdern (Citropacitra, Citrākṣa, Śarāsana, Citrāyudha, Citravarman) im Angriff auf den siegreichen Bhīma."},{"term":"Śarāsana","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras; stirbt in Kap.111 zusammen mit fünf weiteren, bunt gerüsteten Brüdern (Citropacitra, Citrākṣa, Cārucitra, Citrāyudha, Citravarman) im Angriff auf den siegreichen Bhīma."},{"term":"Citrāyudha (Sohn Dhṛtarāṣṭras)","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras, Namensvetter des gleichnamigen Pāṇḍava-seitigen Kriegers mit kiṃśuka-blütenfarbenen Pferden (Kap.22); stirbt in Kap.111 zusammen mit fünf weiteren, bunt gerüsteten Brüdern (Citropacitra, Citrākṣa, Cārucitra, Śarāsana, Citravarman) im Angriff auf den siegreichen Bhīma."},{"term":"Citravarman (Sohn Dhṛtarāṣṭras)","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras, Namensvetter des gleichnamigen Pāñcāla-Prinzen, der in Kap.98 von Droṇa enthauptet wird; stirbt in Kap.111 zusammen mit fünf weiteren, bunt gerüsteten Brüdern (Citropacitra, Citrākṣa, Cārucitra, Śarāsana, Citrāyudha) im Angriff auf den siegreichen Bhīma."},{"term":"Citra (Sohn Dhṛtarāṣṭras)","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras, Namensvetter des gleichnamigen Pāṇḍava-seitigen Kriegers mit juwelenbunter Rüstung (Kap.22); stirbt in Kap.112 im Angriff auf Bhīma zusammen mit sechs Brüdern, darunter Vikarṇa und Citrasena."},{"term":"Dṛḍha","category":"Person","definition":"Einer der Söhne Dhṛtarāṣṭras; stirbt in Kap.112 im Angriff auf Bhīma zusammen mit sechs Brüdern, darunter Vikarṇa und Citrasena."},{"term":"Satyajit (Kaurava-Verbündeter)","category":"Person","definition":"Ein König auf Kaurava-Seite (nicht identisch mit dem Pāñcāla-Prinzen Satyajit aus Droṇaparva Kap.16); versucht in Kap.114, den von Arjuna bedrängten Aśvatthāman zu retten, wird dabei aber von Arjuna mit einem einzigen Pfeil durchbohrt."},{"term":"Tūbaraka","category":"Sonstiges","definition":"Ein von Karṇa in Kap.114 als höhnischer Spottname für Bhīma verwendeter Ausdruck (sinngemäß \"Vielfraß\"/\"Fresser\"), Teil seiner ausgedehnten Verspottung Bhīmas als wagenlosem, waffenungeübtem Koch."},{"term":"Alambusa (König, Kap.115)","category":"Person","definition":"Ein \"trefflicher König\" (rājavaraḥ), der in Kap.115 im Zweikampf gegen Sātyaki fällt (enthauptet, nachdem zuvor seine Rosse und sein Wagenlenker getötet wurden). Von den anderen Trägern des Namens Alambusa/Alambuṣa in diesem Werk zu unterscheiden (dem Gandharva-König bzw. dem von Ghaṭotkaca in Kap.83f. getöteten Rākṣasa, sowie dem in Kap.59 ebenfalls als \"rājavara\" bezeichneten Alambuṣa, der dort Sātyaki bekämpft, aber nicht stirbt) - möglicherweise eine Textvariante oder Verwechslung mit letzterem, hier aber als eigener Auftritt belassen."},{"term":"Śibi (Krieger in Kap.130)","category":"Person","definition":"Mächtiger Krieger auf Pāṇḍava-Seite, der sich in Kapitel 130 während der Nachtschlacht zornentbrannt gegen Droṇa wendet; durchbohrt diesen mit dreißig Pfeilen und lässt lächelnd dessen Wagenlenker fallen, wird jedoch schließlich von Droṇa getötet, der ihm samt Helm den Kopf vom Rumpf trennt."},{"term":"Duṣkarṇa","category":"Person","definition":"Sohn Dhṛtarāṣṭras, kämpft in Kapitel 130 zusammen mit seinem Bruder Durmada auf einem gemeinsamen Wagen gegen Bhīmasena; wird schließlich von Bhīma mit Faust und Fuß erschlagen."},{"term":"Druma (Karṇas Bruder)","category":"Person","definition":"Bruder Karṇas, kämpft in Kapitel 130 gegen Bhīmasena und wird von diesem mit der Faust zermalmt, verglichen mit einem zerschmetterten Glasjuwel, das zu bloßem Blut wird."},{"term":"Jayarātha","category":"Person","definition":"Krieger auf Kaurava-Seite, wird in Kapitel 130 von Bhīmasena mit der linken Hand fortgeschleudert; sein Wagenlenker wird vor Karṇas Augen mit der flachen Hand getötet, danach werden beide von Bhīma an den Füßen gepackt und zu Tode geschleudert. [Anm.: Nicht zu verwechseln mit dem Sindhu-König Jayadratha, dessen Tötung in vorangehenden Kapiteln berichtet wird.]"},{"term":"Añjanaparvan","category":"Person","definition":"Sohn Ghaṭotkacas (und somit Enkel Bhīmas), ein Rākṣasa-Krieger. In Kap.131 tritt er, mit Illusionszauber kämpfend, gegen Aśvatthāman (Drauṇi) an und wird von diesem getötet - ein Ereignis, das mit der Tötung Andhakas durch Śiva verglichen wird."},{"term":"Drumasena","category":"Krieger","definition":"Krieger auf Kaurava-Seite; wird in Kap.145 im nächtlichen Kampf von Dhṛṣṭadyumna zunächst mit Pfeilen getroffen, ruft ihm dabei zweimal 'Bleib stehen!' zu, wird dann jedoch enthauptet. In einem nur teilweise bezeugten Apparatus-Einschub erscheint er unter der Namensvariante 'Dyumatsena' als soeben getötet - nicht zu verwechseln mit dem gleichnamigen, blind gewordenen König der Śālvas und Vater Satyavants aus der Sāvitrī-Erzählung."},{"t
