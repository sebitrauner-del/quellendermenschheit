teilwerden, um dessentwillen ich einen mir ergebenen Menschen verlassen müsste.“","",[["anāryam āryeṇa sahasranetra śakyaṃ kartuṃ duṣkaram etad ārya","Unedles durch einen Edlen zu tun, Tausendäugiger - das ist schwer zu vollbringen, Edler (Akk.+Instr.+Inf.+Vok.)"],["mā me śriyā saṃgamanaṃ tayā astu yasyāḥ kṛte bhaktajanaṃ tyajeyam","nicht soll mir die Vereinigung mit jenem Glück zuteilwerden, um dessentwillen ich einen mir ergebenen Menschen verlassen müsste (Inj.+Instr.+3.Sg.Opt.+Gen.+1.Sg.Opt.)"]]],["010","indra uvāca svarge loke śvavatāṃ nāsti dhiṣṇyam iṣṭāpūrtaṃ krodhavaśā haranti tato vicārya kriyatāṃ dharmarāja tyaja śvānaṃ nātra nṛśaṃsam asti","Indra sprach: „In der Welt des Himmels gibt es keinen Platz für Hundebesitzer; die dem Zorn Verfallenen rauben [dort] das Opfer- und Wohltätigkeitsverdienst. Bedenke dies daher, Rechtskönig, und handle danach; verlasse den Hund - darin liegt kein Mitleidsverstoß.“","[Anm.: iṣṭāpūrta = der Verdienst aus Opferhandlungen (iṣṭa) und aus gemeinnuetzigen Werken wie Brunnen- oder Teichbau (pūrta).]",[["svarge loke śvavatāṃ na asti dhiṣṇyam","in der Welt des Himmels gibt es keinen Platz für Hundebesitzer (Lok.+3.Sg.Präs.+Nom.)"],["iṣṭāpūrtaṃ krodhavaśā haranti","die dem Zorn Verfallenen rauben das Opfer- und Wohltätigkeitsverdienst (Akk.+Nom.Part.+3.Pl.Präs.)"],["tataḥ vicārya kriyatām dharmarāja tyaja śvānaṃ na atra nṛśaṃsam asti","bedenke dies daher, Rechtskönig, und handle danach; verlasse den Hund - darin liegt kein Mitleidsverstoß (Abs.+Imp.Pass.+Imp.)"]]],["011","yudhiṣṭhira uvāca bhaktatyāgaṃ prāhur atyantapāpaṃ tulyaṃ loke brahmavadhyākṛtena tasmān nāhaṃ jātu kathaṃ canādya tyakṣyāmy enaṃ svasukhārthī mahendra bhītaṃ bhaktaṃ nānyad astīti cārtaṃ prāptaṃ kṣīṇaṃ rakṣaṇe prāṇalipsum prāṇatyāgād apy ahaṃ nota moktuṃ yateyaṃ vai nityam etad vrataṃ me","Yudhiṣṭhira sprach: „Man sagt, die Verlassung eines Ergebenen sei eine äußerste Sünde, gleich der Tötung eines Brahmanen in der Welt; deshalb werde ich ihn heute auf keinen Fall verlassen, aus Verlangen nach eigenem Glück, großer Indra. Den Furchtsamen, den Ergebenen, für den es nichts anderes gibt, und den Bedrängten, den Schutzsuchenden, den Erschöpften, der nach Rettung seines Lebens verlangt - selbst um den Preis der Aufgabe meines eigenen Lebens werde ich ihn nicht preisgeben; dies ist stets mein Gelübde.“","",[["bhaktatyāgaṃ prāhuḥ atyantapāpaṃ tulyaṃ loke brahmavadhyākṛtena","man sagt, die Verlassung eines Ergebenen sei eine äußerste Sünde, gleich der Tötung eines Brahmanen in der Welt (Akk.+3.Pl.Perf.+Instr.)"],["tasmāt na aham jātu kathaṃ cana adya tyakṣyāmi enaṃ svasukhārthī mahendra","deshalb werde ich ihn heute auf keinen Fall verlassen, aus Verlangen nach eigenem Glück, großer Indra (1.Sg.Fut.+Nom.Part.+Vok.)"],["bhītaṃ bhaktaṃ na anyat asti iti ca ārtaṃ prāptaṃ kṣīṇaṃ rakṣaṇe prāṇalipsum","den Furchtsamen, den Ergebenen, für den es nichts anderes gibt, und den Bedrängten, den Schutzsuchenden, den Erschöpften, der nach Rettung seines Lebens verlangt (Akk.Part.)"],["prāṇatyāgāt api aham na uta moktuṃ yateyam vai nityam etad vrataṃ me","selbst um den Preis der Aufgabe meines eigenen Lebens werde ich ihn nicht preisgeben; dies ist stets mein Gelübde (Abl.+1.Sg.Opt.+Inf.+Nom.)"]]],["012","indra uvāca śunā dṛṣṭaṃ krodhavaśā haranti yad dattam iṣṭaṃ vivṛtam atho hutaṃ ca tasmāc chunas tyāgam imaṃ kuruṣva śunas tyāgāt prāpsyase devalokam","Indra sprach: „Was vom Hund gesehen wird, das rauben die dem Zorn Verfallenen - sei es Gegebenes, Geopfertes, Offenbartes oder Dargebrachtes. Deshalb vollziehe diese Verlassung des Hundes; durch die Verlassung des Hundes wirst du die Götterwelt erlangen.","",[["śunā dṛṣṭaṃ krodhavaśā haranti","was vom Hund gesehen wird, das rauben die dem Zorn Verfallenen (Instr.+Akk.Part.+Nom.Part.+3.Pl.Präs.)"],["yad dattam iṣṭaṃ vivṛtam atho hutaṃ ca","sei es Gegebenes, Geopfertes, Offenbartes oder Dargebrachtes (Akk.Part.)"],["tasmāt śunaḥ tyāgam imaṃ kuruṣva śunaḥ tyāgāt prāpsyase devalokam","deshalb vollziehe diese Verlassung des Hundes; durch die Verlassung des Hundes wirst du die Götterwelt erlangen (Gen.+Imp.Med.+Abl.+2.Sg.Fut.Med.)"]]],["013","tyaktvā bhrātṝn dayitāṃ cāpi kṛṣṇāṃ prāpto lokaḥ karmaṇā svena vīra śvānaṃ cainaṃ na tyajase kathaṃ nu tyāgaṃ kṛtsnaṃ cāsthito muhyase 'dya","Nachdem du die Brüder verlassen hast und auch die geliebte Kṛṣṇā, hast du diese Welt durch deine eigene Tat erlangt, Held; warum verlässt du denn diesen Hund nicht? Du hast schon die vollständige Entsagung auf dich genommen und bist heute [dabei] verwirrt.“","",[["tyaktvā bhrātṝn dayitāṃ ca api kṛṣṇāṃ prāptaḥ lokaḥ karmaṇā svena vīra","nachdem du die Brüder und auch die geliebte Kṛṣṇā verlassen hast, hast du diese Welt durch deine eigene Tat erlangt, Held (Abs.+Nom.Part.+Instr.+Vok.)"],["śvānaṃ ca enaṃ na tyajase kathaṃ nu","warum verlässt du denn diesen Hund nicht (Akk.+2.Sg.Präs.Med.)"],["tyāgaṃ kṛtsnaṃ ca āsthitaḥ muhyase adya","du hast schon die vollständige Entsagung auf dich genommen und bist heute verwirrt (Akk.+Nom.Part.+2.Sg.Präs.Med.)"]]],["014","yudhiṣṭhira uvāca na vidyate saṃdhir athāpi vigraho mṛtair martyair iti lokeṣu niṣṭhā na te mayā jīvayituṃ hi śakyā tasmāt tyāgas teṣu kṛto na jīvatām","Yudhiṣṭhira sprach: „Mit den Toten gibt es weder Bündnis noch Streit - das ist die feste Gewissheit der Sterblichen in den Welten; sie konnten von mir nicht wieder lebendig gemacht werden, deshalb geschah die Trennung von ihnen, den nicht mehr Lebenden.","",[["na vidyate saṃdhiḥ atha api vigrahaḥ mṛtaiḥ martyaiḥ iti lokeṣu niṣṭhā","mit den Toten gibt es weder Bündnis noch Streit - das ist die feste Gewissheit der Sterblichen in den Welten (3.Sg.Präs.Pass.+Nom.+Instr.+Lok.+Nom.)"],["na te mayā jīvayituṃ hi śakyāḥ tasmāt tyāgaḥ teṣu kṛtaḥ na jīvatām","sie konnten von mir nicht wieder lebendig gemacht werden, deshalb geschah die Trennung von ihnen, den nicht mehr Lebenden (Instr.+Inf.+Nom.Part.+Nom.Part.+Gen.Part.)"]]],["015","pratipradānaṃ śaraṇāgatasya striyā vadho brāhmaṇasvāpahāraḥ mitradrohas tāni catvāri śakra bhaktatyāgaś caiva samo mato me","Die Auslieferung eines Schutzsuchenden, die Tötung einer Frau, der Raub des Eigentums eines Brahmanen, der Verrat an einem Freund - diese vier, Śakra, und ebenso die Verlassung eines Ergebenen gelten mir als gleich [schwerwiegend].“","",[["pratipradānaṃ śaraṇāgatasya striyā vadhaḥ brāhmaṇasvāpahāraḥ","die Auslieferung eines Schutzsuchenden, die Tötung einer Frau, der Raub des Eigentums eines Brahmanen (Nom.+Gen.)"],["mitradrohaḥ tāni catvāri śakra bhaktatyāgaḥ ca eva samaḥ mataḥ me","der Verrat an einem Freund - diese vier, Śakra, und ebenso die Verlassung eines Ergebenen gelten mir als gleich (Nom.+Vok.+Nom.Part.)"]]],["016","vaiśaṃpāyana uvāca tad dharmarājasya vaco niśamya dharmasvarūpī bhagavān uvāca yudhiṣṭhiraṃ prītiyukto narendraṃ ślakṣṇair vākyaiḥ saṃstavasaṃprayuktaiḥ","Vaiśaṃpāyana sprach: Als er diese Worte des Rechtskönigs vernommen hatte, sprach der Erhabene, der die Gestalt des Dharma selbst trug, voller Zuneigung zu dem Herrscher Yudhiṣṭhira mit sanften, lobenden Worten:","[Anm.: Hier enthuellt sich der Hund als der Gott Dharma selbst, Yudhiṣṭhiras goettlicher Vater, der ihn auf die Probe gestellt hatte.]",[["tad dharmarājasya vacaḥ niśamya","als er diese Worte des Rechtskönigs vernommen hatte (Abs.)"],["dharmasvarūpī bhagavān uvāca yudhiṣṭhiraṃ prītiyuktaḥ narendram","sprach der Erhabene, der die Gestalt des Dharma trug, voller Zuneigung, zum Herrscher Yudhiṣṭhira (Nom.+3.Sg.Perf.+Nom.Part.)"],["ślakṣṇaiḥ vākyaiḥ saṃstavasaṃprayuktaiḥ","mit sanften, lobenden Worten (Instr.)"]]],["017","abhijāto 'si rājendra pitur vṛttena medhayā anukrośena cānena sarvabhūteṣu bhārata","„Du bist wahrhaft geboren, Herrscher der Könige, durch das Verhalten deines Vaters, durch Weisheit und durch dieses Mitleid gegenüber allen Wesen, Bhārata.","",[["abhijātaḥ asi rājendra pituḥ vṛttena medhayā","du bist wahrhaft geboren, Herrscher der Könige, durch das Verhalten deines Vaters, durch Weisheit (Nom.Part.+2.Sg.Präs.+Instr.)"],["anukrośena ca anena sarvabhūteṣu bhārata","und durch dieses Mitleid gegenüber allen Wesen, Bhārata (Instr.+Lok.+Vok.)"]]],["018","purā dvaitavane cāsi mayā putra parīkṣitaḥ pānīyārthe parākrāntā yatra te bhrātaro hatāḥ","Einst wurdest du von mir im Dvaitavana geprüft, mein Sohn, dort, wo deine nach Wasser strebenden Brüder getötet wurden.","[Anm.: Bezug auf die Yakṣa-Praśna-Episode im Vanaparva, wo Yudhiṣṭhiras Bruedern nacheinander beim Versuch, Wasser zu holen, der Tod widerfuhr, bis er selbst die Fragen des Yakṣa (in Wahrheit seines Vaters Dharma) richtig beantwortete.]",[["purā dvaitavane ca asi mayā putra parīkṣitaḥ","einst wurdest du von mir im Dvaitavana geprüft, mein Sohn (Lok.+2.Sg.Präs.+Instr.+Nom.Part.)"],["pānīyārthe parākrāntāḥ yatra te bhrātaraḥ hatāḥ","dort, wo deine nach Wasser strebenden Brüder getötet wurden (Lok.+Nom.Part.+Nom.Part.)"]]],["019","bhīmārjunau parityajya yatra tvaṃ bhrātarāv ubhau mātroḥ sāmyam abhīpsan vai nakulaṃ jīvam icchasi","Wo du, Bhīma und Arjuna, beide Brüder, beiseite lassend, aus Wunsch nach Gleichheit zwischen den beiden Müttern, das Leben des Nakula erbatest.","",[["bhīmārjunau parityajya yatra tvaṃ bhrātarau ubhau","wo du, Bhīma und Arjuna, beide Brüder, beiseite lassend (Abs.+Akk.)"],["mātroḥ sāmyam abhīpsan vai nakulaṃ jīvam icchasi","aus Wunsch nach Gleichheit zwischen den beiden Müttern, das Leben des Nakula erbatest (Gen.+Nom.Part.+Akk.+2.Sg.Präs.)"]]],["020","ayaṃ śvā bhakta ity eva tyakto devarathas tvayā tasmāt svarge na te tulyaḥ kaś cid asti narādhipa","‚Dieser Hund ist mir ergeben‘ - so [dachtest du], und hast deswegen den Götterwagen zurückgewiesen; daher gibt es im Himmel niemanden, der dir gleich ist, Herrscher der Menschen.","",[["ayaṃ śvā bhaktaḥ iti eva tyaktaḥ devarathaḥ tvayā","„dieser Hund ist ergeben“ - so, deswegen hast du den Götterwagen zurückgewiesen (direkte Rede+Nom.Part.+Instr.)"],["tasmāt svarge na te tulyaḥ kaḥ cit asti narādhipa","daher gibt es im Himmel niemanden, der dir gleich ist, Herrscher der Menschen (Lok.+Nom.+3.Sg.Präs.+Vok.)"]]],["021","atas tavākṣayā lokāḥ svaśarīreṇa bhārata prāpto 'si bharataśreṣṭha divyāṃ gatim anuttamām","Deshalb sind dir unvergängliche Welten [beschieden]; mit eigenem Körper, Bhārata, hast du den unübertrefflichen himmlischen Weg erlangt, Bester der Bharatas.“","[Anm.: Yudhiṣṭhira gilt als einziger Pāṇḍava, der mit seinem eigenen, sterblichen Koerper (nicht erst nach dem Tod) den Himmel erreicht.]",[["ataḥ tava akṣayāḥ lokāḥ svaśarīreṇa bhārata","deshalb sind dir unvergängliche Welten [beschieden], mit eigenem Körper, Bhārata (Nom.+Instr.+Vok.)"],["prāptaḥ asi bharataśreṣṭha divyāṃ gatim anuttamām","hast du den unübertrefflichen himmlischen Weg erlangt, Bester der Bharatas (Nom.Part.+2.Sg.Präs.+Akk.+Vok.)"]]],["022","tato dharmaś ca śakraś ca marutaś cāśvināv api devā devarṣayaś caiva ratham āropya pāṇḍavam","Dann ließen Dharma und Śakra, die Maruts und auch die beiden Aśvins, die Götter und die Götterweisen den Pāṇḍava den Wagen besteigen,","",[["tataḥ dharmaḥ ca śakraḥ ca marutaḥ ca aśvinau api","dann Dharma und Śakra, die Maruts und auch die beiden Aśvins (Nom.)"],["devāḥ devarṣayaḥ ca eva ratham āropya pāṇḍavam","die Götter und die Götterweisen ließen den Pāṇḍava den Wagen besteigen (Nom.+Caus.Abs.+Akk.)"]]],["023","prayayuḥ svair vimānais te siddhāḥ kāmavihāriṇaḥ sarve virajasaḥ puṇyāḥ puṇyavāgbuddhikarmiṇaḥ","und zogen fort, jene Vollendeten, die nach Belieben umherwandeln, mit ihren eigenen Flugwagen - alle staublos, heilig, von reiner Rede, reinem Denken und reinem Handeln.","",[["prayayuḥ svaiḥ vimānaiḥ te siddhāḥ kāmavihāriṇaḥ","und zogen fort mit ihren eigenen Flugwagen, jene Vollendeten, die nach Belieben umherwandeln (3.Pl.Perf.+Instr.+Nom.Part.)"],["sarve virajasaḥ puṇyāḥ puṇyavāgbuddhikarmiṇaḥ","alle staublos, heilig, von reiner Rede, reinem Denken und reinem Handeln (Nom.Part.)"]]],["024","sa taṃ rathaṃ samāsthāya rājā kurukulodvahaḥ ūrdhvam ācakrame śīghraṃ tejasāvṛtya rodasī","Er, der König, der Träger des Kuru-Geschlechts, jenen Wagen besteigend, stieg rasch nach oben, Himmel und Erde mit seinem Glanz umhüllend.","",[["sa taṃ rathaṃ samāsthāya rājā kurukulodvahaḥ","er, der König, der Träger des Kuru-Geschlechts, jenen Wagen besteigend (Abs.+Nom.)"],["ūrdhvam ācakrame śīghraṃ tejasā āvṛtya rodasī","stieg rasch nach oben, Himmel und Erde mit seinem Glanz umhüllend (3.Sg.Perf.Med.+Instr.+Abs.+Akk.Dual)"]]],["025","tato devanikāyastho nāradaḥ sarvalokavit uvācoccais tadā vākyaṃ bṛhadvādī bṛhattapāḥ","Dann sprach Nārada, der in der Götterschar weilte, der Alleswissende, der Redegewaltige, von großer Askese, da mit lauter Stimme dieses Wort:","",[["tataḥ devanikāyasthaḥ nāradaḥ sarvalokavit","dann Nārada, der in der Götterschar weilte, der Alleswissende (Nom.Part.+Nom.)"],["uvāca uccaiḥ tadā vākyaṃ bṛhadvādī bṛhattapāḥ","sprach da mit lauter Stimme dieses Wort, der Redegewaltige, von großer Askese (3.Sg.Perf.+Adv.+Akk.+Nom.)"]]],["026","ye 'pi rājarṣayaḥ sarve te cāpi samupasthitāḥ kīrtiṃ pracchādya teṣāṃ vai kururājo 'dhitiṣṭhati","„Selbst alle jene königlichen Weisen, die hier versammelt sind - ihren Ruhm überstrahlend, steht der König der Kurus über ihnen.","",[["ye api rājarṣayaḥ sarve te ca api samupasthitāḥ","selbst alle jene königlichen Weisen, die hier versammelt sind (Nom.Part.)"],["kīrtiṃ pracchādya teṣāṃ vai kururājaḥ adhitiṣṭhati","ihren Ruhm überstrahlend, steht der König der Kurus über ihnen (Abs.+Gen.+Nom.+3.Sg.Präs.)"]]],["027","lokān āvṛtya yaśasā tejasā vṛttasaṃpadā svaśarīreṇa saṃprāptaṃ nānyaṃ śuśruma pāṇḍavāt tejāṃsi yāni dṛṣṭāni bhūmiṣṭhena tvayā vibho veśmāni karmadevānāṃ paśyāmūni sahasraśaḥ","Die Welten mit Ruhm, Glanz und dem Reichtum seines Wandels überstrahlend, ist er mit eigenem Körper hier angekommen - von keinem anderen als diesem Pāṇḍava haben wir solches gehört. Die Lichtglanzstätten, die du, als du noch auf der Erde weiltest, gesehen hast, Erhabener - sieh diese Wohnstätten der durch Verdienst zu Göttern gewordenen Menschen, zu Tausenden.“","",[["lokān āvṛtya yaśasā tejasā vṛttasaṃpadā","die Welten mit Ruhm, Glanz und dem Reichtum seines Wandels überstrahlend (Abs.+Akk.+Instr.)"],["svaśarīreṇa saṃprāptaṃ na anyaṃ śuśruma pāṇḍavāt","mit eigenem Körper angekommen - von keinem anderen als diesem Pāṇḍava haben wir solches gehört (Instr.+Nom.Part.+Abl.+1.Pl.Perf.)"],["tejāṃsi yāni dṛṣṭāni bhūmiṣṭhena tvayā vibho","die Lichtglanzstätten, die du, als du noch auf der Erde weiltest, gesehen hast, Erhabener (Akk.+Akk.Part.+Instr.+Vok.)"],["veśmāni karmadevānāṃ paśya amūni sahasraśaḥ","sieh diese Wohnstätten der durch Verdienst zu Göttern gewordenen Menschen, zu Tausenden (Akk.+Gen.+Imp.+Adv.)"]]],["028","nāradasya vacaḥ śrutvā rājā vacanam abravīt devān āmantrya dharmātmā svapakṣāṃś caiva pārthivān","Nāradas Worte vernehmend, sprach der König, der Rechtschaffene, die Götter anredend und auch die Könige seiner eigenen Partei, dieses Wort:","",[["nāradasya vacaḥ śrutvā rājā vacanam abravīt","Nāradas Worte vernehmend, sprach der König dieses Wort (Abs.+Nom.+3.Sg.Impf.)"],["devān āmantrya dharmātmā svapakṣān ca eva pārthivān","die Götter anredend, der Rechtschaffene, und auch die Könige seiner eigenen Partei (Abs.+Akk.)"]]],["029","śubhaṃ vā yadi vā pāpaṃ bhrātṝṇāṃ sthānam adya me tad eva prāptum icchāmi lokān anyān na kāmaye","„Sei es heilvoll oder sei es unheilvoll, der Ort meiner Brüder - genau dorthin wünsche ich heute zu gelangen; andere Welten begehre ich nicht.“","",[["śubhaṃ vā yadi vā pāpaṃ bhrātṝṇāṃ sthānam adya me","sei es heilvoll oder sei es unheilvoll, der Ort meiner Brüder heute (Akk.+Gen.+Nom.)"],["tad eva prāptum icchāmi lokān anyān na kāmaye","genau dorthin wünsche ich zu gelangen; andere Welten begehre ich nicht (Inf.+1.Sg.Präs.+Akk.+1.Sg.Präs.Med.)"]]],["030","rājñas tu vacanaṃ śrutvā devarājaḥ puraṃdaraḥ ānṛśaṃsyasamāyuktaṃ pratyuvāca yudhiṣṭhiram","Als er aber die Worte des Königs vernommen hatte, erwiderte der Götterkönig Puraṃdara, von Mitleid erfüllt, dem Yudhiṣṭhira:","",[["rājñaḥ tu vacanaṃ śrutvā devarājaḥ puraṃdaraḥ","als er aber die Worte des Königs vernommen hatte, der Götterkönig Puraṃdara (Abs.+Gen.+Nom.)"],["ānṛśaṃsyasamāyuktaṃ pratyuvāca yudhiṣṭhiram","von Mitleid erfüllt, erwiderte er dem Yudhiṣṭhira (Nom.Part.+3.Sg.Perf.+Akk.)"]]],["031","sthāne 'smin vasa rājendra karmabhir nirjite śubhaiḥ kiṃ tvaṃ mānuṣyakaṃ sneham adyāpi parikarṣasi","„Weile an diesem Ort, Herrscher der Könige, der durch heilvolle Taten errungen wurde; warum trägst du noch heute die menschliche Zuneigung mit dir herum?","",[["sthāne asmin vasa rājendra karmabhiḥ nirjite śubhaiḥ","weile an diesem Ort, Herrscher der Könige, der durch heilvolle Taten errungen wurde (Lok.+Imp.+Vok.+Instr.+Lok.Part.)"],["kiṃ tvaṃ mānuṣyakaṃ sneham adya api parikarṣasi","warum trägst du noch heute die menschliche Zuneigung mit dir herum (Akk.+2.Sg.Präs.)"]]],["032","siddhiṃ prāpto 'si paramāṃ yathā nānyaḥ pumān kva cit naiva te bhrātaraḥ sthānaṃ saṃprāptāḥ kurunandana","Du hast die höchste Vollendung erlangt, wie sonst kein Mensch irgendwo; nicht einmal deine Brüder haben diesen Ort erreicht, Freude der Kurus.","",[["siddhiṃ prāptaḥ asi paramāṃ yathā na anyaḥ pumān kva cit","du hast die höchste Vollendung erlangt, wie sonst kein Mensch irgendwo (Akk.+Nom.Part.+2.Sg.Präs.+Nom.)"],["na eva te bhrātaraḥ sthānaṃ saṃprāptāḥ kurunandana","nicht einmal deine Brüder haben diesen Ort erreicht, Freude der Kurus (Nom.+Akk.+Nom.Part.+Vok.)"]]],["033","adyāpi mānuṣo bhāvaḥ spṛśate tvāṃ narādhipa svargo 'yaṃ paśya devarṣīn siddhāṃś ca tridivālayān","Noch heute berührt dich die menschliche Beschaffenheit, Herrscher der Menschen; dies ist der Himmel - sieh die Götterweisen und die Vollendeten, die Bewohner des dritten Himmels.“","",[["adya api mānuṣaḥ bhāvaḥ spṛśate tvāṃ narādhipa","noch heute berührt dich die menschliche Beschaffenheit, Herrscher der Menschen (Nom.+3.Sg.Präs.Med.+Akk.+Vok.)"],["svargaḥ ayaṃ paśya devarṣīn siddhān ca tridivālayān","dies ist der Himmel - sieh die Götterweisen und die Vollendeten, die Bewohner des dritten Himmels (Nom.+Imp.+Akk.)"]]],["034","yudhiṣṭhiras tu devendram evaṃvādinam īśvaram punar evābravīd dhīmān idaṃ vacanam arthavat","Yudhiṣṭhira aber, der Weise, sprach wiederum zu dem so redenden Herrscher, dem Götterkönig, dieses bedeutsame Wort:","",[["yudhiṣṭhiraḥ tu devendram evaṃvādinam īśvaram","Yudhiṣṭhira aber zu dem so redenden Herrscher, dem Götterkönig (Nom.+Akk.)"],["punaḥ eva abravīt dhīmān idaṃ vacanam arthavat","sprach wiederum, der Weise, dieses bedeutsame Wort (3.Sg.Impf.+Nom.+Akk.)"]]],["035","tair vinā notsahe vastum iha daityanibarhaṇa gantum icchāmi tatrāhaṃ yatra me bhrātaro gatāḥ","„Ohne sie vermag ich nicht, hier zu weilen, Bezwinger der Daityas; dorthin wünsche ich zu gehen, wohin meine Brüder gegangen sind.","",[["taiḥ vinā na utsahe vastum iha daityanibarhaṇa","ohne sie vermag ich nicht, hier zu weilen, Bezwinger der Daityas (Instr.+1.Sg.Präs.Med.+Inf.+Vok.)"],["gantum icchāmi tatra aham yatra me bhrātaraḥ gatāḥ","dorthin wünsche ich zu gehen, wohin meine Brüder gegangen sind (Inf.+1.Sg.Präs.+Nom.Part.)"]]],["036","yatra sā bṛhatī śyāmā buddhisattvaguṇānvitā draupadī yoṣitāṃ śreṣṭhā yatra caiva priyā mama","Wohin jene Große, Dunkle, mit den Eigenschaften von Weisheit und Wesensgüte begabte, Draupadī, die Beste der Frauen, gegangen ist - dorthin, wohin auch sie, die mir lieb ist.“","[Anm.: Ende des Kapitels und zugleich des Mahāprasthānikaparva; Fortsetzung in Buch 18, Svargārohaṇaparva.]",[["yatra sā bṛhatī śyāmā buddhisattvaguṇānvitā","wohin jene Große, Dunkle, mit den Eigenschaften von Weisheit und Wesensgüte begabte (Nom.)"],["draupadī yoṣitāṃ śreṣṭhā yatra ca eva priyā mama","Draupadī, die Beste der Frauen, gegangen ist - dorthin, wohin auch sie, die mir lieb ist (Nom.)"]]]]}]},{"key":"svargarohana","name":"Svargārohaṇaparva","desc":"Das Buch des Aufstiegs zum Himmel: Yudhiṣṭhiras Prüfung und der Aufstieg zum Himmel.","chapters":[{"num":1,"title_sa":"","title_de":"Duryodhana im Himmel und die Frage nach den Helden","note":"","units":[["001","janamejaya uvāca svargaṃ triviṣṭapaṃ prāpya mama pūrvapitāmahāḥ pāṇḍavā dhārtarāṣṭrāś ca kāni sthānāni bhejire","Janamejaya sprach: Nachdem meine Vorväter, die Pāṇḍavas und die Söhne Dhṛtarāṣṭras, den Himmel, den dritten Himmel, erreicht hatten - welche Orte erhielten sie dort?","",[["janamejayaḥ uvāca","Janamejaya sprach (3.Sg.Perf.)"],["svargaṃ triviṣṭapaṃ prāpya mama pūrvapitāmahāḥ","nachdem meine Vorväter den Himmel, den dritten Himmel, erreicht hatten (Akk.+Abs.+Nom.)"],["pāṇḍavāḥ dhārtarāṣṭrāḥ ca kāni sthānāni bhejire","die Pāṇḍavas und die Söhne Dhṛtarāṣṭras - welche Orte erhielten sie (Nom.+Akk.+3.Pl.Perf.Med.)"]]],["002","etad icchāmy ahaṃ śrotuṃ sarvavic cāsi me mataḥ maharṣiṇābhyanujñāto vyāsenādbhutakarmaṇā","Dies möchte ich hören; als allwissend giltst du mir, von dem großen Weisen Vyāsa, dem Wundertäter, dazu ermächtigt.","",[["etat icchāmi aham śrotuṃ sarvavit ca asi me mataḥ","dies möchte ich hören; als allwissend giltst du mir (Akk.+1.Sg.Präs.+Inf.+Nom.+2.Sg.Präs.+Nom.Part.)"],["maharṣiṇā abhyanujñātaḥ vyāsena adbhutakarmaṇā","von dem großen Weisen Vyāsa, dem Wundertäter, dazu ermächtigt (Instr.+Nom.Part.)"]]],["003","vaiśaṃpāyana uvāca svargaṃ triviṣṭapaṃ prāpya tava pūrvapitāmahāḥ yudhiṣṭhiraprabhṛtayo yad akurvata tac chṛṇu","Vaiśaṃpāyana sprach: Höre, was deine Vorväter, angeführt von Yudhiṣṭhira, taten, nachdem sie den Himmel, den dritten Himmel, erreicht hatten.","",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana sprach (3.Sg.Perf.)"],["svargaṃ triviṣṭapaṃ prāpya tava pūrvapitāmahāḥ","nachdem deine Vorväter den Himmel, den dritten Himmel, erreicht hatten (Akk.+Abs.+Nom.)"],["yudhiṣṭhiraprabhṛtayaḥ yat akurvata tat śṛṇu","angeführt von Yudhiṣṭhira - was sie taten, das höre (Nom.+Akk.+3.Pl.Impf.Med.+Imp.)"]]],["004","svargaṃ triviṣṭapaṃ prāpya dharmarājo yudhiṣṭhiraḥ duryodhanaṃ śriyā juṣṭaṃ dadarśāsīnam āsane","Nachdem er den Himmel, den dritten Himmel, erreicht hatte, sah der Rechtskönig Yudhiṣṭhira den Duryodhana, mit Glanz versehen, auf einem Sitz thronend,","",[["svargaṃ triviṣṭapaṃ prāpya dharmarājaḥ yudhiṣṭhiraḥ","nachdem er den Himmel, den dritten Himmel, erreicht hatte, der Rechtskönig Yudhiṣṭhira (Akk.+Abs.+Nom.)"],["duryodhanaṃ śriyā juṣṭaṃ dadarśa āsīnam āsane","sah den Duryodhana, mit Glanz versehen, auf einem Sitz thronend (Akk.+Instr.+Akk.Part.+3.Sg.Perf.+Lok.)"]]],["005","bhrājamānam ivādityaṃ vīralakṣmyābhisaṃvṛtam devair bhrājiṣṇubhiḥ sādhyaiḥ sahitaṃ puṇyakarmabhiḥ","leuchtend wie die strahlende Sonne, von Heldenglanz umgeben, zusammen mit den leuchtenden Göttern, den Sādhyas, den Wesen frommer Tat.","",[["bhrājamānam iva ādityaṃ vīralakṣmyā abhisaṃvṛtam","leuchtend wie die strahlende Sonne, von Heldenglanz umgeben (Akk.Part.+Akk.+Instr.+Akk.Part.)"],["devaiḥ bhrājiṣṇubhiḥ sādhyaiḥ sahitaṃ puṇyakarmabhiḥ","zusammen mit den leuchtenden Göttern, den Sādhyas, den Wesen frommer Tat (Instr.+Akk.Part.)"]]],["006","tato yudhiṣṭhiro dṛṣṭvā duryodhanam amarṣitaḥ sahasā saṃnivṛtto 'bhūc chriyaṃ dṛṣṭvā suyodhane","Da wandte sich Yudhiṣṭhira, Duryodhana erblickend, erzürnt, jäh ab, als er den Glanz in Suyodhana [Duryodhana] sah.","[Anm.: Suyodhana = alternativer, urspruenglich wohlwollend gemeinter Name Duryodhanas.]",[["tataḥ yudhiṣṭhiraḥ dṛṣṭvā duryodhanam amarṣitaḥ","da, Yudhiṣṭhira, Duryodhana erblickend, erzürnt (Abs.+Nom.Part.)"],["sahasā saṃnivṛttaḥ abhūt śriyaṃ dṛṣṭvā suyodhane","wandte sich jäh ab, als er den Glanz in Suyodhana sah (Nom.Part.+3.Sg.Impf.+Akk.+Abs.+Lok.)"]]],["007","bruvann uccair vacas tān vai nāhaṃ duryodhanena vai sahitaḥ kāmaye lokāṃl lubdhenādīrghadarśinā","Laut sprach er diese Worte: „Nicht wünsche ich, mit Duryodhana zusammen zu sein in diesen Welten, ihm, dem gierigen, kurzsichtigen [Mann],","",[["bruvan uccaiḥ vacaḥ tān vai","laut diese Worte sprechend (Nom.Part.+Adv.+Akk.)"],["na aham duryodhanena vai sahitaḥ kāmaye lokān lubdhena adīrghadarśinā","nicht wünsche ich, mit Duryodhana zusammen zu sein in diesen Welten, ihm, dem gierigen, kurzsichtigen (1.Sg.Präs.+Instr.+Nom.Part.+Akk.+Instr.Part.)"]]],["008","yatkṛte pṛthivī sarvā suhṛdo bāndhavās tathā hatāsmābhiḥ prasahyājau kliṣṭaiḥ pūrvaṃ mahāvane","um dessentwillen die ganze Erde und auch die Freunde und Verwandten von uns getötet wurden, gewaltsam im Kampf, [nachdem sie] zuvor im großen Wald Bedrängnis erlitten hatten,","",[["yatkṛte pṛthivī sarvā suhṛdaḥ bāndhavāḥ tathā","um dessentwillen die ganze Erde und auch die Freunde und Verwandten (Gen.+Nom.)"],["hatā asmābhiḥ prasahya ājau kliṣṭaiḥ pūrvaṃ mahāvane","von uns getötet wurden, gewaltsam im Kampf, [nachdem sie] zuvor im großen Wald Bedrängnis erlitten hatten (Nom.Part.+Instr.+Abs.+Lok.+Instr.Part.+Lok.)"]]],["009","draupadī ca sabhāmadhye pāñcālī dharmacāriṇī parikliṣṭānavadyāṅgī patnī no gurusaṃnidhau","und Draupadī, die Pāñcālī, die dharmatreue, inmitten der Versammlung, an ihren makellosen Gliedern gequält, unsere Gattin, in Gegenwart der Älteren -","",[["draupadī ca sabhāmadhye pāñcālī dharmacāriṇī","und Draupadī, inmitten der Versammlung, die Pāñcālī, die dharmatreue (Nom.+Lok.)"],["parikliṣṭānavadyāṅgī patnī naḥ gurusaṃnidhau","an ihren makellosen Gliedern gequält, unsere Gattin, in Gegenwart der Älteren (Nom.Part.+Nom.+Gen.+Lok.)"]]],["010","svasti devā na me kāmaḥ suyodhanam udīkṣitum tatrāhaṃ gantum icchāmi yatra te bhrātaro mama","Heil den Göttern, aber ich habe kein Verlangen, Suyodhana anzusehen; dorthin will ich gehen, wo meine Brüder sind.“","",[["svasti devāḥ na me kāmaḥ suyodhanam udīkṣitum","Heil den Göttern, aber ich habe kein Verlangen, Suyodhana anzusehen (Vok.+Nom.+Inf.)"],["tatra aham gantum icchāmi yatra te bhrātaraḥ mama","dorthin will ich gehen, wo meine Brüder sind (Inf.+1.Sg.Präs.+Nom.)"]]],["011","maivam ity abravīt taṃ tu nāradaḥ prahasann iva svarge nivāso rājendra viruddhaṃ cāpi naśyati","„Nicht so!“ - sprach zu ihm Nārada, gleichsam lächelnd: „Herrscher der Könige, der Aufenthalt im Himmel - auch die Feindschaft geht darin zugrunde.","",[["mā evam iti abravīt taṃ tu nāradaḥ prahasan iva","„nicht so!“ - sprach zu ihm Nārada, gleichsam lächelnd (direkte Rede+3.Sg.Impf.+Nom.+Nom.Part.)"],["svarge nivāsaḥ rājendra viruddhaṃ ca api naśyati","Herrscher der Könige, der Aufenthalt im Himmel - auch die Feindschaft geht darin zugrunde (Lok.+Nom.+Vok.+Nom.+3.Sg.Präs.)"]]],["012","yudhiṣṭhira mahābāho maivaṃ vocaḥ kathaṃ cana duryodhanaṃ prati nṛpaṃ śṛṇu cedaṃ vaco mama","Yudhiṣṭhira, Starkarmiger, sprich niemals so etwas; höre in Bezug auf den König Duryodhana dieses mein Wort:","",[["yudhiṣṭhira mahābāho mā evaṃ vocaḥ kathaṃ cana","Yudhiṣṭhira, Starkarmiger, sprich niemals so etwas (Vok.+Inj.+Adv.)"],["duryodhanaṃ prati nṛpaṃ śṛṇu ca idaṃ vacaḥ mama","in Bezug auf den König Duryodhana höre dieses mein Wort (Akk.+Imp.+Akk.+Gen.)"]]],["013","eṣa duryodhano rājā pūjyate tridaśaiḥ saha sadbhiś ca rājapravarair ya ime svargavāsinaḥ","Dieser König Duryodhana wird zusammen mit den dreißig [Göttern] verehrt, und mit den Guten, den vorzüglichsten Königen, die hier im Himmel wohnen,","[Anm.: 'die Dreißig' = die dreißig vedischen Götter (tridaśāḥ), formelhafte Bezeichnung der Gesamtheit der Götter.]",[["eṣa duryodhanaḥ rājā pūjyate tridaśaiḥ saha","dieser König Duryodhana wird zusammen mit den dreißig [Göttern] verehrt (Nom.+3.Sg.Präs.Pass.+Instr.)"],["sadbhiḥ ca rājapravaraiḥ ye ime svargavāsinaḥ","und mit den Guten, den vorzüglichsten Königen, die hier im Himmel wohnen (Instr.+Nom.Part.)"]]],["014","vīralokagatiṃ prāpto yuddhe hutvātmanas tanum yūyaṃ sarve surasamā yena yuddhe samāsitāḥ","er hat den Zustand der Heldenwelt erlangt, seinen eigenen Leib im Kampf geopfert habend; er, durch den ihr alle, den Göttern gleich, im Kampf zusammengeführt wurdet.","",[["vīralokagatiṃ prāptaḥ yuddhe hutvā ātmanaḥ tanum","den Zustand der Heldenwelt erlangt habend, seinen eigenen Leib im Kampf geopfert habend (Akk.+Nom.Part.+Lok.+Abs.+Gen.+Akk.)"],["yūyaṃ sarve surasamāḥ yena yuddhe samāsitāḥ","ihr alle, den Göttern gleich, durch den ihr im Kampf zusammengeführt wurdet (Nom.+Instr.+Lok.+Nom.Part.)"]]],["015","sa eṣa kṣatradharmeṇa sthānam etad avāptavān bhaye mahati yo 'bhīto babhūva pṛthivīpatiḥ","Er hat diesen Ort durch die Pflicht des Kriegers erlangt, er, der Herr der Erde, der in großer Gefahr furchtlos geblieben ist.","",[["sa eṣa kṣatradharmeṇa sthānam etat avāptavān","er hat diesen Ort durch die Pflicht des Kriegers erlangt (Nom.+Instr.+Akk.+Nom.Part.)"],["bhaye mahati yaḥ abhītaḥ babhūva pṛthivīpatiḥ","der, Herr der Erde, in großer Gefahr furchtlos geblieben ist (Lok.+Nom.Part.+3.Sg.Perf.+Nom.)"]]],["016","na tan manasi kartavyaṃ putra yad dyūtakāritam draupadyāś ca parikleśaṃ na cintayatum arhasi","Das sollst du dir nicht zu Herzen nehmen, mein Sohn, was durch das Würfelspiel geschah, und die Bedrängnis Draupadīs sollst du nicht mehr bedenken.","",[["na tat manasi kartavyaṃ putra yat dyūtakāritam","das sollst du dir nicht zu Herzen nehmen, mein Sohn, was durch das Würfelspiel geschah (Nom.Part.+Lok.+Vok.+Nom.)"],["draupadyāḥ ca parikleśaṃ na cintayatum arhasi","und die Bedrängnis Draupadīs sollst du nicht mehr bedenken (Gen.+Akk.+Inf.+2.Sg.Präs.)"]]],["017","ye cānye 'pi parikleśā yuṣmākaṃ dyūtakāritāḥ saṃgrāmeṣv atha vānyatra na tān saṃsmartum arhasi","Und auch die anderen Bedrängnisse, die euch durch das Würfelspiel widerfuhren, sei es in Kämpfen oder anderswo, sollst du nicht mehr in Erinnerung rufen.","",[["ye ca anye api parikleśāḥ yuṣmākaṃ dyūtakāritāḥ","und auch die anderen Bedrängnisse, die euch durch das Würfelspiel widerfuhren (Nom.Part.+Gen.+Nom.)"],["saṃgrāmeṣu atha vā anyatra na tān saṃsmartum arhasi","sei es in Kämpfen oder anderswo, sollst du sie nicht mehr in Erinnerung rufen (Lok.+Akk.+Inf.+2.Sg.Präs.)"]]],["018","samāgaccha yathānyāyaṃ rājñā duryodhanena vai svargo 'yaṃ neha vairāṇi bhavanti manujādhipa","Vereinige dich, wie es sich gebührt, mit dem König Duryodhana; dies ist der Himmel, Herrscher der Menschen, hier gibt es keine Feindschaften.“","",[["samāgaccha yathānyāyaṃ rājñā duryodhanena vai","vereinige dich, wie es sich gebührt, mit dem König Duryodhana (Imp.+Adv.+Instr.)"],["svargaḥ ayaṃ na iha vairāṇi bhavanti manujādhipa","dies ist der Himmel, hier gibt es keine Feindschaften, Herrscher der Menschen (Nom.+Nom.+3.Pl.Präs.+Vok.)"]]],["019","nāradenaivam uktas tu kururājo yudhiṣṭhiraḥ bhrātṝn papraccha medhāvī vākyam etad uvāca ha","So von Nārada angesprochen, fragte der Kuru-König Yudhiṣṭhira, der Kluge, seine Brüder und sprach dieses Wort:","",[["nāradena evam uktaḥ tu kururājaḥ yudhiṣṭhiraḥ","so von Nārada angesprochen, der Kuru-König Yudhiṣṭhira (Instr.+Nom.Part.+Nom.)"],["bhrātṝn papraccha medhāvī vākyam etat uvāca ha","fragte seine Brüder, der Kluge, und sprach dieses Wort (Akk.+3.Sg.Perf.+Nom.+Akk.+3.Sg.Perf.)"]]],["020","yadi duryodhanasyaite vīralokāḥ sanātanāḥ adharmajñasya pāpasya pṛthivīsuhṛdadruhaḥ","„Wenn dies die ewigen Heldenwelten Duryodhanas sind, des Unwissenden im Dharma, des Sünders, des Verräters an seinen Erdenfreunden,","",[["yadi duryodhanasya ete vīralokāḥ sanātanāḥ","wenn dies die ewigen Heldenwelten Duryodhanas sind (Gen.+Nom.)"],["adharmajñasya pāpasya pṛthivīsuhṛdadruhaḥ","des Unwissenden im Dharma, des Sünders, des Verräters an seinen Erdenfreunden (Gen.)"]]],["021","yatkṛte pṛthivī naṣṭā sahayā sarathadvipā vayaṃ ca manyunā dagdhā vairaṃ praticikīrṣavaḥ","um dessentwillen die Erde zugrunde ging, mit ihren Reitern, Wagen- und Elefantenkämpfern, und wir, von Zorn verbrannt, Vergeltung suchten -","",[["yatkṛte pṛthivī naṣṭā sahayā sarathadvipā","um dessentwillen die Erde zugrunde ging, mit ihren Reitern, Wagen- und Elefantenkämpfern (Gen.+Nom.Part.+Nom.)"],["vayaṃ ca manyunā dagdhāḥ vairaṃ praticikīrṣavaḥ","und wir, von Zorn verbrannt, Vergeltung suchten (Nom.+Instr.+Nom.Part.+Nom.Part.)"]]],["022","ye te vīrā mahātmāno bhrātaro me mahāvratāḥ satyapratijñā lokasya śūrā vai satyavādinaḥ","jene Helden, die Hochgesinnten, meine Brüder von großen Gelübden, deren Versprechen wahr waren, die Tapferen, die Wahrredenden der Welt -","",[["ye te vīrāḥ mahātmānaḥ bhrātaraḥ me mahāvratāḥ","jene Helden, die Hochgesinnten, meine Brüder, von großen Gelübden (Nom.Part.)"],["satyapratijñāḥ lokasya śūrāḥ vai satyavādinaḥ","deren Versprechen wahr waren, die Tapferen der Welt, die Wahrredenden (Nom.+Gen.+Nom.)"]]],["023","teṣām idānīṃ ke lokā draṣṭum icchāmi tān aham karṇaṃ caiva mahātmānaṃ kaunteyaṃ satyasaṃgaram","welche Welten haben sie nun? Ich möchte sie sehen - auch den hochgesinnten Karṇa, den Sohn der Kuntī, dessen Bündnis wahr war,","",[["teṣām idānīṃ ke lokāḥ draṣṭum icchāmi tān aham","welche Welten haben sie nun? Ich möchte sie sehen (Gen.+Nom.+Inf.+1.Sg.Präs.+Akk.)"],["karṇaṃ ca eva mahātmānaṃ kaunteyaṃ satyasaṃgaram","auch den hochgesinnten Karṇa, den Sohn der Kuntī, dessen Bündnis wahr war (Akk.)"]]],["024","dhṛṣṭadyumnaṃ sātyakiṃ ca dhṛṣṭadyumnasya cātmajān ye ca śastrair vadhaṃ prāptāḥ kṣatradharmeṇa pārthivāḥ","und Dhṛṣṭadyumna und Sātyaki, und Dhṛṣṭadyumnas Söhne, und jene Fürsten, die durch Waffen den Tod fanden, gemäß der Pflicht des Kriegers -","",[["dhṛṣṭadyumnaṃ sātyakiṃ ca dhṛṣṭadyumnasya ca ātmajān","und Dhṛṣṭadyumna und Sātyaki, und Dhṛṣṭadyumnas Söhne (Akk.+Gen.+Akk.)"],["ye ca śastraiḥ vadhaṃ prāptāḥ kṣatradharmeṇa pārthivāḥ","und jene Fürsten, die durch Waffen den Tod fanden, gemäß der Pflicht des Kriegers (Nom.Part.+Instr.+Akk.+Instr.+Nom.)"]]],["025","kva nu te pārthivā brahman naitān paśyāmi nārada virāṭadrupadau caiva dhṛṣṭaketumukhāṃś ca tān","wo sind jene Fürsten, Brahmane? Ich sehe sie nicht, Nārada - Virāṭa und Drupada, und jene, angeführt von Dhṛṣṭaketu,","",[["kva nu te pārthivāḥ brahman na etān paśyāmi nārada","wo sind jene Fürsten, Brahmane? Ich sehe sie nicht, Nārada (Adv.+Nom.+Vok.+Akk.+1.Sg.Präs.+Vok.)"],["virāṭadrupadau ca eva dhṛṣṭaketumukhān ca tān","Virāṭa und Drupada, und jene, angeführt von Dhṛṣṭaketu (Akk.Dual+Akk.)"]]],["026","śikhaṇḍinaṃ ca pāñcālyaṃ draupadeyāṃś ca sarvaśaḥ abhimanyuṃ ca durdharṣaṃ draṣṭum icchāmi nārada","und Śikhaṇḍin, den Pāñcālya, und die Söhne Draupadīs allesamt, und den unbezwingbaren Abhimanyu möchte ich sehen, Nārada.“","[Anm.: Ende des Kapitels; Yudhiṣṭhiras Frage nach dem Verbleib der uebrigen Helden wird im folgenden Kapitel beantwortet.]",[["śikhaṇḍinaṃ ca pāñcālyaṃ draupadeyān ca sarvaśaḥ","und Śikhaṇḍin, den Pāñcālya, und die Söhne Draupadīs allesamt (Akk.)"],["abhimanyuṃ ca durdharṣaṃ draṣṭum icchāmi nārada","und den unbezwingbaren Abhimanyu möchte ich sehen, Nārada (Akk.+Inf.+1.Sg.Präs.+Vok.)"]]]]},{"num":2,"title_sa":"","title_de":"Die Höllenvision","note":"","units":[["001","yudhiṣṭhira uvāca neha paśyāmi vibudhā rādheyam amitaujasam bhrātarau ca mahātmānau yudhāmanyūttamaujasau","Yudhiṣṭhira sprach: „Nicht sehe ich hier, o Weise, den Rādheya von unermesslicher Kraft, noch meine beiden hochgesinnten Brüder Yudhāmanyu und Uttamaujas,","[Anm.: Rādheya = Beiname Karṇas als Sohn der Rādhā (Adoptivmutter).]",[["yudhiṣṭhiraḥ uvāca","Yudhiṣṭhira sprach (3.Sg.Perf.)"],["na iha paśyāmi vibudhāḥ rādheyam amitaujasam","nicht sehe ich hier, o Weise, den Rādheya von unermesslicher Kraft (Adv.+1.Sg.Präs.+Vok.+Akk.)"],["bhrātarau ca mahātmānau yudhāmanyūttamaujasau","noch meine beiden hochgesinnten Brüder Yudhāmanyu und Uttamaujas (Akk.Dual)"]]],["002","juhuvur ye śarīrāṇi raṇavahnau mahārathāḥ rājāno rājaputrāś ca ye madarthe hatā raṇe","die großen Wagenkämpfer, die ihre Leiber im Feuer der Schlacht opferten, die Könige und Königssöhne, die um meinetwillen im Kampf erschlagen wurden.","",[["juhuvuḥ ye śarīrāṇi raṇavahnau mahārathāḥ","die ihre Leiber im Feuer der Schlacht opferten, die großen Wagenkämpfer (3.Pl.Perf.+Nom.Part.+Akk.+Lok.+Nom.)"],["rājānaḥ rājaputrāḥ ca ye madarthe hatāḥ raṇe","die Könige und Königssöhne, die um meinetwillen im Kampf erschlagen wurden (Nom.+Nom.Part.+Lok.+Nom.Part.+Lok.)"]]],["003","kva te mahārathāḥ sarve śārdūlasamavikramāḥ tair apy ayaṃ jito lokaḥ kaccit puruṣasattamaiḥ","Wo sind all jene großen Wagenkämpfer, von tigergleicher Kraft? Wurde diese Welt denn auch von ihnen errungen, den besten der Männer?","",[["kva te mahārathāḥ sarve śārdūlasamavikramāḥ","wo sind all jene großen Wagenkämpfer, von tigergleicher Kraft (Adv.+Nom.)"],["taiḥ api ayaṃ jitaḥ lokaḥ kaccit puruṣasattamaiḥ","wurde diese Welt denn auch von ihnen errungen, den besten der Männer (Instr.+Nom.Part.+Nom.+Partikel)"]]],["004","yadi lokān imān prāptās te ca sarve mahārathāḥ sthitaṃ vitta hi māṃ devāḥ sahitaṃ tair mahātmabhiḥ","Wenn sie diese Welten erreicht haben, all jene großen Wagenkämpfer, dann wisset, Götter, dass ich bei ihnen, den Hochgesinnten, vereint bleiben werde.","",[["yadi lokān imān prāptāḥ te ca sarve mahārathāḥ","wenn sie diese Welten erreicht haben, all jene großen Wagenkämpfer (Akk.+Nom.Part.+Nom.)"],["sthitaṃ vitta hi māṃ devāḥ sahitaṃ taiḥ mahātmabhiḥ","dann wisset, Götter, dass ich bei ihnen, den Hochgesinnten, vereint bleiben werde (Akk.Part.+Imp.+Akk.+Vok.+Instr.)"]]],["005","kaccin na tair avāpto 'yaṃ nṛpair loko 'kṣayaḥ śubhaḥ na tair ahaṃ vinā vatsye jñātibhir bhrātṛbhis tathā","Ward diese unvergängliche, heilvolle Welt denn nicht von jenen Königen erlangt? Ohne sie, meine Verwandten und Brüder, werde ich nicht weilen.","",[["kaccit na taiḥ avāptaḥ ayaṃ nṛpaiḥ lokaḥ akṣayaḥ śubhaḥ","ward diese unvergängliche, heilvolle Welt denn nicht von jenen Königen erlangt (Partikel+Instr.+Nom.Part.+Nom.)"],["na taiḥ ahaṃ vinā vatsye jñātibhiḥ bhrātṛbhiḥ tathā","ohne sie, meine Verwandten und Brüder, werde ich nicht weilen (Instr.+1.Sg.Fut.Med.)"]]],["006","mātur hi vacanaṃ śrutvā tadā salilakarmaṇi karṇasya kriyatāṃ toyam iti tapyāmi tena vai","Denn seit ich damals der Mutter Wort über das Wasseropfer vernahm - ‚Für Karṇa soll das Wasser dargebracht werden‘ - quäle ich mich dadurch.","",[["mātuḥ hi vacanaṃ śrutvā tadā salilakarmaṇi","denn seit ich damals der Mutter Wort über das Wasseropfer vernahm (Gen.+Akk.+Abs.+Lok.)"],["karṇasya kriyatām toyam iti tapyāmi tena vai","„für Karṇa soll das Wasser dargebracht werden“ - quäle ich mich dadurch (Gen.+Imp.Pass.+Akk.+direkte Rede+1.Sg.Präs.)"]]],["007","idaṃ ca paritapyāmi punaḥ punar ahaṃ surāḥ yan mātuḥ sadṛśau pādau tasyāham amitaujasaḥ","Und dies auch bereue ich immer wieder, o Götter: dass ich die der Mutter ähnlichen Füße jenes von unermesslicher Kraft [erblickt und doch nicht erkannt habe] -","[Anm.: Karṇas Füße sollen denen Kuntīs geglichen haben - ein Erkennungszeichen seiner wahren Abstammung, das zu Lebzeiten übersehen wurde.]",[["idaṃ ca paritapyāmi punaḥ punaḥ aham surāḥ","und dies auch bereue ich immer wieder, o Götter (Akk.+1.Sg.Präs.+Adv.+Vok.)"],["yat mātuḥ sadṛśau pādau tasya aham amitaujasaḥ","dass ich die der Mutter ähnlichen Füße jenes von unermesslicher Kraft (Gen.+Akk.Dual+Gen.+Gen.)"]]],["008","dṛṣṭvaiva taṃ nānugataḥ karṇaṃ parabalārdanam na hy asmān karṇasahitāñ jayec chakro 'pi saṃyuge","obwohl ich sie gesehen hatte, bin ich diesem Karṇa, dem Zerstörer feindlicher Heere, nicht gefolgt; denn nicht einmal Śakra hätte uns, mit Karṇa vereint, in der Schlacht besiegen können.","",[["dṛṣṭvā eva taṃ na anugataḥ karṇaṃ parabalārdanam","obwohl ich sie gesehen hatte, bin ich diesem Karṇa, dem Zerstörer feindlicher Heere, nicht gefolgt (Abs.+Nom.Part.+Akk.)"],["na hi asmān karṇasahitān jayet śakraḥ api saṃyuge","denn nicht einmal Śakra hätte uns, mit Karṇa vereint, in der Schlacht besiegen können (Akk.+3.Sg.Opt.+Nom.+Lok.)"]]],["009","tam ahaṃ yatratatrasthaṃ draṣṭum icchāmi sūryajam avijñāto mayā yo 'sau ghātitaḥ savyasācinā","Ihn, den Sohn des Sūrya, wo immer er sich befindet, möchte ich sehen - ihn, den ich, von mir unerkannt, durch Savyasācin [Arjuna] töten ließ.","",[["tam aham yatratatrasthaṃ draṣṭum icchāmi sūryajam","ihn, wo immer er sich befindet, möchte ich sehen, den Sohn des Sūrya (Akk.+1.Sg.Präs.+Inf.+Akk.)"],["avijñātaḥ mayā yaḥ asau ghātitaḥ savyasācinā","den ich, von mir unerkannt, durch Savyasācin töten ließ (Nom.Part.+Instr.+Nom.Part.+Instr.)"]]],["010","bhīmaṃ ca bhīmavikrāntaṃ prāṇebhyo 'pi priyaṃ mama arjunaṃ cendrasaṃkāśaṃ yamau tau ca yamopamau","Und Bhīma, den furchtbar Tapferen, mir teurer als das Leben, und Arjuna, dem Indra gleich, und jene beiden Zwillinge, den beiden Yamas gleich,","",[["bhīmaṃ ca bhīmavikrāntaṃ prāṇebhyaḥ api priyaṃ mama","und Bhīma, den furchtbar Tapferen, mir teurer als das Leben (Akk.+Abl.+Akk.+Gen.)"],["arjunaṃ ca indrasaṃkāśaṃ yamau tau ca yamopamau","und Arjuna, dem Indra gleich, und jene beiden Zwillinge, den beiden Yamas gleich (Akk.+Akk.Dual)"]]],["011","draṣṭum icchāmi tāṃ cāhaṃ pāñcālīṃ dharmacāriṇīm na ceha sthātum icchāmi satyam etad bravīmi vaḥ","sie möchte ich sehen, und auch jene Pāñcālī, die dharmatreue; und hier zu bleiben wünsche ich nicht - dies spreche ich euch wahrhaftig.","",[["draṣṭum icchāmi tāṃ ca aham pāñcālīṃ dharmacāriṇīm","sie möchte ich sehen, und auch jene Pāñcālī, die dharmatreue (Inf.+1.Sg.Präs.+Akk.)"],["na ca iha sthātum icchāmi satyam etat bravīmi vaḥ","und hier zu bleiben wünsche ich nicht - dies spreche ich euch wahrhaftig (Inf.+1.Sg.Präs.+Akk.+1.Sg.Präs.+Gen.)"]]],["012","kiṃ me bhrātṛvihīnasya svargeṇa surasattamāḥ yatra te sa mama svargo nāyaṃ svargo mato mama","Was nützt mir, dem meiner Brüder Beraubten, der Himmel, ihr Besten der Götter? Wo sie sind, das ist mein Himmel; dies hier gilt mir nicht als Himmel.“","",[["kiṃ me bhrātṛvihīnasya svargeṇa surasattamāḥ","was nützt mir, dem meiner Brüder Beraubten, der Himmel, ihr Besten der Götter (Gen.Part.+Instr.+Vok.)"],["yatra te sa mama svargaḥ na ayaṃ svargaḥ mataḥ mama","wo sie sind, das ist mein Himmel; dies hier gilt mir nicht als Himmel (Adv.+Nom.+Nom.Part.)"]]],["013","devā ūcuḥ yadi vai tatra te śraddhā gamyatāṃ putra māciram priye hi tava vartāmo devarājasya śāsanāt","Die Götter sprachen: „Wenn du denn dorthin ein solches Verlangen hast, so gehe, mein Sohn, ohne Zögern; wir handeln nach dem Gebot des Götterkönigs, der dir zugetan ist.“","",[["devāḥ ūcuḥ","die Götter sprachen (3.Pl.Perf.)"],["yadi vai tatra te śraddhā gamyatām putra mā aciram","wenn du denn dorthin ein solches Verlangen hast, so gehe, mein Sohn, ohne Zögern (Adv.+Nom.+Imp.Pass.+Vok.+Inj.+Adv.)"],["priye hi tava vartāmaḥ devarājasya śāsanāt","wir handeln nach dem Gebot des Götterkönigs, der dir zugetan ist (Lok.+Gen.+1.Pl.Präs.+Gen.+Abl.)"]]],["014","vaiśaṃpāyana uvāca ity uktvā taṃ tato devā devadūtam upādiśan yudhiṣṭhirasya suhṛdo darśayeti paraṃtapa","Vaiśaṃpāyana sprach: Dies zu ihm gesagt habend, wiesen die Götter darauf einen Götterboten an, Yudhiṣṭhira dessen Freunde zu zeigen, Bezwinger der Feinde.","",[["vaiśaṃpāyanaḥ uvāca ity uktvā taṃ tataḥ devāḥ","Vaiśaṃpāyana sprach: dies zu ihm gesagt habend, die Götter (3.Sg.Perf.+Abs.+Nom.)"],["devadūtam upādiśan yudhiṣṭhirasya suhṛdaḥ darśaya iti paraṃtapa","wiesen einen Götterboten an, Yudhiṣṭhira dessen Freunde zu zeigen, Bezwinger der Feinde (Akk.+3.Pl.Impf.+Gen.+Akk.+Imp.+direkte Rede+Vok.)"]]],["015","tataḥ kuntīsuto rājā devadūtaś ca jagmatuḥ sahitau rājaśārdūla yatra te puruṣarṣabhāḥ","Dann zogen der König, der Sohn der Kuntī, und der Götterbote gemeinsam dorthin, Tiger unter den Königen, wo jene Stiere unter den Männern waren.","",[["tataḥ kuntīsutaḥ rājā devadūtaḥ ca jagmatuḥ sahitau","dann zogen der König, der Sohn der Kuntī, und der Götterbote gemeinsam (Nom.+Nom.+3.Dual.Perf.+Nom.Dual)"],["rājaśārdūla yatra te puruṣarṣabhāḥ","Tiger unter den Königen, wo jene Stiere unter den Männern waren (Vok.+Adv.+Nom.)"]]],["016","agrato devadūtas tu yayau rājā ca pṛṣṭhataḥ panthānam aśubhaṃ durgaṃ sevitaṃ pāpakarmabhiḥ","Voran zog der Götterbote, und der König folgte hinterher, auf einem unheilvollen, schwer zugänglichen Pfad, der von Übeltätern begangen wurde,","",[["agrataḥ devadūtaḥ tu yayau rājā ca pṛṣṭhataḥ","voran zog der Götterbote, und der König folgte hinterher (Adv.+Nom.+3.Sg.Perf.+Nom.+Adv.)"],["panthānam aśubhaṃ durgaṃ sevitaṃ pāpakarmabhiḥ","auf einem unheilvollen, schwer zugänglichen Pfad, der von Übeltätern begangen wurde (Akk.+Akk.Part.+Instr.)"]]],["017","tamasā saṃvṛtaṃ ghoraṃ keśaśaivalaśādvalam yuktaṃ pāpakṛtāṃ gandhair māṃsaśoṇitakardamam","von Finsternis umhüllt, schrecklich, mit Haaren und Moos wie mit Gras bewachsen, erfüllt von den Gerüchen der Übeltäter, ein Schlamm aus Fleisch und Blut,","",[["tamasā saṃvṛtaṃ ghoraṃ keśaśaivalaśādvalam","von Finsternis umhüllt, schrecklich, mit Haaren und Moos wie mit Gras bewachsen (Instr.+Akk.Part.)"],["yuktaṃ pāpakṛtāṃ gandhaiḥ māṃsaśoṇitakardamam","erfüllt von den Gerüchen der Übeltäter, ein Schlamm aus Fleisch und Blut (Akk.Part.+Gen.+Instr.+Akk.)"]]],["018","daṃśotthānaṃ sajhillīkaṃ makṣikāmaśakāvṛtam itaś cetaś ca kuṇapaiḥ samantāt parivāritam","von aufsteigenden Bremsen und Zecken erfüllt, von Fliegen und Mücken umschwärmt, hier und dort ringsum von Leichen umgeben,","",[["daṃśotthānaṃ sajhillīkaṃ makṣikāmaśakāvṛtam","von aufsteigenden Bremsen und Zecken erfüllt, von Fliegen und Mücken umschwärmt (Akk.Part.)"],["itaḥ ca itaḥ ca kuṇapaiḥ samantāt parivāritam","hier und dort ringsum von Leichen umgeben (Adv.+Instr.+Adv.+Akk.Part.)"]]],["019","asthikeśasamākīrṇaṃ kṛmikīṭasamākulam jvalanena pradīptena samantāt pariveṣṭitam","mit Knochen und Haaren übersät, von Würmern und Ungeziefer wimmelnd, ringsum von loderndem Feuer umschlossen,","",[["asthikeśasamākīrṇaṃ kṛmikīṭasamākulam","mit Knochen und Haaren übersät, von Würmern und Ungeziefer wimmelnd (Akk.Part.)"],["jvalanena pradīptena samantāt pariveṣṭitam","ringsum von loderndem Feuer umschlossen (Instr.+Instr.Part.+Adv.+Akk.Part.)"]]],["020","ayomukhaiś ca kākolair gṛdhraiś ca samabhidrutam sūcīmukhais tathā pretair vindhyaśailopamair vṛtam","von eisenschnäbeligen Raben und Geiern überlaufen, ebenso von nadelmündigen Gespenstern umgeben, gleich dem Vindhya-Gebirge [an Ausmaß],","",[["ayomukhaiḥ ca kākolaiḥ gṛdhraiḥ ca samabhidrutam","von eisenschnäbeligen Raben und Geiern überlaufen (Instr.+Akk.Part.)"],["sūcīmukhaiḥ tathā pretaiḥ vindhyaśailopamaiḥ vṛtam","ebenso von nadelmündigen Gespenstern umgeben, gleich dem Vindhya-Gebirge (Instr.+Akk.Part.)"]]],["021","medorudhirayuktaiś ca chinnabāhūrupāṇibhiḥ nikṛttodarapādaiś ca tatra tatra praveritaiḥ","erfüllt von Fett und Blut, mit abgetrennten Armen, Schenkeln und Händen, mit aufgeschlitzten Bäuchen und Füßen, hier und dort verstreut.","",[["medorudhirayuktaiḥ ca chinnabāhūrupāṇibhiḥ","erfüllt von Fett und Blut, mit abgetrennten Armen, Schenkeln und Händen (Instr.)"],["nikṛttodarapādaiḥ ca tatra tatra praveritaiḥ","mit aufgeschlitzten Bäuchen und Füßen, hier und dort verstreut (Instr.+Adv.)"]]],["022","sa tat kuṇapadurgandham aśivaṃ romaharṣaṇam jagāma rājā dharmātmā madhye bahu vicintayan","Diesen unheilvollen, haarsträubenden Leichengestank durchschritt der rechtschaffene König, mitten hindurch, vielfach nachsinnend.","",[["sa tat kuṇapadurgandham aśivaṃ romaharṣaṇam","diesen unheilvollen, haarsträubenden Leichengestank (Akk.)"],["jagāma rājā dharmātmā madhye bahu vicintayan","durchschritt der rechtschaffene König, mitten hindurch, vielfach nachsinnend (3.Sg.Perf.+Nom.+Adv.+Adv.+Nom.Part.)"]]],["023","dadarśoṣṇodakaiḥ pūrṇāṃ nadīṃ cāpi sudurgamām asipatravanaṃ caiva niśitakṣurasaṃvṛtam","Er sah einen mit heißem Wasser gefüllten, schwer zu überquerenden Fluss, und auch einen Schwertblattwald, von scharfen Klingen bedeckt,","",[["dadarśa uṣṇodakaiḥ pūrṇāṃ nadīṃ ca api sudurgamām","er sah einen mit heißem Wasser gefüllten, schwer zu überquerenden Fluss (3.Sg.Perf.+Instr.+Akk.Part.+Akk.)"],["asipatravanaṃ ca eva niśitakṣurasaṃvṛtam","und auch einen Schwertblattwald, von scharfen Klingen bedeckt (Akk.+Akk.Part.)"]]],["024","karambhavālukās taptā āyasīś ca śilāḥ pṛthak lohakumbhīś ca tailasya kvāthyamānāḥ samantataḥ","glühenden, vermengten Sand, und eiserne Felsblöcke, verschiedenartig, und ringsum eiserne Kessel, in denen Öl gekocht wurde,","",[["karambhavālukāḥ taptāḥ āyasīḥ ca śilāḥ pṛthak","glühenden, vermengten Sand, und eiserne Felsblöcke, verschiedenartig (Akk.+Akk.Part.+Akk.+Adv.)"],["lohakumbhīḥ ca tailasya kvāthyamānāḥ samantataḥ","und ringsum eiserne Kessel, in denen Öl gekocht wurde (Akk.+Gen.+Akk.Part.+Adv.)"]]],["025","kūṭaśālmalikaṃ cāpi dusparśaṃ tīkṣṇakaṇṭakam dadarśa cāpi kaunteyo yātanāḥ pāpakarmiṇām","und auch den trügerischen Śālmali-Baum, unberührbar, mit scharfen Dornen, sah der Sohn der Kuntī - die Qualen der Übeltäter.","[Anm.: kūṭaśālmali = ein Baum mit scharfen, eisernen Dornen, klassisches Hoellen-Marterinstrument der puranischen Hoellenbeschreibungen.]",[["kūṭaśālmalikaṃ ca api dusparśaṃ tīkṣṇakaṇṭakam","und auch den trügerischen Śālmali-Baum, unberührbar, mit scharfen Dornen (Akk.)"],["dadarśa ca api kaunteyaḥ yātanāḥ pāpakarmiṇām","sah der Sohn der Kuntī, die Qualen der Übeltäter (3.Sg.Perf.+Nom.+Akk.+Gen.)"]]],["026","sa taṃ durgandham ālakṣya devadūtam uvāca ha kiyad adhvānam asmābhir gantavyam idam īdṛśam","Diesen üblen Geruch wahrnehmend, sprach er zum Götterboten: „Wie weit müssen wir noch auf diesem Weg, wie er nun einmal beschaffen ist, gehen?","",[["sa taṃ durgandham ālakṣya devadūtam uvāca ha","diesen üblen Geruch wahrnehmend, sprach er zum Götterboten (Abs.+Akk.+3.Sg.Perf.)"],["kiyat adhvānam asmābhiḥ gantavyam idam īdṛśam","wie weit müssen wir noch auf diesem Weg, wie er nun einmal beschaffen ist, gehen (Adv.+Akk.+Instr.+Nom.Part.+Nom.)"]]],["027","kva ca te bhrātaro mahyaṃ tan mamākhyātum arhasi deśo 'yaṃ kaś ca devānām etad icchāmi veditum","Und wo sind mir meine Brüder? Das sollst du mir mitteilen; welcher Ort der Götter ist dies? Dies möchte ich wissen.“","",[["kva ca te bhrātaraḥ mahyaṃ tat mama ākhyātum arhasi","und wo sind mir meine Brüder? Das sollst du mir mitteilen (Adv.+Nom.+Dat.+Inf.+2.Sg.Präs.)"],["deśaḥ ayaṃ kaḥ ca devānām etat icchāmi veditum","welcher Ort der Götter ist dies? Dies möchte ich wissen (Nom.+Gen.+Akk.+1.Sg.Präs.+Inf.)"]]],["028","sa saṃnivavṛte śrutvā dharmarājasya bhāṣitam devadūto 'bravīc cainam etāvad gamanaṃ tava","Er wandte sich, das Wort des Rechtskönigs vernommen habend, um; der Götterbote sprach zu ihm: „So weit reicht deine Reise [an dieser Stelle].","",[["sa saṃnivavṛte śrutvā dharmarājasya bhāṣitam","er wandte sich, das Wort des Rechtskönigs vernommen habend, um (Nom.+3.Sg.Perf.Med.+Abs.+Gen.+Akk.)"],["devadūtaḥ abravīt ca enam etāvat gamanaṃ tava","der Götterbote sprach zu ihm: so weit reicht deine Reise (Nom.+3.Sg.Impf.+Akk.+Nom.+Nom.+Gen.)"]]],["029","nivartitavyaṃ hi mayā tathāsmy ukto divaukasaiḥ yadi śrānto 'si rājendra tvam athāgantum arhasi","Denn ich muss umkehren; so wurde mir von den Himmelsbewohnern befohlen. Wenn du erschöpft bist, Herrscher der Könige, dann solltest auch du zurückkommen.“","",[["nivartitavyaṃ hi mayā tathā asmi uktaḥ divaukasaiḥ","denn ich muss umkehren; so wurde mir von den Himmelsbewohnern befohlen (Nom.Part.+Instr.+Adv.+1.Sg.Präs.+Nom.Part.+Instr.)"],["yadi śrāntaḥ asi rājendra tvam atha āgantum arhasi","wenn du erschöpft bist, Herrscher der Könige, dann solltest auch du zurückkommen (Nom.Part.+2.Sg.Präs.+Vok.+Nom.+Inf.+2.Sg.Präs.)"]]],["030","yudhiṣṭhiras tu nirviṇṇas tena gandhena mūrchitaḥ nivartane dhṛtamanāḥ paryāvartata bhārata","Yudhiṣṭhira aber, von jenem Gestank überwältigt und fast ohnmächtig, wandte, zur Umkehr entschlossen, sich um, Bhārata.","",[["yudhiṣṭhiraḥ tu nirviṇṇaḥ tena gandhena mūrchitaḥ","Yudhiṣṭhira aber, überwältigt, von jenem Gestank fast ohnmächtig (Nom.Part.+Instr.+Nom.Part.)"],["nivartane dhṛtamanāḥ paryāvartata bhārata","zur Umkehr entschlossen, wandte er sich um, Bhārata (Lok.+Nom.Part.+3.Sg.Impf.Med.+Vok.)"]]],["031","sa saṃnivṛtto dharmātmā duḥkhaśokasamanvitaḥ śuśrāva tatra vadatāṃ dīnā vācaḥ samantataḥ","Er, der Rechtschaffene, umgekehrt, von Leid und Kummer erfüllt, hörte dort ringsum die kläglichen Worte von Sprechenden.","",[["sa saṃnivṛttaḥ dharmātmā duḥkhaśokasamanvitaḥ","er, umgekehrt, der Rechtschaffene, von Leid und Kummer erfüllt (Nom.Part.+Nom.+Nom.Part.)"],["śuśrāva tatra vadatāṃ dīnā vācaḥ samantataḥ","hörte dort ringsum die kläglichen Worte von Sprechenden (3.Sg.Perf.+Adv.+Gen.Part.+Akk.Part.+Akk.+Adv.)"]]],["032","bho bho dharmaja rājarṣe puṇyābhijana pāṇḍava anugrahārtham asmākaṃ tiṣṭha tāvan muhūrtakam","„Ho, ho, Sohn des Dharma, königlicher Weiser, von heiliger Abkunft, Pāṇḍava! Um unseretwillen, aus Gnade, verweile nur einen Augenblick!","",[["bho bho dharmaja rājarṣe puṇyābhijana pāṇḍava","ho, ho, Sohn des Dharma, königlicher Weiser, von heiliger Abkunft, Pāṇḍava (Vok.)"],["anugrahārtham asmākaṃ tiṣṭha tāvat muhūrtakam","um unseretwillen, aus Gnade, verweile nur einen Augenblick (Akk.+Gen.+Imp.+Adv.+Akk.)"]]],["033","āyāti tvayi durdharṣe vāti puṇyaḥ samīraṇaḥ tava gandhānugas tāta yenāsmān sukham āgamat","Wenn du, der Unbezwingbare, herankommst, weht ein heilsamer Wind, der deinem Duft folgt, mein Sohn, durch den uns Wohlbefinden zuteilwird.","",[["āyāti tvayi durdharṣe vāti puṇyaḥ samīraṇaḥ","wenn du, der Unbezwingbare, herankommst, weht ein heilsamer Wind (3.Sg.Präs.+Lok.Part.+3.Sg.Präs.+Nom.)"],["tava gandhānugaḥ tāta yena asmān sukham āgamat","der deinem Duft folgt, mein Sohn, durch den uns Wohlbefinden zuteilwird (Gen.+Nom.Part.+Vok.+Instr.+Akk.+Akk.+3.Sg.Perf.)"]]],["034","te vayaṃ pārtha dīrghasya kālasya puruṣarṣabha sukham āsādayiṣyāmas tvāṃ dṛṣṭvā rājasattama","Wir werden, Pārtha, Stier unter den Männern, nach langer Zeit Glück erlangen, dich erblickend, Bester der Könige.","",[["te vayaṃ pārtha dīrghasya kālasya puruṣarṣabha","wir, Pārtha, Stier unter den Männern, nach langer Zeit (Nom.+Vok.+Gen.+Vok.)"],["sukham āsādayiṣyāmaḥ tvāṃ dṛṣṭvā rājasattama","werden Glück erlangen, dich erblickend, Bester der Könige (Akk.+1.Pl.Fut.+Akk.+Abs.+Vok.)"]]],["035","saṃtiṣṭhasva mahābāho muhūrtam api bhārata tvayi tiṣṭhati kauravya yātanāsmān na bādhate","Verweile, Starkarmiger, sei es auch nur einen Augenblick, Bhārata; solange du hier weilst, Kaurava, quält uns die Pein nicht.“","",[["saṃtiṣṭhasva mahābāho muhūrtam api bhārata","verweile, Starkarmiger, sei es auch nur einen Augenblick, Bhārata (Imp.+Vok.+Akk.+Vok.)"],["tvayi tiṣṭhati kauravya yātanā asmān na bādhate","solange du hier weilst, Kaurava, quält uns die Pein nicht (Lok.Abs.+Vok.+Nom.+Akk.+3.Sg.Präs.Med.)"]]],["036","evaṃ bahuvidhā vācaḥ kṛpaṇā vedanāvatām tasmin deśe sa śuśrāva samantād vadatāṃ nṛpa","So hörte er an jenem Ort vielerlei kummervolle Worte von Schmerzbeladenen ringsum, von Sprechenden, o König.","",[["evaṃ bahuvidhā vācaḥ kṛpaṇā vedanāvatām","so vielerlei kummervolle Worte von Schmerzbeladenen (Adv.+Akk.Part.+Akk.+Gen.Part.)"],["tasmin deśe sa śuśrāva samantāt vadatāṃ nṛpa","hörte er an jenem Ort ringsum, von Sprechenden, o König (Lok.+Nom.+3.Sg.Perf.+Adv.+Gen.Part.+Vok.)"]]],["037","teṣāṃ tad vacanaṃ śrutvā dayāvān dīnabhāṣiṇām aho kṛcchram iti prāha tasthau sa ca yudhiṣṭhiraḥ","Als er jenes Wort jener kläglich Sprechenden vernommen hatte, voller Mitleid, rief er: „Ach, welche Not!“ - und Yudhiṣṭhira blieb stehen.","",[["teṣāṃ tat vacanaṃ śrutvā dayāvān dīnabhāṣiṇām","als er jenes Wort jener kläglich Sprechenden vernommen hatte, voller Mitleid (Gen.+Akk.+Abs.+Nom.Part.+Gen.Part.)"],["aho kṛcchram iti prāha tasthau sa ca yudhiṣṭhiraḥ","„ach, welche Not!“ rief er - und Yudhiṣṭhira blieb stehen (direkte Rede+3.Sg.Perf.+3.Sg.Perf.+Nom.)"]]],["038","sa tā giraḥ purastād vai śrutapūrvāḥ punaḥ punaḥ glānānāṃ duḥkhitānāṃ ca nābhyajānata pāṇḍavaḥ","Jene Stimmen, die er zuvor schon wiederholt gehört hatte, der Erschöpften und Leidenden, erkannte der Pāṇḍava nicht wieder.","",[["sa tā giraḥ purastāt vai śrutapūrvāḥ punaḥ punaḥ","jene Stimmen, die er zuvor schon wiederholt gehört hatte (Nom.Part.+Akk.+Adv.+Akk.Part.+Adv.)"],["glānānāṃ duḥkhitānāṃ ca na abhyajānata pāṇḍavaḥ","der Erschöpften und Leidenden, erkannte der Pāṇḍava nicht wieder (Gen.Part.+3.Sg.Impf.Med.+Nom.)"]]],["039","abudhyamānas tā vāco dharmaputro yudhiṣṭhiraḥ uvāca ke bhavanto vai kimartham iha tiṣṭhatha","Jene Stimmen nicht verstehend, sprach der Sohn des Dharma, Yudhiṣṭhira: „Wer seid ihr denn? Weshalb weilt ihr hier?“","",[["abudhyamānaḥ tā vācaḥ dharmaputraḥ yudhiṣṭhiraḥ","jene Stimmen nicht verstehend, der Sohn des Dharma, Yudhiṣṭhira (Nom.Part.+Akk.+Nom.)"],["uvāca ke bhavantaḥ vai kimartham iha tiṣṭhatha","sprach: wer seid ihr denn? Weshalb weilt ihr hier? (3.Sg.Perf.+Nom.+2.Pl.Präs.)"]]],["040","ity uktās te tataḥ sarve samantād avabhāṣire karṇo 'haṃ bhīmaseno 'ham arjuno 'ham iti prabho","So angesprochen, riefen sie dann alle ringsum, o Herr: „Ich bin Karṇa! Ich bin Bhīmasena! Ich bin Arjuna!","",[["iti uktāḥ te tataḥ sarve samantāt avabhāṣire","so angesprochen, riefen sie dann alle ringsum (Nom.Part.+Nom.+Adv.+Adv.+3.Pl.Impf.Med.)"],["karṇaḥ aham bhīmasenaḥ aham arjunaḥ aham iti prabho","„ich bin Karṇa! Ich bin Bhīmasena! Ich bin Arjuna!“, o Herr (direkte Rede+Vok.)"]]],["041","nakulaḥ sahadevo 'haṃ dhṛṣṭadyumno 'ham ity uta draupadī draupadeyāś ca ity evaṃ te vicukruśuḥ","Ich bin Nakula! Ich bin Sahadeva! Ich bin Dhṛṣṭadyumna! Und: Draupadī und die Söhne Draupadīs!“ - so schrien sie.","",[["nakulaḥ sahadevaḥ aham dhṛṣṭadyumnaḥ aham iti uta","„ich bin Nakula! Ich bin Sahadeva! Ich bin Dhṛṣṭadyumna!“ (direkte Rede+Partikel)"],["draupadī draupadeyāḥ ca iti evaṃ te vicukruśuḥ","„Draupadī und die Söhne Draupadīs!“ - so schrien sie (direkte Rede+Nom.+3.Pl.Perf.)"]]],["042","tā vācaḥ sā tadā śrutvā taddeśasadṛśīr nṛpa tato vimamṛśe rājā kiṃ nv idaṃ daivakāritam","Als er da jene Stimmen vernommen hatte, passend zu jenem Ort, o König, überlegte der König da, was dies wohl sei, durch das Schicksal bewirkt,","",[["tā vācaḥ sā tadā śrutvā taddeśasadṛśīḥ nṛpa","als er da jene Stimmen vernommen hatte, passend zu jenem Ort, o König (Akk.+Abs.+Akk.Part.+Vok.)"],["tataḥ vimamṛśe rājā kiṃ nu idaṃ daivakāritam","überlegte der König da, was dies wohl sei, durch das Schicksal bewirkt (Adv.+3.Sg.Perf.Med.+Nom.+Nom.Part.)"]]],["043","kiṃ nu tat kaluṣaṃ karma kṛtam ebhir mahātmabhiḥ karṇena draupadeyair vā pāñcālyā vā sumadhyayā","was wohl für eine befleckende Tat von diesen Hochgesinnten begangen worden sei, von Karṇa oder den Söhnen Draupadīs, oder von der schlankhüftigen Pāñcālī,","",[["kiṃ nu tat kaluṣaṃ karma kṛtam ebhiḥ mahātmabhiḥ","was wohl für eine befleckende Tat von diesen Hochgesinnten begangen worden sei (Nom.Part.+Instr.)"],["karṇena draupadeyaiḥ vā pāñcālyā vā sumadhyayā","von Karṇa oder den Söhnen Draupadīs, oder von der schlankhüftigen Pāñcālī (Instr.)"]]],["044","ya ime pāpagandhe 'smin deśe santi sudāruṇe na hi jānāmi sarveṣāṃ duṣkṛtaṃ puṇyakarmaṇām","dass sie sich an diesem von Sündengeruch erfüllten, überaus schrecklichen Ort befänden; er wisse ja nicht, welche Übeltat all diese, deren Taten doch fromm gewesen seien, begangen hätten -","",[["ye ime pāpagandhe asmin deśe santi sudāruṇe","dass sie sich an diesem von Sündengeruch erfüllten, überaus schrecklichen Ort befänden (Nom.Part.+Lok.+3.Pl.Präs.)"],["na hi jānāmi sarveṣāṃ duṣkṛtaṃ puṇyakarmaṇām","er wisse ja nicht, welche Übeltat all diese, deren Taten fromm waren, begangen hätten (1.Sg.Präs.+Gen.+Akk.+Gen.Part.)"]]],["045","kiṃ kṛtvā dhṛtarāṣṭrasya putro rājā suyodhanaḥ tathā śriyā yutaḥ pāpaḥ saha sarvaiḥ padānugaiḥ","und was habe wohl der Sohn Dhṛtarāṣṭras, König Suyodhana, getan, dass er, der Sünder, dennoch mit solchem Glanz ausgestattet sei, zusammen mit all seinen Gefolgsleuten,","",[["kiṃ kṛtvā dhṛtarāṣṭrasya putraḥ rājā suyodhanaḥ","was habe wohl der Sohn Dhṛtarāṣṭras, König Suyodhana, getan (Akk.+Abs.+Gen.+Nom.)"],["tathā śriyā yutaḥ pāpaḥ saha sarvaiḥ padānugaiḥ","dass er, der Sünder, dennoch mit solchem Glanz ausgestattet sei, zusammen mit all seinen Gefolgsleuten (Instr.+Nom.Part.+Nom.+Instr.)"]]],["046","mahendra iva lakṣmīvān āste paramapūjitaḥ kasyedānīṃ vikāro 'yaṃ yad ime narakaṃ gatāḥ","und wie der große Indra, glückerfüllt, höchst verehrt, throne - wessen Verkehrung sei dies nun, dass diese hier in die Hölle gegangen seien,","",[["mahendraḥ iva lakṣmīvān āste paramapūjitaḥ","und wie der große Indra, glückerfüllt, höchst verehrt, throne (Nom.+Nom.Part.+3.Sg.Präs.Med.+Nom.Part.)"],["kasya idānīṃ vikāraḥ ayaṃ yat ime narakaṃ gatāḥ","wessen Verkehrung sei dies nun, dass diese hier in die Hölle gegangen seien (Gen.+Adv.+Nom.+Nom.+Akk.+Nom.Part.)"]]],["047","sarvadharmavidaḥ śūrāḥ satyāgamaparāyaṇāḥ kṣātradharmaparāḥ prājñā yajvāno bhūridakṣiṇāḥ","sie, die alle Pflicht Kundigen, die Tapferen, die der Wahrheit und der heiligen Überlieferung Ergebenen, die der Kriegerpflicht Hingegebenen, die Weisen, die Opfernden mit reichen Priestergaben -","",[["sarvadharmavidaḥ śūrāḥ satyāgamaparāyaṇāḥ","die alle Pflicht Kundigen, die Tapferen, die der Wahrheit und der heiligen Überlieferung Ergebenen (Nom.)"],["kṣātradharmaparāḥ prājñāḥ yajvānaḥ bhūridakṣiṇāḥ","die der Kriegerpflicht Hingegebenen, die Weisen, die Opfernden mit reichen Priestergaben (Nom.)"]]],["048","kiṃ nu supto 'smi jāgarmi cetayāno na cetaye aho cittavikāro 'yaṃ syād vā me cittavibhramaḥ","ob er wohl schlafe oder wache, ob er, bei Bewusstsein, doch nicht bei Bewusstsein sei - ach, ob dies eine Verwirrung seines Geistes sei, oder eine Täuschung seines Sinnes.","",[["kiṃ nu suptaḥ asmi jāgarmi cetayānaḥ na cetaye","ob er wohl schlafe oder wache, ob er, bei Bewusstsein, doch nicht bei Bewusstsein sei (Nom.Part.+1.Sg.Präs.+1.Sg.Präs.+Nom.Part.+1.Sg.Präs.Med.)"],["aho cittavikāraḥ ayaṃ syāt vā me cittavibhramaḥ","ach, ob dies eine Verwirrung seines Geistes sei, oder eine Täuschung seines Sinnes (Nom.+3.Sg.Opt.+Gen.+Nom.)"]]],["049","evaṃ bahuvidhaṃ rājā vimamarśa yudhiṣṭhiraḥ duḥkhaśokasamāviṣṭaś cintāvyākulitendriyaḥ","So auf vielerlei Weise überlegte der König Yudhiṣṭhira, von Leid und Kummer erfüllt, seine Sinne von Grübeln verwirrt.","",[["evaṃ bahuvidhaṃ rājā vimamarśa yudhiṣṭhiraḥ","so auf vielerlei Weise überlegte der König Yudhiṣṭhira (Adv.+Nom.+3.Sg.Perf.+Nom.)"],["duḥkhaśokasamāviṣṭaḥ cintāvyākulitendriyaḥ","von Leid und Kummer erfüllt, seine Sinne von Grübeln verwirrt (Nom.Part.+Nom.Part.)"]]],["050","krodham āhārayac caiva tīvraṃ dharmasuto nṛpaḥ devāṃś ca garhayām āsa dharmaṃ caiva yudhiṣṭhiraḥ","Und der König, der Sohn des Dharma, geriet in heftigen Zorn; und Yudhiṣṭhira tadelte sowohl die Götter als auch den Dharma.","",[["krodham āhārayat ca eva tīvraṃ dharmasutaḥ nṛpaḥ","und der König, der Sohn des Dharma, geriet in heftigen Zorn (Akk.+3.Sg.Impf.+Akk.+Nom.+Nom.)"],["devān ca garhayām āsa dharmaṃ ca eva yudhiṣṭhiraḥ","und Yudhiṣṭhira tadelte sowohl die Götter als auch den Dharma (Akk.+3.Sg.Perf.+Akk.+Nom.)"]]],["051","sa tīvragandhasaṃtapto devadūtam uvāca ha gamyatāṃ bhadra yeṣāṃ tvaṃ dūtas teṣām upāntikam","Er, von dem heftigen Gestank gequält, sprach zum Götterboten: „Geh, guter Mann, zu denen, deren Bote du bist, in ihre Nähe.","",[["sa tīvragandhasaṃtaptaḥ devadūtam uvāca ha","er, von dem heftigen Gestank gequält, sprach zum Götterboten (Nom.Part.+Akk.+3.Sg.Perf.)"],["gamyatāṃ bhadra yeṣāṃ tvaṃ dūtaḥ teṣām upāntikam","geh, guter Mann, zu denen, deren Bote du bist, in ihre Nähe (Imp.Pass.+Vok.+Gen.+Nom.+Nom.+Gen.+Akk.)"]]],["052","na hy ahaṃ tatra yāsyāmi sthito 'smīti nivedyatām matsaṃśrayād ime dūta sukhino bhrātaro hi me","Denn ich werde nicht dorthin gehen; es sei berichtet: ‚Ich bleibe hier.‘ Durch die Zuflucht bei mir sind diese, meine Brüder, ja glücklich, Bote.“","",[["na hi aham tatra yāsyāmi sthitaḥ asmi iti nivedyatām","denn ich werde nicht dorthin gehen; „ich bleibe hier“ - es sei berichtet (1.Sg.Fut.+Nom.Part.+1.Sg.Präs.+direkte Rede+Imp.Pass.)"],["matsaṃśrayāt ime dūta sukhinaḥ bhrātaraḥ hi me","durch die Zuflucht bei mir sind diese, meine Brüder, ja glücklich, Bote (Abl.+Nom.+Vok.+Nom.+Nom.+Gen.)"]]],["053","ity uktaḥ sa tadā dūtaḥ pāṇḍuputreṇa dhīmatā jagāma tatra yatrāste devarājaḥ śatakratuḥ","So angesprochen, ging jener Bote da, von dem weisen Sohn des Pāṇḍu, dorthin, wo der Götterkönig Śatakratu weilte,","[Anm.: Śatakratu = Beiname Indras ('der Hundert-Opfer-Vollbringer').]",[["iti uktaḥ sa tadā dūtaḥ pāṇḍuputreṇa dhīmatā","so angesprochen, jener Bote da, von dem weisen Sohn des Pāṇḍu (Nom.Part.+Nom.+Instr.Part.)"],["jagāma tatra yatra āste devarājaḥ śatakratuḥ","ging dorthin, wo der Götterkönig Śatakratu weilte (3.Sg.Perf.+Adv.+Adv.+3.Sg.Präs.Med.+Nom.)"]]],["054","nivedayām āsa ca tad dharmarājacikīrṣitam yathoktaṃ dharmaputreṇa sarvam eva janādhipa","und berichtete das Vorhaben des Rechtskönigs, ganz wie es von dem Sohn des Dharma gesprochen worden war, Herrscher der Menschen.","[Anm.: Ende des Kapitels; Fortsetzung mit Indras Antwort in Kap.3.]",[["nivedayām āsa ca tat dharmarājacikīrṣitam","und berichtete das Vorhaben des Rechtskönigs (3.Sg.Perf.+Akk.)"],["yathoktaṃ dharmaputreṇa sarvam eva janādhipa","ganz wie es von dem Sohn des Dharma gesprochen worden war, Herrscher der Menschen (Akk.Part.+Instr.+Akk.+Vok.)"]]]]},{"num":3,"title_sa":"","title_de":"Die Auflösung der Täuschung und Yudhiṣṭhiras Himmelfahrt","note":"","units":[["001","vaiśaṃpāyana uvāca sthite muhūrtaṃ pārthe tu dharmarāje yudhiṣṭhire ājagmus tatra kauravya devāḥ śakrapurogamāḥ","Vaiśaṃpāyana sprach: Während der Pārtha, der Rechtskönig Yudhiṣṭhira, dort einen Augenblick verweilte, kamen dort die Götter herbei, angeführt von Śakra, Kaurava.","",[["vaiśaṃpāyanaḥ uvāca sthite muhūrtaṃ pārthe tu","Vaiśaṃpāyana sprach: während der Pārtha einen Augenblick verweilte (3.Sg.Perf.+Lok.Abs.+Akk.)"],["dharmarāje yudhiṣṭhire ājagmuḥ tatra kauravya devāḥ śakrapurogamāḥ","der Rechtskönig Yudhiṣṭhira, kamen dort die Götter herbei, angeführt von Śakra, Kaurava (Lok.+3.Pl.Perf.+Adv.+Vok.+Nom.+Nom.Part.)"]]],["002","svayaṃ vigrahavān dharmo rājānaṃ prasamīkṣitum tatrājagāma yatrāsau kururājo yudhiṣṭhiraḥ","Der Dharma selbst, verkörpert, kam dorthin, um den König zu betrachten, wo jener Kuru-König Yudhiṣṭhira war.","",[["svayaṃ vigrahavān dharmaḥ rājānaṃ prasamīkṣitum","der Dharma selbst, verkörpert, um den König zu betrachten (Adv.+Nom.Part.+Nom.+Akk.+Inf.)"],["tatra ājagāma yatra asau kururājaḥ yudhiṣṭhiraḥ","kam dorthin, wo jener Kuru-König Yudhiṣṭhira war (Adv.+3.Sg.Perf.+Adv.+Nom.+Nom.)"]]],["003","teṣu bhāsvaradeheṣu puṇyābhijanakarmasu samāgateṣu deveṣu vyagamat tat tamo nṛpa","Als jene Götter, mit leuchtenden Leibern, von heiliger Abkunft und Taten, versammelt waren, verschwand jene Finsternis, o König.","",[["teṣu bhāsvaradeheṣu puṇyābhijanakarmasu samāgateṣu deveṣu","als jene Götter, mit leuchtenden Leibern, von heiliger Abkunft und Taten, versammelt waren (Lok.Abs.)"],["vyagamat tat tamaḥ nṛpa","verschwand jene Finsternis, o König (3.Sg.Impf.+Nom.+Vok.)"]]],["004","nādṛśyanta ca tās tatra yātanāḥ pāpakarmiṇām nadī vaitaraṇī caiva kūṭaśālmalinā saha","Und nicht mehr sichtbar waren dort jene Qualen der Übeltäter, noch der Fluss Vaitaraṇī, noch der trügerische Śālmali-Baum,","",[["na adṛśyanta ca tāḥ tatra yātanāḥ pāpakarmiṇām","und nicht mehr sichtbar waren dort jene Qualen der Übeltäter (3.Pl.Impf.Pass.+Nom.+Gen.)"],["nadī vaitaraṇī ca eva kūṭaśālmalinā saha","noch der Fluss Vaitaraṇī, noch der trügerische Śālmali-Baum (Nom.+Instr.)"]]],["005","lohakumbhyaḥ śilāś caiva nādṛśyanta bhayānakāḥ vikṛtāni śarīrāṇi yāni tatra samantataḥ dadarśa rājā kaunteyas tāny adṛśyāni cābhavan","die eisernen Kessel und die Felsen, die schrecklichen, waren nicht mehr sichtbar; die entstellten Leiber, die der König, der Sohn der Kuntī, dort ringsum gesehen hatte, wurden gleichfalls unsichtbar.","",[["lohakumbhyaḥ śilāḥ ca eva na adṛśyanta bhayānakāḥ","die eisernen Kessel und die Felsen, die schrecklichen, waren nicht mehr sichtbar (Nom.+3.Pl.Impf.Pass.+Nom.Part.)"],["vikṛtāni śarīrāṇi yāni tatra samantataḥ dadarśa rājā kaunteyaḥ","die entstellten Leiber, die der König, der Sohn der Kuntī, dort ringsum gesehen hatte (Akk.Part.+Akk.+Adv.+3.Sg.Perf.+Nom.)"],["tāni adṛśyāni ca abhavan","wurden gleichfalls unsichtbar (Nom.+Nom.Part.+3.Pl.Impf.)"]]],["006","tato vāyuḥ sukhasparśaḥ puṇyagandhavahaḥ śivaḥ vavau devasamīpasthaḥ śītalo 'tīva bhārata","Dann wehte ein Wind, angenehm zu berühren, heiligen Duft tragend, heilvoll, in der Nähe der Götter, überaus kühl, Bhārata.","",[["tataḥ vāyuḥ sukhasparśaḥ puṇyagandhavahaḥ śivaḥ","dann ein Wind, angenehm zu berühren, heiligen Duft tragend, heilvoll (Adv.+Nom.)"],["vavau devasamīpasthaḥ śītalaḥ atīva bhārata","wehte, in der Nähe der Götter, überaus kühl, Bhārata (3.Sg.Perf.+Nom.Part.+Nom.+Adv.+Vok.)"]]],["007","marutaḥ saha śakreṇa vasavaś cāśvinau saha sādhyā rudrās tathādityā ye cānye 'pi divaukasaḥ","Die Maruts mit Śakra, die Vasus und die beiden Aśvins, die Sādhyas, die Rudras, ebenso die Ādityas, und wer sonst noch an Himmelsbewohnern war -","",[["marutaḥ saha śakreṇa vasavaḥ ca aśvinau saha","die Maruts mit Śakra, die Vasus und die beiden Aśvins (Nom.+Instr.+Nom.+Nom.Dual+Instr.)"],["sādhyāḥ rudrāḥ tathā ādityāḥ ye ca anye api divaukasaḥ","die Sādhyas, die Rudras, ebenso die Ādityas, und wer sonst noch an Himmelsbewohnern war (Nom.)"]]],["008","sarve tatra samājagmuḥ siddhāś ca paramarṣayaḥ yatra rājā mahātejā dharmaputraḥ sthito 'bhavat","alle versammelten sich dort, und die Vollendeten und die höchsten Seher, wo der König, der Glanzvolle, der Sohn des Dharma, stand.","",[["sarve tatra samājagmuḥ siddhāḥ ca paramarṣayaḥ","alle versammelten sich dort, und die Vollendeten und die höchsten Seher (Nom.+3.Pl.Perf.+Nom.)"],["yatra rājā mahātejā dharmaputraḥ sthitaḥ abhavat","wo der König, der Glanzvolle, der Sohn des Dharma, stand (Adv.+Nom.+Nom.Part.+3.Sg.Impf.)"]]],["009","tataḥ śakraḥ surapatiḥ śriyā paramayā yutaḥ yudhiṣṭhiram uvācedaṃ sāntvapūrvam idaṃ vacaḥ","Dann sprach Śakra, der Herr der Götter, mit höchstem Glanz ausgestattet, zu Yudhiṣṭhira dieses tröstende Wort:","",[["tataḥ śakraḥ surapatiḥ śriyā paramayā yutaḥ","dann Śakra, der Herr der Götter, mit höchstem Glanz ausgestattet (Adv.+Nom.+Instr.+Nom.Part.)"],["yudhiṣṭhiram uvāca idaṃ sāntvapūrvam idaṃ vacaḥ","sprach zu Yudhiṣṭhira dieses tröstende Wort (Akk.+3.Sg.Perf.+Akk.+Akk.)"]]],["010","yudhiṣṭhira mahābāho prītā devagaṇās tava ehy ehi puruṣavyāghra kṛtam etāvatā vibho siddhiḥ prāptā tvayā rājaṃl lokāś cāpy akṣayās tava","„Yudhiṣṭhira, Starkarmiger, die Scharen der Götter sind erfreut über dich; komm, komm, Tiger unter den Männern! Vollbracht ist damit [dein Werk], Erhabener; die Vollendung hast du erlangt, o König, und unvergänglich sind auch deine Welten.","",[["yudhiṣṭhira mahābāho prītāḥ devagaṇāḥ tava","Yudhiṣṭhira, Starkarmiger, die Scharen der Götter sind erfreut über dich (Vok.+Nom.Part.+Nom.+Gen.)"],["ehi ehi puruṣavyāghra kṛtam etāvatā vibho","komm, komm, Tiger unter den Männern! Vollbracht ist damit, Erhabener (Imp.+Vok.+Nom.Part.+Instr.+Vok.)"],["siddhiḥ prāptā tvayā rājan lokāḥ ca api akṣayāḥ tava","die Vollendung hast du erlangt, o König, und unvergänglich sind auch deine Welten (Nom.+Nom.Part.+Instr.+Vok.+Nom.+Nom.)"]]],["011","na ca manyus tvayā kāryaḥ śṛṇu cedaṃ vaco mama avaśyaṃ narakas tāta draṣṭavyaḥ sarvarājabhiḥ","Und keinen Zorn sollst du hegen; höre dieses mein Wort: Unvermeidlich, mein Sohn, muss die Hölle von allen Königen geschaut werden.","",[["na ca manyuḥ tvayā kāryaḥ śṛṇu ca idaṃ vacaḥ mama","und keinen Zorn sollst du hegen; höre dieses mein Wort (Nom.+Instr.+Nom.Part.+Imp.+Akk.+Gen.)"],["avaśyaṃ narakaḥ tāta draṣṭavyaḥ sarvarājabhiḥ","unvermeidlich, mein Sohn, muss die Hölle von allen Königen geschaut werden (Adv.+Nom.+Vok.+Nom.Part.+Instr.)"]]],["012","śubhānām aśubhānāṃ ca dvau rāśī puruṣarṣabha yaḥ pūrvaṃ sukṛtaṃ bhuṅkte paścān nirayam eti saḥ pūrvaṃ narakabhāgyas tu paścāt svargam upaiti saḥ","Zwei Kategorien gibt es, der heilvollen und der unheilvollen [Taten], Stier unter den Männern: wer zuerst die Frucht guter Taten genießt, der geht danach zur Hölle; wessen Anteil aber zuerst die Hölle ist, der erlangt danach den Himmel.","",[["śubhānām aśubhānāṃ ca dvau rāśī puruṣarṣabha","zwei Kategorien gibt es, der heilvollen und der unheilvollen, Stier unter den Männern (Gen.+Nom.Dual+Vok.)"],["yaḥ pūrvaṃ sukṛtaṃ bhuṅkte paścāt nirayam eti saḥ","wer zuerst die Frucht guter Taten genießt, der geht danach zur Hölle (Nom.Part.+Adv.+Akk.+3.Sg.Präs.+Adv.+Akk.+3.Sg.Präs.+Nom.)"],["pūrvaṃ narakabhāgyaḥ tu paścāt svargam upaiti saḥ","wessen Anteil aber zuerst die Hölle ist, der erlangt danach den Himmel (Adv.+Nom.+Adv.+Akk.+3.Sg.Präs.+Nom.)"]]],["013","bhūyiṣṭhaṃ pāpakarmā yaḥ sa pūrvaṃ svargam aśnute tena tvam evaṃ gamito mayā śreyorthinā nṛpa","Wer überwiegend Sünde getan hat, der genießt zuerst den Himmel; deshalb wurdest du auf diese Weise von mir, dem um dein Wohl Bemühten, geführt, o König.","",[["bhūyiṣṭhaṃ pāpakarmā yaḥ sa pūrvaṃ svargam aśnute","wer überwiegend Sünde getan hat, der genießt zuerst den Himmel (Akk.+Nom.Part.+Nom.+Adv.+Akk.+3.Sg.Präs.)"],["tena tvam evaṃ gamitaḥ mayā śreyorthinā nṛpa","deshalb wurdest du auf diese Weise von mir, dem um dein Wohl Bemühten, geführt, o König (Adv.+Nom.+Adv.+Nom.Part.+Instr.+Instr.Part.+Vok.)"]]],["014","vyājena hi tvayā droṇa upacīrṇaḥ sutaṃ prati vyājenaiva tato rājan darśito narakas tava","Denn durch eine List hast du einst Droṇa hinsichtlich seines Sohnes getäuscht; durch eine List ebenso, o König, wurde dir nun die Hölle gezeigt.","[Anm.: Bezug auf die zweideutige Aussage „aśvatthāmā hataḥ - naro vā kuñjaro vā“ (Aśvatthāman ist tot - [ein] Elefant [namens Aśvatthāman], oder [der Mensch] Aśvatthāman?), mit der Yudhiṣṭhira Droṇa im Kampf in die Irre führte.]",[["vyājena hi tvayā droṇaḥ upacīrṇaḥ sutaṃ prati","denn durch eine List hast du Droṇa hinsichtlich seines Sohnes getäuscht (Instr.+Nom.+Nom.Part.+Akk.)"],["vyājena eva tataḥ rājan darśitaḥ narakaḥ tava","durch eine List ebenso, o König, wurde dir die Hölle gezeigt (Instr.+Adv.+Vok.+Nom.Part.+Nom.+Gen.)"]]],["015","yathaiva tvaṃ tathā bhīmas tathā pārtho yamau tathā draupadī ca tathā kṛṣṇā vyājena narakaṃ gatāḥ","Ebenso wie du, so Bhīma, so der Pārtha, so die beiden Zwillinge, so Draupadī - ja, so Kṛṣṇā [derselbe Name] - durch eine List gingen sie [scheinbar] zur Hölle.","[Anm.: Draupadī und Kṛṣṇā sind derselbe Name (Beiname Draupadīs); die Doppelnennung dient der Betonung.]",[["yathā eva tvaṃ tathā bhīmaḥ tathā pārthaḥ yamau tathā","ebenso wie du, so Bhīma, so der Pārtha, so die beiden Zwillinge (Adv.+Nom.+Nom.+Nom.Dual)"],["draupadī ca tathā kṛṣṇā vyājena narakaṃ gatāḥ","so Draupadī, ja so Kṛṣṇā - durch eine List gingen sie zur Hölle (Nom.+Instr.+Akk.+Nom.Part.)"]]],["016","āgaccha naraśārdūla muktās te caiva kilbiṣāt svapakṣāś caiva ye tubhyaṃ pārthivā nihatā raṇe sarve svargam anuprāptās tān paśya puruṣarṣabha","Komm, Tiger unter den Männern; befreit seid ihr von aller Schuld. Und auch jene Fürsten deiner eigenen Partei, die für dich im Kampf erschlagen wurden - alle haben sie den Himmel erlangt; sieh sie, Stier unter den Männern.","",[["āgaccha naraśārdūla muktāḥ te ca eva kilbiṣāt","komm, Tiger unter den Männern; befreit seid ihr von aller Schuld (Imp.+Vok.+Nom.Part.+Nom.+Abl.)"],["svapakṣāḥ ca eva ye tubhyaṃ pārthivāḥ nihatāḥ raṇe","und auch jene Fürsten deiner eigenen Partei, die für dich im Kampf erschlagen wurden (Nom.+Nom.Part.+Dat.+Nom.+Nom.Part.+Lok.)"],["sarve svargam anuprāptāḥ tān paśya puruṣarṣabha","alle haben sie den Himmel erlangt; sieh sie, Stier unter den Männern (Nom.+Akk.+Nom.Part.+Akk.+Imp.+Vok.)"]]],["017","karṇaś caiva maheṣvāsaḥ sarvaśastrabhṛtāṃ varaḥ sa gataḥ paramāṃ siddhiṃ yadarthaṃ paritapyase","Und Karṇa, der große Bogenschütze, der Beste aller Waffenträger - er hat die höchste Vollendung erlangt, um dessentwillen du dich grämst.","",[["karṇaḥ ca eva maheṣvāsaḥ sarvaśastrabhṛtāṃ varaḥ","und Karṇa, der große Bogenschütze, der Beste aller Waffenträger (Nom.+Gen.+Nom.)"],["sa gataḥ paramāṃ siddhiṃ yadarthaṃ paritapyase","er hat die höchste Vollendung erlangt, um dessentwillen du dich grämst (Nom.+Nom.Part.+Akk.+Adv.+2.Sg.Präs.Med.)"]]],["018","taṃ paśya puruṣavyāghram ādityatanayaṃ vibho svasthānasthaṃ mahābāho jahi śokaṃ nararṣabha","Sieh ihn, den Tiger unter den Männern, den Sohn der Āditya, Erhabener; an seinem eigenen Ort weilend, Starkarmiger; wirf den Kummer ab, Stier der Männer.","",[["taṃ paśya puruṣavyāghram ādityatanayaṃ vibho","sieh ihn, den Tiger unter den Männern, den Sohn der Āditya, Erhabener (Akk.+Imp.+Akk.+Akk.+Vok.)"],["svasthānasthaṃ mahābāho jahi śokaṃ nararṣabha","an seinem eigenen Ort weilend, Starkarmiger; wirf den Kummer ab, Stier der Männer (Akk.Part.+Vok.+Imp.+Akk.+Vok.)"]]],["019","bhrātṝṃś cānyāṃs tathā paśya svapakṣāṃś caiva pārthivān svaṃ svaṃ sthānam anuprāptān vyetu te mānaso jvaraḥ","Und sieh auch die anderen Brüder, und auch die Fürsten deiner eigenen Partei, die je ihren eigenen Ort erlangt haben; es weiche von dir das Fieber des Geistes.","",[["bhrātṝn ca anyān tathā paśya svapakṣān ca eva pārthivān","und sieh auch die anderen Brüder, und auch die Fürsten deiner eigenen Partei (Akk.+Imp.+Akk.)"],["svaṃ svaṃ sthānam anuprāptān vyetu te mānasaḥ jvaraḥ","die je ihren eigenen Ort erlangt haben; es weiche von dir das Fieber des Geistes (Akk.+Akk.Part.+Imp.+Gen.+Nom.+Nom.)"]]],["020","anubhūya pūrvaṃ tvaṃ kṛcchram itaḥ prabhṛti kaurava viharasva mayā sārdhaṃ gataśoko nirāmayaḥ","Nachdem du zuvor Bedrängnis erfahren hast, sollst du von nun an, Kaurava, mit mir zusammen weilen, des Kummers ledig, ohne Leiden.","",[["anubhūya pūrvaṃ tvaṃ kṛcchram itaḥ prabhṛti kaurava","nachdem du zuvor Bedrängnis erfahren hast, von nun an, Kaurava (Abs.+Adv.+Nom.+Akk.+Adv.+Vok.)"],["viharasva mayā sārdhaṃ gataśokaḥ nirāmayaḥ","sollst du mit mir zusammen weilen, des Kummers ledig, ohne Leiden (Imp.Med.+Instr.+Adv.+Nom.Part.+Nom.)"]]],["021","karmaṇāṃ tāta puṇyānāṃ jitānāṃ tapasā svayam dānānāṃ ca mahābāho phalaṃ prāpnuhi pāṇḍava","Die Frucht der heilvollen Taten, mein Sohn, die durch eigene Askese errungen wurden, und der Gaben, Starkarmiger, empfange, Pāṇḍava.","",[["karmaṇāṃ tāta puṇyānāṃ jitānāṃ tapasā svayam","der heilvollen Taten, mein Sohn, die durch eigene Askese errungen wurden (Gen.+Vok.+Gen.Part.+Gen.Part.+Instr.+Adv.)"],["dānānāṃ ca mahābāho phalaṃ prāpnuhi pāṇḍava","und der Gaben, Starkarmiger, die Frucht empfange, Pāṇḍava (Gen.+Vok.+Akk.+Imp.+Vok.)"]]],["022","adya tvāṃ devagandharvā divyāś cāpsaraso divi upasevantu kalyāṇaṃ virajombaravāsasaḥ","Heute mögen dir die Götter und Gandharvas, und die himmlischen Apsaras im Himmel aufwarten, dir, dem Heilvollen, in staublose Luftgewänder Gekleideten.","",[["adya tvāṃ devagandharvāḥ divyāḥ ca apsarasaḥ divi upasevantu","heute mögen dir die Götter und Gandharvas, und die himmlischen Apsaras im Himmel aufwarten (Adv.+Akk.+Nom.+Nom.Part.+Nom.+Lok.+3.Pl.Imp.)"],["kalyāṇaṃ virajombaravāsasaḥ","dir, dem Heilvollen, in staublose Luftgewänder Gekleideten (Akk.)"]]],["023","rājasūyajitāṃl lokān aśvamedhābhivardhitān prāpnuhi tvaṃ mahābāho tapasaś ca phalaṃ mahat","Die durch das Rājasūya-Opfer gewonnenen Welten, durch das Aśvamedha vermehrten, erlange du, Starkarmiger, und die große Frucht der Askese.","",[["rājasūyajitān lokān aśvamedhābhivardhitān","die durch das Rājasūya-Opfer gewonnenen Welten, durch das Aśvamedha vermehrten (Akk.Part.+Akk.+Akk.Part.)"],["prāpnuhi tvaṃ mahābāho tapasaḥ ca phalaṃ mahat","erlange du, Starkarmiger, und die große Frucht der Askese (Imp.+Nom.+Vok.+Gen.+Akk.+Akk.)"]]],["024","upary upari rājñāṃ hi tava lokā yudhiṣṭhira hariścandrasamāḥ pārtha yeṣu tvaṃ vihariṣyasi","Höher und höher als die der [anderen] Könige sind deine Welten, Yudhiṣṭhira, den Welten Hariścandras gleich, Pārtha, in denen du weilen wirst.","",[["upari upari rājñāṃ hi tava lokāḥ yudhiṣṭhira","höher und höher als die der Könige sind deine Welten, Yudhiṣṭhira (Adv.+Gen.+Gen.+Nom.+Vok.)"],["hariścandrasamāḥ pārtha yeṣu tvaṃ vihariṣyasi","den Welten Hariścandras gleich, Pārtha, in denen du weilen wirst (Nom.+Vok.+Lok.+Nom.+2.Sg.Fut.)"]]],["025","māndhātā yatra rājarṣir yatra rājā bhagīrathaḥ dauḥṣantir yatra bharatas tatra tvaṃ vihariṣyasi","Wo der königliche Weise Māndhātā ist, wo König Bhagīratha, wo Bharata, Sohn der Dauḥṣantī [Śakuntalā] - dort wirst du weilen.","",[["māndhātā yatra rājarṣiḥ yatra rājā bhagīrathaḥ","wo der königliche Weise Māndhātā ist, wo König Bhagīratha (Nom.+Adv.+Nom.+Adv.+Nom.+Nom.)"],["dauḥṣantiḥ yatra bharataḥ tatra tvaṃ vihariṣyasi","wo Bharata, Sohn der Dauḥṣa
