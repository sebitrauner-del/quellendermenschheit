 von diesem getötet - ein Ereignis, das mit der Tötung Andhakas durch Śiva verglichen wird."},{"term":"Drumasena","category":"Krieger","definition":"Krieger auf Kaurava-Seite; wird in Kap.145 im nächtlichen Kampf von Dhṛṣṭadyumna zunächst mit Pfeilen getroffen, ruft ihm dabei zweimal 'Bleib stehen!' zu, wird dann jedoch enthauptet. In einem nur teilweise bezeugten Apparatus-Einschub erscheint er unter der Namensvariante 'Dyumatsena' als soeben getötet - nicht zu verwechseln mit dem gleichnamigen, blind gewordenen König der Śālvas und Vater Satyavants aus der Sāvitrī-Erzählung."},{"term":"Alaṃbala","category":"Krieger","definition":"Mächtiger Sohn des Rākṣasa Jaṭāsura (der einst von Bhīma in einem Ringkampf erschlagen wurde); tritt in Droṇaparva Adh.149 zu Duryodhana und bittet um Erlaubnis, aus Rache die Pāṇḍavas zu töten und ihr Fleisch zu verzehren, wird stattdessen auf Duryodhanas Geheiß gegen Ghaṭotkaca entsandt. Liefert sich mit diesem in mehrfach wechselndem Gestaltenkampf (Illusionswaffen, Faustkampf, Ringkampf) ein langes nächtliches Duell und wird schließlich von Ghaṭotkaca zu Boden geschmettert und enthauptet. [Anm.: Der Name ist von dem andernorts auftretenden, ähnlich klingenden Rākṣasa Alambusa/Alambuṣa zu unterscheiden.]"},{"term":"Jarāsaṃdha","category":"Person","definition":"Mächtiger König von Magadha, Feind Kṛṣṇas und der Vṛṣṇis; wird in Kap.155 von Kṛṣṇa rückblickend als einer der Gegner genannt, die durch von ihm selbst ersonnene Kunstgriffe (yogas) getötet wurden, zum Nutzen der Pāṇḍavas - eine Anspielung auf seinen Tod im Ringkampf gegen Bhīmasena, den Kṛṣṇa durch einen Hinweis (das Zerreißen des Körpers entlang der Symmetrieachse) ermöglichte. In Kap.156 erzählt Kṛṣṇa den Hergang näher: Jarāsaṃdha schleuderte seine glutrote Keule gegen die Vṛṣṇis, doch Balarāma wehrte sie mit der Sthūṇākarṇa-Astra ab; erst dadurch seiner Waffe beraubt, wurde er von Bhīmasena im Ringkampf getötet - mit Waffe in der Hand wäre er selbst für die Götter samt Indra unbesiegbar gewesen."},{"term":"Sthūṇākarṇa","category":"Waffe","definition":"Name einer Astra, die Balarāma in Kap.156 zur Abwehr von Jarāsaṃdhas glutroter Keule einsetzt und sie damit zu Boden schlägt; sonst kaum belegter Waffenname."}],"divisions":[{"key":"adi","name":"Ādiparva","desc":"Das Buch des Anfangs: Herkunft der Kuru-Dynastie, Geburt und Kindheit der Pāṇḍavas und Kauravas, Draupadīs Svayaṃvara – und die hier beginnende Rahmenerzählung.","intro":"Das erste der 18 Bücher. Es enthält, bevor die eigentliche Vorgeschichte der Kuru-Dynastie einsetzt, die Rahmenerzählung: Der Sūta-Sohn Ugraśravas trifft im Naimiṣa-Wald bei Śaunakas zwölfjährigem Opfer ein und wird gebeten, die von Vyāsa verfasste und von Vaiśampāyana am Schlangenopfer des Königs Janamejaya vorgetragene Geschichte zu erzählen. [Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"sabha","name":"Sabhāparva","desc":"Das Buch der Versammlungshalle: Yudhiṣṭhiras Königsweihe (Rājasūya), das schicksalhafte Würfelspiel, Draupadīs Demütigung und die Verbannung der Pāṇḍavas.","intro":"[Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"vana","name":"Vanaparva (Āraṇyakaparva)","desc":"Das Waldbuch: die zwölf Exiljahre der Pāṇḍavas, mit zahlreichen eingelagerten Erzählungen (u. a. Nala und Damayantī, Savitrī).","intro":"[Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"virata","name":"Virāṭaparva","desc":"Das Buch des Virāṭa: das dreizehnte, im Verborgenen zu verbringende Jahr am Hof des Königs Virāṭa.","intro":"[Vollständig in Teil 1 dieser Ausgabe enthalten.]","chapters":[]},{"key":"udyoga","name":"Udyogaparva (Fortsetzung ab Kap.49)","desc":"Das Buch der Kriegsvorbereitung: gescheiterte Friedensverhandlungen, Kṛṣṇas Gesandtschaft, die Mobilmachung beider Heere.","intro":"Kapitel 1-48 dieses Parvas befinden sich in Teil 1 dieser Ausgabe; hier wird die Übersetzung ab Kapitel 49 fortgesetzt.","chapters":[]},{"key":"bhishma","name":"Bhīṣmaparva","desc":"Das Buch des Bhīṣma: Beginn der Schlacht von Kurukṣetra unter Bhīṣmas Oberbefehl; enthält die Bhagavadgītā.","chapters":[]},{"key":"drona","name":"Droṇaparva","desc":"Das Buch des Droṇa: die Schlacht unter Droṇas Führung, der Tod Abhimanyus.","chapters":[]},{"key":"karna","name":"Karṇaparva","desc":"Das Buch des Karṇa: die Schlacht unter Karṇas Führung und sein Zweikampf mit Arjuna.","chapters":[]},{"key":"shalya","name":"Śalyaparva","desc":"Das Buch des Śalya: die letzte Phase der Schlacht und Duryodhanas Fall.","chapters":[]},{"key":"sauptika","name":"Sauptikaparva","desc":"Das Buch des nächtlichen Überfalls: Aśvatthāmans Rachefeldzug im Schlaf der Feinde.","chapters":[]},{"key":"stri","name":"Strīparva","desc":"Das Buch der Frauen: die Totenklage der Frauen auf dem Schlachtfeld von Kurukṣetra.","chapters":[]},{"key":"shanti","name":"Śāntiparva","desc":"Das Buch des Friedens: Yudhiṣṭhiras Krönung und Bhīṣmas ausführliche Lehren über Dharma, Herrschaft und Erlösung.","chapters":[]},{"key":"anushasana","name":"Anuśāsanaparva","desc":"Das Buch der Unterweisung: weitere Lehren Bhīṣmas, u. a. über rechte Gaben und Pflichten, sowie sein Tod.","chapters":[]},{"key":"ashvamedhika","name":"Āśvamedhikaparva","desc":"Das Buch des Pferdeopfers: Yudhiṣṭhiras Aśvamedha-Opfer.","chapters":[]},{"key":"ashramavasika","name":"Āśramavāsikaparva","desc":"Das Buch des Einsiedlerlebens: Dhṛtarāṣṭra, Gāndhārī und Kuntī ziehen in den Wald; ihr Tod.","chapters":[{"num":31,"title_sa":"pāṇḍavānāṃ dhṛtarāṣṭreṇa kuntyā gāndhāryā ca punarmilanam","title_de":"Das Wiedersehen der Pāṇḍavas mit Dhṛtarāṣṭra, Kuntī und Gāndhārī","note":"","units":[["001","vaiśaṃpāyana uvāca tatas te pāṇḍavā dūrād avatīrya padātayaḥ abhijagmur narapater āśramaṃ vinayānatāḥ","Vaiśaṃpāyana sprach: Dann stiegen jene Pāṇḍavas von ferne ab, zu Fuß, und näherten sich, in Demut gebeugt, der Einsiedelei des Herrschers der Menschen.","",[["dūrād avatīrya padātayaḥ","von ferne abgestiegen, zu Fuß (Abl. + Abs. + Nom. Pl.)"],["abhijagmur vinayānatāḥ","näherten sich, in Demut gebeugt (Perf. + Nom. Pl.)"]]],["002","sa ca paurajanaḥ sarvo ye ca rāṣṭranivāsinaḥ striyaś ca kurumukhyānāṃ padbhir evānvayus tadā","Und das ganze Bürgervolk, und die Landbewohner, und die Frauen der Kuru-Häupter, folgten da ebenfalls zu Fuß.","",[["paurajanaḥ rāṣṭranivāsinaḥ","das Bürgervolk, die Landbewohner (Nom.)"],["padbhir evānvayus tadā","folgten da ebenfalls zu Fuß (Instr. + Perf.)"]]],["003","āśramaṃ te tato jagmur dhṛtarāṣṭrasya pāṇḍavāḥ śūnyaṃ mṛgagaṇākīrṇaṃ kadalīvanaśobhitam","Dann gingen die Pāṇḍavas zur Einsiedelei Dhṛtarāṣṭras, die menschenleer war, von Hirschherden bevölkert, von Bananenhainen geschmückt.","",[["śūnyaṃ mṛgagaṇākīrṇam","menschenleer, von Hirschherden bevölkert (Akk.)"],["kadalīvanaśobhitam","von Bananenhainen geschmückt (Akk.)"]]],["004","tatas tatra samājagmus tāpasā vividhavratāḥ pāṇḍavān āgatān draṣṭuṃ kautūhalasamanvitāḥ","Dann versammelten sich dort die Asketen, von vielfältigen Gelübden, voller Neugier, um die angekommenen Pāṇḍavas zu sehen.","",[["samājagmus tāpasā vividhavratāḥ","die Asketen von vielfältigen Gelübden versammelten sich (Perf. + Nom. Pl.)"],["draṣṭuṃ kautūhalasamanvitāḥ","voller Neugier, um zu sehen (Inf. + Nom. Pl.)"]]],["005","tān apṛcchat tato rājā kvāsau kauravavaṃśabhṛt pitā jyeṣṭho gato 'smākam iti bāṣpapariplutaḥ","Sie fragte dann der König, von Tränen überströmt: „Wo ist jener Träger des Kaurava-Geschlechts, unser älterer Vater, hingegangen?“","",[["kvāsau kauravavaṃśabhṛt pitā","wo ist jener Träger des Kaurava-Geschlechts, der Vater (Adv. + Nom.)"],["bāṣpapariplutaḥ apṛcchat","von Tränen überströmt fragte er (Nom. + Impf.)"]]],["006","tam ūcus te tato vākyaṃ yamunām avagāhitum puṣpāṇām udakumbhasya cārthe gata iti prabho","Sie sprachen da zu ihm dieses Wort: „Er ist gegangen, um in die Yamunā einzutauchen, wegen der Blumen und wegen des Wasserkruges, o Gebieter.“","",[["yamunām avagāhitum gataḥ","gegangen, um in die Yamunā einzutauchen (Akk. + Inf. + Nom.)"],["udakumbhasya cārthe","und wegen des Wasserkruges (Gen. + Präp.)"]]],["007","tair ākhyātena mārgeṇa tatas te prayayus tadā dadṛśuś cāvidūre tān sarvān atha padātayaḥ","Auf dem von ihnen genannten Weg zogen sie dann weiter, und erblickten von nahem, zu Fuß gehend, sie alle.","",[["tair ākhyātena mārgeṇa","auf dem von ihnen genannten Weg (Instr.)"],["dadṛśuś cāvidūre padātayaḥ","erblickten von nahem, zu Fuß gehend (Perf. + Adv. + Nom. Pl.)"]]],["008","tatas te satvarā jagmuḥ pitur darśanakāṅkṣiṇaḥ sahadevas tu vegena prādhāvad yena sā pṛthā","Dann zogen sie eilends, nach dem Anblick des Vaters verlangend; Sahadeva aber lief mit großer Geschwindigkeit dorthin, wo jene Pṛthā war.","",[["pitur darśanakāṅkṣiṇaḥ","nach dem Anblick des Vaters verlangend (Gen. + Nom. Pl.)"],["vegena prādhāvad","lief mit großer Geschwindigkeit (Instr. + Impf.)"]]],["009","sasvanaṃ prarudan dhīmān mātuḥ pādāv upaspṛśan sā ca bāṣpāvilamukhī pradadarśa priyaṃ sutam","Laut weinend, der Weise, die Füße der Mutter berührend; und sie, das Antlitz von Tränen getrübt, erblickte den geliebten Sohn.","",[["sasvanaṃ prarudan mātuḥ pādāv upaspṛśan","laut weinend, die Füße der Mutter berührend (Adv. + Ptz. + Gen. + Akk. + Ptz.)"],["bāṣpāvilamukhī pradadarśa","mit von Tränen getrübtem Antlitz erblickte sie (Nom. + Perf.)"]]],["010","bāhubhyāṃ saṃpariṣvajya samunnāmya ca putrakam gāndhāryāḥ kathayām āsa sahadevam upasthitam","Mit beiden Armen umarmend und den Sohn emporhebend, verkündete sie Gāndhārī, dass Sahadeva angekommen sei.","",[["bāhubhyāṃ saṃpariṣvajya","mit beiden Armen umarmend (Instr. + Abs.)"],["kathayām āsa sahadevam upasthitam","verkündete, dass Sahadeva angekommen sei (Perf.periphr. + Akk. + Akk.Ptz.)"]]],["011","anantaraṃ ca rājānaṃ bhīmasenam athārjunam nakulaṃ ca pṛthā dṛṣṭvā tvaramāṇopacakrame","Und unmittelbar danach, als Pṛthā den König, dann Bhīmasena, Arjuna und Nakula erblickte, eilte sie herbei.","",[["rājānaṃ bhīmasenam athārjunam","den König, dann Bhīmasena, Arjuna (Akk.)"],["dṛṣṭvā tvaramāṇopacakrame","sie erblickend, eilte sie herbei (Abs. + Impf.)"]]],["012","sā hy agre 'gacchata tayor daṃpatyor hataputrayoḥ karṣantī tau tatas te tāṃ dṛṣṭvā saṃnyapatan bhuvi","Sie nämlich ging voran, jenes Ehepaares, das seine Söhne verloren hatte, sie beide gleichsam mit sich ziehend; da fielen jene, als sie sie erblickten, zu Boden.","",[["hataputrayoḥ daṃpatyoḥ agre 'gacchata","sie ging vor jenem Ehepaar, das seine Söhne verloren hatte (Gen. Dual + Nom. + Adv. + Impf.)"],["dṛṣṭvā saṃnyapatan bhuvi","sie erblickend fielen sie zu Boden (Abs. + Impf. + Lok.)"]]],["013","tān rājā svarayogena sparśena ca mahāmanāḥ pratyabhijñāya medhāvī samāśvāsayata prabhuḥ","Sie erkennend an der Stimme und an der Berührung, tröstete der hochsinnige, weise König, der Herr, sie.","",[["svarayogena sparśena ca","an der Stimme und an der Berührung (Instr.)"],["pratyabhijñāya samāśvāsayata","sie erkennend, tröstete er (Abs. + Impf.)"]]],["014","tatas te bāṣpam utsṛjya gāndhārīsahitaṃ nṛpam upatasthur mahātmāno mātaraṃ ca yathāvidhi","Dann, nachdem sie ihre Tränen vergossen hatten, verehrten jene Hochherzigen vorschriftsgemäß den König mit Gāndhārī, und die Mutter.","",[["bāṣpam utsṛjya upatasthuḥ","nachdem sie ihre Tränen vergossen hatten, verehrten sie (Akk. + Abs. + Perf.)"],["mahātmāno yathāvidhi","die Hochherzigen, vorschriftsgemäß (Nom. Pl. + Adv.)"]]],["015","sarveṣāṃ toyakalaśāñ jagṛhus te svayaṃ tadā pāṇḍavā labdhasaṃjñās te mātrā cāśvāsitāḥ punaḥ","Da nahmen jene Pāṇḍavas, die ihre Fassung wiedererlangt hatten und von der Mutter erneut getröstet worden waren, selbst die Wasserkrüge aller.","",[["toyakalaśāñ jagṛhuḥ svayam","nahmen selbst die Wasserkrüge (Akk. + Perf. + Adv.)"],["labdhasaṃjñās mātrāśvāsitāḥ","die die Fassung wiedererlangt hatten, von der Mutter getröstet (Nom. Pl.)"]]],["016","tato nāryo nṛsiṃhānāṃ sa ca yodhajanas tadā paurajānapadāś caiva dadṛśus taṃ narādhipam","Dann erblickten die Frauen jener Löwen unter den Männern, und die Kriegerschaft, und die Bürger und Landbewohner, jenen Herrscher der Menschen.","",[["nāryo nṛsiṃhānāṃ","die Frauen der Löwen unter den Männern (Nom. + Gen. Pl.)"],["dadṛśus taṃ narādhipam","erblickten jenen Herrscher der Menschen (Perf. + Akk.)"]]],["017","nivedayām āsa tadā janaṃ taṃ nāmagotrataḥ yudhiṣṭhiro narapatiḥ sa cainān pratyapūjayat","Da stellte der Herrscher der Menschen, Yudhiṣṭhira, jene Leute nach Namen und Geschlecht vor, und jener ehrte sie wiederum.","",[["nivedayām āsa nāmagotrataḥ","stellte vor nach Namen und Geschlecht (Perf.periphr. + Adv.)"],["sa cainān pratyapūjayat","und jener ehrte sie (Nom. + Akk. + Impf.)"]]],["018","sa taiḥ parivṛto mene harṣabāṣpāvilekṣaṇaḥ rājātmānaṃ gṛhagataṃ pureva gajasāhvaye","Von ihnen umgeben, mit von Freudentränen getrübten Augen, hielt sich der König für heimgekehrt, wie einst in der Stadt Gajasāhvaya.","",[["harṣabāṣpāvilekṣaṇaḥ","mit von Freudentränen getrübten Augen (Nom.)"],["mene ātmānaṃ gṛhagatam","hielt sich für heimgekehrt (Impf. + Akk.)"]]],["019","abhivādito vadhūbhiś ca kṛṣṇādyābhiḥ sa pārthivaḥ gāndhāryā sahito dhīmān kuntyā ca pratyanandata","Von den Schwiegertöchtern, angeführt von Kṛṣṇā, verehrt, hieß jener weise Herrscher der Erde, zusammen mit Gāndhārī und Kuntī, sie freudig willkommen.","",[["abhivādito vadhūbhiḥ kṛṣṇādyābhiḥ","von den Schwiegertöchtern, angeführt von Kṛṣṇā, verehrt (Nom. + Instr.)"],["gāndhāryā kuntyā ca pratyanandata","hieß sie zusammen mit Gāndhārī und Kuntī willkommen (Instr. + Impf.)"]]],["020","tataś cāśramam āgacchat siddhacāraṇasevitam didṛkṣubhiḥ samākīrṇaṃ nabhas tārāgaṇair iva","Dann kam er zur Einsiedelei, die von Siddhas und Cāraṇas bewohnt war, überfüllt von Schaulustigen, wie der Himmel von Sternenscharen.","",[["siddhacāraṇasevitam","von Siddhas und Cāraṇas bewohnt (Akk.)"],["didṛkṣubhiḥ samākīrṇam","überfüllt von Schaulustigen (Instr. + Akk.)"]]]]},{"num":32,"title_sa":"saṃjayena pāṇḍavānāṃ kurustrīṇāṃ ca tāpasebhyaḥ paricayaḥ","title_de":"Saṃjaya stellt den Asketen die Pāṇḍavas und die Kuru-Frauen vor","note":"","units":[["001","vaiśaṃpāyana uvāca sa taiḥ saha naravyāghrair bhrātṛbhir bharatarṣabha rājā rucirapadmākṣair āsāṃ cakre tadāśrame","Vaiśaṃpāyana sprach: Er, der König, setzte sich mit jenen Brüdern, den Tigern unter den Männern mit den schönen Lotusaugen, o Stier der Bharatas, dort in der Einsiedelei nieder,","",[["naravyāghrair bhrātṛbhiḥ","mit den Brüdern, den Tigern unter den Männern (Instr. Pl.)"],["āsāṃ cakre","setzte sich nieder (Perf. periphr.)"]]],["002","tāpasaiś ca mahābhāgair nānādeśasamāgataiḥ draṣṭuṃ kurupateḥ putrān pāṇḍavān pṛthuvakṣasaḥ","und mit den hochgesegneten Asketen, die aus verschiedenen Ländern zusammengekommen waren, um die Söhne des Kuru-Herrschers, die breitbrüstigen Pāṇḍavas, zu sehen.","",[["nānādeśasamāgataiḥ","aus verschiedenen Ländern zusammengekommen (Instr. Pl.)"],["draṣṭuṃ pāṇḍavān","um die Pāṇḍavas zu sehen (Inf. + Akk.)"]]],["003","te 'bruvañ jñātum icchāmaḥ katamo 'tra yudhiṣṭhiraḥ bhīmārjunayamāś caiva draupadī ca yaśasvinī","Sie sprachen: „Wir wollen wissen, welcher von diesen hier Yudhiṣṭhira ist, und Bhīma, Arjuna, die Zwillinge, und die ruhmreiche Draupadī.“","",[["jñātum icchāmaḥ","wir wollen wissen (Inf. + 1.Pl.Präs.)"],["katamo 'tra yudhiṣṭhiraḥ","welcher von diesen ist Yudhiṣṭhira (Interrog.)"]]],["004","tān ācakhyau tadā sūtaḥ sarvān nāmābhināmataḥ saṃjayo draupadīṃ caiva sarvāś cānyāḥ kurustriyaḥ","Da nannte ihnen der Sūta Saṃjaya sie alle mit Namen und Beinamen, ebenso Draupadī und all die anderen Kuru-Frauen.","",[["ācakhyau nāmābhināmataḥ","nannte mit Namen und Beinamen (Perf. + Adv.)"],["sarvāś cānyāḥ kurustriyaḥ","und alle anderen Kuru-Frauen (Akk. Pl.)"]]],["005","ya eṣa jāmbūnadaśuddhagauratanur mahāsiṃha iva pravṛddhaḥ pracaṇḍaghoṇaḥ pṛthudīrghanetras tāmrāyatāsyaḥ kururāja eṣaḥ","„Dieser hier, dessen Leib rein-golden ist wie Jāmbūnada-Gold, groß gewachsen wie ein mächtiger Löwe, mit kühner Nase, breiten, langen Augen und einem kupferfarbenen, länglichen Antlitz - dies ist der Kururāja.","",[["jāmbūnadaśuddhagauratanuḥ","dessen Leib rein-golden wie Jāmbūnada-Gold ist (Nom.)"],["kururāja eṣaḥ","dies ist der Kururāja [Yudhiṣṭhira] (Nom.)"]]],["006","ayaṃ punar mattagajendragāmī prataptacāmīkaraśuddhagauraḥ pṛthvāyatāṃsaḥ pṛthudīrghabāhur vṛkodaraḥ paśyata paśyatainam","Und dieser hier wiederum, mit dem Gang eines brünstigen Elefantenfürsten, rein-golden wie erhitztes Gold, mit breiten, weiten Schultern und breiten, langen Armen - das ist Vṛkodara, seht, seht ihn an!","",[["mattagajendragāmī","mit dem Gang eines brünstigen Elefantenfürsten (Nom.)"],["paśyata paśyatainam","seht, seht ihn an (Imp. Pl., wiederholt)"]]],["007","yas tv eṣa pārśve 'sya mahādhanuṣmāñ śyāmo yuvā vāraṇayūthapābhaḥ siṃhonnatāṃso gajakhelagāmī padmāyatākṣo 'rjuna eṣa vīraḥ","Und der hier an seiner Seite, mit dem großen Bogen, dunkel, jugendlich, einem Elefantenherden-Führer gleich, mit löwenhaft erhobenen Schultern, mit dem Gang eines spielenden Elefanten und langen Lotusaugen - dies ist der Held Arjuna.","",[["mahādhanuṣmāñ śyāmo yuvā","mit dem großen Bogen, dunkel, jugendlich (Nom.)"],["arjuna eṣa vīraḥ","dies ist der Held Arjuna (Nom.)"]]],["008","kuntīsamīpe puruṣottamau tu yamāv imau viṣṇumahendrakalpau manuṣyaloke sakale samo 'sti yayor na rūpe na bale na śīle","Nahe bei Kuntī aber stehen diese beiden vortrefflichsten Männer, die Zwillinge, Viṣṇu und Mahendra gleich - in der ganzen Welt der Menschen gibt es niemanden, der ihnen an Gestalt, Kraft oder Wesen gleichkäme.","",[["yamāv imau viṣṇumahendrakalpau","diese beiden Zwillinge, Viṣṇu und Mahendra gleich (Nom. Dual)"],["na rūpe na bale na śīle","weder an Gestalt noch an Kraft noch an Wesen (Lok.)"]]],["009","iyaṃ punaḥ padmadalāyatākṣī madhyaṃ vayaḥ kiṃ cid iva spṛśantī nīlotpalābhā puradevateva kṛṣṇā sthitā mūrtimatīva lakṣmīḥ","Und diese hier wiederum, mit langen Lotusblattaugen, das mittlere Alter gerade eben berührend, blau-lotus-farben wie die Schutzgottheit einer Stadt - Kṛṣṇā steht da wie die verkörperte Lakṣmī.","",[["padmadalāyatākṣī","mit langen Lotusblattaugen (Nom.)"],["sthitā mūrtimatīva lakṣmīḥ","steht da wie die verkörperte Lakṣmī (Nom.)"]]],["010","asyās tu pārśve kanakottamābhā yaiṣā prabhā mūrtimatīva gaurī madhye sthitaiṣā bhaginī dvijāgryā cakrāyudhasyāpratimasya tasya","An ihrer Seite aber steht diese, von höchstem Goldglanz, deren Strahlen wie die verkörperte Gaurī sind - in der Mitte stehend ist dies die Schwester von vornehmster Abkunft jenes unvergleichlichen Trägers der Diskuswaffe.","[Anm.: 'Träger der Diskuswaffe' bezeichnet Kṛṣṇa; gemeint ist demnach dessen Schwester Subhadrā.]",[["kanakottamābhā","von höchstem Goldglanz (Nom.)"],["bhaginī dvijāgryā","die Schwester von vornehmster [zweifachgeborener] Abkunft (Nom.)"]]],["011","iyaṃ svasā rājacamūpates tu pravṛddhanīlotpaladāmavarṇā paspardha kṛṣṇena nṛpaḥ sadā yo vṛkodarasyaiṣa parigraho 'gryaḥ","Diese hier aber ist die Schwester des Heerführer-Königs, von der Farbe einer voll erblühten blauen Lotusgirlande - jenes Königs, der stets mit Kṛṣṇa wetteiferte - dies ist Vṛkodaras vortrefflichste Gemahlin.","[Anm.: Die Identität dieses stets mit Kṛṣṇa wetteifernden Königs, des Bruders dieser Gemahlin Bhīmas, wird im Vers nicht namentlich genannt und bleibt hier offen [?].]",[["rājacamūpateḥ svasā","die Schwester des Heerführer-Königs (Gen. + Nom.)"],["vṛkodarasyaiṣa parigraho 'gryaḥ","dies ist Vṛkodaras vortrefflichste Gemahlin (Nom.)"]]],["012","iyaṃ ca rājño magadhādhipasya sutā jarāsaṃdha iti śrutasya yavīyaso mādravatīsutasya bhāryā matā campakadāmagaurī","Und diese hier ist die Tochter des Königs, des Herrschers von Magadha, der als Jarāsaṃdha bekannt war - sie gilt als die Gemahlin des jüngeren Sohnes der Mādravatī, von der Farbe einer Campaka-Blütengirlande.","[Anm.: Der hier genannte Magadha-König 'Jarāsaṃdha' kann nicht der von Bhīma erschlagene historische Jarāsaṃdha selbst sein; vermutlich ein Nachfahre gleichen Namens [?]. Der jüngere Sohn der Mādravatī ist Sahadeva.]",[["magadhādhipasya sutā","die Tochter des Herrschers von Magadha (Gen. + Nom.)"],["yavīyaso mādravatīsutasya bhāryā","die Gemahlin des jüngeren Sohnes der Mādravatī [Sahadeva] (Gen. + Nom.)"]]],["013","indīvaraśyāmatanuḥ sthitā tu yaiṣāparā sannamahītale ca bhāryā matā mādravatīsutasya jyeṣṭhasya seyaṃ kamalāyatākṣī","Und diese andere hier, mit einem Leib dunkel wie eine Indīvara-Lotosblüte, die dort auf ebenem Boden steht, gilt als die Gemahlin des älteren Sohnes der Mādravatī - sie, mit lang gestreckten Lotusaugen.","[Anm.: Der ältere Sohn der Mādravatī ist Nakula. Die genaue Bedeutung von 'sannamahītale' [?] ist unsicher, hier sinngemäß als 'auf ebenem Boden' wiedergegeben.]",[["indīvaraśyāmatanuḥ","mit einem Leib dunkel wie eine Indīvara-Lotosblüte (Nom.)"],["jyeṣṭhasya mādravatīsutasya bhāryā","die Gemahlin des älteren Sohnes der Mādravatī [Nakula] (Gen. + Nom.)"]]],["014","iyaṃ tu niṣṭaptasuvarṇagaurī rājño virāṭasya sutā saputrā bhāryābhimanyor nihato raṇe yo droṇādibhis tair virathaḥ rathasthaiḥ","Diese hier aber, golden wie geschmolzenes Feingold, ist die Tochter des Königs Virāṭa, mitsamt ihrem Sohn - die Gemahlin Abhimanyus, der in der Schlacht erschlagen wurde, wagenlos, von jenen auf ihren Wagen stehenden Kriegern, angeführt von Droṇa.","",[["niṣṭaptasuvarṇagaurī","golden wie geschmolzenes Feingold (Nom.)"],["bhāryābhimanyor","die Gemahlin Abhimanyus (Nom. + Gen.)"]]],["015","etās tu sīmantaśiroruhā yāḥ śuklottarīyā nararājapatnyaḥ rājño 'sya vṛddhasya paraṃśatākhyāḥ snuṣā vivīrā hataputranāthāḥ","Diese hier aber, mit gescheiteltem Haar, in weiße Obergewänder gekleidet, die Gemahlinnen der Menschenkönige - sind die Schwiegertöchter dieses greisen Königs, mehr als hundert an Zahl genannt, ihrer Helden beraubt, ihrer erschlagenen Söhne ohne Beschützer.","[Anm.: Der gescheitelte Haarschmuck kennzeichnet hier die verwitweten Kaurava-Frauen.]",[["sīmantaśiroruhā","mit gescheiteltem Haar (Nom. Pl., Witwenzeichen)"],["hataputranāthāḥ","ihrer erschlagenen Söhne ohne Beschützer (Nom. Pl.)"]]],["016","etā yathāmukhyam udāhṛtā vo brāhmaṇyabhāvād ṛjubuddhisattvāḥ sarvā bhavadbhiḥ paripṛcchyamānā narendrapatnyaḥ suviśuddhasattvāḥ","Diese sind euch nun der Reihe nach nach ihrem Rang genannt worden, o ihr von rechtschaffener Einsicht und brahmanenhaftem Wesen - alle diese von euch erfragten Gemahlinnen der Menschenfürsten, von vollkommen reinem Wesen.“","",[["yathāmukhyam udāhṛtā","der Reihe nach nach ihrem Rang genannt (Adv. + Ptz.)"],["suviśuddhasattvāḥ","von vollkommen reinem Wesen (Nom. Pl.)"]]],["017","evaṃ sa rājā kuruvṛddhavaryaḥ samāgatas tair naradevaputraiḥ papraccha sarvān kuśalaṃ tadānīṃ gateṣu sarveṣv atha tāpaseṣu","So erkundigte sich jener König, der Vornehmste der Kuru-Alten, nachdem er mit jenen Söhnen der Götterkönige zusammengetroffen war, damals bei allen nach dem Wohlergehen, als alle Asketen gegangen waren.","",[["kuruvṛddhavaryaḥ","der Vornehmste der Kuru-Alten (Nom.)"],["papraccha kuśalam","erkundigte sich nach dem Wohlergehen (Perf. + Akk.)"]]],["018","yodheṣu cāpy āśramamaṇḍalaṃ taṃ muktvā niviṣṭeṣu vimucya patram strīvṛddhabāle ca susaṃniviṣṭe yathārhataḥ kuśalaṃ paryapṛcchat","Und auch bei den Kriegern, die sich, nachdem sie [ihre Rüstung] abgelegt hatten, in jenem Kreis der Einsiedelei niedergelassen hatten, und bei den wohlversammelten Frauen, Alten und Kindern, erkundigte er sich, wie es sich gebührte, nach ihrem Wohlergehen.","[Anm.: Die genaue Bedeutung von 'vimucya patram' [?] (wörtl. etwa 'das Blatt/Gefäß ablegend') ist unsicher; sinngemäß als Ablegen der Rüstung/Ausrüstung gedeutet.]",[["āśramamaṇḍalaṃ niviṣṭeṣu","die sich im Kreis der Einsiedelei niedergelassen hatten (Akk. + Lok. Pl.)"],["yathārhataḥ kuśalaṃ paryapṛcchat","erkundigte sich, wie es sich gebührte, nach dem Wohlergehen (Adv. + Akk. + Impf.)"]]]]},{"num":33,"title_sa":"dhṛtarāṣṭrayudhiṣṭhirasaṃvādo vidurasya yudhiṣṭhiraśarīrapraveśaś ca","title_de":"Das Gespräch zwischen Dhṛtarāṣṭra und Yudhiṣṭhira, und Viduras Eingehen in Yudhiṣṭhiras Leib","note":"","units":[["001","dhṛtarāṣṭra uvāca yudhiṣṭhira mahābāho kaccit tāta kuśaly asi sahito bhrātṛbhiḥ sarvaiḥ paurajānapadais tathā","Dhṛtarāṣṭra sprach: „Yudhiṣṭhira, du Starkarmiger, bist du wohl, mein Kind, wohlauf, zusammen mit allen deinen Brüdern und ebenso mit den Bürgern und Landbewohnern?","",[["kaccit tāta kuśaly asi","bist du wohl, mein Kind, wohlauf (Interrog. + Nom.)"],["paurajānapadais tathā","und ebenso mit Bürgern und Landbewohnern (Instr. Pl.)"]]],["002","ye ca tvām upajīvanti kaccit te 'pi nirāmayāḥ sacivā bhṛtyavargāś ca guravaś caiva te vibho","Und sind auch jene, die von dir leben, unversehrt - deine Minister und die Schar der Diener, und auch deine Lehrer, o Gebieter?","",[["ye tvām upajīvanti","die von dir leben (Rel. + 3.Pl.Präs.)"],["sacivā bhṛtyavargāś ca guravaś","Minister, Dienerschar und Lehrer (Nom. Pl.)"]]],["003","kaccid vartasi paurāṇīṃ vṛttiṃ rājarṣisevitām kaccid dāyān anucchidya kośas te 'bhiprapūryate","Befolgst du wohl den althergebrachten, von den Königssehern geübten Lebenswandel? Füllt sich wohl deine Schatzkammer, ohne die Erbteile zu schmälern?","",[["paurāṇīṃ vṛttiṃ rājarṣisevitām","den althergebrachten, von Königssehern geübten Lebenswandel (Akk.)"],["dāyān anucchidya","ohne die Erbteile zu schmälern (Akk. + Abs.)"]]],["004","arimadhyasthamitreṣu vartase cānurūpataḥ brāhmaṇān agrahārair vā yathāvad anupaśyasi","Verhältst du dich gegenüber Feinden, Neutralen und Freunden gebührend? Achtest du die Brahmanen gehörig durch Landschenkungen?","",[["arimadhyasthamitreṣu","gegenüber Feinden, Neutralen und Freunden (Lok. Pl.)"],["agrahārair yathāvad anupaśyasi","achtest du gehörig durch Landschenkungen (Instr. + Adv.)"]]],["005","kaccit te parituṣyanti śīlena bharatarṣabha śatravo guravaḥ paurā bhṛtyā vā svajano 'pi vā","Sind sie wohl zufrieden mit deinem Wesen, o Stier der Bharatas - die Feinde, die Lehrer, die Bürger, die Diener oder auch die eigenen Verwandten?","",[["parituṣyanti śīlena","sind zufrieden mit dem Wesen (3.Pl.Präs. + Instr.)"],["śatravo guravaḥ paurā bhṛtyā","Feinde, Lehrer, Bürger, Diener (Nom. Pl.)"]]],["006","kaccid yajasi rājendra śraddhāvān pitṛdevatāḥ atithīṃś cānnapānena kaccid arcasi bhārata","Opferst du wohl gläubig den Ahnen und Göttern, o Herr der Könige, und ehrst du die Gäste mit Speise und Trank, o Bhārata?","",[["yajasi śraddhāvān","opferst du gläubig (2.Sg.Präs. + Nom.)"],["atithīṃś cānnapānena arcasi","ehrst du die Gäste mit Speise und Trank (Akk. + Instr.)"]]],["007","kaccic ca viṣaye viprāḥ svakarmaniratās tava kṣatriyā vaiśyavargā vā śūdrā vāpi kuṭumbinaḥ","Und sind in deinem Reich die Brahmanen wohl ihren eigenen Pflichten hingegeben, ebenso die Scharen der Kṣatriyas und Vaiśyas oder auch die Śūdra-Hausväter?","",[["viṣaye svakarmaniratāḥ","im Reich, ihren eigenen Pflichten hingegeben (Lok. + Nom. Pl.)"],["śūdrā vāpi kuṭumbinaḥ","oder auch die Śūdra-Hausväter (Nom. Pl.)"]]],["008","kaccit strībālavṛddhaṃ te na śocati na yācate jāmayaḥ pūjitāḥ kaccit tava gehe nararṣabha","Grämen sich wohl Frauen, Kinder und Alte bei dir nicht, betteln sie nicht, werden die Frauen des Hauses wohl geehrt in deinem Haus, o Stier unter den Männern?","",[["strībālavṛddhaṃ na śocati","Frauen, Kinder und Alte grämen sich nicht (Nom. + 3.Sg.Präs.)"],["jāmayaḥ pūjitāḥ","die Frauen des Hauses werden geehrt (Nom. Pl. + Ptz.)"]]],["009","kaccid rājarṣivaṃśo 'yaṃ tvām āsādya mahīpatim yathocitaṃ mahārāja yaśasā nāvasīdati","Verfällt wohl diese Königsseher-Dynastie, da sie dich, den Herrscher der Erde, gefunden hat, ihrem gebührenden Ruhm nicht, o Großkönig?“","",[["rājarṣivaṃśo 'yaṃ","diese Königsseher-Dynastie (Nom.)"],["yaśasā nāvasīdati","verfällt nicht ihrem Ruhm (Instr. + 3.Sg.Präs.)"]]],["010","vaiśaṃpāyana uvāca ity evaṃvādinaṃ taṃ sa nyāyavit pratyabhāṣata kuśalapraśnasaṃyuktaṃ kuśalo vākyakarmaṇi","Vaiśaṃpāyana sprach: Ihm, der so sprach, antwortete jener Kenner des rechten Verhaltens, kundig in der Redekunst, mit einer mit der Wohlergehens-Frage verknüpften Erwiderung:","",[["nyāyavit pratyabhāṣata","der Kenner des rechten Verhaltens antwortete (Nom. + Impf.)"],["kuśalapraśnasaṃyuktaṃ","mit der Wohlergehens-Frage verknüpft (Akk.)"]]],["011","kaccit te vardhate rājaṃs tapo mandaśramasya te api me jananī ceyaṃ śuśrūṣur vigataklamā apy asyāḥ saphalo rājan vanavāso bhaviṣyati","„Nimmt wohl deine Askese zu, o König, und ist deine Anstrengung dabei erträglich? Ist auch diese meine Mutter dir zu Diensten, frei von Erschöpfung? Wird auch ihr Waldaufenthalt fruchtbar sein, o König?","",[["vardhate tapo mandaśramasya","nimmt die Askese zu, deine Anstrengung erträglich (3.Sg.Präs. + Nom. + Gen.)"],["saphalo vanavāso bhaviṣyati","wird der Waldaufenthalt fruchtbar sein (Nom. + Fut.)"]]],["012","iyaṃ ca mātā jyeṣṭhā me vītavātādhvakarśitā ghoreṇa tapasā yuktā devī kaccin na śocati","Und grämt sich wohl diese meine älteste Mutter, von Wind und Weg abgezehrt, der grausamen Askese hingegeben, die Herrin, nicht?","[Anm.: mit 'ältester Mutter' ist Gāndhārī gemeint.]",[["vītavātādhvakarśitā","von Wind und Weg abgezehrt (Nom.)"],["ghoreṇa tapasā yuktā","der grausamen Askese hingegeben (Instr. + Nom.)"]]],["013","hatān putrān mahāvīryān kṣatradharmaparāyaṇān nāpadhyāyati vā kaccid asmān pāpakṛtaḥ sadā","Denkt sie wohl nicht mit Groll an ihre erschlagenen, hochtapferen, dem Kṣatriya-Recht ergebenen Söhne, oder wohl stets an uns, die Übeltäter?","",[["hatān putrān mahāvīryān","die erschlagenen, hochtapferen Söhne (Akk. Pl.)"],["nāpadhyāyati","denkt nicht mit Groll (3.Sg.Präs. verneint)"]]],["014","kva cāsau viduro rājan nainaṃ paśyāmahe vayam saṃjayaḥ kuśalī cāyaṃ kaccin nu tapasi sthitaḥ","Und wo ist jener Vidura, o König? Wir sehen ihn nicht. Und ist dieser Saṃjaya wohlauf? Weilt er wirklich in Askese?“","",[["nainaṃ paśyāmahe vayam","wir sehen ihn nicht (verneint + 1.Pl.Präs.)"],["tapasi sthitaḥ","in Askese weilend (Lok. + Ptz.)"]]],["015","ity uktaḥ pratyuvācedaṃ dhṛtarāṣṭro janādhipam kuśalī viduraḥ putra tapo ghoraṃ samāsthitaḥ","Also angesprochen, erwiderte Dhṛtarāṣṭra dem Herrn der Menschen dies: „Vidura ist wohlauf, mein Sohn, er hat sich einer grausamen Askese unterzogen.","",[["pratyuvācedaṃ janādhipam","erwiderte dies dem Herrn der Menschen (Impf. + Akk.)"],["tapo ghoraṃ samāsthitaḥ","hat sich grausamer Askese unterzogen (Akk. + Ptz.)"]]],["016","vāyubhakṣo nirāhāraḥ kṛśo dhamanisaṃtataḥ kadā cid dṛśyate vipraiḥ śūnye 'smin kānane kva cit","Von Luft lebend, ohne Nahrung, abgezehrt, mit hervortretenden Adern - er wird bisweilen von Brahmanen irgendwo in diesem einsamen Wald erblickt.“","",[["vāyubhakṣo nirāhāraḥ","von Luft lebend, ohne Nahrung (Nom.)"],["dṛśyate vipraiḥ","wird von Brahmanen erblickt (Pass. + Instr.)"]]],["017","ity evaṃ vadatas tasya jaṭī vīṭāmukhaḥ kṛśaḥ digvāsā maladigdhāṅgo vanareṇusamukṣitaḥ","Während er so sprach, erschien jener mit verfilztem Haar, hagerem Antlitz, abgezehrt, den Himmel als Gewand tragend, seine Glieder mit Schmutz beschmiert, mit Waldstaub bestreut -","[Anm.: die genaue Bedeutung von 'vīṭāmukhaḥ' [?] ist unsicher, hier sinngemäß als 'hageres Antlitz' wiedergegeben.]",[["jaṭī digvāsā","mit verfilztem Haar, den Himmel als Gewand tragend [nackt] (Nom.)"],["vanareṇusamukṣitaḥ","mit Waldstaub bestreut (Nom.)"]]],["018","dūrād ālakṣitaḥ kṣattā tatrākhyāto mahīpateḥ nivartamānaḥ sahasā janaṃ dṛṣṭvāśramaṃ prati","der Kṣattā wurde von ferne erblickt, dort dem Herrscher der Erde angezeigt, während er sich, kaum die Menschen erblickend, plötzlich der Einsiedelei zuwandte und sich zurückzog.","[Anm.: 'Kṣattā' ist ein Beiname Viduras.]",[["dūrād ālakṣitaḥ kṣattā","der Kṣattā [Vidura] wurde von ferne erblickt (Nom.)"],["nivartamānaḥ sahasā","sich plötzlich zurückziehend (Ptz. + Adv.)"]]],["019","tam anvadhāvan nṛpatir eka eva yudhiṣṭhiraḥ praviśantaṃ vanaṃ ghoraṃ lakṣyālakṣyaṃ kva cit kva cit","Ihm allein lief der König Yudhiṣṭhira nach, als er in den furchtbaren Wald eindrang, bald sichtbar, bald unsichtbar, hier und dort.","",[["anvadhāvan nṛpatir eka eva","ihm lief der König allein nach (Impf. + Nom.)"],["lakṣyālakṣyaṃ kva cit kva cit","bald sichtbar, bald unsichtbar, hier und dort (Adv.)"]]],["020","bho bho vidura rājāhaṃ dayitas te yudhiṣṭhiraḥ iti bruvan narapatis taṃ yatnād abhyadhāvata","„He, he, Vidura! Ich bin der König, dein geliebter Yudhiṣṭhira!“ - so rufend, lief der Herr der Menschen ihm eifrig nach.","",[["bho bho vidura","he, he, Vidura! (Vok., Anrufung)"],["iti bruvan yatnād abhyadhāvata","so rufend, lief er eifrig nach (Ptz. + Adv. + Impf.)"]]],["021","tato vivikta ekānte tasthau buddhimatāṃ varaḥ viduro vṛkṣam āśritya kaṃ cit tatra vanāntare","Dann blieb, an einem abgeschiedenen, einsamen Ort, der Vortrefflichste der Weisen, Vidura, dort mitten im Wald stehen, an einen Baum gelehnt.","",[["vivikta ekānte tasthau","blieb an abgeschiedenem, einsamem Ort stehen (Lok. + Perf.)"],["vṛkṣam āśritya","an einen Baum gelehnt (Akk. + Abs.)"]]],["022","taṃ rājā kṣīṇabhūyiṣṭham ākṛtīmātrasūcitam abhijajñe mahābuddhiṃ mahābuddhir yudhiṣṭhiraḥ","Den, fast völlig abgezehrt, nur noch durch seine Gestalt kenntlich, erkannte der König, der hochweise Yudhiṣṭhira, als den hochweisen Vidura.","",[["kṣīṇabhūyiṣṭham ākṛtīmātrasūcitam","fast völlig abgezehrt, nur durch die Gestalt kenntlich (Akk.)"],["abhijajñe mahābuddhiṃ","erkannte den Hochweisen (Perf. + Akk.)"]]],["023","yudhiṣṭhiro 'ham asmīti vākyam uktvāgrataḥ sthitaḥ vidurasyāśrave rājā sa ca pratyāha saṃjñayā","„Ich bin Yudhiṣṭhira“ - dieses Wort sprechend, stand der König vor ihm, in Viduras Hörweite, und jener erwiderte durch ein Zeichen.","",[["yudhiṣṭhiro 'ham asmi","ich bin Yudhiṣṭhira (Nom. + 1.Sg.Präs.)"],["pratyāha saṃjñayā","erwiderte durch ein Zeichen (Perf. + Instr.)"]]],["024","tataḥ so 'nimiṣo bhūtvā rājānaṃ samudaikṣata saṃyojya viduras tasmin dṛṣṭiṃ dṛṣṭyā samāhitaḥ","Dann, unbewegten Blickes geworden, betrachtete er unablässig den König - Vidura, seinen Blick mit dessen Blick vereinend, gesammelt.","",[["animiṣo bhūtvā samudaikṣata","unbewegten Blickes geworden, betrachtete unablässig (Nom. + Ptz. + Impf.)"],["saṃyojya dṛṣṭiṃ dṛṣṭyā","den Blick mit dem Blick vereinend (Abs. + Akk. + Instr.)"]]],["025","viveśa viduro dhīmān gātrair gātrāṇi caiva ha prāṇān prāṇeṣu ca dadhad indriyāṇīndriyeṣu ca","Der weise Vidura ging ein, Glied für Glied, indem er seine Lebenshauche in dessen Lebenshauche und seine Sinne in dessen Sinne legte,","",[["viveśa gātrair gātrāṇi","ging ein, Glied in Glieder (Perf. + Instr. + Akk.)"],["prāṇān prāṇeṣu dadhat","die Lebenshauche in die Lebenshauche legend (Akk. + Lok. + Ptz.)"]]],["026","sa yogabalam āsthāya viveśa nṛpates tanum viduro dharmarājasya tejasā prajvalann iva","er, gestützt auf die Kraft des Yoga, ging in den Leib des Königs ein - Vidura in den des Dharmarāja, gleichsam von Glut entflammt.","",[["yogabalam āsthāya","gestützt auf die Kraft des Yoga (Akk. + Abs.)"],["tejasā prajvalann iva","gleichsam von Glut entflammt (Instr. + Ptz.)"]]],["027","vidurasya śarīraṃ tat tathaiva stabdhalocanam vṛkṣāśritaṃ tadā rājā dadarśa gatacetanam","Jenen Leib Viduras aber, so mit starrem Blick, an den Baum gelehnt, erblickte da der König als seines Bewusstseins entschwunden.","",[["stabdhalocanam vṛkṣāśritam","mit starrem Blick, an den Baum gelehnt (Akk.)"],["dadarśa gatacetanam","erblickte als seines Bewusstseins entschwunden (Perf. + Akk.)"]]],["028","balavantaṃ tathātmānaṃ mene bahuguṇaṃ tadā dharmarājo mahātejās tac ca sasmāra pāṇḍavaḥ","Sich selbst nahm der hochglänzende Dharmarāja, der Pāṇḍava, da als kraftvoll und mit vielen Vorzügen versehen wahr, und er erinnerte sich daran,","",[["balavantaṃ bahuguṇaṃ mene","nahm als kraftvoll und mit vielen Vorzügen versehen wahr (Akk. + Perf.)"],["sasmāra","erinnerte sich (Perf.)"]]],["029","paurāṇam ātmanaḥ sarvaṃ vidyāvān sa viśāṃ pate yogadharmaṃ mahātejā vyāsena kathitaṃ yathā","an seine ganze frühere, der Weisheit kundige Yoga-Lehre, o Herr der Völker, wie sie ihm einst von Vyāsa verkündet worden war.","",[["paurāṇam yogadharmaṃ","die frühere Yoga-Lehre (Akk.)"],["vyāsena kathitaṃ yathā","wie von Vyāsa verkündet (Instr. + Ptz. + Adv.)"]]],["030","dharmarājas tu tatrainaṃ saṃcaskārayiṣus tadā dagdhukāmo 'bhavad vidvān atha vai vāg abhāṣata","Der Dharmarāja aber, der ihm dort die Totenriten erweisen und ihn verbrennen wollte, war schon entschlossen dazu, als eine Stimme ertönte:","",[["saṃcaskārayiṣuḥ dagdhukāmaḥ","die Totenriten erweisen wollend, verbrennen wollend (Nom.)"],["vāg abhāṣata","eine Stimme sprach (Nom. + Impf.)"]]],["031","bho bho rājan na dagdhavyam etad vidurasaṃjñakam kalevaram ihaitat te dharma eṣa sanātanaḥ","„He, he, König! Dieser Leib, genannt Vidura, soll hier nicht verbrannt werden - dies ist deine ewige Pflicht.","",[["na dagdhavyam etat kalevaram","dieser Leib soll nicht verbrannt werden (Verbaladj. + Nom.)"],["dharma eṣa sanātanaḥ","dies ist die ewige Pflicht (Nom.)"]]],["032","lokāḥ saṃtānakā nāma bhaviṣyanty asya pārthiva yatidharmam avāpto 'sau naiva śocyaḥ paraṃtapa","Welten, Saṃtānaka genannt, werden ihm zuteil werden, o Herrscher; er hat das Recht des Asketen erlangt - er ist keineswegs zu beklagen, o Bezwinger der Feinde.“","",[["lokāḥ saṃtānakā nāma bhaviṣyanti","Welten, Saṃtānaka genannt, werden zuteil werden (Nom. + Fut.)"],["yatidharmam avāptaḥ","hat das Recht des Asketen erlangt (Akk. + Ptz.)"]]],["033","ity ukto dharmarājaḥ sa vinivṛtya tataḥ punaḥ rājño vaicitravīryasya tat sarvaṃ pratyavedayat","Also angesprochen, kehrte der Dharmarāja dann wieder zurück und berichtete dies alles dem König, dem Sohn des Vicitravīrya.","",[["vinivṛtya punaḥ","wieder zurückkehrend (Abs. + Adv.)"],["pratyavedayat tat sarvaṃ","berichtete dies alles (Impf. + Akk.)"]]],["034","tataḥ sa rājā dyutimān sa ca sarvo janas tadā bhīmasenādayaś caiva paraṃ vismayam āgatāḥ","Da gerieten jener glanzvolle König und alle Leute dort, sowie Bhīmasena und die anderen, in höchstes Erstaunen.","",[["dyutimān rājā","der glanzvolle König (Nom.)"],["paraṃ vismayam āgatāḥ","gerieten in höchstes Erstaunen (Akk. + Ptz.)"]]],["035","tac chrutvā prītimān rājā bhūtvā dharmajam abravīt āpo mūlaṃ phalaṃ caiva mamedaṃ pratigṛhyatām","Als er dies vernommen hatte, sprach der König erfreut zu dem Dharma-Geborenen: „Dieses mein Wasser, meine Wurzeln und Früchte mögen angenommen werden -","",[["tac chrutvā prītimān","dies vernommen habend, erfreut (Abs. + Nom.)"],["āpo mūlaṃ phalaṃ pratigṛhyatām","Wasser, Wurzeln und Früchte mögen angenommen werden (Nom. + Optativ Pass.)"]]],["036","yadanno hi naro rājaṃs tadanno 'syātithiḥ smṛtaḥ ity uktaḥ sa tathety eva prāha dharmātmajo nṛpam phalaṃ mūlaṃ ca bubhuje rājñā dattaṃ sahānujaḥ","denn von welcher Speise ein Mann lebt, o König, von dessen Speise gilt auch sein Gast als lebend.“ So angesprochen, sagte der Dharma-Geborene zustimmend, es solle so sein, und verzehrte, zusammen mit seinen jüngeren Brüdern, die vom König gegebenen Früchte und Wurzeln.","",[["yadanno naro tadanno 'tithiḥ","von welcher Speise ein Mann lebt, von dessen Speise sein Gast (Nom.)"],["tathety eva prāha","sagte zustimmend, es solle so sein (Adv. + Perf.)"]]],["037","tatas te vṛkṣamūleṣu kṛtavāsaparigrahāḥ tāṃ rātriṃ nyavasan sarve phalamūlajalāśanāḥ","Dann nahmen sie an den Wurzeln der Bäume ihr Nachtlager und verbrachten dort alle jene Nacht, sich von Früchten, Wurzeln und Wasser nährend.","",[["vṛkṣamūleṣu kṛtavāsaparigrahāḥ","an den Wurzeln der Bäume ihr Nachtlager nehmend (Lok. + Nom.)"],["phalamūlajalāśanāḥ","sich von Früchten, Wurzeln und Wasser nährend (Nom. Pl.)"]]]]},{"num":34,"title_sa":"Āśramadarśana, Vyāsāgamana","title_de":"Morgen im Āśrama; Gabenverteilung; Vyāsas Ankunft","note":"","units":[["001","vaiśaṃpāyana uvāca evaṃ sā rajanī teṣām āśrame puṇyakarmaṇām śivā nakṣatrasaṃpannā sā vyatīyāya bhārata","Vaiśaṃpāyana sprach: So verging jene Nacht ihnen im Āśrama der frommen Männer, heilvoll und reich an Sternen, o Bhārata.","",[["vaiśaṃpāyana uvāca","Vaiśaṃpāyana sprach (Perf.)"],["rajanī ... vyatīyāya","die Nacht verging (Perf. vi+ati+i)"],["āśrame puṇyakarmaṇām","im Āśrama der von frommer Tat (Lok. Pl. Gen.)"],["śivā nakṣatrasaṃpannā","heilvoll, mit Sternen versehen (Adj. f.)"]]],["002","tatra tatra kathāś cāsaṃs teṣāṃ dharmārthalakṣaṇāḥ vicitrapadasaṃcārā nānāśrutibhir anvitāḥ","Dort und dort gab es Gespräche von ihnen, die von Dharma und Artha handelten, mit kunstvollem Wortfluss, versehen mit mancherlei [heiliger] Überlieferung.","",[["tatra tatra kathāḥ","dort und dort Gespräche (Nom. Pl.)"],["dharmārthalakṣaṇāḥ","von Dharma und Artha gekennzeichnet (Adj.)"],["vicitrapadasaṃcārāḥ","mit kunstvollem Wortgang (Adj.)"],["nānāśrutibhir anvitāḥ","von mancherlei Überlieferung begleitet (Instr. + Ptz.)"]]],["003","pāṇḍavās tv abhito mātur dharaṇyāṃ suṣupus tadā utsṛjya sumahārhāṇi śayanāni narādhipa","Die Pāṇḍavas aber schliefen ringsum um ihre Mutter auf dem Erdboden, nachdem sie ihre überaus kostbaren Lagerstätten aufgegeben hatten, o Herrscher der Menschen.","",[["pāṇḍavāḥ ... suṣupuḥ","die Pāṇḍavas schliefen (Perf. svap)"],["mātur abhitaḥ","rings um die Mutter (Präp. + Gen.)"],["dharaṇyām","auf dem Erdboden (Lok.)"],["utsṛjya sumahārhāṇi śayanāni","nachdem sie die überaus kostbaren Lager aufgegeben hatten (Abs. + Akk.)"]]],["004","yadāhāro 'bhavad rājā dhṛtarāṣṭro mahāmanāḥ tadāhārā nṛvīrās te nyavasaṃs tāṃ niśāṃ tadā","Welche Nahrung König Dhṛtarāṣṭra, der Hochgesinnte, zu sich nahm, dieselbe Nahrung nahmen jene Heldenmänner ein, als sie jene Nacht verbrachten.","",[["yadāhāro 'bhavat","welche Nahrung es war (Impf. bhū)"],["dhṛtarāṣṭro mahāmanāḥ","Dhṛtarāṣṭra, der Hochgesinnte (Nom.)"],["tadāhārā nṛvīrāḥ","mit derselben Nahrung die Heldenmänner (Nom. Pl., Bahuvrihi)"],["nyavasaṃs tāṃ niśām","sie verbrachten jene Nacht (Impf. ni+vas)"]]],["005","vyatītāyāṃ tu śarvaryāṃ kṛtapūrvāhṇikakriyaḥ bhrātṛbhiḥ saha kaunteyo dadarśāśramamaṇḍalam","Als aber die Nacht vergangen war, besichtigte der Kaunteya, nachdem er die Morgenriten vollzogen hatte, zusammen mit seinen Brüdern den Umkreis des Āśrama.","",[["vyatītāyāṃ śarvaryām","als die Nacht vergangen war (Lok. Abs.)"],["kṛtapūrvāhṇikakriyaḥ","der die Vormittagsriten vollzogen hatte (Adj.)"],["bhrātṛbhiḥ saha kaunteyaḥ","der Kaunteya zusammen mit den Brüdern (Instr. + Nom.)"],["dadarśāśramamaṇḍalam","er betrachtete den Umkreis des Āśrama (Perf. dṛś)"]]],["006","sāntaḥpuraparīvāraḥ sabhṛtyaḥ sapurohitaḥ yathāsukhaṃ yathoddeśaṃ dhṛtarāṣṭrābhyanujñayā","begleitet vom Gefolge des Frauengemachs, mit Dienern, mit dem Hauspriester, nach Belieben, Ort für Ort, mit Dhṛtarāṣṭras Erlaubnis.","",[["sāntaḥpuraparīvāraḥ","begleitet vom Gefolge des Frauengemachs (Adj.)"],["sabhṛtyaḥ sapurohitaḥ","mit Dienern, mit dem Hauspriester (Adj.)"],["yathāsukhaṃ yathoddeśam","nach Belieben, Ort für Ort (Adv.)"],["dhṛtarāṣṭrābhyanujñayā","mit Dhṛtarāṣṭras Erlaubnis (Instr.)"]]],["007","dadarśa tatra vedīś ca saṃprajvalitapāvakāḥ kṛtābhiṣekair munibhir hutāgnibhir upasthitāḥ","Er sah dort Altäre mit lodernden Feuern, aufgesucht von Weisen, die das Bad vollzogen und das Feueropfer dargebracht hatten,","",[["dadarśa vediḥ","er sah Altäre (Perf. + Akk.)"],["saṃprajvalitapāvakāḥ","mit lodernden Feuern (Adj.)"],["kṛtābhiṣekair munibhiḥ","von Weisen, die das Bad vollzogen hatten (Instr.)"],["hutāgnibhir upasthitāḥ","aufgesucht von denen, die das Feuer geopfert hatten (Instr. + Ptz.)"]]],["008","vāneyapuṣpanikarair ājyadhūmodgamair api brāhmeṇa vapuṣā yuktā yuktā munigaṇaiś ca tāḥ","versehen mit Haufen von Waldblumen und aufsteigendem Rauch des geopferten Schmalzes, ausgestattet mit brahmischer Gestalt, [Altäre,] die mit Scharen von Weisen versehen waren.","",[["vāneyapuṣpanikaraiḥ","mit Haufen von Waldblumen (Instr.)"],["ājyadhūmodgamair api","auch mit aufsteigendem Rauch des Schmalzopfers (Instr.)"],["brāhmeṇa vapuṣā yuktāḥ","mit brahmischer Gestalt versehen (Instr. + Adj.)"],["munigaṇaiś ca yuktāḥ","und mit Scharen von Weisen versehen (Instr. + Adj.)"]]],["009","mṛgayūthair anudvignais tatra tatra samāśritaiḥ aśaṅkitaiḥ pakṣigaṇaiḥ pragītair iva ca prabho","mit unbeunruhigten Rudeln von Wild, die dort und dort Zuflucht genommen hatten, mit furchtlosen Vogelscharen, gleichsam wie im Gesang, o Herr,","",[["mṛgayūthair anudvignaiḥ","mit unbeunruhigten Rudeln von Wild (Instr.)"],["tatra tatra samāśritaiḥ","die dort und dort Zuflucht genommen hatten (Ptz.)"],["aśaṅkitaiḥ pakṣigaṇaiḥ","mit furchtlosen Vogelscharen (Instr.)"],["pragītair iva","gleichsam wie besungen (Instr. + Partikel)"]]],["010","kekābhir nīlakaṇṭhānāṃ dātyūhānāṃ ca kūjitaiḥ kokilānāṃ ca kuharaiḥ śubhaiḥ śrutimanoharaiḥ","mit den Schreien der Pfauen und dem Girren der Wasserhühner, und mit den schönen, das Gehör bezaubernden Rufen der Kokilas,","",[["kekābhir nīlakaṇṭhānām","mit den Schreien der Blauhälse [Pfauen] (Instr. + Gen.)"],["dātyūhānāṃ ca kūjitaiḥ","und mit dem Girren der Wasserhühner (Gen. + Instr.)"],["kokilānāṃ ca kuharaiḥ","und mit den Rufen der Kokilas (Gen. + Instr.)"],["śubhaiḥ śrutimanoharaiḥ","mit schönen, das Gehör entzückenden [Rufen] (Adj.)"]]],["011","prādhītadvijaghoṣaiś ca kva cit kva cid alaṃkṛtam phalamūlasamudvāhair mahadbhiś copaśobhitam","und mit den Klängen rezitierender Brahmanen hier und dort geschmückt, und verschönt durch mächtige [Bäume], die reichlich Früchte und Wurzeln trugen.","Die Bezugnahme von 'mahadbhiḥ' (den Großen) auf Bäume ist aus dem Kontext erschlossen, im Sanskrit nicht explizit als vṛkṣa benannt.[?]",[["prādhītadvijaghoṣaiḥ","mit den Klängen rezitierender Zweifachgeborener (Instr.)"],["kva cit kva cid alaṃkṛtam","hier und dort geschmückt (Adv. + Ptz.)"],["phalamūlasamudvāhaiḥ","die Früchte und Wurzeln in Fülle trugen (Instr.)"],["mahadbhiś copaśobhitam","und durch die Mächtigen [Bäume] verschönt (Instr. + Ptz.)"]]],["012","tataḥ sa rājā pradadau tāpasārtham upāhṛtān kalaśān kāñcanān rājaṃs tathaivaudumbarān api","Dann gab jener König den Asketen die herbeigebrachten goldenen Krüge, o König, und ebenso auch die aus Udumbara-Holz,","",[["tataḥ sa rājā pradadau","dann gab jener König (Perf. pra+dā)"],["tāpasārtham upāhṛtān","für die Asketen herbeigebrachte (Akk.)"],["kalaśān kāñcanān","goldene Krüge (Akk. Pl.)"],["tathaivaudumbarān api","und ebenso auch die aus Udumbara-Holz (Akk. Pl.)"]]],["013","ajināni praveṇīś ca sruksruvaṃ ca mahīpatiḥ kamaṇḍalūṃs tathā sthālīḥ piṭharāṇi ca bhārata","Fell-Decken und Bastmatten, und Opferlöffel und Opferkelle gab der Herrscher der Erde, ebenso Wasserkrüge, Kochtöpfe und Kessel, o Bhārata,","",[["ajināni praveṇīś ca","Felldecken und Bastmatten (Akk. Pl.)"],["sruksruvaṃ ca mahīpatiḥ","und Opferlöffel-und-kelle [gab] der Herrscher der Erde (Akk. + Nom.)"],["kamaṇḍalūṃs tathā sthālīḥ","Wasserkrüge, ebenso Kochtöpfe (Akk. Pl.)"],["piṭharāṇi ca bhārata","und Kessel, o Bhārata (Akk. Pl. + Vok.)"]]],["014","bhājanāni ca lauhāni pātrīś ca vividhā nṛpa yad yad icchati yāvac ca yad anyad api kāṅkṣitam","und eiserne Gefäße und vielerlei Schalen, o König – was immer einer wünschte, und was immer sonst noch begehrt wurde.","",[["bhājanāni ca lauhāni","und eiserne Gefäße (Akk. Pl.)"],["pātrīś ca vividhāḥ","und vielerlei Schalen (Akk. Pl.)"],["yad yad icchati","was immer einer wünscht (Präs. + Relativ)"],["yad anyad api kāṅkṣitam","und was auch sonst begehrt wurde (Ptz. Perf. Pass.)"]]],["015","evaṃ sa rājā dharmātmā parītyāśramamaṇḍalam vasu viśrāṇya tat sarvaṃ punar āyān mahīpatiḥ","So durchschritt jener König, der Fromme, den Umkreis des Āśrama, und nachdem er all jenen Besitz verteilt hatte, kehrte der Herrscher der Erde wieder zurück.","",[["evaṃ sa rājā dharmātmā","so jener König, der Fromme (Nom.)"],["parītyāśramamaṇḍalam","nachdem er den Umkreis des Āśrama durchschritten hatte (Abs.)"],["vasu viśrāṇya tat sarvam","nachdem er all jenen Besitz verteilt hatte (Abs. + Akk.)"],["punar āyān mahīpatiḥ","kehrte der Herrscher der Erde wieder zurück (Impf. ā+i)"]]],["016","kṛtāhnikaṃ ca rājānaṃ dhṛtarāṣṭraṃ manīṣiṇam dadarśāsīnam avyagraṃ gāndhārīsahitaṃ tadā","Und er sah den König Dhṛtarāṣṭra, den Weisen, der die Tagesriten vollzogen hatte, ruhig sitzend, zusammen mit Gāndhārī, damals.","",[["kṛtāhnikaṃ rājānam","den König, der die Tagesriten vollzogen hatte (Akk.)"],["dhṛtarāṣṭraṃ manīṣiṇam","Dhṛtarāṣṭra, den Weisen (Akk.)"],["dadarśāsīnam avyagram","er sah ihn ruhig sitzend (Perf. + Ptz.)"],["gāndhārīsahitaṃ tadā","zusammen mit Gāndhārī, damals (Adj. + Adv.)"]]],["017","mātaraṃ cāvidūrasthāṃ śiṣyavat praṇatāṃ sthitām kuntīṃ dadarśa dharmātmā satataṃ dharmacāriṇīm","Und seine Mutter, die nicht fern stand, wie eine Schülerin verneigt dastehend, Kuntī, sah der Fromme, die stets dem Dharma folgte.","",[["mātaraṃ cāvidūrasthām","und die Mutter, die nicht fern stand (Akk.)"],["śiṣyavat praṇatāṃ sthitām","wie eine Schülerin verneigt dastehend (Adv. + Ptz.)"],["kuntīṃ dadarśa dharmātmā","Kuntī sah der Fromme (Akk. + Perf. + Nom.)"],["satataṃ dharmacāriṇīm","die stets dem Dharma folgte (Akk. Adj.)"]]],["018","sa tam abhyarcya rājānaṃ nāma saṃśrāvya cātmanaḥ niṣīdety abhyanujñāto bṛsyām upaviveśa ha","Er verehrte jenen König und nannte seinen eigenen Namen laut, und, mit „Setz dich!“ aufgefordert, setzte er sich auf ein Sitzkissen.","„niṣīda“ (Setz dich!) ist ein knapper, mit iti eingeleiteter direkter Ausruf, daher mit Anführungszeichen markiert.",[["tam abhyarcya rājānam","nachdem er jenen König verehrt hatte (Abs. + Akk.)"],["nāma saṃśrāvya cātmanaḥ","und seinen eigenen Namen laut verkündend (Abs.)"],["niṣīdety abhyanujñātaḥ","mit „Setz dich!“ aufgefordert (Zitat + Ptz.)"],["bṛsyām upaviveśa ha","er setzte sich auf ein Sitzkissen (Perf. upa+viś)"]]],["019","bhīmasenādayaś caiva pāṇḍavāḥ kauravarṣabham abhivādyopasaṃgṛhya niṣeduḥ pārthivājñayā","Und auch Bhīmasena und die übrigen Pāṇḍavas begrüßten den Stier der Kauravas, umarmten ihn, und setzten sich auf Geheiß des Königs.","",[["bhīmasenādayaḥ pāṇḍavāḥ","Bhīmasena und die übrigen Pāṇḍavas (Nom. Pl.)"],["kauravarṣabham abhivādya","nachdem sie den Stier der Kauravas begrüßt hatten (Abs.)"],["upasaṃgṛhya","nachdem sie ihn umarmt hatten (Abs.)"],["niṣeduḥ pārthivājñayā","sie setzten sich auf Geheiß des Königs (Perf. + Instr.)"]]],["020","sa taiḥ parivṛto rājā śuśubhe 'tīva kauravaḥ bibhrad brāhmīṃ śriyaṃ dīptāṃ devair iva bṛhaspatiḥ","Von ihnen umgeben, erstrahlte jener König der Kauravas überaus, indem er brahmischen, leuchtenden Glanz trug, wie Bṛhaspati unter den Göttern.","",[["sa taiḥ parivṛto rājā","jener König, von ihnen umgeben (Nom. + Ptz.)"],["śuśubhe 'tīva kauravaḥ","der Kaurava erstrahlte überaus (Perf. + Adv.)"],["bibhrad brāhmīṃ śriyaṃ dīptām","den brahmischen, leuchtenden Glanz tragend (Ptz. + Akk.)"],["devair iva bṛhaspatiḥ","wie Bṛhaspati unter den Göttern (Instr. + Nom.)"]]],["021","tathā teṣūpaviṣṭeṣu samājagmur maharṣayaḥ śatayūpaprabhṛtayaḥ kurukṣetranivāsinaḥ","Während sie so dasaßen, kamen große Weise zusammen, angeführt von Śatayūpa, die Bewohner von Kurukṣetra.","",[["teṣūpaviṣṭeṣu","während sie dasaßen (Lok. Abs.)"],["samājagmur maharṣayaḥ","die großen Weisen kamen zusammen (Perf. sam+ā+gam)"],["śatayūpaprabhṛtayaḥ","angeführt von Śatayūpa (Adj.)"],["kurukṣetranivāsinaḥ","die Bewohner von Kurukṣetra (Nom. Pl.)"]]],["022","vyāsaś ca bhagavān vipro devarṣigaṇapūjitaḥ vṛtaḥ śiṣyair mahātejā darśayām āsa taṃ nṛpam","Und der erhabene Brahmane Vyāsa, von Scharen göttlicher Weiser verehrt, von Schülern umgeben, der Gewaltige, zeigte sich jenem König.","",[["vyāsaś ca bhagavān vipraḥ","und der erhabene Brahmane Vyāsa (Nom.)"],["devarṣigaṇapūjitaḥ","von Scharen göttlicher Weiser verehrt (Adj.)"],["vṛtaḥ śiṣyair mahātejāḥ","von Schülern umgeben, der Gewaltige (Ptz. + Adj.)"],["darśayām āsa taṃ nṛpam","er zeigte sich jenem König (Perf. Kaus. dṛś)"]]],["023","tataḥ sa rājā kauravyaḥ kuntīputraś ca vīryavān bhīmasenādayaś caiva samutthāyābhyapūjayan","Da erhoben sich jener König der Kauravas und der kraftvolle Sohn der Kuntī, und auch Bhīmasena und die anderen, und erwiesen Ehrerbietung.","",[["sa rājā kauravyaḥ","jener König der Kauravas (Nom.)"],["kuntīputraś ca vīryavān","und der kraftvolle Sohn der Kuntī (Nom.)"],["bhīmasenādayaś caiva","und auch Bhīmasena und die anderen (Nom. Pl.)"],["samutthāyābhyapūjayan","nachdem sie sich erhoben hatten, erwiesen sie Ehrerbietung (Abs. + Impf.)"]]],["024","samāgatas tato vyāsaḥ śatayūpādibhir vṛtaḥ dhṛtarāṣṭraṃ mahīpālam āsyatām ity abhāṣata","Dann sprach Vyāsa, der herangekommen und von Śatayūpa und den anderen umgeben war, zu König Dhṛtarāṣṭra, dem Herrscher der Erde: „Setzt euch!“","„āsyatām“ (Setzt euch!) ist eine unpersönliche Passiv-Imperativform, mit iti als direkte Rede markiert.",[["samāgatas tato vyāsaḥ","dann Vyāsa, der herangekommen war (Nom.)"],["śatayūpādibhir vṛtaḥ","von Śatayūpa und den anderen umgeben (Ptz.)"],["dhṛtarāṣṭraṃ mahīpālam","zu König Dhṛtarāṣṭra, dem Herrscher der Erde (Akk.)"],["āsyatām ity abhāṣata","er sprach: „Setzt euch!“ (Zitat + Impf. bhāṣ)"]]],["025","navaṃ tu viṣṭaraṃ kauśyaṃ kṛṣṇājinakuśottaram pratipede tadā vyāsas tadartham upakalpitam","Einen neuen Sitz aber aus Kuśa-Gras, mit einer schwarzen Antilopenhaut und Kuśa-Gras obenauf, nahm da Vyāsa ein, der zu diesem Zweck bereitet worden war.","",[["navaṃ viṣṭaraṃ kauśyam","einen neuen Sitz aus Kuśa-Gras (Akk.)"],["kṛṣṇājinakuśottaram","mit schwarzer Antilopenhaut und Kuśa-Gras obenauf (Adj.)"],["pratipede tadā vyāsaḥ","da nahm Vyāsa ein (Perf. prati+pad)"],["tadartham upakalpitam","der zu diesem Zweck bereitet worden war (Ptz. Perf. Pass.)"]]],["026","te ca sarve dvijaśreṣṭhā viṣṭareṣu samantato dvaipāyanābhyanujñātā niṣedur vipulaujasaḥ","Und all jene besten Zweifachgeborenen, die überaus Kraftvollen, setzten sich ringsum auf Sitzen, von Dvaipāyana dazu ermächtigt.","",[["te sarve dvijaśreṣṭhāḥ","all jene besten Zweifachgeborenen (Nom. Pl.)"],["viṣṭareṣu samantataḥ","auf Sitzen ringsum (Lok. + Adv.)"],["dvaipāyanābhyanujñātāḥ","von Dvaipāyana dazu ermächtigt (Ptz.)"],["niṣedur vipulaujasaḥ","die überaus Kraftvollen setzten sich (Perf. + Adj.)"]]]]},{"num":35,"title_sa":"Vyāsasya Dhṛtarāṣṭrapraśna, Viduro Dharma iti Khyāpanam","title_de":"Vyāsas Frage nach Dhṛtarāṣṭras Wohlergehen; die Enthüllung: Vidura ist Dharma","note":"","units":[["001","vaiśaṃpāyana uvāca tathā samupaviṣṭeṣu pāṇḍaveṣu mahātmasu vyāsaḥ satyavatīputraḥ provācāmantrya pārthivam","Vaiśaṃpāyana sprach: Als so die hochherzigen Pāṇḍavas sich gesetzt hatten, sprach Vyāsa, der Sohn der Satyavatī, den König an und begann zu reden.","",[["samupaviṣṭeṣu pāṇḍaveṣu","als die Pāṇḍavas sich gesetzt hatten (Lok. Abs.)"],["mahātmasu","die Hochherzigen (Lok. Adj.)"],["vyāsaḥ satyavatīputraḥ","Vyāsa, der Sohn der Satyavatī (Nom.)"],["provācāmantrya pārthivam","sprach, nachdem er den König angeredet hatte (Perf. + Abs.)"]]],["002","dhṛtarāṣṭra mahābāho kaccit te vardhate tapaḥ kaccin manas te prīṇāti vanavāse narādhipa","„Dhṛtarāṣṭra, Starkarmiger, wächst wohl deine Askese? Erfreut dein Geist sich wohl am Waldleben, o Herrscher der Menschen?","",[["dhṛtarāṣṭra mahābāho","Dhṛtarāṣṭra, Starkarmiger (Vok.)"],["kaccit ... vardhate tapaḥ","wächst wohl die Askese (Frage-Partikel + Präs.)"],["kaccin manas te prīṇāti","erfreut sich wohl dein Geist (Frage-Partikel + Präs.)"],["vanavāse narādhipa","am Waldleben, o Herrscher der Menschen (Lok. + Vok.)"]]],["003","kaccid dhṛdi na te śoko rājan putravināśajaḥ kaccij jñānāni sarvāṇi prasannāni tavānagha","Ist wohl kein Kummer über den Untergang deiner Söhne in deinem Herzen, o König? Sind alle deine Erkenntnisse klar, o Schuldloser?","",[["kaccid dhṛdi na te śokaḥ","ist wohl kein Kummer in deinem Herzen (Frage + Lok. + Nom.)"],["putravināśajaḥ","aus dem Untergang der Söhne entstanden (Adj.)"],["kaccij jñānāni sarvāṇi","sind wohl alle Erkenntnisse (Frage + Nom. Pl.)"],["prasannāni tavānagha","klar, o Schuldloser (Adj. + Vok.)"]]],["004","kaccid buddhiṃ dṛḍhāṃ kṛtvā carasy āraṇyakaṃ vidhim kaccid vadhūś ca gāndhārī na śokenābhibhūyate","Wandelst du wohl, nachdem du deinen Sinn gefestigt hast, den Waldbrauch? Wird wohl auch deine Gattin Gāndhārī nicht vom Kummer überwältigt?","",[["kaccid buddhiṃ dṛḍhāṃ kṛtvā","wohl, nachdem du den Sinn gefestigt hast (Frage + Akk. + Abs.)"],["carasy āraṇyakaṃ vidhim","wandelst du den Waldbrauch (Präs. + Akk.)"],["kaccid vadhūś ca gāndhārī","und wird wohl [deine] Gattin Gāndhārī (Frage + Nom.)"],["na śokenābhibhūyate","nicht vom Kummer überwältigt (Instr. + Pass. Präs.)"]]],["005","mahāprajñā buddhimatī devī dharmārthadarśinī āgamāpāyatattvajñā kaccid eṣā na śocati","Die von großer Weisheit, die Kluge, die Fürstin, die Dharma und Artha erkennt, die das Wesen von Kommen und Vergehen kennt – trauert wohl diese nicht?","",[["mahāprajñā buddhimatī devī","die von großer Weisheit, die Kluge, die Fürstin (Nom. f.)"],["dharmārthadarśinī","die Dharma und Artha erkennt (Adj. f.)"],["āgamāpāyatattvajñā","die das Wesen von Kommen und Vergehen kennt (Adj. f.)"],["kaccid eṣā na śocati","trauert wohl diese nicht (Frage + Präs.)"]]],["006","kaccit kuntī ca rājaṃs tvāṃ śuśrūṣur anahaṃkṛtā yā parityajya rājyaṃ svaṃ guruśuśrūṣaṇe ratā","Und dient dir wohl Kuntī, o König, ohne Hochmut, sie, die ihr eigenes Königreich aufgegeben hat und am Dienst an den Älteren Freude findet?","",[["kaccit kuntī ca rājan","und Kuntī wohl, o König (Frage + Nom. + Vok.)"],["tvāṃ śuśrūṣur anahaṃkṛtā","dir dienend, ohne Hochmut (Adj. + Adj.)"],["parityajya rājyaṃ svam","nachdem sie ihr eigenes Königreich aufgegeben hat (Abs. + Akk.)"],["guruśuśrūṣaṇe ratā","am Dienst an den Älteren erfreut (Lok. + Adj.)"]]],["007","kaccid dharmasuto rājā tvayā prītyābhinanditaḥ bhīmārjunayamāś caiva kaccid ete 'pi sāntvitāḥ","Wird wohl der König, der Sohn des Dharma, von dir mit Freude begrüßt? Und werden wohl auch Bhīma, Arjuna und die Zwillinge von dir getröstet?","",[["kaccid dharmasuto rājā","wohl der König, der Sohn des Dharma (Frage + Nom.)"],["tvayā prītyābhinanditaḥ","von dir mit Freude begrüßt (Instr. + Ptz.)"],["bhīmārjunayamāś caiva","und auch Bhīma, Arjuna und die Zwillinge (Nom. Pl.)"],["kaccid ete 'pi sāntvitāḥ","werden wohl auch diese getröstet (Frage + Ptz.)"]]],["008","kaccin nandasi dṛṣṭvaitān kaccit te nirmalaṃ manaḥ kaccid viśuddhabhāvo 'si jātajñāno narādhipa","Freust du dich wohl, wenn du sie siehst? Ist dein Geist wohl unbefleckt? Bist du wohl reinen Wesens geworden, zu Erkenntnis gelangt, o Herrscher der Menschen?","",[["kaccin nandasi dṛṣṭvaitān","freust du dich wohl, wenn du sie siehst (Frage + Präs. + Abs.)"],["kaccit te nirmalaṃ manaḥ","ist wohl dein Geist unbefleckt (Frage + Nom.)"],["kaccid viśuddhabhāvo 'si","bist du wohl reinen Wesens (Frage + Nom. + Präs.)"],["jātajñāno narādhipa","zu Erkenntnis gelangt, o Herrscher der Menschen (Adj. + Vok.)"]]],["009","etad dhi tritayaṃ śreṣṭhaṃ sarvabhūteṣu bhārata nirvairatā mahārāja satyam adroha eva ca","Denn dies ist die dreifache Vortrefflichkeit unter allen Wesen, o Bhārata: Feindlosigkeit, o Großkönig, Wahrheit und auch Arglosigkeit.","",[["etad dhi tritayaṃ śreṣṭham","denn dies ist die dreifache Vortrefflichkeit (Nom.)"],["sarvabhūteṣu bhārata","unter allen Wesen, o Bhārata (Lok. + Vok.)"],["nirvairatā mahārāja","Feindlosigkeit, o Großkönig (Nom. + Vok.)"],["satyam adroha eva ca","Wahrheit und auch Arglosigkeit (Nom.)"]]],["010","kaccit te nānutāpo 'sti vanavāsena bhārata svadate vanyam annaṃ vā munivāsāṃsi vā vibho","Empfindest du wohl keine Reue über das Waldleben, o Bhārata? Schmeckt dir wohl die Waldkost, oder die Gewänder der Asketen, o Gebieter?","",[["kaccit te nānutāpo 'sti","hast du wohl keine Reue (Frage + Nom. + Präs.)"],["vanavāsena bhārata","über das Waldleben, o Bhārata (Instr. + Vok.)"],["svadate vanyam annaṃ vā","schmeckt dir die Waldkost, oder (Präs. + Nom.)"],["munivāsāṃsi vā vibho","die Gewänder der Asketen, oder, o Gebieter (Nom. Pl. + Vok.)"]]],["011","viditaṃ cāpi me rājan vidurasya mahātmanaḥ gamanaṃ vidhinā yena dharmasya sumahātmanaḥ","Und mir ist auch bekannt, o König, der Hingang Viduras, des Hochherzigen – durch jene Fügung, in der er mit Dharma, dem überaus Hochherzigen, eins wurde.","Der Satz ist im Original elliptisch und bereitet die folgenden Verse (012-014) vor, die erklären, dass Vidura eine Verkörperung des Dharma war.[?]",[["viditaṃ cāpi me rājan","und mir ist auch bekannt, o König (Ptz. + Vok.)"],["vidurasya mahātmanaḥ gamanam","der Hingang Viduras, des Hochherzigen (Gen. + Nom.)"],["vidhinā yena","durch jene Fügung, mit der (Instr. + Rel.)"],["dharmasya sumahātmanaḥ","des Dharma, des überaus Hochherzigen (Gen.)"]]],["012","māṇḍavyaśāpād dhi sa vai dharmo viduratāṃ gataḥ mahābuddhir mahāyogī mahātmā sumahāmanāḥ","Denn durch den Fluch des Māṇḍavya war jener Dharma fürwahr in den Zustand Viduras eingegangen, der von großer Einsicht, der große Yogin, der Hochherzige, der überaus Hochgesinnte.","",[["māṇḍavyaśāpād dhi","denn durch den Fluch des Māṇḍavya (Abl.)"],["sa vai dharmo viduratāṃ gataḥ","jener Dharma fürwahr ging in den Zustand Viduras ein (Nom. + Akk. + Ptz.)"],["mahābuddhir mahāyogī","der von großer Einsicht, der große Yogin (Nom.)"],["mahātmā sumahāmanāḥ","der Hochherzige, der überaus Hochgesinnte (Nom.)"]]],["013","bṛhaspatir vā deveṣu śukro vāpy asureṣu yaḥ na tathā buddhisaṃpanno yathā sa puruṣarṣabhaḥ","Weder Bṛhaspati unter den Göttern noch Śukra unter den Asuras war so mit Einsicht ausgestattet, wie jener Stier unter den Männern.","",[["bṛhaspatir vā deveṣu","Bṛhaspati unter den Göttern, oder (Nom. + Lok.)"],["śukro vāpy asureṣu","Śukra unter den Asuras, oder auch (Nom. + Lok.)"],["na tathā buddhisaṃpannaḥ","war nicht so mit Einsicht ausgestattet (Adj.)"],["yathā sa puruṣarṣabhaḥ","wie jener Stier unter den Männern (Adv. + Nom.)"]]],["014","tapobalavyayaṃ kṛtvā sumahac cirasaṃbhṛtam māṇḍavyenarṣiṇā dharmo hy abhibhūtaḥ sanātanaḥ","Nachdem er den überaus großen, lange angesammelten Vorrat an Askesekraft aufgewendet hatte, wurde der ewige Dharma fürwahr vom Weisen Māṇḍavya überwältigt.","",[["tapobalavyayaṃ kṛtvā","nachdem er den Vorrat an Askesekraft aufgewendet hatte (Abs.)"],["sumahac cirasaṃbhṛtam","den überaus großen, lange angesammelten (Adj.)"],["māṇḍavyenarṣiṇā","vom Weisen Māṇḍavya (Instr.)"],["dharmo hy abhibhūtaḥ sanātanaḥ","der ewige Dharma wurde fürwahr überwältigt (Nom. + Ptz. + Adj.)"]]],["015","niyogād brahmaṇaḥ pūrvaṃ mayā svena balena ca vaicitravīryake kṣetre jātaḥ sa sumahāmatiḥ","Auf Geheiß Brahmans, einst, und durch meine eigene Kraft, wurde jener von überaus großer Einsicht im Feld des Vicitravīrya geboren.","",[["niyogād brahmaṇaḥ pūrvam","auf Geheiß Brahmans, einst (Abl. + Adv.)"],["mayā svena balena ca","und durch meine eigene Kraft (Instr.)"],["vaicitravīryake kṣetre","im Feld des [Sohnes] Vicitravīryas (Lok.)"],["jātaḥ sa sumahāmatiḥ","wurde jener von überaus großer Einsicht geboren (Ptz. + Nom.)"]]],["016","bhrātā tava mahārāja devadevaḥ sanātanaḥ dhāraṇāc chreyaso dhyānād yaṃ dharmaṃ kavayo viduḥ","Dein Bruder, o Großkönig, der ewige Gott der Götter – ihn erkennen die Seher als Dharma, kraft des Festhaltens am Guten und kraft der Versenkung,","",[["bhrātā tava mahārāja","dein Bruder, o Großkönig (Nom. + Vok.)"],["devadevaḥ sanātanaḥ","der ewige Gott der Götter (Nom.)"],["dhāraṇāc chreyaso dhyānād","kraft des Festhaltens am Guten, kraft der Versenkung (Abl.)"],["yaṃ dharmaṃ kavayo viduḥ","den die Seher als Dharma kennen (Akk. + Nom. + Perf.)"]]],["017","satyena saṃvardhayati damena niyamena ca ahiṃsayā ca dānena tapasā ca sanātanaḥ","ihn, den Ewigen, den er mehrt durch Wahrheit, durch Selbstbeherrschung und Zucht, durch Gewaltlosigkeit und Freigebigkeit und durch Askese,","",[["satyena saṃvardhayati","er mehrt durch Wahrheit (Instr. + Präs.)"],["damena niyamena ca","durch Selbstbeherrschung und Zucht (Instr.)"],["ahiṃsayā ca dānena","durch Gewaltlosigkeit und durch Freigebigkeit (Instr.)"],["tapasā ca sanātanaḥ","und durch Askese, der Ewige (Instr. + Nom.)"]]],["018","yena yogabalāj jātaḥ kururājo yudhiṣṭhiraḥ dharma ity eṣa nṛpate prājñenāmitabuddhinā","durch dessen Yoga-Kraft der Kuru-König Yudhiṣṭhira geboren wurde – das ist, o Herrscher, Dharma, erkannt von mir, dem Weisen unermesslicher Einsicht.","",[["yena yogabalāj jātaḥ","durch dessen Yoga-Kraft geboren wurde (Instr. + Ptz.)"],["kururājo yudhiṣṭhiraḥ","der Kuru-König Yudhiṣṭhira (Nom.)"],["dharma ity eṣa nṛpate","das ist Dharma, o Herrscher (Nom. + Vok.)"],["prājñenāmitabuddhinā","von mir, dem Weisen unermesslicher Einsicht (Instr.)"]]],["019","yathā hy agnir yathā vāyur yathāpaḥ pṛthivī yathā yathākāśaṃ tathā dharma iha cāmutra ca sthitaḥ","Denn wie das Feuer, wie der Wind, wie das Wasser, wie die Erde, wie der Äther, so ist Dharma hier und im Jenseits gegenwärtig.","",[["yathā hy agnir yathā vāyuḥ","wie das Feuer, wie der Wind (Nom.)"],["yathāpaḥ pṛthivī yathā","wie das Wasser, wie die Erde (Nom.)"],["yathākāśaṃ tathā dharmaḥ","wie der Äther, so Dharma (Nom.)"],["iha cāmutra ca sthitaḥ","hier und im Jenseits gegenwärtig (Adv. + Ptz.)"]]],["020","sarvagaś caiva kauravya sarvaṃ vyāpya carācaram dṛśyate devadevaḥ sa siddhair nirdagdhakilbiṣaiḥ","Und allgegenwärtig, o Kaurava, alles Bewegliche und Unbewegliche durchdringend, wird jener Gott der Götter von den Vollendeten gesehen, deren Verfehlungen verbrannt sind.","",[["sarvagaś caiva kauravya","und allgegenwärtig, o Kaurava (Adj. + Vok.)"],["sarvaṃ vyāpya carācaram","alles Bewegliche und Unbewegliche durchdringend (Abs. + Akk.)"],["dṛśyate devadevaḥ","wird der Gott der Götter gesehen (Pass. Präs. + Nom.)"],["siddhair nirdagdhakilbiṣaiḥ","von den Vollendeten, deren Verfehlungen verbrannt sind (Instr.)"]]],["021","yo hi dharmaḥ sa viduro viduro yaḥ sa pāṇḍavaḥ sa eṣa rājan vaśyas te pāṇḍavaḥ preṣyavat sthitaḥ","Denn wer Dharma ist, der ist Vidura; wer Vidura ist, der ist nun der Pāṇḍava; eben dieser Pāṇḍava, o König, steht dir ergeben, wie ein Diener, zur Verfügung.","",[["yo hi dharmaḥ sa viduraḥ","wer Dharma ist, der ist Vidura (Rel. + Nom.)"],["viduro yaḥ sa pāṇḍavaḥ","wer Vidura ist, der ist der Pāṇḍava (Nom. + Rel. + Nom.)"],["sa eṣa rājan vaśyas te","eben dieser, o König, dir ergeben (Nom. + Vok. + Adj.)"],["pāṇḍavaḥ preṣyavat sthitaḥ","der Pāṇḍava steht wie ein Diener (Nom. + Adv. + Ptz.)"]]],["022","praviṣṭaḥ sa svam ātmānaṃ bhrātā te buddhisattamaḥ diṣṭyā mahātmā kaunteyaṃ mahāyogabalānvitaḥ","Er, dein hochweiser Bruder, der Hochherzige, mit großer Yoga-Kraft ausgestattet, ist glücklicherweise in seinen eigenen Wesenskern eingegangen – in den Sohn der Kuntī.","",[["praviṣṭaḥ sa svam ātmānam","er ist in seinen eigenen Wesenskern eingegangen (Ptz. + Akk.)"],["bhrātā te buddhisattamaḥ","dein Bruder von höchster Einsicht (Nom.)"],["diṣṭyā mahātmā","glücklicherweise, der Hochherzige (Adv. + Nom.)"],["kaunteyaṃ mahāyogabalānvitaḥ","in den Sohn der Kuntī, mit großer Yoga-Kraft ausgestattet (Akk. + Adj.)"]]],["023","tvāṃ cāpi śreyasā yokṣye nacirād bharatarṣabha saṃśayacchedanārthaṃ hi prāptaṃ māṃ viddhi putraka","Und auch dich werde ich bald mit Heil verbinden, o Stier der Bharatas; wisse, dass ich gekommen bin, um Zweifel zu zerschneiden, mein Sohn.","",[["tvāṃ cāpi śreyasā yokṣye","und auch dich werde ich mit Heil verbinden (Akk. + Instr. + Fut.)"],["nacirād bharatarṣabha","bald, o Stier der Bharatas (Adv. + Vok.)"],["saṃśayacchedanārtham","um der Zerschneidung des Zweifels willen (Akk.)"],["prāptaṃ māṃ viddhi putraka","wisse, dass ich gekommen bin, mein Sohn (Ptz. + Akk. + Imp. + Vok.)"]]],["024","na kṛtaṃ yat purā kaiś cit karma loke maharṣibhiḥ āścaryabhūtaṃ tapasaḥ phalaṃ saṃdarśayāmi vaḥ","Eine Tat, die vordem von keinem der großen Seher in der Welt vollbracht wurde, eine wunderbare Frucht der Askese, will ich euch zeigen.","",[["na kṛtaṃ yat purā","was vordem nicht vollbracht wurde (Ptz. + Rel. + Adv.)"],["kaiś cit karma loke maharṣibhiḥ","von irgendwelchen großen Sehern in der Welt (Instr. + Akk. + Lok.)"],["āścaryabhūtaṃ tapasaḥ phalam","die wunderbare Frucht der Askese (Akk.)"],["saṃdarśayāmi vaḥ","will ich euch zeigen (Präs. + Akk.)"]]],["025","kim icchasi mahīpāla mattaḥ prāptum amānuṣam draṣṭuṃ spraṣṭum atha śrotuṃ vada kartāsmi tat tathā","Was wünschst du, o Herrscher der Erde, von mir Übermenschliches zu erlangen – zu sehen, zu berühren oder zu hören? Sprich, ich werde es ebenso tun.“","",[["kim icchasi mahīpāla","was wünschst du, o Herrscher der Erde (Interr. + Präs. + Vok.)"],["mattaḥ prāptum amānuṣam","von mir Übermenschliches zu erlangen (Abl. + Inf. + Akk.)"],["draṣṭuṃ spraṣṭum atha śrotum","zu sehen, zu berühren oder zu hören (Inf.)"],["vada kartāsmi tat tathā","sprich, ich werde es ebenso tun (Imp. + Fut. + Pron. + Adv.)"]]]]},{"num":36,"title_sa":"Janamejayapraśna, Vyāsavaradāna, Dhṛtarāṣṭravilāpa","title_de":"Janamejayas Frage; Vyāsas Angebot einer Gunst; Dhṛtarāṣṭras Klage","note":"","units":[["001","janamejaya uvāca vanavāsaṃ gate vipra dhṛtarāṣṭre mahīpatau sabhārye nṛpaśārdūle vadhvā kuntyā samanvite","Janamejaya sprach: Als König Dhṛtarāṣṭra, der Herr der Erde, der Tiger unter den Herrschern, ins Waldleben gegangen war, o Brahmane, zusammen mit seiner Gattin, begleitet von der Schwiegertochter Kuntī,","'vadhū' (Schwiegertochter/junge Frau) wird hier lose für Kuntī verwendet, die genealogisch Dhṛtarāṣṭras Schwägerin, nicht Schwiegertochter ist.[?]",[["vanavāsaṃ gate dhṛtarāṣṭre","als Dhṛtarāṣṭra ins Waldleben gegangen war (Lok. Abs.)"],["mahīpatau nṛpaśārdūle","der Herr der Erde, der Tiger unter den Herrschern (Lok. Adj.)"],["sabhārye","zusammen mit der Gattin (Adj.)"],["vadhvā kuntyā samanvite","begleitet von der Schwiegertochter Kuntī (Instr. + Ptz.)"]]],["002","vidure cāpi saṃsiddhe dharmarājaṃ vyapāśrite vasatsu pāṇḍuputreṣu sarveṣv āśramamaṇḍale","und als auch Vidura zur Vollendung gelangt war, nachdem er beim Dharma-König Zuflucht genommen hatte, während alle Söhne des Pāṇḍu im ganzen Umkreis des Āśrama weilten –","",[["vidure ca saṃsiddhe","und als Vidura vollendet war (Lok. Abs.)"],["dharmarājaṃ vyapāśrite","der beim Dharma-König Zuflucht genommen hatte (Akk. + Ptz.)"],["vasatsu pāṇḍuputreṣu","während die Söhne des Pāṇḍu weilten (Lok. Abs.)"],["sarveṣv āśramamaṇḍale","im ganzen Umkreis des Āśrama (Lok.)"]]],["003","yat tad āścaryam iti vai kariṣyāmīty uvāca ha vyāsaḥ paramatejasvī maharṣis tad vadasva me","jenes Wunder, von dem Vyāsa, der von höchster Glut, der große Seher, fürwahr sagte: „Ich werde es vollbringen“ – das erzähle mir.","",[["yat tad āścaryam","jenes Wunder, das (Akk.)"],["kariṣyāmīty uvāca ha vyāsaḥ","„Ich werde es vollbringen“, sagte fürwahr Vyāsa (Zitat + Perf.)"],["paramatejasvī maharṣiḥ","der von höchster Glut, der große Seher (Nom.)"],["tad vadasva me","das erzähle mir (Imp. + Dat.)"]]],["004","vanavāse ca kauravyaḥ kiyantaṃ kālam acyutaḥ yudhiṣṭhiro narapatir nyavasat sajano dvija","Und wie lange verweilte der Kaurava, der unwandelbare König Yudhiṣṭhira, im Waldleben, zusammen mit seinem Gefolge, o Zweifachgeborener?","",[["vanavāse kiyantaṃ kālam","im Waldleben, wie lange Zeit (Lok. + Akk.)"],["kauravyo 'cyutaḥ yudhiṣṭhiraḥ","der unwandelbare Kaurava Yudhiṣṭhira (Nom.)"],["nyavasat sajano dvija","verweilte samt Gefolge, o Zweifachgeborener (Impf. + Adj. + Vok.)"],["narapatiḥ","der Herr der Menschen (Nom.)"]]],["005","kimāhārāś ca te tatra sasainyā nyavasan prabho sāntaḥpurā mahātmāna iti tad brūhi me 'nagha","Und von welcher Speise lebten sie dort, zusammen mit dem Heer, o Gebieter, die Hochherzigen, samt dem Frauengemach – das sage mir, o Schuldloser.","",[["kimāhārāś ca te","und von welcher Speise sie (Interr.-Adj. + Nom. Pl.)"],["sasainyā nyavasan prabho","verweilten samt Heer, o Gebieter (Adj. + Impf. + Vok.)"],["sāntaḥpurā mahātmānaḥ","samt Frauengemach, die Hochherzigen (Adj. + Nom. Pl.)"],["tad brūhi me 'nagha","das sage mir, o Schuldloser (Imp. + Dat. + Vok.)"]]],["006","vaiśaṃpāyana uvāca te 'nujñātās tadā rājan kururājena pāṇḍavāḥ vividhāny annapānāni viśrāmyānubhavanti te","Vaiśaṃpāyana sprach: Von dem Kuru-König damals entlassen, o König, genossen die Pāṇḍavas, ausruhend, mancherlei Speisen und Getränke.","",[["te 'nujñātās tadā","sie, damals entlassen (Ptz. + Adv.)"],["kururājena pāṇḍavāḥ","von dem Kuru-König, die Pāṇḍavas (Instr. + Nom.)"],["vividhāny annapānāni","mancherlei Speisen und Getränke (Akk. Pl.)"],["viśrāmyānubhavanti te","sie genossen, ausruhend (Präs. + Abs.)"]]],["007","māsam ekaṃ vijahrus te sasainyāntaḥpurā vane atha tatrāgamad vyāso yathoktaṃ te mayānagha","Einen ganzen Monat verweilten sie vergnügt im Wald, zusammen mit Heer und Frauengemach; dann kam Vyāsa dorthin, wie ich es dir bereits gesagt habe, o Schuldloser.","",[["māsam ekaṃ vijahrus te","einen Monat lang vergnügten sie sich (Akk. + Perf.)"],["sasainyāntaḥpurā vane","samt Heer und Frauengemach im Wald (Adj. + Lok.)"],["atha tatrāgamad vyāsaḥ","dann kam dort Vyāsa an (Impf.)"],["yathoktaṃ te mayānagha","wie ich es dir bereits gesagt habe, o Schuldloser (Adj. + Instr. + Vok.)"]]],["008","tathā tu teṣāṃ sarveṣāṃ kathābhir nṛpasaṃnidhau vyāsam anvāsatāṃ rājann ājagmur munayo 'pare","Während sie alle so mit Erzählungen in Gegenwart des Königs bei Vyāsa saßen, o König, kamen noch andere Weise hinzu,","",[["teṣāṃ sarveṣāṃ kathābhiḥ","mit den Erzählungen von ihnen allen (Gen. + Instr.)"],["nṛpasaṃnidhau","in Gegenwart des Königs (Lok.)"],["vyāsam anvāsatāṃ rājan","während sie bei Vyāsa saßen, o König (Impf. + Vok.)"],["ājagmur munayo 'pare","kamen andere Weise hinzu (Perf. + Nom. Pl.)"]]],["009","nāradaḥ parvataś caiva devalaś ca mahātapāḥ viśvāvasus tumburuś ca citrasenaś ca bhārata","Nārada und Parvata, und Devala, der von großer Askese, Viśvāvasu und Tumburu und Citrasena, o Bhārata.","",[["nāradaḥ parvataś caiva","Nārada und Parvata (Nom.)"],["devalaś ca mahātapāḥ","und Devala, der von großer Askese (Nom.)"],["viśvāvasus tumburuś ca","Viśvāvasu und Tumburu (Nom.)"],["citrasenaś ca bhārata","und Citrasena, o Bhārata (Nom. + Vok.)"]]],["010","teṣām api yathānyāyaṃ pūjāṃ cakre mahāmanāḥ dhṛtarāṣṭrābhyanujñātaḥ kururājo yudhiṣṭhiraḥ","Auch ihnen erwies der Kuru-König Yudhiṣṭhira, der Hochgesinnte, mit Dhṛtarāṣṭras Erlaubnis, gebührende Verehrung.","",[["teṣām api yathānyāyam","auch ihnen, gebührend (Gen. + Adv.)"],["pūjāṃ cakre mahāmanāḥ","erwies Verehrung, der Hochgesinnte (Akk. + Perf. + Nom.)"],["dhṛtarāṣṭrābhyanujñātaḥ","mit Dhṛtarāṣṭras Erlaubnis (Ptz.)"],["kururājo yudhiṣṭhiraḥ","der Kuru-König Yudhiṣṭhira (Nom.)"]]],["011","niṣedus te tataḥ sarve pūjāṃ prāpya yudhiṣṭhirāt āsaneṣv atha puṇyeṣu barhiṣkeṣu vareṣu ca","Dann setzten sie sich alle, nachdem sie von Yudhiṣṭhira Verehrung empfangen hatten, auf heiligen, mit Opfergras bedeckten, vortrefflichen Sitzen nieder.","",[["niṣedus te tataḥ sarve","dann setzten sie sich alle (Perf. + Nom. Pl.)"],["pūjāṃ prāpya yudhiṣṭhirāt","nachdem sie von Yudhiṣṭhira Verehrung empfangen hatten (Abs. + Abl.)"],["āsaneṣv atha puṇyeṣu","dann auf heiligen Sitzen (Lok.)"],["barhiṣkeṣu vareṣu ca","mit Opfergras bedeckten, vortrefflichen (Lok. Adj.)"]]],["012","teṣu tatropaviṣṭeṣu sa tu rājā mahāmatiḥ pāṇḍuputraiḥ parivṛto niṣasāda kurūdvahaḥ","Als sie dort saßen, setzte sich jener König von großer Einsicht, der Erste der Kurus, umgeben von den Söhnen des Pāṇḍu, nieder.","",[["teṣu tatropaviṣṭeṣu","als sie dort saßen (Lok. Abs.)"],["sa tu rājā mahāmatiḥ","jener König aber, von großer Einsicht (Nom.)"],["pāṇḍuputraiḥ parivṛtaḥ","umgeben von den Söhnen des Pāṇḍu (Instr. + Ptz.)"],["niṣasāda kurūdvahaḥ","setzte sich nieder, der Erste der Kurus (Perf. + Nom.)"]]],["013","gāndhārī caiva kuntī ca draupadī sātvatī tathā striyaś cānyās tathānyābhiḥ sahopaviviśus tataḥ","Und Gāndhārī und Kuntī und Draupadī, und ebenso die Sātvatī [Subhadrā], und andere Frauen setzten sich dann zusammen mit weiteren nieder.","'sātvatī' (die Sātvatin) bezeichnet Subhadrā, Kṛṣṇas Schwester aus dem Sātvata-Geschlecht, vgl. V018.",[["gāndhārī caiva kuntī ca","und Gāndhārī und Kuntī (Nom.)"],["draupadī sātvatī tathā","Draupadī und ebenso die Sātvatī [Subhadrā] (Nom.)"],["striyaś cānyāḥ","und andere Frauen (Nom. Pl.)"],["tathānyābhiḥ sahopaviviśuḥ","setzten sich ebenso zusammen mit weiteren nieder (Instr. + Perf.)"]]],["014","teṣāṃ tatra kathā divyā dharmiṣṭhāś cābhavan nṛpa ṛṣīṇāṃ ca purāṇānāṃ devāsuravimiśritāḥ","Dort entstanden ihre göttlichen, überaus dharmakundigen Erzählungen, o König, von den alten Sehern, vermischt mit Geschichten von Göttern und Asuras.","",[["teṣāṃ tatra kathā divyāḥ","ihre dortigen göttlichen Erzählungen (Gen. + Nom. Pl.)"],["dharmiṣṭhāś cābhavan nṛpa","wurden überaus dharmakundig, o König (Nom. + Impf. + Vok.)"],["ṛṣīṇāṃ ca purāṇānām","der alten Seher (Gen. Pl.)"],["devāsuravimiśritāḥ","vermischt mit Göttern und Asuras (Adj.)"]]],["015","tataḥ kathānte vyāsas taṃ prajñācakṣuṣam īśvaram provāca vadatāṃ śreṣṭhaḥ punar eva sa tad vacaḥ prīyamāṇo mahātejāḥ sarvavedavidāṃ varaḥ","Dann, am Ende der Erzählung, sprach Vyāsa, der Beste der Redner, von großer Glut, der Vortrefflichste unter allen Kennern der Veden, erfreut, jenes Wort abermals zu jenem Herrscher mit dem Weisheitsauge.","",[["tataḥ kathānte vyāsaḥ","dann, am Ende der Erzählung, Vyāsa (Adv. + Nom.)"],["taṃ prajñācakṣuṣam īśvaram","zu jenem Herrscher mit dem Weisheitsauge (Akk.)"],["provāca vadatāṃ śreṣṭhaḥ","sprach, der Beste der Redner (Perf. + Nom.)"],["prīyamāṇo mahātejāḥ sarvavedavidāṃ varaḥ","erfreut, von großer Glut, der Vortrefflichste aller Kenner der Veden (Ptz. + Nom.)"]]],["016","viditaṃ mama rājendra yat te hṛdi vivakṣitam dahyamānasya śokena tava putrakṛtena vai","„Bekannt ist mir, o Herrscher der Könige, was du in deinem Herzen zu sagen wünschst, während du, von Kummer verzehrt, fürwahr wegen deiner Söhne leidest.","",[["viditaṃ mama rājendra","bekannt ist mir, o Herrscher der Könige (Ptz. + Vok.)"],["yat te hṛdi vivakṣitam","was du in deinem Herzen zu sagen wünschst (Rel. + Lok. + Ptz.)"],["dahyamānasya śokena","während du von Kummer verzehrt wirst (Ptz. + Instr.)"],["tava putrakṛtena vai","fürwahr wegen deiner Söhne verursacht (Adj. + Partikel)"]]],["017","gāndhāryāś caiva yad duḥkhaṃ hṛdi tiṣṭhati pārthiva kuntyāś ca yan mahārāja draupadyāś ca hṛdi sthitam","Und was für Leid Gāndhārīs Herz erfüllt, o Herrscher, und was, o Großkönig, in Kuntīs und Draupadīs Herzen wohnt,","",[["gāndhāryāś caiva yad duḥkham","und welches Leid Gāndhārīs (Gen. + Rel. + Nom.)"],["hṛdi tiṣṭhati pārthiva","in ihrem Herzen wohnt, o Herrscher (Lok. + Präs. + Vok.)"],["kuntyāś ca yan mahārāja","und was, o Großkönig, Kuntīs (Gen. + Rel. + Vok.)"],["draupadyāś ca hṛdi sthitam","und was in Draupadīs Herzen weilt (Gen. + Lok. + Ptz.)"]]],["018","yac ca dhārayate tīvraṃ duḥkhaṃ putravināśajam subhadrā kṛṣṇabhaginī tac cāpi viditaṃ mama","und welch heftiges Leid, entstanden aus dem Untergang ihres Sohnes, Subhadrā, die Schwester Kṛṣṇas, trägt – auch das ist mir bekannt.","",[["yac ca dhārayate tīvram","und welch heftiges [Leid] sie trägt (Rel. + Präs. + Akk.)"],["duḥkhaṃ putravināśajam","Leid, entstanden aus dem Untergang des Sohnes (Akk.)"],["subhadrā kṛṣṇabhaginī","Subhadrā, die Schwester Kṛṣṇas (Nom.)"],["tac cāpi viditaṃ mama","auch das ist mir bekannt (Nom. + Ptz.)"]]],["019","śrutvā samāgamam imaṃ sarveṣāṃ vas tato nṛpa saṃśayacchedanāyāhaṃ prāptaḥ kauravanandana","Nachdem ich von diesem Zusammentreffen euer aller gehört hatte, o König, bin ich gekommen, um Zweifel zu zerschneiden, o Freude der Kauravas.","",[["śrutvā samāgamam imam","nachdem ich von diesem Zusammentreffen gehört hatte (Abs. + Akk.)"],["sarveṣāṃ vas tato nṛpa","euer aller, o König (Gen. + Vok.)"],["saṃśayacchedanāyāham","ich, um Zweifel zu zerschneiden (Dat. + Nom.)"],["prāptaḥ kauravanandana","bin gekommen, o Freude der Kauravas (Ptz. + Vok.)"]]],["020","ime ca devagandharvāḥ sarve caiva maharṣayaḥ paśyantu tapaso vīryam adya me cirasaṃbhṛtam","Und diese Götter und Gandharvas, und alle großen Seher, mögen heute die Kraft meiner Askese sehen, die lange angesammelte.","",[["ime ca devagandharvāḥ","und diese Götter und Gandharvas (Nom. Pl.)"],["sarve caiva maharṣayaḥ","und alle großen Seher (Nom. Pl.)"],["paśyantu tapaso vīryam","mögen sehen die Kraft der Askese (Imp. + Gen. + Akk.)"],["adya me cirasaṃbhṛtam","heute, die von mir lange angesammelte (Adv. + Akk.)"]]],["021","tad ucyatāṃ mahābāho kaṃ kāmaṃ pradiśāmi te pravaṇo 'smi varaṃ dātuṃ pa
