śya me tapaso balam","So sage denn, Starkarmiger, welchen Wunsch soll ich dir gewähren? Ich bin bereit, eine Gunst zu geben – sieh die Kraft meiner Askese.“","",[["tad ucyatāṃ mahābāho","so sage, Starkarmiger (Imp. + Vok.)"],["kaṃ kāmaṃ pradiśāmi te","welchen Wunsch soll ich dir gewähren (Akk. + Präs. + Dat.)"],["pravaṇo 'smi varaṃ dātum","ich bin bereit, eine Gunst zu geben (Nom. + Akk. + Inf.)"],["paśya me tapaso balam","sieh die Kraft meiner Askese (Imp. + Gen. + Akk.)"]]],["022","evam uktaḥ sa rājendro vyāsenāmitabuddhinā muhūrtam iva saṃcintya vacanāyopacakrame","So von Vyāsa, dem von unermesslicher Einsicht, angesprochen, begann jener König der Könige, nachdem er einen Augenblick nachgedacht hatte, zu sprechen.","",[["evam uktaḥ sa rājendraḥ","so angesprochen, jener König der Könige (Ptz. + Nom.)"],["vyāsenāmitabuddhinā","von Vyāsa, dem von unermesslicher Einsicht (Instr.)"],["muhūrtam iva saṃcintya","nachdem er einen Augenblick nachgedacht hatte (Akk. + Abs.)"],["vacanāyopacakrame","begann zu sprechen (Dat. + Perf.)"]]],["023","dhanyo 'smy anugṛhīto 'smi saphalaṃ jīvitaṃ ca me yan me samāgamo 'dyeha bhavadbhiḥ saha sādhubhiḥ","„Gesegnet bin ich, begnadet bin ich, und mein Leben trägt Frucht, da mir heute hier die Begegnung mit euch Guten zuteil wurde.","",[["dhanyo 'smy anugṛhīto 'smi","gesegnet bin ich, begnadet bin ich (Nom. + Präs.)"],["saphalaṃ jīvitaṃ ca me","und mein Leben trägt Frucht (Nom. + Nom.)"],["yan me samāgamo 'dyeha","da mir heute hier die Begegnung (Rel. + Nom. + Adv.)"],["bhavadbhiḥ saha sādhubhiḥ","mit euch Guten (Instr.)"]]],["024","adya cāpy avagacchāmi gatim iṣṭām ihātmanaḥ bhavadbhir brahmakalpair yat sameto 'haṃ tapodhanāḥ","Und heute erkenne ich das erwünschte Ziel meiner Seele hier, da ich mit euch, den Brahman-Gleichen, zusammengekommen bin, ihr an Askese Reichen.","",[["adya cāpy avagacchāmi","und heute erkenne ich (Adv. + Präs.)"],["gatim iṣṭām ihātmanaḥ","das erwünschte Ziel meiner Seele hier (Akk. + Gen.)"],["bhavadbhir brahmakalpaiḥ","mit euch, den Brahman-Gleichen (Instr.)"],["yat sameto 'haṃ tapodhanāḥ","da ich zusammengekommen bin, ihr an Askese Reichen (Rel. + Ptz. + Vok.)"]]],["025","darśanād eva bhavatāṃ pūto 'haṃ nātra saṃśayaḥ vidyate na bhayaṃ cāpi paralokān mamānaghāḥ","Allein durch euren Anblick bin ich gereinigt, daran besteht kein Zweifel; und auch keine Furcht vor der jenseitigen Welt gibt es für mich, ihr Schuldlosen.","",[["darśanād eva bhavatām","allein durch euren Anblick (Abl. + Gen.)"],["pūto 'haṃ nātra saṃśayaḥ","bin ich gereinigt, daran besteht kein Zweifel (Ptz. + Nom.)"],["vidyate na bhayaṃ cāpi","und auch keine Furcht gibt es (Präs. + Nom.)"],["paralokān mamānaghāḥ","vor der jenseitigen Welt für mich, ihr Schuldlosen (Abl. + Vok.)"]]],["026","kiṃ tu tasya sudurbuddher mandasyāpanayair bhṛśam dūyate me mano nityaṃ smarataḥ putragṛddhinaḥ","Doch durch die Verfehlungen jenes von sehr schlechtem Verstand, des Törichten, schmerzt mein Herz heftig, immer wenn ich mich an meinen nach Herrschaft gierigen Sohn erinnere.","",[["kiṃ tu tasya sudurbuddheḥ","doch durch die Verfehlungen jenes von sehr schlechtem Verstand (Gen.)"],["mandasyāpanayair bhṛśam","des Törichten, heftig (Gen. + Instr. Pl. + Adv.)"],["dūyate me mano nityam","schmerzt mein Herz beständig (Präs. + Gen. + Nom.)"],["smarataḥ putragṛddhinaḥ","wenn ich mich an meinen herrschsüchtigen Sohn erinnere (Ptz. + Gen.)"]]],["027","apāpāḥ pāṇḍavā yena nikṛtāḥ pāpabuddhinā ghātitā pṛthivī ceyaṃ sahasā sanaradvipā","durch den die schuldlosen Pāṇḍavas, den von sündiger Gesinnung, betrogen wurden, und durch den diese Erde samt Menschen und Elefanten jäh vernichtet wurde,","",[["apāpāḥ pāṇḍavā yena","die schuldlosen Pāṇḍavas, durch den (Nom. Pl. + Instr.)"],["nikṛtāḥ pāpabuddhinā","betrogen, den von sündiger Gesinnung (Ptz. + Instr.)"],["ghātitā pṛthivī ceyam","und diese Erde wurde vernichtet (Ptz. + Nom.)"],["sahasā sanaradvipā","jäh, samt Menschen und Elefanten (Adv. + Adj.)"]]],["028","rājānaś ca mahātmāno nānājanapadeśvarāḥ āgamya mama putrārthe sarve mṛtyuvaśaṃ gatāḥ","und die hochherzigen Könige, die Herrscher vieler Länder, die um meines Sohnes willen gekommen waren, alle der Macht des Todes verfielen.","",[["rājānaś ca mahātmānaḥ","und die hochherzigen Könige (Nom. Pl.)"],["nānājanapadeśvarāḥ","die Herrscher vieler Länder (Nom. Pl.)"],["āgamya mama putrārthe","gekommen um meines Sohnes willen (Abs. + Lok.)"],["sarve mṛtyuvaśaṃ gatāḥ","alle verfielen der Macht des Todes (Nom. Pl. + Akk. + Ptz.)"]]],["029","ye te putrāṃś ca dārāś ca prāṇāṃś ca manasaḥ priyān parityajya gatāḥ śūrāḥ pretarājaniveśanam","jene Helden, die ihre Söhne, ihre Gattinnen und die ihrem Herzen teuren Leben aufgaben und in die Behausung des Königs der Toten eingingen,","",[["ye te putrāṃś ca dārāś ca","jene, die ihre Söhne und Gattinnen (Rel. Pl. + Akk.)"],["prāṇāṃś ca manasaḥ priyān","und die dem Herzen teuren Leben (Akk.)"],["parityajya gatāḥ śūrāḥ","aufgaben und gingen, die Helden (Abs. + Ptz. + Nom.)"],["pretarājaniveśanam","in die Behausung des Königs der Toten (Akk.)"]]],["030","kā nu teṣāṃ gatir brahman mitrārthe ye hatā mṛdhe tathaiva putrapautrāṇāṃ mama ye nihatā yudhi","welches Los, o Brahmane, ist wohl jenen beschieden, die um der Freunde willen im Kampf erschlagen wurden, ebenso wie das Los meiner Söhne und Enkel, die im Krieg getötet wurden?","",[["kā nu teṣāṃ gatir brahman","welches Los ist wohl ihnen beschieden, o Brahmane (Interr. + Gen. + Nom. + Vok.)"],["mitrārthe ye hatā mṛdhe","die um der Freunde willen im Kampf getötet wurden (Lok. + Rel. + Ptz. + Lok.)"],["tathaiva putrapautrāṇām","ebenso wie das Los der Söhne und Enkel (Gen. Pl.)"],["mama ye nihatā yudhi","meiner, die im Krieg getötet wurden (Gen. + Rel. + Ptz. + Lok.)"]]],["031","dūyate me mano 'bhīkṣṇaṃ ghātayitvā mahābalam bhīṣmaṃ śāṃtanavaṃ vṛddhaṃ droṇaṃ ca dvijasattamam","Beständig schmerzt mein Herz, da ich den Gewaltigen habe töten lassen, Bhīṣma, den Sohn des Śaṃtanu, den Greisen, und Droṇa, den Besten der Zweifachgeborenen,","",[["dūyate me mano 'bhīkṣṇam","beständig schmerzt mein Herz (Präs. + Gen. + Nom. + Adv.)"],["ghātayitvā mahābalam","nachdem ich den Gewaltigen habe töten lassen (Abs. + Akk.)"],["bhīṣmaṃ śāṃtanavaṃ vṛddham","Bhīṣma, den Sohn des Śaṃtanu, den Greisen (Akk.)"],["droṇaṃ ca dvijasattamam","und Droṇa, den Besten der Zweifachgeborenen (Akk.)"]]],["032","mama putreṇa mūḍhena pāpena suhṛdadviṣā kṣayaṃ nītaṃ kulaṃ dīptaṃ pṛthivīrājyam icchatā","durch meinen törichten, sündigen Sohn, den Hasser seiner eigenen Freunde, der das strahlende Geschlecht dem Untergang zuführte, in seinem Verlangen nach der Herrschaft über die Erde.","",[["mama putreṇa mūḍhena","durch meinen törichten Sohn (Instr.)"],["pāpena suhṛdadviṣā","den sündigen, den Hasser der eigenen Freunde (Instr.)"],["kṣayaṃ nītaṃ kulaṃ dīptam","das strahlende Geschlecht wurde dem Untergang zugeführt (Akk. + Ptz. + Nom.)"],["pṛthivīrājyam icchatā","der die Herrschaft über die Erde begehrte (Instr. Ptz.)"]]],["033","etat sarvam anusmṛtya dahyamāno divāniśam na śāntim adhigacchāmi duḥkhaśokasamāhataḥ iti me cintayānasya pitaḥ śarma na vidyate","All dies bedenkend, Tag und Nacht verbrennend, finde ich keinen Frieden, von Leid und Kummer niedergeschlagen; so, o Vater, während ich dies bedenke, gibt es für mich kein Glück.“","",[["etat sarvam anusmṛtya","all dies bedenkend (Akk. + Abs.)"],["dahyamāno divāniśam","Tag und Nacht verbrennend (Ptz. + Adv.)"],["na śāntim adhigacchāmi","finde ich keinen Frieden (Akk. + Präs.)"],["duḥkhaśokasamāhataḥ","von Leid und Kummer niedergeschlagen (Adj.)"],["iti me cintayānasya pitaḥ śarma na vidyate","so, o Vater, während ich dies bedenke, gibt es für mich kein Glück (Zitat + Gen. + Vok. + Nom. + Präs.)"]]]]},{"num":37,"title_sa":"Gāndhārīvilāpa, Vyāsasya Kuntīdarśana","title_de":"Gāndhārīs Klage; Vyāsa erblickt Kuntī; Vorspiel zu Kuntīs Geständnis","note":"","units":[["001","vaiśaṃpāyana uvāca tac chrutvā vividhaṃ tasya rājarṣeḥ paridevitam punar navīkṛtaḥ śoko gāndhāryā janamejaya","Vaiśaṃpāyana sprach: Nachdem sie diese vielfältige Klage jenes königlichen Sehers gehört hatte, wurde der Kummer der Gāndhārī aufs Neue erweckt, o Janamejaya,","",[["tac chrutvā vividham","nachdem sie dies vielfältige gehört hatte (Abs. + Akk.)"],["tasya rājarṣeḥ paridevitam","die Klage jenes königlichen Sehers (Gen. + Akk.)"],["punar navīkṛtaḥ śokaḥ","der Kummer wurde erneuert (Ptz. + Nom.)"],["gāndhāryā janamejaya","der Gāndhārī, o Janamejaya (Gen. + Vok.)"]]],["002","kuntyā drupadaputryāś ca subhadrāyās tathaiva ca tāsāṃ ca varanārīṇāṃ vadhūnāṃ kauravasya ha","und der Kummer der Kuntī und der Tochter des Drupada, und ebenso der Subhadrā, und jener vortrefflichen Frauen, der Schwiegertöchter des Kaurava.","",[["kuntyā drupadaputryāś ca","der Kuntī und der Tochter des Drupada (Gen.)"],["subhadrāyās tathaiva ca","und ebenso der Subhadrā (Gen.)"],["tāsāṃ ca varanārīṇām","und jener vortrefflichen Frauen (Gen. Pl.)"],["vadhūnāṃ kauravasya ha","der Schwiegertöchter des Kaurava (Gen. Pl.)"]]],["003","putraśokasamāviṣṭā gāndhārī tv idam abravīt śvaśuraṃ baddhanayanā devī prāñjalir utthitā","Von Kummer um ihre Söhne erfüllt, sprach Gāndhārī nun dies zu ihrem Schwiegervater, die Fürstin mit verbundenen Augen, erhoben, mit gefalteten Händen.","",[["putraśokasamāviṣṭā","von Kummer um ihre Söhne erfüllt (Adj. f.)"],["gāndhārī tv idam abravīt","Gāndhārī aber sprach dies (Nom. + Akk. + Impf.)"],["śvaśuraṃ baddhanayanā devī","zum Schwiegervater, die Fürstin mit verbundenen Augen (Akk. + Adj. + Nom.)"],["prāñjalir utthitā","erhoben, mit gefalteten Händen (Adj. + Ptz.)"]]],["004","ṣoḍaśemāni varṣāṇi gatāni munipuṃgava asya rājño hatān putrāñ śocato na śamo vibho","„Sechzehn Jahre sind nun vergangen, o Stier unter den Weisen; für diesen König, der um seine erschlagenen Söhne trauert, gibt es keine Ruhe, o Gebieter.","",[["ṣoḍaśemāni varṣāṇi gatāni","sechzehn Jahre sind vergangen (Nom. Pl. + Ptz.)"],["munipuṃgava","o Stier unter den Weisen (Vok.)"],["asya rājño hatān putrāñ śocataḥ","für diesen König, der die erschlagenen Söhne betrauert (Gen. + Akk. + Ptz.)"],["na śamo vibho","gibt es keine Ruhe, o Gebieter (Nom. + Vok.)"]]],["005","putraśokasamāviṣṭo niḥśvasan hy eṣa bhūmipaḥ na śete vasatīḥ sarvā dhṛtarāṣṭro mahāmune","Von Kummer um seine Söhne erfüllt, seufzend, findet dieser Herr der Erde, Dhṛtarāṣṭra, keinen Schlaf in all den Nächten, o großer Weiser.","",[["putraśokasamāviṣṭaḥ","von Kummer um die Söhne erfüllt (Adj.)"],["niḥśvasan hy eṣa bhūmipaḥ","seufzend, dieser Herr der Erde (Ptz. + Nom.)"],["na śete vasatīḥ sarvāḥ","findet keinen Schlaf in all den Nächten (Präs. + Akk. Pl.)"],["dhṛtarāṣṭro mahāmune","Dhṛtarāṣṭra, o großer Weiser (Nom. + Vok.)"]]],["006","lokān anyān samartho 'si sraṣṭuṃ sarvāṃs tapobalāt kim u lokāntaragatān rājño darśayituṃ sutān","Du vermagst durch die Kraft deiner Askese alle anderen Welten zu erschaffen – wie viel mehr also, dem König seine in eine andere Welt gegangenen Söhne zu zeigen?","",[["lokān anyān samartho 'si","du bist fähig, andere Welten (Akk. + Adj. + Präs.)"],["sraṣṭuṃ sarvāṃs tapobalāt","alle zu erschaffen, durch die Kraft der Askese (Inf. + Abl.)"],["kim u lokāntaragatān","wie viel mehr die in eine andere Welt gegangenen (Partikel + Akk.)"],["rājño darśayituṃ sutān","dem König die Söhne zu zeigen (Gen. + Inf. + Akk.)"]]],["007","iyaṃ ca draupadī kṛṣṇā hatajñātisutā bhṛśam śocaty atīva sādhvī te snuṣāṇāṃ dayitā snuṣā","Und diese Draupadī, die Dunkle, deren Verwandte und Söhne erschlagen wurden, trauert überaus heftig, die Tugendhafte, deine liebste unter den Schwiegertöchtern.","",[["iyaṃ ca draupadī kṛṣṇā","und diese Draupadī, die Dunkle (Nom.)"],["hatajñātisutā bhṛśam","deren Verwandte und Söhne erschlagen wurden, heftig (Adj. + Adv.)"],["śocaty atīva sādhvī","trauert überaus, die Tugendhafte (Präs. + Adv. + Nom.)"],["te snuṣāṇāṃ dayitā snuṣā","deine liebste unter den Schwiegertöchtern (Gen. + Gen. Pl. + Nom.)"]]],["008","tathā kṛṣṇasya bhaginī subhadrā bhadrabhāṣiṇī saubhadravadhasaṃtaptā bhṛśaṃ śocati bhāminī","Ebenso trauert Kṛṣṇas Schwester Subhadrā, die von holder Rede, versengt durch die Tötung des Saubhadra, überaus heftig, die Schöne.","",[["tathā kṛṣṇasya bhaginī","ebenso Kṛṣṇas Schwester (Adv. + Gen. + Nom.)"],["subhadrā bhadrabhāṣiṇī","Subhadrā, die von holder Rede (Nom.)"],["saubhadravadhasaṃtaptā","versengt durch die Tötung des Saubhadra [ihres Sohnes] (Adj.)"],["bhṛśaṃ śocati bhāminī","trauert heftig, die Schöne (Adv. + Präs. + Nom.)"]]],["009","iyaṃ ca bhūriśravaso bhāryā paramaduḥkhitā bhartṛvyasanaśokārtā na śete vasatīḥ prabho","Und diese Gattin des Bhūriśravas, überaus betrübt, vom Kummer über das Unglück ihres Gatten gequält, findet keinen Schlaf in den Nächten, o Gebieter,","",[["iyaṃ ca bhūriśravaso bhāryā","und diese Gattin des Bhūriśravas (Nom. + Gen. + Nom.)"],["paramaduḥkhitā","überaus betrübt (Adj.)"],["bhartṛvyasanaśokārtā","vom Kummer über das Unglück ihres Gatten gequält (Adj.)"],["na śete vasatīḥ prabho","findet keinen Schlaf in den Nächten, o Gebieter (Präs. + Akk. + Vok.)"]]],["010","yasyās tu śvaśuro dhīmān bāhlīkaḥ sa kurūdvahaḥ nihataḥ somadattaś ca pitrā saha mahāraṇe","sie, deren Schwiegervater, der weise Bāhlīka, jener vortreffliche Kuru, erschlagen wurde, und auch Somadatta, zusammen mit seinem Vater, in der großen Schlacht,","",[["yasyās tu śvaśuro dhīmān","sie, deren Schwiegervater, der Weise (Gen. + Nom.)"],["bāhlīkaḥ sa kurūdvahaḥ","Bāhlīka, jener vortreffliche Kuru (Nom.)"],["nihataḥ somadattaś ca","wurde erschlagen, und Somadatta (Ptz. + Nom.)"],["pitrā saha mahāraṇe","zusammen mit seinem Vater, in der großen Schlacht (Instr. + Lok.)"]]],["011","śrīmac cāsya mahābuddheḥ saṃgrāmeṣv apalāyinaḥ putrasya te putraśataṃ nihataṃ yad raṇājire","und dessen prächtige hundert Söhne, des von großer Weisheit, der in den Schlachten niemals floh, wurden auf dem Schlachtfeld erschlagen –","Der Bezug des Pronomens 'te' ist im Original unklar; sinngemäß auf Bhūriśravas (dessen hundert Söhne im Krieg von Sātyaki erschlagen wurden) bezogen, nicht wörtlich auf den Angesprochenen Vyāsa.[?]",[["śrīmac cāsya mahābuddheḥ","und dessen prächtige, des von großer Weisheit (Adj. + Gen.)"],["saṃgrāmeṣv apalāyinaḥ","der in den Schlachten niemals floh (Lok. + Gen. Adj.)"],["putrasya te putraśatam","seine hundert Söhne (Gen. + Nom.)"],["nihataṃ yad raṇājire","wurden auf dem Schlachtfeld erschlagen (Ptz. + Lok.)"]]],["012","tasya bhāryāśatam idaṃ putraśokasamāhatam punaḥ punar vardhayānaṃ śokaṃ rājño mamaiva ca tenārambheṇa mahatā mām upāste mahāmune","Diese hundert Gattinnen jenes Bhūriśravas, vom Kummer um ihre Söhne getroffen, die immer wieder den Kummer des Königs und auch meinen eigenen mehren, warten mit jenem großen Unterfangen der Trauer auf mich, o großer Weiser.","",[["tasya bhāryāśatam idam","diese hundert Gattinnen jenes (Gen. + Nom.)"],["putraśokasamāhatam","vom Kummer um ihre Söhne getroffen (Adj.)"],["punaḥ punar vardhayānaṃ śokam","die immer wieder den Kummer mehren (Adv. + Ptz. + Akk.)"],["tenārambheṇa mahatā mām upāste","mit jenem großen Unterfangen warten sie auf mich (Instr. + Präs.)"]]],["013","ye ca śūrā mahātmānaḥ śvaśurā me mahārathāḥ somadattaprabhṛtayaḥ kā nu teṣāṃ gatiḥ prabho","Und welches Los, o Gebieter, ist wohl jenen heldenhaften, hochherzigen großen Streitwagenkämpfern beschieden, meinen Schwiegervätern, angeführt von Somadatta?","",[["ye ca śūrā mahātmānaḥ","und die heldenhaften, hochherzigen (Nom. Pl.)"],["śvaśurā me mahārathāḥ","meine Schwiegerväter, die großen Streitwagenkämpfer (Nom. Pl.)"],["somadattaprabhṛtayaḥ","angeführt von Somadatta (Adj.)"],["kā nu teṣāṃ gatiḥ prabho","welches Los ist wohl ihnen beschieden, o Gebieter (Interr. + Gen. + Nom. + Vok.)"]]],["014","tava prasādād bhagavan viśoko 'yaṃ mahīpatiḥ kuryāt kālam ahaṃ caiva kuntī ceyaṃ vadhūs tava","Durch deine Gnade, o Erhabener, möge dieser Herrscher der Erde seine Zeit ohne Kummer verbringen, und auch ich, und diese Kuntī, deine Schwiegertochter.“","",[["tava prasādād bhagavan","durch deine Gnade, o Erhabener (Abl. + Vok.)"],["viśoko 'yaṃ mahīpatiḥ","dieser kummerlose Herrscher der Erde (Adj. + Nom.)"],["kuryāt kālam ahaṃ caiva","möge seine Zeit verbringen, und ich auch (Opt. + Akk. + Nom.)"],["kuntī ceyaṃ vadhūs tava","und diese Kuntī, deine Schwiegertochter (Nom. + Nom.)"]]],["015","ity uktavatyāṃ gāndhāryāṃ kuntī vratakṛśānanā pracchannajātaṃ putraṃ taṃ sasmārādityasaṃbhavam","Als Gāndhārī so gesprochen hatte, erinnerte sich Kuntī, deren Antlitz von Gelübden abgezehrt war, an jenen heimlich geborenen Sohn, den von der Sonne Entsprossenen.","",[["ity uktavatyāṃ gāndhāryām","als Gāndhārī so gesprochen hatte (Zitat + Lok. Abs.)"],["kuntī vratakṛśānanā","Kuntī, deren Antlitz von Gelübden abgezehrt war (Nom. + Adj.)"],["pracchannajātaṃ putraṃ tam","jenen heimlich geborenen Sohn (Akk.)"],["sasmārādityasaṃbhavam","erinnerte sich, den von der Sonne Entsprossenen (Perf. + Akk.)"]]],["016","tām ṛṣir varado vyāso dūraśravaṇadarśanaḥ apaśyad duḥkhitāṃ devīṃ mātaraṃ savyasācinaḥ","Jene betrübte Fürstin, die Mutter des Linkshändigen Bogenschützen, erblickte der Seher Vyāsa, der Gunstgeber, von weitreichendem Gehör und Blick.","",[["tām ṛṣir varado vyāsaḥ","jene [Frau] der Seher Vyāsa, der Gunstgeber (Akk. + Nom.)"],["dūraśravaṇadarśanaḥ","von weitreichendem Gehör und Blick (Adj.)"],["apaśyad duḥkhitāṃ devīm","erblickte die betrübte Fürstin (Impf. + Akk.)"],["mātaraṃ savyasācinaḥ","die Mutter des Linkshändigen Bogenschützen [Arjuna] (Akk. + Gen.)"]]],["017","tām uvāca tato vyāso yat te kāryaṃ vivakṣitam tad brūhi tvaṃ mahāprājñe yat te manasi vartate","Da sprach Vyāsa zu ihr: „Was immer du zu sagen wünschst, sage es, du von großer Weisheit – was immer dir im Sinn liegt.“","",[["tām uvāca tato vyāsaḥ","da sprach Vyāsa zu ihr (Akk. + Perf.)"],["yat te kāryaṃ vivakṣitam","was immer du zu sagen wünschst (Rel. + Nom. + Ptz.)"],["tad brūhi tvaṃ mahāprājñe","das sage du, o Hochweise (Imp. + Nom. + Vok.)"],["yat te manasi vartate","was immer dir im Sinn liegt (Rel. + Lok. + Präs.)"]]],["018","tataḥ kuntī śvaśurayoḥ praṇamya śirasā tadā uvāca vākyaṃ savrīḍaṃ vivṛṇvānā purātanam","Dann, nachdem sie sich vor ihren beiden Schwiegereltern mit dem Haupt verneigt hatte, sprach Kuntī ein Wort, verschämt, eine alte Sache enthüllend.","",[["tataḥ kuntī śvaśurayoḥ","dann Kuntī, vor den beiden Schwiegereltern (Nom. + Gen. Dual)"],["praṇamya śirasā tadā","nachdem sie sich mit dem Haupt verneigt hatte (Abs. + Instr.)"],["uvāca vākyaṃ savrīḍam","sprach ein Wort, verschämt (Perf. + Akk. + Adj.)"],["vivṛṇvānā purātanam","eine alte Sache enthüllend (Ptz. + Akk.)"]]]]},{"num":38,"title_sa":"Kuntīkarṇajanmākhyāna, Vyāsapratyuttara","title_de":"Kuntīs Geständnis über Karṇas Geburt; Vyāsas Antwort","note":"","units":[["001","kunty uvāca bhagavañ śvaśuro me 'si daivatasyāpi daivatam sa me devātidevas tvaṃ śṛṇu satyāṃ giraṃ mama","Kuntī sprach: „Erhabener, du bist mein Schwiegervater, der Gott selbst der Gottheit; du bist mir der Gott über die Götter – höre mein wahrhaftiges Wort.","",[["bhagavañ śvaśuro me 'si","Erhabener, du bist mein Schwiegervater (Vok. + Nom. + Präs.)"],["daivatasyāpi daivatam","der Gott selbst der Gottheit (Gen. + Nom.)"],["sa me devātidevas tvam","du bist mir der Gott über die Götter (Nom. + Nom.)"],["śṛṇu satyāṃ giraṃ mama","höre mein wahrhaftiges Wort (Imp. + Akk.)"]]],["002","tapasvī kopano vipro durvāsā nāma me pituḥ bhikṣām upāgato bhoktuṃ tam ahaṃ paryatoṣayam","Ein Asket von jähzornigem Wesen, ein Brahmane namens Durvāsas, kam zum Haus meines Vaters, um Almosenspeise zu erhalten; ihn stellte ich zufrieden.","",[["tapasvī kopano vipraḥ","ein Asket von jähzornigem Wesen, ein Brahmane (Nom.)"],["durvāsā nāma me pituḥ","namens Durvāsas, zu meinem Vater (Nom. + Gen.)"],["bhikṣām upāgato bhoktum","kam, um Almosenspeise zu erhalten (Ptz. + Akk. + Inf.)"],["tam ahaṃ paryatoṣayam","ihn stellte ich zufrieden (Akk. + Kaus. Impf.)"]]],["003","śaucena tv āgasas tyāgaiḥ śuddhena manasā tathā kopasthāneṣv api mahatsv akupyaṃ na kadā cana","Durch Reinheit, durch das Meiden von Verfehlungen, und ebenso mit lauterem Sinn wurde ich niemals zornig, selbst bei großen Anlässen zum Zorn.","",[["śaucena tv āgasas tyāgaiḥ","durch Reinheit, durch das Meiden von Verfehlungen (Instr.)"],["śuddhena manasā tathā","und ebenso mit lauterem Sinn (Instr.)"],["kopasthāneṣv api mahatsu","selbst bei großen Anlässen zum Zorn (Lok. Pl.)"],["akupyaṃ na kadā cana","wurde ich niemals zornig (Impf. + Adv.)"]]],["004","sa me varam adāt prītaḥ kṛtam ity aham abruvam avaśyaṃ te grahītavyam iti māṃ so 'bravīd vacaḥ","Erfreut gewährte er mir eine Gunst; ‚Es ist genug‘, sagte ich; ‚Du musst sie unbedingt annehmen‘, so sprach er zu mir das Wort.","",[["sa me varam adāt prītaḥ","erfreut gewährte er mir eine Gunst (Nom. + Akk. + Perf. + Ptz.)"],["kṛtam ity aham abruvam","„Es ist genug“, sagte ich (Zitat + Impf.)"],["avaśyaṃ te grahītavyam","„Du musst sie unbedingt annehmen“ (Adv. + Gen. + Ger.)"],["iti māṃ so 'bravīd vacaḥ","so sprach er zu mir das Wort (Zitat + Akk. + Impf. + Akk.)"]]],["005","tataḥ śāpabhayād vipram avocaṃ punar eva tam evam astv iti ca prāha punar eva sa māṃ dvijaḥ","Da, aus Furcht vor einem Fluch, sprach ich abermals zu jenem Brahmanen; und wiederum sprach der Zweifachgeborene zu mir: ‚So sei es.","Das 'iti' nach 'evam astu' steht im Original mitten im Zitat (metrisch bedingt); die direkte Rede des Durvāsas setzt sich sinngemäß über V006 fort, da V006 ihn weiterhin in der 2. Person ansprechend zeigt.[?]",[["tataḥ śāpabhayād vipram","da, aus Furcht vor einem Fluch, zu dem Brahmanen (Abl. + Akk.)"],["avocaṃ punar eva tam","sprach ich abermals zu ihm (Impf. + Adv.)"],["evam astv iti ca prāha","„So sei es“, sprach er (Zitat + Perf.)"],["punar eva sa māṃ dvijaḥ","wiederum jener Zweifachgeborene zu mir (Adv. + Nom. + Akk.)"]]],["006","dharmasya jananī bhadre bhavitrī tvaṃ varānane vaśe sthāsyanti te devā yāṃs tvam āvāhayiṣyasi","Die Mutter des Dharma wirst du werden, o Holde, o Schönantlitzige; die Götter, die du herbeirufen wirst, werden dir zu Willen stehen.‘","",[["dharmasya jananī bhadre","die Mutter des Dharma, o Holde (Nom. + Vok.)"],["bhavitrī tvaṃ varānane","wirst du werden, o Schönantlitzige (Fut.Ptz. + Nom. + Vok.)"],["vaśe sthāsyanti te devāḥ","dir zu Willen werden die Götter stehen (Lok. + Fut. + Gen. + Nom.)"],["yāṃs tvam āvāhayiṣyasi","die du herbeirufen wirst (Akk. + Fut.)"]]],["007","ity uktvāntarhito vipras tato 'haṃ vismitābhavam na ca sarvāsv avasthāsu smṛtir me vipraṇaśyati","Nachdem er dies gesagt hatte, verschwand der Brahmane; da geriet ich in Staunen; und in keinerlei Zustand schwindet mir seitdem diese Erinnerung.","",[["ity uktvāntarhito vipraḥ","nachdem er dies gesagt hatte, verschwand der Brahmane (Zitat + Abs. + Ptz. + Nom.)"],["tato 'haṃ vismitābhavam","da geriet ich in Staunen (Adv. + Nom. + Impf.)"],["na ca sarvāsv avasthāsu","und in keinerlei Zustand (Lok. Pl.)"],["smṛtir me vipraṇaśyati","schwindet mir diese Erinnerung (Nom. + Präs.)"]]],["008","atha harmyatalasthāhaṃ ravim udyantam īkṣatī saṃsmṛtya tad ṛṣer vākyaṃ spṛhayantī divākaram sthitāhaṃ bālabhāvena tatra doṣam abudhyatī","Dann, auf der Terrasse des Palastes stehend, den aufgehenden Sonnengott betrachtend, mich an jenes Wort des Sehers erinnernd, nach dem Tagesbereiter verlangend, stand ich dort in kindlicher Unbedachtheit, ohne das Unrecht daran zu erkennen.","",[["atha harmyatalasthāham","dann, auf der Terrasse des Palastes stehend, ich (Adv. + Adj. + Nom.)"],["ravim udyantam īkṣatī","den aufgehenden Sonnengott betrachtend (Akk. + Ptz. + Ptz.)"],["saṃsmṛtya tad ṛṣer vākyam","mich an jenes Wort des Sehers erinnernd (Abs. + Akk.)"],["spṛhayantī divākaram","nach dem Tagesbereiter verlangend (Ptz. + Akk.)"]]],["009","atha devaḥ sahasrāṃśur matsamīpagato 'bhavat dvidhā kṛtvātmano dehaṃ bhūmau ca gagane 'pi ca tatāpa lokān ekena dvitīyenāgamac ca mām","Da nahte sich mir der Gott der tausend Strahlen; nachdem er seinen eigenen Leib zweigeteilt hatte, auf der Erde und zugleich am Himmel, erhitzte er mit dem einen die Welten, und mit dem anderen kam er zu mir.","",[["atha devaḥ sahasrāṃśuḥ","da der Gott der tausend Strahlen (Adv. + Nom.)"],["matsamīpagato 'bhavat","kam in meine Nähe (Ptz. + Impf.)"],["dvidhā kṛtvātmano deham","nachdem er seinen Leib zweigeteilt hatte (Adv. + Abs. + Akk.)"],["tatāpa lokān ekena","erhitzte mit dem einen die Welten (Perf. + Akk. + Instr.)"]]],["010","sa mām uvāca vepantīṃ varaṃ matto vṛṇīṣva ha gamyatām iti taṃ cāhaṃ praṇamya śirasāvadam","Er sprach zu mir, der Erzitternden: ‚Wähle eine Gunst von mir!‘ ‚Du mögest gehen‘, so sprach ich, nachdem ich mein Haupt verneigt hatte, zu ihm.","",[["sa mām uvāca vepantīm","er sprach zu mir, der Erzitternden (Nom. + Akk. + Ptz.)"],["varaṃ matto vṛṇīṣva ha","„Wähle eine Gunst von mir!“ (Akk. + Abl. + Imp.)"],["gamyatām iti","„Du mögest gehen“ (Imp. Pass. + Zitat)"],["taṃ cāhaṃ praṇamya śirasāvadam","und ich, nachdem ich mein Haupt verneigt hatte, sprach zu ihm (Akk. + Abs. + Impf.)"]]],["011","sa mām uvāca tigmāṃśur vṛthāhvānaṃ na te kṣamam dhakṣyāmi tvāṃ ca vipraṃ ca yena datto varas tava","Der Scharfstrahlige sprach zu mir: ‚Ein vergebliches Herbeirufen ziemt dir nicht; ich werde dich verbrennen, und den Brahmanen dazu, durch den dir die Gunst gewährt wurde.‘","",[["sa mām uvāca tigmāṃśuḥ","der Scharfstrahlige sprach zu mir (Nom. + Akk. + Perf.)"],["vṛthāhvānaṃ na te kṣamam","ein vergebliches Herbeirufen ziemt dir nicht (Nom. + Gen. + Adj.)"],["dhakṣyāmi tvāṃ ca vipraṃ ca","ich werde dich verbrennen und den Brahmanen (Fut. + Akk.)"],["yena datto varas tava","durch den dir die Gunst gewährt wurde (Instr. + Ptz. + Nom.)"]]],["012","tam ahaṃ rakṣatī vipraṃ śāpād anaparādhinam putro me tvatsamo deva bhaved iti tato 'bruvam","Jenen unschuldigen Brahmanen vor dem Fluch schützend, sagte ich dann: ‚Ein Sohn dir gleich, o Gott, möge mir geboren werden.‘","",[["tam ahaṃ rakṣatī vipram","jenen Brahmanen schützend, ich (Akk. + Ptz. + Nom.)"],["śāpād anaparādhinam","vor dem Fluch, den unschuldigen (Abl. + Akk.)"],["putro me tvatsamo deva","ein Sohn dir gleich, o Gott, mir (Nom. + Gen. + Adj. + Vok.)"],["bhaved iti tato 'bruvam","möge er werden – so sagte ich dann (Opt. + Zitat + Impf.)"]]],["013","tato māṃ tejasāviśya mohayitvā ca bhānumān uvāca bhavitā putras tavety abhyagamad divam","Da, nachdem er mit seiner Glut in mich eingegangen war und mich betört hatte, sprach der Sonnenträger: ‚Ein Sohn wird dir geboren werden.‘ Und er ging zum Himmel empor.","",[["tato māṃ tejasāviśya","da, nachdem er mit seiner Glut in mich eingegangen war (Adv. + Akk. + Instr. + Abs.)"],["mohayitvā ca bhānumān","und mich betört hatte, der Sonnenträger (Abs. + Nom.)"],["uvāca bhavitā putras tava","sprach: „Ein Sohn wird dir geboren werden“ (Perf. + Fut.Ptz. + Nom. + Gen.)"],["ity abhyagamad divam","und ging zum Himmel empor (Zitat + Impf. + Akk.)"]]],["014","tato 'ham antarbhavane pitur vṛttāntarakṣiṇī gūḍhotpannaṃ sutaṃ bālaṃ jale karṇam avāsṛjam","Dann setzte ich, im Inneren des väterlichen Hauses das Geschehnis verbergend, den heimlich geborenen Sohn, das Kind Karṇa, im Wasser aus.","",[["tato 'ham antarbhavane","dann ich, im Inneren des Hauses (Adv. + Nom. + Lok.)"],["pitur vṛttāntarakṣiṇī","das Geschehnis des Vaters verbergend (Gen. + Ptz.)"],["gūḍhotpannaṃ sutaṃ bālam","den heimlich geborenen Sohn, das Kind (Akk.)"],["jale karṇam avāsṛjam","setzte ich Karṇa im Wasser aus (Lok. + Akk. + Impf.)"]]],["015","nūnaṃ tasyaiva devasya prasādāt punar eva tu kanyāham abhavaṃ vipra yathā prāha sa mām ṛṣiḥ","Gewiss wurde ich, durch die Gnade eben jenes Gottes, wiederum zur Jungfrau, o Brahmane, so wie mir jener Seher gesagt hatte.","",[["nūnaṃ tasyaiva devasya","gewiss durch eben jenes Gottes (Adv. + Gen.)"],["prasādāt punar eva tu","Gnade, wiederum aber (Abl. + Adv.)"],["kanyāham abhavaṃ vipra","wurde ich zur Jungfrau, o Brahmane (Nom. + Nom. + Impf. + Vok.)"],["yathā prāha sa mām ṛṣiḥ","so wie mir jener Seher gesagt hatte (Adv. + Perf. + Akk. + Nom.)"]]],["016","sa mayā mūḍhayā putro jñāyamāno 'py upekṣitaḥ tan māṃ dahati viprarṣe yathā suviditaṃ tava","Jenen Sohn habe ich, in meiner Torheit, obwohl ich ihn kannte, vernachlässigt; das verbrennt mich, o Weiser unter den Brahmanen, wie dir wohlbekannt ist.","",[["sa mayā mūḍhayā putraḥ","jener Sohn von mir, der Törichten (Nom. + Instr. + Nom.)"],["jñāyamāno 'py upekṣitaḥ","obwohl gekannt, vernachlässigt (Ptz. + Ptz.)"],["tan māṃ dahati viprarṣe","das verbrennt mich, o Weiser unter den Brahmanen (Nom. + Akk. + Präs. + Vok.)"],["yathā suviditaṃ tava","wie dir wohlbekannt ist (Adv. + Ptz. + Gen.)"]]],["017","yadi pāpam apāpaṃ vā tad etad vivṛtaṃ mayā tan me bhayaṃ tvaṃ bhagavan vyapanetum ihārhasi","Ob es Sünde sei oder nicht Sünde – dies habe ich nun enthüllt; diese meine Furcht sollst du, Erhabener, hier von mir nehmen.","",[["yadi pāpam apāpaṃ vā","ob es Sünde sei oder nicht Sünde (Nom.)"],["tad etad vivṛtaṃ mayā","dies habe ich enthüllt (Nom. + Ptz. + Instr.)"],["tan me bhayaṃ tvaṃ bhagavan","diese meine Furcht, du, Erhabener (Nom. + Nom. + Vok.)"],["vyapanetum ihārhasi","sollst du hier entfernen (Inf. + Präs.)"]]],["018","yac cāsya rājño viditaṃ hṛdisthaṃ bhavato 'nagha taṃ cāyaṃ labhatāṃ kāmam adyaiva munisattama","Und was diesem König im Herzen liegt und dir bekannt ist, o Schuldloser – das möge er noch heute erlangen, o Bester der Weisen.“","",[["yac cāsya rājño viditam","und was diesem König bekannt ist (Nom. + Gen. + Ptz.)"],["hṛdisthaṃ bhavato 'nagha","im Herzen befindlich, dir, o Schuldloser (Adj. + Gen. + Vok.)"],["taṃ cāyaṃ labhatāṃ kāmam","das möge er als Wunsch erlangen (Akk. + Nom. + Opt. + Akk.)"],["adyaiva munisattama","noch heute, o Bester der Weisen (Adv. + Vok.)"]]],["019","ity uktaḥ pratyuvācedaṃ vyāso vedavidāṃ varaḥ sādhu sarvam idaṃ tathyam evam eva yathāttha mām","So angesprochen, erwiderte Vyāsa, der Beste der Vedenkenner, dies: „Wohlan – all dies ist wahr, genau so, wie du es mir gesagt hast.","",[["ity uktaḥ pratyuvācedam","so angesprochen, erwiderte dies (Ptz. + Perf. + Akk.)"],["vyāso vedavidāṃ varaḥ","Vyāsa, der Beste der Vedenkenner (Nom.)"],["sādhu sarvam idaṃ tathyam","„Wohlan, all dies ist wahr“ (Interj. + Nom. + Adj.)"],["evam eva yathāttha mām","genau so, wie du es mir gesagt hast (Adv. + Perf. + Akk.)"]]],["020","aparādhaś ca te nāsti kanyābhāvaṃ gatā hy asi devāś caiśvaryavanto vai śarīrāṇy āviśanti vai","Und es ist keine Schuld in dir; du warst ja im Zustand der Jungfräulichkeit; die Götter, die fürwahr über Herrschermacht verfügen, gehen wahrlich in Körper ein.","",[["aparādhaś ca te nāsti","und es ist keine Schuld in dir (Nom. + Gen. + Präs.)"],["kanyābhāvaṃ gatā hy asi","du warst ja im Zustand der Jungfräulichkeit (Akk. + Ptz. + Präs.)"],["devāś caiśvaryavanto vai","die Götter, die fürwahr über Herrschermacht verfügen (Nom. Pl. + Adj.)"],["śarīrāṇy āviśanti vai","gehen wahrlich in Körper ein (Akk. Pl. + Präs.)"]]],["021","santi devanikāyāś ca saṃkalpāj janayanti ye vācā dṛṣṭyā tathā sparśāt saṃgharṣeṇeti pañcadhā","Es gibt Scharen von Göttern, die durch bloßen Willen zeugen, durch Wort, durch Blick, ebenso durch Berührung und durch Vereinigung – auf fünferlei Weise.","",[["santi devanikāyāś ca","es gibt Scharen von Göttern (Präs. + Nom. Pl.)"],["saṃkalpāj janayanti ye","die durch bloßen Willen zeugen (Abl. + Präs. + Rel.)"],["vācā dṛṣṭyā tathā sparśāt","durch Wort, durch Blick, ebenso durch Berührung (Instr.)"],["saṃgharṣeṇeti pañcadhā","und durch Vereinigung – auf fünferlei Weise (Instr. + Zitat + Adv.)"]]],["022","manuṣyadharmo daivena dharmeṇa na hi yujyate iti kunti vyajānīhi vyetu te mānaso jvaraḥ","Das Recht der Menschen lässt sich fürwahr nicht mit dem Recht der Götter vereinen; erkenne dies, o Kuntī; das Fieber deines Geistes möge weichen.","",[["manuṣyadharmo daivena","das Recht der Menschen mit dem göttlichen (Nom. + Instr.)"],["dharmeṇa na hi yujyate","Recht lässt sich fürwahr nicht vereinen (Instr. + Präs. Pass.)"],["iti kunti vyajānīhi","erkenne dies, o Kuntī (Zitat + Vok. + Imp.)"],["vyetu te mānaso jvaraḥ","das Fieber deines Geistes möge weichen (Imp. + Gen. + Adj. + Nom.)"]]],["023","sarvaṃ balavatāṃ pathyaṃ sarvaṃ balavatāṃ śuci sarvaṃ balavatāṃ dharmaḥ sarvaṃ balavatāṃ svakam","Alles ist den Mächtigen zuträglich, alles ist den Mächtigen rein, alles ist den Mächtigen Dharma, alles ist der Mächtigen Eigentum.“","",[["sarvaṃ balavatāṃ pathyam","alles ist den Mächtigen zuträglich (Nom. + Gen. Pl. + Nom.)"],["sarvaṃ balavatāṃ śuci","alles ist den Mächtigen rein (Nom. + Gen. Pl. + Nom.)"],["sarvaṃ balavatāṃ dharmaḥ","alles ist den Mächtigen Dharma (Nom. + Gen. Pl. + Nom.)"],["sarvaṃ balavatāṃ svakam","alles ist der Mächtigen Eigentum (Nom. + Gen. Pl. + Nom.)"]]]]},{"num":39,"title_sa":"Vyāsasya Gāndhārīvākya, Aṃśāvataraṇaprakāśana, Gaṅgābhigamana","title_de":"Vyāsas Rede an Gāndhārī: die Enthüllung der göttlichen Herkunft der Krieger; Aufbruch zur Gaṅgā","note":"","units":[["001","vyāsa uvāca bhadre drakṣyasi gāndhāri putrān bhrātṝn sakhīṃs tathā vadhūś ca patibhiḥ sārdhaṃ niśi suptotthitā iva","Vyāsa sprach: „Du wirst sehen, Holde Gāndhārī, deine Söhne, Brüder, Gefährten und ebenso die Schwiegertöchter zusammen mit ihren Gatten, wie aus dem Schlaf erwacht, in dieser Nacht.","",[["bhadre drakṣyasi gāndhāri","du wirst sehen, Holde Gāndhārī (Vok. + Fut. + Vok.)"],["putrān bhrātṝn sakhīṃs tathā","deine Söhne, Brüder, Gefährten (Akk. Pl.)"],["vadhūś ca patibhiḥ sārdham","und die Schwiegertöchter zusammen mit ihren Gatten (Akk. + Instr.)"],["niśi suptotthitā iva","in der Nacht, wie aus dem Schlaf erwacht (Lok. + Adj.)"]]],["002","karṇaṃ drakṣyati kuntī ca saubhadraṃ cāpi yādavī draupadī pañca putrāṃś ca pitṝn bhrātṝṃs tathaiva ca","Karṇa wird Kuntī sehen, und auch den Saubhadra die Yādavī, und Draupadī ihre fünf Söhne, die Väter und ebenso die Brüder.","",[["karṇaṃ drakṣyati kuntī ca","Karṇa wird sehen, und Kuntī (Akk. + Fut. + Nom.)"],["saubhadraṃ cāpi yādavī","und auch den Saubhadra die Yādavī (Akk. + Nom.)"],["draupadī pañca putrāṃś ca","Draupadī ihre fünf Söhne (Nom. + Akk.)"],["pitṝn bhrātṝṃs tathaiva ca","die Väter und ebenso die Brüder (Akk. Pl.)"]]],["003","pūrvam evaiṣa hṛdaye vyavasāyo 'bhavan mama yathāsmi codito rājñā bhavatyā pṛthayaiva ca","Bereits zuvor stand dieser Entschluss in meinem Herzen fest, so wie ich vom König, von dir und von Pṛthā selbst darum gebeten wurde.","",[["pūrvam evaiṣa hṛdaye","bereits zuvor in meinem Herzen (Adv. + Lok.)"],["vyavasāyo 'bhavan mama","stand dieser Entschluss fest, mein (Nom. + Impf. + Gen.)"],["yathāsmi codito rājñā","so wie ich vom König gebeten wurde (Adv. + Ptz. + Instr.)"],["bhavatyā pṛthayaiva ca","und von dir und von Pṛthā selbst (Instr.)"]]],["004","na te śocyā mahātmānaḥ sarva eva nararṣabhāḥ kṣatradharmaparāḥ santas tathā hi nidhanaṃ gatāḥ","Nicht zu betrauern sind sie, jene Hochherzigen, alle Stiere unter den Männern; da sie dem Kṣatriya-Recht ergeben waren, gingen sie ebenso in den Tod ein.","",[["na te śocyā mahātmānaḥ","nicht zu betrauern sind sie, die Hochherzigen (Nom. Pl.)"],["sarva eva nararṣabhāḥ","alle Stiere unter den Männern (Nom. Pl.)"],["kṣatradharmaparāḥ santaḥ","da sie dem Kṣatriya-Recht ergeben waren (Adj. + Ptz.)"],["tathā hi nidhanaṃ gatāḥ","ebenso gingen sie in den Tod ein (Adv. + Akk. + Ptz.)"]]],["005","bhavitavyam avaśyaṃ tat surakāryam anindite avaterus tataḥ sarve devabhāgair mahītalam","Es musste unvermeidlich geschehen, jenes Werk der Götter, o Tadellose; darum stiegen sie alle mit Anteilen der Götter auf die Erde herab.","",[["bhavitavyam avaśyaṃ tat","es musste unvermeidlich geschehen (Ger. + Adv. + Nom.)"],["surakāryam anindite","das Werk der Götter, o Tadellose (Nom. + Vok.)"],["avaterus tataḥ sarve","darum stiegen sie alle herab (Perf. + Adv. + Nom.)"],["devabhāgair mahītalam","mit Anteilen der Götter auf die Erde (Instr. + Akk.)"]]],["006","gandharvāpsarasaś caiva piśācā guhyarākṣasāḥ tathā puṇyajanāś caiva siddhā devarṣayo 'pi ca","Gandharvas und Apsaras, Piśācas, verborgene Rākṣasas, ebenso die Puṇyajanas, die Siddhas und auch die göttlichen Seher,","",[["gandharvāpsarasaś caiva","Gandharvas und Apsaras (Nom. Pl.)"],["piśācā guhyarākṣasāḥ","Piśācas, verborgene Rākṣasas (Nom. Pl.)"],["tathā puṇyajanāś caiva","ebenso die Puṇyajanas (Nom. Pl.)"],["siddhā devarṣayo 'pi ca","die Siddhas und auch die göttlichen Seher (Nom. Pl.)"]]],["007","devāś ca dānavāś caiva tathā brahmarṣayo 'malāḥ ta ete nidhanaṃ prāptāḥ kurukṣetre raṇājire","die Götter und ebenso die Dānavas, und die makellosen Brahmanenseher – all diese fanden den Tod auf dem Schlachtfeld von Kurukṣetra.","",[["devāś ca dānavāś caiva","die Götter und ebenso die Dānavas (Nom. Pl.)"],["tathā brahmarṣayo 'malāḥ","ebenso die makellosen Brahmanenseher (Nom. Pl.)"],["ta ete nidhanaṃ prāptāḥ","all diese fanden den Tod (Nom. + Akk. + Ptz.)"],["kurukṣetre raṇājire","auf dem Schlachtfeld von Kurukṣetra (Lok.)"]]],["008","gandharvarājo yo dhīmān dhṛtarāṣṭra iti śrutaḥ sa eva mānuṣe loke dhṛtarāṣṭraḥ patis tava","Der weise König der Gandharvas, der unter dem Namen Dhṛtarāṣṭra bekannt ist – eben der ist in der Welt der Menschen dein Gatte Dhṛtarāṣṭra.","",[["gandharvarājo yo dhīmān","der weise König der Gandharvas (Nom.)"],["dhṛtarāṣṭra iti śrutaḥ","der unter dem Namen Dhṛtarāṣṭra bekannt ist (Zitat + Ptz.)"],["sa eva mānuṣe loke","eben der in der Welt der Menschen (Nom. + Lok.)"],["dhṛtarāṣṭraḥ patis tava","dein Gatte Dhṛtarāṣṭra (Nom. + Nom. + Gen.)"]]],["009","pāṇḍuṃ marudgaṇaṃ viddhi viśiṣṭatamam acyutam dharmasyāṃśo 'bhavat kṣattā rājā cāyaṃ yudhiṣṭhiraḥ","Wisse, dass Pāṇḍu die Marut-Schar ist, die vortrefflichste, unwandelbare; der Kṣattṛ war ein Anteil des Dharma, und dieser König Yudhiṣṭhira ebenso.","",[["pāṇḍuṃ marudgaṇaṃ viddhi","wisse, dass Pāṇḍu die Marut-Schar ist (Akk. + Akk. + Imp.)"],["viśiṣṭatamam acyutam","die vortrefflichste, unwandelbare (Akk.)"],["dharmasyāṃśo 'bhavat kṣattā","der Kṣattṛ [Vidura] war ein Anteil des Dharma (Gen. + Nom. + Impf. + Nom.)"],["rājā cāyaṃ yudhiṣṭhiraḥ","und dieser König Yudhiṣṭhira (Nom.)"]]],["010","kaliṃ duryodhanaṃ viddhi śakuniṃ dvāparaṃ tathā duḥśāsanādīn viddhi tvaṃ rākṣasāñ śubhadarśane","Wisse, dass Duryodhana Kali ist, und Śakuni ebenso Dvāpara; Duḥśāsana und die anderen erkenne als Rākṣasas, o Schönäugige.","",[["kaliṃ duryodhanaṃ viddhi","wisse, dass Duryodhana Kali ist (Akk. + Akk. + Imp.)"],["śakuniṃ dvāparaṃ tathā","und Śakuni ebenso Dvāpara (Akk. + Akk.)"],["duḥśāsanādīn viddhi tvam","Duḥśāsana und die anderen erkenne du (Akk. + Imp. + Nom.)"],["rākṣasāñ śubhadarśane","als Rākṣasas, o Schönäugige (Akk. Pl. + Vok.)"]]],["011","marudgaṇād bhīmasenaṃ balavantam ariṃdamam viddhi ca tvaṃ naram ṛṣim imaṃ pārthaṃ dhanaṃjayam nārāyaṇaṃ hṛṣīkeśam aśvinau yamajāv ubhau","Und wisse, dass Bhīmasena, der Starke, der Feindebezwinger, aus der Marut-Schar stammt, und diesen Pārtha Dhanaṃjaya erkenne als den Seher Nara; Nārāyaṇa ist Hṛṣīkeśa; die beiden Zwillinge sind die Aśvins.","",[["marudgaṇād bhīmasenam","aus der Marut-Schar, Bhīmasena (Abl. + Akk.)"],["balavantam ariṃdamam","den Starken, den Feindebezwinger (Akk.)"],["viddhi ca tvaṃ naram ṛṣim","und wisse du: der Seher Nara (Imp. + Nom. + Akk. + Akk.)"],["nārāyaṇaṃ hṛṣīkeśam","Nārāyaṇa ist Hṛṣīkeśa (Akk. + Akk.)"]]],["012","dvidhā kṛtvātmano deham ādityaṃ tapatāṃ varam lokāṃś ca tāpayānaṃ vai viddhi karṇaṃ ca śobhane yaś ca vairārtham udbhūtaḥ saṃgharṣajananas tathā","Wisse, o Holde, dass Karṇa der Sonnengott ist, der Beste der Erhitzenden, der seinen eigenen Leib zweigeteilt hat und die Welten erhitzt, jener, der um der Feindschaft willen entstanden ist und ebenso Zwietracht hervorbringt.","",[["dvidhā kṛtvātmano deham","der seinen Leib zweigeteilt hat (Adv. + Abs. + Akk.)"],["ādityaṃ tapatāṃ varam","der Sonnengott, der Beste der Erhitzenden (Akk. + Gen. Pl. + Akk.)"],["lokāṃś ca tāpayānaṃ vai","und die Welten erhitzend (Akk. + Ptz. + Partikel)"],["viddhi karṇaṃ ca śobhane","wisse, dass Karṇa [dies ist], o Holde (Imp. + Akk. + Vok.)"]]],["013","yaś ca pāṇḍavadāyādo hataḥ ṣaḍbhir mahārathaiḥ sa soma iha saubhadro yogād evābhavad dvidhā","Und jener Erbe der Pāṇḍavas, der von sechs großen Streitwagenkämpfern erschlagen wurde, er ist hier der Mond, der Sohn der Subhadrā, der durch Yoga eben zweigeteilt wurde.","",[["yaś ca pāṇḍavadāyādaḥ","und jener Erbe der Pāṇḍavas (Nom.)"],["hataḥ ṣaḍbhir mahārathaiḥ","der von sechs großen Streitwagenkämpfern erschlagen wurde (Ptz. + Instr.)"],["sa soma iha saubhadraḥ","er ist hier der Mond, der Sohn der Subhadrā (Nom.)"],["yogād evābhavad dvidhā","wurde durch Yoga eben zweigeteilt (Abl. + Impf. + Adv.)"]]],["014","draupadyā saha saṃbhūtaṃ dhṛṣṭadyumnaṃ ca pāvakāt agner bhāgaṃ śubhaṃ viddhi rākṣasaṃ tu śikhaṇḍinam","Und Dhṛṣṭadyumna, der zusammen mit Draupadī aus dem Feuer entstand, wisse als einen reinen Anteil Agnis; Śikhaṇḍin aber erkenne als einen Rākṣasa.","",[["draupadyā saha saṃbhūtam","zusammen mit Draupadī entstanden (Instr. + Ptz.)"],["dhṛṣṭadyumnaṃ ca pāvakāt","und Dhṛṣṭadyumna aus dem Feuer (Akk. + Abl.)"],["agner bhāgaṃ śubhaṃ viddhi","wisse als einen reinen Anteil Agnis (Gen. + Akk. + Imp.)"],["rākṣasaṃ tu śikhaṇḍinam","Śikhaṇḍin aber als Rākṣasa (Akk. + Akk.)"]]],["015","droṇaṃ bṛhaspater bhāgaṃ viddhi drauṇiṃ ca rudrajam bhīṣmaṃ ca viddhi gāṅgeyaṃ vasuṃ mānuṣatāṃ gatam","Wisse, dass Droṇa ein Anteil Bṛhaspatis ist, und den Sohn Droṇas als von Rudra erzeugt; und wisse, dass Bhīṣma, der Sohn der Gaṅgā, ein Vasu ist, der in die Menschengestalt eingegangen ist.","",[["droṇaṃ bṛhaspater bhāgam","Droṇa, ein Anteil Bṛhaspatis (Akk. + Gen. + Akk.)"],["viddhi drauṇiṃ ca rudrajam","wisse, und den Sohn Droṇas als von Rudra erzeugt (Imp. + Akk. + Akk.)"],["bhīṣmaṃ ca viddhi gāṅgeyam","und wisse, Bhīṣma, den Sohn der Gaṅgā (Akk. + Imp. + Akk.)"],["vasuṃ mānuṣatāṃ gatam","einen Vasu, der in die Menschengestalt eingegangen ist (Akk. + Akk. + Ptz.)"]]],["016","evam ete mahāprājñe devā mānuṣyam etya hi tataḥ punar gatāḥ svargaṃ kṛte karmaṇi śobhane","So sind diese, o Hochweise, als Götter in die Menschenwelt eingegangen und, nachdem sie ihr herrliches Werk vollbracht hatten, wiederum zum Himmel gegangen.","",[["evam ete mahāprājñe","so sind diese, o Hochweise (Adv. + Nom. + Vok.)"],["devā mānuṣyam etya hi","die Götter, in die Menschenwelt eingegangen (Nom. + Akk. + Abs.)"],["tataḥ punar gatāḥ svargam","wiederum zum Himmel gegangen (Adv. + Ptz. + Akk.)"],["kṛte karmaṇi śobhane","nachdem sie ihr herrliches Werk vollbracht hatten (Lok. Abs.)"]]],["017","yac ca vo hṛdi sarveṣāṃ duḥkham enac ciraṃ sthitam tad adya vyapaneṣyāmi paralokakṛtād bhayāt","Und was für ein Kummer euch allen im Herzen lange schon wohnt, aus Furcht davor, was im Jenseits geschehen sein könnte – das werde ich heute vertreiben.","",[["yac ca vo hṛdi sarveṣām","und was in eurer aller Herzen (Nom. + Gen. + Lok. + Gen.)"],["duḥkham enac ciraṃ sthitam","dieser Kummer, lange schon wohnend (Nom. + Adv. + Ptz.)"],["tad adya vyapaneṣyāmi","das werde ich heute vertreiben (Akk. + Adv. + Fut.)"],["paralokakṛtād bhayāt","aus Furcht vor dem, was im Jenseits geschieht (Abl.)"]]],["018","sarve bhavanto gacchantu nadīṃ bhāgīrathīṃ prati tatra drakṣyatha tān sarvān ye hatāsmin raṇājire","Ihr alle mögt zum Fluss Bhāgīrathī aufbrechen; dort werdet ihr all jene sehen, die in dieser Schlacht gefallen sind.“","",[["sarve bhavanto gacchantu","ihr alle mögt aufbrechen (Nom. Pl. + Imp.)"],["nadīṃ bhāgīrathīṃ prati","zum Fluss Bhāgīrathī hin (Akk. + Präp.)"],["tatra drakṣyatha tān sarvān","dort werdet ihr all jene sehen (Adv. + Fut. + Akk.)"],["ye hatāsmin raṇājire","die in dieser Schlacht gefallen sind (Rel. + Ptz. + Lok.)"]]],["019","vaiśaṃpāyana uvāca iti vyāsasya vacanaṃ śrutvā sarvo janas tadā mahatā siṃhanādena gaṅgām abhimukho yayau","Vaiśaṃpāyana sprach: Nachdem sie diese Worte Vyāsas gehört hatten, brach da das ganze Volk mit gewaltigem Löwengebrüll auf, der Gaṅgā entgegen.","",[["iti vyāsasya vacanam","diese Worte Vyāsas (Zitat + Gen. + Akk.)"],["śrutvā sarvo janas tadā","nachdem sie gehört hatten, das ganze Volk da (Abs. + Nom. + Adv.)"],["mahatā siṃhanādena","mit gewaltigem Löwengebrüll (Instr.)"],["gaṅgām abhimukho yayau","brach der Gaṅgā entgegen auf (Akk. + Adj. + Perf.)"]]],["020","dhṛtarāṣṭraś ca sāmātyaḥ prayayau saha pāṇḍavaiḥ sahito muniśārdūlair gandharvaiś ca samāgataiḥ","Und Dhṛtarāṣṭra zog mit seinen Ministern fort, zusammen mit den Pāṇḍavas, begleitet von den Tigern unter den Weisen und den versammelten Gandharvas.","",[["dhṛtarāṣṭraś ca sāmātyaḥ","und Dhṛtarāṣṭra mit seinen Ministern (Nom. + Adj.)"],["prayayau saha pāṇḍavaiḥ","zog fort zusammen mit den Pāṇḍavas (Perf. + Instr.)"],["sahito muniśārdūlaiḥ","begleitet von den Tigern unter den Weisen (Ptz. + Instr.)"],["gandharvaiś ca samāgataiḥ","und den versammelten Gandharvas (Instr.)"]]],["021","tato gaṅgāṃ samāsādya krameṇa sa janārṇavaḥ nivāsam akarot sarvo yathāprīti yathāsukham","Dann, nachdem er die Gaṅgā erreicht hatte, schlug jener Ozean von Menschen der Reihe nach überall sein Lager auf, jeder nach Belieben und Bequemlichkeit.","",[["tato gaṅgāṃ samāsādya","dann, nachdem er die Gaṅgā erreicht hatte (Adv. + Akk. + Abs.)"],["krameṇa sa janārṇavaḥ","der Reihe nach, jener Ozean von Menschen (Instr. + Nom.)"],["nivāsam akarot sarvaḥ","schlug alle ihr Lager auf (Akk. + Impf. + Nom.)"],["yathāprīti yathāsukham","nach Belieben und Bequemlichkeit (Adv.)"]]],["022","rājā ca pāṇḍavaiḥ sārdham iṣṭe deśe sahānugaḥ nivāsam akarod dhīmān sastrīvṛddhapuraḥsaraḥ","Und der weise König schlug zusammen mit den Pāṇḍavas, mit seinem Gefolge, an einem erwünschten Ort sein Lager auf, mit den Frauen und den Alten vorangehend.","",[["rājā ca pāṇḍavaiḥ sārdham","und der König zusammen mit den Pāṇḍavas (Nom. + Instr.)"],["iṣṭe deśe sahānugaḥ","an einem erwünschten Ort, mit Gefolge (Lok. + Adj.)"],["nivāsam akarod dhīmān","schlug der Weise sein Lager auf (Akk. + Impf. + Nom.)"],["sastrīvṛddhapuraḥsaraḥ","mit den Frauen und Alten vorangehend (Adj.)"]]],["023","jagāma tad ahaś cāpi teṣāṃ varṣaśataṃ yathā niśāṃ pratīkṣamāṇānāṃ didṛkṣūṇāṃ mṛtān nṛpān","Und jener Tag verging ihnen wie hundert Jahre, während sie, die Nacht erwartend, begierig darauf waren, die toten Fürsten zu sehen.","",[["jagāma tad ahaś cāpi","und jener Tag verging auch (Perf. + Nom. + Adv.)"],["teṣāṃ varṣaśataṃ yathā","ihnen wie hundert Jahre (Gen. + Nom. + Adv.)"],["niśāṃ pratīkṣamāṇānām","während sie die Nacht erwarteten (Akk. + Ptz. Gen. Pl.)"],["didṛkṣūṇāṃ mṛtān nṛpān","begierig, die toten Fürsten zu sehen (Adj. + Akk.)"]]],["024","atha puṇyaṃ girivaram astam abhyagamad raviḥ tataḥ kṛtābhiṣekās te naiśaṃ karma samācaran","Dann ging die Sonne unter hinter dem heiligen, vortrefflichen Berg; darauf vollzogen sie, nach vollzogenem Bad, das nächtliche Ritual.","",[["atha puṇyaṃ girivaram","dann hinter den heiligen, vortrefflichen Berg (Adv. + Akk.)"],["astam abhyagamad raviḥ","ging die Sonne unter (Akk. + Impf. + Nom.)"],["tataḥ kṛtābhiṣekās te","darauf, nach vollzogenem Bad, sie (Adv. + Adj. + Nom.)"],["naiśaṃ karma samācaran","vollzogen das nächtliche Ritual (Akk. + Impf.)"]]]]},{"num":40,"title_sa":"Mṛtavīrāṇāṃ Gaṅgājalād Utthānam","title_de":"Das Wunder: die gefallenen Krieger steigen aus dem Wasser der Gaṅgā","note":"","units":[["001","vaiśaṃpāyana uvāca tato niśāyāṃ prāptāyāṃ kṛtasāyāhnikakriyāḥ vyāsam abhyagaman sarve ye tatrāsan samāgatāḥ","Vaiśaṃpāyana sprach: Als dann die Nacht angebrochen war, gingen alle, die dort versammelt waren, nachdem sie die Abendriten vollzogen hatten, zu Vyāsa.","",[["tato niśāyāṃ prāptāyām","als dann die Nacht angebrochen war (Adv. + Lok. Abs.)"],["kṛtasāyāhnikakriyāḥ","nachdem sie die Abendriten vollzogen hatten (Adj.)"],["vyāsam abhyagaman sarve","gingen alle zu Vyāsa (Akk. + Perf. + Nom.)"],["ye tatrāsan samāgatāḥ","die dort versammelt waren (Rel. + Impf. + Ptz.)"]]],["002","dhṛtarāṣṭras tu dharmātmā pāṇḍavaiḥ sahitas tadā śucir ekamanāḥ sārdham ṛṣibhis tair upāviśat","Dhṛtarāṣṭra aber, der Fromme, setzte sich da zusammen mit den Pāṇḍavas, gereinigt, eines Sinnes, gemeinsam mit jenen Sehern nieder.","",[["dhṛtarāṣṭras tu dharmātmā","Dhṛtarāṣṭra aber, der Fromme (Nom.)"],["pāṇḍavaiḥ sahitas tadā","da zusammen mit den Pāṇḍavas (Instr. + Adj. + Adv.)"],["śucir ekamanāḥ sārdham","gereinigt, eines Sinnes, gemeinsam (Adj.)"],["ṛṣibhis tair upāviśat","setzte sich mit jenen Sehern nieder (Instr. + Impf.)"]]],["003","gāndhāryā saha nāryas tu sahitāḥ samupāviśan paurajānapadaś cāpi janaḥ sarvo yathāvayaḥ","Die Frauen aber setzten sich zusammen mit Gāndhārī nieder, und auch das ganze Volk aus Stadt und Land, jeder seinem Alter gemäß.","",[["gāndhāryā saha nāryas tu","die Frauen aber zusammen mit Gāndhārī (Instr. + Nom. Pl.)"],["sahitāḥ samupāviśan","setzten sich gemeinsam nieder (Adj. + Impf.)"],["paurajānapadaś cāpi janaḥ","und auch das Volk aus Stadt und Land (Adj. + Nom.)"],["sarvo yathāvayaḥ","alle, dem Alter gemäß (Nom. + Adv.)"]]],["004","tato vyāso mahātejāḥ puṇyaṃ bhāgīrathījalam avagāhyājuhāvātha sarvāṃl lokān mahāmuniḥ","Dann tauchte Vyāsa, der von großer Glut, in das heilige Wasser der Bhāgīrathī ein und rief darauf, der große Weise, alle Welten herbei.","",[["tato vyāso mahātejāḥ","dann Vyāsa, der von großer Glut (Adv. + Nom.)"],["puṇyaṃ bhāgīrathījalam","das heilige Wasser der Bhāgīrathī (Akk.)"],["avagāhyājuhāvātha","eintauchend, rief er dann herbei (Abs. + Perf.)"],["sarvāṃl lokān mahāmuniḥ","alle Welten, der große Weise (Akk. + Nom.)"]]],["005","pāṇḍavānāṃ ca ye yodhāḥ kauravāṇāṃ ca sarvaśaḥ rājānaś ca mahābhāgā nānādeśanivāsinaḥ","sowohl die Krieger der Pāṇḍavas als auch, vollständig, die der Kauravas, und die glückhaften Könige, Bewohner verschiedenster Länder.","",[["pāṇḍavānāṃ ca ye yodhāḥ","und die Krieger der Pāṇḍavas (Gen. + Rel. + Nom.)"],["kauravāṇāṃ ca sarvaśaḥ","und die der Kauravas, vollständig (Gen. + Adv.)"],["rājānaś ca mahābhāgāḥ","und die glückhaften Könige (Nom. Pl.)"],["nānādeśanivāsinaḥ","Bewohner verschiedenster Länder (Nom. Pl.)"]]],["006","tataḥ sutumulaḥ śabdo jalāntar janamejaya prādurāsīd yathā pūrvaṃ kurupāṇḍavasenayoḥ","Dann erhob sich, o Janamejaya, ein überaus tosender Klang im Inneren des Wassers, wie einst zwischen den Heeren der Kurus und Pāṇḍavas.","",[["tataḥ sutumulaḥ śabdaḥ","dann ein überaus tosender Klang (Adv. + Nom.)"],["jalāntar janamejaya","im Inneren des Wassers, o Janamejaya (Adv. + Vok.)"],["prādurāsīd yathā pūrvam","erhob sich, wie einst (Impf. + Adv.)"],["kurupāṇḍavasenayoḥ","zwischen den Heeren der Kurus und Pāṇḍavas (Gen. Dual)"]]],["007","tatas te pārthivāḥ sarve bhīṣmadroṇapurogamāḥ sasainyāḥ salilāt tasmāt samuttasthuḥ sahasraśaḥ","Dann erhoben sich alle jene Fürsten, angeführt von Bhīṣma und Droṇa, zusammen mit ihren Heeren, zu Tausenden aus jenem Wasser.","",[["tatas te pārthivāḥ sarve","dann alle jene Fürsten (Adv. + Nom. Pl.)"],["bhīṣmadroṇapurogamāḥ","angeführt von Bhīṣma und Droṇa (Adj.)"],["sasainyāḥ salilāt tasmāt","zusammen mit ihren Heeren, aus jenem Wasser (Adj. + Abl.)"],["samuttasthuḥ sahasraśaḥ","erhoben sich zu Tausenden (Perf. + Adv.)"]]],["008","virāṭadrupadau cobhau saputrau sahasainikau draupadeyāś ca saubhadro rākṣasaś ca ghaṭotkacaḥ","Sowohl Virāṭa als auch Drupada, beide mit ihren Söhnen und ihren Heeren, und die Söhne der Draupadī, und der Sohn der Subhadrā, und der Rākṣasa Ghaṭotkaca,","",[["virāṭadrupadau cobhau","sowohl Virāṭa als auch Drupada, beide (Nom. Dual)"],["saputrau sahasainikau","mit ihren Söhnen und ihren Heeren (Adj. Dual)"],["draupadeyāś ca saubhadraḥ","und die Söhne der Draupadī, und der Sohn der Subhadrā (Nom. Pl. + Nom.)"],["rākṣasaś ca ghaṭotkacaḥ","und der Rākṣasa Ghaṭotkaca (Nom.)"]]],["009","karṇaduryodhanau cobhau śakuniś ca mahārathaḥ duḥśāsanādayaś caiva dhārtarāṣṭrā mahārathāḥ","sowohl Karṇa als auch Duryodhana, und Śakuni, der große Streitwagenkämpfer, und Duḥśāsana und die anderen, die großen Streitwagenkämpfer, Söhne Dhṛtarāṣṭras,","",[["karṇaduryodhanau cobhau","sowohl Karṇa als auch Duryodhana, beide (Nom. Dual)"],["śakuniś ca mahārathaḥ","und Śakuni, der große Streitwagenkämpfer (Nom.)"],["duḥśāsanādayaś caiva","und Duḥśāsana und die anderen (Nom. Pl.)"],["dhārtarāṣṭrā mahārathāḥ","die großen Streitwagenkämpfer, Söhne Dhṛtarāṣṭras (Nom. Pl.)"]]],["010","jārāsaṃdhir bhagadatto jalasaṃdhaś ca pārthivaḥ bhūriśravāḥ śalaḥ śalyo vṛṣasenaś ca sānujaḥ","Jarāsaṃdhi, Bhagadatta, und der Fürst Jalasaṃdha, Bhūriśravas, Śala, Śalya, und Vṛṣasena mit seinem jüngeren Bruder,","",[["jārāsaṃdhir bhagadattaḥ","Jarāsaṃdhi, Bhagadatta (Nom.)"],["jalasaṃdhaś ca pārthivaḥ","und der Fürst Jalasaṃdha (Nom.)"],["bhūriśravāḥ śalaḥ śalyaḥ","Bhūriśravas, Śala, Śalya (Nom.)"],["vṛṣasenaś ca sānujaḥ","und Vṛṣasena mit seinem jüngeren Bruder (Nom. + Adj.)"]]],["011","lakṣmaṇo rājaputraś ca dhṛṣṭadyumnasya cātmajāḥ śikhaṇḍiputrāḥ sarve ca dhṛṣṭaketuś ca sānujaḥ","der Königssohn Lakṣmaṇa, und die Söhne des Dhṛṣṭadyumna, alle Söhne Śikhaṇḍins, und Dhṛṣṭaketu mit seinem jüngeren Bruder,","",[["lakṣmaṇo rājaputraś ca","und der Königssohn Lakṣmaṇa (Nom.)"],["dhṛṣṭadyumnasya cātmajāḥ","und die Söhne des Dhṛṣṭadyumna (Gen. + Nom. Pl.)"],["śikhaṇḍiputrāḥ sarve ca","und alle Söhne Śikhaṇḍins (Nom. Pl.)"],["dhṛṣṭaketuś ca sānujaḥ","und Dhṛṣṭaketu mit seinem jüngeren Bruder (Nom. + Adj.)"]]],["012","acalo vṛṣakaś caiva rākṣasaś cāpy alāyudhaḥ bāhlīkaḥ somadattaś ca cekitānaś ca pārthivaḥ","Acala und Vṛṣaka, und auch der Rākṣasa Alāyudha, Bāhlīka, Somadatta, und der Fürst Cekitāna,","",[["acalo vṛṣakaś caiva","Acala und Vṛṣaka (Nom.)"],["rākṣasaś cāpy alāyudhaḥ","und auch der Rākṣasa Alāyudha (Nom.)"],["bāhlīkaḥ somadattaś ca","Bāhlīka und Somadatta (Nom.)"],["cekitānaś ca pārthivaḥ","und der Fürst Cekitāna (Nom.)"]]],["013","ete cānye ca bahavo bahutvād ye na kīrtitāḥ sarve bhāsuradehās te samuttasthur jalāt tataḥ","diese und viele andere, die wegen ihrer Menge nicht genannt wurden – alle mit strahlenden Leibern erhoben sie sich da aus dem Wasser.","",[["ete cānye ca bahavaḥ","diese und viele andere (Nom. Pl.)"],["bahutvād ye na kīrtitāḥ","die wegen ihrer Menge nicht genannt wurden (Abl. + Rel. + Ptz.)"],["sarve bhāsuradehās te","alle mit strahlenden Leibern, sie (Nom. Pl.)"],["samuttasthur jalāt tataḥ","erhoben sich da aus dem Wasser (Perf. + Abl. + Adv.)"]]],["014","yasya vīrasya yo veṣo yo dhvajo yac ca vāhanam tena tena vyadṛśyanta samupetā narādhipāḥ","Mit welchem Gewand, welchem Banner und welchem Reittier jeder Held versehen war, mit eben diesem erschienen die Herrscher der Menschen, damit ausgestattet.","",[["yasya vīrasya yo veṣaḥ","mit welchem Gewand jeder Held (Gen. + Nom.)"],["yo dhvajo yac ca vāhanam","welches Banner und welches Reittier (Nom.)"],["tena tena vyadṛśyanta","mit eben diesem erschienen sie (Instr. + Pass. Impf.)"],["samupetā narādhipāḥ","die Herrscher der Menschen, damit ausgestattet (Ptz. + Nom. Pl.)"]]],["015","divyāmbaradharāḥ sarve sarve bhrājiṣṇukuṇḍalāḥ nirvairā nirahaṃkārā vigatakrodhamanyavaḥ","Alle waren mit himmlischen Gewändern bekleidet, alle mit leuchtenden Ohrringen versehen, ohne Feindschaft, ohne Hochmut, frei von Zorn und Groll,","",[["divyāmbaradharāḥ sarve","alle mit himmlischen Gewändern bekleidet (Adj. + Nom. Pl.)"],["sarve bhrājiṣṇukuṇḍalāḥ","alle mit leuchtenden Ohrringen (Nom. Pl.)"],["nirvairā nirahaṃkārāḥ","ohne Feindschaft, ohne Hochmut (Adj.)"],["vigatakrodhamanyavaḥ","frei von Zorn und Groll (Adj.)"]]],["016","gandharvair upagīyantaḥ stūyamānāś ca bandibhiḥ divyamālyāmbaradharā vṛtāś cāpsarasāṃ gaṇaiḥ","von Gandharvas besungen und von Barden gepriesen, mit himmlischen Kränzen und Gewändern bekleidet, umgeben von Scharen der Apsaras.","",[["gandharvair upagīyantaḥ","von Gandharvas besungen (Instr. + Ptz.)"],["stūyamānāś ca bandibhiḥ","und von Barden gepriesen (Ptz. + Instr.)"],["divyamālyāmbaradharāḥ","mit himmlischen Kränzen und Gewändern bekleidet (Adj.)"],["vṛtāś cāpsarasāṃ gaṇaiḥ","umgeben von Scharen der Apsaras (Ptz. + Gen. + Instr.)"]]],["017","dhṛtarāṣṭrasya ca tadā divyaṃ cakṣur narādhipa muniḥ satyavatīputraḥ prītaḥ prādāt tapobalāt","Und Dhṛtarāṣṭra, o Herrscher der Menschen, verlieh der Weise, der Sohn der Satyavatī, da erfreut durch die Kraft seiner Askese göttliches Augenlicht.","",[["dhṛtarāṣṭrasya ca tadā","und Dhṛtarāṣṭra da (Gen. + Adv.)"],["divyaṃ cakṣur narādhipa","göttliches Augenlicht, o Herrscher der Menschen (Akk. + Vok.)"],["muniḥ satyavatīputraḥ","der Weise, der Sohn der Satyavatī (Nom.)"],["prītaḥ prādāt tapobalāt","erfreut verlieh er durch die Kraft der Askese (Ptz. + Perf. + Abl.)"]]],["018","divyajñānabalopetā gāndhārī ca yaśasvinī dadarśa putrāṃs tān sarvān ye cānye 'pi raṇe hatāḥ","Und die ruhmreiche Gāndhārī, mit der Kraft göttlichen Wissens ausgestattet, erblickte all jene ihre Söhne, und auch die anderen, die in der Schlacht gefallen waren.","",[["divyajñānabalopetā","mit der Kraft göttlichen Wissens ausgestattet (Adj.)"],["gāndhārī ca yaśasvinī","und die ruhmreiche Gāndhārī (Nom.)"],["dadarśa putrāṃs tān sarvān","erblickte all jene Söhne (Perf. + Akk.)"],["ye cānye 'pi raṇe hatāḥ","und auch die anderen, die in der Schlacht gefallen waren (Rel. + Lok. + Ptz.)"]]],["019","tad adbhutam acintyaṃ ca sumahad romaharṣaṇam vismitaḥ sa janaḥ sarvo dadarśānimiṣekṣaṇaḥ","Jenes wunderbare, unfassbare, überaus große, die Haare sträubende Schauspiel erblickte jenes ganze Volk, erstaunt, mit unbeweglich starrendem Blick.","",[["tad adbhutam acintyaṃ ca","jenes wunderbare und unfassbare (Akk.)"],["sumahad romaharṣaṇam","das überaus große, die Haare sträubende (Akk.)"],["vismitaḥ sa janaḥ sarvo","erstaunt, jenes ganze Volk (Ptz. + Nom.)"],["dadarśānimiṣekṣaṇaḥ","erblickte, mit unbeweglich starrendem Blick (Perf. + Adj.)"]]],["020","tad utsavamadodagraṃ hṛṣṭanārīnarākulam dadṛśe balam āyāntaṃ citraṃ paṭagataṃ yathā","Jenes von Festesrausch erfüllte, von erfreuten Frauen und Männern durchmischte Heer sah man herannahen, wie ein wunderbares, auf ein Gemälde gebanntes Bild.","",[["tad utsavamadodagram","jenes von Festesrausch überaus erfüllte (Akk.)"],["hṛṣṭanārīnarākulam","von erfreuten Frauen und Männern durchmischte (Akk.)"],["dadṛśe balam āyāntam","man sah das Heer herannahen (Pass. Perf. + Akk. + Ptz.)"],["citraṃ paṭagataṃ yathā","wie ein wunderbares, auf ein Gemälde gebanntes [Bild] (Akk. + Adv.)"]]],["021","dhṛtarāṣṭras tu tān sarvān paśyan divyena cakṣuṣā mumude bharataśreṣṭha prasādāt tasya vai muneḥ","Dhṛtarāṣṭra aber, indem er all diese mit dem göttlichen Auge sah, freute sich, o Bester der Bharatas, durch die Gnade eben jenes Weisen.","",[["dhṛtarāṣṭras tu tān sarvān","Dhṛtarāṣṭra aber all diese (Nom. + Akk.)"],["paśyan divyena cakṣuṣā","sehend mit dem göttlichen Auge (Ptz. + Instr.)"],["mumude bharataśreṣṭha","freute sich, o Bester der Bharatas (Perf. + Vok.)"],["prasādāt tasya vai muneḥ","durch die Gnade eben jenes Weisen (Abl. + Gen.)"]]]]},{"num":41,"title_sa":"","title_de":"Der Abschied am Ufer der Gaṅgā","note":"Abschluss der Wiedervereinigungs-Episode (Putradarśanaparva) mit Phalaśruti.","units":[["001","vaiśaṃpāyana uvāca tatas te bharataśreṣṭhāḥ samājagmuḥ parasparam vigatakrodhamātsaryāḥ sarve vigatakalmaṣāḥ","Vaiśaṃpāyana sprach: Da kamen jene Besten der Bharatas miteinander zusammen, alle frei von Zorn und Missgunst, alle von Verfehlung befreit.","",[["vaiśaṃpāyana uvāca","Vaiśaṃpāyana sprach (Nom. + Perf.)"],["tatas te bharataśreṣṭhāḥ samājagmuḥ parasparam","da kamen jene Besten der Bharatas miteinander zusammen (Nom.Pl. + Perf.)"],["vigatakrodhamātsaryāḥ sarve vigatakalmaṣāḥ","alle frei von Zorn und Missgunst, frei von Verfehlung (Nom.Pl.Bahuvrīhi)"]]],["002","vidhiṃ paramam āsthāya brahmarṣivihitaṃ śubham saṃprītamanasaḥ sarve devaloka ivāmarāḥ","Der höchsten, von den Brahmarṣis verordneten heilvollen Ordnung folgend, alle mit von Freude erfüllten Herzen, wie die Unsterblichen in der Götterwelt.","",[["vidhiṃ paramam āsthāya brahmarṣivihitaṃ śubham","der höchsten, von den Brahmarṣis verordneten heilvollen Ordnung folgend (Akk. + Absol.)"],["saṃprītamanasaḥ sarve","alle mit von Freude erfüllten Herzen (Nom.Pl.Bahuvrīhi)"],["devaloka ivāmarāḥ","wie die Unsterblichen in der Götterwelt (Lok. + Nom.Pl.)"]]],["003","putraḥ pitrā ca mātrā ca bhāryā ca patinā saha bhrātā bhrātrā sakhā caiva sakhyā rājan samāgatāḥ","Der Sohn mit Vater und Mutter, die Gattin mit dem Gatten, der Bruder mit dem Bruder, ebenso der Freund mit dem Freund, o König, kamen sie zusammen.","",[["putraḥ pitrā ca mātrā ca","der Sohn mit Vater und Mutter (Nom. + Instr.)"],["bhāryā ca patinā saha","die Gattin mit dem Gatten (Nom. + Instr.)"],["bhrātā bhrātrā sakhā caiva sakhyā rājan samāgatāḥ","der Bruder mit dem Bruder, der Freund mit dem Freund, o König, kamen zusammen (Nom. + Vok. + Nom.Pl.Part.Perf.Pass.)"]]],["004","pāṇḍavās tu maheṣvāsaṃ karṇaṃ saubhadram eva ca saṃpraharṣāt samājagmur draupadeyāṃś ca sarvaśaḥ","Die Pāṇḍavas aber kamen voll Freude mit dem großen Bogenschützen Karṇa und mit Saubhadra zusammen, und ebenso mit allen Söhnen der Draupadī.","",[["pāṇḍavās tu maheṣvāsaṃ karṇaṃ saubhadram eva ca","die Pāṇḍavas aber mit dem großen Bogenschützen Karṇa und mit Saubhadra (Nom.Pl. + Akk.)"],["saṃpraharṣāt samājagmur draupadeyāṃś ca sarvaśaḥ","kamen voll Freude zusammen, und mit allen Söhnen der Draupadī (Abl. + Perf. + Akk.Pl.)"]]],["005","tatas te prīyamāṇā vai karṇena saha pāṇḍavāḥ sametya pṛthivīpālāḥ sauhṛde 'vasthitābhavan","Da wurden die Pāṇḍavas, sich mit Karṇa erfreuend, die Herren der Erde, nach der Zusammenkunft in Freundschaft verbunden.","",[["tatas te prīyamāṇā vai karṇena saha pāṇḍavāḥ","da die Pāṇḍavas, sich mit Karṇa erfreuend (Nom.Pl.Part.Med.)"],["sametya pṛthivīpālāḥ sauhṛde 'vasthitābhavan","die Herren der Erde wurden, nach der Zusammenkunft, in Freundschaft verbunden (Absol. + Lok. + Impf.)"]]],["006","ṛṣiprasādāt te 'nye ca kṣatriyā naṣṭamanyavaḥ asauhṛdaṃ parityajya sauhṛde paryavasthitāḥ","Durch die Gnade des Ṛṣi gaben auch die anderen Kṣatriyas, ihren Zorn verloren habend, die Feindschaft auf und wurden in Freundschaft verbunden.","",[["ṛṣiprasādāt te 'nye ca kṣatriyā naṣṭamanyavaḥ","durch die Gnade des Ṛṣi auch die anderen Kṣatriyas, ihren Zorn verloren habend (Abl. + Nom.Pl.Bahuvrīhi)"],["asauhṛdaṃ parityajya sauhṛde paryavasthitāḥ","gaben die Feindschaft auf und wurden in Freundschaft verbunden (Akk. + Absol. + Nom.Pl.Part.Perf.Pass.)"]]],["007","evaṃ samāgatāḥ sarve gurubhir bāndhavais tathā putraiś ca puruṣavyāghrāḥ kuravo 'nye ca mānavāḥ","So kamen alle zusammen, mit Lehrern und Verwandten sowie Söhnen, die Tigern unter den Männern gleichenden Kurus und die anderen Menschen.","",[["evaṃ samāgatāḥ sarve gurubhir bāndhavais tathā putraiś ca","so kamen alle zusammen, mit Lehrern und Verwandten sowie Söhnen (Nom.Pl.Part. + Instr.Pl.)"],["puruṣavyāghrāḥ kuravo 'nye ca mānavāḥ","die Tigern unter den Männern gleichenden Kurus und die anderen Menschen (Nom.Pl.)"]]],["008","tāṃ rātrim ekāṃ kṛtsnāṃ te vihṛtya prītamānasāḥ menire paritoṣeṇa nṛpāḥ svargasado yathā","Jene eine ganze Nacht verbrachten sie mit erfreuten Herzen, und die Könige empfanden Genugtuung, wie die Bewohner des Himmels.","",[["tāṃ rātrim ekāṃ kṛtsnāṃ te vihṛtya prītamānasāḥ","jene eine ganze Nacht verbrachten sie mit erfreuten Herzen (Akk. + Absol. + Nom.Pl.Bahuvrīhi)"],["menire paritoṣeṇa nṛpāḥ svargasado yathā","empfanden die Könige Genugtuung, wie die Bewohner des Himmels (Perf.Med. + Instr. + Nom.Pl.)"]]],["009","nātra śoko bhayaṃ trāso nāratir nāyaśo 'bhavat parasparaṃ samāgamya yodhānāṃ bharatarṣabha","Dort gab es keinen Kummer, keine Furcht, kein Erschrecken, kein Missvergnügen und keine Schande, als die Krieger, o Stier der Bharatas, miteinander zusammenkamen.","",[["nātra śoko bhayaṃ trāso nāratir nāyaśo 'bhavat","dort gab es keinen Kummer, keine Furcht, kein Erschrecken, kein Missvergnügen und keine Schande (Nom. + Impf.)"],["parasparaṃ samāgamya yodhānāṃ bharatarṣabha","als die Krieger miteinander zusammenkamen, o Stier der Bharatas (Absol. + Gen.Pl. + Vok.)"]]],["010","samāgatās tāḥ pitṛbhir bhrātṛbhiḥ patibhiḥ sutaiḥ mudaṃ paramikāṃ prāpya nāryo duḥkham athātyajan","Die Frauen, mit Vätern, Brüdern, Gatten und Söhnen zusammengekommen, gelangten zu höchster Freude und legten darauf ihr Leid ab.","",[["samāgatās tāḥ pitṛbhir bhrātṛbhiḥ patibhiḥ sutaiḥ","zusammengekommen mit Vätern, Brüdern, Gatten und Söhnen (Nom.Pl.Part. + Instr.Pl.)"],["mudaṃ paramikāṃ prāpya nāryo duḥkham athātyajan","gelangten die Frauen zu höchster Freude und legten darauf ihr Leid ab (Akk. + Absol. + Nom.Pl. + Impf.)"]]],["011","ekāṃ rātriṃ vihṛtyaivaṃ te vīrās tāś ca yoṣitaḥ āmantryānyonyam āśliṣya tato jagmur yathāgatam","Nachdem so die Helden und die Frauen eine Nacht verbracht hatten, verabschiedeten sie sich voneinander, umarmten sich und gingen dann, wie sie gekommen waren.","",[["ekāṃ rātriṃ vihṛtyaivaṃ te vīrās tāś ca yoṣitaḥ","nachdem so die Helden und die Frauen eine Nacht verbracht hatten (Akk. + Absol. + Nom.Pl.)"],["āmantryānyonyam āśliṣya tato jagmur yathāgatam","verabschiedeten sie sich voneinander, umarmten sich und gingen dann, wie sie gekommen waren (Absol. + Absol. + Perf.)"]]],["012","tato visarjayām āsa lokāṃs tān munipuṃgavaḥ kṣaṇenāntarhitāś caiva prekṣatām eva te 'bhavan","Da entließ der Stier unter den Weisen jene Wesen in ihre Welten, und im selben Augenblick verschwanden sie, noch während man sie ansah.","",[["tato visarjayām āsa lokāṃs tān munipuṃgavaḥ","da entließ der Stier unter den Weisen jene in ihre Welten (Perf.Periphr. + Akk.Pl. + Nom.)"],["kṣaṇenāntarhitāś caiva prekṣatām eva te 'bhavan","und im selben Augenblick verschwanden sie, noch während man sie ansah (Instr. + Nom.Pl.Part.Perf.Pass. + Gen.Pl.Part. + Impf.)"]]],["013","avagāhya mahātmānaḥ puṇyāṃ tripathagāṃ nadīm sarathāḥ sadhvajāś caiva svāni sthānāni bhejire","Nachdem die Großherzigen in den heiligen, auf drei Pfaden fließenden Fluss eingetaucht waren, mit ihren Wagen und Bannern, begaben sie sich zu ihren jeweiligen Aufenthaltsorten.","",[["avagāhya mahātmānaḥ puṇyāṃ tripathagāṃ nadīm","nachdem die Großherzigen in den heiligen, auf drei Pfaden fließenden Fluss eingetaucht waren (Absol. + Nom.Pl. + Akk.)"],["sarathāḥ sadhvajāś caiva svāni sthānāni bhejire","mit ihren Wagen und Bannern begaben sie sich zu ihren jeweiligen Aufenthaltsorten (Nom.Pl.Bahuvrīhi + Akk.Pl. + Perf.Med.)"]]],["014","devalokaṃ yayuḥ ke cit ke cid brahmasadas tathā ke cic ca vāruṇaṃ lokaṃ ke cit kauberam āpnuvan","Einige gingen in die Welt der Götter, einige ebenso in die Versammlungsstätte Brahmas, einige erreichten die Welt Varuṇas, einige die Welt Kuberas.","",[["devalokaṃ yayuḥ ke cit ke cid brahmasadas tathā","einige gingen in die Welt der Götter, einige ebenso in die Versammlungsstätte Brahmas (Akk. + Perf. + Akk.)"],["ke cic ca vāruṇaṃ lokaṃ ke cit kauberam āpnuvan","einige erreichten die Welt Varuṇas, einige die Welt Kuberas (Akk. + Impf.)"]]],["015","tathā vaivasvataṃ lokaṃ ke cic caivāpnuvan nṛpāḥ rākṣasānāṃ piśācānāṃ ke cic cāpy uttarān kurūn","Ebenso erreichten einige der Könige die Welt des Vaivasvata, einige die Welten der Rākṣasas und Piśācas, und einige die Uttarakurus.","",[["tathā vaivasvataṃ lokaṃ ke cic caivāpnuvan nṛpāḥ","ebenso erreichten einige der Könige die Welt des Vaivasvata (Akk. + Impf. + Nom.Pl.)"],["rākṣasānāṃ piśācānāṃ ke cic cāpy uttarān kurūn","einige die Welten der Rākṣasas und Piśācas, und einige die Uttarakurus (Gen.Pl. + Akk.Pl.)"]]],["016","vicitragatayaḥ sarve yā avāpyāmaraiḥ saha ājagmus te mahātmānaḥ savāhāḥ sapadānugāḥ","Auf mannigfaltigen Wegen [?], die sie zusammen mit den Unsterblichen erlangt hatten, gingen jene Großherzigen mit ihren Reittieren und ihrem Gefolge dahin.","[?] Die genaue syntaktische Verknüpfung von \"vicitragatayaḥ\" (mannigfaltige Wege/Gänge) und \"yā avāpya\" (welche erlangt habend) bleibt im Detail unsicher; sinngemäß wiedergegeben.",[["vicitragatayaḥ sarve yā avāpyāmaraiḥ saha","auf mannigfaltigen Wegen, die sie zusammen mit den Unsterblichen erlangt hatten (Nom.Pl.Bahuvrīhi + Absol. + Instr.Pl.)"],["ājagmus te mahātmānaḥ savāhāḥ sapadānugāḥ","gingen jene Großherzigen mit ihren Reittieren und ihrem Gefolge dahin (Perf. + Nom.Pl.Bahuvrīhi)"]]],["017","gateṣu teṣu sarveṣu salilastho mahāmuniḥ dharmaśīlo mahātejāḥ kurūṇāṃ hitakṛt sadā tataḥ provāca tāḥ sarvāḥ kṣatriyā nihateśvarāḥ","Als sie alle gegangen waren, sprach da der im Wasser stehende große Weise, von dharmagemäßer Wesensart, von großer Glut, der stets zum Wohl der Kurus Handelnde, zu all jenen Kṣatriya-Frauen, deren Herren erschlagen waren:","",[["gateṣu teṣu sarveṣu salilastho mahāmuniḥ","als sie alle gegangen waren, der im Wasser stehende große Weise (Lok.Abs. + Nom.)"],["dharmaśīlo mahātejāḥ kurūṇāṃ hitakṛt sadā","von dharmagemäßer Wesensart, von großer Glut, der stets zum Wohl der Kurus Handelnde (Nom.Bahuvrīhi)"],["tataḥ provāca tāḥ sarvāḥ kṣatriyā nihateśvarāḥ","da sprach er zu all jenen Kṣatriya-Frauen, deren Herren erschlagen waren (Perf. + Akk.Pl. + Nom.Bahuvrīhi)"]]],["018","yā yāḥ patikṛtāṃl lokān icchanti paramastriyaḥ tā jāhnavījalaṃ kṣipram avagāhantv atandritāḥ","„Welche der hohen Frauen die von ihren Gatten erlangten Welten wünschen, die sollen unverzüglich, ohne Ermatten, in das Wasser der Jāhnavī eintauchen.“","",[["yā yāḥ patikṛtāṃl lokān icchanti paramastriyaḥ","welche der hohen Frauen die von ihren Gatten erlangten Welten wünschen (Nom.Pl. + Akk.Pl. + Präs.)"],["tā jāhnavījalaṃ kṣipram avagāhantv atandritāḥ","die sollen unverzüglich, ohne Ermatten, in das Wasser der Jāhnavī eintauchen (Akk. + Imp. + Nom.Pl.Bahuvrīhi)"]]],["019","tatas tasya vacaḥ śrutvā śraddadhānā varāṅganāḥ śvaśuraṃ samanujñāpya viviśur jāhnavījalam","Da, nachdem sie seine Worte vernommen hatten, gingen die vertrauensvollen edlen Frauen, nachdem sie den Schwiegervater [?] um Erlaubnis gebeten hatten, in das Wasser der Jāhnavī.","[?] \"śvaśuram\" (Schwiegervater) - vermutlich Dhṛtarāṣṭra gemeint, dem die Kṣatriya-Witwen als Familienoberhaupt gegenüber Rechenschaft schulden; nicht eindeutig benannt.",[["tatas tasya vacaḥ śrutvā śraddadhānā varāṅganāḥ","da, nachdem sie seine Worte vernommen hatten, die vertrauensvollen edlen Frauen (Absol. + Nom.Pl.Bahuvrīhi)"],["śvaśuraṃ samanujñāpya viviśur jāhnavījalam","nachdem sie den Schwiegervater um Erlaubnis gebeten hatten, gingen sie in das Wasser der Jāhnavī (Absol. + Perf. + Akk.)"]]],["020","vimuktā mānuṣair dehais tatas tā bhartṛbhiḥ saha samājagmus tadā sādhvyaḥ sarvā eva viśāṃ pate","Befreit von ihren menschlichen Körpern, vereinigten sich jene tugendhaften Frauen alle darauf mit ihren Gatten, o Herrscher der Menschen.","",[["vimuktā mānuṣair dehais tatas tā bhartṛbhiḥ saha","befreit von ihren menschlichen Körpern, vereinigten sich jene darauf mit ihren Gatten (Nom.Pl.Part.Perf.Pass. + Instr.Pl. + Instr.Pl.)"],["samājagmus tadā sādhvyaḥ sarvā eva viśāṃ pate","vereinigten sich alle tugendhaften Frauen, o Herrscher der Menschen (Perf. + Nom.Pl. + Vok.)"]]],["021","evaṃ krameṇa sarvās tāḥ śīlavatyaḥ kulastriyaḥ praviśya toyaṃ nirmuktā jagmur bhartṛsalokatām","So gelangten der Reihe nach all jene tugendhaften Frauen edler Familien, nachdem sie in das Wasser eingetaucht waren, befreit, zur Welt ihrer Gatten.","",[["evaṃ krameṇa sarvās tāḥ śīlavatyaḥ kulastriyaḥ","so der Reihe nach all jene tugendhaften Frauen edler Familien (Instr. + Nom.Pl.)"],["praviśya toyaṃ nirmuktā jagmur bhartṛsalokatām","nachdem sie in das Wasser eingetaucht waren, befreit, gelangten sie zur Welt ihrer Gatten (Absol. + Akk. + Nom.Pl.Part.Perf.Pass. + Perf. + Akk.)"]]],["022","divyarūpasamāyuktā divyābharaṇabhūṣitāḥ divyamālyāmbaradharā yathāsāṃ patayas tathā","Ausgestattet mit himmlischer Gestalt, geschmückt mit himmlischem Schmuck, himmlische Kränze und Gewänder tragend, ebenso wie ihre Gatten.","",[["divyarūpasamāyuktā divyābharaṇabhūṣitāḥ","ausgestattet mit himmlischer Gestalt, geschmückt mit himmlischem Schmuck (Nom.Pl.Bahuvrīhi)"],["divyamālyāmbaradharā yathāsāṃ patayas tathā","himmlische Kränze und Gewänder tragend, ebenso wie ihre Gatten (Nom.Pl.Bahuvrīhi + Nom.Pl.)"]]],["023","tāḥ śīlasattvasaṃpannā vitamaskā gataklamāḥ sarvāḥ sarvaguṇair yuktāḥ svaṃ svaṃ sthānaṃ prapedire","Jene, mit Tugend und Wesenskraft ausgestattet, frei von Dunkelheit, frei von Ermattung, alle mit allen guten Eigenschaften versehen, gelangten zu ihrem jeweils eigenen Ort.","",[["tāḥ śīlasattvasaṃpannā vitamaskā gataklamāḥ","jene, mit Tugend und Wesenskraft ausgestattet, frei von Dunkelheit, frei von Ermattung (Nom.Pl.Bahuvrīhi)"],["sarvāḥ sarvaguṇair yuktāḥ svaṃ svaṃ sthānaṃ prapedire","alle mit allen guten Eigenschaften versehen, gelangten zu ihrem jeweils eigenen Ort (Nom.Pl.Part. + Instr.Pl. + Akk. + Perf.Med.)"]]],["024","yasya yasya ca yaḥ kāmas tasmin kāle 'bhavat tadā taṃ taṃ visṛṣṭavān vyāso varado dharmavatsalaḥ","Und welchen Wunsch auch immer ein jeder zu jener Zeit hegte, den erfüllte ihm Vyāsa, der Gewährer von Gunst, der dem Dharma zugetan ist.","",[["yasya yasya ca yaḥ kāmas tasmin kāle 'bhavat","und welchen Wunsch auch immer ein jeder zu jener Zeit hegte (Gen. + Nom. + Lok. + Impf.)"],["tadā taṃ taṃ visṛṣṭavān vyāso varado dharmavatsalaḥ","den erfüllte ihm Vyāsa, der Gewährer von Gunst, der dem Dharma zugetan ist (Akk. + Perf.Part.Akt. + Nom.)"]]],["025","tac chrutvā naradevānāṃ punarāgamanaṃ narāḥ jahṛṣur muditāś cāsann anyadehagatā api","Als die Menschen dies von der Wiederkehr der Menschenfürsten vernahmen, freuten sie sich, und froh waren auch jene, die in andere Körper gegangen waren [?].","[?] \"anyadehagatāḥ\" (in andere Körper Gegangene) bleibt uneindeutig - gemeint sind wohl später Wiedergeborene oder Zuhörer künftiger Zeitalter, die von diesem Ereignis erfahren.",[["tac chrutvā naradevānāṃ punarāgamanaṃ narāḥ","als die Menschen dies von der Wiederkehr der Menschenfürsten vernahmen (Absol. + Gen.Pl. + Akk. + Nom.Pl.)"],["jahṛṣur muditāś cāsann anyadehagatā api","freuten sie sich, und froh waren auch jene, die in andere Körper gegangen waren (Perf. + Nom.Pl. + Impf. + Nom.Pl.Bahuvrīhi)"]]],["026","priyaiḥ samāgamaṃ teṣāṃ ya imaṃ śṛṇuyān naraḥ priyāṇi labhate nityam iha ca pretya caiva ha","Wer diese Erzählung von der Zusammenkunft jener mit ihren Lieben vernimmt, der erlangt beständig Liebes, hier und ebenso im Jenseits.","",[["priyaiḥ samāgamaṃ teṣāṃ ya imaṃ śṛṇuyān naraḥ","wer diese Erzählung von der Zusammenkunft jener mit ihren Lieben vernimmt (Instr.Pl. + Akk. + Gen.Pl. + Opt. + Nom.)"],["priyāṇi labhate nityam iha ca pretya caiva ha","der erlangt beständig Liebes, hier und ebenso im Jenseits (Akk.Pl. + Präs.Med. + Absol.)"]]],["027","iṣṭabāndhavasaṃyogam anāyāsam anāmayam ya imaṃ śrāvayed vidvān saṃsiddhiṃ prāpnuyāt parām","Wer, ein Kundiger, diese Erzählung von der mühelosen, unversehrten Vereinigung mit geliebten Verwandten verkünden lässt, erlangt höchste Vollendung.","",[["iṣṭabāndhavasaṃyogam anāyāsam anāmayam","von der mühelosen, unversehrten Vereinigung mit geliebten Verwandten (Akk.)"],["ya imaṃ śrāvayed vidvān saṃsiddhiṃ prāpnuyāt parām","wer, ein Kundiger, diese verkünden lässt, erlangt höchste Vollendung (Nom. + Kaus.Opt. + Nom. + Akk. + Opt.)"]]],["028","svādhyāyayuktāḥ puruṣāḥ kriyāyuktāś ca bhārata adhyātmayogayuktāś ca dhṛtimantaś ca mānavāḥ śrutvā parva tv idaṃ nityam avāpsyanti parāṃ gatim","Menschen, die dem Studium der heiligen Texte ergeben sind, o Bhārata, sowie die den rituellen Handlungen ergebenen, und die dem Adhyātma-Yoga ergebenen, standhaften Menschen werden, nachdem sie stets dieses Parva vernommen haben, den höchsten Weg erlangen.","",[["svādhyāyayuktāḥ puruṣāḥ kriyāyuktāś ca bhārata","Menschen, die dem Studium der heiligen Texte ergeben sind, sowie die den rituellen Handlungen ergebenen, o Bhārata (Nom.Pl.Bahuvrīhi + Vok.)"],["adhyātmayogayuktāś ca dhṛtimantaś ca mānavāḥ","und die dem Adhyātma-Yoga ergebenen, standhaften Menschen (Nom.Pl.Bahuvrīhi)"],["śrutvā parva tv idaṃ nityam avāpsyanti parāṃ gatim","werden, nachdem sie stets dieses Parva vernommen haben, den höchsten Weg erlangen (Absol. + Akk. + Fut. + Akk.)"]]]]},{"num":42,"title_sa":"","title_de":"Vaiśaṃpāyanas Lehre von Karma und Wiederkehr","note":"Vaiśaṃpāyana (im Rahmen der Erzählung an Janamejaya) erklärt philosophisch, wie das Wunder der Wiederkehr der Toten mit der Lehre von Karma, Körper und Selbst zusammenhängt. Rahmen-Dialog (Vaiśaṃpāyana/Janamejaya), nach Konvention unmarkiert.","units":[["001","sūta uvāca etac chrutvā nṛpo vidvān hṛṣṭo 'bhūj janamejayaḥ pitāmahānāṃ sarveṣāṃ gamanāgamanaṃ tadā","Sūta sprach: Als der kundige König Janamejaya dies vernommen hatte, das Kommen und Gehen aller Ahnen, wurde er froh.","",[["sūta uvāca etac chrutvā nṛpo vidvān hṛṣṭo 'bhūj janamejayaḥ","Sūta sprach: als der kundige König Janamejaya dies vernommen hatte, wurde er froh (Nom. + Absol. + Nom. + Perf.)"],["pitāmahānāṃ sarveṣāṃ gamanāgamanaṃ tadā","das Kommen und Gehen aller Ahnen (Gen.Pl. + Akk.)"]]],["002","abravīc ca mudā yuktaḥ punarāgamanaṃ prati kathaṃ nu tyaktadehānāṃ punas tad rūpadarśanam","Und voll Freude sprach er im Hinblick auf die Wiederkehr: Wie geschieht wohl bei denen, die ihren Körper verlassen haben, wiederum jener Anblick in ihrer Gestalt?","",[["abravīc ca mudā yuktaḥ punarāgamanaṃ prati","und voll Freude sprach er im Hinblick auf die Wiederkehr (Perf. + Instr.Bahuvrīhi + Akk.)"],["kathaṃ nu tyaktadehānāṃ punas tad rūpadarśanam","wie geschieht wohl bei denen, die ihren Körper verlassen haben, wiederum jener Anblick in ihrer Gestalt (Gen.Pl.Bahuvrīhi + Nom.)"]]],["003","ity uktaḥ sa dvijaśreṣṭho vyāsaśiṣyaḥ pratāpavān provāca vadatāṃ śreṣṭhas taṃ nṛpaṃ janamejayam","So angesprochen, sprach jener Beste der Zweifachgeborenen, der Schüler des Vyāsa, der Mächtige, der Beste der Redner, zu jenem König Janamejaya:","",[["ity uktaḥ sa dvijaśreṣṭho vyāsaśiṣyaḥ pratāpavān","so angesprochen, jener Beste der Zweifachgeborenen, der Schüler des Vyāsa, der Mächtige (Nom.Part.Perf.Pass. + Nom.)"],["provāca vadatāṃ śreṣṭhas taṃ nṛpaṃ janamejayam","sprach er, der Beste der Redner, zu jenem König Janamejaya (Perf. + Gen.Pl.Part. + Akk.)"]]],["004","avipraṇāśaḥ sarveṣāṃ karmaṇām iti niścayaḥ karmajāni śarīrāṇi tathaivākṛtayo nṛpa","Das Nicht-Verlorengehen aller Taten [Karmas] ist die feststehende Wahrheit, o König; ebenso sind die Körper aus den Taten geboren, wie auch die äußeren Gestalten.","",[["avipraṇāśaḥ sarveṣāṃ karmaṇām iti niścayaḥ","das Nicht-Verlorengehen aller Taten ist die feststehende Wahrheit (Nom. + Gen.Pl. + Nom.)"],["karmajāni śarīrāṇi tathaivākṛtayo nṛpa","ebenso sind die Körper aus den Taten geboren, wie auch die äußeren Gestalten, o König (Nom.Pl. + Nom.Pl. + Vok.)"]]],["005","mahābhūtāni nityāni bhūtādhipatisaṃśrayāt teṣāṃ ca nityasaṃvāso na vināśo viyujyatām","Die großen Elemente sind ewig, durch die Zuflucht beim Herrn der Wesen; und deren ständiges Zusammensein ist kein Vergehen, wenn sie sich trennen.","",[["mahābhūtāni nityāni bhūtādhipatisaṃśrayāt","die großen Elemente sind ewig, durch die Zuflucht beim Herrn der Wesen (Nom.Pl. + Nom.Pl. + Abl.)"],["teṣāṃ ca nityasaṃvāso na vināśo viyujyatām","und deren ständiges Zusammensein ist kein Vergehen bei der Trennung (Gen.Pl. + Nom. + Nom. + Gen.Absol.)"]]],["006","anāśāya kṛtaṃ karma tasya ceṣṭaḥ phalāgamaḥ ātmā caibhiḥ samāyuktaḥ sukhaduḥkham upāśnute","Nicht zum Vergehen bestimmt ist die vollzogene Tat, und deren gewünschtes Ergebnis ist die Frucht; das Selbst, mit diesen verbunden, genießt Glück und Leid.","",[["anāśāya kṛtaṃ karma tasya ceṣṭaḥ phalāgamaḥ","nicht zum Vergehen bestimmt ist die vollzogene Tat, und deren gewünschtes Ergebnis ist die Frucht (Dat. + Nom. + Gen. + Nom.)"],["ātmā caibhiḥ samāyuktaḥ sukhaduḥkham upāśnute","das Selbst, mit diesen verbunden, genießt Glück und Leid (Nom. + Instr.Pl. + Nom.Part. + Akk. + Präs.Med.)"]]],["007","avināśī tathā nityaṃ kṣetrajña iti niścayaḥ bhūtānām ātmabhāvo yo dhruvo 'sau saṃvijānatām","Unvergänglich und ewig ist der Feldkenner [die Seele] - so ist die feststehende Wahrheit; die Wesensnatur der Geschöpfe, die beständig ist, jene mögen die Erkennenden verstehen.","",[["avināśī tathā nityaṃ kṣetrajña iti niścayaḥ","unvergänglich und ewig ist der Feldkenner - so die feststehende Wahrheit (Nom. + Nom. + Nom.)"],["bhūtānām ātmabhāvo yo dhruvo 'sau saṃvijānatām","die Wesensnatur der Geschöpfe, die beständig is
