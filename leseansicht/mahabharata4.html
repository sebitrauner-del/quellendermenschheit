Kunstgriff: Droṇa gab sich ihm gegenüber durch List (chadman) als sein Lehrer aus, um ihn zu Arjunas Nutzen seines Daumens zu berauben - denn mit intaktem Daumen wäre Ekalavya für Götter, Dānavas, Rākṣasas und Schlangenwesen im Kampf unbesiegbar gewesen."},{"term":"Elāpatra","category":"Wesen","definition":"Einer der vornehmsten Nāgas, der als Einziger den Grund für Brahmās Nicht-Verhinderung des Mutter-Fluchs kennt und Vāsuki von der künftigen Rettung durch Āstīka berichtet."},{"term":"Gada","category":"Person","definition":"Ein Bruder Kṛṣṇas, Prinz der Vṛṣṇis."},{"term":"Gaja, Gavākṣa, Carmavat, Ārjava (Sammeleintrag)","category":"Person","definition":"Vier von sechs Söhnen Subalas (Brüder Śakunis und Gāndhārīs, neben Vṛṣaka und Śuka), die in Kap.86 mit ihrer Reiterei gegen Irāvān vorrücken und von diesem getötet werden."},{"term":"Gajasāhvaya","category":"Ort","definition":"‚Die Elefantenstadt' – alter Beiname Hāstinapuras, der Kuru-Hauptstadt (Adh.102)."},{"term":"Gajāhvaya","category":"Ort","definition":"Beiname der Stadt Hastināpura („die zum Elefanten Gerufene“), der Hauptstadt der Kuru-Könige."},{"term":"Gandhakālī","category":"Person","definition":"Beiname Satyavatīs (vor Parāśaras Gnadengabe des Wohlgeruchs auch Matsyagandhā/Kālī genannt), Mutter des Vyāsa und Gemahlin Śaṃtanus (Adh.90)."},{"term":"Gandhamādana","category":"Ort","definition":"Ein Berg, Wohnsitz Kaśyapas in Askese."},{"term":"Gandharva","category":"Begriff","definition":"Klasse himmlischer Wesen, oft als Musiker und Sänger der Götter; auch Ehemänner/Begleiter der Apsaras."},{"term":"Gandharvanagara","category":"Begriff","definition":"Wörtlich „Gandharva-Stadt“: eine trügerische, luftspiegelungsartige Erscheinung (vergleichbar einer Fata Morgana), als Bildvergleich für rasch dahinstürmende Kriegerscharen verwendet (Kap.99)."},{"term":"Gandharven bei Arjunas Geburt","category":"Gruppe","definition":"Die bei Arjunas Geburt singenden Gandharvas (Adh.114 V44-48): Bhīmasena, Ugrasena, Ūrṇāyu, Anagha, Gopati, Dhṛtarāṣṭra (Gandharva, nicht der blinde König), Sūryavarcas, Yugapa, Tṛṇapa, Kārṣṇi, Nandi, Citraratha, Śāliśiras, Parjanya, Kali, Nārada, Sat/Bṛhad, Bṛhaka, Karāla, Brahmacārin, Bahuguṇa, Suparṇa, Viśvāvasu, Bhumanyu, Sucandra, Hāhā und Hūhū, angeführt von Tumburu."},{"term":"Garutmān","category":"Gottheit","definition":"Ein weiteres Epitheton Garuḍas."},{"term":"Garuḍa","category":"Wesen","definition":"Vinatās zweiter Sohn, mächtiger Vogel und „Vernichter der Schlangen“ (pannagasūdana); späterer Reittier Viṣṇus, befreit seine Mutter aus der Dienstbarkeit."},{"term":"Gauramukha","category":"Person","definition":"Wohlgesitteter Schüler Śamīkas, den dieser sendet, um König Parikṣit vor dem Fluch und der bevorstehenden Todesgefahr durch Takṣaka zu warnen."},{"term":"Gautama","category":"Person","definition":"Beiname des Weisen Śaradvat bzw. Bezeichnung seines Sohnes Kṛpa als Nachkomme des Gautama-Geschlechts."},{"term":"Gavalgaṇa","category":"Person","definition":"Vater Saṃjayas."},{"term":"Gavyūti","category":"Konzept","definition":"Ein altes indisches Wegmaß (etwa 4-5 km), in Adh.138 zur Entfernungsangabe verwendet."},{"term":"Gaya","category":"Person","definition":"Legendärer Opferkönig, dessen Opfer als Vergleichsbild angeführt wird."},{"term":"Gayā","category":"Ort","definition":"Eine berühmte heilige Pilgerstätte in Ostindien."},{"term":"Gaṅgā","category":"Ort/Fluss","definition":"Der Ganges, heiligster Fluss Indiens; hier als Grenze des Yayāti/Pūru zugewiesenen Kernlandes genannt, spielt später als Mutter Bhīṣmas eine zentrale Rolle im Epos. Schauplatz des Krokodilangriffs auf Droṇa und Arjunas Rettungstat in Adh.123."},{"term":"Gaṅgādatta","category":"Person","definition":"‚Von Gaṅgā gegeben' – Geburtsname des achten, überlebenden Sohnes Gaṅgās und Śaṃtanus; später als Devavrata bzw. Bhīṣma bekannt (Adh.92); siehe [[Bhīṣma]]."},{"term":"Gaṅgādvāra","category":"Ort","definition":"Ein Ort am Oberlauf der Gaṅgā (,Gaṅgā-Tor'), wo laut Adh.154 der Ṛṣi Bharadvāja lebte; oft mit dem heutigen Haridwar identifiziert."},{"term":"Gaṇeśa","category":"Gottheit","definition":"Der elefantenköpfige Gott; schreibt der Überlieferung nach das von Vyāsa diktierte Mahābhārata nieder."},{"term":"Ghaṭotkaca","category":"Person","definition":"Sohn Bhīmas und der Rākṣasī Hiḍimbā (patronymisch auch Haiḍimba [nach der Mutter] oder Bhaimaseni [nach dem Vater Bhīmasena] genannt); fällt im Krieg durch Karṇas göttlichen Speer. In Kap.131 verliert er seinen Sohn Añjanaparvan im Duell gegen Aśvatthāman und fordert diesen daraufhin selbst heraus; im gewaltigen Illusions- und Astra-Duell wird er schließlich von Aśvatthāmans Pfeil getroffen und fällt, überlebt jedoch, da Dhṛṣṭadyumna ihn rettend fortbringt. In Kapitel 141 fordert er Aśvatthāman mit dem Ruf 'Bleib stehen! Bleib stehen!' heraus und liefert sich mit ihm ein langes Pfeilduell; schließlich wird er von einem schweren Pfeil in die Brust getroffen und sinkt ohnmächtig auf seinen Wagenboden, worauf ihn sein Wagenlenker vom Schlachtfeld fortbringt. In Adh.148 wird er von Kṛṣṇa und Arjuna zum nächtlichen Zweikampf gegen Karṇa entsandt, mit Sātyaki als Rückendecker; er verspricht, niemanden zu verschonen, und tritt Karṇa im Getümmel entgegen, wo ein tosender Kampf beginnt. In Adh.149 tötet er im nächtlichen Kampf Alaṃbala, den rachsüchtigen Sohn des Jaṭāsura, enthauptet ihn und wirft das Haupt auf Duryodhanas Wagen, ehe er sich Karṇa zuwendet. Im nächtlichen Kampf gegen Karṇa (Kap. 150) nahm er zahllose Schreckgestalten an, ließ Feuer aus seinen Augen sprühen und schleuderte die furchtbare, von Rudra geschaffene achträdrige Waffe gegen Karṇa, die dieser jedoch abfing und zurückschickte, wodurch Ghaṭotkacas Illusionszauber schließlich zerbrach. In Kap.152 wird er von Kṛṣṇa zum Schutz seines Vaters Bhīmasena gegen Alāyudha entsandt, nachdem dieser von Karṇa abgelassen und sich stattdessen Bhīma zugewandt hatte. In Kap.153 besiegt und enthauptet er Alāyudha im nächtlichen Zweikampf und wirft dessen Haupt vor Duryodhana; damit erfüllt sich – wie Duryodhana mit Schrecken erkennt – ein weiteres Stück von Bhīmasenas altem Racheschwur gegen die Kaurava-Seite. In Kap.154 stürmt er, nachdem er Alāyudha erschlagen hat, gegen Karṇa vor; im gewaltigen nächtlichen Duell erschafft er eine grausige, göttliche Illusion aus einem Regen unzähliger Waffen, Bäume, Felsblöcke und dämonischer Gestalten, die Duryodhanas Heer in Panik versetzt. Von den Kauravas bedrängt, seine letzte, von Indra für Arjuna vorbestimmte Śakti-Waffe (die Vasavī-Śakti, hier Vaijayantī genannt) gegen den Rākṣasa einzusetzen, schleudert Karṇa sie schließlich gegen Ghaṭotkaca und tötet ihn; sterbend nimmt Ghaṭotkaca eine riesenhafte Gestalt an und begräbt im Fallen eine ganze Akṣauhiṇī des kauravischen Heeres unter seinem Leib - ein letzter, verheerender Sieg im Tod, der zugleich Arjuna vor jener tödlichen Waffe bewahrt."},{"term":"Ghoṣayātrā","desc":"‚Rinderschau-Reise‘ zu den Hirtenlagern - der von Karṇa ersonnene Vorwand für Duryodhanas Expedition zum Dvaitavana-Wald, um die im Exil lebenden Pāṇḍavas in ihrer Erniedrigung zu betrachten; gibt dem gesamten folgenden Erzählabschnitt des Vanaparva seinen Namen."},{"term":"Ghūrṇikā","category":"Person (Nebenfigur)","definition":"Dienerin/Vertraute der Devayānī, die ihren Vater Śukra über den vermeintlichen Tod seiner Tochter im Brunnenvorfall benachrichtigt."},{"term":"Ghṛtācī","category":"Wesen","definition":"Eine Apsaras, Mutter Rurus von Pramati. [Anm.: In Adh.121 zudem mit Droṇas Empfängnis verbunden – der Same Bharadvājas, den ihr Anblick auslöst, wird in einem Gefäß aufgefangen; ein häufiger Apsaras-Name in mehreren Ursprungserzählungen.]"},{"term":"Girikā","category":"Person","definition":"Aus dem Fluss Śuktimatī und dem Berg Kolāhala geborene Gemahlin Uparicara Vasus; Mutter des Fischkönigs Matsya und, über den verirrten Samen und Adrikā, auch Satyavatīs."},{"term":"Girivraja","category":"Ort","definition":"Von Bergen umgebene Hauptstadt Jarāsandhas im Reich Magadha; dort hält Jarāsandha zahlreiche besiegte Könige gefangen."},{"term":"Girīśa","category":"Epitheton","definition":"Berg-Herr - Beiname Śivas."},{"term":"Godāvarī","desc":"Bedeutender, meerwärts fließender Fluss, von den Pāṇḍavas auf ihrer Pilgerfahrt aufgesucht."},{"term":"Gokarṇa","category":"Ort","definition":"Ein bekannter Wallfahrtsort."},{"term":"Gopati","category":"Person","definition":"Vater des Pāñcālya-Kriegers Siṃhasena (Droṇaparva Kap.22) — nicht zu verwechseln mit dem gleichnamigen Siṃhasena aus Kap.15."},{"term":"Gopāla","category":"Volk/Gruppe","definition":"'Hirten'; in Droṇaparva Kap.17 zusammen mit den Nārāyaṇa-Kriegern unter den Saṃśaptakas genannt, die sich zum Kampf auf Leben und Tod entschließen."},{"term":"Govinda","category":"Gottheit","definition":"Epitheton Viṣṇus („Finder der Erde/Kuh“), hier volksetymologisch mit seiner Rettung der Erde als Varāha (Eber-Avatar) verknüpft."},{"term":"Graha (Ergreifer)","desc":"Klasse besitznehmender, oft kinderbefallender Geistwesen (Skanda-Grahas bis 16 Jahre; Deva-, Pitṛ-, Siddha-, Rākṣasa-, Gandharva-, Yakṣa- und Piśāca-Graha danach bis 70 Jahre), deren Katalog in Vanaparva Kap.219 grundlegend dargestellt wird - ein früher Beleg der späteren Ayurveda-Kinderheilkunde und Dämonologie."},{"term":"Granthika","category":"Person","definition":"Nakulas Deckname als Pferdeknecht am Hof Virāṭas."},{"term":"Grāha","category":"Wesen","definition":"Krokodil bzw. großes Wasserungeheuer; ergreift Droṇa beim Bad in der Gaṅgā am Bein, wird von Arjuna getötet (Adh.123)."},{"term":"Guha","category":"Gottheit","definition":"Auch Skanda genannt; Kriegsgott, Sohn Rudras/Śivas und (nach einer Tradition) der Gaṅgā bzw. der Kṛttikās; von Duryodhana in Adh.127 als Beispiel rätselhafter göttlicher Herkunft angeführt."},{"term":"Guhyaka","category":"Gruppe","definition":"Klasse halbgöttlicher Wesen (Diener Kuberas), die zusammen mit den Cāraṇas Pāṇḍus Familie nach Hāstinapura geleiten (Adh.117)."},{"term":"Guḍākeśa","category":"Person","definition":"Beiname Arjunas, wörtlich etwa Herr über den Schlaf, wegen seiner Selbstbeherrschung."},{"term":"Guṇa (Rajas, Sattva, Tamas)","desc":"Die drei Grundqualitäten der Natur (prakṛti) in der Sāṃkhya-Philosophie: Sattva (Reinheit/Klarheit), Rajas (Leidenschaft/Aktivität) und Tamas (Trägheit/Dunkelheit); zusammen mit den Elementen, Sinnen und dem Denkapparat bilden sie die manifeste und unmanifeste Wesensmenge der Schöpfung."},{"term":"Göttliche Waffen des Prajāpati (Kap.116)","category":"Konzept","definition":"In Kap.116 von Bhīṣma aufgezählte Reihe divyāni astrāṇi ('göttliche Waffen'): āgneya (Feuer-), vāruṇa (Varuṇa-), saumya (Soma-/Mond-), vāyavya (Wind-), vaiṣṇava (Viṣṇu-), aindra (Indra-), pāśupata, brāhma und pārameṣṭhya, dazu Waffen des Prajāpati, des Dhātṛ, des Tvaṣṭṛ und des Savitṛ; Bhīṣma erklärt, nur Arjuna und Kṛṣṇa kennten sie alle in der Welt der Menschen."},{"term":"Gādhi","category":"Person","definition":"König von Kānyakubja, Vater Viśvāmitras."},{"term":"Gālava","category":"Person","definition":"Ein großer Ṛṣi, Schüler Viśvāmitras; Held einer bekannten Nebenerzählung im Āraṇyakaparva über eine schwierige Lehrergabe."},{"term":"Gāndhāra","category":"Ort","definition":"Königreich im Nordwesten (Raum des heutigen Kandahar/Peschawar), Heimat Gāndhārīs und Śakunis, regiert von König Subala (Adh.103)."},{"term":"Gāndhārī","category":"Person","definition":"Gemahlin des Dhṛtarāṣṭra, Mutter der hundert Kauravas. In Adhyāya 61 (Aṃśāvataraṇa) als 'Mati, Tochter Subalas' bezeichnet."},{"term":"Gāruḍa","category":"Militär","definition":"Nach Garuḍa benannte taktische Heeresformation (Vyūha); in Kap.40 von Abhimanyu unter den rechtmäßigen Formationen rechtschaffener Könige genannt, im Gegensatz zur Cakra-Vyūha-Formation."},{"term":"Gāṅgeya","category":"Beiname","definition":"'Sohn der Gaṅgā', Beiname Bhīṣmas, dessen Mutter die Flussgöttin Gaṅgā war."},{"term":"Gāṇḍīva","category":"Sache","definition":"Arjunas berühmter, von Agni geschenkter Bogen, samt zwei unerschöpflichen Köchern und einem Streitwagen."},{"term":"Gṛhastha","category":"Konzept","definition":"Der Hausvater, die zweite Lebensstufe (āśrama): Ehe, Gastfreundschaft und rechtmäßiger Erwerb bestimmen sein Leben."},{"term":"Haihaya","category":"Volk","definition":"Kriegerisches Volk unter dem tausendarmigen König Kārtavīryārjuna, von Paraśurāma zur Rache für dessen Vater Jamadagni vernichtet (Adh.98)."},{"term":"Haladhara","category":"Person","definition":"Beiname Balarāmas, wörtlich der Pflugträger."},{"term":"Halāyudha","category":"Epitheton","definition":"‚Pflugbewaffneter' – Beiname Balarāmas (Balabhadra), Kṛṣṇas älterem Bruder."},{"term":"Hanumant","desc":"Sohn des Windgottes, Minister Sugrīvas, klug und stark; vermittelt das Bündnis zwischen Rāma und Sugrīva."},{"term":"Hanumān","category":"Person","definition":"Affengestaltiger Sohn des Windgottes Vāyu, von gewaltiger Kraft; begegnet Bhīma im Āraṇyakaparva."},{"term":"Hara","category":"Gottheit","definition":"Beiname Śivas („der Entraffer/Zerstörer“); in Kap.41 verwendet, als er Jayadratha im Traum erscheint."},{"term":"Hari","category":"Gottheit","definition":"Beiname Viṣṇus."},{"term":"Harimedhas","category":"Person","definition":"Legendärer Opferkönig, dessen Opfer als Vergleichsbild für Janamejayas Sarpasatra angeführt wird."},{"term":"Hariścandra","category":"Person","definition":"Berühmter Königsseher der Sonnendynastie, durch sein glanzvolles Rājasūya-Opfer beständiger Gefährte Indras in dessen Halle; später (im Vanaparva) Held der Legende von seiner unbedingten Wahrheitstreue."},{"term":"Hastin","category":"Person (König)","definition":"Sohn Suhotras, Gründer der Stadt Hāstinapura, nach ihm benannt (Adh.90)."},{"term":"Hayaśiras","category":"Mythologem","definition":"Das ,Pferdehaupt'-Feuer (auch Vāḍavāgni/Vāḍavāmukha) – Aurvas Zornesfeuer, das ins Meer entlassen wurde und dort seither die Wasser verzehrt (Adh.171)."},{"term":"Haṃsa","category":"Militär","definition":"„Schwan“ — Name einer traditionellen, nach dem Schwan benannten taktischen Heeresformation (Vyūha); in Kap.40 von Abhimanyu unter den rechtmäßigen Formationen rechtschaffener Könige genannt, im Gegensatz zur Cakra-Vyūha-Formation."},{"term":"Haṃsa und Ḍibhaka","category":"Person/Gruppe","definition":"Zwei mit Jarāsandha verbündete, überaus starke Krieger; ihr vermeintlicher gegenseitiger Tod (jeder ertränkt sich, als er vom - falschen - Tod des anderen hört) zwang Jarāsandha zum vorübergehenden Rückzug."},{"term":"Haṃsakūṭa","category":"Ort","definition":"Bergspitze im Himālaya, von Pāṇḍu auf dem Weg zum Śataśṛṅga überschritten (Adh.110)."},{"term":"Haṃsapada","category":"Volk","definition":"Volk, das in Droṇaparva Kap.19 im Hals der von Droṇa gebildeten Garuḍa-Heeresformation genannt wird."},{"term":"Himavat","category":"Ort","definition":"Der Himalaya-Gebirgszug, personifiziert als Berggott gedacht; Schauplatz zahlreicher Askese- und Götterepisoden, hier Geburtsort Śakuntalās."},{"term":"Himavat / Himālaya","category":"Ort","definition":"Das Himālaya-Gebirge; traditioneller Ort von Vyāsas Askese und der Komposition des Mahābhārata."},{"term":"Hiraṇvatī","category":"Ort","definition":"Fluss, an dessen Ufer bei Kurukṣetra die dreijährige Schlacht zwischen Citrāṅgada und dem namensgleichen Gandharva-König stattfand (Adh.95)."},{"term":"Hiraṇyabindu","category":"Ort","definition":"Eine heilige Pilgerstätte (Tīrtha), die Arjuna besucht."},{"term":"Hiraṇyadhanus","category":"Person","definition":"Niṣāda-König, Vater Ekalavyas (Adh.123)."},{"term":"Hiraṇyakaśipu","category":"Wesen","definition":"Einziger überlieferter Sohn der Diti; Vater Prahrādas und dessen Brüder."},{"term":"Hiraṇyapura","desc":"Die im Luftraum schwebende, uneinnehmbare Dämonenstadt der Kālakeyas und Paulomas, von Arjuna mit der Raudra-Waffe vernichtet."},{"term":"Hiḍimba","category":"Wesen","definition":"Ein Rākṣasa, von Bhīmasena in einem großen Wald erschlagen; Bruder der Hiḍimbā, die später Bhīmas Gattin und Mutter Ghaṭotkacas wird. Gerät in Adh.140 in Zorn, als er seine Schwester Hiḍimbā in menschlicher Gestalt und offenbar in Bhīma verliebt vorfindet, und will beide töten. Wird in Adh.142 von Bhīma im Zweikampf zermalmt, mit den Armen erdrosselt und entzweigebrochen."},{"term":"Hiḍimbā","category":"Wesen","definition":"Rākṣasī, Schwester des von Bhīma erschlagenen Hiḍimba; wird Bhīmas Gattin und Mutter Ghaṭotkacas. Bleibt nach dem Tod ihres Bruders Hiḍimba (Adh.142) bei den Pāṇḍavas und zieht mit ihnen weiter. Heiratet Bhīma mit Yudhiṣṭhiras Erlaubnis (tags bei ihr, nachts bei den Pāṇḍavas), gebiert Ghaṭotkaca und kehrt nach Ablauf der vereinbarten Zeit in ihr eigenes Reich zurück (Adh.143)."},{"term":"Hāstinapura","category":"Ort","definition":"Hauptstadt der Kuru-Dynastie, gegründet von König Hastin (Adh.90). Auch Nāgasāhvaya oder Gajasāhvaya genannt (‚die nach dem Elefanten Benannte', Adh.122)."},{"term":"Hṛdika","category":"Person","definition":"Vater des Kṛtavarman."},{"term":"Hṛṣīkeśa","category":"Gottheit","definition":"„Herr der Sinne“ – Beiname Viṣṇus/Kṛṣṇas."},{"term":"Ikṣvāku","category":"Person/Dynastie","definition":"Urahn der Ikṣvāku-Dynastie (u. a. Rāmas Geschlecht im Rāmāyaṇa)."},{"term":"Ilina","category":"Person (König)","definition":"Sohn des Taṃsu, Vater Duḥṣantas und seiner vier Brüder (Adh.89)."},{"term":"Ilvala","desc":"Daitya-Fürst von Maṇimatī, Bruder Vātāpis; ließ Brahmanen durch die Vātāpi-Ziegenbock-List töten, bis Agastya Vātāpi im Magen verdaute und so das Muster durchbrach."},{"term":"Ilā","category":"Person","definition":"Tochter (in manchen Überlieferungen zugleich Sohn) Manus, Mutter UND Vater des Purūravas laut Adhyāya 70 (Anspielung auf einen Geschlechtswandel-Mythos)."},{"term":"Indra","category":"Gottheit","definition":"König der Götter; drückt beim Samudra-Manthana die Bergspitze nieder und löscht später das entstandene Feuer mit Wolkenregen. Auch unter dem Namen Śakra bekannt. Auch unter dem Namen Puraṃdara bekannt."},{"term":"Indra / Śakra","category":"Gottheit","definition":"Götterkönig, Herrscher des Himmels (Svarga); Vater Arjunas."},{"term":"Indradyumna","desc":"Ein königlicher Weiser, der wegen erloschenen Ruhmes aus dem Himmel stürzt und durch die Erinnerung dreier langlebiger Tiere – der Eule Prākārakarṇa (= Mārkaṇḍeya), des Kranichs Nāḍījaṅgha und der Schildkröte Akūpāra – wieder in den Himmel zurückgeführt wird (Vanaparva)."},{"term":"Indradyumnasaras","category":"Ort","definition":"See im Himālaya-Gebiet auf Pāṇḍus Weg zum Śataśṛṅga (Adh.110)."},{"term":"Indrajit","desc":"Sohn Rāvaṇas, mächtiger Krieger, Gegner Lakṣmaṇas im Kampf um Laṅkā."},{"term":"Indrakīla","category":"Ort","note":"Ein Berg im Himālaya, an dem Arjuna auf seiner Suche nach göttlichen Waffen haltmacht und zunächst Indra in Asketengestalt, später Śiva begegnet."},{"term":"Indraprastha","category":"Ort","definition":"Die von den Pāṇḍavas im Waldgebiet Khāṇḍavaprastha gegründete Hauptstadt ihres Reichshälfte."},{"term":"Indrasena","category":"Person","note":"Sohn Nalas und Damayantīs."},{"term":"Indrasenā","category":"Person","note":"Tochter Nalas und Damayantīs."},{"term":"Indrāṇī","category":"Person","definition":"Die Gattin des Gottes Indra."},{"term":"Irāvant","category":"Person","definition":"Sohn Arjunas (mit der Nāgī Ulūpī), steht in Kap.52 nahe Abhimanyu in der Pāṇḍava-Formation."},{"term":"Irāvān","category":"Person","definition":"Sohn Arjunas (von der Nāgī Ulūpī), kämpft in Kap.43 gegen Śrutāyus."},{"term":"Iṣīkā","category":"Konzept","definition":"Grashalm bzw. Schilfhalm; Droṇa demonstriert in Adh.122 seine Waffenkunst, indem er mit einem astra-verzauberten Iṣīkā-Halm einen in einen Brunnen gefallenen Ball durch eine Kette weiterer Halme heraufholt."},{"term":"Jahnu","category":"Person (König)","definition":"Sohn Ajamīḍhas (über Keśinī), Ahnherr der Kuśikas; später u.a. mit der Gaṅgā-Erzählung verbunden (Adh.89)."},{"term":"Jaimini","category":"Person","definition":"Ein Schüler des Vyāsa, Begründer der Mīmāṃsā-Schule und einer Sāmaveda-Rezension."},{"term":"Jamadagni","category":"Person","definition":"Sohn Ṛcīkas, Enkel Aurvas, Vater Paraśurāmas (Rāma) und dreier weiterer Söhne."},{"term":"Jambha","category":"Person","definition":"Ein Asura (Dämon), der von Kṛṣṇa erschlagen wurde; in Droṇaparva Kap.10 in Dhṛtarāṣṭras Katalog von Kṛṣṇas Heldentaten genannt."},{"term":"Janaka","category":"Person","definition":"König von Mithilā, bekannt für seine Weisheit und seinen selbstlosen Rājadharma; Vater der Sītā im Rāmāyaṇa."},{"term":"Janamejaya","category":"Person","definition":"Urenkel Arjunas, Sohn des Parikṣit; König, an dessen Schlangenopfer (sarpasattra) das Mahābhārata durch Vaiśampāyana vorgetragen wurde. In Adh.89 tragen zudem zwei weitere, viel frühere Vorfahren in der Paurava-Genealogie (ein Sohn Kurus sowie ein Sohn des jüngeren Parikṣit) ebenfalls den Namen Janamejaya – Namensvetter, nicht identisch mit dem Rahmenerzählung-König. In Droṇaparva Kap.22 zudem ein Pāñcālya-Krieger gleichen Namens, 'Tiger unter den Männern der Pāñcālas' genannt — ein weiterer Namensvetter, nicht identisch mit dem Rahmenerzählung-König."},{"term":"Janasthāna","desc":"Siedlung der Rākṣasas im Daṇḍaka-Wald, Wohnort Kharas, an der die Feindschaft zwischen Rāma und Śūrpaṇakhā entsteht."},{"term":"Jantu","desc":"Einziger Sohn König Somakas, geboren nach langer Kinderlosigkeit; wird zentrale Figur eines Opfers, durch das dem König hundert Söhne beschieden werden sollen."},{"term":"Janārdana","category":"Epitheton","definition":"‚Menschenbedränger'/,Menschenerlöser' – weiterer Beiname Kṛṣṇa-Vāsudevas."},{"term":"Jaratkāru","category":"Person","definition":"Asket (männlich); erblickt seine Ahnen kopfüber in einer Grube hängend und heiratet aus Pflichtgefühl die gleichnamige Schlangen-Prinzessin Jaratkārū; Vater Āstīkas."},{"term":"Jaratkārū","category":"Person","definition":"Schwester des Nāga-Königs Vāsuki, dem Weisen Jaratkāru zur Frau gegeben; Mutter Āstīkas. Namensgleich mit ihrem Gatten."},{"term":"Jaritā","category":"Person","definition":"Eine Śārṅgikā-Vogelhenne, von Mandapāla verlassene Mutter der vier Śārṅgaka-Söhne, die sie allein im Khāṇḍava-Wald aufzieht."},{"term":"Jaritāri","category":"Person","definition":"Der älteste der vier Śārṅgaka-Söhne Mandapālas und Jaritās."},{"term":"Jarā","category":"Person","definition":"Menschenfressende Rākṣasī, die die beiden ausgesetzten, unvollständigen Körperhälften des neugeborenen Jarāsandha zufällig zu einem lebenden Kind zusammenfügte und ihm dadurch seinen Namen ('von Jarā zusammengefügt') gab."},{"term":"Jarāsandha","category":"Person","definition":"Mächtiger König von Magadha, von Bhīma im Zweikampf getötet. Nach Adhyāya 61 die irdische Wiedergeburt des Dānava-Fürsten Vipracitti (Aṃśāvataraṇa)."},{"term":"Jaya","category":"Sache","definition":"„Sieg“ – der älteste überlieferte Titel des Mahābhārata, aus dem sich das Werk der Überlieferung nach zum größeren 'Bhārata' und schließlich 'Mahābhārata' erweitert haben soll. In Droṇaparva Kap.24 zudem Name zweier verschiedener Krieger: eines Sohnes Dhṛtarāṣṭras sowie eines von diesem im Zweikampf aufgehaltenen Pāṇḍava-seitigen Gegners gleichen Namens — beide Namensvetter, nicht identisch mit dem hier verzeichneten Werktitel. Stirbt in Kap.110 zusammen mit vier Brüdern (Durmarṣaṇa, Duḥsaha, Durmada, Durdhara) im Angriff auf den siegreichen Bhīma."},{"term":"Jayadratha","category":"Person","definition":"König des Sindhu-Landes, Schwager Duryodhanas; von Arjuna wegen seiner Beteiligung an Abhimanyus Tod getötet. Auch Saindhava (‚der Sindhu-König‘) genannt. In Kap.42 auch ‚Sindhurāja‘ (‚König von Sindhu‘) genannt. In Kap.121 von sechs Wagenkämpfern beschützt; da die Sonne noch nicht untergegangen ist, täuscht Kṛṣṇa mittels seines Sudarśana-Diskus künstliche Finsternis als Sonnenuntergang vor, woraufhin Arjuna ihn im Moment der Unachtsamkeit enthauptet und so seinen Schwur erfüllt. Da einst seinem Vater Vṛddhakṣatra verheißen worden war, dass, wer dessen Sohnes Haupt zu Boden fallen lasse, dessen eigenes Haupt sich in hundert Teile spalten werde, trägt Arjuna das abgeschlagene Haupt mit einem Pfeil fort und lässt es in Vṛddhakṣatras Schoß fallen, der es selbst zu Boden fallen lässt und so unwissentlich sein eigenes Verhängnis erfüllt."},{"term":"Jayatsena","category":"Person","definition":"König der Māgadhas, Verbündeter der Kauravas; greift im Kampf um Bhīṣma auf der Seite Droṇas ein, wird aber zurückgeschlagen."},{"term":"Jaṭilā","category":"Person","definition":"Eine Gautamī (Angehörige des Gautama-Geschlechts) aus der alten Überlieferung, die laut Adh.188 sieben Ṛṣis zugleich als Gattin diente – Präzedenzfall für Draupadīs Vielehe."},{"term":"Jaṭāsura","desc":"Ein Rākṣasa, der sich als kundiger Brahmane getarnt unter die Pāṇḍavas mischt, um eine Gelegenheit zum Raub ihrer Waffen und Draupadīs abzupassen; wird von Bhīma in einem gewaltigen Ringkampf erschlagen. In Droṇaparva Adh.149 tritt sein Sohn Alaṃbala auf, um seinen Tod zu rächen."},{"term":"Jaṭāyu","desc":"Geiergestaltiger Freund Daśarathas, der bei dem Versuch, Sītā vor der Entführung durch Rāvaṇa zu retten, getötet wird."},{"term":"Jaṭāyus","category":"Wesen","definition":"Sohn Aruṇas und der Śyenī, Bruder des Sampāti; aus dem Rāmāyaṇa als Sītās Beschützer bekannter Geierkönig."},{"term":"Jinavatī","category":"Person","definition":"Tochter des Königs Uśīnara, menschliche Freundin der Gattin des Vasu Dyaus; um ihretwillen wird Vasiṣṭhas Kuh geraubt (Adh.93)."},{"term":"Jiṣṇu","category":"Beiname","definition":"'Der Siegreiche' - ein häufiger Beiname Arjunas."},{"term":"Jāhnavī","category":"Epitheton","definition":"Beiname der Gaṅgā ('Tochter des Jahnu'); Bhīṣma wird in Kap.115 entsprechend als 'jāhnavīputra' ('Sohn der Jāhnavī') bezeichnet."},{"term":"Jāmbavatī","expl":"Eine der Hauptgattinnen Kṛṣṇas, Tochter des Bärenkönigs Jāmbavant; Mutter Sāmbas."},{"term":"Jāmbūnada","category":"Begriff","definition":"Bezeichnung für Gold, benannt nach dem mythischen Fluss Jambū."},{"term":"Jātavedas","category":"Gottheit","definition":"Epitheton Agnis, des Feuergottes, wörtlich etwa „der alles Geschaffene Kennende“; hier als Zeuge der Wahrheit befragt."},{"term":"Jīmūta","category":"Person","definition":"Weltberühmter Ringkämpfer am Hof Virāṭas, von Bhīma (als Ballava) im Wettkampf getötet - ein erster Vorgeschmack auf Bhīmas spätere Bezwingung Kīcakas."},{"term":"Jīvala","desc":"Gehilfe König Ṛtuparṇas; fragt den als Bāhuka verkleideten Nala nach dem Grund seiner nächtlichen Klage."},{"term":"Kabandha","desc":"Rumpfförmiges, armloses Ungeheuer mit einem Auge auf der Brust, das Rāma und Lakṣmaṇa im Wald angreift; entpuppt sich als der verfluchte Gandharva Viśvāvasu."},{"term":"Kaca","category":"Person","definition":"Ältester Sohn Bṛhaspatis, wird von den Göttern zu Śukra gesandt, um die Wiederbelebungskunst (Saṃjīvanī) zu erlernen; von den Dānavas dreimal getötet, zuletzt aus Śukras Leib heraus wiederbelebt und selbst zum Träger des Wissens gemacht. Weist später Devayānīs Liebeswerbung zurück (spätere Adhyāyas)."},{"term":"Kadrū","category":"Person","definition":"Tochter Dakṣas, Gattin Kaśyapas, Mutter der tausend Nāgas (Schlangen); gewinnt die Wette um Uccaiḥśravas' Farbe und versklavt dadurch zeitweise ihre Schwester Vinatā."},{"term":"Kahoḍa","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Kaikeya","category":"Volk/Verbündete","note":"Ein Volk bzw. Fürstengeschlecht, verbündet mit den Pāṇḍavas."},{"term":"Kaikeyī","desc":"Zweite Gemahlin Daśarathas, Mutter Bharatas, im Rāmāyaṇa Auslöserin von Rāmas Exil."},{"term":"Kailāsa","category":"Ort","definition":"Der Berg Kailāsa, mythischer Wohnsitz Śivas und Kuveras; in Adh.134 als Vergleich für den Eintritt ins Lākṣāgṛha herangezogen."},{"term":"Kaiśika","category":"Sache","definition":"Bezeichnung einer akrobatischen Kampftechnik/Bewegungsart (kaiśika-Weg u.ä.), die Abhimanyu in Kap.47 bei seinem waffenlosen Luftkampf mit Schwert und Schild anwendet."},{"term":"Kali","category":"Person/Dämon","note":"Personifikation des Zeitalters Kaliyuga und der Zwietracht; verflucht und besitzt Nala, wodurch dessen Untergang beginnt. Nicht zu verwechseln mit der Göttin Kālī."},{"term":"Kaliṅga","category":"Ort","definition":"Ein Land an der Ostküste Indiens, Teil von Arjunas Pilgerreise."},{"term":"Kalki","desc":"Kalki Viṣṇuyaśas: der im Kaliyuga-Verfall prophezeite künftige Brahmane und Weltenherrscher (Cakravartin), der die Mleccha-Horden vernichten und das Kṛtayuga wieder heraufführen wird (Vanaparva, Mārkaṇḍeya-Prophezeiung)."},{"term":"Kalmāṣapāda","category":"Person","definition":"Ikṣvāku-König (auch Mitrasaha genannt); wird von Śakti, Vasiṣṭhas Sohn, zum Menschenfresser verflucht, nachdem er ihn geschlagen hatte; tötet unter Rākṣasa-Besessenheit Śakti und dessen 99 Brüder."},{"term":"Kamboja","category":"Volk/Land","definition":"Ein Volk bzw. Reich im Nordwesten Indiens; sein König Sudakṣiṇa kämpft in Kap.104 als einer der Krieger, vor denen Arjuna Śikhaṇḍin zu schützen verspricht."},{"term":"Kandarpa","category":"Person","definition":"Beiname des Liebesgottes Kāma."},{"term":"Kanyakubja","desc":"Berühmte alte Stadt (heute Kanauj); mit Viśvāmitras Erhebung zum Brahmanen verbunden."},{"term":"Kapidhvaja","category":"Beiname","definition":"'Der Affenbanner-Träger', Beiname Arjunas nach dem Affenbild (Hanumān) auf seinem Wagenbanner."},{"term":"Kapila","category":"Gott/Avatar","note":"Ein Erscheinungsbild Viṣṇus; vernichtete einst mit seinem bloßen Blick die Söhne König Sagaras, die bei der Suche nach dem geraubten Opferpferd die Unterwelt aufgruben."},{"term":"Karakarṣa","category":"Person","definition":"Ein Krieger auf Pāṇḍava-Seite, zusammen mit Dhṛṣṭaketu Wächter des rechten Flügels der Makara-Heeresformation in Kap.71."},{"term":"Karkoṭaka","desc":"Ein Schlangenkönig (Nāgarāja), von einem Brahmarṣi verflucht, unbeweglich zu bleiben; von Nala aus einem Waldbrand gerettet. Sein Biss entstellt Nala und quält den in ihm verborgenen Kali."},{"term":"Karūṣa","category":"Sache","definition":"Königreich/Kriegervolk, in Kap.45 zusammen mit Cedis, Kāśis und Pāñcālas als Gebiet genannt, in dem Bhīṣmas Feldzeichen zu sehen war."},{"term":"Karṇa","category":"Person","definition":"Sohn der jungfräulichen Kuntī (Pṛthā) und des Sonnengottes Sūrya, mit angeborener Rüstung und Ohrringen geboren, von Kuntī ausgesetzt und vom Wagenlenker Adhiratha und dessen Frau Rādhā als Vasuṣeṇa aufgezogen. Schenkt Indra, als Brahmane verkleidet, seine Rüstung und Ohrringe und erhält dafür einen unfehlbaren Einmal-Speer; seither auch ‚Vaikartana Karṇa‘ genannt (Adh.104). Kämpft später auf Seiten der Kauravas. Nach Adhyāya 61 ein unübertrefflicher Anteil des Sonnengottes Sūrya/Divākara (Aṃśāvataraṇa). Auch Rādheya (‚Sohn der Rādhā‘) oder Sūtaputra genannt. Wird in Adh.122 Droṇas Schüler, wetteifert von Anfang an mit Arjuna und schließt sich aus Verachtung für die Pāṇḍavas Duryodhana an. Ausführlicher Auftritt in Adh.126: wiederholt Arjunas Waffenschau, fordert ihn zum Zweikampf, wird von Kṛpa nach seiner Herkunft gefragt und beschämt zum Schweigen gebracht; Duryodhana weiht ihn daraufhin zum König von Aṅga (auch Vṛṣa genannt) und schließt mit ihm lebenslange Freundschaft. Wird in Adh.127 von Bhīma wegen seiner Sūta-Herkunft verhöhnt, von Duryodhana jedoch entschieden verteidigt; erntet am Ende von Yudhiṣṭhira selbst die Anerkennung als unübertroffener Bogenschütze. Wird in Adh.143 als künftiger Gegner benannt, dessen Śakti-Speer laut Vorausdeutung nicht Arjuna, sondern Ghaṭotkaca töten wird. In Kap.31 auch ‚Ādhirathi‘ (‚Sohn des Adhiratha‘) genannt. In Kap.120 von Duryodhana beauftragt, Saindhava bis Sonnenuntergang zu schützen; liefert sich mit Arjuna einen gewaltigen, wechselseitigen Zweikampf voller Spott und Pfeilüberdeckungen, wird schließlich seiner Rosse und seines Wagenlenkers beraubt und von Aśvatthāman auf dessen eigenen Wagen gerettet. In Kap.122 liefert er sich, um den Tod des Bhūriśravas und Jalasaṃdha grollend, einen gewaltigen Zweikampf mit Sātyaki und wird von diesem wagenlos gemacht; zieht sich daraufhin auf Duryodhanas Wagen zurück und besteigt später einen eigens neu gefertigten Wagen. Wird in Kap.123 von Bhīmasena beschimpft (klagt bei Arjuna darüber) und von Arjuna in einer öffentlichen Zornesrede scharf gescholten, der ihm zugleich Vṛṣasenas und seinen eigenen Tod schwört. Weist in Kap.127 Duryodhanas Vorwurf zurück, Droṇa habe Arjuna absichtlich durch die Schlachtordnung gelassen: Arjunas Überlegenheit erkläre sich aus dessen eigener Kraft, Ausrüstung und Kṛṣṇas Beistand sowie aus Droṇas hohem Alter, nicht aus Nachsicht; letztlich unterliege alles Geschehen dem Schicksal (daiva), das menschliche Anstrengung immer wieder zunichtemache - wie schon bei den früheren Anschlägen auf die Pāṇḍavas geschehen -, und mahnt Duryodhana dennoch zum unbeirrten Weiterkämpfen. In Kapitel 130 greift er zusammen mit seinen Brüdern Bhīmasena an, um die Tötung des Kaliṅga-Prinzen zu rächen, muss aber miterleben, wie sein Bruder Druma von Bhīmasena zermalmt wird; sein geschleuderter goldener Speer wird von Bhīma aufgefangen und zurückgeworfen. In Kap.133 liefert er sich mit Kṛpa einen scharfen Wortwechsel: er verspricht großspurig, alle Pāṇḍavas samt Kṛṣṇa und Arjuna zu besiegen, kündigt an, Arjuna mit dem von Indra erhaltenen unfehlbaren Speer (der späteren Vasavī-Śakti) zu töten, und zählt Kṛpa gegenüber eine lange Liste bereits gefallener Krieger beider Seiten als Beleg dafür auf, dass der Kampfausgang letztlich vom Schicksal abhänge. In Kap.134 hält er allein einem massiven Ansturm der Pāṇḍavas und Pāñcālas stand und richtet unter ihnen ein Blutbad an; im direkten Duell mit Arjuna wird ihm der Bogen zerschlagen, werden seine Pferde getötet und sein Wagenlenker enthauptet, sodass er auf Kṛpas Wagen flüchten muss. In Kapitel 142 besiegt er im Zweikampf Sahadeva vollständig - zerschlägt dessen Bögen, tötet Pferde und Wagenlenker und zerstört sogar die von Sahadeva im Verzweiflungskampf geschleuderten Wagenteile und Gegenstände -, verschont ihn jedoch, da er sich an sein Kuntī gegebenes Versprechen erinnert, und schickt ihn stattdessen mit spöttischen Worten fort, zu Arjuna oder nach Hause zu gehen. In Kap.145 zerschlägt er im nächtlichen Kampf einen gegen Droṇa gerichteten todbringenden Pfeil Dhṛṣṭadyumnas, liefert sich anschließend ein Pfeilduell mit Dhṛṣṭadyumna und danach mit Sātyaki, in dessen Verlauf sein Sohn Vṛṣasena von Sātyaki schwer verwundet wird; rät danach Duryodhana, angesichts des von Ferne hörbaren Gāṇḍīva-Getöses eiligst eine starke Streitmacht gegen Sātyaki zu entsenden, um so indirekt auch Arjuna vom eigentlichen Kampfgeschehen fernzuhalten. In Kap.147 wird er zusammen mit Droṇa von Duryodhanas Vorwurfsrede zum Zorn angestachelt; beide richten daraufhin ein vernichtendes nächtliches Gemetzel unter dem fliehenden Pāṇḍava-Heer an. Karṇa richtet sein Augenmerk zudem gezielt auf einen Angriff gegen Dhṛṣṭadyumnas Wagen. In Adh.148 gewinnt er das nächtliche Duell mit Dhṛṣṭadyumna, richtet unter den fliehenden Pāñcālas ein furchtbares Gemetzel an und wird daraufhin von Kṛṣṇa auf Yudhiṣṭhiras und Arjunas Drängen hin zunächst Ghaṭotkaca, dem Sohn Bhīmas, als nächtlicher Gegner zugewiesen. In Adh.149 wird er von Duryodhana zunächst durch Duḥśāsana bewacht, während Alaṃbala, der Sohn des Jaṭāsura, gegen Ghaṭotkaca entsandt wird; nach dessen Tod durch Ghaṭotkaca beginnt zwischen den beiden ein erbitterter nächtlicher Kampf. Im nächtlichen Kampf gegen Ghaṭotkaca (Kap. 150) hielt er dessen illusionsreichen Ansturm stand und fing sogar die von Ghaṭotkaca geschleuderte achträdrige, von Rudra gefertigte Waffe ab und schickte sie zurück, wodurch er dessen Illusionswagen zerstörte. In Kap.154 liefert er sich, während Ghaṭotkaca sich Alāyudha zuwendet, ein gewaltiges nächtliches Duell mit dem Rākṣasa; als dieser eine schreckliche, göttliche Illusion aus einem Regen unzähliger Waffen entfesselt und das kauravische Heer in Panik gerät, wird Karṇa von den verzweifelten Kauravas gedrängt, seine für Arjuna aufbewahrte, von Indra im Tausch gegen Rüstung und Ohrringe erhaltene unfehlbare Śakti gegen den Rākṣasa einzusetzen. Er tut es und tötet Ghaṭotkaca damit endgültig - verliert dadurch aber die einzige Waffe, die sicher auch Arjuna hätte töten können."},{"term":"Kaumodakī","category":"Sache","definition":"Der Name der Keule Kṛṣṇas, ein Geschenk Varuṇas."},{"term":"Kaunteya","category":"Person","definition":"Beiname der Söhne Kuntīs (Yudhiṣṭhira, Bhīma, Arjuna)."},{"term":"Kaurava","category":"Person","definition":"Die hundert Söhne des Dhṛtarāṣṭra unter Führung Duryodhanas; Gegenspieler der Pāṇḍavas."},{"term":"Kaurava-Brüder","category":"Gruppe","definition":"Die hundert Söhne Dhṛtarāṣṭras (angeführt von Duryodhana, Yuyutsu als Halbbruder nicht mitgezählt) und ihre Schwester Duḥśalā, in Adh.108 der Geburtsfolge nach mit Namen aufgezählt: Duryodhana, Duḥśāsana, Duḥsaha, Duḥśala, Jalasaṃdha, Sama, Saha, Vinda, Anuvinda, Durdharṣa, Subāhu, Duṣpradharṣaṇa, Durmarṣaṇa, Durmukha, Duṣkarṇa, Karṇa, Viviṃśati, Vikarṇa, Sulocana, Citra, Upacitra, Citrākṣa, Cārucitra, Śarāsana, Durmada, Duṣpragāha, Vivitsu, Vikaṭa, Ūrṇanābha, Sunābha, Nanda, Upananda, Senāpati, Suṣeṇa, Kuṇḍodara, Mahodara, Citrabāṇa, Citravarman, Suvarman, Durvimocana, Ayobāhu, Mahābāhu, Citrāṅga, Citrakuṇḍala, Bhīmavega, Bhīmabala, Balākī, Balavardhana, Ugrāyudha, Bhīmakarman, Kanakāyu, Dṛḍhāyudha, Dṛḍhavarman, Dṛḍhakṣatra, Somakīrti, Anūdara, Dṛḍhasaṃdha, Jarāsaṃdha, Satyasaṃdha, Sadaḥsuvāc, Ugraśravas, Aśvasena, Senānī, Duṣparājaya, Aparājita, Paṇḍitaka, Viśālākṣa, Durāvara, Dṛḍhahasta, Suhasta, Vātavega, Suvarcas, Ādityaketu, Bahvāśin, Nāgadanta, Ugrayāyin, Kavacin, Niṣaṅgin, Pāśin, Daṇḍadhāra, Dhanurgraha, Ugra, Bhīmaratha, Vīra, Vīrabāhu, Alolupa, Abhaya, Raudrakarman, Dṛḍharatha (dreifach genannt), Anādhṛṣya, Kuṇḍabhedin, Virāvin, Dīrghalocana, Dīrghabāhu, Vyūḍhoru, Kanakadhvaja, Kuṇḍāśin, Virajas, und Duḥśalā (Tochter). Einzelne Namen der berühmteren unter ihnen (etwa der hier auftretende Karṇa oder Jarāsaṃdha) sind Homonyme prominenter Figuren anderswo im Epos und mit diesen NICHT identisch."},{"term":"Kauravya","category":"Wesen","definition":"Ein Nāga-Stammvater; Sohn bzw. Ahnherr eines eigenen Schlangengeschlechts im Namenskatalog von Adhyāya 52 – nicht zu verwechseln mit den Kauravas, den Nachkommen Kurus."},{"term":"Kausalyā","category":"Person","definition":"Gattin Pūrus in der Prosa-Genealogie, Mutter des (frühen) Janamejaya (Adh.90) – nicht zu verwechseln mit der gleichnamigen Mutter Ambikās und Ambālikās (V.54) oder Rāmas Mutter in anderer Tradition."},{"term":"Kaustubha","category":"Begriff","definition":"Göttlicher, aus dem Amṛta entstandener Juwel, der auf Nārāyaṇas Brust gelangt."},{"term":"Kautsārya Jaimini","category":"Person","definition":"Alter, gelehrter Brahmane, Udgātṛ-Priester (Gesangspriester) beim Sarpasatra."},{"term":"Kauśika","category":"Epitheton","definition":"Patronymikon Viśvāmitras (,Nachkomme des Kuśika')."},{"term":"Kauśikī","category":"Ort","definition":"Heiliger Fluss, von Viśvāmitra zur eigenen Reinigung geschaffen; nach ihm wird Viśvāmitra auch »Kauśika« genannt."},{"term":"Kavaca und Kuṇḍala","desc":"Karṇas angeborener Panzer (kavaca) und Ohrringe (kuṇḍala), mit seinem Körper geboren und ihn im Kampf unbesiegbar machend; ihre listige Wegnahme durch Indra bildet den Kern der 'Kavaca-Kuṇḍala-Haraṇa'-Episode im Vanaparva."},{"term":"Kaśyapa","category":"Person","definition":"Großer Weiser (Prajāpati-artig), Gemahl von Kadrū und Vinatā (und vieler weiterer Gattinnen in der Tradition); Vater der Nāgas und Garuḍas."},{"term":"Kaṃsa","category":"Person","definition":"Böser König von Mathurā, Onkel Kṛṣṇas mütterlicherseits; Schwiegersohn Jarāsandhas durch Heirat mit dessen Töchtern Asti und Prāpti; von Kṛṣṇa und Balarāma getötet."},{"term":"Kaṅka","desc":"Yudhiṣṭhiras Deckname während des dreizehnten, unerkannten Exiljahres am Hof Virāṭas, als Brahmane und Hofunterhalter/Kenner des Würfelspiels."},{"term":"Kaṇva","category":"Person","definition":"Weiser, Haupt der Einsiedelei am Fluss Mālinī, wird auch mit dem Patronymikon »Kāśyapa« bezeichnet; Pflegevater der Śakuntalā. Duḥṣanta sucht ihn in Adhyāya 64 auf."},{"term":"Kekaya","desc":"Königreich und Kriegervolk im Nordwesten, mit den Pāṇḍavas und Kṛṣṇas Vṛṣṇi-Sippe verbündet."},{"term":"Kesarin","desc":"Gatte von Hanumāns Mutter; gilt als dessen Vater, obgleich Hanumān eigentlich von Vāyu gezeugt wurde."},{"term":"Ketumant (Niṣāda-Sohn)","category":"Person","definition":"Sohn des Niṣāda-Königs, Verbündeter der Pāṇḍavas, kämpft in Kap.50 mit den Cedis gegen die Kaliṅgas und wird von Bhīma erschlagen - nicht zu verwechseln mit dem gleichnamigen Kaurava-verbündeten Ketumān aus Kap.47."},{"term":"Ketumān","category":"Person","definition":"Kaurava-verbündeter Herrscher, bildet in Kap.47 zusammen mit Vasudāna und Abhibhū die Rückendeckung von Droṇas/Bhīṣmas Heer."},{"term":"Keśava","category":"Epitheton","definition":"Beiname Kṛṣṇa-Vāsudevas."},{"term":"Keśin","desc":"Ein Dānava (Dämon), der Devasenā und ihre Schwester Daityasenā zu entführen versucht und von Indra im Kampf verwundet und in die Flucht geschlagen wird."},{"term":"Keśinī","desc":"Magd Damayantīs; wird ausgesandt, um den geheimnisvollen Wagenlenker Bāhuka auszuforschen, und überbringt ihm die alte Botschaft vom abgeschnittenen Gewand."},{"term":"Khagama","category":"Person","definition":"Brahmane, Jugendfreund Sahasrapāds; verflucht diesen (zum Ḍuṇḍubha) für einen Kindheitsscherz mit einem falschen Schlangenseil."},{"term":"Khanaka","category":"Person","definition":"Unbenannter, von Vidura gesandter, geschickter Grabarbeiter/Tunnelbauer, der ab Adh.135 den Pāṇḍavas beim Lākṣāgṛha-Fluchttunnel hilft."},{"term":"Khara","desc":"Sohn Viśravas'/der Rākā, Zwillingsbruder Śūrpaṇakhās, im Rāmopākhyāna ein kriegerischer Rākṣasa-Fürst."},{"term":"Khaṭvāṅga","category":"Person","definition":"Legendärer König der Sonnendynastie, Vergleichsbild für Janamejaya."},{"term":"Khāṇḍava","category":"Sache","definition":"Großer Wald bei Khāṇḍavaprastha, den Arjuna zusammen mit Kṛṣṇa dem Feuergott Agni zum Fraß überließ (Khāṇḍavadahana); Agni schenkte Arjuna dafür den Bogen Gāṇḍīva."},{"term":"Khāṇḍava(vana)","category":"Ort","definition":"Waldgebiet, in dem Agni später, mit Arjunas Hilfe, durch das Fett aller Wesen gesättigt werden wird (Vorausdeutung auf den späteren Khāṇḍavadāha, Adh.114 V32)."},{"term":"Khāṇḍavaprastha","category":"Sache","definition":"Von Dhṛtarāṣṭra und Bhīṣma den Pāṇḍavas als Wohnsitz zugewiesenes Gebiet; ihre erste eigene Hauptstadt, später zu Indraprastha ausgebaut."},{"term":"Kirmīra","category":"Person","definition":"Ein von Bhīma getöteter Rākṣasa, Bruder Bakas."},{"term":"Kirāta","category":"Volk","definition":"Bergbewohnendes Volk im Osten/Nordosten, oft an der Seite Prāgjyotiṣas und in enger Verbindung mit Śiva-Mythen genannt."},{"term":"Kirīṭin","category":"Epitheton","definition":"'Der Kronen-/Diademträger', Beiname Arjunas nach dem von Indra verliehenen Diadem; wird in Droṇaparva Kap.3 von Karṇa in seiner Rede an den gefallenen Bhīṣma für Arjuna verwendet."},{"term":"Kitava","category":"Volk","definition":"Volk, das in Kap.114 zusammen mit den Sauvīras und anderen Bhīṣma im Kampf nicht verlässt. In Kap.33 als gängiger Beiname ('Falschspieler') für Śakuni verwendet — nicht zu verwechseln mit dem gleichnamigen Volk."},{"term":"Kiṃdama","category":"Person","definition":"Ein Muni von unvergleichlicher Askese, der sich aus Scham vor Menschen in Hirschgestalt mit seiner Gattin paart; von Pāṇḍu auf der Jagd irrtümlich erschossen. Sterbend verflucht er Pāṇḍu: Dieser werde im Moment der nächsten ehelichen Vereinigung sterben (Adh.109) – der Grund für Pāṇḍus spätere Askese und für die göttliche Zeugung seiner Söhne durch Niyoga-Mantra statt durch ihn selbst."},{"term":"Kiṃkara","category":"Wesen","definition":"Rākṣasa, den Viśvāmitra durch Śaktis Fluch in König Kalmāṣapāda fahren lässt."},{"term":"Kiṃnara","category":"Wesen","definition":"Halbgöttliche, für ihren Gesang bekannte Fabelwesen; in Adh.161 als Vergleich für Tapatīs Stimme erwähnt."},{"term":"Kiṃśuka","category":"Sache","definition":"Ein Baum mit auffällig roten Blüten (Butea frondosa/monosperma); im Epos häufiges Vergleichsbild für blutbedeckte Krieger."},{"term":"Kiṣku","category":"Maß","definition":"Ein altes Längenmaß, ungefähr eine Elle bzw. Unterarmlänge; wird u.a. zur Vermessung der Sabhā (Versammlungshalle) verwendet."},{"term":"Kolāhala","category":"Sache","definition":"Ein Berg, der den Fluss Śuktimatī aus Begehren zurückhielt, bis Vasu ihn mit dem Fuß aufstieß; zeugte darin ein Zwillingspaar (darunter Girikā)."},{"term":"Kosala","category":"Ort/Reich","note":"Königreich mit der Hauptstadt Ayodhyā, in dem König Ṛtuparṇa herrscht."},{"term":"Krathana","category":"Person","definition":"Einer von neun namentlich genannten Amṛta-Wächtern, von Garuḍa im Kampf besiegt."},{"term":"Kratu","category":"Person","definition":"Einer der sechs geistgeborenen Söhne Brahmās."},{"term":"Krauñca","category":"Berg/Mythos","definition":"Ein Berg, der der Mythologie zufolge einst von Skandas (Kārttikeyas) Speer durchbohrt wurde; in Kap.107 als Bildvergleich für den von einem Pfeil durchbohrten Bhīmasena verwendet. In Kap.40 daneben auch als Name einer nach dem Reiher benannten Heeresformation (Vyūha) verwendet."},{"term":"Krauñcavyūha","category":"Konzept","definition":"Die 'Reiher'-Schlachtformation; in Droṇaparva Kap.6 die von Yudhiṣṭhira für das Pāṇḍava-Heer angelegte Gegenformation zu Droṇas Śakaṭavyūha."},{"term":"Krauñcāruṇa","category":"Sache","definition":"„Kranich-rot“: Name der von Bṛhaspati einst Indra gelehrten Kampfformation (vyūha), die Dhṛṣṭadyumna auf Yudhiṣṭhiras Anweisung in Kap.46 fuer das Pāṇḍava-Heer aufstellt, mit Arjuna an der Spitze."},{"term":"Krośa","category":"Maß","definition":"Ein altindisches Wegmaß von etwa 3-4 km; in Adh.155 zur Beschreibung der Reichweite von Draupadīs Duft verwendet."},{"term":"Krātha","category":"Person","definition":"Ein Kaurava-Krieger, greift in Kap.36 gemeinsam mit anderen Abhimanyu an."},{"term":"Kubera","category":"Gottheit","definition":"Gott des Reichtums, Herrscher der Yakṣas, Wächter der Nordrichtung; sein Palast wird in Adhyāya 69 als Ziel von Śakuntalās luftigen Wanderungen genannt. Wird in Kap.26 (Apparatseinschub *0207) auch mit dem Beinamen 'Dhanada' ('Reichtumsspender') bezeichnet."},{"term":"Kuhū","desc":"Altvedische Göttin des Neumondtages, auch Ekānaṃśā genannt; in der Mahābhārata-Genealogie als Tochter des Aṅgiras genannt, bei deren Anblick die Menschen ‚kuhu-kuhu‘ rufen."},{"term":"Kumbhakarṇa","desc":"Ein riesenhafter, schlafgewaltiger Dämon (im Rāmāyaṇa der Bruder Rāvaṇas); im Vanaparva dient sein Name als Vergleich für den erwachten, furchterregenden Dhundhu."},{"term":"Kumbhayoni","category":"Epitheton","definition":"'Der aus dem Krug/Gefäß Entsprungene', Beiname Droṇas nach seiner Entstehungslegende (sein Same fiel in ein Gefäß, eine droṇī, woraus er entstand; vgl. Bharadvāja)."},{"term":"Kumbhīnasī","category":"Person","definition":"Die Gattin Aṅgāraparṇas; erbittet in Adh.158 von Yudhiṣṭhira die Verschonung ihres besiegten Gatten."},{"term":"Kuntibhoja","category":"Person","definition":"Vetter Śūras, adoptiert dessen Tochter Pṛthā als eigene Tochter; sie wird als seine Tochter ‚Kuntī' bekannt (Adh.104)."},{"term":"Kuntī","category":"Person","definition":"Mutter der drei älteren Pāṇḍavas (Yudhiṣṭhira, Bhīma, Arjuna). Nach Adhyāya 61 die Wiedergeburt der Göttin Siddhi (Aṃśāvataraṇa). Gebiert mittels des Durvāsas-Mantras nacheinander Yudhiṣṭhira (Dharma), Bhīma (Vāyu) und Arjuna (Indra); weist Pāṇḍus Wunsch nach einem vierten Sohn unter Berufung auf die dharmaśāstrische Drei-Empfängnisse-Grenze zurück (Adh.114). Bleibt nach Pāṇḍus Tod und Mādrīs Feuertod als alleinige Mutter aller fünf Pāṇḍavas zurück (Adh.116). Wird in Adh.125 bei Arjunas gerüstetem Auftritt vor der Menge zu Tränen gerührt; Dhṛtarāṣṭra nennt die drei älteren Pāṇḍavas bildhaft die ‚aus Pṛthās Zündholz entsprungenen Feuer'. Fällt in Adh.126 in Ohnmacht, als sie ihre beiden Söhne Karṇa und Arjuna, deren wahre Verwandtschaft nur sie kennt, zum Zweikampf gerüstet gegenüberstehen sieht; von Vidura wieder zu sich gebracht. Tritt am Ende von Adh.147, den rechten Zeitpunkt erkennend, zu der verzweifelten Brahmanenfamilie hinzu, um ihre Hilfe anzubieten. Rechtfertigt in Adh.150 gegenüber dem besorgten Yudhiṣṭhira ihren Entschluss, Bhīma gegen Baka zu schicken, mit Verweis auf dessen außergewöhnliche Kraft und eine frühere Lehre des Vyāsa über den Lohn kṣatriyischen Beistands."},{"term":"Kuru","category":"Dynastie","definition":"Königsgeschlecht, dem sowohl die Kauravas als auch die Pāṇḍavas entstammen; benannt nach dem Ahnherrn Kuru. Parikṣit, Janamejaya und die Hauptfiguren des Rahmengeschehens sind Kuru-Nachkommen."},{"term":"Kurujāṅgala","category":"Ort","definition":"Landstrich, benannt nach König Kuru, in dessen Nachbarschaft Kurukṣetra liegt (Adh.89)."},{"term":"Kurukṣetra","category":"Ort","definition":"Die Ebene nördlich von Delhi, Schauplatz der achtzehntägigen Schlacht zwischen Pāṇḍavas und Kauravas."},{"term":"Kuvalāśva","desc":"Sohn des Königs Bṛhadaśva aus dem Ikṣvāku-Geschlecht; durch die Gnade Viṣṇus, dem der Weise Uttaṅka einst diente, wird er zum Töter des Asura Dhundhu und erhält den Beinamen Dhundhumāra (Vanaparva)."},{"term":"Kuśa","category":"Begriff","definition":"Eine im Ritual als heilig geltende Grasart; erlangt der Sage nach durch Berührung mit dem Amṛta ihre Heiligkeit."},{"term":"Kuśasthalī","category":"Ort","definition":"Alte Bezeichnung der Stadt am Berg Raivata, die die Yādavas nach ihrer Flucht vor Jarāsandha neu befestigten und die später als Dvārakā bekannt wird."},{"term":"Kuśika","category":"Sippe/Person","definition":"Königslinie, aus der Viśvāmitra stammt; in Adh.164 im Zusammenhang mit dem Konflikt Vasiṣṭha-Viśvāmitra erwähnt."},{"term":"Kuśikas","category":"Volk/Geschlecht","definition":"Nachkommen des Jahnu, eines Sohnes Ajamīḍhas (Adh.89)."},{"term":"Kuṇinda","desc":"Bergvolk und Königreich im Himālaya, dessen Herrscher Subāhu die Pāṇḍavas ehrenvoll empfing."},{"term":"Kuṇḍabheda, Vairāṭa, Dīrghalocana, Dīrghabāhu, Kanakadhvaja (Sammeleintrag)","category":"Person","definition":"Fünf Söhne Dhṛtarāṣṭras, die zusammen mit ihren Brüdern Anādhṛṣṭi und Subāhu in Kap.92 von Bhīmasena in der Schlacht des vierten Tages erschlagen werden."},{"term":"Kuṇḍabhedin","category":"Person","definition":"Ein Kaurava-Krieger, greift in Kap.36 Abhimanyu an und wird von ihm getötet. Erscheint - trotz seines Todes durch Abhimanyu in Kap.36 - in Droṇaparva Kap.102 erneut unter den Bhīmasena umringenden Kriegern und wird dort von Bhīmasena getötet; eine der für die kritische Edition typischen Inkonsistenzen in der Chronologie der Gefallenen."},{"term":"Kuṇḍajaṭhara","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Kuṭighaṭa","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Kāka-Nilīyana","category":"Konzept","definition":"‚Krähenverstecken', ein Kinderspiel, bei dem Bhīma in Adh.119 aus Übermut mit den Kaurava-Knaben rau umgeht."},{"term":"Kākṣīvat","category":"Person","definition":"Ältester der elf Söhne, die Dīrghatamas mit einer Śūdra-Dienerin (anstelle der Königin Sudeṣṇā) zeugte (Adh.98)."},{"term":"Kāla","category":"Person","definition":"Die personifizierte Zeit, oft als Gestalt des Todes bzw. der alles vernichtenden Macht aufgefasst."},{"term":"Kālakeya","category":"Person","definition":"Kauravischer Krieger, als Sproß/Verwandter Subalas bezeichnet; in Kap.48 von Abhimanyu (mit der Keule) niedergeschlagen, zusammen mit siebenundsiebzig gāndhārischen Gefolgsleuten. Nicht zu verwechseln mit den andernorts im Epos genannten Kālakeya-Dānavas (einem Dämonengeschlecht)."},{"term":"Kālakeyas / Paulomas","category":"Gruppe","definition":"Zwei Asura-Geschlechter, von den Göttern unbesiegbar, aber von Arjuna während seines Aufenthalts im Himmel bezwungen."},{"term":"Kālakhañjas","category":"Wesen","definition":"Eine Gruppe von Dānavas, selbst von den Göttern nur schwer zu bezwingen, laut Tradition von Arjuna im Kampf niedergestreckt (vgl. Kap.44)."},{"term":"Kālakā","desc":"Eine große Asurin, die mit Pulomā durch Askese den Segen für Hiraṇyapura erwirkte; Stammmutter der Kālakeya-Dānavas."},{"term":"Kālakūṭa","category":"Konzept","definition":"Mythisches, hochgiftiges Gift; von Duryodhana Bhīmasena verabreicht, doch von diesem folgenlos verdaut (Adh.119). In anderen Traditionen mit dem beim Milchozean-Quirlen entstandenen Gift verbunden, das Śiva trinkt."},{"term":"Kālarātri","category":"Begriff","definition":"Die 'Nacht des Weltuntergangs' bzw. personifizierte Todesnacht, die am Ende eines Weltzeitalters alles vernichtet; in Kap.100 als Bildvergleich für einen mit tödlicher Wucht heranstürmenden Wurfspeer verwendet."},{"term":"Kāleya","desc":"Bezeichnung einer furchtbaren Dānava-Sippe des Kṛtayuga, die sich Vṛtra im Kampf gegen die Götter anschloss."},{"term":"Kālindī","category":"Ort","definition":"Ein anderer Name des Flusses Yamunā."},{"term":"Kālī","category":"Person","definition":"Älterer Name Satyavatīs (‚die Dunkle'), aus der Zeit vor Parāśaras Duft-Segen; bezieht sich auf ihre ursprüngliche Hautfarbe/den Fischgeruch, nicht auf die Göttin Kālī (Adh.99)."},{"term":"Kāma","category":"Gottheit","definition":"Gott der Liebe/des Begehrens, Sohn des Dharma, Gemahl der Rati."},{"term":"Kāmboja","category":"Volk/Ort","definition":"Nordwestliches Volk und Reich, berühmt für seine Pferde; wird im weiteren Epos wiederholt genannt."},{"term":"Kāmpilya","category":"Ort","definition":"Vorzüglichste Stadt der südlichen Pāñcālas, Teil von Drupadas verbleibendem Reich nach der Niederlage gegen Droṇa (Adh.128). In Adh.176 auch ,Śiśumārapura' genannt."},{"term":"Kāmyaka","expl":"Ein Wald am Fluss Sarasvatī, einer der wichtigsten Aufenthaltsorte der Pāṇḍavas während ihres zwölfjährigen Waldexils."},{"term":"Kānyakubja","category":"Ort","definition":"Königreich/Stadt (heute Kannauj), Herrschaftssitz Gādhis und Viśvāmitras."},{"term":"Kāpālin","category":"Epitheton","definition":"'Der Schädelträger', Beiname Śivas; in Droṇaparva Kap.5 als Vergleichsbild in Duryodhanas Rede an Droṇa verwendet ('wie Kāpālin unter den Rudras')."},{"term":"Kārtavīrya","category":"Person","definition":"Legendärer, tausendarmiger König (Arjuna Kārtavīrya); in Adh.114 als Vergleichsmaßstab für die Kraft des neugeborenen Arjuna genannt."},{"term":"Kārtavīryārjuna","desc":"Legendärer tausendarmiger König der Haihayas, berühmt für seine Macht; später von Paraśurāma getötet."},{"term":"Kārttikeya","category":"Gottheit","definition":"Auch Skanda oder Kumāra genannt; Sohn des Agni, im Schilfrohrdickicht geboren, nach den Kṛttikās (Plejaden) benannt, die ihn aufzogen."},{"term":"Kārṣṇi","category":"Beiname","definition":"'Zu Kṛṣṇa gehörig', in Kap.107 als Beiname Abhimanyus verwendet, des Neffen Kṛṣṇas (Sohn der Subhadrā, Kṛṣṇas Schwester)."},{"term":"Kārṣṇi (Mehrdeutigkeit)","category":"Begriff","definition":"Patronymikon „Sohn/Nachkomme der Kṛṣṇā bzw. des Kṛṣṇa“; wird in Kap.96 für Abhimanyu verwendet (als Schwestersohn Kṛṣṇas), an anderen Stellen dagegen für die fünf Söhne der Draupadī (Kṛṣṇā). Die jeweilige Bezugsperson ergibt sich aus dem Kontext."},{"term":"Kāśi","category":"Ort","definition":"Königreich (Hauptstadt später als Vārāṇasī/Benares bekannt); Herrschaftsgebiet Suvarṇavarmans, des Vaters von Janamejayas Gemahlin Vapuṣṭamā."},{"term":"Kāśmīra","category":"Ort","definition":"Bergregion im Nordwesten (heutiges Kaschmir), von Arjuna während seines Nordfeldzugs unterworfen."},{"term":"Kāśyapa","category":"Person","definition":"Heilkundiger Brahmane (Patronymikon: „Nachkomme des Kaśyapa“), der König Parikṣit vor Takṣakas tödlichem Biss retten will, unterwegs aber von Takṣaka in Gestalt eines alten Brahmanen abgefangen wird. Nicht zu verwechseln mit dem großen Weisen Kaśyapa, dem Stammvater der Nāgas und Garuḍas. In Adhyāya 64 wird auch der Weise Kaṇva mit diesem Patronymikon bezeichnet."},{"term":"Kīcaka","category":"Person","definition":"Heerführer am Hof Virāṭas, belästigt die verkleidete Draupadī und wird von Bhīma getötet."},{"term":"Kīcaka (Volk)","category":"Ort/Volk","definition":"Ein in Adh.144 genanntes Volk/Gebiet auf dem Wanderweg der Pāṇḍavas; nicht zu verwechseln mit der späteren Einzelfigur Kīcaka im Virāṭaparva."},{"term":"Kṛpa","category":"Person","definition":"Sohn des Śaradvat, Waffenlehrer am Kuru-Hof. Nach Adhyāya 61 aus der Schar der Rudras entstanden (Aṃśāvataraṇa). Ausführliche Geburtsgeschichte in Adh.120: aus dem bei Anblick einer von Indra gesandten Apsaras unwillkürlich vergossenen Samen des Ṛṣi Śaradvat Gautama, gefallen auf ein Schilfbüschel (Śarastamba); von König Śaṃtanu gefunden und aus Mitleid (Kṛpā) aufgezogen, daher der Name. Später von seinem leiblichen Vater in den vollständigen Dhanurveda samt allen Waffen eingeweiht; wird Lehrmeister der Kaurava- und Pāṇḍava-Prinzen. In Kap.122 von Arjuna (aus Rücksicht auf die Lehrer-Schüler-Bindung nur zurückhaltend bekämpft) dennoch durch Pfeile bedrängt und ohnmächtig; Arjuna hält daraufhin eine bewegte Selbstanklage über sein Vergehen gegen den Lehrer, bevor sein Wagenlenker ihn vom Feld trägt. In Kap.133 hält er Karṇa dessen frühere Niederlagen gegen die Pāṇḍavas vor (u.a. bei Virāṭas Stadt und im Gandharva-Kampf) und warnt ihn eindringlich vor der Unbesiegbarkeit Kṛṣṇas und Arjunas, indem er die zahlreichen Verbündeten und Vorzüge der Pāṇḍava-Seite aufzählt. In Kap.134 hält er zusammen mit Duryodhana den erzürnten Aśvatthāman von einem Angriff auf Karṇa ab; später warnt er Aśvatthāman eindringlich davor, Duryodhana allein gegen Arjuna kämpfen zu lassen. Nach Karṇas Niederlage gegen Arjuna nimmt Karṇa auf seinem Wagen Zuflucht. In Kap.144 gewinnt er im Duell gegen Śikhaṇḍin (Yājñaseni) die Oberhand, nachdem dieser zuvor seinen Bogen zerschlagen und einen goldgeschmückten Speer gegen ihn geschleudert hatte, den Kṛpa jedoch zerstört."},{"term":"Kṛpī","category":"Person","definition":"Zwillingsschwester Kṛpas, aus einem Schilfrohrbüschel geboren; Gemahlin Droṇas, Mutter Aśvatthāmans. Ausführliche Geburtsgeschichte (gemeinsam mit ihrem Zwillingsbruder Kṛpa) in Adh.120."},{"term":"Kṛtavarman","category":"Person","definition":"Vṛṣṇi-Krieger auf Kaurava-Seite (patronymisch auch Hārdikya, ‚Sohn des Hṛdika‘, genannt), beteiligt am nächtlichen Massaker unter Aśvatthāmans Führung. Nach Adhyāya 61 ebenfalls aus der Schar der Maruts geboren (Aṃśāvataraṇa). Wird in Kap.124 von Yudhiṣṭhira als von Bhīmasena und Sātyaki im Kampf besiegt genannt. Befiehlt in Kap.139 zusammen mit Śalya, Droṇas rechtes bzw. linkes Wagenrad zu schützen. Hält in Kap.140 Yudhiṣṭhira, der auf Droṇa zusteuert, in einem langen, wechselvollen Duell zurück: Beide zerschlagen einander Bogen und Rüstzeug, bis Kṛtavarman schließlich Yudhiṣṭhiras Pferde, Wagenlenker und Wagen zerstört und den erschöpften, verwundeten Pāṇḍava-König vom Schlachtfeld vertreibt, um danach wieder seinen Posten an Droṇas Rad einzunehmen. In Kap.146 nimmt er den wagen- und bogenlosen Duryodhana, der von Sātyaki entwaffnet wurde, auf seinem eigenen Wagen auf."},{"term":"Kṛtavīrya","category":"Person","definition":"König, Opferherr (Yajamāna) der Bhṛgus; nach seinem Tod erschlagen seine bedürftigen Nachkommen die reichen Bhṛgus (Adh.169, Aurva-Erzählung)."},{"term":"Kṛtayuga","category":"Begriff","definition":"Das erste und vollkommenste der vier Weltzeitalter (Yugas), geprägt von Dharma, Langlebigkeit und Wohlstand, wie in Adhyāya 58 idealisierend beschrieben."},{"term":"Kṛttikās","category":"Wesen","definition":"Die sechs (bzw. sieben) Plejaden-Sternfrauen, denen in mancher Tradition die Aufzucht des Gottes Guha/Skanda zugeschrieben wird (Adh.127)."},{"term":"Kṛtyā","desc":"Ein durch vedisches Ritual (mit Mantras, Feueropfer und magischen Formeln) herbeigeschworenes Zauberwesen, das dem Auftrag seiner Beschwörer dient; hier von den Daityas erschaffen, um Duryodhana in die Unterwelt zu entrücken."},{"term":"Kṛtānta","category":"Gottheit","definition":"Epitheton Yamas, des Todesgottes („der das Ende macht“)."},{"term":"Kṛśāśva","category":"Person","definition":"Legendärer König bzw. Weiser, hier unter den himmlischen Zuschauern der Schlacht zwischen Bhīṣma und Arjuna genannt."},{"term":"Kṛṣṇa","desc":"Vāsudeva-Kṛṣṇa, der göttliche Herrscher der Yādavas aus Dvārakā, engster Verbündeter und Berater der Pāṇḍavas sowie Gemahl der Satyabhāmā; nicht zu verwechseln mit dem gleichlautenden Beinamen ‚Kṛṣṇā‘ (die Dunkle) der Draupadī. Wird u.a. auch mit dem Beinamen ‚Acyuta‘ (‚der Unfehlbare/Beständige‘) angesprochen (z.B. Kap.27). Weitere in dieser Ausgabe belegte Beinamen sind u.a. ‚Śauri‘ (nach seinem Ahnherrn Śūra) und ‚Puṇḍarīkākṣa‘ (‚der Lotusäugige‘). Empfängt in Kap.124 Yudhiṣṭhiras langen Lobpreis als höchstes göttliches Wesen (Nārāyaṇa/Viṣṇu/Brahman) und antwortet mit Lob für Arjunas Tötung Jayadrathas. Rät in Kap.137 Yudhiṣṭhira eindringlich, den Kampf gegen Droṇa - der es stets auf seine Gefangennahme abgesehen habe - aufzugeben und sich stattdessen Duryodhana zuzuwenden, während er selbst mit Arjuna und Bhīma die Kauravas bekämpft. In Kap.147 rät er, angesichts des durch Droṇa und Karṇa verursachten nächtlichen Zusammenbruchs der Pāñcālas, Arjuna dazu, gemeinsam mit dem heranrückenden Bhīmasena und den Pāñcāla-Wagenkämpfern Droṇa und Karṇa direkt entgegenzutreten, um das Heer zu ermutigen. In Adh.148 rät er Arjuna von einem sofortigen Duell mit Karṇa ab, da Indras Geschoss (Vāsavī Śakti) noch gegen ihn bereitstehe, und ruft stattdessen Ghaṭotkaca herbei, den er ausführlich zum nächtlichen Kampf gegen Karṇa anspornt."},{"term":"Kṛṣṇa Dvaipāyana","category":"Person","definition":"Auch Vyāsa genannt; der traditionelle Verfasser des Mahābhārata. Sohn Parāśaras und der jungen Fährfrau Satyavatī (damals ‚Kālī' genannt), auf einer Insel (dvīpa) im Fluss Yamunā gezeugt und geboren, während Satyavatī äußerlich Jungfrau blieb; erhielt später von Satyavatī den Auftrag, per Niyoga Söhne für den verstorbenen Vicitravīrya zu zeugen (Adh.99)."},{"term":"Kṛṣṇā","category":"Person/Beiname","definition":"Beiname Draupadīs (weibliche Form von ,Kṛṣṇa', ,die Dunkle'); nicht zu verwechseln mit dem Gott Kṛṣṇa. Wird ab Adh.153 verwendet. In Adh.155 detailliert erzählt: entsteht zugleich mit Dhṛṣṭadyumna aus der Mitte von Drupadas Opferaltar, von göttlicher Schönheit; eine körperlose Stimme prophezeit ihre künftige Rolle beim Untergang der Kṣatriyas. Laut Vyāsas Erzählung in Adh.157 die Wiedergeburt einer Ṛṣi-Tochter, die durch fünffach wiederholte Bitte an Śiva die künftige Ehe mit fünf Gatten (den Pāṇḍavas) erwirkte."},{"term":"Kṣatradeva","category":"Person","definition":"Sohn Śikhaṇḍins, kämpft auf Pāṇḍava-Seite mit jasminäugigen, lotosfarbenen, in Bāhlika geborenen Pferden (Droṇaparva Kap.22)."},{"term":"Kṣatradeva, Kṣatradharman (Sammeleintrag)","category":"Person","definition":"Zwei Krieger auf Pāṇḍava-Seite, die in Kap.89 mit Bhīmasena Ghaṭotkaca zu Hilfe eilen."},{"term":"Kṣatradharman","category":"Person","definition":"Ein großer Bogenschütze auf Pāṇḍava-Seite, kämpft in Droṇaparva Kap.24 gegen den Sindhu-König Jayadratha — nicht zu verwechseln mit Kṣatradeva, Sohn Śikhaṇḍins. In Droṇaparva Kap.101 erweist er sich als Sohn Dhṛṣṭadyumnas (dhārṣṭadyumni); er zerschlägt dort Droṇas Bogen, wird aber daraufhin von Droṇa mit einem Pfeil getötet."},{"term":"Kṣatravarman","category":"Person","definition":"Ein Krieger im Heer der Pāṇḍavas, der Droṇa in Kap.20 mit zwanzig Pfeilen durchbohrt und von ihm mit achtzig Pfeilen getroffen wird."},{"term":"Kṣatraṃjaya","category":"Person","definition":"Einer der Söhne Dhṛṣṭadyumnas, die zwölf Jahre bei Bhīṣma in der Waffenkunst ausgebildet wurden; in Droṇaparva Kap.9 gemeinsam mit seinen Brüdern Kṣatradeva und Kṣatradharman genannt."},{"term":"Kṣattā","category":"Titel/Epitheton","definition":"Ehrentitel Viduras (‚Wagenlenker'/Amtstitel des königlichen Rates), mit dem Kuntī ihn in Adh.133 bezeichnet."},{"term":"Kṣattṛ","category":"Sache","definition":"Titel/Beiname Viduras, wörtlich etwa Verwalter; Bezeichnung seines Amtes am Hof von Hāstinapura."},{"term":"Kṣema","category":"Person","definition":"Vater des Kriegers Satyadhṛti ('Kṣaimi') auf Pāṇḍava-Seite (Droṇaparva Kap.22)."},{"term":"Kṣemadhūrti","category":"Person","definition":"Krieger auf Kaurava-Seite, Bruder Bṛhantas; beide verwunden gemeinsam einen namenlosen Sātvata-Krieger in Droṇaparva Kap.24."},{"term":"Kṣemaśarman","category":"Person","definition":"Krieger auf Kaurava-Seite; in Droṇaparva Kap.19 unter den 'Augen' der von Droṇa gebildeten Garuḍa-Heeresformation genannt."},{"term":"Kṣetrajña","desc":"Der „Feldkenner“ – die im Körper („Feld“) weilende, unbeteiligte Zeugen-Gottheit/das höhere Selbst, das, wie ein Wassertropfen auf einem Lotosblatt, von der bloßen Einzelseele (jīva) und ihren wechselnden Eigenschaften (Guṇas) verschieden ist; ein Kernbegriff der Sāṃkhya-Philosophie."},{"term":"Kṣupa","category":"Person (König)","definition":"Legendärer König, hier unter den himmlischen Zuschauern der Schlacht zwischen Bhīṣma und Arjuna genannt."},{"term":"Lakṣmaṇa","category":"Person","definition":"Halbbruder Rāmas im Rāmāyaṇa, der ihn treu ins Waldexil begleitete. Nicht zu verwechseln mit Lakṣmaṇa, dem Sohn Duryodhanas im Mahābhārata (Bhīṣmaparva Kap.51). Fällt in Kap.32 durch Abhimanyu während dessen Durchbruch durch die Cakra-Vyūha-Formation."},{"term":"Lakṣmaṇa (Duryodhanas Sohn)","category":"Person","definition":"Sohn Duryodhanas, Enkel Dhṛtarāṣṭras; liefert sich in Kap.51 einen Zweikampf mit Abhimanyu - nicht zu verwechseln mit Lakṣmaṇa, dem Halbbruder Rāmas im Rāmāyaṇa."},{"term":"Lakṣmī","category":"Gottheit","definition":"Glücks- und Schönheitsgöttin, Schwester Dhātās und Vidhātās, im Lotos wohnend; entsteht auch beim Samudra-Manthana."},{"term":"Lalittha","category":"Volk","definition":"Volk, das in Droṇaparva Kap.16 zusammen mit den Mācellakas und Madrakas an Suśarmans Saṃśaptaka-Eid gegen Arjuna teilnimmt."},{"term":"Lapitā","category":"Person","definition":"Eine weitere Vogelfrau, zu der Mandapāla nach Jaritā geht."},{"term":"Latā","category":"Person","definition":"Eine der fünf Apsaras, die mit Vargā zusammen in Krokodile verwandelt wurden."},{"term":"Laṅkā","desc":"Die Inselstadt Rāvaṇas, die Hauptstadt der Rākṣasas, die Rāma mit Hanumāns Hilfe eroberte, um Sītā zu befreien."},{"term":"Lohitākṣa","category":"Person","definition":"Purāṇakundiger Sūta, der die Überlieferung von Indras Schutzzusage für Takṣaka kannte und weitergab."},{"term":"Lokapāla","category":"Sache","definition":"Bezeichnung der Weltenhüter, der Götter, die über die Himmelsrichtungen wachen (u.a. Kubera als Hüter des Nordens)."},{"term":"Lomaharṣaṇa","category":"Person","definition":"Vater des Ugraśravas (Sūta); auch „Romaharṣaṇa“ geschrieben."},{"term":"Lomapāda","desc":"Legendärer König von Aṅga, in der Tradition mit dem Weisen Ṛṣyaśṛṅga verbunden; hier als Beispiel eines durch Tīrtha-Pilgerfahrt zum Himmel gelangten Königs genannt."},{"term":"Lomaśa","category":"Person","definition":"Ein großer Seher, der später die Pāṇḍavas auf ihrer Wallfahrt zu den heiligen Furten (Tīrthayātrā) begleiten wird."},{"term":"Lopāmudrā","category":"Person","definition":"Gattin des Weisen Agastya, mit dem sie um der Nachkommenschaft willen zusammenkam."},{"term":"Lākṣāgṛha","category":"Konzept","definition":"Das ‚Lackhaus' – das von Purocana in Vāraṇāvata aus Hanf, Harz, Ghee und Lack errichtete, leicht entflammbare Gebäude, in dem die Pāṇḍavas ermordet werden sollen (ab Adh.132)."},{"term":"Mada","desc":"Ein gewaltiger Dämon, den Cyavana durch ein Zauberopfer erschafft, um Indra zur Anerkennung der Aśvins als Soma-berechtigt zu zwingen."},{"term":"Madayantī","category":"Person","definition":"Gattin des Königs Saudāsa/Kalmāṣapāda; empfängt durch Niyoga mit Vasiṣṭha den Sohn Aśmaka, von Pāṇḍu als Präzedenzfall angeführt (Adh.113)."},{"term":"Madhu und Kaiṭabha","desc":"Ein berühmtes Dämonenpaar, das einst von Viṣṇu getötet wurde (woher dessen Beiname Madhusūdana rührt); im Vanaparva werden sie als Eltern des Dānava Dhundhu genannt."},{"term":"Madhusūdana","category":"Person","definition":"Beiname Kṛṣṇas, wörtlich Vernichter des Dämons Madhu. In Kap.66 erscheint die sinngleiche Variante Madhunighātana (\"Madhu-Bezwinger\")."},{"term":"Madirāśva","category":"Person","definition":"Ein jüngerer Bruder Virāṭas, Königs der Matsyas."},{"term":"Madra","category":"Ort","definition":"Königreich, dessen Herrscher (madreśvara) eine für die Kurus in Betracht gezogene Tochter hatte (Adh.103); später Heimat Mādrīs, der zweiten Gattin Pāṇḍus. Die Madrakas, das Volk Madras, kämpfen in Kap.66 unter den Truppen, die Arjuna auf seinem Weg zu Jayadratha aufhalten."},{"term":"Magadha","category":"Ort","definition":"Königreich im Osten (spätere Hauptregion um Rājagṛha), dessen Herrscher Dārva von Pāṇḍu erschlagen wird (Adh.105)."},{"term":"Maghavan","category":"Epitheton","definition":"Beiname Indras."},{"term":"Maghā","category":"Sache","definition":"Ein Mondhaus (Nakṣatra)."},{"term":"Mahendra","category":"Person","definition":"Der große Indra - Beiname Indras."},{"term":"Mahendra (Berg)","category":"Sache","definition":"Ein Berg (Ostghats), auf dem Paraśurāma nach der Vernichtung der Kṣatriyas Askese übte; nicht zu verwechseln mit 'Mahendra' als Indra-Beiname."},{"term":"Maheśvara","category":"Person","definition":"Der große Herr - Beiname Śivas. In Kap.69 (innerhalb der von Droṇa erzählten Vṛtra-Mythe) auch als Pinākī (\"Der mit dem Pināka-Bogen\") angeredet, als er den bedrängten Göttern seine eigene Rüstung zur Tötung Vṛtras überlässt."},{"term":"Mahiṣa","desc":"Mächtiger Dānava in Büffelgestalt, der mit dem Götterheer kämpft und von Skanda mit dessen stets zurückkehrendem Speer erschlagen wird; früheste literarische Erscheinung der später (als Gegner der Göttin Durgā) weitaus berühmteren Gestalt Mahiṣāsuras."},{"term":"Mahābhiṣa","category":"Person (König)","definition":"Ikṣvāku-König, der durch tausend Aśvamedha-Opfer den Himmel erlangte, aber von Brahmā zur Wiedergeburt als Sterblicher verurteilt wurde, weil er beim Anblick der Gaṅgā nicht wie die anderen Götter den Blick abwandte; wählt Pratīpa als künftigen Vater – frühere Existenz Śaṃtanus (Adh.91)."},{"term":"Mahādeva","category":"Person","definition":"Der große Gott - Beiname Śivas."},{"term":"Mahākarṇi","category":"Person","definition":"Der machtgierige Minister des Māgadha-Königs Ambuvīca in Karṇas warnender Erzählung."},{"term":"Mahānadī","category":"Ort","definition":"Ein heiliger Fluss, den Arjuna auf seiner Pilgerreise besucht."},{"term":"Maināka","category":"Ort","definition":"Ein Berg im äußersten Norden, nahe dem Kailāsa und dem See Bindusaras."},{"term":"Maitreya","expl":"Ein wandernder Weiser (Ṛṣi), der Dhṛtarāṣṭra und Duryodhana zur Versöhnung mit den Pāṇḍavas mahnt und, als Duryodhana ihn missachtet, den berühmten Fluch ausspricht, dass Bhīma dessen Schenkel im Krieg zerschmettern werde."},{"term":"Malaya","category":"Ort","definition":"Ein Gebirge (im Süden Indiens), berühmt für seine Sandelholzbäume; sprichwörtlich für duftende Bäume."},{"term":"Mamatā","category":"Person","definition":"Gattin Utathyas; von Bṛhaspati während ihrer Schwangerschaft bedrängt, was zum Fluch über ihren ungeborenen Sohn Dīrghatamas führt (Adh.98)."},{"term":"Manasyu","category":"Person (König)","definition":"Sohn Pravīras, Nachkomme Pūrus, Hüter der 'viergrenzigen' Erde (Adh.89)."},{"term":"Mandapāla","category":"Person","definition":"Ein kinderloser Weiser, der sich in einen Śārṅgaka-Vogel verwandelt, um Nachkommenschaft zu zeugen; Vater der vier Śārṅgaka-Vögel."},{"term":"Mandara","category":"Ort","definition":"Berg, der von Ananta ausgerissen und als Quirlstab beim Samudra-Manthana verwendet wird."},{"term":"Mandodarī","desc":"Hauptgattin Rāvaṇas in Laṅkā, mit der Sītā von Rāvaṇa verglichen wird, als er um sie wirbt."},{"term":"Manmatha","category":"Person/Beiname","definition":"Ein Beiname des Liebesgottes Kāma; in Adh.160 im Zusammenhang mit König Saṃvaraṇas Liebesqual erwähnt."},{"term":"Mantharā","desc":"Bucklige Dienerin Kaikeyīs im Rāmāyaṇa, hier als Wiedergeburt der Gandharvī Dundubhī erklärt; sie stiftet Kaikeyī zur Forderung von Rāmas Exil an."},{"term":"Manu","category":"Person","definition":"Der Stammvater der Menschheit im jeweiligen Weltzeitalter; hier als Sohn des Sonnengottes Vivasvat genannt."},{"term":"Marut","category":"Begriff","definition":"Eine Klasse vedischer Sturmgottheiten, Gefolge Indras."},{"term":"Maruts","category":"Göttergruppe","definition":"Die Sturmgötter, Gefolge Indras; werden regelmäßig zusammen mit anderen Göttergruppen als Verehrer/Begleiter genannt."},{"term":"Marutta","category":"Person","definition":"Ein legendärer König, dessen Opfer und Goldschatz-Erwerb in einer Nebenerzählung des Āśvamedhikaparva behandelt werden."},{"term":"Marīci","category":"Person","definition":"Einer der sechs geistgeborenen Söhne Brahmās, Vater Kaśyapas."},{"term":"Marīcipa","category":"Sache","definition":"Eine Klasse von Sehern bzw. Ahnen, die sich von Lichtstrahlen nähren."},{"term":"Mataṅga","category":"Person","definition":"Rechtschaffener Königsweiser, dessen Gattin Viśvāmitra einst in einer Notzeit beschützte und für den er später ein Opfer vollzog; Episode nur knapp angedeutet."},{"term":"Matinara","category":"Person (König)","definition":"Nachkomme Raudrāśvas in der Paurava-Genealogie, Vater des Taṃsu (Adh.89)."},{"term":"Matsya","category":"Person","definition":"Aus dem Fischleib der Adrikā geborener Sohn, von Uparicara Vasu als eigener Sohn angenommen, Gründer eines gleichnamigen Königreichs; Zwillingsbruder Satyavatīs."},{"term":"Maudgalya","category":"Person","definition":"Brahmane, Beisitzer beim Sarpasatra Janamejayas."},{"term":"Mausalaparva","category":"Werkteil","definition":"Das sechzehnte Parva: der Untergang der Vṛṣṇis und Yādavas."},{"term":"Maya","category":"Person","definition":"Ein Dānava-Baumeister, der den Pāṇḍavas ihre Wunder-Versammlungshalle (Sabhā) errichtete."},{"term":"Maṇalūra","category":"Ort","definition":"Das Reich Citravāhanas an der Ostküste, in dem Arjuna Citrāṅgadā begegnet - in anderen Rezensionen auch Maṇipūra genannt."},{"term":"Maṇibhadra","category":"Gottheit","note":"Ein Yakṣa-König, Schutzgottheit der Reisenden und Karawanen."},{"term":"Maṇimant","category":"Person","definition":"König auf Pāṇḍava-Seite, wird in Droṇaparva Kap.24 von Bhūriśravas (Saumadatti/Yūpaketu) im Zweikampf getötet."},{"term":"Maṇimat","category":"Person","definition":"Anführer der Yakṣas im Kampf am Gandhamādana."},{"term":"Maṇimān","desc":"Ein Rākṣasa, Freund Vaiśravaṇa-Kuberas, der die vor Bhīma fliehenden Wächter zum Kampf zurückführt und von Bhīma in einem erbitterten Zweikampf mit Speer und Keule erschlagen wird."},{"term":"Meghavega","category":"Person","definition":"Kauravischer Krieger, in Kap.47 von Abhimanyu erschlagen (siehe auch [[Candraketu]])."},{"term":"Menakā","category":"Wesen","definition":"Apsaras, Mutter Pramadvarās (mit dem Gandharven Viśvāvasu); setzt das Kind aus."},{"term":"Meru","category":"Ort","definition":"Mythischer Weltenberg, goldglänzend, Schauplatz der Götterberatung vor dem Quirlen des Milchozeans."},{"term":"Mithilā","category":"Ort","definition":"Hauptstadt des Königreichs Videha (Adh.105)."},{"term":"Mitra","category":"Person","definition":"Einer der zwölf Āditya-Götter, Hüter der Verträge und Freundschaft."},{"term":"Mleccha","category":"Volk/Begriff","definition":"Sammelbegriff für nicht-vedische/,fremde' Völker; in Adh.165 mythisch aus Nandinīs Zorn hervorgegangen (Pahlava, Śaka, Yavana, Puṇḍra, Kirāta, Draviḍa, Siṃhala, Barbara, Darada u.a.)."},{"term":"Mleccha-Sprache","category":"Konzept","definition":"Eine von Vidura in Adh.133 verwendete Geheim- oder Fremdsprache, mit der er Yudhiṣṭhira verschlüsselt vor dem Anschlag warnte; dient in Adh.135 dem Grabarbeiter als Vertrauensbeweis."},{"term":"Mlecchas","category":"Volk/Dynastie","definition":"Nachkommen des Anu, Sohnes von Yayāti und Śarmiṣṭhā; der Begriff wird im späteren Sanskrit allgemein für nicht-arische, außerhalb der vedischen Ordnung stehende Völker gebraucht."},{"term":"Mohinī","category":"Gottheit","definition":"Von Nārāyaṇa angenommene, betörende Frauengestalt, mit der er den Dānavas das Amṛta abnimmt."},{"term":"Mucukunda","desc":"Legendärer König aus der Sonnendynastie, für seine Askese und Tugend gerühmt."},{"term":"Mudgala","desc":"Ein rechtschaffener Weiser aus Kurukṣetra, der nach der 'Tauben-Lebensweise' von Ährenlese lebte; Held der bekannten Erzählung (Mudgalopākhyāna), in der er trotz größter Armut wiederholt seine gesamte Nahrung an den prüfenden Durvāsas verschenkt und dadurch himmlischen Lohn erlangt."},{"term":"Muni","category":"Konzept","definition":"Der schweigende Weise oder Asket; in Adh. 86 insbesondere der radikal entsagende Waldbewohner, der durch Schweigegelübde (mauna) und äußerste Bedürfnislosigkeit die Vollendung sucht."},{"term":"Mura","category":"Person","definition":"Ein bergesgroßer Asura (Dämon), der von Kṛṣṇa erschlagen wurde; in Droṇaparva Kap.10 in Dhṛtarāṣṭras Katalog von Kṛṣṇas Heldentaten genannt."},{"term":"Muśala","category":"Militär","definition":"„Keulenstößel“ — Name einer traditionellen, nach dem Keulenstößel benannten taktischen Heeresformation (Vyūha); in Kap.40 von Abhimanyu unter den rechtmäßigen Formationen rechtschaffener Könige genannt, im Gegensatz zur Cakra-Vyūha-Formation."},{"term":"Mācellaka","category":"Volk","definition":"Volk, das in Droṇaparva Kap.16 zusammen mit den Lalitthas und Madrakas an Suśarmans Saṃśaptaka-Eid gegen Arjuna teilnimmt."},{"term":"Mādhava","category":"Person","definition":"Beiname Kṛṣṇas (aus dem Madhu-Geschlecht der Yādavas). In Kap.87 auch auf Sātyaki angewandt (ebenfalls ein Vṛṣṇi/Yādava-Nachkomme desselben Geschlechts)."},{"term":"Mādrī","category":"Person","definition":"Zweite Gattin des Pāṇḍu, Mutter der Zwillinge Nakula und Sahadeva. Nach Adhyāya 61 die Wiedergeburt der Göttin Dhṛti (Aṃśāvataraṇa). Bittet Kuntī um Anteil an der Nachkommenschaft und gebiert von den Aśvins die Zwillinge Nakula und Sahadeva (Adh.115); mit ihnen sind alle fünf Pāṇḍavas geboren. Besteigt nach Pāṇḍus Tod dessen Scheiterhaufen (Adh.116) und übergibt ihre Söhne Nakula und Sahadeva Kuntīs Obhut."},{"term":"Māgadha","category":"Sache","definition":"Bewohner bzw. Volk des Landes Magadha im östlichen Indien."},{"term":"Māhiṣmatī","category":"Ort","definition":"Stadt am Fluss Narmadā, Sitz König Nīlas; Schauplatz einer Episode um den Gott Agni, der die Stadt vor Eroberern beschützt."},{"term":"Mākandī","category":"Ort","definition":"Stadt am Ganges-Ufer, die Drupada nach seiner Niederlage gegen Droṇa als Teil seines verbleibenden Reiches bewohnt (Adh.128)."},{"term":"Mālava, Dākṣiṇātya, Pulinda, Pārada u.a. (Sammeleintrag)","category":"Gruppe","definition":"Kleinere, in Kap.83 nur einmalig im Marschkatalog von Bhīṣmas Heeresformation genannte Völker/Stämme auf Kaurava-Seite: Mālavas, Dākṣiṇātyas (Südländer), Āvantyas (aus Avanti, vgl. Vinda/Anuvinda), Pulindas, Pāradas, Kṣudraka-Mālavas, Mekalas, Traipuras, Cicchilas, sowie der Herrscher von Prasthala (Trigarta-König)."},{"term":"Mālinī","category":"Ort","definition":"Heiliger Fluss bei Kaṇvas Einsiedelei, mit Inseln und lieblichen Ufern, Aufenthaltsort von Nara und Nārāyaṇa."},{"term":"Mālinī","category":"Person","definition":"Draupadīs Deckname als Sairandhrī am Hof Virāṭas (zu unterscheiden vom gleichnamigen Fluss bei Kaṇvas Einsiedelei)."},{"term":"Mālyavant","desc":"Ein Berg im Gandhamādana-Gebirge, den die Pāṇḍavas auf ihrem Weg zur Einsiedelei Vṛṣaparvans passieren."},{"term":"Mānasa-See","category":"Ort","definition":"Ein sagenhafter, oft
