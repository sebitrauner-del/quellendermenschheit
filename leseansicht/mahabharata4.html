ṣīkeśo vinivārayiṣus tadā","Als er dann ebenso andere ringsum niederschlug, rannte Hṛṣīkeśa auf Yuyudhāna zu, ihn zurückhalten wollend.","",[["tathānyān api nighnantaṃ yuyudhānaṃ samantataḥ","als Yuyudhāna dann ebenso andere ringsum niederschlug (Adv. + Akk.Pl. + Akk.Part. + Akk. + Adv.)"],["abhyadhāvad dhṛṣīkeśo vinivārayiṣus tadā","rannte Hṛṣīkeśa herbei, ihn zurückhalten wollend (Impf. + Nom. + Nom.Desid.Part. + Adv.)"]]],["029","ekībhūtās tataḥ sarve kālaparyāyacoditāḥ bhojāndhakā mahārāja śaineyaṃ paryavārayan","Da umringten alle Bhojas und Andhakas, zusammen geeint, vom Wechsel der Zeit getrieben, o Großkönig, den Enkel Śinis.","",[["ekībhūtās tataḥ sarve kālaparyāyacoditāḥ","zusammen geeint, da alle, vom Wechsel der Zeit getrieben (Nom.Pl.Part.Perf. + Adv. + Nom.Pl. + Nom.Pl.Bahuvrīhi)"],["bhojāndhakā mahārāja śaineyaṃ paryavārayan","die Bhojas und Andhakas, o Großkönig, umringten den Enkel Śinis (Nom.Pl. + Vok. + Akk. + Impf.)"]]],["030","tān dṛṣṭvā patatas tūrṇam abhikruddhāñ janārdanaḥ na cukrodha mahātejā jānan kālasya paryayam","Als Janārdana, von großer Glutkraft, sie erblickte, wie sie zornentbrannt schnell heranstürzten, erzürnte er sich nicht, da er den Wandel der Zeit kannte.","",[["tān dṛṣṭvā patatas tūrṇam abhikruddhāñ janārdanaḥ","als Janārdana sie erblickte, wie sie zornentbrannt schnell heranstürzten (Akk.Pl. + Absol. + Akk.Pl.Part. + Adv. + Akk.Pl. + Nom.)"],["na cukrodha mahātejā jānan kālasya paryayam","erzürnte er sich nicht, von großer Glutkraft, da er den Wandel der Zeit kannte (Neg. + Perf. + Nom.Bahuvrīhi + Nom.Part. + Gen. + Akk.)"]]],["031","te tu pānamadāviṣṭāś coditāś caiva manyunā yuyudhānam athābhyaghnann ucchiṣṭair bhājanais tadā","Sie aber, von der Trunkenheit des Weines ergriffen und vom Zorn angetrieben, schlugen darauf auf Yuyudhāna mit den Resten zerbrochener Gefäße ein.","",[["te tu pānamadāviṣṭāś coditāś caiva manyunā","sie aber, von der Trunkenheit des Weines ergriffen und vom Zorn angetrieben (Nom.Pl. + Nom.Pl.Bahuvrīhi + Nom.Pl.Part.Perf.Pass. + Instr.)"],["yuyudhānam athābhyaghnann ucchiṣṭair bhājanais tadā","schlugen darauf auf Yuyudhāna mit den Resten der Gefäße ein (Akk. + Adv. + Impf. + Instr.Pl. + Instr.Pl. + Adv.)"]]],["032","hanyamāne tu śaineye kruddho rukmiṇinandanaḥ tadantaram upādhāvan mokṣayiṣyañ śineḥ sutam","Als aber der Enkel Śinis geschlagen wurde, rannte der zornentbrannte Sohn der Rukmiṇī in die Lücke hinein, in der Absicht, den Nachkommen Śinis zu befreien.","",[["hanyamāne tu śaineye kruddho rukmiṇinandanaḥ","als aber der Enkel Śinis geschlagen wurde, der zornentbrannte Sohn der Rukmiṇī (Lok.Part.Präs.Pass. + Adv. + Lok. + Nom.Bahuvrīhi + Nom.)"],["tadantaram upādhāvan mokṣayiṣyañ śineḥ sutam","rannte er in jene Lücke hinein, in der Absicht, den Nachkommen Śinis zu befreien (Akk. + Impf. + Nom.Desid.Part.Kaus. + Gen. + Akk.)"]]],["033","sa bhojaiḥ saha saṃyuktaḥ sātyakiś cāndhakaiḥ saha bahutvān nihatau tatra ubhau kṛṣṇasya paśyataḥ","Er, mit den Bhojas kämpfend, und Sātyaki mit den Andhakas kämpfend, wurden beide dort, wegen der großen Zahl der Angreifer, erschlagen, während Kṛṣṇa zusah.","",[["sa bhojaiḥ saha saṃyuktaḥ sātyakiś cāndhakaiḥ saha","er, mit den Bhojas verbunden im Kampf, und Sātyaki mit den Andhakas (Nom. + Instr.Pl. + Adv. + Nom.Part. + Nom. + Instr.Pl. + Adv.)"],["bahutvān nihatau tatra ubhau kṛṣṇasya paśyataḥ","wurden wegen der großen Zahl beide dort erschlagen, während Kṛṣṇa zusah (Abl. + Nom.Du.Part.Perf.Pass. + Adv. + Nom.Du. + Gen.Part.)"]]],["034","hataṃ dṛṣṭvā tu śaineyaṃ putraṃ ca yadunandanaḥ erakāṇāṃ tadā muṣṭiṃ kopāj jagrāha keśavaḥ","Als aber der Freudenbringer der Yadus sah, dass der Enkel Śinis und sein eigener Sohn erschlagen waren, ergriff Keśava da vor Zorn eine Handvoll Erakā-Schilfrohr.","",[["hataṃ dṛṣṭvā tu śaineyaṃ putraṃ ca yadunandanaḥ","als aber der Freudenbringer der Yadus sah, dass der Enkel Śinis und sein Sohn erschlagen waren (Akk. + Absol. + Adv. + Akk. + Akk. + Nom.)"],["erakāṇāṃ tadā muṣṭiṃ kopāj jagrāha keśavaḥ","ergriff Keśava da vor Zorn eine Handvoll Erakā-Schilfrohr (Gen.Pl. + Adv. + Akk. + Abl. + Perf. + Nom.)"]]],["035","tad abhūn musalaṃ ghoraṃ vajrakalpam ayomayam jaghāna tena kṛṣṇas tān ye 'sya pramukhato 'bhavan","Dieses wurde zu einer furchtbaren Keule, dem Blitz gleich, aus Eisen; mit ihr schlug Kṛṣṇa jene nieder, die vor ihm standen.","",[["tad abhūn musalaṃ ghoraṃ vajrakalpam ayomayam","dieses wurde zu einer furchtbaren Keule, dem Blitz gleich, aus Eisen (Nom. + Impf. + Nom. + Nom. + Nom. + Nom.)"],["jaghāna tena kṛṣṇas tān ye 'sya pramukhato 'bhavan","mit ihr schlug Kṛṣṇa jene nieder, die vor ihm standen (Perf. + Instr. + Nom. + Akk.Pl. + Nom.Pl. + Gen. + Adv. + Impf.)"]]],["036","tato 'ndhakāś ca bhojāś ca śaineyā vṛṣṇayas tathā jaghnur anyonyam ākrande musalaiḥ kālacoditāḥ","Da schlugen die Andhakas, die Bhojas, die Nachkommen Śinis und ebenso die Vṛṣṇis, vom Schicksal getrieben, einander im Getümmel mit Keulen.","",[["tato 'ndhakāś ca bhojāś ca śaineyā vṛṣṇayas tathā","da die Andhakas, die Bhojas, die Nachkommen Śinis und ebenso die Vṛṣṇis (Adv. + Nom.Pl. + Nom.Pl. + Nom.Pl. + Nom.Pl. + Adv.)"],["jaghnur anyonyam ākrande musalaiḥ kālacoditāḥ","schlugen einander im Getümmel mit Keulen, vom Schicksal getrieben (Perf. + Akk. + Lok. + Instr.Pl. + Nom.Pl.Bahuvrīhi)"]]],["037","yas teṣām erakāṃ kaś cij jagrāha ruṣito nṛpa vajrabhūteva sā rājann adṛśyata tadā vibho","Welcher von ihnen auch immer, erzürnt, o König, ein Erakā-Schilfrohr ergriff - jenes erschien damals wie zu einem Blitz geworden, o Herrscher, o Gebieter.","",[["yas teṣām erakāṃ kaś cij jagrāha ruṣito nṛpa","welcher von ihnen auch immer, erzürnt, ein Erakā-Schilfrohr ergriff, o König (Nom. + Gen.Pl. + Akk. + Nom. + Perf. + Nom.Part.Perf.Pass. + Vok.)"],["vajrabhūteva sā rājann adṛśyata tadā vibho","jenes erschien damals wie zu einem Blitz geworden, o Herrscher, o Gebieter (Nom.Bahuvrīhi + Adv. + Nom. + Vok. + Impf.Pass. + Adv. + Vok.)"]]],["038","tṛṇaṃ ca musalībhūtam api tatra vyadṛśyata brahmadaṇḍakṛtaṃ sarvam iti tad viddhi pārthiva","Und auch Gras wurde dort zu einer Keule geworden gesehen; wisse, o Herrscher der Erde, dies alles war durch den Brahmanenstab-Fluch bewirkt.","",[["tṛṇaṃ ca musalībhūtam api tatra vyadṛśyata","und auch Gras wurde dort zu einer Keule geworden gesehen (Nom. + Nom.Part.Perf. + Adv. + Adv. + Impf.Pass.)"],["brahmadaṇḍakṛtaṃ sarvam iti tad viddhi pārthiva","wisse: dies alles war durch den Brahmanenstab-Fluch bewirkt, o Herrscher der Erde (Akk. + Akk. + Adv. + Akk. + Imp. + Vok.)"]]],["039","āvidhyāvidhya te rājan prakṣipanti sma yat tṛṇam tad vajrabhūtaṃ musalaṃ vyadṛśyata tadā dṛḍham","Welches Gras auch immer sie, o König, wieder und wieder schwingend, warfen - das erschien dann als feste, zu einem Blitz gewordene Keule.","",[["āvidhyāvidhya te rājan prakṣipanti sma yat tṛṇam","welches Gras auch immer sie, o König, wieder und wieder schwingend, warfen (Absol.Wiederh. + Nom.Pl. + Vok. + Präs. + Partikel + Akk. + Akk.)"],["tad vajrabhūtaṃ musalaṃ vyadṛśyata tadā dṛḍham","das erschien dann als feste, zu einem Blitz gewordene Keule (Nom. + Nom. + Nom. + Impf.Pass. + Adv. + Nom.)"]]],["040","avadhīt pitaraṃ putraḥ pitā putraṃ ca bhārata mattāḥ paripatanti sma pothayantaḥ parasparam","Der Sohn erschlug den Vater, und der Vater den Sohn, o Bhārata; trunken stürzten sie umher, einander niederschlagend.","",[["avadhīt pitaraṃ putraḥ pitā putraṃ ca bhārata","der Sohn erschlug den Vater, und der Vater den Sohn, o Bhārata (Impf. + Akk. + Nom. + Nom. + Akk. + Vok.)"],["mattāḥ paripatanti sma pothayantaḥ parasparam","trunken stürzten sie umher, einander niederschlagend (Nom.Pl.Part.Perf.Pass. + Präs. + Partikel + Nom.Pl.Part. + Akk.)"]]],["041","pataṃgā iva cāgnau te nyapatan kukurāndhakāḥ nāsīt palāyane buddhir vadhyamānasya kasya cit","Wie Nachtfalter ins Feuer fielen die Kukuras und Andhakas; keinem von denen, die niedergeschlagen wurden, kam der Gedanke an Flucht.","",[["pataṃgā iva cāgnau te nyapatan kukurāndhakāḥ","wie Nachtfalter ins Feuer fielen die Kukuras und Andhakas (Nom.Pl. + Adv. + Lok. + Nom.Pl. + Impf. + Nom.Pl.)"],["nāsīt palāyane buddhir vadhyamānasya kasya cit","keinem von denen, die niedergeschlagen wurden, kam der Gedanke an Flucht (Neg.+Impf. + Lok. + Nom. + Gen.Part.Präs.Pass. + Gen. + Adv.)"]]],["042","taṃ tu paśyan mahābāhur jānan kālasya paryayam musalaṃ samavaṣṭabhya tasthau sa madhusūdanaḥ","Dies aber sehend, der Großarmige, den Wandel der Zeit erkennend, stand Madhusūdana da, seine Keule fest umklammernd.","",[["taṃ tu paśyan mahābāhur jānan kālasya paryayam","dies aber sehend, der Großarmige, den Wandel der Zeit erkennend (Akk. + Adv. + Nom.Part. + Nom.Bahuvrīhi + Nom.Part. + Gen. + Akk.)"],["musalaṃ samavaṣṭabhya tasthau sa madhusūdanaḥ","stand er, Madhusūdana, da, seine Keule fest umklammernd (Akk. + Absol. + Perf. + Nom. + Nom.)"]]],["043","sāmbaṃ ca nihataṃ dṛṣṭvā cārudeṣṇaṃ ca mādhavaḥ pradyumnaṃ cāniruddhaṃ ca tataś cukrodha bhārata","Als er Sāmba erschlagen sah, und Cārudeṣṇa, und Pradyumna und Aniruddha, geriet Mādhava da in Zorn, o Bhārata.","",[["sāmbaṃ ca nihataṃ dṛṣṭvā cārudeṣṇaṃ ca mādhavaḥ","als Mādhava Sāmba erschlagen sah, und Cārudeṣṇa (Akk. + Akk. + Absol. + Akk. + Nom.)"],["pradyumnaṃ cāniruddhaṃ ca tataś cukrodha bhārata","und Pradyumna und Aniruddha, geriet er da in Zorn, o Bhārata (Akk. + Akk. + Adv. + Perf. + Vok.)"]]],["044","gadaṃ vīkṣya śayānaṃ ca bhṛśaṃ kopasamanvitaḥ sa niḥśeṣaṃ tadā cakre śārṅgacakragadādharaḥ","Als er Gada daliegen sah, von heftigem Zorn erfüllt, machte er, der Träger von Śārṅga-Bogen, Diskus und Keule, da ein restloses Ende.","",[["gadaṃ vīkṣya śayānaṃ ca bhṛśaṃ kopasamanvitaḥ","als er Gada daliegen sah, von heftigem Zorn erfüllt (Akk. + Absol. + Akk.Part. + Adv. + Nom.Bahuvrīhi)"],["sa niḥśeṣaṃ tadā cakre śārṅgacakragadādharaḥ","machte er, der Träger von Śārṅga-Bogen, Diskus und Keule, da ein restloses Ende (Nom. + Akk. + Adv. + Perf.Med. + Nom.Bahuvrīhi)"]]],["045","taṃ nighnantaṃ mahātejā babhruḥ parapuraṃjayaḥ dārukaś caiva dāśārham ūcatur yan nibodha tat","Zu ihm, der so niederschlug, sprachen der große Glutkraft besitzende Babhru, Bezwinger feindlicher Städte, und Dāruka - zum Nachkommen des Daśārha - höre, was das war:","",[["taṃ nighnantaṃ mahātejā babhruḥ parapuraṃjayaḥ","zu ihm, der so niederschlug, der große Glutkraft besitzende Babhru, Bezwinger feindlicher Städte (Akk. + Akk.Part. + Nom.Bahuvrīhi + Nom. + Nom.Bahuvrīhi)"],["dārukaś caiva dāśārham ūcatur yan nibodha tat","und Dāruka sprachen zum Nachkommen des Daśārha - höre, was das war (Nom. + Akk. + Perf.Du. + Akk. + Imp. + Akk.)"]]],["046","bhagavan saṃhṛtaṃ sarvaṃ tvayā bhūyiṣṭham acyuta rāmasya padam anviccha tatra gacchāma yatra saḥ","„O Erhabener, fast alles ist nun von dir vernichtet worden, Unfehlbarer; suche die Spur Rāmas - lass uns dorthin gehen, wo er ist.“","",[["bhagavan saṃhṛtaṃ sarvaṃ tvayā bhūyiṣṭham acyuta","o Erhabener, fast alles ist von dir vernichtet worden, Unfehlbarer (Vok. + Nom.Part.Perf.Pass. + Nom. + Instr. + Adv. + Vok.)"],["rāmasya padam anviccha tatra gacchāma yatra saḥ","suche die Spur Rāmas - lass uns dorthin gehen, wo er ist (Gen. + Akk. + Imp. + Adv. + Präs.Konj. + Rel.Adv. + Nom.)"]]]]},{"num":5,"title_sa":"","title_de":"Balarāmas und Kṛṣṇas Heimgang","note":"Dāruka, Keśava und Babhru finden Balarāma versunken in Meditation; Kṛṣṇa sendet Dāruka mit der Nachricht an Arjuna (V002-003, CQ) und schickt Babhru zum Schutz der Frauen (V004, CQ) - Babhru wird jedoch unterwegs von einem verirrten, fluchbeladenen Musala-Geschoss eines Jägers getötet. Kṛṣṇa bittet Balarāma zu warten (V006, CQ), kehrt kurz nach Dvārakā zurück und kündigt seinem Vater Vasudeva an, mit Balarāma in den Wald zu gehen und Askese zu üben (V007-009, CQ), tröstet die klagenden Frauen mit dem Hinweis auf Arjunas kommende Ankunft (V011, CQ). Balarāma verlässt seinen Körper in Gestalt einer großen weißen Schlange, die ins Meer eingeht und von den Nāga-Fürsten und Varuṇa empfangen wird. Kṛṣṇa selbst, sich an Gāndhārīs Fluch und eine ältere Durvāsas-Episode erinnernd, begibt sich in Yoga-Versenkung; der Jäger Jara durchbohrt ihn irrtümlich an der Fußsohle, worauf Kṛṣṇa ihn tröstet und, Himmel und Erde mit seinem Glanz erfüllend, zu seinem eigenen unermesslichen Ort auffährt, von Göttern, Weisen und Gandharvas empfangen.","units":[["001","vaiśaṃpāyana uvāca tato yayur dārukaḥ keśavaś ca babhruś ca rāmasya padaṃ patantaḥ athāpaśyan rāmam anantavīryaṃ vṛkṣe sthitaṃ cintayānaṃ vivikte","Vaiśaṃpāyana sprach: Da gingen Dāruka, Keśava und Babhru, der Spur Rāmas folgend; und sie erblickten Rāma von unendlicher Kraft, an einem Baum stehend, in der Einsamkeit nachsinnend.","",[["vaiśaṃpāyana uvāca tato yayur dārukaḥ keśavaś ca babhruś ca rāmasya padaṃ patantaḥ","Vaiśaṃpāyana sprach: da gingen Dāruka, Keśava und Babhru, der Spur Rāmas folgend (Nom. + Adv. + Perf. + Nom. + Nom. + Nom. + Gen. + Akk. + Nom.Pl.Part.)"],["athāpaśyan rāmam anantavīryaṃ vṛkṣe sthitaṃ cintayānaṃ vivikte","und sie erblickten Rāma von unendlicher Kraft, an einem Baum stehend, in der Einsamkeit nachsinnend (Adv. + Impf. + Akk. + Akk.Bahuvrīhi + Lok. + Akk.Part. + Akk.Part. + Lok.)"]]],["002","tataḥ samāsādya mahānubhāvaḥ kṛṣṇas tadā dārukam anvaśāsat gatvā kurūñ śīghram imaṃ mahāntaṃ pārthāya śaṃsasva vadhaṃ yadūnām","Da, herangetreten, befahl der Hochherzige, Kṛṣṇa, damals dem Dāruka: „Geh schnell zu den Kurus, und verkünde dem Pārtha dieses gewaltige Gemetzel der Yadus -","",[["tataḥ samāsādya mahānubhāvaḥ kṛṣṇas tadā dārukam anvaśāsat","da, herangetreten, befahl der Hochherzige, Kṛṣṇa, damals dem Dāruka (Adv. + Absol. + Nom.Bahuvrīhi + Nom. + Adv. + Akk. + Impf.)"],["gatvā kurūñ śīghram imaṃ mahāntaṃ pārthāya śaṃsasva vadhaṃ yadūnām","geh schnell zu den Kurus, und verkünde dem Pārtha dieses gewaltige Gemetzel der Yadus (Absol. + Akk.Pl. + Adv. + Akk. + Akk. + Dat. + Imp. + Akk. + Gen.Pl.)"]]],["003","tato 'rjunaḥ kṣipram ihopayātu śrutvā mṛtān yādavān brahmaśāpāt ity evam uktaḥ sa yayau rathena kurūṃs tadā dāruko naṣṭacetāḥ","dann soll Arjuna, sobald er gehört hat, dass die Yādavas durch den Brahmanenfluch gestorben sind, eilig hierher kommen.“ So angesprochen, fuhr Dāruka, seines Sinnes beraubt, damals mit dem Wagen zu den Kurus.","",[["tato 'rjunaḥ kṣipram ihopayātu śrutvā mṛtān yādavān brahmaśāpāt","dann soll Arjuna eilig hierher kommen, sobald er gehört hat, dass die Yādavas durch den Brahmanenfluch gestorben sind (Adv. + Nom. + Adv. + Adv.+Imp. + Absol. + Akk.Pl. + Akk.Pl. + Abl.)"],["ity evam uktaḥ sa yayau rathena kurūṃs tadā dāruko naṣṭacetāḥ","so angesprochen, fuhr Dāruka, seines Sinnes beraubt, damals mit dem Wagen zu den Kurus (Adv. + Adv. + Nom.Part.Perf.Pass. + Nom. + Perf. + Instr. + Akk.Pl. + Adv. + Nom. + Nom.Bahuvrīhi)"]]],["004","tato gate dāruke keśavo 'tha dṛṣṭvāntike babhrum uvāca vākyam striyo bhavān rakṣatu yātu śīghraṃ naitā hiṃsyur dasyavo vittalobhāt","Da, nachdem Dāruka gegangen war, sprach Keśava, als er Babhru in der Nähe erblickte, ein Wort: „Du sollst die Frauen beschützen; geh eilig, damit sie nicht von Räubern aus Gier nach Reichtum verletzt werden.“","",[["tato gate dāruke keśavo 'tha dṛṣṭvāntike babhrum uvāca vākyam","da, nachdem Dāruka gegangen war, sprach Keśava, als er Babhru in der Nähe erblickte, ein Wort (Adv. + Lok.Absol.Part.Perf. + Lok. + Nom. + Adv. + Absol. + Adv. + Akk. + Impf. + Akk.)"],["striyo bhavān rakṣatu yātu śīghraṃ naitā hiṃsyur dasyavo vittalobhāt","du sollst die Frauen beschützen; geh eilig, damit sie nicht von Räubern aus Gier nach Reichtum verletzt werden (Akk.Pl. + Nom. + Imp. + Imp. + Adv. + Neg.+Akk.Pl. + Opt. + Nom.Pl. + Abl.Bahuvrīhi)"]]],["005","sa prasthitaḥ keśavenānuśiṣṭo madāturo jñātivadhārditaś ca taṃ vai yāntaṃ saṃnidhau keśavasya tvarantam ekaṃ sahasaiva babhrum brahmānuśaptam avadhīn mahad vai kūṭonmuktaṃ musalaṃ lubdhakasya","Er, von Keśava unterwiesen, brach auf, vom Rausch geschwächt und vom Verwandtenmord gequält; ihn, wie er eilig, allein, sogleich in Keśavas Nähe fortging - jenen Babhru tötete die große, vom Brahmanenfluch verwünschte, aus der Falle eines Jägers abgeschossene Keule.","[?] genauer Mechanismus (\"kūṭonmuktam\", \"aus einer Falle/Schlinge abgeschossen\") unsicher - wohl ein aus den ins Meer geworfenen Musala-Überresten entstandenes Geschoss, das Babhru versehentlich durch einen Jäger trifft, als Vorausdeutung auf Kṛṣṇas eigenen Tod (V019-020).",[["sa prasthitaḥ keśavenānuśiṣṭo madāturo jñātivadhārditaś ca","er, von Keśava unterwiesen, brach auf, vom Rausch geschwächt und vom Verwandtenmord gequält (Nom. + Nom.Part.Perf. + Nom.Part.Perf.Pass. + Nom.Bahuvrīhi + Nom.Bahuvrīhi)"],["taṃ vai yāntaṃ saṃnidhau keśavasya tvarantam ekaṃ sahasaiva babhrum brahmānuśaptam avadhīn mahad vai kūṭonmuktaṃ musalaṃ lubdhakasya","ihn, Babhru, wie er eilig, allein, sogleich in Keśavas Nähe fortging - tötete die große, vom Brahmanenfluch verwünschte, aus der Falle eines Jägers abgeschossene Keule (Akk. + Adv. + Akk.Part. + Lok. + Gen. + Akk.Part. + Akk. + Adv. + Akk. + Akk.Bahuvrīhi + Impf. + Akk. + Adv. + Akk.Bahuvrīhi + Akk. + Gen.)"]]],["006","tato dṛṣṭvā nihataṃ babhrum āha kṛṣṇo vākyaṃ bhrātaram agrajaṃ tu ihaiva tvaṃ māṃ pratīkṣasva rāma yāvat striyo jñātivaśāḥ karomi","Als er sah, dass Babhru erschlagen war, sprach Kṛṣṇa ein Wort zu seinem älteren Bruder: „Hier eben warte auf mich, Rāma, bis ich die Frauen in die Obhut der Verwandten gebe.“","",[["tato dṛṣṭvā nihataṃ babhrum āha kṛṣṇo vākyaṃ bhrātaram agrajaṃ tu","als er sah, dass Babhru erschlagen war, sprach Kṛṣṇa ein Wort zu seinem älteren Bruder (Adv. + Absol. + Akk. + Akk. + Impf. + Nom. + Akk. + Akk. + Akk. + Adv.)"],["ihaiva tvaṃ māṃ pratīkṣasva rāma yāvat striyo jñātivaśāḥ karomi","hier eben warte auf mich, Rāma, bis ich die Frauen in die Obhut der Verwandten gebe (Adv. + Nom. + Akk. + Imp. + Vok. + Adv. + Akk.Pl. + Akk.Pl.Bahuvrīhi + Präs.)"]]],["007","tataḥ purīṃ dvāravatīṃ praviśya janārdanaḥ pitaraṃ prāha vākyam striyo bhavān rakṣatu naḥ samagrā dhanaṃjayasyāgamanaṃ pratīkṣan rāmo vanānte pratipālayan mām āste 'dyāhaṃ tena samāgamiṣye","Da, nachdem er die Stadt Dvāravatī betreten hatte, sprach Janārdana ein Wort zu seinem Vater: „Du sollst all unsere Frauen beschützen; Rāma weilt am Waldrand, das Kommen des Dhanaṃjaya erwartend, auf mich wartend - ich werde heute mit ihm zusammentreffen.","",[["tataḥ purīṃ dvāravatīṃ praviśya janārdanaḥ pitaraṃ prāha vākyam","da, nachdem er die Stadt Dvāravatī betreten hatte, sprach Janārdana ein Wort zu seinem Vater (Adv. + Akk. + Akk. + Absol. + Nom. + Akk. + Perf. + Akk.)"],["striyo bhavān rakṣatu naḥ samagrā dhanaṃjayasyāgamanaṃ pratīkṣan rāmo vanānte pratipālayan mām āste 'dyāhaṃ tena samāgamiṣye","du sollst all unsere Frauen beschützen; Rāma weilt am Waldrand, das Kommen des Dhanaṃjaya erwartend, auf mich wartend - ich werde heute mit ihm zusammentreffen (Akk.Pl. + Nom. + Imp. + Gen. + Akk.Pl.Bahuvrīhi + Gen. + Akk. + Nom.Part. + Nom. + Lok. + Nom.Part. + Akk. + Präs. + Adv. + Nom. + Instr. + Fut.Med.)"]]],["008","dṛṣṭaṃ mayedaṃ nidhanaṃ yadūnāṃ rājñāṃ ca pūrvaṃ kurupuṃgavānām nāhaṃ vinā yadubhir yādavānāṃ purīm imāṃ draṣṭum ihādya śaktaḥ","Gesehen habe ich nun diesen Untergang der Yadus, wie zuvor den der Könige, der Stiere der Kurus; ich vermag es nicht, ohne die Yadus diese Stadt der Yādavas heute hier weiterhin zu sehen.","",[["dṛṣṭaṃ mayedaṃ nidhanaṃ yadūnāṃ rājñāṃ ca pūrvaṃ kurupuṃgavānām","gesehen habe ich nun diesen Untergang der Yadus, wie zuvor den der Könige, der Stiere der Kurus (Nom.Part.Perf.Pass. + Instr. + Nom. + Gen.Pl. + Gen.Pl. + Adv. + Gen.Pl.)"],["nāhaṃ vinā yadubhir yādavānāṃ purīm imāṃ draṣṭum ihādya śaktaḥ","ich vermag es nicht, ohne die Yadus, diese Stadt der Yādavas heute hier weiterhin zu sehen (Neg.+Nom. + Präp. + Instr.Pl. + Gen.Pl. + Akk. + Akk. + Inf. + Adv. + Adv. + Nom.)"]]],["009","tapaś cariṣyāmi nibodha tan me rāmeṇa sārdhaṃ vanam abhyupetya itīdam uktvā śirasāsya pādau saṃspṛśya kṛṣṇas tvarito jagāma","Nachdem ich, zusammen mit Rāma, in den Wald gegangen bin, werde ich Askese üben - dies vernimm von mir.“ Nachdem er dies gesagt und mit dem Haupt die Füße seines Vaters berührt hatte, ging Kṛṣṇa eilig fort.","",[["tapaś cariṣyāmi nibodha tan me rāmeṇa sārdhaṃ vanam abhyupetya","Askese werde ich üben, zusammen mit Rāma, nachdem ich in den Wald gegangen bin - dies vernimm von mir (Akk. + Fut. + Imp. + Akk. + Dat. + Instr. + Adv. + Akk. + Absol.)"],["itīdam uktvā śirasāsya pādau saṃspṛśya kṛṣṇas tvarito jagāma","nachdem er dies gesagt und mit dem Haupt die Füße seines Vaters berührt hatte, ging Kṛṣṇa eilig fort (Adv. + Absol. + Instr. + Gen. + Akk.Du. + Absol. + Nom. + Nom.Part.Perf.Pass. + Perf.)"]]],["010","tato mahān ninadaḥ prādurāsīt sastrīkumārasya purasya tasya athābravīt keśavaḥ saṃnivartya śabdaṃ śrutvā yoṣitāṃ krośatīnām","Da erhob sich ein gewaltiger Lärm jener Stadt, samt ihren Frauen und Kindern; als er den Klang der schreienden Frauen gehört hatte, wandte sich Keśava um und sprach:","",[["tato mahān ninadaḥ prādurāsīt sastrīkumārasya purasya tasya","da erhob sich ein gewaltiger Lärm jener Stadt, samt ihren Frauen und Kindern (Adv. + Nom. + Nom. + Impf. + Gen.Bahuvrīhi + Gen. + Gen.)"],["athābravīt keśavaḥ saṃnivartya śabdaṃ śrutvā yoṣitāṃ krośatīnām","als er den Klang der schreienden Frauen gehört hatte, wandte sich Keśava um und sprach (Adv. + Impf. + Nom. + Absol. + Akk. + Absol. + Gen.Pl. + Gen.Pl.Part.)"]]],["011","purīm imām eṣyati savyasācī sa vo duḥkhān mocayitā narāgryaḥ tato gatvā keśavas taṃ dadarśa rāmaṃ vane sthitam ekaṃ vivikte","„Savyasācin wird zu dieser Stadt kommen; er, der Beste der Männer, wird euch von eurem Leid befreien.“ Da, fortgegangen, erblickte Keśava jenen Rāma, im Wald einsam an einer Stelle weilend.","",[["purīm imām eṣyati savyasācī sa vo duḥkhān mocayitā narāgryaḥ","Savyasācin wird zu dieser Stadt kommen; er, der Beste der Männer, wird euch von eurem Leid befreien (Akk. + Akk. + Fut. + Nom. + Nom. + Gen.Pl. + Akk.Pl. + Nom. + Nom.)"],["tato gatvā keśavas taṃ dadarśa rāmaṃ vane sthitam ekaṃ vivikte","da, fortgegangen, erblickte Keśava jenen Rāma, im Wald einsam an einer Stelle weilend (Adv. + Absol. + Nom. + Akk. + Perf. + Akk. + Lok. + Akk.Part. + Akk. + Lok.)"]]],["012","athāpaśyad yogayuktasya tasya nāgaṃ mukhān niḥsarantaṃ mahāntam śvetaṃ yayau sa tataḥ prekṣyamāṇo mahārṇavo yena mahānubhāvaḥ","Da sah er, wie aus dem Mund jenes in Yoga-Vertiefung Befindlichen eine große, weiße Schlange hervortrat; sie zog fort, während er zusah - dorthin, wohin der große Ozean, der Hochherzige, ihr entgegenkam.","",[["athāpaśyad yogayuktasya tasya nāgaṃ mukhān niḥsarantaṃ mahāntam","da sah er, wie aus dem Mund jenes in Yoga-Vertiefung Befindlichen eine große Schlange hervortrat (Adv. + Impf. + Gen. + Gen. + Akk. + Abl. + Akk.Part. + Akk.)"],["śvetaṃ yayau sa tataḥ prekṣyamāṇo mahārṇavo yena mahānubhāvaḥ","weiß, sie zog fort, während er zusah, dorthin wohin der große Ozean, der Hochherzige (Akk. + Perf. + Nom. + Adv. + Nom.Part.Präs.Pass. + Nom. + Rel.Adv. + Nom.Bahuvrīhi)"]]],["013","sahasraśīrṣaḥ parvatābhogavarṣmā raktānanaḥ svāṃ tanuṃ tāṃ vimucya samyak ca taṃ sāgaraḥ pratyagṛhṇān nāgā divyāḥ saritaś caiva puṇyāḥ","Tausendköpfig, von der Gestalt eines gewundenen Berges, rotmäulig - nachdem sie ihren Körper völlig verlassen hatte, nahm das Meer sie ordnungsgemäß auf, sowie göttliche Schlangen und heilige Flüsse.","",[["sahasraśīrṣaḥ parvatābhogavarṣmā raktānanaḥ svāṃ tanuṃ tāṃ vimucya samyak ca","tausendköpfig, von der Gestalt eines gewundenen Berges, rotmäulig, nachdem sie ihren Körper völlig verlassen hatte (Nom.Bahuvrīhi + Nom.Bahuvrīhi + Nom.Bahuvrīhi + Akk. + Akk. + Akk. + Absol. + Adv.)"],["taṃ sāgaraḥ pratyagṛhṇān nāgā divyāḥ saritaś caiva puṇyāḥ","nahm sie das Meer auf, sowie göttliche Schlangen und heilige Flüsse (Akk. + Nom. + Impf. + Nom.Pl. + Nom.Pl. + Nom.Pl. + Nom.Pl.)"]]],["014","karkoṭako vāsukis takṣakaś ca pṛthuśravā varuṇaḥ kuñjaraś ca miśrī śaṅkhaḥ kumudaḥ puṇḍarīkas tathā nāgo dhṛtarāṣṭro mahātmā","Karkoṭaka, Vāsuki und Takṣaka, Pṛthuśravas, Varuṇa und Kuñjara, Miśrī, Śaṅkha, Kumuda und Puṇḍarīka, sowie der großherzige Schlangenfürst Dhṛtarāṣṭra.","\"Dhṛtarāṣṭra\" hier ein gleichnamiger Nāga-Fürst, nicht der blinde König.",[["karkoṭako vāsukis takṣakaś ca pṛthuśravā varuṇaḥ kuñjaraś ca","Karkoṭaka, Vāsuki und Takṣaka, Pṛthuśravas, Varuṇa und Kuñjara (Nom. + Nom. + Nom. + Nom. + Nom. + Nom.)"],["miśrī śaṅkhaḥ kumudaḥ puṇḍarīkas tathā nāgo dhṛtarāṣṭro mahātmā","Miśrī, Śaṅkha, Kumuda und Puṇḍarīka, sowie der großherzige Schlangenfürst Dhṛtarāṣṭra (Nom. + Nom. + Nom. + Nom. + Adv. + Nom. + Nom. + Nom.)"]]],["015","hrādaḥ krāthaḥ śitikaṇṭho 'gratejās tathā nāgau cakramandātiṣaṇḍau nāgaśreṣṭho durmukhaś cāmbarīṣaḥ svayaṃ rājā varuṇaś cāpi rājan pratyudgamya svāgatenābhyanandaṃs te 'pūjayaṃś cārghyapādyakriyābhiḥ","Hrāda, Krātha, Śitikaṇṭha von höchster Glutkraft, und die beiden Schlangen Cakramanda und Atiṣaṇḍa, der beste der Schlangen Durmukha und Ambarīṣa, und selbst der König Varuṇa, o König - sie traten ihm entgegen, hießen ihn mit Willkommensgruß willkommen und ehrten ihn mit den Handlungen der Ehrengabe und Fußwaschung.","",[["hrādaḥ krāthaḥ śitikaṇṭho 'gratejās tathā nāgau cakramandātiṣaṇḍau","Hrāda, Krātha, Śitikaṇṭha von höchster Glutkraft, und die beiden Schlangen Cakramanda und Atiṣaṇḍa (Nom. + Nom. + Nom. + Nom.Bahuvrīhi + Adv. + Nom.Du. + Nom.Du.)"],["nāgaśreṣṭho durmukhaś cāmbarīṣaḥ svayaṃ rājā varuṇaś cāpi rājan pratyudgamya svāgatenābhyanandaṃs te 'pūjayaṃś cārghyapādyakriyābhiḥ","der beste der Schlangen Durmukha und Ambarīṣa, und selbst König Varuṇa, o König - sie traten entgegen, hießen willkommen und ehrten ihn mit Ehrengabe und Fußwaschung (Nom. + Nom. + Nom. + Adv. + Nom. + Nom. + Adv. + Vok. + Absol. + Instr. + Impf. + Nom.Pl. + Impf. + Instr.Pl.)"]]],["016","tato gate bhrātari vāsudevo jānan sarvā gatayo divyadṛṣṭiḥ vane śūnye vicaraṃś cintayāno bhūmau tataḥ saṃviveśāgryatejāḥ","Als der Bruder so gegangen war, legte sich Vāsudeva, der alle Weltordnungen kannte, von göttlicher Sehkraft, nachdem er in dem leeren Wald umhergewandert und nachgedacht hatte, darauf auf die Erde nieder, er von höchster Glutkraft.","",[["tato gate bhrātari vāsudevo jānan sarvā gatayo divyadṛṣṭiḥ","als der Bruder so gegangen war, Vāsudeva, der alle Weltordnungen kannte, von göttlicher Sehkraft (Adv. + Lok.Absol. + Lok. + Nom. + Nom.Part. + Akk.Pl. + Akk.Pl. + Nom.Bahuvrīhi)"],["vane śūnye vicaraṃś cintayāno bhūmau tataḥ saṃviveśāgryatejāḥ","nachdem er in dem leeren Wald umhergewandert und nachgedacht hatte, legte er sich darauf auf die Erde nieder, von höchster Glutkraft (Lok. + Lok. + Nom.Part. + Nom.Part. + Lok. + Adv. + Perf. + Nom.Bahuvrīhi)"]]],["017","sarvaṃ hi tena prāk tadā vittam āsīd gāndhāryā yad vākyam uktaḥ sa pūrvam durvāsasā pāyasocchiṣṭalipte yac cāpy uktaṃ tac ca sasmāra kṛṣṇaḥ","Denn alles war ihm ja zuvor schon bekannt gewesen: was Gāndhārī ihm einst zugesprochen hatte, und auch, was Durvāsas gesagt hatte, als er mit dem Rest des Milchreis beschmiert war - daran erinnerte sich Kṛṣṇa.","Bezug auf eine ältere, hier nicht ausgeführte Erzählung, in der der launische Asket Durvāsas Kṛṣṇa mit Milchreis-Resten beschmiert und ihm eine Prophezeiung über seine Verwundbarkeit (an der Fußsohle) macht - erklärt die Todesart in V019-020.",[["sarvaṃ hi tena prāk tadā vittam āsīd gāndhāryā yad vākyam uktaḥ","denn alles war ihm ja zuvor schon bekannt gewesen: was Gāndhārī als Wort gesagt worden war (Nom. + Partikel + Instr. + Adv. + Adv. + Nom.Part.Perf.Pass. + Impf. + Instr. + Akk. + Akk. + Nom.Part.Perf.Pass.)"],["sa pūrvam durvāsasā pāyasocchiṣṭalipte yac cāpy uktaṃ tac ca sasmāra kṛṣṇaḥ","und was Durvāsas einst gesagt hatte, als er mit dem Rest des Milchreis beschmiert war - daran erinnerte sich Kṛṣṇa (Nom. + Adv. + Instr. + Lok.Bahuvrīhi + Akk. + Akk. + Nom.Part.Perf.Pass. + Akk. + Perf. + Nom.)"]]],["018","sa cintayāno 'ndhakavṛṣṇināśaṃ kurukṣayaṃ caiva mahānubhāvaḥ mene tataḥ saṃkramaṇasya kālaṃ tataś cakārendriyasaṃnirodham","Er, der Hochherzige, an den Untergang der Andhakas und Vṛṣṇis denkend, und ebenso an den der Kurus, erkannte da die Zeit des Hinübergangs und vollzog darauf die Zurückhaltung der Sinne.","",[["sa cintayāno 'ndhakavṛṣṇināśaṃ kurukṣayaṃ caiva mahānubhāvaḥ","er, der Hochherzige, an den Untergang der Andhakas und Vṛṣṇis denkend, und ebenso an den der Kurus (Nom. + Nom.Part. + Akk. + Akk. + Adv. + Nom.Bahuvrīhi)"],["mene tataḥ saṃkramaṇasya kālaṃ tataś cakārendriyasaṃnirodham","erkannte da die Zeit des Hinübergangs und vollzog darauf die Zurückhaltung der Sinne (Perf.Med. + Adv. + Gen. + Akk. + Adv. + Perf. + Akk.)"]]],["019","sa saṃniruddhendriyavāṅmanās tu śiśye mahāyogam upetya kṛṣṇaḥ jarātha taṃ deśam upājagāma lubdhas tadānīṃ mṛgalipsur ugraḥ","Er aber, Sinne, Sprache und Geist zurückgehalten, Kṛṣṇa, legte sich nieder, nachdem er zum großen Yoga übergegangen war; da kam Jara, jener wilde Jäger, damals nach Wild verlangend, in jene Gegend.","",[["sa saṃniruddhendriyavāṅmanās tu śiśye mahāyogam upetya kṛṣṇaḥ","er aber, Sinne, Sprache und Geist zurückgehalten, Kṛṣṇa, legte sich nieder, nachdem er zum großen Yoga übergegangen war (Nom. + Nom.Bahuvrīhi + Adv. + Perf.Med. + Akk. + Absol. + Nom.)"],["jarātha taṃ deśam upājagāma lubdhas tadānīṃ mṛgalipsur ugraḥ","da kam Jara, jener wilde Jäger, damals nach Wild verlangend, in jene Gegend (Nom. + Adv. + Akk. + Perf. + Nom. + Adv. + Nom.Bahuvrīhi + Nom.)"]]],["020","sa keśavaṃ yogayuktaṃ śayānaṃ mṛgāśaṅkī lubdhakaḥ sāyakena jarāvidhyat pādatale tvarāvāṃs taṃ cābhitas taj jighṛkṣur jagāma athāpaśyat puruṣaṃ yogayuktaṃ pītāmbaraṃ lubdhako 'nekabāhum","Den in Yoga versunkenen, daliegenden Keśava durchbohrte, ihn für ein Wild haltend, der Jäger Jara mit einem Pfeil an der Fußsohle; eilig ging er, ihn ergreifen wollend, auf ihn zu - da erblickte der Jäger einen in Yoga versunkenen Mann, gelbgewandet, mit vielen Armen.","",[["sa keśavaṃ yogayuktaṃ śayānaṃ mṛgāśaṅkī lubdhakaḥ sāyakena jarāvidhyat pādatale","den in Yoga versunkenen, daliegenden Keśava, ihn für ein Wild haltend, durchbohrte der Jäger Jara mit einem Pfeil an der Fußsohle (Nom. + Akk. + Akk. + Akk.Part. + Nom.Bahuvrīhi + Nom. + Instr. + Nom.+Impf. + Lok.)"],["tvarāvāṃs taṃ cābhitas taj jighṛkṣur jagāma athāpaśyat puruṣaṃ yogayuktaṃ pītāmbaraṃ lubdhako 'nekabāhum","eilig ging er, ihn ergreifen wollend, auf ihn zu - da erblickte der Jäger einen in Yoga versunkenen, gelbgewandeten Mann mit vielen Armen (Nom.Bahuvrīhi + Akk. + Adv. + Akk. + Nom.Desid.Part. + Perf. + Adv. + Impf. + Akk. + Akk. + Akk. + Nom. + Akk.Bahuvrīhi)"]]],["021","matvātmānam aparāddhaṃ sa tasya jagrāha pādau śirasā cārtarūpaḥ āśvāsayat taṃ mahātmā tadānīṃ gacchann ūrdhvaṃ rodasī vyāpya lakṣmyā","Da er erkannte, dass er sich vergangen hatte, ergriff er, von Schmerz erfüllt, dessen Füße mit seinem Haupt; der Großherzige aber tröstete ihn damals, während er, Himmel und Erde mit seinem Glanz erfüllend, nach oben emporstieg.","",[["matvātmānam aparāddhaṃ sa tasya jagrāha pādau śirasā cārtarūpaḥ","da er erkannte, dass er sich vergangen hatte, ergriff er, von Schmerz erfüllt, dessen Füße mit seinem Haupt (Absol. + Akk. + Akk. + Nom. + Gen. + Perf. + Akk.Du. + Instr. + Nom.Bahuvrīhi)"],["āśvāsayat taṃ mahātmā tadānīṃ gacchann ūrdhvaṃ rodasī vyāpya lakṣmyā","der Großherzige aber tröstete ihn damals, während er, Himmel und Erde mit seinem Glanz erfüllend, nach oben emporstieg (Impf.Kaus. + Akk. + Nom. + Adv. + Nom.Part. + Adv. + Akk.Du. + Absol. + Instr.)"]]],["022","divaṃ prāptaṃ vāsavo 'thāśvinau ca rudrādityā vasavaś cātha viśve pratyudyayur munayaś cāpi siddhā gandharvamukhyāś ca sahāpsarobhiḥ","Als er den Himmel erreicht hatte, kamen ihm Vāsava und die beiden Aśvins, die Rudras und Ādityas, die Vasus und die Viśvedevas entgegen, und auch die Weisen und Siddhas, und die vornehmsten Gandharvas samt den Apsaras.","",[["divaṃ prāptaṃ vāsavo 'thāśvinau ca rudrādityā vasavaś cātha viśve","als er den Himmel erreicht hatte, kamen ihm Vāsava und die beiden Aśvins, die Rudras und Ādityas, die Vasus und die Viśvedevas entgegen (Akk. + Akk. + Nom. + Adv. + Nom.Du. + Nom.Pl. + Nom.Pl. + Adv. + Nom.Pl.)"],["pratyudyayur munayaś cāpi siddhā gandharvamukhyāś ca sahāpsarobhiḥ","und auch die Weisen und Siddhas, und die vornehmsten Gandharvas samt den Apsaras (Perf. + Nom.Pl. + Nom.Pl. + Nom.Pl. + Instr.Pl.)"]]],["023","tato rājan bhagavān ugratejā nārāyaṇaḥ prabhavaś cāvyayaś ca yogācāryo rodasī vyāpya lakṣmyā sthānaṃ prāpa svaṃ mahātmāprameyam","Da, o König, erreichte der Erhabene von gewaltiger Glutkraft, Nārāyaṇa, der Ursprung und Unvergängliche, der Meister des Yoga, seinen eigenen, unermesslichen, hochherzigen Ort, nachdem er Himmel und Erde mit seinem Glanz erfüllt hatte.","",[["tato rājan bhagavān ugratejā nārāyaṇaḥ prabhavaś cāvyayaś ca yogācāryo","da, o König, erreichte der Erhabene von gewaltiger Glutkraft, Nārāyaṇa, der Ursprung und Unvergängliche, der Meister des Yoga (Adv. + Vok. + Nom. + Nom.Bahuvrīhi + Nom. + Nom. + Nom. + Nom.)"],["rodasī vyāpya lakṣmyā sthānaṃ prāpa svaṃ mahātmāprameyam","nachdem er Himmel und Erde mit seinem Glanz erfüllt hatte, erreichte er seinen eigenen, unermesslichen, hochherzigen Ort (Akk.Du. + Absol. + Instr. + Akk. + Perf. + Akk. + Akk.Bahuvrīhi)"]]],["024","tato devair ṛṣibhiś cāpi kṛṣṇaḥ samāgataś cāraṇaiś caiva rājan gandharvāgryair apsarobhir varābhiḥ siddhaiḥ sādhyaiś cānataiḥ pūjyamānaḥ","Da wurde Kṛṣṇa, o König, von den Göttern, den Weisen, und auch den Cāraṇas zusammengeführt, von den vornehmsten Gandharvas, den erlesenen Apsaras, den Siddhas und den sich verneigenden Sādhyas verehrt.","",[["tato devair ṛṣibhiś cāpi kṛṣṇaḥ samāgataś cāraṇaiś caiva rājan","da wurde Kṛṣṇa, o König, von den Göttern, den Weisen und auch den Cāraṇas zusammengeführt (Adv. + Instr.Pl. + Instr.Pl. + Nom. + Nom.Part.Perf. + Instr.Pl. + Vok.)"],["gandharvāgryair apsarobhir varābhiḥ siddhaiḥ sādhyaiś cānataiḥ pūjyamānaḥ","von den vornehmsten Gandharvas, den erlesenen Apsaras, den Siddhas und den sich verneigenden Sādhyas verehrt (Instr.Pl. + Instr.Pl. + Instr.Pl. + Instr.Pl. + Instr.Pl. + Nom.Part.Präs.Pass.)"]]],["025","te vai devāḥ pratyanandanta rājan muniśreṣṭhā vāgbhir ānarcur īśam gandharvāś cāpy upatasthuḥ stuvantaḥ prītyā cainaṃ puruhūto 'bhyanandat","Jene Götter, o König, begrüßten ihn freudig, die besten der Weisen priesen den Herrn mit Worten, und auch die Gandharvas warteten ihm lobsingend auf; und mit Freude hieß ihn Puruhūta willkommen.","",[["te vai devāḥ pratyanandanta rājan muniśreṣṭhā vāgbhir ānarcur īśam","jene Götter, o König, begrüßten ihn freudig; die besten der Weisen priesen den Herrn mit Worten (Nom.Pl. + Partikel + Nom.Pl. + Impf.Med. + Vok. + Nom.Pl. + Instr.Pl. + Perf. + Akk.)"],["gandharvāś cāpy upatasthuḥ stuvantaḥ prītyā cainaṃ puruhūto 'bhyanandat","und auch die Gandharvas warteten ihm lobsingend auf; und mit Freude hieß ihn Puruhūta willkommen (Nom.Pl. + Adv. + Perf. + Nom.Pl.Part. + Instr. + Akk. + Nom. + Impf.)"]]]]},{"num":6,"title_sa":"","title_de":"Arjunas Ankunft im verwaisten Dvārakā","note":"","units":[["001","vaiśaṃpāyana uvāca dāruko 'pi kurūn gatvā dṛṣṭvā pārthān mahārathān ācaṣṭa mausale vṛṣṇīn anyonyenopasaṃhṛtān","Vaiśaṃpāyana sprach: Auch Dāruka war zu den Kurus gegangen, hatte die Pārthas, die großen Wagenkämpfer, gesehen und berichtete, dass die Vṛṣṇis sich im Keulenkampf gegenseitig vernichtet hätten.","",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana (Subj.) sprach (3.Sg.Perf.)"],["dārukaḥ api kurūn gatvā","auch Dāruka, zu den Kurus gegangen (Abs.)"],["dṛṣṭvā pārthān mahārathān","die Pārthas, die großen Wagenkämpfer, gesehen habend (Abs.)"],["ācaṣṭa","berichtete (3.Sg.Perf.)"],["mausale vṛṣṇīn anyonyena upasaṃhṛtān","dass die Vṛṣṇis sich im Keulenkampf gegenseitig vernichtet hätten (Lok.+Akk.Part.Perf.Pass.)"]]],["002","śrutvā vinaṣṭān vārṣṇeyān sabhojakukurāndhakān pāṇḍavāḥ śokasaṃtaptā vitrastamanaso 'bhavan","Als sie hörten, dass die Vārṣṇeyas zusammen mit den Bhojas, Kukuras und Andhakas zugrunde gegangen waren, wurden die Pāṇḍavas von Kummer versengt und schreckerfüllten Herzens.","",[["śrutvā vinaṣṭān vārṣṇeyān","gehört habend, dass die Vārṣṇeyas zugrunde gegangen waren (Abs.+Akk.Part.)"],["sabhojakukurāndhakān","zusammen mit den Bhojas, Kukuras und Andhakas (Akk.)"],["pāṇḍavāḥ śokasaṃtaptāḥ","die Pāṇḍavas, von Kummer versengt (Nom.Pl.)"],["vitrastamanasaḥ abhavan","wurden schreckerfüllten Herzens (3.Pl.Impf.)"]]],["003","tato 'rjunas tān āmantrya keśavasya priyaḥ sakhā prayayau mātulaṃ draṣṭuṃ nedam astīti cābravīt","Darauf verabschiedete sich Arjuna, Keśavas geliebter Freund, von ihnen und brach auf, um seinen Onkel zu sehen; und er sprach: „Dies kann nicht sein!“","",[["tataḥ arjunaḥ tān āmantrya","darauf Arjuna, sie verabschiedet habend (Abs.)"],["keśavasya priyaḥ sakhā","Keśavas geliebter Freund (Appos.)"],["prayayau mātulaṃ draṣṭum","brach auf, um den Onkel zu sehen (3.Sg.Perf.+Inf.)"],["na idam asti iti ca abravīt","und sprach: „Dies ist nicht [so], gibt es nicht!“ (direkte Rede)"]]],["004","sa vṛṣṇinilayaṃ gatvā dārukeṇa saha prabho dadarśa dvārakāṃ vīro mṛtanāthām iva striyam","Er, der Held, ging mit Dāruka zur Wohnstätte der Vṛṣṇis, o Herr, und sah Dvārakā wie eine Frau, deren Gatte gestorben ist.","",[["saḥ vṛṣṇinilayaṃ gatvā","er, zur Wohnstätte der Vṛṣṇis gegangen (Abs.)"],["dārukeṇa saha","zusammen mit Dāruka (Instr.)"],["prabho","o Herr (Vok., Anrede an Janamejaya)"],["dadarśa dvārakāṃ vīraḥ","sah Dvārakā, der Held (3.Sg.Perf.)"],["mṛtanāthām iva striyam","wie eine Frau, deren Gatte gestorben ist (Akk.Vergleich)"]]],["005","yāḥ sma tā lokanāthena nāthavatyaḥ purābhavan tās tv anāthās tadā nāthaṃ pārthaṃ dṛṣṭvā vicukruśuḥ","Die Frauen, die einst durch den Herrn der Welt einen Beschützer hatten, waren nun beschützerlos; als sie da den Pārtha als Beschützer sahen, schrien sie laut auf.","",[["yāḥ sma tāḥ lokanāthena nāthavatyaḥ purā abhavan","die, die einst durch den Herrn der Welt [Kṛṣṇa] einen Beschützer hatten (Rel.+3.Pl.Impf.)"],["tāḥ tu anāthāḥ tadā","sie aber [waren] da beschützerlos"],["nāthaṃ pārthaṃ dṛṣṭvā","den Pārtha als Beschützer gesehen habend (Abs.)"],["vicukruśuḥ","schrien sie laut auf (3.Pl.Perf.)"]]],["006","ṣoḍaśastrīsahasrāṇi vāsudevaparigrahaḥ tāsām āsīn mahān nādo dṛṣṭvaivārjunam āgatam","Sechzehntausend Frauen, Vāsudevas Gemahlinnen - unter ihnen erhob sich ein großes Geschrei, sobald sie Arjuna ankommen sahen.","",[["ṣoḍaśastrīsahasrāṇi","sechzehntausend Frauen (Nom.)"],["vāsudevaparigrahaḥ","Vāsudevas Gemahlinnen (Appos.)"],["tāsām āsīt mahān nādaḥ","unter ihnen erhob sich ein großes Geschrei (3.Sg.Impf.)"],["dṛṣṭvā eva arjunam āgatam","sobald sie Arjuna angekommen sahen (Abs.)"]]],["007","tās tu dṛṣṭvaiva kauravyo bāṣpeṇa pihito 'rjunaḥ hīnāḥ kṛṣṇena putraiś ca nāśakat so 'bhivīkṣitum","Doch als der Kaurava Arjuna sie sah, die von Kṛṣṇa und ihren Söhnen beraubt waren, wurde er von Tränen verschleiert und vermochte nicht, sie [weiter] anzuschauen.","",[["tāḥ tu dṛṣṭvā eva kauravyaḥ","sie aber, sobald der Kaurava [Arjuna] sah (Abs.)"],["bāṣpeṇa pihitaḥ arjunaḥ","Arjuna, von Tränen verschleiert (Nom.)"],["hīnāḥ kṛṣṇena putraiḥ ca","beraubt von Kṛṣṇa und den Söhnen (Akk.Part.)"],["na aśakat saḥ abhivīkṣitum","er vermochte nicht, [sie] anzuschauen (3.Sg.Impf.+Inf.)"]]],["008","tāṃ sa vṛṣṇyandhakajalāṃ hayamīnāṃ rathoḍupām vāditrarathaghoṣaughāṃ veśmatīrthamahāgrahām","Er sah sie: die Stadt, deren Wasser die Vṛṣṇis und Andhakas waren, deren Fische die Pferde, deren Flöße die Wagen, deren Wellenrauschen aus Musik- und Wagenlärm bestand, deren mächtige Krokodile die Häuser an den Badeplätzen waren,","",[["tāṃ saḥ","sie, er (Akk./Subj., Fortsetzung von V007ff.)"],["vṛṣṇyandhakajalāṃ","deren Wasser die Vṛṣṇis und Andhakas waren (Akk.Bahuvrīhi)"],["hayamīnāṃ rathoḍupām","deren Fische die Pferde, deren Flöße die Wagen waren"],["vāditrarathaghoṣaughāṃ","deren Wellenrauschen aus Musik- und Wagenlärm bestand"],["veśmatīrthamahāgrahām","deren mächtige Krokodile die Häuser an den Badeplätzen waren"]]],["009","ratnaśaivalasaṃghāṭāṃ vajraprākāramālinīm rathyāsrotojalāvartāṃ catvarastimitahradām","deren Algengeflecht aus Juwelen bestand, die einen Kranz diamantener Mauern trug, deren Wasserstrudel die Straßenströme waren, deren stille Teiche die Kreuzungsplätze waren,","",[["ratnaśaivalasaṃghāṭāṃ","deren Algengeflecht aus Juwelen bestand"],["vajraprākāramālinīm","die einen Kranz diamantener Mauern trug"],["rathyāsrotojalāvartāṃ","deren Wasserstrudel die Straßenströme waren"],["catvarastimitahradām","deren stille Teiche die Kreuzungsplätze waren"]]],["010","rāmakṛṣṇamahāgrāhāṃ dvārakāsaritaṃ tadā kālapāśagrahāṃ ghorāṃ nadīṃ vaitaraṇīm iva","deren gewaltige Ungeheuer Rāma und Kṛṣṇa waren - diesen Dvārakā-Strom sah er damals wie den furchtbaren Fluss Vaitaraṇī, dessen Ungeheuer die Schlinge des Todes ist.","[Anm.: Vaitaraṇī ist der mythische Grenzfluss zum Totenreich.]",[["rāmakṛṣṇamahāgrāhāṃ","deren gewaltige Ungeheuer Rāma und Kṛṣṇa waren"],["dvārakāsaritaṃ tadā","den Dvārakā-Strom damals (Akk.)"],["kālapāśagrahāṃ ghorāṃ nadīṃ vaitaraṇīm iva","wie den furchtbaren Fluss Vaitaraṇī, dessen Ungeheuer die Schlinge des Todes ist (Vergleich)"]]],["011","tāṃ dadarśārjuno dhīmān vihīnāṃ vṛṣṇipuṃgavaiḥ gataśriyaṃ nirānandāṃ padminīṃ śiśire yathā","So sah der weise Arjuna sie, der Stiere der Vṛṣṇis beraubt, ihrer Schönheit entblößt und freudlos, wie einen Lotusteich im Winter.","",[["tāṃ dadarśa arjunaḥ dhīmān","sie sah der weise Arjuna (3.Sg.Perf.)"],["vihīnāṃ vṛṣṇipuṃgavaiḥ","der Stiere der Vṛṣṇis beraubt (Akk.Part.)"],["gataśriyaṃ nirānandāṃ","ihrer Schönheit entblößt und freudlos"],["padminīṃ śiśire yathā","wie einen Lotusteich im Winter (Vergleich)"]]],["012","tāṃ dṛṣṭvā dvārakāṃ pārthas tāś ca kṛṣṇasya yoṣitaḥ sasvanaṃ bāṣpam utsṛjya nipapāta mahītale","Als der Pārtha Dvārakā sah und die Frauen Kṛṣṇas, vergoss er unter lautem Weinen Tränen und sank zu Boden.","",[["tāṃ dṛṣṭvā dvārakāṃ pārthaḥ","als der Pārtha Dvārakā sah (Abs.)"],["tāḥ ca kṛṣṇasya yoṣitaḥ","und die Frauen Kṛṣṇas (Akk.)"],["sasvanaṃ bāṣpam utsṛjya","unter lautem [Weinen] Tränen vergießend (Abs.)"],["nipapāta mahītale","sank zu Boden (3.Sg.Perf.)"]]],["013","sātrājitī tataḥ satyā rukmiṇī ca viśāṃ pate abhipatya praruruduḥ parivārya dhanaṃjayam","Darauf, o Herr der Völker, stürzten Satyā, die Tochter Satrājits, und Rukmiṇī herbei, umringten Dhanaṃjaya und weinten laut.","",[["sātrājitī tataḥ satyā rukmiṇī ca","darauf Satyā, die Tochter Satrājits, und Rukmiṇī (Subj.)"],["viśāṃ pate","o Herr der Völker (Vok., Anrede an Janamejaya)"],["abhipatya","herbeigestürzt (Abs.)"],["praruruduḥ parivārya dhanaṃjayam","weinten laut, Dhanaṃjaya umringend (3.Pl.Perf.+Abs.)"]]],["014","tatas tāḥ kāñcane pīṭhe samutthāpyopaveśya ca abruvantyo mahātmānaṃ parivāryopatasthire","Dann hoben sie ihn auf einen goldenen Sitz, ließen ihn Platz nehmen, und redend standen sie, den Hochgesinnten umringend, bei ihm.","",[["tataḥ tāḥ kāñcane pīṭhe","darauf sie, auf einem goldenen Sitz (Lok.)"],["samutthāpya upaveśya ca","[ihn] aufgehoben und Platz nehmen lassend (Abs.)"],["abruvantyaḥ","redend (Part.Präs.)"],["mahātmānaṃ parivārya upatasthire","den Hochgesinnten umringend, standen sie bei (Abs.+3.Pl.Perf.Med.)"]]],["015","tataḥ saṃstūya govindaṃ kathayitvā ca pāṇḍavaḥ āśvāsya tāḥ striyaś cāpi mātulaṃ draṣṭum abhyagāt","Darauf, nachdem der Pāṇḍava Govinda gepriesen und mit ihnen gesprochen hatte, tröstete er die Frauen und ging, um seinen Onkel zu sehen.","",[["tataḥ saṃstūya govindaṃ","darauf, Govinda gepriesen habend (Abs.)"],["kathayitvā ca pāṇḍavaḥ","und der Pāṇḍava, gesprochen habend (Abs.)"],["āśvāsya tāḥ striyaḥ ca api","und die Frauen getröstet habend (Abs.)"],["mātulaṃ draṣṭum abhyagāt","ging er, um den Onkel zu sehen (3.Sg.Impf.+Inf.)"]]]]},{"num":7,"title_sa":"","title_de":"Vasudevas Klage und Bericht von Kṛṣṇas letzten Worten","note":"","units":[["001","vaiśaṃpāyana uvāca taṃ śayānaṃ mahātmānaṃ vīram ānakadundubhim putraśokābhisaṃtaptaṃ dadarśa kurupuṃgavaḥ","Vaiśaṃpāyana sprach: Den daliegenden hochgesinnten Helden Ānakadundubhi, von Sohnesleid versengt, sah der Stier der Kurus.","[Anm.: Ānakadundubhi ist ein Beiname Vasudevas.]",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana (Subj.) sprach (3.Sg.Perf.)"],["taṃ śayānaṃ mahātmānaṃ vīram ānakadundubhim","den daliegenden hochgesinnten Helden Ānakadundubhi [Vasudeva] (Akk.)"],["putraśokābhisaṃtaptaṃ","von Sohnesleid versengt (Akk.Part.)"],["dadarśa kurupuṃgavaḥ","sah der Stier der Kurus [Arjuna] (3.Sg.Perf.)"]]],["002","tasyāśruparipūrṇākṣo vyūḍhorasko mahābhujaḥ ārtasyārtataraḥ pārthaḥ pādau jagrāha bhārata","Mit tränengefüllten Augen, breiter Brust und mächtigen Armen ergriff der Pārtha, noch schmerzerfüllter als der Schmerzerfüllte, dessen Füße, o Bhārata.","",[["tasya aśruparipūrṇākṣaḥ","dessen [Vasudevas Füße], mit tränengefüllten Augen (Nom.)"],["vyūḍhoraskaḥ mahābhujaḥ","breiter Brust, mächtigen Armen (Nom.)"],["ārtasya ārtataraḥ pārthaḥ","der Pārtha, schmerzerfüllter als der Schmerzerfüllte (Nom.)"],["pādau jagrāha bhārata","ergriff die Füße, o Bhārata (3.Sg.Perf.+Vok.)"]]],["003","samāliṅgyārjunaṃ vṛddhaḥ sa bhujābhyāṃ mahābhujaḥ rudan putrān smaran sarvān vilalāpa suvihvalaḥ bhrātṝn putrāṃś ca pautrāṃś ca dauhitrāṃś ca sakhīn api","Er, der Alte, mit mächtigen Armen, umarmte Arjuna mit beiden Armen; weinend, an alle Söhne denkend, klagte er, ganz aufgelöst - an Brüder, Söhne, Enkel, Tochtersöhne und Freunde denkend.","",[["samāliṅgya arjunaṃ vṛddhaḥ","Arjuna umarmt habend, der Alte (Abs.)"],["saḥ bhujābhyāṃ mahābhujaḥ","er mit [seinen] Armen, der Starkarmige (Instr.)"],["rudan putrān smaran sarvān","weinend, an alle Söhne denkend (Part.)"],["vilalāpa suvihvalaḥ","klagte, ganz aufgelöst (3.Sg.Perf.)"],["bhrātṝn putrāṃś ca pautrāṃś ca dauhitrāṃś ca sakhīn api","an Brüder, Söhne, Enkel, Tochtersöhne und Freunde [denkend] (Akk.)"]]],["004","vasudeva uvāca yair jitā bhūmipālāś ca daityāś ca śataśo 'rjuna tān dṛṣṭvā neha paśyāmi jīvāmy arjuna durmaraḥ","Vasudeva sprach: „Die, durch die Erdenherrscher und Daityas zu Hunderten bezwungen wurden, Arjuna - sie sehe ich hier nicht mehr; und ich lebe doch, Arjuna, ich, der schwer zu Tötende.","",[["vasudevaḥ uvāca","Vasudeva sprach (3.Sg.Perf.)"],["yaiḥ jitāḥ bhūmipālāḥ ca daityāḥ ca śataśaḥ arjuna","durch die Erdenherrscher und Daityas zu Hunderten bezwungen wurden, Arjuna (Instr.+Nom.Part.)"],["tān dṛṣṭvā na iha paśyāmi","sie sehe ich hier nicht [mehr] (Abs.+1.Sg.Präs.)"],["jīvāmi arjuna durmaraḥ","ich lebe, Arjuna, schwer zu töten (1.Sg.Präs.+Nom.)"]]],["005","yau tāv arjuna śiṣyau te priyau bahumatau sadā tayor apanayāt pārtha vṛṣṇayo nidhanaṃ gatāḥ","Diese beiden, Arjuna, deine Schüler, dir stets lieb und hochgeschätzt - durch ihr Fehlverhalten, Pārtha, sind die Vṛṣṇis dem Untergang verfallen:","[Anm.: Gemeint sind vermutlich Sātyaki (Yuyudhāna) und Kṛtavarman, deren Streit in Kap.4 das Gemetzel auslöste; die Identifizierung erfolgt cataphorisch erst in V006-007, wo abweichend Pradyumna und Yuyudhāna als das gemeinte Paar genannt werden - Lesart bleibt unsicher.]",[["yau tau arjuna śiṣyau te","diese beiden, Arjuna, deine Schüler (Nom.Dual)"],["priyau bahumatau sadā","lieb und stets hochgeschätzt (Nom.Dual)"],["tayoḥ apanayāt pārtha","durch ihr Fehlverhalten, Pārtha (Abl.)"],["vṛṣṇayaḥ nidhanaṃ gatāḥ","sind die Vṛṣṇis dem Untergang verfallen (Nom.+3.Pl.Perf.)"]]],["006","yau tau vṛṣṇipravīrāṇāṃ dvāv evātirathau matau pradyumno yuyudhānaś ca kathayan katthase ca yau","diese beiden, die als die einzigen Atirathas unter den Helden der Vṛṣṇis galten - Pradyumna und Yuyudhāna -, von denen du erzählend prahlst,","",[["yau tau vṛṣṇipravīrāṇāṃ","diese beiden, unter den Helden der Vṛṣṇis (Gen.Pl.)"],["dvau eva atirathau matau","als die einzigen zwei Atirathas geltend (Nom.Dual)"],["pradyumnaḥ yuyudhānaḥ ca","Pradyumna und Yuyudhāna [Sātyaki] (Nom.)"],["kathayan katthase ca yau","von denen du erzählend prahlst (Part.+2.Sg.)"]]],["007","nityaṃ tvaṃ kuruśārdūla kṛṣṇaś ca mama putrakaḥ tāv ubhau vṛṣṇināśasya mukham āstāṃ dhanaṃjaya","immerzu, du Tiger der Kurus, und auch Kṛṣṇa, mein Söhnchen - diese beiden waren der Anfang des Untergangs der Vṛṣṇis, Dhanaṃjaya.","",[["nityaṃ tvaṃ kuruśārdūla","immerzu du, Tiger der Kurus (Vok.)"],["kṛṣṇaḥ ca mama putrakaḥ","und Kṛṣṇa, mein Söhnchen (Nom.)"],["tau ubhau vṛṣṇināśasya mukham āstāṃ dhanaṃjaya","diese beiden waren der Anfang des Untergangs der Vṛṣṇis, Dhanaṃjaya (Nom.+3.Dual.Impf.)"]]],["008","na tu garhāmi śaineyaṃ hārdikyaṃ cāham arjuna akrūraṃ raukmiṇeyaṃ ca śāpo hy evātra kāraṇam","Doch ich tadle nicht den Śaineya noch den Hārdikya, Arjuna, noch Akrūra noch den Raukmiṇeya - ein Fluch allein ist hier die Ursache.","[Anm.: Śaineya = Sātyaki, Hārdikya = Kṛtavarman, Raukmiṇeya = Pradyumna (Sohn der Rukmiṇī).]",[["na tu garhāmi śaineyaṃ","doch ich tadle nicht den Śaineya [Sātyaki] (1.Sg.Präs.)"],["hārdikyaṃ ca aham arjuna","noch den Hārdikya [Kṛtavarman], Arjuna"],["akrūraṃ raukmiṇeyaṃ ca","noch Akrūra noch den Raukmiṇeya [Pradyumna]"],["śāpaḥ hi eva atra kāraṇam","ein Fluch allein ist hier die Ursache (Nom.)"]]],["009","keśinaṃ yas tu kaṃsaṃ ca vikramya jagataḥ prabhuḥ videhāv akarot pārtha caidyaṃ ca balagarvitam","Er, der Herr der Welt, der durch seine Kraft Keśin und Kaṃsa bezwang, Pārtha, und den auf seine Stärke stolzen Caidya entkörperte,","[Anm.: Caidya = Śiśupāla, König von Cedi.]",[["keśinaṃ yaḥ tu kaṃsaṃ ca","er, der Keśin und Kaṃsa (Akk./Rel.)"],["vikramya jagataḥ prabhuḥ","durch [seine] Kraft, der Herr der Welt (Abs.+Nom.)"],["videhau akarot pārtha","körperlos machte, Pārtha (3.Sg.Impf.)"],["caidyaṃ ca balagarvitam","und den auf seine Stärke stolzen Caidya [Śiśupāla]"]]],["010","naiṣādim ekalavyaṃ ca cakre kāliṅgamāgadhān gāndhārān kāśirājaṃ ca marubhūmau ca pārthivān","der auch den Naiṣādi Ekalavya bezwang, und die Fürsten von Kaliṅga und Magadha, die Gāndhāras, den König von Kāśī und die Herrscher im Wüstenland,","",[["naiṣādim ekalavyaṃ ca cakre","und den Naiṣādi Ekalavya machte er [ebenso, sc. bezwungen] (3.Sg.Perf.)"],["kāliṅgamāgadhān gāndhārān","die [Fürsten von] Kaliṅga, Magadha, Gāndhāra (Akk.)"],["kāśirājaṃ ca marubhūmau ca pārthivān","und den König von Kāśī, und die Herrscher im Wüstenland"]]],["011","prācyāṃś ca dākṣiṇātyāṃś ca pārvatīyāṃs tathā nṛpān so 'bhyupekṣitavān etam anayaṃ madhusūdanaḥ","und die östlichen und südlichen sowie die Bergkönige - er, Madhusūdana, hat dieses Unheil nun geschehen lassen.","",[["prācyāṃś ca dākṣiṇātyāṃś ca","und die östlichen und südlichen [Könige]"],["pārvatīyān tathā nṛpān","ebenso die Bergkönige"],["saḥ abhyupekṣitavān etam anayaṃ madhusūdanaḥ","er, Madhusūdana, hat dieses Unheil [nun] geschehen lassen (3.Sg.Perf.Periphr.)"]]],["012","tataḥ putrāṃś ca pautrāṃś ca bhrātṝn atha sakhīn api śayānān nihatān dṛṣṭvā tato mām abravīd idam","Als er dann die Söhne, Enkel, Brüder und auch die Freunde daliegend, erschlagen, sah, da sprach er dies zu mir:‚","",[["tataḥ putrāṃś ca pautrāṃś ca","dann die Söhne und Enkel"],["bhrātṝn atha sakhīn api","die Brüder und auch die Freunde"],["śayānān nihatān dṛṣṭvā","daliegend, erschlagen gesehen habend (Abs.)"],["tataḥ mām abravīt idam","da sprach er dies zu mir (3.Sg.Impf.)"]]],["013","saṃprāpto 'dyāyam asyāntaḥ kulasya puruṣarṣabha āgamiṣyati bībhatsur imāṃ dvāravatīṃ purīm","Heute ist dieses Ende des Geschlechts gekommen, du Stier unter den Männern; Bībhatsu wird in diese Stadt Dvāravatī kommen.","",[["saṃprāptaḥ adya ayam antaḥ kulasya","heute ist dieses Ende des Geschlechts gekommen (Nom.)"],["puruṣarṣabha","du Stier unter den Männern (Vok.)"],["āgamiṣyati bībhatsuḥ","Bībhatsu wird kommen (3.Sg.Fut.)"],["imāṃ dvāravatīṃ purīm","in diese Stadt Dvāravatī (Akk.)"]]],["014","ākhyeyaṃ tasya yad vṛttaṃ vṛṣṇīnāṃ vaiśasaṃ mahat sa tu śrutvā mahātejā yadūnām anayaṃ prabho āgantā kṣipram eveha na me 'trāsti vicāraṇā","Ihm ist mitzuteilen, was geschehen ist, das große Blutbad der Vṛṣṇis; er aber, der Gewaltige, wird, sobald er vom Unheil der Yadus hört, o Herr, gewiss rasch hierherkommen - daran hege ich keinen Zweifel.","",[["ākhyeyaṃ tasya yad vṛttaṃ","ihm ist mitzuteilen, was geschehen ist"],["vṛṣṇīnāṃ vaiśasaṃ mahat","das große Blutbad der Vṛṣṇis"],["saḥ tu śrutvā mahātejāḥ yadūnām anayaṃ prabho","er aber, der Gewaltige, wenn er vom Unheil der Yadus hört, o Herr"],["āgantā kṣipram eva iha","wird gewiss rasch hierherkommen (Fut.Periphr.)"],["na me atra asti vicāraṇā","daran hege ich keinen Zweifel"]]],["015","yo 'haṃ tam arjunaṃ viddhi yo 'rjunaḥ so 'ham eva tu yad brūyāt tat tathā kāryam iti budhyasva mādhava","Wisse: Ich bin jener Arjuna, und wer Arjuna ist, der bin ich selbst; was er sagen wird, das ist genauso zu tun - das begreife, Mādhava.","[Anm.: Anspielung auf die Identifikation von Kṛṣṇa und Arjuna mit Nārāyaṇa und Nara.]",[["yaḥ aham tam arjunaṃ viddhi","wisse: ich [bin] jener Arjuna (Imp.)"],["yaḥ arjunaḥ saḥ aham eva tu","und wer Arjuna ist, der bin ich selbst"],["yad brūyāt tat tathā kāryam","was er sagen wird, das ist genauso zu tun (Opt.+Ger.)"],["iti budhyasva mādhava","das begreife, Mādhava (Imp.)"]]],["016","sa strīṣu prāptakālaṃ vaḥ pāṇḍavo bālakeṣu ca pratipatsyati bībhatsur bhavataś caurdhvadehikam","Er, der Pāṇḍava Bībhatsu, wird zur rechten Zeit tun, was euren Frauen und Kindern gebührt, und wird eure Totenriten vollziehen.","",[["saḥ strīṣu prāptakālaṃ vaḥ","er, zur rechten Zeit für eure Frauen"],["pāṇḍavaḥ bālakeṣu ca","der Pāṇḍava, und für die Kinder"],["pratipatsyati bībhatsuḥ","wird tun, was gebührt, Bībhatsu (3.Sg.Fut.)"],["bhavataḥ ca aurdhvadehikam","und eure Totenriten (Akk.)"]]],["017","imāṃ ca nagarīṃ sadyaḥ pratiyāte dhanaṃjaye prākārāṭṭālakopetāṃ samudraḥ plāvayiṣyati","Und diese Stadt, mit Wällen und Zinnen versehen, wird das Meer überfluten, sobald Dhanaṃjaya wieder fortgezogen ist.","",[["imāṃ ca nagarīṃ sadyaḥ","und diese Stadt, sogleich"],["pratiyāte dhanaṃjaye","wenn Dhanaṃjaya wieder fortgezogen ist (Lok.Abs.)"],["prākārāṭṭālakopetāṃ","mit Wällen und Zinnen versehen"],["samudraḥ plāvayiṣyati","wird das Meer überfluten (3.Sg.Fut.)"]]],["018","ahaṃ hi deśe kasmiṃś cit puṇye niyamam āsthitaḥ kālaṃ kartā sadya eva rāmeṇa saha dhīmatā","Ich selbst werde, an irgendeinem heiligen Ort ein Gelübde übernehmend, alsbald mit dem weisen Rāma mein Ende machen.‘","",[["aham hi deśe kasmiṃś cit puṇye","ich, an irgendeinem heiligen Ort"],["niyamam āsthitaḥ","ein Gelübde übernehmend (Nom.Part.)"],["kālaṃ kartā sadya eva","werde alsbald [mein] Ende machen (Fut.Periphr.)"],["rāmeṇa saha dhīmatā","zusammen mit dem weisen Rāma (Instr.)"]]],["019","evam uktvā hṛṣīkeśo mām acintyaparākramaḥ hitvā māṃ bālakaiḥ sārdhaṃ diśaṃ kām apy agāt prabhuḥ","Nachdem er dies gesagt hatte, verließ mich Hṛṣīkeśa, der Herr von unfassbarer Kraft, zusammen mit den Kindern, und ging in irgendeine Richtung fort.","",[["evam uktvā hṛṣīkeśaḥ","nachdem er dies gesagt hatte, Hṛṣīkeśa (Abs.+Nom.)"],["mām acintyaparākramaḥ","mich, er von unfassbarer Kraft"],["hitvā māṃ bālakaiḥ sārdhaṃ","mich verlassen habend, zusammen mit den Kindern (Abs.)"],["diśaṃ kām api agāt prabhuḥ","ging der Herr in irgendeine Richtung (3.Sg.Impf.)"]]],["020","so 'haṃ tau ca mahātmānau cintayan bhrātarau tava ghoraṃ jñātivadhaṃ caiva na bhuñje śokakarśitaḥ","So denke ich, an euch beide hochgesinnte Brüder und an das furchtbare Blutbad der Verwandten, und esse nicht, von Kummer ausgezehrt.","",[["saḥ aham tau ca mahātmānau","so ich, an euch beide Hochgesinnte"],["cintayan bhrātarau tava","denkend, deine Brüder (Part.)"],["ghoraṃ jñātivadhaṃ ca eva","und an das furchtbare Blutbad der Verwandten"],["na bhuñje śokakarśitaḥ","esse ich nicht, von Kummer ausgezehrt (1.Sg.Präs.)"]]],["021","na ca bhokṣye na jīviṣye diṣṭyā prāpto 'si pāṇḍava yad uktaṃ pārtha kṛṣṇena tat sarvam akhilaṃ kuru","Und ich werde nicht essen, ich werde nicht leben - zum Glück bist du gekommen, Pāṇḍava; was Kṛṣṇa gesagt hat, das alles, vollständig, tue.","",[["na ca bhokṣye na jīviṣye","und ich werde nicht essen, ich werde nicht leben (1.Sg.Fut.)"],["diṣṭyā prāptaḥ asi pāṇḍava","zum Glück bist du gekommen, Pāṇḍava"],["yad uktaṃ pārtha kṛṣṇena","was Kṛṣṇa gesagt hat, Pārtha"],["tat sarvam akhilaṃ kuru","das alles, vollständig, tue (Imp.)"]]],["022","etat te pārtha rājyaṃ ca striyo ratnāni caiva ha iṣṭān prāṇān ahaṃ hīmāṃs tyakṣyāmi ripusūdana","Dies hier, Pārtha - das Königreich, die Frauen und die Juwelen - gehört dir; ich selbst werde diese geliebten Lebenshauche aufgeben, Feindebezwinger.“","",[["etat te pārtha rājyaṃ ca","dies [gehört] dir, Pārtha - das Königreich"],["striyo ratnāni ca eva ha","die Frauen und die Juwelen"],["iṣṭān prāṇān aham hi imān tyakṣyāmi","ich werde diese geliebten Lebenshauche aufgeben (1.Sg.Fut.)"],["ripusūdana","Feindebezwinger (Vok.)"]]]]},{"num":8,"title_sa":"","title_de":"Die Evakuierung Dvārakās, Vasudevas Tod und der Überfall der Ābhīras","note":"","units":[["001","vaiśaṃpāyana uvāca evam uktaḥ sa bībhatsur mātulena paraṃtapaḥ durmanā dīnamanasaṃ vasudevam uvāca ha","Vaiśaṃpāyana sprach: So von seinem Onkel angesprochen, sagte Bībhatsu, der Bezwinger der Feinde, betrübten Sinnes, zu dem kummervollen Vasudeva:","",[["vaiśaṃpāyanaḥ uvāca","Vaiśaṃpāyana (Subj.) sprach (3.Sg.Perf.)"],["evam uktaḥ saḥ bībhatsuḥ mātulena paraṃtapaḥ","so von seinem Onkel angesprochen, Bībhatsu, der Bezwinger der Feinde (Nom.Part.)"],["durmanāḥ dīnamanasaṃ vasudevam uvāca ha","betrübten Sinnes sagte er zu dem kummervollen Vasudeva (3.Sg.Perf.)"]]],["002","nāhaṃ vṛṣṇipravīreṇa madhubhiś caiva mātula vihīnāṃ pṛthivīṃ draṣṭuṃ śaktaś ciram iha prabho","„Ich vermag nicht, Onkel, o Herr, die Erde, die des Vṛṣṇi-Helden und auch der Madhus beraubt ist, hier noch lange zu erblicken.","",[["na aham vṛṣṇipravīreṇa madhubhiḥ ca eva mātula","ich nicht, [beraubt] des Vṛṣṇi-Helden [Kṛṣṇa] und auch der Madhus, Onkel (Instr.)"],["vihīnāṃ pṛthivīṃ draṣṭuṃ","die beraubte Erde zu sehen (Akk.+Inf.)"],["śaktaḥ ciram iha prabho","vermag hier noch lange, o Herr (Nom.)"]]],["003","rājā ca bhīmasenaś ca sahadevaś ca pāṇḍavaḥ nakulo yājñasenī ca ṣaḍ ekamanaso vayam","Der König, und Bhīmasena, und der Pāṇḍava Sahadeva, Nakula und Yājñasenī - wir sechs, eines Sinnes,","[Anm.: Yājñasenī = Draupadī.]",[["rājā ca bhīmasenaḥ ca","der König und Bhīmasena"],["sahadevaḥ ca pāṇḍavaḥ nakulaḥ yājñasenī ca","und der Pāṇḍava Sahadeva, Nakula und Yājñasenī [Draupadī]"],["ṣaṭ ekamanasaḥ vayam","wir sechs, eines Sinnes (Nom.)"]]],["004","rājñaḥ saṃkramaṇe cāpi kālo 'yaṃ vartate dhruvam tam imaṃ viddhi saṃprāptaṃ kālaṃ kālavidāṃ vara","auch für den Übergang des Königs ist diese Zeit nun gewiss gekommen; wisse, dass diese Zeit angebrochen ist, o Bester der Zeitkenner.","[Anm.: 'saṃkramaṇa' (Übergang) deutet voraus auf Yudhiṣṭhiras späteren Aufbruch im Mahāprasthānikaparva.]",[["rājñaḥ saṃkramaṇe ca api","auch für den Übergang des Königs (Lok.)"],["kālaḥ ayaṃ vartate dhruvam","diese Zeit ist gewiss gekommen (3.Sg.Präs.)"],["tam imaṃ viddhi saṃprāptaṃ kālaṃ","wisse, dass diese Zeit angebrochen ist (Imp.+Akk.Part.)"],["kālavidāṃ vara","o Bester der Zeitkenner (Vok.)"]]],["005","sarvathā vṛṣṇidārāṃs tu bālavṛddhāṃs tathaiva ca nayiṣye parigṛhyāham indraprastham ariṃdama","In jedem Fall aber werde ich die Frauen der Vṛṣṇis, ebenso die Kinder und Alten, aufnehmen und nach Indraprastha bringen, Feindebezwinger.“","",[["sarvathā vṛṣṇidārān tu","in jedem Fall aber die Frauen der Vṛṣṇis"],["bālavṛddhān tathā eva ca","ebenso die Kinder und Alten"],["nayiṣye parigṛhya aham indraprastham ariṃdama","werde ich aufnehmen und nach Indraprastha bringen, Feindebezwinger (1.Sg.Fut.+Abs.)"]]],["006","ity uktvā dārukam idaṃ vākyam āha dhanaṃjayaḥ amātyān vṛṣṇivīrāṇāṃ draṣṭum icchāmi māciram","Nachdem er dies gesagt hatte, sprach Dhanaṃjaya zu Dāruka dieses Wort: „Ich wünsche, ohne Verzug die Minister der Vṛṣṇi-Helden zu sehen.“","",[["iti uktvā dārukam idaṃ vākyam āha dhanaṃjayaḥ","dies gesagt habend, sprach Dhanaṃjaya zu Dāruka dieses Wort (Abs.+3.Sg.Perf.)"],["amātyān vṛṣṇivīrāṇāṃ draṣṭum icchāmi","ich wünsche, die Minister der Vṛṣṇi-Helden zu sehen (Akk.+1.Sg.Präs.+Inf.)"],["māciram","ohne Verzug"]]],["007","ity evam uktvā vacanaṃ sudharmāṃ yādavīṃ sabhām praviveśārjunaḥ śūraḥ śocamāno mahārathān","Nachdem er so dieses Wort gesprochen hatte, betrat Arjuna, der Held, um die großen Wagenkrieger trauernd, die Yādava-Versammlungshalle Sudharmā.","",[["iti evam uktvā vacanaṃ","so dieses Wort gesprochen habend (Abs.)"],["sudharmāṃ yādavīṃ sabhām praviveśa arjunaḥ śūraḥ","betrat Arjuna, der Held, die Yādava-Halle Sudharmā (3.Sg.Perf.)"],["śocamānaḥ mahārathān","um die großen Wagenkrieger trauernd (Part.)"]]],["008","tam āsanagataṃ tatra sarvāḥ prakṛtayas tathā brāhmaṇā naigamāś caiva parivāryopatasthire","Dort, als er seinen Sitz eingenommen hatte, versammelten sich alle Untertanen, ebenso die Brahmanen und die Kaufleute, um ihn und warteten ihm auf.","",[["tam āsanagataṃ tatra","ihn, den Sitz eingenommen habend, dort (Akk.Part.)"],["sarvāḥ prakṛtayaḥ tathā brāhmaṇāḥ naigamāḥ ca eva","alle Untertanen, ebenso die Brahmanen und die Kaufleute"],["parivārya upatasthire","umringend, warteten sie auf (Abs.+3.Pl.Perf.Med.)"]]],["009","tān dīnamanasaḥ sarvān nibhṛtān gatacetasaḥ uvācedaṃ vacaḥ pārthaḥ svayaṃ dīnataras tadā","Zu ihnen allen, betrübten Sinnes, still, bestürzt, sprach der Pārtha, selbst noch betrübter, damals dieses Wort:","",[["tān dīnamanasaḥ sarvān nibhṛtān gatacetasaḥ","zu ihnen allen, betrübten Sinnes, still, bestürzt (Akk.)"],["uvāca idaṃ vacaḥ pārthaḥ","sprach der Pārtha dieses Wort (3.Sg.Perf.)"],["svayaṃ dīnataraḥ tadā","selbst noch betrübter, damals"]]],["010","śakraprastham ahaṃ neṣye vṛṣṇyandhakajanaṃ svayam idaṃ tu nagaraṃ sarvaṃ samudraḥ plāvayiṣyati","„Ich selbst werde die Leute der Vṛṣṇis und Andhakas nach Śakraprastha führen; diese ganze Stadt aber wird das Meer überfluten.","",[["śakraprastham aham neṣye","nach Śakraprastha werde ich führen (1.Sg.Fut.)"],["vṛṣṇyandhakajanaṃ svayam","die Leute der Vṛṣṇis und Andhakas, selbst (Akk.)"],["idaṃ tu nagaraṃ sarvaṃ samudraḥ plāvayiṣyati","diese ganze Stadt aber wird das Meer überfluten (3.Sg.Fut.)"]]],["011","sajjīkuruta yānāni ratnāni vividhāni ca vajro 'yaṃ bhavatāṃ rājā śakraprasthe bhaviṣyati","Macht die Fahrzeuge bereit und die vielfältigen Juwelen; dieser Vajra wird euer König in Śakraprastha sein.","",[["sajjīkuruta yānāni ratnāni vividhāni ca","macht bereit die Fahrzeuge und die vielfältigen Juwelen (Imp.Pl.)"],["vajraḥ ayaṃ bhavatāṃ rājā śakraprasthe bhaviṣyati","dieser Vajra wird euer König in Śakraprastha sein (3.Sg.Fut.)"]]],["012","saptame divase caiva ravau vimala udgate bahir vatsyāmahe sarve sajjībhavata māciram","Und am siebten Tag, wenn die Sonne klar aufgegangen ist, werden wir alle draußen weilen; macht euch bereit, ohne Verzug.“","",[["saptame divase ca eva","und am siebten Tag"],["ravau vimale udgate","wenn die Sonne klar aufgegangen ist (Lok.Abs.)"],["bahiḥ vatsyāmahe sarve","werden wir alle draußen weilen (1.Pl.Fut.)"],["sajjībhavata māciram","macht euch bereit, ohne Verzug (Imp.Pl.)"]]],["013","ity uktās tena te paurāḥ pārthenākliṣṭakarmaṇā sajjam āśu tataś cakruḥ svasiddhyarthaṃ samutsukāḥ","So von dem Pārtha unermüdlichen Wirkens angesprochen, machten die Bürger da rasch alles bereit, eifrig auf die eigene Vorbereitung bedacht.","",[["iti uktāḥ tena te paurāḥ pārthena akliṣṭakarmaṇā","so von dem Pārtha unermüdlichen Wirkens angesprochen, die Bürger (Nom.Part.)"],["sajjam āśu tataḥ cakruḥ","machten sie da rasch bereit (3.Pl.Perf.)"],["svasiddhyarthaṃ samutsukāḥ","eifrig auf die eigene Vorbereitung bedacht"]]],["014","tāṃ rātrim avasat pārthaḥ keśavasya niveśane mahatā śokamohena sahasābhipariplutaḥ","Jene Nacht verbrachte der Pārtha in Keśavas Wohnung, plötzlich von gewaltigem Kummer und Verwirrung überwältigt.","",[["tāṃ rātrim avasat pārthaḥ","jene Nacht verbrachte der Pārtha (3.Sg.Impf.)"],["keśavasya niveśane","in Keśavas Wohnung (Lok.)"],["mahatā śokamohena sahasā abhipariplutaḥ","plötzlich von gewaltigem Kummer und Verwirrung überwältigt (Instr.+Nom.Part.)"]]],["015","śvobhūte 'tha tataḥ śaurir vasudevaḥ pratāpavān yuktvātmānaṃ mahātejā jagāma gatim uttamām","Als es dann Morgen wurde, ging Śauri Vasudeva, der Mächtige, von großer Kraft, nachdem er sich selbst [im Yoga] geeint hatte, den höchsten Weg.","[Anm.: Vasudeva stirbt durch bewussten Yoga-Abgang, wie zuvor Kṛṣṇa und Balarāma.]",[["śvaḥbhūte atha tataḥ","als es dann Morgen wurde (Lok.Abs.)"],["śauriḥ vasudevaḥ pratāpavān","Śauri Vasudeva, der Mächtige"],["yuktvā ātmānaṃ mahātejāḥ","nachdem er sich selbst [im Yoga] geeint hatte, von großer Kraft (Abs.)"],["jagāma gatim uttamām","ging den höchsten Weg (3.Sg.Perf.)"]]],["016","tataḥ śabdo mahān āsīd vasudevasya veśmani dāruṇaḥ krośatīnāṃ ca rudatīnāṃ ca yoṣitām","Da erhob sich in Vasudevas Haus ein gewaltiger, schrecklicher Lärm der aufschreienden und weinenden Frauen.","",[["tataḥ śabdaḥ mahān āsīt","da erhob sich ein gewaltiger Lärm (3.Sg.Impf.)"],["vasudevasya veśmani dāruṇaḥ","in Vasudevas Haus, schrecklich (Lok.)"],["krośatīnāṃ ca rudatīnāṃ ca yoṣitām","der aufschreienden und weinenden Frauen (Gen.Pl.)"]]],["017","prakīrṇamūrdhajāḥ sarvā vimuktābharaṇasrajaḥ urāṃsi pāṇibhir ghnantyo vyalapan karuṇaṃ striyaḥ","Mit aufgelöstem Haar, alle Schmuckstücke und Girlanden abgelegt, sich mit den Händen an die Brust schlagend, klagten die Frauen erbarmungswürdig.","",[["prakīrṇamūrdhajāḥ sarvāḥ","mit aufgelöstem Haar, alle"],["vimuktābharaṇasrajaḥ","Schmuckstücke und Girlanden abgelegt"],["urāṃsi pāṇibhiḥ ghnantyaḥ","sich mit den Händen an die Brust schlagend (Part.)"],["vyalapan karuṇaṃ striyaḥ","klagten die Frauen erbarmungswürdig (3.Pl.Impf.)"]]],["018","taṃ devakī ca bhadrā ca rohiṇī madirā tathā anvāroḍhuṃ vyavasitā bhartāraṃ yoṣitāṃ varāḥ","Devakī, Bhadrā, Rohiṇī und ebenso Madirā, die besten der Frauen, entschlossen sich, ihrem Gatten [in den Tod] zu folgen.","",[["taṃ devakī ca bhadrā ca rohiṇī madirā tathā","Devakī, Bhadrā, Rohiṇī und ebenso Madirā (Nom.)"],["anvāroḍhuṃ vyavasitā bhartāraṃ","entschlossen, dem Gatten [in den Tod] zu folgen (Inf.+Nom.Part.)"],["yoṣitāṃ varāḥ","die besten der Frauen"]]],["019","tataḥ śauriṃ nṛyuktena bahumālyena bhārata yānena mahatā pārtho bahir niṣkrāmayat tadā","Dann ließ der Pārtha Śauri auf einem von Männern gezogenen, mit vielen Girlanden geschmückten großen Wagen hinaustragen, o Bhārata.","",[["tataḥ śauriṃ nṛyuktena bahumālyena bhārata","dann Śauri, auf einem von Männern gezogenen, girlandenreichen [Wagen], o Bhārata (Instr.)"],["yānena mahatā pārthaḥ bahiḥ niṣkrāmayat tadā","ließ der Pārtha auf dem großen Wagen hinaustragen, damals (3.Sg.Kaus.Impf.)"]]],["020","tam anvayus tatra tatra duḥkhaśokasamāhatāḥ dvārakāvāsinaḥ paurāḥ sarva eva nararṣabha","Ihm folgten hierhin und dorthin, von Schmerz und Kummer getroffen, die in Dvārakā wohnenden Bürger, alle zumal, o Stier unter den Männern.","",[["tam anvayuḥ tatra tatra","ihm folgten hierhin und dorthin (3.Pl.Impf.)"],["duḥkhaśokasamāhatāḥ","von Schmerz und Kummer getroffen"],["dvārakāvāsinaḥ paurāḥ sarve eva nararṣabha","die in Dvārakā wohnenden Bürger, alle zumal, o Stier unter den Männern"]]],["021","tasyāśvamedhikaṃ chatraṃ dīpyamānāś ca pāvakāḥ purastāt tasya yānasya yājakāś ca tato yayuḥ","Sein Schirm vom Pferdeopfer und die lodernden Feuer gingen dem Wagen voran, und auch die Opferpriester zogen mit.","",[["tasya aśvamedhikaṃ chatraṃ","sein Schirm vom Pferdeopfer (Nom.)"],["dīpyamānāḥ ca pāvakāḥ","und die lodernden Feuer"],["purastāt tasya yānasya yājakāḥ ca tataḥ yayuḥ","vor seinem Wagen, und die Opferpriester zogen mit (3.Pl.Impf.)"]]],["022","anujagmuś ca taṃ vīraṃ devyas tā vai svalaṃkṛtāḥ strīsahasraiḥ parivṛtā vadhūbhiś ca sahasraśaḥ","Und jenem Helden folgten die Königinnen, wohlgeschmückt, umgeben von tausend Frauen und tausendweise von Schwiegertöchtern.","",[["anujagmuḥ ca taṃ vīraṃ devyaḥ tāḥ vai svalaṃkṛtāḥ","und jenem Helden folgten die Königinnen, wohlgeschmückt (3.Pl.Impf.)"],["strīsahasraiḥ parivṛtāḥ vadhūbhiḥ ca sahasraśaḥ","umgeben von tausend Frauen und tausendweise von Schwiegertöchtern (Instr.)"]]],["023","yas tu deśaḥ priyas tasya jīvato 'bhūn mahātmanaḥ tatrainam upasaṃkalpya pitṛmedhaṃ pracakrire","An dem Ort aber, der dem Hochgesinnten zu Lebzeiten lieb gewesen war, bereiteten sie ihn dort vor und vollzogen das Ahnenopfer.","",[["yaḥ tu deśaḥ priyaḥ tasya jīvataḥ abhūt mahātmanaḥ","an dem Ort aber, der dem Hochgesinnten zu Lebzeiten lieb gewesen war (3.Sg.Impf.)"],["tatra enam upasaṃkalpya","ihn dort vorbereitet habend (Abs.)"],["pitṛmedhaṃ pracakrire","vollzogen sie das Ahnenopfer (3.Pl.Perf.Med.)"]]],["024","taṃ citāgnigataṃ vīraṃ śūraputraṃ varāṅganāḥ tato 'nvāruruhuḥ patnyaś catasraḥ patilokagāḥ","Als der Held, der Sohn Śūras, in das Scheiterhaufenfeuer eingegangen war, bestiegen ihm danach die vier vortrefflichen Frauen nach, um in die Welt ihres Gatten zu gelangen.","",[["taṃ citāgnigataṃ vīraṃ śūraputraṃ","den Helden, den Sohn Śūras, ins Scheiterhaufenfeuer eingegangen (Akk.Part.)"],["varāṅganāḥ tataḥ anvāruruhuḥ patnyaḥ catasraḥ","danach bestiegen die vier vortrefflichen Ehefrauen nach (3.Pl.Perf.)"],["patilokagāḥ","um in die Welt des Gatten zu gelangen"]]],["025","taṃ vai catasṛbhiḥ strībhir anvitaṃ pāṇḍunandanaḥ adāhayac candanaiś ca gandhair uccāvacair api","Ihn, von den vier Frauen begleitet, ließ der Sohn des Pāṇḍu mit Sandelholz und mannigfachen wohlriechenden Stoffen verbrennen.","",[["taṃ vai catasṛbhiḥ strībhiḥ anvitaṃ","ihn, von den vier Frauen begleitet (Akk.Part.)"],["pāṇḍunandanaḥ adāhayat","ließ der Sohn des Pāṇḍu verbrennen (3.Sg.Kaus.Impf.)"],["candanaiḥ ca gandhaiḥ uccāvacaiḥ api","mit Sandelholz und mannigfachen wohlriechenden Stoffen (Instr.)"]]],["026","tataḥ prādurabhūc chabdaḥ samiddhasya vibhāvasoḥ sāmagānāṃ ca nirghoṣo narāṇāṃ rudatām api","Da erhob sich der Laut des lodernden Feuers, und der Klang der Sāman-Gesänge, und auch das [Geräusch der] weinenden Männer.","",[["tataḥ prādurabhūt śabdaḥ samiddhasya vibhāvasoḥ","da erhob sich der Laut des lodernden Feuers (3.Sg.Impf.)"],["sāmagānāṃ ca nirghoṣaḥ","und der Klang der Sāman-Gesänge"],["narāṇāṃ rudatām api","und auch der weinenden Männer"]]],["027","tato vajrapradhānās te vṛṣṇivīrakumārakāḥ sarva evodakaṃ cakruḥ striyaś caiva mahātmanaḥ","Dann vollzogen die jungen Prinzen der Vṛṣṇi-Helden, angeführt von Vajra, allesamt, und auch die Frauen, die Wasserspende für den Hochgesinnten.","",[["tataḥ vajrapradhānāḥ te vṛṣṇivīrakumārakāḥ","dann die jungen Prinzen der Vṛṣṇi-Helden, angeführt von Vajra"],["sarve eva udakaṃ cakruḥ","allesamt vollzogen die Wasserspende (3.Pl.Perf.)"],["striyaḥ ca eva mahātmanaḥ","und auch die Frauen, für den Hochgesinnten"]]],["028","aluptadharmas taṃ dharmaṃ kārayitvā sa phalgunaḥ jagāma vṛṣṇayo yatra vinaṣṭā bharatarṣabha","Phalguna, dessen Pflichtgefühl unversehrt war, ließ jenen Ritus vollziehen und ging dorthin, wo die Vṛṣṇis umgekommen waren, o Stier der Bharatas.","",[["aluptadharmaḥ taṃ dharmaṃ kārayitvā","dessen Pflichtgefühl unversehrt war, jenen Ritus vollziehen lassend (Nom.+Abs.Kaus.)"],["saḥ phalgunaḥ jagāma","er, Phalguna, ging (3.Sg.Perf.)"],["vṛṣṇayaḥ yatra vinaṣṭāḥ bharatarṣabha","dorthin, wo die Vṛṣṇis umgekommen waren, o Stier der Bharatas"]]],["029","sa tān dṛṣṭvā nipatitān kadane bhṛśaduḥkhitaḥ babhūvātīva kauravyaḥ prāptakālaṃ cakāra ca","Als er sie im Gemetzel gefallen sah, wurde der Kauravya überaus tief betrübt und vollzog, was dem Anlass gebührte.","",[["saḥ tān dṛṣṭvā nipatitān kadane","als er sie im Gemetzel gefallen sah (Abs.+Akk.Part.)"],["bhṛśaduḥkhitaḥ babhūva atīva kauravyaḥ","wurde der Kauravya überaus tief betrübt (3.Sg.Perf.)"],["prāptakālaṃ cakāra ca","und vollzog, was dem Anlass gebührte (3.Sg.Perf.)"]]],["030","yathāpradhānataś caiva cakre sarvāḥ kriyās tadā ye hatā brahmaśāpena musalair erakodbhavaiḥ","Nach Rang und Würde vollzog er damals alle Riten für jene, die durch den Brahmanenfluch, durch die aus Eraka-Schilf entstandenen Keulen, erschlagen worden waren.","",[["yathāpradhānataḥ ca eva cakre sarvāḥ kriyāḥ tadā","nach Rang und Würde vollzog er damals alle Riten (3.Sg.Perf.Med.)"],["ye hatāḥ brahmaśāpena","für jene, die durch den Brahmanenfluch erschlagen worden waren"],["musalaiḥ erakodbhavaiḥ","durch die aus Eraka-Schilf entstandenen Keulen (Instr.)"]]],["031","tataḥ śarīre rāmasya vāsudevasya cobhayoḥ anviṣya dāhayām āsa puruṣair āptakāribhiḥ","Dann ließ er, nachdem er sie hatte suchen lassen, die Leichname beider - Rāmas und Vāsudevas [Kṛṣṇas] - durch vertraute Männer verbrennen.","",[["tataḥ śarīre rāmasya vāsudevasya ca ubhayoḥ","dann die Leichname beider - Rāmas und Vāsudevas [Kṛṣṇas] (Akk.Dual)"],["anviṣya dāhayām āsa","suchen lassen habend, ließ er verbrennen (Abs.+3.Sg.Kaus.Perf.)"],["puruṣaiḥ āptakāribhiḥ","durch vertraute Männer (Instr.)"]]],["032","sa teṣāṃ vidhivat kṛtvā pretakāryāṇi pāṇḍavaḥ saptame divase prāyād ratham āruhya satvaraḥ aśvayuktai rathaiś cāpi gokharoṣṭrayutair api","Nachdem der Pāṇḍava für sie vorschriftsmäßig die Totenriten vollzogen hatte, bestieg er am siebten Tag rasch seinen Wagen und brach auf, mit pferdebespannten Wagen und auch mit von Rindern, Eseln und Kamelen gezogenen Fuhrwerken.","",[["saḥ teṣāṃ vidhivat kṛtvā pretakāryāṇi pāṇḍavaḥ","nachdem der Pāṇḍava für sie vorschriftsmäßig die Totenriten vollzogen hatte (Abs.)"],["saptame divase prāyāt ratham āruhya satvaraḥ","am siebten Tag bestieg er rasch seinen Wagen und brach auf (3.Sg.Impf.+Abs.)"],["aśvayuktaiḥ rathaiḥ ca api gokharoṣṭrayutaiḥ api","mit pferdebespannten Wagen und auch mit von Rindern, Eseln und Kamelen gezogenen [Fuhrwerken] (Instr.)"]]],["033","striyas tā vṛṣṇivīrāṇāṃ rudatyaḥ śokakarśitāḥ anujagmur mahātmānaṃ pāṇḍuputraṃ dhanaṃjayam","Jene Frauen der Vṛṣṇi-Helden, weinend, von Kummer ausgezehrt, folgten dem hochgesinnten Sohn des Pāṇḍu, Dhanaṃjaya.","",[["striyaḥ tāḥ vṛṣṇivīrāṇāṃ","jene Frauen der Vṛṣṇi-Helden"],["rudatyaḥ śokakarśitāḥ","weinend, von Kummer ausgezehrt"],["anujagmuḥ mahātmānaṃ pāṇḍuputraṃ dhanaṃjayam","folgten dem hochgesinnten Sohn des Pāṇḍu, Dhanaṃjaya (3.Pl.Impf.)"]]],["034","bhṛtyās tv andhakavṛṣṇīnāṃ sādino rathinaś ca ye vīrahīnaṃ vṛddhabālaṃ paurajānapadās tathā yayus te parivāryātha kalatraṃ pārthaśāsanāt","Die Diener der Andhakas und Vṛṣṇis, die Reiter und Wagenlenker, die, der Helden beraubt, und die Alten und Jungen, ebenso die Bürger und Landbewohner - sie zogen mit, die Frauen umringend, auf Befehl des Pārtha.","",[["bhṛtyāḥ tu andhakavṛṣṇīnāṃ sādinaḥ rathinaḥ ca","die Diener der Andhakas und Vṛṣṇis, die Reiter und Wagenlenker"],["ye vīrahīnaṃ vṛddhabālaṃ","die, der Helden beraubt, die Alten und Jungen"],["paurajānapadāḥ tathā yayuḥ te","ebenso die Bürger und Landbewohner - sie zogen mit (3.Pl.Impf.)"],["parivārya atha kalatraṃ pārthaśāsanāt","die Frauen umringend, auf Befehl des Pārtha (Abs.)"]]],["035","kuñjaraiś ca gajārohā yayuḥ śailanibhais tathā sapādarakṣaiḥ saṃyuktāḥ sottarāyudhikā yayuḥ","Auf bergesgleichen Elefanten zogen die Elefantenreiter dahin, begleitet von Fußwachen, bewaffnet mit Wurfgeschossen zogen sie.","",[["kuñjaraiḥ ca gajārohāḥ yayuḥ śailanibhaiḥ tathā","auf bergesgleichen Elefanten zogen die Elefantenreiter (Instr.+3.Pl.Impf.)"],["sapādarakṣaiḥ saṃyuktāḥ","begleitet von Fußwachen"],["sottarāyudhikāḥ yayuḥ","bewaffnet mit Wurfgeschossen zogen sie"]]],["036","putrāś cāndhakavṛṣṇīnāṃ sarve pārtham anuvratāḥ brāhmaṇāḥ kṣatriyā vaiśyāḥ śūdrāś caiva mahādhanāḥ","Und die Söhne der Andhakas und Vṛṣṇis, alle dem Pārtha ergeben - Brahmanen, Kṣatriyas, Vaiśyas und auch vermögende Śūdras,","",[["putrāḥ ca andhakavṛṣṇīnāṃ sarve pārtham anuvratāḥ","und die Söhne der Andhakas und Vṛṣṇis, alle dem Pārtha ergeben"],["brāhmaṇāḥ kṣatriyāḥ vaiśyāḥ śūdrāḥ ca eva mahādhanāḥ","Brahmanen, Kṣatriyas, Vaiśyas und auch vermögende Śūdras"]]],["037","daśa ṣaṭ ca sahasrāṇi vāsudevāvarodhanam puraskṛtya yayur vajraṃ pautraṃ kṛṣṇasya dhīmataḥ","sechzehntausend [Frauen], Vāsudevas Frauengemach, zogen los, wobei sie Vajra, den Enkel des weisen Kṛṣṇa, an die Spitze setzten.","",[["daśa ṣaṭ ca sahasrāṇi vāsudevāvarodhanam","sechzehntausend, Vāsudevas Frauengemach (Nom.)"],["puraskṛtya yayuḥ vajraṃ pautraṃ kṛṣṇasya dhīmataḥ","an die Spitze gesetzt habend, zogen sie los mit Vajra, dem Enkel des weisen Kṛṣṇa (Abs.+3.Pl.Impf.)"]]],["038","bahūni ca sahasrāṇi prayutāny arbudāni ca bhojavṛṣṇyandhakastrīṇāṃ hatanāthāni niryayuḥ","Und viele Tausende, Hunderttausende und Myriaden der Frauen der Bhojas, Vṛṣṇis und Andhakas, ihrer Herren beraubt, zogen aus.","[Anm.: Zahlenangabe hyperbolisch zu verstehen.]",[["bahūni ca sahasrāṇi prayutāni arbudāni ca","und viele Tausende, Hunderttausende und Myriaden"],["bhojavṛṣṇyandhakastrīṇāṃ hatanāthāni","der Frauen der Bhojas, Vṛṣṇis und Andhakas, ihrer Herren beraubt"],["niryayuḥ","zogen aus (3.Pl.Impf.)"]]],["039","tat sāgarasamaprakhyaṃ vṛṣṇicakraṃ maharddhimat uvāha rathināṃ śreṣṭhaḥ pārthaḥ parapuraṃjayaḥ","Jenen dem Ozean gleichenden, prachtvollen Zug der Vṛṣṇis führte der Beste der Wagenkämpfer, der Pārtha, Bezwinger feindlicher Städte.","",[["tat sāgarasamaprakhyaṃ vṛṣṇicakraṃ maharddhimat","jenen dem Ozean gleichenden, prachtvollen Zug der Vṛṣṇis (Akk.)"],["uvāha rathināṃ śreṣṭhaḥ pārthaḥ parapuraṃjayaḥ","führte der Beste der Wagenkämpfer, der Pārtha, Bezwinger feindlicher Städte (3.Sg.Perf.)"]]],["040","niryāte tu jane tasmin sāgaro makarālayaḥ dvārakāṃ ratnasaṃpūrṇāṃ jalenāplāvayat tadā","Als jenes Volk aber ausgezogen war, überflutete der Ozean, die Behausung der Meeresungeheuer, die von Juwelen erfüllte Dvārakā mit seinem Wasser.","",[["niryāte tu jane tasmin","als jenes Volk aber ausgezogen war (Lok.Abs.)"],["sāgaraḥ makarālayaḥ","der Ozean, die Behausung der Meeresungeheuer"],["dvārakāṃ ratnasaṃpūrṇāṃ jalena aplāvayat tadā","überflutete Dvārakā, die von Juwelen erfüllte, mit seinem Wasser, damals (3.Sg.Impf.)"]]],["041","tad adbhutam abhiprekṣya dvārakāvāsino janāḥ tūrṇāt tūrṇataraṃ jagmur aho daivam iti bruvan","Als sie dieses Wunder sahen, eilten die Bewohner Dvārakās immer schneller davon und riefen, dies sei Schicksalsfügung.","[Anm.: 'aho daivam' als formelhafter Kurzausruf gemäß Konvention indirekt wiedergegeben, ohne eigene Anführung.]",[["tat adbhutam abhiprekṣya","dieses Wunder gesehen habend (Abs.)"],["dvārakāvāsinaḥ janāḥ tūrṇāt tūrṇataraṃ jagmuḥ","eilten die Bewohner Dvārakās immer schneller davon (3.Pl.Impf.)"],["aho daivam iti bruvan","indem sie riefen, dies sei Schicksal (Part.)"]]],["042","kānaneṣu ca ramyeṣu parvateṣu nadīṣu ca nivasann ānayām āsa vṛṣṇidārān dhanaṃjayaḥ","In lieblichen Wäldern, auf Bergen und an Flüssen lagernd, führte Dhanaṃjaya die Frauen der Vṛṣṇis weiter.","",[["kānaneṣu ca ramyeṣu parvateṣu nadīṣu ca","in lieblichen Wäldern, auf Bergen und an Flüssen"],["nivasan ānayām āsa vṛṣṇidārān dhanaṃjayaḥ","lagernd führte Dhanaṃjaya die Frauen der Vṛṣṇis (Part.+3.Sg.Kaus.Perf.)"]]],["043","sa pañcanadam āsādya dhīmān atisamṛddhimat deśe gopaśudhānyāḍhye nivāsam akarot prabhuḥ","Als er das Land der fünf Ströme erreicht hatte, schlug der weise Herr sein Lager auf in einem sehr blühenden, an Rindern, Schafen und Getreide reichen Land.","[Anm.: Pañcanada = das Fünfstromland, das spätere Pandschāb.]",[["saḥ pañcanadam āsādya dhīmān","er, das Land der fünf Ströme erreicht habend, der weise (Abs.+Nom.)"],["atisamṛddhimat deśe gopaśudhānyāḍhye","in einem sehr blühenden, an Rindern, Schafen und Getreide reichen Land (Lok.)"],["nivāsam akarot prabhuḥ","schlug der Herr sein Lager auf (3.Sg.Impf.)"]]],["044","tato lobhaḥ samabhavad dasyūnāṃ nihateśvarāḥ dṛṣṭvā striyo nīyamānāḥ pārthenaikena bhārata","Da entstand Gier unter den Räubern, als sie die ihrer Herren beraubten Frauen sahen, die von dem Pārtha allein geführt wurden, o Bhārata.","",[["tataḥ lobhaḥ samabhavat dasyūnāṃ","da entstand Gier unter den Räubern (3.Sg.Impf.)"],["nihateśvarāḥ dṛṣṭvā striyaḥ nīyamānāḥ","als sie die ihrer Herren beraubten, geführten Frauen sahen (Abs.+Akk.Part.)"],["pārthena ekena bhārata","von dem Pārtha allein, o Bhārata (Instr.)"]]],["045","tatas te pāpakarmāṇo lobhopahatacetasaḥ ābhīrā mantrayām āsuḥ sametyāśubhadarśanāḥ","Da berieten sich jene übeltätigen Ābhīras, deren Sinn von Gier überwältigt war, von unheilvollem Aussehen, nachdem sie sich versammelt hatten.","
