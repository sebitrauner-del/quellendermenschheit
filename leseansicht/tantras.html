  "frontmatter": {

      "Diese Ausgabe ist dem tantrischen Korpus des Hinduismus gewidmet – einem weit ausgedehnteren und uneinheitlicheren Textbestand als etwa das Mahābhārata oder die acht vedischen Āraṇyakas. „Der komplette Tantra-/Āgama-Korpus“ ist kein geschlossener Kanon, sondern eine Sammelbezeichnung für drei große, historisch parallele Traditionslinien: die 28 śaivasiddhāntischen Āgamas, die śākta-tantrischen Texte der Göttin-Verehrung und die vaiṣṇavischen Pāñcarātra-Saṃhitās. Diese Ausgabe bildet, wie die parallel laufenden Projekte zu Mahābhārata und Āraṇyakas, ein eigenständiges mehrsitzungsübergreifendes Vorhaben mit eigenem täglichen Übersetzungslauf.",
      "Wichtiger, ehrlicher Befund gleich zu Beginn: anders als beim Mahābhārata oder den Āraṇyakas ist für die meisten der 28 Śaiva-Āgamas und für die meisten Pāñcarātra-Saṃhitās bislang kein frei zugänglicher, unter freien Bedingungen nachnutzbarer Sanskrit-Text aufzufinden. Ein großer Teil ist nie kritisch ediert worden, existiert nur in Handschriften oder wurde zuletzt in gedruckten Ausgaben veröffentlicht, deren Rechte bei wissenschaftlichen Instituten liegen (u.a. dem Institut Français de Pondichéry). Diese Ausgabe übersetzt daher konsequent nur aus Quelltexten, die als eigenständig zugängliche, nicht durch eine jüngere kritische Edition geschützte Fassungen vorliegen – etwa ältere Druckausgaben (z.B. der Avalon-„Tantrik-Texts“-Reihe, frühes 20. Jahrhundert) oder unkommentierte Transkriptionen ohne erkennbaren modernen Herausgeber. Wo für ein gelistetes Werk noch keine solche Quelle gesichert ist, bleibt es als Titel stehen, aber unübersetzt, bis eine geeignete Textgrundlage vorliegt – notfalls durch eine von Dominik bereitgestellte Quelle (PDF/Scan), wie bereits bei den fünf Yoga-Upaniṣaden und den Āraṇyaka-Quelltexten geschehen.",

      "Stand 2026-09-06: Das Projekt ist angelegt, alle drei Abteilungen mit ihren bislang bekannten Werktiteln sind aufgenommen. Die eigentliche Übersetzung beginnt mit der Prapañcasāra-Tantra (Abteilung Śākta-Tantras); die ersten 18 Verse des ersten Paṭala sind bereits übertragen: die Anrufung der Śāradā, die kosmogonische Rahmenerzählung von Brahmā, Hari und Īśvara, die Kopf-zu-Fuß-Beschreibung der ihnen erschienenen, sich als Viṣṇu zu erkennen gebenden Gestalt, und der Beginn eines Lehrdialogs mit dem \"höchsten Licht\".",
      "Nachtrag 2026-09-06: Ein lokal bereitgestellter GRETIL-Gesamtkorpus wurde als Quelle erschlossen und Datei für Datei auf Rechtslage geprüft (freie ältere Druckausgabe bzw. ausdrücklich freigegebene Digitalisierung vs. geschützte moderne kritische Edition, z.B. der Institut-Français-de-Pondichéry- oder Brill-Ausgaben, die konsequent gemieden werden). Als bislang sauberste Quelle erwies sich dabei die Sātvata-Saṃhitā (Abteilung Pāñcarātra-Saṃhitās), eine der drei „Ratnatraya“-Kernschriften: Grundlage ist die alte Chowkhamba-Druckausgabe von 1934, digitalisiert von Oliver Hellwig mit ausdrücklicher freier Nachnutzungserlaubnis. Ihr gesamtes erstes Paṭala (52 Verse) ist inzwischen vollständig übertragen: Sūtas Kṛṣṇa-Anrufung, Nāradas Frage an Śiva auf dem Kailāsa nach dessen Avatāras, eine Sāṃkhya-artige Kosmogonie (Brahman/Bhagavān → Sattā → Prakṛti/Puruṣa/Mahat → dreifaches Ahaṃkāra → Sinnes-/Handlungsorgan-Gottheiten → die fünf Elemente in klassischer Tanmātra-Abfolge), die Rückführung dieser Tattva-Reihe auf den als Virāj manifest werdenden Puruṣa (mit den Etymologien Nārāyaṇa und Puruṣa), die dreigliedrige Avatāra-Hierarchie Viṣṇus (Brahmā/Viṣṇu/Rudra als guṇa-Avatāras, deren Teil-Avatāras, die reinen līlā-Gestalten Haris) und ein abschließender Kṛṣṇa-Lobvers. Auch ihr zweites Paṭala (Aufzählung der Avatāras und Līlā-Gestalten Haris) ist inzwischen vollständig übertragen – 74 Verse (mehr als die ursprünglich angenommenen 58), von Hayaśīrṣa und Varāha über eine lange Reihe Manvantara-spezifischer Nebenavatāras, Kūrma, Dhanvantari, Mohinī, Matsya, Narasiṃha und Vāmana bis zur vollständigen Rāma-Erzählung, der gesamten Kṛṣṇa-Biographie und schließlich künftigen Avatāras bis Kalki. Weitere geprüfte Kandidaten aus demselben Korpus (u.a. Mṛgendrāgama, Mātṛkābhedatantra, Prakāśa-Saṃhitā, Vaikhānasamantrapraśna) warten auf Aufnahme in die Werkliste; mehrere andere (Kiraṇatantra, Sārdhatriśatikālottarāgama, Kubjikāmatatantra, teilweise die Mālinīvijayottaratantra) mussten wegen geschützter moderner Editionen ausgeschlossen werden. Mittlerweile ist auch das dritte Paṭala der Sātvata-Saṃhitā vollständig übertragen (55 Verse): die Lehre von Vollheit (pūrṇa), Anteil (aṃśa, 1/4) und Bruchteil (kalā, 1/16) bzw. Glanzmanifestation (vibhūti, 1/100) der Avatāras anhand der sechs klassischen „bhaga“-Eigenschaften, eine Liste von 62 Einzelqualitäten („bhagabhedas“) sowie eine zweite Lehrunterredung über die Wesenseinheit von Brahman, Nārāyaṇa und Śrī-Kṛṣṇa (Sonnengleichnis). Die Sātvata-Saṃhitā umfasst damit bislang 181 Verse in drei vollständigen Paṭalas.",
      "Nachtrag 2026-09-11: Die Jñānāmṛtasāra-Saṃhitā (Abteilung Pāñcarātra-Saṃhitās, Quelle: GRETIL jnass01u.htm, anonyme gemeinfreie Transkription) ist nun vollständig übertragen – alle 15 Adhyāyas der „Prathamaika-rātra“ („erste Nacht“), wie sie in dieser Quelldatei vorliegt; das Werk selbst legt durch sein eigenes Kolophon („samāptaś cedaṃ nārada-pañca-rātraika-rātram“) offen, dass es sich nur um die erste von mehreren angelegten „Nächten“ handelt und weitere Teile in dieser Quelle nicht enthalten sind; Nāradas abschließende, umfassende Bitte (u.a. um die „noch nie erzählte Geschichte der Rādhikā“) bleibt entsprechend im vorliegenden Text unbeantwortet. Inhaltlich reicht das Werk von einer Lob-preisung seiner selbst über mehrere Wundergeschichten (Naivedya-Rätsel, das Kavaca-Werk Jaganmaṅgala-maṅgalam in voller Länge, eine Kailāsa-Vision der Kṛṣṇa-līlā) und Nāradas Fluchwechsel mit Brahmā samt Verwandlung in einen Gandharva bis zu einer ausführlichen Theophanie mehrerer Gottheiten, der vollständigen Liste aller bisherigen Empfänger von Kṛṣṇas persönlichem Mantra und der (im Rahmen der editorischen Grundsätze dieser Ausgabe ungekürzt, aber mit einordnender Anmerkung übersetzten) frauenfeindlichen „kulaṭā-svabhāva“-Lehrrede Śivas in Kapitel 14.\n\nZugleich musste die Suche nach einem neuen Quelltext für Projekt 4 mit einem ehrlichen Zwischenbefund abgeschlossen werden: Der lokal bereitgestellte GRETIL-Korpus (Ordner saiva/ und vaisn/ unter 4_rellit) ist nun vollständig gesichtet. Zusätzlich zu den bereits zuvor ausgeschlossenen Dateien (Sārdhatriśatikālottarāgama, Kubjikāmatatantra) mussten diesmal auch das Svacchandatantra (svact_pu.htm – ausdrücklich vom EFEO Pondichéry eingegeben, auf Basis der Dwivedi- und KSTS-Ausgaben) und das Kiraṇatantra mit Kommentar (kirtc_au.htm, online bei GRETIL gefunden – Eingabe durch Dominic Goodall, Basis eine IFP/EFEO-Ausgabe von 1998) ausgeschlossen werden. Die Mālinīvijayottaratantra (malinivu.htm) erwies sich bei genauerer Prüfung als insgesamt nicht verwendbar: obwohl ein Teil der Adhikāras (5, 6, 8–10, 18–23) auf der älteren Kaul-Shastri-Ausgabe von 1922 beruht, stammt die gesamte Dateieingabe von Somadeva Vasudeva selbst, dem modernen kritischen Herausgeber der übrigen (Pondichéry-gebundenen) Adhikāras – eine saubere Trennung ist damit nicht gegeben, die Datei wird insgesamt gemieden. Die Śivastotrāvalī Utpaladevas (utsivsau.htm, basierend auf der Ausgabe von Constantina Bailly, Garib Dass Oriental Series 1990) wird im Sinne des Vorsichtsprinzips ebenfalls als vermutlich geschützte moderne Edition behandelt und nicht verwendet. Damit ist der lokale Korpus für Projekt 4 erschöpft.",
      "Ein Versuch, stattdessen die bereits begonnene Prapañcasāra-Tantra (Verse 1.1–1.18, Quelle sanskritdocuments.org) per WebFetch versweise fortzusetzen, musste ebenfalls abgebrochen werden: Die dortige Quelldatei trägt einen ausdrücklichen Nutzungshinweis („not to be copied or reposted ... without permission“), auf den sich der von WebFetch verwendete Hilfsprozess beruft, um die wörtliche Wiedergabe auch einzelner Verse zu verweigern – ein Umgehen dieser Einschränkung (etwa über direkte HTTP-Abfragen) ist mir ausdrücklich untersagt. Projekt 4 hat damit, nach gründlicher Prüfung aller derzeit erreichbaren Quellen, einen echten Engpass erreicht: Für eine Fortsetzung wird entweder eine von Dominik bereitgestellte neue gemeinfreie Quelldatei (PDF/Scan/HTML) für ein Śaiva-Āgama, Śākta-Tantra oder eine Pāñcarātra-Saṃhitā benötigt, oder eine ausdrückliche Entscheidung, wie mit der WebFetch-Einschränkung bei sanskritdocuments.org umzugehen ist. Bis dahin ruht die Neuerschließung von Quelltexten für diese Abteilung; bereits begonnene bzw. abgeschlossene Werke (Sātvata-, Prakāśa-, Vaikhānasamantrapraśna- und Jñānāmṛtasāra-Saṃhitā, sowie Prapañcasāra-Tantra Kap. 1 Vv. 1–18) bleiben selbstverständlich in dieser Ausgabe erhalten."

    "einfuehrung": [
      "„Āgama“ (wörtlich „das Herangekommene“, d.h. überlieferte Offenbarung) und „Tantra“ (wörtlich „Gewebe, System, Handbuch“) bezeichnen im Kern dieselbe Textgattung aus unterschiedlichen sektiererischen Perspektiven: Śaivas sprechen meist von Āgamas, Śāktas von Tantras, Vaiṣṇavas von Saṃhitās – gemeint ist jeweils eine als direkt von der Gottheit offenbart geltende Schrift, die Kosmologie, Ritual, Tempelbau, Ikonographie, Mantra-Praxis, Yoga und Alltagsregeln behandelt, anders als die vedische Śruti oft in Dialogform (meist zwischen Gott und Göttin).",
      "Die Śaiva-Āgamas (traditionell 28 an der Zahl, dazu zahlreiche Upāgamas) bilden die Grundlage der Śaiva-Siddhānta-Theologie Südindiens und regeln bis heute Tempelritual und -architektur. Die Śākta-Tantras stellen die weibliche Schöpfungskraft (Śakti) ins Zentrum und entwickeln u.a. die Kuṇḍalinī- und Cakra-Lehre sowie komplexe Mantra- und Yantra-Systeme. Die vaiṣṇavischen Pāñcarātra-Saṃhitās schließlich liefern die theologische und rituelle Grundlage der Tempelverehrung Viṣṇus, insbesondere im südindischen Śrīvaiṣṇavismus."
    ]

<script>
function loadTheme(){ try{ return localStorage.getItem("tan-theme")||"system"; }catch(e){ return "system"; } }
function saveTheme(v){ try{ localStorage.setItem("tan-theme", v); }catch(e){} }
function applyTheme(v){
  var root = document.documentElement;
  if(v === "dark"){ root.setAttribute("data-theme","dark"); }
  else if(v === "light"){ root.setAttribute("data-theme","light"); }
  else { root.removeAttribute("data-theme"); }
}
var currentTheme = loadTheme();
applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", function(){
  var order = ["system","light","dark"];
  var idx = order.indexOf(currentTheme);
  currentTheme = order[(idx+1) % order.length];
  saveTheme(currentTheme);
  applyTheme(currentTheme);
});
document.getElementById("brand-home").addEventListener("click", function(){ go("#/"); });

var BOOK = JSON.parse(document.getElementById("data-book").textContent);

function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatText(s){
  var e = esc(s);
  e = e.replace(/\[\?\]/g, '<span class="unc-q">[?]</span>');
  e = e.replace(/\[Anm\.:[^\]]*\]/g, function(m){ return '<span class="unc-note">' + m + '</span>'; });
  return e;
}
function go(hash){ location.hash = hash; }
function cssEscape(s){ return s.replace(/["\\]/g, "\\$&"); }

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  if(parts.length === 0) return {view:"front"};
  if(parts[0] === "c" && parts[1] && parts[2] && parts[3] !== undefined){ return {view:"chapter", groupKey:parts[1], workKey:parts[2], chNum:parseInt(parts[3],10)}; }
  if(parts[0] === "glossary") return {view:"glossary"};
  return {view:"front"};
}

function findGroup(groupKey){
  for(var i=0;i<BOOK.groups.length;i++){ if(BOOK.groups[i].key === groupKey) return BOOK.groups[i]; }
  return null;
}
function findWork(groupKey, workKey){
  var g = findGroup(groupKey);
  if(!g) return null;
  for(var i=0;i<g.works.length;i++){ if(g.works[i].key === workKey) return {group:g, work:g.works[i]}; }
  return null;
}
function findChapter(groupKey, workKey, chNum){
  var gw = findWork(groupKey, workKey);
  if(!gw) return null;
  for(var j=0;j<gw.work.chapters.length;j++){ if(gw.work.chapters[j].num === chNum) return {group:gw.group, work:gw.work, chapter:gw.work.chapters[j]}; }
  return null;
}
function flatChapterList(){
  var out = [];
  BOOK.groups.forEach(function(g){ g.works.forEach(function(w){ w.chapters.forEach(function(c){ out.push({group:g, work:w, chapter:c}); }); }); });
  return out;
}
function adjacentChapter(groupKey, workKey, chNum, dir){
  var flat = flatChapterList();
  var idx = -1;
  for(var i=0;i<flat.length;i++){ if(flat[i].group.key === groupKey && flat[i].work.key === workKey && flat[i].chapter.num === chNum){ idx = i; break; } }
  if(idx === -1) return null;
  var nidx = idx + dir;
  if(nidx < 0 || nidx >= flat.length) return null;
  return flat[nidx];
}

function wfwCell(pair){
  var cls = "wfw-cell" + (pair[1] && pair[1].length > 70 ? " wfw-cell-long" : "");
  return '<div class="' + cls + '"><span class="wfw-sa">' + esc(pair[0]) + '</span><span class="wfw-de">' + esc(pair[1]) + '</span></div>';
}
function wfwHtml(u, uid){
  var html = '<button class="wfw-toggle" data-wfw-target="' + uid + '">Wort f&uuml;r Wort &#9656;</button>';
  html += '<div class="wfw-panel" id="' + uid + '" hidden><div class="wfw-grid">';
  u.wfw.forEach(function(pair){ html += wfwCell(pair); });
  html += '</div></div>';
  return html;
}

var viewEl = document.getElementById("view");

function render(){
  var r = parseHash();
  closeMobileSidebar();
  if(r.view === "chapter"){ renderReader(r); }
  else if(r.view === "glossary"){ renderReader(r); }
  else { renderReader({view:"front"}); }
  window.scrollTo(0,0);
}

function tocChapterHtml(groupKey, workKey, c, opts){
  var active = opts.view === "chapter" && opts.groupKey === groupKey && opts.workKey === workKey && opts.chNum === c.num;
  var label = c.title_de || c.title_sa || ("Nr. " + c.num);
  return '<a class="toc-chapter' + (active?' active':'') + '" href="#/c/' + encodeURIComponent(groupKey) + '/' + encodeURIComponent(workKey) + '/' + c.num + '"><span class="tn">' + c.num + '</span>' + esc(label) + '</a>';
}

function firstChapterRef(){
  var flat = flatChapterList();
  return flat.length ? flat[0] : null;
}

function frontHtml(){
  var html = '';
  html += '<h1 class="front-title">' + esc(BOOK.title) + '</h1>';
  html += '<p class="front-subtitle">' + esc(BOOK.subtitle) + '</p>';
  var first = firstChapterRef();
  if(first){
    html += '<a class="front-cta" href="#/c/' + encodeURIComponent(first.group.key) + '/' + encodeURIComponent(first.work.key) + '/' + first.chapter.num + '">Lesen beginnen &rarr;</a>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.vorwort){
    html += '<div class="front-section"><h2>Vorwort</h2>';
    BOOK.frontmatter.vorwort.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.einfuehrung){
    html += '<div class="front-section"><h2>Einf&uuml;hrung</h2>';
    BOOK.frontmatter.einfuehrung.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  BOOK.groups.forEach(function(g){
    html += '<div class="front-group"><div class="front-group-name">' + esc(g.name) + '</div>';
    html += '<div class="front-group-desc">' + esc(g.desc) + '</div>';
    html += '<div class="front-work-list">';
    g.works.forEach(function(w, i){
      var status = w.chapters.length ? ('&uuml;bersetzt bis Abschnitt ' + w.chapters[w.chapters.length-1].num) : 'noch nicht begonnen';
      var statusCls = w.chapters.length ? 'fwl-status active' : 'fwl-status';
      var nameHtml = w.chapters.length ? ('<a href="#/c/' + encodeURIComponent(g.key) + '/' + encodeURIComponent(w.key) + '/' + w.chapters[0].num + '">' + esc(w.name) + '</a>') : esc(w.name);
      html += '<div class="fwl-item"><div class="fwl-num">' + (i+1) + '</div><div style="flex:1"><div class="fwl-name">' + nameHtml + '</div><div class="fwl-desc">' + esc(w.desc||'') + '</div></div><div class="' + statusCls + '">' + status + '</div></div>';
    });
    html += '</div></div>';
  });
  return html;
}

function glossaryHtml(){
  var html = '<h1 class="front-title" style="font-size:28px">Glossar</h1>';
  html += '<p class="front-subtitle">' + BOOK.glossary.length + ' Begriffe, alphabetisch geordnet.</p>';
  var entries = BOOK.glossary.slice().sort(function(a,b){ return a.term.localeCompare(b.term); });
  var lastLetter = null;
  html += '<div class="glossary-grid">';
  entries.forEach(function(e){
    var letter = e.term.charAt(0).toUpperCase();
    if(letter !== lastLetter){ html += '<div class="gl-letter">' + esc(letter) + '</div>'; lastLetter = letter; }
    html += '<div class="gl-entry"><span class="gl-term">' + esc(e.term) + '</span><span class="gl-cat">' + esc(e.category||'') + '</span>';
    html += '<div class="gl-def">' + esc(e.definition) + '</div></div>';
  });
  html += '</div>';
  return html;
}

function chapterHtml(groupKey, workKey, chNum){
  var found = findChapter(groupKey, workKey, chNum);
  if(!found) return '<p class="empty-note">Abschnitt nicht gefunden.</p>';
  var g = found.group, w = found.work, c = found.chapter;
  var html = '';
  var isFirstOfWork = w.chapters[0].num === c.num;
  if(isFirstOfWork){
    html += '<div class="division-banner"><div class="db-label">' + esc(g.name) + '</div>';
    html += '<h2>' + esc(w.name) + '</h2>';
    if(w.desc) html += '<p>' + formatText(w.desc) + '</p>';
    html += '</div>';
  }
  html += '<div class="chapter-head">';
  html += '<span class="chapter-eyebrow">' + esc(g.name) + ' &middot; ' + esc(w.name) + ' &middot; Abschnitt ' + c.num + '</span>';
  if(c.title_sa) html += '<div class="chapter-title-sa">' + esc(c.title_sa) + '</div>';
  html += '<div class="chapter-title-de">' + esc(c.title_de || ('Abschnitt ' + c.num)) + '</div>';
  html += '</div>';
  if(c.note){ html += '<div class="chapter-note"><span class="cn-label">Einordnung</span>' + formatText(c.note) + '</div>'; }
  c.units.forEach(function(u, uidx){
    html += '<div class="unit">';
    html += '<span class="unit-n">' + esc(u.n) + '</span>';
    html += '<div class="unit-sa">' + formatText(u.sa) + '</div>';
    html += '<div class="unit-de">' + formatText(u.de) + '</div>';
    if(u.notes) html += '<div class="unit-notes">' + formatText(u.notes) + '</div>';
    if(u.wfw) html += wfwHtml(u, g.key + "-" + w.key + "-" + c.num + "-" + uidx);
    html += '</div>';
  });
  var prev = adjacentChapter(groupKey, workKey, chNum, -1);
  var next = adjacentChapter(groupKey, workKey, chNum, 1);
  html += '<div class="chapter-pager">';
  if(prev){ html += '<a class="pager-btn prev" href="#/c/' + encodeURIComponent(prev.group.key) + '/' + encodeURIComponent(prev.work.key) + '/' + prev.chapter.num + '"><span class="pg-label">&larr; Zur&uuml;ck</span><span class="pg-title">' + esc(prev.chapter.title_de || ('Abschnitt ' + prev.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  if(next){ html += '<a class="pager-btn next" href="#/c/' + encodeURIComponent(next.group.key) + '/' + encodeURIComponent(next.work.key) + '/' + next.chapter.num + '"><span class="pg-label">Weiter &rarr;</span><span class="pg-title">' + esc(next.chapter.title_de || ('Abschnitt ' + next.chapter.num)) + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  html += '</div>';
  return html;
}

function renderReader(opts){
  var openGroupKey = opts.view === "chapter" ? opts.groupKey : (BOOK.groups[0] && BOOK.groups[0].key);
  var openWorkKey = opts.view === "chapter" ? opts.workKey : null;
  var html = '<div class="reader">';
  html += '<button class="sidebar-toggle" id="sidebar-toggle-btn">&#9776; Inhaltsverzeichnis</button>';
  html += '<aside class="reader-sidebar" id="reader-sidebar">';
  html += '<a class="reader-back" href="#/">&larr; Vorwort &amp; &Uuml;bersicht</a>';
  html += '<div class="sidebar-title">' + esc(BOOK.title) + '</div>';
  html += '<div class="sidebar-sub">3 Abteilungen &middot; im Aufbau</div>';
  html += '<div class="sidebar-tabs">';
  html += '<button class="sidebar-tab' + (opts.view==="front"?' active':'') + '" data-tab="front">Vorwort</button>';
  html += '<button class="sidebar-tab' + (opts.view==="chapter"?' active':'') + '" data-tab="text">Text</button>';
  html += '<button class="sidebar-tab' + (opts.view==="glossary"?' active':'') + '" data-tab="glossary">Glossar</button>';
  html += '</div>';
  BOOK.groups.forEach(function(g){
    var isOpen = g.key === openGroupKey;
    html += '<div class="toc-division">';
    html += '<div class="toc-division-head' + (isOpen?' open':'') + '" data-div="' + esc(g.key) + '"><span class="car">&#9656;</span>' + esc(g.name) + '</div>';
    if(isOpen) html += '<div class="toc-division-desc">' + esc(g.desc) + '</div>';
    html += '<div class="toc-works' + (isOpen?' open':'') + '" data-div-body="' + esc(g.key) + '">';
    g.works.forEach(function(w){
      var wOpen = isOpen && (w.key === openWorkKey || (!openWorkKey && w.chapters.length && w.key === (function(){ for(var i=0;i<g.works.length;i++){ if(g.works[i].chapters.length) return g.works[i].key; } return null; })()));
      html += '<div class="toc-work">';
      html += '<div class="toc-work-head' + (wOpen?' open':'') + '" data-work="' + esc(g.key) + '::' + esc(w.key) + '"><span class="car2">&#9656;</span>' + esc(w.name) + '</div>';
      html += '<div class="toc-chapters' + (wOpen?' open':'') + '" data-work-body="' + esc(g.key) + '::' + esc(w.key) + '">';
      if(w.chapters.length === 0){ html += '<div class="toc-empty">noch nicht &uuml;bersetzt</div>'; }
      w.chapters.forEach(function(c){ html += tocChapterHtml(g.key, w.key, c, opts); });
      html += '</div></div>';
    });
    html += '</div></div>';
  });
  html += '</aside>';
  html += '<div class="reader-main"><div class="reader-content" id="reader-content">';
  if(opts.view === "front") html += frontHtml();
  else if(opts.view === "glossary") html += glossaryHtml();
  else if(opts.view === "chapter") html += chapterHtml(opts.groupKey, opts.workKey, opts.chNum);
  html += '</div></div></div>';
  viewEl.innerHTML = html;

  Array.prototype.forEach.call(viewEl.querySelectorAll(".toc-division-head"), function(h){
    h.addEventListener("click", function(){
      h.classList.toggle("open");
      var body = viewEl.querySelector('.toc-works[data-div-body="' + cssEscape(h.getAttribute("data-div")) + '"]');
      if(body) body.classList.toggle("open");
    });
  });
  Array.prototype.forEach.call(viewEl.querySelectorAll(".toc-work-head"), function(h){
    h.addEventListener("click", function(){
      h.classList.toggle("open");
      var key = h.getAttribute("data-work");
      var body = viewEl.querySelector('.toc-chapters[data-work-body="' + cssEscape(key) + '"]');
      if(body) body.classList.toggle("open");
    });
  });
  Array.prototype.forEach.call(viewEl.querySelectorAll(".sidebar-tab"), function(t){
    t.addEventListener("click", function(){
      var tab = t.getAttribute("data-tab");
      if(tab === "front") go("#/");
      else if(tab === "glossary") go("#/glossary");
      else {
        var first = firstChapterRef();
        if(first){ go("#/c/" + encodeURIComponent(first.group.key) + "/" + encodeURIComponent(first.work.key) + "/" + first.chapter.num); }
      }
    });
  });
  var toggleBtn = document.getElementById("sidebar-toggle-btn");
  if(toggleBtn) toggleBtn.addEventListener("click", openMobileSidebar);
  Array.prototype.forEach.call(viewEl.querySelectorAll(".wfw-toggle[data-wfw-target]"), function(btn){
    btn.addEventListener("click", function(){
      var panel = document.getElementById(btn.getAttribute("data-wfw-target"));
      if(!panel) return;
      var open = !panel.hidden;
      panel.hidden = open;
      btn.innerHTML = "Wort f&uuml;r Wort " + (open ? "&#9656;" : "&#9662;");
    });
  });
}

function openMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.add("open"); if(scrim) scrim.classList.add("open");
}
function closeMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.remove("open"); if(scrim) scrim.classList.remove("open");
}
document.getElementById("sidebar-scrim").addEventListener("click", closeMobileSidebar);

function loadWorks(){
  var jobs=[];
  BOOK.groups.forEach(function(g){ g.works.forEach(function(w){
    if(w.chaptersFile){ jobs.push(fetch(w.chaptersFile).then(function(r){ return r.json(); }).then(function(c){ w.chapters=c; })); }
  }); });
  return Promise.all(jobs);
}
window.addEventListener("hashchange", render);
document.getElementById("view").innerHTML='<div class="empty-note" style="padding:40px">Lade Kapitel &hellip;</div>';
loadWorks().then(render, function(e){ document.getElementById("view").textContent="Fehler beim Laden der Kapitel: "+e; });
</script>
