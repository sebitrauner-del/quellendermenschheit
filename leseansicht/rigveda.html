<script id="data-book" type="application/json">{"title": "Ṛgveda", "subtitle": "Zweisprachige Leseausgabe des Ṛgveda: Sanskrit (IAST) und deutsche Übersetzung, Vers für Vers mit Wort-für-Wort-Analyse aus dem Padapāṭha. Eigenständiges Parallelprojekt neben der Hauptreihe von „Quellen der Menschheit“.", "stats": {"suktas": 1028, "verses": 10557}, "frontmatter": {"vorwort": ["Diese Ausgabe ist dem Ṛgveda gewidmet, der ältesten erhaltenen Sammlung vedischer Hymnen. Sie ist ein eigenständiges Vorhaben neben der Hauptreihe dieser Bibliothek und wird wie die übrigen großen Werke Vers für Vers und Sūkta für Sūkta aufgebaut. Vollständigkeit ist das erklärte Ziel.", "Die Übersetzung ist durchgehend deutsch und entsteht aus dem Sanskrit-Original, jedes Wort einzeln aus dem Padapāṭha analysiert. Keine vorhandene Übersetzung oder Kommentierung dient als Ausgangspunkt. Bei mehrdeutigen Wörtern wird zuerst der ganze Bedeutungsbereich angesetzt, unmögliche Lesarten werden verworfen, dann Metonymie, technischer Gebrauch und ältere Bedeutungen geprüft; bevorzugt wird die Lesart mit den wenigsten Zusatzannahmen. Rituelle Begriffe werden wörtlich und nicht durch spätere Klischees wiedergegeben (etwa „Weihehandlung“ oder „Verehrung“ für yajña, „Rufer“ für hotṛ).", "Unsichere oder ergänzte Stellen sind mit [?] gekennzeichnet, Alternativlesarten und Wortwahl in [Anm.: …]. Rätselhafte Lieder lassen ihre Mehrdeutigkeit stehen. Die Übersetzung wurde maschinell erarbeitet und ist eine Arbeitsfassung: Sie ersetzt keine philologische Prüfung durch Fachleute.", "Textgrundlage ist der Saṃhitā-Text nach Aufrecht (1877) und der Padapāṭha aus den GRETIL-Korpusdateien. Der antike Wortlaut ist gemeinfrei. Der Sanskrit-Text erscheint in IAST ohne Akzente; die Wortanalyse folgt der Padapāṭha-Trennung. Wo die Quelle den Saṃhitā-Text nicht enthält (einige Verse in 1.65–1.70), ist er aus dem Padapāṭha rekonstruiert und so gekennzeichnet.", "Übersetzt sind bisher 1028 von 1028 Sūktas mit zusammen 10557 Versen; weitere folgen in den nächsten Veröffentlichungen."], "einfuehrung": ["Der Ṛgveda besteht aus zehn Maṇḍalas („Kreisen“, Büchern) mit 1028 Liedern (Sūktas) und rund 10.500 Versen. Die Bücher 2 bis 7 tragen die Namen einzelner Dichterfamilien und gelten als der älteste Kern; Buch 8 und Buch 1 sind gemischt, Buch 9 enthält ausschließlich Lieder an Soma, Buch 10 ist das jüngste und enthält Kosmogonien, Totenlieder und Dialoge.", "Die Sprache ist Vedisch, eine ältere Sprachstufe mit eigenem Wortschatz und eigener Grammatik, getrennt vom späteren klassischen Sanskrit. Viele Wörter haben einen weiteren Bedeutungsbereich als in späteren Texten. Deshalb führt jede Wortkarte („Wort für Wort“) das Padapāṭha-Wort mit einer kurzen Glosse und Grammatikangabe auf.", "Lesehilfe: Jeder Vers steht zuerst im Sanskrit (Pādas untereinander), dann in deutscher Übersetzung; „Wort für Wort“ klappt die Analyse auf. Über das Feld „Springen“ im Inhaltsverzeichnis gelangt man direkt zu einem Sūkta, zum Beispiel 1.164."]}, "glossary": [{"term": "Ṛgveda", "category": "Werktitel", "definition": "„Wissen der Preisverse“ (ṛc, „Preisvers“ + veda, „Wissen“): älteste Sammlung vedischer Hymnen, 10 Maṇḍalas, 1028 Sūktas, rund 10.500 Verse."}, {"term": "maṇḍala", "category": "Gliederung", "definition": "„Kreis, Buch“: eines der zehn Bücher des Ṛgveda. Die Maṇḍalas 2–7 sind Familienbücher, 9 ist das Soma-Buch."}, {"term": "sūkta", "category": "Gliederung", "definition": "„gut Gesprochenes“: ein Lied (Hymnus) aus mehreren Versen. Zitiert als RV Maṇḍala.Sūkta.Vers."}, {"term": "ṛc", "category": "Gliederung", "definition": "Preisvers des Ṛgveda, Strophe in gebundener Sprache; der Veda heißt nach ihm."}, {"term": "pāda", "category": "Metrik", "definition": "Verszeile („Fuß“). Die meisten Strophen haben drei oder vier Pādas, hier durch Zeilenumbruch getrennt."}, {"term": "Padapāṭha", "category": "Textgestalt", "definition": "Wort-für-Wort-Fassung des Ṛgveda ohne Sandhi, mit aufgelösten Komposita. Grundlage der Wortanalyse in dieser Ausgabe."}, {"term": "Saṃhitā-Text", "category": "Textgestalt", "definition": "Der zusammenhängende Text mit Lautverschmelzung (Sandhi), wie er rezitiert wird."}, {"term": "yajña", "category": "Begriff", "definition": "Von √yaj „verehren, weihen“. Wird hier je nach Kontext als Verehrung, Weihehandlung oder Darbringung wiedergegeben, nicht automatisch als „Opfer“."}, {"term": "hotṛ", "category": "Begriff", "definition": "„Rufer, Anrufer“ (√hu), Priester, der die Götter herbeiruft."}, {"term": "deva", "category": "Begriff", "definition": "„himmlisch, leuchtend“, als Nomen Gott oder göttliche Macht."}, {"term": "ṛta", "category": "Begriff", "definition": "Ordnung, Wahrheit, rechter Lauf der Dinge (Welt, Ritual und Rede)."}, {"term": "soma", "category": "Begriff", "definition": "Gepresster Saft einer Pflanze und zugleich der Gott Soma, im 9. Maṇḍala besungen."}, {"term": "ṛṣi", "category": "Begriff", "definition": "„Seher, Dichter“, Verfasser der Lieder."}, {"term": "Agni", "category": "Gottheit", "definition": "Feuer, Gott des Feuers, Bote zwischen Menschen und Göttern; der erste Vers des Ṛgveda ruft ihn an."}, {"term": "Indra", "category": "Gottheit", "definition": "Kriegerischer Hauptgott des Ṛgveda, Töter des Vṛtra."}, {"term": "Marut", "category": "Gottheit", "definition": "Sturmgötter, Begleiter Indras."}, {"term": "Uṣas", "category": "Gottheit", "definition": "Göttin der Morgenröte."}, {"term": "Vālakhilya", "category": "Werkteil", "definition": "Die elf Sūktas 8.49–59, die in der Überlieferung als Anhang des 8. Maṇḍala gelten."}, {"term": "[?]", "category": "Zeichen", "definition": "Kennzeichnet eine unsichere Wiedergabe."}, {"term": "[Anm.: …]", "category": "Zeichen", "definition": "Eingebettete Anmerkung zu Alternativlesarten oder Wortwahl."}], "divisions": [{"key": "1", "name": "Maṇḍala 1", "desc": "191 Sūktas verschiedener Dichter und Familien, darunter die großen Agni-, Indra- und Aśvin-Zyklen und das Rätsellied 1.164 (Dīrghatamas <script>
function loadTheme(){ try{ return localStorage.getItem("rv-theme")||"system"; }catch(e){ return "system"; } }
function saveTheme(v){ try{ localStorage.setItem("rv-theme", v); }catch(e){} }
function applyTheme(v){
  var root = document.documentElement;
  if(v === "dark"){ root.setAttribute("data-theme","dark"); }
  else if(v === "light"){ root.setAttribute("data-theme","light"); }
  else { root.removeAttribute("data-theme"); }
}
var currentTheme = loadTheme();
applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", function(){
  var order = ["system","light","dark"];
  currentTheme = order[(order.indexOf(currentTheme)+1) % order.length];
  saveTheme(currentTheme);
  applyTheme(currentTheme);
});
document.getElementById("brand-home").addEventListener("click", function(){ go("#/"); });

var BOOK = JSON.parse(document.getElementById("data-book").textContent);
var DIVDATA = {}; /* key -> {num: chapter} */

function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatText(s){
  var e = esc(s);
  e = e.replace(/\[\?\]/g, '<span class="unc-q">[?]</span>');
  e = e.replace(/\[Anm\.:[^\]]*\]/g, function(m){ return '<span class="unc-note">' + m + '</span>'; });
  return e;
}
function padas(s){ return formatText(s).replace(/ \/ /g, "<br>"); }
function go(hash){ location.hash = hash; }
function cssEscape(s){ return s.replace(/["\\]/g, "\\$&"); }

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
  if(parts.length === 0) return {view:"front"};
  if(parts[0] === "c" && parts[1] && parts[2] !== undefined){ return {view:"chapter", divKey:parts[1], chNum:parseInt(parts[2],10)}; }
  if(parts[0] === "glossary") return {view:"glossary"};
  return {view:"front"};
}

function findDiv(key){ for(var i=0;i<BOOK.divisions.length;i++){ if(BOOK.divisions[i].key === key) return BOOK.divisions[i]; } return null; }
function flatChapterList(){
  var out = [];
  BOOK.divisions.forEach(function(d){ d.toc.forEach(function(c){ out.push({division:d, chapter:c}); }); });
  return out;
}
function adjacentChapter(divKey, chNum, dir){
  var flat = flatChapterList();
  var idx = -1;
  for(var i=0;i<flat.length;i++){ if(flat[i].division.key === divKey && flat[i].chapter.num === chNum){ idx = i; break; } }
  if(idx === -1) return null;
  var nidx = idx + dir;
  if(nidx < 0 || nidx >= flat.length) return null;
  return flat[nidx];
}
function loadDivision(d){
  if(DIVDATA[d.key]) return Promise.resolve(DIVDATA[d.key]);
  return fetch(d.file).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(arr){
    var map = {};
    arr.forEach(function(c){ map[c.num] = c; });
    DIVDATA[d.key] = map;
    return map;
  });
}

function wfwCell(pair){
  var cls = "wfw-cell" + (pair[1] && pair[1].length > 70 ? " wfw-cell-long" : "");
  return '<div class="' + cls + '"><span class="wfw-sa">' + esc(pair[0]) + '</span><span class="wfw-de">' + esc(pair[1]) + '</span></div>';
}
function wfwHtml(u, uid){
  var html = '<button class="wfw-toggle" data-wfw-target="' + uid + '">Wort f&uuml;r Wort &#9656;</button>';
  html += '<div class="wfw-panel" id="' + uid + '" hidden><div class="wfw-grid">';
  u.wfw.forEach(function(pair){ html += wfwCell(pair); });
  html += '</div></div>';
  return html;
}

var viewEl = document.getElementById("view");
var renderSeq = 0;

function render(){
  var r = parseHash();
  closeMobileSidebar();
  var seq = ++renderSeq;
  if(r.view === "chapter"){
    var d = findDiv(r.divKey);
    if(!d){ renderReader({view:"front"}, null); window.scrollTo(0,0); return; }
    renderReader(r, '<p class="empty-note">Lade Maṇḍala ' + esc(d.key) + ' &hellip;</p>');
    loadDivision(d).then(function(){
      if(seq !== renderSeq) return;
      renderReader(r, null);
      window.scrollTo(0,0);
    }).catch(function(err){
      if(seq !== renderSeq) return;
      renderReader(r, '<p class="empty-note">Die Textdatei dieses Maṇḍala konnte nicht geladen werden (' + esc(err.message) + '). Bitte Seite neu laden.</p>');
    });
    return;
  }
  renderReader(r, null);
  window.scrollTo(0,0);
}

function tocChapterHtml(divKey, c, opts){
  var active = opts.view === "chapter" && opts.divKey === divKey && opts.chNum === c.num;
  var label = c.title_de || ("Sūkta " + c.num);
  return '<a class="toc-chapter' + (active?' active':'') + '" href="#/c/' + encodeURIComponent(divKey) + '/' + c.num + '"><span class="tn">' + divKey + '.' + c.num + '</span>' + esc(label) + '</a>';
}

function frontHtml(){
  var html = '';
  html += '<h1 class="front-title">' + esc(BOOK.title) + '</h1>';
  html += '<p class="front-subtitle">' + esc(BOOK.subtitle) + '</p>';
  var firstDiv = null;
  for(var i=0;i<BOOK.divisions.length;i++){ if(BOOK.divisions[i].toc.length){ firstDiv = BOOK.divisions[i]; break; } }
  if(firstDiv){
    html += '<a class="front-cta" href="#/c/' + encodeURIComponent(firstDiv.key) + '/' + firstDiv.toc[0].num + '">Lesen beginnen &rarr;</a>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.vorwort){
    html += '<div class="front-section"><h2>Vorwort</h2>';
    BOOK.frontmatter.vorwort.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  if(BOOK.frontmatter && BOOK.frontmatter.einfuehrung){
    html += '<div class="front-section"><h2>Einf&uuml;hrung</h2>';
    BOOK.frontmatter.einfuehrung.forEach(function(p){ html += '<p>' + formatText(p) + '</p>'; });
    html += '</div>';
  }
  html += '<div class="front-section"><h2>Die zehn Ma&#7751;&#7693;alas</h2><div class="front-parva-list">';
  BOOK.divisions.forEach(function(d, i){
    var st = d.toc.length ? ' <em>&mdash; ' + d.toc.length + ' von ' + d.total_suktas + ' S&#363;ktas &uuml;bersetzt</em>' : ' <em>&mdash; noch nicht begonnen</em>';
    html += '<div class="fpl-item"><div class="fpl-num">' + (i+1) + '</div><div><div class="fpl-name">' + esc(d.name) + '</div><div class="fpl-desc">' + esc(d.desc) + st + '</div></div></div>';
  });
  html += '</div></div>';
  return html;
}

function glossaryHtml(){
  var html = '<h1 class="front-title" style="font-size:28px">Glossar</h1>';
  html += '<p class="front-subtitle">' + BOOK.glossary.length + ' Begriffe, alphabetisch geordnet.</p>';
  var entries = BOOK.glossary.slice().sort(function(a,b){ return a.term.localeCompare(b.term); });
  var lastLetter = null;
  html += '<div class="glossary-grid">';
  entries.forEach(function(e){
    var letter = e.term.charAt(0).toUpperCase();
    if(letter !== lastLetter){ html += '<div class="gl-letter">' + esc(letter) + '</div>'; lastLetter = letter; }
    html += '<div class="gl-entry"><span class="gl-term">' + esc(e.term) + '</span><span class="gl-cat">' + esc(e.category||'') + '</span>';
    html += '<div class="gl-def">' + esc(e.definition) + '</div></div>';
  });
  html += '</div>';
  return html;
}

function chapterHtml(divKey, chNum){
  var d = findDiv(divKey);
  var c = d && DIVDATA[divKey] && DIVDATA[divKey][chNum];
  if(!c) return '<p class="empty-note">S&#363;kta nicht gefunden.</p>';
  var html = '';
  var isFirstOfDivision = d.toc[0].num === c.num;
  if(isFirstOfDivision){
    html += '<div class="division-banner"><div class="db-label">Ma&#7751;&#7693;ala</div>';
    html += '<h2>' + esc(d.name) + '</h2>';
    if(d.desc) html += '<p>' + formatText(d.desc) + '</p>';
    html += '</div>';
  }
  html += '<div class="chapter-head">';
  html += '<span class="chapter-eyebrow">RV ' + divKey + '.' + c.num + ' &middot; ' + c.units.length + ' Verse</span>';
  if(c.title_sa) html += '<div class="chapter-title-sa">' + esc(c.title_sa) + '</div>';
  html += '<div class="chapter-title-de">' + esc(c.title_de || ('S\u016bkta ' + c.num)) + '</div>';
  html += '</div>';
  if(c.note){ html += '<div class="chapter-note"><span class="cn-label">Einordnung</span>' + formatText(c.note) + '</div>'; }
  c.units.forEach(function(u, uidx){
    html += '<div class="unit">';
    html += '<span class="unit-n">' + esc(u.n) + '</span>';
    html += '<div class="unit-sa">' + padas(u.sa) + '</div>';
    html += '<div class="unit-de">' + padas(u.de) + '</div>';
    if(u.wfw) html += wfwHtml(u, "w-" + divKey + "-" + c.num + "-" + uidx);
    html += '</div>';
  });
  var prev = adjacentChapter(divKey, chNum, -1);
  var next = adjacentChapter(divKey, chNum, 1);
  html += '<div class="chapter-pager">';
  if(prev){ html += '<a class="pager-btn prev" href="#/c/' + encodeURIComponent(prev.division.key) + '/' + prev.chapter.num + '"><span class="pg-label">&larr; RV ' + prev.division.key + '.' + prev.chapter.num + '</span><span class="pg-title">' + esc(prev.chapter.title_de || '') + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  if(next){ html += '<a class="pager-btn next" href="#/c/' + encodeURIComponent(next.division.key) + '/' + next.chapter.num + '"><span class="pg-label">RV ' + next.division.key + '.' + next.chapter.num + ' &rarr;</span><span class="pg-title">' + esc(next.chapter.title_de || '') + '</span></a>'; }
  else { html += '<div class="pager-spacer"></div>'; }
  html += '</div>';
  return html;
}

function jumpTo(txt){
  var m = /^\s*(\d{1,2})\s*[.,:\/ ]\s*(\d{1,3})/.exec(txt || "");
  if(!m) return false;
  var d = findDiv(m[1]);
  if(!d) return false;
  var n = parseInt(m[2],10);
  for(var i=0;i<d.toc.length;i++){ if(d.toc[i].num === n){ go("#/c/" + m[1] + "/" + n); return true; } }
  return false;
}

function renderReader(opts, override){
  var openDivKey = opts.view === "chapter" ? opts.divKey : (BOOK.divisions[0] && BOOK.divisions[0].key);
  var html = '<div class="reader">';
  html += '<button class="sidebar-toggle" id="sidebar-toggle-btn">&#9776; Inhaltsverzeichnis</button>';
  html += '<aside class="reader-sidebar" id="reader-sidebar">';
  html += '<a class="reader-back" href="#/">&larr; Vorwort &amp; &Uuml;bersicht</a>';
  html += '<div class="sidebar-title">' + esc(BOOK.title) + '</div>';
  html += '<div class="sidebar-sub">10 Ma&#7751;&#7693;alas &middot; ' + BOOK.stats.suktas + ' S&#363;ktas, ' + BOOK.stats.verses + ' Verse &uuml;bersetzt</div>';
  html += '<div class="sidebar-tabs">';
  html += '<button class="sidebar-tab' + (opts.view==="front"?' active':'') + '" data-tab="front">Vorwort</button>';
  html += '<button class="sidebar-tab' + (opts.view==="chapter"?' active':'') + '" data-tab="text">Text</button>';
  html += '<button class="sidebar-tab' + (opts.view==="glossary"?' active':'') + '" data-tab="glossary">Glossar</button>';
  html += '</div>';
  html += '<form id="jump-form" style="display:flex;gap:6px;margin:0 0 14px"><input id="jump-input" type="text" inputmode="decimal" placeholder="Springen: 1.164" aria-label="Zu S\u016bkta springen, zum Beispiel 1.164" style="flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg-card);color:var(--ink);font:inherit;font-size:12.5px"><button class="sidebar-tab" type="submit">Los</button></form>';
  BOOK.divisions.forEach(function(d){
    var isOpen = d.key === openDivKey;
    html += '<div class="toc-division">';
    html += '<div class="toc-division-head' + (isOpen?' open':'') + '" data-div="' + esc(d.key) + '"><span class="car">&#9656;</span>' + esc(d.name) + '</div>';
    html += '<div class="toc-chapters' + (isOpen?' open':'') + '" data-div-body="' + esc(d.key) + '">';
    if(d.toc.length === 0){ html += '<div class="toc-empty">Noch nicht &uuml;bersetzt.</div>'; }
    d.toc.forEach(function(c){ html += tocChapterHtml(d.key, c, opts); });
    html += '</div></div>';
  });
  html += '</aside>';
  html += '<div class="reader-main"><div class="reader-content" id="reader-content">';
  if(opts.view === "front") html += frontHtml();
  else if(opts.view === "glossary") html += glossaryHtml();
  else if(opts.view === "chapter") html += (override !== null && override !== undefined) ? override : chapterHtml(opts.divKey, opts.chNum);
  html += '</div></div></div>';
  viewEl.innerHTML = html;

  Array.prototype.forEach.call(viewEl.querySelectorAll(".toc-division-head"), function(h){
    h.addEventListener("click", function(){
      h.classList.toggle("open");
      var body = viewEl.querySelector('.toc-chapters[data-div-body="' + cssEscape(h.getAttribute("data-div")) + '"]');
      if(body) body.classList.toggle("open");
    });
  });
  Array.prototype.forEach.call(viewEl.querySelectorAll(".sidebar-tab[data-tab]"), function(t){
    t.addEventListener("click", function(){
      var tab = t.getAttribute("data-tab");
      if(tab === "front") go("#/");
      else if(tab === "glossary") go("#/glossary");
      else {
        var flat = flatChapterList();
        if(flat.length){ go("#/c/" + encodeURIComponent(flat[0].division.key) + "/" + flat[0].chapter.num); }
      }
    });
  });
  var jf = document.getElementById("jump-form");
  if(jf) jf.addEventListener("submit", function(ev){
    ev.preventDefault();
    var inp = document.getElementById("jump-input");
    if(!jumpTo(inp.value)){ inp.style.borderColor = "var(--unc-ink)"; inp.value = ""; inp.placeholder = "nicht vorhanden"; }
  });
  var toggleBtn = document.getElementById("sidebar-toggle-btn");
  if(toggleBtn) toggleBtn.addEventListener("click", openMobileSidebar);
  Array.prototype.forEach.call(viewEl.querySelectorAll(".wfw-toggle[data-wfw-target]"), function(btn){
    btn.addEventListener("click", function(){
      var panel = document.getElementById(btn.getAttribute("data-wfw-target"));
      if(!panel) return;
      var open = !panel.hidden;
      panel.hidden = open;
      btn.innerHTML = "Wort f&uuml;r Wort " + (open ? "&#9656;" : "&#9662;");
    });
  });
}

function openMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.add("open"); if(scrim) scrim.classList.add("open");
}
function closeMobileSidebar(){
  var sb = document.getElementById("reader-sidebar"); var scrim = document.getElementById("sidebar-scrim");
  if(sb) sb.classList.remove("open"); if(scrim) scrim.classList.remove("open");
}
document.getElementById("sidebar-scrim").addEventListener("click", closeMobileSidebar);

window.addEventListener("hashchange", render);
render();

</script>


</body>
</html>
