<script id="data-book" type="application/json">{"title":"Sāmaveda","subtitle":"Zweisprachige Leseausgabe der Sāmaveda-Saṃhitā (Kauthuma-Śākhā): Sanskrit (IAST) und deutsche Übersetzung, Mantra für Mantra, alle 1875 Mantras.","stats":{"groups":468,"verses":1875,"unsure":969},"frontmatter":{"vorwort":["Diese Ausgabe enthält die vollständige Sāmaveda-Saṃhitā in der Kauthuma-Rezension: alle 1875 Mantras, geordnet nach der überlieferten Gliederung in Pūrvārcika, Āraṇya-Ārcika, Mahānāmnī-Ārcika und Uttarārcika. Sie steht als eigenständiges Werk neben den übrigen Büchern von „Quellen der Menschheit“.","Die Übersetzung ist durchgehend deutsch und entstand Vers für Vers aus dem Sanskrit, ohne vorhandene Übersetzungen oder Kommentare als Ausgangspunkt. Bei mehrdeutigen Wörtern wurde zuerst der ganze Bedeutungsbereich angesetzt, unmögliche Lesarten wurden verworfen, dann Metonymie, technischer Gebrauch und ältere Bedeutungen geprüft; bevorzugt ist die Lesart mit den wenigsten Zusatzannahmen. Rituelle Begriffe stehen wörtlich (etwa „Weihehandlung“ für yajña, „Rufer“ für hotṛ).","Unsichere Stellen sind mit [?] markiert, Alternativlesarten und Besonderheiten stehen als [Anm.: …] im Text. Es sind bewusst viele Stellen markiert: 969 [?] auf 1875 Mantras. Die Übersetzung ist eine maschinell erarbeitete Arbeitsfassung und ersetzt keine philologische Prüfung durch Fachleute.","Textgrundlage ist die GRETIL-Datei „Samaveda-Samhita“ (Eingabe von Anshuman Pandey, 1998). Sie gibt den Text ohne Akzente und ohne Wortgrenzen-Trennung wieder; der antike Wortlaut ist gemeinfrei. Die Quelle enthält kleine Eingabefehler bei der Mantra-Nummerierung (etwa doppelt vergebene Nummern 121 und 1181, fehlende 1179 und 1211). Hier sind die Mantras deshalb fortlaufend 1 bis 1875 in Quellenreihenfolge gezählt. Ein „3“ im Wort (etwa nyā3triṇam) ist ein Dehnungszeichen (Pluti) der Quelle."],"einfuehrung":["Der Sāmaveda ist der Veda der Gesänge (sāman). Seine Saṃhitā ist kein eigener Dichtungsschatz, sondern eine Auswahl von Versen, fast alle aus dem Ṛgveda (besonders aus den Büchern 8 und 9), die für den gesungenen Vortrag beim Somaopfer geordnet sind. Die Melodien (gāna) sind in eigenen Liederbüchern überliefert und nicht Teil dieses Textes.","Das Werk hat zwei Hauptteile. Das Pūrvārcika („erstes Verspaket“) ordnet Einzelverse nach Gottheiten: Agni (Āgneya), Indra (Aindra), Soma Pavamāna (Pāvamāna); dazu kommen der Āraṇya-Teil und die Mahānāmnī-Verse. Das Uttarārcika („zweites Verspaket“) fasst Verse zu Tṛcas, Dreiversgruppen, zusammen, die der Reihenfolge der Somapressungen und Lieder folgen.","Lesehilfe: Jeder Mantra steht zuerst im Sanskrit (Pādas untereinander), dann in deutscher Übersetzung. Im Inhaltsverzeichnis sind die Gruppen (Daśati, Tṛca, Abschnitt) nach Divisionen geordnet. Über das Feld „Springen“ kommt man mit der Mantra-Nummer (1 bis 1875) direkt an die Stelle."]},"glossary":[{"term":"Sāmaveda","category":"Werktitel","definition":"„Wissen der Gesänge“ (sāman „Gesang, Melodie“ + veda): der dritte Veda, Textsammlung für den Vortrag der Udgātṛ-Priester. Erhaltene Schulen: Kauthuma, Jaiminīya, Rāṇāyanīya."},{"term":"ārcika","category":"Gliederung","definition":"„Verspaket“ (von ṛc, Vers): Pūrvārcika und Uttarārcika sind die beiden Hauptteile der Saṃhitā."},{"term":"prapāṭhaka","category":"Gliederung","definition":"„Vorlesung, Abschnitt“: größere Texteinheit; jeweils in Ardhas („Hälften“) geteilt."},{"term":"daśati","category":"Gliederung","definition":"Zehnergruppe von Mantras im Pūrvārcika."},{"term":"tṛca","category":"Gliederung","definition":"Dreiversgruppe des Uttarārcika, die als Einheit gesungen wird."},{"term":"sāman","category":"Begriff","definition":"Gesungene Melodie, über einem Vers (ṛc) gesungen; der Verstext ist Träger der Melodie."},{"term":"stobha","category":"Begriff","definition":"Eingeschobene Gesangssilbe ohne Wortbedeutung (etwa hāu, hoi); hier unübersetzt."},{"term":"udgātṛ","category":"Begriff","definition":"„Sänger, Aufsteiger“: der Priester, der die Sāman singt."},{"term":"Pavamāna","category":"Gottheit","definition":"„der sich Klärende“: Soma, wenn der Saft durch das Seihtuch läuft."},{"term":"yajña","category":"Begriff","definition":"Von √yaj „verehren, weihen“. Wird hier je nach Kontext Verehrung, Weihehandlung oder Darbringung genannt, nicht automatisch „Opfer“."},{"term":"hotṛ","category":"Begriff","definition":"„Rufer, Anrufer“ (√hu), der Priester, der die Götter herbeiruft."},{"term":"[?]","category":"Zeichen","definition":"Kennzeichnet eine unsichere Wiedergabe."},{"term":"[Anm.: …]","category":"Zeichen","definition":"Eingebettete Anmerkung zu Alternativlesarten oder Wortwahl."}],"divisions":[{"key":"agneya","name":"Āgneya-Kāṇḍa","desc":"Pūrvārcika, Chanda-Ārcika: Lieder an Agni, den Rufer der Weihehandlung (Mantras 1–114).","total":12,"toc":[{"num":1,"title_de":"Agni-Anruf: Rufer, Bote und Weihehandlung","n_from":1,"n_to":10},{"num":2,"title_de":"Agni: Huldigung, Bote, Vertreiber der Feinde","n_from":11,"n_to":20},{"num":3,"title_de":"Agni: Schutz und Reichtum, der Bote Jātavedas","n_from":21,"n_to":34},{"num":4,"title_de":"Agni: Lobgesänge und Bitte um Reichtum","n_from":35,"n_to":44},{"num":5,"title_de":"Agni: Lob des Enkels der Kraft, Führer der Weihehandlung","n_from":45,"n_to":54},{"num":6,"title_de":"Agni und Brahmaṇaspati: Bitte um Gaben und Beistand","n_from":55,"n_to":62},{"num":7,"title_de":"Agni: Der Hausherr, Rufer und Bote der Menschen","n_from":63,"n_to":72},{"num":8,"title_de":"Agni: Erwachen am Morgen, Hüter, Vertreiber der Unholde","n_from":73,"n_to":80},{"num":9,"title_de":"Agni: Kraftvoller Glanz und Gast der Menschen","n_from":81,"n_to":90},{"num":10,"title_de":"Agni und andere Götter: Anrufung und Vertreibung der Unholde","n_from":91,"n_to":96},{"num":11,"title_de":"Agni-Lieder: Anruf, Bitte um Ruhm, Abwehr der Feinde","n_from":97,"n_to":106},{"num":12,"title_de":"Agni-Lieder: Preis des Gastes und Rufers","n_from":107,"n_to":114}]},{"key":"aindra","name":"Aindra-Kāṇ <script id="data-text" type="application/json">{"agneya":[{"num":1,"loc":"Prapāṭhaka I, Ardha 1, Daśati 1","n_from":1,"n_to":10,"title_de":"Agni-Anruf: Rufer, Bote und Weihehandlung","note":"Agni als Rufer (hotṛ) und Bote zwischen Menschen und Himmlischen; Eröffnung der Sammlung.","units":[{"n":1,"sa":"agna ā yāhi vītaye gṛṇāno havyadātaye\nni hotā satsi barhiṣi","de":"Agni, komm herbei zum Mahl, gepriesen, um die Darbringung zu bringen; setze dich als Rufer auf die Streu."},{"n":2,"sa":"tvamagne yajñānāṃ hotā viśveṣāṃ hitaḥ\ndevebhirmānuṣe jane","de":"Du, Agni, bist der Rufer aller Weihehandlungen, eingesetzt unter dem menschlichen Volk, zusammen mit den Himmlischen."},{"n":3,"sa":"agniṃ dūtaṃ vṛṇīmahe hotāraṃ viśvavedasam\nasya yajñasya sukratum","de":"Agni erwählen wir zum Boten, den Rufer, den Allkundigen, den Einsichtigen [?] dieser Weihehandlung."},{"n":4,"sa":"agnirvṛtrāṇi jaṅghanaddraviṇasyurvipanyayā\nsamiddhaḥ śukra āhutaḥ","de":"Agni, der die Widerstände niederschlägt, nach Gut verlangend, mit Lobpreis [?], entzündet, hell, mit Spende begossen."},{"n":5,"sa":"preṣṭhaṃ vo atithiṃ stuṣe mitramiva priyam\nagne rathaṃ na vedyam","de":"Euren liebsten Gast preise ich, wie einen Freund den Teuren, Agni, der wie ein Wagen zu finden ist [?]."},{"n":6,"sa":"tvaṃ no agne mahobhiḥ pāhi viśvasyā arāteḥ\nuta dviṣo martyasya","de":"Du, Agni, beschütze uns mit deinen Machtkräften vor jedem Geiz [?], und auch vor dem Feind, dem Sterblichen."},{"n":7,"sa":"ehyū ṣu bravāṇi te 'gna itthetarā giraḥ\nebhirvardhāsa indubhiḥ","de":"Komm doch her, ich will dir gut andere Lieder sagen, Agni; mit diesen Säften [Anm.: indu, Somatropfen] wachse!"},{"n":8,"sa":"ā te vatso mano yamatparamāccitsadhasthāt\nagne tvāṃ kāmaye girā","de":"Zu dir hat sich das Kalb (der Sänger) den Sinn gelenkt, selbst vom fernsten gemeinsamen Sitz aus; Agni, dich begehre ich mit dem Lied."},{"n":9,"sa":"tvāmagne puṣkarādadhyatharvā niramanthata\nmūrdhno viśvasya vāghataḥ","de":"Dich, Agni, haben aus dem Lotos [Anm.: puṣkara, auch „Wasserfläche“] Atharvan herausgequirlt, aus dem Haupt des ganzen Redners [?]."},{"n":10,"sa":"agne vivasvadā bharāsmabhyamūtaye mahe\ndevo hyasi no dṛśe","de":"Agni, bring uns Glanz des Vivasvat [?] zum Beistand, zur Größe; denn du bist ein Gott, dass wir ihn schauen."}]},{"num":2,"loc":"Prapāṭhaka I, Ardha 1, Daśati 2","n_from":11,"n_to":20,"title_de":"Agni: Huldigung, Bote, Vertreiber der Feinde","note":"","units":[{"n":11,"sa":"namaste agna ojase gṛṇanti deva kṛṣṭayaḥ\namairamitramardaya","de":"Verehrung dir, Agni, für die Kraft; dich preisen, Gott, die Menschenstämme; mit Stärke treibe den Feind nieder."},{"n":12,"sa":"dūtaṃ vo viśvavedasaṃ havyavāhamamartyam\nyajiṣṭhamṛñjase girā","de":"Den Boten von euch, den Allkundigen, den unsterblichen Darbringungsträger, den Verehrungswürdigsten schmücke ich mit dem Lied."},{"n":13,"sa":"upa tvā jāmayo giro dediśatīrhaviṣkṛtaḥ\nvāyoranīke asthiran","de":"Zu dir hin haben sich die Lieder, die Schwestern, der Opferspender [?] die Weisungen erteilend, gestellt, an die Spitze des Windes [?]."},{"n":14,"sa":"upa tvāgne divedive doṣāvastardhiyā vayam\nnamo bharanta emasi","de":"Zu dir, Agni, tragen wir Tag für Tag, abends und morgens, mit Andacht Verehrung und kommen [zu dir]."},{"n":15,"sa":"jarābodha tadviviḍḍhi viśeviśe yajñiyāya\nstomaṃ rudrāya dṛśīkam","de":"Du, der Alterserwecker [?], nimm dies auf; für den zu verehrenden Gott, für Rudra [ein Lob], das schön anzusehen ist [?]."},{"n":16,"sa":"prati tyaṃ cārumadhvaraṃ gopīthāya pra hūyase\nmarudbhiragna ā gahi","de":"Dich, den lieblichen, den Weihehandlung Vollbringenden, rufe ich dir zum Trank herbei; mit den Maruts, Agni, komm her."},{"n":17,"sa":"aśvaṃ na tvā vāravantaṃ vandadhyā agniṃ namobhiḥ\nsamrājantamadhvarāṇām","de":"Wie ein Ross, so möchte ich dich, Agni, mit Verehrung anrufen [?], den Schweifbesitzer [?], den Herrscher der Weihehandlungen."},{"n":18,"sa":"aurvabhṛguvacchucimapnavānavadā huve\nagniṃ samudravāsasam","de":"Wie Aurva und Bhṛgu, wie Apnavāna rufe ich den reinen Agni, der das Meer als Kleid hat."},{"n":19,"sa":"agnimindhāno manasā dhiyaṃ saceta martyaḥ\nagnimindhe vivasvabhiḥ","de":"Agni entzündend möge der Sterbliche mit dem Sinn das Denken erlangen; Agni entzünden die Eifrigen."},{"n":20,"sa":"āditpratnasya retaso jyotiḥ paśyanti vāsaram\nparo yadidhyate divi","de":"Dann erst erblicken sie das Licht des uralten Samens, den Tag, wenn er droben im Himmel entflammt wird."}]},{"num":3,"loc":"Prapāṭhaka I, Ardha 1, Daśati 3","n_from":21,"n_to":34,"title_de":"Agni: Schutz und Reichtum, der Bote Jātavedas","note":"","units":[{"n":21,"sa":"agniṃ vo vṛdhantamadhvarāṇāṃ purūtamam\nacchā naptre sahasvate","de":"Agni, den euch, den bei den Weihehandlungen Wachsenden, den Vielfältigsten, [rufen wir] zum Enkel [?] des Starken hin."},{"n":22,"sa":"agnistigmena śociṣā yaṃsadviśvaṃ nyā3triṇam\nagnirno vaṃsate rayim","de":"Agni möge mit scharfer Flamme alles niederhalten, was auf Fressende [?] gerichtet ist; Agni soll uns Reichtum erlangen."},{"n":23,"sa":"agne mṛḍa mahāṃ asyaya ā devayuṃ janam\niyetha barhirāsadam","de":"Agni, sei gnädig, du Großer, der du zum götterliebenden Volk kommst und dich auf der Streu niedersetzt."},{"n":24,"sa":"agne rakṣā ṇo aṃhasaḥ prati sma deva rīṣataḥ\ntapiṣṭhairajaro daha","de":"Agni, schütze uns vor Bedrängnis, Gott, gegen den, der uns schaden will; mit den heißesten [Flammen] verbrenne ihn, der du nie alterst."},{"n":25,"sa":"agne yuṅkṣvā hi ye tavāśvāso deva sādhavaḥ\naraṃ vahantyāśavaḥ","de":"Agni, schirre an, Gott, deine trefflichen Rosse; die schnellen führen genug herbei."},{"n":26,"sa":"ni tvā nakṣya viśpate dyumantaṃ dhīmahe vayam\nsuvīramagna āhuta","de":"Wir setzen dich, Herr der Sippe, den Glänzenden nieder; mit guten Männern, Agni, du Angerufener [?]."},{"n":27,"sa":"agnirmūrdhā divaḥ kakutpatiḥ pṛthivyā ayam\napāṃ retāṃsi jinvati","de":"Agni ist das Haupt des Himmels, der Gipfel; dieser ist der Herr der Erde; er belebt die Samen der Wasser."},{"n":28,"sa":"imamū ṣu tvamasmākaṃ saniṃ gāyatraṃ navyāṃsam\nagne deveṣu pra vocaḥ","de":"Dieses Gāyatra-Lied, das neue, unser Gewinn [?], sprich, Agni, unter den Himmlischen."},{"n":29,"sa":"taṃ tvā gopavano girā janiṣṭhadagne aṅgaraḥ\nsa pāvaka śrudhī havam","de":"Dich hat mit dem Lied der Gopavana hervorgebracht, Agni, [der] Aṅgiras; du Läuternder, höre den Ruf."},{"n":30,"sa":"pari vājapatiḥ kaviragnirhavyānyakramīt\ndadhadratnāni dāśuṣe","de":"Rings ist der Herr der Kraft, der Seher Agni, zu den Darbringungen geschritten, Kleinode verleihend dem Darbringer."},{"n":31,"sa":"udu tyaṃ jātavedasaṃ devaṃ vahanti ketavaḥ\ndṛśe viśvāya sūryam","de":"Empor tragen ihn, den Jātavedas, den Gott, die Strahlen, damit alle die Sonne sehen."},{"n":32,"sa":"kavimagnimupa stuhi satyadharmāṇamadhvare\ndevamamīvacātanam","de":"Den Seher Agni preise bei der Weihehandlung, den, dessen Ordnung wahr ist, den Gott, der das Übel verscheucht."},{"n":33,"sa":"śaṃ no devīrabhiṣṭaye śaṃ no bhavantu pītaye\nśaṃ yorabhi sravantu naḥ","de":"Heil sollen uns die göttlichen [Wasser] zum Erlangen, Heil zum Trinken sein; Heil und Segen sollen sie uns zuströmen."},{"n":34,"sa":"kasya nūnaṃ parīṇasi dhiyo jinvasi satpate\njoṣātā yasya te giraḥ","de":"Wen wirst du jetzt umfassen [?], welche Gedanken belebst du, Herr des Guten? Dessen Lieder dir angenehm sind."}]},{"num":4,"loc":"Prapāṭhaka I, Ardha 1, Daśati 4","n_from":35,"n_to":44,"title_de":"Agni: Lobgesänge und Bitte um Reichtum","note":"","units":[{"n":35,"sa":"yajñāyajñā vo agnaye girāgirā ca dakṣase\nprapra vayamamṛtaṃ jātavedasaṃ priyaṃ mitraṃ na śaṃsiṣam","de":"Bei jeder Weihehandlung und mit jedem Lied [preisen wir] euch, Agni, für die Kraft; ich möchte den Unsterblichen, den Jātavedas, wie einen lieben Freund lobpreisen."},{"n":36,"sa":"pāhi no agna ekayā pāhyū3ta dvitīyayā\npāhi gīrbhistisṛbhirūrjāṃ pate pāhi catasṛbhirvaso","de":"Schütze uns, Agni, mit der einen [Strophe], schütze auch mit der zweiten; schütze mit den drei Liedern, Herr der Kraft, schütze mit den vier, du Guter."},{"n":37,"sa":"bṛhadbhiragne arcibhiḥ śukreṇa deva śociṣā\nbharadvāje samidhāno yaviṣṭhya revatpāvaka dīdihi","de":"Mit großen Strahlen, Agni, mit reinem Glanz, Gott, entflamme dich, bei Bharadvāja entzündet, du Jüngster; leuchte reichlich, du Läuternder."},{"n":38,"sa":"tve agne svāhuta priyāsaḥ santu sūrayaḥ\nyantāro ye maghavāno janānāmūrvaṃ dayanta gonām","de":"In dir, Agni, dem gut Beopferten, sollen die Gönner [?] lieb sein, die Mäzene, die Herren der Menschen, die den weiten Kuhstall öffnen."},{"n":39,"sa":"agne jaritarviśpatistapāno deva rakṣasaḥ\naproṣivāngṛhapate mahāṃ asi divaspāyurduroṇayuḥ","de":"Agni, Sänger, Herr der Sippe, Gott, der du die Unholde erhitzest, unversehrt, Hausherr, du bist groß, Hüter des Himmels, das Haus [?] behütend."},{"n":40,"sa":"agne vivasvaduṣasaścitraṃ rādho amartya\nā dāśuṣe jātavedo vahā tvamadyā devāṃ uṣarbudhaḥ","de":"Agni, [bring] glänzenden Reichtum wie [den] des Vivasvat [?] von den Morgenröten, Unsterblicher; führ ihn dem Darbringer zu, Jātavedas; bring heute die Götter, die mit der Morgenröte erwachen."},{"n":41,"sa":"tvaṃ naścitra ūtyā vaso rādhāṃsi codaya\nasya rāyastvamagne rathīrasi vidā gādhaṃ tuce tu naḥ","de":"Du bist, glänzender, mit deinem Beistand, Vasu, treib unsere Gaben an; dieses Besitzes bist du der Wagenlenker; finde uns eine Furt für Nachkommenschaft und für uns."},{"n":42,"sa":"tvamitsaprathā asyagne trātarṛtaḥ kaviḥ\ntvāṃ viprāsaḥ samidhāna dīdiva ā vivāsanti vedhasaḥ","de":"Du bist wahrlich der Ausbreiter [?], Agni, Retter, der Wahrhaftige, Seher; dich umgeben die Weisen, Entflammter, leuchtend, als Verehrer [?]."},{"n":43,"sa":"ā no agne vayovṛdhaṃ rayiṃ pāvaka śaṃsyam\nrāsvā ca na upamāte puruspṛhaṃ sunītī suyaśastaram","de":"Bring uns, Agni, Kraft mehrenden Reichtum, der zu preisen ist, Läuternder; und gib uns, du Ebenbild [?], vielbegehrten, mit Führung [?] sehr ruhmvollen."},{"n":44,"sa":"yo viśvā dayate vasu hotā mandro janānām\nmadhorna pātrā prathamānyasmai pra stomā yantvagnaye","de":"Der alle Güter verteilt, der Rufer, der Erfreuende der Menschen: wie Honigschalen sollen die ersten Lobgesänge zu ihm, zu Agni, gelangen."}]},{"num":5,"loc":"Prapāṭhaka I, Ardha 1, Daśati 5","n_from":45,"n_to":54,"title_de":"Agni: Lob des Enkels der Kraft, Führer der Weihehandlung","note":"","units":[{"n":45,"sa":"enā vo agniṃ namasorjo napātamā huve\npriyaṃ cetiṣṭhamaratiṃ svādhvaraṃ viśvasya dūtamamṛtam","de":"Mit dieser Verehrung rufe ich euch Agni herbei, den Enkel der Stärke, den Lieben, den Wachsten [?], den Widerstandslosen, den bei der Weihehandlung Guten, den Boten aller, den Unsterblichen."},{"n":46,"sa":"śeṣe vaneṣu mātṛṣu saṃ tvā martāsa indhate\natandro havyaṃ vahasi haviṣkṛta ādiddeveṣu rājasi","de":"Du liegst in den Wäldern, in den Müttern [?]; dich entzünden die Sterblichen; unermüdet fährst du die Darbringung; du, der Spender-Beschenkte, herrschst dann unter den Himmlischen."},{"n":47,"sa":"adarśi gātuvittamo yasminvratānyādadhuḥ\nupo ṣu jātamāryasya vardhanamagniṃ nakṣantu no giraḥ","de":"Er ward erblickt, der beste Wegfinder, bei dem sie die Gebote niedergelegt haben; gut zu dem Geborenen, dem Förderer des Ārya, sollen unsere Lieder gelangen, zu Agni."},{"n":48,"sa":"agnirukthe purohito grāvāṇo barhiradhvare\nṛcā yāmi maruto brahmaṇaspate devā avo vareṇyam","de":"Agni ist beim Preisspruch der Vorangestellte, die Presssteine, die Streu bei der Weihehandlung; mit dem Spruch gehe ich zu, ihr Maruts, Herr des Gebets, ihr Götter, [ich bitte] um euren erwünschten Beistand."},{"n":49,"sa":"agnimīḍiṣvāvase gāthābhiḥ śīraśociṣam\nagniṃ rāye purumīḍha śrutaṃ naro 'gniḥ sudītaye chardiḥ","de":"Agni rufe ich an um Beistand mit Liedern, den mit blitzendem Strahl [?]; Agni um Reichtum, Vielgepriesener, den berühmten Männer; Agni [wollen wir] zum hellen Leuchten [suchen], Zuflucht."},{"n":50,"sa":"śrudhi śrutkarṇa vahnibhirdevairagne sayāvabhiḥ\nā sīdatu barhiṣi mitro aryamā prātaryāvabhiradhvare","de":"Höre, der du Ohr hast zu hören, mit den Fahrern, Agni, mit den Göttern, die gemeinsam kommen; es soll sich auf die Streu setzen Mitra und Aryaman, mit den Morgenfahrern, bei der Weihehandlung."},{"n":51,"sa":"pra daivodāso agnirdeva indro na majmanā\nanu mātaraṃ pṛthivīṃ vi vāvṛte tasthau nākasya śarmaṇi","de":"Es hat sich Agni Daivodāsa wie ein Gott, wie Indra durch Macht, zur Mutter Erde hingewandt; er stand im Schutz des Himmelsgewölbes."},{"n":52,"sa":"adha jmo adha vā divo bṛhato rocanādadhi\nayā vardhasva tanvā girā mamā jātā sukrato pṛṇa","de":"Sei es von der Erde, sei es vom Himmel, vom hohen Lichtraum her: mit diesem Leib und diesem Lied wachse; erfülle mich, den Geborenen, du Gutwirkender [?]."},{"n":53,"sa":"kāyamāno vanā tvaṃ yanmātR^īrajagannapaḥ\nna tatte agne pramṛṣe nivartanaṃ yaddūre sannihābhuvaḥ","de":"Als du, begehrend, die Wälder [?], die Mütter, die Wasser durchgingst: das wird dir, Agni, nicht vergessen, die Umkehr, dass du fern warst und hier wurdest."},{"n":54,"sa":"ni tvāmagne manurdadhe jyotirjanāya śaśvate\ndīdetha kaṇva ṛtajāta ukṣito yaṃ namasyanti kṛṣṭayaḥ","de":"Dich hat Manu, Agni, für das ewige Volk als Licht eingesetzt; du leuchtest wie Kaṇva, aus der Ordnung geboren, begossen, den die Menschenstämme verehren."}]},{"num":6,"loc":"Prapāṭhaka I, Ardha 2, Daśati 6","n_from":55,"n_to":62,"title_de":"Agni und Brahmaṇaspati: Bitte um Gaben und Beistand","note":"","units":[{"n":55,"sa":"devo vo draviṇodāḥ pūrṇāṃ vivaṣṭvāsicam\nudvā siñjadhvamupa vā pṛṇadhvamādidvo deva ohate","de":"Der Gott, der Gut-Spender [Anm.: draviṇodāḥ], soll euch das volle Ausgießen [?] begehren: gießt auf, oder füllt es an; dann wird euch der Gott [zu]fahren [?]."},{"n":56,"sa":"praitu brahmaṇaspatiḥ pra devyetu sūnṛtā\nacchā vīraṃ naryaṃ paṅktirādhasaṃ devā yajñaṃ nayantu naḥ","de":"Es soll vorangehen Brahmaṇaspati, es soll vorangehen die göttliche Wahrhaftigkeit [?]; zum männlichen, tüchtigen Helden, der der Reihe [?] Gabe hat, sollen die Götter unsere Weihehandlung führen."},{"n":57,"sa":"ūrdhva ū ṣu ṇa ūtaye tiṣṭhā devo na savitā\nūrdhvo vājasya sanitā yadañjibhirvāghadbhirvihvayāmahe","de":"Steh aufrecht für unseren Beistand, wie der Gott Savitṛ; aufrecht als Gewinner der Kraft, da wir mit Salbenden und Redekundigen [?] rufen."},{"n":58,"sa":"pra yo rāye ninīṣati marto yaste vaso dāśat\nsa vīraṃ dhatte agna ukthaśaṃsinaṃ tmanā sahasrapoṣiṇam","de":"Der Sterbliche, der zum Reichtum hin zu führen begehrt, der dir, Vasu, dargibt: der trägt selbst einen Helden, Agni, der Preis spricht, tausendfach nährend."},{"n":59,"sa":"pra vo yahvaṃ purūṇāṃ viśāṃ devayatīnām\nagniṃ sūktebhirvacobhirvṛṇīmahe yaṃsamidanya indhate","de":"Vor euch [wollen wir] den Jungen, der vieler götterliebender Sippen [Agni], mit wohlgesprochenen Worten Agni wählen, den ein anderer [oder: je der andere] entzündet [?]."},{"n":60,"sa":"ayamagniḥ suvīryasyeśe hi saubhagasya\nrāya īśe svapatyasya gomata īśe vṛtrahathānām","de":"Dieser Agni ist Herr über gute Manneskraft und Glück; er ist Herr über Reichtum und gute Nachkommen, Herr über den Kuhreichtum, Herr über die Vṛtra-Schläge."},{"n":61,"sa":"tvamagne gṛhapatistvaṃ hotā no adhvare\ntvaṃ potā viśvavāra pracetā tākṣi yāsi ca vāryam","de":"Du, Agni, bist der Hausherr, du unser Rufer bei der Weihehandlung; du der Potṛ, Allerwünschte, Bedachtsame, du erlangst und gehst zum Wünschenswerten."},{"n":62,"sa":"sakhāyastvā vavṛmahe devaṃ martāsa ūtaye\napāṃ napātaṃ subhagaṃ sudaṃsasaṃ supratūrtimanehasam","de":"Als Freunde haben wir dich, Gott, als Sterbliche zum Beistand erwählt, den Enkel der Wasser, den Glückreichen, Kundigen, Sieghaften, Untadeligen."}]},{"num":7,"loc":"Prapāṭhaka I, Ardha 2, Daśati 7","n_from":63,"n_to":72,"title_de":"Agni: Der Hausherr, Rufer und Bote der Menschen","note":"","units":[{"n":63,"sa":"ā juhotā haviṣā marjayadhvaṃ ni hotāraṃ gṛhapatiṃ dadhidhvam\niḍaspade namasā rātahavyaṃ saparyatā yajataṃ pastyānām","de":"Gießt zu, reinigt mit der Darbringung; setzt den Rufer, den Hausherrn, nieder; mit Verehrung am Ort der Iḍā, den mit Gaben Beschenkten verehrt, den Verehrungswürdigen der Wohnstätten."},{"n":64,"sa":"citra icchiśostaruṇasya vakṣatho na yo mātarāvanveti dhātave\nanūdhā yadajījanadadhā cidā vavakṣatsadyo mahi dūtyā3ṃ caran","de":"Er, der jungen Kindes [?] wunderbar Verlangen trägt, damit er nicht den beiden Müttern folgt, um zu trinken; ohne Euter [?], als er ihn zeugte, wollte er da sogleich reichlich als Bote hin und her gehen."},{"n":65,"sa":"idaṃ ta ekaṃ para ū ta ekaṃ tṛtīyena jyotiṣā saṃ viśasva\nsaṃveśanastanve3 cāruredhi priyo devānāṃ parame janitre","de":"Dies ist deine eine [Gestalt], dies die andere; mit dem dritten Licht vereine dich; einhergehend ist er in deinem Leib lieblich; sei lieb den Himmlischen im höchsten Ursprung."},{"n":66,"sa":"imaṃ stomamarhate jātavedase rathamiva saṃ mahemā manīṣayā\nbhadrā hi naḥ pramatirasya saṃsadyagne sakhye mā riṣāmā vayaṃ tava","de":"Dieses Loblied [bringen wir] dem Verehrungswürdigen, Jātavedas, wie einen Wagen [fügen wir es] mit Gedanken zusammen; Gutes ist uns seine Zuneigung; in seiner Freundschaft, Agni, sollen wir, deine, nicht Schaden nehmen."},{"n":67,"sa":"mūrdhānaṃ divo aratiṃ pṛthivyā vaiśvānaramṛta ā jātamagnim\nkaviṃ samrājamatithiṃ janānāmāsannāḥ pātraṃ janayanta devāḥ","de":"Das Haupt des Himmels, den Wanderer [?] der Erde, den Vaiśvānara, den in der Ordnung geborenen Agni, den Seher, Herrscher, Gast der Menschen: sie haben die Götter, ihm nahegekommen, zum Gefäß erzeugt."},{"n":68,"sa":"vi tvadāpo na parvatasya pṛṣṭhādukthebhiragne janayanta devāḥ\ntaṃ tvā giraḥ suṣṭutayo vājayantyājiṃ na girvavāho jigyuraśvāḥ","de":"Von dir haben, Agni, die Götter mit Lobgesängen, gleich Wassern vom Bergrücken, [ihn] erzeugt; dich, den mit Liedern, den gut Gepriesenen, spornen die Lieder an, wie Rosse, die den Wettlauf gewonnen haben, den zu Liedern Fahrenden."},{"n":69,"sa":"ā vo rājānamadhvarasya rudraṃ hotāraṃ satyayajaṃ rodasyoḥ\nagniṃ purā tanayitnoracittāddhiraṇyarūpamavase kṛṇudhvam","de":"Euren König der Weihehandlung, den Rudra, den Rufer, den wahrhaft Opfernden beider Welten, Agni, [macht] vor dem Donner, vor der Unwissenheit, den goldgestaltigen, euch zum Beistand."},{"n":70,"sa":"indhe rājā samaryo namobhiryasya pratīkamāhutaṃ ghṛtena\nnaro havyebhirīḍate sabādha āgniragramuṣasāmaśoci","de":"Es wird der König Samarya [?] mit Verehrungen entflammt, dessen Antlitz mit Schmalz übergossen ist; die Männer rufen ihn mit Darbringungen an, [Agni] mit Bedrängnis [?]; Agni ist als erster der Morgenröten aufgeglänzt."},{"n":71,"sa":"pra ketunā bṛhatā yātyagnirā rodasī vṛṣabho roravīti\ndivaścidantādupamāmudānaḍapāmupasthe mahiṣo vavardha","de":"Mit großem Banner fährt Agni voran, füllt beide Welten, der Stier brüllt; auch vom äußersten Ende des Himmels hat er das Nächste erreicht; im Schoß der Wasser ist der Große gewachsen."},{"n":72,"sa":"agniṃ naro dīdhitibhiraṇyorhastacyutaṃ janayata praśastam\ndūredṛśaṃ gṛhapatimathavyum","de":"Agni, ihr Männer, erzeugt mit Fingerarbeit aus den beiden Reibhölzern [?], den handentsandten, gerühmten; den Fernsichtigen, den Hausherrn, den Atharvan-gleichen [?]."}]},{"num":8,"loc":"Prapāṭhaka I, Ardha 2, Daśati 8","n_from":73,"n_to":80,"title_de":"Agni: Erwachen am Morgen, Hüter, Vertreiber der Unholde","note":"","units":[{"n":73,"sa":"abodhyagniḥ samidhā janānāṃ prati dhenumivāyatīmuṣāsam\nyahvā iva pra vayāmujjihānāḥ pra bhānavaḥ sasrate nākamaccha","de":"Agni ist erwacht durch das Brennholz der Menschen, wie die Kuh, die zur Morgenröte kommt; wie Zweige, die sich erheben, sind die Strahlen zum Himmel hin ausgeströmt."},{"n":74,"sa":"pra bhūrjayantaṃ mahāṃ vipodhāṃ mūrairamūraṃ purāṃ darmāṇam\nnayantaṃ gīrbhirvanā dhiyaṃ dhā hariśmaśruṃ na vārmaṇā dhanarcim","de":"Den Siegreichen, den großen Weisen, den Unbetörten gegenüber den Betörten, den Zerstörer der Burgen, den mit Liedern die Wälder [?] und die Andacht Führenden, den Gelbbärtigen [?], wie durch eine Rüstung, den Reichtums-Glänzenden [preisen wir]."},{"n":75,"sa":"śukraṃ te anyadyajataṃ te anyadviṣurūpe ahanī dyaurivāsi\nviśvā hi māyā avasi svadhāvanbhadrā te pūṣanniha rātirastu","de":"Hell ist deine eine [Gestalt], verehrungswürdig die andere; zwei verschiedengestaltige Tage bist du, wie der Himmel; du schützt alle Zauberkräfte, Selbstmächtiger; freundlich sei dir, Pūṣan, hier die Gabe."},{"n":76,"sa":"iḍāmagne purudaṃsaṃ saniṃ goḥ śaśvattamaṃ havamānāya sādha\nsyānnaḥ sūnustanayo vijāvāgne sā te sumatirbhūtvasme","de":"Iḍā, Agni, den Vielwirkenden, den Gewinn an Rindern, den alle Zeit, erfülle dem Rufenden; uns soll ein Sohn, ein Nachkomme, kinderreich werden; Agni, diese deine Gunst soll uns werden."},{"n":77,"sa":"pra hotā jāto mahānnabhovinnṛṣadmā sīdadapāṃ vivarte\ndadhadyo dhāyī sute vayāṃsi yantā vasūni vidhate tanūpāḥ","de":"Als Rufer geboren, groß, im Dunst wissend, auf dem Männersitz [?] hat er sich niedergesetzt, in der Öffnung der Wasser; der Erhaltende, der Nahrung setzt beim Somapressen, der Lenker gewährt dem Verehrer Güter, den Leib schützend."},{"n":78,"sa":"pra samrājamasurasya praśstaṃ puṃsaḥ kṛṣṭīnāmanumādyasya\nindrasyeva pra tavasaskṛtāni vandadvārā vandamānā vivaṣṭu","de":"Den Herrscher der Kraft [?], gepriesen, der Menschenstämme, den wünschenswerten [?]: als [Werke] des Indra, [die] stark gemacht sind, [soll] der Torwärter [?] die Verehrer [?] verehren."},{"n":79,"sa":"araṇyornihito jātavedā garbha ivetsubhṛto garbhiṇībhiḥ\ndivediva īḍyo jāgṛvadbhirhaviṣmadbhirmanuṣyebhiragniḥ","de":"In den beiden Reibhölzern hinterlegt ist Jātavedas, wie ein Keim gut getragen von den Schwangeren; Tag für Tag ist Agni zu preisen von den Wachenden, von den Menschen, die Gaben haben."},{"n":80,"sa":"sanādagne mṛṇasi yātudhānānna tvā rakṣāṃsi pṛtanāsu jigyuḥ\nanu daha sahamūrānkayādo mā te hetyā mukṣata daivyāyāḥ","de":"Von jeher, Agni, zerschmetterst du die Zauberer; dich haben die Unholde in den Schlachten nicht besiegt; verbrenne die Ungeheuer [?], die Fleischfresser; deine Waffe soll die Göttliche nicht verfehlen [?]."}]},{"num":9,"loc":"Prapāṭhaka I, Ardha 2, Daśati 9","n_from":81,"n_to":90,"title_de":"Agni: Kraftvoller Glanz und Gast der Menschen","note":"","units":[{"n":81,"sa":"agna ojiṣṭhamā bhara dyumnamasmabhyamadhrigo\npra no rāye panīyase ratsi vājāya panthām","de":"Agni, bring uns den kräftigsten Glanz her, Unbezwinglicher; erschließ uns zum lohnenden Reichtum, zur Kraft den Weg."},{"n":82,"sa":"yadi vīro anu ṣyādagnimindhīta martyaḥ\nājuhvaddhavyamānuṣakśarma bhakṣīta daivyam","de":"Wenn ein Held [ihm] folgen soll, möge der Sterbliche Agni entzünden; er gab schon die Darbringung, die dargebracht wird, zu genießen; möge er den himmlischen Schutz genießen."},{"n":83,"sa":"tveṣaste dhūma ṛṇvati divi saṃ cchukra ātataḥ\nsūro na hi dyutā tvaṃ kṛpā pāvaka rocase","de":"Heftig ist dein Rauch, der sich erhebt, im Himmel breitet er sich aus, Heller; denn wie die Sonne leuchtest du durch Glanz, in Kunstfertigkeit [?], Läuternder."},{"n":84,"sa":"tvaṃ hi kṣaitavadyaśo 'gne mitro na patyase\ntvaṃ vicarṣaṇe śravo vaso puṣṭiṃ na puṣyasi","de":"Denn du, Agni, wirst wie Mitra wie den Ruhm der Ansässigen [?] beherrscht; du, Allsehender [?], Vasu, nährst Ruhm wie Wohlstand."},{"n":85,"sa":"prātaragniḥ purupriyo viṣa stavetātithiḥ\nviśve yasminnamartye havyaṃ martāsa indhate","de":"Am Morgen ist Agni sehr lieb, ich lobe ihn wie den Gast; in dem, dem Unsterblichen, alle Sterblichen die Darbringung entzünden."},{"n":86,"sa":"yadvāhiṣṭhaṃ tadagnaye bṛhadarca vibhāvaso\nmahiṣīva tvadrayistvadvājā udīrate","de":"Was am besten befördert, das [ist] für Agni; sing ein großes Lied, Lichtreicher; wie eine Hauptfrau [?] entspringen von dir Reichtum und Kräfte."},{"n":87,"sa":"viśoviśo vo atithiṃ vājayantaḥ purupriyam\nagniṃ vo duryaṃ vacaḥ stuṣe śūṣasya manmabhiḥ","de":"Euren Gast, den [Agni] jeder Sippe, den sehr lieben, [preise ich], Kraft wünschend; euren Agni, den Hausbewohner [?], preise ich mit Gedanken des Kräftigen."},{"n":88,"sa":"bṛhadvayo hi bhānave 'rcā devāyāgnaye\nyaṃ mitraṃ na praśastaye martāso dadhire puraḥ","de":"Denn ein großes Lebensmaß [gehört] dem Strahlenden; besinge den göttlichen Agni, den die Sterblichen wie Mitra zum Ruhm vorangestellt haben."},{"n":89,"sa":"aganma vṛtrahantamaṃ jyeṣṭhamagnimānavam\nya sma śrutarvannārkṣe bṛhadanīka idhyate","de":"Wir sind zu ihm gekommen, dem Vṛtra-besten, ältesten Agni, dem Menschlichen, der, du Ruhmreicher, bei Ārkṣa als Großgesichtiger entflammt wird [?]."},{"n":90,"sa":"jātaḥ pareṇa dharmaṇā yatsavṛdbhiḥ sahābhuvaḥ\npitā yatkaśyapasyāgniḥ śraddhā mātā manuḥ kaviḥ","de":"Geboren nach dem höchsten Gesetz, als du zusammen mit deinen Gefährten warst: als Vater des Kaśyapa gilt Agni, Vertrauen ist die Mutter, Manu ist der Seher."}]},{"num":10,"loc":"Prapāṭhaka I, Ardha 2, Daśati 10","n_from":91,"n_to":96,"title_de":"Agni und andere Götter: Anrufung und Vertreibung der Unholde","note":"","units":[{"n":91,"sa":"somaṃ rājānaṃ varuṇamagnimanvārabhāmahe\nādityaṃ viṣṇuṃ sūryaṃ brahmānaṃ ca bṛhaspatim","de":"Soma, den König, Varuṇa, Agni rufen wir an; Āditya, Viṣṇu, Sūrya, den Brahman und Bṛhaspati."},{"n":92,"sa":"ita eta udāruhandivaḥ pṛṣṭhānyā ruhan\npra bhūrjayo yathā pathodyāmaṅgiraso yayuḥ","de":"Von hier aus sind diese emporgestiegen, sind auf des Himmels Rücken gestiegen; wie die Siegerreichen auf dem Pfad, gingen die Aṅgirasen zum Himmel."},{"n":93,"sa":"rāye agne mahe tvā dānāya samidhīmahi\nīḍiṣvā hi mahe vṛṣaṃ dyāvā hotrāya pṛthivī","de":"Zum Reichtum, Agni, zur großen Gabe wollen wir dich entzünden; preise den mächtigen Stier zur großen [Gabe]; Himmel und Erde [sind] zum Rufen [da]."},{"n":94,"sa":"dadhanve vā yadīmanu vocadbrahmeti veru tat\npari viśvāni kāvyā nemiścakramivābhuvat","de":"Er hat sich gestärkt [?], was ihm folgend der Brahmane [Priester] spricht: das ist der Wunsch; er wurde wie eine Radfelge allen Dichtungen [Lieder] umgebend."},{"n":95,"sa":"pratyagne harasā haraḥ śṛṇāhi viśvataspari\nyātudhānasya rakṣaso balaṃ nyubjavīryam","de":"Agni, schlag Hitze mit Hitze zurück, von allen Seiten; die Kraft des Zauberers, des Unholds [zerbrich], seine Kraft, die niedergeworfen ist."},{"n":96,"sa":"tvamagne vasūṃriha rudrāṃ ādityāṃ uta\nyajā svadhvaraṃ janaṃ manujātaṃ ghṛtapruṣam","de":"Du, Agni, [ehre] hier die Vasus, die Rudras und die Ādityas; verehre das Volk, das eine gute Weihehandlung hat, von Manu abstammt, schmalzbenetzt."}]},{"num":11,"loc":"Prapāṭhaka II, Ardha 1, Daśati 1","n_from":97,"n_to":106,"title_de":"Agni-Lieder: Anruf, Bitte um Ruhm, Abwehr der Feinde","note":"Vorwiegend Agni (Jātavedas) als Rufer und Beschützer der Weihehandlung.","units":[{"n":97,"sa":"puru tvā dāśivāṃ voce 'riragne tava svidā\ntodasyeva śaraṇa ā mahasya","de":"Vielfach habe ich, der Spender, zu dir gesprochen, o Agni: Ich, der Fremde [?] – ich bin doch der Deine; (gewähre mir) bei dem Großen Zuflucht wie dem Toda [?]."},{"n":98,"sa":"pra hotre pūrvyaṃ vaco 'gnaye bharatā bṛhat\nvipāṃ jyotīṃṣi bibhrate na vedhase","de":"Bringt dem Rufer das uralte, hohe Wort dar, für Agni, der die Lichter trägt, für den Weisen [?] [Anm.: vipām nicht sicher gedeutet]."},{"n":99,"sa":"agne vājasya gomata īśānaḥ sahaso yaho\nasme dhehi jātavedo mahi śravaḥ","de":"O Agni, Gebieter über rinderreichen Kraftgewinn, du Sohn der Stärke, Jātavedas: Verleihe uns große Berühmtheit."},{"n":100,"sa":"agne yajiṣṭho adhvare devāṃ devayate yaja\nhotā mandro vi rājasyati sridhaḥ","de":"O Agni, du Verehrungswürdigster, verehre bei der Weihehandlung die Götter für den, der nach den Göttern verlangt; der berauschende Rufer strahlt weithin und überragt die Fehlgehenden [?] [Anm.: sridhaḥ = Fehlgehende/Widersacher]."},{"n":101,"sa":"jajñānaḥ sapta mātṛbhirmedhāmāśāsata śriye\nayaṃ dhruvo rayīṇāṃ ciketadā","de":"Kaum geboren, erflehten sie [?] mit den sieben Müttern Einsicht zum Glanz; dieser Feste ist es, der die Reichtümer erkennt [?]."},{"n":102,"sa":"uta syā no divā matiraditirūtyāgamat\nsā śantātā mayaskaradapa sridhaḥ","de":"Und jener unser Gedanke des Tages, Aditi, möge mit Hilfe kommen; sie, die Heilbringende, Wohltuende, möge die Bedränger abwehren."},{"n":103,"sa":"īḍiṣvā hi pratīvyā3ṃ yajasva jātavedasam\ncariṣṇudhūmamagṛbhītaśociṣam","de":"Rufe ihn an, den Zugewandten [?], und verehre Jātavedas, den mit wandernden Rauchschwaden, den mit unfassbarem Glanz."},{"n":104,"sa":"na tasya māyayā ca na ripurīśīta martyaḥ\nyo agnaye dadāśa havyadātaye","de":"Nicht durch List und nicht (anders) soll ein feindlicher Sterblicher Gewalt haben über den, der Agni, dem Träger der Opfergabe, gespendet hat."},{"n":105,"sa":"apa tyaṃ vṛjinaṃ ripuṃ stenamagne durādhyam\ndaviṣṭhamasya satpate kṛdhī sugam","de":"Jenen krummen Feind, den Dieb mit üblem Sinn, o Agni – rücke ihn, o Herr der Guten, so weit weg wie möglich [?] und mach (uns den Weg) gut gangbar."},{"n":106,"sa":"śruṣṭyagne navasya me stomasya vīra viśpate\nni māyinastapasā rakṣaso daha","de":"Höre bald, Agni, auf mein neues Preislied, du Held, Herr der Stämme; verbrenne mit Glut die Zauberer, die Unholde."}]},{"num":12,"loc":"Prapāṭhaka II, Ardha 1, Daśati 2","n_from":107,"n_to":114,"title_de":"Agni-Lieder: Preis des Gastes und Rufers","note":"Agni als Gast, Rufer und Abwehrer der Unholde.","units":[{"n":107,"sa":"pra maṃhiṣṭhāya gāyata ṛtāvne bṛhate śukraśociṣe\nupastutāso agnaye","de":"Singt hervor dem Freigebigsten, dem Wahrhaftigen, Hohen, hell Leuchtenden, ihr Lobpreisenden, dem Agni."},{"n":108,"sa":"pra so agne tavotibhiḥ suvīrābhistarati vājakarmabhiḥ\nyasya tvaṃ sakhyamāvitha","de":"Er, o Agni, dringt durch deine Hilfen hindurch, die gute Männer und Kraftwerke bringen – der, dessen Freundschaft du bewahrt hast."},{"n":109,"sa":"taṃ gūrdhayā svarṇaraṃ devāso devamaratiṃ dadhanvire\ndevatrā havyamūhiṣe","de":"Ihn preise, den zum Licht Eilenden [?], den Gott; die Götter haben den Nichtfeindlichen [?] hingesetzt; unter den Göttern trägst du die Opfergabe."},{"n":110,"sa":"mā no hṛṇīthā atithiṃ vasuragniḥ purupraśasta eśaḥ\nyaḥ suhotā svadhvaraḥ","de":"Zürne uns nicht, dem Gast: Vasu Agni ist er, vielgepriesen, der gute Rufer, der gute Weihehandlung hält."},{"n":111,"sa":"bhadro no agnirāhuto bhadrā rātiḥ subhaga bhadro adhvaraḥ\nbhadrā uta praśastayaḥ","de":"Segensreich ist uns der angerufene Agni, segensreich die Gabe, o Glücksreicher, segensreich die Weihehandlung, segensreich auch die Preisungen."},{"n":112,"sa":"yajiṣṭhaṃ tvā vavṛmahe devaṃ devatrā hotāramamartyam\nasya yajñasya sukratum","de":"Dich, den Verehrungswürdigsten, erwählen wir, den Gott unter den Göttern, den unsterblichen Rufer, den Einsichtigen [Anm.: sukratu] dieser Weihehandlung."},{"n":113,"sa":"tadagne dyumnamā bhara yatsāsāhā sadane kaṃ cidatriṇam\nmanyuṃ janasya dūḍhyam","de":"Bring, o Agni, jenen Glanz her, der am Sitz jeden Fresser überwältigt, den Grimm des Bösgesinnten [?] unter den Leuten."},{"n":114,"sa":"yadvā u viśpatiḥ śitaḥ suprīto manuṣo viśe\nviśvedagniḥ prati rakṣāṃsi sedhati","de":"Wenn aber der Herr der Stämme, entfacht, dem Stamm des Manu wohlgesinnt ist, dann wehrt Agni alle Unholde ab."}]}],"aindra":[{"num":1,"loc":"Prapāṭhaka II, Ardha 1, Daśati 3","n_from":115,"n_to":124,"title_de":"Indra-Lieder: Preis beim Soma-Pressen, Rausch und Kraft","note":"Indra-Lieder; einzelne Verse (117, 118) sind schwierig.","units":[{"n":115,"sa":"tadvo gāya sute sacā puruhūtāya satvane\nśaṃ yadgave na śākine","de":"Das singt euch zusammen bei der Pressung dem Vielgerufenen, dem Mächtigen: Heil (sei) wie dem Rind, so dem Kräftigen."},{"n":116,"sa":"yaste nūnaṃ śatakratavindra dyumnitamo madaḥ\ntena nūnaṃ made madeḥ","de":"Der Rauschtrank, o Indra, du Hundertkräftiger, der dir jetzt der glanzvollste ist – mit ihm berausche dich nun im Rausch."},{"n":117,"sa":"gāva upa vadāvaṭe mahi yajñasya rapsudā\nubhā karṇā hiraṇyayā","de":"Ihr Kühe, sprecht zum Brunnen hin [?], (o) große, die der Weihehandlung Fülle geben [?]; beide Ohren sind golden. [Anm.: Deutung unsicher]"},{"n":118,"sa":"aramaśvāya gāyata śrutakakṣāraṃ gave\naramindrasya dhāmne","de":"Singt dem Ross genug, o Śrutakakṣa, der Kuh genug; genug ist es für Indras Wesen [Anm.: Textzustand fraglich; auch: „für den Wohnsitz Indras“]."},{"n":119,"sa":"tamindraṃ vājayāmasi mahe vṛtrāya hantave\nsa vṛṣā vṛṣabho bhuvat","de":"Ihn, Indra, spornen wir zur Kraft an, um den großen Vṛtra zu erschlagen; er, der Stier, soll der Regner werden."},{"n":120,"sa":"tvamindra balādadhi sahaso jāta ojasaḥ\ntvaṃ sanvṛṣanvṛṣedasi","de":"Du, Indra, bist aus Stärke, aus Gewalt, aus Kraft geboren; du bist stets, o Regner, wahrhaft der Stier [?]."},{"n":121,"sa":"yajña indramavardhayadyadbhūmiṃ vyavartayat\ncakrāṇa opaśaṃ divi","de":"Die Weihehandlung stärkte Indra, als er die Erde umkreisen ließ und im Himmel den Schopf [?] [Anm.: opaśa; auch „Dach, Stütze“] schuf."},{"n":122,"sa":"yadindrāhaṃ tathā tvamīśīya vasva eka it\nstotā me gosakhā syāt","de":"Wenn ich, o Indra, so wie du allein Herr über Güter wäre, dann sollte mein Sänger ein Freund der Rinder sein."},{"n":123,"sa":"panyaṃpanyamitsotāra ā dhāvata madyāya\nsomaṃ vīrāya śūrāya","de":"Preiswürdig, ja preiswürdig – ihr Presser, eilt herbei zum Rausch: Soma für den Helden, den Streiter!"},{"n":124,"sa":"idaṃ vaso sutamandhaḥ pibā supūrṇamudaram\nanābhayinrarimā te","de":"Hier, o Vasu, ist die gepresste Speise; trink; wohlgefüllt ist der Leib. O Furchtloser, wir haben dir gegeben [Anm.: rarimā te]."}]},{"num":2,"loc":"Prapāṭhaka II, Ardha 1, Daśati 4","n_from":125,"n_to":134,"title_de":"Indra-Lieder: Freund, Helfer, Vṛtra-Töter","note":"Indra als junger Freund und Helfer; Vers 128 mit fraglichem Textzustand.","units":[{"n":125,"sa":"uddhedabhi śrutāmaghaṃ vṛṣabhaṃ naryāpasam\nastārameṣi sūrya","de":"Aufwärts gehst du, o Sonne, hin zu dem durch seine Gaben Berühmten, dem Stier von Männertaten, dem Schleuderer [?] [Anm.: astāram]."},{"n":126,"sa":"yadadya kacca vṛtrahannudagā abhi sūrya\nsarvaṃ tadindra te vaśe","de":"Was immer du heute, Vṛtra-Töter, o Sonne, aufsteigend (erreichst) – all das, Indra, steht in deiner Macht."},{"n":127,"sa":"ya ānayatparāvataḥ sunītī turvaśaṃ yadum\nindraḥ sa no yuvā sakhā","de":"Der, der Turvaśa und Yadu aus der Ferne durch gute Führung herbeibrachte – Indra ist unser junger Freund."},{"n":128,"sa":"mā na indrābhyā ' '3 diśaḥ sūro aktuṣvā yamata\ntvā yujā vanema tat","de":"Nicht soll uns, o Indra, die Weisung [?] eines Helden [?] in den Nächten bedrängen; mit dir als Gefährten möchten wir das gewinnen. [Anm.: Textzustand fraglich]"},{"n":129,"sa":"endra sānasiṃ rayiṃ sajitvānaṃ sadāsaham\nvarṣiṣṭhamūtaye bhara","de":"Bring her, o Indra, den gewinnbaren Reichtum, siegbringend, allzeit überwältigend, den reichlichsten, zur Hilfe."},{"n":130,"sa":"indraṃ vayaṃ mahādhana indramarbhe havāmahe\nyujaṃ vṛtreṣu vajriṇam","de":"Indra rufen wir in der großen Beute, Indra im Kleinen (Gefecht), den Gefährten in den Vṛtra-Kämpfen, den Keulenträger."},{"n":131,"sa":"apibatkadruvaḥ sutamindraḥ sahasrabāhve\ntatrādadiṣṭa pauṃsyam","de":"Indra trank den gepressten (Soma) des Kadru [?] für den Tausendarmigen [?]; da nahm er Manneskraft an."},{"n":132,"sa":"vayamindra tvāyavo 'bhi pra nonumo vṛṣan\nviddhī tvā3sya no vaso","de":"Wir, die nach dir verlangen, o Indra, preisen dich hin, du Stier; nimm dies von uns wahr, o Vasu."},{"n":133,"sa":"ā ghā ye agnimindhate stṛṇanti barhirānuṣak\nyeṣāmindro yuvā sakhā","de":"Die da Agni entzünden und die Streu der Reihe nach ausbreiten, deren junger Freund Indra ist –"},{"n":134,"sa":"bhindhi viśvā apa dviṣaḥ pari bādho jahī mṛdhaḥ\nvasu spārhaṃ tadā bhara","de":"Spalte alle Hasser weg, treibe ringsum die Bedränger fort; bring dann begehrenswertes Gut."}]},{"num":3,"loc":"Prapāṭhaka II, Ardha 1, Daśati 5","n_from":135,"n_to":144,"title_de":"Indra-Lieder: Soma-Freunde, Savitṛ, Preis des Stiers","note":"Indra; Vers 135 gilt der Sache nach den Maruts (Peitsche), sie sind aber im Text nicht genannt; Vers 141 gilt Savitṛ.","units":[{"n":135,"sa":"iheva śṛṇva eṣāṃ kaśā hasteṣu yadvadān\nni yāmaṃ citramṛñjate","de":"Wie hier hört man ihre Peitsche in den Händen, wenn sie tönen; sie richten [?] ihren Zug wunderbar aus."},{"n":136,"sa":"ima u tvā vi cakṣate sakhāya indra sominaḥ\npuṣṭāvanto yathā paśum","de":"Diese da schauen auf dich, o Indra, die Freunde, die Soma-Besitzer, wie Wohlgenährte auf ein Stück Vieh [?]."},{"n":137,"sa":"samasya manyave viśo viśvā namanta kṛṣṭayaḥ\nsamudrāyeva sindhavaḥ","de":"Vor seinem Grimm neigen sich alle Stämme, alle Völker, wie die Ströme zum Meer."},{"n":138,"sa":"devānāmidavo mahattadā vṛṇīmahe vayam\nvṛṣṇāmasmabhyamūtaye","de":"Der Götter Beistand ist groß; den erbitten wir; der der Kräftigen (sei) uns zur Hilfe."},{"n":139,"sa":"somānāṃ svaraṇaṃ kṛṇuhi brahmaṇaspate\nkakṣīvantaṃ ya auśijaḥ","de":"Mach (mich) zum Klangträger [?] der Somas, o Herr des Gebets, wie Kakṣīvant, den Auśija [Anm.: Sohn der Uśij]."},{"n":140,"sa":"bodhanmanā idastu no vṛtrahā bhūryāsutiḥ\nśṛṇotu śakra āśiṣam","de":"Aufmerksamen Sinnes möge er uns sein, der Vṛtra-Töter, reich an Pressungen; es höre der Kräftige den Wunsch."},{"n":141,"sa":"adya no deva savitaḥ prajāvatsāvīḥ saubhagam\nparā duḥṣvapnyaṃ suva","de":"Heute, o Gott Savitṛ, lass uns Glück mit Nachkommen erstehen; das üble Traumgeschick treibe fort."},{"n":142,"sa":"kvā3sya vṛṣabho yuvā tuvigrīvo anānataḥ\nbrahmā kastaṃ saparyati","de":"Wo ist dieser Stier, der junge, mit starkem Nacken, unbeugsam? Welcher Brahman-Priester [Anm.: brahmā] verehrt ihn?"},{"n":143,"sa":"upahvare girīṇāṃ saṅgame ca nadīnām\ndhiyā vipro ajāyata","de":"In der Nähe der Berge, am Zusammenfluss der Flüsse, wurde der Weise durch Andacht geboren."},{"n":144,"sa":"pra samrājaṃ carṣaṇīnāmindraṃ stotā navyaṃ gīrbhiḥ\nnaraṃ nṛṣāhaṃ maṃhiṣṭham","de":"Den Allherrscher der Völker, Indra, den neuen, soll der Sänger mit Liedern preisen, den Mann, den Männerbezwinger, den Freigebigsten."}]},{"num":4,"loc":"Prapāṭhaka II, Ardha 2, Daśati 6","n_from":145,"n_to":154,"title_de":"Indra-Lieder: Trank, Kühe, Marut-Mutter, Sonne","note":"Indra; Vers 147 (Tvaṣṭṛ, Mond) und 149 (Maruts) sind schwierig.","units":[{"n":145,"sa":"apādu śiprayandhasaḥ sudakṣasya prahoṣiṇaḥ\nindrorindro yavāśiraḥ","de":"Getrunken hat er vom Trank des trefflich Kraftvollen, Spendenden [?]; vom Saft, o Indra, dem mit Gerste gemischten [?]. [Anm.: Textzustand fraglich; śipra-/śiprin-Bezug unklar]"},{"n":146,"sa":"imā u tvā puruvaso 'bhi pra nonavurgiraḥ\ngāvo vatsaṃ na dhenavaḥ","de":"Diese Lieder singen dich an, o Vielgütiger, wie die Milchkühe das Kalb."},{"n":147,"sa":"atrāha goramanvata nāma tvaṣṭurapīcyam\nitthā candramaso gṛhe","de":"Hier erkannten sie fürwahr den verborgenen Namen der Kuh [?] des Tvaṣṭṛ, so im Haus des Mondes [?]."},{"n":148,"sa":"yadindro anayadrito mahīrapo vṛṣantamaḥ\ntatra pūṣābhuvatsacā","de":"Als Indra, der Stiermäßigste, die großen Wasser ungehemmt [?] [Anm.: rito] hinführte, da war Pūṣan (sein) Gefährte."},{"n":149,"sa":"gaurdhayati marutāṃ śravasyurmātā maghonām\nyuktā vahnī rathānām","de":"Die Kuh nährt [?] – nach Ruhm verlangend – die Maruts, die Mutter der Freigebigen; angeschirrt zieht sie (als Zugtier) die Wagen."},{"n":150,"sa":"upa no haribhiḥ sutaṃ yāhi madānāṃ pate\nupa no haribhiḥ sutam","de":"Komm zu uns mit den Falben zum gepressten (Soma), o Herr der Rauschtränke; komm zu uns mit den Falben zum Gepressten."},{"n":151,"sa":"iṣṭā hotrā asṛkṣatendraṃ vṛdhanto adhvare\nacchāvabhṛthamojasā","de":"Die gewünschten Rufungen [Anm.: hotrāḥ] wurden entsandt, Indra stärkend bei der Weihehandlung, mit Kraft dem Schlussbad [Anm.: avabhṛtha] entgegen."},{"n":152,"sa":"ahamiddhi pituṣpari medhāmṛtasya jagraha\nahaṃ sūrya ivājani","de":"Ich habe von dem Vater her die Einsicht der Wahrheit [Anm.: ṛta] ergriffen; ich bin wie die Sonne geboren."},{"n":153,"sa":"revatīrnaḥ sadhamāda indre santu tuvivājāḥ\nkṣumanto yābhirmadema","de":"Reich [Anm.: revatīḥ, Femininum] mögen uns, wo wir bei Indra zusammen den Rausch genießen, (die Gaben) sein, kraftvoll und gedeihlich, durch die wir uns berauschen [?]."},{"n":154,"sa":"somaḥ pūṣā ca cetaturviśvāsāṃ sukṣitīnām\ndevatrā rathyorhitā","de":"Soma und Pūṣan sind aufmerksam auf all die gut Wohnenden; unter den Göttern sind (die beiden) als Wagenlenker eingesetzt."}]},{"num":5,"loc":"Prapāṭhaka II, Ardha 2, Daśati 7","n_from":155,"n_to":164,"title_de":"Indra-Lieder: Ruf zum Soma-Trank und Freundschaft","note":"Aufrufe zum Lobgesang für Indra als Somatrinker.","units":[{"n":155,"sa":"pāntamā vo andhasa indramabhi pra gāyata\nviśvāsāhaṃ śatakratuṃ maṃhiṣṭhaṃ carṣaṇīnām","de":"Um euren höchst trinkenswerten Trank [?] willen singt zu Indra hin, dem Allbezwinger, Hundertkräftigen, Freigebigsten der Völker."},{"n":156,"sa":"pra va indrāya mādanaṃ haryaśvāya gāyata\nsakhāyaḥ somapāvne","de":"Singt hervor euch dem Indra den Rauschtrank, dem Falbenbesitzer, ihr Freunde, dem Soma-Trinker."},{"n":157,"sa":"vayamu tvā tadidarthā indra tvāyantaḥ sakhāyaḥ\nkaṇvā ukthebhirjarante","de":"Wir aber, mit eben diesem Ziel, o Indra, nach dir verlangend, als Freunde – die Kaṇvas preisen mit Lobsprüchen."},{"n":158,"sa":"indrāya madvane sutaṃ pari ṣṭobhantu no giraḥ\narkamarcantu kāravaḥ","de":"Für Indra, den Rauschfrohen, ist (Soma) gepresst; ringsum sollen unsere Lieder erschallen [Anm.: pari ṣṭobhantu]; die Sänger sollen den Sanggesang [Anm.: arka] singen."},{"n":159,"sa":"ayaṃ ta indra somo nipūto adhi barhiṣi\nehīmasya dravā piba","de":"Dies ist dein Soma, o Indra, gereinigt, auf der Streu; komm herbei, eile hin zu ihm, trink."},{"n":160,"sa":"surūpakṛtnumūtaye sudughāmiva goduhe\njuhūmasi dyavidyavi","de":"Ihn, der schöne Gestalt schafft, rufen wir Tag um Tag zur Hilfe, wie eine gute Milchkuh zum Melker."},{"n":161,"sa":"abhi tvā vṛṣabhā sute sutaṃ sṛjāmi pītaye\ntṛmpā vyaśnuhī madam","de":"Zu dir, o Stier, habe ich beim Pressen den Gepressten zum Trinken hingegossen; sättige dich, genieße den Rausch."},{"n":162,"sa":"ya indra camaseṣvā somaścamūṣu te sutaḥ\npibedasya tvamīśiṣe","de":"Der Soma, o Indra, der in den Bechern, in den Schalen dir gepresst ist – trinke davon; du hast Macht darüber."},{"n":163,"sa":"yogeyoge tavastaraṃ vājevāje havāmahe\nsakhāya indramūtaye","de":"Bei jedem Anspannen den Stärkeren, bei jedem Kampfpreis rufen wir als Freunde Indra zur Hilfe."},{"n":164,"sa":"ā tvetā ni ṣīdatendramabhi pra gāyata\nsakhāyaḥ stomavāhasaḥ","de":"Kommt her und setzt euch; singt hin zu Indra, ihr Freunde, ihr Lobpreis-Träger."}]},{"num":6,"loc":"Prapāṭhaka II, Ardha 2, Daśati 8","n_from":165,"n_to":174,"title_de":"Indra-Lieder: Gabenherr, Griff, Hilfe","note":"Indra als Herr der Gaben und Freund.","units":[{"n":165,"sa":"idaṃ hyanvojasā sutaṃ rādhānāṃ pate\npibā tvā3sya girvaṇaḥ","de":"Denn dies ist mit Kraft gepresst, o Herr der Gaben; trink von ihm, du Liedliebender."},{"n":166,"sa":"mahāṃ indraḥ puraśca no mahitvamastu vajriṇe\ndyaurna prathinā śavaḥ","de":"Groß ist Indra, und unsere Burg [?]; Größe soll dem Keulenträger sein, seine Kraft (reicht) wie der Himmel an Weite."},{"n":167,"sa":"ā tū na indra kṣumantaṃ citraṃ grābhaṃ saṃ gṛbhāya\nmahāhastī dakṣiṇena","de":"Doch fasse uns, o Indra, eine reiche, glänzende Handvoll, ergreife sie mit der rechten (Hand), du Großhändiger."},{"n":168,"sa":"abhi pra gopatiṃ girendramarca yathā vide\nsūnuṃ satyasya satpatim","de":"Preise mit dem Lied Indra, den Herrn der Rinder, hin, wie man ihn kennt [?], den Sohn der Wahrheit, den Herrn der Guten."},{"n":169,"sa":"kayā naścitra ā bhuvadūtī sadāvṛdhaḥ sakhā\nkayā śaciṣṭhayā vṛtā","de":"Mit welcher Hilfe wird uns der Wunderbare, stets Fördernde, als Freund (zuteil)? Mit welcher mächtigsten (Gunst) wird er umgeben?"},{"n":170,"sa":"tyamu vaḥ satrāsāhaṃ viśvāsu gīrṣvāyatam\nā cyāvayasyūtaye","de":"Jenen aber, euren Allzeit-Überwinder, der sich in allen Preisliedern (findet) [?] – zur Hilfe bringe ich ihn herbei [?]. [Anm.: Textzustand fraglich; Person wechselt]"},{"n":171,"sa":"sadasaspatimadbhutaṃ priyamindrasya kāmyam\nsaniṃ medhāmayāsiṣam","de":"Zum Herrn der Versammlung, dem Wunderbaren, Lieben, von Indra Ersehnten, bin ich um Gewinn und Einsicht gegangen."},{"n":172,"sa":"ye te panthā adho divo yebhirvyaśvamairayaḥ\nuta śroṣantu no bhuvaḥ","de":"Die Wege, die dir unterhalb des Himmels sind, auf denen du den Vyaśva [?] [Anm.: Name oder „Rosseloser“] angetrieben hast – und es sollen uns die Wesen [?] hören."},{"n":173,"sa":"bhadraṃbhadraṃ na ā bhareṣamūrjaṃ śatakrato\nyadindra mṛḍayāsi naḥ","de":"Bring uns Gutes und Gutes, Nahrung und Kraft, du Hundertkräftiger, wenn du, Indra, uns gnädig bist."},{"n":174,"sa":"asti somo ayaṃ sutaḥ pibantyasya marutaḥ\nuta svarājo aśvinā","de":"Da ist dieser Soma, gepresst; die Maruts trinken davon, und die Selbstherrscher [?], die beiden Aśvin."}]},{"num":7,"loc":"Prapāṭhaka II, Ardha 2, Daśati 9","n_from":175,"n_to":184,"title_de":"Indra-, Savitṛ-, Uṣas- und Vāta-Verse","note":"Gemischte Verse: Indra (175, 179–183), Götterpreis (176), Savitṛ (177), Uṣas und Aśvin (178), Wind als Heilmittel (184).","units":[{"n":175,"sa":"īṅkhayantīrapasyuva indraṃ jātamupāsate\nvanvānāsaḥ suvīryam","de":"Die sich Regenden [?], werkeifrigen (Frauen/Wasser) [?] warten dem geborenen Indra auf, Heldenkraft erringend."},{"n":176,"sa":"na ki devā inīmasi na kyā yopayāmasi\nmantraśrutyaṃ carāmasi","de":"Nicht [?] schädigen wir die Götter, nicht stören wir (sie) je; wir bewegen uns in dem, was durch den Spruch zu hören ist [?]. [Anm.: Textzustand fraglich]"},{"n":177,"sa":"doṣo āgādbṛhadgāya dyumadgāmannātharvaṇa\nstuhi devaṃ savitāram","de":"Der Abend ist gekommen: singe das Bṛhat, glänzenden Sang [?], o Ātharvaṇa; preise den Gott Savitṛ."},{"n":178,"sa":"eṣo uṣā apūrvyā vyucchati priyā divaḥ\nstuṣe vāmaśvinā bṛhat","de":"Diese Uṣas, unvergleichlich, erstrahlt, die Liebe des Himmels; ich preise euch beide, ihr Aśvin, mit großem (Lied)."},{"n":179,"sa":"indro dadhīco asthabhirvṛtrāṇyapratiṣkutaḥ\njaghāna navatīrnava","de":"Indra hat mit den Knochen des Dadhyañc, unaufhaltsam, Vṛtras erschlagen, neun mal neunzig [Anm.: 810; nach anderer Deutung „neunundneunzig“]."},{"n":180,"sa":"indrehi matsyandhaso viśvebhiḥ somaparvabhiḥ\nmahāṃ abhiṣṭirojasā","de":"Komm, Indra, berausche dich am Trank mit allen Soma-Gliedern; groß bist du, der Bezwinger an Kraft."},{"n":181,"sa":"ā tū na indra vṛtrahannasmākamardhamā gahi\nmahānmahībhirūtibhiḥ","de":"Doch komm, o Indra, Vṛtra-Töter, zu unserer Seite [?]; du Großer, mit großen Hilfen."},{"n":182,"sa":"ojastadasya titviṣa ubhe yatsamavartayat\nindraścarmeva rodasī","de":"Jene Kraft von ihm leuchtete, als er beide Welten wie ein Fell zusammenrollte, Indra."},{"n":183,"sa":"ayamu te samatasi kapota iva garbhadhim\nvacastaccinna ohase","de":"Dieser aber ist bei dir versammelt [?], wie die Taube zu ihrer Brutstätte; auch jenes Wort von uns nimmst du auf [?]. [Anm.: Textzustand fraglich]"},{"n":184,"sa":"vāta ā vātu beṣajaṃ śambhu mayobhu no hṛde\npra na ayūṃṣi tāriṣat","de":"Der Wind wehe Heilmittel herbei, Heilsames, Wohltuendes für unser Herz; er verlängere unsere Lebenszeiten."}]},{"num":8,"loc":"Prapāṭhaka II, Ardha 2, Daśati 10","n_from":185,"n_to":193,"title_de":"Indra und Götter: Schutz, Kühe, Soma-Einladung","note":"Verse an Indra, dazu Varuṇa/Mitra/Aryaman und Sarasvatī.","units":[{"n":185,"sa":"yaṃ rakṣanti pracetaso varuṇo mitro aryamā\nna kiḥ sa dabhyate janaḥ","de":"„Den die Weitsichtigen behüten — Varuṇa, Mitra, Aryaman —, dieser Mensch wird von niemandem versehrt.“"},{"n":186,"sa":"gavyo ṣu ṇo yathā purāśvayota rathayā\nvarivasyā mahonām","de":"„Wie früher, nach Rindern verlangend, so verschaffe uns nun auch Rosse und Wagen; schaffe Weite [?] den Freigebigen.“"},{"n":187,"sa":"imāsta indra pṛśnayo ghṛtaṃ duhata āśiram\nenāmṛtasya pipyuṣīḥ","de":"„Diese deine Kühe [Anm.: pṛśni, wörtlich „Gescheckte“; auch Marut-Mutter möglich], Indra, melken Ghee, die Milchmischung, strotzend durch das Wahre [?] [Anm.: Wortlaut enāmṛtasya unsicher].“"},{"n":188,"sa":"ayā dhiyā ca gavyayā puruṇāmanpuruṣṭuta\nyatsomesoma ābhuvaḥ","de":"„Mit diesem Gedanken, der nach Rindern strebt, o Vielnamiger, Vielgepriesener, da du bei jedem Soma zugegen warst [?].“"},{"n":189,"sa":"pāvakā naḥ sarasvatī vājebhirvājinīvatī\nyajñaṃ vaṣṭu dhiyāvasuḥ","de":"„Die läuternde Sarasvatī, mit Kraftgaben reich an Kraft, soll die Weihehandlung begehren, sie, die den Reichtum in Gedanken hat [Anm.: dhiyāvasuḥ, auch „reich durch Andacht“].“"},{"n":190,"sa":"ka imaṃ nāhuṣīṣvā indraṃ somasya tarpayāt\nsa no vasūnyā bharāt","de":"„Wer wird diesen Indra unter den Nahuṣa-Stämmen mit Soma sättigen? Er soll uns Güter herbeibringen.“"},{"n":191,"sa":"ā yāhi suṣumā hi ta indra somaṃ pibā imam\nedaṃ barhiḥ sado mama","de":"„Komm her: Gepresst ist dir, Indra, der Soma; trink diesen hier. Komm und setze dich auf mein Barhis.“"},{"n":192,"sa":"mahi trīṇāmavarastu dyukṣaṃ mitrasyāryamṇaḥ\ndurādharṣaṃ varuṇasya","de":"„Groß sei der Schutz [?] der drei, der himmelhelle: Mitras, Aryamans, der unbezwingliche Varuṇas.“ [Anm.: Textzustand fraglich, avarastu]"},{"n":193,"sa":"tvāvataḥ purūvaso vayamindra praṇetaḥ\nsmasi sthātarharīṇām","de":"„Wir sind, Indra, Führer, dir, dem Gütervielen, wir Deinesgleichen [?] zugehörig, der du der Falben Lenker [wörtlich: Steher] bist.“"}]},{"num":9,"loc":"Prapāṭhaka III, Ardha 1, Daśati 1","n_from":194,"n_to":203,"title_de":"Indra: Soma-Rausch, Preislieder, Unvergleichlichkeit","note":"","units":[{"n":194,"sa":"uttvā mandantu somāḥ kṛṇuṣva rādho adrivaḥ\nava brahmadviṣo jahi","de":"„Dich sollen die Somas berauschen; schaffe Gabe, Steinbewehrter; erschlage die Hasser der Andacht [brahma].“"},{"n":195,"sa":"girvaṇaḥ pāhi naḥ sutaṃ madhordhārābhirajyase\nindra tvādātamidyaśaḥ","de":"„Liedliebender, schütze unseren Gepressten; mit Strömen des Honigs wirst du gesalbt. Indra, dein Gegebenes allein ist Ruhm [?].“"},{"n":196,"sa":"sadā va indraścarkṛṣadā upo nu sa saparyan\nna devo vṛtaḥ śūra indraḥ","de":"„Immer soll Indra euch [Gaben] herbeiziehen [?], er, der Verehrung erweist [?]; nicht wird der Gott, der Held Indra, zurückgehalten.“ [Anm.: Textzustand fraglich]"},{"n":197,"sa":"ā tvā viśantvindavaḥ samudramiva sindhavaḥ\nna tvāmindrāti ricyate","de":"„Dich sollen die Tropfen durchdringen, wie die Ströme das Meer; niemand, Indra, übertrifft dich.“"},{"n":198,"sa":"indramidgāthino bṛhadindramarkebhirarkiṇaḥ\nindraṃ vāṇīranūṣata","de":"„Indra allein [besangen] die Sänger mit dem Gesang [gātha], das Große [bṛhat], Indra die Sprecher von Preisversen mit Preisversen [arka]; Indra priesen die Stimmen.“"},{"n":199,"sa":"indra iṣe dadātu na ṛbhukṣaṇamṛbhuṃ rayim\nvājī dadātu vājinam","de":"„Indra soll uns zur Stärkung geben: ṛbhu-gleichen, kunstreichen Reichtum; der Kraftvolle soll dem Kraftvollen geben [?].“"},{"n":200,"sa":"indro aṅga mahadbhayamabhī ṣadapa cucyavat\nsa hi sthiro vicarṣaṇiḥ","de":"„Indra hat, mein Lieber, die große Furcht überwältigt und weggescheucht [?]; denn er ist fest und alles überschauend [?].“"},{"n":201,"sa":"imā u tvā sutesute nakṣante girvaṇo giraḥ\ngāvo vatsaṃ na dhenavaḥ","de":"„Diese Lieder, Liedliebender, gelangen bei jedem Pressen zu dir, wie Milchkühe zum Kalb.“"},{"n":202,"sa":"indrā nu pūṣaṇā vayaṃ sakhyāya svastaye\nhuvema vājasātaye","de":"„Indra und Pūṣan, wir rufen euch beide zur Freundschaft, zum Wohlergehen, zum Kraftgewinn.“"},{"n":203,"sa":"na ki indra tvaduttaraṃ na jyāyo asti vṛtrahan\nna kyevaṃ yathā tvam","de":"„Nicht gibt es, Indra, einen Höheren als dich, nicht einen Größeren, Vṛtra-Töter; keiner ist so, wie du bist.“"}]},{"num":10,"loc":"Prapāṭhaka III, Ardha 1, Daśati 2","n_from":204,"n_to":213,"title_de":"Indra: Retter, Beschützer, Namuci-Sieger, Soma-Einladung","note":"","units":[{"n":204,"sa":"taraṇiṃ vo janānāṃ tradaṃ vājasya gomataḥ\nsamānamu pra śaṃsiṣam","de":"„Den Retter der Menschen, den [Bringer?] [?] der rinderreichen Kraftgabe, — ihn will ich gemeinsam [mit euch] preisen.“"},{"n":205,"sa":"asṛgramindra te giraḥ prati tvāmudahāsata\nsajoṣā vṛṣabhaṃ patim","de":"„Losgelassen sind, Indra, deine Lieder; sie jauchzen dir entgegen [?], dem Bullen, dem Herrn, einmütig.“"},{"n":206,"sa":"sunītho ghā sa martyo yaṃ maruto yamaryamā\nmitrāspāntyadruhaḥ","de":"„Gut geführt ist wahrlich jener Sterbliche, den die Maruts, den Aryaman, den die Mitras, die Truglosen, behüten.“"},{"n":207,"sa":"yadvīḍāvindra yatsthire yatparśāne parābhṛtam\nvasu spārhaṃ tadā bhara","de":"„Was im Festen, im Unerschütterlichen, in der Kluft [?] fortgetragen wurde — dieses begehrenswerte Gut bringe dann her, Indra.“"},{"n":208,"sa":"śrutaṃ vo vṛtrahantamaṃ pra śardhaṃ carṣaṇīnām\nāśiṣe rādhase mahe","de":"„Gehört ist euer bester Vṛtra-Töter, das Heer [?] der Völker — zur Bitte, zur großen Gunst [?].“"},{"n":209,"sa":"araṃ ta indra śravase gamema śūra tvāvataḥ\naraṃ śakra paremaṇi","de":"„Genug, Indra, seien wir zu deinem Ruhm gelangt, Held, [zu dir,] dem So-Beschaffenen; genug, Mächtiger, [im Fernen und] im Fernsten [?].“ [Anm.: paremaṇi unsicher]"},{"n":210,"sa":"dhānāvantaṃ karambhiṇamapūpavantamukthinam\nindra prātarjuṣasva naḥ","de":"„Dich, der du Röstkorn hast, Brei hast, Kuchen hast, Lobrede hast: Indra, genieße [das] am Morgen für uns [Anm.: prātarjuṣasva, „nimm am frühen Morgen gern an“].“"},{"n":211,"sa":"apāṃ phenena namuceḥ śira indrodavartayaḥ\nviśvā yadajaya spṛdhaḥ","de":"„Mit dem Schaum der Wasser hast du, Indra, dem Namuci den Kopf abgewälzt, als du alle Widersacher besiegtest.“"},{"n":212,"sa":"ime ta indra somāḥ sutāso ye ca sotvāḥ\nteṣāṃ matsva prabhūvaso","de":"„Diese Somas, Indra, sind dir gepresst, und die, die noch zu pressen sind; berausche dich an ihnen, Gewaltiger an Gütern.“"},{"n":213,"sa":"tubhyaṃ sutāsaḥ somāḥ stīrṇaṃ barhirvibhāvaso\nstotṛbhya indra mṛḍaya","de":"„Dir sind die Somas gepresst, das Barhis ist ausgestreut, Glanzreicher; den Sängern, Indra, sei gnädig.“"}]},{"num":11,"loc":"Prapāṭhaka III, Ardha 1, Daśati 3","n_from":214,"n_to":222,"title_de":"Indra, Mitra-Varuṇa, Viṣṇu: Anrufung und Schreitung","note":"Enthält den Viṣṇu-Vers (Dreischritt) am Schluss.","units":[{"n":214,"sa":"ā va indra kṛviṃ yathā vājayantaḥ śatakratum\nmaṃhiṣṭhaṃ siñca indubhiḥ","de":"„Zu euch, Indra, [rufen wir] wie zu einem Schlauch [?] den Hundertkräftigen, wir Kraftbegehrende; den Freigebigsten begießt mit Tropfen [?].“ [Anm.: kṛvi unsicher]"},{"n":215,"sa":"ataścidindra na upā yāhi śatavājayā\niṣā sahasravājayā","de":"„Von dort her, Indra, komm zu uns mit hundertfacher Kraft, mit tausendfacher Labung.“"},{"n":216,"sa":"ā bundaṃ vṛtrahā dade jātaḥ pṛcchadvi mātaram\nka ugrāḥ ke ha śṛṇvire","de":"„Kaum geboren, nahm der Vṛtra-Töter den Pfeil [?]; er fragte die Mutter: Wer sind die Gewaltigen, welche sind berühmt?“"},{"n":217,"sa":"bṛbadukthaṃ havāmahe sṛprakarasnamūtaye\nsādhaḥ kṛṇvantamavase","de":"„Den Liederreichen rufen wir zur Hilfe, den mit geschmeidigen [?] Armen, der es vollbringt, zum Beistand.“"},{"n":218,"sa":"ṛjunītī no varuṇo mitro nayati vidvān\naryamā devaiḥ sajoṣāḥ","de":"„Auf geradem Weg führe uns Varuṇa, Mitra, der Wissende, Aryaman, einträchtig mit den Göttern.“"},{"n":219,"sa":"dūrādiheva yatsato 'ruṇapsuraśiśvitat\nvi bhānuṃ viśvathātanat","de":"„Wie aus der Ferne, hier, was da ist, [der] Rotglänzende [?] hat er hell gemacht [?]; breite das Licht nach allen Seiten aus.“ [Anm.: Textzustand fraglich]"},{"n":220,"sa":"ā no mitrāvaruṇā ghṛtairgavyūtimukṣatam\nmadhvā rajāṃsi sukratū","de":"„Zu uns, Mitra und Varuṇa, benetzt mit Ghee die Rinderweide, mit Süßem die Räume, ihr Klugwirkenden.“"},{"n":221,"sa":"udu tye sūnavo giraḥ kāṣṭhā yajñeṣvatnata\nvāśrā abhijñu yātave","de":"„Auf! Jene Söhne haben die Lieder zum Ziel [wörtlich: Rennziel] in den Weihehandlungen gespannt [?]; die Brüllenden [?] [gehen] auf die Knie [?], um zu gehen.“ [Anm.: Textzustand fraglich]"},{"n":222,"sa":"idaṃ viṣṇurvi cakrame tredhā ni dadhe padam\nsamūḍhamasya pāṃsule","de":"„Dies hat Viṣṇu durchschritten; dreifach setzte er den Fuß; in seinem staubigen [Fuß] ist es zusammengefasst.“"}]},{"num":12,"loc":"Prapāṭhaka III, Ardha 1, Daśati 4","n_from":223,"n_to":232,"title_de":"Indra: Soma-Einladung, Lob und Freundschaft","note":"","units":[{"n":223,"sa":"atīhi manyuṣāviṇaṃ suṣuvāṃsamuperaya\nasya rātau sutaṃ piba","de":"„Geh vorbei an dem im Zorn Pressenden [?]; bringe [Indra] zu dem, der gepresst hat; in dessen Gabe trink das Gepresste.“ [?]"},{"n":224,"sa":"kadu pracetase mahe vaco devāya śasyate\ntadidhyasya vardhanam","de":"„Welches Wort wird dem weitsichtigen, großen Gott gesprochen? Eben dies ist ihm Stärkung.“"},{"n":225,"sa":"ukthaṃ ca na śasyamānaṃ nāgo rayirā ciketa\nna gāyatraṃ gīyamānam","de":"„Und das Preislied, das gesprochen wird, [ ... ] Reichtum [ ... ], nicht das Gāyatra, das gesungen wird [?].“ [Anm.: Textzustand fraglich, nāgo rayirā ciketa]"},{"n":226,"sa":"indra ukthebhirmandiṣṭho vājānāṃ ca vājapatiḥ\nharivāntsutānāṃ sakhā","de":"„Indra, mit Preisliedern der Berauschendste und der Herr der Kraftgaben, der Falbenbesitzer, der Freund der Gepressten.“"},{"n":227,"sa":"ā yāhyupa naḥ sutaṃ vājebhirmā hṛṇīyathāḥ\nmahāṃ iva yuvajāniḥ","de":"„Komm zu unserem Gepressten mit Kraftgaben; zürne uns nicht, wie ein Großer [?], ein Mann mit junger Frau [?].“"},{"n":228,"sa":"kadā vaso stotraṃ haryata ā ava śmaśā rudhadvāḥ\ndīrghaṃ sutam vātāpyāya","de":"„Wann, Gütiger, wirst du das Preislied begehren? [ ... ] mit dem Bart [?] [ ... ] den langen Gepressten, für Vātāpi [?].“ [Anm.: Textzustand fraglich]"},{"n":229,"sa":"brāhmaṇādindra rādhasaḥ pibā somamṛtūṃ ranu\ntavedaṃ sakhyamastṛtam","de":"„Aus der Gabe des Brahmanen [Anm.: brāhmaṇād, ggf. Anteil des Brāhmaṇācchaṃsin] trink, Indra, den Soma nach den Zeiten [?]; unverletzt ist diese deine Freundschaft.“"},{"n":230,"sa":"vayaṃ ghā te api smasi stotāra indra girvaṇaḥ\ntvaṃ no jinva somapāḥ","de":"„Wir sind ja auch die Deinen, wir Sänger, Indra, Liedliebender; belebe uns, Somatrinker.“"},{"n":231,"sa":"endra pṛkṣu kāsu cinnṛmṇaṃ tanūṣu dhehi naḥ\nsatrājidugra pauṃsyam","de":"„Komm, Indra, in irgendwelchen Kraftspeisen [?] lege Mannhaftigkeit in unsere Leiber, Allsieger, Grimmer: Mannesstärke.“"},{"n":232,"sa":"evā hyasi vīrayurevā śūra uta sthiraḥ\nevā te rādhyaṃ manaḥ","de":"„So bist du, männerliebend, so ein Held und Fester; so ist dir der Sinn zu gewinnen [?].“"}]},{"num":13,"loc":"Prapāṭhaka III, Ardha 1, Daśati 5","n_from":233,"n_to":242,"title_de":"Indra: Anruf im Kampf, Freundschaft und Gabe","note":"Längere Verse mit vier Pādas.","units":[{"n":233,"sa":"abhi tvā śūra nonumo 'dugdhā iva dhenavaḥ\nīśānamasya jagataḥ svardṛśamīśānamindra tasthuṣaḥ","de":"„Auf dich, Held, brüllen wir zu wie ungemolkene Kühe: den Herrscher dieser Welt, den Himmelsschauenden, den Herrscher, Indra, über alles Stehende.“"},{"n":234,"sa":"tvāmiddhi havāmahe sātau vājasya kārvaḥ\ntvāṃ vṛtreṣvindra satpatiṃ narastvāṃ kāṣṭhāsvarvataḥ","de":"„Dich rufen wir, denn im Gewinn der Kraftgabe, wir Sänger [?]; dich in den Vṛtra-Kämpfen, Indra, den guten Herrn, [rufen] die Männer, dich in den Rennzielen der Rosse.“"},{"n":235,"sa":"abhi pra vaḥ surādhasamindramarca yathā vide\nyo jaritṛbhyo maghavā purūvasuḥ sahasreṇeva śikṣati","de":"„Zu euch [hin] lobsinge den gabenreichen Indra, wie er gefunden wird, der den Sängern, der Gabenherr, Gütervielfache, wie mit Tausendfachem zu spenden vermag.“"},{"n":236,"sa":"taṃ vo dasmamṛtīṣahaṃ vasormandānamandhasaḥ\nabhi vatsaṃ na svasareṣu dhenava indraṃ gīrbhirnavāmahe","de":"„Ihn, euren wunderbaren, Bedrängnis Bezwingenden, den am Saft des Gutes [?] Berauschten: wie Kühe zum Kalb in den Ställen brüllen, [so] rufen wir Indra mit Liedern an.“"},{"n":237,"sa":"tarobhirvo vidadvasumindraṃ sabādha ūtaye\nbṛhadgāyantaḥ sutasome adhvare huve bharaṃ na kāriṇam","de":"„Mit Eile euren Güterfinder, Indra, [rufen wir] in Bedrängnis zur Hilfe, laut singend beim Soma-Pressen in der Weihehandlung rufe ich den Wirkenden wie einen Kämpfer [?].“"},{"n":238,"sa":"taraṇiritsiṣāsati vājaṃ purandhyā yujā\nā va indraṃ puruhūtaṃ name girā nemiṃ taṣṭeva sudruvam","de":"„Der Schnelle will ja Kraftgabe gewinnen mit der Fülle als Gefährtin [?]; zu euch neige ich Indra, den Vielgerufenen, mit Lied, wie ein Wagner die gutlaufende Felge.“"},{"n":239,"sa":"pibā sutasya rasino matsvā na indra gomataḥ\nāpirno bodhi sadhamādye vṛdhe3 'smāṃ avantu te dhiyaḥ","de":"„Trink vom Gepressten, dem saftigen; berausche dich an uns, Indra, dem Rinderreichen; sei unser Gefährte in der Zechgemeinschaft zur Stärkung; deine Gedanken mögen uns fördern.“"},{"n":240,"sa":"tvaṃ hyehi cerave vidā bhagaṃ vasuttaye\nudvāvṛṣasva maghavangaviṣṭaya udindrāśvamiṣṭaye","de":"„Du komm ja zum Wandernden [?]; erkenne den Anteil zur Güter-Erlangung. Strömt empor, Gabenreicher, zur Rinder-Suche, empor, Indra, zur Rosse-Erlangung.“"},{"n":241,"sa":"na hi vaścaramaṃ ca na vasiṣṭhaḥ parimaṃste\nasmākamadya marutaḥ sute sacā viśve pibantu kāminaḥ","de":"„Denn nicht [ ... ] euer Letztes und nicht [ ... ] Vasiṣṭha [ ... ] dein Umfang [?]; uns heute, Maruts, sollen beim Soma alle Verlangenden zusammen trinken.“ [Anm.: Textzustand fraglich]"},{"n":242,"sa":"mā cidanyadvi śaṃsata sakhāyo mā riṣaṇyata\nindramitstotā vṛṣaṇaṃ sacā sute muhurukthā ca śaṃsata","de":"„Sagt nichts anderes, Freunde, und seid nicht schädigend [?]; nur Indra, den Bullen, preist, ihr Sänger, gemeinsam beim Soma, und wiederholt Lobreden.“"}]},{"num":14,"loc":"Prapāṭhaka III, Ardha 1, Daśati 6","n_from":243,"n_to":243,"title_de":"Indra: Unerreichbarer Mehrer","note":"","units":[{"n":243,"sa":"na kiṣṭaṃ karmaṇā naśadyaścakāra sadāvṛdham\nindraṃ na yajñairviśvagūrtamṛbhvasamadhṛṣṭaṃ dhṛṣṇumojasā","de":"„Keiner erreicht ihn mit Tat, der den allzeit Mehrenden gemacht hat [?] — Indra mit Weihehandlungen, den allseits Gepriesenen, Kunstreichen, Unbezwungenen, an Kraft Kühnen.“ [Anm.: Textzustand fraglich]"}]},{"num":15,"loc":"Prapāṭhaka III, Ardha 2, Daśati 6","n_from":244,"n_to":252,"title_de":"Indra: Falben, Gabenherr und Heiler","note":"","units":[{"n":244,"sa":"ya ṛte cidabhiśriṣaḥ purā jatrubhya ātṛdaḥ\nsandhātā sandhiṃ maghavā purūvasurniṣkartā vihrutaṃ punaḥ","de":"„Der auch ohne Bindemittel [?], bevor die Schlüsselbeine durchbohrt wurden [?], der Zusammenfüger, der die Fuge fügt, der Gabenherr, Gütervielfache, der das Zerbrochene wieder heil macht.“ [Anm.: Textzustand fraglich]"},{"n":245,"sa":"ā tvā sahasramā śataṃ yuktā rathe hiraṇyaye\nbrahmayujo haraya indra keśino vahantu somapītaye","de":"„Hundert und tausend Falben, am goldenen Wagen angeschirrt, durch Gebet angeschirrt, langmähnig, sollen dich, Indra, zum Somatrunk herfahren.“"},{"n":246,"sa":"ā mandrairindra haribhiryāhi mayūraromabhiḥ\nmā tvā ke cinni yemurinna pāśino 'ti dhanveva tāṃ ihi","de":"„Komm, Indra, mit den berauschenden Falben mit Pfauenhaaren; kein Einziger soll dich aufhalten wie Schlingenträger [den Vogel]; komm über sie hinweg wie über eine Steppe.“"},{"n":247,"sa":"tvamaṅga pra śaṃsiṣo devaḥ śaviṣṭha martyam\nna tvadanyo maghavannasti marḍitendra bravīmi te vacaḥ","de":"„Du, mein Lieber, hast [den] Sterblichen gepriesen [?], Gott, Stärkster; außer dir gibt es keinen anderen Gnädigen, Gabenherr; Indra, dieses Wort sage ich dir.“"},{"n":248,"sa":"tvamindra yaśā asyṛjīṣī śavasaspatiḥ\ntvaṃ vṛtrāṇi haṃsyapratīnyeka itpurvanuttaścarṣaṇīdhṛtiḥ","de":"„Du, Indra, bist ruhmreich, der Verfolger [?], Herr der Kraft; du erschlägst die Vṛtras, unbekämpft, du allein, vielfach angetrieben [?], der Halter der Menschen.“"},{"n":249,"sa":"indramiddevatātaya indraṃ prayatyadhvare\nindraṃ samīke vanino havāmaha indraṃ dhanasya sātaye","de":"„Indra allein [rufen wir] zur Götterschaft, Indra beim Hervortreten der Weihehandlung; Indra im Getümmel rufen wir, die Holzbesitzenden [?], Indra zum Gewinn von Reichtum.“"},{"n":250,"sa":"imā u tvā purūvaso giro vardhantu yā mama\npāvakavarṇāḥ śucayo vipaścito 'bhi stomairanūṣata","de":"„Diese meine Lieder sollen dich stärken, Reichgüteriger; feuerfarbige, reine, weise Sänger haben dich mit Preisgesängen angesungen.“"},{"n":251,"sa":"udu tye madhumattamā gira stomāsa īrate\nsatrājito dhanasā akṣitotayo vājayanto rathā iva","de":"„Auf! Jene honigsten Lieder, die Preisgesänge, erheben sich; [zu dem] Gesamtsieger, Reichtumsgewinner, unversiegbaren Beistands, wie Kraft begehrende Wagen.“"},{"n":252,"sa":"yathā gauro apā kṛtaṃ tṛṣyannetyaveriṇam\nāpitve naḥ prapitve tūyamā gahi kaṇveṣu su sacā piba","de":"„Wie ein Gaur-Büffel, durstig, zum Wasserloch geht, zum feindlosen [?]: [so] komm uns bei Verwandtschaft und Fernverwandtschaft rasch; unter den Kaṇvas trink gemeinsam.“"}]},{"num":16,"loc":"Prapāṭhaka III, Ardha 2, Daśati 7","n_from":253,"n_to":262,"title_de":"Indra: Hilfe, Beistand, Preislieder für den Vṛtra-Töter","note":"","units":[{"n":253,"sa":"śagdhyū3ṣu śacīpata indra viśvābhirūtibhiḥ\nbhagaṃ na hi tvā yaśasaṃ vasuvidamanu śūra carāmasi","de":"„Sei uns hilfreich [?], Herr der Kraft, Indra, mit allen Hilfen; denn dir, dem ruhmreichen Güterfinder, folgen wir nach, Held, wie einem Glücksanteil [?].“"},{"n":254,"sa":"yā indra bhuja ābharaḥ svarvāṃ asurebhyaḥ\nstotāraminmaghavannasya vardhaya ye ca tve vṛktabarhiṣaḥ","de":"„Die Genüsse, Indra, die du von den Asuras als Lichtgewinner herbeigebracht hast [?]: mehre, Gabenherr, gerade den Sänger davon und die, die auf dich das Barhis ausgebreitet haben.“"},{"n":255,"sa":"pra mitrāya prāryamṇe sacathyamṛtāvaso\nvarūthye3 varuṇe chandyaṃ vacaḥ stotraṃ rājasu gāyata","de":"„Für Mitra, für Aryaman singt Gemeinsames [?]; bei Varuṇa, dem Schutzspender, das wohlgefällige Wort, das Preislied unter den Königen singt.“ [Anm.: sacathyam unsicher]"},{"n":256,"sa":"abhi tvā pūrvapītaya indra stomebhirāyavaḥ\nsamīcīnāsa ṛbhavaḥ samasvaranrudrā gṛṇanta pūrvyam","de":"„Auf dich hin, Indra, zum Vortrunk, mit Preisliedern [rufen] die Menschen; einträchtig ließen die Ṛbhus [Lieder] tönen; die Rudras preisen den Uralten.“"},{"n":257,"sa":"pra va indrāya bṛhate maruto brahmārcata\nvṛtraṃ hanati vṛtrahā śatakraturvajreṇa śataparvaṇā","de":"„Für euren großen Indra, Maruts, erhebt das Gebet [brahma]; den Vṛtra erschlägt der Vṛtra-Töter, der Hundertkräftige mit dem hundertknotigen Keil.“"},{"n":258,"sa":"bṛhadindrāya gāyata maruto vṛtrahantamam\nyena jyotirajanayannṛtāvṛdho devaṃ devāya jāgṛvi","de":"„Das Bṛhat singt für Indra, ihr Maruts, den besten Vṛtra-Töter, mit dem sie, die das Wahre Mehrenden, das Licht erzeugten, [das Lied] für den Gott, den Gott, das wache [?].“"},{"n":259,"sa":"indra kratuṃ na ā bhara pitā putrebhyo yathā\nśikṣā ṇo asminpuruhūta yāmani jīvā jyotiraśīmahi","de":"„Indra, bringe uns Einsicht [kratu], wie ein Vater den Söhnen; lehre uns in diesem Zug, Vielgerufener; lebend mögen wir das Licht erlangen.“"},{"n":260,"sa":"mā na indra parā vṛṇagbhavā naḥ sadhamādye\ntvaṃ na ūtī tvaminna āpyam mā na indra parā vṛṇak","de":"„Verstoße uns nicht, Indra; sei uns in der Zechgemeinschaft nahe; du bist unsere Hilfe, du unser Verwandter; verstoße uns nicht, Indra.“"},{"n":261,"sa":"vayaṃ gha tvā sutāvanta āpo na vṛktabarhiṣaḥ\npavitrasya prasravaṇeṣu vṛtrahanpari stotāra āsate","de":"„Wir, ja, mit Gepresstem, dich [umsitzend] wie Wasser [?], mit ausgebreitetem Barhis: in den Strömen des Seihers sitzen, Vṛtra-Töter, die Sänger rings [um dich].“"},{"n":262,"sa":"yadindra nāhuṣīṣvā ojo nṛmṇaṃ ca kṛṣṭiṣu\nyadvā pañca kṣitīnāṃ dyumnamā bhara satrā viśvāni pauṃsyā","de":"„Was, Indra, unter den Nahuṣa-Völkern an Kraft und Mannheit unter den Stämmen ist, oder was der Fünf Siedlungen Glanz ist — bringe dies her, ganz, alle Manneskräfte.“"}]},{"num":17,"loc":"Prapāṭhaka III, Ardha 2, Daśati 8","n_from":263,"n_to":272,"title_de":"Indra: Bulle in Nähe und Ferne, Schutz und Anteil","note":"","units":[{"n":263,"sa":"satyamitthā vṛṣedasi vṛṣajūtirno 'vitā\nvṛṣā hyugra śṛṇviṣe parāvati vṛṣo arvāvati śrutaḥ","de":"„Wahrlich so bist du Bulle, von Bullen [Kraft] getrieben [?], unser Beschützer; denn als Bulle, Grimmer, wirst du gehört in der Ferne, als Bulle in der Nähe berühmt.“"},{"n":264,"sa":"yacchakrāsi parāvati yadarvāvati vṛtrahan\natastvā gīrbhirdyugadindra keśibhiḥ sutāvāṃ ā vivāsati","de":"„Wenn du, Mächtiger, in der Ferne bist, wenn in der Nähe, Vṛtra-Töter: von dort holt dich der Himmelgehende [?], Indra, mit Liedern, mit den Langmähnigen [?], der Soma-Presser herbei.“"},{"n":265,"sa":"abhi vo vīramandhaso madeṣu gāya girā mahā vicetasam\nindraṃ nāma śrutyaṃ śākinaṃ vaco yathā","de":"„Auf euch, den Helden, in den Räuschen des Saftes singe mit gewaltigem Lied, den Vielerkennenden; Indra, den rühmbaren Namen, den Fähigen [?], wie [das] Wort [?].“ [Anm.: Textzustand fraglich]"},{"n":266,"sa":"indra tridhātu śaraṇaṃ trivarūthaṃ svastaye\nchardiryaccha maghavadbhyaśca mahyaṃ ca yāvayā didyumebhyaḥ","de":"„Indra, dreifach gefügte Zuflucht, dreifachen Schutz zum Wohlergehen: gewähre Schirm den Gabenreichen und mir; halte das Blitzende [?] fern.“"},{"n":267,"sa":"śrāyanta iva sūryaṃ viśvedindrasya bhakṣata\nvasūni jāto janimānyojasā prati bhāgaṃ na dīdhimaḥ","de":"„Wie [Dinge], die sich der Sonne zuneigen, so haben alle an Indra Teil; Güter [?], [dem] Geborenen und dem zu Gebärenden, [holen] wir mit Kraft; wie einen Anteil erblicken [?] wir sie.“ [Anm.: Textzustand fraglich]"},{"n":268,"sa":"na sīmadeva āpa tadiṣaṃ dīrghāyo martyaḥ\netagvā cidyā etaśo yuyojata indro harī yuyojate","de":"„Nicht [erreicht] ein Nicht-Götter-Verehrender [?] diese Labung, der langlebige Sterbliche; [ ... ] auch die, die Etaśa-Gespanne [?] anschirrten; Indra schirrt die Falben an.“ [Anm.: Textzustand fraglich]"},{"n":269,"sa":"ā no viśvāsu havyamindraṃ samatsu bhūṣata\nupa brahmāṇi savanāni vṛtrahanparamajyā ṛcīṣama","de":"„Zu uns, in allen Kämpfen, schmückt Indra, den anzurufenden; zu den Gebeten und Somapressungen, Vṛtra-Töter, [ ... ] höchster [?], dem Ṛc gleich [?].“ [Anm.: Textzustand fraglich, paramajyā ṛcīṣama]"},{"n":270,"sa":"tavedindrāvamaṃ vasu tvaṃ puṣyasi madhyamam\nsatrā viśvasya paramasya rājasi na kiṣṭvā goṣu vṛṇvate","de":"„Dein allein, Indra, ist das unterste Gut; du nährst das mittlere; durchgängig herrschst du über alles Höchste; keiner hemmt dich bei den Rindern [?].“"},{"n":271,"sa":"kveyatha kvedasi purutrā ciddhi te manaḥ\nalarṣi yudhma khajakṛtpurandara pra gāyatrā agāsiṣuḥ","de":"„Wohin gehst du, wo bist du? Denn dein Sinn ist an vielen Orten. Du eilst, Streiter, Getümmelmacher [?], Burgenbrecher; die Gāyatra-Sänger sind vorgetreten [?].“"},{"n":272,"sa":"vayamenamidā hyopīpemeha vajriṇam\ntasmā u adya savane sutaṃ bharā nūnaṃ bhūṣata śrute","de":"„Wir haben ihn ja jetzt hier, den Keilträger, gestärkt [?]; für ihn bringt heute beim Pressen das Gepresste; sicher schmückt euch [?] im Ruf [?].“ [Anm.: Textzustand fraglich]"}]},{"num":18,"loc":"Prapāṭhaka III, Ardha 2, Daśati 9","n_from":273,"n_to":282,"title_de":"Indra: Furchtlosigkeit; Rätselvers; Sūrya","note":"Enthält einen Sūrya-Vers (276) und einen Rätselvers (281), wohl auf die Morgenröte.","units":[{"n":273,"sa":"yo rājā carṣaṇīnāṃ yātā rathebhiradhriguḥ\nviśvāsāṃ tarutā pṛtanānāṃ jyeṣṭhaṃ yo vṛtrahā gṛṇe","de":"„Der König der Völker, der auf Wagen fährt, unbeirrbar, der Bezwinger aller Heere, der Ältere, der Vṛtra-Töter: den preise ich.“"},{"n":274,"sa":"yata indra bhayāmahe tato no abhayaṃ kṛdhi\nmaghavañchagdhi tava tanna ūtaye vi dviṣo vi mṛdho jahi","de":"„Woher wir uns fürchten, Indra, von dort schaffe uns Furchtlosigkeit; Gabenherr, hilf — dein ist das zu unserer Hilfe; treibe die Feinde, die Bedränger auseinander.“"},{"n":275,"sa":"vāstoṣpate dhruvā sthūṇāṃ satraṃ somyānām\ndrapsaḥ purāṃ bhettā śaśvatīnāmindro munīnāṃ sakhā","de":"„Herr der Wohnstatt, feste Säulen [?] der Soma-Bereiter, [ ... ] der Tropfen, der Burgenbrecher der ewigen [Burgen]; Indra, der Freund der Munis [Anm.: „Schweigende/ Ekstatiker“].“ [Anm.: Textzustand fraglich]"},{"n":276,"sa":"baṇmahāṃ asi sūrya baḍāditya mahāṃ asi\nmahaste sato mahimā paniṣṭama mahnā deva mahāṃ asi","de":"„Wahrlich, groß bist du, Sūrya; wahrlich, Āditya, groß bist du; groß ist deine Größe, du Seiender, Preiswürdigster; durch Größe, Gott, bist du groß.“"},{"n":277,"sa":"aśvī rathī surūpa idgomāṃ yadindra te sakhā\nśvātrabhājā vayasā sacate sadā candrairyāti sabhāmupa","de":"„Ein Mann mit Rossen, Wagen, schöner Gestalt und Rindern ist, wer, Indra, dein Freund ist; mit erquickender [?] Lebenskraft ist er stets [gesellt]; mit Glänzendem [?] geht er zur Versammlung.“"},{"n":278,"sa":"yaddyāva indra te śataṃ śataṃ bhūmīruta syuḥ\nna tvā vajrintsahasraṃ sūryā anu na jātamaṣṭa rodasī","de":"„Wenn dir, Indra, hundert Himmel und hundert Erden wären, nicht folgten dir, Keilträger, tausend Sonnen; nicht haben die beiden Welten den Geborenen erfasst [?].“"},{"n":279,"sa":"yadindra prāgapāgudagnyagvā hūyase nṛbhiḥ\nsimā purū nṛṣūto asyānave 'si praśardha turvaśe","de":"„Wenn du, Indra, im Osten, Westen, Norden oder unten von Männern gerufen wirst, [bist du] überall [?], von Männern angetrieben, bei Ānu, du Kühner, bei Turvaśa.“"},{"n":280,"sa":"kastamindra tvā vasavā martyo dadharṣati\nśraddhā hi te maghavanpārye divi vājī vājaṃ siṣāsati","de":"„Wer wagt, Indra, den Sterblichen anzugreifen, der dich, den Guten [?], [zum Schutz] hat? Denn Vertrauen hast du, Gabenreicher, am entscheidenden Tag [?]; der Kraftvolle begehrt Kraft zu gewinnen.“ [Anm.: Textzustand fraglich, tvā vasavā]"},{"n":281,"sa":"indrāgnī apādiyaṃ pūrvāgātpadvatībhyaḥ\nhitvā śiro jihvayā rārapaccarattriṃśatpadā nyakramīt","de":"„Indra und Agni! Diese Fußlose ging vor den Füßigen her; ihren Kopf preisgebend, mit der Zunge Laut gebend, schritt sie dreißigfüßig aus [?].“ [Anm.: Rätselvers, wohl Morgenröte]"},{"n":282,"sa":"indra nedīya edihi mitamedhābhirūtibhiḥ\nā śaṃ tama śaṃ tamābhirabhiṣṭibhirā svāpe svāpibhiḥ","de":"„Indra, komm ganz nahe, mit den Hilfen der maßvoll Einsichtigen [?]; zum Wohlsein, Wohltuendster, mit den heilsamsten Hilfen, zum guten Freund mit guten Freunden.“ [Anm.: mitamedhābhiḥ unsicher]"}]},{"num":19,"loc":"Prapāṭhaka III, Ardha 2, Daśati 10","n_from":283,"n_to":292,"title_de":"Indra-Lieder: Hilferuf, Somapressung, Gabenbitte","note":"Zehn Verse an Indra, im Wechsel Preis, Einladung zum Somatrunk und Bitte um Gaben.","units":[{"n":283,"sa":"ita ūtī vo ajaraṃ prahetāramaprahitam\nāśuṃ jetāraṃ hetāraṃ rathītamamatūrtaṃ tugriyāvṛdham","de":"Von hier aus [wollen wir] mit Hilfe für euch den Unalternden, den Antreiber, den selbst nicht An
