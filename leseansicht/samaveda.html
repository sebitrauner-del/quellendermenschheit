il, von der Weihe [Anm.: brahmasaṃśite – „vom Gebet geschärft“] gewetzt; geh zu den Feinden, ziele auf sie; keinen von ihnen lasse übrig."}]},{"num":399,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 6","n_from":1864,"n_to":1866,"title_de":"Feinde den Geiern preisgegeben; Schutz","note":"","units":[{"n":1864,"sa":"kaṅkāḥ suparṇā anu yantvenāngṛdhrāṇāmannamasāvastu senā\nmaiṣāṃ mocyaghahāraśca nendra vayāṃsyenānanusaṃyantu sarvān","de":"Kaṅka-Vögel, Schönbeschwingte, sollen ihnen nachfliegen; der Geier Speise soll dies Heer sein. Von diesen sollen nicht die Beutenehmer loskommen; Vögel [?], Indra, sollen ihnen allen folgen [Anm.: Textzustand fraglich]."},{"n":1865,"sa":"amitrasenāṃ maghavannasmāñchatruyatīmabhi\nubhau tāmindra vṛtrahannagniśca dahataṃ prati","de":"Das Heer der Feinde, uns, Maghavan, feindselig entgegen: Beide, Indra, Vritra-Töter, und Agni, verbrennt es entgegen."},{"n":1866,"sa":"yatra bāṇāḥ sampatanti kumārā viśikhā iva\ntatrā no brahmaṇaspatiraditiḥ śarma yacchatu viśvāhā śarma yacchatu","de":"Wo die Pfeile niederfallen wie Knaben mit ausgelöster Haarlocke, dort soll uns Brahmaṇaspati, Aditi Schutz gewähren, alle Tage Schutz gewähren."}]},{"num":400,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 7","n_from":1867,"n_to":1869,"title_de":"Indra: Zerschmettere Unholde und Feinde","note":"","units":[{"n":1867,"sa":"vi rakṣo vi mṛdho jahi vi vṛtrasya hanū ruja\nvi manyumindra vṛtrahannamitrasyābhidāsataḥ","de":"Zerstreue die Unholde, zerstreue die Bedränger; zerbrich Vritras Kinnbacken. Zerstreue den Zorn, Indra, Vritra-Töter, des Feindes, der uns angreift."},{"n":1868,"sa":"vi na indra mṛdho jahi nīcā yaccha pṛtanyataḥ\nyo asmāṃ abhidāsatyadharaṃ gamayā tamaḥ","de":"Zerstreue uns die Bedränger, Indra; halte die Angreifer nieder. Wer uns angreift, den lass in tiefste Finsternis sinken."},{"n":1869,"sa":"indrasya bāhū sthavirau yuvānāvanādhṛṣyau supratīkāvasahyau\ntau yuñjīta prathamau yoga āgate yābhyāṃ jitamasurāṇāṃ saho mahat","de":"Indras Arme, die alten, jugendlichen, unbezwingbaren, schönansichtigen, unüberwindlichen: Diese spanne an, die ersten, wenn der Zug bevorsteht, durch die der große Asura-Sieg [?] der Macht errungen wurde [Anm.: asurāṇām saho mahat – „große Macht der Asuras/Herrscher“ mit unsicherem Bezug]."}]},{"num":401,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 8","n_from":1870,"n_to":1872,"title_de":"Rüstung und Fluch gegen Feinde","note":"","units":[{"n":1870,"sa":"marmāṇi te varmaṇā cchādayāmi somastvā rājāmṛtenānu vastām\nurorvarīyo varuṇaste kṛṇotu jayantaṃ tvānu devā madantu","de":"Deine verwundbaren Stellen bedecke ich mit dem Panzer; Soma, der König, soll dich mit Unsterblichkeit umkleiden. Varuṇa soll dir Raum machen, weiter als weit; dir, dem Siegenden, sollen die Götter zujubeln."},{"n":1871,"sa":"andhā amitrā bhavatāśīrṣāṇo 'haya iva\nteṣāṃ vo agninunnānāmindro hantu varaṃvaram","de":"Blind seien die Feinde, kopflos wie Schlangen [?]. Von euch, die ihr von Agni getrieben werdet, soll Indra einen nach dem anderen erschlagen."},{"n":1872,"sa":"yo naḥ svo 'raṇo yaśca niṣṭyo jighāṃsati\ndevāstaṃ sarve dhūrvantu brahma varma mamāntaraṃ śarma varma mamāntaram","de":"Wer der Unsere ist, wer nicht Freund ist [?] oder ein Fremder, der uns töten will: die Götter sollen ihn alle niederschlagen. Das Gebet ist mein Panzer, ein Schutz mein inneres Wesen, mein Panzer [Anm.: Textzustand fraglich]."}]},{"num":402,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 9","n_from":1873,"n_to":1875,"title_de":"Indra-Schutz; Bitte um Heil","note":"","units":[{"n":1873,"sa":"mṛgo na bhīmaḥ kucaro giriṣṭhāḥ parāvata ā jaganthā parasyāḥ\nsṛkaṃ saṃśāya pavimindra tigmaṃ vi śatrūṃ tāḍhi vi mṛdho nudasva","de":"Wie ein furchtbares Wild, im Gebirge hausend, kamst du aus der Ferne, aus dem Fernen, herbei. Schärfe die Waffe, den scharfen Donnerkeil, Indra; zerschlage die Feinde, treibe die Bedränger fort."},{"n":1874,"sa":"bhadraṃ karṇebhiḥ śṛṇuyāma devā bhadraṃ paśyemākṣabhiryajatrāḥ\nsthirairaṅgaistuṣṭuvāṃ sastanūbhirvyaśemahi devahitaṃ yadāyuḥ","de":"Gutes mögen wir mit den Ohren hören, ihr Götter; Gutes mögen wir mit den Augen sehen, ihr Verehrungswürdigen. Mit festen Gliedern, mit Leibern lobpreisend, mögen wir das den Göttern bestimmte Leben erreichen."},{"n":1875,"sa":"svasti na indro vṛddhaśravāḥ svasti naḥ pūṣā viśvavedāḥ\nsvasti nastārkṣyo ariṣṭanemiḥ svasti no bṛhaspatirdadhātu\nOṃ svasti no bṛhaspatirdadhātu","de":"Heil soll uns Indra von großem Ruhm geben; Heil uns Pūṣan, der Allwisser; Heil uns Tārkṣya mit unversehrter Radschiene; Heil soll uns Bṛhaspati verleihen. Oṃ. Heil soll uns Bṛhaspati verleihen."}]}]}</script>
<script>
function loadTheme(){ try{ return localStorage.getItem("sv-theme")||"system"; }catch(e){ return "system"; } }
function saveTheme(v){ try{ localStorage.setItem("sv-theme", v); }catch(e){} }
function applyTheme(v){ var r=document.documentElement; if(v==="dark") r.setAttribute("data-theme","dark"); else if(v==="light") r.setAttribute("data-theme","light"); else r.removeAttribute("data-theme"); }
var currentTheme = loadTheme(); applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", function(){
  var o=["system","light","dark"]; currentTheme=o[(o.indexOf(currentTheme)+1)%3]; saveTheme(currentTheme); applyTheme(currentTheme);
});
document.getElementById("brand-home").addEventListener("click", function(){ go("#/"); });
var BOOK = JSON.parse(document.getElementById("data-book").textContent);
var TEXT = JSON.parse(document.getElementById("data-text").textContent);
var DIVDATA = {};
Object.keys(TEXT).forEach(function(k){ var m={}; TEXT[k].forEach(function(c){ m[c.num]=c; }); DIVDATA[k]=m; });
function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function formatText(s){
  var e = esc(s);
  e = e.replace(/\[\?\]/g, '<span class="unc-q">[?]</span>');
  e = e.replace(/\[Anm\.:[^\]]*\]/g, function(m){ return '<span class="unc-note">' + m + '</span>'; });
  return e;
}
function padas(s){ return formatText(s).replace(/\n/g, "<br>"); }
function go(h){ location.hash = h; }
function cssEscape(s){ return s.replace(/["\\]/g, "\\$&"); }
var pendingUnit = null;
function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var p = h.split("/").filter(Boolean).map(decodeURIComponent);
  if(p.length===0) return {view:"front"};
  if(p[0]==="c" && p[1] && p[2]!==undefined) return {view:"chapter", divKey:p[1], chNum:parseInt(p[2],10)};
  if(p[0]==="glossary") return {view:"glossary"};
  return {view:"front"};
}
function findDiv(k){ for(var i=0;i<BOOK.divisions.length;i++) if(BOOK.divisions[i].key===k) return BOOK.divisions[i]; return null; }
function flatChapterList(){ var o=[]; BOOK.divisions.forEach(function(d){ d.toc.forEach(function(c){ o.push({division:d, chapter:c}); }); }); return o; }
function adjacentChapter(k,n,dir){
  var f=flatChapterList(), idx=-1;
  for(var i=0;i<f.length;i++) if(f[i].division.key===k && f[i].chapter.num===n){ idx=i; break; }
  if(idx===-1) return null; var j=idx+dir; return (j<0||j>=f.length)?null:f[j];
}
function rangeLabel(c){ return c.n_from===c.n_to ? String(c.n_from) : c.n_from + "\u2013" + c.n_to; }
var viewEl = document.getElementById("view");
function render(){
  var r = parseHash();
  closeMobileSidebar();
  renderReader(r);
  if(pendingUnit!==null){
    var el = document.getElementById("u-"+pendingUnit); pendingUnit=null;
    if(el){ el.scrollIntoView({block:"center"}); el.classList.add("unit-hit"); return; }
  }
  window.scrollTo(0,0);
}
function tocChapterHtml(k,c,o){
  var active = o.view==="chapter" && o.divKey===k && o.chNum===c.num;
  return '<a class="toc-chapter'+(active?' active':'')+'" href="#/c/'+encodeURIComponent(k)+'/'+c.num+'"><span class="tn">'+rangeLabel(c)+'</span>'+esc(c.title_de||("Gruppe "+c.num))+'</a>';
}
function frontHtml(){
  var h='<h1 class="front-title">'+esc(BOOK.title)+'</h1><p class="front-subtitle">'+esc(BOOK.subtitle)+'</p>';
  var fd=BOOK.divisions[0];
  h+='<a class="front-cta" href="#/c/'+encodeURIComponent(fd.key)+'/'+fd.toc[0].num+'">Lesen beginnen &rarr;</a>';
  h+='<div class="front-section"><h2>Vorwort</h2>'; BOOK.frontmatter.vorwort.forEach(function(p){ h+='<p>'+formatText(p)+'</p>'; }); h+='</div>';
  h+='<div class="front-section"><h2>Einf&uuml;hrung</h2>'; BOOK.frontmatter.einfuehrung.forEach(function(p){ h+='<p>'+formatText(p)+'</p>'; }); h+='</div>';
  h+='<div class="front-section"><h2>Gliederung</h2><div class="front-parva-list">';
  BOOK.divisions.forEach(function(d,i){
    var a=d.toc[0].n_from, b=d.toc[d.toc.length-1].n_to;
    h+='<div class="fpl-item"><div class="fpl-num">'+(i+1)+'</div><div><a class="fpl-name" href="#/c/'+encodeURIComponent(d.key)+'/1" style="text-decoration:none">'+esc(d.name)+'</a><div class="fpl-desc">'+esc(d.desc)+' <em>&mdash; '+d.toc.length+' Gruppen, Mantra '+a+'&ndash;'+b+'</em></div></div></div>';
  });
  return h+'</div></div>';
}
function glossaryHtml(){
  var h='<h1 class="front-title" style="font-size:28px">Glossar</h1><p class="front-subtitle">'+BOOK.glossary.length+' Begriffe, alphabetisch geordnet.</p>';
  var es=BOOK.glossary.slice().sort(function(a,b){ return a.term.localeCompare(b.term); }), last=null;
  h+='<div class="glossary-grid">';
  es.forEach(function(e){
    var L=e.term.charAt(0).toUpperCase();
    if(L!==last){ h+='<div class="gl-letter">'+esc(L)+'</div>'; last=L; }
    h+='<div class="gl-entry"><span class="gl-term">'+esc(e.term)+'</span><span class="gl-cat">'+esc(e.category||'')+'</span><div class="gl-def">'+esc(e.definition)+'</div></div>';
  });
  return h+'</div>';
}
function chapterHtml(k,n){
  var d=findDiv(k), c=DIVDATA[k] && DIVDATA[k][n];
  if(!c) return '<p class="empty-note">Gruppe nicht gefunden.</p>';
  var h='';
  if(d.toc[0].num===c.num){
    h+='<div class="division-banner"><div class="db-label">Teil</div><h2>'+esc(d.name)+'</h2>'+(d.desc?'<p>'+esc(d.desc)+'</p>':'')+'</div>';
  }
  h+='<div class="chapter-head"><span class="chapter-eyebrow">SV '+rangeLabel(c)+' &middot; '+esc(c.loc)+'</span>';
  h+='<div class="chapter-title-de">'+esc(c.title_de||('Gruppe '+c.num))+'</div></div>';
  if(c.note) h+='<div class="chapter-note"><span class="cn-label">Einordnung</span>'+formatText(c.note)+'</div>';
  c.units.forEach(function(u){
    h+='<div class="unit" id="u-'+u.n+'"><span class="unit-n">SV '+u.n+'</span><div class="unit-sa">'+padas(u.sa)+'</div><div class="unit-de">'+formatText(u.de)+'</div>';
    if(u.notes) h+='<div class="unit-notes">'+formatText(u.notes)+'</div>';
    h+='</div>';
  });
  var pv=adjacentChapter(k,n,-1), nx=adjacentChapter(k,n,1);
  h+='<div class="chapter-pager">';
  if(pv) h+='<a class="pager-btn prev" href="#/c/'+encodeURIComponent(pv.division.key)+'/'+pv.chapter.num+'"><span class="pg-label">&larr; SV '+rangeLabel(pv.chapter)+'</span><span class="pg-title">'+esc(pv.chapter.title_de||'')+'</span></a>'; else h+='<div class="pager-spacer"></div>';
  if(nx) h+='<a class="pager-btn next" href="#/c/'+encodeURIComponent(nx.division.key)+'/'+nx.chapter.num+'"><span class="pg-label">SV '+rangeLabel(nx.chapter)+' &rarr;</span><span class="pg-title">'+esc(nx.chapter.title_de||'')+'</span></a>'; else h+='<div class="pager-spacer"></div>';
  return h+'</div>';
}
function jumpTo(txt){
  var m=/^\s*(?:SV\s*)?(\d{1,4})\s*$/i.exec(txt||""); if(!m) return false;
  var n=parseInt(m[1],10);
  for(var i=0;i<BOOK.divisions.length;i++){
    var d=BOOK.divisions[i];
    for(var j=0;j<d.toc.length;j++){ var c=d.toc[j]; if(n>=c.n_from && n<=c.n_to){ pendingUnit=n; var target="#/c/"+d.key+"/"+c.num; if(location.hash===target) render(); else go(target); return true; } }
  }
  return false;
}
function renderReader(o){
  var openKey = o.view==="chapter" ? o.divKey : BOOK.divisions[0].key;
  var h='<div class="reader"><button class="sidebar-toggle" id="sidebar-toggle-btn">&#9776; Inhaltsverzeichnis</button><aside class="reader-sidebar" id="reader-sidebar">';
  h+='<a class="reader-back" href="#/">&larr; Vorwort &amp; &Uuml;bersicht</a><div class="sidebar-title">'+esc(BOOK.title)+'</div>';
  h+='<div class="sidebar-sub">'+BOOK.stats.verses+' Mantras in '+BOOK.stats.groups+' Gruppen</div>';
  h+='<div class="sidebar-tabs"><button class="sidebar-tab'+(o.view==="front"?' active':'')+'" data-tab="front">Vorwort</button><button class="sidebar-tab'+(o.view==="chapter"?' active':'')+'" data-tab="text">Text</button><button class="sidebar-tab'+(o.view==="glossary"?' active':'')+'" data-tab="glossary">Glossar</button></div>';
  h+='<form id="jump-form" style="display:flex;gap:6px;margin:0 0 14px"><input id="jump-input" type="text" inputmode="numeric" placeholder="Springen: Mantra 1&ndash;1875" aria-label="Zu Mantra-Nummer springen" style="flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg-card);color:var(--ink);font:inherit;font-size:12.5px"><button class="sidebar-tab" type="submit">Los</button></form>';
  BOOK.divisions.forEach(function(d){
    var open = d.key===openKey;
    h+='<div class="toc-division"><div class="toc-division-head'+(open?' open':'')+'" data-div="'+esc(d.key)+'"><span class="car">&#9656;</span>'+esc(d.name)+'</div><div class="toc-chapters'+(open?' open':'')+'" data-div-body="'+esc(d.key)+'">';
    d.toc.forEach(function(c){ h+=tocChapterHtml(d.key,c,o); });
    h+='</div></div>';
  });
  h+='</aside><div class="reader-main"><div class="reader-content" id="reader-content">';
  if(o.view==="front") h+=frontHtml(); else if(o.view==="glossary") h+=glossaryHtml(); else h+=chapterHtml(o.divKey,o.chNum);
  h+='</div></div></div>';
  viewEl.innerHTML=h;
  Array.prototype.forEach.call(viewEl.querySelectorAll(".toc-division-head"), function(hd){
    hd.addEventListener("click", function(){ hd.classList.toggle("open"); var b=viewEl.querySelector('.toc-chapters[data-div-body="'+cssEscape(hd.getAttribute("data-div"))+'"]'); if(b) b.classList.toggle("open"); });
  });
  Array.prototype.forEach.call(viewEl.querySelectorAll(".sidebar-tab[data-tab]"), function(t){
    t.addEventListener("click", function(){
      var tab=t.getAttribute("data-tab");
      if(tab==="front") go("#/"); else if(tab==="glossary") go("#/glossary");
      else { var f=flatChapterList(); go("#/c/"+encodeURIComponent(f[0].division.key)+"/"+f[0].chapter.num); }
    });
  });
  var jf=document.getElementById("jump-form");
  if(jf) jf.addEventListener("submit", function(ev){ ev.preventDefault(); var i=document.getElementById("jump-input"); if(!jumpTo(i.value)){ i.style.borderColor="var(--unc-ink)"; i.value=""; i.placeholder="nicht vorhanden"; } });
  var tb=document.getElementById("sidebar-toggle-btn"); if(tb) tb.addEventListener("click", openMobileSidebar);
  var act=viewEl.querySelector(".toc-chapter.active"); var sb=document.getElementById("reader-sidebar");
  if(act && sb){ try{ sb.scrollTop = Math.max(0, act.offsetTop - 120); }catch(e){} }
}
function openMobileSidebar(){ var sb=document.getElementById("reader-sidebar"), s=document.getElementById("sidebar-scrim"); if(sb) sb.classList.add("open"); if(s) s.classList.add("open"); }
function closeMobileSidebar(){ var sb=document.getElementById("reader-sidebar"), s=document.getElementById("sidebar-scrim"); if(sb) sb.classList.remove("open"); if(s) s.classList.remove("open"); }
document.getElementById("sidebar-scrim").addEventListener("click", closeMobileSidebar);
window.addEventListener("hashchange", render);
render();

</script>
