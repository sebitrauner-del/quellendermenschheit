"note":"","units":[{"n":821,"sa":"vṛṣā matīnāṃ pavate vicakṣaṇaḥ somo ahnāṃ pratarītoṣasāṃ divaḥ\nprāṇā sindhūnāṃ kalaśāṃ acikradadindrasya hārdyāviśanmanīṣibhiḥ","de":"Der Stier der Gedanken läutert sich, der Scharfsichtige, Soma, Herüberführer der Tage und der Morgenröten des Himmels [?]; er hat als Lebenshauch [?] der Ströme die Kübel brüllen lassen; in Indras Herz ist er eingedrungen, mit den Weisen."},{"n":822,"sa":"manīṣibhiḥ pavate pūrvyaḥ kavirnṛbhiryataḥ pari kośāṃ asiṣyadat\ntritasya nāma janayanmadhu kṣarannindrasya vāyūṃ sakhyāya vardhayan","de":"Mit den Weisen läutert sich der Uralte, der Seher, von den Männern gelenkt; er hat die Kübel umrundet; er erzeugte den Namen des Trita, Honig träufelnd, und stärkt Indra und Vāyu zur Freundschaft."},{"n":823,"sa":"ayaṃ punāna uṣaso arocayadayaṃ sindhubhyo abhavadu lokakṛt\nayaṃ triḥ sapta duduhāna āśiraṃ somo hṛde pavate cāru matsaraḥ","de":"Dieser, sich läuternd, hat die Morgenröten erleuchtet; dieser ist Weiträumiger für die Ströme geworden [Anm.: lokakṛt, „Raum-Schaffer“]; dieser, dreimal sieben Milchmischung ausmelkend, Soma, läutert sich ins Herz, lieblich, berauschend."}]},{"num":63,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 18","n_from":824,"n_to":826,"title_de":"Indra: Beistand und Gabe","note":"","units":[{"n":824,"sa":"evā hyasi vīrayurevā śūra uta sthirah\nevā te rādhyaṃ manaḥ","de":"So bist du ja heldenfreundlich, so, Held, und fest; so ist dein Sinn zu gewähren."},{"n":825,"sa":"evā rātistuvīmagha viśvebhirdhāyi dhātṛbhiḥ\nadhā cidindra naḥ sacā","de":"So ist die Gabe, Vielgabenreicher [tuvīmagha], von allen Stiftern gestiftet; und dann, Indra, sei bei uns."},{"n":826,"sa":"mo ṣu brahmeva tadindrayurbhuvo vājānāṃ pate\nmatsvā sutasya gomataḥ","de":"Nicht sei [du] Indras-Freund, wie ein Priester [brahman], das Gebet [?], du Herr der Beute; berausche dich am gepressten, kuhreichen [Soma] [Anm.: mo ṣu brahmeva tad indrayuḥ, Sinn unsicher]."}]},{"num":64,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 19","n_from":827,"n_to":829,"title_de":"Indra: Herr der Beute, der Sieger","note":"","units":[{"n":827,"sa":"indraṃ viśvā avīvṛdhantsamudravyacasaṃ giraḥ\nrathītamaṃ rathīnāṃ vājānāṃ satpatiṃ patim","de":"Indra haben alle Lieder gestärkt, den meergleich Weiten, den Wagenlenkerbesten unter den Wagenlenkern, den wahren Herrn der Gewinne, den Herrn."},{"n":828,"sa":"sakhye ta indra vājino mā bhema śavasaspate\ntvāmabhi pra nonumo jetāramaparājitam","de":"In deiner Freundschaft, Indra, Beutebringer, wollen wir uns nicht fürchten, Herr der Kraft; wir preisen dich immer wieder, den Sieger, den Unbesiegten."},{"n":829,"sa":"pūrvīrindrasya rātayo na vi dasyantyūtayaḥ\nyadā vājasya gomata stotṛbhyo maṃhate magham","de":"Die Gaben Indras sind viele; die Hilfen bleiben nicht aus; wenn er den Sängern die kuhreiche Gabe zuteilt [Anm.: gomataḥ vājasya, „kuhreiche Beute“]."}]},{"num":65,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 1","n_from":830,"n_to":832,"title_de":"Soma-Ströme: Segen und Glück","note":"","units":[{"n":830,"sa":"eta asṛgramindavastiraḥ pavitramāśavaḥ\nviśvānyabhi saubhagā","de":"Diese sind losgelassen worden, die Tropfen, über das Seihtuch, die Schnellen, zu allem Glück hin."},{"n":831,"sa":"vighnanto duritā puru sugā tokāya vājinaḥ\ntmanā kṛṇvanto arvataḥ","de":"Vieles Unheil zerschlagend, leicht gangbar [?] für den Nachwuchs, die Renner, von selbst die Rosse machend [Anm.: arvataḥ; tmanā kṛṇvantaḥ, „von selbst tuend“]."},{"n":832,"sa":"kṛṇvanto varivo gave 'bhyarṣanti suṣṭutim\niḍāmasmabhyaṃ saṃyatam","de":"Weiträumigkeit schaffend für die Kuh, ziehen sie zum schönen Preislied; Iḍā [Opferspeise] für uns, fest verbunden [?]."}]},{"num":66,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 2","n_from":833,"n_to":835,"title_de":"Soma Pavamāna: König, Kraft, Reichtum","note":"","units":[{"n":833,"sa":"rājā medhābhirīyate pavamāno manāvadhi\nantarikṣeṇa yātave","de":"Der König wird mit Weisheitsgaben angetrieben, der Pavamāna, mit Manu [?], um durch den Luftraum zu gehen."},{"n":834,"sa":"ā naḥ soma saho juvo rūpaṃ na varcase bhara\nsuṣvāṇo devavītaye","de":"Bring uns her, Soma, Stärke, die Antreibende, wie eine Gestalt zum Glanz; du, der gepresst wird, zur Götterlabung."},{"n":835,"sa":"ā na indo śatagvinaṃ gavāṃ poṣaṃ svaśvyam\nvahā bhagattimūtaye","de":"Bring uns her, Tropfen, hundertkuhreiche Rindernahrung, gutes Rossvermögen; führe Bhagas Gabe zur Hilfe herbei [?] [Anm.: bhagattim, „Bhaga-Gabe“]."}]},{"num":67,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 3","n_from":836,"n_to":840,"title_de":"Soma: der Gepriesene, der Sonnenschauende","note":"","units":[{"n":836,"sa":"taṃ tvā nṛmṇāni bibhrataṃ sadhastheṣu maho divaḥ\ncāruṃ sukṛtyayemahe","de":"Dich, der du Manneskräfte trägst, in den Sitzen des großen Himmels, den Lieblichen, rufen wir mit gutem Werk an [?]."},{"n":837,"sa":"saṃvṛktadhṛṣṇumukthyaṃ mahāmahivrataṃ madam\nśataṃ puro rurukṣaṇim","de":"Den Mutvollen, Preisenswerten, den mit großem Gebot, den Rausch, der hundert Burgen ersteigen will [?] [Anm.: saṃvṛktadhṛṣṇum; Bedeutung von rurukṣaṇim unsicher]."},{"n":838,"sa":"atastvā rayirabhyayadrājānaṃ sukrato divaḥ\nsuparṇo avyathī bharat","de":"Von daher hat dich der Reichtum aufgesucht, den König, du Weiser [sukratu], des Himmels; der Adlerartige, Unerschütterte, hat dich hergebracht."},{"n":839,"sa":"adhā hinvāna indriyaṃ jyāyo mahitvamānaśe\nabhiṣṭikṛdvicarṣaṇiḥ","de":"Und dann, sich antreibend, hat er die Indra-Kraft, die höhere Größe erlangt; der Erwünschter-Bringer, der Allschauende."},{"n":840,"sa":"viśvasmā itsvardṛśe sādhāraṇaṃ rajasturam\ngopāmṛtasya virbharat","de":"Für jeden, der das Licht schauen will, der allgemein Raum durcheilende: der Hüter der Wahrheit [ṛta], der Vogel, hat ihn getragen [?]."}]},{"num":68,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 4","n_from":841,"n_to":843,"title_de":"Soma Pavamāna: Läuterung zum Anlass Indras","note":"","units":[{"n":841,"sa":"iṣe pavasva dhārayā mṛjyamāno manīṣibhiḥ\nindo rucābhi gā ihi","de":"Zur Stärkung läutere dich im Strom, von den Weisen gereinigt; Tropfen, komm mit Glanz zu den Kühen [Anm.: gā, „Milch“]."},{"n":842,"sa":"punāno varivaskṛdhyūrjaṃ janāya girvaṇaḥ\nhare sṛjāna āśiram","de":"Sich läuternd, Weite schaffend, Kraft dem Volk, Liedliebender, der Falbe, die Milchmischung ausgießend."},{"n":843,"sa":"punāno devavītaya indrasya yāhi niṣkṛtam\ndyutāno vājibhirhitaḥ","de":"Sich läuternd, zur Götterlabung, geh zu Indras Bereitung; glänzend, von den Renngaben [?] gelegt [Anm.: vājibhir hitaḥ]."}]},{"num":69,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 5","n_from":844,"n_to":846,"title_de":"Agni-Anruf: Hausherr, Bote, Beschützer des Darbringers","note":"Agni als Seher, Hausherr und Bote der Darbringung.","units":[{"n":844,"sa":"agnināgniḥ samidhyate kavirgṛhapatiryuvā\nhavyavāḍjuhvāsyaḥ","de":"Durch Agni wird Agni entzündet, der Seher, der Hausherr, der junge, der Träger der Darbringung, dessen Mund der Schöpflöffel ist."},{"n":845,"sa":"yastvāmagne haviṣpatirdūtaṃ deva saparyati\ntasya sma prāvitā bhava","de":"Wer dich, Agni, als Herr der Darbringung als Boten, du Himmlischer, verehrt – dessen Beschützer sollst du sein."},{"n":846,"sa":"yo agniṃ devavītaye haviṣmāṃ āvivāsati\ntasmai pāvaka mṛḍaya","de":"Wer dem Agni, zur Einladung der Himmlischen, mit der Darbringung in der Hand dienstbar naht – dem sei gnädig, du Läuternder."}]},{"num":70,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 6","n_from":847,"n_to":849,"title_de":"Mitra und Varuṇa: Anruf um Einsicht und Kraft","note":"","units":[{"n":847,"sa":"mitraṃ huve pūtadakṣaṃ varuṇaṃ ca riśādasam\ndhiyaṃ ghṛtācīṃ sādhantā","de":"Mitra rufe ich, den mit geläuterter Tatkraft, und Varuṇa, den Feindverzehrer; die schmalzträufelnde Andacht, die beiden fördernd [?]."},{"n":848,"sa":"ṛtena mitrāvaruṇāvṛtāvṛdhāvṛtaspṛśā\nkratuṃ bṛhantamāśāthe","de":"Durch die Wahrheit, Mitra und Varuṇa, ihr Wahrheitsmehrer, Wahrheitsberührer, habt ihr die hohe Willenskraft erlangt."},{"n":849,"sa":"kavī no mitrāvaruṇā tuvijātā urukṣayā\ndakṣaṃ dadhāte apasam","de":"Ihr beiden Seher, Mitra und Varuṇa, vielgeboren, weiträumig wohnend, verleiht uns Geschick und Werkkraft."}]},{"num":71,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 7","n_from":850,"n_to":852,"title_de":"Indra: Gefährten, Mannestat und Fund der Kühe","note":"","units":[{"n":850,"sa":"indreṇa saṃ hi dṛkṣase saṃjagmāno abibhyuṣā\nmandū samānavarccasā","de":"Mit Indra zusammen wirst du gesehen, dem zusammen mit dem Furchtlosen; ihr beiden Frohen, von gleichem Glanz [?]."},{"n":851,"sa":"ādaha svadhāmanu punargarbhatvamerire\ndadhānā nāma yajñiyam","de":"Da nun nahmen sie gemäß der Eigenart wieder das Dasein im Mutterschoß an, indem sie den verehrungswürdigen Namen trugen [?]."},{"n":852,"sa":"vīḍu cidārujatnubhirguhā cidindra vahnibhiḥ\navinda usriyā anu","de":"Auch das Feste hast du, Indra, mit den Zerbrechern, auch im Verborgenen mit den Fahrern aufgefunden: die rötlichen Kühe [?]."}]},{"num":72,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 8","n_from":853,"n_to":855,"title_de":"Indra und Agni: Anruf der Unbeeinträchtigten","note":"","units":[{"n":853,"sa":"tā huve yayoridaṃ papne viśvaṃ purā kṛtam\nindrāgnī na mardhataḥ","de":"Sie rufe ich, deren Werk dieses ganze Frühere vollbracht wurde; Indra und Agni sind nicht zu beeinträchtigen."},{"n":854,"sa":"ugrā vighaninā mṛdha indrāgnī havāmahe\ntā no mṛḍāta īdṛśe","de":"Ihr Gewaltigen, Zerschmetterer der Feinde, Indra und Agni, rufen wir an; sie sollen uns in solcher Lage gnädig sein."},{"n":855,"sa":"hatho vṛtrāṇyāryā hatho dāsāni satpatī\nhatho viśvā apa dviṣaḥ","de":"Ihr erschlagt die Widerstände der Ārya, ihr erschlagt die Dāsa-Feinde, ihr Herren des Guten; ihr erschlagt alle Anfeindungen."}]},{"num":73,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 9","n_from":856,"n_to":858,"title_de":"Soma pavamāna: Strömen zum Meer","note":"","units":[{"n":856,"sa":"abhi somāsa āyavaḥ pavante madyaṃ madam\nsamudrasyādhi viṣṭape manīṣiṇo matsarāso madacyutaḥ","de":"Hin zu den lebendigen Somasäften strömen sie, den berauschenden Rausch, auf der Höhe des Meeres, die Weisen, die Trunkenen, die Rausch verspritzenden."},{"n":857,"sa":"taratsamudraṃ pavamāna ūrmiṇā rājā deva ṛtaṃ bṛhat\narṣā mitrasya varuṇasya dharmaṇā pra hinvāna ṛtaṃ bṛhat","de":"Das Meer durchquert der sich läuternde Gott, der König, mit der Woge, das hohe Wahrheitsgesetz; strömt herbei nach der Satzung von Mitra und Varuṇa, während er das hohe Wahrheitsgesetz antreibt."},{"n":858,"sa":"nṛbhiryemāṇo haryato vicakṣaṇo rājā devaḥ samudryaḥ","de":"Von Männern gelenkt, der Begehrte, Allschauende, der König, der Gott, der des Meeres ist."}]},{"num":74,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 10","n_from":859,"n_to":861,"title_de":"Soma: die drei Stimmen, Kühe und Lieder","note":"","units":[{"n":859,"sa":"tisro vāca īrayati pra vahnirṛtasya dhītiṃ brahmaṇo manīṣām\ngāvo yanti gopatiṃ pṛcchamānāḥ somaṃ yanti matayo vāvaśānāḥ","de":"Drei Stimmen lässt der Träger erklingen, den Gedanken der Wahrheit, die Eingebung des Gebets; die Kühe gehen fragend zum Herrn der Kühe, die Lieder gehen verlangend zum Soma."},{"n":860,"sa":"somaṃ gāvo dhenavo vāvaśānāḥ somaṃ viprā matibhiḥ pṛcchamānāḥ\nsomaḥ suta ṛcyate pūyamānaḥ some arkāstriṣṭubhaḥ saṃ navante","de":"Zum Soma die Kühe, die Milchkühe, verlangend, zum Soma die Weisen, mit Liedern fragend; Soma, der Gepresste, wird gepriesen, während er geläutert wird; im Soma stimmen die Triṣṭubh-Preislieder zusammen an [?]."},{"n":861,"sa":"evā naḥ soma pariṣicyamāna ā pavasva pūyamānaḥ svasti\nindramā viśa bṛhatā madena vardhayā vācaṃ janayā purandhim","de":"So, Soma, ströme, dir zugegossen, geläutert uns zum Wohl herbei; dringe zu Indra ein mit hohem Rausch, mehre die Rede, zeuge Fülle [Anm.: purandhi = Fülle/Freigebigkeit; Lesart unsicher]."}]},{"num":75,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 11","n_from":862,"n_to":863,"title_de":"Indra: Größe über Himmel und Erde","note":"","units":[{"n":862,"sa":"yaddyāva indra te śataṃśataṃ bhūmīruta syuḥ\nna tvā vajrintsahasraṃ suryā anu na jātamaṣṭa rodasī","de":"Wenn, Indra, hundert Himmel und hundert Erden dir gehörten, so könnten dir, Keulenträger, nicht tausend Sonnen folgen; nicht wurdest du geboren als einer, den beide Welten fassten [?]."},{"n":863,"sa":"ā paprātha mahinā vṛṣṇyā vṛṣanviśvā śaviṣṭha śavasā\nasmāṃ ava maghavangomati vraje vajriñcitrābhirūtibhiḥ","de":"Mit deiner Mannheit hast du alles erfüllt, Stier, mit Kraft, du Kräftigster; uns, Gabenreicher, bringe in die kuhreiche Hürde, Keulenträger, mit wunderbaren Hilfen."}]},{"num":76,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 12","n_from":864,"n_to":866,"title_de":"Indra: Anruf durch die Pressenden","note":"","units":[{"n":864,"sa":"vayaṃ gha tvā sutāvanta āpo na vṛktabarhiṣaḥ\npavitrasya prasravaṇeṣu vṛtrahanpari stotāra āsate","de":"Wir, die wir gepresst haben, sitzen um dich her wie Wasser, mit ausgelegtem Streu, an den Rinnen des Seihers, du Vṛtra-Töter, als Sänger."},{"n":865,"sa":"svaranti tvā sute naro vaso nireka ukthinaḥ\nkadā sutaṃ tṛṣāṇa oka ā gama indra svabdīva vaṃsagaḥ","de":"Beim Pressen singen dir die Männer, Gütiger, am Auslauf, die Lobredner; wann kommst du, Indra, nach dem Gepressten dürstend, zur Wohnstatt wie ein Stier, der zur Kuh zieht [?]."},{"n":866,"sa":"kaṇvebhirdhṛṣṇavā dhṛṣadvājaṃ darṣi sahasriṇam\npiśaṅgarūpaṃ maghavanvicarṣaṇe makṣū gomantamīmahe","de":"Mit den Kaṇvas durchbrichst du kühn den Reichtum der Kühnen, den tausendfachen; den falbfarbigen, gabenreicher, kuhreichen erbitten wir schnell, du Alleshelfer [?]."}]},{"num":77,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 13","n_from":867,"n_to":868,"title_de":"Indra: Anruf und Lob des Gebers","note":"","units":[{"n":867,"sa":"taraṇiritsiṣāsati vājaṃ purandhyā yujā\nā va indraṃ puruhūtaṃ name girā nemiṃ taṣṭeva sudruvam","de":"Der Rasche verlangt Siegesgewinn mit seinem Beistand der Fülle; euren Indra, den vielgerufenen, beuge ich mit dem Lied, wie der Wagner die Radfelge, gut laufend [?]."},{"n":868,"sa":"na duṣṭutirdraviṇodeṣu śasyate na sredhantaṃ rayirnaśat\nsuśaktirinmaghavaṃ tubhyaṃ māvate deṣṇaṃ yatpārye divi","de":"Nicht wird schlechtes Lob unter den Gabenspendern gepriesen; nicht erlangt den Widersacher Reichtum; die gute Kraft ist es, Gabenreicher, für dich, für einen wie mich, zu geben, was im fernen Himmel [?]."}]},{"num":78,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 14","n_from":869,"n_to":871,"title_de":"Soma: die drei Stimmen und die Kühe","note":"","units":[{"n":869,"sa":"tisro vāca udīrate gāvo mimanti dhenavaḥ\nharireti kanikradat","de":"Drei Stimmen erheben sich, die Kühe, die Milchkühe brüllen; der Falbe kommt daher, laut rufend."},{"n":870,"sa":"abhi brahmīranūṣata yahvīrṛtasya mātaraḥ\nmarjayantīrdivaḥ śiśum","de":"Die Gebetsworte riefen ihm zu, die Kräftigen, die Mütter der Wahrheit, das Kind des Himmels reinigend."},{"n":871,"sa":"rāyaḥ samudrāṃścaturo 'smabhyaṃ soma viśvataḥ\nā pavasva sahasriṇaḥ","de":"Reichtümer, die vier Meere, uns von allen Seiten, Soma, ströme tausendfach herbei."}]},{"num":79,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 15","n_from":872,"n_to":874,"title_de":"Soma für Indra: Preis des Rauschtranks","note":"","units":[{"n":872,"sa":"sutāso madhumattamāḥ somā indrāya mandinaḥ\npavitravanto akṣaraṃ devāngacchantu vo madāḥ","de":"Die gepressten, honigreichsten Somasäfte, die berauschenden für Indra, mit dem Seiher versehen, ungehemmt: zu den Göttern sollen eure Rausch-Säfte gehen."},{"n":873,"sa":"indurindrāya pavata iti devāso abruvan\nvācaspatirmakhasyate viśvasyeśāna ojasāḥ","de":"Der Saft strömt für Indra, so sagten die Himmlischen; der Herr der Rede, für den Freigebigen, Herrscher über alles mit Kraft [?]."},{"n":874,"sa":"sahasradhāraḥ pavate samudro vācamīṅkhayaḥ\nsomaspatī rayīṇāṃ sakhendrasya divedive","de":"Tausendströmig strömt er, das Meer, der die Rede antreibt [?], Herr des Soma, der Reichtümer, Gefährte Indras, Tag für Tag."}]},{"num":80,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 16","n_from":875,"n_to":877,"title_de":"Soma: das gespannte Seihtuch und die Kraft der Läuterung","note":"","units":[{"n":875,"sa":"pavitraṃ te vitataṃ brahmaṇaspate prabhurgātrāṇi paryeṣi viśvataḥ\nataptatanūrna tadāmo aśnute śṛtāsa idvahantaḥ saṃ tadāśata","de":"Dein Seihtuch ist ausgespannt, Herr des Gebets; als Mächtiger durchdringst du alle Glieder von allen Seiten; wer keinen durchglühten Leib hat, erlangt das nicht, roh; nur die Gargekochten, die tragen, erreichen es gemeinsam."},{"n":876,"sa":"tapoṣpavitraṃ vitataṃ divaspade 'rcanto asya tantavo vyasthiran\navantyasya pavītāramāśavo divaḥ pṛṣṭhamadhi rohanti tejasā","de":"Glut ist das Seihtuch, ausgespannt am Standort des Himmels; die Fäden dieses Somas, preisend, haben sich verteilt; die Raschen begünstigen den Läuterer, sie steigen durch ihre Glut auf den Rücken des Himmels."},{"n":877,"sa":"arūrucaduṣasaḥ pṛśniragriya ukṣā mimeti bhuvaneṣu vājayuḥ\nmāyāvino mamire asya māyayā nṛcakṣasaḥ pitaro garbhamā dadhuḥ","de":"Der Gefleckte hat die ersten Morgenröten erglänzen lassen; der Stier misst aus in den Welten, nach Kraft strebend; die Zauberkundigen haben mit seiner Zauberkraft gemessen; die Väter, die Männer-Schauenden, legten den Keim hinein [?]."}]},{"num":81,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 17","n_from":878,"n_to":879,"title_de":"Agni: Lobgesang und Gunst","note":"","units":[{"n":878,"sa":"pra maṃhiṣṭhāya gāyata ṛtāvne bṛhate śukraśociṣe\nupastutāso agnaye","de":"Singt für den Hochgemuten, den Wahrhaftigen, den Hohen, den hell Leuchtenden, ihr Lobpreisenden, für Agni."},{"n":879,"sa":"ā vaṃsate maghavā vīravadyaśaḥ samiddho dyumnyāhutaḥ\nkuvinno asya sumatirbhavīyasyacchā vājebhirāgamat","de":"Der Gabenreiche gewinnt heldenreichen Ruhm, entzündet, glanzvoll, mit Darbringung begossen; möge er uns doch wohlgesinnt sein, der Stärkere; er kam mit Stärkungen herbei [?]."}]},{"num":82,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 18","n_from":880,"n_to":882,"title_de":"Indra: der Rauschtrank und die Morgenlieder","note":"","units":[{"n":880,"sa":"taṃ te madaṃ gṛṇīmasi vṛṣaṇaṃ pṛkṣu sāsahim\nu lokakṛtnumadrivo hariśriyam","de":"Diesen deinen Rausch preisen wir, den stiergleichen, im Kampf überwindenden, den Raum Schaffenden, du Pressstein-Besitzer, den Falbenglanz Tragenden."},{"n":881,"sa":"yena jyotīṃṣyāyave manave ca viveditha\nmandāno asya barhiṣo vi rājasi","de":"Durch den du die Lichter für den Lebendigen und für Manu gefunden hast; erfreut leuchtest du über dieser Streu."},{"n":882,"sa":"tadadyā citta ukthino 'nu ṣṭuvanti pūrvathā\nvṛṣapatnīrapo jayā divedive","de":"Dies preisen dir heute die Sänger mit Gedanken nach altem Brauch: die Wasser, die Stiergattinnen, sind zu gewinnen, Tag für Tag [?]."}]},{"num":83,"loc":"Prapāṭhaka II, Ardha 2, Gruppe 19","n_from":883,"n_to":885,"title_de":"Indra: Bitte um Erhörung und Reichtum","note":"","units":[{"n":883,"sa":"śrudhī havaṃ tiraścyā indra yastvā saparyati\nsuvīryasya gomato rāyaspūrdhi mahāṃ asi","de":"Höre den Ruf des Abgewandten, Indra, der dich verehrt; erfülle dich mit heldenreicher, kuhreicher Fülle des Reichtums: du bist groß."},{"n":884,"sa":"yasta indra navīyasīṃ giraṃ mandrāmajījanat\ncikitvinmanasaṃ dhiyaṃ pratnāmṛtasya pipyuṣīm","de":"Wer dir, Indra, ein neueres, erfreuendes Lied erzeugt hat, eine Andacht, die den Sinn erkennt, alt, der Wahrheit voll [?] –"},{"n":885,"sa":"tamu ṣṭavāma yaṃ gira indramukthāni vāvṛdhuḥ\npurūṇyasya nauṃsyā siṣāsanto vanāmahe","de":"den wollen wir preisen, den die Lieder, Indra, die Sprüche gemehrt haben; seine vielen Heldentaten gewinnen wollend, mögen wir erlangen [?]."}]},{"num":84,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 1","n_from":886,"n_to":888,"title_de":"Soma pavamāna: Ströme der Milch und Läuterung","note":"","units":[{"n":886,"sa":"pra ta āśvinīḥ pavamāna dhenavo divyā asṛgranpayasā dharīmaṇi\nprāntarikṣātsthāvirīste asṛkṣata ye tvā mṛjantyṛṣiṣāṇa vedhasaḥ","de":"Vor dir strömten die Āśvinī-Kühe, o Sich-Läuternder, die himmlischen, mit Milch in die Halterung; aus dem Zwischenraum strömten deine festen hervor, die dich reinigen, die seherischen Ordner [?]."},{"n":887,"sa":"ubhayataḥ pavamānasya raśmayo dhruvasya sataḥ pari yanti ketavaḥ\nyadī pavitre adhi mṛjyate hariḥ sattā ni yonau kalaśeṣu sīdati","de":"Auf beiden Seiten des sich läuternden, des festen, umgeben ihn die Strahlen, die Zeichen; wenn der Falbe auf dem Seihtuch gereinigt wird, setzt er sich in den Schoß, in die Gefäße."},{"n":888,"sa":"viśvā dhāmāni viśvacakṣa ṛbhvasaḥ prabhoṣṭe sataḥ pari yanti ketavaḥ\nvyānaśī pavase soma dharmaṇā patirviśvasya bhuvanasya rājasi","de":"Alle Wesensformen, du Allschauender, du Erhabener: deine Zeichen umgeben dich, den Mächtigen, den Seienden; du durchdringst und läuterst dich, Soma, nach der Satzung; du bist Herr und König aller Wesen."}]},{"num":85,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 2","n_from":889,"n_to":891,"title_de":"Soma pavamāna: Licht und Saft","note":"","units":[{"n":889,"sa":"pavamāno ajījanaddivaścitraṃ na tanyatum\njyotirvaiśvānaraṃ bṛhat","de":"Der Sich-Läuternde hat das Licht erzeugt wie einen wunderbaren Donner: das hohe Licht, das allen Männern gehört [Anm.: vaiśvānara]."},{"n":890,"sa":"pavamāna rasastava mado rājannaducchunaḥ\nvi vāramavyamarṣati","de":"Dein Saft, o Sich-Läuternder, ist Rausch, König; er strömt [?] in das Schaffell-Sieb [Anm.: Wortlaut naducchunaḥ fraglich; Textzustand fraglich]."},{"n":891,"sa":"pavamānasya te raso dakṣo vi rājati dyumān\njyotirviśvaṃ svardṛśe","de":"Der Saft von dir, dem sich Läuternden, die Geschicklichkeit, leuchtet glanzvoll: das Licht, alles Sonnenhelle zum Schauen."}]},{"num":86,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 3","n_from":892,"n_to":897,"title_de":"Soma pavamāna: Strahlen, Regen und Reichtum","note":"","units":[{"n":892,"sa":"pra yadgāvo na bhūrṇayastveṣā ayāso akramuḥ\nghnantaḥ kṛṣṇāmapa tvacam","de":"Als die rastlosen, wie Kühe hin und her eilend, die Glänzenden, die Ausgezogenen, hervorbrachen, die schwarze Haut abschlagend [?]."},{"n":893,"sa":"suvitasya manāmahe 'ti setuṃ durāyyam\nsāhyāma dasyumavratam","de":"Wir denken an den guten Weg, über die schwer zu überschreitende Brücke; wir wollen den gesetzlosen Dasyu bezwingen."},{"n":894,"sa":"śṛṇve vṛṣṭeriva svanaḥ pavamānasya śuṣmiṇaḥ\ncaranti vidyuto divi","de":"Gehört wird das Rauschen des sich läuternden, des mächtigen, wie das Rauschen des Regens; Blitze wandern am Himmel."},{"n":895,"sa":"ā pavasva mahīmiṣaṃ gomadindo hiraṇyavat\naśvavatsoma vīravat","de":"Ströme herbei große Labung, kuhreich, du Tropfen, goldreich, rossreich, Soma, heldenreich."},{"n":896,"sa":"pavasva viśvacarṣaṇa ā mahī rodasī pṛṇa\nuṣāḥ sūryo na raśmibhiḥ","de":"Ströme, du Allschauender, erfülle die beiden großen Welten, wie die Morgenröte, wie die Sonne mit Strahlen."},{"n":897,"sa":"pari naḥ śarmayantyā dhārayā soma viśvataḥ\nsarā raseva viṣṭapam","de":"Um uns, Soma, mit dem Schutz gebenden Strom von allen Seiten, fließe wie der Saft in die Höhe [?]."}]},{"num":87,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 4","n_from":898,"n_to":903,"title_de":"Soma pavamāna: Läuterung für Indra","note":"","units":[{"n":898,"sa":"āśurarṣa bṛhanmate pari priyeṇa dhāmnā\nyatra devā iti bruvan","de":"Rasch ströme, du Hohes Sinnender, um deinen lieben Ort, wo die Himmlischen, so heißt es, sprachen."},{"n":899,"sa":"pariṣkṛṇvannaniṣkṛtaṃ janāya yātayanniṣaḥ\nvṛṣṭiṃ divaḥ pari srava","de":"Das Unbereitete zurüstend für den Menschen, Labungen bringend, ströme Regen vom Himmel umher."},{"n":900,"sa":"ayaṃ sa yo divaspari raghuyāmā pavitra ā\nsindhorūrmā vyakṣarat","de":"Dies ist er, der vom Himmel her, schnell laufend, in das Seihtuch, als Woge des Stromes, hervorgeflossen ist."},{"n":901,"sa":"suta eti pavitra ā tviṣiṃ dadhāna ojasā\nvicakṣāṇo virocayan","de":"Der Gepresste kommt zum Seihtuch, Glanz tragend mit Kraft, umherschauend, erleuchtend."},{"n":902,"sa":"āvivāsanparāvato atho arvāvataḥ sutaḥ\nindrāya sicyate madhu","de":"Herbeiwünschend, gepresst aus der Ferne wie aus der Nähe: für Indra wird der Honig gegossen."},{"n":903,"sa":"samīcīnā anūṣata hariṃ hinvantyadribhiḥ\nindumindrāya pītaye","de":"Einmütig haben sie ihn angesungen, den Falben treiben sie mit den Pressteinen an, den Tropfen für Indra zum Trinken."}]},{"num":88,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 5","n_from":904,"n_to":906,"title_de":"Soma: Tropfen für die Götter","note":"","units":[{"n":904,"sa":"hinvanti sūramusrayaḥ svasāro jāmayaspatim\nmahāminduṃ mahīyuvaḥ","de":"Es treiben den Sonnenhaften die Strahlen an, die Schwestern den Gatten der Verwandten, den großen Tropfen, die Großes Suchenden [?]."},{"n":905,"sa":"pavamāna rucārucā devo devebhyaḥ sutaḥ\nviśvā vasūnyā viśa","de":"Sich läuternd, mit Glanz um Glanz, der Gott, für die Götter gepresst: komm herein zu allen Gütern."},{"n":906,"sa":"ā pavamāna suṣṭutiṃ vṛṣṭiṃ devebhyo duvaḥ\niṣe pavasva saṃyatam","de":"Zu uns, du Sich-Läuternder, ströme gutes Lob, Regen, den Göttern Dienst, zur Labung, wohlgebändigt [?]."}]},{"num":89,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 6","n_from":907,"n_to":909,"title_de":"Agni: Hüter der Menschen, Sohn der Kraft","note":"","units":[{"n":907,"sa":"janasya gopā ajaniṣṭa jāgṛviragniḥ sudakṣaḥ suvitāya navyase\nghṛtapratīko bṛhatā divispṛṣā dyumadvi bhāti bharatebhyaḥ śuciḥ","de":"Als Hüter der Menschen wurde Agni geboren, wachsam, geschickt, für eine neue Wohlfahrt; mit schmalzgesichtigem Antlitz, mit hohem Himmelsberührenden leuchtet er hell und glanzvoll für die Bharatas, rein."},{"n":908,"sa":"tvāmagne aṅgiraso guhā hitamanvavindañchiśriyāṇaṃ vanevane\nsa jāyase mathyamānaḥ saho mahatvāmāhuḥ sahasasputramaṅgiraḥ","de":"Dich, Agni, fanden die Aṅgirasen, im Verborgenen niedergelegt, in jedem Holz sich einnistend; du wirst geboren, wenn du gerieben wirst, als Kraft; als Stärke nennt man dich, Aṅgiras, den Sohn der Kraft."},{"n":909,"sa":"yajñasya ketuṃ prathamaṃ purohitamagniṃ narastriṣadhasthe samindhate\nindreṇa devaiḥ sarathaṃ sa barhiṣi sīdanni hotā yajathāya sukratuḥ","de":"Agni, das Zeichen der Weihehandlung, den ersten Vorangesetzten, entzünden die Männer am dreifachen Sitz; mit Indra, mit den Himmlischen auf demselben Wagen setzt er sich auf die Streu als Rufer, zur Verehrung, der Kluge-Willige [?]."}]},{"num":90,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 7","n_from":910,"n_to":912,"title_de":"Mitra und Varuṇa: Soma für die beiden Wahrheitsmehrer","note":"","units":[{"n":910,"sa":"ayaṃ vāṃ mitrāvaruṇā sutaḥ soma ṛtāvṛdhā\nmamediha śrutaṃ havam","de":"Dieser Soma ist für euch gepresst, Mitra und Varuṇa, ihr Wahrheitsmehrer; hört hier meinen Ruf."},{"n":911,"sa":"rājānāvanabhidruhā dhruve sadasyuttame\nsahasrasthūṇa āśāte","de":"Ihr beiden Könige, ohne Trug, im festen, höchsten Sitz, mit tausend Säulen, habt ihr Platz genommen."},{"n":912,"sa":"tā samrājā ghṛtāsutī ādityā dānunaspatī\nsacete anavahvaram","de":"Sie, die beiden Oberherrscher, schmalzbegossen, die Āditya, Herren der Gabe, vereinen sich unbeirrbar."}]},{"num":91,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 8","n_from":913,"n_to":915,"title_de":"Indra und Dadhyañc: der Kopf des Rosses","note":"","units":[{"n":913,"sa":"indro dadhīco asthabhirvṛtrāṇyapratiṣkutaḥ\njaghāna navatīrnava","de":"Indra hat mit den Knochen des Dadhyañc, der nicht zurückzuweisen war, neunmal neunzig Vṛtras erschlagen."},{"n":914,"sa":"icchannaśvasya yacchiraḥ parvateṣvapaśritam\ntadvidaccharyaṇāvati","de":"Suchend, was das Haupt des Rosses war, in den Bergen verborgen, fand er es im Śaryaṇāvat [Anm.: Śaryaṇāvat = See oder Gegend am Kurukṣetra]."},{"n":915,"sa":"atrāha goramanvata nāma tvaṣṭurapīcyam\nitthā candramaso gṛhe","de":"Hier dachten sie an den verborgenen Namen der Kuh, des Tvaṣṭṛ, so im Haus des Mondes [?]."}]},{"num":92,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 9","n_from":916,"n_to":918,"title_de":"Indra und Agni: Lobgesang und Schutz","note":"","units":[{"n":916,"sa":"iyaṃ vāmasya manmana indrāgnī pūrvyastutiḥ\nabhrādvṛṣṭirivājani","de":"Dieses erste Lob eures Denkens, Indra und Agni, ist entstanden wie Regen aus der Wolke."},{"n":917,"sa":"śṛṇutaṃ jariturhavamindrāgnī vanataṃ giraḥ\nīśānā pipyataṃ dhiyaḥ","de":"Hört den Ruf des Sängers, Indra und Agni, erhört die Lieder; als Herrscher fördert die Gedanken."},{"n":918,"sa":"mā pāpatvāya no narendrāgnī mābhiśastaye\nmā no rīradhataṃ nide","de":"Nicht ins Unheil für uns, ihr Männer, Indra und Agni, nicht in Verwünschung, nicht in Schmähung lasst uns geraten."}]},{"num":93,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 10","n_from":919,"n_to":921,"title_de":"Soma pavamāna: Geschick und Rausch für die Götter","note":"","units":[{"n":919,"sa":"pavasva dakṣasādhano devebhyaḥ pītaye hare\nmarudbhyo vāyave madaḥ","de":"Ström, du Geschick Schaffender, für die Himmlischen zum Trinken, du Falber; für die Marut und Vāyu ist der Rausch."},{"n":920,"sa":"saṃ devaiḥ śobhate vṛṣā kaviryonāvadhi priyaḥ\npavamāno adābhyaḥ","de":"Mit den Himmlischen zusammen glänzt der Stier, der Seher, lieb im Mutterschoß, der Sich-Läuternde, der nicht Bezwingbare."},{"n":921,"sa":"pavamāna dhiyā hito3 'bhi yoniṃ kanikradat\ndharmaṇā vāyumāruhaḥ","de":"Durch Andacht angeregt, o Sich-Läuternder, brüllend zum Mutterschoß, hast du nach der Satzung Vāyu bestiegen [Anm.: hito3 mit Pluti]."}]},{"num":94,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 11","n_from":922,"n_to":923,"title_de":"Soma: Gefährtenschaft Tag und Nacht","note":"","units":[{"n":922,"sa":"tavāhaṃ soma rāraṇa sakhya indo divedive\npurūṇi babhro ni caranti māmava paridhīṃ rati tāṃihi","de":"Ich bin dein, Soma, in deiner Freundschaft, Indra, Tag für Tag; viele, o Brauner, laufen um mich her; lass die Umzäunung [?] hinter dir wohlgefallen [Anm.: Textzustand fraglich: paridhīṃ rati tāṃihi]."},{"n":923,"sa":"tavāhaṃ naktamuta soma te divā duhāno babhra ūdhani\nghṛṇā tapantamati sūryaṃ paraḥ śakunā iva paptima","de":"Ich bin dein, bei Nacht und, Soma, bei Tag, an deinem Euter melkend, o Brauner; über die Sonne, die glühende, hinaus, dorthin, mit Mitleid, flogen wir wie Vögel [?]."}]},{"num":95,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 12","n_from":924,"n_to":926,"title_de":"Soma: Bitte um großen Reichtum","note":"","units":[{"n":924,"sa":"punāno akramīdabhi viśvā mṛdho vicarṣaṇiḥ\nśumbhanti vipraṃ dhītibhiḥ","de":"Sich läuternd ist er vorangeschritten, hin zu allen Feinden, der Allschauende; die Weisen schmücken den Redner mit Gedanken [?]."},{"n":925,"sa":"ā yonimaruṇo ruhadgamadindraṃ vṛṣā sutam\ndhruve sadasi sīdatu","de":"Der Rötliche bestieg den Mutterschoß, der Stier kam zu Indra, dem Gepressten; er soll sich im festen Sitz niederlassen."},{"n":926,"sa":"nū no rayiṃ mahāmindo 'smabhyaṃ soma viśvataḥ\nā pavasva sahasriṇam","de":"Nun, großen Reichtum uns, Tropfen, Soma, von allen Seiten ströme, tausendfach, herbei."}]},{"num":96,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 13","n_from":927,"n_to":929,"title_de":"Indra: Aufforderung zum Somatrunk","note":"","units":[{"n":927,"sa":"pibā somamindra madantu tvā yaṃ te suṣāva haryaśvādriḥ\nsoturbāhubhyāṃ suyato nārvā","de":"Trink den Soma, Indra; dich sollen erfreuen, den dir der Stein des Falbenrosslenkers gepresst hat, mit den Armen des Pressers, gut geführt wie ein Ross [?]."},{"n":928,"sa":"yaste mado yujyaścārurasti yena vṛtrāṇi haryaśva haṃsi\nsa tvāmindra prabhūvaso mamattu","de":"Dein Rausch, der anspannbar, lieblich ist, mit dem du, Falbenrosslenker, die Vṛtras erschlägst: der soll dich, Indra, Herr der Güter, erfreuen."},{"n":929,"sa":"bodhā su me maghavanvācamemāṃ yāṃ te vasiṣṭho arcati praśastim\nimā brahma sadhamāde juṣasva","de":"Merk gut auf diese meine Rede, Gabenreicher, das Lob, das dir Vasiṣṭha darbringt; diese Gebete nimm gern an beim gemeinsamen Rausch."}]},{"num":97,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 14","n_from":930,"n_to":932,"title_de":"Indra: Kraftvoller Herrscher","note":"","units":[{"n":930,"sa":"viśvāḥ pṛtanā abhibhūtaraṃ naraḥ sajūstatakṣurindraṃ jajanuśca rājase\nkratve vare sthemanyāmurīmutogramojiṣṭhaṃ tarasaṃ tarasvinam","de":"Alle Heere überwältigt er am meisten: die Männer haben Indra gemeinsam gezimmert, und sie haben ihn gezeugt, dass er herrsche, ihn, den zur Tatkraft Erwählten, den Standhaften, den Gewaltigen, den Stärksten, den Schnellen, den Kraftvollen [?]."},{"n":931,"sa":"nemiṃ namanti cakṣasā meṣaṃ viprā abhisvare\nsudītayo vo adruho 'pi karṇe tarasvinaḥ samṛkvabhiḥ","de":"Zum Rand [?] beugen sich die Seher mit dem Blick, wie das Schaf, beim Anruf; gut leuchtend seid ihr, ohne Trug, auch im Ohr, ihr Kraftvollen, mit den Sängern [Anm.: Textzustand fraglich]."},{"n":932,"sa":"samu rebhaso asvarannindraṃ somasya pītaye\nsvaḥpatiryadī vṛdhe dhṛtavrato hyojasā samūtibhiḥ","de":"Zusammen ließen die Sänger Indra zum Somatrunk erklingen; wenn der Herr des Himmels zum Wachsen, der an Gesetze Festgehaltene, sich mit Kraft, mit Hilfen verbindet [?]."}]},{"num":98,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 15","n_from":933,"n_to":934,"title_de":"Indra: König der Völker und Vṛtra-Töter","note":"","units":[{"n":933,"sa":"yo rājā carṣaṇīnāṃ yātā rathebhiradhriguḥ\nviśvāsāṃ tarutā pṛtanānāṃ jyeṣṭhaṃ yo vṛtrahā gṛṇe","de":"Der König der Völker, der auf Wagen fährt, ohne Hemmnis, der Überwinder aller Heere, der Beste, der Vṛtra-Töter – ihn preise ich."},{"n":934,"sa":"indraṃ taṃ śumbhya puruhanmannavase yasya dvitā vidharttari\nhastena vajraḥ prati dhāyi darśato mahāṃ devo na sūryaḥ","de":"Diesen Indra schmücke, Vielrufer, zum Beistand, dessen zwei Arten des Verteilens in der Hand gelten; in der Hand liegt die Keule, sichtbar, der große Gott, wie die Sonne [?]."}]},{"num":99,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 16","n_from":935,"n_to":937,"title_de":"Soma: der Seher zwischen Himmel und Erde","note":"","units":[{"n":935,"sa":"pari priyā divaḥ kavirvayāṃsi naptyorhitaḥ\nsvānairyāti kavikratuḥ","de":"Er geht um die lieben Stätten des Himmels, der Seher, die Kräfte, in den Enkeln niedergelegt; mit Klängen wandelt er, der Kluge im Willen [?]."},{"n":936,"sa":"sa sūnurmātarā śucirjāto jāte arocayat\nmahānmahī ṛtāvṛdhā","de":"Er, der Sohn, der reine, geboren, ließ die beiden Mütter leuchten, die beiden geborenen; die Großen, die große Wahrheitsmehrerin [?]."},{"n":937,"sa":"prapra kṣayāya panyase janāya juṣṭo adruhaḥ\nvītyarṣa paniṣṭaye","de":"Immer wieder kommst du zur Behausung, geehrt, dem Menschen lieb, ohne Trug; ströme dahin zum Ehren [?]."}]},{"num":100,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 17","n_from":938,"n_to":939,"title_de":"Soma Pavamāna: der leuchtendste, zur Unsterblichkeit rufend","note":"","units":[{"n":938,"sa":"tvaṃ hyā3ṃṅga daivyā pavamāna janimāni dyumattamaḥ\namṛtatvāya ghoṣayan","de":"Du ja, o Pavamāna, [bist] der Leuchtendste unter den himmlischen Geschlechtern, [du,] der du zur Unsterblichkeit hin ausrufst."},{"n":939,"sa":"yenā navagvo dadhyaṅṅaporṇute yena viprāsa āpire\ndevānāṃ sumne amṛtasya cāruṇo yena śravāṃsyāśata","de":"Womit der Navagva [und] Dadhyañc [den Stall] aufschloss [?], womit die Redekundigen [ihn] erreichten, womit der Glänzende in der Gunst der Götter [und] des Unsterblichen Ruhmestaten erlangte [?]. [Anm.: Wortlaut und Zusammenhang der Relativsätze unsicher, kein Hauptsatz vorhanden.]"}]},{"num":101,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 18","n_from":940,"n_to":942,"title_de":"Soma Pavamāna: Läuterung durch das Schafwollsieb","note":"","units":[{"n":940,"sa":"somaḥ punāna ūrmiṇāvyaṃ vāraṃ vi dhāvati\nagre vācaḥ pavamānaḥ kanikradat","de":"Soma, sich läuternd, strömt in Wellen durch das Schafhaar-Sieb; als Läuterer brüllt er voran der Rede."},{"n":941,"sa":"dhībhirmṛjanti vājinaṃ vane krīḍantamatyavim\nabhi tripṛṣṭhaṃ matayaḥ samasvaran","de":"Mit Gedanken [Andachten] streicheln sie den Siegespreisträger, der im Holz [Gefäß] spielt, über das Schaf[haar] hinweg; die Lieder ertönten zusammen auf den Dreifach-Rücken [Anm.: tripṛṣṭha, der dritte Himmel bzw. das Pressgefäß, unsicher] hin [?]."},{"n":942,"sa":"asarji kalaśāṃ abhi mīḍhvāntsaptirna vājayuḥ\npunāno vācaṃ janayannasiṣyadat","de":"Losgelassen ist er zu den Kufen [Kelchen] hin, der Freigebige, gleich einem siegbegierigen Ross; sich läuternd, die Rede erzeugend, ist er hingeflossen."}]},{"num":102,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 19","n_from":943,"n_to":945,"title_de":"Soma Pavamāna: Erzeuger von allem, Sänger unter den Göttern","note":"","units":[{"n":943,"sa":"somaḥ pavate janitā matīnāṃ janitā divo janitā pṛthivyāḥ\njanitāgnerjanitā sūryasya janitendrasya janitota viṣṇoḥ","de":"Soma klärt sich, der Erzeuger der Andachten, Erzeuger des Himmels, Erzeuger der Erde, Erzeuger Agnis, Erzeuger der Sonne, Erzeuger Indras und auch Viṣṇus."},{"n":944,"sa":"brahmā devānāṃ padavīḥ kavīnāṃ ṛṣirviprāṇāṃ mahiṣomṛgāṇām\nśyeno gṛdhrāṇāṃ svadhitirvanānāṃ somaḥ pavitramatyeti rebhan","de":"Brahmā [Priester/Wesen des Gebets] der Götter, Wegweiser der Dichter, Seher der Redegewandten, Büffel unter den Tieren, Falke unter den Geiern, Beil unter den Hölzern [Wäldern]: so geht Soma, [laut] singend, über das Sieb hinweg."},{"n":945,"sa":"prāvīvipadvāca ūrmiṃ na sindhurgira stomānpavamāno manīṣāḥ\nantaḥ paśyanvṛjanemāvarāṇyā tiṣṭhati vṛṣabho goṣu jānan","de":"Er hat die Rede vorangetrieben wie der Strom die Woge, [er,] der Pavamāna, Lieder, Preisgesänge [und] Gedanken; nach innen [auf das Untere?] schauend steht der Stier in den Rindern, [sie] kennend, an der Stätte [?]. [Anm.: zweite Hälfte schwierig, Wortgrenzen unsicher; Textzustand fraglich.]"}]},{"num":103,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 20","n_from":946,"n_to":948,"title_de":"Agni-Lied: Mehrer der Weihehandlungen","note":"","units":[{"n":946,"sa":"agniṃ vo vṛdhantamadhvarāṇāṃ purūtamam\nacchā naptre sahasvate","de":"Agni, den Mehrer eurer Weihehandlungen, den vielfach Genannten, [rufen wir] zum Enkel [Nachkommen], dem Mächtigen hin."},{"n":947,"sa":"ayaṃ yathā na ābhuvattvaṣṭā rūpeva takṣyā\nasya kratvā yaśasvataḥ","de":"Dieser soll uns [so] beistehen, wie Tvaṣṭar, der Gestalten wie ein Zimmermann zurechtschneidet, durch die Einsicht dieses Ruhmreichen."},{"n":948,"sa":"ayaṃ viśvā abhi śriyo 'gnirdeveṣu patyate\nā vājairupa no gamat","de":"Dieser Agni gebietet unter den Göttern über alle Herrlichkeiten; er möge mit Stärkegaben zu uns kommen."}]},{"num":104,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 21","n_from":949,"n_to":951,"title_de":"Indra-Lied: Trank und Preis","note":"","units":[{"n":949,"sa":"imamindra sutaṃ piba jyeṣṭhamamartyaṃ madam\nśukrasya tvābhyakṣarandhārā ṛtasya sādane","de":"Trinke, Indra, diesen gepressten [Soma], den obersten, unsterblichen Rausch; zu dir hin sind die Ströme des glänzenden [Safts] geflossen im Sitz der Wahrheit [des Ṛta]."},{"n":950,"sa":"na kiṣṭvadrathītaro harī yadindra yacchase\nna kiṣṭvānu majmanā na kiḥ svaśva ānaśe","de":"Keiner ist ein besserer Wagenkämpfer als du, wenn du, Indra, die beiden Falben zügelst; keiner [reicht] dir an Kraft nach, keiner [ist] besser mit Rossen bespannt, [keiner] hat [dich] erreicht."},{"n":951,"sa":"indrāya nūnamarcatokthāni ca bravītana\nsutā amatsurindavo jyeṣṭhaṃ namasyatā sahaḥ","de":"Preist Indra jetzt, singt ihm auch Lobreden; die gepressten Tropfen haben berauscht; verehrt den obersten, den Mächtigen mit Ehrerbietung."}]},{"num":105,"loc":"Prapāṭhaka III, Ardha 1, Gruppe 22","n_from":952,"n_to":954,"title_de":"Indra und Soma: Rausch und Taten","note":"","units":[{"n":952,"sa":"indra juṣasva pra vahā yāhi śūra hariha\npibā sutasya matirna madhoścakānaścārurmadāya","de":"Indra, sei zufrieden, fahre [sie] vor, komm, Held, hierher zu den Falben; trinke vom Gepressten, [begierig] wie ein Gedanke nach dem Süßen, ein Liebenswerter, zum Rausch."},{"n":953,"sa":"indra jaṭharaṃ navyaṃ na pṛṇasva madhordivo na\nasya sutasya svā3rnopa tvā madāḥ suvāco asthuḥ","de":"Indra, fülle den Bauch [neu, wie] mit dem Süßen [wie] vom Himmel; um diesen gepressten [Soma] herum sind dich [die Rauschtränke] mit schöner Stimme wie Sonnenlicht [?] angekommen. [Anm.: svā3r na, „wie Licht/Himmel“, Deutung unsicher.]"},{"n":954,"sa":"indrasturāṣāṇmitro na jaghāna vṛtraṃ yatirna\nbibheda valaṃ bhṛgurna sasāhe śatrūnmade somasya","de":"Indra, der Kraftvolle, [wie] Mitra, erschlug den Vṛtra wie ein Asket [Yati] [?]; er spaltete den Vala wie Bhṛgu; er überwältigte die Feinde im Rausch des Soma. [Anm.: Vergleiche mit yati und Bhṛgu als Eigennamen; unsicher.]"}]},{"num":106,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 1","n_from":955,"n_to":957,"title_de":"Soma Pavamāna: Gaben und Lebenskraft","note":"","units":[{"n":955,"sa":"govitpavasva vasuviddhiraṇyavidretodhā indo bhuvaneṣvarpitaḥ\ntvaṃ suvīro asi soma viśvavittaṃ tvā nara upa girema āsate","de":"Rinder-Findender, klär dich, Schätze-Finder, Gold-Finder, Samen-Träger, Indu, [du bist] in den Welten niedergelegt; du bist, Soma, gutmännig [reich an guten Männern], allkundig; dich [besingen wir], die Männer, sitzen wir bei [dir] und preisen."},{"n":956,"sa":"tvaṃ nṛcakṣā asi soma viśvataḥ pavamāna vṛṣabha tā vi dhāvasi\nsa naḥ pavasva vasumaddhiraṇyavadvayaṃ syāma bhuvaneṣu jīvase","de":"Du bist, Soma, der Männer-Beobachter von allen Seiten; als Pavamāna, o Stier, strömst du diese [Bahnen] durch; so klär dich für uns mit Schätzen und Gold, damit wir in den Welten zum Leben [Dauer] gelangen."},{"n":957,"sa":"īśāna imā bhuvanāni īyase yujāna indo haritaḥ suparṇyaḥ\ntāste kṣarantu madhumadghṛtaṃ payastava vrate soma tiṣṭhantu kṛṣṭayaḥ","de":"Als Herrscher wanderst du durch diese Welten, Indu, [du,] der die falben Vogelschönen [Stuten] anschirrt; diese sollen dir Honigsüßes, Schmalz und Milch strömen; in deinem Gesetz, Soma, sollen die Völker stehen."}]},{"num":107,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 2","n_from":958,"n_to":960,"title_de":"Soma Pavamāna: Strahlen und Ruf","note":"","units":[{"n":958,"sa":"pavamānasya viśvavitpra te sargā asṛkṣata\nsūryasyeva na raśmayaḥ","de":"Des sich läuternden [Soma], des Allkundigen, wurden deine Ergüsse losgelassen, [glänzend] wie die Strahlen der Sonne."},{"n":959,"sa":"ketuṃ kṛṇvaṃ divaspari viśvā rūpābhyarṣasi\nsamudraḥ soma pinvase","de":"Ein Banner über dem Himmel machend, ziehst du auf alle Gestalten zu; du schwillst an, Soma, [wie] ein Ozean."},{"n":960,"sa":"jajñāno vācamiṣyasi pavamāna vidharmaṇi\nkrandaṃ devo na sūryaḥ","de":"Geboren, treibst du die Rede an, Pavamāna, im Gefüge [Ordnung]: brüllend, [du] Gott, [wie] die Sonne."}]},{"num":108,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 3","n_from":961,"n_to":967,"title_de":"Soma Pavamāna: Ströme zu Indra","note":"","units":[{"n":961,"sa":"pra somāso adhanviṣuḥ pavamānāsa indavaḥ\nśrīṇānā apsu vṛñjate","de":"Die Somas sind hervorgeeilt, die sich läuternden Tropfen; sich vermischend werden sie im Wasser [rein] gemacht [oder: sie mischen sich mit Wasser]."},{"n":962,"sa":"abhi gāvo adhanviṣurāpo na pravatā yatīḥ\npunānā indramāśata","de":"Die Rinder [Milch] sind darauf zugeströmt, wie Wasser, das die Abhänge hinabgeht; sich klärend haben sie Indra erreicht."},{"n":963,"sa":"pra pavamāna dhanvasi somendrāya mādanaḥ\nnṛbhiryato vi nīyase","de":"Du strömst hervor, Pavamāna, Soma, [als] Rauschtrank für Indra; von Männern geleitet wirst du [dahin] geführt."},{"n":964,"sa":"indo yadadribhiḥ sutaḥ pavitraṃ paridīyase\naramindrasya dhāmne","de":"Indu, wenn du, von den Presssteinen gepresst, um das Sieb herum gelenkt wirst: [du bist] genug für Indras Wohnstatt [Reich]."},{"n":965,"sa":"tvaṃ soma nṛmādanaḥ pavasva carṣaṇīdhṛtiḥ\nsasniryo anumādyaḥ","de":"Du, Soma, Männer-Erfreuer, klär dich, Träger der Völker, [du] Gewinner, dem man nachjubelt [?]."},{"n":966,"sa":"pavasva vṛtrahantama ukthebhiranumādyaḥ\nśuciḥ pāvako adbhutaḥ","de":"Klär dich, Vṛtra-Erschlager, [du,] den man mit Lobreden nachbejubelt; rein, läuternd, wunderbar."},{"n":967,"sa":"śuciḥ pāvaka ucyate somaḥ sutaḥ sa madhumān\ndevāvīraghaśaṃsahā","de":"Rein, läuternd wird er genannt, der gepresste, honigsüße Soma, der die Götter schützt und den Bösredner erschlägt."}]},{"num":109,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 4","n_from":968,"n_to":974,"title_de":"Soma Pavamāna: Gaben für Sänger","note":"","units":[{"n":968,"sa":"pra kavirdevavītaye 'vyā vārebhiravyata\nsāhvānviśvā abhi spṛdhaḥ","de":"Der Seher [ist] hervorgegangen zur Einladung der Götter [devavīti]; durch die Schafhaar-Sieben ist er umschlossen worden [oder: er wird geschützt]; der alle Widersacher Bezwingende."},{"n":969,"sa":"sa hi ṣmā jaritṛbhya ā vājaṃ gomantaminvati\npavamānaḥ sahasriṇam","de":"Denn der treibt den Sängern Kraftgabe, reich an Rindern, herbei, der sich läuternde, tausendfache."},{"n":970,"sa":"pari viśvāni cetasā mṛjyase pavase matī\nsa naḥ soma śravo vidaḥ","de":"Ringsum wirst du mit dem Geist von allem gereinigt, du klärst dich mit [unserem] Gedanken; du, Soma, finde uns Ruhm!"},{"n":971,"sa":"abhyarṣa bṛhadyaśo maghavadbhyo dhruvaṃ rayim\niṣaṃ stotṛbhya ā bhara","de":"Ström hin, weithin Ruhmvoller: den Freigebigen [Gönnern] beständigen Reichtum; bring den Sängern Stärkung."},{"n":972,"sa":"tvaṃ rājeva suvrato giraḥ somāviveśitha\npunāno vahne adbhuta","de":"Du, gleich einem König mit guten Gesetzen [Geboten], bist in die Lieder eingedrungen; du Läuternder, o Fahrer, o Wunderbarer."},{"n":973,"sa":"sa vahnirapsu duṣṭaro mṛjyamāno gabhastyoḥ\nsomaścamūṣu sīdati","de":"Dieser Fahrer, im Wasser schwer zu überwinden, in den Händen gereinigt: Soma setzt sich in die Kufen."},{"n":974,"sa":"krīḍurmakho na maṃhayuḥ pavitraṃ soma gacchasi\ndadhatstotre suvīryam","de":"Spielend, [wie] ein Freigebiger, Gabenwilliger, gehst du, Soma, zum Sieb; dem Sänger heldenhafte Kraft verleihend."}]},{"num":110,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 5","n_from":975,"n_to":978,"title_de":"Soma Pavamāna: Gerste, Fülle und Sieg","note":"","units":[{"n":975,"sa":"yavaṃyavaṃ no andhasā puṣṭaṃpuṣṭaṃ pari srava\nviśvā ca soma saubhagā","de":"Gerste um Gerste [Stück um Stück] fließe uns mit [deinem] Trank, Nahrung um Nahrung; und alle Glücksgüter, Soma."},{"n":976,"sa":"indo yathā tava stavo yathā te jātamandhasaḥ\nni barhiṣi priye sadaḥ","de":"Indu, wie dein Lobpreis [ist], wie dein Erzeugtes vom Trank [?] ist: setz dich auf das liebe Barhis-Streu."},{"n":977,"sa":"uta no govidaśvavitpavasva somāndhasā\nmakṣūtamebhirahabhiḥ","de":"Und uns, Rinder- und Rosse-Findender, klär dich, Soma, mit deinem Trank, [du] rasch [Wirkender] an diesen Tagen."},{"n":978,"sa":"yo jināti na jīyate hanti śatrumabhītya\nsa pavasva sahasrajit","de":"Der besiegt und nicht besiegt wird, der den Feind angreift und erschlägt: [du] so klär dich, tausendfach Siegender."}]},{"num":111,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 6","n_from":979,"n_to":981,"title_de":"Soma Pavamāna: Ströme zum Sieb","note":"","units":[{"n":979,"sa":"yāste dhārā madhuścuto 'sṛgraminda ūtaye\ntābhiḥ pavitramāsadaḥ","de":"Deine Ströme, die Süßes träufeln, sind, Indu, zur Hilfe losgelassen; mit ihnen nimm Platz im Sieb."},{"n":980,"sa":"so arṣendrāya pītaye tiro vārāṇyavyayā\nsīdannṛtasya yonimā","de":"Du, ström hin für Indra zum Trinken durch die Schafhaar-Sieben, sich setzend in den Schoß des Ṛta."},{"n":981,"sa":"tvaṃ soma pari srava svādiṣṭho aṅgirobhyaḥ\nvarivoviddhṛtaṃ payaḥ","de":"Du, Soma, ström ringsum, [du] süßester für die Aṅgiras, [du] weiten Raum Findender, [du] Schmalz [und] Milch."}]},{"num":112,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 7","n_from":982,"n_to":984,"title_de":"Agni-Lied: Glanz, Lodern und Rufer","note":"","units":[{"n":982,"sa":"tava śriyo varṣyasyeva vidyutogneścikitra uṣasāmivetayaḥ\nyadoṣadhīrabhisṛṣṭo vanāni ca pari svayaṃ cinuṣe annamāsani","de":"Deine Herrlichkeiten erscheinen wie [die] des regnenden [Himmels], wie Blitze, Agni, [wie] die Bahnen der Morgenröten, wenn du auf die Kräuter losgelassen wirst und selbst die Wälder rings aufliest [und] im Mund [Nahrung] hast [?]."},{"n":983,"sa":"vātopajūta iṣito vaśāṃ anu tṛṣu yadannā veviṣadvitiṣṭhase\nā te yatante rathyo3 yathā pṛthakśardhāṃsyagne ajarasya dhakṣataḥ","de":"Vom Wind angetrieben, herbeigeeilt, [folgst du] den Kühen [oder: dem Willen], wenn du, durstig, die Speisen durchdringst, stehst du da; auf dich richten sich [die Flammen] wie Wagen[gespanne] getrennt: die Glut des alterslosen, brennenden Agni. [Anm.: Wortlaut teils schwierig; Textzustand fraglich.]"},{"n":984,"sa":"medhākāraṃ vidathasya prasādhanamagniṃ hotāraṃ paribhūtaraṃ matim\ntvāmarbhasya haviṣaḥ samānamittavāṃ maho vṛṇate nānyaṃ tvat","de":"Den Einsichts-Schaffer, den Vollender der Feier [vidatha], Agni, den Rufer, den alles Überwindenden, [den] Gedanken: dich, [den] gleichen für kleine [wie] Opfergabe, wählen die Großen; keinen anderen als dich. [Anm.: Deutung unsicher.]"}]},{"num":113,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 8","n_from":985,"n_to":987,"title_de":"Mitra und Varuṇa: Bitte um Gunst und Schutz","note":"","units":[{"n":985,"sa":"purūruṇā ciddhyastyavo nūnaṃ vāṃ varuṇa\nmitra vaṃsi vāṃ sumatim","de":"Viele Male ist ja wohl jetzt euer Beistand [gewesen], Varuṇa; Mitra, ich erbitte euer beider Wohlwollen."},{"n":986,"sa":"tā vāṃ samyagadruhvāṇeṣamaśyāma dhāma ca\nvayaṃ vāṃ mitrā syāma","de":"Ihr beide, die ihr ohne Trug seid: wir möchten Trank und Stätte recht erlangen; wir möchten euch beiden, Mitra [und Varuṇa], zugehören."},{"n":987,"sa":"pātaṃ no mitrā pāyubhiruta trāyethāṃ sutrātrā\nsāhyāma dasyūṃ tanūbhiḥ","de":"Schützt uns, ihr Mitra[-Varuṇa], mit euren Schutzmitteln und rettet [uns], ihr guten Retter; wir wollen den Dasyu mit [unseren] Leibern überwältigen."}]},{"num":114,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 9","n_from":988,"n_to":990,"title_de":"Indra: Soma-Trank und Taten","note":"","units":[{"n":988,"sa":"uttiṣṭhannojasā saha pītvā śipre avepayaḥ\nsomamindra camūsutam","de":"Dich mit Kraft aufrichtend, hast du, nachdem du getrunken hattest, mit den Kinnbacken [Helmbacken?] gezittert [Anm.: śipra, „Kinnbacke/Helm“; Deutung unsicher], den Soma, Indra, der in den Schalen gepresst ist."},{"n":989,"sa":"anu tvā rodasī ubhe spardhamānamadadetām\nindra yaddasyuhābhavaḥ","de":"Beide Welten [Himmel und Erde] haben dir zugejubelt [oder: sind dir gefolgt], als du wetteifernd [?] wurdest, Indra, Dasyu-Töter."},{"n":990,"sa":"vācamaṣṭāpadīmahaṃ navasraktimṛtāvṛdham\nindrātparitanvaṃ mame","de":"Ich [habe] die achtfüßige Rede, die neunfach gegliederte, die Ṛta-mehrende [gemacht]; [von] Indra her habe ich einen Leib [Körper] bemessen [?]. [Anm.: Textzustand fraglich; „aṣṭāpadī vāc“ bezeichnet ein achtfüßiges Sprachgebilde.]"}]},{"num":115,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 10","n_from":991,"n_to":993,"title_de":"Indra und Agni: Einladung zum Soma","note":"","units":[{"n":991,"sa":"indrāgnī yuvāmime3 'bhi stomā anūṣata\npibataṃ śambhuvā sutam","de":"Indra und Agni, euch beiden haben diese Preislieder zugejubelt; trinkt, ihr Heilbringenden, den gepressten [Soma]."},{"n":992,"sa":"yā vāṃ santi puruspṛho niyuto dāśuṣe narā\nindrāgnī tābhirā gatam","de":"Mit welchen vielbegehrten Gespannen ihr, ihr Männer, dem Spender [Opferer] zugewandt seid, Indra und Agni, mit denen kommt her."},{"n":993,"sa":"tābhirā gacchataṃ naropedaṃ savanaṃ sutam\nindrāgnī somapītaye","de":"Mit diesen kommt her, ihr Männer, zu dieser gepressten Pressung hin, Indra und Agni, zum Soma-Trinken."}]},{"num":116,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 11","n_from":994,"n_to":996,"title_de":"Soma Pavamāna: Gaben für uns","note":"","units":[{"n":994,"sa":"arṣā soma dyumattamo 'bhi droṇāni roruvat\nsīdanyonau yoneṣvā","de":"Ström, Soma, [du] Leuchtendster, brüllend zu den Holzgefäßen hin; sitze in den Schoß, in [jeden] Schoß."},{"n":995,"sa":"apsā indrāya vāyave varuṇāya marudbhyaḥ\nsomā arṣantu viṣṇave","de":"Die Wasser-Schaffenden [Somas] sollen zu Indra, zu Vāyu, zu Varuṇa, zu den Maruts [und] zu Viṣṇu strömen. [Anm.: „apsā“ unsicher, evtl. „Wasserwerke“ o. ä.]"},{"n":996,"sa":"iṣaṃ tokāya no dadhadasmabhyaṃ soma viśvataḥ\nā pavasva sahasriṇam","de":"Nahrung für unsere Nachkommen verleihend, für uns, Soma, aus allen Richtungen klär dich als tausendfache [Gabe]."}]},{"num":117,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 12","n_from":997,"n_to":998,"title_de":"Soma: Presser und Ströme","note":"","units":[{"n":997,"sa":"soma u ṣvāṇaḥ sotṛbhiradhi ṣṇubhiravīnām\naśvayeva haritā yāti dhārayā mandrayā yāti dhārayā","de":"Soma, von den Pressern auf den Rücken des Schafhaar-Siebs [gepresst], geht wie mit Stute[n]falben in einem berauschenden Strom, geht in einem berauschenden Strom. [Anm.: Wortlaut unsicher.]"},{"n":998,"sa":"anūpe gomāngobhirakṣāḥ somo dugdhābhirakṣāḥ\nsamudraṃ na saṃvaraṇānyagmanmandī madāya tośate","de":"Im Moorland [?] hast du dich, [reich] an Rindern, mit Rindern umgeben, Soma, mit den Gemolkenen [Milchen] umgeben; wie in das Meer sind die Umhüllungen [Gefäße?] gegangen; der Berauschende eilt zum Rausch. [Anm.: Wortlaut schwierig, Textzustand fraglich.]"}]},{"num":118,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 13","n_from":999,"n_to":1001,"title_de":"Soma Pavamāna: himmlische und irdische Güter","note":"","units":[{"n":999,"sa":"yatsoma citramukthyaṃ divyaṃ pārthivaṃ vasu\ntannaḥ punāna ā bhara","de":"Was, Soma, an Wunderbarem, Preiswürdigem, Himmlischem [und] Irdischem Gut [es gibt]: das bring uns, dich läuternd, her."},{"n":1000,"sa":"vṛṣā punāna āyuṃṣi stanayannadhi barhiṣi\nhariḥ sanyonimāsadaḥ","de":"Der Stier, der sich läutert, die Lebenszeiten [Leben] donnernd über dem Barhis, der Falbe, setzte sich in den eigenen Schoß."},{"n":1001,"sa":"yuvaṃ hi sthaḥ svaḥpatī indraśca soma gopatī\nīśānā pipyataṃ dhiyaḥ","de":"Ihr beide, [du] und [Indra], seid ja Herren des Lichts [svaḥ], Indra und du, Soma, [seid] Rinderherren; als Herrschende fördert [unsere] Gedanken."}]},{"num":119,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 14","n_from":1002,"n_to":1004,"title_de":"Indra: Sieger, Helfer, Reichtumsspender","note":"","units":[{"n":1002,"sa":"indro madāya vāvṛdhe śavase vṛtrahā nṛbhiḥ\ntaminmahatsvājiṣūtimarbhe havāmahe sa vājeṣu pra no 'viṣat","de":"Indra ist zum Rausch, zur Kraft erstarkt, der Vṛtra-Töter, mit den Männern; ihn rufen wir in großen Schlachten [wie] in kleinen um Hilfe, er soll uns in den Kämpfen fördern."},{"n":1003,"sa":"asi hi vīra senyo 'si bhūri parādadiḥ\nasi dabhrasya cidvṛdho yajamānāya śikṣasi sunvate bhūri te vasu","de":"Denn du bist, Held, Heerführer; du bist einer, der viel [Beute] weggibt; du bist auch Mehrer des Kleinen; dem Opferer, dem Pressenden gewährst du; viel ist dein Gut."},{"n":1004,"sa":"yadudīrata ājayo dhṛṣṇave dhīyate dhanām\nyuṅkṣvā madacyutā harī kaṃ hanaḥ kaṃ vasau dadho 'smāṃ indra vasau dadhaḥ","de":"Wenn die Kämpfe sich erheben, wird dem Kühnen Beute zugedacht; spann die rauschgeborenen [wörtlich: rauschabgetropften] Falben an; wen [willst du] erschlagen, wen im Reichtum einsetzen? Uns, Indra, setze im Reichtum ein! [Anm.: „madacyutā“ mit „rauschtropfend“ unsicher.]"}]},{"num":120,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 15","n_from":1005,"n_to":1007,"title_de":"Indra und die Kühe: Rausch und Eigenherrschaft","note":"Refrain: „die guten [Kühe] nach [seiner] Eigenherrschaft“.","units":[{"n":1005,"sa":"svādoritthā viṣūvato madhvaḥ pibanti gauryaḥ\nyā indreṇa sayāvarīrvṛṣṇā madanti śobhase vasvīranu svarājyam","de":"Von des Süßen, wahrlich, des Honigs, trinken die Kühe [die Milch-Kühe] aus allen Richtungen [?]; die mit Indra gehen, [ihm,] dem Stier, freuen sich zur Zierde, die Guten [Reichen] nach [seiner] Eigenherrschaft."},{"n":1006,"sa":"tā asya pṛśanāyuvaḥ somaṃ śrīṇanti pṛśnayaḥ\npriyā indrasya dhenavo vajraṃ hinvanti sāyakaṃ vasvīranu svarājyam","de":"Diese [Kühe] mischen dessen Soma, [die] gescheckten [Kühe], die Fleckenliebenden [?]; die lieben Milchkühe Indras treiben den Blitzstrahl, den Wurfpfeil; die Guten nach [seiner] Eigenherrschaft."},{"n":1007,"sa":"tā asya namasā sahaḥ saparyanti pracetasaḥ\nvratānyasya saścire purūṇi pūrvacittaye vasvīranu svarājyam","de":"Diese ehren seine Kraft mit Ehrerbietung, die Weisen; seine Gebote haben sie befolgt, viele, um zuvor [es] zu erkennen [?]; die Guten nach [seiner] Eigenherrschaft."}]},{"num":121,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 16","n_from":1008,"n_to":1010,"title_de":"Soma: gepresst, gewaschen, gesüßt","note":"","units":[{"n":1008,"sa":"asāvyaṃśurmadāyāpsu dakṣo giriṣṭhāḥ\nśyeno na yonimāsadat","de":"Gepresst ist der Halm zum Rausch, im Wasser geschickt, auf dem Berg verweilend; wie ein Falke setzte er sich in seinen Schoß."},{"n":1009,"sa":"śubhramandho devavātamapsu dhautaṃ nṛbhiḥ sutam\nsvadanti gāvaḥ payobhiḥ","de":"Den glänzenden Trank, von den Göttern [wie vom Wind?] geweht [Anm.: devavāta, „von den Göttern gewünscht/gefördert“], im Wasser gewaschen, von den Männern gepresst: [ihn] versüßen die Kühe mit Milch."},{"n":1010,"sa":"ādīmaśvaṃ na hetāramaśūśubhannamṛtāya\nmadho rasaṃ sadhamāde","de":"Dann haben sie ihn, wie ein Ross [den] Treiber [?], zur Unsterblichkeit geschmückt, [nämlich] den Saft des Honigs im gemeinsamen Rausch [Sitz]. [Anm.: hetāram „Antreiber“; Deutung unsicher.]"}]},{"num":122,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 17","n_from":1011,"n_to":1012,"title_de":"Soma: Leuchten und Läutern","note":"","units":[{"n":1011,"sa":"abhi dyubhnaṃ bṛhadyaśa iṣaspate dīdihi deva devayum\nvi kośaṃ madhyamaṃ yuva","de":"Leuchte hin, Weitberühmter, Herr der Stärkung, [du] Gott, dem Götterfreund; schließ das mittlere Fass auf, du Junger."},{"n":1012,"sa":"ā vacyasva sudakṣa camvoḥ suto viśāṃ vahnirna viśpatiḥ\nvṛṣṭiṃ divaḥ pavasva rītimapo jinvangaviṣṭaye dhiyaḥ","de":"Nimm Platz, Geschickter, in den Schalen, gepresst, wie der Fahrer der Stämme, wie [ihr] Stammesherr; den Regen des Himmels, den Guss, klär [uns], die Wasser antreibend, die Gedanken zum Streben nach Rindern [?]."}]},{"num":123,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 18","n_from":1013,"n_to":1015,"title_de":"Soma und Trita: die drei Stätten","note":"","units":[{"n":1013,"sa":"prāṇā śiśurmahīnāṃ hinvannṛtasya dīdhitim\nviśvā pari priyā bhuvadadha dvitā","de":"Er hat als Erster [den Ruf] der Großen [Kühe/Wasser] erhoben, das Strahlen des Ṛta antreibend; alle lieben [Dinge] umgab er, dann zweifach."},{"n":1014,"sa":"upa tritasya pāṣyo3rabhakta yadguhā padam\nyajñasya sapta dhāmabhiradha priyam","de":"Zu Tritas Trank [Nähe] hin: er hat den verborgenen Standort verteilt; mit den Stätten [Formen] des Opfers, dann das Liebe. [Anm.: Wortlaut sehr knapp; Textzustand fraglich.]"},{"n":1015,"sa":"trīṇi tritasya dhārayā pṛṣṭeṣvairayadrayim\nmimīte asya yojanā vi sukratuḥ","de":"Drei [Stätten] des Trita [ließ] er mit dem Strom auf den Rücken [Höhen] den Reichtum aufsteigen; er misst dessen Wegstrecken ab, der Wohlgesinnte. [Anm.: Deutung unsicher.]"}]},{"num":124,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 19","n_from":1016,"n_to":1018,"title_de":"Soma Pavamāna: Ströme für Götter","note":"","units":[{"n":1016,"sa":"pavasva vājasātaye pavitre dhārayā sutaḥ\nindrāya soma viṣṇave devebhyo madhumattaraḥ","de":"Klär dich zum Gewinn von Kraft, im Sieb mit dem Strom gepresst, [du,] für Indra, Soma, für Viṣṇu, für die Götter, honigsüßer."},{"n":1017,"sa":"tvāṃ rihanti dhītayo hariṃ pavitre adruhaḥ\nvatsaṃ jātaṃ na mātaraḥ pavamāna vidharmaṇi","de":"Dich, den Falben, lecken im Sieb die Andachten, die nicht Trugvollen, wie Mütter das neugeborene Kalb, o Pavamāna, im Gefüge."},{"n":1018,"sa":"tvaṃ dyāṃ ca mahivrata pṛthivīṃ cāti jabhriṣe\nprati drāpimamuñcathāḥ pavamāna mahitvanā","de":"Du trägst, [du] mit großem Gesetz, Himmel und Erde über [alles] hinaus; das Gewand [Gepränge] hast du abgestreift, Pavamāna, durch [deine] Größe."}]},{"num":125,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 20","n_from":1019,"n_to":1021,"title_de":"Soma Pavamāna: Sieger, Tropfen, Feinde-Bezwinger","note":"","units":[{"n":1019,"sa":"indurvājī pavate gonyoghā indre somaḥ saha invanmadāya\nhanti rakṣo bādhate paryarātiṃ varivaskṛṇvanvṛjanasya rājā","de":"Der Tropfen, der Siegesreiche, klärt sich, der Rinderfluten-Schwelle [?], mit Indra zum Rausch [ihn] antreibend; er erschlägt den Unhold, verdrängt den Widersacher ringsum, Weite schaffend, König des Umkreises [?]."},{"n":1020,"sa":"adha dhārayā madhvā pṛcānastiro roma pavate adridugdhaḥ\nindurindrasya sakhyaṃ juṣāṇo devo devasya matsaro madāya","de":"Dann [ist er] mit dem süßen Strom sich mischend über das Haar [Schafhaar] hin, ein vom Stein gemolkener, klärt er sich; Indu, Indras Freundschaft genießend, [als] Gott des Gottes Berauschender, zum Rausch."},{"n":1021,"sa":"abhi vratāni pavate punāno devo devāntsvena rasena pṛñcan\nindurdharmāṇyṛtuthā vasāno daśa kṣipo avyata sāno avye","de":"Zu den Gesetzen hin klärt er sich, [selbst] sich läuternd, [der] Gott die Götter mit eigenem Saft [tränkend], Indu, die Satzungen zu ihrer Zeit anlegend; die zehn Finger [Kṣipas] haben ihn im Schafhaar[sieb] bedeckt [?]. [Anm.: Wortlaut schwierig; Textzustand fraglich.]"}]},{"num":126,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 21","n_from":1022,"n_to":1024,"title_de":"Agni-Lied: Entzündung und Bitte um Stärkung","note":"Refrain: „Bring den Sängern Stärkung.“","units":[{"n":1022,"sa":"ā te agna idhīmahi dyumantaṃ devājaram\nyuddha syā te panīyasī samiddīdayati dyavīṣaṃ stotṛbhya ā bhara","de":"Wir entzünden dich, Agni, den Leuchtenden, nicht alternden Gott; [dein] Ruhm [ist der] eifrigere [oder: der Kampf soll dir lobenswerter sein?]; entflammt leuchtet er zum Himmel; bring den Sängern Stärkung. [Anm.: „yuddha syā te panīyasī“ Wortlaut fraglich.]"},{"n":1023,"sa":"ā te agna ṛcā haviḥ śukrasya jyotiṣaspate\nsuścandra dasma viśpate havyavāṭtubhyaṃ hūyata iṣaṃ stotṛbhya ā bhara","de":"Dir, Agni, wird mit dem Vers die Opfergabe [dargebracht], du Herr des glänzenden Lichts, schön Strahlender, Wundertäter, Herr der Stämme; dir, dem Opfergabenfahrer, wird geopfert; bring den Sängern Stärkung."},{"n":1024,"sa":"obhe suścandra viśpate darvī śrīṇīṣa āsani\nuto na utpupūryā uktheṣu śavasaspata iṣaṃ stotṛbhya ā bhara","de":"Beide [Löffel] Schöngeglänzter, Herr der Stämme: du füllst die Schöpflöffel [Darvi] im Mund; und du sollst uns [Kraft] auffüllen in den Lobreden, Herr der Kraft; bring den Sängern Stärkung."}]},{"num":127,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 22","n_from":1025,"n_to":1027,"title_de":"Indra: Sāman-Gesang","note":"","units":[{"n":1025,"sa":"indrāya sāma gāyata viprāya bṛhate bṛhat\nbrahmākṛte vipaścite panasyave","de":"Für Indra singt das Sāman, für den Redegewandten, den Hohen [singt] das Bṛhat, für den Brahman-Schaffenden, den Weisen, den Preiswürdigen."},{"n":1026,"sa":"tvamindrābhibhūrasi tvaṃ sūryamarocayaḥ\nviśvakarmā viśvadevo mahāṃ asi","de":"Du, Indra, bist Bezwinger; du hast die Sonne leuchten lassen; Allschöpfer, Allgötterfreund, bist du, Großer."},{"n":1027,"sa":"vibhrājaṃ jyotiṣā tva3ragaccho rocanaṃ divaḥ\ndevāsta indra sakhyāya yemire","de":"Strahlend gingst du mit Licht zum Leuchtraum des Himmels; die Götter haben sich dir, Indra, zur Freundschaft [zugewandt und dich] gehalten."}]},{"num":128,"loc":"Prapāṭhaka III, Ardha 2, Gruppe 23","n_from":1028,"n_to":1030,"title_de":"Indra: Soma, Wagen, Falben","note":"","units":[{"n":1028,"sa":"asāvi soma indra te śaviṣṭha dhṛṣṇavā gahi\nā tvā pṛṇaktvindriyaṃ rajaḥ sūryo na raśmibhiḥ","de":"Gepresst ist der Soma, Indra, für dich; komm, Kraftvollster, [du] Kühner; die Indra-Kraft soll dich erfüllen [wie] die Sonne den Luftraum mit Strahlen."},{"n":1029,"sa":"ā tiṣṭha vṛtrahanrathaṃ yuktā te brahmaṇā harī\narvācīnaṃ su te mano grāvā kṛṇotu vagnunā","de":"Besteige, Vṛtra-Töter, den Wagen; angeschirrt sind deine Falben durch das Gebet; deinen Sinn soll der Presstein mit [seinem] Klang uns zuwenden."},{"n":1030,"sa":"indramiddharī vahato 'pratidhṛṣṭaśavasam\nṛṣīṇāṃ suṣṭutīrupa yajñaṃ ca mānuṣāṇām","de":"Indra tragen die beiden Falben, den Unbezwingbar-Kräftigen, zu den guten Lobliedern der Seher und zum Opfer der Menschen hin."}]},{"num":129,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 1","n_from":1031,"n_to":1033,"title_de":"Soma Pavamāna: der süße Saft, Licht der Weihehandlung","note":"","units":[{"n":1031,"sa":"jyotiryajñasya pavate madhu priyaṃ pitā devānāṃ janitā vibhūvasuḥ\ndadhāti ratnaṃ svadhayorapīcyaṃ madintamo matsara indriyo rasaḥ","de":"Das Licht der Weihehandlung klärt sich, der süße, liebe [Saft], der Vater der Götter, der Erzeuger, der Gutsbesitzer [Anm.: vibhūvasu, „reich an Gütern/Besitz verbreitend“]. Er legt den unter den beiden Trankspenden [?] verborgenen Schatz nieder [Anm.: svadhayoḥ, wörtlich „der beiden Svadhā“, Deutung unsicher], er, der berauschendste, berauschende, zu Indra gehörige Saft."},{"n":1032,"sa":"abhikrandankalaśaṃ vājyarṣati patirdivaḥ śatadhāro vicakṣaṇaḥ\nharirmitrasya sadaneṣu sīdati marmṛjāno 'vibhiḥ sindhubhirvṛṣā","de":"Brüllend strömt der Siegespreis zum Kelch, der Herr des Himmels, hundertströmig, weitblickend. Der Falbe setzt sich in die Sitze des Mitra, sich putzend mit den Schafhaaren-Seihen und den Strömen, der Stier."},{"n":1033,"sa":"agre sindhūnāṃ pavamāno arṣatyagre vāco agriyo goṣu gacchasi\nagre vājasya bhajase mahaddhanaṃ svāyudhaḥ sotṛbhiḥ soma sūyase","de":"Voran der Ströme, voran der Rede strömt der sich Klärende, als der Erste gehst du unter die Rinder. Voran erlangst du den großen Gewinn des Siegespreises; gut bewaffnet wirst du, Soma, von den Pressern gepresst."}]},{"num":130,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 2","n_from":1034,"n_to":1036,"title_de":"Soma-Ströme: klare Säfte fließen durch das Schafhaarsieb","note":"","units":[{"n":1034,"sa":"asṛkṣata pra vājino gavyā somāso aśvayā\nśukrāso vīrayāśavaḥ","de":"Ausgelassen wurden die Siegespreis-Somasäfte, nach Rindern, nach Rossen verlangend, die hellen, heldenhaft, rasch."},{"n":1035,"sa":"śumbhamāno ṛtāyubhirmṛjyamānā gabhastyoḥ\npavante vāre avyaye","de":"Sich schmückend mit den Wahrheit-Begehrenden, geputzt in den Händen, klären sie sich im Schafhaarsieb, dem Seihtuch."},{"n":1036,"sa":"te viśvā dāśuṣe vasu somā divyāni pārthivā\npavantāmāntarikṣyā","de":"Diese Somasäfte [sollen] dem Darbringer alle Güter, himmlische und irdische, klären; sie sollen sich klären, [auch] die des Luftraums."}]},{"num":131,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 3","n_from":1037,"n_to":1046,"title_de":"Soma Pavamāna: Ruf zu Indra, Ströme der Milch und des Meeres","note":"","units":[{"n":1037,"sa":"pavasva devavīrati pavitraṃ soma raṃhyā\nindramindo vṛṣā viśa","de":"Klär dich, göttersuchend, durch das Schafhaarsieb, Soma, eile; Indra, [du] Tropfen, [sei] der Stier, komm hin zu ihm."},{"n":1038,"sa":"ā vacyasva mahi psaro vṛṣendo dyumnavattamaḥ\nā yoniṃ dharṇasiḥ sadaḥ","de":"Ergieße dich, [du] gewaltiger Genuss, Stier, Tropfen, sehr glanzvoll, zum Schoß, der Tragende, zum Sitz."},{"n":1039,"sa":"adhukṣata priyaṃ madhu dhārā sutasya vedhasaḥ\napo vasiṣṭa sukratuḥ","de":"Sie haben den lieben Honig gemolken, die Ströme des gepressten [Somas], des Ordners; er hat sich in den Wassern niedergelassen, der Kraftvolle."},{"n":1040,"sa":"mahāntaṃ tvā mahīranvāpo arṣanti sindhavaḥ\nyadgobhirvāsayiṣyase","de":"Dich, den Großen, strömen die großen Wasser, die Ströme, entgegen, wenn du mit den Milchmischungen bekleidet werden wirst."},{"n":1041,"sa":"samudro apsu māmṛje viṣṭambho dharuṇo divaḥ\nsomaḥ pavitre asmayuḥ","de":"Das Meer ist in den Wassern gereinigt worden, die Stütze, der Halter des Himmels; Soma im Schafhaarsieb, uns zugewandt [?]."},{"n":1042,"sa":"acikradadvṛṣā harirmahānmitro na darśataḥ\nsaṃ sūryeṇa didyute","de":"Er hat gebrüllt, der Stier, der Falbe, der Große, wie Mitra anzuschauen; er leuchtet zusammen mit der Sonne."},{"n":1043,"sa":"girasta inda ojasā marmṛjyante apasyuvaḥ\nyābhirmadāya śumbhase","de":"Die Lieder für dich, Indu, werden mit Kraft geputzt von den Werkfreudigen, mit denen du zur Berauschung geschmückt wirst."},{"n":1044,"sa":"taṃ tvā madāya ghṛṣvaya u lokakṛtnumīmahe\ntava praśastaye mahe","de":"Dich, den Raum-Schaffenden, den Kühnen, bitten wir zur Berauschung, zu deinem großen Preis."},{"n":1045,"sa":"goṣā indo nṛṣā asyaśvasā vājasā uta\nātmā yajñasya pūrvyaḥ","de":"Rinder-, Männer-, Rosse-, Siegespreis-Gewinner bist du, Indu, und die Seele der Weihehandlung, der erste.","notes":"Textzustand: „asyaśvasā“ wohl für „asi aśvasā“."},{"n":1046,"sa":"asmabhyamindavindriyaṃ madhoḥ pavasva dhārayā\nparjanyo vṛṣṭimāṃ iva","de":"Uns, Indu, klär Indras Kraft mit dem Strom des Honigs, wie Parjanya, der Regenreiche."}]},{"num":132,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 4","n_from":1047,"n_to":1056,"title_de":"Soma Pavamāna: Kehrvers „so mach uns besser begütert“","note":"Refrain jeder Strophe: „Dann mach uns besser begütert“ (athā no vasyasas kṛdhi).","units":[{"n":1047,"sa":"sanā ca soma jeṣi ca pavamāna mahi śravaḥ\nathā no vasyasaskṛdhi","de":"Von jeher gewinnst du, Soma, [und] als Sichklärender [erlange] großen Ruhm; dann mach uns besser begütert."},{"n":1048,"sa":"sanā jyotiḥ sanā svā3rviśvā ca soma saubhagā\nathā no vasyasaskṛdhi","de":"Von jeher [gewinnst du] Licht, von jeher Sonnenhimmel und alle Glücksgüter, Soma; dann mach uns besser begütert."},{"n":1049,"sa":"sanā dakṣamuta kratumapa soma mṛdho jahi\nathā no vasyasaskṛdhi","de":"Von jeher [bring] Geschick und Willenskraft; schlag, Soma, die Bedränger weg; dann mach uns besser begütert."},{"n":1050,"sa":"pavītāraḥ punītana somamindrāya pātave\nathā no vasyasaskṛdhi","de":"Ihr Klärer, klärt den Soma für Indra zum Trinken; dann mach uns besser begütert."},{"n":1051,"sa":"tvaṃ sūrye na ā bhaja tava kratvā tavotibhiḥ\nathā no vasyasaskṛdhi","de":"Du, [lass] uns an der Sonne teilhaben, durch deine Willenskraft, durch deine Hilfen; dann mach uns besser begütert."},{"n":1052,"sa":"tava kratvā tavotibhirjyokpaśyema sūryam\nathā no vasyasaskṛdhi","de":"Durch deine Willenskraft, durch deine Hilfen mögen wir lange die Sonne sehen; dann mach uns besser begütert."},{"n":1053,"sa":"abhyarṣa svāyudha soma dvibarhasaṃ rayim\nathā no vasyasaskṛdhi","de":"Strömm hin, gut bewaffneter Soma, [mit] doppelt-kräftigem [?] Reichtum; dann mach uns besser begütert."},{"n":1054,"sa":"abhyā3rṣānapacyuto vājintsamatsu sāsahiḥ\nathā no vasyasaskṛdhi","de":"Strömm hin, unerschütterlich, Siegespreis-Reicher, in den Kämpfen der Überwältiger; dann mach uns besser begütert."},{"n":1055,"sa":"tvāṃ yajñairavīvṛdhanpavamāna vidharmaṇi\nathā no vasyasaskṛdhi","de":"Dich haben sie mit Weihehandlungen gestärkt, Sichklärender, in der Ordnung [?]; dann mach uns besser begütert."},{"n":1056,"sa":"rayiṃ naścitramaśvinamindo viśvāyumā bhara\nathā no vasyasaskṛdhi","de":"Bring uns Reichtum, glänzend, rossereich, ein Leben lang [währenden], Indu; dann mach uns besser begütert."}]},{"num":133,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 5","n_from":1057,"n_to":1060,"title_de":"Soma: der berauschende Strom eilt; Gaben an Dhvasra und Puruṣanti","note":"Kehrvers: „Er kommt hinüber, der Berauschende, er läuft“.","units":[{"n":1057,"sa":"taratsa mandī dhāvati dhārā sutasyāndhasaḥ\ntaratsa mandī dhāvati","de":"Er kommt hinüber, der Berauschende, er läuft, der Strom des gepressten Krautes; er kommt hinüber, der Berauschende, er läuft."},{"n":1058,"sa":"usrā veda vasūnāṃ marttasya devyavasaḥ\ntaratsa mandī dhāvati","de":"Die rötliche [Kuh/Morgenröte] kennt die Güter des Sterblichen mit göttlicher Hilfe; er kommt hinüber, der Berauschende, er läuft."},{"n":1059,"sa":"dhvasrayoḥ puruṣantyorā sahasrāṇi dadmahe\ntaratsa mandī dhāvati","de":"Von Dhvasra und Puruṣanti nehmen wir [hier] Tausende [an/geben wir Tausende] [?]; er kommt hinüber, der Berauschende, er läuft."},{"n":1060,"sa":"ā yayostriṃśataṃ tanā sahasrāṇi ca dadmahe\ntaratsa mandī dhāvati","de":"Von diesen beiden [nehmen wir] dreißig[hundert] [?] hier an, und Tausende geben wir; er kommt hinüber, der Berauschende, er läuft.","notes":"Textzustand fraglich; Dhvasra/Puruṣanti als Namen (Gabenspender)."}]},{"num":134,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 6","n_from":1061,"n_to":1063,"title_de":"Soma Pavamāna: Bitte um Rinder-Nahrung, Jamadagni","note":"","units":[{"n":1061,"sa":"ete somā asṛkṣata gṛṇānāḥ śavase mahe\nmadintamasya dhārayā","de":"Diese Somasäfte wurden losgelassen, gepriesen, zur großen Kraft, mit dem Strom des Berauschendsten."},{"n":1062,"sa":"abhi gavyāni vītaye nṛmṇā punāno arṣasi\nsanadvājaḥ pari srava","de":"Zu den Rinder-Gaben, zum Genuss, strömst du, [uns] Manneskraft klärend; Siegespreis-Gewinner, ström um [uns] herum."},{"n":1063,"sa":"uta no gomatīriṣo viśvā arṣa pariṣṭubhaḥ\ngṛṇāno jamadagninā","de":"Und für uns [strömt] rinderreiche Stärkungen, alle Umringer [?]; gepriesen von Jamadagni."}]},{"num":135,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 7","n_from":1064,"n_to":1066,"title_de":"Agni-Lob: Freundschaft mit Agni Jātavedas","note":"","units":[{"n":1064,"sa":"imaṃ stomamarhate jātavedase rathamiva saṃ mahemā manīṣayā\nbhadrā hi naḥ pramatirasya saṃsadyagne sakhye mā riṣāmā vayaṃ tava","de":"Diesen Preisgesang [fügen wir] dem Verehrungswürdigen, dem Jātavedas, wie einen Wagen zusammen, mit dem Sinnen. Segensreich ist uns seine Zuneigung in der Versammlung; Agni, in deiner Freundschaft mögen wir nicht Schaden nehmen, wir die Deinen."},{"n":1065,"sa":"bharāmedhmaṃ kṛṇavāmā havīṃṣi te citayantaḥ parvaṇāparvaṇā vayam\njīvātave prataraṃ sādhayā dhiyo 'gne sakhye ma riṣāmā vayaṃ tava","de":"Wir tragen Brennholz herbei, wir bereiten dir die Darbringungen, an jedem Gelenk [der Zeit] achtsam; für das Leben mach die Gedanken vollendet, weiter voran; Agni, in deiner Freundschaft mögen wir nicht Schaden nehmen, wir die Deinen."},{"n":1066,"sa":"śakema tvā samidhaṃ sādhayā dhiyastve devā haviradantyāhutam\ntvamādityāṃ ā vaha tānhyū3śmasyagne sakhye mā riṣāmā vayaṃ tava","de":"Wir möchten dich als Entzündeten [stärken]; bring die Gedanken zur Vollendung; in dir essen die Götter die dargebrachte Opfergabe; führe die Ādityas her, sie, die begehren; Agni, in deiner Freundschaft mögen wir nicht Schaden nehmen, wir die Deinen."}]},{"num":136,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 8","n_from":1067,"n_to":1069,"title_de":"Mitra, Varuṇa und Aryaman: Lobpreis bei Sonnenaufgang","note":"","units":[{"n":1067,"sa":"prati vāṃ sūra udite mitraṃ gṛṇīṣe varuṇam\naryamaṇaṃ riśādasam","de":"Bei Sonnenaufgang preise ich euch beide: Mitra [und] Varuṇa, [und] den Aryaman, den Feindvertilger."},{"n":1068,"sa":"rāyā hiraṇyayā matiriyamavṛkāya śavase\niyaṃ viprāmedhasātaye","de":"Mit goldenem Reichtum [kommt] dieses Denklied, zur Wolfsfreiheit [?], zur Kraft; dieses [ist] für den Weisen zur Gewinnung von Gaben [?]."},{"n":1069,"sa":"te syāma deva varuṇa te mitra sūribhiḥ saha\niṣaṃ svaśca dhīmahi","de":"Die Deinen möchten wir sein, göttlicher Varuṇa, die Deinen, Mitra, samt den Gönnern; Nahrung und Sonnenlicht mögen wir erlangen [Anm.: dhīmahi, „wir wollen uns schaffen/setzen“]."}]},{"num":137,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 9","n_from":1070,"n_to":1072,"title_de":"Indra: Bitte um begehrenswertes Gut","note":"Kehrvers: „Bring dann das begehrenswerte Gut“.","units":[{"n":1070,"sa":"bhindhi viśvā apa dviṣaḥ pari bādho jahī mṛdhaḥ\nvasu spārhaṃ tadā bhara","de":"Spalte alle Feindschaften weg, schlag ringsum die Bedränger nieder; bring dann das begehrenswerte Gut."},{"n":1071,"sa":"yasya te viśvamānuṣagbhūrerdattasya vedati\nvasu spārhaṃ tadā bhara","de":"Dessen [Gut], das von dir, dem Vielgebenden, als Gabe stets fortlaufend bekannt ist, bring dann das begehrenswerte Gut."},{"n":1072,"sa":"yadvīḍāvindra yatsthire yatparśāne parābhṛtam\nvasu spārhaṃ tadā bhara","de":"Was in der Festung, was im Festen, was im Schroffen [?] weggetragen ist, bring dann das begehrenswerte Gut."}]},{"num":138,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 10","n_from":1073,"n_to":1075,"title_de":"Indra und Agni: die beiden Priester der Weihehandlung","note":"Kehrvers: „Indra und Agni, achtet darauf“.","units":[{"n":1073,"sa":"yajñasya hi stha ṛtvijā sasnī vājeṣu karmasu\nindrāgnī tasya bodhatam","de":"Denn ihr seid die beiden Zeit-Priester der Weihehandlung, Gewinner in den Kämpfen, in den Werken; Indra und Agni, achtet darauf."},{"n":1074,"sa":"tośāsā rathayāvānā vṛtrahaṇāparājitā\nindrāgnī tasya bodhatam","de":"Ihr Erquickenden, wagenfahrend, Vṛtra-Töter, unbesiegt: Indra und Agni, achtet darauf."},{"n":1075,"sa":"idaṃ vāṃ madiraṃ madhvadhukṣannadribhirnaraḥ\nindrāgnī tasya bodhatam","de":"Diesen euren berauschenden Honig haben die Männer mit den Presssteinen gemolken; Indra und Agni, achtet darauf."}]},{"num":139,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 11","n_from":1076,"n_to":1078,"title_de":"Soma für Indra Marutvat; Mitra, Aryaman, Varuṇa und Maruts trinken","note":"","units":[{"n":1076,"sa":"indrāyendo marutvate pavasva madhumattamaḥ\narkasya yonimāsadam","de":"Für Indra, den Marutbegleiteten, klär dich, Tropfen, der honigreichste; setz dich zum Schoß des Preisliedes [Anm.: arka, „Strahl/Lied“]."},{"n":1077,"sa":"taṃ tvā viprā vacovidaḥ pariṣkṛṇvanti dharṇasim\nsaṃ tvā mṛjantyāyavaḥ","de":"Dich, den Tragenden, schmücken die redekundigen Weisen; dich putzen die Menschen zusammen."},{"n":1078,"sa":"rasaṃ te mitro aryamā pibantu varuṇaḥ kave\npavamānasya marutaḥ","de":"Deinen Saft sollen Mitra, Aryaman [und] Varuṇa trinken, Seher; [den Saft] des sich klärenden [Somas] die Maruts."}]},{"num":140,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 12","n_from":1079,"n_to":1080,"title_de":"Soma Pavamāna: Reichtum und Falbe im Sieb","note":"","units":[{"n":1079,"sa":"mṛjyamānaḥ suhastya samudre vācaminvasi\nrayiṃ piśaṅgaṃ bahulaṃ puruspṛhaṃ pavamānābhyarṣasi","de":"Geputzt, du Geschickthändiger, treibst du im Meer die Rede an; [bring] den rötlichen, reichlichen, vielbegehrten Reichtum, [als] Sichklärender strömst du hin."},{"n":1080,"sa":"punāno vare pavamano avyaye vṛṣo acikradadvane\ndevānāṃ soma pavamāna niṣkṛtaṃ gobhirañjāno arṣasi","de":"Sich klärend im Wollsieb, das Klärende, im Schafhaarigen, hat der Stier im Holz gebrüllt; du, Soma, Sichklärender, [gehst] zur Zubereitung der Götter, dich mit den Milchmischungen salbend, strömst du."}]},{"num":141,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 13","n_from":1081,"n_to":1083,"title_de":"Soma: die zehn Finger putzen ihn, zusammen mit Sonne, Indra und Vāyu","note":"","units":[{"n":1081,"sa":"etamu tyaṃ daśa kṣipo mṛjanti sindhumātaram\nsamādityebhirakhyata","de":"Diesen da, den Strommutter-Sohn, putzen die zehn Finger; er wurde zusammen mit den Ādityas gesehen [?]."},{"n":1082,"sa":"samindreṇota vāyunā suta eti pavitra ā\nsaṃ sūryasya raśmibhiḥ","de":"Zusammen mit Indra und Vāyu geht der Gepresste zum Schafhaarsieb, zusammen mit den Strahlen der Sonne."},{"n":1083,"sa":"sa no bhagāya vāyave pūṣṇe pavasva madhumān\ncārurmitre varuṇe ca","de":"Er, honigreich, klär dich für uns, für Bhaga, für Vāyu, für Pūṣan, lieblich für Mitra und Varuṇa."}]},{"num":142,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 14","n_from":1084,"n_to":1086,"title_de":"Indra: Bitte um Reichtümer; du öffnest die Achse","note":"","units":[{"n":1084,"sa":"revatīrnaḥ sadhamāda indre santu tuvivājāḥ\nkṣumanto yābhirmadema","de":"Die Reichtümer sollen für uns bei Indra, im Gemeinschaftsmahl, kraftvoll sein, mit denen wir, wohlbehalten, uns berauschen mögen."},{"n":1085,"sa":"ā gha tvāvāṃ tmanā yuktaḥ stotṛbhyo dhṛṣṇavīyānaḥ\nṛṇorakṣaṃ na cakryoḥ","de":"Ja, dir Ebenbürtigen, von selbst angespannt, dem Preissängern gegenüber Kühnen: du setzt die Achse in Gang wie [zwischen] zwei Rädern."},{"n":1086,"sa":"ā yadduvaḥ śatakratavā kāmaṃ jaritR^īṇām\nṛṇorakṣaṃ na śacībhiḥ","de":"Wenn du, Hundertwirker, den Wunsch der Sänger [erfüllst], setzt du die Achse in Gang, wie durch [deine] Kräfte.","notes":"Textzustand: „jaritR^īṇām“ vermutlich Verderbnis für jaritṝṇām."}]},{"num":143,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 15","n_from":1087,"n_to":1089,"title_de":"Indra: Anruf beim Pressen und Bitte um Gunst","note":"","units":[{"n":1087,"sa":"surūpakṛtnumūtaye sudughāmiva goduhe\njuhūmasi dyavidyavi","de":"Den schönformenden zur Hilfe, wie eine gute Melkkuh für den Kuhmelker, rufen wir an, Tag für Tag."},{"n":1088,"sa":"upa naḥ savanā gahi somasya somapāḥ piba\ngodā idrevato madaḥ","de":"Komm zu unseren Pressungen; Soma-Trinker, trink vom Soma; der Rausch [ist] Gaben schenkend, Reichtum gebend.","notes":"Textzustand: „godā idrevato“ wohl für godā id revato."},{"n":1089,"sa":"athā te antamānāṃ vidyāma sumatīnām\nmā no ati khya ā gahi","de":"Dann möchten wir von dir, dem Nächsten, die Gnaden kennenlernen; sieh nicht über uns hinweg, komm her."}]},{"num":144,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 16","n_from":1090,"n_to":1092,"title_de":"Indra: Herrscher der Menschen; „die göttliche Mutter gebar den Segensreichen“","note":"Kehrvers: „Die göttliche Gebärerin gebar, die segensreiche Gebärerin gebar“.","units":[{"n":1090,"sa":"ubhe yadindra rodasī āpaprāthoṣā iva\nmahāntaṃ tvā mahīnāṃ samrājaṃ carṣaṇīnām\ndevī janitryajījanadbhadrā janitryajījanat","
