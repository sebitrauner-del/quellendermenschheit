 kommen die göttlichen Frauen; er hat das weiße Haarsieb überschritten; wie ein Gewand, gewaschen, hat sich Soma ringsum gehüllt [?].","notes":"Wortlaut unsicher [?]"}]},{"num":221,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 10","n_from":1373,"n_to":1375,"title_de":"Agni: Aus den Reibhölzern erzeugt","note":"","units":[{"n":1373,"sa":"agniṃ naro dīdhitibhiraraṇyorhastacyutaṃ janayata praśastam\ndūredṛśaṃ gṛhapatimathavyum","de":"Agni, ihr Männer, erzeugt mit Fingergriffen aus den beiden Reibhölzern, den aus der Hand Entspringenden, den Gepriesenen, den weithin Sichtbaren, den Hausherrn, den ...","notes":"Ende „athavyum“ unklar [Anm.: Textzustand fraglich]"},{"n":1374,"sa":"tamagnimaste vasavo nyṛṇvantsupraticakṣamavase kutaścit\ndakṣāyyo yo dama āsa nityaḥ","de":"Diesen Agni haben die Vasus zum Schutz von irgendwoher am Sitz [?] kräftig gemacht, den gut Anzuschauenden, der im Haus der Tüchtige, der ständige war.","notes":"Wortlaut unsicher [?]"},{"n":1375,"sa":"preddho agne dīdihi puro no 'jasrayā sūrmyā yaviṣṭha\ntvāṃ śaśvanta upa yanti vājāḥ","de":"Entflammt, Agni, leuchte vor uns her mit unversiegendem Strahl [?], jüngster; zu dir kommen dauernd Gaben."}]},{"num":222,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 11","n_from":1376,"n_to":1378,"title_de":"Rätselverse: Die bunte Kuh und die Rede","note":"Rätselhaftes Kosmos-Hymnenstück (Sūrya/Vāc); Deutung offen.","units":[{"n":1376,"sa":"āyaṃ gauḥ pṛśnirakramīdasadanmātaraṃ puraḥ\npitaraṃ ca prayantsvaḥ","de":"Diese bunte Kuh ist gekommen; sie hat sich vor der Mutter niedergelassen und geht zum Vater hin, zum Himmel."},{"n":1377,"sa":"antaścarati rocanāsya prāṇādapānatī\nvyakhyanmahiṣo divam","de":"Ihr Glanz bewegt sich innen, vom Ausatmen zum Einatmen; der Büffel hat den Himmel überschaut."},{"n":1378,"sa":"triṃśaddhāma vi rājati vākpataṅgāya dhīyate\nprati vastoraha dyubhiḥ","de":"Dreißig Stätten leuchtet [sie], die Rede wird dem Vogel [Sonne?] zugewiesen; Tag um Tag, Morgen um Morgen.","notes":"„pataṅga“ = Vogel/Sonne [?]"}]},{"num":223,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 1","n_from":1379,"n_to":1382,"title_de":"Agni: Ein Spruch für den fernen und nahen Hörer","note":"","units":[{"n":1379,"sa":"upaprayanto adhvaraṃ mantraṃ vocemāgnaye\nāre asme ca śṛṇvate","de":"Zur Weihehandlung hin gehend wollen wir dem Agni einen Spruch sagen, dem auch fern von uns Hörenden."},{"n":1380,"sa":"yaḥ snīhitīṣu pūrvyaḥ saṃjagmānāsu kṛṣṭiṣu\narakṣaddāśuṣe gayam","de":"Der unter den sich ausbreitenden, zusammenkommenden Stämmen der Erste war, hat dem Spender das Haus [den Besitz] bewahrt."},{"n":1381,"sa":"sa no vedo amātyamagnī rakṣatu śantamaḥ\nutāsmānpātvaṃhasaḥ","de":"Er soll uns das Gut, das im Haus gehört [?], hüten, Agni, der Glückbringendste, und auch uns vor Bedrängnis beschützen.","notes":"„amātyam“ unsicher"},{"n":1382,"sa":"uta bruvantu jantava udagnirvṛtrahājani\ndhanañjayo raṇeraṇe","de":"Auch sollen die Leute sagen: Agni, der Vṛtra-Töter, ist geboren, der Beute-Gewinner in Kampf um Kampf."}]},{"num":224,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 2","n_from":1383,"n_to":1385,"title_de":"Agni: Die Rosse und die Götter","note":"","units":[{"n":1383,"sa":"agne yuṅkṣvā hi ye tavāśvāso deva sādhavaḥ\naraṃ vahantyāśavaḥ","de":"Agni, spanne an, was deine Rosse sind, göttlicher, die tüchtigen; die schnellen fahren [uns] genug."},{"n":1384,"sa":"acchā no yāhyā vahābhi prayāṃsi vītaye\nā devāntsomapītaye","de":"Komm zu uns hin, fahre die Labungen herbei zum Genuss; bringe die Götter zum Somatrunk."},{"n":1385,"sa":"udagne bhārata dyumadajasreṇa davidyutat\nśocā vi bhāhyajara","de":"Erhebe dich, Agni, Bhārata, leuchtend, mit unversiegendem [Glanz] hell blitzend; strahle, leuchte, du Nichtalternder."}]},{"num":225,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 3","n_from":1386,"n_to":1388,"title_de":"Soma: Der Falbe und die Schmähung des Kargen","note":"","units":[{"n":1386,"sa":"pra sunvānāyāndhaso martto na vaṣṭa tadvacaḥ\napa śvānamarādhasaṃ hatā makhaṃ na bhṛgavaḥ","de":"Für den Somapresser [begehre] der Sterbliche nicht den Trank [?]; jenen Spruch nicht. Schlagt den Hund, den Kargen, fort, wie die Bhṛgus das Opfer [?] [zerschlugen].","notes":"Wortlaut in Pāda a–b unklar [Anm.: Textzustand fraglich]"},{"n":1387,"sa":"ā jāmiratke avyata bhuje na putra oṇyoḥ\nsarajjāro na yoṣaṇāṃ varo na yonimāsadam","de":"Die Schwester [?] hat sich in der Umarmung [?] erwählt wie ein Sohn den Schoß; wie ein Buhle läuft er zu den Frauen, wie ein Freier will ich mich in den Schoß setzen [?].","notes":"Wortlaut sehr unsicher [?]"},{"n":1388,"sa":"sa vīro dakṣasādhano vi yastastambha rodasī\nhariḥ pavitre avyata vedhā na yonimāsadam","de":"Er, der Held, der Tüchtigkeit Vollbringer, der beide Welten stützte, der Falbe, hat sich im Sieb erwählt [?], der Ordner; er hat sich wie in den Schoß gesetzt."}]},{"num":226,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 4","n_from":1389,"n_to":1390,"title_de":"Indra: Ohne Bruder und Verwandten, Freund im Kampf","note":"","units":[{"n":1389,"sa":"abhrātṛvyo anā tvamanāpirindra januṣā sanādasi\nyudhedāpitvamicchase","de":"Du bist ohne Feind-Bruder [?], ohne Verwandte von Geburt aus, seit je; du willst im Kampf [erst] Verwandtschaft.","notes":"„abhrātṛvya“: ohne Nebenbuhler [?]"},{"n":1390,"sa":"na kī revantaṃ sakhyāya vindase pīyanti te surāśvaḥ\nyadā kṛṇoṣi nadanuṃ samūhasyāditpiteva hūyase","de":"Keinen Reichen findest du zur Freundschaft; deine Rosse [Brannt-]Weintrinker trinken; wenn du das Getöse [?] machst, dann wirst du wie ein Vater angerufen.","notes":"Text fraglich [?]"}]},{"num":227,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 5","n_from":1391,"n_to":1393,"title_de":"Indra: Die Falben mit Haaren zum Somatrunk","note":"","units":[{"n":1391,"sa":"ā tvā sahasramā śataṃ yuktā rathe hiraṇyaye\nbrahmayujo haraya indra keśino vahantu somapītaye","de":"Tausend, hundert [Rosse], am goldenen Wagen angespannt, sollen dich, Indra, herfahren, die von Brahman gespannten, langmähnigen Falben, zum Somatrunk."},{"n":1392,"sa":"ā tvā rathe hiraṇyaye harī mayūraśepyā\nśitipṛṣṭhā vahatāṃ madhvo andhaso vivakṣaṇasya pītaye","de":"Zu dir sollen die beiden Falben am goldenen Wagen, mit Pfauenfedern-artigem [Schwanz] [?], mit hellem Rücken, dich herfahren, zum Trinken des honigen Trankes, des Kräftigen.","notes":"Wortlaut „mayūraśepyā“ unsicher [?]"},{"n":1393,"sa":"pibā tvā3sya girvaṇaḥ sutasya pūrvapā iva\npariṣkṛtasya rasina iyamāsutiścārurmadāya patyate","de":"Trinke von diesem gepressten [Soma], Lobliebender, wie der frühere Trinker; dieses Pressen, das schöne, wird für den Rausch des Saftreichen, des Bereiteten, geleitet."}]},{"num":228,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 6","n_from":1394,"n_to":1395,"title_de":"Soma: Für die Pressung, wasserspringend","note":"","units":[{"n":1394,"sa":"ā sotā pari ṣiñcatāśvaṃ na stomamapturaṃ rajasturam\nvanaprakṣamudaprutam","de":"Kommt, Presser, gießt ringsum aus, wie ein Ross, das Lob, den schnellen, den Raum durcheilenden, den im Holz [Kelch] wachsenden, wasserspringenden."},{"n":1395,"sa":"sahasradhāraṃ vṛṣabhaṃ payoduhaṃ priyaṃ devāya janmane\nṛtena ya ṛtajāto vivāvṛdhe rājā deva ṛtaṃ bṛhat","de":"Den tausendströmigen Stier, den Milchmelker, den Lieben, für die göttliche Geburt; der, durch die Wahrheit gezeugt, in der Wahrheit wuchs, der König, der Gott, das Große, die Wahrheit.","notes":"Schluss „ṛtaṃ bṛhat“ evtl. Apposition [?]"}]},{"num":229,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 7","n_from":1396,"n_to":1398,"title_de":"Agni: Vṛtra-Töter, entflammt","note":"","units":[{"n":1396,"sa":"agnirvṛtrāṇi jaṅghanaddraviṇasyurvipanyayā\nsamiddhaḥ śukra āhutaḥ","de":"Agni, der die Vṛtras erschlägt, Güter erstrebend, mit Lobpreis, entzündet, hell, mit Guss versehen."},{"n":1397,"sa":"garbhe mātuḥ pituṣpitā vididyutāno akṣare\nsīdannṛtasya yonimā","de":"Im Schoß der Mutter, Vater des Vaters, in der unvergänglichen [Wohnstatt] leuchtend, setzt er sich auf den Schoß der Wahrheit."},{"n":1398,"sa":"brahma prajāvadā bhara jātavedo vicarṣaṇe\nagne yaddīdayaddivi","de":"Bring Gebet, kinderreiches, herbei, Jātavedas, Allsehender; Agni, [zu dem], was am Himmel leuchtete.","notes":"Bezug in Pāda c unsicher [?]"}]},{"num":230,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 8","n_from":1399,"n_to":1401,"title_de":"Soma: Geläutert, ein Kleid tragend","note":"","units":[{"n":1399,"sa":"asya preṣā hemanā pūyamāno devo devebhiḥ samapṛkta rasam\nsutaḥ pavitraṃ paryeti rebhanmiteva sadma paśumanti hotā","de":"Auf seinen Antrieb hin hat der geläuterte Gott mit den Göttern den Saft vermischt; gepresst geht er zum Sieb hin, brüllend, wie der Rufer zu den mit Vieh versehenen Wohnungen [?].","notes":"Wortlaut in d unsicher [?]"},{"n":1400,"sa":"bhadrā vastrā samanyā ' '3 vasāno mahānkavirnivacanāni śaṃsan\nā vacyasva camvoḥ pūyamāno vicakṣaṇo jāgṛvirdevavītau","de":"Schöne Gewänder, [gleich?] getragen [?], anlegend, der große Seher, Sprüche sprechend; strömle in die beiden Schalen, geläutert, allsehend, wach bei der Götter-Ladung.","notes":"Textzustand fraglich (Sāman-Notation mit Pluti)"},{"n":1401,"sa":"samu priyo mṛjyate sāno avye yaśastaro yaśasāṃ kṣaito asme\nabhi svara dhanvā pūyamāno yūyaṃ pāta svastibhiḥ sadā naḥ","de":"Er, der Liebe, wird im Schafwollsieb an der Höhe gereinigt, der Ruhmreichste der Ruhmvollen, in uns wohnend; brülle, geläuterter Tropfen; ihr aber schützt uns stets mit Heilsmitteln."}]},{"num":231,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 9","n_from":1402,"n_to":1404,"title_de":"Indra: Der Reine mit reinen Liedern","note":"","units":[{"n":1402,"sa":"eto nvindraṃ stavāma śuddhaṃ śuddhena sāmnā\nśuddhairukthairvāvṛdhvāṃsaṃ śuddhairāśīrvānmamattu","de":"Auf, nun wollen wir Indra preisen, den Reinen, mit reinem Sāman; den mit reinen Sprüchen Gewachsenen möge der Segensmächtige [Soma?] berauschen [?].","notes":"Subjekt von „mamattu“ unsicher"},{"n":1403,"sa":"indra śuddho na ā gahi śuddhaḥ śuddhābhirūtibhiḥ\nśuddho rayiṃ ni dhāraya śuddho mamaddhi somya","de":"Indra, der Reine, komm zu uns, rein mit reinen Hilfen; rein halte Reichtum bereit, rein erfreue dich, Somatrinker."},{"n":1404,"sa":"indra śuddho hi no rayiṃ śuddho ratnāni dāśuṣe\nśuddho vṛtrāṇi jighnase śuddho vājaṃ siṣāsasi","de":"Indra, rein bist du uns [der Geber] des Reichtums, rein der Schätze für den Spender; rein erschlägst du die Vṛtras, rein erstrebst du Kraftgewinn."}]},{"num":232,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 10","n_from":1405,"n_to":1407,"title_de":"Agni: Preislied, Rufer und Weihehandlung","note":"","units":[{"n":1405,"sa":"agne stomaṃ manāmahe sidhramadya divispṛśaḥ\ndevasya draviṇasyavaḥ","de":"Agni, ein Preislied sinnen wir heute, das zielgerichtete, das den Himmel berührt, dem Gott, Gut erstrebend."},{"n":1406,"sa":"agnirjuṣata no giro hotā yo mānuṣeṣvā\nsa yakṣaddaivyaṃ janam","de":"Agni soll unsere Lieder gern haben, der Rufer, der unter den Menschen ist; er soll die göttliche Schar verehren."},{"n":1407,"sa":"tvamagne saprathā asi juṣṭo hotā vareṇyaḥ\ntvayā yajñaṃ vi tanvate","de":"Du, Agni, bist mit weitem Umfang, gern gesehen, Rufer, der Wählbare; durch dich breiten sie die Weihehandlung aus."}]},{"num":233,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 11","n_from":1408,"n_to":1410,"title_de":"Soma Pavamāna: Der Presssaft brüllt dem Gedankenvers entgegen","note":"","units":[{"n":1408,"sa":"abhi tripṛṣṭhaṃ vṛṣaṇaṃ vayodhāmāṅgoṣiṇamavāvaśaṃta vāṇīḥ\nvanā vasāno varuṇo na sindhūrvi ratnadhā dayate vāryāṇi","de":"Auf den dreirückigen [Anm.: tripṛṣṭha, „mit drei Rücken/Oberflächen“; Beiname des Soma] Stier, den Kraftspender, der Zuruf ‚Aṅgoṣin‘ [?] stimmten die Stimmen an; die Wasser wie Wälder als Gewand tragend, gleich Varuṇa, verteilt er wie ein Schatzverleiher die begehrenswerten Güter."},{"n":1409,"sa":"śūragrāmaḥ sarvavīraḥ sahāvānjetā pavasva sanitā dhanāni\ntigmāyudhaḥ kṣipradhanvā samatsvaṣāḍhaḥ sāhvānpṛtanāsu śatrūn","de":"Schar der Helden, allen Männern zugetan, siegreich und gewaltig, sei klärend fließend Gewinner der Güter; scharf an Waffen, schnell im Bogen, in den Kämpfen unbezwinglich, überwältigt er in den Schlachten die Feinde."},{"n":1410,"sa":"urugavyūtirabhayāni kṛṇvantsamīcīne ā pavasvā purandhī\napaḥ siṣāsannuṣasaḥ svā3rgāḥ saṃ cikrado maho asmabhyaṃ vājān","de":"Weiten Weideraum, Schutz vor Furcht schaffend, fließe klärend zur gemeinsamen [?] Fülle; die Wasser und die Morgenröten gewinnen wollend, die den Himmel erreichen, brülle, Großer, uns Kraftgüter zu."}]},{"num":234,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 12","n_from":1411,"n_to":1412,"title_de":"Indra-Lob: Herr der Kraft, Schutz und Wohlwollen","note":"","units":[{"n":1411,"sa":"tvamindra yaśā asyṛjīṣī śavasaspatiḥ\ntvaṃ vṛtrāṇi haṃsyapratīnyeka itpurvanuttaścarṣaṇīdhṛtiḥ","de":"Du, Indra, bist ruhmreich, siegreich [?], Herr der Stärke; du allein schlägst die Vṛtras, ohne Gegner, Vielen voran, der Träger der Menschenvölker [Anm.: carṣaṇīdhṛti]."},{"n":1412,"sa":"tamu tvā nūnamasura pracetasaṃ rādho bhāgamivemahe\nmahīva kṛttiḥ śaraṇā ta indra pra te sumnā no aśnavan","de":"Dich eben, weisen Herrn [Anm.: asura], den Einsichtigen, erbitten wir jetzt wie einen Anteil an der Gabe; wie ein weites Fell [?] ist dein Schutz, Indra; deine Gunstgaben mögen uns erreichen."}]},{"num":235,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 13","n_from":1413,"n_to":1414,"title_de":"Agni-Anruf: Bester Verehrer, Sohn der Wasser","note":"","units":[{"n":1413,"sa":"yajiṣṭhaṃ tvā vavṛmahe devaṃ devatrā hotāramamartyam\nasya yajñasya sukratum","de":"Dich, den besten Verehrer, wählen wir, den Himmlischen unter den Himmlischen, den unsterblichen Rufer, den Meister dieser Weihehandlung."},{"n":1414,"sa":"apāṃ napātaṃ subhagaṃ sudīditimagnimu śreṣṭhaśociṣam\nsa no mitrasya varuṇasya so apāmā sumnaṃ yakṣate divi","de":"Den Sohn der Wasser, den glücklichen, hell Leuchtenden, Agni, von bester Flamme – er möge uns Gunst von Mitra und Varuṇa und von den Wassern im Himmel zuteilen [Anm.: yakṣate, „verschafft/spendet“]."}]},{"num":236,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 14","n_from":1415,"n_to":1417,"title_de":"Agni: Beschützer im Kampf, Gewinner der Kraftgüter","note":"","units":[{"n":1415,"sa":"yamagne pṛtsu martyamavā vājeṣu yaṃ junāḥ\nsa yantā śaśvatīriṣaḥ","de":"Den Mann, Agni, den du in den Kämpfen schützt, den du in den Wettkämpfen antreibst – er wird Lenker beständiger Nahrung."},{"n":1416,"sa":"na kirasya sahantya paryetā kayasya cit\nvājo asti śravāyyaḥ","de":"Keiner kann ihn überwältigen [?], noch ihn von irgendeiner Seite umgehen; Kraft ist da, rühmenswert."},{"n":1417,"sa":"sa vājaṃ viśvacarṣaṇirarvadbhirastu tarutā\nviprebhirastu sanitā","de":"Er, der allen Menschen zugewandt, möge mit den Rennern die Kraft überwinden; mit den Sängern möge er Gewinner sein."}]},{"num":237,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 15","n_from":1418,"n_to":1420,"title_de":"Soma wird geklärt: Finger, Milch und Kufe","note":"","units":[{"n":1418,"sa":"sākamukṣo marjayanta svasāro daśa dhīrasya dhītayo dhanutrīḥ\nhariḥ paryadravajjāḥ sūryasya droṇaṃ nanakṣe atyo na vājī","de":"Gemeinsam schmückten den Stier [Anm.: ukṣan] die Schwestern, die zehn [Finger], des Weisen Gedanken, die Eilenden; der Falbe lief rings, von der Sonne geboren [?], zur Kufe; er erreicht sie wie ein Ross, der Renner."},{"n":1419,"sa":"saṃ mātṛbhirna śiśurvāvaśāno vṛṣā dadhanve puruvāro adbhiḥ\nmaryo na yoṣāmabhi niṣkṛtaṃ yantsaṃ gacchate kalaśa usriyābhiḥ","de":"Wie ein Kind, das mit den Müttern zusammenkommen will, wird der Stier von den Wassern gestärkt, vielbegehrt; wie ein Mann zur Geliebten geht er zum Bereiteten; der Kelch vereinigt sich mit den Kuhmilchen [Anm.: usriyā, „aus der Kuh, milchig“]."},{"n":1420,"sa":"uta pra pipya ūdharaghnyāyā indurdhārābhiḥ sacate sumedhāḥ\nmūrdhānaṃ gāvaḥ payasā camūṣvabhi śrīṇanti vasubhirna niktaiḥ","de":"Auch schwoll das Euter der nicht zu tötenden Kuh; der Tropfen, der Wohlweise, verbindet sich mit den Strömen; sein Haupt mischen die Kühe mit Milch in den Schalen, wie mit Schätzen, wie mit Geschmückten."}]},{"num":238,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 16","n_from":1421,"n_to":1422,"title_de":"Indra: Trink vom Soma, sei uns Freund","note":"","units":[{"n":1421,"sa":"pibā sutasya rasino matsvā na indra gomataḥ\nāpirno bodhi sadhamādye vṛdhe3 'smāṃ avantu te dhiyaḥ","de":"Trink vom gepressten, saftreichen, berausche dich, Indra, an uns, dem kuhreichen; sei unser Freund beim gemeinsamen Zechen zum Gedeihen; uns mögen deine Gedanken [?] beistehen."},{"n":1422,"sa":"bhūyāma te sumatau vājino vayaṃ mā na starabhimātaye\nasmāṃ citrābhiravatādabhiṣṭibhirā naḥ sumneṣu yāmaya","de":"Wir wollen in deiner Gunst sein, Kraftreicher; nicht möge man uns dem Feind hinstrecken; uns schütze mit deinen prächtigen Hilfen und führe uns zu deinen Wohltaten."}]},{"num":239,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 17","n_from":1423,"n_to":1425,"title_de":"Soma: Sieben Kühe, vier Welten, die Banner des Gottes","note":"","units":[{"n":1423,"sa":"trirasmai sapta dhenavo duduhrire satyāmāśiraṃ parame vyomani\ncatvāryanyā bhuvanāni nirṇije cārūṇi cakre yadṛtairavardhata","de":"Ihm melkten dreimal sieben Kühe die wahre Mischung im höchsten Himmelsraum; vier andere Welten schmückte er [?] zu lieblicher Gestalt, als er durch die Ordnungen wuchs."},{"n":1424,"sa":"sa bhakṣamāṇo amṛtasya cāruṇa ubhe dyāvā kāvyenā vi śaśrathe\ntejiṣṭhā apo maṃhanā pari vyata yadī devasya śravasā sado viduḥ","de":"Er, der Anteil am Unsterblichen nehmend, machte die beiden Welten durch seine Dichtkraft locker [?]; die schärfsten Wasser umhüllte er mit seiner Freigebigkeit, wenn sie durch des Gottes Ruhm den Sitz kennen."},{"n":1425,"sa":"te asya santu ketavo 'mṛtyavo 'dābhyāso januṣī ubhe anu\nyebhirnṛmṇā ca devyā ca punata ādidrājānaṃ mananā agṛbhṇata","de":"Das seien seine Banner, unsterblich, unbetrügbar, beiden Geburten [Anm.: Himmel und Erde] folgend, mit denen sie sich in männlicher Kraft und göttlich läutern; dann ergriffen die Denkenden den Herrscher."}]},{"num":240,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 18","n_from":1426,"n_to":1428,"title_de":"Soma Pavamāna: Fließe zu den Göttern hin","note":"","units":[{"n":1426,"sa":"abhi vāyuṃ vītyarṣā gṛṇāno3 'bhi mitrāvaruṇā pūyamānaḥ\nabhī naraṃ dhījavanaṃ ratheṣṭhāmabhīndraṃ vṛṣaṇaṃ vajrabāhum","de":"Fließe hin zu Vāyu bei der Labung, gepriesen, hin zu Mitra und Varuṇa, geläutert; hin zum Mann, dem gedankenschnellen, auf dem Wagen Stehenden, hin zu Indra, dem Stier, mit dem Blitz im Arm."},{"n":1427,"sa":"abhi vastrā suvasanānyarṣābhi dhenūḥ sudughāḥ pūyamānaḥ\nabhi candrā bharttave no hiraṇyābhyaśvānrathino deva soma","de":"Fließe hin zu schönen Gewändern, hin zu den milchreichen Kühen, geläutert; hin zu den leuchtenden [Gütern] zum Tragen für uns, hin zu Gold, zu Rossen und Wagen, göttlicher Soma."},{"n":1428,"sa":"abhī no arṣa divyā vasūnyabhi viśvā pārthivā pūyamānaḥ\nabhi yena draviṇamaśnavāmābhyārṣeyaṃ jamadagnivannaḥ","de":"Fließe uns zu himmlische Güter, fließe zu allen irdischen, geläutert; fließe zu dem Reichtum, den wir erlangen mögen, zu der Rṣi-Gabe [?] wie bei Jamadagni."}]},{"num":241,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 19","n_from":1429,"n_to":1431,"title_de":"Indra: Geburt zum Vṛtra-Schlag, Himmel und Erde","note":"","units":[{"n":1429,"sa":"yajjāyathā apūrvya maghavanvṛtrahatyāya\ntatpṛthivīmaprathayastadastabhnā uto divam","de":"Als du geboren wurdest, Unvergleichlicher, Gabenreicher, zum Vṛtra-Schlagen, da breitetest du die Erde aus, da stütztest du auch den Himmel."},{"n":1430,"sa":"tatte yajño ajāyata tadarka uta haskṛtiḥ\ntadviśvamabhibhūrasi yajjātaṃ yacca jantvam","de":"Daraus wurde dir die Weihehandlung geboren, daraus der Preisgesang, daraus das Jubelrufen; du bist Überwinder von allem, was geboren ist und was noch entsteht [Anm.: jantva, „Lebendiges/Zukünftiges“ ?]."},{"n":1431,"sa":"āmāsu pakvamairaya ā sūryaṃ rohayo divi\ngharmaṃ na sāmaṃ tapatā suvṛktibhirjuṣṭaṃ girvaṇase bṛhat","de":"In die rohen [Kühe] legtest du die Reife, ließest die Sonne im Himmel aufsteigen; wie der Glutkessel erwärmt sich das Sāman [?], dies hohe, von den Preisungen gern gehörte für den Lieder-Liebhaber."}]},{"num":242,"loc":"Prapāṭhaka VI, Ardha 2, Gruppe 20","n_from":1432,"n_to":1434,"title_de":"Indra: Berauschender Trank, Sieger und Bezwinger","note":"","units":[{"n":1432,"sa":"matsyapāyi te mahaḥ pātrasyeva harivo matsaro madaḥ\nvṛṣā te vṛṣṇa indurvājī sahasrasātamaḥ","de":"Wie aus einem Gefäß wurde deine große Berauschung getrunken [?], Falbenherr; der Rausch ist dein, der Tropfen des Stiers, der Stier, das Ross, tausendfach gewinnend."},{"n":1433,"sa":"ā naste gantu matsaro vṛṣā mado vareṇyaḥ\nsahāvāṃ indra sānasiḥ pṛtanaṣāḍamartyaḥ","de":"Zu uns komme der Rausch, der Stier, der Rauschtrank, der begehrenswerte, der gewaltige, Indra, der Gewinnende, Kämpfer im Schlachtgetümmel, unsterblich."},{"n":1434,"sa":"tvaṃ hi śūraḥ sanitā codayo manuṣo ratham\nsahāvāndasyumavratamoṣaḥ pātraṃ na śociṣā","de":"Denn du bist der Held, der Gewinner; du triebst den Wagen des Manu an; der gewaltige [Indra] verbrannte den gesetzlosen Dasyu [?] wie ein Gefäß mit der Flamme."}]},{"num":243,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 1","n_from":1435,"n_to":1439,"title_de":"Soma Pavamāna: Regen und Kraft, klär dich in Strömen","note":"","units":[{"n":1435,"sa":"pavasva vṛṣṭimā su no 'pāmūrmiṃ divaspari\nayakṣmā bṛhatīriṣaḥ","de":"Fließe klärend, Regen bringend, uns die Woge der Wasser vom Himmel her; ohne Krankheit, große Stärkungen [bringend]."},{"n":1436,"sa":"tayā pavasva dhārayā yayā gāva ihāgaman\njanyāsa upa no gṛham","de":"Mit dem Strom fließe, mit dem die Kühe hierher kamen, die Angehörigen [?] zu unserem Haus."},{"n":1437,"sa":"ghṛtaṃ pavasva dhārayā yajñeṣu devavītamaḥ\nasmabhyaṃ vṛṣṭimā pava","de":"Ghee-gleich fließe im Strom, du, bester Gotteslabender bei den Weihehandlungen; uns fließe Regen zu."},{"n":1438,"sa":"sa na ūrje vyā3vyayaṃ pavitraṃ dhāva dhārayā\ndevāsaḥ śṛṇavanhi kam","de":"Du, für uns zur Kraft, eile durch das Schaffell-Sieb [Anm.: vyavyaya, „Schafwoll-Sieb“; Wortlaut ‚vyā3vyayam‘ mit Pluti] im Strom; die Götter sollen es hören, ja wohl."},{"n":1439,"sa":"pavamāno asiṣyadadrakṣāṃsyapajaṅghanat\npratnavadrocayanrucaḥ","de":"Der Klärende strömte, die Rakṣas verjagend, uralter Art die Lichter erleuchtend."}]},{"num":244,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 2","n_from":1440,"n_to":1443,"title_de":"Indra-Soma: Bringt dem Durstigen den Trank","note":"","units":[{"n":1440,"sa":"pratyasmai pipīṣate viśvāni viduṣe bhara\naraṅgamāya jagmaye 'paścādadhvane naraḥ","de":"Für diesen Trinkbegierigen, den Allwissenden, bringt alles herbei, ihr Männer, den Unermüdlichen, den Kommenden, der keinen Weg zurückgeht [?]."},{"n":1441,"sa":"emenaṃ pratyetana somebhiḥ somapātamam\namatrebhirṛjīṣiṇamindraṃ sutebhirindubhiḥ","de":"Kommt herbei zu ihm mit Somas, dem besten Somatrinker, in Bechern, dem Kraftvollen [Anm.: ṛjīṣin], zu Indra mit den gepressten Tropfen."},{"n":1442,"sa":"yadī sutebhirindubhiḥ somebhiḥ pratibhūṣatha\nvedā viśvasya medhiro dhṛṣattantamideṣate","de":"Wenn ihr ihn mit gepressten Tropfen, mit Somas schmückt, so weiß der Weise alles; den Kühnen ersehnt jeder eben ihn [?]."},{"n":1443,"sa":"asmāasmā idandhaso 'dhvaryo pra bharā sutam\nkuvitsamasya jenyasya śardhato 'bhiśasteravasvarat","de":"Diesem, diesem bringe, Adhvaryu, den gepressten Trank des Saftes dar; wahrlich [?] hält er den Streitbaren, den Verwegenen [?], von der Schmähung ab.","notes":"Textzustand fraglich (asmāasmā, Kompositionszeichen)."}]},{"num":245,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 3","n_from":1444,"n_to":1449,"title_de":"Soma-Lob: Steine, Milch und Tropfen für Indra","note":"","units":[{"n":1444,"sa":"babhrave nu svatavase 'ruṇāya divispṛśe\nsomāya gāthamarcata","de":"Dem braunen, selbstkräftigen, rötlichen, den Himmel berührenden Soma singt ein Lied."},{"n":1445,"sa":"hastacyutebhiradribhiḥ sutaṃ somaṃ punītana\nmadhāvā dhāvatā madhu","de":"Mit den aus der Hand geschleuderten Presssteinen läutert den gepressten Soma; ihr Honigreichen, lauft, den Honig."},{"n":1446,"sa":"namasedupa sīdata dadhnedabhi śrīṇītana\nindumindre dadhātana","de":"Mit Verehrung setzt euch nieder, mit saurer Milch mischt [ihn]; den Tropfen legt in Indra."},{"n":1447,"sa":"amitrahā vicarṣaṇiḥ pavasva soma śaṃ gave\ndevebhyo anukāmakṛt","de":"Feindtöter, allen zugewandt, fließe, Soma, zum Wohl für die Kuh, den Göttern nach Wunsch handelnd."},{"n":1448,"sa":"indrāya soma pātave madāya pari ṣicyase\nmanaścinmanasaspatiḥ","de":"Für Indra, Soma, wirst du zum Trinken, zum Rausch gegossen, du, der Herr des Geistes, ja des Geistes."},{"n":1449,"sa":"pavamāna suvīryaṃ rayiṃ soma rirīhi naḥ\nindavindreṇa no yujā","de":"Klärend fließender Soma, lecke uns heldenreichen Reichtum zu; Tropfen, mit Indra als unserem Gefährten [?]."}]},{"num":246,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 4","n_from":1450,"n_to":1452,"title_de":"Indra und Sūrya: Der Ruhmreiche, Schlangentöter","note":"","units":[{"n":1450,"sa":"uddhedabhi śrutāmaghaṃ vṛṣamaṃ naryāpasam\nastārameṣi sūrya","de":"Fürwahr, zum berühmten Gabenreichen, dem männlichen, Männertaten Vollbringenden gehst du hin, der nie Rastende [?], Sūrya."},{"n":1451,"sa":"nava yo navatiṃ puro bibheda bāhvojasā\nahiṃ ca vṛtrahāvadhīt","de":"Der neunundneunzig Burgen mit der Kraft seines Armes zerbrach, und der Vṛtra-Töter erschlug den Drachen."},{"n":1452,"sa":"sa na indraḥ śivaḥ sakhāśvāvadgomadyavamat\nurudhāreva dohate","de":"Dieser Indra, gnädig und Freund, möge Rosse und Kühe und Gerste ausspeien [?]; wie eine breitströmende [Kuh] melkt man ihn [?]."}]},{"num":247,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 5","n_from":1453,"n_to":1455,"title_de":"Sūrya/Soma als das große Leuchtende","note":"Verse mit dem Anfang vibhrāj, „weithin leuchtend“ (Sūrya-Lob, Vibhrāj-Sāman).","units":[{"n":1453,"sa":"vibhrāḍ bṛhatpibatu somyaṃ madhvāyurdadhadyajñapatāvavihrutam\nvātajūto yo abhirakṣati tmanā prajāḥ piparti bahudhā vi rājati","de":"Der Weithinleuchtende, Große möge den Somatrank trinken, den Honigsüßen, Lebensdauer verleihend dem Herrn der Weihehandlung, unverletzt; windgetrieben, der von selbst schützt, nährt er die Geschöpfe und leuchtet vielfach."},{"n":1454,"sa":"vibhrāḍ bṛhatsubhṛtaṃ vājasātamaṃ dharmaṃ divo dharuṇe satyamarpitam\namitrahā vṛtrahā dasyuhantamaṃ jyotirjajñe asurahā sapatnahā","de":"Der Weithinleuchtende, Große, wohlgetragen, kraftgewinnend, die Stütze des Himmels an dessen Halt, als Wahrheit niedergelegt; als Feindtöter, Vṛtra-Töter, bester Dasyu-Töter wurde das Licht geboren, Asura-Töter, Nebenbuhler-Töter."},{"n":1455,"sa":"idaṃ śreṣṭhaṃ jyotiṣāṃ jyotiruttamaṃ viśvajiddhanajiducyate bṛhat\nviśvabhrāḍ bhrājo mahi sūryo dṛśa uru paprathe saha ojo acyutam","de":"Dies ist das beste der Lichter, das höchste Licht, es heißt allsiegend, reichtumgewinnend, groß; der Allleuchtende hat als Sūrya, um gesehen zu werden, die große Glanzfülle weit ausgebreitet, mit Kraft und Macht, unerschütterlich."}]},{"num":248,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 6","n_from":1456,"n_to":1457,"title_de":"Indra: Einsicht erbitten, Schutz vor Not","note":"","units":[{"n":1456,"sa":"indra kratuṃ na ā bhara pitā putrebhyo yathā\nśikṣā ṇo asminpuruhūta yāmani jīva jyotiraśīmahi","de":"Indra, bring uns Einsicht [Anm.: kratu, auch „Kraft/Plan“], wie ein Vater den Söhnen; lehre uns bei diesem Zug, Vielgerufener; möchten wir lebendiges Licht erlangen."},{"n":1457,"sa":"mā no ajñātā vṛjanā durādhyo3 māśivāso 'va kramuḥ\ntvayā vayaṃ pravataḥ śaśvatīrapo 'ti śūra tarāmasi","de":"Nicht sollen uns unbekannte Nöte, üble Gedanken, unheilvolle [Wesen] zu Fall bringen; mit dir wollen wir die ewigen Gewässer im Gefälle, o Held, überschreiten."}]},{"num":249,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 7","n_from":1458,"n_to":1459,"title_de":"Indra: Schutz Tag um Tag, Stärke der Arme","note":"","units":[{"n":1458,"sa":"adyādyā śvaḥśva indra trāsva pare ca naḥ\nviśvā ca no jaritR^īntsatpate ahā divā naktaṃ ca rakṣiṣaḥ","de":"Heute und heute, morgen und morgen, Indra, schütze uns, und auch in der Zukunft; und alle Tage, Herr des Guten, behüte unsere Sänger, bei Tag und bei Nacht."},{"n":1459,"sa":"prabhaṅgī śūro maghavā tuvīmaghaḥ sammiślo viryāya kam\nubhā te bāhū vṛṣaṇā śatakrato ni yā vajraṃ mimikṣatuḥ","de":"Der Brecher, Held, Gabenreicher, Reichgebender, ist gemischt zur Kraft, ja; deine beiden Arme, männlich, Hundertkräftiger, mischen den Blitzkeil, wenn sie ihn aufeinanderhalten [?].","notes":"Wortlaut viryāya, evtl. vīryāya."}]},{"num":250,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 8","n_from":1460,"n_to":1460,"title_de":"Sarasvat-Anruf: Söhne und Nachkommen erbitten","note":"","units":[{"n":1460,"sa":"janīyanto nvagravaḥ putrīyantaḥ sudānavaḥ\nsarasvantaṃ havāmahe","de":"Frauen suchend, die Vordersten, Söhne wünschend, freigebig, rufen wir Sarasvant an."}]},{"num":251,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 9","n_from":1461,"n_to":1461,"title_de":"Sarasvatī: Liebste unter den Lieben","note":"","units":[{"n":1461,"sa":"uta naḥ priyā priyāsu saptasvasā sujuṣṭā\nsarasvatī stomyā bhūt","de":"Auch uns wurde Sarasvatī die Liebste unter den Lieben, die Siebenschwesterige, Wohlgefällige, preisenswert."}]},{"num":252,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 10","n_from":1462,"n_to":1464,"title_de":"Savitṛ (Gāyatrī), Brahmaṇaspati, Agni","note":"Der erste Vers ist die berühmte Sāvitrī/Gāyatrī-Strophe.","units":[{"n":1462,"sa":"tatsaviturvareṇyaṃ bhargo devasya dhīmahi\ndhiyo yo naḥ pracodayāt","de":"Dieses erwünschte Leuchten des Gottes Savitṛ möchten wir sinnend aufnehmen, der unsere Gedanken anregen möge."},{"n":1463,"sa":"somānāṃ svaraṇaṃ kṛṇuhi brahmaṇaspate\nkakṣīvantaṃ ya auśijaḥ","de":"Mache den Somas ihren Klang, Herr des Gebets [Anm.: Brahmaṇaspati], [so wie du es tatest] für Kakṣīvant, den Sohn der Uśij.","notes":"Text elliptisch; Ergänzung in Klammern unsicher [?]."},{"n":1464,"sa":"agna āyūṃṣi pavase ā suvorjaṃ iṣaṃ ca naḥ\nāre bādhasva ducchunām","de":"Agni, du läuterst uns die Lebensdauer, bring uns Kraft und Nahrung zu; wehre ferne das Unheil ab."}]},{"num":253,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 11","n_from":1465,"n_to":1467,"title_de":"Mitra und Varuṇa [?]: Himmel und Erde als göttliches Paar","note":"","units":[{"n":1465,"sa":"tā naḥ śaktaṃ pārthivasya maho rāyo divyasya\nmahi vā kṣatraṃ deveṣu","de":"Ihr beiden, vermögt uns [das], vom Reichtum der Erde und dem großen des Himmels; groß ist eure Herrschaft unter den Göttern [?]."},{"n":1466,"sa":"ṛtamṛtena sapanteṣiraṃ dakṣamāśāte\nadruhā devau vardhete","de":"Durch die Ordnung die Ordnung [?] preisend, erlangen sie den Ansporn gebenden Willen [?]; ohne Trug wachsen die beiden Götter."},{"n":1467,"sa":"vṛṣṭidyāvā rītyāpeṣaspatī dānumatyāḥ\nbṛhantaṃ garttamāśāte","de":"Regnend, im Fließen [?], Herren der Stärkung, der Gabenreichen [?], erreichen sie die große Grube [?].","notes":"Textzustand und Bedeutung unsicher."}]},{"num":254,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 12","n_from":1468,"n_to":1470,"title_de":"Indra/Sonne: Das Roß wird angeschirrt","note":"","units":[{"n":1468,"sa":"yuñjanti bradhnamaruṣaṃ carantaṃ pari tasthuṣaḥ\nrocante rocanā divi","de":"Sie schirren den Braunen, Rötlichen an, der umherwandelt, rings von den Stehenden [umgeben]; die Lichtstätten leuchten im Himmel."},{"n":1469,"sa":"yuñjantyasya kāmyā harī vipakṣasā rathe\nśoṇā dhṛṣṇū nṛvāhasā","de":"Ihm schirren sie die lieben Falben an den Wagen, die Flügelbreiten, die rötlichen, kühnen, männerfahrenden."},{"n":1470,"sa":"ketuṃ kṛṇvannaketave peśo maryā apeśase\nsamuṣadbhirajāyathāḥ","de":"Ein Banner schaffend dem Formlosen [Anm.: aketu, „ohne Erkenntnis/Zeichen“], Gestalt, ihr Sterblichen, dem Gestaltlosen, wurdest du mit den Morgenröten [?] geboren [Anm.: Lesart usadbhiḥ, sam-uṣadbhiḥ nach Wortlaut].","notes":"Parallele zu RV 1.6.3."}]},{"num":255,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 13","n_from":1471,"n_to":1473,"title_de":"Soma für Indra: Der Preisgesang der Somas","note":"","units":[{"n":1471,"sa":"ayaṃ soma indra tubhyaṃ sunve tubhyaṃ pavate tvamasya pāhi\ntvaṃ ha yaṃ cakṛṣe tvaṃ vavṛṣa induṃ madāya yujyāya somam","de":"Dieser Soma, Indra, wird für dich gepresst, für dich fließt er klärend; trink von ihm; du hast ihn bereitet, du ihn gegossen, den Tropfen zum Rausch, zur Gefolgschaft, den Soma."},{"n":1472,"sa":"sa īṃ ratho na bhuriṣāḍayoji mahaḥ purūṇi sātaye vasūni\nādīṃ viśvā nahuṣyāṇi jātā svarṣātā vana ūrdhvā navanta","de":"Wie ein Wagen, der viele überwältigt, wurde er angeschirrt, um viele Güter des Großen zu gewinnen; dann, alle Nahuṣa-Geschlechter, die Wälder erheben sich in Lichtgewinnung [Anm.: svarṣāta]."},{"n":1473,"sa":"śuṣmī śardho na mārutaṃ pavasvānabhiśastā divyā yathā viṭ\nāpo na makṣū sumatirbhavā naḥ sahasrāpsāḥ pṛtanāṣāṇna yajñaḥ","de":"Kraftvoll, wie die Schar der Maruts, fließe klärend, unbeschimpft wie die himmlische Sippe; wie die Wasser, schnell, sei uns wohlgesinnt, tausendwirkend, wie eine Weihehandlung, die Heerscharen bezwingt."}]},{"num":256,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 14","n_from":1474,"n_to":1476,"title_de":"Agni: Rufer der Weihehandlungen, Sender der Götter","note":"","units":[{"n":1474,"sa":"tvamagne yajñānāṃ hotā viśveṣāṃ hitaḥ\ndevebhirmānuṣe jane","de":"Du, Agni, bist der Rufer der Weihehandlungen, für alle eingesetzt, mit den Göttern unter den Menschen."},{"n":1475,"sa":"sa no mandrābhiradhvare jihvābhiryajā mahaḥ\nā devānvakṣi yakṣi ca","de":"Verehre du uns bei der Darbringung mit den holden Zungen, du Großer; bring die Götter herbei und verehre sie."},{"n":1476,"sa":"vetthā hi vedho adhvanaḥ pathaśca devāñjasā\nagne yajñeṣu sukrato","de":"Denn du kennst, Weiser, die Straße der Darbringung und die Wege der Götter geradenwegs; Agni, bei den Weihehandlungen, Meister der Einsicht."}]},{"num":257,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 15","n_from":1477,"n_to":1479,"title_de":"Agni: Der göttliche Rufer","note":"","units":[{"n":1477,"sa":"hotā devo amartyaḥ purastādeti māyayā\nvidathāni pracodayan","de":"Der Rufer, der göttliche, unsterbliche, geht vor uns her mit Zauberkraft, die Zusammenkünfte anregend."},{"n":1478,"sa":"vājī vājeṣu dhīyate 'dhvareṣu pra ṇīyate\nvipro yajñasya sādhanaḥ","de":"Als Ross wird er in den Kraftproben gehalten, bei den Weihehandlungen vorangeführt, der Sänger, der die Weihehandlung vollbringt."},{"n":1479,"sa":"dhiyā cakre vareṇyo bhūtānāṃ garbhamā dadhe\ndakṣasya pitaraṃ tanā","de":"Mit Einsicht wurde er erwählt [?], der Begehrenswerte; er legt den Keim der Wesen hinein, den Vater des Dakṣa, im Ausspannen [?]."}]},{"num":258,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 16","n_from":1480,"n_to":1482,"title_de":"Soma-Mischung: Für Indra und Agni","note":"","units":[{"n":1480,"sa":"ā sute siñcata śriyaṃ rodasyorabhiśriyam\nrasā dadhīta vṛṣabham","de":"Gießt in den gepressten [Soma] Glanz, der die beiden Welten durchstrahlt; mit dem Saft möge man den Stier [Anm.: Soma] aufnehmen."},{"n":1481,"sa":"te jānata svamokyā3ṃ saṃ vatsāso na mātṛbhiḥ\nmitho nasanta jāmibhiḥ","de":"Sie erkannten ihr Heim wie Kälber ihre Mütter, sie berührten einander mit den Geschwistern [?]."},{"n":1482,"sa":"upa srakveṣu bapsataḥ kṛṇvate dharuṇaṃ divi\nindre agnā namaḥ svaḥ","de":"An den Zipfeln [?] schnappend richten sie im Himmel eine Stütze auf; für Indra und Agni Verehrung, Wonne [?]."}]},{"num":259,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 17","n_from":1483,"n_to":1485,"title_de":"Indra: Der Älteste unter den Wesen","note":"","units":[{"n":1483,"sa":"tadidāsa bhuvaneṣu jyeṣṭaṃ yato jajñā ugrastveṣanṛmṇaḥ\nsadyo jajñāno ni riṇāti śatrūnanu yaṃ viśve madantyūmāḥ","de":"Der war es unter den Wesen, der Erste, aus dem du geboren wurdest, der Schreckliche mit blitzender Männlichkeit; kaum geboren wirft er die Feinde nieder, dem alle Helfer [Anm.: ūmāḥ] zujubeln."},{"n":1484,"sa":"vāvṛdhānaḥ śavasā bhūryojāḥ śatrurdāsāya bhiyasaṃ dadhāti\navyanacca vyanacca sasni saṃ te navanta prabhṛtā madeṣu","de":"Wachsend an Stärke, kraftvoll [?], ein Feind dem Dasa gibt er Furcht; atmend und nicht atmend [?], gewinnend, dir jubeln zu die dargebrachten [Gaben] in den Rauschzuständen."},{"n":1485,"sa":"tve kratumapi vṛñjanti viśve dviryadete trirbhavantyūmāḥ\nsvādoḥ svādīyaḥ svādunā sṛjā samadaḥ su madhu madhunābhi yodhīḥ","de":"In dir erkennen alle Einsicht, wenn diese Helfer zweimal, dreimal auftreten; vom Süßen das Süßere, mit dem Süßen [?] mische dich, mit Honig kämpfe an gegen das Süße [?].","notes":"Text vermutlich verderbt (samada)."}]},{"num":260,"loc":"Prapāṭhaka VI, Ardha 3, Gruppe 18","n_from":1486,"n_to":1488,"title_de":"Indra: Der Soma mit Viṣṇu getrunken (Refrain)","note":"Der Schlussrefrain wiederholt sich in allen drei Versen.","units":[{"n":1486,"sa":"trikadrukeṣu mahiṣo yavāśiraṃ tuviśuṣmastṛmpatsomamapibadviṣṇunā sutaṃ yathāvaśam\nsa īṃ mamāda mahi karma kartave mahāmuruṃ sainaṃ saścaddevo devaṃ satya induḥ satyamindram","de":"In den Trikadruka-Bechern trank der Büffel, der Starkkräftige, sich sättigend, den Soma mit Gerste, von Viṣṇu gepresst, ganz nach Wunsch; er berauschte sich, um große Tat zu vollbringen; den Großen, Weiten möge er, der Gott, den Gott erreichen: der wahre Tropfen den wahren Indra."},{"n":1487,"sa":"sākaṃ jātaḥ kratunā sākamojasā vavakṣitha sākaṃ vṛddho vīryaiḥ sāsahirmṛdho vicarṣaṇiḥ\ndātā rādha stuvate kāmyaṃ vasu pracetana sainaṃ saścaddevo devaṃ satya induḥ satyamindram","de":"Zugleich mit der Einsicht wurdest du geboren, zugleich mit der Kraft trugst du, zugleich wuchsest du an Heldentaten, du Überwältiger der Feinde, allen zugewandt; dem Preisenden gibst du das erwünschte Gut, Vielwissender; den Weisen möge er, der Gott, den Gott erreichen: der wahre Tropfen den wahren Indra."},{"n":1488,"sa":"adha tviṣīmāṃ abhyojasā kṛviṃ yudhābhavadā rodasī apṛṇadasya majmanā pra vāvṛdhe\nadhattānyaṃ jaṭhare premaricyata pra cetaya sainaṃ saścaddevo devaṃ satya induḥ satyamindram","de":"Dann wurdest du im Kampf durch Kraft ein Glänzender, Tatenreicher; du erfülltest die beiden Welten durch deine Größe, wuchsest hervor; du legtest ein anderes in deinen Leib, das Übrige [?] überragte; lass es erkennen; möge er, der Gott, den Gott erreichen: der wahre Tropfen den wahren Indra.","notes":"Text mit Schwierigkeiten (premaricyata)."}]},{"num":261,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 1","n_from":1489,"n_to":1491,"title_de":"Indra: Herr der Kühe, Herr des Wahren","note":"","units":[{"n":1489,"sa":"abhi pra gopatiṃ girendramarca yathā vide\nmūnuṃ satyasya satpatim","de":"Preise mit Gesang den Herrn der Kühe, Indra, wie du es weißt, den Munu [?], den Herrn des Wahren, des Seienden."},{"n":1490,"sa":"ā harayaḥ sasṛjrire 'ruṣīradhi barhiṣi\nyatrābhi saṃnavāmahe","de":"Die Falben ergossen sich, die rötlichen, auf das Opfergras, wo wir zusammen jubeln."},{"n":1491,"sa":"indrāya gāva āśiraṃ duduhre vajriṇe madhu\nyatsīmupahvare vidat","de":"Für Indra, den Keilträger, melkten die Kühe die Mischung, den Honig, als er sie in der Nähe [?] fand."}]},{"num":262,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 2","n_from":1492,"n_to":1493,"title_de":"Indra: Anruf bei Wettkämpfen","note":"","units":[{"n":1492,"sa":"ā no viśvāsu havyamindraṃ samatsu bhūṣata\nupa brahmāṇi savanāni vṛtrahanparamajyā ṛcīṣama","de":"Ihr [Sänger], schmückt Indra, den in allen Wettkämpfen anzurufenden, zu unseren Gebeten und Somapressungen, Vṛtratöter; die höchste Freundschaft [?] wollen wir preisen [?].","notes":"Text unsicher (paramajyā ṛcīṣama)."},{"n":1493,"sa":"tvaṃ dātā prathamo rādhasāmasyasi satya īśānakṛt\ntuvidyumnasya yujyā vṛṇīmahe putrasya śavaso mahaḥ","de":"Du bist der erste Geber der Gaben, der Wahre, Herrschaftsschaffende; als Freund erwählen wir dich, der du der Sohn des glanzreichen, großen Kraftvollen [?] bist."}]},{"num":263,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 3","n_from":1494,"n_to":1496,"title_de":"Soma und Indra: Der alte Trank, Preis der Himmelsgüter","note":"","units":[{"n":1494,"sa":"pratnaṃ pīyūṣaṃ pūrvyaṃ yadukthyaṃ maho gāhaddiva ā niradhukṣata\nindramabhi jāyamānaṃ samasvaran","de":"Den alten, ursprünglichen Nektar, der Lob verdient, molken sie herab aus dem großen Himmel; sie jubelten zusammen dem geborenen Indra zu."},{"n":1495,"sa":"ādīṃ ke citpaśyamānāsa āpyaṃ vasuruco divyā abhyanūṣata\ndivo na vāraṃ savitā vyūrṇute","de":"Dann priesen ihn einige [?] Schauende, den Verwandten, die Gütererleuchtenden, Himmlischen; wie der Savitṛ enthüllt er den Himmelsschatz [Anm.: vāra, „Schweif/Schatz“ ?]."},{"n":1496,"sa":"adha yadime pavamāna rodasī imā ca viśvā bhuvanābhi majmanā\nyūthe na niṣṭhā vṛṣabho vi rājasi","de":"Nun, Klärender, [wenn] diese beiden Welten und all diese Wesen [dich sehen], herrschst du durch deine Größe, ein Stier über der Herde, Bestimmter [?]."}]},{"num":264,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 4","n_from":1497,"n_to":1499,"title_de":"Agni: Ein neues Gāyatrī-Lied","note":"","units":[{"n":1497,"sa":"imamū ṣu tvamasmākaṃ saniṃ gāyatraṃ navyāṃsam\nagne deveṣu pra vocaḥ","de":"Dies uns Gewinnbringende, Gāyatrī-artige, Neueste, Agni, verkünde unter den Göttern."},{"n":1498,"sa":"vibhaktāsi citrabhāno sindhorūrmā upāka ā\nsadyo dāśuṣe kṣarasi","de":"Du bist aufgeteilt, mit glänzendem Licht, du kommst herzu wie Wogen des Flusses [?]; sogleich strömst du dem Verehrer zu."},{"n":1499,"sa":"ā no bhaja parameṣvā vājeṣu madhyameṣu\nśikṣā vasvo antamasya","de":"Verschaff uns Anteil bei den höchsten, den mittleren Kraftgewinnen; gib uns, Freigebiger, auch vom Letzten [?]."}]},{"num":265,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 5","n_from":1500,"n_to":1502,"title_de":"Ich-Lied: Selbstpreis des Sängers und Indra-Bitte","note":"","units":[{"n":1500,"sa":"ahamiddhi pituṣpari medhāmṛtasya jagraha\nahaṃ sūrya ivājani","de":"Ich habe vom Vater her die Einsicht der Wahrheit [ṛta] ergriffen; ich bin wie die Sonne geboren."},{"n":1501,"sa":"ahaṃ pratnena janmanā giraḥ śumbhāmi kaṇvavat\nyenendraḥ śuṣmamiddadhe","de":"Ich schmücke mit altem Ursprung die Lieder wie Kaṇva – [mit dem Lied,] durch das Indra die Kraft an sich gesetzt hat."},{"n":1502,"sa":"ye tvāmindra na tuṣṭuvurṛṣayo ye ca tuṣṭuvuḥ\nmamedvardhasva suṣṭutaḥ","de":"Die Seher, die dich, Indra, nicht gepriesen haben, und die, die dich gepriesen haben – nur mich lass wachsen [Anm.: oder: nur an mir wachse], gut gepriesen."}]},{"num":266,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 6","n_from":1503,"n_to":1505,"title_de":"Agni-Lied: Bitte um Beistand mit allen Feuern","note":"","units":[{"n":1503,"sa":"agne viśvebhiragnibhirjoṣi brahma sahaskṛta\nye devatrā ya āyuṣu tebhirno mahayā giraḥ","de":"Agni, du Kraftgeborener, erfreue dich am Gebetswort [brahma] mit allen Feuern, die unter den Göttern und unter den Menschenstämmen [āyuṣu] sind; mit ihnen erhöhe unsere Lieder."},{"n":1504,"sa":"pra sa viśvebhiragnibhiragniḥ sa yasya vājinaḥ\ntanaye toke asmadā samyaṅvājaiḥ parīvṛtaḥ","de":"Vor allen Feuern [ragt] jener Agni [hervor], dem die Rosse [vājinaḥ] gehören; er ist, was uns an Nachkommenschaft, Kind und Kindeskind [betrifft, ringsum] von Stärkungen umgeben [Anm.: Textzustand fraglich]."},{"n":1505,"sa":"tvaṃ no agne agnibhirbrahma yajñaṃ ca vardhaya\ntvaṃ no devatātaye rāyo dānāya codaya","de":"Du, Agni, lass mit den Feuern unser Gebetswort und die Weihehandlung wachsen; du treibe uns an, zur Götterverehrung und zum Schenken von Reichtum."}]},{"num":267,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 7","n_from":1506,"n_to":1508,"title_de":"Soma-Lied: Antrieb zu Kraft und Ruhm","note":"","units":[{"n":1506,"sa":"tve soma prathamā vṛktabarhiṣo mahe vājāya śravase dhiyan dadhuḥ\nsa tvaṃ no vīra vīryāya codaya","de":"Bei dir, Soma, haben die Ersten, die das Barhis [Streu] bereitet haben, ihr Denken auf große Stärke und Ruhm gerichtet; du, Held, treibe uns an zur Heldenkraft."},{"n":1507,"sa":"abhyabhi hi śravasā tatardithotsaṃ na kaṃ cijjanapānamakṣitam\nśaryābhirna bharamāṇo gabhastyoḥ","de":"Immer wieder hast du mit Ruhm [alle] bedrängt [?] wie eine unversiegbare Quelle, die irgendeinem Volk zu trinken gibt, wie einer, der [Pfeile] in den Händen trägt [Anm.: „śaryābhir“ wörtlich: mit Rohr-/Pfeilstücken; Deutung unsicher]."},{"n":1508,"sa":"ajījano amṛta martyāya amṛtasya dharmannamṛtasya cāruṇaḥ\nsadāsaro vājamacchā saniṣyadat","de":"Der Unsterbliche hat [den Soma] für den Sterblichen erzeugt, in der Ordnung des Unsterblichen, der Strahlende des Unsterblichen; der stets Strömende soll auf die Stärke [Siegespreis] zu eilen."}]},{"num":268,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 8","n_from":1509,"n_to":1511,"title_de":"Indra-Lied: Soma für Indra, sein unvergleichlicher Rang","note":"","units":[{"n":1509,"sa":"endumindrāya siñcata pibāti somyaṃ madhu\npra rādhāṃsi codayate mahitvanā","de":"Gießt den Soma [Anm.: „indum“, Tropfen] für Indra; er soll den süßen Somatrank trinken; durch seine Größe treibt er die Gaben an [Anm.: Textzustand fraglich]."},{"n":1510,"sa":"upo harīṇāṃ patiṃ rādhaḥ pṛñcantamabravam\nnūnaṃ śrudhi stuvato aśvyasya","de":"Ich habe zu dem Herrn der Falben gesprochen, der Gabe [rādhas] spendet; höre jetzt [auf den], der [dich] preist, den Rossreichen [Anm.: „aśvyasya“ wohl Genitiv des Rosse besitzenden Sängers; unsicher] [?]."},{"n":1511,"sa":"na hyāṅ3ga purā ca na jajñe vīratarastvat\nna kī rāyā naivathā na bhandanā","de":"Denn fürwahr, weder früher noch [später] ist einer geboren, der heldenhafter wäre als du; nicht durch Reichtum, nicht auf solche Weise, nicht durch Lobpreis [ist einer dir gleich]."}]},{"num":269,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 9","n_from":1512,"n_to":1512,"title_de":"Kuhherde-Vers: Ruf an die Kühe","note":"","units":[{"n":1512,"sa":"nadaṃ va odatīnāṃ nadaṃ yoyuvatīnām\npatiṃ vo aghnyānāṃ dhenūnāmiṣudhyasi","de":"Ich [rufe] euer Brüllen, ihr Zusammengedrängten, euer Brüllen, ihr Sich-Vereinigenden [Anm.: Deutung unsicher] [?]; den Herrn der unantastbaren Kühe [aghnyā] suchst du zu erlangen [Anm.: Textzustand fraglich]."}]},{"num":270,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 10","n_from":1513,"n_to":1514,"title_de":"Agni: Schätzespender und Rufer der Weihehandlung","note":"","units":[{"n":1513,"sa":"devo vo draviṇodāḥ pūrṇāṃ vivaṣṭvāsicam\nudvā siñcadhvamupa vā pṛṇadhvamādidvo deva ohate","de":"Der Gott Draviṇodas [Gütergeber] soll euch [etwas] Volles wünschen [?]; gießt [es] aus, oder füllt [es] auf; danach wird der Gott euch [Gaben] zuführen [Anm.: Textzustand fraglich, Vers ohne klare Objektbezeichnung]."},{"n":1514,"sa":"taṃ hotāramadhvarasya pracetasaṃ vahniṃ devā akṛṇvata\ndadhāti ratnaṃ vidhate suvīryamagnirjanāya dāśuṣe","de":"Ihn, den Rufer [hotṛ] der Weihehandlung, den Weisen, haben die Götter zum Fahrer gemacht; er verleiht dem Verehrenden Schatz mit guter Mannheit: Agni dem Darbringer-Menschen."}]},{"num":271,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 11","n_from":1515,"n_to":1517,"title_de":"Agni: Erleuchter der Ordnung, Feuer der Sänger","note":"","units":[{"n":1515,"sa":"adarśi gātuvittamo yasminvratānyādadhuḥ\nupoṣu jātamāryasya vardhanamagniṃ nakṣantu no giraḥ","de":"Er ist erschienen, der Wegkundigste, bei dem sie die Satzungen niedergelegt haben; zu dem eben Geborenen, dem Förderer des Ārya, sollen unsere Lieder gelangen, zu Agni."},{"n":1516,"sa":"yasmādrejanta kṛṣṭayaścarkṛtyāni kṛṇvataḥ\nsahasrasāṃ medhasātāviva tmanāgniṃ dhībhirnamasyata","de":"Vor dem die Stämme erzittern, wenn sie [Feindliches] Werke tun, den Tausendgewinner – wie in zwei Kämpfen um Einsicht [?] – Agni verehrt selbst mit Gedanken und Ehrerbietung."},{"n":1517,"sa":"pra daivodāso agnirdeva indro na majmanā\nanu mātaraṃ pṛthivīṃ vi vāvṛte tasthau nākasya śarmaṇi","de":"Der Sohn des Divodāsa [Anm.: „daivodāso“ auch als „Divodāsa-Agni“ deutbar]: Agni, Gott, wie Indra an Größe; er wendet sich der Mutter Erde nach und steht im Schutz des Himmelsfirmaments [nāka]."}]},{"num":272,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 12","n_from":1518,"n_to":1520,"title_de":"Agni Pavamāna: Läuterung, Kraft und Erlösung von Unheil","note":"","units":[{"n":1518,"sa":"agna āyūṃṣi pavase āsuvorjamiṣaṃ ca naḥ\nāre bādhasva ducchunām","de":"Agni, du läuterst Lebenskräfte; sende uns Kraft und Labung zu; treibe Unheil weit weg."},{"n":1519,"sa":"agnirṛṣiḥ pavamānaḥ pāñcajanyaḥ purohitaḥ\ntamīmahe mahāgayam","de":"Agni, der Seher, der Sich-Läuternde, der bei den fünf Stämmen Vorangestellte [purohita] – ihn bitten wir, den mit großem Haushalt [?]."},{"n":1520,"sa":"agne pavasva svapā asme varcaḥ suvīryam\ndadhadrayiṃ mayi yoṣam","de":"Agni, läutere dich, du Werkkundiger; bring uns Glanz und gute Mannheit; [du,] der mir Reichtum und [Frauen/Gattin] gibt [?] [Anm.: „yoṣam“ = Frau, Mädchen]."}]},{"num":273,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 13","n_from":1521,"n_to":1523,"title_de":"Agni-Lied: Bote zu den Göttern","note":"","units":[{"n":1521,"sa":"agne pāvaka rociṣā mandrayā deva jihvayā\nā devānvakṣi yakṣi ca","de":"Agni, du Läuternder, mit deinem Licht, mit erfreuender Zunge, Gott: führe die Götter her und verehre [sie]."},{"n":1522,"sa":"taṃ tvā ghṛtasnavīmahe citrabhāno svardṛśam\ndevāṃ ā vītaye vaha","de":"Dich, den Ghee-Triefenden, rufen wir an, du Buntstrahliger, Himmelsschauer; führe die Götter zum Gastmahl [vīti] her."},{"n":1523,"sa":"vītihotraṃ tvā kave dyumantaṃ samidhīmahi\nagne bṛhantamadhvare","de":"Dich, Seher, den Genießer der Darbringungen, den Leuchtenden, entzünden wir, Agni, den Hohen, bei der Weihehandlung."}]},{"num":274,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 14","n_from":1524,"n_to":1526,"title_de":"Agni: Hilfe und Reichtum","note":"","units":[{"n":1524,"sa":"avā no agna ūtibhirgāyatrasya prabharmaṇi\nviśvāsu dhīṣu vandya","de":"Hilf uns, Agni, mit Hilfen beim Herbeibringen des Gāyatra [-Liedes], du, den man in allen Gedanken preist."},{"n":1525,"sa":"ā no agne rayiṃ bhara satrāsāhaṃ vareṇyam\nviśvāsu pṛtsu duṣṭaram","de":"Bring uns, Agni, Reichtum herbei, den Überwältiger, Erwünschten, in allen Kämpfen Unüberwindlichen."},{"n":1526,"sa":"ā no agne sucetunā rayiṃ viśvāyupoṣasam\nmārḍīkaṃ dhehi jīvase","de":"Bring uns, Agni, mit klugem Sinn Reichtum, der das ganze Leben nährt; verleihe Gnade zum Leben."}]},{"num":275,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 15","n_from":1527,"n_to":1531,"title_de":"Agni: Antrieb, Reichtum, Licht am Himmel","note":"","units":[{"n":1527,"sa":"agniṃ hinvantu no dhiyaḥ saptimāśumivājiṣu\ntena jeṣma dhanaṃdhanam","de":"Agni sollen unsere Gedanken antreiben wie ein rasches Ross in den Wettkämpfen; mit ihm wollen wir Gewinn um Gewinn erobern."},{"n":1528,"sa":"yayā gā ākarāmahai senayāgne tavotyā\ntāṃ no hinva maghattaye","de":"Mit welchem Heer, Agni, und deiner Hilfe wir Rinder heimbringen wollen – dieses treibe uns an zur Gabenverleihung [maghattaye]."},{"n":1529,"sa":"āgne sthūraṃ rayiṃ bhara pṛthuṃ gomantamaśvinam\naṅdhi khaṃ varttayā pavim","de":"Agni, bring mächtigen Reichtum: weit, mit Rindern und Rossen; salbe die Nabe [khaṃ] [und] drehe den Radreifen [Anm.: Bild vom Wagenrad; Deutung unsicher] [?]."},{"n":1530,"sa":"agne nakṣatramajaramā sūryaṃ rohayo divi\ndadhajjyotirjanebhyaḥ","de":"Agni, den unalternden Stern [nakṣatra], die Sonne hast du am Himmel aufsteigen lassen; [du,] der den Menschen Licht verleiht."},{"n":1531,"sa":"agne keturviśāmasi preṣṭhaḥ śreṣṭha upasthasat\nbodhā stotre vayo dadhat","de":"Agni, du bist das Banner der Stämme, der Liebste, der Beste, im Schoß sitzend; erwache für den Sänger, Lebenskraft verleihend."}]},{"num":276,"loc":"Prapāṭhaka VII, Ardha 1, Gruppe 16","n_from":1532,"n_to":1534,"title_de":"Agni: Haupt des Himmels, Herr des Lichts","note":"","units":[{"n":1532,"sa":"agnirmūrdhā divaḥ kakutpatiḥ pṛthivyā ayam\napāṃ retāṃsi jinvati","de":"Agni ist das Haupt, der Gipfel des Himmels, der Herr der Erde; er belebt die Samen der Wasser."},{"n":1533,"sa":"īśiṣe vāryasya hi dātrasyāgne svaḥpatiḥ\nstotā syāṃ tava śarmaṇi","de":"Du herrschst über das Wünschenswerte und den Geber, Agni, Herr des Lichtreichs; möge ich Lobsänger in deinem Schutz sein."},{"n":1534,"sa":"udagne śucayastava śukrā bhrājanta īrate\ntava jyotīṃṣyarcayaḥ","de":"Agni, deine reinen, hellen Strahlen erheben sich glänzend; deine Lichter sind die Strahlen."}]},{"num":277,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 1","n_from":1535,"n_to":1537,"title_de":"Agni: Verwandter der Menschen","note":"","units":[{"n":1535,"sa":"kaste jāmirjanānāmagne ko dāśvadhvaraḥ\nko ha kasminnasi śritaḥ","de":"Wer ist dein Verwandter unter den Menschen, Agni? Wer ist der Weihehandlungs-Gebende [dāśvadhvara]? Und in wem bist du [eigentlich] geborgen?"},{"n":1536,"sa":"tvaṃ jāmirjanānāmagne mitro asi priyaḥ\nsakhā sakhibhya īḍyaḥ","de":"Du bist, Agni, der Verwandte der Menschen, der liebe Mitra [Freund]; der Gefährte, der den Gefährten preiswürdig ist."},{"n":1537,"sa":"yajā no mitrāvaruṇā yajā devāṃ ṛtaṃ bṛhat\nagne yakṣi svaṃ damam","de":"Verehre für uns Mitra und Varuṇa, verehre die Götter, die hohe Ordnung [ṛta]; Agni, du verehrst dein eigenes Haus."}]},{"num":278,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 2","n_from":1538,"n_to":1540,"title_de":"Agni: Der Stier, der entzündet wird","note":"","units":[{"n":1538,"sa":"īḍenyo namasyastirastamāṃsi darśataḥ\nsamagniridhyate vṛṣā","de":"Der Preiswürdige, zu Verehrende, der die Finsternisse durchdringt, gut Sichtbare: Agni, der Stier, wird entzündet."},{"n":1539,"sa":"vṛṣo agniḥ samidhyate 'śvo na devavāhanaḥ\ntaṃ haviṣmanta īḍate","de":"Der Stier Agni wird entzündet, wie ein Ross, das die Götter fährt; ihn preisen die mit Darbringung Versehenen."},{"n":1540,"sa":"vṛṣaṇaṃ tvā vayaṃ vṛṣanvṛṣaṇaḥ samidhīmahi\nagne dīdyataṃ bṛhat","de":"Dich, den Stier, wollen wir, Stier[e], als Stier entzünden; Agni, leuchte hoch [und] weit [?]."}]},{"num":279,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 3","n_from":1541,"n_to":1543,"title_de":"Agni: Erhebung der Flammen, Rufer und Priester","note":"","units":[{"n":1541,"sa":"utte bṛhanto arcayaḥ samidhānasya dīdivaḥ\nagne śukrāsa īrate","de":"Empor gehen deine hohen Strahlen, wenn du entzündet bist, du Leuchtender; Agni, [sie] erheben sich hell."},{"n":1542,"sa":"upa tvā juhvo3 mama ghṛtācīryantu haryata\nagne havyā juṣasva naḥ","de":"Zu dir, Begehrenswerter, sollen meine Löffel [juhū] kommen, ghee-triefend; Agni, genieße unsere Darbringungen."},{"n":1543,"sa":"mandraṃ hotāramṛtvijaṃ citrabhānuṃ vibhāvasum\nagnimīḍe sa u śravat","de":"Den erfreuenden Rufer [hotṛ], den Priester zur rechten Zeit, den Buntstrahligen, den Lichtreichen: Agni rufe ich an; er möge hören."}]},{"num":280,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 4","n_from":1544,"n_to":1545,"title_de":"Agni: Bitte um Schutz durch Strophen","note":"","units":[{"n":1544,"sa":"pāhi no agna ekayā pāhyū3ta dvitīyayā\npāhi gīrbhistisṛbhirūrjāṃ pate pāhi catasṛbhirvaso","de":"Schütze uns, Agni, mit einer, schütze auch mit der zweiten; schütze mit drei Liedern, Herr der Kräfte, schütze mit vieren, du Guter [vasu]."},{"n":1545,"sa":"pāhi viśvasmādrakṣaso arāvṇaḥ pra sma vājeṣu no 'va\ntvāmiddhi nediṣṭhaṃ devatātaya āpiṃ nakṣāmahe vṛdhe","de":"Schütze vor jedem Rākṣasa und Geizigen; hilf uns in den Wettkämpfen. Denn dich, den Nächsten, suchen wir bei der Götterverehrung als Freund zu erreichen, zum Gedeihen."}]},{"num":281,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 5","n_from":1546,"n_to":1548,"title_de":"Agni: Erscheinen bei Morgen und Nacht","note":"","units":[{"n":1546,"sa":"ino rājannaratiḥ samiddho raudro dakṣāya suṣumāṃ adarśi\ncikidvi bhāti bhāsā bṛhatāsiknīmeti ruśatīmapājan","de":"Der [Anm.: „ina“ Herr] König, der Unversehrte [?], entzündet; der Schreckliche ist für das Wirken [dakṣa] gut hervortrebend [?] erschienen; wissend leuchtet er mit hohem Glanz; er geht zur Dunklen [Nacht?], die Strahlende vertreibt er [Anm.: Textzustand und Bezug fraglich; sehr unsicher] [?]."},{"n":1547,"sa":"kṛṣṇāṃ yadenīmabhi varpasābhūjjanayanyoṣāṃ bṛhataḥ piturjām\nūrdhvaṃ bhānuṃ sūryasya stabhāyandivo vasubhiraratirvi bhāti","de":"Als er, der die schwarze Tiefe [Nacht?] mit seiner Gestalt überwältigte, die Frau zeugend, die Tochter des hohen Vaters [Anm.: Deutung unsicher] [?], das Licht der Sonne aufrichtete, glänzt er als ruheloser Himmels-Sohn [?] mit den Vasu [?] auseinander."},{"n":1548,"sa":"bhadro bhadrayā sacamāna āgātsvasāraṃ jāro abhyeti paścāt\nsupraketairdyubhiragnirvitiṣṭhanruśadbhirvarṇairabhi rāmamasthāt","de":"Der Gute, der sich mit der Guten [?] verbindet, ist gekommen; der Buhle geht nach hinten zur Schwester; Agni, mit gut erkennbaren Tagen [?] auseinandertretend, hat sich mit leuchtenden Farben gegen die Dunkle [Nacht] gestellt [Anm.: sehr unsicher] [?]."}]},{"num":282,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 6","n_from":1549,"n_to":1551,"title_de":"Agni: Wie sollen wir dir dienen?","note":"","units":[{"n":1549,"sa":"kayā te agne aṅgira ūrjo napādupastutim\nvarāya deva manyave","de":"Mit welchem Lobpreis, Agni Aṅgiras, [preisen wir dich], Sohn der Kraft, Gott, [dich] zu großer Wunschkraft [?]?"},{"n":1550,"sa":"dāśema kasya manasā yajñasya sahaso yaho\nkadu voca idaṃ namaḥ","de":"Wem sollen wir mit Sinn dienen von der Weihehandlung, Überwinder der Stärke? Was soll ich [dir] von dieser Verehrung sagen [?]?"},{"n":1551,"sa":"adhā tvaṃ hi naskaro viśvā asmabhyaṃ sukṣitīḥ\nvājadraviṇaso giraḥ","de":"Und du machst uns nun alle guten Wohnsitze; [ebenso] die Lieder, die Stärke und Reichtum haben [Anm.: Textzustand fraglich] [?]."}]},{"num":283,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 7","n_from":1552,"n_to":1553,"title_de":"Agni: Herbeiruf als Rufer","note":"","units":[{"n":1552,"sa":"agna ā yāhyagnibhirhotāraṃ tvā vṛṇīmahe\nā tvāmanaktu prayatā haviṣmatī yajiṣṭhaṃ barhirāsade","de":"Agni, komm mit den Feuern; als Rufer [hotṛ] erwählen wir dich; dich soll die bereitete, mit Darbringung versehene Streu salben, dem besten Verehrer zum Sitzen."},{"n":1553,"sa":"acchā hi tvā sahasaḥ sūno aṅgiraḥ srucaścarantyadhvare\nūrjo napātaṃ ghṛtakeśamīmahe 'gniṃ yajñeṣu pūrvyam","de":"Zu dir hin, Sohn der Kraft, Aṅgiras, bewegen sich die Löffel bei der Weihehandlung; den Enkel der Stärke [ūrjo napāt], den Ghee-Haarigen, rufen wir an, Agni, den Ersten bei den Weihehandlungen."}]},{"num":284,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 8","n_from":1554,"n_to":1555,"title_de":"Agni: Lobpreis und Hinwendung","note":"","units":[{"n":1554,"sa":"acchā naḥ śīraśociṣaṃ giro yantu darśatam\nacchā yajñāso namasā purūvasuṃ purupraśastamūtaye","de":"Zu uns sollen die Lieder gelangen zu dem mit strahlendem Haupt [?], dem Sehenswerten; zu ihm sollen die Weihehandlungen mit Ehrerbietung [gelangen], dem Reichbegüterten, Vielgepriesenen, zur Hilfe."},{"n":1555,"sa":"agniṃ sūnuṃ sahaso jātavedasaṃ dānāya vāryāṇām\ndvitā yo bhūdamṛto martyeṣvā hotā mandratamo viśi","de":"Agni, den Sohn der Kraft, Jātavedas, [rufen wir an,] um Wünschenswertes zu geben – der zwiefach unter den Sterblichen unsterblich wurde, als der erfreuendste Rufer [hotṛ] unter dem Stamm."}]},{"num":285,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 9","n_from":1556,"n_to":1558,"title_de":"Agni: Unbezwingbarer Führer der Menschenstämme","note":"","units":[{"n":1556,"sa":"adābhyaḥ puraetā viśāmagnirmānuṣīṇām\ntūrṇī rathaḥ sadā navaḥ","de":"Der Unbezwingbare, der Vorangeher der menschlichen Stämme, Agni: rasch, ein Wagen, stets neu."},{"n":1557,"sa":"abhi prayāṃsi vāhasā dāśvāṃ aśnoti martyaḥ\nkṣayaṃ pāvakaśociṣaḥ","de":"Auf die Speisen zu erlangt durch den Fahrer [Agni] der Darbringer, der Sterbliche, die Wohnstatt des Feuer-Leuchtenden [?]."},{"n":1558,"sa":"sāhvānviśvā abhiyujaḥ kraturdevānāmamṛktaḥ\nagnistuviśravastamaḥ","de":"Überwinder aller Angreifer, der unbeirrbare Wille der Götter: Agni, der Ruhmreichste [?]."}]},{"num":286,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 10","n_from":1559,"n_to":1560,"title_de":"Agni: Heil und Segen","note":"","units":[{"n":1559,"sa":"bhadro no agnirāhuto bhadrā rātiḥ subhaga bhadro adhvaraḥ\nbhadrā uta praśastayaḥ","de":"Heilvoll sei uns der angerufene Agni, heilvoll die Gabe, du Glücklicher, heilvoll die Weihehandlung, und heilvoll die Preisungen."},{"n":1560,"sa":"bhadraṃ manaḥ kṛṇuṣva vṛtratūrye yenā samatsu sāsahiḥ\nava sthirā tanuhi bhūri śardhatāṃ vanemā te abhiṣṭaye","de":"Mache den Sinn heilvoll im Vṛtra-Kampf, mit dem du in Schlachten überwindest; verstreue das Feste, [das] viele Widerstehende [?]; wir wollen dir zu Gefallen [für dein Ziel] gewinnen [?]."}]},{"num":287,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 11","n_from":1561,"n_to":1563,"title_de":"Agni: Bitte um Ruhm","note":"","units":[{"n":1561,"sa":"agne vājasya gomata īśānaḥ sahaso yaho\nasme dehi jātavedo mahi śravaḥ","de":"Agni, Herr des Rinderreichen, [Herr] der Stärke, Überwinder der Kraft: gib uns, Jātavedas, hohen Ruhm."},{"n":1562,"sa":"sa idhāno vasuṣkaviragnirīḍenyo girā\nrevadasmabhyaṃ purvaṇīka dīdihi","de":"Er, der entzündet wird, der Wohnungen-Sehers [?], Agni, ist im Lied preiswürdig; leuchte uns reichlich, du vielgestaltiger."},{"n":1563,"sa":"kṣapo rājannuta tmanāgne vastorutoṣasaḥ\nsa tigmajambha rakṣaso daha prati","de":"In der Nacht, König, und selbst in der Wohnung und bei der Morgenröte, du mit scharfen Kiefern: verbrenne die Rākṣasas [völlig] [?]."}]},{"num":288,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 12","n_from":1564,"n_to":1566,"title_de":"Agni: Gast der Stämme","note":"","units":[{"n":1564,"sa":"viśoviśo vo atithiṃ vājayantaḥ purupriyam\nagniṃ vo duryaṃ vaca stuṣe śūṣasya manmabhiḥ","de":"Den Gast jedes Stammes, den Vielgeliebten, Agni, Hausherrn [duryam]: euch [preise] ich mit Sprüchen der Kraft; ich preise [ihn] mit den Denkgedanken des Śūṣa [?]."},{"n":1565,"sa":"yaṃ janāso haviṣmanto mitraṃ na sarpirāsutim\npraśaṃsanti praśastibhiḥ","de":"Den die Menschen mit Darbringung, wie Mitra [als Freund], mit Buttergabe [sarpis] als Guss, mit Preisungen preisen."},{"n":1566,"sa":"panyāṃsaṃ jātavedasaṃ yo devatātyudyatā\nhavyānyairayaddivi","de":"Den Bewundernswerten, Jātavedas, der bei der Götterverehrung [hier] mit erhobenen [Löffeln] die Darbringungen zum Himmel entsandte [?]."}]},{"num":289,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 13","n_from":1567,"n_to":1569,"title_de":"Agni: Der entzündete Bote der Menschheit","note":"","units":[{"n":1567,"sa":"samiddhamagniṃ samidhā girā gṛṇe śuciṃ pāvakaṃ puro adhvare dhruvam\nvipraṃ hotāraṃ puruvāramadruhaṃ kaviṃ sumnairīmahe jātavedasam","de":"Den mit dem Holz entzündeten Agni preise ich mit einem Lied, den reinen, läuternden, der vor der Weihehandlung fest steht; den Seher, den Rufer [hotṛ], den Vielbegehrten, den Trugfreien, den Dichter, Jātavedas, bitten wir mit Wohlwollen."},{"n":1568,"sa":"tvāṃ dūtamagne amṛtaṃ yugeyuge havyavāhaṃ dadhire pāyumīḍyam\ndevāsaśca marttāsaśca jāgṛviṃ vibhuṃ viśpatiṃ namasā ni ṣedire","de":"Dich, Agni, den Boten, den unsterblichen, den Darbringungsfahrer, den Hüter, den Preiswürdigen, haben sie Zeitalter um Zeitalter eingesetzt; Götter und Sterbliche, den Wachen, den Mächtigen, den Herrn der Stämme, haben sich mit Ehrerbietung niedergelassen."},{"n":1569,"sa":"vibhūṣannagna ubhayāṃ anu vratā dūto devānāṃ rajasī samīyase\nyatte dhītiṃ sumatimāvṛṇīmahe 'dha smā nastrivarūthaḥ śivo bhava","de":"Schmückend, Agni, folgst du beiden [Welten] nach ihren Satzungen; als Bote der Götter gehst du zu den beiden Räumen; deinen Gedanken und deine Gunst erwählen wir; dann sei uns dreifach schützend [trivarūtha] und gütig."}]},{"num":290,"loc":"Prapāṭhaka VII, Ardha 2, Gruppe 14","n_from":1570,"n_to":1572,"title_de":"Agni: Löffel, Streu und Wohnstatt","note":"","units":[{"n":1570,"sa":"upa tvā jāmayo giro dediśatīrhaviṣkṛtaḥ\nvāyoranīke asthiran","de":"Zu dir kommen die Schwestern [Anm.: „jāmayaḥ“, Schwestern/Verwandte], die Lieder, die Darbringung herstellend, weisend; sie haben sich vor Vāyus Antlitz aufgestellt [?]."},{"n":1571,"sa":"yasya tridhātvavṛtaṃ barhistasthāvasandinam\nāpaścinni dadhā padam","de":"Dem die dreifache [?] Streu ausgebreitet, ungehindert, täglich [ist], selbst Wasser [?] setzt [ihn] an den Ort [Anm.: Textzustand fraglich] [?]."},{"n":1572,"sa":"padaṃ devasya mīḍhuṣo 'nādhṛṣṭābhirūtibhiḥ\nbhadrā sūrya ivopadṛk","de":"Den Standort des Gottes, des Spenders, [ist] durch unerschütterliche Hilfen [geschützt], glückvoll, wie die Sonne anzusehen [?]."}]},{"num":291,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 1","n_from":1573,"n_to":1574,"title_de":"Indra: Frühere Trunkverehrer und Preislieder","note":"","units":[{"n":1573,"sa":"abhi tvā pūrvapītaya indra stomebhirāyavaḥ\nsamīcīnāsa ṛbhavaḥ samasvaranrudrā gṛṇanta pūrvyam","de":"Zu dir hin, Indra, [kommen] mit Lobliedern die Menschen zum früheren Trunk; die Ṛbhus haben einmütig zusammen gesungen; die Rudras preisen den Ersten."},{"n":1574,"sa":"asyedindro vāvṛdhe vṛṣṇyaṃ śavo made sutasya viṣṇavi\nadyā tamasya mahimānamāyavo 'nu ṣṭuvanti pūrvathā","de":"Ihm, Indra, ist die Stierkraft gewachsen, die Stärke im Rausch des gepressten [Soma], im Viṣṇu-artigen [?]; heute preisen die Menschen seine Größe nach wie vormals."}]},{"num":292,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 2","n_from":1575,"n_to":1578,"title_de":"Indra und Agni: Vier Verse","note":"","units":[{"n":1575,"sa":"pra vāmarcantyukthino nīthāvido jaritāraḥ\nindrāgnī iṣa ā vṛṇe","de":"Euch beide preisen die Liedersprecher, die Wegkundigen, die Sänger; Indra und Agni, [ich] erbitte [mir] Labung."},{"n":1576,"sa":"indrāgnī navatiṃ puro dāsapatnīradhūnutam\nsākamekena karmaṇā","de":"Indra und Agni, neunzig Burgen, die Frauen des Dāsa, habt ihr erschüttert, zusammen in einer Tat."},{"n":1577,"sa":"indrāgnī apasasparyupa pra yanti dhītayaḥ\nṛtasya pathyā ' '3 anu","de":"Indra und Agni, um euch herum kreisend gehen die Gedanken [Andachten] den Pfaden der Ordnung [ṛta] nach [Anm.: Pluti-Ausklang, Text am Ende fraglich]."},{"n":1578,"sa":"indrāgnī taviṣāṇī vāṃ sadhasthāni prayāṃsi ca\nyuvoraptūryaṃ hitam","de":"Indra und Agni, euere Kräfte, eure gemeinsamen Sitze und Speisen sind zusammengefügt; eure Tatkraft ist gerichtet [?]."}]},{"num":293,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 3","n_from":1579,"n_to":1580,"title_de":"Indra: Hilfe, Anteil und Ruhm","note":"","units":[{"n":1579,"sa":"śagdhyū3 ṣu śacīpata indra viśvābhirūtibhiḥ\nbhagaṃ na hi tvā yaśasaṃ vasuvidamanu śūra carāmasi","de":"Ermögliche es, Herr der Kraft [śacīpati], Indra, mit allen Hilfen! Denn wie einen Anteil [bhaga], dich, den Ruhmreichen, Güterfinder, verfolgen wir dir nach, Held."},{"n":1580,"sa":"pauro aśvasya purukṛdgavāmasyutso deva hiraṇyayaḥ\nna kirhi dānaṃ pari mardhiṣatve yadyadyāmi tadā bhara","de":"Der Rossbesitzer, der Vielwirkende, der Rinder Quelle, Gott, golden: nicht [wird] jemals deine Gabe gehemmt; worum ich auch bitte, davon bring [es] her [Anm.: „pauro“ Deutung unsicher] [?]."}]},{"num":294,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 4","n_from":1581,"n_to":1582,"title_de":"Indra: Herbeirufung, Geber vieler Herden","note":"","units":[{"n":1581,"sa":"tvaṃ hyehi cerave vidā bhagaṃ vasuttaye\nudvāvṛṣasva madhavangaviṣṭaya udindrāśvamiṣṭaye","de":"Komm her, du, zum Freigebigen [?]; finde einen Anteil zum Erlangen von Gut; gieße dich aus [als Regner], Honigreicher, zum Rinderwunsch; Indra, [gieße] zum Rosswunsch [?]."},{"n":1582,"sa":"tvaṃ purū sahasrāṇi śatāni ca yūthā dānāya maṃhase\nā purandaraṃ cakṛma vipravacasa indraṃ gāyanto 'vase","de":"Du gibst viele Tausende und Hunderte von Herden, um zu geben; wir haben den Purandara [Burgenbrecher] hergerufen, mit Weisen-Worten, den Indra beim Singen zur Hilfe."}]},{"num":295,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 5","n_from":1583,"n_to":1584,"title_de":"Agni: Erstes Honigtrank","note":"","units":[{"n":1583,"sa":"yo viśvā dayate vasu hotā mandro janānām\nmadhorna pātrā prathamānyasmai pra stomā yantvagnaye","de":"Der alle Güter zuteilt, der erfreuende Rufer [hotṛ] der Menschen: die ersten Honigbecher [gehören] ihm; zu Agni sollen die Preislieder gehen."},{"n":1584,"sa":"aśva na gīrbhī rathyaṃ sudānavo marmṛjyante devayavaḥ\nubhe toke tanaye dasma vispate parṣi rādho maghonām","de":"Die gut Schenkenden, die Götter suchenden [Sänger] putzen [ihn] mit Liedern wie ein Wagenpferd; für beide, Kind und Kindeskind, Wundertäter, Herr der Stämme, bring die Gaben der Freigebigen hinüber [?]."}]},{"num":296,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 6","n_from":1585,"n_to":1585,"title_de":"Varuṇa: Ruf um Gnade","note":"","units":[{"n":1585,"sa":"imaṃ me varuṇa śrudhī havamadyā ca mṛḍaya\ntvāmavasyurā cake","de":"Höre, Varuṇa, diesen meinen Ruf; sei heute gnädig; nach Hilfe verlangend habe ich dich angerufen [?]."}]},{"num":297,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 7","n_from":1586,"n_to":1586,"title_de":"Indra: Mit welcher Hilfe?","note":"","units":[{"n":1586,"sa":"kayā tvaṃ na ūtyābhi pra mandase vṛṣan\nkayā stotṛbhya ā bhara","de":"Mit welcher Hilfe berauschst du dich für uns auf uns zu, Stier? Mit welcher bringst du den Sängern [etwas] her?"}]},{"num":298,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 8","n_from":1587,"n_to":1588,"title_de":"Indra: Preis an vielen Orten, Größe Indras","note":"","units":[{"n":1587,"sa":"indramiddevatātaya indraṃ prayatyadhvare\nindraṃ samīke vanino havāmaha indraṃ dhanasya sātaye","de":"Indra rufen wir bei der Götterverehrung, Indra beim Aufbruch zur Weihehandlung, Indra im Handgemenge, wir Holz-Besitzer [?], Indra zum Gewinnen von Gut."},{"n":1588,"sa":"indro mahnā rodasī paprathacchava indraḥ sūryamarocayat\nindre ha viśvā bhuvanāni yemira indre suvānāsa indavaḥ","de":"Indra hat durch Größe die beiden Welten ausgebreitet, [er] die Kraft [?]; Indra hat die Sonne leuchten lassen; in Indra sind alle Wesen festgehalten; in Indra [sind] die gepressten Tropfen."}]},{"num":299,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 9","n_from":1589,"n_to":1589,"title_de":"Viśvakarman: Bitte um selbstgeleistete Verehrung","note":"","units":[{"n":1589,"sa":"viśvakarmanhaviṣā vāvṛdhānaḥ svayaṃ yajasva tanvā3ṃ svā hi te\nmuhyantvanye abhito janāsa ihāsmākaṃ maghavā sūrirastu","de":"Viśvakarman, durch die Darbringung wachsend, verehre selbst mit deinem Leib; denn er gehört dir; die anderen Menschen ringsum sollen verwirrt sein; hier soll uns der freigebige [Herr] Gönner sein [Anm.: „sūri“ = Gönner/Herr, Deutung offen; „maghavā“ oft Beiname Indras] [?]."}]},{"num":300,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 10","n_from":1590,"n_to":1592,"title_de":"Soma Pavamāna: Läuterung mit glänzender Farbe","note":"","units":[{"n":1590,"sa":"ayā rucā hariṇyā punāno viśvā dveṣāṃsi tarati sayugvabhiḥ sūro na sayugvabhiḥ\ndhārā pṛṣṭhasya rocate punāno aruṣo hariḥ\nviśvā yadrūpā pariyāsyṛkvabhiḥ saptāsyebhirṛkvabhiḥ","de":"Mit diesem falben Glanz geläutert überwindet er alle Feindseligkeiten mit den Gleichgespannten [Rossen], wie die Sonne mit den Gleichgespannten. Der Strom des Rückens leuchtet, geläutert, rötlich, falb; wenn du alle Gestalten umkreist mit den Hymnen-Singenden, mit den Siebenmündigen, Hymnen-Singenden."},{"n":1591,"sa":"prācīmanu pradiśaṃ pāti cekitatsaṃ raśmibhiryatate darśato ratho daivyo darśato rathaḥ\nagmannukthāni pauṃsyendraṃ jaitrāya harṣayata\nvajraśca yadbhavatho anapacyutā samatsvanapacyutā","de":"Nach der östlichen Richtung [Himmelsrichtung] schützt er, sichtbar, mit den Strahlen bemüht er sich; der Wagen ist sehenswert, göttlich, der sehenswerte Wagen. Die Lieder sind gekommen; erfreut Indra zum Siegen mit Mannestat; und wenn ihr beide, Unerschütterliche, [dort] seid, in den Kämpfen unerschütterlich."},{"n":1592,"sa":"tvaṃ ha tyatpaṇīnāṃ vido vasu saṃ mātṛbhirmarjayasi sva ā dama ṛtasya dhītibhirdame\nparāvato na sāma tadyatrā raṇanti dhītayaḥ\ntridhātubhiraruṣībhirvayo dadhe rocamāno vayo dadhe","de":"Du fürwahr hast jenen Schatz der Paṇis gefunden; du reinigst dich mit den Müttern im eigenen Haus, in der Wohnung, durch die Gedanken der Ordnung. Wie ein Sāman aus der Ferne, dort, wo die Gedanken erklingen; mit den dreifachen, rötlichen [Kühen] erlangt er Lebenskraft [vayas], leuchtend erlangt er Lebenskraft [Anm.: „raṇanti“ und „parāvato na sāma“ Deutung unsicher] [?]."}]},{"num":301,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 11","n_from":1593,"n_to":1593,"title_de":"Bitte um Denken und Gewinn","note":"","units":[{"n":1593,"sa":"uta no goṣaṇiṃ dhiyamaśvasāṃ vājasāmuta\nnṛvatkṛṇuhyūtaye","de":"Und schaffe uns ein Denken, das Rinder gewinnt, das Rosse gewinnt und Stärke gewinnt, [ein Denken] mit Männern, zur Hilfe."}]},{"num":302,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 12","n_from":1594,"n_to":1594,"title_de":"Bitte an Indra: Kenntnis des Wunsches","note":"","units":[{"n":1594,"sa":"śaśamānasya vā naraḥ svedasya satyaśavasaḥ\nvidā kāmasya venataḥ","de":"Kenne den Wunsch des Männer-Sängers [?], [der sich] im Schweiß [müht], des [Sängers] von echter Kraft, des Verlangenden [Anm.: Textzustand fraglich; Bezug „śaśamānasya … svedasya“ unsicher] [?]."}]},{"num":303,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 13","n_from":1595,"n_to":1595,"title_de":"Bitte um Gehör und Gnade der Söhne des Unsterblichen","note":"","units":[{"n":1595,"sa":"upa naḥ sūnavo giraḥ śṛṇvantvamṛtasya ye\nsumṛḍīkā bhavantu naḥ","de":"Unsere Lieder sollen die Söhne hören, die dem Unsterblichen zugehören [?] [Anm.: „amṛtasya ye“ auch: „die des Unsterblichen [Söhne] sind“]; gnädig sollen sie uns sein."}]},{"num":304,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 14","n_from":1596,"n_to":1598,"title_de":"Lobpreis des Himmel-und-Erde-Paares (Mitra-Varuṇa-Umfeld)","note":"","units":[{"n":1596,"sa":"pra vāṃ mahi dyavī abhyupastutiṃ bharāmahe\nśucī upa praśastaye","de":"Euch beiden, ihr großen Himmelsleuchtenden [?] [Anm.: „dyavī“ = Himmel und Erde bzw. das Götterpaar], bringen wir Lobpreis dar; ihr Strahlenden, [wir kommen] zu euch, damit ihr gepriesen werdet."},{"n":1597,"sa":"punāne tanvā mithaḥ svena dakṣeṇa rājathaḥ\nūhyāthe sanādṛtam","de":"Euch gegenseitig läuternd durch eure Leiber, herrscht ihr beide mit eigener Kraft; ihr fahrt [dahin, ein Gespann] von altersher verehrt [?]."},{"n":1598,"sa":"mahī mitrasya sādhathastarantī pipratī ṛtam\npari yajñaṃ ni ṣedathuḥ","de":"Groß seid ihr, ihr fördert das Werk des Mitra [?], ihr, die ihr hinübertragt und die Wahrheit erfüllt; rings um die Weihehandlung habt ihr euch niedergelassen."}]},{"num":305,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 15","n_from":1599,"n_to":1601,"title_de":"Indra: Lied, Gunst und Beistand","note":"","units":[{"n":1599,"sa":"ayamu te samatasi kapota iva garbhadhim\nvacastaccinna ohase","de":"Dieser [Soma/Lobgesang] ist für dich, der du [alles] zusammenhältst, wie eine Taube [ihre] Brut hegt [?] [Anm.: „garbhadhim“ unsicher]; dieses Wort trägt dich, ja, uns [ihm] entgegen [?] [Anm.: Textzustand fraglich]."},{"n":1600,"sa":"stotraṃ rādhānāṃ pate girvāho vīra yasya te\nvibhūtirastu sūnṛtā","de":"Das Loblied auf dich, Herr der Gaben, dessen Lieder du, Held, gern trägst: Dein Glanz möge freigebig-wahrhaftig sein."},{"n":1601,"sa":"ūrdhvastiṣṭhā na ūtaye 'sminvāje śatakrato\nsamanyeṣu bravāvahai","de":"Steh aufrecht zu unserem Beistand in diesem Wettkampf, Hundertkräftiger; in den anderen [Kämpfen] wollen wir beide miteinander reden [?]."}]},{"num":306,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 16","n_from":1602,"n_to":1604,"title_de":"Die Somakühe und die Grube: Vers vom Pressstein und Fass","note":"Bildhafte Verse zum Somapressen (Grube, Kufe, Milch/Honig); Deutung teils unsicher.","units":[{"n":1602,"sa":"gāva upa vadāvaṭe mahi yajñasya rapsudā\nubhā karṇā hiraṇyayā","de":"Die Kühe brüllen [?] bei der Grube, du Großer, der du der Weihehandlung Gaben schenkst [?]; beide Ohren [sind] golden."},{"n":1603,"sa":"abhyāramidadrayo niṣiktaṃ puṣkare madhu\navaṭasya visarjane","de":"Zu ihm hin haben die Presssteine [?] den Honig [Soma] in den Lotos [Anm.: „puṣkara“ auch: Kufe/Gefäß] gegossen, beim Ausgießen der Grube [?]."},{"n":1604,"sa":"siñcanti namasāvaṭamuccācakraṃ parijmānam\nnīcīnabāramakṣitam","de":"Sie gießen mit Verneigung die Grube [voll], die ein hochgestelltes Rad hat, die ringsum läuft, mit abwärts gerichteter Öffnung, unerschöpflich [?]."}]},{"num":307,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 17","n_from":1605,"n_to":1606,"title_de":"Indra: Furcht ablegen, Turvaśa und Yadu; Milchsoma","note":"","units":[{"n":1605,"sa":"mā bhema mā śramiṣmograsya sakhye tava\nmahatte vṛṣṇo abhicakṣyaṃ kṛtaṃ paśyema turvaśaṃ yadum","de":"Wir wollen nicht fürchten und nicht ermatten in der Freundschaft des Gewaltigen, deines; das große, [von dir] vollbrachte Wunder, Bulle, wollen wir sehen, [wie du] Turvaśa und Yadu [führst] [?] [Anm.: Wortlaut fraglich]."},{"n":1606,"sa":"savyāmanu sphigyaṃ vāvase vṛṣnā na dāno asya roṣati\nmadhvā saṃpṛktāḥ sāragheṇa dhenavastūyamehi dravā piba","de":"Nach links, hinter das Gesäß [?] [Anm.: „savyām anu sphigyam“ unsicher] hat [er] sich gewandt [?]; wie ein Bulle [?] – seine Gabe versagt nicht [?]; die mit Honig vermischten Kühe [die Milch] samt Sāragha [Anm.: Sāragha = Bienenhonig]: Eile herbei, lauf, trink [?] [Anm.: Textzustand fraglich]."}]},{"num":308,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 18","n_from":1607,"n_to":1608,"title_de":"Indra: Lieder, Lobgesänge, Kraft des Tausendfachen","note":"","units":[{"n":1607,"sa":"imā u tvā purūvaso giro vardhantu yā mama\npāvakavarṇāḥ śucayo vipaścito 'bhi stomairanūṣata","de":"Diese meine Lieder, die ich [sprach], sollen dich, Vielgutreicher, stärken; strahlend leuchtend wie Feuer, rein, die Weisen, haben dir mit Lobgesängen zugejubelt."},{"n":1608,"sa":"ayaṃ sahasramṛṣibhiḥ sahaskṛtaḥ samudra iva paprathe\nsatyaḥ so asya mahimā gṛṇe śavo yajñeṣu viprarājye","de":"Dieser [Indra] hat sich, tausendfach von den Sehern, kraftgewirkt, wie ein Meer ausgebreitet; wahr ist diese seine Größe; ich preise [seine] Stärke bei den Weihehandlungen, in der Herrschaft der Redekundigen [?]."}]},{"num":309,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 19","n_from":1609,"n_to":1610,"title_de":"Soma für Indra: Reichtum, Kraft, Honigsaft","note":"","units":[{"n":1609,"sa":"yasyāyaṃ viśva āryo dāsaḥ śevadhipā ariḥ\ntiraścidarye ruśame pavīravi tubhyetso ajyate rayiḥ","de":"Für den [Indra?], dem dieser ganze Ārya, der Dāsa, der Hüter des Schatzes, der Feind [untertan ist] [?]; dem Kinderreichen, dem Roten [?], dem Läuterer [?]: dir wird dieser Reichtum gesalbt [?] [Anm.: Textzustand fraglich; Wortlaut bei „śevadhipā ariḥ“ und „tiraś cid arye“ unsicher]."},{"n":1610,"sa":"turaṇyavo madhumantaṃ ghṛtaścataṃ viprāso arkamānṛcuḥ\nasme rayiḥ paprathe vṛṣṇyaṃ śavo 'sme svānāsa indavaḥ","de":"Die Eiligen [haben] den honigreichen, buttertriefenden Lobspruch die Weisen gesungen; uns wurde Reichtum, männliche Kraft weit; uns [gehören] die eigenen Säfte, die Tropfen [Soma]."}]},{"num":310,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 20","n_from":1611,"n_to":1613,"title_de":"Soma-Pavamāna: Gaben, Freundschaft, Leuchten","note":"","units":[{"n":1611,"sa":"gomanna indo aśvavatsutaḥ sudakṣa dhaniva\nśuciṃ ca varṇamadhi goṣu dhārya","de":"Uns [gib], Indu [Tropfen], Rinder und Rosse, [du] Ausgepresster, Geschickter, wie ein Bogen [?]; und die reine Farbe lege in die Kühe [Milch]."},{"n":1612,"sa":"sa no harīṇāṃ pata indo devapsarastamaḥ\nsakheva sakhye naryo ruce bhava","de":"Er, unser Herr der Falben, Indu, der göttergefälligste; wie ein Freund dem Freund, sei als Männlicher [uns] zum Licht [?]."},{"n":1613,"sa":"sanemi tvamasmadā adevaṃ kaṃ cidatriṇam\nsāhvāṃ indo pari bādho apa dvayum","de":"Besiege du für uns jeden gottlosen, gierigen Menschen [?]; du Indu, bezwinge, halte ringsum ab, drücke weg die Zwiefalt [Falschheit] [?] [Anm.: „dvayum“ = Doppelzüngigkeit/Falschheit]."}]},{"num":311,"loc":"Prapāṭhaka VII, Ardha 3, Gruppe 21","n_from":1614,"n_to":1616,"title_de":"Soma-Pavamāna: Salbung, Lied und Lauf des Rosses","note":"","units":[{"n":1614,"sa":"añjate vyañjate samañjate kratuṃ rihanti madhvābhyañjate\nsindhoru 'cchvāse patayantamukṣaṇaṃ hiraṇyapāvāḥ paśumapsu gṛbhṇate","de":"Sie salben, sie schmücken, sie salben ringsum den Willen [Soma]; sie lecken [ihn], sie salben ihn mit Honig; beim Aufschwellen des Stroms [?], den herabfliegenden Bullen, die goldrein Läuternden fassen sie im Wasser als Tier [?] [Anm.: Wortlaut und Bezug unsicher]."},{"n":1615,"sa":"vipaścite pavamānāya gāyata mahī na dhārātyandho arṣati\nahirna jūrṇāmati sarpati tvacamatyo na krīḍannasaradvṛṣā hariḥ","de":"Singt dem weisen, sich läuternden [Soma]; wie ein Strom, der große Tropfen der Speise [Soma] fließt hinüber; wie eine Schlange kriecht er über die alte Haut, wie ein Ross spielend schreitet er, der Bulle, der Falbe, [in den Filter] [?]."},{"n":1616,"sa":"agrego rājāpyastaviṣyate vimāno ahnāṃ bhuvaneṣvarpitaḥ\nharirghṛtasnuḥ sudṛśīko arṇavo jyotīrathaḥ pavate rāya okyaḥ","de":"An der Spitze gehend, als König, wird er, der Ross-Gleiche, aufs Beste angetrieben [?]; der Ermesser der Tage, in den Welten niedergelegt, der Falbe, butterträufelnd, schön anzus
