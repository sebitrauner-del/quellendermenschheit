ṃ punanti vāreṇa\nyo devānviśvāṃ itpari madena saha gacchati","de":"Diesen begehrten Falben, den Braunen, klären sie mit dem Haarsieb; der zu allen Göttern mit Rausch zugleich geht."},{"n":553,"sa":"pra sunvānāsyāndhaso marto na vaṣṭa tadvacaḥ\napa śvānamarādhasaṃ hatā makhaṃ na bhṛgavaḥ","de":"Vorwärts, für den Pressenden des Saftes will der Sterbliche jenes Wort nicht; schlagt den Hund, den Nichtgeber weg, wie die Bhṛgus den Makha [?]."}]},{"num":9,"loc":"Prapāṭhaka VI, Ardha 2, Daśati 7","n_from":554,"n_to":565,"title_de":"Soma Pavamāna: Kühe, Milch und Sonnenwagen","note":"","units":[{"n":554,"sa":"abhi priyāṇi pavate canohito nāmāni yahvo adhi yeṣu vardhate\nā sūryasya bṛhato bṛhannadhi rathaṃ viṣvañcamaruhadvicakṣaṇaḥ","de":"Zu den lieben (Namen) klärt er sich, zufriedengestellt [?] [Anm.: canohita unsicher], der junge, zu den Namen, in denen er wächst; hinauf stieg der Weitschauende auf den großen Wagen der großen Sonne, der nach allen Seiten fährt [?]."},{"n":555,"sa":"acodaso no dhanvantvindavaḥ pra svānāso bṛhaddeveṣu harayaḥ\nvi cidaśnānā iṣayo arātayo 'ryo naḥ santu saniṣantu no dhiyaḥ","de":"Ungetrieben sollen uns die Tropfen strömen; vorwärts die tönenden, hoch unter den Göttern, die Falben; auch die zerteilenden Antriebe, die Nichtgaben [?] ... Herren sollen uns sein, mögen die Gedanken gewinnen [Anm.: Textzustand fraglich]."},{"n":556,"sa":"eṣa pra kośe madhumāṃ acikradadindrasya vajro vapuṣo vapuṣṭamaḥ\nabhyR^ī3tasya sudughā ghṛtaścuto vāśrā arṣanti payasā ca ghenavaḥ","de":"Dieser hat vorwärts im Krug, honigreich, gebrüllt, Indras Keule, der Gestaltigste der Gestalten; zum Ordnungsvollen [Anm.: ṛta, Textzustand fraglich] hin strömen die Gutmelkenden, fettrieselnd, und die Milchkühe mit Milch."},{"n":557,"sa":"pro ayāsīdindurindrasya niṣkṛtaṃ sakhā sakhyurna pra mināti saṅgiram\nmarya iva yuvatibhiḥ samarṣati somaḥ kalaśe śatayāmanā pathā","de":"Hervor ging der Tropfen zu Indras Bestimmungsort, Freund dem Freund, er bricht nicht das Übereinkommen; wie ein Mann mit jungen Frauen strömt Soma zu im Krug, auf hundertwegiger Bahn."},{"n":558,"sa":"dhartā divaḥ pavate kṛtvyo raso dakṣo devānāmanumādyo nṛbhiḥ\nhariḥ sṛjāno atyo na satvabhirvṛthā pājāṃsi kṛṇuṣe nadīṣvā","de":"Der Träger des Himmels klärt sich, der zu bewirkende Saft, der Geschickte der Götter, von Männern nachzuberauschen; der Falbe, losgelassen wie ein Ross mit Kräften, mühelos [?] schaffst du Kräfte in den Strömen."},{"n":559,"sa":"vṛṣā matīnāṃ pavate vicakṣaṇaḥ somo ahnāṃ pratarītoṣasāṃ divaḥ\nprāṇā sindhūnāṃ kalaśāṃ acikradadindrasya hārdyāviśanmanīṣibhiḥ","de":"Der Stier der Gedanken klärt sich, der Weitschauende, Soma, der Tage Hinüberführer, der Morgenröten des Himmels; der Ströme Atem, hat er die Krüge angebrüllt; in Indras Herzenswunsch ging er ein mit den Weisen."},{"n":560,"sa":"trirasmai sapta dhenavo duduhrire satyāmāśiraṃ parame vyomani\ncatvāryanyā bhuvanāni nirṇije cārūṇi cakre yadṛtairavardhata","de":"Dreimal molken ihm sieben Kühe das Wahre, das Beigemischte, im höchsten Himmelsraum; vier andere Welten machte er zur Reinigung lieblich, als er durch die Ordnungen wuchs [?]."},{"n":561,"sa":"indrāya soma suṣutaḥ pari sravāpāmīvā bhavatu rakṣasā saha\nmā te rasasya matsata dvayāvino draviṇasvanta iha santvindavaḥ","de":"Für Indra, Soma, gut gepresst, ströme ringsum; Leid soll samt den Rakṣas [weg] sein; nicht sollen sich an deinem Saft die Doppelzüngigen berauschen; hier sollen die Tropfen reich an Gut sein."},{"n":562,"sa":"asāvi somo aruṣo vṛṣā harī rājeva dasmo abhi gā acikradat\npunāno vāramatyeṣyavyayaṃ śyeno na yoniṃ ghṛtavantamāsadat","de":"Gepresst ist Soma, rötlich, Stier, Falber, wie ein König, wundertätig, zu den Kühen hat er gebrüllt; sich klärend wirst du das Schafshaar-Sieb überschreiten; wie ein Falke setzte er sich in den fettigen Schoß."},{"n":563,"sa":"pra devamacchā madhumanta indavo 'siṣyadanta gāva ā na dhenavaḥ\nbarhiṣado vacanāvanta ūdhabhiḥ parisrutamusriyā nirṇijaṃ dhire","de":"Hin zum Gott strömten honigreiche Tropfen; die Kühe, Milchkühe zu uns; auf dem Barhis sitzend, wortgewaltig, mit Eutern; den ringsum Strömenden haben die Kühe zum Reinigungsgewand getragen [?]."},{"n":564,"sa":"añjate vyañjate samañjate kratuṃ rihanti maghvābhyañjate\nsindhoru 'cchvāse patayantamukṣaṇaṃ hiraṇyapāvāḥ paśumapsu gṛbhṇate","de":"Sie salben, salben aus, salben zusammen die Kraft, sie lecken, die Freigebigen salben; im Aufschwellen [?] des Stromes fassen die Goldgeläuterten den fliegenden Stier, das Vieh in den Wassern."},{"n":565,"sa":"pavitraṃ te vitataṃ brahmaṇaspate prabhurgātrāṇi paryeṣi viśvataḥ\nataptatanūrna tadāmo aśnute śṛtāsa idvahantaḥ saṃ tadāśata","de":"Dein Seihtuch ist ausgespannt, Herr des Brahman; Herrscher, deine Glieder durchschreitest du allseitig; der mit ungeglühtem Leib, der Rohe, erlangt das nicht; nur die Gegarten, die es tragen, erreichten es."}]},{"num":10,"loc":"Prapāṭhaka VI, Ardha 2, Daśati 8","n_from":566,"n_to":577,"title_de":"Soma Pavamāna: Ruf an die Freunde, den Läuterungssaft zu besingen","note":"Pavamāna-Lieder an den sich läuternden Soma; Tropfen (indu), Wollsieb (avya vāra), Kelch (kalaśa).","units":[{"n":566,"sa":"indramaccha sutā ime vṛṣaṇaṃ yantu harayaḥ\nśruṣṭe jātāsa indavaḥ svarvidaḥ","de":"Zu Indra hin wünschen diese gepressten Tropfen; die rötlichen [Anm.: harayaḥ, zugleich „Falben“ und Somatropfen] sollen zum Stier gehen. Auf deinen Ruf hin [?] wurden die Tropfen geboren, die das Himmelslicht finden."},{"n":567,"sa":"pra dhanvā soma jāgṛvirindrāyendo pari srava\ndyumantaṃ śuṣmamā bhara svarvidam","de":"Ström voran, Soma, du Wachsamer; für Indra, Tropfen, fließe rings; bring glanzvolle Kraft herbei, die das Himmelslicht findet."},{"n":568,"sa":"sakhāya ā ni ṣīdata punānāya pra gāyata\nśiśuṃ na yajñaiḥ pari bhūṣata śriye","de":"Freunde, setzt euch nieder; singt dem sich Läuternden vor; schmückt ihn wie ein Kind mit Weihehandlungen ringsum zum Glanz."},{"n":569,"sa":"taṃ vaḥ sakhāyo madāya punānamabhi gāyata\nśiśuṃ na havyaiḥ svadayanta gūrtibhiḥ","de":"Ihn, den sich Läuternden, besingt, ihr Freunde, euch zum Rausch; wie ein Kind haben sie ihn mit Opfergaben und Loblied-Rufen wohlschmeckend gemacht [?]."},{"n":570,"sa":"prāṇā śiśurmahīnāṃ hinvannṛtasya dīdhitim\nviśvā pari priyā bhuvadadha dvitā","de":"Das Kind der Mächtigen [?] brüllt [?] hervor und treibt das Leuchten/Gedenken des Ṛta an; alles Liebe hat er ringsum umfasst, und zwar zweifach. [Anm.: prāṇā unsicher.]"},{"n":571,"sa":"pavasva devavītaya indo dhārābhirojasā\nā kalaśaṃ madhumāntsoma naḥ sadaḥ","de":"Fließe zum Götterschmaus, Tropfen, in Strömen, mit Kraft; zum Kelch, honigreicher Soma, setz dich für uns nieder."},{"n":572,"sa":"somaḥ punāna ūrmiṇāvyaṃ vāraṃ vi dhāvati\nagre vācaḥ pavamānaḥ kanikradat","de":"Soma, sich läuternd, läuft mit seiner Woge durch das Schafwollsieb; an der Spitze der Rede strömt er sich läuternd, laut brüllend."},{"n":573,"sa":"pra punānāya vedhase somāya vaca ucyate\nbhṛtiṃ na bharā matibhirjujoṣate","de":"Dem sich läuternden Weisen, dem Soma, wird das Wort gesprochen; wie einen Lohn bringend [?] hat er Gefallen an den Gedanken/Liedern."},{"n":574,"sa":"gomanna indo aśvavatsutaḥ sudakṣa dhaniva\nśuciṃ ca varṇamadhi goṣu dhārya","de":"Mit Kühen und Rossen versehen, Tropfen, bist du gepresst, Geschickter, wie ein Besitzer von Gütern [?]; die reine Farbe lege auf die Kühe [Anm.: die Milch]."},{"n":575,"sa":"asmabhyaṃ tvā vasuvidamabhi vāṇīranūṣata\ngobhiṣṭe varṇamabhi vāsayāmasi","de":"Dich, den Güterfinder, haben die Lieder für uns angejubelt; mit Kühen [Anm.: Milch] kleiden wir deine Farbe ein."},{"n":576,"sa":"pavate haryato harirati hvarāṃsi raṃhyā\nabhyarṣa stotṛbhyo vīravadyaśaḥ","de":"Er läutert sich, der Gelbliche, der Falbe, über Krümmungen [?] hinweg mit Ungestüm; ström hin zu den Sängern, zu heldenreichem Ruhm."},{"n":577,"sa":"pari kośaṃ madhuścutaṃ somaḥ punāno arṣati\nabhi vāṇīrṛṣīṇāṃ saptā nūṣata","de":"Rings zum Behälter, der Honig träufelt, strömt Soma sich läuternd; hin zu den Liedern der Ṛṣis jubeln die Sieben."}]},{"num":11,"loc":"Prapāṭhaka VI, Ardha 2, Daśati 9","n_from":578,"n_to":585,"title_de":"Soma Pavamāna: honigreicher Rausch für Indra","note":"","units":[{"n":578,"sa":"pavasva madhumattama indrāya soma kratuvittamo madaḥ\nmahi dyukṣatamo madaḥ","de":"Läutere dich, Honigreichster, für Indra, Soma, du Rausch, der die Einsicht am besten findet, großer, am meisten himmelwohnender [?] Rausch."},{"n":579,"sa":"abhi dyumnaṃ bṛhadyaśa iṣaspate didīhi deva devayum\nvi kośaṃ madhyamaṃ yuva","de":"Hin zum Glanz, weit berühmt, Herr der Labung, erstrahle, Gott, für den Götter Begehrenden; öffne [?] den mittleren Behälter, du Junger. [Anm.: vi kośam madhyamam yuva fraglich.]"},{"n":580,"sa":"ā sotā pari ṣiñcatāśvaṃ na stomamapturaṃ rajasturam\nvanaprakṣamudaprutam","de":"Gießt ihn zu, ihr Presser, ringsum, wie ein Loblied das Ross, den Tatkräftigen, der den Raum durcheilt, der im Holz [Anm.: Kufe] wächst [?], im Wasser schwimmt."},{"n":581,"sa":"etamu tyaṃ madacyutaṃ sahasradhāraṃ vṛṣabhaṃ divoduham\nviśvā vasūni bibhratam","de":"Diesen da, der Rausch träufelt, den tausendströmigen Stier, den Himmelsmelker, der alle Güter trägt."},{"n":582,"sa":"sa sunve yo vasūnāṃ yo rāyāmānetā ya iḍānām\nsomo yaḥ sukṣitīnām","de":"Er ist gepresst, der Herr der Güter, der Führer zu Reichtum, der der Labungen, Soma, der der gut Wohnenden [?]."},{"n":583,"sa":"tvaṃ hyā3ṅga daivyā pavamāna janimāni dyumattamaḥ\namṛtatvāya ghoṣayan","de":"Du ja, glänzendster Soma, läuterst dich, für göttliche Geschlechter [?], zur Unsterblichkeit ausrufend."},{"n":584,"sa":"eṣa sya dhārayā suto 'vyo vārebhiḥ pavate madintamaḥ\nkrīḍannūrmirapāmiva","de":"Dieser da, mit Strom gepresst, läutert sich durch die Schafshaare [Anm.: Wollsieb], der berauschendste, spielend wie die Welle der Wasser."},{"n":585,"sa":"ya usriyā api yā antaraśmani nirgā akṛntadojasā\nabhi vrajaṃ tatniṣe gavyamaśvyaṃ varmīva dhṛṣṇavā ruja\nOṃ varmīva dhṛṣṇavā ruja","de":"Der die kuhgleichen [?], auch die im Strahl/Zügel [?] befindlichen Rinder mit Kraft hervorschnitt: zum Pferch, der Kühe und Rosse birgt, hast du dich ausgestreckt; wie in einen Panzer gehüllt, Kühner, brich hindurch. Wie in einen Panzer gehüllt, Kühner, brich hindurch. [Anm.: Wiederholung mit Oṃ; Textzustand fraglich.]"}]}],"aranya":[{"num":1,"loc":"Āraṇya, Abschnitt 1","n_from":586,"n_to":594,"title_de":"Āraṇya: Indra-, Varuṇa- und Soma-Verse, Ich-Rede der Speise","note":"Gemischte Verse des Āraṇyakāṇḍa; Vers 594 ist eine Ich-Rede der Speise.","units":[{"n":586,"sa":"indra jyeṣṭhaṃ na ā bhara ojiṣṭhaṃ pupuri śravaḥ\nyaddidhṛkṣema vajrahasta rodasī obhe suśipra paprāḥ","de":"Indra, bring uns das Beste, Kraftvollste, füll uns mit Hörens-/Ruhmwertem, damit wir Halt gewinnen, Keulenhand; beide Welten, Schönlippiger, hast du erfüllt."},{"n":587,"sa":"indro rājā jagataścarṣaṇīnāmadhikṣamā viśvarūpaṃ yadasya\ntato dadāti dāśuṣe vasūni codadrādha upastutaṃ cidarvāk","de":"Indra ist König der Welt und der Völker, auf Erden herrschend, dessen Gestalt vielförmig ist; daher gibt er dem Verehrer Güter; und der Gunst antreibt, [komme] hierher, auch zu dem Gepriesenen [?]. [Anm.: Textzustand fraglich.]"},{"n":588,"sa":"yasyedamā rajoyujastuje jane vanaṃ svaḥ\nindrasya rantyaṃ bṛhat","de":"Wessen dies [?] ... den Raum-Anschirrer [?], dem Menschen zur Kraft, Wald, Licht: Indras Erfreuliches ist groß. [Anm.: Textzustand fraglich, Konstruktion unklar.]"},{"n":589,"sa":"uduttamaṃ varuṇa pāśamasmadavādhamaṃ vi madhyamaṃ śrathāya\nathāditya vrate vayaṃ tavānāgaso aditaye syāma","de":"Die oberste Schlinge, Varuṇa, löse von uns, die unterste schneide ab, die mittlere entwinde; dann, Āditya, mögen wir in deinem Gebot schuldlos vor Aditi sein."},{"n":590,"sa":"tvayā vayaṃ pavamānena soma bhare kṛtaṃ vi cinuyāma śaśvat\ntanno mitro varuṇo māmahantāmaditiḥ sindhuḥ pṛthivī uta dyauḥ","de":"Mit dir, dem sich läuternden, Soma, mögen wir in der Schlacht das Gewonnene stets [?] aussondern; das gewähren uns Mitra, Varuṇa, Aditi, Sindhu, Erde und Himmel."},{"n":591,"sa":"imaṃ vṛṣaṇaṃ kṛṇutaikaminmām","de":"Macht diesen zum Stier, mich zum Einzigen [?]. [Anm.: ekam in mām; Wortgrenzen unsicher.]"},{"n":592,"sa":"sa na indrāya yajyave varuṇāya marudbhyaḥ\nvarivovitparisrava","de":"Er ströme für uns, für den verehrungswürdigen Indra, für Varuṇa, für die Marut, weiten Raum findend, ringsum."},{"n":593,"sa":"enā viśvānyarya ā dyumnāni mānuṣāṇām\nsiṣāsanto vanāmahe","de":"Hiermit, Herr, mögen wir alle Glanzgaben der Menschen, sie zu gewinnen wünschend, erwerben."},{"n":594,"sa":"ahamasmi prathamajā ṛtasya pūrvaṃ devebhyo amṛtasya nāma\nyo mā dadāti sa idevamāvadahamannamannamadantamadmi","de":"Ich bin der Erstgeborene des Ṛta, älter als die Götter, Wesen [Anm.: nāma, „Name“] des Unsterblichen; wer mich gibt, der hilft mir fürwahr; ich, die Speise, esse den, der Speise isst."}]},{"num":2,"loc":"Āraṇya, Abschnitt 2","n_from":595,"n_to":601,"title_de":"Āraṇya: Milch in den Kühen, Indra mit den Falben, Vasiṣṭhas Rathantara","note":"","units":[{"n":595,"sa":"tvametadadhārayaḥ kṛṣṇāsu rohiṇīṣu ca\nparuṣṇīṣu ruśatpayaḥ","de":"Du hast dies getragen: in den schwarzen und in den roten Kühen und in den scheckigen [?] die helle Milch."},{"n":596,"sa":"arūrucaduṣasaḥ pṛśniragriya ukṣā mimeti bhuvaneṣu vājayuḥ\nmāyāvino mamire asya māyayā nṛcakṣasaḥ pitaro garbhamādadhuḥ","de":"Der gescheckte Stier, der erste, ließ die Morgenröten erstrahlen; er brüllt in den Welten, nach Kraft strebend; die Listenreichen bemaßen durch seine Kraft, die männerschauenden Väter setzten den Keim ein."},{"n":597,"sa":"indra iddharyoḥ sacā sammiśla ā vacoyujā\nindro vajrī hiraṇyayaḥ","de":"Indra, zusammen mit den beiden Falben, den beiden durch das Wort Angeschirrten, vereint; Indra, der Keulenträger, der goldene."},{"n":598,"sa":"indra vājeṣu no 'va sahasrapradhaneṣu ca\nugra ugrābhirūtibhiḥ","de":"Indra, hilf uns in den Kraftproben und in den tausendfach gewinnenden Kämpfen; Gewaltiger, mit gewaltigen Hilfen."},{"n":599,"sa":"prathaśca yasya saprathaśca nāmānuṣṭubhasya haviṣo haviryat\ndhāturdyutānātsavituśca viṣṇo rathantaramā jabhārā vasiṣṭhaḥ","de":"Dessen Name Prathas und Saprathas [?], die Gabe der anuṣṭubh-haften Opfergabe [?]; aus dem Glanz des Dhātṛ und des Savitṛ, o Viṣṇu, holte Vasiṣṭha das Rathantara herbei. [Anm.: Textzustand fraglich.]"},{"n":600,"sa":"niyutvānvāyavā gahyayaṃ śukro ayāmi te\ngantāsi sunvato gṛham","de":"Vāyu, Niyut-Besitzer, komm her; dieser helle Soma ist dir dargeboten [?]; du wirst zum Haus des Pressenden kommen."},{"n":601,"sa":"yajjāyathā apūrvya maghavanvṛtrahatyāya\ntatpṛthivīmaprathayastadastabhnā uto divam","de":"Als du geboren wurdest, Unvergleichlicher, Maghavan, zum Erschlagen des Vṛtra, da hast du die Erde ausgebreitet und auch den Himmel gestützt."}]},{"num":3,"loc":"Āraṇya, Abschnitt 3","n_from":602,"n_to":614,"title_de":"Āraṇya: Glanz und Ruhm, Soma, Agni, Nacht, Indras Taten","note":"Vermischte Verse; teils Gebete um Glanz und Ruhm, teils Parallelen zum Ṛgveda.","units":[{"n":602,"sa":"mayi varco atho yaśo 'tho yajñasya yatpayaḥ\nparameṣṭhī prajāpatirdivi dyāmiva dṛṃhatu","de":"In mir sei Glanz und Ruhm und was die Milch [Anm.: Kraft] der Weihehandlung ist; Parameṣṭhin Prajāpati möge es festigen, wie den Himmel im Himmel [?]."},{"n":603,"sa":"saṃ te payāṃsi samu yantu vājāḥ saṃ vṛṣṇyānyabhimātiṣāhaḥ\nāpyāyamāno amṛtāya soma divi śravāṃsyuttamāni dhiṣva","de":"Zu dir sollen die Milchsäfte zusammenströmen, zusammen die Stärken, die Mannheiten, Bezwinger der Feinde; anschwellend zur Unsterblichkeit, Soma, setze im Himmel die höchsten Ruhmestaten fest."},{"n":604,"sa":"tvamimā oṣadhīḥ soma viśvāstvamapo ajanayastvaṃ gāḥ\ntvamātanorurvā3ntarikṣaṃ tvaṃ jyotiṣā vi tamo vavartha","de":"Du, Soma, hast alle diese Pflanzen, du die Wasser, du die Kühe gezeugt; du hast den weiten Luftraum ausgespannt, du hast mit Licht das Dunkel vertrieben."},{"n":605,"sa":"agnimīḍe purohitaṃ yajñasya devamṛtvijam\nhotāraṃ ratnadhātamam","de":"Agni rufe ich an, den Hauspriester [Anm.: wörtlich „den Vorangestellten“], den Gott, den Priester der Weihehandlung zur rechten Zeit, den Rufer, den besten Schatzbringer."},{"n":606,"sa":"te manvata prathamaṃ nāma gonāṃ triḥ sapta paramaṃ nāma janān\ntā jānatīrabhyanūṣata kṣā āvirbhuvannaruṇīryaśasā gāvaḥ","de":"Sie erkannten den ersten Namen der Kühe, dreimal sieben den höchsten Namen der Geschlechter [?]; diese, wissend, jubelten sie an; die Erden [?] ... es erschienen die rötlichen Kühe mit Herrlichkeit. [Anm.: Textzustand fraglich.]"},{"n":607,"sa":"samanyā yantyupayantyanyāḥ samānamūrvaṃ nadyaspṛṇanti\ntamū śuciṃ śucayo dīdivāṃsamapānnapātamupa yantyāpaḥ","de":"Die einen fließen zusammen, die anderen hinzu; dieselbe Flut füllen die Flüsse; ihn, den Reinen, Strahlenden, den Sohn der Wasser, suchen die reinen Wasser auf."},{"n":608,"sa":"ā prāgādbhadrā yuvatirahnaḥ ketūntsamīrtsati\nabhūdbhadrā niveśanī viśvasya jagato rātrī","de":"Die glückliche junge Frau [Anm.: die Nacht] ist herangekommen; sie will die Zeichen des Tages in Bewegung setzen [?]. Glücklich wurde sie zur Ruhestätte, die Nacht der ganzen Welt."},{"n":609,"sa":"prakṣasya vṛṣṇo aruṣasya nū mahaḥ pra no vaco vidathā jātavedase\nvaiśvānarāya matirnavyase śuciḥ soma iva pavate cāruragnaye","de":"Für den mächtigen, stierhaften, rötlichen Prakṣa [?] bringen wir nun unser Wort hervor, in Weisheiten, für Jātavedas; für den neuen Vaiśvānara ist das Gedicht; rein wie Soma läutert sich der Anmutige für Agni."},{"n":610,"sa":"viśve devā mama śṛṇvantu yajñamubhe rodasī apāṃ napācca manma\nmā vo vacāṃsi paricakṣyāṇi vocaṃ sumneṣvidvo antamā madema","de":"Alle Götter sollen meine Weihehandlung hören, beide Welten und der Sohn der Wasser mein Gebet; nicht möge ich euch Worte sprechen, die verwerflich wären; in eurer Gunst, ihr Nächsten, mögen wir uns erfreuen."},{"n":611,"sa":"yaśo mā dyāvāpṛthivī yaśo mendrabṛhaspatī\nyaśo bhagasya vindatu yaśo mā pratimucyatām\nyaśasvyā3syāḥ saṃ sado 'haṃ pravaditā syām","de":"Ruhm möge mich finden bei Himmel und Erde, Ruhm bei Indra und Bṛhaspati, Ruhm bei Bhaga; Ruhm möge mir angelegt werden [?]. Ruhmreich möge ich in dieser Versammlung Sprecher sein."},{"n":612,"sa":"indrasya nu vīryāṇi pravocaṃ yāni cakāra prathamāni vajrī\nahannahimanvapastatarda pra vakṣaṇā abhinatparvatānām","de":"Indras Heldentaten will ich nun verkünden, die als erste der Keulenträger vollbrachte: Er erschlug die Schlange, durchbohrte die Wasser [Anm.: Wasserläufe], brach die Rinnen der Berge auf."},{"n":613,"sa":"agnirasmi janmanā jātavedā ghṛtaṃ me cakṣuramṛtaṃ ma āsan\ntridhāturarko rajaso vimāno 'jasraṃ jyotirhavirasmi sarvam","de":"Agni bin ich von Geburt, Jātavedas; Schmelzbutter ist mein Auge, Unsterbliches ist in meinem Mund; dreifach ist der Strahl, Ausmesser des Raumes, unaufhörliches Licht; die Opfergabe bin ich, alles."},{"n":614,"sa":"pātyagnirvipo agraṃ padaṃ veḥ pāti yahvaścaraṇaṃ sūryasya\npāti nābhā saptaśīrṣāṇamagniḥ","de":"Es behütet Agni, der Weise, den Anfang, den Standort des Vogels [?]; es behütet der Junge den Gang der Sonne; am Nabel behütet Agni den Siebenköpfigen [?]. [Anm.: Textzustand fraglich.]"}]},{"num":4,"loc":"Āraṇya, Abschnitt 4","n_from":615,"n_to":626,"title_de":"Āraṇya: Agni, Jahreszeiten, Puruṣa-Hymnus, Indras Falben","note":"Verse 617-621 sind der Puruṣa-Hymnus (vgl. RV 10.90).","units":[{"n":615,"sa":"bhrājantyagne samidhāna dīdivo jihvā caratyantarāsani\nsa tvaṃ no agne payasā vasuvidrayiṃ varco dṛśe 'dāḥ","de":"Es glänzen [Anm.: Subjekt fehlt, vermutlich Flammen], Agni, Entflammter, Leuchtender; die Zunge bewegt sich im Mund; du, Agni, hast uns mit Milch, Güterfinder, Reichtum und Glanz zum Sehen gegeben [?]."},{"n":616,"sa":"vasanta innu rantyo grīṣma innu rantyaḥ\nvarṣāṇyanu śarado hemantaḥ śiśira innu rantyaḥ","de":"Im Frühling ist er erfreulich, im Sommer erfreulich, dann in den Regenzeiten, im Herbst, im Winter, in der kühlen Jahreszeit erfreulich."},{"n":617,"sa":"sahasraśīrṣā puruṣaḥ sahasrākṣaḥ sahasrapāt\nsa bhūmiṃ sarvato vṛtvātyatiṣṭhaddaśāṅgulam","de":"Tausendköpfig ist der Puruṣa, tausendäugig, tausendfüßig; er umschloss die Erde allseits und überragte sie um zehn Fingerbreit."},{"n":618,"sa":"tripādūrdhva udaitpuruṣaḥ pado 'syehābhavatpunaḥ\ntathā viṣvaṅ vyakrāmadaśanānaśane abhi","de":"Mit drei Vierteln stieg der Puruṣa empor; ein Viertel von ihm entstand hier wieder; dann schritt er allseits aus zu dem Essenden und dem Nichtessenden."},{"n":619,"sa":"puruṣa evedaṃ sarvaṃ yadbhūtaṃ yacca bhāvyam\npādo 'sya sarvā bhūtāni tripādasyāmṛtaṃ divi","de":"Puruṣa ist eben dies All, was war und was sein wird; ein Viertel von ihm sind alle Wesen, drei Viertel von ihm das Unsterbliche im Himmel."},{"n":620,"sa":"tāvānasya mahimā tato jyāyāṃśca pūruṣaḥ\nutāmṛtatvasyeśāno yadannenātirohati","de":"So groß ist seine Größe, und noch größer der Puruṣa; und er ist Herr der Unsterblichkeit, weil er durch Speise über sich hinauswächst."},{"n":621,"sa":"tato virāḍajāyata virājo adhi pūruṣaḥ\nsa jāto atyaricyata paścādbhūmimatho puraḥ","de":"Daraus wurde Virāj geboren, aus Virāj der Puruṣa; geboren überragte er, hinterher die Erde, dann die Wohnstätten."},{"n":622,"sa":"manye vāṃ dyāvāpṛthivī subhojasau ye aprathethāmamitamabhi yojanam\ndyāvāpṛthivī bhavataṃ syone te no muñcatamaṃhasaḥ","de":"Ich denke an euch, Himmel und Erde, ihr guten Speisegeber, die ihr die unermessliche Strecke ausgebreitet habt; Himmel und Erde, seid gütig; ihr befreit uns von Bedrängnis."},{"n":623,"sa":"harī ta indra śmaśrūṇyuto te haritau hari\ntaṃ tvā stuvanti kavayaḥ puruṣāso vanargavaḥ","de":"Deine beiden Falben, Indra, [sind] die Bärte, und deine [Haare] falbfarben, o Falber; dich preisen die Dichter, die Männer, die nach Kühen im Wald verlangen [?]."},{"n":624,"sa":"yadvarco hiraṇyasya yadvā varco gavāmuta\nsatyasya brahmaṇo varcastena mā saṃ sṛjāmasi","de":"Der Glanz des Goldes und der Glanz der Kühe, der Glanz des Wahren, des Brahman: damit verbinden wir mich [?]."},{"n":625,"sa":"sahastanna indra daddhyoja īśe hyasya mahato virapśin\nkratuṃ na nṛmṇaṃ sthaviraṃ ca vājaṃ vṛtreṣu śatrūntsuhanā kṛdhī naḥ","de":"Kampfkraft, Indra, gib uns; denn du herrschst über dies Große, Preisender; Einsicht, Mannhaftigkeit, festes Ansehen [?] und Stärke; in den Kämpfen mach uns die Feinde zu leicht Erschlagbaren."},{"n":626,"sa":"saharṣabhāḥ sahavatsā udeta viśvā rūpāṇī bibhratīrdvyūdnīḥ\nuruḥ pṛthurayaṃ vo astu loka imā āpaḥ suprapāṇā iha sta","de":"Mit Stieren, mit Kälbern kommt heraus, alle Gestalten tragend, ihr Zweieuterigen [?]; weit und breit sei euch diese Welt; ihr Wasser, mit guter Tränke, seid hier."}]},{"num":5,"loc":"Āraṇya, Abschnitt 5","n_from":627,"n_to":640,"title_de":"Āraṇya: Agni und Sūrya, Verse an die Sonne","note":"Vers 629 entspricht RV 1.115.1; Verse 633-640 sind Sonnenverse (RV 1.50).","units":[{"n":627,"sa":"agna āyūṃṣi pavasa āsuvorjamiṣaṃ ca naḥ\nāre bādhasva ducchunām","de":"Agni, du läuterst Leben, und Kraft und Labung für uns; treibe fern weg das Unheil."},{"n":628,"sa":"vibhrāṅbṛhatpibatu somyaṃ madhvāyurdadhadyajñapatāvavihrutam\nvātajūto yo abhirakṣati tmanā prajāḥ piparti bahudhā vi rājati","de":"Der Strahlende, Große soll den Soma trinken, den honigsüßen, Leben schenkend dem Herrn der Weihehandlung, unversehrt; der, vom Wind getrieben, selbst die Geschöpfe schützt, sie nährt und vielfach leuchtet. [Anm.: Subjekt nicht genannt.]"},{"n":629,"sa":"citraṃ devānāmudagādanīkaṃ cakṣurmitrasya varuṇasyāgneḥ\nāprā dyāvāpṛthivī antarikṣaṃ sūrya ātmā jagatastasthuṣaśca","de":"Das bunte Antlitz [Anm.: Banner] der Götter ist aufgegangen, das Auge von Mitra, Varuṇa und Agni; es hat Himmel und Erde und den Luftraum erfüllt: Sūrya ist das Selbst des Beweglichen und des Stehenden."},{"n":630,"sa":"āyaṃ gauḥ pṛśnirakramīdasadanmātaraṃ puraḥ\npitaraṃ ca prayantsvaḥ","de":"Diese scheckige Kuh ist gekommen; sie hat sich vor der Mutter niedergelassen und geht zum Vater hin, zum Licht."},{"n":631,"sa":"antaścarati rocanāsya prāṇādapānatī\nvyakhyanmahiṣo divam","de":"Innen bewegt sich sein Leuchten, ausatmend nach dem Einatmen; der Büffel hat den Himmel überschaut."},{"n":632,"sa":"triṃṣaddhāma vi rājati vākpataṅgāya dhīyate\nprati vastoraha dyubhiḥ","de":"Dreißig Stätten leuchtet er; die Rede wird dem Vogel gegeben [?]; dem Morgen entgegen, mit den Tagen."},{"n":633,"sa":"apa tye tāyavo yathā nakṣatrā yantyaktubhiḥ\nsūrāya viśvacakṣase","de":"Weg gehen jene Sterne wie Diebe mit den Nächten, der allschauenden Sonne wegen."},{"n":634,"sa":"adṛśrannasya ketavo vi raśmayo janāṃ anu\nbhrājanto agnayo yathā","de":"Sichtbar wurden seine Zeichen, die Strahlen, bei den Menschen entlang, leuchtend wie Feuer."},{"n":635,"sa":"taraṇirviśvadarśato jyotiṣkṛdasi sūrya\nviśvamābhāsi rocanam","de":"Rasch, allschaubar, Lichtmacher bist du, Sūrya; du erleuchtest den ganzen Lichtraum."},{"n":636,"sa":"pratyaṅ devānāṃ viśaḥ pratyaṅṅudeṣi mānuṣān\npratyaṅ viśvaṃ svardṛśe","de":"Den Scharen der Götter gegenüber gehst du auf, den Menschen gegenüber, dem All gegenüber, damit man das Licht sehe."},{"n":637,"sa":"yenā pāvaka cakṣasā bhuraṇyantaṃ janāṃ anu\ntvaṃ varuṇa paśyasi","de":"Mit dem Blick, o Läuterer, mit dem du auf den Regsamen, die Menschen entlang, schaust, du, Varuṇa."},{"n":638,"sa":"uddyāmeṣi rajaḥ pṛthvahā mimāno aktubhiḥ\npaśyañjanmāni sūrya","de":"Du gehst auf in den Himmel, den weiten Raum, die Tage mit den Nächten messend, die Geburten [Anm.: Wesen] schauend, Sūrya."},{"n":639,"sa":"ayukta sapta śundhyuvaḥ sūro rathasya naptryaḥ\ntābhiryāti svayuktibhiḥ","de":"Sieben Stuten hat der Sūrya angeschirrt, die reinigenden [?], die Töchter [?] des Wagens; mit ihnen fährt er, den selbst Angeschirrten."},{"n":640,"sa":"sapta tvā harito rathe vahanti deva sūrya\nśociṣkeśaṃ vicakṣaṇa","de":"Sieben Falben ziehen dich am Wagen, Gott Sūrya, du Flammenhaariger, Weitschauender."}]}],"mahanamnya":[{"num":1,"loc":"Pañca purīṣapadāni","n_from":641,"n_to":650,"title_de":"Mahānāmnī-Verse: Indra-Anrufungen und Refrain evā hi","note":"Mahānāmnī-Verse mit Stobha-Einschüben; der Textzustand ist teils verderbt.","units":[{"n":641,"sa":"vidā maghavan vidā gātumanuśaṃsiṣo diśaḥ\nśikṣā śacīnāṃ pate pūrvīṇāṃ purūvaso","de":"Erkenne, Maghavan, erkenne den Weg, die Richtungen der Gepriesenen [?]; hilf, Herr der Kräfte, der vielen, Vielgütiger."},{"n":642,"sa":"ābhiṣṭvamabhiṣṭibhiḥ svā '3rnnāṃśuḥ\npracetana pracetayendra dyumnāya na iṣe","de":"Mit deinen Hilfen [kommst] du [?] ... wie ein Halm im Himmel [?]; Aufmerksamer, mach aufmerksam, Indra, zu Glanz und Labung für uns. [Anm.: Textzustand fraglich; „svā3rnnāṃśuḥ“ unklar.]"},{"n":643,"sa":"evā hi śakro rāye vājāya vajrivaḥ\nśaviṣṭha vajrinnṛñjase maṃhiṣṭha vajrinnṛñjasa\nā yāhi piba matsva","de":"Denn so ist der Mächtige, zu Reichtum, zu Kraft, Keulenträger; Stärkster, Keulenträger, du machst dich gerade [?], Freigebigster, Keulenträger, du gehst gerade; komm, trink, berausche dich."},{"n":644,"sa":"vidā rāye suvīryaṃ bhavo vājānāṃ patirvaśāṃ anu\nmaṃhiṣṭha vajrinnṛñjase yaḥ śaviṣṭhaḥ śūrāṇām","de":"Erkenne für Reichtum gute Mannhaftigkeit; sei nach Wunsch Herr der Kräfte; als Freigebigster, Keulenträger, strebst du gerade, der du der Stärkste der Helden bist."},{"n":645,"sa":"yo maṃhiṣṭho maghonāmṃśurnna śociḥ\ncikitvo abhi no nayeṃdro vide tamu stuhi","de":"Der der Freigebigste der Gebenden ist, wie ein Halm, Glanz; Einsichtiger, führ uns hin; Indra findet [?]; ihn preise. [Anm.: Textzustand fraglich.]"},{"n":646,"sa":"īśe hi śakrastamūtaye havāmahe jetāramaparājitam\nsa naḥ svarṣadati dviṣaḥ kratuśchanda ṛtaṃ bṛhat","de":"Er vermag es, der Mächtige; ihn rufen wir zur Hilfe, den Sieger, den Unbesiegten; er soll uns das Licht gewinnen über die Hasser hinweg; Einsicht, Vers, Ṛta, Großes [?]. [Anm.: kratuś chanda ṛtaṃ bṛhat unklar.]"},{"n":647,"sa":"indraṃ dhanasya sātaye havāmahe jetāramaparājitam\nsa naḥ svarṣadati dviṣaḥ sa naḥ svarṣadati dviṣaḥ","de":"Indra rufen wir zum Gewinn des Gutes, den Sieger, den Unbesiegten; er soll uns das Licht gewinnen über die Hasser hinweg, er soll uns das Licht gewinnen über die Hasser hinweg."},{"n":648,"sa":"pūrvasya yatte adrivoṃ 'śurmadāya\nsumna ā dhehi no vaso pūrtiḥ śaviṣṭha śasyate\nvaśī hi śakro nūnaṃ tannavyaṃ saṃnyase","de":"Von dem Früheren [?], was dein ist, Steinbewehrter, der Halm zum Rausch; gib uns Wohlwollen, Vasu; Erfüllung, Stärkster, wird gepriesen; denn willig ist der Mächtige, nun das Neue zu ... [?]. [Anm.: Textzustand fraglich.]"},{"n":649,"sa":"prabho janasya vṛtrahantsamaryeṣu bravāvahai\nśūro yo goṣu gacchati sakhā suśevo advayuḥ","de":"Herr über das Volk, Vṛtratöter, in den Kämpfen wollen wir beide reden; der Held, der zu den Kühen geht, der Freund, wohlbeglückend, ohne Falsch."},{"n":650,"sa":"evāhyo '3 '3 '3vā . evā hyagne . evāhīndra\nevā hi pūṣan . evā hi devāḥ Oṃ evāhi devāḥ","de":"Denn so [Anm.: Stobha-Dehnung evāhyo ō ō ōvā]; denn so, Agni; denn so, Indra; denn so, Pūṣan; denn so, ihr Götter; Oṃ, denn so, ihr Götter. [Anm.: Stobha]"}]}],"uttara":[{"num":1,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 1","n_from":651,"n_to":653,"title_de":"Uttarārcika: Soma Pavamāna, die Atharvanen mit Milch und Honig","note":"","units":[{"n":651,"sa":"upāsmai gāyatā naraḥ pavamānāyendave\nabhi devāṃ iyakṣate","de":"Singt ihm zu, Männer, dem sich läuternden Tropfen; er will die Götter verehren."},{"n":652,"sa":"abhi te madhunā payo 'tharvāṇo aśiśrayuḥ\ndevaṃ devāya devayu","de":"Zu dir hin haben die Atharvanen Milch mit Honig gemischt [?]; den Gott, für den Gott, den Götter Begehrenden."},{"n":653,"sa":"sa naḥ pavasva śaṃ gave śaṃ janāya śamarvate\nśaṃ rājannoṣadhībhyaḥ","de":"Er, läutere dich uns: Heil der Kuh, Heil dem Volk, Heil dem Ross, Heil, König, den Pflanzen."}]},{"num":2,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 2","n_from":654,"n_to":656,"title_de":"Uttarārcika: Soma Pavamāna, glänzende Somatropfen","note":"","units":[{"n":654,"sa":"davidyutatyā rucā pariṣṭobhantyā kṛpā\nsomāḥ śukrā gavāśiraḥ","de":"Mit blitzendem Glanz, mit umfassender Gunst [?]: die Somas, hell, mit Milch gemischt."},{"n":655,"sa":"hinvāno hetṛbhirhita ā vājaṃ vājyakramīt\nsīdanto vanuṣo yathā","de":"Von den Antreibern angetrieben, niedergelegt [?], ist der Wettläufer zum Preis vorgestürmt; sich niedersetzend wie Begehrende [?]."},{"n":656,"sa":"ṛdhaksoma svastaye saṃjagmāno divā kave\npavasva sūryo dṛśe","de":"Der Reihe nach [?], Soma, zum Wohlergehen, zusammenkommend am Tag, Seher; läutere dich, damit die Sonne zu sehen sei [?]."}]},{"num":3,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 3","n_from":657,"n_to":659,"title_de":"Soma Pavamāna: Ströme des Läuterns","note":"","units":[{"n":657,"sa":"pavamānasya te kave vājintsargā asṛkṣate\narvanto na śravasyavaḥ","de":"Für dich, den sich läuternden Seher, wurden die Ströme losgelassen, o Kraftvoller, wie Rosse, die nach Ruhm verlangen."},{"n":658,"sa":"acchā kośaṃ madhuścutamasṛgraṃ vāre avyaye\navāvaśanta dhītayaḥ","de":"Zum Kübel hin, zum honigtriefenden, ließen sie den Saft strömen, in den Schafshaar-Seihtuch; die Gedanken [Anm.: dhītayaḥ, auch „Andachten, Finger“] brüllten ihm zu [?]."},{"n":659,"sa":"acchā samudramindavo 'staṃ gāvo na dhenavaḥ\nagmannṛtasya yonimā","de":"Zum Meer hin, zur Heimstatt, strömten die Tropfen wie Milchkühe zum Stall; sie gelangten zum Schoß der Wahrheit [Anm.: ṛta, auch „Ordnung“]. [Anm.: Schlusswort ā ohne sichere Verbindung; Textzustand fraglich]"}]},{"num":4,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 4","n_from":660,"n_to":662,"title_de":"Agni-Anruf: Komm zum Mahl, Rufer auf dem Streu","note":"","units":[{"n":660,"sa":"agna ā yāhi vītaye gṛṇāno havyadātaye\nni hotā satsi barhiṣi","de":"Agni, komm herbei zum Mahl, gepriesen, zur Darbringung der Opfergabe; setze dich als Rufer auf das Streu."},{"n":661,"sa":"taṃ tvā samidbhiraṅgiro ghṛtena vardhayāmasi\nbṛhacchocā yaviṣṭhya","de":"Dich, Aṅgiras, lassen wir mit Brennhölzern und mit Schmelzbutter wachsen, du hochleuchtender, jüngster."},{"n":662,"sa":"sa naḥ pṛthu śravāyyamacchā deva vivāsasi\nbṛhadagne suvīryam","de":"Du bringst uns, leuchtender Gott, weithin rühmlichen Ruhm [?] nahe; hoch (leuchtend), Agni, (schenke) gute Manneskraft.","notes":"Text und Konstruktion von pṛthu śravāyyam unsicher."}]},{"num":5,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 5","n_from":663,"n_to":665,"title_de":"Mitra und Varuṇa: Ruf zu Rinderweide und Sitz der Wahrheit","note":"","units":[{"n":663,"sa":"ā no mitrāvaruṇā ghṛtairgavyūtimukṣatam\nmadhvā rajāṃsi sukratū","de":"Zu uns, Mitra und Varuṇa, netzt mit Schmelzbutter die Rinderweide, mit Honigsüßem die Räume, ihr Wohlwirkenden."},{"n":664,"sa":"uruśaṃsā namovṛdhā mahnā dakṣasya rājathaḥ\ndrāghiṣṭhābhiḥ śucivratā","de":"Weithin gepriesen, durch Verneigung gestärkt, herrscht ihr durch die Macht der Kraft [Anm.: dakṣa], ihr in den längsten (Zeiten) reinen Gebots.","notes":"Ergänzung „Zeiten“ zu drāghiṣṭhābhiḥ unsicher [?]."},{"n":665,"sa":"gṛṇānā jamadagninā yonāvṛtasya sīdatam\npātaṃ somamṛtāvṛdhā","de":"Von Jamadagni gepriesen, setzt euch in den Schoß der Wahrheit; trinkt den Soma, ihr Mehrer der Wahrheit."}]},{"num":6,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 6","n_from":666,"n_to":668,"title_de":"Indra: Komm zum Soma, Rosse des Gebets","note":"","units":[{"n":666,"sa":"ā yāhi suṣumā hi ta indra somaṃ pibā imam\nedaṃ barhiḥ sado mama","de":"Komm herbei! Denn für dich, Indra, ist Soma gepresst; trinke ihn hier. Komm her, setze dich auf mein Streu."},{"n":667,"sa":"ā tvā brahmayujā harī vahatāmindra keśinā\nupa brahmāṇi naḥ śṛṇu","de":"Dich sollen zwei durch das Gebet angeschirrte, mähnige Falben, Indra, hierher fahren; höre unsere Gebete [Anm.: brahman, auch „Formeln“]."},{"n":668,"sa":"brahmāṇastvā yujā vayaṃ somapāmindra sominaḥ\nsutāvanto havāmahe","de":"Dich, den Somatrinker, Indra, rufen wir, die Gebetsmänner, als Somabesitzer, die wir gepresst haben, mit dem Gespann (des Gebets) an.","notes":"yujā „im Gespann/als Verbündete“ unsicher [?]."}]},{"num":7,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 7","n_from":669,"n_to":671,"title_de":"Indra und Agni: Soma im Gebet","note":"","units":[{"n":669,"sa":"indrāgnī ā gataṃ sutaṃ gīrbhirnabho vareṇyam\nasya pātaṃ dhiyeṣitā","de":"Indra und Agni, kommt herbei zu dem gepressten, mit Liedern zum Himmelsraum hin erwünschten (Soma); trinkt davon, von der Andacht gesandt."},{"n":670,"sa":"indrāgnī jarituḥ sacā yajño jigāti cetanaḥ\nayā pātamimaṃ sutam","de":"Indra und Agni, die Weihehandlung, die erweckende, geht zusammen mit dem Sänger; trinkt durch diese (Verehrung) den hier gepressten (Soma)."},{"n":671,"sa":"indramagniṃ kavicchadā yajñasya jūtyā vṛṇe\ntā somasyeha tṛmpatām","de":"Indra und Agni, die ihr Seher überdeckt [?], wähle ich durch den Schwung der Weihehandlung; die beiden mögen sich hier am Soma sättigen.","notes":"kavicchadā unsicher; Text fraglich."}]},{"num":8,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 8","n_from":672,"n_to":674,"title_de":"Soma Pavamāna: Hoch geboren, Ruhm für die Götter","note":"","units":[{"n":672,"sa":"uccā te jātamandhaso divi sadbhūmyā dade\nugraṃ śarma mahi śravaḥ","de":"Hoch ist deine Geburt, du Saft; im Himmel sitzend habe ich (sie) auf der Erde empfangen [?]: gewaltigen Schutz, großen Ruhm.","notes":"dade „habe ich/hat man empfangen“ unsicher."},{"n":673,"sa":"sa na indrāya yajyave varuṇāya marudbhyaḥ\nvarivovitpari srava","de":"Ströme rings, du, der du Weite findest, für Indra, den Verehrungswürdigen, für Varuṇa, für die Marut."},{"n":674,"sa":"enā viśvānyarya ā dyumnāni mānuṣāṇām\nsiṣāsanto vanāmahe","de":"Auf diese Weise, Herr [Anm.: arya], (möchten wir) alle Glanzkräfte der Menschen zu gewinnen wünschend erlangen."}]},{"num":9,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 9","n_from":675,"n_to":676,"title_de":"Soma: Läuternd fließend in den Schoß der Wahrheit","note":"","units":[{"n":675,"sa":"punānaḥ soma dhārayāpo vasāno arṣasi\nā ratnadhā yonimṛtasya sīdasyutso devo hiraṇyayaḥ","de":"Läuternd, Soma, strömst du in deinem Lauf, in Wasser gekleidet; Schätze verleihend setzt du dich in den Schoß der Wahrheit, du Quell, leuchtender, goldener Gott."},{"n":676,"sa":"duhāna ūdhardivyaṃ madhu priyaṃ pratnaṃ sadhasthamāsadat\nāpṛcchyaṃ dharuṇaṃ vājyarṣasi nṛbhirdhauto vicakṣaṇaḥ","de":"Das himmlische Euter melkend, den lieben Honig, ließest du dich am alten Sitzplatz nieder; du strömst als Renner, zu erfragender Träger, von Männern gewaschen, weitschauender.","notes":"āpṛcchyam „zu Erfragender/Beratbarer“ unsicher [?]."}]},{"num":10,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 10","n_from":677,"n_to":679,"title_de":"Soma: Seher und Vater der Götter","note":"","units":[{"n":677,"sa":"pra tu drava pari kośaṃ ni ṣīda nṛbhiḥ punāno abhi vājamarṣa\naśvaṃ na tvā vājinaṃ marjayanto 'cchā barhī raśanābhirnayanti","de":"Lauf nur hervor, setze dich rings um den Kübel, läuternd, von Männern (gereinigt), strömt hin zur Kraftgabe; wie ein Ross reiben sie dich, den Kraftvollen, ab, zum Streu führen sie (dich) mit Zügeln."},{"n":678,"sa":"svāyudhaḥ pavate deva induraśastihā vṛjanā rakṣamāṇaḥ\npitā devānāṃ janitā sudakṣo viṣṭambho divo dharuṇaḥ pṛthivyāḥ","de":"Mit schönen Waffen läutert sich der göttliche Tropfen, die Verwünschung erschlagend, die Bezirke [Anm.: vṛjana] hütend, der Vater der Götter, Erzeuger, gut Kraftbegabte, Stütze des Himmels, Halter der Erde."},{"n":679,"sa":"ṛṣirvipraḥ puraetā janānāmṛbhurdhīra uśanā kāvyena\nsa cidviveda nihitaṃ yadāsāmapīcyā3ṃ guhyaṃ nāma gonām","de":"Ein Seher, Redner, Vorangeher der Menschen, ein Ṛbhu-gleicher, weiser Uśanā durch seine Dichterkraft; er fand, was von diesen (Kühen) verborgen lag, den geheimen, verhüllten Namen der Kühe.","notes":"Pluti-Form apīcyā3ṃ im Text; Konstruktion unsicher [?]."}]},{"num":11,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 11","n_from":680,"n_to":681,"title_de":"Indra: Herr der Beweglichen und Stehenden","note":"","units":[{"n":680,"sa":"abhi tvā śūra nonumo 'dugdhā iva dhenavaḥ\nīśānamasya jagataḥ svardṛśamīśānamindra tasthuṣaḥ","de":"Dir, Held, brüllen wir zu, wie ungemolkene Milchkühe; dem Herrn dieser Welt, dem Himmelsschauenden, dem Herrn, Indra, des Stehenden."},{"n":681,"sa":"na tvāvāṃ anyo divyo na pārthivo na jāto na janiṣyate\naśvāyanto maghavannindra vājino gavyantastvā havāmahe","de":"Keiner wie du, weder ein Himmlischer noch ein Irdischer, noch ein Geborener, noch ein künftig Geborener, Gabenreicher Indra; Rosse begehrend, Rinder begehrend, die Kraftvollen, rufen wir dich."}]},{"num":12,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 12","n_from":682,"n_to":684,"title_de":"Indra: Hilfe des Freundes","note":"","units":[{"n":682,"sa":"kayā naścitra ā bhuvadūtī sadāvṛdhaḥ sakhā\nkayā śaciṣṭhayā vṛtā","de":"Auf welche Weise wird er uns, der Wunderbare, stets wachsende Freund, zur Hilfe? Mit welcher überaus kräftigen (Hilfe) umgeben?"},{"n":683,"sa":"kastvā satyo madānāṃ maṃhiṣṭho matsadandhasaḥ\ndṛḍhā cidāruje vasu","de":"Welcher wahre, freigebigste (Trank) vom Rauschtrank soll dich berauschen, um selbst Festes aufzubrechen, den Besitz?"},{"n":684,"sa":"abhī ṣu ṇaḥ sakhīnāmavitā jaritR^īṇām\nśataṃ bhavāsyūtaye","de":"Sei uns eifrig ein Beschützer der Freunde der Sänger; sei hundertfach zur Hilfe.","notes":"Wortlaut jaritR^īṇām mit Textzeichen; Text fraglich [?]."}]},{"num":13,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 13","n_from":685,"n_to":686,"title_de":"Indra: Lobgesang der Kühe","note":"","units":[{"n":685,"sa":"taṃ vo dasmamṛtīṣahaṃ vasormandānamandhasaḥ\nabhi vatsaṃ na svasareṣu dhenava indraṃ gīrbhirnavāmahe","de":"Ihn, den Wundertäter, Überwältiger der Feindschaft, euch, den Berauschenden vom Rauschtrank des Reichen, Indra, ehren wir mit Liedern neu, wie Milchkühe im Stall ein Kalb."},{"n":686,"sa":"dyukṣaṃ sudānuṃ taviṣībhirāvṛtaṃ giriṃ na purubhojasam\nkṣumantaṃ vājaṃ śatinaṃ sahasriṇaṃ makṣū gomantamīmahe","de":"Den himmelweilenden, freigebigen, von Kräften umgebenen, gleich einem Berg vielspendenden, (mit) kraftvoller Gabe, hundertfacher, tausendfacher, rinderreicher erbitten wir schnell.","notes":"Ergänzung im Zusammenhang unsicher [?]."}]},{"num":14,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 14","n_from":687,"n_to":688,"title_de":"Indra: Wer wehrt ihn ab?","note":"","units":[{"n":687,"sa":"tarobhirvo vidadvasumindraṃ sabādha ūtaye\nbṛhadgāyantaḥ sutasome adhvare huve bharaṃ na kāriṇam","de":"Mit Kräften euch Schätze findend, Indra, bei der Bedrängnis um Hilfe, laut singend beim Soma-Pressen, bei der Weihehandlung, rufe ich ihn wie einen Sänger [?] als Helfer.","notes":"huve bharaṃ na kāriṇam unsicher."},{"n":688,"sa":"na yaṃ dudhrā varante na sthirā muro madeṣu śipramandhasaḥ\nya ādṛtyā śaśamānāya sunvate dātā jaritra ukthyam","de":"Den weder Gewalttätige aufhalten noch Feste, den Schönlippigen, in den Räuschen des Rauschtranks, der dem sich mühenden Presser (Gabe) gebend, dem Sänger Lobenswertes gibt."}]},{"num":15,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 15","n_from":689,"n_to":691,"title_de":"Soma Pavamāna: Süßester Strom für Indra","note":"","units":[{"n":689,"sa":"svādiṣṭhayā madiṣṭhayā pavasva soma dhārayā\nindrāya pātave sutaḥ","de":"Mit dem süßesten, berauschendsten Strom läutere dich, Soma; für Indra zum Trinken bist du gepresst."},{"n":690,"sa":"rakṣohā viśvacarṣaṇirabhi yonimayohate\ndroṇe sadhasthamāsadat","de":"Rakṣasen-Töter, allen Völkern zugewandt, (strömt er) zum Schoß hin, der nicht von Eisen getroffen wird; im Holzkübel ließ er sich am gemeinsamen Sitz nieder.","notes":"ayohate „eisenbeschlagen/nicht vom Eisen getroffen“ unsicher [?]."},{"n":691,"sa":"varivodhātamo bhuvo maṃhiṣṭho vṛtrahantamaḥ\nparṣi rādho maghonām","de":"Sei der Weite-Schaffendste, Freigebigster, Vṛtra-Schlagendster; bringe hinüber den Reichtum der Gabenreichen."}]},{"num":16,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 16","n_from":692,"n_to":693,"title_de":"Soma: Honigsüßester Rausch für Indra","note":"","units":[{"n":692,"sa":"pavasva madhumattama indrāya soma kratuvittamo madaḥ\nmahi dyukṣatamo madaḥ","de":"Läutere dich, honigsüßester, für Indra, Soma, kraftkundigster Rausch, großer, himmelweilendster Rausch."},{"n":693,"sa":"yasya te pītvā vṛṣabho vṛṣāyate 'sya pītvā svarvidaḥ\nsa supraketo abhyakramīdiṣo 'cchā vājaṃ naitaśaḥ","de":"Dessen Trank, wenn ein Stier ihn getrunken hat, macht ihn stierhaft; und wenn der Lichtfinder ihn getrunken hat, dann schritt er, der Wohlerkennende, auf die Labungen zu, hin zur Kraftgabe, wie der Etaśa [Anm.: Sonnenross]."}]},{"num":17,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 17","n_from":694,"n_to":696,"title_de":"Indra: Soma für den Stier","note":"","units":[{"n":694,"sa":"indramaccha sutā ime vṛṣaṇaṃ yantu harayaḥ\nśruṣṭe jātāsa indavaḥ svarvidaḥ","de":"Zu Indra sollen diese gepressten Tropfen, die Falben, den Stier bringen; in Erhörung geboren sind sie, die Säfte, lichtfindend."},{"n":695,"sa":"ayaṃ bharāya sānasirindrāya pavate sutaḥ\nsomo jaitrasya cetati yathā vide","de":"Dieser sich als Gewinner bereitende Soma läutert sich, gepresst, für Indra zur Kampfgabe; er kündet dem Siegreichen (den Weg), so dass er (ihn) findet [?].","notes":"cetati yathā vide unsicher."},{"n":696,"sa":"asyedindro madeṣvā grābhaṃ gṛbhṇāti sānasim\nvajraṃ ca vṛṣaṇaṃ bharatsamapsujit","de":"Bei dessen Räuschen greift Indra den Griff des Gewinners, und er trägt den stierhaften Keil; der Sieger in den Wassern [?].","notes":"samapsujit unsicher."}]},{"num":18,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 18","n_from":697,"n_to":699,"title_de":"Soma: Zum Ausstechen des Hundes","note":"","units":[{"n":697,"sa":"purojitī vo andhasaḥ sutāya mādayitnave\napa śvānaṃ śnathiṣṭana sakhāyo dīrghajihvyam","de":"Die Vorsiegerinnen [?] für euch, von dem Nahrungssaft, dem gepressten, den Berauschenden: stoßt weg den Hund, ihr Freunde, den Langzüngigen.","notes":"purojitī unsicher."},{"n":698,"sa":"yo dhārayā pāvakayā pariprasyandate sutaḥ\ninduraśvo na kṛtvyaḥ","de":"Der mit dem reinigenden Strom ringsum strömt, gepresst, der Tropfen, gleich einem Renner, der bereit ist zu wirken."},{"n":699,"sa":"taṃ duroṣamabhī naraḥ somaṃ viśvācyā dhiyā\nyajñāya santvadrayaḥ","de":"Diesen unbezwingbaren Soma (sollen) die Männer mit allseitig gewandter Andacht [Anm.: viśvācī dhīḥ]; für die Weihehandlung sollen die Presssteine sein."}]},{"num":19,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 19","n_from":700,"n_to":702,"title_de":"Soma: Der Weitschauende steigt zum Wagen","note":"","units":[{"n":700,"sa":"abhi priyāṇi pavate canohito nāmāni yahvo adhi yeṣu vardhate\nā sūryasya bṛhato bṛhannadhi rathaṃ viṣvañcamaruhadvicakṣaṇaḥ","de":"Er läutert sich hin zu den lieben Dingen, unbeachtet [?], zu den Namen, auf denen der Kräftige erstarkt; von der hohen Sonne aus stieg er, der Hohe, auf den nach allen Seiten fahrenden Wagen, der Weitschauende.","notes":"canohitaḥ unsicher [?]."},{"n":701,"sa":"ṛtasya jihvā pavate madhu priyaṃ vaktā patirdhiyo asyā adābhyaḥ\ndadhāti putraḥ pitrorapīcyā3ṃ nāma tṛtīyamadhi rocanaṃ divaḥ","de":"Die Zunge der Wahrheit läutert sich, honigsüß und lieb, der Sprecher, Herr dieser Andacht, unbetrogen; der Sohn stellt den verhüllten Namen von Vater und Mutter, den dritten, hin zum Lichtraum des Himmels.","notes":"Pluti-Form apīcyā3ṃ im Text."},{"n":702,"sa":"ava dyutānaḥ kalaśāṃ acikradannṛbhiryemāṇaḥ kośa ā hiraṇyaye\nabhī ṛtasya dohanā anūṣatādhi tripṛṣṭha uṣaso vi rājasi","de":"Herabgeglänzt hat er die Kelche zum Brüllen gebracht, von Männern gelenkt, im goldenen Kübel; zu den Melkgefäßen der Wahrheit haben sie gesungen; auf dem dreifachen Rücken erstrahlst du über den Morgenröten."}]},{"num":20,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 20","n_from":703,"n_to":704,"title_de":"Agni: Preis Tag um Tag","note":"","units":[{"n":703,"sa":"yajñāyajñā vo agnaye girāgirā ca dakṣase\nprapra vayamamṛtaṃ jātavedasaṃ priyaṃ mitraṃ na śaṃsiṣam","de":"Bei jeder Weihehandlung (bringe ich) euch (Lob) für Agni, bei jedem Lied für deine Kraft; immer wieder will ich den Unsterblichen, Jātavedas, preisen, den Lieben wie einen Freund [Anm.: mitra]."},{"n":704,"sa":"ūrjo napātaṃ sa hināyamasmayurdāśema havyadātaye\nbhuvadvājeṣvavitā bhuvadvṛdha uta trātā tanūnām","de":"Den Sohn der Kraft, ihn, der ohne Zorn ist [?], möchten wir bedienen zur Darbringung der Opfergabe; er sei in den Kraftgaben ein Helfer, sei ein Mehrer, und ein Beschützer der Leiber.","notes":"hināyam asmayuḥ unsicher [?]."}]},{"num":21,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 21","n_from":705,"n_to":707,"title_de":"Agni: Komm, ich will dir sagen","note":"","units":[{"n":705,"sa":"ehyū ṣu bravāṇi te 'gna itthetarā giraḥ\nebhirvardhāsa indubhiḥ","de":"Komm nur her! Ich will dir sprechen, Agni, so auch andere Lieder; durch diese Tropfen sollst du erstarken."},{"n":706,"sa":"yatra kva ca te mano dakṣaṃ dadhasa uttaram\ntatrā yoniṃ kṛṇavase","de":"Wo immer dein Sinn die höhere Kraft aufnimmt, dort machst du dir den Schoß [Anm.: yoni, „Sitz“]."},{"n":707,"sa":"na hi te pūrtamakṣipadbhuvannemānāṃ pate\nathā duvo vanavase","de":"Denn dein Geschenk, Herr der Frauen [?], haben die Augen nicht gemindert; so gewinnst du Dienst.","notes":"kṣipat / nemānām unsicher; Textzustand fraglich."}]},{"num":22,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 22","n_from":708,"n_to":709,"title_de":"Indra: Wir rufen dich, du Wunderbarer","note":"","units":[{"n":708,"sa":"vayamu tvāmapūrvya sthūraṃ na kaccidbharanto 'vasyavaḥ\nvajriñcitraṃ havāmahe","de":"Wir aber, du Unvergleichlicher, hilfebegehrend, wie etwas Massives tragend, rufen dich, Keulenträger, den Wunderbaren.","notes":"sthūraṃ na kaccit unsicher [?]."},{"n":709,"sa":"upa tvā karmannūtaye sa no yuvograścakrāma yo dhṛṣat\ntvāmidhyavitāraṃ vavṛmahe sakhāya indra sānasim","de":"Zu dir kam er bei der Tat zur Hilfe, er, der junge, gewaltige, der wagte; dich als Beschützer wählen wir, wir Freunde, Indra, den Gewinner."}]},{"num":23,"loc":"Prapāṭhaka I, Ardha 1, Gruppe 23","n_from":710,"n_to":712,"title_de":"Indra: Wir suchen dich mit Lied","note":"","units":[{"n":710,"sa":"adhā hīndra girvaṇa upa tvā kāma īmahe sasṛgmahe\nudeva gmanta udabhiḥ","de":"Nun denn, Indra, Liederfreund, zu dir hin bitten wir mit Verlangen, wir strömen zusammen [?], wie mit Wassern zu Wasser hinkommend [?].","notes":"sasṛgmahe unsicher."},{"n":711,"sa":"vārṇa tvā yavyābhirvardhanti śūra brahmāṇi\nvavṛdhvāṃsaṃ cidadrivo divedive","de":"Wie ein Wasserstrom [?] stärken dich mit ihren Gaben, Held, die Gebete; dich, den Gestärkten, Steinträger, Tag für Tag.","notes":"vārṇa unsicher; Textzustand fraglich."},{"n":712,"sa":"puñjanti harī iṣirasya gāthayorau ratha uruyuge vacoyujā\nindravāhā svarvidā","de":"Sie schirren die beiden Falben an, die Rosse dieses Eiligen, auf dem weiten Wagen, der weit gejocht ist, angeschirrt durch das Wort; Indra tragend, lichtkundig."}]},{"num":24,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 1","n_from":713,"n_to":715,"title_de":"Indra: Preist ihn, den Vielgerufenen","note":"","units":[{"n":713,"sa":"pāntamā vo andhasa indramabhi pra gāyata\nviśvāsāhaṃ śatkratuṃ maṃhiṣṭhaṃ carṣaṇīnām","de":"Singt hin zu Indra vom Trank, der euch am meisten (Indra) trinkt [?], zu ihm, dem Allbezwinger, Hundertkräftigen, Freigebigsten der Völker.","notes":"pāntamā unsicher."},{"n":714,"sa":"puruhūtaṃ puruṣṭutaṃ gāthānyā3ṃ sanaśrutam\nindra iti bravītana","de":"Den Vielgerufenen, Vielgepriesenen, in Liedern [?] von alters bekannten: „Indra“ so sprecht.","notes":"gāthānyā3ṃ Textzustand fraglich."},{"n":715,"sa":"indra inno mahonāṃ dātā vājānāṃ nṛtuḥ\nmahāṃ abhijñvā yamat","de":"Indra ist uns, der Spender der Großen [Anm.: mahonām, „Gaben“], der Kraftgaben, der Tänzer; er, der Große, reiche uns (Hilfe) mit gebeugtem Knie [?].","notes":"abhijñvā yamat unsicher."}]},{"num":25,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 2","n_from":716,"n_to":718,"title_de":"Indra: Singt dem Somatrinker","note":"","units":[{"n":716,"sa":"pra va indrāya mādanaṃ haryaśvāya gāyata\nsakhāyaḥ somapāvne","de":"Singt hervor für Indra, den falbenrossigen, das Berauschende, ihr Freunde, für den Somatrinker."},{"n":717,"sa":"śaṃsedukthaṃ sudānava uta dyukṣaṃ yatha naraḥ\ncakṛmā satyarādhase","de":"Sprich das Lied, (für ihn) den gut Schenkenden, und (rühme) den Himmelweilenden, wie die Männer; wir haben es gemacht für den, dessen Gabe wahr ist."},{"n":718,"sa":"tvaṃ na indra vājayustvaṃ gavyuḥ śatakrato\ntvaṃ hiraṇyayurvaso","de":"Du, Indra, bist uns der, der nach Kraftgaben strebt, du der Rinderbegehrende, Hundertkräftiger, du der Gold Begehrende, Gutsbesitzer [Anm.: vasu]."}]},{"num":26,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 3","n_from":719,"n_to":721,"title_de":"Indra: Die Kaṇvas preisen dich","note":"","units":[{"n":719,"sa":"vayamu tvā tadidarthā indra tvāyantaḥ sakhāyaḥ\nkaṇvā ukthebhirjarante","de":"Wir aber, dich, eben darauf aus, Indra, dich begehrend, als Freunde, die Kaṇvas singen mit Lobliedern."},{"n":720,"sa":"na ghemanyadā papana vajrinnapaso naviṣṭau\ntavedu stomaiściketa","de":"Keinen anderen [?] haben sie (so) gepriesen, Keulenträger, bei der Werkarbeit, in der Not; nur deine (Kraft) haben sie mit Preisliedern erkannt.","notes":"ghemanyadā papana unsicher; Textzustand fraglich."},{"n":721,"sa":"icchanti devāḥ sunvantaṃ na svapnāya spṛhayanti\nyanti pramādamatandrāḥ","de":"Die Götter suchen den Pressenden; sie begehren nicht den Schlaf; sie gehen unermüdlich (dahin), ohne Nachlässigkeit [?].","notes":"yanti pramādam atandrāḥ Deutung unsicher."}]},{"num":27,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 4","n_from":722,"n_to":724,"title_de":"Indra: Preislieder beim Soma","note":"","units":[{"n":722,"sa":"indrāya madvne sutaṃ pari ṣṭobhantu no giraḥ\narkamarccantu kāravaḥ","de":"Für Indra, den Berauschenden, ist gepresst; unsere Lieder sollen ihn umjubeln; die Sänger sollen den Strahl [Anm.: arka, auch „Preislied“] singen."},{"n":723,"sa":"yasminviśvā adhi śriyo raṇanti sapta saṃsadaḥ\nindraṃ sute havāmahe","de":"In dem alle Herrlichkeiten sich erfreuen, die sieben Versammlungen; Indra rufen wir beim gepressten Soma."},{"n":724,"sa":"trikadrukeṣu cetanaṃ devāso yajñamatnata\ntamidvardhantu no giraḥ","de":"Bei den Trikadruka-Tagen [Anm.: Name von Somatagen] haben die Götter die Erweckerin, die Weihehandlung, gewoben; ihn allein sollen unsere Lieder stärken.","notes":"Deutung von cetanam als „Erweckung/Erwecker“ unsicher [?]."}]},{"num":28,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 5","n_from":725,"n_to":727,"title_de":"Indra: Soma auf dem Streu, Anruf mit Spottnamen","note":"Die Verse 726 und 727 enthalten schwer deutbare, wohl spöttische Anrufe.","units":[{"n":725,"sa":"ayaṃ ta indra somo nipūto adhi barhiṣi\nehīmasya dravā piba","de":"Dieser Soma ist dir, Indra, rein geläutert, auf dem Streu; komm her, lauf hin zu ihm, trink."},{"n":726,"sa":"śācigo śācipūjanāyaṃ raṇāya te sutaḥ\nākhaṇḍala pra hūyase","de":"Kraftreiches [?] Rind, Kraftverehrer [?]: dieser ist für dich zum Kampf [Anm.: oder „zum Ergötzen“] gepresst; Ākhaṇḍala, du wirst angerufen.","notes":"śācigo śācipūjana ākhaṇḍala: Wörter unklar; Textzustand fraglich."},{"n":727,"sa":"yaste śṛṅgavṛṣo ṇapātpraṇapātkuṇḍapāyyaḥ\nnyasmiṃ dadhra ā manaḥ","de":"Der dein Horn, o Stier, Enkel, Urenkel, Kuṇḍapāyya (ist) [?]: in diesem habe ich den Sinn befestigt.","notes":"Vers weitgehend unverständlich; Textzustand fraglich."}]},{"num":29,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 6","n_from":728,"n_to":730,"title_de":"Indra: Greife mit der Rechten","note":"","units":[{"n":728,"sa":"ā tū na indra kṣumantaṃ citraṃ grābhaṃ saṃ gṛbhāya\nmahāhasti dakṣiṇena","de":"Nun aber, Indra, ergreife für uns den reichen, wunderbaren Griff, mit der Rechten, du Großhändiger."},{"n":729,"sa":"vidmā hi tvā tuvikūrmiṃ tuvideṣṇaṃ tuvīmagham\ntuvimātramavobhiḥ","de":"Wir kennen dich, den Vielwirkenden, Vielgebenden, Vielreichen, den Vielmaßigen, mit Hilfen."},{"n":730,"sa":"na hi tvā śūra devā na martāso ditsantam\nbhīmaṃ na gāṃ vārayante","de":"Denn dich, Held, halten weder Götter noch Sterbliche zurück, wenn du geben willst, wie man einen furchtbaren Stier nicht (zurückhält) [?].","notes":"Vergleich bhīmaṃ na gām unsicher."}]},{"num":30,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 7","n_from":731,"n_to":733,"title_de":"Indra: Trink am Soma, dass niemand dich schädige","note":"","units":[{"n":731,"sa":"abhi tvā vṛṣabhā sute sutaṃ sṛjāmi pītaye\ntṛmpā vyaśnuhī madam","de":"Zu dir, Stier, lasse ich beim Soma den gepressten (Saft) strömen zum Trinken; sättige dich, erlange den Rausch."},{"n":732,"sa":"mā tvā mūrā aviṣyavo mopahasvāna ā dabhan\nmā kīṃ brahmadviṣaṃ vanaḥ","de":"Nicht sollen dich Törichte, Hilfsgierige, nicht Spötter [?] beeinträchtigen; nicht sollst du irgendeinen Gebetshasser gewinnen [?].","notes":"mopahasvāna, kīṃ Wortlaut fraglich."},{"n":733,"sa":"iha tvā goparīṇasaṃ mahe mandantu rādhase\nsaro gauro yathā piba","de":"Hier sollen dich, den Kuh-Ergötzer [?], die Tropfen zur großen Gabe berauschen; trink wie der Gaura-Büffel am See.","notes":"goparīṇasam unsicher."}]},{"num":31,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 8","n_from":734,"n_to":736,"title_de":"Indra: Gefüllter Bauch, gewaschener Soma","note":"","units":[{"n":734,"sa":"idam vaso sutamandhaḥ pibā supūrṇamudaram\nanābhayinrarimā te","de":"Dies, Reicher [Anm.: vasu], ist der gepresste Nahrungssaft: trink, fülle den Bauch wohl; furchtlos [?] sind wir dir nahe [?].","notes":"anābhayin rarimā unsicher; Textzustand fraglich."},{"n":735,"sa":"nṛbhirdhautaḥ suto aśnairavyā vāraiḥ paripūtaḥ\naśvo na nikto nadīṣu","de":"Von Männern gewaschen ist der gepresst mit Steinen, durch die Schafshaarseihe rings gereinigt, wie ein Ross geschmückt in den Strömen."},{"n":736,"sa":"taṃ te yavaṃ yathā gobhiḥ svādumakarma śrīṇantaḥ\nindra tvāsmiṃtsadhamāde","de":"Ihn haben wir dir gemacht, wie Gerste mit Kuhmilch, süß, sie beimischend; Indra, an diesem Festgelage."}]},{"num":32,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 9","n_from":737,"n_to":739,"title_de":"Indra: Trinke den Soma mit Kraft","note":"","units":[{"n":737,"sa":"idaṃ hyanvojasā sutaṃ rādhānāṃ pate\npibā tvā3sya girvaṇaḥ","de":"Denn diesen (Soma) haben wir mit Kraft gepresst, Herr der Gaben; trink von ihm, Liederfreund."},{"n":738,"sa":"yaste anu svadhāmasatsute ni yaccha tanvam\nsa tvā mamattu somyam","de":"Wer dir folgend nach Eigenart war, bei gepresstem (Soma) halte den Leib an; der berausche dich, den Soma-Würdigen.","notes":"yaste anu svadhām asat unsicher [?]."},{"n":739,"sa":"pra te aśnotu kukṣyoḥ prendra brahmaṇā śiraḥ\npra bāhū śūra rādhasā","de":"Zu deinen Flanken soll er gelangen, zu deinem Haupt, Indra, mit dem Gebet; zu den Armen, Held, mit der Gabe."}]},{"num":33,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 10","n_from":740,"n_to":742,"title_de":"Indra: Kommt, setzt euch, singt ihm","note":"","units":[{"n":740,"sa":"ā tvetā ni ṣīdatendramabhi pra gāyata\nsakhāya stomavāhasaḥ","de":"Kommt her, setzt euch nieder, singt hin zu Indra, ihr Freunde, Träger des Preislieds."},{"n":741,"sa":"purūtamaṃ purūṇāmīśānaṃ vāryāṇām\nindraṃ some sacā sute","de":"Den Vielfältigsten unter den Vielen, den Herrscher über das Erwünschte, Indra, beim Soma, wenn zusammen gepresst ist."},{"n":742,"sa":"sa ghā no yoga ā bhuvatsa rāye sa purandhyā\ngamadvājebhirā sa naḥ","de":"Er möge uns beim Anschirren beistehen, er zu Reichtum, er mit Fülle; er komme mit Kraftgaben zu uns."}]},{"num":34,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 11","n_from":743,"n_to":745,"title_de":"Indra: Bei jedem Anschirren, bei jeder Kraftprobe","note":"","units":[{"n":743,"sa":"yogeyoge tavastaraṃ vājevāje havāmahe\nsakhāya indramūtaye","de":"Bei jedem Anschirren rufen wir den Kräftigeren an, bei jeder Kraftgabe Indra, als Freunde, zur Hilfe."},{"n":744,"sa":"anu pratnasyaukaso huve tuvipratiṃ naram\nyaṃ te pūrvaṃ pitā huve","de":"Nach dem Wohnsitz des Alten rufe ich den Vielbekämpfenden, den Mann, den dein Vater früher rief.","notes":"anu pratnasyaukasaḥ Konstruktion unsicher [?]."},{"n":745,"sa":"ā ghā gamadyadi śravatsahasriṇībhirūtibhiḥ\nvājebhirupa no havam","de":"Er möge kommen, wenn er hört, mit tausendfachen Hilfen, mit Kraftgaben zu unserem Ruf."}]},{"num":35,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 12","n_from":746,"n_to":748,"title_de":"Indra: Gestärkt im höchsten Raum","note":"","units":[{"n":746,"sa":"indra suteṣu someṣu kratuṃ punīṣa ukthyam\nvide vṛdhasya dakṣasya mahāṃ hi ṣaḥ","de":"Indra, bei gepressten Somas läuterst du die preiswürdige Einsicht; ich kenne den Stärkenden der Kraft; denn er ist der Große.","notes":"vide unsicher; Textzustand fraglich [?]."},{"n":747,"sa":"sa prathame vyomani devānāṃ sadane vṛdhaḥ\nsupāraḥ suśravastamaḥ samapsujit","de":"Er, im ersten Himmelsraum, im Sitz der Götter erstarkt, der gut Hinüberführende, der Ruhmreichste, der Sieger in den Wassern."},{"n":748,"sa":"tamu huve vājasātaya indraṃ bharāya śuṣmiṇam\nbhavā naḥ sumne antamaḥ sakhā vṛdhe","de":"Ihn rufe ich zur Gewinnung von Kraftgaben, Indra, zum Kampf, den Ungestümen; sei uns in Gunst der Nächste, Freund zur Stärkung."}]},{"num":36,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 13","n_from":749,"n_to":750,"title_de":"Agni: Sohn der Kraft, Bote der Götter","note":"","units":[{"n":749,"sa":"enā vo agniṃ namasorjo napātamā huve\npriyaṃ cetiṣṭhamaratiṃ svadhvaraṃ viśvasya dūtamamṛtam","de":"Mit dieser Verneigung rufe ich euch, Agni, den Sohn der Kraft, den Lieben, Klügsten, Unfeindlichen, gut Weihenden, den Boten von allem, den Unsterblichen."},{"n":750,"sa":"sa yojate aruṣā viśvabhojasā sa dudravatsvāhutaḥ\nsubrahmā yajñaḥ suśamī vasūnāṃ devaṃ rādho janānām","de":"Er schirrt die beiden glänzenden Gaben-Genießer an; er lief, gut geopfert; das gebetsreiche, gutwirkende Weihewerk der Güter, der göttliche Reichtum der Menschen.","notes":"Bezug von yojate und Schluss sehr unsicher [?]; Textzustand fraglich."}]},{"num":37,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 14","n_from":751,"n_to":752,"title_de":"Uṣas: die Tochter des Himmels, Morgenröte und Sonne","note":"","units":[{"n":751,"sa":"pratyu adarśyāyatyū3cchantī duhitā divaḥ\napo mahī vṛṇute cakṣuṣā tamo jyotiṣkṛṇoti sūnarī","de":"Hin ist die Tochter des Himmels erschienen, leuchtend heranstrahlend; die Große enthüllt das Dunkel durch ihr Auge [Anm.: cakṣuṣā, wörtlich „mit dem Auge“, d. h. mit ihrem Blick/Licht]; die Gütige macht Licht."},{"n":752,"sa":"udusriyāḥ sṛjate sūryaḥ sacā udyannakṣatramarcivat\ntaveduṣo vyuṣi sūryasya ca saṃ bhaktena gamemahi","de":"Die Sonne läßt die Strahlenrinder [?] hervorgehen, gemeinsam mit ihr, aufgehend, das Gestirn mit Glanz [Anm.: usrāḥ „Morgenlichter, Strahlenkühe“]. Bei deinem Aufleuchten, Uṣas, und dem der Sonne mögen wir zu unserem Anteil [?] gelangen."}]},{"num":38,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 15","n_from":753,"n_to":754,"title_de":"Aśvin-Anruf: Einladung zu Speise und Somatrunk","note":"","units":[{"n":753,"sa":"imā u vāṃ diviṣṭaya usrā havante aśvinā\nayaṃ vāmahve 'vase śacīvasū viśaṃviśaṃ hi gacchathaḥ","de":"Diese rufen euch beide, die ihr im Himmel zu Hause seid, ihr Morgenlichter, Aśvin. Ich rufe euch beide hier zur Hilfe, ihr Kraftreichen; denn ihr kommt zu jedem Stamm."},{"n":754,"sa":"yuvaṃ citraṃ dadathurbhojanaṃ narā codethāṃ sūnṛtāvate\narvāgrathaṃ samanasā ni yacchataṃ pibataṃ somyaṃ madhu","de":"Ihr habt, ihr Männer, glänzende Speise gegeben; treibt an den, der Wahrhaftigkeit [?] besitzt. Lenkt den Wagen einträchtig hierher; trinkt den Somasüßtrank [Anm.: somyam madhu, „süßen Somatrank“]."}]},{"num":39,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 16","n_from":755,"n_to":757,"title_de":"Soma Pavamāna: der Presssaft, sonnengleich","note":"","units":[{"n":755,"sa":"asya pratnāmanu dyutaṃ śukraṃ duduhre ahrayaḥ\npayaḥ sahasrasāmṛṣim","de":"Seinem uralten Glanz nach haben die Unversehrten [?] die leuchtende Milch gemolken, tausendfach strömend, den Seher [Anm.: ṛṣim; sahasrasām „tausendfach gewinnend/spendend“]."},{"n":756,"sa":"ayaṃ sūrya ivopadṛgayaṃ sarāṃsi dhāvati\nsapta pravata ā divam","de":"Dieser ist wie die Sonne zu schauen; dieser läuft zu den Seen, die sieben Ströme [?] hinab zum Himmel [Anm.: sapta pravataḥ „sieben Abhänge/Gefälle“, Deutung unsicher]."},{"n":757,"sa":"ayaṃ viśvāni tiṣṭhati punāno bhuvanopari\nsomo devo na sūryaḥ","de":"Dieser steht über allen Wesen, sich läuternd, Soma, der Gott, wie die Sonne."}]},{"num":40,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 17","n_from":758,"n_to":760,"title_de":"Soma Pavamāna: der Gott für die Götter gepresst","note":"","units":[{"n":758,"sa":"eṣa pratnena janmanā devo devebhyaḥ sutaḥ\nhariḥ pavitre arṣati","de":"Dieser, nach alter Herkunft, der Gott, für die Götter gepresst, der Falbe, strömt im Seihtuch."},{"n":759,"sa":"eṣa pratnena manmanā devo devebhyaspari\nkavirvipreṇa vāvṛdhe","de":"Dieser, nach alter Denkweise, der Gott, ist über den Göttern hinaus; der Seher ist durch den begeisterten Redner erstarkt [Anm.: vipreṇa „durch den Weisen/Sänger“]."},{"n":760,"sa":"duhānaḥ pratnamitpayaḥ pavitre pari ṣicyase\nkrandaṃ devāṃ ajījanaḥ","de":"Die uralte Milch nur ausmelkend, wirst du im Seihtuch rings ausgegossen; das Brüllen hast du die Götter erzeugen lassen [?] [Anm.: krandam devāṃ ajījanaḥ, Sinn unsicher]."}]},{"num":41,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 18","n_from":761,"n_to":763,"title_de":"Soma Pavamāna: Bitte um Schutz und Besitz","note":"","units":[{"n":761,"sa":"upa śikṣāpatasthuṣo bhiyasamā dhehi śatrave\npavamāna vidā rayim","de":"Lehre [?] Furcht ein dem Feind, der dabeisteht [?]; läutere dich strömend, finde Reichtum [Anm.: upa śikṣā, Text und Bezug unsicher; apatasthuṣaḥ „der sich Hinstellende“]."},{"n":762,"sa":"uṣo ṣu jātamapturaṃ gobhirbhaṅgaṃ pariṣkṛtam\ninduṃ devā ayāsiṣuḥ","de":"Zur Morgenröte hin, gut geboren [?], den flinken, mit Milch geschmückten Bruch [?]: den Tropfen [Anm.: indum] haben die Götter aufgesucht [Anm.: Textzustand fraglich; bhaṅgam unsicher]."},{"n":763,"sa":"upāsmai gāyatā naraḥ pavamānāyendave\nabhi devāṃ iyakṣate","de":"Singt ihm zu, ihr Männer, dem strömenden Tropfen; er trachtet die Götter zu verehren."}]},{"num":42,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 19","n_from":764,"n_to":766,"title_de":"Soma Pavamāna: die Somaströme ziehen zu den Göttern","note":"","units":[{"n":764,"sa":"pra somāso vipaścito 'po nayanta ūrmayaḥ\nvanāni mahiṣā iva","de":"Vorwärts die Somasäfte, die weisen, die Wogen führen die Wasser mit sich, wie Büffel die Wälder [?]."},{"n":765,"sa":"abhi droṇāni babhravaḥ śukrā ṛtasya dhārayā\nvājaṃ gomantamakṣaran","de":"Zu den Holzgefäßen hin die braunen, leuchtenden Ströme in der Bahn der Wahrheit [ṛta]; sie haben rinderreiche Siegesgabe strömen lassen."},{"n":766,"sa":"sutā indrāya vāyave varuṇāya marudbhyaḥ\nsomā arṣantu viṣṇave","de":"Gepresst für Indra, für Vāyu, für Varuṇa, für die Marut: die Somasäfte sollen strömen, für Viṣṇu."}]},{"num":43,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 20","n_from":767,"n_to":768,"title_de":"Soma Pavamāna: der Strom zur Götterlabung","note":"","units":[{"n":767,"sa":"pra soma devavītaye sindhurna pipye arṇasā\naṃśoḥ payasā madiro na jāgṛviracchā kośaṃ madhuścutam","de":"Vorwärts, Soma, zur Götterlabung; wie ein Strom ist er mit Flut angeschwollen; mit der Milch [Anm.: payasā, d. h. dem Saft] der Somapflanze, der Berauschende, wachsam, geht er hin zum Kübel, der Süße träufelt."},{"n":768,"sa":"ā haryato arjuno atke avyata priyaḥ sūnurna marjyaḥ\ntamīṃ hinvantyapaso yathā rathaṃ nadīṣvā gabhastyoḥ","de":"Der Gelbbraune, der Helle, hat sich im Gewand [atke] hervorgetan, der Liebe, wie ein Sohn zu putzen; ihn treiben die Werkleute an wie einen Wagen, in den Strömen, in den Händen [Anm.: gabhastyoḥ „zwischen den Armen/Händen“]."}]},{"num":44,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 21","n_from":769,"n_to":771,"title_de":"Soma Pavamāna: der Schwan zur Schar","note":"","units":[{"n":769,"sa":"pra somāso madacyutaḥ śravase no maghonām\nsutā vidathe akramuḥ","de":"Vorwärts die Somasäfte, Rausch verströmend, uns zum Ruhm bei den Freigebigen; gepresst sind sie zur Versammlung [vidatha] gelaufen."},{"n":770,"sa":"ādīṃ haṃso yathā gaṇaṃ viśvasyāvīvaśanmatim\natyo na gobhirajyate","de":"Und dann hat er wie der Schwan zur Schar den Sinn aller herbeigewünscht [?]; wie ein Renner wird er mit Milch [Anm.: gobhiḥ „mit Kuhgaben/Milch“] gesalbt."},{"n":771,"sa":"ādīṃ tritasya yoṣaṇo hariṃ hinvantyadribhiḥ\nindumindrāya pītaye","de":"Und dann treiben die Frauen des Trita den Falben mit den Pressteinen an, den Tropfen für Indra zum Trinken."}]},{"num":45,"loc":"Prapāṭhaka I, Ardha 2, Gruppe 22","n_from":772,"n_to":774,"title_de":"Soma Pavamāna: Läuterung und Abwehr der Feinde","note":"","units":[{"n":772,"sa":"ayā pavasva devayu rebhanpavitraṃ paryeṣi viśvataḥ\nmadhordhārā asṛkṣata","de":"Läutere dich mit diesem [Strom], götterfreundlich, Sänger [?]; das Seihtuch umgehst du von allen Seiten; die Honigströme sind losgelassen worden."},{"n":773,"sa":"pavate haryato harirati hvarāṃsi raṃhyā\nabhyarṣa stotṛbhyo vīravadyaśaḥ","de":"Es läutert sich der Erwünschte, der Falbe; über Krümmungen [?] hinweg im Anlauf; strömte hinzu den Sängern mit männerreichem Ruhm [Anm.: vīravad yaśaḥ]."},{"n":774,"sa":"pra sunvānāsyāndhaso marto na vaṣṭa tadvacaḥ\napa śvānamarādhasaṃ hatā makhaṃ na bhṛgavaḥ","de":"Vorwärts! Des Somapressenden Trank will der Sterbliche, das Wort davon [?]; weg mit dem freudlosen Hund [Anm.: śvānam, „Hund“, hier als Feindbild]; schlagt ihn, wie die Bhṛgu den Makha [?] [Anm.: makham na bhṛgavaḥ, Text und Bezug unsicher]."}]},{"num":46,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 1","n_from":775,"n_to":777,"title_de":"Soma Pavamāna: Läuterung, Wort und Lied","note":"","units":[{"n":775,"sa":"pavasva vāco agriyaḥ soma citrābhirūtibhiḥ\nabhi viśvāni kāvyā","de":"Läutere dich, Vorderster der Rede, Soma, mit wunderbarem Beistand, hin zu allen Sängerkünsten [kāvya]."},{"n":776,"sa":"tvaṃ samudriyā apo 'griyo vāca īrayan\npavasva viśvacarṣaṇe","de":"Du, als Vorderster, hast die Wasser des Meeres, die Reden [?] in Bewegung gebracht; läutere dich, du Allschauender."},{"n":777,"sa":"tubhyemā bhuvanā kave mahimne soma tasthire\ntubhyaṃ dhāvanti dhenavaḥ","de":"Dir, Seher, haben sich diese Wesen zu deiner Größe hingestellt, Soma; dir laufen die Milchkühe zu."}]},{"num":47,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 2","n_from":778,"n_to":780,"title_de":"Soma Pavamāna: gegen die Neider, um Schutz","note":"","units":[{"n":778,"sa":"pavasvendo vṛṣā sutaḥ kṛdhī no yaśaso jane\nviśvā apa dviṣo jahi","de":"Läutere dich, Tropfen, du Stier, gepresst; mach uns ruhmvoll unter den Leuten; alle Feindseligkeiten schlage weg."},{"n":779,"sa":"yasya te sakhye vayaṃ sāsahyāma pṛtanyataḥ\ntavendo dyumna uttame","de":"In deiner Freundschaft möchten wir die Kampfsüchtigen überwältigen; in deinem höchsten Glanz, Tropfen."},{"n":780,"sa":"yā te bhīmānyāyudhā tigmāni santi dhūrvaṇe\nrakṣā samasya no nidaḥ","de":"Deine furchtbaren Waffen, die scharfen, die du, Schädiger, hast: behüte uns vor jedem Spott [nid]."}]},{"num":48,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 3","n_from":781,"n_to":783,"title_de":"Soma: der Stier","note":"","units":[{"n":781,"sa":"vṛṣā soma dyumāṃ asi vṛṣā deva vṛṣavrataḥ\nvṛṣā dharmāṇi dadhriṣe","de":"Ein Stier bist du, Soma, glanzvoll; ein Stier, Gott, mit stierhaftem Wirken; als Stier hast du die Satzungen [dharman] gefasst."},{"n":782,"sa":"vṛṣṇaste vṛṣṇyaṃ śavo vṛṣā vanaṃ vṛṣā sutaḥ\nsa tvaṃ vṛṣanvṛṣedasi","de":"Dein, des Stieres, ist die Stierkraft, die Stärke; der Stier ist das Holz [Anm.: vanam, „Holz, Kufe“ oder „Wald“, unsicher]; der Stier ist gepresst; du, Stier, bist wahrhaft der Stier."},{"n":783,"sa":"aśvo na cakrado vṛṣā saṃ gā indo samarvataḥ\nvi no rāye duro vṛdhi","de":"Wie ein Hengst brüllend, der Stier, treibe zusammen, Tropfen, die Kühe, die Rosse; öffne uns die Türen zum Reichtum."}]},{"num":49,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 4","n_from":784,"n_to":786,"title_de":"Soma Pavamāna: glanzvoll und stark","note":"","units":[{"n":784,"sa":"vṛṣā hyasi bhānunā dyumantaṃ tvā havāmahe\npavamāna svardṛśam","de":"Denn ein Stier bist du durch deinen Glanz; als den Glänzenden rufen wir dich, Pavamāna, den, der Himmelslicht schaut."},{"n":785,"sa":"yadadbhiḥ pariśicyase marmṛjyamāna āyubhiḥ\ndroṇe sadhasthamaśnuṣe","de":"Wenn du mit Wassern rings begossen wirst, von den Lebendigen gereinigt, gelangst du im Holzkübel zu deinem gemeinsamen Sitz."},{"n":786,"sa":"ā pavasva suvīryaṃ mandamānaḥ svāyudha\niho ṣvindavā gahi","de":"Läutere dich herbei, heldenkräftig, dich berauschend, mit guten Waffen; hierher, Tropfen, komm!"}]},{"num":50,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 5","n_from":787,"n_to":789,"title_de":"Soma Pavamāna: Freundschaft und Erbarmen","note":"","units":[{"n":787,"sa":"pavamānasya te vayaṃ pavitramabhyundataḥ\nsakhitvamā vṛṇīmahe","de":"Dein, des Strömenden, das Seihtuch netzend, erwählen wir uns die Freundschaft."},{"n":788,"sa":"ye te pavitramūrmayo 'bhikṣaranti dhārayā\ntebhirnaḥ soma mṛḍaya","de":"Welche Wogen von dir in Strömen auf das Seihtuch fließen, mit denen sei uns gnädig, Soma."},{"n":789,"sa":"sa naḥ punāna ā bhara rayiṃ vīravatīmiṣam\nīśānaḥ soma viśvataḥ","de":"Du, der Geläuterte, bring uns Reichtum, heldenreiche Stärkung, Herr, Soma, von allen Seiten."}]},{"num":51,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 6","n_from":790,"n_to":792,"title_de":"Agni-Anruf: Bote, Rufer, Bringer der Gaben","note":"","units":[{"n":790,"sa":"agniṃ dūtaṃ vṛṇīmahe hotāraṃ viśvavedasam\nasya yajñasya sukratum","de":"Agni erwählen wir als Boten, als Rufer, den Allkundigen, den Wohlgesinnten [sukratu] dieser Weihehandlung."},{"n":791,"sa":"agnimagniṃ havīmabhiḥ sadā havanta viśpatim\nhavyavāhaṃ purupriyam","de":"Agni, Agni rufen sie mit Anrufungen stets, den Herrn der Sippen, den Träger der Opfergabe, den vielgeliebten."},{"n":792,"sa":"agne devāṃ ihā vaha jajñāno vṛktabarhiṣe\nasi hotā na īḍyaḥ","de":"Agni, bring die Götter hierher, kaum geboren, für den, der die Streu geschichtet hat; du bist unser Rufer, preisenswert."}]},{"num":52,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 7","n_from":793,"n_to":795,"title_de":"Mitra und Varuṇa: Anruf zum Somatrunk","note":"","units":[{"n":793,"sa":"mitraṃ vayaṃ havāmahe varuṇaṃ somapītaye\nya jātā pūtadakṣasā","de":"Mitra und Varuṇa rufen wir zum Somatrunk, die beiden, die geboren [?] sind, mit geläuterter Geisteskraft [Anm.: ya jātā, Text fraglich; wohl yā jātā]."},{"n":794,"sa":"ṛtena yāvṛtāvṛdhāvṛtasya jyotiṣaspatī\ntā mitrāvaruṇā huve","de":"Ihr beiden, die ihr durch die Wahrheit [ṛta] die Wahrheit mehrt, Herren des Lichts der Wahrheit: diese, Mitra und Varuṇa, rufe ich."},{"n":795,"sa":"varuṇaḥ prāvitā bhuvanmitro viśvābhirūtibhiḥ\nkaratāṃ naḥ surādhasaḥ","de":"Varuṇa sei der Förderer, Mitra mit allen Hilfen; sie mögen uns reich an Gaben machen."}]},{"num":53,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 8","n_from":796,"n_to":799,"title_de":"Indra-Preis: Lieder und Sänger","note":"","units":[{"n":796,"sa":"indramidgāthino bṛhadindramarkebhirarkiṇaḥ\nindraṃ vāṇīranūṣata","de":"Indra allein [besingen] die Sänger mit Gesang, den Hohen, Indra die Verseschmiede mit Preisversen; Indra haben die Stimmen angejubelt."},{"n":797,"sa":"indra iddharyoḥ sacā sammiśla ā vacoyujā\nindro vajrī hiraṇyayaḥ","de":"Indra allein ist bei seinen beiden Falben, mit ihnen vereint, wenn er sich zu den Ruf-Gespannen gesellt; Indra, der Keulenträger, der goldene."},{"n":798,"sa":"indra vājeṣu no 'va sahasrapradhaneṣu ca\nugra ugrābhirūtibhiḥ","de":"Indra, hilf uns in den Wettkämpfen und in den tausendfachen Gewinnen; der Gewaltige mit gewaltigen Hilfen."},{"n":799,"sa":"indro dīrdhāya cakṣasa ā sūryaṃ rohayaddivi\nvi gobhiradrimairayat","de":"Indra ließ zu weitem Blick die Sonne am Himmel aufsteigen; er hat mit den Strahlen [go] den Fels aufgetrieben [?] [Anm.: vi gobhir adrim airayat]."}]},{"num":54,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 9","n_from":800,"n_to":802,"title_de":"Indra und Agni: Anruf um Hilfe und Gewinn","note":"","units":[{"n":800,"sa":"indre agnā namo bṛhatsuvṛktimerayāmahe\ndhiyā dhenā avasyavaḥ","de":"Indra und Agni entbieten wir Verneigung, hohen Preisgesang; im Gedanken die Milchkühe [dhenā] [?], hilfesuchend."},{"n":801,"sa":"tā hi śaśvanta īḍata itthā viprāsa ūtaye\nsabādho vājasātaye","de":"Denn diese beiden preisen die Weisen ständig so um Hilfe, gemeinsam mit den Bedrängten [?], zum Gewinn der Beute."},{"n":802,"sa":"tā vāṃ gīrbhirvipanyuvaḥ prayasvanto havāmahe\nmedhasātā saniṣyavaḥ","de":"Zu euch beiden, mit Liedern die Bewundernden, mit Spenden [prayasvant] rufen wir, die Weisheitsgewinner, gewinnbegierig."}]},{"num":55,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 10","n_from":803,"n_to":805,"title_de":"Soma Pavamāna: für Indra und die Marut","note":"","units":[{"n":803,"sa":"vṛṣā pavasva dhārayā marutvate ca matsaraḥ\ndiśvā dadhāna ojasā","de":"Als Stier läutere dich im Strom, auch für den, der die Marut bei sich hat, der Berauschende, mit Kraft tragend [?] [Anm.: diśvā, Wort unsicher]."},{"n":804,"sa":"taṃ tvā dharttāramoṇyo3ḥ pavamāna svardṛśam\nhinve vājeṣu vājinam","de":"Dich, den Träger, den Lichtschauenden, Pavamāna, treibe ich an [?] in den Wettkämpfen, den Renner [Anm.: taṃ tvā dharttāram oṇyoḥ, „Dich, den Träger, [zwischen] den beiden [Himmelshälften]“, Text fraglich]."},{"n":805,"sa":"ayā citto vipānayā hariḥ pavasva dhārayā\nyujaṃ vājeṣu codaya","de":"Mit diesem Gedanken [?], mit dieser Trinkgabe, Falber, läutere dich im Strom; treibe den Gespannten in den Wettkämpfen an."}]},{"num":56,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 11","n_from":806,"n_to":808,"title_de":"Soma Pavamāna: brüllend, milchgeschwellt, gepresst","note":"","units":[{"n":806,"sa":"vṛṣā śoṇo abhikanikradadgā nadayanneṣi pṛthivīmuta dyām\nindrasyeva vagnurā śṛṇva ājau pracodayannarṣasi vācamemām","de":"Der Stier, der rötliche, brüllend, die Kühe zum Muhen bringend, gehst du zur Erde und zum Himmel; wie Indras Getön wird er im Kampf gehört; die Rede hier antreibend strömst du."},{"n":807,"sa":"rasāyyaḥ payasā pinvamāna īrayanneṣi madhumantamaṃśum\npavamāna santanimeṣi kṛṇvannindrāya soma pariṣicyamānaḥ","de":"Der Saftvolle, mit Milch anschwellend, gehst du und bringst die honigreiche Somapflanze in Bewegung; Pavamāna, du gehst zur Fortsetzung, machst sie für Indra, Soma, ringsum begossen."},{"n":808,"sa":"evā pavasva madiro madāyodagrābhasya namayanvadhasnum\npari varṇaṃ bharamāṇo ruśantaṃ gavyurno arṣa pari soma siktaḥ","de":"So läutere dich, Berauschender, zum Rausch, den Mörder des Angreifers [?] niederbeugend [Anm.: udgrābhasya, Deutung unsicher]; leuchtende Farbe tragend, kuhbegierig strömst du für uns, Soma, ringsum begossen."}]},{"num":57,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 12","n_from":809,"n_to":810,"title_de":"Indra-Preis: der Wahrhaftige, der Beistand","note":"","units":[{"n":809,"sa":"tvāmiddhi havāmahe sātau vājasya kāravaḥ\ntvāṃ vṛtreṣvindra satpatiṃ narastvāṃ kāṣṭhāsvarvataḥ","de":"Dich rufen wir, die Sänger, beim Gewinn der Beute; dich, Indra, den Wahrhaften unter den Vṛtra-Kämpfen [?], die Männer; dich in den Wettläufen des Rosses [?]."},{"n":810,"sa":"sa tvaṃ naścitra vajrahasta dhṛṣṇuyā maha stavāno adrivaḥ\ngāmaśvaṃ rathyamindra saṃ kira satrā vājaṃ na jigyuṣe","de":"Du nun, Bunter [citra], mit der Keule in der Hand, mit Kühnheit, gepriesen als Großer, du Steinbesitzer: Rind, Ross und Wagen streue uns, Indra, zusammen, wahrhaft wie Beute dem Sieger."}]},{"num":58,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 13","n_from":811,"n_to":812,"title_de":"Indra: der Freigebige und sein Ruhm","note":"","units":[{"n":811,"sa":"abhi pra vaḥ surādhasamindramarca yathā vide\nyo jaritṛbhyo maghavā purūvasuḥ sahasreṇeva śikṣati","de":"Zu ihm hin, für euch, singe den Gabenreichen, Indra, wie es sich schickt; der als Gabenherr den Sängern, vielfältigen Besitz, gleichsam mit Tausend beschenkt."},{"n":812,"sa":"śatānīkeva pra jigāti dhṛṣṇuyā hanti vṛtrāṇi dāśuṣe\ngireriva pra rasā asya pinvire datrāṇi purubhojasaḥ","de":"Wie mit hundert Heerscharen geht er kühn los, er schlägt die Vṛtras für den Spender; wie Bergwasser [?] schwellen seine Gaben, die Spenden des Vielspendenden [Anm.: giriḥ iva pra rasāḥ, Text unsicher]."}]},{"num":59,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 14","n_from":813,"n_to":814,"title_de":"Indra: Somatrank und Preis","note":"","units":[{"n":813,"sa":"tvāmidā hyo naro 'pīpyanvajrinbhūrṇayaḥ\nsa indra stomavāhasa iha śrudhyupa svasaramā gahi","de":"Dich haben gestern die Männer, Keulenträger, die Kräftigen, angeschwellt [?]; du, Indra, der Preislieder trägt: hör hier her, komm zu uns [?] [Anm.: svasaram ā gaha, „zur Wohnstatt/zum Haus“, unsicher]."},{"n":814,"sa":"matsvā suśiprinharivastamīmahe tvayā bhūṣanti vedhasaḥ\ntava śravāṃsyupamānyukthya suteṣvindra girvaṇaḥ","de":"Berausche dich, Schönlippiger [suśipra], Falbenlenker; wir bitten dich; durch dich schmücken sich die Ordner [vedhas]; deine Berühmtheit, die Vergleichbaren [?], des Preiswürdigen, wenn der Soma gepresst ist, Indra, Liedliebender."}]},{"num":60,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 15","n_from":815,"n_to":817,"title_de":"Soma Pavamāna: Feindvernichter und Gabenbringer","note":"","units":[{"n":815,"sa":"yaste mado vareṇyastenā pavasvāndhasā\ndevāvīraghaśaṃsahā","de":"Dein Rausch, der wünschenswerte: mit dieser Pflanze läutere dich, götterschützend, Übelredner erschlagend."},{"n":816,"sa":"jaghnirvṛtramamitriyaṃ sasnirvājaṃ divedive\ngoṣātiraśvasā asi","de":"Du hast den feindlichen Vṛtra geschlagen, gewinnst Tag für Tag Beute; du gewinnst Kühe, du gewinnst Rosse."},{"n":817,"sa":"sammiślo aruṣo bhuvaḥ sūpasthābhirna dhenubhi\nsīdaṃ cchyeno na yonimā","de":"Vereint, rötlich, sei bei den schönen Schoßen wie bei den Milchkühen [Anm.: Text fraglich]; setz dich nieder, wie der Falke, in die Heimstatt."}]},{"num":61,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 16","n_from":818,"n_to":820,"title_de":"Soma Pavamāna: Reichtum und Bahnbrecher","note":"","units":[{"n":818,"sa":"ayaṃ pūṣā rayirbhagaḥ somaḥ punāno arṣati\npatirviśvasya bhūmano vyakhyadrodasī ubhe","de":"Dieser, Pūṣan, der Reichtum, Bhaga, Soma, strömt läuternd, der Herr des Alls im Überfluss [?]; er hat beide Welten überblickt."},{"n":819,"sa":"samu priyā anūṣata gāvo madāya ghṛṣvayaḥ\nsomāsaḥ kṛṇvate pathaḥ pavamānāsa indavaḥ","de":"Sie haben ihn zusammen freudig besungen, die Kühe, die munteren, zum Rausch; die Somasäfte, die läuternden Tropfen, bahnen die Wege."},{"n":820,"sa":"ya ojiṣṭhastamā bhara pavamāna śravāyyam\nyaḥ pañca carṣaṇīrabhi rayiṃ yena vanāmahe","de":"Bring das Stärkste, Pavamāna, das rühmenswert ist, das über die fünf Stämme hin [wirkt], den Reichtum, durch den wir gewinnen."}]},{"num":62,"loc":"Prapāṭhaka II, Ardha 1, Gruppe 17","n_from":821,"n_to":823,"title_de":"Soma Pavamāna: der Weise, der Rauschtrank, der Lichtbringer",
