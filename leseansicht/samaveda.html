getriebenen, den Raschen, Sieger, Schleuderer, besten Wagenkämpfer, den Unbezwungenen, den Förderer des Tugrya-Geschlechts [?] [rufen] [Anm.: Verb fehlt im Wortlaut, ergänzt]."},{"n":284,"sa":"mo ṣu tvā vāghataśca nāre asmanni rīraman\nārāttādvā sadhamādaṃ na ā gahīha vā sannupa śrudhi","de":"Keine Sänger oder Opferherren [vāghataḥ] sollen dich fern von uns festhalten. Selbst aus der Ferne komm zu unserem gemeinsamen Gastmahl; oder bist du hier, so höre bei uns zu."},{"n":285,"sa":"sunota somapāvne somamindrāya vajriṇe\npacatā paktīravase kṛṇudhvamitpṛṇannitpṛṇate mayaḥ","de":"Presst Soma für den Somatrinker, den Keulenträger Indra; kocht das Gargekochte zur Gunst [ihm]; macht es so: der Freigebige verschafft dem Freigebigen Labsal [?]."},{"n":286,"sa":"yaḥ satrāhā vicarṣaṇirindraṃ taṃ hūmahe vayam\nsahasramanyo tuvinṛmṇa satpate bhavā samatsu no vṛdhe","de":"Den, der die Gegner niederwirft und alles überschaut, Indra, den rufen wir. Tausendmütiger, Vielkräftiger, Herr des Guten, sei in den Kämpfen für unser Gedeihen da."},{"n":287,"sa":"śacībhirnaḥ śacīvasū divānaktaṃ diśasyatam\nmā vāṃ rātirupa dasatkadā ca nāsmadrātiḥ kadā ca na","de":"Mit euren Kräften, ihr beiden Kraftreichen, weist [oder: gewährt] uns bei Tag und Nacht [Beistand] zu [?] [Anm.: die beiden Angerufenen sind nicht genannt]. Nie soll eure Gabe ausgehen; nie soll eure Gabe uns fehlen."},{"n":288,"sa":"yadā kadā ca mīḍhuṣe stotā jareta martyaḥ\nādidvandeta varuṇaṃ vipā girā dharttāraṃ vivratānām","de":"Wann immer der sterbliche Sänger dem Spendenreichen [Indra?] lobsingt, so soll er auch sogleich Varuṇa, den Erhalter der verschiedenartigen Bräuche [Anm.: vivratānām auch ‚der Verschiedenwilligen‘], mit erregtem Lied verehren."},{"n":289,"sa":"pāhi gā andhaso mada indrāya medhyātithe\nyaḥ sammiślo haryoryo hiraṇyaya indro vajrī hiraṇyayaḥ","de":"Trink, singe [?] im Rausch des Saftes für Indra, o Medhyātithi [?] [Anm.: gā kann ‚singe‘ oder ‚die Kühe/Lieder‘ sein; Textzustand fraglich]; er, der bei den beiden Falben verbunden ist, der goldene, Indra, der Keulenträger, der goldene."},{"n":290,"sa":"ubhayaṃ śṛṇavacca na indro arvāgidaṃ vacaḥ\nsatrācyā maghavāntsomapītaye dhiyā śaviṣṭha ā gamat","de":"Beides soll uns Indra hören, dieses Wort, uns zugewandt; der Gabenreiche soll, du Stärkster, mit gleichgerichtetem [?] Gedanken zum Somatrunk herbeikommen."},{"n":291,"sa":"mahe ca na tvādrivaḥ parā śulkāya dīyase\nna sahasrāya nāyutāye vajrivo na śatāya śatāmagha","de":"Auch für einen großen Kaufpreis, Steinträger, wirst du nicht weit weggegeben; nicht für tausend, nicht für zehntausend, Keulenträger, nicht für hundert, du Hundertgütiger."},{"n":292,"sa":"vasyāṃ indrāsi me pituruta bhrāturabhuñjataḥ\nmātā ca me chadayathaḥ samā vaso vasutvanāya rādhase","de":"Besser [als Vater] bist du mir, Indra, als der Vater und als der Bruder, der nichts abgibt [?]. Und die Mutter und du, ihr beide gewährt mir Schutz [wörtl. Bedeckung; Anm.: Konstruktion unsicher], du Guter, zum Erlangen von Gütern, zur Gabe [?]."}]},{"num":20,"loc":"Prapāṭhaka IV, Ardha 1, Daśati 1","n_from":293,"n_to":302,"title_de":"Indra-Lieder: Somatrank, Milchkuh Indra, Bitte um Beute","note":"","units":[{"n":293,"sa":"ima indrāya sunvire somāso dadhyāśiraḥ\ntāṃ ā madāya vajrahasta pītaye haribhyāṃ yāhyoka ā","de":"Diese Somas sind für Indra gepresst, mit saurer Milch gemischt. Zu ihnen komm, Keulenhändiger, zum Rausch und zum Trinken mit den beiden Falben, komm zu deiner Wohnstatt."},{"n":294,"sa":"ima indra madāya te somāścikitra ukithanaḥ\nmadhoḥ papāna upa no giraḥ śṛṇu rāsva stotrāya girvaṇaḥ","de":"Diese Somas hier, Indra, sind dir zum Rausch [bereitet], von Sprüchen begleitet, du Merkender [?]. Nachdem du vom Süßen getrunken hast, höre unsere Lieder; gewähre dem Sänger, du Liederliebender."},{"n":295,"sa":"ā tvā3dya sabardughāṃ huve gāyatravepasam\nindraṃ dhenuṃ sudughāmanyāmiṣamurudhārāmaraṅkṛtam","de":"Heute rufe ich [dich] her, den mit Gāyatra-Schwung, den Saftmelkenden [?]: Indra, die Milchkuh, die gute Melkerin, und andere Stärkung, breitströmend, wohl gerüstet [?] [Anm.: sabardughā ‚Nektar-Melkende‘ unsicher; Textzustand fraglich]."},{"n":296,"sa":"na tvā bṛhanto adrayo varanta indra vīḍavaḥ\nyacchikṣasi stuvate māvate vasu na kiṣṭadā mināti te","de":"Nicht halten dich, Indra, die großen Presssteine auf, noch die Festen. Wenn du dem Preisenden Gut zu geben vermagst, einem wie mir, so schmälert keiner dir das."},{"n":297,"sa":"ka īṃ veda sute sacā pibantaṃ kadvayo dadhe\nayaṃ yaḥ puro vibhinatyojasā mandānaḥ śipryandhasaḥ","de":"Wer weiß es, wenn er [Indra] bei der Pressung mit uns trinkt? Wann nimmt er Lebenskraft an sich [?]? Dieser ist es, der die Burgen mit Kraft aufbricht, berauscht vom Saft, der Helmträger [?]."},{"n":298,"sa":"yadindra śāso avrataṃ cyāvayā sadasaspari\nasmākamaṃśuṃ maghavanpuruspṛhaṃ vasavye adhi barhaya","de":"Wenn du, Indra, den Gesetzlosen züchtigst, so vertreibe ihn aus der Versammlung; unseren Somastengel [oder: Anteil], den vielbegehrten, lass, Gabenreicher, im Reichtum groß werden [?]."},{"n":299,"sa":"tvaṣṭā no daivyaṃ vacaḥ parjanyo brahmaṇaspatiḥ\nputrairbhrātṛbhiraditirnu pātu no duṣṭaraṃ trāmaṇaṃ vacaḥ","de":"Tvaṣṭṛ soll uns das göttliche Wort [schützen], Parjanya, Brahmaṇaspati; mit Söhnen und Brüdern soll Aditi uns schützen: das Wort als schwer überwindlichen Schutz."},{"n":300,"sa":"kadā ca na starīrasi nendra saścasi dāśuṣe\nupopennu maghavanbhūya innu te dānaṃ devasya pṛcyate","de":"Nie bist du eine Unfruchtbare [Kuh, Bild], Indra, und du bist dem Spender nicht [versagt] [?]. Näher noch, Gabenreicher, und immer mehr: die Gabe von dir, dem Gott, wird [zu unserer Fülle] gemischt [?] [Anm.: Textzustand fraglich; Wortlaut schwer deutbar]."},{"n":301,"sa":"yuṅkṣvā hi vṛtrahantama harī indra parāvataḥ\narvācīno maghavantsomapītaya ugra ṛṣvebhirā gahi","de":"Schirre an, du größter Vṛtra-Töter, die beiden Falben, Indra, von fernher; uns zugewandt, Gabenreicher, komm zum Somatrunk, Grimmiger, mit den Erhabenen [?]."},{"n":302,"sa":"tvāmidā hyo naro 'pīpyanvajrinbhūrṇayaḥ\nsa indra stomavāhasa iha śrudhyupa svasaramā gahi","de":"Dich haben gestern die Männer, die Eifrigen, gestärkt [wörtl. schwellen lassen], Keulenträger. Du, Indra, hör hier auf den Lobgesang-Träger; komm zur Ruhestätte [svasaram]."}]},{"num":21,"loc":"Prapāṭhaka IV, Ardha 1, Daśati 2","n_from":303,"n_to":312,"title_de":"Uṣas- und Aśvin-Lieder, dann Indra: Somatrank und Wettbewerb","note":"Die ersten Verse gelten Uṣas (Morgenröte) und den Aśvins, ab Vers 307 überwiegend Indra.","units":[{"n":303,"sa":"pratyu adarśyāyatyū3cchantī duhitā divaḥ\napo mahī vṛṇute cakṣuṣā tamo jyotiṣkṛṇoti sūnari","de":"Sie ist sichtbar geworden, die heranleuchtende Tochter des Himmels; die Große deckt mit ihrem Blick das Dunkel auf [Anm.: apo = apa u ‚weg/auf‘]; die Freundlich-Schöne schafft Licht."},{"n":304,"sa":"imā u vāṃ diviṣṭaya usrā havante aśvinā\nayaṃ vāmahve 'vase śacīvasū viśaṃviśaṃ hi gacchathaḥ","de":"Diese Himmelsverlangen [oder: Himmelszeit-Feiern, diviṣṭayaḥ] [?] rufen euch, ihr beiden Lichten, Aśvins. Ich rufe euch zur Gunst, ihr Kraftreichen; denn ihr geht zu jedem Stamm."},{"n":305,"sa":"ku ṣṭhaḥ ko vāmaśvinā tapāno devā martyaḥ\nghnatā vāmaśmayā kṣapamāṇoṃśunetthamu ādunyathā","de":"Wo seid ihr? Wer, ihr Aśvins, ist der Quälende [?], der Sterbliche, [den] ihr Götter [?] — ihr schlagt ihn mit Steinen [?] in der Nacht, den Zürnenden, den Stengel [?], und so habt ihr gezittert [?] [Anm.: Textzustand fraglich]."},{"n":306,"sa":"ayaṃ vāṃ madhumattamaḥ sutaḥ somo diviṣṭiṣu\ntamaśvinā pibataṃ tiro ahnyaṃ dhattaṃ ratnāni dāśuṣe","de":"Dieser euer honigsüßester, gepresster Soma ist bei den Himmelszeit-Feiern [?]. Ihn trinkt, ihr Aśvins, den vom Tage her Abgesetzten [?] [Anm.: tiro ahnyam unsicher]; bringt dem Spender Kleinode."},{"n":307,"sa":"ā tvā somasya galdayā sadā yācannahaṃ jyā\nbhūrṇiṃ mṛgaṃ na savaneṣu cukrudhaṃ ka īśānaṃ na yāciṣat","de":"Mit einem Tropfen [?] Soma bitte ich dich stets, du Erregten [?] [Anm.: galdayā unsicher; Textzustand fraglich], der wie ein Hirsch bei den Pressungen zornig wurde: wer würde den Herrscher nicht bitten?"},{"n":308,"sa":"adhvaryo drāvayā tvaṃ somamindraḥ pipāsati\nupo nūnaṃ yuyuje vṛṣṇā harī ā ca jagāma vṛtrahā","de":"Adhvaryu, lass du den Soma laufen; Indra will trinken. Er hat gewiss die beiden stierhaften Falben angeschirrt, und der Vṛtra-Töter ist herbeigekommen."},{"n":309,"sa":"abhī ṣatastadā bharendra jyāyaḥ kanīyasaḥ\npurūvasurhi maghavanbabhūvitha bharebhare ca havyaḥ","de":"Bring das her, Indra, an die Anwesenden [?] [Anm.: abhī ṣataḥ unsicher], das Größere für den Geringeren [?]. Denn du bist, Gabenreicher, reich an Gütern geworden, und in Kampf um Kampf bist du anzurufen."},{"n":310,"sa":"yadindra yāvatastvametāvadahamīśīya\nstotāramiddadhiṣe radāvaso na pāpatvāya raṃsiṣam","de":"Wenn ich, Indra, so viel vermöchte wie du, dann [würde ich] den Sänger stützen, du Güterspender; nicht würde ich mich zu Bösem gehen lassen [?] [Anm.: Wortlaut dadhiṣe (2. Sg.); Textzustand fraglich, Parallele RV 7.32.18 didhiṣeya]."},{"n":311,"sa":"tvamindra pratūrtiṣvabhi viśvā asi spṛdhaḥ\naśastihā janitā vṛtratūrasi tvaṃ tūrya taruṣyataḥ","de":"Du, Indra, bist in den Kämpfen der Überwinder aller Gegner. Du bist der Vernichter der Schmähung, der Erzeuger, der Vṛtra-Bezwinger; du bist der Rasche [gegenüber] dem Angreifenden [?]."},{"n":312,"sa":"pra yo ririkṣa ojasā divaḥ sadobhyaspari\nna tvā vivyāca raja indra pārthivamati viśvaṃ vavakṣitha","de":"Der du mit Kraft über die Sitze des Himmels hinausragst: dich fasst der irdische Raum nicht, Indra; du bist über alles hinausgewachsen."}]},{"num":22,"loc":"Prapāṭhaka IV, Ardha 1, Daśati 3","n_from":313,"n_to":322,"title_de":"Indra-Lieder: Soma, Vṛtra-Tat und der Vogel im Himmel","note":"Vers 319/320 rufen das Bild des Vogels; Vers 321 ist eine Schöpfungsaussage (Vena, Brahman).","units":[{"n":313,"sa":"asāvi devaṃ goṛjīkamandho nyasminnindro januṣemuvoca\nbodhāmasi tvā haryaśva yajñairbodhā na stomamandhaso madeṣu","de":"Gepresst ist der göttliche Saft, mit Milch gemischt [?]; bei ihm hat Indra von Geburt an zugesprochen [?]. Wir wecken dich, Falbenfahrer, mit Verehrungen; achte auf unser Loblied im Rausch des Saftes."},{"n":314,"sa":"yoniṣṭa indra sadane akāri tamā nṛbhiḥ purūhūta pra yāhi\naso yathā no 'vitā vṛdhaściddado vasūni mamadaśca somaiḥ","de":"Deine Sitzstätte, Indra, ist am Sitz bereitet; dorthin geh mit den Männern, Vielgerufener, damit du unser Helfer bist, unser Förderer, der Güter gibt und sich an Somas berauscht."},{"n":315,"sa":"adardarutsamasṛjo vi khāni tvamarṇavānbadbadhānāṃ aramṇāḥ\nmahāntamindra parvataṃ vi yadvaḥ sṛjaddhārā ava yaddānavānhan","de":"Du hast aufgerissen und losgelassen die Öffnungen [Quellen]; du hast die Fluten, die gestauten, zur Ruhe [oder: zum Fließen] gebracht [?]. Den großen Berg, Indra, [spaltest du], als er euch [die Wasser] entließ, als er die Dānavas mit Strömen niederschlug [?] [Anm.: RV 5.32.1; Sinn der Verben unsicher]."},{"n":316,"sa":"suṣvāṇāsa indra stumasi tvā saniṣyantaścittuvinṛmṇa vājam\nā no bhara suvitaṃ yasya konā tanā tmanā sahyāmā tvotāḥ","de":"Wir, die wir pressen, preisen dich, Indra, Beute erstrebend, Vielkräftiger, [um] Kampfpreis. Bring uns Wohlsein herbei, damit wir mit [Nachkommen] und aus uns selbst, von dir beschützt, obsiegen [?] [Anm.: konā tanā unsicher]."},{"n":317,"sa":"jagṛhmā te dakṣiṇamindra hastaṃ vasūyavo vasupate vasūnām\nvidmā hi tvā gopatiṃ śūra gonāmasmabhyaṃ citraṃ vṛṣaṇaṃ rayindāḥ","de":"Wir haben deine rechte Hand ergriffen, Indra, Güter begehrend, Herr der Güter. Denn wir kennen dich als Herrn der Rinder, Held: gib uns glänzenden, kraftvollen Reichtum [?]."},{"n":318,"sa":"indraṃ naro nemadhitā havanti yatpāryā yunajate dhiyastāḥ\nśūro nṛṣātā śravasaśca kāma ā gomati vraje bhajā tvaṃ naḥ","de":"Indra rufen die Männer [in Bedrängnis], wenn sie jene zielführenden Gedanken anschirren. Held, Beschützer der Männer, und Verlangen nach Ruhm: hab Anteil an uns im rinderreichen Gehege."},{"n":319,"sa":"vayaḥ suparṇā upa sedurindraṃ priyamedhā ṛṣayo nādhamānāḥ\napa dhvāntamūrṇuhi pūrdhi cakṣurmumugdhyā3smānnidhayeva baddhān","de":"Wie Vögel, Schönflügler, setzten sich die Seher, die Priyamedhas, bittend zu Indra. Decke die Finsternis weg, fülle das Auge, löse uns wie mit Fesseln Gebundene [?]."},{"n":320,"sa":"nāke suparṇamupa yatpatantaṃ hṛdā venanto abhyacakṣata tvā\nhiraṇyapakṣaṃ varuṇasya dūtaṃ yamasya yonau śakunaṃ bhuraṇyum","de":"Als sie im Himmelsraum den Schönbeflügelten dahinfliegen sahen, sie ihn mit dem Herzen begehrend anschauten: den goldflügeligen Boten des Varuṇa, den Vogel im Schoß des Yama, den Hastigen."},{"n":321,"sa":"brahma jajñānaṃ prathamaṃ purastādvi sīmataḥ suruco vena āvaḥ\nsa budhnyā upamā asya viṣṭhāḥ sataśca yonimasataśca vivaḥ","de":"Das zuerst geborene Brahman [Gebet, heilige Kraft] hat von vorn her der Strahlende [Vena] von der Grenze an hell aufgedeckt. Er hat die tiefgründigen, seine nächsten Standorte, aufgetan, die Geburtsstätte des Seienden und Nichtseienden."},{"n":322,"sa":"apūrvyā purutamānyasmai mahe vīrāya tavase turāya\nvirapśine vajriṇe śantamāni vacāṃsyāsmai sthavirāya takṣuḥ","de":"Unvergleichliche, allerzahlreichste, wohltuendste Worte haben die Sänger für diesen großen Helden, den Kräftigen, den Raschen, den Prächtigen, den Keulenträger, für diesen Alten gezimmert."}]},{"num":23,"loc":"Prapāṭhaka IV, Ardha 1, Daśati 4","n_from":323,"n_to":331,"title_de":"Indra-Lieder: Kämpfe mit Drapsa und Vṛtra, Lobpreis","note":"","units":[{"n":323,"sa":"ava drapso aṃśumatīmatiṣṭhadīyānaḥ kṛṣṇo daśabhiḥ sahasraiḥ\nāvattamindraḥ śacyā dhamantamapa snīhitiṃ nṛmaṇā adhadrāḥ","de":"Der Tropfen [drapsa] stand an der Aṃśumatī, der Schwarze, mit zehntausend heranziehend. Indra half [ihm] ... hat den Schnaubenden mit Kraft [bezwungen]; die Waffe, mannhaften Sinnes ... [?] [Anm.: adhadrāḥ, Textzustand fraglich]."},{"n":324,"sa":"vṛtrasya tvā śvasathādīṣamāṇā viśve devā ajahurye sakhāyaḥ\nmarudbhirindra sakhyaṃ te astvathemā viśvāḥ pṛtanā jayāsi","de":"Als sie vor dem Schnauben des Vṛtra fliehen wollten, verließen dich alle Götter, die Freunde waren. Mit den Maruts, Indra, sei deine Freundschaft; dann wirst du alle diese Heere besiegen."},{"n":325,"sa":"vidhuṃ dadrāṇaṃ samane bahūnāṃ yuvānaṃ santaṃ palito jagāra\ndevasya paśya kāvyaṃ mahitvādyā mamāra sa hyaḥ samāna","de":"Den Einsamen [?], den Eilenden, unter vielen im Zusammentreffen, den Jüngling, obwohl er da war, hat der Graue verschlungen. Schau die Weisheit des Gottes in ihrer Größe: heute ist er gestorben, gestern lebte er noch [Anm.: Rätselvers, wohl Sonne/Tag; unsicher]."},{"n":326,"sa":"tvaṃ ha tyatsaptabhyo jāyamāno 'śatrubhyo abhavaḥ śatrurindra\ngūḍhe dyāvāpṛthivī anvavindo vibhumadbhyo bhuvanebhyo raṇaṃ dhāḥ","de":"Du, damals, als Geborener, wurdest für die Sieben [?] [Anm.: saptabhyaḥ unsicher], die bis dahin keine Feinde hatten, ein Feind, Indra. Die beiden verborgenen, Himmel und Erde, fandest du; für die weiten Welten schufst du Freude."},{"n":327,"sa":"meḍiṃ na tvā vajriṇaṃ bhṛṣṭimantaṃ purudhasmānaṃ vṛṣabhaṃ sthirapsnum\nkaroṣyaryastaruṣīrduvasyurindra dyukṣaṃ vṛtrahaṇaṃ gṛṇīṣe","de":"Wie einen Pfosten [Anm.: meḍi ‚Pfahl‘] [dich], den Keulenträger, den zackenbewehrten, Vielkräftigen, den Stier mit festem Leib: du machst [uns] zu Herren, Verehrung begehrend, die Kämpfe [?] — Indra, den himmlischen Vṛtra-Töter, preise ich."},{"n":328,"sa":"pra vo mahe mahevṛdhe bharadhvaṃ pracetase pra sumatiṃ kṛṇudhvam\nviśaḥ pūrvīḥ pra cara carṣaṇiprāḥ","de":"Bringt dem Großen, der an Größe wächst, dem Weisen dar, richtet gute Gesinnung auf ihn; durchziehe die vielen Stämme, du Erfüller der Völker."},{"n":329,"sa":"śunaṃ huvema maghavānamindramasminbhare nṛtamaṃ vājasātau\nśṛṇvantamugramūtaye samatsu dhnantaṃ vṛtrāṇi sañjitaṃ dhanāni","de":"Heil wollen wir Indra, den Gabenreichen, in diesem Kampf um Beute rufen, den männlichsten, in der Gewinnung des Kampfpreises, den Hörenden, den Grimmigen zum Beistand in den Kämpfen, der Vṛtras erschlägt, den Gewinner der Güter."},{"n":330,"sa":"udu brahmāṇyairata śravasyendraṃ samarye mahayā vasiṣṭha\nā yo viśvāni śravasā tatānopaśrotā ma īvato vacāṃsi","de":"Empor haben sich die Gebete erhoben, nach Ruhm verlangend; Indra, im Kampf, verherrliche [ihn], Vasiṣṭha; der alles mit Ruhm ausgespannt hat, er soll auf meine Worte hören."},{"n":331,"sa":"cakraṃ yadasyāpsvā niṣattamuto tadasmai madhviccacchadyāt\npṛthivyāmatiṣitaṃ yadūdhaḥ payo goṣvadadhā oṣadhīṣu","de":"Sein Rad, das im Wasser sitzt, und das hat ihm [die Erde?] mit Süßem bedeckt [?]: die Milch, das Euter, das auf der Erde ausgegossen ist, hast du in die Kühe und Pflanzen gelegt [Anm.: Wortlaut schwer deutbar; unsicher]."}]},{"num":24,"loc":"Prapāṭhaka IV, Ardha 1, Daśati 5","n_from":332,"n_to":341,"title_de":"Indra-Lieder: Tārkṣya, Anrufung und Preis Indras","note":"Vers 332 ruft Tārkṣya (das Ross bzw. den himmlischen Vogel) zum Heil an.","units":[{"n":332,"sa":"tyamū ṣu vājinaṃ devajūtaṃ sahovānaṃ tarutāraṃ rathānām\nariṣṭanemiṃ pṛtanājamāśuṃ svastaye tārkṣyamihā huvema","de":"Ihn, den Raschen, göttergetriebenen, Kräftigen, der die Wagen übertrifft, Tārkṣya mit unversehrter Radschiene, den Kampfsieger, Schnellen, wollen wir hier zum Heil rufen."},{"n":333,"sa":"trātāramindramavitāramindraṃ havehave suhavaṃ śūramindram\nhuve nu śakraṃ puruhūtamindramidaṃ havirmaghavā vetvindraḥ","de":"Den Retter Indra, den Helfer Indra, bei jedem Ruf den leicht Anzurufenden, den Helden Indra: ich rufe den Mächtigen, den vielgerufenen Indra; diese Darbringung soll der Gabenreiche Indra genießen."},{"n":334,"sa":"yajāmaha indraṃ vajradakṣiṇaṃ harīṇāṃ rathya3ṃ vivratānām\npra śmaśrubhirdodhuvadūrdhvadhā bhuvadvi senābhirbhayamāno vi rādhasā","de":"Wir verehren Indra, den mit der Keule in der Rechten, den Wagenlenker der Falben, der verschiedenartigen [?]. Er schüttelte seine Barthaare, er richtete sich empor; mit seinen Heeren [Furcht] einflößend, mit Gabe [strahlend] [?] [Anm.: Textzustand fraglich]."},{"n":335,"sa":"satrāhaṇaṃ dādhṛṣiṃ tumramindraṃ mahāmapāraṃ vṛśabhaṃ suvajram\nhantā yo vṛtraṃ sanitota vājaṃ dātā maghāni maghavā surādhāḥ","de":"Den Feindbezwinger, den Kühnen, Ungestümen, Indra, den Großen, Unermesslichen, den Stier mit guter Keule; der Vṛtra erschlägt und Beute gewinnt, Güter gibt, der Gabenreiche, Gnadenreiche."},{"n":336,"sa":"yo no vanuṣyannabhidāti marta ugaṇā vā manyamānasturo vā\nkṣidhī yudhā śavasā vā tamindrābhī ṣyāma vṛṣamaṇastvotāḥ","de":"Welcher Sterbliche uns bedrängen will, uns angreift, ob er sich für stark hält oder eilig: vernichte ihn im Kampf oder mit Kraft, Indra; wir wollen ihn, von dir beschützt, mannhaft überwinden [?]."},{"n":337,"sa":"yaṃ vṛtreṣu kṣitaya spardhamānā yaṃ yukteṣu turayanto havante\nyaṃ śūrasātau yamapāmupajmanyaṃ viprāso vājayante sa indraḥ","de":"Ihn, den die Stämme in den Vṛtra-Kämpfen wetteifernd rufen, den die Eilenden beim Anschirren rufen, den in den Heldenkämpfen, den am Ort der Wasser [?], den die Redner mit Kraftpreis zu sich lenken: das ist Indra."},{"n":338,"sa":"indrāparvatā bṛhatā rathena vāmīriṣa ā vahataṃ suvīrāḥ\nvītaṃ havyānyadhvareṣu devā vardhethāṃ gīrbhīriḍayā madantā","de":"Indra und Parvata, bringt mit großem Wagen schöne Stärkungen herbei, mit guten Männern. Genießt die Darbringungen bei den Weihehandlungen, ihr Götter; wachst durch die Lieder, euch erfreuend an der Anrufung [iḍā]."},{"n":339,"sa":"indrāya giro aniśitasargā apaḥ prairayatsagarasya budhnāt\nyo akṣeṇeva cakriyau śacībhirviṣvaktastambha pṛthivīmuta dyām","de":"Für Indra [gehen] die Lieder, ungeschärft in ihrer Entsendung [?]; er trieb die Wasser vom Grund des Meeres hervor; er, der wie mit einer Achse zwei Räder mit seinen Kräften nach allen Seiten Erde und Himmel gestützt hat."},{"n":340,"sa":"ā tvā sakhāyaḥ sakhyā vavṛtyustiraḥ purū cidarṇavāṃ jagamyāḥ\npiturnapātamā dadhita vedhā asminkṣaye pratarāṃ dīdyānaḥ","de":"Die Freunde mögen dich mit Freundschaft herbeiwenden, auch über viele Fluten hinweg mögest du kommen; der Weise möge den Enkel des Vaters [napāt] in diesem Haus einsetzen, immer stärker leuchtend [?]."},{"n":341,"sa":"ko adya yuṅkte dhuri gā ṛtasya śimīvato bhāmino durhṛṇāyūn\nāsanneṣāmapsuvāho mayobhūnya eṣāṃ bhṛtyāmṛṇadhatsa jīvāt","de":"Wer schirrt heute an die Deichsel die Rinder der Ordnung, die kräftigen, glanzvollen, unversöhnlichen? Bei ihnen [sind] die Wasserfahrer, die Wohltäter; wer ihren Lohn erfüllt, der soll leben [?] [Anm.: Deutung unsicher]."}]},{"num":25,"loc":"Prapāṭhaka IV, Ardha 2, Daśati 6","n_from":342,"n_to":351,"title_de":"Indra-Lieder: Lobgesang, Somatrank und reiner Preis","note":"Kurze Gāyatrī-Verse an Indra.","units":[{"n":342,"sa":"gāyanti tvā gāyatriṇo 'rcantyarkamarkiṇaḥ\nbrahmāṇastvā śatakrata udvaṃśamiva yemire","de":"Dich besingen die Gāyatra-Sänger, den Strahl [arka] ehren die Strahl-Sänger; die Brahmanen haben dich, Hundertkräftiger, wie eine Stange emporgehoben."},{"n":343,"sa":"indraṃ viśvā avīvṛdhantsamudravyacasaṃ giraḥ\nrathītamaṃ rathīnāṃ vājānāṃ satpatiṃ patim","de":"Indra haben die Lieder groß gemacht, den, dessen Weite dem Meer gleicht, den besten Wagenkämpfer unter den Wagenkämpfern, den Herrn der Kraftpreise, den wahren Herrn."},{"n":344,"sa":"imamindra sutaṃ piba jyeṣṭhamamartyaṃ madam\nśukrasya tvābhyakṣarandhārā ṛtasya sādane","de":"Trink, Indra, diesen gepressten, ältesten, unsterblichen Rauschtrank; die Ströme des hellen [Soma] sind zu dir hingeflossen, am Sitz der Ordnung."},{"n":345,"sa":"yadindra citra ma iha nāsti tvādātamadrivaḥ\nrādhastanno vidadvasa ubhayāhastyā bhara","de":"Wenn ich, Indra, du Wundervoller, hier nichts von dir Gegebenes habe, Steinträger, so bring uns diese Gabe, du Gütersucher, mit beiden Händen."},{"n":346,"sa":"śrudī havaṃ tiraścyā indra yastvā saparyati\nsuvīryasya gomato rāyaspūrdhi mahāṃ asi","de":"Höre den Ruf des Tiraścī, Indra, der dich verehrt; fülle uns mit Reichtum an Mannhaftigkeit und Rindern; denn du bist groß."},{"n":347,"sa":"asāvi soma indra te śaviṣṭha dhṛṣṇavā gahi\nā tvā pṛṇaktvindriyaṃ rajaḥ sūryo na raśmibhiḥ","de":"Gepresst ist der Soma, Indra, für dich, du Stärkster; komm, Kühner. Die Indra-Kraft soll dich erfüllen wie die Sonne den Raum mit ihren Strahlen [?]."},{"n":348,"sa":"endra yāhi haribhirupa kaṇvasya suṣṭutim\ndivo amuṣya śāsato divaṃ yaya divāvaso","de":"Komm, Indra, mit den Falben zum schönen Lobgesang des Kaṇva. Vom jenseitigen Himmel her, der dort gebietet, geh zum [diesseitigen] Himmel, du Tages-Gutreicher [?]."},{"n":349,"sa":"ā tvā giro rathīrivāsthuḥ suteṣu girvaṇaḥ\nabhi tvā samanūṣata gāvo vatsaṃ na dhenavaḥ","de":"Zu dir sind die Lieder wie Wagenlenker emporgestiegen bei den Pressungen, Liederfreund; sie haben dir zugejauchzt wie die Milchkühe dem Kalb."},{"n":350,"sa":"eto nvindraṃ stavāma śuddhaṃ śuddhena sāmnā\nśuddhairukthairvāvṛdhvāṃsaṃ śuddhairāśīrvānmamattu","de":"Hierher: wir wollen Indra loben, den Reinen, mit reinem Sāman; den, der durch reine Sprüche gewachsen ist, soll der [Soma] mit reiner Milchmischung erfreuen."},{"n":351,"sa":"yo rayiṃ vo rayintamo yo dyumnairdyumnavattamaḥ\nsomaḥ sutaḥ sa indra te 'sti svadhāpate madaḥ","de":"Der Soma, der euch an Reichtum reichste, an Glanz glänzendste, gepresst — er ist, Indra, Herr der Svadhā, dein Rauschtrank."}]},{"num":26,"loc":"Prapāṭhaka IV, Ardha 2, Daśati 7","n_from":352,"n_to":359,"title_de":"Indra-Lieder: Gaben an den Kundigen, Dadhikrā, Burgenbrecher","note":"Vers 358 gilt dem Ross Dadhikrā, nicht Indra.","units":[{"n":352,"sa":"pratyasmai pipīṣate viśvāni viduṣe bhara\naraṅgamāya jagmaye 'paścādadhvane naraḥ","de":"Dem, der trinken will, dem Allwissenden, bringt alles dar; dem Wohlgehenden, dem Gekommenen, dessen Weg nicht rückwärts führt, ihr Männer [?]."},{"n":353,"sa":"ā no vayovayaḥśayaṃ mahāntaṃ gahvareṣṭhāṃ mahāntaṃ pūrvineṣṭhām\nugraṃ vaco apāvadhīḥ","de":"Zu uns [komm] ... den in jedem Lebewesen Liegenden, den Großen, den in der Tiefe Weilenden, den Großen, den im Alten Weilenden [?]; das grimmige Wort hast du zurückgeschlagen [?] [Anm.: Textzustand fraglich]."},{"n":354,"sa":"ā tvā rathaṃ yathotaye sumnāya vartayāmasi\ntuvikūrmimṛtīṣahamindraṃ śaviṣṭha satpatim","de":"Wir wenden dich wie einen Wagen zum Beistand, zum Wohl hierher: den Vielwirkenden, den Bezwinger der Angriffe, Indra, du Stärkster, den wahren Herrn."},{"n":355,"sa":"sa pūrvyo mahonāṃ venaḥ kratubhirānaje\nyasya dvārā manuḥ pitā deveṣu dhiya ānaje","de":"Er, der Erste unter den Mächtigen, der Strebende [Vena], wird durch Taten verherrlicht [?]; durch dessen Türen Manu, der Vater, unter den Göttern die Gedanken zum Ziel gebracht [oder: verherrlicht] hat [?] [Anm.: ānaje unsicher, √añj oder √aś]."},{"n":356,"sa":"yadī vahantyāśavo bhrājamānā ratheṣvā\npibanto madiraṃ madhu tatra śravāṃsi kṛṇvate","de":"Wenn die Raschen, glänzend, [ihn] in den Wagen herfahren, den berauschenden Honig trinkend, dann machen sie Ruhm."},{"n":357,"sa":"tyamu vo aprahaṇaṃ gṛṇīṣe śavasaspatim\nindraṃ viśvāsāhaṃ naraṃ śaciṣṭhaṃ viśvavedasam","de":"Ihn, euren Unantastbaren [?], preise ich, den Herrn der Kraft, Indra, den Allbezwinger, den Mann, den Fähigsten, den Allwissenden."},{"n":358,"sa":"dadhikrāvṇo akāriṣaṃ jiṣṇoraśvasya vājinaḥ\nsurabhi no mukhā karatpra na āyūṃṣi tāriṣat","de":"Dem Dadhikrā, dem siegreichen, rassigen Ross, habe ich [Lob] gemacht. Er soll unsere Münder duften machen; er soll unsere Lebensjahre verlängern."},{"n":359,"sa":"purāṃ bhinduryuvā kaviramitaujā ajāyata\nindro viśvasya karmaṇo dharttā vajrī puruṣṭutaḥ","de":"Der Burgenbrecher, jung, ein Weiser, von unermesslicher Kraft, wurde geboren: Indra, der Halter alles Wirkens, der Keulenträger, der Vielgepriesene."}]},{"num":27,"loc":"Prapāṭhaka IV, Ardha 2, Daśati 8","n_from":360,"n_to":369,"title_de":"Indra-Lieder und Verse an Uṣas, die Götter, Ṛc und Sāman","note":"Vers 367 gilt Uṣas, 368 den Göttern, 369 Ṛc und Sāman.","units":[{"n":360,"sa":"prapra vastriṣṭubhamiṣaṃ vandadvīrāyendave\ndhiyā vo medhasātaye purandhyā vivāsati","de":"Immer wieder [bringt man] euch die Triṣṭubh-Stärkung, dem Tropfen [Soma], dem Helden [?]; mit Andacht, mit reicher Gabe, zum Erlangen der Weisheit verehrt [er] euch [?] [Anm.: Textzustand fraglich]."},{"n":361,"sa":"kaśyapasya svarvido yāvāhuḥ sayujāviti\nyayorviśvamapi vrataṃ yajñaṃ dhīrā nicāyya","de":"Die beiden, von Kaśyapa, dem Lichtfinder, „Zusammengeschirrte“ genannt, auf deren ganze Ordnung die Weisen achteten bei der Weihehandlung [?]."},{"n":362,"sa":"arcata prārcatā naraḥ priyamedhāso arcata\narcantu putrakā uta puramiddhṛṣṇvarcata","de":"Singt, singt hin, ihr Männer; ihr Priyamedhas, singt. Auch die Söhnchen sollen singen; preist kühn die Burg [?]."},{"n":363,"sa":"ukthamindrāya śaṃsyaṃ vardhanaṃ puruniḥṣidhe\nśakro yathā suteṣu no rāraṇatsakhyeṣu ca","de":"Ein Spruch für Indra ist zu sagen, der stärkende, für den, der viele zurückstößt; möge der Kraftvolle bei unseren Pressungen und in den Freundschaften Freude daran haben."},{"n":364,"sa":"viśvānarasya vaspatimanānatasya śavasaḥ\nevaiśca carṣaṇīnāmūtī huve rathānām","de":"Den Herrn [?] des Allmännlichen, der unbeugsamen Kraft: auf den Bahnen der Völker rufe ich mit Beistand die Wagen [?] [Anm.: Textzustand fraglich]."},{"n":365,"sa":"sa ghā yaste divo naro dhiyā martasya śamataḥ\nūtī sa bṛhato divo dviṣo aṃho na tarati","de":"Der ist es, der dein Mann des Himmels ist, mit Andacht des sich mühenden Sterblichen; mit Beistand überwindet er die Feinde des hohen Himmels wie die Bedrängnis [?]."},{"n":366,"sa":"vibhoṣṭa indra rādhaso vibhvī rātiḥ śatakrato\nathā no viśvacarṣaṇe dyumnaṃ sudatra maṃhaya","de":"Weit ist deine Gabe, Indra, weitreichend die Schenkung, Hundertkräftiger. Und so, Allbeschauer, du Gabenschöner, erfreue uns mit Glanz."},{"n":367,"sa":"vayaścitte patatriṇo dvipāccatuṣpādarjuni\nuṣaḥ prārannṛtūṃranu divo antebhyaspari","de":"Auch die Vögel, die Fliegenden, Zweifüßer und Vierfüßer regten sich, glänzende Uṣas, den Zeiten folgend, von den Rändern des Himmels her."},{"n":368,"sa":"amī ye devā sthana madhya ā rocane divaḥ\nkadva ṛtaṃ kadamṛtaṃ kā pratnā va āhutiḥ","de":"Ihr Götter dort, die ihr in der Mitte im Lichtraum des Himmels seid: wo ist eure Ordnung, wo das Unsterbliche, wo eure alte Darbringung?"},{"n":369,"sa":"ṛcaṃ sāma yajāmahe yābhyāṃ karmāṇi kṛṇvate\nvi te sadasi rājato yajñaṃ deveṣu vakṣataḥ","de":"Ṛc und Sāman verehren wir, durch die man die Werke tut; sie beide leuchten in deiner Sitzung und bringen die Weihehandlung zu den Göttern."}]},{"num":28,"loc":"Prapāṭhaka IV, Ardha 2, Daśati 9","n_from":370,"n_to":380,"title_de":"Indra-Lieder: Herrscher der Kräfte, Vṛtra-Tat, Himmel und Erde","note":"Vers 378 preist Himmel und Erde, Vers 379 wendet sich an Indra als Geborenen der göttlichen Mutter.","units":[{"n":370,"sa":"viśvāḥ pṛtanā abhibhūtaraṃ naraḥ sajūstatakṣurindraṃ jajanuśca rājase\nkratve vare sthemanyāmurīmutogramojiṣṭhaṃ tarasaṃ tarasvinam","de":"Den, der alle Heere überwältigt, haben die Männer einträchtig gebildet und Indra zur Herrschaft erzeugt: zur Kraft, zur Wahl, zur Festigkeit, den Zerstörer [?], den Grimmigen, Kräftigsten, Kühnen, Stürmischen."},{"n":371,"sa":"śratte dadhāmi prathamāya manyave 'hanyaddasyuṃ naryaṃ viverapaḥ\nubhe yatvā rodasī dhāvatāmanu bhyasātte śuṣmātpṛthivī cidadrivaḥ","de":"Ich glaube deinem ersten Zorn, als du den Dasyu erschlugst und die Werke der Männer aufdecktest. Als dir die beiden Welten nachliefen, aus Furcht vor deinem Ungestüm, selbst die Erde, Steinträger."},{"n":372,"sa":"sameta viśvā ojasā patiṃ divo ya eka idbhūratithirjanānām\nsa pūrvyo nūtanamājigīṣaṃ taṃ varttanīranu vāvṛta eka it","de":"Kommt alle mit Kraft zusammen zum Herrn des Himmels, der der einzige Gast der Menschen wurde; er, der Alte, [ist der, für den] den neuen Sieg [?] [erstrebt wird]; ihm laufen die Bahnen nach, er ist der Einzige [?] [Anm.: Wortlaut unsicher]."},{"n":373,"sa":"ime ta indra te vayaṃ puruṣṭuta ye tvārabhya carāmasi prabhūvaso\nna hi tvadanyo girvaṇo giraḥ saghatkṣoṇīriva prati taddharya no vacaḥ","de":"Wir sind die deinen, Indra, wir, die wir, dich in Angriff nehmend, umhergehen, Vielgepriesener, Reichreicher. Denn kein anderer als du, Liederfreund, erreicht die Lieder; nimm, wie [die Länder] ..., unser Wort gern auf [?] [Anm.: Textzustand fraglich]."},{"n":374,"sa":"carṣaṇīdhṛtaṃ maghavānamukthyā3mindraṃ giro bṛhatīrabhyanūṣata\nvāvṛdhānaṃ puruhūtaṃ suvṛktibhiramartyaṃ jaramāṇaṃ divedive","de":"Den Völkerhalter, den Gabenreichen, den Lobenswerten, Indra, haben die hohen Lieder besungen; den, der wächst, den Vielgerufenen, mit guten Preisliedern, den Unsterblichen, der täglich gepriesen wird."},{"n":375,"sa":"acchā va indraṃ matayaḥ svaryuvaḥ sadhrīcīrviśvā uśatīranūṣata\npari ṣvajanta janayo yathā patiṃ maryaṃ na śundhyuṃ maghavānamūtaye","de":"Auf Indra zu haben [euch] die Gedanken, himmelsstrebend, zusammengewandt, alle sehnenden, gepriesen; sie umarmen ihn wie Frauen den Gatten, wie einen reinen Jüngling, den Gabenreichen, zur Hilfe [?]."},{"n":376,"sa":"abhi tyaṃ meṣaṃ puruhūtamṛgmiyamindraṃ gīrbhirmadatā vasvo arṇavam\nyasya dyāvo na vicaranti mānuṣaṃ bhuje maṃhiṣṭhamabhi vipramarcata","de":"Auf jenen Widder, den Vielgerufenen, Preiswürdigen, Indra, berauscht euch mit Liedern, das Meer der Güter, dessen [Tage?] nicht [unter] den Menschen dahinziehen [?]; preist zum Genuss den huldvollsten Weisen [Anm.: Deutung unsicher]."},{"n":377,"sa":"tyaṃ su meṣaṃ mahayā svarvidaṃ śataṃ yasya subhuvaḥ sākamīrate\natyaṃ na vājaṃ havanasyadaṃ rathamendraṃ vavṛtyāmavase suvṛktibhiḥ","de":"Jenen Widder, den Lichtfinder, verherrliche wohl, dessen hundert Gutwesen gemeinsam sich erheben; wie das Ross, den Kampfpreis, den zum Ruf eilenden Wagen wende ich Indra mit guten Preisliedern zur Hilfe herbei [?]."},{"n":378,"sa":"ghṛtavatī bhuvanānāmabhiśriyorvī pṛthvī madhudughe supeśasā\ndyāvāpṛthivī varuṇasya dharmaṇā viṣkabhite ajare bhūriretasā","de":"Schmalzreich, der Welten Zier, weit, breit, Honig melkend, schönförmig: Himmel und Erde, durch Varuṇas Satzung gestützt, alterslos, reichen Samens."},{"n":379,"sa":"ubhe yadindra rodasī āpaprāthoṣā iva\nmahāntaṃ tvā mahīnāṃ samrājaṃ carṣaṇīnām\ndevī janitryajījanadbhadrā janitryajījanat","de":"Als du, Indra, die beiden Welten erfüllt hast wie Uṣas — dich, den Großen, den Herrscher über die Mächtigen, über die Völker: die göttliche Mutter hat [dich] geboren, die glückliche Mutter hat dich geboren."},{"n":380,"sa":"pra mandine pitumadarcatā vaco yaḥ kṛṣṇagarbhā nirahannṛjiśvanā\navasyavo vṛṣaṇaṃ vajradakṣiṇaṃ marutvantaṃ sakhyāya huvemahi","de":"Dem Berauschenden singt nahrungsreiches Wort, der die von Kṛṣṇa Schwangeren [Anm.: die (Frauen) des Kṛṣṇa, schwanger] mit Ṛjiśvan herausschlug. Hilfe begehrend möchten wir den Stier rufen, den Keulenträger, den Marutbegleiteten, zur Freundschaft."}]},{"num":29,"loc":"Prapāṭhaka IV, Ardha 2, Daśati 10","n_from":381,"n_to":390,"title_de":"Indra-Lieder: Soma, Lobgesang und Sāman für den Kraftvollen","note":"Erste Daśati des Aindra-Kāṇḍa; durchgehend Preis und Anruf Indras beim Somapressen.","units":[{"n":381,"sa":"indra suteṣu someṣu kratuṃ punīṣa ukthyam\nvide vṛdhasya dakṣasya mahāṃ hi ṣaḥ","de":"Indra, wenn die Somasäfte gepresst sind, läutere die preiswürdige Geisteskraft [?]; ich habe (ihn) erkannt [?] als den Erstarkenden, den Tüchtigen, denn er ist der Große."},{"n":382,"sa":"tamu abhi pra gāyata puruhūtaṃ puruṣṭutam\nindraṃ gīrbhistaviṣamā vivāsata","de":"Ihn singt her, den Vielgerufenen, den Vielgepriesenen, Indra; mit Liedern werbt um den Kraftvollen, verehrt ihn."},{"n":383,"sa":"taṃ te madaṃ gṛṇīmasi vṛṣaṇaṃ pṛkṣu sāsahim\nu lokakṛtnumadrivo hariśriyam","de":"Diesen deinen Rausch preisen wir, den stierhaft Starken, der in den Kämpfen überwältigt, den Raumschaffer, Presssteinträger, der an den Falben (Ross-Schmuck) Glanz hat [?]."},{"n":384,"sa":"yatsomamindra viṣṇavi yadvā gha trita āptye\nyadvā marutsu mandase samindubhiḥ","de":"Wenn du, Indra, bei Viṣṇu [?], oder bei Trita Āptya, oder unter den Maruts dich berauschst, (so berausche dich) mit den Somatropfen."},{"n":385,"sa":"edu madhormadintaraṃ siñcādhvaryo andhasaḥ\nevā hi vīrastavate sadāvṛdhaḥ","de":"Her, gieße, Adhvaryu, vom Honigsüßen, dem berauschendsten (Trank) der Labung; denn so wird der Held gepriesen, der allzeit Stärkende."},{"n":386,"sa":"endumindrāya siñcata pibāti somyaṃ madhu\npra rādhāṃsi codayate mahitvanā","de":"Gießt den Tropfen (Soma) für Indra ein; er möge den Soma-Honig trinken; durch seine Größe treibt er Gaben herbei."},{"n":387,"sa":"eto nvindraṃ stavāma sakhāyaḥ stomyaṃ naram\nkṛṣṭīryo viśvā abhyastyeka it","de":"Wohlan, lasst uns nun Indra preisen, Freunde, den preiswürdigen Mann, der als Einziger alle Völker überragt."},{"n":388,"sa":"indrāya sāma gāyata viprāya bṛhate bṛhat\nbrahmakṛte vipaścite panasyave","de":"Für Indra singt das Sāman, für den Seher, den Großen, das Große; für den Gebetschaffenden, Weisen, Rühmenswerten."},{"n":389,"sa":"ya eka idvidayate vasu martāya dāśuṣe\nīśāno apratiṣkuta indro aṅga","de":"Der als Einziger dem opfernden Sterblichen Gut zuteilt, Herr (über alles), unbezwingbar, Indra, ja."},{"n":390,"sa":"sakhāya ā śiṣāmahe brahmendrāya vajriṇe\nstuṣa ū ṣu vo nṛtamāya dhṛṣṇave","de":"Freunde, wir wollen (ihn) anrufen [?]: ein Gebet dem Keilträger Indra; ich preise euch den Mannhaftesten, den Kühnen [?]."}]},{"num":30,"loc":"Prapāṭhaka V, Ardha 1, Daśati 1","n_from":391,"n_to":398,"title_de":"Indra: Vṛtra-Töter, Divodāsa und Bitte an die Ādityas","note":"Die Verse 395–397 wenden sich an die Ādityas.","units":[{"n":391,"sa":"gṛṇe tadindra te śava upamāṃ devatātaye\nyaddhaṃsi vṛtramojasā śacīpate","de":"Ich preise, Indra, diese deine höchste Kraft für die Versammlung der Götter [?], mit der du den Vṛtra durch Stärke erschlägst, Herr der Śacī (Macht)."},{"n":392,"sa":"yasya tyacchambaraṃ made divodāsāya randhayan\nayaṃ sa soma indra te sutaḥ piba","de":"Der du im Rausch für Divodāsa jenen Śambara niederwarfst [?] — dieser Soma, Indra, ist dir gepresst; trink."},{"n":393,"sa":"endra no gadhi priya satrājidagohya\ngirirna viśvataḥ pṛthuḥ patirdivaḥ","de":"Komm her zu uns, Lieber, Siegreicher, der nichts Verborgenes [?] vor uns hat, wie ein Berg nach allen Seiten weit, Herr des Himmels."},{"n":394,"sa":"ya indra somapātamo madaḥ śaviṣṭha cetati\nyenā haṃsi nyā3triṇaṃ tamīmahe","de":"Der Rausch, Indra, der somatrinkendste, Kräftigster, der sich bemerkbar macht — durch den du den Nyāttriṇa [?] erschlägst —, den erbitten wir. [Anm.: nyā3triṇam, Wortlaut mit Pluti; Bedeutung unsicher, etwa „den Niederfresser“]"},{"n":395,"sa":"tuce tunāya tatsu no drādhīya āyurjīvase\nādityāsaḥ samahasaḥ kṛṇotana","de":"Für Nachkommenschaft, für Nachwuchs, dazu ein langes Leben für uns, zum Leben: Ādityas, gleich Starke [?], schafft es."},{"n":396,"sa":"vetthā hi nirṛtīnāṃ vajrahasta parivṛjam\naharahaḥ śundhyuḥ paripadāmiva","de":"Du kennst ja, Keilträger, das Umgehen der Nirṛtis (Verderbnisse); Tag für Tag (bist du) wie einer, der die Fallstricke reinigt [?]."},{"n":397,"sa":"apāmīvāmapa stridhamapa sedhata durmatim\nādityāso yuyotanā no aṃhasaḥ","de":"Wehrt die Seuche ab, wehrt die Bedrängnis [?] ab, wehrt die böse Gesinnung ab; Ādityas, löst uns von der Bedrängnis."},{"n":398,"sa":"pibā somamindra mandatu tvā yaṃ te suṣāva haryaśvādriḥ\nsoturbāhubhyāṃ suyato nārvā","de":"Trink Soma, Indra, er soll dich berauschen, den dir, Falbenlenker, der Stein gepresst hat, von des Pressers Armen gut gehalten, wie ein Renner [?]."}]},{"num":31,"loc":"Prapāṭhaka V, Ardha 1, Daśati 2","n_from":399,"n_to":408,"title_de":"Indra: Freundschaft, Kampfgespann und Anruf mit den Maruts","note":"Verse 401 und 404 betreffen die Maruts.","units":[{"n":399,"sa":"abhrātṛvyo anā tvamanāpirindra januṣā sanādasi\nyudhedāpitvamicchase","de":"Ohne Rivalen, ohne Anhang [?] bist du, Indra, von Geburt an von jeher; im Kampf suchst du Gefährtenschaft."},{"n":400,"sa":"yo na idamidaṃ purā pra vasya ānināya tamu va stuṣe\nsakhāya indramūtaye","de":"Der uns dies und das von früher her zum Besseren geführt hat — ihn preise ich euch, Freunde: Indra, zur Hilfe."},{"n":401,"sa":"ā gantā mā riṣaṇyata prasthāvāno māpa sthāta samanyavaḥ\ndṛḍhā cidyamayiṣṇavaḥ","de":"Kommt her, schadet nicht, ihr Aufbrechenden, geht nicht davon, Gleichgesinnte, ihr, die ihr auch Festes zügelt [?]."},{"n":402,"sa":"ā yāhyayamindave 'śvapate gopata urvarāpate\nsomaṃ somapate piba","de":"Komm her; dies (ist) für den Saft [?], Herr der Rosse, Herr der Kühe, Herr der Fluren: Soma, Somaherr, trink."},{"n":403,"sa":"tvayā ha svidyujā vayaṃ prati śvasantaṃ vṛṣabha bruvīmahi\nsaṃsthe janasya gomataḥ","de":"Mit dir als Gespannen, Stier, wollen wir dem Schnaubenden (Feind) entgegnen im Zusammenstoß des kuhreichen Volkes [?]."},{"n":404,"sa":"gāvaściddhā samanyavaḥ sajātyena marutaḥ sabandhavaḥ\nrihate kakubho mithaḥ","de":"Auch die Kühe, gleichgesinnt, die Maruts, gleichen Geschlechts, verwandt, lecken einander die Höhen [?]."},{"n":405,"sa":"tvaṃ na indrā bhara ojo nṛmṇaṃ śatakrato vicarṣaṇe\nā vīraṃ pṛtanāsaham","de":"Du, Indra, bring uns Kraft und Mannhaftigkeit, Hundertkräftiger, Umsichtiger: einen kampfbezwingenden Helden."},{"n":406,"sa":"adhā hīndra girvaṇa upa tvā kāma īmahe sasṛgmahe\nudeva gmanta udabhiḥ","de":"Nun denn, Liedliebender Indra, haben wir nach dir Verlangen, wir strömen zu dir [?], wie Wasser mit Wassern zur Tiefe gehen [?]."},{"n":407,"sa":"sīdantaste vayo yathā gośrīte madhau madire vivakṣaṇe\nabhi tvāmindra nonumaḥ","de":"Es lassen sich für dich nieder wie Vögel bei dem kuhbereiteten Honigtrank, dem berauschenden, dem Sprudelnden [?]; dir, Indra, rufen wir laut zu."},{"n":408,"sa":"vayamu tvāmapūrvya sthūraṃ na kaccidbharanto 'vasyavaḥ\nvajriñcitraṃ havāmahe","de":"Wir aber rufen dich, Unvergleichlicher, hilfesuchend, wie einer, der eine schwere Last trägt [?]: Keilträger, Wunderreicher."}]},{"num":32,"loc":"Prapāṭhaka V, Ardha 1, Daśati 3","n_from":409,"n_to":418,"title_de":"Indra: Selbstherrschaft, Somarausch, Kampf und Aśvin-Anruf","note":"Refrain „arcann anu svarājyam“ in mehreren Versen; 417–418 mit Wechsel zu Himmelsbildern und Aśvins.","units":[{"n":409,"sa":"svādoritthā viṣūvato madhoḥ pibanti gauryaḥ\nyā indreṇa sayāvarīrvṛṣṇā madanti śobhathā vasvīranu svarājyam","de":"Vom süßen, allseitig verbreiteten Honig trinken so die Gaurīs [?], die mit Indra dahinziehen, vom Stier berauscht, prachtvoll, gütig — der Selbstherrschaft gemäß. [Anm.: gauryaḥ = „weiße/Büffelkühe“ oder „Wasser“, unsicher]"},{"n":410,"sa":"itthā hi soma inmado brahma cakāra vardhanam\nśaviṣṭha vajrinnojasā pṛthivyā niḥ śaśā ahimarcannanu svarājyam","de":"So hat, vom Soma berauscht, das Gebet das Stärkende gemacht. Kräftigster, Keilträger, mit Kraft schnittest du den Drachen aus der Erde heraus [?], während man (dir) huldigte — der Selbstherrschaft gemäß."},{"n":411,"sa":"indro madāya vāvṛdhe śavase vṛtrahā nṛbhiḥ\ntaminmahatsvājiṣūtimarbhe havāmahe sa vājeṣu pra no 'viṣat","de":"Indra ist zum Rausch, zur Stärke erstarkt, der Vṛtra-Töter, mit den Männern. Ihn rufen wir um Hilfe in großen Kämpfen wie im Kleinen; er hat uns in den Wettkämpfen gefördert."},{"n":412,"sa":"indra tubhyamidadrivo 'nuttaṃ vajrinvīryam\nyaddha tyaṃ māyinaṃ mṛgaṃ tava tyanmāyayāvadhīrarcannanu svarājyam","de":"Indra, dir gehört, Presssteinträger, diese unübertroffene Heldenkraft, Keilträger: dass du jenes Zauberwild [?] erschlugst, das war durch deine Zauberkraft, während man huldigte — der Selbstherrschaft gemäß."},{"n":413,"sa":"prehyabhīhi dhṛṣṇuhi na te vajro ni yaṃsate\nindra nṛmṇaṃ hi te śavo hano vṛtraṃ jayā apo 'rcannanu svarājyam","de":"Geh vor, greif an, sei kühn! Dein Keil wird nicht aufgehalten. Indra, dein Ungestüm ist Mannheit; du erschlugst Vṛtra, gewannst die Wasser, während man huldigte — der Selbstherrschaft gemäß."},{"n":414,"sa":"yadudīrata ājayo dhṛṣṇave dhīyate dhanam\nyuṅkṣvā madacyutā harī kaṃ hanaḥ kaṃ vasau dadho 'smāṃ indra vasau dadhaḥ","de":"Wenn die Kämpfe sich erheben, wird dem Kühnen Beute zugewiesen. Schirre die rauschbringenden Falben an! Wen erschlägst du, wen setzt du in Besitz? Uns, Indra, setze in Besitz."},{"n":415,"sa":"akṣannamīmadanta hyava priyā adhūṣata\nastoṣata svabhānavo viprā naviṣṭhayā matī yojā nvindra te harī","de":"Sie haben gefressen, haben sich berauscht, die Lieben haben sich geschüttelt [?]. Es haben gepriesen die selbstleuchtenden Seher mit dem neuesten Gedanken. Nun sind deine Falben angeschirrt, Indra."},{"n":416,"sa":"upo ṣu śṛṇuhī giro maghavanmātathā iva\nkadā naḥ sūnṛtāvataḥ kara idarthayāsa idyojā nvindra te harī","de":"Höre denn gut die Lieder, Maghavan, nicht wie [?] mātathā iva [Anm.: Textzustand fraglich]. Wann wirst du uns, die wir Wahrheitsworte sprechen, gewiss zum Erbetenen machen [?]? Nun sind deine Falben angeschirrt, Indra."},{"n":417,"sa":"candramā apsvā3ntarā suparṇo dhāvate divi\nna vo hiraṇyanemayaḥ padaṃ vindanti vidyuto vittaṃ me asya rodasī","de":"Der Mond läuft in den Wassern dazwischen, der Vogel [?] eilt am Himmel; euch, goldradfelgige Blitze, finden die (Menschen) den Ort nicht. Merkt euch dies von mir, ihr beiden Welten. [Anm.: Wortlaut und Bezug unsicher]"},{"n":418,"sa":"prati priyatamaṃ rathaṃ vṛṣaṇaṃ vasuvāhanam\nstotā vāmaśvināvṛśi stomebhirbhūṣati prati mādhvī mama śrutaṃ havam","de":"Zum liebsten Wagen hin, dem stierstarken, gutbringenden: euch, Aśvins, schmückt der Sänger-Seher mit Preisliedern; ihr Honigreichen, hört meinen Ruf."}]},{"num":33,"loc":"Prapāṭhaka V, Ardha 1, Daśati 4","n_from":419,"n_to":426,"title_de":"Agni-Verse mit Indra-Refrain: Entzünden, Wecken, Labung","note":"Agni, Uṣas und Indra wechseln; Refrainzeilen („yojā nv indra te harī“, „iṣaṃ stotṛbhya ā bhara“) verbinden die Verse.","units":[{"n":419,"sa":"ā te agna idhīmahi dyumantaṃ devājaram\nyuddha syā te panīyasī samiddīdayati dyavīṣaṃ stotṛbhya ā bhara","de":"Wir entzünden dir, Agni, den glänzenden, götterunalternden (Brennstoff); denn deine hochlobenswerte Flamme leuchtet am Himmel auf [?]; bring den Sängern Labung."},{"n":420,"sa":"āgniṃ na svavṛktibhirhotāraṃ tvā vṛṇīmahe\nśīraṃ pāvakaśociṣaṃ vi vo made yajñeṣu stīrṇabarhiṣaṃ vivakṣase","de":"Wie Agni wählen wir dich mit guten Lobgesängen, den Rufer, den Schnellen [?], den rein Leuchtenden, ... in eurem Rausch bei den Weihehandlungen, den mit Streu Bedeckten, du willst dich äußern. [Anm.: Textzustand fraglich; „vi vo made“ unklar]"},{"n":421,"sa":"mahe no adya bodhayoṣo rāye divitmatī\nyathā cinno abodhayaḥ satyaśravasi vāyye sujāte aśvasūnṛte","de":"Zu großem Reichtum wecke uns heute, Uṣas, himmelglänzende; wie du uns (früher) geweckt hast, Wahrheitsruhmreiche [Anm.: oder Name Satyaśravas], Vāyyā [?], Wohlgeborene, rossreiche Freundliche."},{"n":422,"sa":"bhadraṃ no api vātaya mano dakṣamuta kratum\nathā te sakhye andhaso vi vo made raṇā gāvo na yavase vivakṣase","de":"Bring uns auch Heil zu, Geist, Tüchtigkeit und Einsicht; dann in deiner Freundschaft, Labung — in eurem Rausch wirst du (laut) tönen wie Kühe im Weideland [?]. [Anm.: Textzustand fraglich]"},{"n":423,"sa":"kratvā mahāṃ anuṣvadhaṃ bhīma ā vāvṛte śavaḥ\nśriya ṛṣva upākayorni śiprī harivāṃ dadhe hastayorvajramāyasam","de":"Durch Einsicht groß, seiner Eigenart nach furchtbar hat sich (seine) Kraft gewendet; der Hohe, der Kinnbackige [?], falbenbespannt, hält zur Pracht in beiden Händen den ehernen Keil."},{"n":424,"sa":"sa ghā taṃ vṛṣaṇaṃ rathamadhi tiṣṭhāti govidam\nyaḥ pātraṃ hāriyojanaṃ pūrṇamindrā ciketati yojā nvindra te harī","de":"Der besteigt den stierhaften, kuhfindenden Wagen, der das mit Falben-Anschirrung verbundene, volle Gefäß erkennt [?], Indra. Nun sind deine Falben angeschirrt."},{"n":425,"sa":"agniṃ taṃ manye yo vasurastaṃ yaṃ yanti dhenavaḥ\nastamarvanta āśavo 'staṃ nityāso vājina iṣaṃ stotṛbhya ā bhara","de":"Agni nenne ich den, der Gut (und) Heimstatt ist, die Heimstatt, zu der die Milchkühe gehen; Heimstatt sind die raschen Renner, Heimstatt die ewigen Kraftrosse; bring den Sängern Labung."},{"n":426,"sa":"na tamaṃho na duritaṃ devāso aṣṭa martyam\nsajoṣaso yamaryamā mitro nayati varuṇo ati dviṣaḥ","de":"Ihn erreicht nicht Bedrängnis, nicht Unheil, ihr Götter, den Sterblichen, den Aryaman, Mitra, Varuṇa, einmütig, über die Hasser hinwegführen."}]},{"num":34,"loc":"Prapāṭhaka V, Ardha 1, Daśati 5","n_from":427,"n_to":436,"title_de":"Soma-Klärung und Anrufungen für Indra, Mitra, Pūṣan, Bhaga","note":"Kurze Verse (viele aus dem Pavamāna-Bereich) über Soma, dazu ein Agni-Vers (434).","units":[{"n":427,"sa":"pari pra dhanvendrāya soma svādurmitrāya pūṣṇe bhagāya","de":"Ström herbei, Soma, süß, für Indra, für Mitra, für Pūṣan, für Bhaga."},{"n":428,"sa":"paryū ṣu pra dhanva vājasātaye pari vṛtrāṇi sakṣaṇiḥ\ndviṣastaradhyā ṛṇayā na īrase","de":"Ström nur wohl umher, um Beute zu gewinnen, die Widerstände überwältigend; um die Hasser zu überwinden, treibst du auf uns zu als Schuldentilger [?]."},{"n":429,"sa":"pavasva soma mahāntsamudraḥ pitā devānāṃ viśvābhi dhāma","de":"Klär dich, Soma, großer Ozean, Vater der Götter, jede Stätte durchdringend."},{"n":430,"sa":"pavasva soma mahe dakṣāyāśvo na nikto vājī dhanāya","de":"Klär dich, Soma, zu großer Tüchtigkeit, wie ein gewaschener Renner zum Gewinn."},{"n":431,"sa":"induḥ paviṣṭa cārurmadāyāpāmupasthe kavirbhagāya","de":"Der Tropfen hat sich geklärt, lieblich, zum Rausch, im Schoß der Wasser, der Seher, zum Anteil (Bhaga)."},{"n":432,"sa":"anu hi tvā sutaṃ soma madāmasi mahe samaryarājye\nvājāṃ abhi pavamāna pra gāhase","de":"Nach dir, Soma, dem Gepressten, berauschen wir uns, im großen Reich der Zusammenkunft [?]; die Kräfte durchdringst du, Klärender."},{"n":433,"sa":"ka īṃ vyaktā naraḥ sanīḍā rudrasya maryā atha svaśvāḥ","de":"Wer sind sie, die Erkennbaren [?], die Männer, einträchtig, die Männer Rudras, dann die Gutrossigen?"},{"n":434,"sa":"agne tamadyāśvaṃ na stomaiḥ kratuṃ na bhadraṃ hṛdispṛśam\nṛdhyāmā ta ohaiḥ","de":"Agni, dich heute wie ein Ross mit Preisliedern, wie gute Einsicht, die das Herz berührt: wir möchten mit deinen Gaben gedeihen [?]."},{"n":435,"sa":"āvirmaryā ā vājaṃ vājino agmaṃ devasya savituḥ savam\nsvargāṃ arvanto jayata","de":"Offenbar, ihr Männer, haben wir als Rennende die Beute erreicht, den Antrieb des Gottes Savitṛ; himmelgewinnende Renner, siegt."},{"n":436,"sa":"pavasva soma dyumnī sudhāro mahāṃ avīnāmanupūrvyaḥ","de":"Klär dich, Soma, glanzvoll, mit guten Strömen, großer, der (Schafwoll-Seihe) der Schafe der Reihe nach [?] zuerst."}]},{"num":35,"loc":"Prapāṭhaka V, Ardha 2, Daśati 6","n_from":437,"n_to":446,"title_de":"Kurzverse für Indra, Agni und Götter: Gabe, Wagen, Reichtum","note":"Sehr kurze Verse; Textzustand teilweise fraglich.","units":[{"n":437,"sa":"viśvatodāvanviśvato na ā bhara yaṃ tvā śaviṣṭhamīmahe","de":"Allseitig Gebender, bring uns von allen Seiten (Gaben), du, den wir, Kräftigster, bitten."},{"n":438,"sa":"eṣa brahmā ya ṛtviya indro nāma śruto gṛṇe","de":"Dies ist der Brahman [?], der zeitgerechte, Indra mit Namen, berühmt; ich preise (ihn)."},{"n":439,"sa":"brahmāṇa indraṃ mahayanto arkairavardhayannahaye hantavā u","de":"Die Gebetsdichter, Indra mit Liedern erhöhend, haben ihn gestärkt, um die Schlange zu erschlagen."},{"n":440,"sa":"anavaste rathamaśvāya takṣustvaṣṭā vajraṃ puruhūta dyumantam","de":"Sie zimmerten den Wagen für das Ross [?], Tvaṣṭṛ den glänzenden Keil, Vielgerufener. [Anm.: „anavaḥ“ unklar, Textzustand fraglich]"},{"n":441,"sa":"śaṃ padaṃ maghaṃ rayīṣiṇo na kāmamavrato hinoti na spṛśadrayim","de":"Heilsam der Tritt [?], die Gabe; der Reichtumsuchende ... der Gesetzlose fördert den Wunsch nicht und erreicht den Reichtum nicht [?]. [Anm.: Textzustand fraglich]"},{"n":442,"sa":"sadā gāvaḥ śucayo viśvadhāyasaḥ sadā devā arepasaḥ","de":"Immer sind die Kühe rein, allernährend; immer die Götter makellos."},{"n":443,"sa":"ā yāhi vanasā saha gāvaḥ sacanta varttaniṃ yadūdhabhiḥ","de":"Komm her mit Verlangen [?]; die Kühe folgen der Bahn, wenn (sie) mit Eutern (kommen) [?]."},{"n":444,"sa":"upa prakṣe madhumati kṣiyantaḥ puṣyema rayiṃ dhīmahe ta indra","de":"Im honigreichen Nahrungsort wohnend, mögen wir gedeihen und Reichtum erlangen von dir, Indra."},{"n":445,"sa":"arcantyarkaṃ marutaḥ svarkkā ā stobhati śruto yuvā sa indraḥ","de":"Die Maruts singen das Lied, schön singend; er stimmt an, berühmt, jung — er ist Indra."},{"n":446,"sa":"pra va indrāya vṛtrahantamāya viprāya gāthaṃ gāyata yaṃ jujoṣate","de":"Für euren Vṛtra-tötendsten Seher Indra singt das Lied, den sie gern haben."}]},{"num":36,"loc":"Prapāṭhaka V, Ardha 2, Daśati 7","n_from":447,"n_to":456,"title_de":"Kurzverse: Agni, Uṣas, Indra und alle Götter","note":"Kurze, teils textlich unsichere Verse.","units":[{"n":447,"sa":"acetyagniścikitirhavyavāḍna sumadrathaḥ","de":"Erkannt ist Agni, der Erkennende, der Opfergutfahrer, wie einer mit schönem Rauschwagen [?]."},{"n":448,"sa":"agne tvaṃ no antama uta trātā śivo bhuvo varūthyaḥ","de":"Agni, du bist uns der Nächste, auch Retter, freundlich sei, schützend."},{"n":449,"sa":"bhago na citro agnirmahonāṃ dadhāti ratnam","de":"Wie Bhaga der strahlende Agni: er verleiht der Gaben Kleinod [?]."},{"n":450,"sa":"viśvasya pra stobha puro vā sanyadi veha nūnam","de":"Des Alls ... [Anm.: Textzustand fraglich] vorn oder wenn hier jetzt [?]."},{"n":451,"sa":"uṣā apa svasuṣṭamaḥ saṃ varttayati varttaniṃ sujātatā","de":"Uṣas treibt das Dunkel ihrer Schwester weg und wendet die Bahn, durch edle Abkunft [?]."},{"n":452,"sa":"imā nu kaṃ bhuvanā sīṣadhemendraśca viśve ca devāḥ","de":"Diese Welten wollen wir nun gewinnen [?], Indra und alle Götter."},{"n":453,"sa":"vi srutayo yathā patha indra tvadyantu rātayaḥ","de":"Wie Ströme auseinander auf Wegen, Indra, mögen von dir Gaben ausgehen."},{"n":454,"sa":"ayā vājaṃ devahitaṃ sanema madema śatahimāḥ suvīrāḥ","de":"Hiermit möchten wir die von den Göttern bestimmte Beute gewinnen, uns freuen hundert Winter lang, mit guten Helden."},{"n":455,"sa":"ūrjā mitro varuṇaḥ pinvateḍāḥ pīvarīmiṣaṃ kṛṇuhī na indra","de":"Mit Kraft lassen Mitra und Varuṇa die Iḍās schwellen; mach uns, Indra, die Labung dick."},{"n":456,"sa":"indro viśvasya rājati","de":"Indra herrscht über alles."}]},{"num":37,"loc":"Prapāṭhaka V, Ardha 2, Daśati 8","n_from":457,"n_to":466,"title_de":"Indra, Soma, Savitṛ und Agni: längere Verse mit Refrains","note":"Längere Verse (Ṛgveda-Parallelen); teils unsicherer Textzustand.","units":[{"n":457,"sa":"trikadrukeṣu mahiṣo yavāśiraṃ tuviśuṣmastṛmpatsomamapibadviṣṇunā sutaṃ yathāvaśam\nsa īṃ mamāda mahi karma karttave mahāmuruṃ sainaṃ saścaddevo devaṃ satya induḥ satyamindram","de":"Bei den Trikadrukas trank der Mächtige, Kraftvolle, sich sättigend, den mit Gerste vermischten Soma, von Viṣṇu [?] gepresst, nach Belieben. Er berauschte sich daran, um große Tat zu tun; den Großen, Weiten soll dieser Gott, der wahre Tropfen, als Gott den wahren Indra erreichen. [Anm.: trikadrukeṣu = Bezeichnung von Somagefäßen oder Tagen, unsicher]"},{"n":458,"sa":"ayaṃ sahasramānavo dṛśaḥ kavīnāṃ matirjyotirvidharma\nbradhnaḥ samīcīruṣasaḥ samairayadarepasaḥ socetasaḥ svasare manyumantaścitā goḥ","de":"Dieser (Soma) mit tausendfachem Maß [?], Blick der Seher, Einsicht, Licht, Stütze; der Rote [?] ließ die einträchtigen Morgenröten zusammen aufgehen, die makellosen, gleichgesinnten, zur Wohnstatt [?], zornvollen [?], nach der Kuh [?]. [Anm.: Textzustand fraglich]"},{"n":459,"sa":"endra yāhyupa naḥ parāvato nāyamacchā vidathānīva satpatirastā rājeva satpatiḥ\nhavāmahe tvā prayasvantaḥ suteṣvā putrāso na pitaraṃ vājasātaye maṃhiṣṭhaṃ vājasātaye","de":"Komm her, Indra, von fern zu uns, nicht wie [?] ein guter Hausherr zu Zusammenkünften, wie ein König, Herr der Guten, ein Schütze [?]. Wir rufen dich, Opfergabenreiche, bei den Pressungen, wie Söhne den Vater, zum Beutegewinn, den Freigebigsten zum Beutegewinn."},{"n":460,"sa":"tamindraṃ johavīmi maghavānamugraṃ satrā dadhānamapratiṣkutaṃ śravāṃsi bhūriḥ\nmaṃhiṣṭho gīrbhirā ca yajñiyo vavartta rāye no viśvā supathā kṛṇotu vajrī","de":"Ihn, Indra, rufe ich immer wieder, den Gabenreichen, Grimmigen, der allzeit (Gutes) bereithält, den Unwiderstehlichen, der viele Ruhmestaten (vollbringt). Der Freigebigste, mit Liedern und in der Weihehandlung zu Verehrende, möge sich (uns) zuwenden; zum Reichtum soll uns alle Wege gut machen der Keilträger."},{"n":461,"sa":"astu śrauṣṭpuro agniṃ dhiyā dadha ā nu tyacchardho divyaṃ vṛṇīmaha indravāyū vṛṇīmahe\nyaddha krāṇā vivasvate nābhā sandāya navyase\nadha pra nūnamupa yanti dhītayo devāṃacchā na dhītayaḥ","de":"Es geschehe: er möge hören! Vorne setzen wir Agni mit Andacht; nun wählen wir jene himmlische Schar, Indra und Vāyu wählen wir. Wenn ... dem Vivasvat ... am Nabel [?] ... zum Neuen [?]. Dann gehen jetzt die Andachten hin, wie Andachten zu den Göttern. [Anm.: Textzustand fraglich]"},{"n":462,"sa":"pra vo mahe matayo yantu viṣṇave marutvate girijā evayāmarut\npra śardhāya pra yajyave sukhādaye tavase bhandadiṣṭaye dhunivratāya śavase","de":"Zu euch, den Großen: die Gedanken sollen gehen zu Viṣṇu, zum Marutbegleiteten [?], liedgeboren [Anm.: „evayāmarut“ Eigenname oder Beiwort, unsicher]; zum Trotzigen, Verehrungswürdigen, gut Essenden [?], Kraftvollen, Preiswürdigsten, Schüttler-Ordnungen (dhunivrata) Haltenden, Starken."},{"n":463,"sa":"ayā rucā hariṇyā punāno viśvā dveṣāṃsi tarati sayugvabhiḥ sūro na sayugvabhiḥ\ndhārā pṛṣṭhasya rocate punāno aruṣo hariḥ\nviśvā yadrūpā pariyāsyṛkvabhiḥ saptāsyebhirṛkvabhiḥ","de":"Mit diesem gelben Licht klärend überwindet er alle Feindschaften mit seinen Gleichgespannten, wie die Sonne mit ihren Gleichgespannten. Der Strom des Rückens leuchtet, klärend, der rötliche Falbe. Wenn du alle Gestalten umkreist mit den Strahlenden [?], den siebenmündigen Strahlenden."},{"n":464,"sa":"abhi tyaṃ devaṃ savitāramoṇyoḥ kavikratumarcāmi satyasavaṃ ratnadhāmabhi priyaṃ matim\nūrdhvā yasyāmatirbhā adidyutatsavīmani hiraṇyapāṇiramimīta sukratuḥ kṛpā svaḥ","de":"Zu jenem Gott Savitṛ hin singe ich in den beiden Bechern [?], dem seherweisen, wahren Antrieb, Schatzbewahrer, zur lieben Einsicht. Dessen hoch aufragender Glanz [?] leuchtete auf bei seinem Antrieb; der Goldhändige, Kluge maß aus Gnade das Licht ab."},{"n":465,"sa":"agniṃ hotāraṃ manye dāsvantaṃ vasoḥ sūnuṃ sahaso jātavedasaṃ vipraṃ na jātavedasam\nya ūrdhvayā svadhvaro devo devācyā kṛpā\nghṛtasya vibhrāṣṭimanu śukraśociṣa ājuhvānasya sarpiṣaḥ","de":"Agni, den Rufer, halte ich für den Gabenreichen, den Sohn der Stärke [?], Jātavedas, den Seher wie Jātavedas. Der aufrecht, gut opfernd, als Gott mit gottzugewandter Gnade (wirkt); dem Glanz des Ghees nach, dem hell Leuchtenden, dem zugegossen wird, dem Schmelzbutter."},{"n":466,"sa":"tava tyannaryaṃ nṛto 'pa indra prathamaṃ pūrvyaṃ divi pravācyaṃ kṛtam\nyo devasya śavasā prāriṇā asu riṇannapaḥ\nbhuvo viśvamabhyadevamojasā videdūrjaṃ śatakraturvidediṣam","de":"Diese deine männliche Tat, Männerbewegender [?], Indra: die Wasser als erste, urzeitliche, im Himmel zu verkündende wurde getan; der du durch des Gottes Kraft das Leben freiließest, die Wasser strömen ließest [?]. Du wurdest durch Kraft über alles Gottlose Herr; finden möge der Hundertkräftige Stärke, finden Labung."}]}],"pavamana":[{"num":1,"loc":"Prapāṭhaka V, Ardha 2, Daśati 9","n_from":467,"n_to":476,"title_de":"Soma Pavamāna: Strom des Rausches für Indra und die Maruts","note":"Zehn Verse an den sich klärenden Soma; Bezug auf Indra, die Marut, Vāyu.","units":[{"n":467,"sa":"uccā te jātamandhaso divi sadbhūmyā dade\nugraṃ śarma mahi śravaḥ","de":"Hoch ist deine Geburt, o Saft: im Himmel sitzend [?] habe ich [Anm.: dade, auch „er gibt/hat empfangen“ möglich] auf der Erde (sie) empfangen [?]; gewaltigen Schutz, große Berühmtheit."},{"n":468,"sa":"svādiṣṭhayā madiṣṭhayā pavasva soma dhārayā\nindrāya pātave sutaḥ","de":"Mit dem süßesten, berauschendsten Strom fließe klar, Soma; für Indra zum Trinken bist du gepresst."},{"n":469,"sa":"vṛṣā pavasva dhārayā marutvate ca matsaraḥ\nviśvā dadhāna ojasā","de":"Als Stier fließe klar im Strom, auch für den Marut-Begleiteten, der Berauschende, alle Kräfte mit Macht tragend."},{"n":470,"sa":"yaste mado vareṇyastenā pavasvāndhasā\ndevāvīraghaśaṃsahā","de":"Dein Rausch, der wählenswert ist, mit diesem Saft fließe klar: der die Götter Schützende, der Übelredner Erschlagende."},{"n":471,"sa":"tisro vāca udīrate gāvo mimanti dhenavaḥ\nharireti kanikradat","de":"Drei Stimmen erheben sich, die Kühe brüllen, die Milchkühe; der Falbe kommt, laut aufbrüllend."},{"n":472,"sa":"indrāyendo marutvate pavasva madhumattamaḥ\narkasya yonimāsadam","de":"Für Indra, o Tropfen, den Marut-Begleiteten, fließe klar, honigreichster; setze dich in den Schoß des Lobliedes [Anm.: arka, auch „Strahl/Sonne“]."},{"n":473,"sa":"asāvyaṃśurmadāyāpsu dakṣo giriṣṭhāḥ\nśyeno na yonimāsadat","de":"Gepresst wurde der Stängel zum Rausch in den Wassern, der geschickte, auf dem Berg weilende; wie ein Falke setzte er sich in den Schoß."},{"n":474,"sa":"pavasva dakṣasādhano devebhyaḥ pītaye hare\nmarudbhyo vāyave madaḥ","de":"Fließe klar, Geschicklichkeit vollbringend, für die Götter zum Trunk, Falber; für die Maruts, für Vāyu der Rausch."},{"n":475,"sa":"pari svāno giriṣṭhāḥ pavitre somo akṣarat\nmadeṣu sarvadhā asi","de":"Rauschend hat der auf dem Berge weilende Soma im Seihtuch rings geströmt; in den Räuschen bist du der Allspender [?]."},{"n":476,"sa":"pari priyā divaḥ kavirvayāṃsi naptyorhitaḥ\nsvānairyāti kavikratuḥ","de":"Ringsum geht der Seher zu den lieben Gütern [?] des Himmels, zu den Stärkungen, in die beiden „Enkelinnen“ [?] [Anm.: naptyoḥ unsicher, evtl. die beiden Welten] gelegt; mit Tönen zieht er dahin, der Seher von weiser Kraft."}]},{"num":2,"loc":"Prapāṭhaka V, Ardha 2, Daśati 10","n_from":477,"n_to":486,"title_de":"Soma Pavamāna: Tropfen, Stier und Sonnenlicht","note":"","units":[{"n":477,"sa":"pra somāso madacyutaḥ śravase no maghonaḥ\nsutā vidathe akramuḥ","de":"Hervor sind die Somas, rauschtriefend, uns Gebern zum Ruhm, gepresst zur Versammlung geeilt [Anm.: vidatha, auch „Weihehandlung“]."},{"n":478,"sa":"pra somāso vipaścito 'po nayanta ūrmayaḥ\nvanāni mahiṣā iva","de":"Hervor die Somas, die weisen; sie führen die Wasser wie Wellen, wie Büffel die Wälder [?]."},{"n":479,"sa":"pavasvendo vṛṣā sutaḥ kṛdhī no yaśaso jane\nviśvā apa dviṣo jahi","de":"Fließe klar, Tropfen, als Stier gepresst; mache uns unter den Leuten berühmt; alle Feindschaften schlage weg."},{"n":480,"sa":"vṛṣā hyasi bhānunā dyumantaṃ tvā havāmahe\npavamāna svardṛśam","de":"Denn ein Stier bist du durch Glanz; dich, den Leuchtenden, rufen wir, Klärender, den Sonnenschauenden."},{"n":481,"sa":"induḥ paviṣṭa cetanaḥ priyaḥ kavīnāṃ matiḥ\nsṛjadaśvaṃ rathīriva","de":"Der Tropfen hat sich geklärt, der bewusste, der liebe Gedanke der Seher; er lässt das Ross los wie ein Wagenlenker."},{"n":482,"sa":"asṛkṣata pra vājino gavyā somāso aśvayā\nśukrāso vīrayāśavaḥ","de":"Losgelassen wurden die Siegespreis-Bringer, die Somas, kuh- und rossbegehrend, hell, mannhaft, schnell."},{"n":483,"sa":"pavasva deva āyuṣagindraṃ gacchatu te madaḥ\nvāyumā roha dharmaṇā","de":"Fließe klar, Gott, zum Leben; zu Indra gehe dein Rausch; steige zu Vāyu auf, nach (deiner) Satzung."},{"n":484,"sa":"pavamāno ajījanaddivaścitraṃ na tanyatum\njyotirvaiśvānaraṃ bṛhat","de":"Der Klärende hat vom Himmel her erzeugt, wie ein buntes Donnergrollen, das allmenschliche Licht, das große."},{"n":485,"sa":"pari svānāsa indavo madāya barhaṇā girā\nmadho arṣanti dhārayā","de":"Ringsum tönend, Tropfen, zum Rausch, mit erhabenem Lied strömen sie in Strömen den Honig."},{"n":486,"sa":"pari prāsiṣyadatkaviḥ sindhorūrmāvadhi śritaḥ\nkāruṃ bibhratpuruspṛham","de":"Ringsum ist der Seher geflossen [?], in der Welle des Stromes ruhend, den vielbegehrten Sänger tragend [?]."}]},{"num":3,"loc":"Prapāṭhaka VI, Ardha 1, Daśati 1","n_from":487,"n_to":496,"title_de":"Soma Pavamāna: gepresst zu Indra hin","note":"","units":[{"n":487,"sa":"upo ṣu jātamapturaṃ gobhirbhaṅgaṃ pariṣkṛtam\ninduṃ devā ayāsiṣuḥ","de":"Hierher zu dem geborenen, wasserdurcheilenden, mit Milch zubereiteten [Anm.: bhaṅgam unklar: „Zerbrechlichen“ (?), Textzustand fraglich] Tropfen sind die Götter gekommen."},{"n":488,"sa":"punāno akramīdabhi viśvā mṛdho vicarṣaṇiḥ\nśumbhanti vipraṃ dhītibhiḥ","de":"Sich klärend ist er gegen alle Feinde geschritten, der Allschauende; sie schmücken den Weisen mit Gebeten."},{"n":489,"sa":"āviśankalaśaṃ suto viśvā arṣannabhi śriyaḥ\nindurindrāya dhīyate","de":"In den Krug eingehend, gepresst, allen Glanz entgegenströmend, wird der Tropfen für Indra gesetzt."},{"n":490,"sa":"asarji rathyo yathā pavitre camvoḥ sutaḥ\nkārṣmanvājī nyakramīt","de":"Losgelassen wurde er wie ein Wagenrenner im Seihtuch, in den beiden Schalen gepresst; der Renner hat die Bahn [Anm.: kārṣman, „Furche/Rennbahn“] betreten [?]."},{"n":491,"sa":"pra yadgāvo na bhūrṇayastveṣā ayāso akramuḥ\nghnantaḥ kṛṣṇāmapa tvacam","de":"Als die eifrigen [Anm.: bhūrṇi] Ungestümen wie Kühe, die Schnellen, hervorschritten, die schwarze Haut wegschlagend."},{"n":492,"sa":"apaghnanpavase mṛdhaḥ kratuvitsoma matsaraḥ\nnudasvādevayuṃ janam","de":"Die Feinde wegschlagend klärst du dich, Soma, kraftkundig, berauschend; treibe den götterlosen Menschen fort."},{"n":493,"sa":"ayā pavasva dhārayā yayā sūryamarocayaḥ\nhinvāno mānuṣīrapaḥ","de":"Mit diesem Strom fließe klar, mit dem du die Sonne leuchten machtest, die menschlichen Wasser antreibend."},{"n":494,"sa":"sa pavasva ya āvithendraṃ vṛtrāya hantave\nvavrivāṃsaṃ mahīrapaḥ","de":"Der fließe klar, der du Indra geholfen hast, Vṛtra zu erschlagen, den Umhüller der großen Wasser."},{"n":495,"sa":"ayā vītī pari srava yasta indo madeṣvā\navāhannavatīrnava","de":"Mit dieser Labung ströme ringsum, du, Tropfen, der du in den Räuschen die neunmal neunzig [Anm.: neunundneunzig (Burgen?)] schlugst [?]."},{"n":496,"sa":"pari dyukṣaṃ sanadrāyiṃ bharadvājaṃ no andhasā\nsvāno arṣa pavitra ā","de":"Ringsum strömt uns, Himmelbewohnender, Reichtum gewinnend, den Bharadvāja [?] [Anm.: „Kraftträger“ oder Name des Sehers] mit dem Saft; tönend fließe ins Seihtuch."}]},{"num":4,"loc":"Prapāṭhaka VI, Ardha 1, Daśati 2","n_from":497,"n_to":510,"title_de":"Soma Pavamāna: Stier und Strom im Seihtuch","note":"","units":[{"n":497,"sa":"acikradadvṛṣā harirmahānmitro na darśataḥ\nsaṃ sūryeṇa didyute","de":"Gebrüllt hat der Stier, der Falbe, der Große, wie Mitra anzuschauen; mit der Sonne zusammen leuchtet er."},{"n":498,"sa":"ā te dakṣaṃ mayobhuvaṃ vahnimadyā vṛṇīmahe\npāntamā puruspṛham","de":"Deine Geschicklichkeit, die Wohltuende, den Fahrer, wählen wir heute; den am besten Schützenden, Vielbegehrten."},{"n":499,"sa":"adhvaryo adribhiḥ sutaṃ somaṃ pavitra ā naya\npunīhīndrāya pātave","de":"Adhvaryu, den mit Steinen gepressten Soma führe ins Seihtuch; kläre ihn für Indra zum Trinken."},{"n":500,"sa":"taratsa mandī dhāvati dhārā sutasyāndhasaḥ\ntaratsa mandī dhāvati","de":"Hinüber [Anm.: sc. über die Hindernisse] eilt der Berauschende, der Strom des gepressten Saftes; hinüber eilt der Berauschende."},{"n":501,"sa":"ā pavasva sahasriṇaṃ rayiṃ soma suvīryam\nasme śravāṃsi dhāraya","de":"Fließe klar herbei, Soma, tausendfachen Reichtum, mannhaften; uns verleihe Ruhmesgaben."},{"n":502,"sa":"anu pratnāsa āyavaḥ padaṃ navīyo akramuḥ\nruce jananta sūryam","de":"Nach den Alten sind die Menschen einen neuen Schritt gegangen [?]; zum Leuchten erzeugten sie die Sonne."},{"n":503,"sa":"arṣā soma dyumattamo 'bhi droṇāni roruvat\nsīdanyonau yoneṣvā","de":"Ströme, Soma, glänzendster, zu den Holzgefäßen hin brüllend, dich niederlassend im Schoß, in den Schößen."},{"n":504,"sa":"vṛṣā soma dyumāṃ asi vṛṣā deva vṛṣavrataḥ\nvṛṣā dharmāṇi dadhriṣe","de":"Stier, Soma, bist du, leuchtend; Stier, Gott, mit stierhaftem Gelübde; als Stier hältst du die Satzungen, du wagst sie."},{"n":505,"sa":"iṣe pavasva dhārayā mṛjyamāno manīṣibhiḥ\nindo rucābhi gā ihi","de":"Zur Stärkung fließe klar im Strom, von den Weisen geputzt; Tropfen, mit Glanz komm zu den Kühen."},{"n":506,"sa":"mandrayā soma dhārayā vṛṣā pavasva devayuḥ\navyo vārebhirasmayuḥ","de":"Mit erfreuendem Strom, Soma, als Stier fließe klar, götterbegehrend, durch die Schafshaare des Seihtuchs, uns begehrend."},{"n":507,"sa":"ayā soma sukṛtyapā mahāntsannabhyavardhathāḥ\nhindāna idvṛṣāyase","de":"Mit diesem, Soma, wuchsest du durch gutes Werk [?] [Anm.: sukṛtyā, apā unsicher], obwohl du schon groß warst; angetrieben wirst du stierstark."},{"n":508,"sa":"ayaṃ vicarṣaṇirhitaḥ pavamānaḥ sa cetati\nhinvāna āpyaṃ bṛhat","de":"Dieser Allschauende ist gesetzt; der sich Klärende ist bewusst, das große Zugehörige antreibend [?] [Anm.: āpya: Verwandtschaft/Erreichbares]."},{"n":509,"sa":"pra ṇa indo mahe tu na ūrmiṃ na bibhradarṣasi\nabhi devāṃ ayāsyaḥ","de":"Vorwärts für uns, Tropfen, zur Größe strömst du, gleichsam eine Welle tragend [?]; zu den Göttern bist du gegangen [?]."},{"n":510,"sa":"apaghnanpavate mṛdho 'pa somo arāvṇaḥ\ngacchannindrasya niṣkṛtam","de":"Die Feinde wegschlagend klärt sich Soma, die Nichtgeber weg, gehend zu Indras Bestimmungsort [Anm.: niṣkṛta, auch „Zubereitung“]."}]},{"num":5,"loc":"Prapāṭhaka VI, Ardha 1, Daśati 3","n_from":511,"n_to":522,"title_de":"Soma Pavamāna: Strom, Krug und Seihtuch","note":"Verse in Tṛca-Form mit längeren Zeilen.","units":[{"n":511,"sa":"punānaḥ soma dhārayāpo vasāno arṣasi\nā ratnadhā yonimṛtasya sīdasyutso devo hiraṇyayaḥ","de":"Dich klärend, Soma, im Strom, die Wasser als Gewand tragend, strömst du; als Juwelenspender setzt du dich in den Schoß der Ordnung [Anm.: ṛta]; Quelle, Gott, golden."},{"n":512,"sa":"parīto ṣiñcatā sutaṃ somo ya uttamaṃ haviḥ\ndadhanvāṃ yo naryo apsvā3ntarā suṣāva somamadribhiḥ","de":"Gießt ringsum den Gepressten zu, der Soma, der höchste Darbringung ist – der Mannhafte, der [Anm.: dadhanvān unsicher] in den Wassern innen mit Steinen Soma presste [?]."},{"n":513,"sa":"ā soma svāno adribhistiro vārāṇyavyayā\njano na puri camvorviśaddhariḥ sado vaneṣu dadhriṣe","de":"Komm, Soma, mit Steinen gepresst, durch die Schafshaar-Seihen hindurch, unversehrt; wie ein Mann in die Burg dringt der Falbe in die beiden Schalen; deinen Sitz in den Hölzern nimmst du fest ein."},{"n":514,"sa":"pra soma devavītaye sindhurna pipye arṇasā\naṃśoḥ payasā madiro na jāgṛviracchā kośaṃ madhuścutam","de":"Vorwärts, Soma, zum Göttermahl; wie ein Strom ist er mit Flut angeschwollen; mit der Milch des Stängels, berauschend, wach, zum Krug hin, honigtriefend."},{"n":515,"sa":"soma u ṣvāṇaḥ sotṛbhiradhi ṣṇubhiravīnām\naśvayeva haritā yāti dhārayā mandrayā yāti dhārayā","de":"Soma wird von den Pressern gepresst auf den Rücken der Schafe; wie eine Rossbegehrende [?] geht der Falbe im Strom, im erfreuenden Strom geht er."},{"n":516,"sa":"tavāhaṃ soma rāraṇa sakhya indo divedive\npurūṇi babhro ni caranti māmava paridhīṃrati tāṃ ihi","de":"Dein bin ich, Soma, ich freue mich in deiner Freundschaft, Tropfen, Tag für Tag; viele, Braunroter, streifen um mich her [?]; über jene Umfriedungen hinweg komm her [?] [Anm.: Textzustand fraglich]."},{"n":517,"sa":"mṛjyamānaḥ suhastyā samudre vācaminvasi\nrayiṃ piśaṅgaṃ bahulaṃ puruspṛhaṃ pavamānābhyarṣasi","de":"Mit geschickter Hand geputzt, bringst du im Meer die Rede in Bewegung [?]; rötlichen, reichen, vielbegehrten Reichtum, Klärender, strömst du zu."},{"n":518,"sa":"abhi somāsa āyavaḥ pavante madyaṃ madam\nsamudrasyādhi viṣṭape manīṣiṇo matsarāso madacyutaḥ","de":"Hin die Somas, die Menschen, klären den berauschenden Rausch; auf der Höhe des Meeres, die Weisen, berauschend, rauschtriefend."},{"n":519,"sa":"punānaḥ soma jāgṛviravyā vāraiḥ pari priyaḥ\ntvaṃ vipro abhavo 'ṅgirastama madhvā yajñaṃ mimikṣa ṇaḥ","de":"Dich klärend, Soma, wach, mit den Schafshaar-Seihen ringsum lieb; du wurdest der Seher, Aṅgiras-gleichster; netze mit Honig unsere Weihehandlung."},{"n":520,"sa":"indrāya pavate madaḥ somo marutvate sutaḥ\nsahasradhāro atyavyamarṣati tamī mṛjantyāyavaḥ","de":"Für Indra klärt sich der Rausch, Soma, für den Marut-Begleiteten gepresst; tausendströmig strömt er über das Schafshaar-Sieb; ihn reiben die Menschen rein."},{"n":521,"sa":"pavasva vājasātamo 'bhi viśvāni vāryā\ntvaṃ samudraḥ prathame vidharmaṃ devebhyaṃ soma matsaraḥ","de":"Fließe klar, bester Gewinner, zu allen Wünschenswerten hin; du bist das Meer im ersten Gefüge [?] [Anm.: vidharman]; für die Götter, Soma, berauschend."},{"n":522,"sa":"pavamānā asṛkṣata pavitramati dhārayā\nmarutvanto matsarā indriyā hayā medhāmabhi prayāṃsi ca","de":"Sich klärende Somas wurden losgelassen über das Seihtuch mit dem Strom; die von den Maruts Begleiteten, berauschend, kräftig, die Antreiber, hin zur Weisheit [?] [Anm.: medhā, auch „Weihehandlung“] und zu den Labungen."}]},{"num":6,"loc":"Prapāṭhaka VI, Ardha 1, Daśati 4","n_from":523,"n_to":532,"title_de":"Soma Pavamāna: Erzeuger von Himmel, Erde und Göttern","note":"","units":[{"n":523,"sa":"pra tu drava pari kośaṃ ni ṣīda nṛbhiḥ punāno abhi vājamarṣa\naśvaṃ na tvā vājinaṃ marjayanto 'cchā barhī raśanābhirnayanti","de":"Strömt hervor, ringsum in den Krug, setz dich nieder, mit Männern dich klärend strömen auf den Siegespreis zu; wie ein Ross, den Siegreichen, striegelnd führen sie dich mit Zügeln zum Barhis."},{"n":524,"sa":"pra kāvyamuśaneva bruvāṇo devo devānāṃ janimā vivakti\nmahivrataḥ śucibandhuḥ pāvakaḥ padā varāho abhyeti rebhan","de":"Vorwärts die Dichtung wie Uśanā [?] verkündend, offenbart der Gott die Geburten der Götter; von großem Gelübde, mit reinem Verwandten, klar, geht er mit dem Fuß als Eber [?] tönend heran [Anm.: Bild]."},{"n":525,"sa":"tisro vāca īrayati pra vahnirṛtasya dhītiṃ brahmaṇo manīṣām\ngāvo yanti gopatiṃ pṛcchamānāḥ somaṃ yanti matayo vāvaśānāḥ","de":"Drei Stimmen bringt der Fahrer in Gang: die Schau der Ordnung [Anm.: ṛta, dhīti], das Sinnen des Brahman [Anm.: Gebet]; Kühe gehen, den Herrn der Kühe suchend; zu Soma gehen die Gebete, verlangend."},{"n":526,"sa":"asya preṣā hemanā pūyamāno devo devebhiḥ samapṛkta rasam\nsutaḥ pavitraṃ paryeti rebhanmiteva sadma paśumanti hotā","de":"Auf seinen Antrieb hat sich, mit dem Goldnen [?] [Anm.: hemanā unsicher] gereinigt, der Gott mit den Göttern im Saft vermischt; gepresst geht er tönend ums Seihtuch, wie messend seinen Sitz, viehreich, der Rufer."},{"n":527,"sa":"somaḥ pavate janitā matīnāṃ janitā divo janitā pṛthivyāḥ\njanitāgnerjanitā sūryasya janitendrasya janitota viṣṇoḥ","de":"Soma klärt sich, der Erzeuger der Gedanken, der Erzeuger des Himmels, der Erzeuger der Erde; Erzeuger Agnis, Erzeuger der Sonne, Erzeuger Indras, und Erzeuger Viṣṇus."},{"n":528,"sa":"abhi tripṛṣṭhaṃ vṛṣaṇaṃ vayodhāmāṅgoṣiṇamavāvaśanta vāṇīḥ\nvanā vasāno varuṇo na sindhūrvi ratnadhā dayate vāryāṇi","de":"Zu dem dreirückigen Stier, dem Lebenskraft-Bringer, dem Kuhsucher, sehnten sich die Stimmen; Wälder anlegend [?], wie Varuṇa die Ströme, verteilt der Juwelenspender die Wünschenswerten."},{"n":529,"sa":"akrāntsamudraḥ prathame vidharmaṃ janayanprajā bhuvanasya gopāḥ\nvṛṣā pavitre adhi sāno avye bṛhatsomo vāvṛdhe svāno adriḥ","de":"Es schritt das Meer im ersten Gefüge, Nachkommen erzeugend, der Hüter der Welt; als Stier auf dem Seihtuch, auf dem Rücken des Schafshaars; groß wuchs Soma, tönend, wie der Stein [?]."},{"n":530,"sa":"kanikranti harirā sṛjyamānaḥ sīdanvanasya jaṭhare punānaḥ\nnṛbhiryataḥ kṛṇute nirṇijaṃ gāmato matiṃ janayata svadhābhiḥ","de":"Brüllend, der Falbe, wird losgelassen, sich in den Bauch des Holzes setzend, sich klärend; von Männern gelenkt bereitet er das Reinigungsgewand der Kuh; von da erzeugt er den Gedanken mit den Eigenkräften [?]."},{"n":531,"sa":"eṣa sya te madhumāṃ indra somo vṛṣā vṛṣṇaḥ pari pavitre akṣāḥ\nsahasradāḥ śatadā bhūridāvā śaśvattamaṃ barhirā vājyasthāt","de":"Dies ist er, dein honigreicher, Indra, Soma, Stier des Stiers, ringsum im Seihtuch geströmt; tausendgebend, hundertgebend, vielgebend, hat er sich als Renner für immer auf das Barhis gestellt."},{"n":532,"sa":"pavasva soma madhumāṃ ṛtāvāpo vasāno adhi sāno avye\nava droṇāni ghṛtavanti roha madintamo matsara indrapānaḥ","de":"Fließe klar, Soma, honigreich, ordnungsgemäß, die Wasser tragend auf dem Rücken des Schafhaar-Siebs; steige hinab in die fettreichen Holzgefäße, berauschendster, Rausch, von Indra zu trinken."}]},{"num":7,"loc":"Prapāṭhaka VI, Ardha 1, Daśati 5","n_from":533,"n_to":544,"title_de":"Soma Pavamāna: Heerführer, Kühe und Sonne","note":"","units":[{"n":533,"sa":"pra senānīḥ śūro agre rathānāṃ gavyanneti harṣate asya senā\nbhadrānkṛṇvannindrahavāntsakhibhya ā somo vastrā rabhasāni datte","de":"Vorwärts der Heerführer, der Held, an der Spitze der Wagen, nach Kühen verlangend, geht; sein Heer frohlockt; glückliche Indra-Rufe [?] für die Freunde schaffend, nimmt Soma stürmische Gewänder."},{"n":534,"sa":"pra te dhārā madhumatīrasṛgranvāraṃ yatpūto atyeṣyavyam\npavamāna pavase dhāma gonāṃ janayantsūryamapinvo arkaiḥ","de":"Vorwärts sind deine honigreichen Ströme geströmt, wenn du, gereinigt, über das Schafshaar-Sieb gehst; Klärender, du klärst dich zum Sitz der Kühe, die Sonne erzeugend, mit Gesängen schwellend."},{"n":535,"sa":"pra gāyatābhyarcāma devāntsomaṃ hinota mahate dhanāya\nsvāduḥ pavatāmati vāramavyamā sīdatu kalaśaṃ deva induḥ","de":"Singt vor, wir preisen die Götter; treibt den Soma an zu großem Gewinn; süß soll er über das Schafshaar-Sieb strömen; der Gott, der Tropfen, setze sich in den Krug."},{"n":536,"sa":"pra hinvāno janitā rodasyo ratho na vājaṃ saniṣannayāsīt\nindraṃ gacchannāyudhā saṃśiśāno viśvā vasu hastayorādadhānaḥ","de":"Antreibend, Erzeuger der beiden Welten, wie ein Wagen den Siegespreis gewinnend ist er gegangen; zu Indra gehend, die Waffen schärfend, alle Güter in den Händen haltend."},{"n":537,"sa":"takṣadyadī manaso venato vāgjyeṣṭhasya dharmaṃ dyukṣoranīke\nādīmāyanvaramā vāvaśānā juṣṭaṃ patiṃ kalaśe gāva indum","de":"Als die Rede des Sinnenden [?] schuf im Angesicht des Ältesten, des Himmelbewohners, die Satzung [?], da gingen hin die Kühe, die besten Verlangenden, zum geliebten Herrn, dem Tropfen, im Krug [Anm.: Textzustand fraglich]."},{"n":538,"sa":"sākamukṣo marjayanta svasāro daśa dhīrasya dhītayo dhanutrīḥ\nhariḥ paryadravajjāḥ sūryasya droṇaṃ nanakṣe atyo na vājī","de":"Zugleich reinigten den Stier die Schwestern, die zehn Hände [Anm.: dhītayaḥ, „Finger“] des Weisen, die Schleudernden [?]; der Falbe lief herum, der Sonne Sprössling [?], zum Holzgefäß, erreichte es wie ein Rennpferd."},{"n":539,"sa":"adhi yadasminvājinīva śubhaḥ spardhante dhiyaḥ sūre na viśaḥ\napo vṛṇānaḥ pavate kavīyanvrajaṃ na paśuvardhanāya manma","de":"Wenn in ihm wie in einer Rennstute die Gedanken schön wetteifern, wie die Stämme um die Sonne; die Wasser wählend klärt er sich, seherisch dichtend, ein Gebet wie ein Gehege zur Mehrung des Viehs [?]."},{"n":540,"sa":"indurvājī pavate gonyoghā indre somaḥ saha invanmadāya\nhanti rakṣo bādhate paryarātiṃ varivaskṛṇvanvṛjanasya rājā","de":"Der Renner, der Tropfen, klärt sich, kuhentsprossen [?] [Anm.: gonyoghā unsicher]; in Indra Soma zugleich antreibend zum Rausch; er schlägt den Rakṣas, bedrängt die Missgunst ringsum, Weite schaffend, König des Gebiets [Anm.: vṛjana]."},{"n":541,"sa":"ayā pavā pavasvainā vasūni māṃścatva indro sarasi pra dhanva\nbraghnaścidyasya vāto na jūtiṃ purumedhāścittakave naraṃ dhāt","de":"Mit diesem Klären fließe klar, mit diesem Güter; Māṃścatva [?], Tropfen, ströme in den Teich hin; dessen Antrieb sogar der Braune [?] wie der Wind; Purumedha gab dem Eilenden einen Mann [?] [Anm.: Textzustand fraglich]."},{"n":542,"sa":"mahattatsomo mahiṣaścakārāpāṃ yadgarbho 'vṛṇīta devān\nadadhādindre pavamāna ojo 'janayatsūrye jyotirinduḥ","de":"Groß hat Soma, der Büffel, das getan, als er, der Keim der Wasser, die Götter erwählte; er gab Indra Kraft, sich klärend; der Tropfen erzeugte in der Sonne Licht."},{"n":543,"sa":"asarji vakvā rathye yathājau dhiyā manotā prathamā manīṣa\ndaśa svasāro adhi sāno avye mṛjanti vahniṃ sadaneṣvaccha","de":"Losgelassen wurde die Windende [?] [Anm.: vakvā unsicher] im Wagenlauf wie im Wettlauf; durch Andacht gedacht, die Ersten durch Sinnen; die zehn Schwestern auf dem Rücken des Schafshaars reinigen den Fahrer in den Sitzen entgegen."},{"n":544,"sa":"apāmivedūrmayastartturāṇāḥ pra manīṣā īrate somamaccha\nnamasyantīrupa ca yanti saṃ cāca viśantyuśatīruśantam","de":"Wie der Wasser Wellen, die eilenden, gehen die Gedanken hervor zum Soma hin; sich verneigend gehen sie hinzu und zusammen, und sie gehen hinein, die Verlangenden zum Verlangenden."}]},{"num":8,"loc":"Prapāṭhaka VI, Ardha 2, Daśati 6","n_from":545,"n_to":553,"title_de":"Soma Pavamāna: Freunde, den Hund abwehren","note":"","units":[{"n":545,"sa":"purojitī vo andhasaḥ sutāya mādayitnave\napa śvānaṃ śnathiṣṭana sakhāyo dīrghajihvyam","de":"Ihr Freunde, zum Vorsieg [?] für euch, für den gepressten, berauschenden Saft: schlagt den Hund weg, den langzüngigen."},{"n":546,"sa":"ayaṃ pūṣā rayirbhagaḥ somaḥ punāno arṣati\npatirviśvasya bhūmano vyakhyadrodasī ubhe","de":"Dies ist Pūṣan, Reichtum, Bhaga: Soma strömt sich klärend; Herr des ganzen Weiten, hat er beide Welten überschaut."},{"n":547,"sa":"sutāso madhumattamāḥ somā indrāya mandinaḥ\npavitravanto akṣarandevāngacchantu vo madāḥ","de":"Gepresst sind die honigreichsten Somas, für Indra berauschend; mit Seihtuch strömten sie; zu den Göttern sollen eure Räusche gehen."},{"n":548,"sa":"somāḥ pavanta indavo 'smabhyaṃ gātuvittamāḥ\nmitrāḥ svānā arepasaḥ svādhyaḥ svarvidaḥ","de":"Die Somas klären sich, die Tropfen, für uns die wegkundigsten; Freunde, tönend, unbefleckt, gut wirkend, lichtfindend."},{"n":549,"sa":"abhī no vājasātamaṃ rayimarṣa śataspṛham\nindo sahasrabharṇasaṃ tuvidyumnaṃ vibhāsaham","de":"Zu uns, Tropfen, ströme den siegreichsten Reichtum, hundertfach begehrten; tausend tragend, kraftvoll, Glanz überwindend [?]."},{"n":550,"sa":"abhī navante adruhaḥ priyamindrasya kāmyam\nvatsaṃ na pūrva āyuni jātaṃ rihanti mātaraḥ","de":"Zu ihm rufen die Nichtfeindlichen, den lieben, für Indra begehrenswerten; wie das Kalb im ersten Leben das Geborene lecken die Mütter."},{"n":551,"sa":"ā haryatāya dhṛṣṇave dhanuṣṭanvanti pauṃsyam\nśukrā vi yantyasurāya nirṇije vipāmagre mahīyuvaḥ","de":"Für den begehrten, kühnen spannen sie den Bogen: Manneskraft; hell gehen sie auseinander für den Asura zur Reinigung, der Weisen voran, große (Kühe) begehrend [?]."},{"n":552,"sa":"pari tyaṃ haryataṃ hariṃ babhru
