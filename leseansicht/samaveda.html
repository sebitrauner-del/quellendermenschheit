ehen, ein Meer, der Wagenlenker des Lichts, klärt sich der Heimische [?] zum Reichtum hin [?] [Anm.: „okyaḥ“ unsicher]."}]},{"num":312,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 1","n_from":1617,"n_to":1619,"title_de":"Agni: Weihehandlung, Wort und Gunst","note":"","units":[{"n":1617,"sa":"viśvebhiragne agnibhirimaṃ yajñamidaṃ vacaḥ\ncano ghāḥ sahasā yaho","de":"Mit allen Feuern, Agni, [nimm] diese Weihehandlung, dieses Wort [an]; Wohlgefallen [?], du Kraftvoller, Sohn der Kraft [?] [Anm.: „cano ghā sahaso yaho“ vgl. RV 5.16.4]."},{"n":1618,"sa":"yacciddhi śaśvā tanā devaṃdevaṃ yajāmahe\ntve iddhūyate haviḥ","de":"Denn was wir stets fort und fort jedem Gott verehren – in dir allein wird die Opferspeise dargebracht [Anm.: „havis“]."},{"n":1619,"sa":"priyo no astu viśpatirhotā mandro vareṇyaḥ\npriyāḥ svagnayo vayam","de":"Lieb soll uns sein der Stammesherr, der Rufer, der berauschende, wählenswerte; lieb sind wir gut-entzündeten [Feuern] [?] [Anm.: „svagnayaḥ“: wir mit guten Feuern]."}]},{"num":313,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 2","n_from":1620,"n_to":1622,"title_de":"Indra: Anruf und Unbeschädigt-Sein","note":"","units":[{"n":1620,"sa":"indraṃ vo viśvataspari havāmahe janebhyaḥ\nasmākamastu kevalaḥ","de":"Indra rufen wir von überall her zu euch, [zu] den Leuten; er soll allein der unsrige sein."},{"n":1621,"sa":"sa no vṛṣannamuṃ caruṃ satrādāvannapā vṛdhi\nasmabhyamapratiṣkutaḥ","de":"Er, Bulle, sei du uns diesen Kessel [?] [Anm.: „caru“ = Kessel/Opfertopf; „amum“ unsicher], du Freigebiger, fördere von jetzt ab [?]; uns, der Unbezwingbare [?]."},{"n":1622,"sa":"bṛṣā yūtheva vaṃsagaḥ kṛṣṭīriyartyojasā\nīśāno apratiṣkutaḥ","de":"Wie der Bulle die Herde [?] [Anm.: „vaṃsagaḥ“ = Stier], treibt er die Völker mit Kraft an, der Gebieter, unbezwingbar [?]."}]},{"num":314,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 3","n_from":1623,"n_to":1624,"title_de":"Agni: Schutz und Abwehr göttlichen Zorns","note":"","units":[{"n":1623,"sa":"tvaṃ naścitra ūtyā vaso rādhāṃsi codaya\nasya rāyastvamagne rathīrasi vidā gādhaṃ tuce tu naḥ","de":"Du, Wunderbarer, mit Hilfe, du Guter [Reichtum-Besitzer], treibe die Gaben an; dieses Reichtums bist du, Agni, der Wagenlenker; finde für unsere Nachkommenschaft [festen] Grund [?]."},{"n":1624,"sa":"parṣi tokaṃ tanayaṃ partṛbhiṣṭvamadabdhairaprayutvabhiḥ\nagne heḍāṃsi daivyā yuyodhi no 'devāni harāṃsi ca","de":"Bring [uns] hinüber, Kind und Nachkommen, mit unerschütterten, unverbundenen Helfern [?]; Agni, halte die Zornausbrüche der Götter fern und die ungöttlichen Frevel [?] [Anm.: „harāṃsi“ = Zorn/Glut]."}]},{"num":315,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 4","n_from":1625,"n_to":1627,"title_de":"Viṣṇu Śipiviṣṭa: Name und Opferspeise","note":"","units":[{"n":1625,"sa":"kimitte viṣṇo paricakṣi nāma pra yadvavakṣe śipiviṣṭo asmi\nmā varpo asmadapa gūha etadyadanyarūpaḥ samithe babhūtha","de":"Was ist, Viṣṇu, dieser dein Name, den du zu verkünden sagst, wenn ich Śipiviṣṭa bin? Verbirg diese Gestalt nicht vor uns, die du im Kampf als andersgestaltig warst."},{"n":1626,"sa":"pra tatte adya śipiviṣṭa havyamaryaḥ śaṃsāmi vayunāni vidvān\ntaṃ tvā gṛṇāmi tavasamatavyānkṣayantamasya rajasaḥ parāke","de":"Dies dein [Wort] verkünde ich heute, Śipiviṣṭa, als Kenner der Weisen [?]; dich, den Mächtigen unter den Machtlosen [?], preise ich, der du wohnst am fernen Ende dieses Raumes."},{"n":1627,"sa":"vaṣaṭ te viṣṇavāsa ā kṛṇomi tanme juṣasva śipiviṣṭa havyam\nvardhantu tvā suṣṭutayo giri me yūyaṃ pāta svastabhiḥ sadā naḥ","de":"„Vaṣaṭ“ [Anm.: Opferruf] mache ich dir, Viṣṇu, ich bringe [es] hin; genieße mein Opfergut, Śipiviṣṭa. Meine Lobverse sollen dich stärken; ihr aber schützt uns allezeit mit Segen."}]},{"num":316,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 5","n_from":1628,"n_to":1630,"title_de":"Vāyu und Indra: Einladung zum Somatrunk","note":"","units":[{"n":1628,"sa":"vāyo śukro ayāmi te madhvo agraṃ diviṣṭiṣu\nā yāhi somapītaye spārho deva niyutvatā","de":"Vāyu, rein [ist der Soma], ich komme zu dir mit dem Vordersten des Honigs [?] bei den Einladungen [?]; komm zum Somatrunk, begehrenswerter Gott, mit dem Gespann [?] [Anm.: „niyut“ = Gespann Vāyus]."},{"n":1629,"sa":"indraśca vāyaveṣāṃ somānāṃ pītimarhathaḥ\nyuvāṃ hi yantīndavo nimnamāpo na sadhryak","de":"Indra und Vāyu, ihr beide verdient den Trunk dieser Soma; denn zu euch gehen die Tropfen, wie Wasser gemeinsam zur Tiefe hin."},{"n":1630,"sa":"vāyavindraśca śuṣmiṇā sarathaṃ śavasaspatī\nniyutvantā na ūtaya ā yātaṃ somapītaye","de":"Vāyu und Indra, ihr beiden Gewaltigen, Herren der Kraft, auf einem Wagen [fahrend]: kommt mit euren Gespannen zu unserem Beistand, zum Somatrunk."}]},{"num":317,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 6","n_from":1631,"n_to":1633,"title_de":"Soma-Pavamāna: geschmückt, Trank für Indra, Gesang","note":"","units":[{"n":1631,"sa":"adha kṣapā pariṣkṛto vājāṃ abhi pra gāhate\nyadī vivasvato dhiyo hariṃ hinvanti yātave","de":"Nun, in der Nacht [?] geschmückt [?], dringt er zu den Siegespreisen vor, wenn die Gedanken des Vivasvat [Anm.: oder: der Erleuchtenden?] den Falben zum Gang antreiben [?]."},{"n":1632,"sa":"tamasya marjayāmasi mado ya indrapātamaḥ\nyaṃ gāva āsabhirdadhuḥ purā nūnaṃ ca sūrayaḥ","de":"Diesen wollen wir für ihn läutern, den Rausch, der am meisten von Indra getrunken wird, den die Kühe mit ihren Mündern [?] einst und jetzt [als Milch] und die Sänger [zugefügt] haben."},{"n":1633,"sa":"taṃ gāthayā purāṇyā punānamabhyanūṣata\nuto kṛpanta dhītayo devānāṃ nāma bibhratīḥ","de":"Ihn, den Sichläuternden, haben sie mit altem Gesang besungen; und die Gedanken [Dichtungen] wirken mit, die den Namen der Götter tragen."}]},{"num":318,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 7","n_from":1634,"n_to":1636,"title_de":"Agni: Lob, Schutz vor dem Übelwollenden","note":"","units":[{"n":1634,"sa":"aśvaṃ na tvā vāravantaṃ vandadhyā agniṃ namobhiḥ\nsamrājantamadhvarāṇām","de":"Dich, den [Rosse] mit Schweif [Wehr] [?], wie ein Ross, will ich mit Verneigungen preisen, Agni, den Allherrscher der Weihehandlungen."},{"n":1635,"sa":"sa ghā naḥ sūnuḥ śavasā pṛthupragāmā suśevaḥ\nmīḍhvāṃ asmākaṃ babhūyāt","de":"Er, unser Sohn [Anm.: „sūnuḥ“; vielleicht: unser Beistand], der mit Kraft weit ausschreitende, hilfreiche, Gabenspendende, möge für uns [Hilfe] sein [?]."},{"n":1636,"sa":"sa no dūrāccāsācca ni martyādaghāyoḥ\npāhi sadamidviśvāyuḥ","de":"Er behüte uns vor der Ferne und vor der Nähe, vor dem Sterblichen, der Böses will; schütze [uns] immerdar, du Allbelebender."}]},{"num":319,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 8","n_from":1637,"n_to":1638,"title_de":"Indra: Bezwinger der Feinde und Vṛtras","note":"","units":[{"n":1637,"sa":"tvamindra pratūrtiṣvabhi viśvā asi spṛdhaḥ\naśastihā janitā vṛtratūrasi tvaṃ tūrya taruṣyataḥ","de":"Du, Indra, überwältigst in den Angriffen alle Streitigkeiten; du bist der Schmähung Abwehrer, der Erzeuger, der Vṛtra-Bezwinger, du der Eilende, der Sieger."},{"n":1638,"sa":"anu te śuṣmaṃ turayantamīyatuḥ kṣoṇī śiśuṃ na mātarā\nviśvāste spṛdhaḥ śnathayanta manyave vṛtraṃ yadindra tūrvasi","de":"Deiner Kraft, der Eilenden, folgten die beiden Welten, wie zwei Mütter dem Kind; alle Streitenden ließen vor deinem Zorn nach, als du, Indra, Vṛtra niederrangst."}]},{"num":320,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 9","n_from":1639,"n_to":1641,"title_de":"Indra: Die Weihehandlung stärkt Indra; Spaltung des Valas","note":"","units":[{"n":1639,"sa":"yajña indramavardhayadyadbhūmiṃ vyavartayat\ncakrāṇa opaśaṃ divi","de":"Die Weihehandlung stärkte Indra, als er die Erde zurechtrückte, indem er im Himmel den [Wagen]-Sitz [?] [Anm.: „opaśa“ = Haarknoten/Schopf; Wortlaut unsicher] schuf [?]."},{"n":1640,"sa":"vyā3ntarikṣamatiranmade somasya rocanā\nindro yadabhinadvalam","de":"Im Rausch des Soma durchmaß er den Luftraum, die Lichträume, als Indra den Vala spaltete."},{"n":1641,"sa":"udagā ājadaṅgirobhya āviṣkṛṇvanguhā satīḥ\narvāñcaṃ nunude valam","de":"Er stieg empor, den Aṅgiras' die im Verborgenen befindlichen [Kühe] offenbarend; den Vala stieß er nach vorn hin herab [?]."}]},{"num":321,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 10","n_from":1642,"n_to":1644,"title_de":"Indra: Bezwinger in allen Liedern, Beistand","note":"","units":[{"n":1642,"sa":"tyamu vaḥ satrāsāhaṃ viśvāsu gīrṣvāyatam\nā cyāvayasyūtaye","de":"Ihn, euren bei allem Streit Besieger, in allen Lobliedern Gepriesenen, führe ich zum Beistand herbei."},{"n":1643,"sa":"yudhmaṃ santamanarvāṇaṃ somapāmanapacyutam\nnaramavāryakratum","de":"Den Kämpfer, den Seienden, den Unverletzten, den Somatrinker, den Unerschütterten, den Mann von unabwendbarem Können [?]."},{"n":1644,"sa":"śikṣā ṇa indra rāya ā puru vidvāṃ ṛcīṣama\navā naḥ pārye dhane","de":"Hilf uns, Indra, zum Reichtum, der du vieles kennst, [du] mit dem Ṛc gleich [?]; schütze uns im entscheidenden Kampfpreis [Anm.: „pārye dhane“]."}]},{"num":322,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 11","n_from":1645,"n_to":1647,"title_de":"Indra: Kraft, Größe und Preis durch Himmel, Erde, Götter","note":"","units":[{"n":1645,"sa":"tava tyadindriyaṃ bṛhattava dakṣmamuta kratum\nvajraṃ śiśāti dhiṣaṇā vareṇyam","de":"Dies dein Vermögen, Indra, ist groß, dein Geschick und dein Wille auch; die Einsicht [Dhiṣaṇā] schärft [dir] den wählenswerten Keil [Vajra]."},{"n":1646,"sa":"tava dyaurindra pauṃsyaṃ pṛthivī vardhati śravaḥ\ntvāmāpaḥ parvatāsaśca hinvire","de":"Deine Mannhaftigkeit stärkt der Himmel, Indra, die Erde [deinen] Ruhm; dich haben die Wasser und die Berge angetrieben."},{"n":1647,"sa":"tvāṃ viṣṇurbṛhankṣayo mitro gṛṇāti varuṇaḥ\ntvāṃ śardho madatyanu mārutam","de":"Dich preist Viṣṇu, der Hohe [Weite] bewohnend, Mitra und Varuṇa; dich [jubelt] die Schar der Maruts zu [?]."}]},{"num":323,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 12","n_from":1648,"n_to":1650,"title_de":"Agni: Verneigung, Bitte um Rinder und Weite","note":"","units":[{"n":1648,"sa":"namaste agna ojase gṛṇanti deva kṛṣṭayaḥ\namairamitramardaya","de":"Verneigung dir, Agni, zur Kraft; die Menschen preisen [dich], Gott; vertreibe mit Ungestüm die Feinde."},{"n":1649,"sa":"kuvitsu no gaviṣṭaye 'gne saṃveṣiṣo rayim\nurukṛduru ṇaskṛdhi","de":"Wirst du uns wohl, Agni, zum Verlangen nach Rindern Reichtum zusenden [?]; Weitschaffer, schaffe uns Weite."},{"n":1650,"sa":"mā no agne mahādhane parā vargbhārabhṛdyathā\nsaṃvargaṃ saṃ rayiṃ jaya","de":"Nicht uns, Agni, im großen Gewinn [Preiskampf] wende ab [?], wie einen, der eine Last trägt [?]; gewinne die Sammlung [ganze Beute] und Reichtum [?] [Anm.: „vargaḥ“ unsicher]."}]},{"num":324,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 13","n_from":1651,"n_to":1653,"title_de":"Indra: Menschen beugen sich, Spaltung des Vṛtra","note":"","units":[{"n":1651,"sa":"samasya manyave viśo viśvā namanta kṛṣṭayaḥ\nsamudrāyeva sindhavaḥ","de":"Vor seinem Zorn beugen sich alle Stämme, alle Völker, wie die Ströme zum Meer."},{"n":1652,"sa":"vi cidvṛtrasya dodhataḥ śiro bibheda vṛṣṇinā\nvajreṇa śataparvaṇā","de":"Dem erzitternden Vṛtra spaltete er den Kopf mit dem Bullen [Anm.: dem Männlichen/Vajra], mit dem hundertknotigen Keil."},{"n":1653,"sa":"ojastadasya titviṣa ubhe yatsamavarttayat\nindraścarmeva rodasī","de":"Diese Kraft leuchtete auf, als er beide zusammendrehte: Indra [rollte] die beiden Welten wie ein Fell."}]},{"num":325,"loc":"Prapāṭhaka VIII, Ardha 1, Gruppe 14","n_from":1654,"n_to":1656,"title_de":"Rätselverse: das Paar, Gehörn und Wasser","note":"Rätselhafte Verse (Wagenpaar/Rinder?); Deutung unsicher.","units":[{"n":1654,"sa":"sumanmā vasvī rantī sūnarī","de":"Gutgesinnt, gütig, erfreuend, freundlich [?] [Anm.: Wortlaut fraglich; fem. Dual? „vasvī rantī sūnarī“]."},{"n":1655,"sa":"sarūpa vṛṣannā gahīmau bhadrau dhuryāvabhi\ntāvimā upa sarpataḥ","de":"Gleichgestaltig, Bullen, [kommt] zu diesen beiden, den tiefen, schönen Jochtieren hin [?]; diese beiden gehen heran [Anm.: „sarūpa vṛṣannā“ Textzustand fraglich]."},{"n":1656,"sa":"nīva śīrṣāṇi mṛḍhvaṃ madhya āpasya tiṣṭhati\nśṛṅgebhirdaśabhirdiśan","de":"Wie ein Kopf [nach unten?] [?], ihr beiden Erfreuer [?], steht in der Mitte des Wassers [?], mit zehn Hörnern deutend [?] [Anm.: Rätselvers, vgl. RV 8.72.?; Textzustand fraglich]."}]},{"num":326,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 1","n_from":1657,"n_to":1659,"title_de":"Soma für Indra: Aufruf an die Presser","note":"","units":[{"n":1657,"sa":"panyaṃpanyamitsotāra ā dhāvata madyāya\nsomaṃ vīrāya śūrāya","de":"Für jeden Kaufpreis [?] eilt, ihr Presser [?], herbei zum Rausch; [presst] Soma für den Helden, den Kühnen."},{"n":1658,"sa":"eha harī brahmayujā śagmā vakṣataḥ sakhāyam\nindraṃ gīrbhirgirvaṇasam","de":"Hierher sollen die beiden Falben, gebetgeschirrt, gefällig, den Freund tragen, Indra, den liedliebenden mit Liedern."},{"n":1659,"sa":"pātā vṛtrahā sutamā ghā gamannāre asmat\nni yamate śatamūtiḥ","de":"Der Trinker, Vṛtratöter, soll zum Gepressten kommen [?]; fern von uns hält er [?]; der hundertfach Helfende zügelt [?] [Anm.: Wortlaut fraglich]."}]},{"num":327,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 2","n_from":1660,"n_to":1662,"title_de":"Indra: Tropfen strömen in ihn; Fassungsvermögen","note":"","units":[{"n":1660,"sa":"ā tvā viśantvindavaḥ samudramiva sindhavaḥ\nna tvāmindrāti ricyate","de":"Dich sollen die Tropfen betreten wie die Ströme das Meer; niemand, Indra, überragt dich."},{"n":1661,"sa":"vivyaktha mahinā vṛṣanbhakṣaṃ somasya jāgṛve\nya indra jaṭhareṣu te","de":"Du hast, Bulle, mit Größe die Speise des Soma erfasst, Wacher, [der] in deinen Bäuchen [ist], Indra [?]."},{"n":1662,"sa":"araṃ ta indra kukṣaye somo bhavatu vṛtrahan\naraṃ dhāmabhya indavaḥ","de":"Genug sei dir, Indra, für den Bauch der Soma, Vṛtratöter; genug für die Wohnstätten die Tropfen."}]},{"num":328,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 3","n_from":1663,"n_to":1665,"title_de":"Agni: Wecker im Alter, Lied für Rudra-Agni","note":"","units":[{"n":1663,"sa":"jarābodha tadviviḍḍhi viśeviśe yajñiyāya\nstomaṃ rudrāya dṛśīkam","de":"Du, der du durch das Altern erwachst, erkenne das [an] und verstehe; für den Verehrungswürdigen, für jeden einzelnen [?], [bringen wir] dem Rudra ein Loblied, ein ansehnliches [?]."},{"n":1664,"sa":"sa no mahāṃ animāno dhūmaketuḥ puruścandraḥ\ndhiye vājāya hinvatu","de":"Er, der Große, der Maßlose, rauchfahnig, vielglänzend, soll unseren Gedanken zur Kraft [Siegespreis] antreiben."},{"n":1665,"sa":"sa revāṃ iva viśpatirdaivyaḥ ketuḥ śṛṇotu naḥ\nukthairagnirbṛhadbhānuḥ","de":"Er, der reich, wie der Herr der Stämme [?], göttliches Banner, soll uns hören; Agni mit hohem Glanz, durch Preislieder."}]},{"num":329,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 4","n_from":1666,"n_to":1668,"title_de":"Indra: Lied, Gabe von Rindern und Rossen","note":"","units":[{"n":1666,"sa":"tadvo gāya sute sacā puruhūtāya satvane\nśaṃ yadgave na śākine","de":"Singt euch dies zusammen beim Somapressen dem vielgerufenen, wahrhaften [Indra], damit [er] helfe [?] – wie [Heil] dem Rind, dem Kräftigen."},{"n":1667,"sa":"na ghā vasurni yamate dānaṃ vājasya gomataḥ\nyatsīmupaśravadgiraḥ","de":"Nicht hält der Gute [Gebieter] zurück die Gabe der rinderreichen Kraft [Beute], wenn er die Lieder hört [?]."},{"n":1668,"sa":"kuvitsasya pra hi vrajaṃ gomantaṃ dasyuhā gamat\nśacībhirapa no varat","de":"Wird er wohl [gerne] zu ihrer Rinderfülle kommen, der Dasyu-Töter [?]; mit Kräften soll er uns [das Hindernis] wegräumen [?] [Anm.: „kuvit“ = „ob wohl“; Wortlaut unsicher]."}]},{"num":330,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 5","n_from":1669,"n_to":1674,"title_de":"Viṣṇu: Die drei Schritte","note":"","units":[{"n":1669,"sa":"idaṃ viṣṇurvi cakrame tredhā ni dadhe padam\nsamūḍhamasya pāṃsule","de":"Dies durchmaß Viṣṇu; dreifach setzte er seinen Fuß; in seinem staubigen [Fußstapfen] ist [alles] zusammengezogen [?] [Anm.: „pāṃsule“ = im Staubigen]."},{"n":1670,"sa":"trīṇi padā vi cakrame viṣṇurgopā adābhyaḥ\nato dharmāṇi dhārayan","de":"Drei Schritte durchmaß Viṣṇu, der unbetrügbare Hüter; von dort aus die Satzungen aufrechterhaltend."},{"n":1671,"sa":"viṣṇoḥ karmāṇi paśyata yato vratāni paspaśe\nindrasya yujyaḥ sakhā","de":"Seht Viṣṇus Taten, durch die er die Gebote sichtbar machte [?]; er ist Indras passender Freund."},{"n":1672,"sa":"tadviṣṇoḥ paramaṃ padaṃ sadā paśyanti sūrayaḥ\ndivīva cakṣurātatam","de":"Jenen höchsten Schritt Viṣṇus sehen die Gönner [Herren] immerdar, wie ein am Himmel ausgebreitetes Auge."},{"n":1673,"sa":"tadviprāso vipanyuvo jāgṛvāṃsaḥ samindhate\nviṣṇoryatparamaṃ padam","de":"Diesen entzünden die Redner, die Wachen, die Begeisterten: Viṣṇus höchsten Schritt."},{"n":1674,"sa":"ato devā avantu no yato viṣṇurvicakrame\npṛthivyā adhi sānavi","de":"Von dort her sollen uns die Götter helfen, woher Viṣṇu ausschritt, auf der Höhe der Erde."}]},{"num":331,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 6","n_from":1675,"n_to":1676,"title_de":"Indra: Bitte um Kommen und Verweilen","note":"","units":[{"n":1675,"sa":"mo ṣu tvā vāghataśca nāre asmanni rīraman\nārāttādva sadhamādaṃ na ā gahīha vā sannupa śrudhi","de":"Nicht sollen dich, die Opferherren und Sänger, fern von uns aufhalten; komm von weit oder nah, Gefährte im gemeinsamen Sitz, zu uns und höre zu [?] [Anm.: Wortlaut unsicher]."},{"n":1676,"sa":"ime hi te brahmakṛtaḥ sute sacā madhau na makṣa āsate\nindre kāmaṃ jaritāro vasūyavo rathe na pādamā dadhuḥ","de":"Diese hier, die Gebetsdichter, sitzen bei dir beim Somapressen zusammen, wie die Fliege am Honig; auf Indra richten die Sänger, Reichtum begehrend, ihr Verlangen, wie man den Fuß auf den Wagen setzt."}]},{"num":332,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 7","n_from":1677,"n_to":1678,"title_de":"Indra: Neues Lied, Erschütterung von Reichtum und Welten","note":"","units":[{"n":1677,"sa":"astāvi manma pūrvyaṃ brahmendrāya vocata\npūrvīrṛtasya bṛhatīranūṣata stoturmedhā asṛkṣata","de":"Ein Gedanke, ein altes Gebet ist angestimmt; sprecht es für Indra; die großen [Verse] der Wahrheit haben sie gesungen; des Sängers Eingebungen wurden entlassen."},{"n":1678,"sa":"samindro rāyo bṛhatīradhūnuta saṃ kṣoṇī samu sūryam\nsaṃ śukrāsaḥ śucayaḥ saṃ gavāśiraḥ somā indramamandiṣuḥ","de":"Indra hat die großen Reichtümer zusammen aufgeschüttelt, die beiden Welten und die Sonne zusammen; die reinen, leuchtenden, milchgemischten Soma haben Indra erfreut."}]},{"num":333,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 8","n_from":1679,"n_to":1681,"title_de":"Soma-Pavamāna: für Indra; Läuterung durch das Haarsieb","note":"","units":[{"n":1679,"sa":"indrāya soma pātave vṛtraghne pari ṣicyase\nnare ca dakṣiṇāvate devāya sadanāsade","de":"Für Indra, Soma, wirst du zum Trunk, für den Vṛtratöter, ringsum gegossen; und für den Mann mit Opferlohn, den Gott, [der] auf dem Sitz sitzt."},{"n":1680,"sa":"taṃ sakhāyaḥ purūrucaṃ yūyaṃ vayaṃ ca sūrayaḥ\naśyāma vājagandhyaṃ sanema vājapastyam","de":"Ihn, den Vielglänzenden, [ihn] mögen wir Freunde, ihr und wir, die Gönner, erlangen, den ross-duftenden; wir wollen [ihn], das rossbehütende Haus [?], gewinnen [?] [Anm.: „vājagandhyam … vājapastyam“ unsicher]."},{"n":1681,"sa":"pari tyaṃ haryataṃ hariṃ babhruṃ punanti vāreṇa\nyo devānviśvāṃ itpari madena saha gacchati","de":"Den lieben, falben, braunen [Soma] läutern sie mit dem Schweifhaar-Sieb; er, der alle Götter im Rausch begleitet [?]."}]},{"num":334,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 9","n_from":1682,"n_to":1683,"title_de":"Indra: Vertrauen und Beistand im Kampf","note":"","units":[{"n":1682,"sa":"kastamindra tvāvaso martyo dadharṣati\nśraddhā ittemaghavan pārye divi vājī vājaṃ siṣāsati","de":"Welcher Sterbliche wagt dich anzugreifen, Indra, der du [selbst] deine Hilfe bist? Vertrauen [besteht] auf dich, Gabenreicher, [in] Kampf und Weite; der Renner will Gewinn erringen [?] [Anm.: Wortlaut unsicher]."},{"n":1683,"sa":"maghonaḥ sma vṛtrahatyeṣu codaya ye dadati priyā vasu\ntava praṇītī haryaśva sūribhirviśvā tarema duritā","de":"Treibe die Freigebigen bei den Vṛtra-Schlägen an, die liebes Gut geben; durch deine Führung, Falbenlenker, mit den Gönnern mögen wir alle Bedrängnisse überwinden."}]},{"num":335,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 10","n_from":1684,"n_to":1686,"title_de":"Indra: Süßer Trank, Stärkung durch Preislieder","note":"","units":[{"n":1684,"sa":"edu madhormadintaraṃ siñcādhvaryo andhasaḥ\nevā hi vīra stavate sadāvṛdhaḥ","de":"Komm her; gieße, Adhvaryu, vom Honig, dem berauschendsten der Speise [Soma]; denn so preist man dich, Held, den immer Stärkenden."},{"n":1685,"sa":"indra sthātarharīṇāṃ na kiṣṭe pūrvyastutim\nudānaṃśa śavasā na bhandanā","de":"Indra, der auf den Falben steht: Dein [Lob] ist nicht gering, das altehrwürdige Loblied; er hat [sich] durch Kraft erlangt, nicht durch Schmeichelei [?] [Anm.: „udānaṃśa“ Wortlaut unsicher]."},{"n":1686,"sa":"taṃ vo vājānāṃ patimahūmahi śravasyavaḥ\naprāyubhirjñebhirvāvṛdhenyam","de":"Ihn, den Herrn der Kräfte [Siegespreise], rufen wir, nach Ruhm verlangend, den durch ununterbrochene Weihehandlungen zu Stärkenden [?] [Anm.: „aprāyubhir jñebhiḥ“ unsicher]."}]},{"num":336,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 11","n_from":1687,"n_to":1688,"title_de":"Agni: Hymnische Anrufung, Somaverse","note":"","units":[{"n":1687,"sa":"taṃ gūrdhayā svarṇaraṃ devāso devamaratiṃ dadhanvire\ndevatrā havyamūhiṣe","de":"Ihn, den zu Licht [Sonne] Wandernden, den Göttern gewogenen [?] Gott haben sie gestärkt [?]; [du] trägst die Opferspeise zu den Göttern [?] [Anm.: Wortlaut unsicher; Bezug auf Agni vermutet]."},{"n":1688,"sa":"vibhūtarātiṃ vipra citraśociṣamagnimīḍiṣva yanturam\nasya medhasya somyasya sobhare premadhvarāya pūrvyam","de":"Den mächtigen Spender, Weiser, den Bunt-Leuchtenden, Agni, preise, den Lenker; für dieses Weisheit-Werk des Soma-Verehrers, Sobhari, [ruf] den ersten zur [Weihe]handlung [?] [Anm.: „premadhvarāya pūrvyam“ Textzustand fraglich]."}]},{"num":337,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 12","n_from":1689,"n_to":1690,"title_de":"Soma-Pavamāna: der Presssaft im Kelterbecher","note":"","units":[{"n":1689,"sa":"ā soma savāno adribhistiro vārāṇyavyayā\njano na puri camvorviśaddhariḥ sado vaneṣu dadhriṣe","de":"Der Soma, gepresst mit den Presssteinen, ist durch die Schafwollsiebe hindurchgeklärt; wie ein Mann [Anm.: jano na, „wie ein Mensch/Volk“] setzt sich der falbe [Saft] in die beiden Schalen und ins Holz [der Gefäße] – so ist er fest eingesetzt."},{"n":1690,"sa":"sa māmṛje tiro aṇvāni meṣyo mīḍvāntsaptirna vājayuḥ\nanumādyaḥ pavamāno manīṣibhiḥ somo viprebhirṛkvabhiḥ","de":"Er wurde gereinigt, hinüber über die feinen Fasern, der Widder [?], der Spender, wie ein Ross, das nach Siegespreis verlangt; er, der Läuterung erfährt, soll durch die Weisen erfreuen, der Soma durch die gesangreichen Seher."}]},{"num":338,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 13","n_from":1691,"n_to":1692,"title_de":"Indra-Anruf: gepresster Soma bei der Pressung","note":"","units":[{"n":1691,"sa":"vayamenamidā hyo 'pīpemeha vajriṇam\ntasmā u adya savane sutaṃ bharā nūnaṃ bhūṣata śrute","de":"Diesen Träger des Keils haben wir gestern hier [mit Soma] gemästet [?]; bringe ihm heute bei der Pressung das Gepresste herbei; er soll nun, dem Ruhmreichen, geschmückt werden."},{"n":1692,"sa":"vṛkaścidasya vāraṇa urāmathirā vayuneṣu bhūṣati\nsemaṃ na stomaṃ jujuṣāṇa ā gahīndra pra citrayā dhiyā","de":"Selbst der Wolf [?] fürchtet dessen Abwehr; der Unbezwingliche [?] schmückt sich in den Weisungen; dieses Preislied, Indra, wohlgefällig annehmend, komm herbei mit heller, vielfältiger Einsicht [Anm.: Textzustand teils unsicher]."}]},{"num":339,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 14","n_from":1693,"n_to":1695,"title_de":"Indra und Agni: Lob ihrer Kraft","note":"","units":[{"n":1693,"sa":"indrāgnī rocanā divaḥ pari vājeṣu bhūṣathaḥ\ntadvāṃ ceti pra vīryam","de":"Indra und Agni, ihr ziert die Lichträume des Himmels ringsum in den Wettkämpfen; diese eure Heldenkraft wird [dort] erkannt."},{"n":1694,"sa":"indrāgnī apasaspari upa pra yanti dhītayaḥ\nṛtasya pathyā anu","de":"Indra und Agni, von unten her, aus den Wassern, ziehen die Gedanken [Lobgedichte] hinauf, auf den Pfaden der Ordnung [ṛta]."},{"n":1695,"sa":"indrāgnī taviṣāṇi vām sadhasthāni prayāṃsi ca\nyuvoraptūryaṃ hitam","de":"Indra und Agni, eure Kräfte und eure Sitzplätze und Speisen [sind bekannt]; eure Tatkraft ist [uns] zum Wohl bereitgelegt [Anm.: aptūrya = Wasser überwindende/durchdringende Tatkraft; unsicher] [?]."}]},{"num":340,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 15","n_from":1696,"n_to":1698,"title_de":"Indra: Wer kennt ihn beim Soma?","note":"","units":[{"n":1696,"sa":"ka īṃ veda sute sacā pibantaṃ kadvayo dadhe\nayaṃ yaḥ puro vibhinattyojasā mandānaḥ śiprayandhasaḥ","de":"Wer kennt ihn wohl beim Soma, wenn er, dabeisitzend, trinkt? Welche Kraft [?] trägt er? Dieser da spaltet die Burgen mit Macht, berauscht von der Speise [dem Trank], die Wangen [Kinnbacken] bewegend [?]."},{"n":1697,"sa":"dānā mṛgo na vāraṇaḥ purutrā carathaṃ dadhe\nna kiṣṭvā ni yamadā sute gamo mahāṃścarasyojasā","de":"Wie ein wilder Elefant [?], der gierig Gaben empfängt, trägt er [seine Kraft] vielfältig umher; keiner hält dich zurück, wenn du zur Pressung kommst, du Großer, mit der Macht des Wandelns [?]."},{"n":1698,"sa":"ya ugraḥ sannaniṣṭṛtaḥ sthiro raṇāya saṃskṛtaḥ\nyadi stoturmaghavā śṛṇavaddhavaṃ nendro yoṣatyā gamat","de":"Der, welcher furchtbar, unerreichbar, fest, für den Kampf gerüstet ist – wenn der Gabenreiche den Ruf des Sängers erhört, dann kommt Indra nicht, ohne [zu erscheinen] [Anm.: Wortlaut der letzten Zeile unsicher: „nendro yoṣatyā gamat“; Textzustand fraglich] [?]."}]},{"num":341,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 16","n_from":1699,"n_to":1701,"title_de":"Soma-Pavamāna: die Tropfen strömen","note":"","units":[{"n":1699,"sa":"pavamānā asṛkṣata somāḥ śukrāsa indavaḥ\nabhi viśvāni kāvyā","de":"Sich läuternd wurden sie entsandt, die Somasäfte, die hellen Tropfen, hin zu allen Dichtungen [Weisheitsworten]."},{"n":1700,"sa":"pavamānā divasparyantarikṣādasṛkṣata\npṛthivyā adhi sānavi","de":"Sich läuternd wurden sie aus dem Himmel, aus dem Luftraum entsandt, oben auf den Rücken der Erde."},{"n":1701,"sa":"pavamānāsa āśavaḥ śubhrā asṛgramindavaḥ\nghnanto viśvā apa dviṣaḥ","de":"Die sich läuternden, rasch [strömenden], hellen Tropfen wurden entsandt, alle Feindseligkeit erschlagend."}]},{"num":342,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 17","n_from":1702,"n_to":1704,"title_de":"Indra und Agni: die Vṛtra-Töter","note":"","units":[{"n":1702,"sa":"tośā vṛtrahaṇā huve sajitvānāparājitā\nindrāgnī vājasātamā","de":"Die Beiden, die Vṛtra erschlagen, immer siegreich und unbesiegt, rufe ich an, Indra und Agni, die besten Gewinner von Beute."},{"n":1703,"sa":"pra vāmarcantyukthino nīthāvido jaritāraḥ\nindrāgnī iṣa ā vṛṇe","de":"Euch preisen die Sänger, die Liedkundigen, mit Lobversen; Indra und Agni, um Stärkung bitte ich [euch]."},{"n":1704,"sa":"indrāgnī navatiṃ puro dāsapatnīradhūnutam\nsākamekena karmaṇā","de":"Indra und Agni, die neunzig Burgen, die Frauen der Dāsas [„Gattinnen“, d. h. deren Herren gehörig], habt ihr erschüttert, zugleich durch eine einzige Tat."}]},{"num":343,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 18","n_from":1705,"n_to":1707,"title_de":"Agni-Lobgesang: der Leuchtende in seinen Burgen","note":"","units":[{"n":1705,"sa":"upa tvā raṇvasandṛśaṃ prayasvantaḥ sahaskṛta\nagne sasṛjmahe giraḥ","de":"Zu dir, dem freudig Anzuschauenden, du Kraftgezeugter, bringen wir, Opfergaben-Habende [prayasvantaḥ], Lieder hervor, Agni."},{"n":1706,"sa":"upa cchāyāmiva ghṛṇeraganma śarma te vayam\nagne hiraṇyasandṛśaḥ","de":"Wie zum Schatten zur Wärme [Glut?] [Anm.: „ghṛṇeḥ“, Glut/Hitze; unsicher] kamen wir zu deinem Schutz, Agni, dem Goldgleichen [?]."},{"n":1707,"sa":"ya ugra iva śaryahā tigmaśṛṅgo na vaṃsagaḥ\nagne puro rurojitha","de":"Der du furchtbar wie ein Pfeile-Töter bist, wie ein spitzhörniger Stier [?], Agni, du hast die Burgen zerbrochen."}]},{"num":344,"loc":"Prapāṭhaka VIII, Ardha 2, Gruppe 19","n_from":1708,"n_to":1710,"title_de":"Agni Vaiśvānara: Herr des Lichts der Ordnung","note":"","units":[{"n":1708,"sa":"ṛtāvānaṃ vaiśvānaramṛtasya jyotiṣaspatim\najasraṃ gharmamīmahe","de":"Den Ordnung-Haltenden, Vaiśvānara, den Herrn des Lichts der Ordnung, den unablässigen [Glut-]Kessel [gharma] erbitten wir."},{"n":1709,"sa":"ya idaṃ pratipaprathe yajñasya svaruttiran\nṛtūnutsṛjate vaśī","de":"Der dies hier ausgebreitet hat, der Jahreszeiten-Strahl [?], der Selbstleuchtende, er, der Gebieter, entlässt die Jahreszeiten [Anm.: „svaruttiran“ unsicher] [?]."},{"n":1710,"sa":"agniḥ priyeṣu dhāmasu kāmo bhūtasya bhavyasya\nsabhrāḍeko vi rājati","de":"Agni ist in den geliebten Stätten, der Wunsch des Gewesenen und Kommenden; als einziger Alleinherrscher waltet er umher."}]},{"num":345,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 1","n_from":1711,"n_to":1713,"title_de":"Agni: der Weise, der sich schmückt","note":"","units":[{"n":1711,"sa":"agniḥ pratnena janmanā śumbhānastanvā3ṃ svām\nkavirvipreṇa vavṛdhe","de":"Agni, der sich durch sein altes Wesen [seine alte Geburt] schmückt, seinen eigenen Leib; der Seher ist durch den Redekundigen gewachsen."},{"n":1712,"sa":"ūrjjo napātamā huve 'gniṃ pāvakaśociṣam\nasminyajñe svadhvare","de":"Ich rufe den Enkel der Kraft [Sohn der Stärke], Agni von reinem Glanz, bei dieser Weihehandlung von guter Ordnung."},{"n":1713,"sa":"sa no mitramahastvamagne śukreṇa śociṣā\ndevairā satsi barhiṣi","de":"Du, Agni, der du groß bist wie Mitra, setze dich mit hellem Glanz mit den Himmlischen auf das Barhis-Streu."}]},{"num":346,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 2","n_from":1714,"n_to":1717,"title_de":"Soma: Abwehr der Unholde","note":"","units":[{"n":1714,"sa":"utte śuṣmāso asthū rakṣo bhindanto adrivaḥ\nnudasva yāḥ parispṛdhaḥ","de":"Deine Kräfte sind aufgestanden, Rakṣas-Spaltende, o Steinbesitzer; stoße weg die, die ringsum wetteifern [feindlich]."},{"n":1715,"sa":"ayā nijaghnirojasā rathasaṅge dhane hite\nstavā abibhyuṣā hṛdā","de":"Mit dieser Kraft, mit dem furchtlosen Herzen, erschlage, wo der Schatz im Wagengefecht ausgesetzt ist [?] – die Lobpreisungen."},{"n":1716,"sa":"asya vratāni nādhṛṣe pavamānasya dūḍhyā\nruja yastvā pṛtanyati","de":"Seine Gebote sind unbezwingbar, des sich läuternden [Soma]; zerbrich den, der schwer zu täuschen ist, der dich bekämpft [?]."},{"n":1717,"sa":"taṃ hinvanti madacyutaṃ hariṃ nadīṣu vājinam\nindumindrāya matsaram","de":"Diesen berauschend-strömenden, falben, siegreichen [Soma] in den Strömen treiben sie an, den Tropfen, den Berauschenden, für Indra."}]},{"num":347,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 3","n_from":1718,"n_to":1720,"title_de":"Indra: komm mit den falben Rossen","note":"","units":[{"n":1718,"sa":"ā mandrairindra haribhiryāhi mayūraromabhiḥ\nmā tvā ke cinni yemurinna pāśino 'ti dhanveva tāṃ ihi","de":"Komm herbei, Indra, mit den erfreuenden falben Rossen, die Pfauenfeder-haarig sind; keiner soll dich aufhalten, wie Vogelsteller den Vogel; gehe an ihnen vorbei wie über eine Wüste [?]."},{"n":1719,"sa":"vṛtrakhādo valaṃ rujaḥ purāṃ darmo apāmajaḥ\nsthātā rathasya haryorabhisvara indro dṛḍhā cidārujaḥ","de":"Du Vṛtra-Verschlinger, du hast die Höhle [Vala] gebrochen, Burgen-Zerstörer, Sprenger der Wasser; du stehst auf dem Wagen bei den beiden Falben, brüllend; Indra, du hast selbst Festes zerbrochen."},{"n":1720,"sa":"gambhīrāṃ udadhīṃriva kratuṃ puṣyasi gā iva\npra sugopā yavasaṃ dhenavo yathā hradaṃ kulyā ivāśata","de":"Wie tiefe Meere nährst du die Einsicht, wie Kühe; wie gute Hirten die Kühe zum Futter, so gelangen [sie] zu dir, wie Kanäle zum See [?]."}]},{"num":348,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 4","n_from":1721,"n_to":1722,"title_de":"Indra: Trink den Soma bei Kaṇvas","note":"","units":[{"n":1721,"sa":"yathā gauro apā kṛtaṃ tṛṣyannetyaveriṇam\nāpitve naḥ prapitve tūyamā gahi kaṇveṣu su sacā piba","de":"Wie ein Gaur [Wildrind] durstig zum gegrabenen Wasser eilt, so komm zu uns, in Freundschaft, in näherer Verwandtschaft, schnell herbei; bei den Kaṇvas trinke, [uns] wohlgesinnt [?]."},{"n":1722,"sa":"mandantu tvā maghavannindrendavo rādhodeyāya sunvate\nāmuṣyā somamapibaścamū sutaṃ jyeṣṭhaṃ taddadhiṣe sahaḥ","de":"Dich sollen die Somatropfen erfreuen, Gabenreicher Indra, damit der Pressende Gabe [zu geben] vermag; du hast den Soma getrunken, das in der Schale Gepresste; jene höchste Stärke trägst du."}]},{"num":349,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 5","n_from":1723,"n_to":1724,"title_de":"Indra: keiner ist ein besserer Gnädiger als du","note":"","units":[{"n":1723,"sa":"tvamaṅga pra śuṃsiṣo devaḥ śaviṣṭha martyam\nna tvadanyo maghavannasti marḍitendra bravīmi te vacaḥ","de":"Du, mein Lieber, hast den Sterblichen [gepriesen/den Menschen erhoben] als leuchtender Gott, du Kräftigster; außer dir gibt es keinen, der Gnade übt, Gabenreicher Indra; dies Wort sage ich dir."},{"n":1724,"sa":"mā te rādhāṃsi mā ta ūtayo vaso 'smānkadā canā dabhan\nviśvā ca na upamimīhi mānuṣa vasūni carṣaṇibhya ā","de":"Nicht sollen deine Gaben, nicht deine Hilfen, o Herr der Güter, uns je schädigen; und bringe uns alle Güter herbei, Menschenfreund, von den Menschenstämmen [?]."}]},{"num":350,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 6","n_from":1725,"n_to":1727,"title_de":"Uṣas: die Tochter des Himmels erscheint","note":"","units":[{"n":1725,"sa":"prati ṣyā sūnarī janī vyucchantī pari svasuḥ\ndivo adarśi duhitā","de":"Jene gütige Herrin, die Tochter des Himmels, wurde sichtbar, indem sie der Schwester [Nacht] gegenüber aufleuchtet."},{"n":1726,"sa":"aśveva citrāruṣī mātā gavāmṛtāvarī\nsakhā bhūdaśvinoruṣāḥ","de":"Wie eine bunte, rötliche Stute, die Mutter der Kühe [Strahlen], ordnungshaltend – so wurde Uṣas zur Gefährtin der beiden Aśvin."},{"n":1727,"sa":"uta sakhāsyaśvinoruta mātā gavāmasi\nutoṣo vasva īśiṣe","de":"Du bist die Gefährtin der Aśvin und die Mutter der Kühe; auch über den Reichtum, Uṣas, gebietest du."}]},{"num":351,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 7","n_from":1728,"n_to":1730,"title_de":"Aśvin: Anruf beim Morgenrot","note":"","units":[{"n":1728,"sa":"eṣo uṣā apūrvya vyucchati priyā divaḥ\nstuṣe vāmaśvinā bṛhat","de":"Diese hier, Uṣas, die unvergleichliche, leuchtet auf, die Liebe des Himmels; euch beide, Aśvin, preise ich mit großem [Lied]."},{"n":1729,"sa":"yā dasrā sindhumātarā manotarā rayīṇām\ndhiyā devā vasuvidā","de":"Ihr Wundertäter, deren Mutter der Strom ist [Anm.: sindhumātarā, unsicher], die den Gedanken überholen, die Reichtümer finden, ihr Himmlischen, mit dem Lied [rufe ich euch]."},{"n":1730,"sa":"vacyante vāṃ kakuhāso jūrṇāyāmadhi viṣṭapi\nyadvāṃ ratho vibhiṣpatāt","de":"Für euch werden die Höcker [Gipfel/Hochlieder?] gesprochen [?], auf dem alten [?] Standort, wenn euer Wagen sich in Eile [wörtl.: mit den Fluren?] senkt [Anm.: Textzustand fraglich] [?]."}]},{"num":352,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 8","n_from":1731,"n_to":1733,"title_de":"Uṣas: Bitte um glänzenden Reichtum","note":"","units":[{"n":1731,"sa":"uṣastaccitramā bharāsmabhyaṃ vājinīvati\nyena tokaṃ ca tanayaṃ ca dhāmahe","de":"Bringe uns, Uṣas, du Beutereiche, jenes Glänzende, wodurch wir Kind und Enkel erhalten können."},{"n":1732,"sa":"uṣo adyeha gomatyaśvāvati vibhāvari\nrevadasme vyuccha sūnṛtāvati","de":"Uṣas, heute hier, du kuhreiche, rossereiche, weithin strahlende: Leuchte uns auf zu Reichtum, du Wahrheitsvolle [Freudige]."},{"n":1733,"sa":"yuṅkṣvā hi vājinīvatyaśvāṃ adyāruṇāṃ uṣaḥ\nathā no viśvā saubhagānyā vaha","de":"Schirre heute die rötlichen Rosse an, Uṣas, du Beutereiche; und dann bringe uns alle Glücksgüter herbei."}]},{"num":353,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 9","n_from":1734,"n_to":1736,"title_de":"Aśvin: zum Somatrunk herbei","note":"","units":[{"n":1734,"sa":"aśvinā vartirasmadā gomaddasrā hiraṇyavat\narvāgrathaṃ samanasā ni yacchatam","de":"Aśvin, ihr Wundertäter, lenkt eure Bahn zu uns, kuhreich und goldreich; den Wagen richtet einträchtig zu uns her."},{"n":1735,"sa":"eha devā mayobhuvā dasrā hiraṇyavarttanī\nuṣarbudho vahantu somapītaye","de":"Hierher sollen die beiden Himmlischen, die Wohltuenden, Wundertäter mit goldener Fahrspur, die von Uṣas Geweckten, zum Somatrunk fahren."},{"n":1736,"sa":"yāvitthā ślokamā divo jyotirjanāya cakrathuḥ\nā na ūrjaṃ vahatamaśvinā yuvam","de":"Die ihr so den Ruf und das Licht des Himmels für den Menschen geschaffen habt – bringt uns beide Kraft [Nahrung] herbei, Aśvin."}]},{"num":354,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 10","n_from":1737,"n_to":1739,"title_de":"Agni: Bitte um Nahrung für die Sänger","note":"Refrain: „Bringe den Sängern Nahrung herbei.“","units":[{"n":1737,"sa":"agniṃ taṃ manye yo vasurastaṃ yaṃ yanti dhenavaḥ\nastamarvanta āśavostaṃ nityāso vājina iṣaṃ stotṛbhya ā bhara","de":"Agni halte ich für den, der das Gut [Wohnstatt] ist, zu dem die Kühe heimkehren; zu ihm [gehen] die raschen Rosse, zu ihm die beständigen Siegerrosse; bringe den Sängern Nahrung herbei."},{"n":1738,"sa":"agnirhi vājinaṃ viśe dadāti viśvacarṣaṇiḥ\nagnī rāye svābhuvaṃ sa prīto yāti vāryamiṣaṃ stotṛbhya ā bhara","de":"Denn Agni, der allen Stämmen zugewandte, gibt dem Stamm das Siegerross; zu Reichtum [gibt er] Wohlsein; erfreut kommt er zum Wünschenswerten; bringe den Sängern Nahrung herbei."},{"n":1739,"sa":"so agniryo vasurgṛṇe saṃ yamāyanti dhenavaḥ\nsamarvanto raghudruvaḥ saṃ sujātāsaḥ sūraya iṣaṃ stotṛbhya ā bhara","de":"Er ist Agni, der für den Preisenden das Gut ist; zu ihm streben die Kühe zusammen, zusammen die flinken Rosse, zusammen die edelgeborenen Herren; bringe den Sängern Nahrung herbei."}]},{"num":355,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 11","n_from":1740,"n_to":1742,"title_de":"Uṣas: Bitte um Wachheit und Reichtum","note":"Refrain: „… wahrhaft Ruhmreiche, Vāyya, Edelgeborene, rossereiche Freudige.“","units":[{"n":1740,"sa":"mahe no adya bodhayoṣo rāye divitmatī\nyathā cinno abodhayaḥ satyaśravasi vāyye sujāte aśvasūnṛte","de":"Wecke uns heute für Großes, Uṣas, zu Reichtum, du himmelleuchtende, wie du uns [schon] geweckt hast, du wahrhaft Rühmende, Vāyya [?], Edelgeborene, du Rossereiche, Freundliche."},{"n":1741,"sa":"yā sunīthe śaucadrathe vyauccho duhitardivaḥ\nsā vyuccha sahīyasi satyaśravasi vāyye sujāte aśvasūnṛte","de":"Die du, Himmelstochter, dem Guten, dem Śucadratha, aufgeleuchtet hast, leuchte auch [uns] auf, du Überlegene, wahrhaft Rühmende, Vāyya [?], Edelgeborene, du Rossereiche, Freundliche."},{"n":1742,"sa":"sā no adyābharadvasurvyucchā duhitardivaḥ\nyo vyaucchaḥ sahīyasi satyaśravasi yāyye sujāte aśvasūnṛte","de":"Sie, die Güterreiche, soll uns heute [Gaben] herbeitragen: leuchte auf, Tochter des Himmels, die du dem Überlegenen aufgeleuchtet hast, wahrhaft Rühmende, Vāyya [?], Edelgeborene, du Rossereiche, Freundliche [Anm.: „yāyye“ im Text; Textzustand fraglich]."}]},{"num":356,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 12","n_from":1743,"n_to":1745,"title_de":"Aśvin: Anruf des Sängers","note":"Refrain: „Ihr Honigreichen, hört meinen Ruf.“","units":[{"n":1743,"sa":"prati priyatamaṃ rathaṃ vṛśaṇaṃ vasuvāhanam\nstotā vāmaśvināvṛṣi stomebhirbhūṣati prati mādhvī mama śrutaṃ havam","de":"Zu eurem liebsten, stierstarken, Güter fahrenden Wagen [kommt], Aśvin; der Sänger, der Seher, schmückt [euch] mit Preisliedern; ihr Honigreichen, hört meinen Ruf."},{"n":1744,"sa":"atyāyātamaśvinā tiro viśvā ahaṃ sanā\ndasrā hiraṇyavarttanī suṣumṇā sindhuvāhasā mādhvī mama śrutaṃ havam","de":"Kommt herbei, Aśvin, durch alle [Hindernisse] hindurch; ich [rufe euch] seit alters, ihr Wundertäter mit goldener Fahrspur, gütig, Ströme führend; ihr Honigreichen, hört meinen Ruf."},{"n":1745,"sa":"ā no ratnāni bibhratāvaśvinā gacchataṃ yuvam\nrudrā hiraṇyavarttanī juṣāṇā vājinīvasū mādhvī mama śrutaṃ havam","de":"Zu uns kommt, Aśvin, ihr beide, Schätze tragend, ihr Rudra-gleichen [?] mit goldener Fahrspur, wohlgefällig, Reichtum an Kraft-Gaben habend; ihr Honigreichen, hört meinen Ruf."}]},{"num":357,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 13","n_from":1746,"n_to":1748,"title_de":"Agni und Uṣas: Erwachen am Morgen","note":"","units":[{"n":1746,"sa":"abodhyagniḥ samidhā janānāṃ prati dhenumivāyatīmuṣāsam\nyahvā iva pra vayāmujjihānāḥ pra bhānavaḥ sasrate nākamaccha","de":"Agni wurde durch das Anzünden der Menschen erweckt, gegenüber Uṣas, wie einer herannahenden Kuh; wie Äste, die emporschießen, streben die Strahlen zum Himmel."},{"n":1747,"sa":"abodhi hotā yajathāya devānūrdhvo agniḥ sumanāḥ prātarasthāt\nsamiddhasya ruśadadarśi pājo mahāndevastamaso niramoci","de":"Der Rufer wurde erweckt, um die Himmlischen zu verehren; aufrecht, wohlgesinnt hat sich Agni am Morgen erhoben; die helle Kraft des Entflammten wurde gesehen; der große Gott wurde aus dem Dunkel befreit."},{"n":1748,"sa":"yadīṃ gaṇasya raśanāmajīgaḥ śuciraṅkte śucibhirgobhiragniḥ\nāddakṣiṇā yujyate vājayantyuttānāmūrdhvo adhayajjuhūbhiḥ","de":"Wenn er den Strick der Schar [?] gelöst hat, salbt sich der reine Agni mit reinen Strahlen [Kühen/Strahlmilch]; dann wird die Dakṣiṇā [Opferlohn/Dakṣiṇā-Kuh] angeschirrt, beuteeifrig; aufrecht hat er von den aufgehaltenen Löffeln getrunken [?] [Anm.: Wortlaut unsicher]."}]},{"num":358,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 14","n_from":1749,"n_to":1751,"title_de":"Uṣas und Nacht: die beiden Schwestern","note":"","units":[{"n":1749,"sa":"idaṃ śreṣṭhaṃ jyotiṣāṃ jyotirāgāccitraḥ praketo ajaniṣṭa vibhvā\nyathā prasūtā savituḥ savāyaivā rātryuṣase yonimāraik","de":"Dies beste der Lichter ist gekommen; das bunte Zeichen wurde geboren, allgegenwärtig; wie auf Anstoß des Savitṛ, so hat die Nacht der Uṣas ihren Schoß überlassen."},{"n":1750,"sa":"ruśādvatsā ruśatī śvetyāgādāraigu kṛṣṇā sadanānyasyāḥ\nsamānabandhū amṛte anūcī dyāvā varṇaṃ carata āmināne","de":"Die helle [Uṣas] kam mit dem Kalb [Sonne] hervor, die dunkle [Nacht] hat ihre Wohnstätten [?] verlassen; die beiden Unsterblichen, gleichgebunden, hintereinander, wandeln, die Farbe wechselnd, Himmel und [Erde] [?]."},{"n":1751,"sa":"samāno adhvā svasroranantastamanyānyā carato devaśiṣṭe\nna methete na tasthatuḥ sumeke naktoṣāsā samanasā virūpe","de":"Gemeinsam ist der Weg der Schwestern, endlos; von den Göttern geheißen, wandeln sie einer nach dem andern; sie streiten nicht, sie stehen nicht still, die gutgestalteten; Nacht und Uṣas, gleichgesinnt, verschieden von Gestalt."}]},{"num":359,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 15","n_from":1752,"n_to":1754,"title_de":"Agni, Uṣas und Aśvin: Frühmorgen","note":"","units":[{"n":1752,"sa":"ā bhātyagniruṣasāmanīkamudviprāṇāṃ devayā vāco asthuḥ\narvāñcā nūnaṃ rathyeha yātaṃ pīpivāṃsamaśvinā gharmamaccha","de":"Agni erstrahlt als Antlitz der Morgenröten; die götterliebenden Worte der Redegewandten haben sich erhoben; kommt jetzt hierher, Wagenfahrer, herbei, ihr beiden Aśvin, zum strotzenden Gharma."},{"n":1753,"sa":"na saṃskṛtaṃ pra mimīto gamiṣṭhānti nūnamaśvinopastuteha\ndivābhipitvevasāgamiṣṭhā pratyavarttiṃ dāśuṣe śambhaviṣṭhā","de":"Sie missachten nichts Zubereitetes, sie kommen; ihr Aśvin, jetzt seid ihr hier [im Lied] angerufen, wie [mit Hilfe] am Tag zum Trank, kommt zur Hilfe; dem Gebenden seid [ihr] Heilbringer, ihr, die ihr Beistand gebt [?] [Anm.: Wortlaut unsicher]."},{"n":1754,"sa":"utā yātaṃ saṃgave prātarahno madhyandina uditā sūryasya\ndivā naktamavasā śantamena nedānīṃ pītiraśvinā tatāna","de":"Und kommt zur Kuhtrieb-Zeit am Morgen, am Mittag und bei Sonnenaufgang; tags und nachts mit heilsamster Hilfe; jetzt, Aśvin, hat sich der Trank ausgebreitet [?]."}]},{"num":360,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 16","n_from":1755,"n_to":1757,"title_de":"Uṣas: die Morgenröten leuchten","note":"","units":[{"n":1755,"sa":"etā u tyā uṣasaḥ ketumakrata pūrve ardhe rajaso bhānumañjate\nniṣkṛṇvānā āyudhānīva dhṛṣṇavaḥ prati gāvo 'ruṣīryanti mātaraḥ","de":"Diese Morgenröten haben ihr Zeichen gemacht; sie salben im Osten des Raums ihren Glanz; wie kühne [Krieger], die Waffen bereit machen, kommen die roten Kühe, die Mütter [Strahlen], entgegen."},{"n":1756,"sa":"udapaptannaruṇā bhānavo vṛthā svāyujo aruṣīrgā ayukṣata\nakrannuṣāso vayunāni pūrvathā ruśantaṃ bhānumaruṣīraśiśrayuḥ","de":"Die roten Strahlen sind grundlos aufgeflogen; sie haben die roten Kühe selbst angeschirrt; die Morgenröten haben die Zeichen wie früher gemacht; die Roten haben den leuchtenden Glanz an sich gelegt."},{"n":1757,"sa":"arcanti nārīrapaso na viṣṭibhiḥ samānena yojanenā parāvataḥ\niṣaṃ vahantīḥ sukṛte sudānave viśvedaha yajamānāya sunvate","de":"Sie preisen [die Götter] wie Frauen bei der Arbeit, mit den Kräften, von fern her mit gleichem Gespann; Nahrung bringend zum Wohltäter, dem freigebigen, an allen Tagen, dem Verehrer, der Soma presst."}]},{"num":361,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 17","n_from":1758,"n_to":1760,"title_de":"Aśvin und Uṣas: Erwachen von Agni und Sonne","note":"","units":[{"n":1758,"sa":"abodhyagnirjma udeti sūryo vyū3ṣāścandrā mahyāvo arciṣā\nāyukṣātāmaśvinā yātave rathaṃ prāsāvīddevaḥ savitā jagatpṛthak","de":"Agni wurde erweckt; die Sonne geht auf; die glänzende Uṣas hat mit ihrem Strahl das Große aufgedeckt; die beiden Aśvin haben den Wagen zur Fahrt angeschirrt; der Gott Savitṛ hat die Welt in ihrer Vielfalt in Bewegung gesetzt [Anm.: „jma“ am Versanfang: Textzustand fraglich]."},{"n":1759,"sa":"yadyuñjāthe vṛṣaṇamaśvinā rathaṃ ghṛtena no madhunā kṣatramukṣatam\nasmākaṃ brahma pṛtanāsu jinvataṃ vayaṃ dhanā śūrasātā bhajemahi","de":"Wenn ihr, Aśvin, den stierstarken Wagen anschirrt, besprengt uns die Herrschaft mit Ghee und Honig; stärkt unser heiliges Wort in den Kämpfen; möchten wir in Heldenkämpfen Güter gewinnen."},{"n":1760,"sa":"arvāṅtricakro madhuvāhano ratho jīrāśvo aśvinoryātu suṣṭutaḥ\ntrivandhuro maghavā viśvasaubhagaḥ śaṃ na ā vakṣaddvipade catuṣpade","de":"Der dreirädrige, Honig fahrende Wagen der Aśvin, mit flinken Rossen, gut gepriesen, soll hierher kommen, mit drei Sitzstangen [?], gabenreich, alles Glück bringend; er bringe uns Heil, dem Zweifüßigen und dem Vierfüßigen."}]},{"num":362,"loc":"Prapāṭhaka VIII, Ardha 3, Gruppe 18","n_from":1761,"n_to":1764,"title_de":"Soma-Pavamāna: Ströme zum Siegespreis","note":"","units":[{"n":1761,"sa":"pra te dhārā asaścato divo na yanti vṛṣṭayaḥ\nacchā vājaṃ sahasriṇam","de":"Deine unversiegbaren Ströme gehen hervor wie die Regengüsse des Himmels, hin zum tausendfachen Siegespreis."},{"n":1762,"sa":"abhi priyāṇi kāvyā viśvā cakṣāṇo arṣati\nharistuñjāna āyudhā","de":"Er strömt hin zu allen lieben Dichtungen [Weisheiten], alles überschauend, der Falbe, die Waffen schwingend [?]."},{"n":1763,"sa":"sa marmṛjāna āyubhiribho rājeva suvrataḥ\nśyeno na vaṃsu ṣīdati","de":"Er, sich mit den Menschen [?] schmückend, wie ein wohlgesinnter König [?] [Anm.: „ibha“ unsicher], setzt sich wie ein Falke in die Hölzer [Gefäße]."},{"n":1764,"sa":"sa no viśvā divo vasūto pṛthivyā adhi\npunāna indavā bhara","de":"Du, der du alle Güter aus dem Himmel und von der Erde [birgst], strömend, Tropfen, bring sie uns."}]},{"num":363,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 1","n_from":1765,"n_to":1767,"title_de":"Soma: Läuterung und Preis","note":"","units":[{"n":1765,"sa":"prāsya dhārā akṣaranvṛṣṇaḥ sutasyaujasā\ndevāṃ anu prabhūṣataḥ","de":"Seine Ströme flossen hervor mit der Kraft des gepressten Stiers, den Göttern nach, sie schmückend."},{"n":1766,"sa":"saptiṃ mṛjanti vedhaso gṛṇantaḥ kāravo girā\njyotirjajñānamukthyam","de":"Die Weisen, die Sänger, reinigen das Ross [den Soma], mit dem Lied preisend, das Licht, das preiswürdig geboren wurde."},{"n":1767,"sa":"suṣahā soma tāni te punānāya prabhūvaso\nvardhā samudramukthyam","de":"Leicht überwindbar sind diese deine [Kräfte], Soma, du reich an Gütern, der du dich läuterst; mehre den lobenswerten Ozean [?]."}]},{"num":364,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 2","n_from":1768,"n_to":1770,"title_de":"Indra: Lob des Brahman","note":"","units":[{"n":1768,"sa":"eṣa brahmā ya ṛtviya indro nāma śruto gṛṇe","de":"Dieser ist das Brahman [die heilige Formung], der zeitgerechte, der Indra heißt, den man rühmt, [dem] ich singe."},{"n":1769,"sa":"tvāmicchavasaspate yanti giro na saṃyataḥ","de":"Dich, du Herr der Kraft, erstreben die Lieder, wie Zusammengefasste [Herden] [?]."},{"n":1770,"sa":"vi srutayo yathā pathā indra tvadyantu rātayaḥ","de":"Wie Ströme auf ihren Wegen sollen von dir, Indra, die Gaben ausgehen [?]."}]},{"num":365,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 3","n_from":1771,"n_to":1773,"title_de":"Indra: Anruf des Kräftigsten","note":"","units":[{"n":1771,"sa":"ā tvā rathaṃ yathotaye sumnāya varttayāmasi\ntuvikūrmimṛtīṣahamindraṃ śaviṣṭha satpatim","de":"Wie einen Wagen zur Hilfe, so wenden wir dich zu uns, zum Wohlergehen, den viel-wogenden [?], den Feindüberwinder, Indra, du Kräftigster, den Herrn der Guten."},{"n":1772,"sa":"tuviśuṣma tuvikrato śacīvo viśvayā mate\nā paprātha mahitvanā","de":"Du Vielkräftiger, viele Kräfte Habender, Śacī-Reicher, mit allumfassendem Sinn hast du [alles] durch deine Größe erfüllt."},{"n":1773,"sa":"yasya te mahinā mahaḥ pari jmāyantamīyatuḥ\nhastā vajraṃ hiraṇyayam","de":"Dessen große Hände, Indra, deine Größe, um die wandernde Erde herum hin gelangten, halten den goldenen Keil [?] [Anm.: Wortlaut unsicher]."}]},{"num":366,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 4","n_from":1774,"n_to":1776,"title_de":"Agni: der zweimal Geborene","note":"","units":[{"n":1774,"sa":"ā yaḥ puraṃ nārmiṇīmadīdedatyaḥ kavirnabhanyo3 nārva\nsūro na rurukvāñchatātmā","de":"Der, der hell strahlend in die Burg der Feinde [?] hineinleuchtete, der Seher, wie ein Ross in den Wolken [?], wie die Sonne, mit hundert Lebenskräften [?] [Anm.: „nārmiṇīm“ unsicher; Textzustand fraglich]."},{"n":1775,"sa":"abhi dvijanmā trī rocanāni viśvā rajāṃsi śuśucano asthāt\nhotā yajiṣṭho apāṃ sadhasthe","de":"Der zweimal Geborene hat die drei Lichträume und alle Lufträume leuchtend überstiegen, der Rufer, der beste Verehrer, im Sitz der Wasser."},{"n":1776,"sa":"ayaṃ sa hotā yo dvijanmā viśvā dadhe vāryāṇi śravasyā\nmarto yo asmai sutuko dadāśa","de":"Dies ist der Rufer, der, zweimal geboren, alle wünschenswerten Güter [und] Ruhm bringt, der Sterbliche, der ihm, dem [Gesegneten], eine gute Gabe [Nachkommenschaft?] gegeben hat [?]."}]},{"num":367,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 5","n_from":1777,"n_to":1779,"title_de":"Agni: Bitte um Gedeihen","note":"","units":[{"n":1777,"sa":"agne tamadyāṣvaṃ na stomaiḥ kratuṃ na bhadraṃ hṛdispṛṣam\nṛdhyāmā ta ohaiḥ","de":"Agni, jenen [Preis] heute, wie ein Ross mit Preisliedern, wie eine gute Einsicht, die das Herz berührt – möchten wir mit deinen Fahrten [Gaben] gedeihen."},{"n":1778,"sa":"adhā hyagne kratorbhadrasya dakṣasya sādhoḥ\nrathīrṛtasya bṛhato babhūtha","de":"Denn fürwahr, Agni, wurdest du zum Wagenlenker der guten, tüchtigen, gelingenden Einsicht, der Ordnung, des Großen."},{"n":1779,"sa":"ebhirno arkairbhavā no arvāṅksvā3rṇa jyotiḥ\nagne viśvebhiḥ sumanā anīkaiḥ","de":"Mit diesen Liedern sei uns nahe, ein Licht [wie] das Himmelslicht [svar]; Agni, mit all deinen Flammen wohlgesinnt."}]},{"num":368,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 6","n_from":1780,"n_to":1781,"title_de":"Agni: Bote der Weihehandlungen","note":"","units":[{"n":1780,"sa":"agne vivasvaduṣasaścitraṃ rādho amartya\nā dāśuṣe jātavedo vahā tvamadyā devāṃ uṣarbudhaḥ","de":"Agni, [bringe] den Glanzreichtum der Morgenröten wie Vivasvat [Lichtherr?] [?], du Unsterblicher; dem Spender bringe [ihn] her, Jātavedas; du, bring heute die von Uṣas geweckten Götter."},{"n":1781,"sa":"juṣṭo hi dūto asi havyavāhano 'gne rathīradhvarāṇām\nsajūraśvibhyāmuṣasā suvīryamasme dhehi śravo bṛhat","de":"Denn du bist der geliebte Bote, Träger der Darbringungen, Agni, Wagenlenker der Weihehandlungen; zusammen mit den beiden Aśvin und Uṣas verleihe uns heldenreichen, großen Ruhm."}]},{"num":369,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 7","n_from":1782,"n_to":1784,"title_de":"Rätselvers vom Mond, Kämpfer und Indras Helfern","note":"Rätselhafte Strophen (Śākvara-Stil); Deutung des Anfangs unsicher.","units":[{"n":1782,"sa":"vidhuṃ dadrāṇaṃ samane bahūnāṃ yuvānaṃ santaṃ palito jagāra\ndevasya paśya kāvyaṃ mahitvādyā mamāra sa hyaḥ samāna","de":"Den Mond [?] [Anm.: vidhu = „Mond“ oder „Einsamer, Abgesonderter“], der im Getümmel vieler flattert [?], den jungen, hat der Greis [?] verschlungen. Sieh die Dichterkraft des Gottes in ihrer Größe: Heute ist er gestorben, gestern lebte er noch [?] [Anm.: Textzustand fraglich; sa hyaḥ samāna gedeutet als „er, gestern noch derselbe“]."},{"n":1783,"sa":"śākmanā śāko aruṇaḥ suparṇa ā yo mahaḥ śūraḥ sanādanīḍaḥ\nyacciketa satyamittanna moghaṃ vasu spārhamuta jetota dātā","de":"Mit Kraft ist der Kräftige gekommen, der Rötliche, der Schönbeschwingte [Anm.: suparṇa], der große Held, der von altersher ohne Nest ist. Was er erkannte, ist wahrhaftig und nicht nichtig: ein begehrenswertes Gut; er ist ebenso Sieger wie Geber."},{"n":1784,"sa":"aibhirdade vṛṣṇyā pauṃsyāni yebhiraukṣadvṛtrahatyāya vajrī\nye karmaṇaḥ kriyamāṇasya mahna ṛtekarmamudajāyanta devāḥ","de":"Mit diesen [Kräften] nahm er die Mannestaten der Manneskraft an, mit denen der Keulenträger zur Vritra-Tötung [den Boden] netzte [?]. Die Götter [sind es], die ohne das Werk aus dem Werk, das gewirkt wird, in seiner Größe entstanden [?] [Anm.: Textzustand fraglich]."}]},{"num":370,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 8","n_from":1785,"n_to":1787,"title_de":"Soma-Trank: Marut, Aśvin, Mitra, Aryaman, Varuṇa und Indra","note":"","units":[{"n":1785,"sa":"asti somo ayaṃ sutaḥ pibantyasya marutaḥ\nuta svarājo aśvinā","de":"Da ist der Soma, dieser gepresste; die Maruts trinken von ihm, ebenso die Selbstherrscher, ihr beiden Aśvin."},{"n":1786,"sa":"pibanti mitro aryamā tanā pūtasya varuṇaḥ\ntriṣadhasthasya jāvataḥ","de":"Mitra, Aryaman trinken, durch den Faden geläutert Varuṇa, vom dreifach gelagerten, kräftigen [Soma]."},{"n":1787,"sa":"uto nvasya joṣamā indraḥ sutasya gomataḥ\nprātarhoteva matsati","de":"Und nun möge Indra Gefallen finden am gepressten, milchgemischten [Soma]; wie ein Rufer möge er sich am Morgen berauschen."}]},{"num":371,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 9","n_from":1788,"n_to":1789,"title_de":"Preis der Größe des Sūrya","note":"","units":[{"n":1788,"sa":"baṇmahāṃ asi sūrya baḍāditya mahāṃ asi\nmahaste sato mahimā paniṣtama mahnā deva mahāṃ asi","de":"Wahrlich groß bist du, Sūrya; wahrlich, Āditya, groß bist du. Groß ist deine Größe, du Wahrhafter, ganz preiswürdig; durch Größe, Gott, bist du groß."},{"n":1789,"sa":"baṭ sūrya śravasā mahāṃ asi satrā deva mahāṃ asi\nmahnā devānāmasuryaḥ purohito vibhu jyotiradābhyam","de":"Wahrlich, Sūrya, an Ruhm bist du groß; wahrhaft, Gott, bist du groß. Durch Größe bist du der Götter Herrschergewalt, der Vorangestellte, der Durchdringende, das unbezwingbare Licht."}]},{"num":372,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 10","n_from":1790,"n_to":1792,"title_de":"Indra-Anruf: Komm mit den Falben zum gepressten Soma","note":"","units":[{"n":1790,"sa":"upa no haribhiḥ sutaṃ yāhi madānāṃ pate\nupa no haribhiḥ sutam","de":"Komm zu uns mit den Falben zum gepressten [Soma], Herr der Rauschtränke; komm zu uns mit den Falben zum gepressten."},{"n":1791,"sa":"dvitā yo vṛtrahantamo vida indraḥ śatakratuḥ\nupa no haribhiḥ sutam","de":"Der, der zweifach [?] der beste Vritra-Töter ist, Indra, der Hundertwirker, hat [ihn] gefunden: zu uns mit den Falben zum gepressten [Soma]."},{"n":1792,"sa":"tvaṃ hi vṛtrahanneṣāṃ pātā somānāmasi\nupa no haribhiḥ sutam","de":"Denn du, Vritra-Töter, bist der Trinker dieser Somas: zu uns mit den Falben zum gepressten [Soma]."}]},{"num":373,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 11","n_from":1793,"n_to":1795,"title_de":"Indra-Preis: Gebet der Seher für den Großen","note":"","units":[{"n":1793,"sa":"pra vo mahe mahevṛdhe bharadhvaṃ pracetase pra sumatiṃ kṛṇudhvam\nviśaḥ pūrvīḥ pra cara carṣaṇiprāḥ","de":"Bringt dar für euren Großen, Großmachenden, Einsichtigen; erwirkt [seine] Gunst. Ziehe voran vor den vielen Stämmen, du, der die Menschen erfüllt [?]."},{"n":1794,"sa":"uruvyacase mahine suvṛktimindrāya brahma janayanta viprāḥ\ntasya vratāni na minanti dhīrāḥ","de":"Für Indra, den Weitblickenden, Großen, erzeugten die Seher ein wohlgefügtes Gebet. Seine Gebote missachten die Weisen nicht."},{"n":1795,"sa":"indraṃ vāṇīranuttamanyumeva satrā rājānaṃ dadhire sahadhyai\nharyaśvāya barhayā samāpīn","de":"Indra, dessen Zorn unübertroffen ist, setzten die Rufe wie einen König ein, um [Feinde] zu überwinden; für den Falbenlenker [ziehe ich] die Grasstreu [?], die Freunde [?] [Anm.: barhayā samāpīn – Textzustand fraglich]."}]},{"num":374,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 12","n_from":1796,"n_to":1797,"title_de":"Indra-Wunsch: Wäre ich wie du an Macht","note":"","units":[{"n":1796,"sa":"yadindra yāvatastvametāvadahamīśīya\nstotāramiddadhiṣe radāvaso na pāpatvāya raṃsiṣam","de":"Wenn ich, Indra, so wie du Herr wäre, [so viel] wie du [bist], dann würde ich den Sänger stützen, du Gütergeber, und nicht zum Bösen würde ich ihn dahingeben [?]."},{"n":1797,"sa":"śikṣeyaminmahayate divedive rāya ā kuhacidvide\nna hi tvadanyanmaghavanna āpyaṃ vasyo asti pitā ca na","de":"Ich möchte dem, der [dich] verehrt, Tag für Tag helfen, [dass] Reichtum irgendwo zu finden sei. Denn außer dir, Maghavan, gibt es für uns keinen Verwandten, der besser wäre, noch einen Vater."}]},{"num":375,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 13","n_from":1798,"n_to":1800,"title_de":"Indra: Erhöre den Seher und bleibe ihm nah","note":"","units":[{"n":1798,"sa":"śrudhī havaṃ vipipānasyādrerbodhā viprasyārcato manīṣām\nkṛṣvā duvāṃsyantamā sacemā","de":"Höre den Ruf des Somatrinkers [?] [Anm.: vipipānasya – Deutung unsicher], des Felsens, achte auf das Sinnen des verehrenden Sehers. Nimm die Ehrerbietungen an; wir mögen dir ganz nahe kommen."},{"n":1799,"sa":"na te giro api mṛṣye turasya na suṣṭutimasuryasya vidvān\nsadā te nāma svayaśo vivakmi","de":"Ich vergesse [Anm.: mṛṣ = „vergessen“, auch „dulden“] deine Lieder nicht, des Raschen, und nicht die Lobrede auf den Herrlichen [Anm.: asuryasya = „den Herrn/Asura-haften“], da ich [sie] kenne. Stets rufe ich deinen Namen, den selbstberühmten."},{"n":1800,"sa":"bhūri hi te savanā mānuṣeṣu bhūri manīṣī havate tvāmit\nmāre asmanmaghavañjyokkaḥ","de":"Viele sind deine Pressungen bei den Menschen; viele Denker rufen dich an. Nicht fern von uns, Maghavan, [möge] dein Lebensweg [?] [sein]."}]},{"num":376,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 14","n_from":1801,"n_to":1803,"title_de":"Indra-Vritra-Töter: Spannt die Bogen – Feindesbogensehnen mögen brechen","note":"Refrain: „nabhantām anyakeṣāṃ jyākā adhi dhanvasu“.","units":[{"n":1801,"sa":"pro ṣvasmai purorathamindrāya śūṣamarcata\nabhīke cidu lokakṛtsaṅge samatsu vṛtraha\nasmākaṃ bodhi coditā nabhantāmanyakeṣāṃ jyākā adhi dhanvasu","de":"Preist diesem Indra nun den Wagen voran, den Kraft [Preis] verdient. In der Nähe [und] im Kampf, der Raum schafft, der Vritra-Töter, sei unser Antreiber in den Schlachten. Zerbrechen sollen die Bogensehnen der anderen [Anm.: nabhantām – „zerbersten, zerreißen“ [?]] auf den Bogen."},{"n":1802,"sa":"tvaṃ sindhūṃravāsṛjo 'dharāco ahannahim\naśatrurindra jajñiṣe viśvaṃ puṣyasi vāryam\ntaṃ tvā pari ṣvajāmahe nabhantāmanyakeṣāṃ jyākā adhi dhanvasu","de":"Du hast die Ströme hinabgelassen, hast die Schlange niedergeschlagen. Ohne Feind wurdest du geboren, Indra; du nährst alles Erwünschte. Dich umarmen wir. Zerbrechen sollen die Bogensehnen der anderen auf den Bogen."},{"n":1803,"sa":"vi ṣu viśvā arātayo 'ryo naśanta no dhiyaḥ\nastāsi śatrave vadhaṃ yo na indra jighāṃsati\nyā te rātirdadivasu nabhantāmanyakeṣāṃ jyākā adhi dhanvasu","de":"Fort mit allen Missgunstgesinnungen [?]; die Gedanken des Feindes [?] mögen uns vergehen. Du bist der Schleuderer der Waffe gegen den Feind, der uns töten will, Indra. Deine Gabe, Gütergeber, [gelte uns]. Zerbrechen sollen die Bogensehnen der anderen auf den Bogen.","notes":"Refrain gleichlautend; Verständnis von nabhantām und ary-Formen unsicher."}]},{"num":377,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 15","n_from":1804,"n_to":1806,"title_de":"Indra: Reich sei der Sänger, gib uns nicht dem Feind hin","note":"","units":[{"n":1804,"sa":"revāṃ idrevata stotā syāttvāvato maghonaḥ\npredu harivaḥ sutasya","de":"Reich, Indra, möge der Sänger eines Reichen wie du sein, Maghavan. Auf zu [uns], Falbenlenker, zum gepressten [Soma]."},{"n":1805,"sa":"ukthaṃ ca na śasyamānaṃ nāgo rayirā ciketa\nna gāyatraṃ gīyamānam","de":"Weder das Preislied, das gesprochen wird, [noch] der Reichtum [?] hat Beachtung gefunden [?]; nicht das Gāyatra, das gesungen wird [?] [Anm.: Wortlaut verderbt; nāgo rayirā unklar]."},{"n":1806,"sa":"mā na indra pīyatnave mā śardhate parā dāḥ\nśikṣā śacīvaḥ śacībhiḥ","de":"Gib uns nicht, Indra, dem Schmäher hin, nicht dem Trotzigen. Hilf mit deinen Kräften, Kraftreicher."}]},{"num":378,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 16","n_from":1807,"n_to":1809,"title_de":"Indra: Komm mit den Falben – Ruf zum Himmel des Herrschers","note":"","units":[{"n":1807,"sa":"endra yāhi haribhirupa kaṇvasya suṣṭutim\ndivo amuṣya śāsato divaṃ yaya divāvaso","de":"Komm her, Indra, mit den Falben zu Kaṇvas Lobpreis. Zum Himmel jenes Herrschers, zum Himmel geh, du Himmelsgütiger [Anm.: divāvaso – „Tagesgut“ oder „Himmelsgut“]."},{"n":1808,"sa":"atrā vi nemireṣāmurāṃ na dhūnute vṛkaḥ\ndivo amuṣya śāsato divaṃ yaya divāvaso","de":"Hier schüttelt der Wolf die Ränder [?] dieser [Umgebung] aus wie die Wolle [?] [Anm.: Textzustand fraglich]. Zum Himmel jenes Herrschers, zum Himmel geh, Himmelsgütiger."},{"n":1809,"sa":"ā tvā grāvā vadanīha somī ghoṣeṇa vakṣatu\ndivo amuṣya śāsato divaṃ yaya divāvaso","de":"Zu dir soll der somahaltige Pressstein mit Geschrei hertönen und dich herfahren. Zum Himmel jenes Herrschers, zum Himmel geh, Himmelsgütiger."}]},{"num":379,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 17","n_from":1810,"n_to":1812,"title_de":"Soma Pavamāna: Fließe berauschend für Indra","note":"","units":[{"n":1810,"sa":"pavasva soma mandayannindrāya madhumattamaḥ","de":"Läutere dich, Soma, berauschend, honigsüßester, für Indra."},{"n":1811,"sa":"te sutāso vipaścitaḥ śukrā vāyumasṛkṣata","de":"Diese gepressten, der Weisen, hellen [Säfte] ließ man zu Vāyu strömen."},{"n":1812,"sa":"asṛgraṃ devavītaye vājayanto rathā iva","de":"Losgelassen wurden sie zur Götterspeise, wie Wagen, die Siegespreis wollen."}]},{"num":380,"loc":"Prapāṭhaka IX, Ardha 1, Gruppe 18","n_from":1813,"n_to":1815,"title_de":"Agni: Rufer, Sohn der Kraft, Jātavedas","note":"","units":[{"n":1813,"sa":"agniṃ hotāraṃ manye dāsvantaṃ vasoḥ sūnuṃ sahaso jātavedasaṃ vipraṃ na jātavedasam\nya ūrdhvaro svadhvaro devo devācyā kṛpā\nghṛtasya vibhrāṣṭimanu śukraśociṣa ājuhvānasya sarpiṣaḥ","de":"Agni rufe ich als Rufer an, den Gabenreichen, den Sohn der Kraft, den Jātavedas, wie einen Seher den Jātaveda; der hoch aufragt, wohlgeweiht ist, der Gott, mit göttergerichteter Gnade; dem Glanz der Butter nach, den hell Leuchtenden, dem mit Schmalz Begossenen."},{"n":1814,"sa":"yajiṣṭhaṃ tvā yajamānā huvema jyeṣṭhamaṅgirasāṃ vipra manmabhirviprebhiḥ śukramanmabhiḥ\nparijmānamiva dyāṃ hotāraṃ carṣaṇīnām\nśociṣkeśaṃ vṛṣaṇaṃ yamimā viśaḥ prāvantu jūtaye viśaḥ","de":"Dich, den Verehrungswürdigsten, rufen wir Opfernden an, den Ältesten der Aṅgiras, o Seher, mit Gedanken, mit hellen Gedanken der Seher; wie den Himmel umschweifend, den Rufer der Völker. Den Flammenhaarigen, Stier, den diese Stämme zum Beistand fördern mögen."},{"n":1815,"sa":"sa hi purū cidojasā virukmatā dīdyāno bhavati druhantaraḥ paraśurna druhantaraḥ\nvīḍu cidyasya samṛtau śruvadvaneva yatsthiram\nniṣṣahamāṇo yamate nāyate dhanvāsahā nāyate","de":"Der ist es, der auch von vielen mit kräftigem Leuchten strahlend wird, den Trug überwindend, wie eine Axt den Trug überwindend. Auch das Feste bricht in seinem Zusammenstoß, wie in Wäldern; überwältigend hält er, geht nicht [verloren]; die Bogen bezwingend geht er nicht verloren [?] [Anm.: Textzustand fraglich]."}]},{"num":381,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 1","n_from":1816,"n_to":1821,"title_de":"Agni: Dein Ruhm, dein Glanz, dein Licht","note":"","units":[{"n":1816,"sa":"agne tava śravo vayo mahi bhrājante arcayo vibhāvaso\nbṛhadbhāno śavasā vājamukthya3ṃ dadhāsi dāśuṣe kave","de":"Agni, dein Ruhm und deine Lebenskraft sind groß; es strahlen deine Strahlen, du Lichtreicher. Großglänzender, du verleihst mit Kraft Siegespreis, der zu preisen ist, dem Darbringer, Seher."},{"n":1817,"sa":"pāvakavarcāḥ śukravarcā anūnavarcā udiyarṣi bhānunā\nputro mātarā vicarannupāvasi pṛṇakṣi rodasī ubhe","de":"Mit reinem Glanz, mit hellem Glanz, mit vollem Glanz erhebst du dich mit deinem Licht. Als Sohn zwischen den Müttern wandelnd, hilfst du und erfüllst beide Welten."},{"n":1818,"sa":"ūrjo napājjātavedaḥ suśastibhirmandasva dhītibhirhitaḥ\ntve iṣaḥ saṃ dadhurbhūrivarpasaścitrotayo vāmajātāḥ","de":"Enkel der Kraft, Jātavedas, an den guten Lobpreisungen freue dich, durch Gebete [dir] zugewandt. In dir vereinen sich Stärkungen, [du] vielgestaltiger; die wunderbar Helfenden wurden [dir] zum Schönen geboren [?] [Anm.: Textzustand fraglich]."},{"n":1819,"sa":"irajyannagne prathayasva jantubhirasme rāyo amartya\nsa darśatasya vapuṣo vi rājasi pṛṇakṣi darśataṃ kratum","de":"Du regst dich, Agni; breite dich aus mit den Geschöpfen. Uns [gib] Reichtümer, Unsterblicher. Du strahlst mit sehenswertem Leib; du erfüllst die sehenswerte Einsicht."},{"n":1820,"sa":"iṣkarttāramadhvarasya pracetasaṃ kṣayantaṃ rādhaso mahaḥ\nrātiṃ vāmasya subhagāṃ mahīmiṣaṃ dadhāsi sānasiṃ rayim","de":"[Dich], den Bereiter der Weihehandlung, den Einsichtigen, der großen Gabe Herrn [?], [Anm.: kṣayantam rādhasaḥ mahaḥ], die Gabe des Begehrenswerten, die glückliche große Stärkung, verleihst du: gewinnbringenden Reichtum."},{"n":1821,"sa":"ṛtāvānaṃ mahiṣaṃ viśvadarśatamagniṃ sumnāya dadhire puro janāḥ\nśrutkarṇaṃ saprathastamaṃ tvā girā daivyaṃ mānuṣā yugā","de":"Den Wahrhaftigen, den Großen, den Allsichtbaren, den Agni setzten die Menschen um des Wohlwollens willen an die Spitze; den mit hörendem Ohr, den Weitesten, dich mit dem Lied, den Göttlichen, die Menschen in den Zeitaltern."}]},{"num":382,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 2","n_from":1822,"n_to":1823,"title_de":"Agni: Wer mit deiner Hilfe hinüberkommt; deine Glut","note":"","units":[{"n":1822,"sa":"pra so agne tavotibhiḥ suvirābhistarati vājakarmabhiḥ\nyasya tvaṃ sakhyamāvitha","de":"Der kommt hinüber, Agni, mit deinen Hilfen, mit heldenreichen, siegespreis-wirkenden, dessen Freundschaft du bewahrt hast."},{"n":1823,"sa":"tava drapso nīlavānvāśa ṛtviya indhānaḥ siṣṇavā dade\ntvaṃ mahīnāmuṣasāmasi priyaḥ kṣapo vastuṣu rājasi","de":"Dein Funke, der dunkelfarbige [?], gehört zur rechten Zeit, entflammt nimmt er das Fließende [?] auf [Anm.: Textzustand fraglich; siṣṇavā unklar]. Du bist der Lieben der großen Morgenröten Liebling; in den Nächten und Morgen strahlst du."}]},{"num":383,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 3","n_from":1824,"n_to":1824,"title_de":"Agni als Frucht der Pflanzen und Wasser","note":"","units":[{"n":1824,"sa":"tamoṣadhīrdadhire garbhamṛtviyaṃ tamāpo agniṃ janayanta mātaraḥ\ntamitsamānaṃ vaninaśca vīrudho 'ntarvatīśca suvate ca viśvahā","de":"Ihn nahmen die Pflanzen als jahreszeitliche Leibesfrucht auf; ihn erzeugten die Wasser, die Mütter, als Agni. Ihn, der von gleicher Art ist, gebären die Bäume und Kräuter, die trächtigen, jeden Tag."}]},{"num":384,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 4","n_from":1825,"n_to":1825,"title_de":"Agni-Soma: Hell für Indra läutert er sich","note":"","units":[{"n":1825,"sa":"agnirindrāya pavate divi śukro vi rājati\nmahiṣīva vi jāyate","de":"Agni läutert sich für Indra; im Himmel strahlt er hell; wie eine Große [Kuh] wird er geboren."}]},{"num":385,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 5","n_from":1826,"n_to":1826,"title_de":"Wer wacht: die Ṛc, die Sāman und Soma","note":"","units":[{"n":1826,"sa":"yo jāgāra tamṛcaḥ kāmayante yo jāgāra tamu sāmāni yanti\nyo jāgāra tamayaṃ soma āha tavāhamasmi sakhye nyokāḥ","de":"Wer wacht, den begehren die Ṛc-Verse; wer wacht, zu dem gehen die Sāmans. Wer wacht, zu dem spricht dieser Soma: „Dein bin ich, in deiner Freundschaft habe ich meine Wohnung.“"}]},{"num":386,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 6","n_from":1827,"n_to":1827,"title_de":"Agni wacht: Ṛc, Sāman und Soma","note":"","units":[{"n":1827,"sa":"agnirjāgāra tamṛcaḥ kāmayantegnirjāgāra tamu sāmāni yanti\nagnirjāgāra tamayaṃ soma āha tavāhamasmi sakhye nyokāḥ","de":"Agni wacht; ihn begehren die Ṛc-Verse; Agni wacht; zu ihm gehen die Sāmans. Agni wacht; zu ihm spricht dieser Soma: „Dein bin ich, in deiner Freundschaft habe ich meine Wohnung.“"}]},{"num":387,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 7","n_from":1828,"n_to":1830,"title_de":"Verehrung der Freunde; die hundertfüßige Rede","note":"","units":[{"n":1828,"sa":"namaḥ sakhibhyaḥ pūrvasadbhyo namaḥ sākanniṣebhyaḥ\nyuñje vācaṃ śatapadīm","de":"Verehrung den Freunden, die vorher [hier] saßen; Verehrung den Gleichzeitigen [?] und Zeitgenossen [Anm.: sākaṃniṣebhyaḥ]. Ich spanne die hundertfüßige Rede an."},{"n":1829,"sa":"yuñje vācaṃ śatapadīṃ gāye sahasravarttani\ngāyatraṃ traiṣṭubhaṃ jagat","de":"Ich spanne die hundertfüßige Rede an; ich singe auf tausendfacher Bahn Gāyatra, Triṣṭubh, Jagatī."},{"n":1830,"sa":"gāyatraṃ traiṣṭubhaṃ jagadviśvā rūpāṇi sambhṛtā\ndevā okāṃsi cakrire","de":"Gāyatra, Triṣṭubh, Jagatī, alle Gestalten, zusammengetragen; die Götter machten [sie] zu ihren Wohnstätten."}]},{"num":388,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 8","n_from":1831,"n_to":1833,"title_de":"Agni, Indra, Sūrya als Licht; Bitte um Rückkehr mit Kraft","note":"","units":[{"n":1831,"sa":"agnirjyotirjyotiragnirindro jyotirjyotirindraḥ\nsūryo jyotirjyotiḥ sūryaḥ","de":"Agni ist Licht, Licht ist Agni; Indra ist Licht, Licht ist Indra; Sūrya ist Licht, Licht ist Sūrya."},{"n":1832,"sa":"punarūrjā ni varttasva punaragna iṣāyuṣā\npunarnaḥ pāhyaṃhasaḥ","de":"Wende dich wieder zurück mit Kraft, wieder, Agni, mit Nahrung und Leben; wieder behüte uns vor Bedrängnis."},{"n":1833,"sa":"saha rayyā ni vartasvāgne pinvasva dhārayā\nviśvapsnyā viśvataspari","de":"Wende dich zurück mit Reichtum, Agni; schwelle an mit [deinem] Strom, dem allnährenden, ringsum von allen Seiten."}]},{"num":389,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 9","n_from":1834,"n_to":1836,"title_de":"Indra: Wäre ich Herr allein über Güter; Kuh des Sängers","note":"","units":[{"n":1834,"sa":"yadindrāhaṃ yathā tvamīśīya vasva eka it\nstotā me gosakhā syāt","de":"Wenn ich, Indra, so wie du, Herr über Güter wäre, allein, dann würde mein Sänger Kuhfreund sein."},{"n":1835,"sa":"śikṣeyamasmai ditseyaṃ śacīpate manīṣiṇe\nyadahaṃ gopatiḥ syām","de":"Ich möchte ihm helfen, ich möchte ihm geben, Herr der Kraft, dem Weisen, wenn ich Herr der Kühe wäre."},{"n":1836,"sa":"dhenuṣṭa indra sūnṛtā yajamānāya sunvate\ngāmaśvaṃ pipyuṣī duhe","de":"Deine Kuh, Indra, [ist] die gütige [Rede?] [Anm.: sūnṛtā – „Freundliches, Wahrheitsgemäßes“; oft „Kuh“ der Rede]; dem Opfernden, der presst, melkt sie voll Fülle Kuh und Ross."}]},{"num":390,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 10","n_from":1837,"n_to":1839,"title_de":"Gewässer: Ihr Heilsamen, gebt uns Kraft","note":"","units":[{"n":1837,"sa":"āpo hi ṣṭhā mayobhuvastā na ūrje dadhātana\nmahe raṇāya cakṣase","de":"Ihr Wasser, denn ihr seid Wohltuende; ihr [seid] es, die uns Kraft verleihen mögen, zu großer Freude, zum Sehen."},{"n":1838,"sa":"yo vaḥ śivatamo rasastasya bhājayateha naḥ\nuśatīriva mātaraḥ","de":"Den heilsamsten Saft, den ihr habt, lasst uns hier daran teilhaben, wie sehnsüchtige Mütter."},{"n":1839,"sa":"tasmā araṃ gamāma vo yasya kṣayāya jinvatha\nāpo janayathā ca naḥ","de":"Zu dem gehen wir gern zu euch, zu dessen Wohnsitz ihr Belebung bringt; Wasser, und ihr sollt uns erzeugen."}]},{"num":391,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 11","n_from":1840,"n_to":1842,"title_de":"Vāta: Heilmittel und Leben","note":"","units":[{"n":1840,"sa":"vāta ā vātu beṣajaṃ śambhu mayobhu no hṛde\npra na ayūṃṣi tāriṣat","de":"Vāta, wehe uns das Heilmittel her, das Wohltuende, Labende für unser Herz; er soll unsere Lebensjahre verlängern."},{"n":1841,"sa":"uta vāta pitāsi na uta bhrātota naḥ sakhā\nsa no jīvātave kṛdhi","de":"Und, Vāta, du bist unser Vater, und unser Bruder und unser Freund; so mache uns zum Leben."},{"n":1842,"sa":"yadado vāta te gṛhe3 'mṛtaṃ nihitaṃ guhā\ntasyo no dehi jīvase","de":"Was da, Vāta, in deinem Hause an Unsterblichem in der Höhle niedergelegt ist, davon gib uns, damit wir leben."}]},{"num":392,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 12","n_from":1843,"n_to":1845,"title_de":"Der Sonnenvogel: vielgestaltige Kraft, Sūryas Licht","note":"","units":[{"n":1843,"sa":"abhi vājī viśvarūpo janitraṃ hiraṇyayaṃ bibhradatkaṃ suparṇaḥ\nsūryasya bhānumṛtuthā vasānaḥ pari svayaṃ medhamṛjro jajāna","de":"Der Siegreiche, Vielgestaltige, der goldene Gefäß [?] trägt, der Schönbeschwingte, kam auf [seine] Geburtsstätte zu; Sūryas Licht zu den Zeiten anlegend, hat der Glänzende sich selbst die Weihe [?] [Anm.: medham – „Weihehandlung/Opfergabe“] erzeugt."},{"n":1844,"sa":"apsu retaḥ śiśriye viśvarūpaṃ tejaḥ pṛthivyāmadhi yatsambabhūva\nantarikṣe svaṃ mahimānaṃ mimānaḥ kanikranti vṛṣṇo aśvasya retaḥ","de":"In den Wassern liegt der Same, vielgestaltig, die Glut, die auf der Erde entstanden ist. Im Luftraum seine Größe ausmessend, brüllt er den Samen des Stieres, des Rosses."},{"n":1845,"sa":"ayaṃ sahasrā pari yuktā vasānaḥ sūryasya bhānuṃ yajño dādhāra\nsahasradāḥ śatadā bhūridāvā dharttā divo bhuvanasya viśpatiḥ","de":"Dieser, tausend Bande [?] umlegend, hat Sūryas Licht als Weihehandlung getragen; tausendfach Gebender, hundertfach Gebender, Vielgebender, Träger des Himmels, Herr der Wesen [?]."}]},{"num":393,"loc":"Prapāṭhaka IX, Ardha 2, Gruppe 13","n_from":1846,"n_to":1848,"title_de":"Vogel im Himmel: Gandharva und Drapsa","note":"","units":[{"n":1846,"sa":"nāke suparṇamupa yatpatantaṃ hṛdā venanto abhyacakṣata tvā\nhiraṇyapakṣaṃ varuṇasya dūtaṃ yamasya yonau śakunaṃ bhuraṇyum","de":"Als du im Himmel als Schönbeschwingter aufwärtsflogst, sahen sie dich mit dem Herzen begehrend an: den goldflügeligen Boten des Varuṇa, den Vogel im Schoß des Yama, den Eifrigen."},{"n":1847,"sa":"ūrdhvo gandharvo adhi nāke asthātpratyañcitrā bibhradasyāyudhāni\nvasāno atkaṃ surabhiṃ dṛśe kaṃ sva3rṇa nāma janata priyāṇi","de":"Aufrecht stand der Gandharva im Himmel; er trägt gegenüber [?] seine bunten Waffen. Ein wohlriechendes Gewand tragend, zum Sehen, erschuf er, der „Sonnengleiche“, liebe Namen [?] [Anm.: sva3rṇa – Textzustand fraglich]."},{"n":1848,"sa":"drapsaḥ samudramabhi yajjigāti paśyangṛdhrasya cakṣasā vidharman\nbhānuḥ śukreṇa śociṣā cakānastṛtīye cakre rajasi priyāṇi","de":"Der Tropfen, wenn er zum Meer geht, sehend mit dem Auge des Geiers [?] im Entfalten [?], das Licht mit hellem Glanz erstrebend, [erschafft] im dritten Rad, im Raum, liebe [Dinge]."}]},{"num":394,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 1","n_from":1849,"n_to":1851,"title_de":"Indra, der Siegreiche im Kampf","note":"","units":[{"n":1849,"sa":"āśuḥ śiśāno vṛṣabho na bhīmo ghanāghanaḥ kṣobhaṇaścarṣaṇīnām\nsaṅkrandano 'nimiṣa ekavīraḥ śataṃ senā ajayatsākamindraḥ","de":"Der Schnelle, der [seine Waffen] schärft, dem Stier gleich furchtbar, immer wieder Schlagende, Erschütterer der Völker; der Brüllende, Unblinzelnde, der eine Held: hundert Heere besiegte Indra auf einmal."},{"n":1850,"sa":"saṅkrandanenānimiṣeṇa jiṣṇunā yutkāreṇa duścyavanena dhṛṣṇunā\ntadindreṇa jayata tatsahadhvaṃ yudho nara iṣuhastena vṛṣṇā","de":"Mit dem Brüller, dem Unblinzelnden, Siegreichen, dem Kampfrufer, dem schwer Wankenden, dem Kühnen: mit Indra siegt, das erträgt, ihr Männer, [mit dem] Pfeile in der Hand, dem Stier."},{"n":1851,"sa":"sa iṣuhastaiḥ sa niṣaṅgibhirvaśī saṃsraṣṭā sa yudha indro gaṇena\nsaṃ sṛṣṭajitsomapā bāhuśardhyū3gradhanvā pratihitābhirastā","de":"Er mit den Pfeilhändigen, er mit den Köchertragenden, der Gebietende, Kampfgesell, Indra mit der Schar; der Vereinter-Sieger, der Somatrinker, armstark [?], mit gewaltigem Bogen, der Schütze mit den gespannten [Pfeilen] [Anm.: bāhuśardhyū3 – Textzustand fraglich]."}]},{"num":395,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 2","n_from":1852,"n_to":1854,"title_de":"Bṛhaspati und Indra im Kampf: Wagen und Sieg","note":"","units":[{"n":1852,"sa":"bṛhaspate pari dīyā rathena rakṣohāmitrāṃ apabādhamānaḥ\nprabhañjansenāḥ pramṛṇo yudhā jayannasmākamedhyavitā rathānām","de":"Bṛhaspati, fahre ringsum mit dem Wagen, die Unholde und Feinde wegstoßend; Heere zerbrechend, im Kampf zermalmend, siegend, sei unserer Wagen Beschützer."},{"n":1853,"sa":"balavijñāyaḥ sthaviraḥ pravīraḥ sahasvānvājī sahamāna ugraḥ\nabhivīro abhisatvā sahojā jaitramindra rathamā tiṣṭha govit","de":"Der Kraftkenner, der Alte, Vorkämpfer, der Kräftige, Siegesbeute-Bringer, der Überwältigende, Grimmige, der die Feinde bedrängende Held, der Streiter, kraftgeboren: Besteige, Indra, den siegreichen Wagen, du Rinderfinder."},{"n":1854,"sa":"gotrabhidaṃ govidaṃ vajrabāhuṃ jayantamajma pramṛṇantamojasā\nimaṃ sajātā anu vīrayadhvamindraṃ sakhāyo anu saṃ rabhadhvam","de":"Den Gehöftspalter, Rinderfinder, den Keulenarmigen, den Siegenden, Schlachtfeld-Zerschmetterer mit Kraft: Diesem Indra, ihr Gleichgeborenen, folgt tapfer, ihr Freunde; schließt euch ihm an."}]},{"num":396,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 3","n_from":1855,"n_to":1857,"title_de":"Indra, Bṛhaspati, Soma, Maruts: Das Heer der Götter siegt","note":"","units":[{"n":1855,"sa":"abhi gotrāṇi sahasā gāhamāno 'dayo vīraḥ śatamanyurindraḥ\nduścyavanaḥ pṛtanāṣāḍayudhyo3 'smākaṃ senā avatu pra yutsu","de":"Die Gehöfte mit Kraft durchdringend, der unerschrockene Held, der Hundert-Zorn-Indra, der schwer Wankende, im Kampf Übermächtige, nicht Bekämpfbare: Unser Heer möge in den Schlachten voran helfen."},{"n":1856,"sa":"indra āsāṃ netā bṛhaspatirdakṣiṇā yajñaḥ pura etu somaḥ\ndevasenānāmabhibhañjatīnāṃ jayantīnāṃ maruto yantvagram","de":"Indra ist der Führer dieser [Heere]; Bṛhaspati, der Lohn, die Weihehandlung, Soma sollen vorangehen. Der götterhaften Heere, die zerbrechen und siegen, voran sollen die Maruts gehen."},{"n":1857,"sa":"indrasya vṛṣṇo varuṇasya rājña ādityānāṃ marutāṃ śardha ugram\nmahāmanasāṃ bhuvanacyavānāṃ ghoṣo devānāṃ jayatāmudasthāt","de":"Des Indra, des Stieres, des Königs Varuṇa, der Āditya, der Maruts furchtbare Schar, der Hochgesinnten, die die Wesen erschüttern: Der Schall der siegenden Götter ist aufgestiegen."}]},{"num":397,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 4","n_from":1858,"n_to":1860,"title_de":"Indra: Erhebe die Waffen, unser Heer siege","note":"","units":[{"n":1858,"sa":"uddharṣaya maghavannāyudhānyutsatvanāṃ māmakānāṃ manāṃsi\nudvṛtrahanvājināṃ vājinānyudrathānāṃ jayatāṃ yantu ghoṣāḥ","de":"Erwecke, Maghavan, die Waffen, und die Gemüter unserer [Männer], der Standhaften. Erhebe, Vritra-Töter, der Siegreichen Rosse; der Sieger Wagen-Rufe sollen sich erheben."},{"n":1859,"sa":"asmākamindraḥ samṛteṣu dhvajeṣvasmākaṃ yā iṣavastā jayantu\nasmākaṃ vīrā uttare bhavantvasmāṃ u devā avatā haveṣu","de":"Unsere Feldzeichen, Indra, in den Zusammenstößen [seien]; unsere Pfeile, die sollen siegen. Unsere Helden sollen die Oberen sein; und uns, ihr Götter, helft in den Rufen."},{"n":1860,"sa":"asau yā senā marutaḥ pareṣāmabhyeti na ojasā spardhamānā\ntāṃ gūhata tamasāpavratena yathaiteṣāmanyo anyaṃ na jānāt","de":"Jenes Heer der Feinde, Maruts, das da [kommt], zieht nicht mit Kraft wetteifernd heran: Verbergt es in Finsternis, die kein Gebot [?] kennt, sodass von ihnen keiner den anderen kennt."}]},{"num":398,"loc":"Prapāṭhaka IX, Ardha 3, Gruppe 5","n_from":1861,"n_to":1863,"title_de":"Verzauberung des Feindes: Fort, gegnerische Heere","note":"","units":[{"n":1861,"sa":"amīṣāṃ cittaṃ pratilobhayantī gṛhāṇāṅgānyapve parehi\nabhi prehi nirdaha hṛtsu śokairandhenāmitrāstamasā sacantām","de":"Der Feinde Sinn verlockend, [du] Glieder der Häuser [?], hinweg, Apvā [Anm.: Unheilsgöttin/Krankheit]! Geh voran, verbrenne in den Herzen mit Kummer; die Feinde sollen mit blinder Finsternis vereint sein."},{"n":1862,"sa":"pretā jayatā nara indro vaḥ śarma yacchatu\nugrā vaḥ santu bāhavo 'nādhṛṣyā yathāsatha","de":"Zieht vor, siegt, ihr Männer; Indra soll euch Schutz gewähren. Furchtbar sollen eure Arme sein, unbezwingbar, wie ihr sein sollt."},{"n":1863,"sa":"avasṛṣṭā parā pata śaravye brahmasaṃśite\ngacchāmitrānpra padyasva māmīṣāṃ kaṃ ca nocchiṣaḥ","de":"Losgelassen, fliege fort, Pfe
