de":"Wenn du, Indra, beide Welten erfüllt hast wie die Morgenröte, [dich] den Großen unter den Großen, den Allherrscher der Völker: die göttliche Gebärerin gebar [dich], die segensreiche Gebärerin gebar [dich]."},{"n":1091,"sa":"dīrghaṃ hyaṅkuśaṃ yathā śaktiṃ bibharṣi mantumaḥ\npūrveṇa maghavanpadā vayāmajo yathā yamaḥ\ndevī janitryajījanadbhadrā janitryajījanat","de":"Lang wie ein Haken trägst du [deine] Macht, Sinnenreicher; mit dem ersten Schritt, Maghavan, [treibst du] uns wie den Ziegenbock des Yama [Anm.: vayām ajo yathā yamaḥ, Sinn unsicher] [?]; die göttliche Gebärerin gebar [dich], die segensreiche Gebärerin gebar [dich].","notes":"Textzustand fraglich."},{"n":1092,"sa":"ava sma durhṛṇāyato marttasya tanuhi sthiram\nadhaspadaṃ tamīṃ kṛdhi yo asmāṃ abhidāsati\ndevī janitryajījanadbhadrā janitryajījanat","de":"Zieh herab, dass er fest sei [?], den Sterblichen, der Böses im Sinn hat; mach ihn zu einem, der unten steht, wer uns anfeindet; die göttliche Gebärerin gebar [dich], die segensreiche Gebärerin gebar [dich]."}]},{"num":145,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 17","n_from":1093,"n_to":1095,"title_de":"Soma: in allen Räuschen bist du der Allgeber","note":"Kehrvers: „In den Räuschen bist du Allgeber“.","units":[{"n":1093,"sa":"pari svāno giriṣṭhāḥ pavitre somo akṣarat\nmadeṣu sarvadhā asi","de":"Rings hat der auf dem Berg stehende, tönende Soma im Schafhaarsieb geströmt; in den Räuschen bist du der Allgeber."},{"n":1094,"sa":"tvaṃ viprastvaṃ kavirmadhu pra jātamandhasaḥ\nmadeṣu sarvadhā asi","de":"Du [bist] der Seher, du der Dichter, der Honig des geborenen Krautes; in den Räuschen bist du der Allgeber."},{"n":1095,"sa":"tve viśve sajoṣaso devāsaḥ pītimāśata\nmadeṣu sarvadhā asi","de":"In dir haben alle einmütigen Götter den Trunk erlangt; in den Räuschen bist du der Allgeber."}]},{"num":146,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 18","n_from":1096,"n_to":1097,"title_de":"Soma, der Herr der Güter; Bitte an Mitra und Varuṇa","note":"","units":[{"n":1096,"sa":"sa sunve yo vasūnāṃ yo rāyāmānetā ya iḍānām\nsomo yaḥ sukṣitīnām","de":"Er wird gepresst, der [Herr] der Güter, der Führer zu Reichtümern, zu Stärkungen, der Soma der Wohnbegüterten."},{"n":1097,"sa":"yasya ta indraḥ pibādyasya maruto yasya vāryamaṇā bhagaḥ\nā yena mitrāvaruṇā karāmaha endramavase mahe","de":"Dessen Indra trinken soll, dessen die Maruts, dessen Aryaman und Bhaga, durch den wir Mitra und Varuṇa herbeirufen: zu Indra [wenden wir uns] um große Hilfe.","notes":"Textzustand fraglich (pibāt/vāryamaṇā)."}]},{"num":147,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 19","n_from":1098,"n_to":1100,"title_de":"Soma Pavamāna: Freunde, singt dem Klärenden","note":"","units":[{"n":1098,"sa":"taṃ vaḥ sakhāyo madāya punānamabhi gāyata\nśiśuṃ na havyaiḥ svadayanta gūrtibhiḥ","de":"Diesen euch, Freunde, den sich klärenden, singt zur Berauschung an; wie ein Kind laben sie ihn mit Darbringungen, mit Lobreden."},{"n":1099,"sa":"saṃ vatsa iva mātṛbhirindurhinvāno ajyate\ndevāvīrmado matibhiḥ pariṣkṛtaḥ","de":"Wie das Kalb mit den Müttern wird der Tropfen, angetrieben, zusammen gesalbt; der götterfreundliche Rausch, mit Gedanken geschmückt."},{"n":1100,"sa":"ayaṃ dakṣāya sādhano 'yaṃ śardhāya vītaye\nayaṃ devebhyo madhumattaraḥ sutaḥ","de":"Dieser [Saft] bewirkt Geschick, dieser [gehört] der Schar, dem Genuss; dieser gepresste [ist] den Göttern der honigreichere."}]},{"num":148,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 20","n_from":1101,"n_to":1103,"title_de":"Soma-Säfte für uns: Milch, Sonne und Reichtum","note":"","units":[{"n":1101,"sa":"somāḥ pavanta indavo 'smabhyaṃ gātuvittamāḥ\nmitrāḥ suvānā arepasaḥ svādhyaḥ svarvidaḥ","de":"Die Somasäfte, Tropfen, klären sich, für uns die wegfindigsten, die Freunde, sich pressend, ohne Makel, wohlgesinnt, sonnenkundig."},{"n":1102,"sa":"te pūtāso vipaścitaḥ somāso dadhyāśiraḥ\nsūrāso na darśatāso jigatnavo dhruvā ghṛte","de":"Sie, die Gereinigten, die weisen Somasäfte, mit Dickmilch vermischt, wie Sonnen anzusehen, eilend, fest im Schmalz [Anm.: ghṛta]."},{"n":1103,"sa":"suṣvāṇāso vyadribhiścitānā goradhi tvaci\niṣamasmabhyamabhitaḥ samasvaranvasuvidaḥ","de":"Die Gepressten, mit den Steinen [Anm.: adri] auseinandergeschlagen [?], gesammelt auf der Haut der Kuh: Nahrung haben sie uns ringsum zugetönt, die Güter-Findigen."}]},{"num":149,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 21","n_from":1104,"n_to":1106,"title_de":"Soma: Gaben von Māṃścatva und Naiguta; Sieg über die Feinde","note":"Textlich schwierig; die Strophen nennen Eigennamen (Māṃścatva, Purumedha, Naiguta) [?].","units":[{"n":1104,"sa":"ayā pavā pavasvainā vasūni māṃścatva indo sarasi pra dhanva\nbraghnaścidyasya vāto na jūtiṃ purumedhāścittakave naraṃ dhāt","de":"Mit diesem Klärer, klär dich [mit] diesen Gütern; strömen sollst du, Indu, zum See des Māṃścatva; der [Fürst] Braghna, dessen Antrieb wie der Wind [ist], und Purumedha bracht den Helden zum Rüster [?]."},{"n":1105,"sa":"uta na enā pavayā pavasvādhi śrute śravāyyasya tīrthe\nṣaṣṭiṃ sahasrā naiguto vasūni vṛkṣaṃ na pakvaṃ dhūnavadraṇāya","de":"Und für uns klär dich mit diesem Klärer, im Ansehen, an der Furt des zu Rühmenden; sechzigtausend Güter [gab] der Naiguta, wie einen reifen Baum schüttelt er sie herab zum Kampf.","notes":"Textzustand fraglich."},{"n":1106,"sa":"mahīme asya vṛṣa nāma śūṣe māṃścatve vā pṛśane vā vadhatre\nasvāpayannigutaḥ snehayaccāpāmitrāṃ apācito acetaḥ","de":"Groß sind diese seine [Namen], Stier, dem Māṃścatva, oder dem Pṛśana, oder dem Vadhatra [?]; den Niguta ließ er einschlafen und ermattete [ihn], die Feinde, die Unbeachteten, Unverständigen [?].","notes":"Textzustand fraglich."}]},{"num":150,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 22","n_from":1107,"n_to":1109,"title_de":"Agni: Nächster, Retter, Schützer; Bitte um Reichtum","note":"","units":[{"n":1107,"sa":"agne tvaṃ no antama uta trātā śivo bhuvo varūthyaḥ","de":"Agni, du bist unser Nächster und Retter; sei gnädig, ein Schutzgewährer."},{"n":1108,"sa":"vasuragnirvasuśravā acchā nakṣi dyumattamo rayiṃ dāḥ","de":"Der Gute [Anm.: vasu], Agni, ruhmreich an Gütern: komm heran, sehr glanzvoll; gib Reichtum."},{"n":1109,"sa":"taṃ tvā śociṣṭha dīdivaḥ sumnāya nūnamīmahe sakhibhyaḥ","de":"Ihn, dich, hellster, Leuchtender, bitten wir jetzt um Gunst, für die Freunde."}]},{"num":151,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 23","n_from":1110,"n_to":1112,"title_de":"Indra und alle Götter mit den Ādityas: Heilmittel","note":"","units":[{"n":1110,"sa":"imā nu kaṃ bhuvanā sīṣadhemendraśca viśve ca devāḥ","de":"Diese Welten wollen wir gewiss ordnen, [wir mit] Indra und allen Göttern."},{"n":1111,"sa":"yajñaṃ ca nastanvaṃ ca prajāṃ cādityairindraḥ saha sīṣadhātu","de":"Unsere Weihehandlung, unseren Leib und unsere Nachkommen soll Indra zusammen mit den Ādityas vollbringen [Anm.: sīṣadhātu, „er soll zum Ziel bringen“]."},{"n":1112,"sa":"ādityairindraḥ sagaṇo marudbhirasmabhyaṃ bheṣajā karat","de":"Mit den Ādityas, Indra mit [seiner] Schar, mit den Maruts soll uns Heilmittel schaffen."}]},{"num":152,"loc":"Prapāṭhaka IV, Ardha 1, Gruppe 24","n_from":1113,"n_to":1115,"title_de":"Indra-Lied der Maruts: Preislied auf den jungen Indra","note":"","units":[{"n":1113,"sa":"pra va indrāya vṛtrahantamāya viprāya gāthaṃ gāyata yaṃ jujoṣate","de":"Für euch, für Indra, den Vṛtra-Tötesten, für den Weisen singt das Lied, das ihm gefällt."},{"n":1114,"sa":"arcantyarkaṃ marutaḥ svarkā ā stobhati śruto yuvā sa indraḥ","de":"Die schön Singenden, die Maruts, singen das Lied; der Gepriesene lobt [ihn], der berühmte Jüngling, er ist Indra."},{"n":1115,"sa":"upa prakṣe madhumati kṣiyantaḥ puṣyema rayiṃ dhīmahe ta indra","de":"Beim Fragen, honigreich, wohnend [bei dir]: wir möchten gedeihen, Reichtum [uns] schaffen, dir, Indra [zu Ehren].","notes":"Textzustand fraglich."}]},{"num":153,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 1","n_from":1116,"n_to":1127,"title_de":"Soma Pavamāna: Dichtung, Falbe, Finger und Sonne","note":"Bis 1127 überwiegend Soma-Pavamāna-Strophen; Strophen 1116–1118 rätselhaft-bildreich.","units":[{"n":1116,"sa":"pra kāvyamuśaneva bruvāṇo devo devānāṃ janimā vivakti\nmahivrataḥ śucibandhuḥ pāvakaḥ padā varāho abhyeti rebhan","de":"Er verkündet die Dichtung wie Uśanas, der Gott, die Geburten der Götter tut er kund; mit großem Gesetz, mit reinem Verwandten, läuternd, geht der Eber [?] mit dem Fuß [Anm.: varāha, „Eber“, hier Bild für den Soma] tönend hin."},{"n":1117,"sa":"pra haṃsāsastṛpalā vagnumacchāmādastaṃ vṛṣagaṇā ayāsuḥ\nāṅgoṣiṇaṃ pavamānaṃ sakhāyo durmarṣaṃ vāṇaṃ pra vadanti sākam","de":"Die Schwäne, die schwatzenden, tönenden [Anm.: unsichere Wortdeutung] [?] sind zum wunderbaren Ort geeilt, die Stierscharen; den Āṅgūṣa-Sänger, den sich Klärenden, den schwer zu Bewältigenden, den Pfeil, rufen die Freunde zusammen an.","notes":"Textzustand fraglich."},{"n":1118,"sa":"sa yojata urugāyasya jūtiṃ vṛthā krīḍantaṃ mimate na gāvaḥ\nparīṇasaṃ kṛṇute tigmaśṛṅgo divā harirdadṛśe naktamṛjraḥ","de":"Er schirrt an den Antrieb des Weitschreitenden; die Kühe messen [ihn] nicht, wenn er umsonst spielt; der Scharfhornige macht [sich] umschlossen [?]; am Tag ist der Falbe zu sehen, in der Nacht der Rötliche.","notes":"Textzustand fraglich."},{"n":1119,"sa":"pra svānāso rathā ivārvanto na avasyavaḥ\nsomāso rāye akramuḥ","de":"Tönend, wie Wagen, wie Rosse, hilfesuchend [für] uns, sind die Somasäfte zum Reichtum geschritten."},{"n":1120,"sa":"hinvānāso rathā iva dadhanvire gabhastyoḥ\nbharāsaḥ kāriṇāmiva","de":"Angetrieben wie Wagen haben sie sich in den Händen halten lassen; [sie sind] Lasten, wie die der Sänger."},{"n":1121,"sa":"rājāno na praśastibhiḥ somāso gobhirañjate\nyajño na sapta dhātṛbhiḥ","de":"Wie Könige durch Preisreden werden die Somasäfte mit Milch gesalbt, wie die Weihehandlung [mit] sieben Ordnern [?]."},{"n":1122,"sa":"pari svānāsa indavo madāya barhaṇā girā\nmadho arṣanti dhārayā","de":"Ringsum tönend, die Tropfen, [strömen] zur Berauschung, mit dem stärkenden Lied; des Honigs strömen sie hin mit dem Strom."},{"n":1123,"sa":"āpānāso vivasvato jinvanta uṣaso bhagam\nsūrā aṇvaṃ vi tanvate","de":"Die Erlangten, des Vivasvat [Sohn], die Bhaga der Morgenröte antreibend: die Sonnen [Anm.: sūrāḥ, auch „Sänger“] spannen das Feine [Fadenwerk, Sieb] auseinander [?]."},{"n":1124,"sa":"apa dvārā matīnāṃ pratnā ṛṇvanti kāravaḥ\nvṛṣṇo harasa āyavaḥ","de":"Die Türen der Gedanken öffnen die alten Dichter, des Stiers Feuer [?], die Menschen.","notes":"Textzustand fraglich."},{"n":1125,"sa":"samīcīnāsa āśata hotāraḥ saptajānayaḥ\npadamekasya piprataḥ","de":"Zusammengekommen haben sie erreicht, die Rufer, sieben Geburtsstätten habend, um den Ort des Einen zu füllen."},{"n":1126,"sa":"nābhā nābhiṃ na ā dade cakṣuṣā sūrya dṛśe\nkaverapatyamā duhe","de":"Nabel [zu] Nabel: ich hab es für uns genommen, Sonne, damit du siehst; das Kind des Dichters melke ich.","notes":"Textzustand fraglich."},{"n":1127,"sa":"abhi priyaṃ divaspadamadhvaryubhirguhā hitam\nsūraḥ pasyati cakṣasā","de":"Zum lieben Ort des Himmels, [der] von den Adhvaryus im Verborgenen gelegt [ist]: die Sonne sieht mit dem Auge."}]},{"num":154,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 2","n_from":1128,"n_to":1139,"title_de":"Soma Pavamāna: der strömende Saft auf dem Pfad der Ordnung","note":"Läuterungslieder an Soma; die letzten drei Verse (1137–1139) haben den Refrain „pāntam ā puruspṛham“.","units":[{"n":1128,"sa":"asṛgramindavaḥ pathā dharmannṛtasya suśriyaḥ\nvidānā asya yojanā","de":"Die Säfte sind losgelassen worden, auf dem Pfad, in der Satzung der Ordnung (ṛta), schön glänzend, kundig seiner Bahnen [yojanā: Anm.: eigentlich „Anschirrungen/Strecken“; Wiedergabe unsicher] [?]."},{"n":1129,"sa":"pra dhārā madho agriyo mahīrapo vi gāhate\nhavirhaviḥṣu vandyaḥ","de":"Der vorderste Strom des Honigtranks durchdringt die großen Wasser; unter den Darbringungen ist er die preiswürdige Darbringung."},{"n":1130,"sa":"pra yujā vāco agriyo vṛṣo acikradadvane\nsadmābhi satyo adhvaraḥ","de":"Mit dem Gespann der Rede [?] brüllte der vorderste Stier im Holz; zu den Sitzen hin ist er wahrhaftig die unversehrte Weihehandlung."},{"n":1131,"sa":"pari yatkāvyā kavirnṛmṇā punāno arṣati\nsvarvājī siṣāsati","de":"Wenn der Seher, sich läuternd, ringsum die Dichtungen und Manneskräfte durchströmt, will er als Renner den Lichtraum (die Sonne) gewinnen."},{"n":1132,"sa":"pavamāno abhi spṛdho viśo rājeva sīdati\nyadīmṛṇvanti vedhasaḥ","de":"Sich läuternd geht er gegen die Widersacher; wie ein König lässt er sich unter den Stämmen nieder, wenn die Weisen ihn in Bewegung setzen [?]."},{"n":1133,"sa":"avyā vāre pari priyo harirvaneṣu sīdati\nrebho vanuṣyate mati","de":"Im Schafhaarsieb sitzt der liebe Braune (Hari) in den Hölzern; der Lobsänger [rebha] gewinnt ihn [vanuṣyate] mit seinem Gedanken [?]."},{"n":1134,"sa":"sa vāyumindramaśvinā sākaṃ madena gacchati\nraṇā yo asya dharmaṇā","de":"Er geht mit Vāyu, Indra und den Aśvin zugleich mit Rausch, der sich an seiner Stütze (dharman) erfreut [raṇā: Anm.: Bezug unsicher] [?]."},{"n":1135,"sa":"ā mitre varuṇe bhage madhoḥ pavanta ūrmayaḥ\nvidānā asya śakmabhiḥ","de":"Zu Mitra, Varuṇa und Bhaga hin strömen die Wellen des Honigtranks, kundig, mit seinen Kräften."},{"n":1136,"sa":"asmabhyaṃ rodasī rayiṃ madhvo vājasya sātaye\nśravo vasūni sañjitam","de":"Uns, ihr beiden Welten, [bringt] Reichtum zum Gewinn des Honigtranks und der Kraftgabe: Ruhm, Güter, gemeinsam Errungenes."},{"n":1137,"sa":"ā te dakṣaṃ mayobhuvaṃ vahnimadyā vṛṇīmahe\npāntamā puruspṛham","de":"Deine Geschicklichkeit, die Wohlsein schafft, den Beförderer, erwählen wir heute, den besten Beschützer, den vielbegehrten."},{"n":1138,"sa":"ā mandramā vareṇyamā vipramā manīṣiṇam\npāntamā puruspṛham","de":"Den Erfreuenden, den Wünschenswerten, den Weisen, den Einsichtigen [erwählen wir], den besten Beschützer, den vielbegehrten."},{"n":1139,"sa":"ā rayimā sucetunamā sukrato tanūṣvā\npāntamā puruspṛham","de":"Den Reichtum, den Klugen, o Wohlwirkender, [erwählen wir] für die Leiber, den besten Beschützer, den vielbegehrten."}]},{"num":155,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 3","n_from":1140,"n_to":1142,"title_de":"Agni Vaiśvānara: Haupt des Himmels, Gast der Menschen","note":"","units":[{"n":1140,"sa":"mūrdhānaṃ divo aratiṃ pṛthivyā vaiśvānaramṛta ā jātamagnim\nkaviṃ samrājamatithiṃ janānāmāsannaḥ pātraṃ janayanta devāḥ","de":"Das Haupt des Himmels, den Wanderer [Anm.: aratiḥ, auch „Diener/Lenker“] der Erde, Vaiśvānara, den in der Ordnung geborenen Agni, den Seher, Allherrscher, Gast der Menschen, ihn erzeugten die Götter als Gefäß am Munde [āsannaḥ: Anm.: Textzustand fraglich; die Parallelfassung liest „āsā“ „mit dem Mund“] [?]."},{"n":1141,"sa":"tvāṃ viśve amṛta jāyamānaṃ śiśuṃ na devā abhi saṃ navante\ntava kratubhiramṛtatvamāyanvaiśvānara yatpitroradīdeḥ","de":"Dich, Unsterblicher, den Neugeborenen, den Sprössling, preisen alle Götter; durch deine Willenskräfte gelangten sie zur Unsterblichkeit, o Vaiśvānara, als du für die beiden Eltern aufleuchtetest."},{"n":1142,"sa":"nābhiṃ yajñānāṃ sadanaṃ rayīṇāṃ mahāmāhāvamabhi saṃ navanta\nvaiśvānaraṃ rathyamadhvarāṇāṃ yajñasya ketuṃ janayanta devāḥ","de":"Den Nabel der Weihehandlungen, den Sitz der Reichtümer, den Großen, preisen sie als Anruf [?] zusammen; Vaiśvānara, den Wagenlenker der Weihehandlungen, das Banner der Darbringung, erzeugten die Götter."}]},{"num":156,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 4","n_from":1143,"n_to":1145,"title_de":"Mitra und Varuṇa: die beiden Herrscher der Ordnung","note":"","units":[{"n":1143,"sa":"pra vo mitrāya gāyata varuṇāya vipā girā\nmahikṣatrāvṛtaṃ bṛhat","de":"Singt für Mitra und Varuṇa mit begeistertem Lied, für die beiden von großer Herrschaft, die das hohe Recht (ṛta) innehaben."},{"n":1144,"sa":"samrājā yā ghṛtayonī mitraścobhā varuṇaśca\ndevā deveṣu praśastā","de":"Die beiden Allherrscher, die im Schmalz ihren Schoß haben, Mitra und Varuṇa, die Götter, die unter den Göttern Gepriesenen."},{"n":1145,"sa":"tā naḥ śaktaṃ parthivasya maho rāyo divyasya\nmahi vāṃ kṣatraṃ deveṣu","de":"Diese beiden, vermögt uns [zu geben] vom großen irdischen und vom himmlischen Reichtum; groß ist eure Herrschaft unter den Göttern."}]},{"num":157,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 5","n_from":1146,"n_to":1148,"title_de":"Indra-Ruf: Komm zum gepressten Soma","note":"","units":[{"n":1146,"sa":"indrā yāhi citrabhāno sutā ime tvāyavaḥ\naṇvībhistanā pūtāsaḥ","de":"Komm, Indra, du Buntstrahliger; diese gepressten Säfte begehren dich, mit den feinen Fingern geläutert."},{"n":1147,"sa":"indrā yāhi dhiyeṣito viprajūtaḥ sutāvataḥ\nupa brahmāṇi vāghataḥ","de":"Komm, Indra, vom Gedanken angetrieben, von den Weisen gefördert, zu dem, der gepresst hat, zu den Gebeten des Sängers."},{"n":1148,"sa":"indrā yāhi tūtujāna upa brahmāṇi harivaḥ\nsute dadhiṣva naścanaḥ","de":"Komm, Indra, eilend, zu den Gebeten, Falbenherr; nimm bei dem gepressten Soma unser Wohlgefallen an [naścanaḥ: Anm.: „nas canaḥ“ „an uns Gefallen“] [?]."}]},{"num":158,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 6","n_from":1149,"n_to":1151,"title_de":"Agni-Preis, Bitte um Labung für Indra und Agni","note":"","units":[{"n":1149,"sa":"tamīḍiṣva yo arciṣā vanā viśvā pariṣvajat\nkṛṣṇā kṛṇoti jihvayā","de":"Ihn preise, der mit der Flamme alle Wälder umfasst und mit der Zunge sie schwärzt."},{"n":1150,"sa":"ya iddha āvivāsati sumnamindrasya martyaḥ\ndyumnāya sutarā apaḥ","de":"Der Sterbliche, der, wenn [das Feuer] entzündet ist, Indras Wohlwollen zu gewinnen sucht, [macht] für Glanz die Wasser leicht überschreitbar [?]."},{"n":1151,"sa":"tā no vājavatīriṣa āśūnpipṛtamarvataḥ\nendramagniṃ ca voḍhave","de":"Ihr beiden, erfüllt uns die kraftvollen Labungen und die schnellen Rosse, um Indra und Agni herzufahren. [Anm.: Adressaten des Duals nicht genannt]"}]},{"num":159,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 7","n_from":1152,"n_to":1154,"title_de":"Soma im Krug: Freund Indras, Kühe und Gedanken","note":"","units":[{"n":1152,"sa":"pro ayāsīdindurindrasya niṣkṛtaṃ sakhā sakhyurna pra mināti saṅgiram\nmarya iva yuvatibhiḥ samarṣati somaḥ kalaśe śatayāmnā pathā","de":"Hervor ist der Tropfen gegangen zu Indras Bestimmungsort; wie ein Freund dem Freund bricht er die Verabredung nicht. Wie ein Mann zu den jungen Frauen strömt Soma im Krug hin auf hundertfältigem Pfad."},{"n":1153,"sa":"pra vo dhiyo mandrayuvo vipanyuvaḥ panasyuvaḥ saṃvaraṇeṣvakramuḥ\nhariṃ krīḍantamabhyanūṣata stubho 'bhi dhenavaḥ payasedaśiśrayuḥ","de":"Eure Gedanken, freudig verlangend, lobbegierig, preisbegierig, sind in den Umfriedungen [saṃvaraṇa: Anm.: auch „Behälter/Sammelstätten“] vorwärtsgeschritten; den spielenden Falben besangen die Lobrufe, die Milchkühe schmiegten sich mit Milch an ihn [?]."},{"n":1154,"sa":"ā naḥ soma saṃyataṃ pipyuṣīmiṣamindo pavasva pavamāna ūrmiṇā\nyā no dohate trirahannasaścuṣī kṣumadvājavanmadhumatsuvīryam","de":"Zu uns, Soma, die zusammengefasste strotzende Labung; Indu, klär dich, sich läuternd, mit Welle: die, [die Kuh,] uns dreimal am Tage unversiegend milcht, [gib] Nahrung, Kraftfülle, Süße, gute Heldenkraft [?]."}]},{"num":160,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 8","n_from":1155,"n_to":1156,"title_de":"Indra: der stets Stärkende, bei dessen Geburt die Kühe brüllten","note":"","units":[{"n":1155,"sa":"na kiṣṭaṃ karmaṇā naśadyaścakāra sadāvṛdham\nindraṃ na yajñairviśvagūrttamṛbhvasamadhṛṣṭaṃ dhṛṣṇumojasā","de":"Niemand erreicht ihn durch Tat, der Indra, den stets Stärkenden, [mit Weihehandlungen] gemacht hat, den von allen Gepriesenen, den Kunstreichen, den Unbezwingbaren, den durch Kraft Kühnen [?]. [Anm.: Satzbau schwierig, Bezug von „yaś cakāra“ unsicher]"},{"n":1156,"sa":"aṣāḍhamugraṃ pṛtanāsu sāsahiṃ yasminmahīrurujrayaḥ\nsaṃ dhenavo jāyamāne anonavurdyāvaḥ kṣāmīranonavuḥ","de":"Den Unbesiegten, Grimmigen, in den Kämpfen Überwältigenden, in dem große weite Kraft liegt; bei dessen Geburt brüllten die Kühe, die Himmel brüllten, die Erden brüllten."}]},{"num":161,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 9","n_from":1157,"n_to":1159,"title_de":"Somaläuterung: Freunde, setzt euch und singt","note":"","units":[{"n":1157,"sa":"sakhāya ā ni ṣīdata punānāya pra gāyata\nśiśuṃ na yajñaiḥ pari bhūṣata śriye","de":"Freunde, setzt euch nieder; dem sich Läuternden singt vor; wie ein Kind schmückt ihn ringsum mit Weihehandlungen zum Glanz."},{"n":1158,"sa":"samī vatsaṃ na mātṛbhiḥ sṛjatā gayasādhanam\ndevāvyā3ṃ madamabhi dviśavasam","de":"Lasst ihn los wie das Kalb zu den Müttern, den Mehrer des Hausstandes, hin zum götterlabenden Rausch, den doppelt Kräftigen [?]."},{"n":1159,"sa":"punātā dakṣasādhanaṃ yathā śardhāya vītaye\nyathā mitrāya varuṇāya śantamam","de":"Läutert den Geschick-Vollbringer, damit [er] zur Schar, zum Genuss [wird], wie für Mitra und Varuṇa das Wohltuendste [?]."}]},{"num":162,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 10","n_from":1160,"n_to":1162,"title_de":"Soma strömt durch das Sieb in Indras Bauch","note":"","units":[{"n":1160,"sa":"pra vājyakṣāḥ sahasradhārastiraḥ pavitraṃ vi vāramavyam","de":"Hervor strömte der Renner, tausendströmig, quer durch das Läutersieb, durch das Schafhaar."},{"n":1161,"sa":"sa vājyakṣāḥ sahasraretā adbhirmṛjāno gobhiḥ śrīṇānaḥ","de":"Er, der Renner, strömte hervor, tausendfach im Samen, mit Wassern gereinigt, mit Kuhmilch vermischt."},{"n":1162,"sa":"pra soma yāhīndrasya kukṣā nṛbhiryemāno adribhiḥ sutaḥ","de":"Geh hervor, Soma, in Indras Bauch, von Männern gelenkt, mit den Presssteinen gepresst."}]},{"num":163,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 11","n_from":1163,"n_to":1165,"title_de":"Soma-Säfte aus Nähe und Ferne: Bitte um Regen","note":"","units":[{"n":1163,"sa":"ye somāsaḥ parāvati ye arvāvati sunvire\nye vādaḥ śaryaṇāvati","de":"Die Säfte, die in der Ferne, die in der Nähe gepresst werden, die dort im Śaryaṇāvat [Anm.: Ortsname, See oder Landschaft] [gepresst werden],"},{"n":1164,"sa":"ya ārjīkeṣu kṛtvasu ye madhye pastyānām\nye vā janeṣu pañcasu","de":"die bei den Ārjīkas, bei den Kṛtvas [?], die inmitten der Siedlungen, die unter den fünf Stämmen [gepresst werden],"},{"n":1165,"sa":"te no vṛṣṭiṃ divaspari pavantāmā suvīryam\nsvānā devāsa indavaḥ","de":"die sollen uns Regen vom Himmel her und gute Heldenkraft läutern, rauschend, die göttlichen Tropfen."}]},{"num":164,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 12","n_from":1166,"n_to":1168,"title_de":"Agni: Ruf in den Kämpfen","note":"","units":[{"n":1166,"sa":"ā te vatso mano yamatparamāccitsadhasthāt\nagne tvāṃ kāmaye girā","de":"Zu dir hat das Kalb [Anm.: Name eines Sängers, Vatsa?] den Sinn gelenkt, selbst von der höchsten gemeinsamen Sitzstätte her; Agni, dich begehre ich mit dem Lied [?]."},{"n":1167,"sa":"purutrā hi sadṛṅṅasi diśo viśvā anu prabhuḥ\nsamatsu tvā havāmahe","de":"Denn vielfach bist du gleichgestaltig, über alle Himmelsrichtungen mächtig; in den Kämpfen rufen wir dich."},{"n":1168,"sa":"samatsvagnimavase vājayanto havāmahe\nvājeṣu citrarādhasam","de":"In den Kämpfen rufen wir Agni um Hilfe, siegesbegehrend, in den Siegespreisen den wunderbar Reichen."}]},{"num":165,"loc":"Prapāṭhaka IV, Ardha 2, Gruppe 13","n_from":1169,"n_to":1174,"title_de":"Indra: Bitte um Kraft, Heldentum und Gabe","note":"","units":[{"n":1169,"sa":"tvaṃ na indrā bhara ojo nṛmṇaṃ śatakrato vicarṣaṇe\nā vīraṃ pṛtanāsaham","de":"Du, Indra, bring uns Kraft und Mannhaftigkeit, hundertfältig Wirkender, du Allbeschauer; einen Helden, der in den Schlachten überwältigt."},{"n":1170,"sa":"tvaṃ hi naḥ pitā vaso tvaṃ mātā śatakrato babhūvitha\nathā te sumnamīmahe","de":"Denn du bist unser Vater, Vasu, du wurdest unsere Mutter, hundertfältig Wirkender; darum erbitten wir dein Wohlwollen."},{"n":1171,"sa":"tvāṃ śuṣminpuruhūta vājayantamupa bruve sahaskṛta\nsa no rāsva suvīryam","de":"Dich, den Kraftvollen, Vielgerufenen, den Siegesbegehrenden, rufe ich an, Kraftgeborener; gib uns gute Heldenkraft."},{"n":1172,"sa":"yadindra citra ma iha nāsti tvādātamadrivaḥ\nrādhastanno vidadvasa ubhayāhastyā bhara","de":"Wenn mir hier, Indra, du Wunderbarer, nichts von dir Gegebenes ist, Steinträger, [so] bring uns Gabe, du Güterfinder, mit beiden Händen."},{"n":1173,"sa":"yanmanyase vareṇyamindra dyukṣaṃ tadā bhara\nvidyāma tasya te vayamakūpārasya dāvanaḥ","de":"Was du für wünschenswert hältst, Indra, das himmlisch Glänzende, das bring; möchten wir von dir, dem unerschöpflichen [akūpāra: Anm.: wörtlich „ohne Brunnen/ohne Ufer“] Geber, dessen Gabe erlangen [?]."},{"n":1174,"sa":"yatte dikṣu prarādhyaṃ mano asti śrutaṃ bṛhat\ntena dṛḍhā cidadriva ā vājaṃ darṣi sātaye","de":"Der Sinn, der dir in den Himmelsrichtungen als erfolgreich [prarādhya] gilt, berühmt, weit: mit dem, Steinträger, reißt du auch Festes auf, um Beute zu gewinnen [?]."}]},{"num":166,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 1","n_from":1175,"n_to":1177,"title_de":"Soma der Seher: dritter und vierter Bereich","note":"","units":[{"n":1175,"sa":"śiśuṃ jajñānaṃ haryataṃ mṛjanti śumbhanti vipraṃ maruto gaṇena\nkavirgīrbhiḥ kāvyenā kaviḥ santsomaḥ pavitramatyeti rebhan","de":"Das neugeborene Kind, den Begehrenswerten, reinigen sie, den Weisen schmücken die Maruts mit ihrer Schar. Der Seher, mit Liedern, mit Seher-Dichtung Seher seiend, geht Soma jubelnd durch das Sieb."},{"n":1176,"sa":"ṛṣimanā ya ṛṣikṛtsvarṣāḥ sahasranīthaḥ padavīḥ kavīnām\ntṛtīyaṃ dhāma mahiṣaḥ siṣāsantsomo virājamanu rājati ṣṭup","de":"Der seherischen Sinnes ist, Seher-Wirker, Himmelsgewinner, tausendfach Führender, Spurenkenner der Seher, den dritten Bereich [dhāma] erstrebend, der Mächtige: Soma herrscht der Virāj[-Strophe] nach mit dem Lobruf [ṣṭup: Anm.: Form für „ṣṭubh“] [?]."},{"n":1177,"sa":"camūṣacchyenaḥ śakuno vibhṛtvā govindurdrapsa āyudhāni bibhrat\napāmūrmiṃ sacamānaḥ samudraṃ turīyaṃ dhāma mahiṣo vivakti","de":"Auf der Schale sitzend, der Falke, der Vogel, weithin sich verteilend, Kuhfinder, der Tropfen, Waffen tragend, die Woge der Wasser begleitend, zum Meer [strebend]: den vierten Bereich, der Mächtige, verkündet er [?]."}]},{"num":167,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 2","n_from":1178,"n_to":1186,"title_de":"Soma-Tropfen zu Indra: Bitte um Heldenkraft, Regen, Nachkommen","note":"","units":[{"n":1178,"sa":"ete somā abhi priyamindrasya kāmamakṣaran\nvardhanto asya vīryam","de":"Diese Somasäfte sind zu Indras lieber Absicht hin geströmt, seine Heldenkraft mehrend."},{"n":1179,"sa":"punānāsaścamūṣado gacchanto vāyumaśvinā\nte no dhatta suvīryam","de":"Sich läuternd, in den Schalen sitzend, zu Vāyu und den Aśvin gehend: ihr, verleiht uns gute Heldenkraft."},{"n":1180,"sa":"indrasya soma rādhase punāno hārdi codaya\ndevānāṃ yonimāsadam","de":"Für Indras Gabe, Soma, rege [uns], dich läuternd, im Herzen an [?], um dich im Schoß der Götter niederzulassen."},{"n":1181,"sa":"mṛjanti tvā deśa kṣipo hinvanti sapta dhītayaḥ\nanu viprā amādiṣuḥ","de":"Es reinigen dich die zehn Finger, es treiben dich die sieben Gedanken an; die Weisen haben sich daran erfreut."},{"n":1182,"sa":"devebhyastvā madāya kaṃ sṛjānamati meṣyaḥ\nsa gobhirvāsayāmasi","de":"Für die Götter, dich zum Rausch, wohl, den über die Schafe [das Schafhaarsieb] Freigelassenen, den kleiden wir mit Milch [?]."},{"n":1183,"sa":"punānaḥ kalaśeṣvā vastrāṇyaruṣo hariḥ\npari gavyānyavyata","de":"Sich läuternd in den Krügen, der rötliche Falbe, hüllte er sich ringsum in die Kuhgaben [gavya: Anm.: Milchmischungen] [?]."},{"n":1184,"sa":"maghona ā pavasva no jahi viśvā apa dviṣaḥ\nindo sakhāyamā viśa","de":"Für den Freigebigen strömle zu uns; schlage alle Hasser weg; Indu, dringe als Freund [in den Freund] ein."},{"n":1185,"sa":"nṛcakṣasaṃ tvā vayamindrapītaṃ svarvidam\nbhakṣīmahi prajāmiṣam","de":"Dich, Männerbeschauer, von Indra getrunken, himmelsfindend, möchten wir genießen: Nachkommenschaft, Labung."},{"n":1186,"sa":"vṛṣṭiṃ divaḥ pari srava dyumnaṃ pṛthivyā adhi\nsaho naḥ soma pṛtsu dhāḥ","de":"Regen vom Himmel ström ringsum, Glanz von der Erde her; Kraft, Soma, gib uns in den Kämpfen."}]},{"num":168,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 3","n_from":1187,"n_to":1195,"title_de":"Soma Pavamāna: tausendströmig zu Indra","note":"","units":[{"n":1187,"sa":"somaḥ punāno arṣati sahasradhāro atyaviḥ\nvāyorindrasya niṣkṛtam","de":"Soma strömt sich läuternd, tausendströmig, über die Wolle hin, zu Vāyus und Indras Bestimmungsort."},{"n":1188,"sa":"pavamānamavasyavo vipramabhi pra gāyata\nsuṣvāṇaṃ devavītaye","de":"Den sich Läuternden, ihr Hilfebegehrenden, den Weisen, singt an, den Auspressten, zum Götterlabsal."},{"n":1189,"sa":"pavante vājasātaye somāḥ sahasrapājasaḥ\ngṛṇānā devavītaye","de":"Zum Gewinn des Siegespreises läutern sich die Säfte, tausendfach kräftig, gepriesen, zum Götterlabsal."},{"n":1190,"sa":"uta no vājasātaye pavasva bṛhatīriṣaḥ\ndyumadindo suvīryam","de":"Und uns zum Gewinn des Siegespreises strömle große Labungen, glänzend, Indu, gute Heldenkraft."},{"n":1191,"sa":"atyā hiyānā na hetṛbhirasṛgraṃ vājasātaye\nvi vāramavyamāśavaḥ","de":"Wie Rosse, von Treibern angetrieben, sind sie zum Gewinn losgelassen worden, die Schnellen, durch das Schafhaarsieb."},{"n":1192,"sa":"te naḥ sahasriṇaṃ rayiṃ pavantāmā suvīryam\nsuvānā devāsa indavaḥ","de":"Diese sollen uns tausendfachen Reichtum und gute Heldenkraft läutern, die gepressten göttlichen Tropfen."},{"n":1193,"sa":"vāśrā arṣantīndavo 'bhi vatsaṃ na mātaraḥ\ndadhanvire gabhastyoḥ","de":"Brüllend strömen die Tropfen, wie Mütter zum Kalb; sie liefen [dadhanvire] in den Händen [?]."},{"n":1194,"sa":"juṣṭa indrāya matsaraḥ pavamāna kanikradat\nviśvā apa dviṣo jahi","de":"Dem Indra genehm, der Berauschende, sich läuternd, laut brüllend: schlage alle Hasser weg."},{"n":1195,"sa":"apaghnanto arāvṇaḥ pavamānāḥ svardṛśaḥ\nyonāvṛtasya sīdata","de":"Die Ungebenden abwehrend, sich läuternd, himmelschauend, setzt euch in den Schoß der Ordnung."}]},{"num":169,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 4","n_from":1196,"n_to":1204,"title_de":"Soma: Woge des Flusses, Nabel des Himmels","note":"","units":[{"n":1196,"sa":"somā asṛgramindavaḥ sutā ṛtasya dhārayā\nindrāya madhumattamāḥ","de":"Die Somas sind losgelassen worden, die Tropfen, gepresst im Strom der Ordnung, für Indra, die honigsüßesten."},{"n":1197,"sa":"abhi viprā anūṣata gāvo vatsaṃ na dhenavaḥ\nindraṃ somasya pītaye","de":"Zu ihm sangen die Weisen, wie Milchkühe zum Kalb: Indra, zum Trinken des Soma."},{"n":1198,"sa":"madacyutkṣeti sādane sindhorūrmā vipaścit\nsomo gaurī adhi śritaḥ","de":"Rauschträufelnd weilt er am Sitz, die Woge des Flusses, der Wissende, Soma, an die Gaurī [Anm.: „Weiße/Büffelkuh“, hier wohl Milch] gelehnt [?]."},{"n":1199,"sa":"divo nābhā vicakṣaṇo 'vyo vāre mahīyate\nsomo yaḥ sukratuḥ kaviḥ","de":"Der Nabel des Himmels, der Scharfsichtige, wird im Schafhaarsieb verherrlicht, Soma, der Kunstreiche, der Seher."},{"n":1200,"sa":"yaḥ somaḥ kalaśeṣvā antaḥ pavitra āhitaḥ\ntaminduḥ pari ṣasvaje","de":"Der Soma, der in den Krügen, drinnen im Sieb niedergelegt ist: ihn umarmt der Indu."},{"n":1201,"sa":"pra vācaminduriṣyati samudrasyādhi viṣṭapi\njinvankośaṃ madhuścutam","de":"Vorwärts treibt der Indu die Rede auf dem Rücken des Meeres, den honigträufelnden Behälter belebend."},{"n":1202,"sa":"nityastotro vanaspatirdhenāmantaḥ sabardughām\nhinvāno mānuṣā yujā","de":"Der stets Gepriesene, der Baum [vanaspati], die innen Milchsaft gebende Kuh [?], antreibend mit dem menschlichen Gespann [?]."},{"n":1203,"sa":"ā pavamāna dhāraya rayiṃ sahasravarcasam\nasme indo svābhuvam","de":"Strömle, sich Läuternder, halte [uns] Reichtum, tausendglänzend, uns, Indu, du Wohlgeartetes [svābhuvam] [?]."},{"n":1204,"sa":"abhi priyā divaḥ kavirvipraḥ sa dhārayā sutaḥ\nsomo hinve parāvati","de":"Zu dem Lieben des Himmels hin, der Seher, der Weise, er, im Strom gepresst; Soma wird in der Ferne angetrieben [?]."}]},{"num":170,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 5","n_from":1205,"n_to":1209,"title_de":"Soma: Kräfte erheben sich, Schafhaarsieb und Rausch","note":"","units":[{"n":1205,"sa":"utte śuṣmāsa īrate sindhorūrmeriva svanaḥ\nvāṇasya codayā pavim","de":"Empor erheben sich deine Kräfte wie das Rauschen der Flutwelle des Flusses; treibe des Vāṇa Pavi an [Anm.: Bedeutung von „vāṇa“ und „pavi“ unsicher; „Klang/Pfeife“ und „Radkranz/Spitze“ möglich] [?]."},{"n":1206,"sa":"prasave ta udīrate tisro vāco makhasyuvaḥ\nyadavya eṣi sānavi","de":"Bei deiner Erzeugung erheben sich die drei Stimmen, festbegierig [makhasyuvaḥ] [?], wenn du im Schafhaar auf den Rücken (sānavi) gehst [?]."},{"n":1207,"sa":"avyā vāraiḥ pari priyaṃ hariṃ hinvantyadribhiḥ\npavamānaṃ madhuścutam","de":"Mit den Haaren des Siebs treiben sie den lieben Falben mit den Steinen an, den sich Läuternden, Honigträufelnden."},{"n":1208,"sa":"ā pavasva madintama pavitraṃ dhārayā kave\narkasya yonimāsadam","de":"Strömle, Berauschendster, ins Sieb mit dem Strom, Seher; setze dich in den Schoß des Lobgesangs [arka] [?]."},{"n":1209,"sa":"sa pavasva madintama gobhirañjāno aktubhiḥ\nendrasya jaṭharaṃ viśa","de":"Du, Berauschendster, strömle, mit Milch, mit Salben geschmückt; dringe in Indras Bauch ein."}]},{"num":171,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 6","n_from":1210,"n_to":1212,"title_de":"Soma: Indras Taten, Burgen und Feinde","note":"","units":[{"n":1210,"sa":"ayā vītī pari srava yasta indo madeṣvā\navāhannavatīrnava","de":"Mit dieser Gunst [vītī] ström ringsum, du, der bei deinen Räuschen, Indu, die neunundneunzig erschlug [?]. [Anm.: „navatīr nava“ wörtlich „neun Neunziger“; Bezug des Relativsatzes unsicher]"},{"n":1211,"sa":"puraḥ sadya itthādhiye divodāsāya śaṃbaram\nadha tyaṃ turvaśaṃ yadum","de":"Burgen [erschlug er] sogleich, so für den Andächtigen, für Divodāsa den Śambara; dann diesen Turvaśa, den Yadu [?]."},{"n":1212,"sa":"pari no aśvamaśvavidgomadindo hiraṇyavat\nkṣarā sahasriṇīriṣaḥ","de":"Für uns ein Ross, Rosse- und Kuhreiches, Goldenes, Indu, strömle tausendfache Labungen."}]},{"num":172,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 7","n_from":1213,"n_to":1215,"title_de":"Soma: Bedränger abwehren, heldenreichen Ruhm bringen","note":"","units":[{"n":1213,"sa":"apaghnanpavate mṛdho 'pa somo arāvṇaḥ\ngacchannindrasya niṣkṛtam","de":"Die Bedränger abwehrend läutert sich Soma, die Ungebenden weg, zu Indras Bestimmungsort gehend."},{"n":1214,"sa":"maho no rāya ā bhara pavamāna jahī mṛdhaḥ\nrāsvendo vīravadyaśaḥ","de":"Großen Reichtum bring uns, Sich-Läuternder, schlage die Bedränger; gib, Indu, heldenreichen Ruhm."},{"n":1215,"sa":"na tvā śataṃ ca na hruto rādho ditsantamā minan\nyatpunāno makhasyase","de":"Nicht hundert noch Krumme [hrutaḥ] [?] mindern dich, der du Gabe geben willst, wenn du, geläutert, freigebig sein willst [?]."}]},{"num":173,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 8","n_from":1216,"n_to":1218,"title_de":"Soma und die Sonne: Etaśa angeschirrt, Indu ruft „Indra“","note":"","units":[{"n":1216,"sa":"ayā pavasva dhārayā yayā sūryamarocayaḥ\nhinvāno mānuṣīrapaḥ","de":"Mit diesem Strom strömle, mit dem du die Sonne leuchten ließest, die menschlichen Wasser antreibend."},{"n":1217,"sa":"ayukta sūra etaśaṃ pavamāno manāvadhi\nantarikṣeṇa yātave","de":"Angeschirrt hat die Sonne den Etaśa, [während Soma] sich läuternd bei Manu [ist], um durch den Luftraum zu fahren [?]."},{"n":1218,"sa":"uta tyā harito rathe sūro ayukta yātave\nindurindra iti bruvan","de":"Und diese Falben hat die Sonne am Wagen angeschirrt zum Fahren; der Indu, „Indra“ sagend."}]},{"num":174,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 9","n_from":1219,"n_to":1221,"title_de":"Agni: Bote der Weihehandlung, Rauch zum Himmel","note":"","units":[{"n":1219,"sa":"agniṃ vo devamagnibhiḥ sajoṣā yajiṣṭhaṃ dūtamadhvare kṛṇudhvam\nyo martyeṣu nidhruvirṛtāvā tapurmūrdhā ghṛtānnaḥ pāvakaḥ","de":"Macht Agni, den himmlischen, in Eintracht mit den Feuern zum verehrungswürdigsten Boten bei der Weihehandlung – ihn, der unter den Sterblichen der Feststehende ist, der des Rechten Waltende, der Hitzehäuptige, den von Schmelzbutter Genährten, den Läuternden."},{"n":1220,"sa":"prothadaśvo na yavase 'viṣyanyadā mahaḥ saṃvaraṇādvyasthāt\nādasya vāto anu vāti śociradha sma te vrajanaṃ kṛṣṇamasti","de":"Er prasselt wie ein Ross, das sich auf der Weide sättigt [?], als er sich aus der großen Umschließung erhob. Dann weht der Wind ihm nach, leuchtend ist seine Flamme; und schwarz ist dir, Agni, dein Pfad [?].","notes":"Textzustand des zweiten Halbverses unsicher; Parallele zu RV 1.58.4"},{"n":1221,"sa":"udyasya te navajātasya vṛṣṇo 'gne carantyajarā idhānāḥ\nacchā dyāmaruṣo dhūma eṣi saṃ dūto agna īyase hi devān","de":"Es steigen auf deine unalternden Flammen, die Entfachten, du frisch Geborener, du Stier, Agni. Zum Himmel hin, du Rötlicher, geht dein Rauch; du wirst ja als Bote zu den Göttern ausgesandt."}]},{"num":175,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 10","n_from":1222,"n_to":1224,"title_de":"Indra: Anruf zum Kampf gegen Vṛtra","note":"","units":[{"n":1222,"sa":"tamindraṃ vājayāmasi mahe vṛtrāya hantave\nsa vṛṣā vṛṣabho bhuvat","de":"Ihn, Indra, spornen wir zum Sieg an, damit er den großen Vṛtra erschlage. Er, der Stier, möge zum Bullen werden."},{"n":1223,"sa":"indraḥ sa dāmane kṛta ojiṣṭhaḥ sa bale hitaḥ\ndyumnī ślokī sa somyaḥ","de":"Indra ist zum Geben geschaffen, er der Kraftvollste, er ist auf Stärke gestellt; er der Glänzende, Berühmte, der zum Soma Gehörige."},{"n":1224,"sa":"girā vajro na sambhṛtaḥ sabalo anapacyutaḥ\nvavakṣa ugro astṛtaḥ","de":"Durch das Lied ist er wie die Keule zusammengefügt, stark, unerschütterlich; er hat es getragen, der Gewaltige, der Unbezwungene."}]},{"num":176,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 11","n_from":1225,"n_to":1227,"title_de":"Soma für Indra: Adhvaryu, Pressung und Seihe","note":"","units":[{"n":1225,"sa":"adhvaryo adribhiḥ sutaṃ somaṃ pavitra ā naya\npunāhīndrāya pātave","de":"Adhvaryu, führe den mit Steinen gepressten Soma zur Seihe hin! Läutere ihn für Indra zum Trinken."},{"n":1226,"sa":"tava tya indo andhaso devā madhorvyāśata\npavamānasya marutaḥ","de":"Von deinem Saft, Indu, haben jene Götter, die Marut, vom Süßen des sich läuternden Soma Besitz ergriffen [?]."},{"n":1227,"sa":"divaḥ pīyūṣamuttamaṃ somamindrāya vajriṇe\nsunotā madhumattamam","de":"Den höchsten Kraftsaft des Himmels, den Soma, presst für Indra, den Keulenträger, den honigreichsten."}]},{"num":177,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 12","n_from":1228,"n_to":1230,"title_de":"Soma Pavamāna: Tragender des Himmels, Hengst unter den Wagenlenkern","note":"","units":[{"n":1228,"sa":"dharttā divaḥ pavate kṛtvyo raso dakṣo devānāmanumādyo nṛbhiḥ\nhariḥ sṛjāno atyo na satvabhirvṛthā pājāṃsi kṛṇuṣe nadīṣvā","de":"Der Träger des Himmels läutert sich, der Saft, der Tatkräftige, der Geschickte unter den Göttern, den Männer sich zum Rausch wünschen [?]; der Falbe, losgelassen wie ein Renner mit den Kräftigen, machst du mühelos die Stärke in den Strömen [?]."},{"n":1229,"sa":"śūro na dhatta āyudhā gabhastyoḥ svā3ḥ siṣāsanrathiro gaviṣṭiṣu\nindrasya śuṣmamīrayannapasyubhirindurhinvāno ajyate manīṣibhiḥ","de":"Wie ein Held fasst er die Waffen in seine Arme, den Gewinn suchend, der Wagenlenker bei den Rinderjagden; Indras Kraft anregend, wird der Indu von den Werktätigen, von den Weisen, angetrieben und geschmückt.","notes":"Wortlaut svā3ḥ: Pluti-Zeichen, Lesart „svaḥ“ (Licht) oder „sva“ unsicher [?]"},{"n":1230,"sa":"indrasya soma pavamāna ūrmiṇā taviṣyamāṇo jaṭhareṣvā viśa\npra naḥ pinva vidyudabhreva rodasī dhiyā no vājāṃ upa māhi śaśvataḥ","de":"Als Indras Woge, Soma, sich läuternd, kräftig werdend, tritt in die Bäuche ein! Schwelle uns an wie Blitz aus Wolken die beiden Welten; mit unserem Gedanken bring uns Kraftgewinne dauerhaft nahe."}]},{"num":178,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 13","n_from":1231,"n_to":1232,"title_de":"Indra: Anruf von allen Himmelsrichtungen","note":"","units":[{"n":1231,"sa":"yadindra prāgapāgudaṅnyagvā hūyase nṛbhiḥ\nsimā purū nṛṣūto asyānave 'si praśardha turvaśe","de":"Wenn du, Indra, nach vorn, rückwärts, nordwärts oder nach unten von Männern gerufen wirst, so bist du, von Männern gestärkt, bei Anu, bei Turvaśa der Überlegene [?]."},{"n":1232,"sa":"yadvā rume ruśame śyāvake kṛpa indra mādayase sacā\nkaṇvāsastvā stomebhirbrahmavāhasa indrā yacchantyā gahi","de":"Oder wenn du bei Ruma, Ruśama, Śyāvaka, Kṛpa, Indra, zusammen mit ihnen dich berauschst – die Kaṇva-Söhne lenken dich mit Preisliedern, die Gebete fahren, hierher; komm herbei, Indra!"}]},{"num":179,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 14","n_from":1233,"n_to":1234,"title_de":"Indra: Soma-Trunk, Herr der Schöpfung","note":"","units":[{"n":1233,"sa":"ubhayaṃ śṛṇavacca na indro arvāgidaṃ vacaḥ\nsatrācyā maghavāntsomapītaye dhiyā śaviṣṭha ā gamat","de":"Beides möge Indra hören, nahe zu uns, dieses unser Wort; der Gabenreiche, zusammen mit den Seinen, möge zum Somatrunk kommen mit Gedanken, du Kraftvollster [?]."},{"n":1234,"sa":"taṃ hi svarājaṃ vṛṣabhaṃ tamojasā dhiṣaṇe niṣṭatakṣatuḥ\nutopamānāṃ prathamo ni ṣīdasi somakāmaṃ hi te manaḥ","de":"Ihn, den Selbstherrscher, den Stier, haben mit Kraft die beiden Schalen [Himmel und Erde] gebildet [?]. Und du sitzt als erster unter den Vergleichbaren; auf Soma ist ja dein Sinn gerichtet."}]},{"num":180,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 15","n_from":1235,"n_to":1237,"title_de":"Soma Pavamāna: Läuterung, Abwehr der Feinde","note":"","units":[{"n":1235,"sa":"pavasva deva āyuṣagindraṃ gacchatu te madaḥ\nvāyumā roha dharmaṇā","de":"Läutere dich, Gott, zum Leben; zu Indra gehe dein Rausch; besteige den Wind mit Halt [?]."},{"n":1236,"sa":"pavamāna ni tośase rayiṃ soma śravāyyam\nindo samudramā viśa","de":"Sich läuternd, stößt du zu, Soma: bring rühmenswerten Reichtum! Indu, tritt in den Ozean ein!"},{"n":1237,"sa":"apaghnanpavase mṛdhaḥ kratuvitsoma matsaraḥ\nnudasvādevayuṃ janam","de":"Die Feinde erschlagend läuterst du dich, Soma, der Kluge [?], der Berauschende; treibe den Menschen weg, der die Götter nicht sucht."}]},{"num":181,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 16","n_from":1238,"n_to":1243,"title_de":"Soma Pavamāna: Reichtum, Ströme und der Träger des Himmels","note":"","units":[{"n":1238,"sa":"abhī no vājasātamaṃ rayimarṣa śataspṛham\nindo sahasrabharṇasaṃ tuvidyumnaṃ vibhāsaham","de":"Ström uns her den beststrebenden Reichtum, der hundertfach ersehnt ist, Indu, der tausendfach trägt, weithin leuchtend, überwältigend."},{"n":1239,"sa":"vayaṃ te asya rādhaso vasorvaso puruspṛhaḥ\nni nediṣṭhatamā iṣaḥ syāma sumne te ādhrigo","de":"Wir möchten deiner Gabe, du Guter unter den Guten, vielbegehrter, die nächstliegenden Labungen sein [?]; in deiner Gunst, Standhafter, möchten wir stehen [?].","notes":"Textzustand fraglich"},{"n":1240,"sa":"pari sya svāno akṣaridinduravye madacyutaḥ\ndhārā ya ūrdhvo adhvare bhrājā na yāti gavyayuḥ","de":"Der Rauschtrank hat sich ringsum ergossen, der Indu durch das Schafhaarsieb, vom Rausch triefend; der Strom, der aufrecht bei der Weihehandlung wie im Glanz dahingeht, nach Rindern verlangend."},{"n":1241,"sa":"pavasva soma mahāntsamudraḥ pitā devānāṃ viśvābhi dhāma","de":"Läutere dich, Soma, du Großer, der Ozean, Vater der Götter, alle Wesensstätten umfassend."},{"n":1242,"sa":"śukraḥ pavasva devebhyaḥ soma dive pṛthivyai śaṃ ca prajābhyaḥ","de":"Leuchtend läutere dich für die Götter, Soma, zum Himmel, zur Erde, und zum Heil den Geschöpfen."},{"n":1243,"sa":"divo dharttāsi śukraḥ pīyūṣaḥ satye vidharmanvājī pavasva","de":"Du bist der Träger des Himmels, leuchtend, Kraftmilch; im Wahren, im Gesetz, du Preisträchtiger, läutere dich."}]},{"num":182,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 18","n_from":1244,"n_to":1246,"title_de":"Agni: Lieblingsgast, Wagen gleich","note":"","units":[{"n":1244,"sa":"preṣṭhaṃ vo atirthiṃ stuṣe mitramiva priyam\nagne rathaṃ na vedyam","de":"Den Liebsten unter euch, den Gast, preise ich, wie einen Freund lieb; Agni, wie einen Wagen, kundig [?]."},{"n":1245,"sa":"kavimiva praśaṃsyaṃ yaṃ devāsa iti dvitā\nni martyeṣvādadhuḥ","de":"Wie einen Seher, preiswürdig, den die Götter zweifach unter den Sterblichen eingesetzt haben."},{"n":1246,"sa":"tvaṃ yaviṣṭha dāśuṣo nR^īṃpāhi śṛṇuhī giraḥ\nrakṣā tokamuta tmanā","de":"Du, Jüngster, schütze die Männer des Spenders, höre die Lieder! Behüte den Sprössling und dich selbst.","notes":"Wortlaut nR^īṃ im Eingabetext verderbt; Lesung „nṝn“ (die Männer) angenommen. Textzustand fraglich"}]},{"num":183,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 19","n_from":1247,"n_to":1249,"title_de":"Indra: Herr des Himmels, Freund und Helfer","note":"","units":[{"n":1247,"sa":"endra no gadhi priya satrājidagohya\ngirirna viśvataḥ pṛthuḥ patirdivaḥ","de":"Komm zu uns her, lieber, ewig siegreicher, nicht zu verbergender, du gleichst allseits einem breiten Berg, Herr des Himmels."},{"n":1248,"sa":"abhi hi satya somapā ubhe babhūtha rodasī\nindrāsi sunvato vṛdhaḥ patirdivaḥ","de":"Denn du bist, wahrhaftiger Somatrinker, beider Welten mächtig geworden; Indra, du bist der Förderer des Pressenden, Herr des Himmels."},{"n":1249,"sa":"tvaṃ hi śaśvatīnāmindra dharttā purāmasi\nhantā dasyormanorvṛdhaḥ patirdivaḥ","de":"Denn du, Indra, bist der Erhalter der ewigen Burgen, der Töter des Dasyu, der Förderer des Manu, Herr des Himmels."}]},{"num":184,"loc":"Prapāṭhaka V, Ardha 1, Gruppe 20","n_from":1250,"n_to":1252,"title_de":"Indra: Burgenbrecher und Vṛtra-Töter","note":"","units":[{"n":1250,"sa":"purāṃ bhinduryuvā kaviramitaujā ajāyata\nindro viśvasya karmaṇo dharttā vajrī puruṣṭutaḥ","de":"Als Burgenbrecher, jung, ein Seher, von unermesslicher Kraft wurde Indra geboren, der Träger jedes Werkes, der Keulenträger, vielgepriesen."},{"n":1251,"sa":"tvaṃ valasya gomato 'pāvaradrivo bilam\ntvāṃ devā abibhyuṣastujyamānāsa āviṣuḥ","de":"Du hast die Höhle des rinderreichen Vala aufgetan, Herr der Presssteine; dich fürchteten die Götter nicht, und angetrieben kamen sie zu dir."},{"n":1252,"sa":"indramīśānamojasābhi stomairanūṣata\nsahasraṃ yasya rātaya uta vā santi bhūyasīḥ","de":"Indra, den Herrscher durch Kraft, haben sie mit Lobgesängen angesungen, dessen Gaben tausend sind, oder auch noch mehr."}]},{"num":185,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 1","n_from":1253,"n_to":1255,"title_de":"Soma Pavamāna: Ozean, Schützer der Welt, Erzeuger des Sonnenlichts","note":"","units":[{"n":1253,"sa":"akrāntsamudraḥ prathame vidharmaṃ janayanprajā bhuvanasya gopāḥ\nvṛṣā pavitre adhi sāno avye bṛhatsomo vāvṛdhe svāno adriḥ","de":"Der Ozean schritt zuerst aus, die Ordnung stiftend, Geschöpfe erzeugend, der Hüter der Welt; der Stier, auf der Schafwoll-Seihe, auf dem Rücken, wuchs, der laut strömende Soma, der Stein [?]."},{"n":1254,"sa":"matsi vāyumiṣṭaye rādhase ca matsi mitrāvaruṇā pūyamānaḥ\nmatsi śardho mārutaṃ matsi devānmatsi dyāvāpṛthivī deva soma","de":"Berausche dich am Vāyu für Opfergabe und Gedeihen, berausche dich, sich läuternd, an Mitra und Varuṇa; berausche dich an der Schar, der Marut-Schar; berausche dich an den Göttern, an Himmel und Erde, göttlicher Soma."},{"n":1255,"sa":"mahattatsomo mahiṣaścakārāpāṃ yadgarbho 'vṛṇīta devān\nadadhādindre pavamāna ojo 'janayatsūrye jyotirinduḥ","de":"Das hat der Soma, der Mächtige, getan, als er, der Keim der Wasser, die Götter erwählte: er legte in Indra, sich läuternd, die Stärke; der Indu erzeugte in der Sonne das Licht."}]},{"num":186,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 2","n_from":1256,"n_to":1265,"title_de":"Soma Pavamāna: „Dieser Gott“ – Wesen und Lauf des Soma (Eṣa-Reihe I)","note":"","units":[{"n":1256,"sa":"eṣa devo amartyaḥ parṇavīriva dīyate\nabhi droṇānyāsadam","de":"Dieser unsterbliche Gott wird wie ein Flügelvogel dahingesandt; er setzt sich in die Holzgefäße."},{"n":1257,"sa":"eṣa viprairabhiṣṭuto 'po devo vi gāhate\ndadhadratnāni dāśuṣe","de":"Dieser Gott, von Sehern angepriesen, taucht in die Wasser ein und bringt dem Spender Schätze."},{"n":1258,"sa":"eṣa viśvāni vāryā śūro yanniva satvabhiḥ\npavamānaḥ siṣāsati","de":"Dieser strebt nach allen erwünschten Gütern, als ob er als Held mit den Tapferen zöge, sich läuternd."},{"n":1259,"sa":"eṣa devo ratharyati pavamāno diśasyati\nāviṣkṛṇoti vagvanum","de":"Dieser Gott, der Wagenlenker, sich läuternd, weist den Weg; er macht die Stimme offenbar [?]."},{"n":1260,"sa":"eṣa devo vipanyubhiḥ pavamāna ṛtāyubhiḥ\nharirvājāya mṛjyate","de":"Dieser Gott wird von den Andächtigen, vom Recht Erstrebenden, sich läuternd, der Falbe, zum Kraftgewinn gereinigt."},{"n":1261,"sa":"eṣa devo vipā kṛto 'ti hvarāṃsi dhāvati\npavamāno adābhyaḥ","de":"Dieser Gott, vom Weisen bereitet, eilt über die Krümmungen hinweg, sich läuternd, unbetrügbar."},{"n":1262,"sa":"eṣa divaṃ vi dhāvati tiro rajāṃsi dhārayā\npavamānaḥ kanikradat","de":"Dieser läuft zum Himmel hin, über die Räume hinweg, in Strömen, sich läuternd, laut brüllend."},{"n":1263,"sa":"eṣa divaṃ vyāsarattiro rajāṃsyaspṛtaḥ\npavamānaḥ svadhvaraḥ","de":"Dieser ist zum Himmel hin gelaufen, über die Räume hinweg, unberührt, sich läuternd, mit guter Weihehandlung."},{"n":1264,"sa":"eṣa pratnena janmanā devo devebhyaḥ sutaḥ\nhariḥ pavitre arṣati","de":"Dieser Gott, nach alter Geburt für die Götter gepresst, strömt als Falber in die Seihe."},{"n":1265,"sa":"eṣa u sya puruvrato jajñāno janayanniṣaḥ\ndhārayā pavate sutaḥ","de":"Dieser da, der Vielgebotige, sich erzeugend, Labungen erzeugend, läutert sich gepresst im Strom."}]},{"num":187,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 3","n_from":1266,"n_to":1273,"title_de":"Soma Pavamāna: „Dieser“ – Weg zu Indras Ort (Eṣa-Reihe II)","note":"","units":[{"n":1266,"sa":"eṣa dhiyā yātyaṇvya śūro rathebhirāśubhiḥ\ngacchannindrasya niṣkṛtam","de":"Dieser kommt mit Verstand, der Held, auf schnellen Wagen, zu Indras Einrichtung gehend [?].","notes":"Wortlaut „aṇvya“ (von den Fingern/Seihe?) unsicher [?]"},{"n":1267,"sa":"eṣa purū dhiyāyate bṛhate devatātaye\nyatrāmṛtāsa āśata","de":"Dieser schafft sich vielfach Gedanken, zur hohen Götterverehrung, dort, wo die Unsterblichen Anteil haben [?]."},{"n":1268,"sa":"etaṃ mṛjanti marjyamupa droṇeṣvāyavaḥ\npracakrāṇaṃ mahīriṣaḥ","de":"Diesen, den zu Läuternden, reinigen die Menschen in den Holzgefäßen, der große Labungen bewirkt hat."},{"n":1269,"sa":"eṣa hito vi nīyate 'ntaḥ śundhyāvatā pathā\nyadī tuñjanti bhūrṇayaḥ","de":"Dieser wird, angetrieben, auf dem reinigenden Pfad hindurchgeführt, wenn die Regsamen ihn treiben [?]."},{"n":1270,"sa":"eṣa rukmibhirīyate vāji śubhrebhiraṃśubhiḥ\npatiḥ sindhūnāṃ bhavan","de":"Dieser eilt, der Preisgewinner, mit goldgeschmückten, glänzenden Halmen [?], der Herr der Ströme werdend."},{"n":1271,"sa":"eṣa śṛṅgāṇi dodhuvacchiśīte yūthyo3 vṛṣā\nnṛmṇā dadhāna ojasā","de":"Dieser schüttelt seine Hörner und schärft sie, der Stier der Herde, Mannhaftigkeit mit Kraft tragend."},{"n":1272,"sa":"eṣa vasūni pibdanaḥ paruṣā yayivāṃ ati\nava śādeṣu gacchati","de":"Dieser, Güter zermalmend, ist über Rauhes hinweggegangen; er geht hinab in die Schilfe."},{"n":1273,"sa":"etamu tyaṃ daśa kṣipo hariṃ hivanti yātave\nsvāyudhaṃ madintamam","de":"Diesen da, den Falben, treiben die zehn Finger zum Gehen, den gut Bewaffneten, den Berauschendsten."}]},{"num":188,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 4","n_from":1274,"n_to":1279,"title_de":"Soma Pavamāna: „Dieser“ – Rennwagen, Falke und die zehn Finger (Eṣa-Reihe III)","note":"","units":[{"n":1274,"sa":"eṣa u sya vṛṣā ratho 'vyā vārebhiravyata\ngacchanvājaṃ sahasriṇam","de":"Dieser da, der Stier, der Wagen, ist durch die Schafhaarsiebe eingehüllt worden, tausendfältigen Gewinn erstrebend."},{"n":1275,"sa":"etaṃ tritasya yoṣaṇo hariṃ hinvantyadribhiḥ\nindumindrāya pītaye","de":"Diesen falben Indu treiben Tritas Frauen mit Pressteinen für Indra zum Trinken."},{"n":1276,"sa":"eṣa sya mānuṣīṣvā śyeno na vikṣu sīdati\ngacchaṃ jāro na yoṣitam","de":"Dieser da setzt sich unter den Menschen-Stämmen nieder wie ein Falke, wie ein Buhler, der zur Frau geht."},{"n":1277,"sa":"eṣa sya madyo raso 'va caṣṭe divaḥ śiśuḥ\nya indurvāramāviśat","de":"Dieser da, der berauschende Saft, blickt herab, des Himmels Kind, der Indu, der in die Seihe eingetreten ist."},{"n":1278,"sa":"eṣa sya pītaye suto harirarṣati dharṇasiḥ\nkrandanyonimabhi priyam","de":"Dieser da, gepresst zum Trinken, strömt als Falber, der Tragende, brüllend zum lieben Schoß."},{"n":1279,"sa":"etaṃ tyaṃ harito daśa marmṛjyante apasyuvaḥ\nyābhirmadāya śumbhate","de":"Diesen da, den Falben, säubern die zehn Fingerkräfte, die werktätigen, mit denen er sich zum Rausch schmückt."}]},{"num":189,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 5","n_from":1280,"n_to":1281,"title_de":"Soma Pavamāna: der Renner in der Seihe","note":"","units":[{"n":1280,"sa":"eṣa vājī hito nṛbhirviśvavinmanasaspatiḥ\navyo vāraṃ vi dhāvati","de":"Dieser Renner, von den Männern angetrieben, allwissend, der Herr des Geistes, läuft durch das Schafhaarsieb."},{"n":1281,"sa":"eṣa pavitre akṣaratsomo devebhyaḥ sutaḥ\nviśvā dhāmānyāviśan","de":"Dieser Soma strömte in die Seihe, für die Götter gepresst, alle Wesensstätten betretend."}]},{"num":190,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 6","n_from":1282,"n_to":1282,"title_de":"Soma: der unsterbliche Vṛtra-Töter","note":"","units":[{"n":1282,"sa":"eṣa devaḥ śubhāyate 'dhi yonāvamartyaḥ\nvṛtrahā devavītamaḥ","de":"Dieser Gott schmückt sich im Schoß, der Unsterbliche, der Vṛtra-Töter, der den Göttern Liebste."}]},{"num":191,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 7","n_from":1283,"n_to":1283,"title_de":"Soma: brüllender Stier zu den Holzgefäßen","note":"","units":[{"n":1283,"sa":"eṣa vṛṣā kanikradaddaśabhirjāmibhiryataḥ\nabhi droṇāni dhāvati","de":"Dieser Stier, laut brüllend, von den zehn Schwestern gelenkt, läuft zu den Holzgefäßen."}]},{"num":192,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 8","n_from":1284,"n_to":1284,"title_de":"Soma lässt die Sonne leuchten","note":"","units":[{"n":1284,"sa":"eṣa sūryamarocayatpavamāno adhi dyavi\npavitre matsaro madaḥ","de":"Dieser ließ die Sonne leuchten, sich läuternd, am Himmel; in der Seihe ist er der Berauschende, der Rausch."}]},{"num":193,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 9","n_from":1285,"n_to":1285,"title_de":"Soma und die Sonne","note":"","units":[{"n":1285,"sa":"eṣa sūryeṇa hāsate saṃvasāno vivasvatā\npatirvāco adābhyaḥ","de":"Dieser kommt mit der Sonne mit, mit Vivasvat sich kleidend, der Herr der Rede, unbetrügbar.","notes":"Vivasvat: hier als Beiname der Sonne bzw. des Morgenglanzes"}]},{"num":194,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 6","n_from":1286,"n_to":1291,"title_de":"Soma Pavamāna: Seher und Feindvertreiber","note":"","units":[{"n":1286,"sa":"eṣa kavirabhiṣṭutaḥ pavitre adhi tośate\npunāno ghnannapa dviṣaḥ","de":"Dieser Seher, gepriesen, wird auf der Seihe angetrieben, sich läuternd, die Feinde wegschlagend."},{"n":1287,"sa":"eṣa indrāya vāyave svarjitpari ṣicyate\npavitre dakṣasādhanaḥ","de":"Dieser wird für Indra und Vāyu, licht-gewinnend, ringsum in die Seihe gegossen, der die Tatkraft Wirkende."},{"n":1288,"sa":"eṣa nṛbhirvi nīyate divo mūrdhā vṛṣā sutaḥ\nsomo vaneṣu viśvavit","de":"Dieser wird von den Männern hinweggeführt, der Scheitel des Himmels, der gepresste Stier, Soma, in den Hölzern allwissend."},{"n":1289,"sa":"eṣa gavyuracikradatpavamāno hiraṇyayuḥ\ninduḥ satrājidastṛtaḥ","de":"Dieser, nach Rindern verlangend, hat gebrüllt, sich läuternd, goldbegierig, der Indu, überall siegreich, unbezwungen."},{"n":1290,"sa":"eṣa śuṣmyasiṣyadadantarikṣe vṛṣā hariḥ\npunāna indurindramā","de":"Dieser Kraftvolle strömte in den Luftraum, der Stier, der Falbe; der sich läuternde Indu zu Indra hin."},{"n":1291,"sa":"eṣa śuṣmyadābhyaḥ somaḥ punāno arṣati\ndevāvīraghaśaṃsahā","de":"Dieser kraftvolle, unbetrügbare Soma strömt sich läuternd, die Götter beschützend, Unheilsprecher tötend."}]},{"num":195,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 7","n_from":1292,"n_to":1297,"title_de":"Soma: „Er“ – der gepresste Stier tötet Rakṣas","note":"","units":[{"n":1292,"sa":"sa sutaḥ pītaye vṛṣā somaḥ pavitre arṣati\nvighnanrakṣāṃsi devayuḥ","de":"Er, gepresst zum Trinken, der Stier, Soma, strömt in die Seihe, die Rakṣas zerschlagend, die Götter suchend."},{"n":1293,"sa":"sa pavitre vicakṣaṇo harirarṣati dharṇasiḥ\nabhi yoniṃ kanikradat","de":"Er, in der Seihe der Weitblickende, strömt als Falber, der Tragende, brüllend zum Schoß hin."},{"n":1294,"sa":"sa vājī rocanā divaḥ pavamāno vi dhāvati\nrakṣohā vāramavyayam","de":"Er, der Renner, läuft sich läuternd durch die Lichträume des Himmels, der Rakṣas-Töter, zum Schafhaarsieb [?]."},{"n":1295,"sa":"sa tritasyādhi sānavi pavamāno arocayat\njāmibhiḥ sūryaṃ saha","de":"Er ließ, sich läuternd, auf Tritas Rücken die Sonne leuchten, zusammen mit den Schwestern."},{"n":1296,"sa":"sa vṛtrahā vṛṣā suto varivovidadābhyaḥ\nsomo vājamivāsarat","de":"Er, der Vṛtra-Töter, der gepresste Stier, der Raum findet, unbetrügbar, Soma, ist wie zum Kraftgewinn hingeströmt."},{"n":1297,"sa":"sa devaḥ kavineṣito3 'bhi droṇāni dhāvati\nindurindrāya maṃhayan","de":"Er, der Gott, vom Seher angetrieben, läuft zu den Holzgefäßen, der Indu, Indra erfreuend.","notes":"Wortlaut kavineṣito3: Pluti-Zeichen"}]},{"num":196,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 8","n_from":1298,"n_to":1303,"title_de":"Pāvamānī-Verse: Lohn des Lernens der Läuterungsverse","note":"Jüngere Zusatzverse in Prosa-ähnlicher Metrik zum Lob der Pāvamānī-Hymnen, keine Ṛgveda-Parallelen.","units":[{"n":1298,"sa":"yaḥ pāvamānīradhyetyṛṣibhiḥ sambhṛtaṃ rasam\nsarvaṃ sa pūtamaśnāti svaditaṃ mātariśvanā","de":"Wer die Pāvamānī-Verse liest, den von den Sehern gesammelten Saft, der isst alles Gereinigte, von Mātariśvan Gewürzte."},{"n":1299,"sa":"pāvamānīryo adhyetyṛṣibhiḥ sambhṛtaṃ rasam\ntasmai sarasvatī duhe kṣīraṃ sarpirmadhūdakam","de":"Wer die Pāvamānī-Verse liest, den von Sehern gesammelten Saft, für den lässt Sarasvatī Milch, Schmelzbutter, Honig und Wasser fließen."},{"n":1300,"sa":"pāvamānīḥ svastyayanīḥ sudughā hi ghṛtaścutaḥ\nṛṣibhiḥ saṃbhṛto raso brāhmaṇeṣvamṛtaṃ hitam","de":"Die Pāvamānī-Verse, heilbringend, gut melkend, Schmelzbutter träufelnd: der von den Sehern gesammelte Saft ist bei den Brahmanen als Unsterblichkeit niedergelegt."},{"n":1301,"sa":"pāvamānīrdadhantu na imaṃ lokamatho amum\nkāmāntsamardhayantu no devīrdevaiḥ samāhṛtāḥ","de":"Die Pāvamānī-Verse mögen uns diese Welt und jene dort schenken; unsere Wünsche mögen sie gelingen lassen, die göttlichen, von den Göttern zusammengeführten."},{"n":1302,"sa":"yena devāḥ pavitreṇātmānaṃ punate sadā\ntena sahasradhāreṇa pāvamānīḥ punantu naḥ","de":"Mit der Seihe, mit der die Götter sich stets selbst läutern, mit dieser tausendströmigen mögen die Pāvamānī-Verse uns läutern."},{"n":1303,"sa":"pāvamānīḥ svastyayanīstābhirgacchati nāndanam\npuṇyāṃśca bhakṣānbhakṣayatyamṛtatvaṃ ca gacchati","de":"Durch die Pāvamānī-Verse, die heilbringenden, geht man in den Nandana-Hain; man genießt reine Speisen und geht zur Unsterblichkeit.","notes":"Nandana: Indras Lustgarten"}]},{"num":197,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 9","n_from":1304,"n_to":1306,"title_de":"Agni: Verehrung dem Jüngsten, Schützer vor Unheil","note":"","units":[{"n":1304,"sa":"aganma mahā namasā yaviṣṭhaṃ yo dīdāya samiddhaḥ sve duroṇe\ncitrabhānuṃ rodasī antarurvī svāhutaṃ viśvataḥ pratyañcam","de":"Wir sind mit großer Verehrung zum Jüngsten gekommen, der entzündet in seinem eigenen Haus geleuchtet hat, dem Buntstrahligen, der zwischen den beiden weiten Welten steht, gut geopfert, allseits zugewandt."},{"n":1305,"sa":"sa mahnā viśvā duritāni sāhvānagni ṣṭave dama ā jātavedāḥ\nsa no rakṣiṣadduritādavadyādasmāngṛṇata uta no maghonaḥ","de":"Er, mit Größe alle Missgeschicke überwältigend, Agni, wird im Haus gepriesen, Jātavedas. Er soll uns vor Missgeschick und Tadel schützen, uns Lobsänger und unsere Gabenherren."},{"n":1306,"sa":"tvaṃ varuṇa uta mitro agne tvāṃ vardhanti matibhirvasiṣṭhāḥ\ntve vasu suṣaṇanāni santu yūyaṃ pāta svastibhiḥ sadā naḥ","de":"Du, Agni, bist Varuṇa und Mitra; dich stärken die Vasiṣṭhas mit Gedanken. In dir sollen Güter gut erlangbar sein; ihr, schützt uns stets mit Wohlfahrt!"}]},{"num":198,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 10","n_from":1307,"n_to":1309,"title_de":"Indra: Wachstum durch Lieder der Kaṇvas","note":"","units":[{"n":1307,"sa":"mahāṃ indro ya ojasā parjanyo vṛṣṭimāṃ iva\nstomairvatsasya vāvṛdhe","de":"Groß ist Indra durch seine Kraft, wie Parjanya, der Regenreiche; durch die Lieder des Vatsa wuchs er."},{"n":1308,"sa":"kaṇvā indraṃ yadakrata stomairyajñasya sādhanam\njāmi bruvata āyudhā","de":"Als die Kaṇvas Indra durch Lieder zum Vollbringer der Weihehandlung machten, sprachen sie unverblümt „Waffen“ [?]."},{"n":1309,"sa":"prajāmṛtasya piprataḥ pra yadbharanta vahnayaḥ\nviprā ṛtasya vāhasā","de":"Sie brachten die Nachkommenschaft des Rechten, die ihn erfreut, hervor, als die Fahrer Gaben darbrachten, die Weisen mit dem Gefährt des Rechten [?]."}]},{"num":199,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 11","n_from":1310,"n_to":1312,"title_de":"Soma Pavamāna: Falber, Wagenkämpfer, Gabenträger","note":"","units":[{"n":1310,"sa":"pavamānasya jighnato hareścandrā asṛkṣata\njīrā ajiraśociṣaḥ","de":"Vom sich läuternden, schlagenden Falben sind strahlende Tropfen ausgegangen, die Regsamen, mit raschem Glanz."},{"n":1311,"sa":"pavamāno rathītamaḥ śubhrebhiḥ śubhraśastamaḥ\nhariścandro marudgaṇaḥ","de":"Der sich läuternde Beste der Wagenlenker, mit den Glänzenden der Glänzendst-Gepriesene, der Falbe, der Goldene, mit der Marut-Schar."},{"n":1312,"sa":"pavamān vyaśnuhi raśmibhirvājasātamaḥ\ndadhatstotre suvīryam","de":"Sich läuternd, durchdringe mit den Strahlen, der Kraftgewinn-Beste, dem Sänger gute Manneskraft verleihend."}]},{"num":200,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 12","n_from":1313,"n_to":1315,"title_de":"Soma-Pressung: Gießt den Soma rings herum","note":"","units":[{"n":1313,"sa":"parīto ṣiñcatā sutaṃ somo ya uttamaṃ haviḥ\ndadhanvāṃ yo naryo apsvā3ntarā suṣāva somamadribhiḥ","de":"Gießt ringsum den gepressten Soma aus, der die höchste Darbringung ist, der Männliche, der sich in den Wassern hält [?]; er hat den Soma mit den Presssteinen gepresst."},{"n":1314,"sa":"nūnaṃ punāno 'vibhiḥ pari sravādabdhaḥ surabhintaraḥ\nsute citvāpsu madāmo andhasā śrīṇanto gobhiruttaram","de":"Ströme jetzt, geläutert durch die Schafwollsiebe, unangreifbar, der Wohlriechendste; im gepressten [Soma] wollen wir in den Wassern uns am Rauschtrank erfreuen, ihn mit Milch als dem Höchsten mischend [?]."},{"n":1315,"sa":"pari svānaścakṣase devamādanaḥ kraturindurvicakṣaṇaḥ","de":"Der Saft [Indu] ist strahlend rings zum Schauen, der Götter Berauscher, die Kraft, der Tropfen, weitschauend."}]},{"num":201,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 13","n_from":1316,"n_to":1318,"title_de":"Soma, der rötliche Tropfen, strömt durch das Sieb","note":"","units":[{"n":1316,"sa":"asāvi somo aruṣo vṛṣā harī rājeva dasmo abhi gā acikradat\npunāno vāramatyeṣyavyayaṃ śyeno na yoniṃ ghṛtavantamāsadat","de":"Gepresst ist der rötliche Soma, der Stier, der Falbe; wie ein König, der Wunderbare, hat er zu den Kühen hin gebrüllt. Geläutert wird er durch das Schafhaarsieb, dem unvergänglichen, hinstreben und sich wie ein Falke in den butterreichen Sitz setzen."},{"n":1317,"sa":"parjanyaḥ pitā mahiṣasya parṇino nābhā pṛthivyā giriṣu kṣayaṃ dadhe\nsvasāra āpo abhi gā udāsarantsaṃ grāvabhirvasate vīte adhvare","de":"Parjanya ist Vater des Mächtigen, des Beflügelten [?]; im Nabel der Erde, auf den Bergen, hat er seine Wohnstatt gelegt. Die Schwestern, die Wasser, sind zu den Kühen hin herausgeströmt; mit den Presssteinen zusammen wohnt er in der [vom Ruf] gekommenen Weihehandlung.","notes":"Textzustand und Bezug von „Parjanya“ auf den Soma unsicher"},{"n":1318,"sa":"kavirvedhasyā paryeṣi māhinamatyo na mṛṣṭo abhi vājamarṣasi\napasedhanduritā soma no mṛḍa ghṛtā vasānaḥ pari yāsi nirṇijam","de":"Als Seher gehst du um die Stätten des Schöpfers herum, um das Erhabene; wie ein gestriegeltes Ross strömst du dem Gewinn zu. Wehre Bedrängnisse ab, Soma, sei uns gnädig; in Fett gekleidet gehst du ringsum zur Reinigungsstätte [?]."}]},{"num":202,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 14","n_from":1319,"n_to":1320,"title_de":"Indra: Gaben der Freigebigkeit","note":"","units":[{"n":1319,"sa":"śrāyanta iva sūryaṃ viśvedindrasya bhakṣata\nvasūni jāto janimānyojasā prati bhāgaṃ na dīdhimaḥ","de":"Wie Menschen, die zur Sonne streben [?], habt ihr alle an Indra Anteil. Als Geborener [der Geborene] gewinnt er Güter mit Kraft; wir sinnen [?] auf unseren Anteil.","notes":"Wortlaut schwierig; „śrāyantaḥ“ unsicher"},{"n":1320,"sa":"alarṣirātiṃ vasudāmupa stuhi bhadrā indrasya rātayaḥ\nyo asya kāmaṃ vidhato na roṣati mano dānāya codayan","de":"Preise den Freigebigen, der Güter schenkt, den Spender von Schätzen; gut sind Indras Gaben. Wer seinem Wunsch, dem Verehrenden, nicht zürnt, sondern den Sinn auf das Schenken lenkt, [den preise]."}]},{"num":203,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 15","n_from":1321,"n_to":1322,"title_de":"Indra: Furchtlosigkeit und Beistand","note":"","units":[{"n":1321,"sa":"yata indra bhayāmahe tato no abhyaṃ kṛdhi\nmaghavanchagdhi tava tanna ūtaye vi dviṣo vi mṛdho jahi","de":"Woher wir uns fürchten, von dort mache uns furchtlos, o Indra. Freigebiger, hilf [uns]; das Deine ist unser Beistand; schlage die Feinde weit weg, schlage die Bedränger weg."},{"n":1322,"sa":"tvaṃ hi rādhaspate rādhaso mahaḥ kṣayasyāsi vidhrattā\ntaṃ tvā vayaṃ maghavannindra girvaṇaḥ sutāvanto havāmahe","de":"Denn du, Herr der Gabe, bist Halter [Stütze] des großen Reichtums, der [großen] Wohnstätte. Dich, den Freigebigen, Indra, dich, Lobesliebenden, rufen wir, die wir gepresst haben."}]},{"num":204,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 16","n_from":1323,"n_to":1325,"title_de":"Soma: Strömender Tropfen","note":"","units":[{"n":1323,"sa":"tvaṃ somāsi dhārayurmandra ojiṣṭho adhvare\npavasva maṃhayadrayiḥ","de":"Du bist Soma, ein Erhalter, der Erfreuende, der Kraftvollste in der Weihehandlung. Strömlauf, reichlich Besitz spendend."},{"n":1324,"sa":"tvaṃ suto madintamo dadhanvānmatsarintamaḥ\ninduḥ satrājidastṛtaḥ","de":"Du, der Gepresste, der Berauschendste, den Festhaltenden, der Ergötzendste [?], der Tropfen, der stets siegreiche, unbezwungene.","notes":"Grammatik der Anfangswörter unsicher"},{"n":1325,"sa":"tvaṃ suṣvāṇo adribhirabhyarṣa kanikradat\ndyumantaṃ śuṣmā bhara","de":"Du, der du mit den Presssteinen gepresst wirst, strömst brüllend heran; bringe glänzende Stärke."}]},{"num":205,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 17","n_from":1326,"n_to":1328,"title_de":"Soma: Strömen zum Kelch","note":"","units":[{"n":1326,"sa":"pavasva devavītaya indo dhārābhirojasā\nā kalaśaṃ madhumāntsoma naḥ sadaḥ","de":"Strömlauf, Saft, zum Herbeiholen der Götter, mit Strömen, mit Kraft; komm zum Kelch, honigreicher Soma, setze dich zu uns."},{"n":1327,"sa":"tava drapsā udapruta indraṃ madāya vāvṛdhuḥ\ntvāṃ devāso amṛtāya kaṃ papuḥ","de":"Deine Tropfen, die im Wasser aufspringen, haben Indra zum Rausch gestärkt. Dich haben die Götter zur Unsterblichkeit getrunken, wohl [?]."},{"n":1328,"sa":"ā naḥ sutāsa indavaḥ punānā dhāvatā rayim\nvṛṣṭidyāvo rītyāpaḥ svarvidaḥ","de":"Ihr gepressten Säfte, geläutert, eilt zu uns her mit Reichtum, ihr Regen bringenden, in Bächen fließenden Wasser, Licht Findenden [?]."}]},{"num":206,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 18","n_from":1329,"n_to":1331,"title_de":"Soma: Der Falbe im Sieb, für Indra gepresst","note":"","units":[{"n":1329,"sa":"pari tyaṃ haryataṃ hariṃ babhruṃ punanti vāreṇa\nyo devānviśvāṃ itpari madena saha gacchati","de":"Den Ersehnten, den Falben, den Braunen läutern sie mit dem Haarsieb rings; der zu allen Göttern ringsum mit dem Rausch zusammen geht."},{"n":1330,"sa":"dviryaṃ pañca svayaśasaṃ sakhāyo adrisaṃhatam\npriyamindrasya kāmyaṃ prasnāpayanta ūrmayaḥ","de":"Die zweimal Fünf [Finger], die Freunde, [reinigen] den aus eigener Kraft ruhmvollen, mit Steinen zerstoßenen, Indra lieben und begehrten [Soma]; die Wellen lassen [ihn] baden.","notes":"Zählung „zweimal fünf“ = zehn Finger [Anm.: gedeutet]; Wortlaut unsicher [?]"},{"n":1331,"sa":"indrāya soma pātave vṛtraghne pari ṣicyase\nnare ca dakṣiṇāvate vīrāya sadanāsade","de":"Für Indra, o Soma, wirst du zum Trinken ringsum ausgegossen, für den Vṛtra-Töter, und für den Mann, der Opfergaben austeilt, den Helden, an seinem Sitzplatz."}]},{"num":207,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 19","n_from":1332,"n_to":1334,"title_de":"Soma: Strömen für Kraft und Glanz","note":"","units":[{"n":1332,"sa":"pavasva soma mahe dakṣāyāśvo na nikto vājī dhanāya","de":"Strömlauf, Soma, für große Geschicklichkeit, wie ein gewaschenes Ross, ein Renner, für Gewinn."},{"n":1333,"sa":"pra te sotāro rasaṃ madāya punanti somaṃ mahe dyumnāya","de":"Deine Presser läutern deinen Saft zum Rausch, den Soma zu großem Glanz."},{"n":1334,"sa":"śiśuṃ jajñānaṃ hariṃ mṛjanti pavitre somaṃ devebhya indum","de":"Das neugeborene Kind, den Falben, reinigen sie im Sieb, den Soma, den Saft, für die Götter."}]},{"num":208,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 20","n_from":1335,"n_to":1337,"title_de":"Soma: Der Morgen und das Kalb","note":"","units":[{"n":1335,"sa":"uṣo ṣu jātamapturaṃ gobhirbhaṅgaṃ pariṣkṛtam\ninduṃ devā ayāsiṣuḥ","de":"Zur Morgenröte hin [?] ist der wasserdurchdringende, mit Milch bereitete, gebrochene [?] Saft; ihn sind die Götter angegangen.","notes":"[Anm.: „bhaṅgam“ unsicher; Wortlaut fraglich]"},{"n":1336,"sa":"tamidvardhantu no giro vatsaṃ saṃśiśvarīriva\nya indrasya hṛdaṃsaniḥ","de":"Ihn sollen unsere Lieder stärken, wie [Kühe] das Kalb, wie Mütter ihr Junges; er, der Indras Herz gewinnt."},{"n":1337,"sa":"arṣā naḥ soma śaṃ gave dhukṣasva pipyuṣīmiṣam\nvardhā samudramukthyam","de":"Strömlauf uns, Soma, Wohlstand für die Kuh; melke die schwellende Kraftspeise; lass das Meer wachsen, das des Lobes würdige."}]},{"num":209,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 21","n_from":1338,"n_to":1340,"title_de":"Indra, der junge Freund derer, die das Feuer entzünden","note":"","units":[{"n":1338,"sa":"ā ghā ye agnimindhate stṛṇanti barhirānuṣak\nyeṣāmindro yuvā sakhā","de":"Fürwahr, die das Feuer entzünden, das Streu der Reihe nach ausbreiten, deren junger Freund Indra ist –"},{"n":1339,"sa":"bṛhannididhma eṣāṃ bhūri śastraṃ pṛthuḥ svaruḥ\nyeṣāmindro yuvā sakhā","de":"Groß ist ihr Brennholz, viel [ihr] Preisspruch, breit der Opferpfahl [?]; deren junger Freund Indra ist –","notes":"„svaruḥ“: Opferpfosten oder Splitter [?]"},{"n":1340,"sa":"ayuddha idyudhā vṛtaṃ śūra ājati satvabhiḥ\nyeṣāmindro yuvā sakhā","de":"Der ungekämpfte, der kämpfend umzingelt [?]; der Held treibt mit den Kräftigen [vor]; deren junger Freund Indra ist –","notes":"Textzustand fraglich"}]},{"num":210,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 22","n_from":1341,"n_to":1343,"title_de":"Indra: Der Einzige, der Güter verteilt","note":"","units":[{"n":1341,"sa":"ya eka idvidayate vasu marttāya dāśuṣe\nīśāno apratiṣkuta indro aṅga","de":"Der als Einziger dem opfernden Sterblichen Güter zuteilt, der Herrscher, der Unabwehrbare, [er ist] Indra, ja."},{"n":1342,"sa":"yaściddhi tvā bahubhya ā sutāvāṃ āvivāsati\nugraṃ tatpatyate śava indro aṅga","de":"Und wer immer dich als Gepresster-habender aus vielen [Bewerbern] erbittet [?], dessen Stärke, die gewaltige, gedeiht: Indra, ja."},{"n":1343,"sa":"kadā marttamarādhasaṃ padā kṣumpamiva sphurat\nkadā naḥ śuśravadgira indro aṅga","de":"Wann wird er den Sterblichen ohne Gabe wie einen Pilz [?] mit dem Fuß zertreten? Wann wird er unsere Lieder hören: Indra, ja.","notes":"„kṣumpa“: Pilz/Schwamm [?]"}]},{"num":211,"loc":"Prapāṭhaka V, Ardha 2, Gruppe 23","n_from":1344,"n_to":1346,"title_de":"Indra: Sänger, Lieder und die Rosse","note":"","units":[{"n":1344,"sa":"gāyanti tvā gāyatriṇo 'rcantyarkamarkiṇaḥ\nbrahmāṇastvā śatakrata udvaṃśamiva yemire","de":"Dich singen die Gāyatrī-Sänger, dich preisen die Preisenden mit Preislied; die Brahmanen haben dich, Hundertkräftiger, wie eine Stange emporgehalten."},{"n":1345,"sa":"yatsānoḥ sānvāruho bhūryaspaṣṭa karttvam\ntadindro arthaṃ cetati yūthena vṛṣṇirejati","de":"Wenn du von Gipfel zu Gipfel steigst, so viel Tat hast du deutlich getan; da nimmt Indra das Ziel wahr; mit der Schar bewegt sich der Stier.","notes":"[Anm.: Bezug auf den Berg als Ziel unsicher]"},{"n":1346,"sa":"yuṅkṣvā hi keśinā harī vṛṣaṇā kakṣyaprā\nathā na indra somapā girāmupaśrutiṃ cara","de":"Spanne die beiden langmähnigen, männlichen Falben an, die das Zugseil füllen; dann, o Indra, Somatrinker, komm zu unserem Lied, das du erhörst."}]},{"num":212,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 1","n_from":1347,"n_to":1350,"title_de":"Āprī-Verse: Agni zur Weihehandlung","note":"Āprī-Reihe (Agni, Tanūnapāt, Narāśaṃsa).","units":[{"n":1347,"sa":"suṣamiddho na ā vaha devāṃ agne haviṣmate\nhotaḥ pāvaka yakṣi ca","de":"Gut entzündet, führe für uns die Götter herbei, Agni, zu dem, der die Opfergabe hat; Rufer, Läuternder, verehre [sie] auch."},{"n":1348,"sa":"madhumantaṃ tanūnapādyajñaṃ deveṣu naḥ kave\nadyā kṛṇuyhūtaye","de":"Den honigreichen Tanūnapāt [Sohn seiner selbst], die Weihehandlung unter den Göttern, mache uns heute, Seher, zum Anruf.","notes":"[Anm.: Satzbau elliptisch; „yajñam“ als Objekt gefasst]"},{"n":1349,"sa":"narāśaṃsamiha priyamasminyajña upa hvaye\nmadhujihvaṃ haviṣkṛtam","de":"Den Narāśaṃsa [Männerpreis], den Lieben, rufe ich hier bei dieser Weihehandlung an, den Honigzüngigen, der die Opfergabe bereitet."},{"n":1350,"sa":"agne sukhatame rathe devāṃ īḍita ā vaha\nasi hotā manurhitaḥ","de":"Agni, auf dem gar bequemen Wagen führe, angerufen, die Götter herbei; du bist der Rufer, von Manu eingesetzt."}]},{"num":213,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 2","n_from":1351,"n_to":1353,"title_de":"Götter: Mitra, Aryaman, Savitṛ, Bhaga, Aditi","note":"","units":[{"n":1351,"sa":"yadadya sūra udite 'nāgā mitro aryamā\nsuvāti savitā bhagaḥ","de":"Wenn heute bei aufgegangener Sonne Mitra und Aryaman uns schuldlos [sprechen] und Savitṛ und Bhaga es antreiben [?],","notes":"Satzstruktur mit 1352 verbunden; Text fraglich"},{"n":1352,"sa":"suprāvīrastu sa kṣayaḥ pra nu yāmantsudānavaḥ\nye no aṃho 'tipiprati","de":"so soll jene Wohnstatt reich an Helden sein; sie sollen nun auf ihrem Weg, die guten Geber, die uns über die Bedrängnis hinüberbringen."},{"n":1353,"sa":"uta svarājo aditiradabdhasya vratasya ye\nmaho rājāna īśate","de":"Und die Selbstherrscher, Aditi, die des unbetrügbaren Gesetzes: die großen Könige walten."}]},{"num":214,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 3","n_from":1354,"n_to":1356,"title_de":"Indra: Rausch und Verwerfung der Kargen","note":"","units":[{"n":1354,"sa":"u tvā mandantu somāḥ kṛṇuṣva rādho adrivaḥ\nava brahmadviṣo jahi","de":"Dich sollen die Somasäfte erfreuen; schaffe Freigebigkeit [Gabe], Steinträger; schlage die Brahman-Hasser nieder."},{"n":1355,"sa":"padā paṇīnarādhaso ni bādhasva mahāṃ asi\nna hi tvā kaśca na prati","de":"Mit dem Fuß drücke die Paṇis, die ohne Gabe sind, nieder; du bist groß. Denn keiner ist dir gewachsen."},{"n":1356,"sa":"tvamīśiṣe sutānāmindra tvamasutānām\ntvaṃ rājā janānām","de":"Du gebietest über die Gepressten, Indra, du über die Ungepressten; du bist der König der Völker."}]},{"num":215,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 4","n_from":1357,"n_to":1359,"title_de":"Soma: Der wache Seher im Sieb","note":"","units":[{"n":1357,"sa":"ā jāgṛvirvipra ṛtāṃ matīnāṃ somaḥ punāno asadaccamūṣu\nsapanti yaṃ mithunāso nikāmā adhvaryavo rathirāsaḥ suhastāḥ","de":"Der wache Seher der Wahrheitsgedanken, Soma, geläutert, hat sich in den Bechern niedergelassen; ihn, den die Paare mit Verlangen bedienen, die Adhvaryus, die Wagenlenker [?], die mit guten Händen.","notes":"„rathirāsaḥ“ unsicher"},{"n":1358,"sa":"sa punāna upa sūre dadhāna obe aprā rodasī vi ṣa āvaḥ\npriyā cidyasya priyasāsa ūtī sato dhanaṃ kāriṇe na pra yaṃsat","de":"Er, geläutert, hat die Sonne zu sich genommen [?]; er hat beide Welten erfüllt und aufgeschlossen. Dessen Hilfen, auch dem Lieben, der lieb ist [?], wird er dem Sänger den Besitz des Wesens nicht versagen.","notes":"Wortlaut schwierig [?]"},{"n":1359,"sa":"sa vardhitā vardhanaḥ pūyamānaḥ somo mīḍhvāṃ abhi no jyotiṣāvīt\nyatra naḥ pūrve pitaraḥ padajñāḥ svarvido abhi gā adrimiṣṇan","de":"Er, der Mehrende, der Stärkende, geläutert, der Soma, der Spender, hat uns mit Licht beschützt; dort, wo unsere Vorväter, die den Weg kannten, das Licht findend, die Kühe aus dem Fels heraus [?] aufsuchten."}]},{"num":216,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 5","n_from":1360,"n_to":1361,"title_de":"Indra: Preis des Stiers","note":"","units":[{"n":1360,"sa":"mā cidanyadvi śaṃsata sakhāyo mā riṣaṇyata\nindramitstotā vṛṣaṇaṃ sacā sute muhurukthā ca śaṃsata","de":"Nicht anderes sollt ihr sagen, Freunde, und richtet euch nicht zugrunde; nur Indra, den Stier, preise, Sänger, zusammen beim Pressen; ja, immer wieder sprecht Lobsprüche."},{"n":1361,"sa":"avakrakṣiṇaṃ vṛṣabhaṃ yathā juvaṃ gāṃ na carṣaṇīsaham\nvidveṣaṇaṃ saṃvananamubhayaṅkaraṃ maṃhiṣṭhamubhayāvinam","de":"Den [Indra], der [Widersacher] niederstreckt [?], wie einen schnellen Stier, wie eine Kuh der Volksbesieger; den Feindlichen-Hasser, Zusammenführer, den beides Wirkenden, den Freigebigsten, den beiden Seiten Nutzenden.","notes":"Wortlaut unsicher [?]"}]},{"num":217,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 6","n_from":1362,"n_to":1363,"title_de":"Indra: Lieder wie Wagen","note":"","units":[{"n":1362,"sa":"udu tye madhumattamā gira stomāsa īrate\nsatrājito dhanasā akṣitotayo vājanto rathā iva","de":"Empor steigen diese honigsten Lieder, die Lobgesänge; sie, die stets siegreichen, gabengewinnenden, mit unerschöpflicher Hilfe, wie Wagen kampflustig."},{"n":1363,"sa":"kaṇvā iva bhṛgavaḥ sūryā iva viśvamiddhītamāśata\nindraṃ stomebhirmahayanta āyavaḥ priyamedhāso asvaran","de":"Wie die Kaṇvas, wie die Bhṛgus, wie die Sonnen haben sie [ihn] als alles Entflammten erreicht; Indra mit Lobliedern verherrlichend erklangen die Āyus, die Priyamedhas."}]},{"num":218,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 7","n_from":1364,"n_to":1366,"title_de":"Soma: Strömen zum Gewinn","note":"","units":[{"n":1364,"sa":"paryū ṣu pra dhanva vājasātaye pari vṛtrāṇi sakṣaṇiḥ\ndviṣastaradhyā ṛṇayā na īrase","de":"Strömlauf ganz und gar, zum Gewinn von Kraftspeise, rings die Vṛtras überwältigend; über die Feinde hinweg erhebst du dich, treibe unsere Schuldenlast fort [?].","notes":"Wortlaut in Pāda c unsicher [?]"},{"n":1365,"sa":"ajījano hi pavamāna sūryaṃ vidhāre śakmanā payaḥ\ngojīrayā raṃhamānaḥ purandhyā","de":"Du hast, läuternder Soma, die Sonne erzeugt, bei der Verteilung [?] die Milch mit Kraft; mit Kühe-belebender Fülle eilend.","notes":"Textzustand fraglich"},{"n":1366,"sa":"anu hi tvā sutaṃ soma madāmasi mahe samaryarājye\nvājāṃ abhi pavamāna pra gāhase","de":"Nach dem Pressen, Soma, laben wir uns an dir, im großen Königreich des Kampfes; du strömst zu den Kraftspeisen hin."}]},{"num":219,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 8","n_from":1367,"n_to":1369,"title_de":"Soma für Indra, Mitra, Pūṣan, Bhaga","note":"","units":[{"n":1367,"sa":"pari pra dhanvendrāya soma svādurmitrāya pūṣṇe bhagāya","de":"Strömlauf ringsum, o Soma, süß für Indra, für Mitra, für Pūṣan, für Bhaga."},{"n":1368,"sa":"evāmṛtāya mahe kṣayāya sa śukro arṣa divyaḥ pīyūṣaḥ","de":"So, zur Unsterblichkeit, zur großen Wohnstatt, ströme du, der Helle, der himmlische Milchtrank."},{"n":1369,"sa":"indraste soma sutasya peyātkratve dakṣāya viśve ca devāḥ","de":"Indra soll von dir, Soma, dem Gepressten, trinken, zur Einsicht, zur Tüchtigkeit, und alle Götter."}]},{"num":220,"loc":"Prapāṭhaka VI, Ardha 1, Gruppe 9","n_from":1370,"n_to":1372,"title_de":"Soma: Ströme wie Sonnenstrahlen","note":"","units":[{"n":1370,"sa":"sūryasyeva raśmayo drāvayitnavo matsarāsaḥ prasutaḥ sākamīrate\ntantuṃ tataṃ pari sargāsa āśavo nendrādṛte pavate dhāma kiṃ cana","de":"Wie Sonnenstrahlen, laufend, die berauschenden, herausgepresst, ziehen sie zusammen aus; wie ein ausgespannter Faden eilen die Ergüsse rings umher; ohne Indra klärt sich keine Wohnstatt [?].","notes":"Wortlaut in Pāda d unsicher"},{"n":1371,"sa":"upo matiḥ pṛcyate sicyate madhu mandrājanī codate antarāsani\npavamānaḥ santaniḥ sunvatāmiva madhumāndrapsaḥ pari vāramarṣati","de":"Das Lied [oder: der Gedanke] wird gemischt, Honig wird gegossen; die beiden Erzeugerinnen [?] treiben an im Mund [?]; der Läuternde, ununterbrochen wie der der Pressenden, der honigreiche Tropfen strömt zum Haarsieb.","notes":"Text fraglich [?]"},{"n":1372,"sa":"ukṣā mimeti prati yanti dhenavo devasya devīrupa yanti niṣkṛtam\natyakramīdarjunaṃ vāramavyayamatkaṃ na niktaṃ pari somo avyata","de":"Der Stier brüllt [misst?], die Kühe kommen entgegen, zu dem göttlichen Ort
